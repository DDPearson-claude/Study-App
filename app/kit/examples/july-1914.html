<!-- kind: history -->
<style>
  .scene { max-width: 560px; margin-left: auto; margin-right: auto; }
  .line text { font: 600 11.5px var(--k-font); fill: var(--k-muted); }
  .line .axis { stroke: var(--k-strong); stroke-width: 2; stroke-linecap: round; }
  .line .past { stroke: var(--k-accent2); stroke-width: 4; stroke-linecap: round; }
  .line .event { fill: var(--k-accent2); stroke: var(--k-bg); stroke-width: 2; }
  .line .now-line { stroke: var(--k-accent2); stroke-width: 1.5; stroke-dasharray: 3 3; }
  .line .now { font-size: 12.5px; font-weight: 700; fill: var(--k-ink); }
  /* Columns in rem, so at a large text size the tiles reflow to fewer, wider columns and no name splits. */
  .nations { display: grid; grid-template-columns: repeat(auto-fill, minmax(6rem, 1fr)); gap: 8px; margin-top: 10px; }
  .nation { padding: 8px 10px; border-radius: 12px; background: var(--k-panel); border: 1.5px solid transparent; }
  .nation b { display: block; font-size: .9rem; line-height: 1.25; }
  .nation span { display: block; font-size: .8rem; color: var(--k-muted); }
  .nation.war { background: var(--k-fill2); border-color: var(--k-amber-line); }
  .nation.war span { color: var(--k-ink); font-weight: 600; }
  .chain { list-style: none; padding: 0; }
  .chain li { position: relative; padding: 0 0 12px 22px; }
  .chain li::before { content: ""; position: absolute; left: 5px; top: 7px; width: 9px; height: 9px; border-radius: 50%; background: var(--k-accent2); }
  .chain li:not(:last-child)::after { content: ""; position: absolute; left: 9px; top: 19px; bottom: -4px; border-left: 2px solid var(--k-line); }
  .chain .when { display: block; font-size: .8rem; font-weight: 700; letter-spacing: .04em; color: var(--k-accent); }
  .chain .so { display: block; font-size: .85rem; color: var(--k-muted); }
  .chain li.latest { font-weight: 600; }
</style>

<p class="lead">Slide through the summer of 1914 and watch one killing pull country after country into war.</p>

<div class="scene" id="scene">
  <svg class="line" id="line" viewBox="0 0 340 64" role="img" aria-label=""></svg>
  <div class="nations" id="nations"></div>
</div>
<div class="k-controls" id="controls"></div>
<div class="k-readouts" id="outs"></div>
<p class="say" id="say"></p>
<div>
  <span class="k-label">How each step led to the next</span>
  <ol class="chain" id="chain"></ol>
</div>
<p class="caption">Dates of the July Crisis, 1914. Other countries, such as Japan and the Ottoman Empire, joined the war later that year.</p>

<script>
  // Source [1] of the lesson: the dates of the July Crisis.
  const SOURCE = 'https://en.wikipedia.org/wiki/July_Crisis';

  // Days after 28 June 1914. Each event says what it caused next ("so").
  const EVENTS = [
    { day: 0, text: 'In Sarajevo, Gavrilo Princip, a Bosnian Serb, shoots dead Archduke Franz Ferdinand, heir to the throne of Austria-Hungary.',
      so: 'Austria-Hungary blames Serbia and decides to punish it.' },
    { day: 7, text: 'Germany promises Austria-Hungary its full support against Serbia, even if Russia steps in: the "blank cheque".',
      so: 'Austria-Hungary can take a hard line.' },
    { day: 25, text: 'Austria-Hungary sends Serbia an ultimatum: accept every demand within 48 hours.',
      so: 'Serbia has two days to answer.' },
    { day: 27, text: 'Serbia accepts most of the demands, but not all. Austria-Hungary breaks off relations.',
      so: 'Austria-Hungary prepares to fight.' },
    { day: 30, text: 'Austria-Hungary declares war on Serbia.', so: 'Russia, which backs Serbia, gets ready to defend it.' },
    { day: 32, text: 'Russia orders its whole army to mobilise.', so: 'Germany, Austria-Hungary\'s ally, sees a threat on its border.' },
    { day: 34, text: 'Germany declares war on Russia.', so: 'France, Russia\'s ally, is next in Germany\'s plans.' },
    { day: 36, text: 'Germany declares war on France.', so: 'German armies head for France through Belgium.' },
    { day: 37, text: 'German troops march into Belgium. Britain, pledged since 1839 to protect Belgium, declares war on Germany.', so: '' },
  ];
  // The day each country was first at war with one of the others.
  const NATIONS = [['Serbia', 30], ['Austria-Hungary', 30], ['Germany', 34], ['Russia', 34], ['France', 36], ['Belgium', 37], ['Britain', 37]];
  const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August'];
  const dateOf = (d) => { const t = new Date(1914, 5, 28 + d); return t.getDate() + ' ' + MONTHS[t.getMonth()]; };
  const short = (d) => { const t = dateOf(d).split(' '); return t[0] + '\u00a0' + t[1].slice(0, 3); };   // "28 Jul", kept on one line

  const day = K.control({ id: 'day', label: 'Date in 1914', min: 0, max: 37, step: 1, value: 25, fmt: dateOf, into: '#controls' });
  K.stage('#scene', '#controls');
  K.readout({ id: 'days', label: 'Days since the shots in Sarajevo', into: '#outs' });
  K.readout({ id: 'atWar', label: 'Of these seven, at war', into: '#outs' });

  // The pure model: date -> how far the crisis has gone.
  K.model((p) => {
    const happened = EVENTS.filter((e) => e.day <= p.day);
    return { days: p.day, atWar: NATIONS.filter((n) => n[1] <= p.day).length, latest: happened[happened.length - 1].text };
  });

  // The timeline: an axis with the date marks, a line for the days gone by, and a dot for each
  // event so far (later events stay off the page until their day comes).
  const svg = document.getElementById('line');
  const X0 = 20, X1 = 320, x = (d) => X0 + (X1 - X0) * d / 37;
  const nations = NATIONS.map(([name]) => {
    const status = K.el('span');
    const tile = K.el('div', { class: 'nation' }, K.el('b', null, name), status);
    document.getElementById('nations').appendChild(tile);
    return { tile, status };
  });

  K.update((p, o) => {
    svg.textContent = '';
    svg.appendChild(K.svg('line', { class: 'axis', x1: X0, x2: X1, y1: 34, y2: 34 }));
    svg.appendChild(K.svg('line', { class: 'past', x1: X0, x2: x(p.day), y1: 34, y2: 34 }));
    [0, 17, 34].forEach((d) => svg.appendChild(K.svg('text', { x: x(d), y: 58, 'text-anchor': d === 0 ? 'start' : d === 34 ? 'end' : 'middle' }, short(d))));
    EVENTS.filter((e) => e.day <= p.day).forEach((e) => svg.appendChild(K.svg('circle', { class: 'event', cx: x(e.day), cy: 34, r: 5 })));
    svg.appendChild(K.svg('line', { class: 'now-line', x1: x(p.day), x2: x(p.day), y1: 18, y2: 42 }));
    const label = K.svg('g');
    svg.appendChild(label);
    K.labels(label, [{ x: x(p.day), y: 13, text: dateOf(p.day), class: 'now' }]);
    svg.setAttribute('aria-label', 'Timeline from 28 June to 4 August 1914, now at ' + dateOf(p.day));

    NATIONS.forEach(([name, from], i) => {
      const war = from <= p.day;
      nations[i].tile.classList.toggle('war', war);
      nations[i].status.textContent = war ? 'At war from ' + short(from) : 'At peace';
    });

    const chain = document.getElementById('chain');
    chain.textContent = '';
    const done = EVENTS.filter((e) => e.day <= p.day);
    done.forEach((e, i) => chain.appendChild(K.el('li', { class: i === done.length - 1 ? 'latest' : '' },
      K.el('span', { class: 'when' }, dateOf(e.day)), e.text, i < done.length - 1 && e.so ? K.el('span', { class: 'so' }, 'So: ' + e.so) : null)));

    const n = o.atWar;
    document.getElementById('say').textContent = !K.moved
      ? 'Nobody is at war yet. How long do you think it took to reach Britain? Slide on through the summer to see.'
      : p.day === 0
      ? '28 June: the shots in Sarajevo. For now it is a crime in one city, and nobody is at war.'
      : n === 0
      ? dateOf(p.day) + ', ' + p.day + ' days after the shots: nobody is at war yet, but each step so far has made the next one harder to stop.'
      : n === NATIONS.length
        ? 'By ' + dateOf(p.day) + ', ' + p.day + ' days after one killing, all seven countries are at war. Promises between allies turned a quarrel between two countries into a European war.'
        : dateOf(p.day) + ': ' + n + ' of the seven are at war. Each one\'s ally is now under pressure to join in.';
  });

  // Known answers from the dates of the crisis.
  K.check('Day 37 after 28 June 1914 is 4 August (June has 30 days)', () => dateOf(37) === '4 August' && dateOf(3) === '1 July');
  K.check('Austria-Hungary declared war on Serbia on 28 July, one month after the shots', () =>
    dateOf(30) === '28 July' && K.at({ day: 29 }).atWar === 0 && K.at({ day: 30 }).atWar === 2, { source: SOURCE });
  K.check('Britain was at war on 4 August, 37 days after Sarajevo, the last of the seven', () =>
    K.at({ day: 36 }).atWar === 5 && K.at({ day: 37 }).atWar === 7 && NATIONS.find((n) => n[0] === 'Britain')[1] === 37, { source: SOURCE });
  K.check('Events run in date order, and no country is at war before the event that brought it in', () =>
    EVENTS.every((e, i) => i === 0 || e.day > EVENTS[i - 1].day) && NATIONS.every(([, from]) => EVENTS.some((e) => e.day === from)));
  K.check('The number at war never goes down as the days pass', () => {
    for (let d = 1; d <= 37; d++) if (K.at({ day: d }).atWar < K.at({ day: d - 1 }).atWar) return false;
    return true;
  });

  K.ready();
</script>
