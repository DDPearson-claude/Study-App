<meta name="description" content="Type anything you want to learn. Claude researches it, builds an interactive for every idea, and remembers what you know.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<script>
(function () {
  // Apply saved reading settings before first paint (per-device convenience only;
  // the durable copy lives in the db profile).
  // Light is the default whatever the phone's setting (Design Brief v2); "system" follows it.
  var d = document.documentElement, s = {};
  try { s = JSON.parse(localStorage.getItem('mu-prefs') || '{}') || {}; } catch (e) {}
  d.setAttribute('data-mu-theme', s.theme === 'dark' || s.theme === 'system' ? s.theme : 'light');
  if (s.size) d.setAttribute('data-size', s.size);
  if (s.easy) d.setAttribute('data-easy', '1');
})();
</script>
