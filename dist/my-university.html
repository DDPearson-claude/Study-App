<style>
/* src/css/00-tokens.css */
/* Layout concept: one calm reading column (max 720px) with a sticky top bar; on phones the
   section tabs dock to the bottom edge. Colour marks meaning, never decoration. */
:root {
  /* Dan's palette (Design Brief v2) */
  --bg: #F7F5F0;          /* warm off-white page */
  --surface: #FFFFFF;     /* cards, sheets */
  --sunk: #EFEBE3;        /* wells, tracks, inactive fills */
  --ink: #1F2937;         /* main text, charcoal */
  --muted: #5B6573;       /* secondary text (4.9:1 on --bg) */
  --heading: #17324D;     /* deep navy: headings, progress, controls */
  --teal: #0F6B66;        /* small labels, diagram details */
  --teal-tint: #E2EFED;
  --amber: #FFF1CC;       /* "remember this" boxes */
  --hl: #FBE29A;          /* highlighter stroke for key terms */
  --red: #9F3038;         /* warnings, mistakes, "experts disagree" */
  --red-tint: #F8ECEC;
  --green: #2E7D4F;       /* completion only */
  --green-tint: #E5F1E9;
  --line: #DED8CC;
  --line-strong: #B9B1A3;
  --on-heading: #F7F5F0;  /* text on navy fills */
  --shadow: 0 1px 2px rgba(23, 50, 77, .05), 0 8px 24px rgba(23, 50, 77, .06);
  --scrim: rgba(15, 23, 32, .42);

  --serif: "Literata", Georgia, "Times New Roman", serif;
  --sans: "Plus Jakarta Sans", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --easy: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

  --fs: 18px;             /* reading size; settings change it */
  --col: 720px;           /* reading column */
  --r-sm: 12px; --r: 18px; --r-lg: 24px;
  --gap: 16px;
  --topbar-h: 60px;
  --tabbar-h: 64px;
  color-scheme: light;
}
:root[data-size="s"] { --fs: 16px; }
:root[data-size="l"] { --fs: 20px; }
:root[data-size="xl"] { --fs: 22px; }

/* Dark palette: applied by explicit choice, or by "system" when the viewer/OS is dark. */
:root[data-mu-theme="dark"],
:root[data-mu-theme="system"][data-theme="dark"] {
  --bg: #12161C; --surface: #1A2029; --sunk: #232A35; --ink: #E7E4DD; --muted: #A9B1BC;
  --heading: #BBD0E6; --teal: #6CC7BD; --teal-tint: #17302D; --amber: #3A3016; --hl: rgba(232, 199, 102, .34);
  --red: #F2A6AC; --red-tint: #2E1A1D; --green: #6FCB94; --green-tint: #16291F;
  --line: #2C3440; --line-strong: #4A5564; --on-heading: #12161C;
  --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 8px 24px rgba(0, 0, 0, .28); --scrim: rgba(0, 0, 0, .6);
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root[data-mu-theme="system"]:not([data-theme="light"]) {
    --bg: #12161C; --surface: #1A2029; --sunk: #232A35; --ink: #E7E4DD; --muted: #A9B1BC;
    --heading: #BBD0E6; --teal: #6CC7BD; --teal-tint: #17302D; --amber: #3A3016; --hl: rgba(232, 199, 102, .34);
    --red: #F2A6AC; --red-tint: #2E1A1D; --green: #6FCB94; --green-tint: #16291F;
    --line: #2C3440; --line-strong: #4A5564; --on-heading: #12161C;
    --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 8px 24px rgba(0, 0, 0, .28); --scrim: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-easy="1"] { --sans: var(--easy); --serif: var(--easy); }

/* src/css/10-base.css */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 16px/1.55 var(--sans);
  -webkit-font-smoothing: antialiased;
}
:root[data-easy="1"] body { letter-spacing: .02em; word-spacing: .1em; }
h1, h2, h3 { font-family: var(--sans); color: var(--heading); line-height: 1.22; letter-spacing: -.015em; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.7rem, 5.4vw, 2.2rem); font-weight: 800; }
h2 { font-size: 1.3rem; font-weight: 700; }
h3 { font-size: 1.05rem; font-weight: 700; }
p { margin: 0; }
a { color: var(--heading); }
button, input, textarea, select { font: inherit; color: inherit; }
img, svg { max-width: 100%; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; border-radius: 6px; }

/* ---------- app frame ---------- */
.app { min-height: 100%; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 12px;
  height: var(--topbar-h); padding-inline: max(16px, calc((100% - var(--col)) / 2));
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  -webkit-backdrop-filter: saturate(1.4) blur(14px); backdrop-filter: saturate(1.4) blur(14px);
  border-bottom: 1px solid var(--line);
}
.brand { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: var(--heading); min-height: 44px; }
.brand-mark { width: 28px; height: 28px; color: var(--teal); flex: none; }
.brand-name { font: 800 17px/1 var(--sans); letter-spacing: -.02em; }
.icon-btn {
  display: inline-grid; place-items: center; min-width: 44px; min-height: 44px; padding: 0 10px;
  border: 1.5px solid var(--line-strong); border-radius: 999px; background: transparent; color: var(--heading); cursor: pointer;
}
.settings-btn { margin-left: auto; }
.aa { font: 600 17px/1 var(--serif); }

.view { display: block; max-width: var(--col); margin: 0 auto; padding: 20px 16px calc(var(--tabbar-h) + 40px + env(safe-area-inset-bottom, 0px)); outline: none; }
.focus .view { padding-bottom: 48px; }

/* tabs: bottom bar on phones, inline on wide screens */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
  display: flex; justify-content: space-around;
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
  background: var(--surface); border-top: 1px solid var(--line);
}
.tab {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px;
  min-width: 64px; min-height: 48px; padding: 6px 10px; border-radius: 14px;
  color: var(--muted); text-decoration: none; font: 700 12px/1.2 var(--sans);
}
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--heading); }
.tab[aria-current="page"]::before { content: ""; position: absolute; top: -7px; left: 28%; right: 28%; height: 3px; border-radius: 0 0 3px 3px; background: var(--heading); }
.tab-badge {
  position: absolute; top: 2px; right: 10px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
  background: var(--heading); color: var(--on-heading); font: 800 11px/18px var(--sans); text-align: center;
}
.focus .tabs { display: none; }
@media (min-width: 760px) {
  .tabs { position: static; flex: 1; justify-content: center; gap: 4px; padding: 0; background: none; border: 0; }
  .tab { flex-direction: row; gap: 8px; min-height: 40px; font-size: 14px; }
  .tab svg { width: 20px; height: 20px; }
  .tab[aria-current="page"] { background: var(--sunk); }
  .tab[aria-current="page"]::before { display: none; }
  .tab-badge { position: static; }
  .settings-btn { margin-left: 0; }
  .view { padding-bottom: 64px; }
  .focus .tabs { display: flex; visibility: hidden; }
}

/* ---------- type helpers ---------- */
.eyebrow { font: 700 12px/1.4 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--teal); }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.reading { font-family: var(--serif); font-size: var(--fs); line-height: 1.8; color: var(--ink); }
.reading p { max-width: 36em; }
.reading p + p { margin-top: 1.1em; }
mark.term {
  color: inherit; font-weight: 600; padding: 0 .12em; margin: 0 -.04em; border-radius: 3px;
  background: linear-gradient(180deg, transparent 50%, var(--hl) 50%, var(--hl) 92%, transparent 92%);
  -webkit-box-decoration-break: clone; box-decoration-break: clone;
}
.fn {
  display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 5px; margin: 0 1px;
  border: 0; border-radius: 6px; background: var(--teal-tint); color: var(--teal);
  font: 700 12px/1 var(--sans); vertical-align: super; cursor: pointer;
}
.reading code, code { font-family: var(--mono); font-size: .88em; background: var(--sunk); padding: .1em .35em; border-radius: 6px; }
.visually-hidden { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- layout helpers ---------- */
.stack { display: flex; flex-direction: column; gap: var(--gap); }
.stack-sm { display: flex; flex-direction: column; gap: 8px; }
.stack-lg { display: flex; flex-direction: column; gap: 32px; }
.row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.row > .grow { flex: 1; min-width: 0; }
.spacer { flex: 1; }

/* ---------- surfaces ---------- */
.card { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 20px; }
.card-quiet { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.callout { border-radius: var(--r); padding: 16px 18px; }
.callout.remember { background: var(--amber); }
.callout.warn { background: var(--red-tint); }
.callout.warn .eyebrow { color: var(--red); }
.callout.note { border: 1.5px dashed var(--line-strong); }

/* ---------- buttons (chunky, pressable) ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 52px; padding: 12px 22px; border-radius: 16px; border: 0; cursor: pointer;
  font: 700 16px/1.2 var(--sans); text-decoration: none; text-align: center;
  background: var(--heading); color: var(--on-heading);
  box-shadow: 0 3px 0 color-mix(in srgb, var(--heading) 70%, #000);
  transition: transform .06s ease, box-shadow .06s ease;
}
.btn:active:not([disabled]) { transform: translateY(2px); box-shadow: 0 1px 0 color-mix(in srgb, var(--heading) 70%, #000); }
.btn[disabled] { opacity: .5; cursor: default; }
.btn.secondary { background: var(--surface); color: var(--heading); border: 1.5px solid var(--line-strong); box-shadow: 0 3px 0 var(--line); }
.btn.ghost { background: transparent; color: var(--heading); box-shadow: none; min-height: 44px; padding: 8px 12px; }
.btn.good { background: var(--green); color: #fff; box-shadow: 0 3px 0 color-mix(in srgb, var(--green) 65%, #000); }
.btn.danger { background: var(--red); color: #fff; box-shadow: 0 3px 0 color-mix(in srgb, var(--red) 65%, #000); }
.btn.wide { width: 100%; }
.btn.small { min-height: 44px; padding: 8px 16px; font-size: 15px; border-radius: 14px; }
.linkish { background: none; border: 0; padding: 8px 0; min-height: 44px; color: var(--heading); font: 700 15px/1.3 var(--sans); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }

/* ---------- inputs ---------- */
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font: 700 14px/1.3 var(--sans); color: var(--heading); }
.input, .textarea {
  width: 100%; min-height: 52px; padding: 13px 16px; border-radius: 16px;
  border: 1.5px solid var(--line-strong); background: var(--surface); color: var(--ink);
  font: 400 17px/1.45 var(--sans);
}
.textarea { resize: vertical; min-height: 110px; }
.input:focus, .textarea:focus { outline: none; border-color: var(--heading); box-shadow: 0 0 0 3px color-mix(in srgb, var(--heading) 18%, transparent); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  min-height: 40px; padding: 8px 14px; border-radius: 999px; cursor: pointer;
  border: 1.5px solid var(--line-strong); background: var(--surface); color: var(--heading); font: 600 14px/1.3 var(--sans);
}
.chip[aria-pressed="true"] { background: var(--heading); color: var(--on-heading); border-color: var(--heading); }

/* ---------- options (answers) ---------- */
.options { display: grid; gap: 10px; }
.option {
  display: block; width: 100%; text-align: left; cursor: pointer;
  min-height: 56px; padding: 14px 18px; border-radius: 16px;
  border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
  font: 600 16px/1.4 var(--sans); box-shadow: 0 2px 0 var(--line);
}
.option:active:not([disabled]) { transform: translateY(1px); box-shadow: none; }
.option[aria-pressed="true"] { border-color: var(--heading); box-shadow: inset 0 0 0 1px var(--heading); }
.option.correct { border-color: var(--green); background: var(--green-tint); }
.option.wrong { border-color: var(--red); background: var(--red-tint); }
.option[disabled] { cursor: default; }

/* ---------- progress ---------- */
.bar { height: 8px; border-radius: 999px; background: var(--sunk); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: inherit; background: var(--heading); transition: width .4s ease; }
.working { height: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--sunk) 0%, var(--heading) 50%, var(--sunk) 100%); background-size: 200% 100%; animation: mu-work 1.3s linear infinite; }
@keyframes mu-work { from { background-position: 200% 0; } to { background-position: 0 0; } }
.skeleton { border-radius: 10px; background: linear-gradient(90deg, var(--sunk), color-mix(in srgb, var(--sunk) 50%, var(--surface)), var(--sunk)); background-size: 200% 100%; animation: mu-work 1.6s linear infinite; }

/* ---------- toasts ---------- */
.toasts { position: fixed; left: 0; right: 0; bottom: calc(var(--tabbar-h) + 16px + env(safe-area-inset-bottom, 0px)); z-index: 60; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; padding: 0 16px; }
.toast { max-width: 520px; padding: 12px 18px; border-radius: 14px; background: var(--heading); color: var(--on-heading); font: 600 15px/1.4 var(--sans); box-shadow: var(--shadow); pointer-events: auto; animation: mu-rise .25s ease-out; }
.toast.good { background: var(--green); color: #fff; }
.toast.bad { background: var(--red); color: #fff; }
@keyframes mu-rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- sheets ---------- */
.scrim { position: fixed; inset: 0; z-index: 70; background: var(--scrim); animation: mu-fade .2s ease-out; }
@keyframes mu-fade { from { opacity: 0; } to { opacity: 1; } }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 71; max-height: min(88vh, 860px); overflow: auto;
  background: var(--surface); border-radius: 24px 24px 0 0; box-shadow: 0 -12px 34px rgba(0, 0, 0, .16);
  padding: 8px 20px calc(20px + env(safe-area-inset-bottom, 0px)); animation: mu-up .28s cubic-bezier(.2, .9, .3, 1);
}
@keyframes mu-up { from { transform: translateY(40%); opacity: .4; } to { transform: none; opacity: 1; } }
.sheet-in { max-width: var(--col); margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.sheet-grip { width: 40px; height: 5px; border-radius: 3px; background: var(--line-strong); margin: 4px auto 6px; }
.sheet-head { display: flex; align-items: center; gap: 12px; }
.sheet-head h2 { flex: 1; font-size: 1.15rem; }
.sheet-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; }
@media (min-width: 760px) {
  .sheet { left: 50%; right: auto; bottom: auto; top: 50%; width: min(620px, calc(100vw - 32px)); transform: translate(-50%, -50%); border-radius: 24px; animation: mu-fade .2s ease-out; }
}

/* ---------- celebration (shared) ---------- */
.cheer { position: fixed; left: 50%; top: 38%; z-index: 80; display: grid; justify-items: center; gap: 10px; transform: translate(-50%, -50%); pointer-events: none; }
.cheer-bubble { width: 76px; height: 76px; border-radius: 50%; background: var(--green); color: #fff; display: grid; place-items: center; box-shadow: 0 10px 30px rgba(46, 125, 79, .35); animation: mu-pop 1.6s cubic-bezier(.2, .9, .3, 1.2) forwards; }
.cheer-bubble svg { width: 40px; height: 40px; }
.cheer-text { padding: 8px 16px; border-radius: 999px; background: var(--green); color: #fff; font: 700 15px/1.3 var(--sans); animation: mu-pop 1.6s cubic-bezier(.2, .9, .3, 1.2) forwards; }
@keyframes mu-pop { 0% { opacity: 0; transform: scale(.6); } 18% { opacity: 1; transform: scale(1.06); } 28% { transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-8px); } }

/* ---------- empty / error states ---------- */
.empty { text-align: center; padding: 40px 12px; color: var(--muted); }
.empty h2 { margin-bottom: 6px; }
.notice { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); font-size: 15px; }
.notice.bad { border-color: color-mix(in srgb, var(--red) 40%, var(--line)); background: var(--red-tint); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition: none !important; }
}

</style>

  function snap(p) { var d = docs[p]; return { id: p.split('/').pop(), exists: !!d, data: function () { return d ? U.clone(d) : undefined; } }; }
  function fire(p) {
    (listeners[p] || []).forEach(function (fn) { setTimeout(function () { fn(snap(p)); }); });
    qListeners.forEach(function (l) { if (l.c === parent(p)) setTimeout(function () { l.fn(query(l.c, l.o)); }); });
  }
  function query(c, o) {
    var list = Object.keys(docs).filter(function (p) { return parent(p) === c; }).map(snap);
    if (o && o.field) list.sort(function (a, b) { var x = a.data()[o.field], y = b.data()[o.field]; return (x < y ? -1 : x > y ? 1 : 0) * (o.dir === 'desc' ? -1 : 1); });

  }
  function merge(t, s) { Object.keys(s).forEach(function (k) { var v = s[k]; if (v && typeof v === 'object' && !Array.isArray(v) && t[k] && typeof t[k] === 'object' && !Array.isArray(t[k])) merge(t[k], v); else t[k] = U.clone(v); }); return t; }
  function doc(p) {

      set: function (d) { docs[p] = U.clone(d); fire(p); return Promise.resolve(); },
      update: function (d) { if (!docs[p]) return Promise.reject({ code: 'invalid_argument', message: 'missing' }); merge(docs[p], d); fire(p); return Promise.resolve(); },

      onSnapshot: function (fn) { var l = { c: c, o: o, fn: fn }; qListeners.push(l); setTimeout(function () { fn(query(c, o)); }); return function () { qListeners = qListeners.filter(function (x) { return x !== l; }); }; },

})();

U.store = (function () {
  function db() { return U.rt.db || U.memdb; }
  function priv(rest) { return U.rt.uid ? 'data/users/' + U.rt.uid + '/' + rest : 'local/me/' + rest; }
  function pdb() { return U.rt.db && U.rt.uid ? U.rt.db : U.memdb; }
  function isPriv(path) { return path.indexOf('data/users/') === 0 || path.indexOf('local/') === 0; }
  function D(path) { return (isPriv(path) ? pdb() : db()).doc(path); }
  function C(path) { return (isPriv(path) ? pdb() : db()).collection(path); }

  function deepMerge(t, s) {
    Object.keys(s).forEach(function (k) {
      var v = s[k];
      if (v && typeof v === 'object' && !Array.isArray(v) && t[k] && typeof t[k] === 'object' && !Array.isArray(t[k])) deepMerge(t[k], v);
      else t[k] = U.clone(v);
    });
    return t;
  }

  // ---- serialised, coalesced writes ----
  var chains = {}, pending = {};
  function run(path, fn) {
    var p = (chains[path] || Promise.resolve()).then(fn, fn);
    chains[path] = p.catch(function () {});
    return p;
  }
  function reportWrite(e) {
    console.error('db write failed', e);
    U.toast(e && e.code === 'quota_exceeded' ? U.errText(e) : 'Could not save just now: ' + U.errText(e), { kind: 'bad' });
    throw e;
  }
  function setDoc(path, data) { return run(path, function () { return D(path).set(data); }).catch(reportWrite); }
  function patchDoc(path, patch) {
    var p = pending[path];
    if (p) { deepMerge(p.patch, patch); return p.promise; }
    p = pending[path] = { patch: U.clone(patch) };
    p.promise = U.sleep(120).then(function () {
      delete pending[path];
      var body = p.patch;
      return run(path, function () {
        var ref = D(path);
        return ref.get().then(function (s) {
          if (s.exists) return ref.update(body);
          return ref.set(body);
        });
      });
    }).catch(reportWrite);
    return p.promise;
  }
  function getDoc(path) { return D(path).get().then(function (s) { return s.exists ? U.clone(s.data()) : null; }); }
  function watchDoc(path, fn) {
    var stop = D(path).onSnapshot(function (s) { fn(s.exists ? s.data() : null); }, function (e) { console.error('watch failed', path, e); });
    return stop;
  }
  function listColl(path) { return C(path).get().then(function (q) { return q.docs.map(function (d) { var x = U.clone(d.data()) || {}; x.__id = d.id; return x; }); }); }

  var S = {
    paths: {
      topic: function (tid) { return 'topics/' + tid; },
      lesson: function (tid, iid) { return 'topics/' + tid + '/lessons/' + iid; },
      research: function (tid, key) { return 'topics/' + tid + '/research/' + key; },
      profile: function () { return priv('profile'); },
      progress: function (tid) { return priv('profile/progress/' + tid); },
      cards: function (tid) { return priv('profile/cards/' + tid); },
    },
    persistent: function () { return !!(U.rt.db && U.rt.uid); },
    setDoc: setDoc, patchDoc: patchDoc, getDoc: getDoc, watchDoc: watchDoc,
  };

  S.topics = {
    watch: function (fn) {
      return C('topics').orderBy('updatedAt', 'desc').onSnapshot(function (q) {
        fn(q.docs.map(function (d) { return d.data(); }).filter(Boolean));
      }, function (e) { console.error(e); fn([]); });
    },
    list: function () { return listColl('topics').then(function (l) { return l.sort(function (a, b) { return (b.updatedAt || '').localeCompare(a.updatedAt || ''); }); }); },
  };
  S.topic = {
    get: function (tid) { return getDoc(S.paths.topic(tid)); },
    watch: function (tid, fn) { return watchDoc(S.paths.topic(tid), fn); },
    create: function (data) { return setDoc(S.paths.topic(data.id), data).then(function () { return data; }); },
    update: function (tid, patch) { patch.updatedAt = U.now(); return patchDoc(S.paths.topic(tid), patch); },
    remove: function (tid) {
      var jobs = [listColl('topics/' + tid + '/lessons'), listColl('topics/' + tid + '/research')];
      return Promise.all(jobs).then(function (r) {
        var dels = [];
        r[0].forEach(function (d) { dels.push(D(S.paths.lesson(tid, d.__id)).delete()); });
        r[1].forEach(function (d) { dels.push(D(S.paths.research(tid, d.__id)).delete()); });
        dels.push(D(S.paths.progress(tid)).delete(), D(S.paths.cards(tid)).delete());
        return Promise.all(dels);
      }).then(function () { return D(S.paths.topic(tid)).delete(); });
    },
  };
  S.lesson = {
    get: function (tid, iid) { return getDoc(S.paths.lesson(tid, iid)); },
    watch: function (tid, iid, fn) { return watchDoc(S.paths.lesson(tid, iid), fn); },
    set: function (tid, iid, data) { data.updatedAt = U.now(); return setDoc(S.paths.lesson(tid, iid), data); },
    update: function (tid, iid, patch) { patch.updatedAt = U.now(); return patchDoc(S.paths.lesson(tid, iid), patch); },
    list: function (tid) { return listColl('topics/' + tid + '/lessons'); },
  };
  S.research = {
    get: function (tid, key) { return getDoc(S.paths.research(tid, key)); },
    set: function (tid, key, data) { return setDoc(S.paths.research(tid, key), data); },
  };
  S.progress = {
    get: function (tid) { return getDoc(S.paths.progress(tid)).then(function (d) { return d || { ideas: {} }; }); },
    watch: function (tid, fn) { return watchDoc(S.paths.progress(tid), function (d) { fn(d || { ideas: {} }); }); },
    patch: function (tid, patch) { patch.updatedAt = U.now(); return patchDoc(S.paths.progress(tid), patch); },
    all: function () { return listColl(priv('profile/progress')).then(function (l) { var o = {}; l.forEach(function (d) { o[d.__id] = d; }); return o; }); },
  };
  S.cards = {
    get: function (tid) { return getDoc(S.paths.cards(tid)).then(function (d) { return d || { cards: {} }; }); },
    patch: function (tid, patch) { return patchDoc(S.paths.cards(tid), patch); },
    all: function () { return listColl(priv('profile/cards')).then(function (l) { var o = {}; l.forEach(function (d) { o[d.__id] = d; }); return o; }); },
  };
  S.profile = {
    defaults: function () { return { prefs: { size: 'm', easy: false, theme: 'light', cap: 15, light: false }, days: {}, createdAt: U.now() }; },
    get: function () { return getDoc(S.paths.profile()).then(function (d) { return d ? deepMerge(S.profile.defaults(), d) : S.profile.defaults(); }); },
    watch: function (fn) { return watchDoc(S.paths.profile(), function (d) { fn(d ? deepMerge(S.profile.defaults(), d) : S.profile.defaults()); }); },
    patch: function (patch) { return patchDoc(S.paths.profile(), patch); },
  };
  return S;
})();

// Record study time for "this week" (minutes per day, coalesced).
U.logStudy = function (minutes) {
  var day = U.today(), patch = { days: {} };
  return U.store.profile.get().then(function (p) {
    patch.days[day] = Math.round(((p.days && p.days[day]) || 0) + minutes);
    return U.store.profile.patch(patch);
  });
};
