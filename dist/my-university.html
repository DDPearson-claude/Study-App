//   U.fsrs.preview(s, day, cardId?)        {1..4: next state} for "back in N days" hints
//   U.fsrs.retrievability(s, day)          0..1 chance of recall today (0 for an unreviewed card)
//   U.fsrs.band(s, day)                    'new' | 'fragile' | 'growing' | 'strong' (never shown as %)
//
// Formulas and default weights are the published FSRS-4.5 ones. Because Dan reviews at most
// once a day, there are no same-day learning steps: a forgotten card simply comes back tomorrow.
// Intervals are fuzzed by a small deterministic amount keyed on the card id, so cards learned
// together drift apart instead of always landing on the same day.
(function () {
  var W = [0.4872, 1.4003, 3.7145, 13.8206, 5.1618, 1.2298, 0.8975, 0.031, 1.6474, 0.1367,
    1.0461, 2.1072, 0.0793, 0.3246, 1.587, 0.2272, 2.8755];
  var DECAY = -0.5;
  var FACTOR = 19 / 81;          // makes R = 0.9 exactly when t = S
  var RETENTION = 0.9;
  var MAX_INTERVAL = 365;
  // Fuzz grows with the interval: +-15% between 2.5 and 7 days, 10% to 20 days, 5% beyond.
  var FUZZ = [{ start: 2.5, end: 7, factor: 0.15 }, { start: 7, end: 20, factor: 0.1 }, { start: 20, end: Infinity, factor: 0.05 }];

  function clamp(x, lo, hi) { return Math.min(hi, Math.max(lo, x)); }
  function round2(x) { return Math.round(x * 100) / 100; }
  function grade(g) { g = Math.round(Number(g)); return isFinite(g) ? clamp(g, 1, 4) : 3; }

  function initStability(g) { return Math.max(W[g - 1], 0.1); }
  function initDifficulty(g) { return clamp(W[4] - (g - 3) * W[5], 1, 10); }
  function nextDifficulty(d, g) {
    var shifted = d - W[6] * (g - 3);
    return clamp(W[7] * initDifficulty(3) + (1 - W[7]) * shifted, 1, 10);   // mean reversion
  }
  function forgetting(t, s) { return Math.pow(1 + FACTOR * t / s, DECAY); }
  function stabilityAfterRecall(d, s, r, g) {
    var hard = g === 2 ? W[15] : 1, easy = g === 4 ? W[16] : 1;
    return s * (1 + Math.exp(W[8]) * (11 - d) * Math.pow(s, -W[9]) * (Math.exp((1 - r) * W[10]) - 1) * hard * easy);
  }
  function stabilityAfterLapse(d, s, r) {
    var next = W[11] * Math.pow(d, -W[12]) * (Math.pow(s + 1, W[13]) - 1) * Math.exp((1 - r) * W[14]);
    return Math.min(next, s);    // forgetting never leaves a memory stronger than before
  }
  function rawInterval(s) {
    return clamp(Math.round(s / FACTOR * (Math.pow(RETENTION, 1 / DECAY) - 1)), 1, MAX_INTERVAL);
  }
  // Deterministic 0..1 from the card id and how many times it has been reviewed.
  function unit(cardId, reps) { return U.hash(String(cardId || 'card') + ':' + reps) / 4294967296; }
  function fuzz(ivl, u) {
    if (ivl < 2.5) return ivl;
    var delta = 1;
    FUZZ.forEach(function (r) { delta += r.factor * Math.max(Math.min(ivl, r.end) - r.start, 0); });
    var lo = Math.max(2, Math.round(ivl - delta)), hi = Math.min(MAX_INTERVAL, Math.round(ivl + delta));
    lo = Math.min(lo, hi);
    return lo + Math.floor(u * (hi - lo + 1));
  }
  function reviewed(s) { return !!(s && s.reps > 0 && s.stability > 0 && s.last); }

  function init(day) {
    day = day || U.today();
    return { due: U.addDays(day, 1), stability: 0, difficulty: 0, reps: 0, lapses: 0, last: null };
  }

  // Next state for every grade at once, so intervals can be kept in order (Hard <= Good < Easy).
  function preview(s, day, cardId) {
    day = day || U.today();
    s = s || init(day);
    var first = !reviewed(s);
    var r = first ? 1 : forgetting(Math.max(0, U.daysBetween(s.last, day)), s.stability);
    var out = {}, ivl = {}, u = unit(cardId, s.reps || 0);
    [1, 2, 3, 4].forEach(function (g) {
      var st, df;
      if (first) { st = initStability(g); df = initDifficulty(g); }
      else {
        st = g === 1 ? stabilityAfterLapse(s.difficulty, s.stability, r) : stabilityAfterRecall(s.difficulty, s.stability, r, g);
        df = nextDifficulty(s.difficulty, g);
      }
      st = clamp(st, 0.1, 36500);
      out[g] = {
        stability: round2(st), difficulty: round2(df),

// Lesson screen, route #/t/:tid/:iid (focus mode). Teaches one idea in five stages:
//   Predict -> Play (the sandboxed interactive) -> Explain -> Say it back (graded) -> Check.
//
// Reads topics/{tid} and topics/{tid}/lessons/{iid}. When the lesson is not ready it asks
// U.gen.ensureLesson to write it and shows calm, specific progress lines; the predict question
// appears as soon as it is written, so Dan can guess while the interactive is still being built.
// Progress is saved to his private progress doc as he goes (stage, prediction, every say-it-back
// attempt, check results, doneAt), so reopening resumes where he left off with earlier stages
// collapsed but reviewable. Contract: docs/ARCHITECTURE.md sections 4, 5 and 9; the progress
// shapes (rounds, keyed say entries, replays) are described at the top of 20-store.js.
//
// Two devices: the screen watches the progress doc and folds in what the other device saved.
// Stages only move forward, and a guess or check result saved first (anywhere) is never
// overwritten. "Go through it again" records its run separately (ideas[iid].replays).
//
// Learn it again: '#/t/:tid/:iid/again' (Today's link), or progress.ideas[iid].relearn set, or
// "Rebuild this lesson" in the "This looks wrong" sheet. U.gen.relearn writes a fresh lesson with a
// different interactive; the idea starts a new round (stage back to predict, check results and
// guess for the new lesson cleared, the old ones kept under ideas[iid].past).
//
// Public: U.lesson.sourceSheet(source) opens a source (title, exact quote, link) in a sheet.

  var VERDICT = { 'got-it': 'You\'ve got it', partly: 'Partly there', 'not-yet': 'Not there yet' };

  // for the interactive ("for example …"), never findings; dates are plain facts.
  var NUMBER_KIND = { control: 'you set this', computed: 'worked out from the rule', constant: 'a fixed value', assumed: 'an example value', date: null };
  var WORDS = ['No', 'One', 'Two', 'Three', 'Four', 'Five'];

  // Prefetches of the next idea. Each keeps running while Dan stays in its topic (the topic page

// ---- src/js/72-map.js ----
// Map (#/map): every topic as a small constellation of idea dots, coloured by how well each idea
// is holding (new = outline, fragile = amber, growing = teal, strong = navy). Bands come from
// U.review.ideaBands() when the review module is present, else from progress (done = growing).
// The SVG is laid out in real pixels for the card's width so labels stay readable on a phone;
// tapping a dot opens that idea. Contract: docs/ARCHITECTURE.md sections 8 and 9.
(function () {
  'use strict';
  var V = U.views;

  var BANDS = [
    ['new', 'New', 'not learned yet'],
    ['fragile', 'Fragile', 'a review will help'],
    ['growing', 'Growing', 'settling in'],
    ['strong', 'Strong', 'yours for now'],
  ];
  var WORDS = { new: 'new', fragile: 'fragile', growing: 'growing', strong: 'strong' };

  var measureCtx = null;
  function textWidth(text, font) {
    if (!measureCtx) measureCtx = document.createElement('canvas').getContext('2d');
    if (!measureCtx) return text.length * 7.4;
    measureCtx.font = font;
    return measureCtx.measureText(text).width;
  }
  // Wrap a label into at most `max` lines that fit maxW, with an ellipsis when it runs over.
  function wrap(text, maxW, font, max) {
    var words = String(text || '').split(/\s+/).filter(Boolean), lines = [], line = '', over = false;
    for (var i = 0; i < words.length; i++) {
      var next = line ? line + ' ' + words[i] : words[i];
      if (!line || textWidth(next, font) <= maxW) { line = next; continue; }
      lines.push(line);
      if (lines.length === max) { over = true; line = ''; break; }
      line = words[i];
    }
    if (line) lines.push(line);
    return lines.map(function (ln, k) {
      var last = k === lines.length - 1;
      if (!(last && over) && textWidth(ln, font) <= maxW) return ln;
      while (ln.length > 1 && textWidth(ln + '…', font) > maxW) ln = ln.slice(0, -1).trimEnd();
      return ln.replace(/[,.;:]$/, '') + '…';
    });
  }

  function dot(band, r) {
    return V.s('circle', { class: 'map-dot is-' + band, r: r, cx: 0, cy: 0 });
  }

  // Draw one topic's constellation for a given pixel width: a snake of rows (left to right, then
  // right to left) joined by a dotted trail, each dot labelled underneath.
  // Label size follows the reading-size setting (the labels are 0.875rem, see 70-views.css).
  function labelPx() { var r = parseFloat(getComputedStyle(document.documentElement).fontSize) || 16; return Math.round(r * 0.875 * 10) / 10; }

    var ideas = topic.ideas || [];

    var font = '600 ' + px + 'px ' + getComputedStyle(document.body).fontFamily;
    var n = ideas.length, LINE = Math.round(px * 1.3);
    var cols = Math.max(2, Math.min(4, Math.floor(W / 150)));
    if (n <= 4 && W >= 480) cols = Math.max(2, n);
    var pad = 12, inner = W - pad * 2, cellW = inner / cols;
    var labelW = Math.min(cellW - 14, 170);
    // Up to four lines: a phone's narrow columns would otherwise cut titles short.
    var labels = ideas.map(function (idea) { return wrap(idea.title, labelW, font, W < 480 ? 4 : 3); });
    var halfW = labels.map(function (ls) { return Math.max.apply(null, ls.map(function (l) { return textWidth(l, font); }).concat([20])) / 2; });
    var maxLines = Math.max.apply(null, labels.map(function (l) { return l.length; }).concat([1]));
    var top = 30, rowH = 58 + px + LINE * maxLines, rows = Math.ceil(n / cols);
    var H = top + (rows - 1) * rowH + 48 + LINE * (maxLines - 1) + 8;
    var pts = ideas.map(function (idea, i) {
      var row = Math.floor(i / cols), c = i % cols;
      if (row % 2) c = cols - 1 - c;

      for (var i = 1; i < n; i++) {
        var a = pts[i - 1], b = pts[i];

      a.appendChild(V.s('rect', { class: 'map-hit', x: -cellW / 2 + 4, y: -24, width: cellW - 8, height: rowH - 20, rx: 14 }));
      a.appendChild(V.s('circle', { class: 'map-halo', r: 19 }));

    return U.h('div', { class: 'map-legend', role: 'list', 'aria-label': 'What the colours mean' }, BANDS.map(function (b) {
      var s = V.s('svg', { class: 'map-key', viewBox: '-10 -10 20 20', width: 20, height: 20, 'aria-hidden': 'true' }, dot(b[0], 7));

    }));
  }

  U.routes.add('#/map', function (params, ctx) {
    var topics = null, progress = {}, bandsAll = {}, seq = 0, lastW = 0, shownKey = null, drawJob = 0;
    var listBox = U.h('div', { class: 'map-list' });
    var body = U.h('div', { class: 'map-body' }, U.h('div', { class: 'skeleton map-sk' }));
    ctx.view.appendChild(U.h('div', { class: 'map' },
      U.h('header', { class: 'page-head' },
        U.h('p', { class: 'eyebrow' }, 'Map'),
        U.h('h1', null, 'Everything you are learning'),
        U.h('p', { class: 'muted' }, 'Each dot is one idea. The colour shows how well it is holding, and it shifts as you learn and review.')),
      body));

    var stop = U.store.topics.watch(function (list) {
      topics = (list || []).filter(function (t) { return t.status === 'ready' && Array.isArray(t.ideas) && t.ideas.length; });
      var my = ++seq;
      var bandsP = U.review && U.review.ideaBands ? Promise.resolve().then(function () { return U.review.ideaBands(); }).catch(function (e) { console.error(e); return {}; }) : Promise.resolve({});
      Promise.all([U.store.progress.all().catch(function () { return {}; }), bandsP]).then(function (r) {
        if (my !== seq || !ctx.alive()) return;
        progress = r[0] || {}; bandsAll = r[1] || {};
        render();
      });
    }, function (e, info) {
      if (!ctx.alive() || topics !== null) return;
      U.clear(body).appendChild(V.loadError('Your map', e, info.retrying));
    });

    // An idea Dan has finished counts as learned even before its first review (its cards say
    // 'new' until then), so the dot agrees with "N of M ideas learned".
    function bandsFor(t) {
      var from = bandsAll[t.id] || {}, out = {};
      t.ideas.forEach(function (i) {
        var b = WORDS[from[i.id]] ? from[i.id] : null, done = V.isDone(progress[t.id], i.id);
        if (!b || (b === 'new' && done)) b = done ? 'growing' : 'new';
        out[i.id] = b;
      });
      return out;
    }

    // Redraws only when something it shows changed. Topics are added a few per frame (each with
    // its constellation), so a large library never blocks the screen.
    var renderJob = 0;
    function render() {
      var keyNow = JSON.stringify([topics.map(function (t) { return [t.id, t.title, t.hue, t.ideas.map(function (i) { return [i.id, i.title]; })]; }),
        topics.map(function (t) { return [bandsFor(t), V.summary(t, progress[t.id]).done]; })]);
      if (keyNow === shownKey) return;
      shownKey = keyNow;
      var job = ++renderJob;
      drawJob++;
      U.clear(body);
      if (!topics.length) {
        body.appendChild(V.empty({
          art: U.h('div', { class: 'v-empty-art map-empty-art' }, emptyArt()),
          title: 'Your map is empty for now',
          text: 'Each topic you start appears here as a cluster of ideas. The dots fill in with colour as you learn and review them.',
          action: { href: '#/', label: 'Start a topic' },
        }));

      }

        while (queue.length && (first || performance.now() - t0 < 12)) {

          var holder = U.h('div', { class: 'map-svg-box', dataset: { tid: t.id } });
          listBox.appendChild(U.h('section', { class: 'card map-topic' + (s.allDone ? ' is-done' : '') },
            U.h('a', { class: 'map-topic-head', href: '#/t/' + encodeURIComponent(t.id) },
              U.h('span', { class: 'map-thumb' }, V.cover(t)),
              // A finished topic says so in words and green (finished only), as the topic cards

                U.h('h2', null, t.title),

// ---- src/js/73-book.js ----
// Book (#/book): Dan's own words. For every idea he has explained back ("say it back" in a
// lesson), it shows his first explanation and his latest, with dates, so he can see how his
// understanding grew, plus the questions he asked Claude. Exports as Markdown or JSON.
// Reads progress.ideas[iid].say and progress.questions, each either a keyed map
// ({[key]: {text, at, verdict}} / {[key]: {q, iid, at}}) or, in older data, an array; both are read
// with U.list, oldest first (see 20-store.js for the shapes).
(function () {
  'use strict';
  var V = U.views;

  // Collect topics with at least one say-it-back answer or question, ideas in path order.
  function collect(topics, progress) {
    return topics.map(function (t) {
      var pr = progress[t.id] || {}, pi = pr.ideas || {};
      var all = Array.isArray(t.ideas) ? t.ideas : [];
      var ideas = all.map(function (idea) {
        var say = U.list(pi[idea.id] && pi[idea.id].say).filter(function (s) { return String(s.text || '').trim(); });
        return say.length ? { id: idea.id, title: idea.title, say: say } : null;
      }).filter(Boolean);
      var questions = U.list(pr.questions).filter(function (q) { return String(q.q || '').trim(); }).map(function (q) {
        var idea = q.iid ? all.filter(function (i) { return i.id === q.iid; })[0] : null;
        return { q: String(q.q).trim(), iid: q.iid || null, idea: idea ? idea.title : null, at: q.at || null };
      });
      return ideas.length || questions.length ? { id: t.id, title: t.title || t.query, topic: t, ideas: ideas, questions: questions } : null;
    }).filter(Boolean);
  }

  function longDate(iso) {
    var d = new Date(iso);
    return isNaN(d) ? '' : d.toLocaleDateString(undefined, { day: 'numeric', month: 'long', year: 'numeric' });
  }

  function toMarkdown(book) {
    var out = ['# My Book', '', '_Your own explanations, exported from My University on ' + longDate(U.now()) + '._', ''];
    book.forEach(function (t) {
      out.push('## ' + t.title, '');
      t.ideas.forEach(function (i) {
        var first = i.say[0], latest = i.say[i.say.length - 1];
        out.push('### ' + i.title, '');
        out.push('**' + (i.say.length > 1 ? 'First' : 'In my words') + (first.at ? ', ' + longDate(first.at) : '') + '**', '');
        out.push(quote(first.text), '');
        if (i.say.length > 1) {
          out.push('**Latest' + (latest.at ? ', ' + longDate(latest.at) : '') + '**', '');
          out.push(quote(latest.text), '');
        }
      });
      if (t.questions.length) {
        out.push('### Questions I asked', '');
        t.questions.forEach(function (q) { out.push('- ' + q.q.replace(/\s+/g, ' ') + (q.at ? ' _(' + longDate(q.at) + ')_' : '')); });
        out.push('');
      }
    });
    return out.join('\n');
  }
  function quote(text) { return String(text).trim().split(/\n/).map(function (l) { return '> ' + l; }).join('\n'); }

  function toJson(book) {
    return JSON.stringify({
      app: 'My University', kind: 'book', version: 1, exportedAt: U.now(),
      topics: book.map(function (t) {
        return { id: t.id, title: t.title, ideas: t.ideas.map(function (i) {
          return { id: i.id, title: i.title, say: i.say.map(function (s) { return { text: s.text, at: s.at || null, verdict: s.verdict || null }; }) };
        }), questions: t.questions.map(function (q) { return { q: q.q, iid: q.iid, at: q.at }; }) };
      }),
    }, null, 2);
  }

  function entry(t, i) {
    var first = i.say[0], latest = i.say[i.say.length - 1], many = i.say.length > 1;
    function words(label, s, cls) {
      return U.h('div', { class: 'book-words ' + cls },

// ---- src/js/74-settings.js ----
// Settings: U.settings.open() shows a sheet with appearance, text size, easier reading,
// daily reviews, research status, a full backup and the build id. Every change applies at once,
// is mirrored to localStorage 'mu-prefs' (read before first paint by head.html) and saved to the
// profile in the db (docs/ARCHITECTURE.md section 4: profile.prefs).
(function () {
  'use strict';

  var THEMES = [['light', 'Light'], ['dark', 'Dark'], ['system', 'Match system']];
  var SIZES = [['s', 'Small text'], ['m', 'Medium text'], ['l', 'Large text'], ['xl', 'Extra large text']];
  var CAPS = [10, 15, 20, 30];
  var LAYOUTS = [['auto', 'Auto'], ['phone', 'Phone'], ['laptop', 'Laptop']];

  function defaults() { return U.store.profile.defaults().prefs; }
  function clean(p) {
    var d = defaults(), o = Object.assign({}, d, p || {});
    if (['light', 'dark', 'system'].indexOf(o.theme) < 0) o.theme = d.theme;
    if (['s', 'm', 'l', 'xl'].indexOf(o.size) < 0) o.size = d.size;
    o.easy = !!o.easy; o.light = !!o.light;
    o.cap = Number(o.cap) || d.cap;
    return o;
  }

  var S = (U.settings = {
    prefs: clean(),
    _localAt: 0,

    readLocal: function () {
      try { var s = JSON.parse(localStorage.getItem('mu-prefs') || 'null'); return s && typeof s === 'object' ? s : null; } catch (e) { return null; }
    },

    // Apply prefs to the page now and mirror them for the next first paint.
    apply: function (prefs) {
      var p = clean(prefs), d = document.documentElement;
      S.prefs = p;
      d.setAttribute('data-mu-theme', p.theme);
      d.setAttribute('data-size', p.size);
      if (p.easy) d.setAttribute('data-easy', '1'); else d.removeAttribute('data-easy');
      try { localStorage.setItem('mu-prefs', JSON.stringify(p)); } catch (e) { /* storage blocked: fine */ }
      U.emit('prefs', p);
      return p;
    },

    // Change one pref: apply instantly, then save to the profile.
    set: function (key, value) {
      var next = Object.assign({}, S.prefs);
      next[key] = value;
      S.apply(next);
      S._localAt = Date.now();
      var patch = { prefs: {} };
      patch.prefs[key] = S.prefs[key];
      var saved = U.store.profile.patch(patch).catch(function () { /* the store already told Dan */ });
      if ((key === 'cap' || key === 'light') && U.review && U.review.refreshBadge) {
        saved.then(function () { try { U.review.refreshBadge(); } catch (e) { console.error(e); } });
      }
      return saved;
    },

    // Prefs that arrive from the db (another device). Ignored briefly after a local change so a
    // slower snapshot cannot undo what Dan just picked.
    fromProfile: function (prefs) {
      if (Date.now() - S._localAt < 3000 || !prefs) return;
      var p = clean(prefs), cur = S.prefs;
      if (p.theme !== cur.theme || p.size !== cur.size || p.easy !== cur.easy || p.cap !== cur.cap || p.light !== cur.light || p.lightDay !== cur.lightDay) S.apply(p);
    },

    // Everything Dan has, as one JSON document.
    backup: function () {
      function strip(d) { if (!d) return d; var c = Object.assign({}, d); delete c.__id; return c; }
      function stripMap(m) { var o = {}; Object.keys(m || {}).forEach(function (k) { o[k] = strip(m[k]); }); return o; }
      return U.store.topics.list().then(function (topics) {
        return Promise.all(topics.map(function (t) {
          var tid = t.__id || t.id;
          var keys = ['topic'].concat((Array.isArray(t.ideas) ? t.ideas : []).map(function (i) { return i.id; }));
          return Promise.all([
            U.store.lesson.list(tid).catch(function () { return []; }),
            Promise.all(keys.map(function (k) { return U.store.research.get(tid, k).then(function (d) { return d ? [k, d] : null; }, function () { return null; }); })),
          ]).then(function (r) {
            var lessons = {}, research = {};
            r[0].forEach(function (l) { lessons[l.__id] = strip(l); });
            r[1].filter(Boolean).forEach(function (x) { research[x[0]] = x[1]; });
            return { tid: tid, lessons: lessons, research: research };
          });
        })).then(function (per) {
          return Promise.all([U.store.progress.all(), U.store.cards.all(), U.store.profile.get()]).then(function (r) {
            var lessons = {}, research = {};
            per.forEach(function (x) { lessons[x.tid] = x.lessons; research[x.tid] = x.research; });
            return {
              app: 'My University', kind: 'backup', version: 1, build: U.BUILD, exportedAt: U.now(),
              topics: topics.map(strip), lessons: lessons, research: research,
              progress: stripMap(r[0]), cards: stripMap(r[1]), profile: r[2],
            };
          });
        });
      });
    },

    open: function () {
      if (S._sheet && S._sheet.el.isConnected) return S._sheet; // already open
      var p = S.prefs;

      // A row of radio buttons that behaves like a segmented control.
      function seg(label, opts, value, onPick, cls) {
        var btns = opts.map(function (o) {
          return U.h('button', { class: 'seg-btn', type: 'button', role: 'radio', 'aria-checked': String(o.value === value), 'aria-label': o.aria || null, dataset: { v: String(o.value) }, on: { click: function () {
            btns.forEach(function (b) { b.setAttribute('aria-checked', String(b === this)); }, this);
            onPick(o.value);
          } } }, o.label);
        });
        return U.h('div', { class: 'seg' + (cls ? ' ' + cls : ''), role: 'radiogroup', 'aria-label': label }, btns);
      }
      function toggle(title, text, checked, onChange, name) {
        var id = U.id('sw');
        return U.h('label', { class: 'set-switch', for: id },
          U.h('span', { class: 'set-switch-text' }, U.h('strong', null, title), U.h('span', { class: 'muted small' }, text)),
          U.h('input', { class: 'switch', type: 'checkbox', role: 'switch', id: id, name: name, checked: !!checked, on: { change: function (e) { onChange(e.target.checked); } } }));
      }
      function group(title, children, note) {
        return U.h('section', { class: 'set-group' }, U.h('h3', { class: 'set-h' }, title), note ? U.h('p', { class: 'muted small set-note' }, note) : null, children);
      }

      var research = U.h('div', { class: 'set-research' }, U.h('p', { class: 'muted' }, 'Checking…'));
      function checkResearch(fresh) {
        if (fresh && U.research.reset) U.research.reset();
        U.clear(research).appendChild(U.h('p', { class: 'muted' }, 'Checking…'));
        U.research.available().then(function (ok) {
          U.clear(research);
          if (ok) {
            research.appendChild(U.h('p', { class: 'set-ok' }, U.icon('tick'), U.h('span', null, U.h('strong', null, 'Connected. '), 'New topics are checked against real sources, with quotes you can open.')));
          } else {
            research.appendChild(U.h('p', null, U.h('strong', null, 'Not connected. '), 'Lessons still work, but they are marked as not source-checked.'));
            research.appendChild(U.h('ol', { class: 'set-steps small' },
              U.h('li', null, 'In Claude, open Settings, then Connectors.'),
              U.h('li', null, 'Connect Parallel Search.'),
              U.h('li', null, 'Come back here and check again.')));
            research.appendChild(U.h('button', { class: 'linkish', type: 'button', on: { click: function () { checkResearch(true); } } }, 'Check again'));
          }
        }, function () { U.clear(research).appendChild(U.h('p', { class: 'muted' }, 'Could not check just now.')); });
      }
      checkResearch(false);

      var backupBtn = U.h('button', { class: 'btn secondary small', type: 'button', on: { click: function () {
        backupBtn.disabled = true; backupBtn.textContent = 'Preparing…';
        S.backup().then(function (data) {
          return U.saveFile('my-university-backup-' + U.today() + '.json', JSON.stringify(data, null, 2), 'application/json');
        }).then(function (ok) {
          if (ok) U.toast('Backup saved.', { kind: 'good' });
        }, function (e) { U.toast('Could not make the backup: ' + U.errText(e), { kind: 'bad' }); }).then(function () {
          backupBtn.disabled = false; backupBtn.textContent = 'Save a backup';
        });
      } } }, 'Save a backup');

      // Layout is per device (U.layout, localStorage only), so it is not one of the prefs.
      // The laptop layout on a narrow screen keeps the tabs in the top bar as icons only (the
      // 539 px breakpoint in 10-base.css), so the note says so before he wonders where the words went.
      function layoutNote() {
        var eff = U.layout.effective(), narrow = false;
        try { narrow = window.matchMedia('(max-width: 539px)').matches; } catch (e) { /* old browser: no note */ }
        return (U.layout.pref() === 'auto' ? 'Auto picks for this screen: the ' + eff + ' layout here. ' : '') +
          (eff === 'laptop' && narrow ? 'On a screen this narrow, the laptop layout shows the tabs as icons only. ' : '') +
          'Saved on this device only.';
      }
      var layoutNoteEl = U.h('p', { class: 'muted small set-note set-layout-note' }, layoutNote());
      var layoutGroup = U.layout ? group('Layout', [
        seg('Layout', LAYOUTS.map(function (l) { return { value: l[0], label: l[1] }; }), U.layout.pref(), function (v) {
          U.layout.set(v);
          layoutNoteEl.textContent = layoutNote();
        }, 'seg-layout'),
        layoutNoteEl,
      ]) : null;
      var offLayout = U.on('layout', function () { layoutNoteEl.textContent = layoutNote(); });

      var body = U.h('div', { class: 'set' },
        group('Appearance', seg('Appearance', THEMES.map(function (t) { return { value: t[0], label: t[1] }; }), p.theme, function (v) { S.set('theme', v); })),
        group('Text size', [
          seg('Text size', SIZES.map(function (s, i) { return { value: s[0], label: U.h('span', { class: 'seg-aa seg-aa-' + i, 'aria-hidden': 'true' }, 'Aa'), aria: s[1] }; }), p.size, function (v) { S.set('size', v); }, 'seg-size'),
          U.h('p', { class: 'reading set-preview' }, 'Tides rise and fall twice a day because the Moon pulls on the oceans.'),
          toggle('Easier reading', 'A very clear typeface with a little more space between letters.', p.easy, function (v) { S.set('easy', v); }, 'easy'),
        ]),
        layoutGroup,
        group('Daily reviews', [
          seg('Most reviews in a day', CAPS.map(function (c) { return { value: c, label: String(c) }; }), p.cap, function (v) { S.set('cap', v); }),
          toggle('Light days', 'Just 5 reviews a day until you turn this off. For busy or tired weeks.', p.light, function (v) { S.set('light', v); }, 'light'),
        ], 'The most reviews Today will offer in one day.'),
        group('Research', research),
        group('Backup', backupBtn, 'Save a copy of everything: topics, lessons, sources, your answers, review cards and settings.'),
        U.h('p', { class: 'set-build muted small' }, 'Build ' + U.BUILD));

      // Settings runs taller than a laptop dialog or a phone sheet: while more is below, the
      // bottom edge fades (.sheet.has-more in 10-base.css), so a row cut in half reads as "scroll".
      var box = null, ro = null;
      function more() { if (box) box.classList.toggle('has-more', box.scrollHeight - box.clientHeight - box.scrollTop > 8); }
      S._sheet = U.sheet({ title: 'Settings', body: body, autofocus: false, onClose: function () {
        S._sheet = null; offLayout(); window.removeEventListener('resize', more); if (ro) ro.disconnect();
      } });
      box = S._sheet.el;
      box.addEventListener('scroll', more, { passive: true });
      window.addEventListener('resize', more);
      // The content changes height too: the research line arrives, the text size changes.
      if (window.ResizeObserver) { ro = new ResizeObserver(function () { more(); }); ro.observe(body); }
      more();
      return S._sheet;
    },
  });
})();

// ---- src/js/99-boot.js ----
// Boot: runs last. Wires the settings button, waits for the runtime (U.rt.ready, which every
// bridge call bounds at 10 s), starts the hash router at once (the device's reading settings were
// already applied before first paint by head.html; the db copy is loaded in the background and
// applied when it arrives), warns once when progress cannot be kept, starts the Today badge, and
// counts study minutes while the page is visible and in use.
// Exposes U.boot.study for tests. Contract: docs/ARCHITECTURE.md sections 3, 4 and 10.
(function () {
  'use strict';
  var B = (U.boot = U.boot || {});

  // ---------- study time ----------
  // Every TICK, if the page is visible and Dan touched, typed or scrolled within IDLE, the tick
  // counts as active. Each CHUNK of active time is logged as 2 minutes with U.logStudy.
  var study = B.study = {
    TICK: 15000, IDLE: 120000, CHUNK: 120000,
    active: 0, lastInput: Date.now(), lastTick: Date.now(), timer: null,
    poke: function () { study.lastInput = Date.now(); },
    tick: function (now) {
      now = now || Date.now();
      var dt = Math.max(0, Math.min(now - study.lastTick, study.TICK * 2)); // a sleeping phone does not count
      study.lastTick = now;
      if (document.visibilityState === 'visible' && now - study.lastInput <= study.IDLE) study.active += dt;
      while (study.active >= study.CHUNK) {
        study.active -= study.CHUNK;
        Promise.resolve().then(function () { return U.logStudy(study.CHUNK / 60000); }).catch(function (e) { console.error('logStudy', e); });
      }
    },
    start: function () {
      if (study.timer) return;
      ['pointerdown', 'keydown', 'wheel', 'touchstart', 'input', 'scroll'].forEach(function (evt) {
        document.addEventListener(evt, study.poke, { passive: true, capture: true });
      });
      document.addEventListener('visibilitychange', function () {
        study.lastTick = Date.now();
        if (document.visibilityState === 'visible') study.poke();
      });
      study.lastTick = Date.now();
      study.timer = setInterval(function () { study.tick(); }, study.TICK);
    },
  };

  // ---------- reading settings ----------
  // The db profile is the durable copy. On a first visit (no profile yet) the per-device copy
  // in localStorage wins and is saved to the profile.
  function loadPrefs() {
    if (!U.settings) return Promise.resolve();
    return U.store.getDoc(U.store.paths.profile()).then(function (doc) {
      if (doc && doc.prefs) U.settings.apply(doc.prefs);
      else {
        var local = U.settings.readLocal();
        U.settings.apply(local || {});
        if (local) {
          U.settings._localAt = Date.now(); // the profile snapshot may arrive before this write
          U.store.profile.patch({ prefs: U.settings.prefs }).catch(function () {});
        }
      }
      B.stopProfile = U.store.profile.watch(function (p) { U.settings.fromProfile(p && p.prefs); });
    });
  }

  // ---------- one-line notice when nothing will be kept ----------
  function persistNotice() {
    if (U.store.persistent()) return;
    try { if (sessionStorage.getItem('mu-notice-persist') === '1') return; } catch (e) { /* fine */ }
    var view = document.getElementById('view');
    if (!view || document.getElementById('persist-notice')) return;
    var box = U.h('div', { class: 'boot-notice', id: 'persist-notice', role: 'note' },
      U.h('div', { class: 'boot-notice-in' },
        U.h('span', null, 'Open this in the Claude app to keep your progress.'),
        U.h('button', { class: 'boot-notice-x', type: 'button', 'aria-label': 'Dismiss', on: { click: function () {
          box.remove();
          try { sessionStorage.setItem('mu-notice-persist', '1'); } catch (e) { /* fine */ }
        } } }, U.icon('close'))));
    view.parentNode.insertBefore(box, view);
  }

  function opening() {
    return U.h('div', { class: 'boot-opening', role: 'status' },
      U.h('p', { class: 'muted' }, 'Opening your university…'),
      U.h('div', { class: 'working' }));
  }

  function start() {
    var btn = document.getElementById('settings-btn');
    if (btn) {
      btn.setAttribute('aria-label', 'Settings');
      btn.addEventListener('click', function () {
        if (U.settings) U.settings.open(); else U.toast('Settings are not available in this build.');
      });
    }
    var view = document.getElementById('view');
    // Each screen announces itself through its h1 (focused on every route) and its own small live
    // regions; the whole view as one live region read every change out loud.
    if (view) view.removeAttribute('aria-live');
    if (view && !view.firstChild) view.appendChild(opening());

    U.rt.ready.then(function () {
      loadPrefs().catch(function (e) { console.error('prefs', e); });
      persistNotice();
      window.addEventListener('hashchange', function () { U._memHash = null; U._route(); });
      // In-app links ("#/...") route here (capture phase, before anything else sees the click),
      // so a viewer that handles link clicks itself can never send them anywhere else.
      document.addEventListener('click', function (e) {
        if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
        var a = e.target && e.target.closest ? e.target.closest('a[href^="#/"]') : null;
        if (!a || a.target) return;
        e.preventDefault();
        U.go(a.getAttribute('href'));
      }, true);
      U._route();
      if (U.review && U.review.refreshBadge) {
        Promise.resolve().then(function () { return U.review.refreshBadge(); }).catch(function (e) { console.error('badge', e); });
      }
      study.start();
      B.ready = true;
      U.emit('booted');
    }).catch(function (e) { U.fail(view, e); });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();
