<title>My University</title>

<script>
(function () {
  // Apply saved reading settings before first paint (per-device convenience only;
  // the durable copy lives in the db profile).
  // Light is the default whatever the phone's setting (Design Brief v2); "system" follows it.
  var d = document.documentElement, s = {};
  d.lang = d.lang || 'en-GB';
  // Web fonts load without blocking: the fallback stacks paint first and display=swap swaps them
  // in. A slow or unreachable fonts host can never hold up the app.
  var f = document.createElement('link');
  f.rel = 'stylesheet';
  f.href = 'https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap';
  document.head.appendChild(f);
  try { s = JSON.parse(localStorage.getItem('mu-prefs') || '{}') || {}; } catch (e) {}
  d.setAttribute('data-mu-theme', s.theme === 'dark' || s.theme === 'system' ? s.theme : 'light');
  if (s.size) d.setAttribute('data-size', s.size);
  if (s.easy) d.setAttribute('data-easy', '1');
  // Layout belongs to this device ('mu-layout', never the db): 'auto' gives the laptop layout
  // from 900 px wide, or Dan pins phone or laptop in settings. A phone layout pinned on a wide
  // window is a centred phone column (html.framed). U.layout keeps this right after load.
  var lay = null, mm = function (q) { return !!(window.matchMedia && window.matchMedia(q).matches); };
  try { lay = localStorage.getItem('mu-layout'); } catch (e) {}
  var eff = lay === 'phone' || lay === 'laptop' ? lay : (mm('(min-width: 900px)') ? 'laptop' : 'phone');
  d.setAttribute('data-layout', eff);
  if (lay === 'phone' && mm('(min-width: 600px)')) d.classList.add('framed');
})();
</script>
<style>
/* src/css/00-tokens.css */
/* Layout concept: one calm reading column (max 720px) with a sticky top bar. Two layouts, set on
   <html data-layout> by head.html and U.layout: "phone" docks the section tabs to the bottom edge;
   "laptop" puts them in the top bar and lets Learn, the topic page and the Map use the width (up
   to --wide) and the lesson up to 1120px. A phone layout pinned on a wide window is a centred --frame column
   (html.framed). Colour marks meaning, never decoration. */
:root {
  /* Dan's palette (Design Brief v2) */
  --bg: #F7F5F0;          /* warm off-white page */
  --surface: #FFFFFF;     /* cards, sheets */
  --sunk: #EFEBE3;        /* wells, tracks, inactive fills */
  --ink: #1F2937;         /* main text, charcoal */
  --muted: #5B6573;       /* secondary text (4.9:1 on --bg) */
  --heading: #17324D;     /* deep navy: headings, progress, controls */
  --teal: #0F6B66;        /* small labels, diagram details */
  --teal-tint: #E2EFED;
  --amber: #FFF1CC;       /* "remember this" boxes */
  --hl: #FBE29A;          /* highlighter stroke for key terms */
  --red: #9F3038;         /* warnings, mistakes, "experts disagree" */
  --red-tint: #F8ECEC;
  --green: #2E7D4F;       /* completion only */
  --green-tint: #E5F1E9;
  --line: #DED8CC;
  --line-strong: #B9B1A3;
  --on-heading: #F7F5F0;  /* text on navy fills */
  --on-green: #FFFFFF;    /* tick and text on green fills */
  --shadow: 0 1px 2px rgba(23, 50, 77, .05), 0 8px 24px rgba(23, 50, 77, .06);
  --scrim: rgba(15, 23, 32, .42);

  --serif: "Literata", Georgia, "Times New Roman", serif;
  --sans: "Plus Jakarta Sans", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --easy: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

  --fs: 18px;             /* reading size; settings change it */
  --col: 720px;           /* reading column */
  --measure: 44rem;       /* longest comfortable line of reading text on a laptop */
  --wide: 1200px;         /* laptop screens that use the width */
  --frame: 430px;         /* the phone column when the phone layout is pinned on a wide window */
  --shell: var(--col);    /* how wide the top bar's contents run */
  --r-sm: 12px; --r: 18px; --r-lg: 24px;
  --gap: 16px;
  --topbar-h: 60px;
  --tabbar-h: 64px;
  color-scheme: light;
}
:root[data-size="s"] { --fs: 16px; }
:root[data-size="l"] { --fs: 20px; }
:root[data-size="xl"] { --fs: 22px; }

/* Dark palette: applied by explicit choice, or by "system" when the viewer/OS is dark. */
:root[data-mu-theme="dark"],
:root[data-mu-theme="system"][data-theme="dark"] {
  --bg: #12161C; --surface: #1A2029; --sunk: #232A35; --ink: #E7E4DD; --muted: #A9B1BC;
  --heading: #BBD0E6; --teal: #6CC7BD; --teal-tint: #17302D; --amber: #3A3016; --hl: rgba(232, 199, 102, .34);
  --red: #F2A6AC; --red-tint: #2E1A1D; --green: #6FCB94; --green-tint: #16291F;
  --line: #2C3440; --line-strong: #4A5564; --on-heading: #12161C; --on-green: #0E1A13;
  --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 8px 24px rgba(0, 0, 0, .28); --scrim: rgba(0, 0, 0, .6);
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root[data-mu-theme="system"]:not([data-theme="light"]) {
    --bg: #12161C; --surface: #1A2029; --sunk: #232A35; --ink: #E7E4DD; --muted: #A9B1BC;
    --heading: #BBD0E6; --teal: #6CC7BD; --teal-tint: #17302D; --amber: #3A3016; --hl: rgba(232, 199, 102, .34);
    --red: #F2A6AC; --red-tint: #2E1A1D; --green: #6FCB94; --green-tint: #16291F;
    --line: #2C3440; --line-strong: #4A5564; --on-heading: #12161C; --on-green: #0E1A13;
    --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 8px 24px rgba(0, 0, 0, .28); --scrim: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-easy="1"] { --sans: var(--easy); --serif: var(--easy); }

/* src/css/10-base.css */
*, *::before, *::after { box-sizing: border-box; }
/* Text size (Settings) scales the whole app: every font size below is in rem. The reading size
   --fs stays 1.125rem at every setting, so it scales with the rest instead of on its own. */
:root { font-size: 100%; }
:root[data-size="s"] { font-size: 93.75%; }
:root[data-size="l"] { font-size: 112.5%; }
:root[data-size="xl"] { font-size: 125%; }
:root, :root[data-size] { --fs: 1.125rem; --tabbar-h: calc(48px + 1rem); }
/* Text on red fills (Delete, error toasts): white in light, near-black on the light dark-mode red. */
:root { --on-red: #FFFFFF; }
:root[data-mu-theme="dark"], :root[data-mu-theme="system"][data-theme="dark"] { --on-red: #2A0E11; }
@media (prefers-color-scheme: dark) { :root[data-mu-theme="system"]:not([data-theme="light"]) { --on-red: #2A0E11; } }
html {
  -webkit-text-size-adjust: 100%;
  /* Focused or scrolled-to controls never land under the sticky top bar or the bottom tab bar. */
  scroll-padding-top: calc(var(--topbar-h) + 8px);
  scroll-padding-bottom: calc(var(--tabbar-h) + 16px + env(safe-area-inset-bottom, 0px));
}
html.sheet-open body { overflow: hidden; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 1rem/1.55 var(--sans);
  -webkit-font-smoothing: antialiased;
}
:root[data-easy="1"] body { letter-spacing: .02em; word-spacing: .1em; }
h1, h2, h3 { font-family: var(--sans); color: var(--heading); line-height: 1.22; letter-spacing: -.015em; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.7rem, 5.4vw, 2.2rem); font-size: clamp(1.7rem, 5.4cqi, 2.2rem); font-weight: 800; }
h2 { font-size: 1.3rem; font-weight: 700; }
h3 { font-size: 1.05rem; font-weight: 700; }
p { margin: 0; }
a { color: var(--heading); }
button, input, textarea, select { font: inherit; color: inherit; }
img, svg { max-width: 100%; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; border-radius: 6px; }
/* Headings take focus when a screen or sheet opens (for screen readers); no ring for that. */
h1[tabindex="-1"]:focus, h2[tabindex="-1"]:focus { outline: none; }

/* ---------- app frame ---------- */
.app { min-height: 100%; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 12px;
  height: var(--topbar-h); padding-inline: max(16px, calc((100% - var(--shell)) / 2));
  border-bottom: 1px solid var(--line);
}
/* The frosted glass lives on a pseudo-element: a backdrop-filter on .topbar itself would become
   the containing block for the fixed bottom tab bar (which sits inside the header). */
.topbar::before {
  content: ""; position: absolute; inset: 0; z-index: -1;
  background: color-mix(in srgb, var(--bg) 96%, transparent);
  -webkit-backdrop-filter: saturate(1.4) blur(14px); backdrop-filter: saturate(1.4) blur(14px);
}
.brand { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: var(--heading); min-height: 44px; }
.brand-mark { width: 28px; height: 28px; color: var(--teal); flex: none; }
.brand-name { font: 800 1.0625rem/1 var(--sans); letter-spacing: -.02em; }
.icon-btn {
  display: inline-grid; place-items: center; min-width: 44px; min-height: 44px; padding: 0 10px;
  border: 1.5px solid var(--line-strong); border-radius: 999px; background: transparent; color: var(--heading); cursor: pointer;
}
.settings-btn { margin-left: auto; }
.aa { font: 600 1.0625rem/1 var(--serif); }

/* The view is a size container: screens lay themselves out by the width they actually get
   (@container view), so a phone column pinned on a laptop really gets the phone layout. */
.view { display: block; max-width: var(--col); margin: 0 auto; padding: 20px 16px calc(var(--tabbar-h) + 40px + env(safe-area-inset-bottom, 0px)); outline: none; container: view / inline-size; }
/* Focus mode (lessons, reviews): no app chrome, just the screen's own close + progress bar. */
:root.focus { --topbar-h: 0px; --tabbar-h: 0px; }
.focus .topbar { display: none; }
.focus .view { padding-bottom: 48px; }

/* tabs: bottom bar on phones, inline on wide screens */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
  display: flex; justify-content: space-around;
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
  background: var(--surface); border-top: 1px solid var(--line);
}
.tab {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px;
  min-width: 64px; min-height: 48px; padding: 6px 10px; border-radius: 14px;
  color: var(--muted); text-decoration: none; font: 700 .75rem/1.2 var(--sans);
}
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--heading); }
.tab[aria-current="page"]::before { content: ""; position: absolute; top: -7px; left: 28%; right: 28%; height: 3px; border-radius: 0 0 3px 3px; background: var(--heading); }
.tab-badge {
  min-width: 1.5em; height: 1.5em; padding: 0 5px; border-radius: .75em;
  background: var(--heading); color: var(--on-heading); font: 800 .75rem/1.5 var(--sans); text-align: center;
}
/* Bottom tabs: the badge sits on the icon's top-right corner, measured from the icon (the tab's
   centre) and sized in px like the icon, so at large text sizes it never covers the clock. */
:root:not([data-layout="laptop"]) .tab-badge {
  position: absolute; top: -1px; left: calc(50% + 8px); min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px;
  font-size: 12px; line-height: 20px; box-shadow: 0 0 0 2px var(--surface);
}
.focus .tabs { display: none; }
:root[data-layout="laptop"] { --shell: var(--wide); }
:root[data-layout="laptop"], :root[data-layout="laptop"][data-size] { --tabbar-h: 0px; }
:root[data-layout="laptop"] .tabs { position: static; flex: 1; justify-content: center; gap: 4px; padding: 0; background: none; border: 0; }
:root[data-layout="laptop"] .tab { flex-direction: row; gap: 8px; min-height: 44px; font-size: .875rem; }
:root[data-layout="laptop"] .tab svg { width: 20px; height: 20px; }
:root[data-layout="laptop"] .tab[aria-current="page"] { background: var(--sunk); }
:root[data-layout="laptop"] .tab[aria-current="page"]::before { display: none; }
:root[data-layout="laptop"] .settings-btn { margin-left: 0; }
:root[data-layout="laptop"] .view { padding-bottom: 64px; }
/* Every tab screen starts at the same left edge (the wide screens' edge, under the brand), so a
   heading stays put when Dan switches tabs; column screens (Today, Book) leave the room on the right. */
:root[data-layout="laptop"]:not(.focus) .view { margin-left: max(0px, calc((100% - var(--wide)) / 2)); margin-right: auto; }
/* Each screen's width on a laptop: reading screens keep the column; these use the room. */
:root[data-layout="laptop"] .view[data-screen="learn"],
:root[data-layout="laptop"] .view[data-screen="topic"],
:root[data-layout="laptop"] .view[data-screen="map"] { max-width: var(--wide); }
:root[data-layout="laptop"] .view[data-screen="lesson"] { max-width: 1120px; }
/* The laptop layout pinned on a narrow window: the top bar keeps to one row. */
@media (max-width: 699px) { :root[data-layout="laptop"] .brand-name { display: none; } }
@media (max-width: 539px) {
  :root[data-layout="laptop"] .topbar { gap: 4px; }
  :root[data-layout="laptop"] .tabs { gap: 0; }
  :root[data-layout="laptop"] .tab { min-width: 44px; padding: 6px 8px; }
  :root[data-layout="laptop"] .tab > span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
}

/* The phone layout pinned on a wide window: a centred phone column; the rest stays quiet. */
:root.framed body { background: var(--sunk); }
:root.framed .app { max-width: var(--frame); min-height: 100vh; margin: 0 auto; background: var(--bg); box-shadow: 0 0 0 1px var(--line), 0 12px 40px rgba(23, 50, 77, .08); }
:root.framed .tabs, :root.framed .sheet, :root.framed .toasts { left: calc(50% - var(--frame) / 2); right: calc(50% - var(--frame) / 2); }

/* ---------- type helpers ---------- */
.eyebrow { font: 700 .75rem/1.4 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--teal); }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.reading { font-family: var(--serif); font-size: var(--fs); line-height: 1.8; color: var(--ink); }
.reading p { max-width: 36em; }
.reading p + p { margin-top: 1.1em; }
mark.term {
  color: inherit; font-weight: 600; padding: 0 .12em; margin: 0 -.04em; border-radius: 3px;
  background: linear-gradient(180deg, transparent 50%, var(--hl) 50%, var(--hl) 92%, transparent 92%);
  -webkit-box-decoration-break: clone; box-decoration-break: clone;
}
/* A footnote badge sized to the text, raised by relative positioning (top) rather than
   vertical-align, which would make its line taller than the others. */
.fn {
  position: relative; top: -.4em; display: inline-grid; place-items: center; min-width: 1.6em; height: 1.6em; padding: 0 .35em; margin: 0 2px;
  border: 0; border-radius: 6px; background: var(--teal-tint); color: var(--teal);
  font: 700 .75rem/1 var(--sans); vertical-align: baseline; cursor: pointer;
}
/* The tap target is larger than the badge: at least 44 px square, centred on it. */
.fn::after { content: ""; position: absolute; left: 50%; top: 50%; width: max(100%, 44px); height: 44px; transform: translate(-50%, -50%); }
.reading code, code { font-family: var(--mono); font-size: .88em; background: var(--sunk); padding: .1em .35em; border-radius: 6px; }
.visually-hidden { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- layout helpers ---------- */
.stack { display: flex; flex-direction: column; gap: var(--gap); }
.stack-sm { display: flex; flex-direction: column; gap: 8px; }
.stack-lg { display: flex; flex-direction: column; gap: 32px; }
.row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.row > .grow { flex: 1; min-width: 0; }
.spacer { flex: 1; }

/* ---------- surfaces ---------- */
.card { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 20px; }
.card-quiet { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.callout { border-radius: var(--r); padding: 16px 18px; }
.callout.remember { background: var(--amber); }
.callout.warn { background: var(--red-tint); }
.callout.warn .eyebrow { color: var(--red); }
.callout.note { border: 1.5px dashed var(--line-strong); }

/* ---------- buttons (chunky, pressable) ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 52px; padding: 12px 22px; border-radius: 16px; border: 0; cursor: pointer;
  font: 700 1rem/1.2 var(--sans); text-decoration: none; text-align: center;
  background: var(--heading); color: var(--on-heading);
  box-shadow: 0 3px 0 color-mix(in srgb, var(--heading) 70%, #000);
  transition: transform .06s ease, box-shadow .06s ease;
}
.btn:active:not([disabled]) { transform: translateY(2px); box-shadow: 0 1px 0 color-mix(in srgb, var(--heading) 70%, #000); }
.btn[disabled] { opacity: .5; cursor: default; }
.btn.secondary { background: var(--surface); color: var(--heading); border: 1.5px solid var(--line-strong); box-shadow: 0 3px 0 var(--line); }
.btn.ghost { background: transparent; color: var(--heading); box-shadow: none; min-height: 44px; padding: 8px 12px; }
.btn.good { background: var(--green); color: var(--on-green); box-shadow: 0 3px 0 color-mix(in srgb, var(--green) 65%, #000); }
.btn.danger { background: var(--red); color: var(--on-red); box-shadow: 0 3px 0 color-mix(in srgb, var(--red) 65%, #000); }
.btn.wide { width: 100%; }
.btn svg { flex: none; width: 20px; height: 20px; }
.btn.small { min-height: 44px; padding: 8px 16px; font-size: .9375rem; border-radius: 14px; }
.linkish { background: none; border: 0; padding: 8px 0; min-height: 44px; color: var(--heading); font: 700 .9375rem/1.3 var(--sans); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }

/* ---------- inputs ---------- */
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font: 700 .875rem/1.3 var(--sans); color: var(--heading); }
.input, .textarea {
  width: 100%; min-height: 52px; padding: 13px 16px; border-radius: 16px;
  border: 1.5px solid var(--line-strong); background: var(--surface); color: var(--ink);
  font: 400 1.0625rem/1.45 var(--sans);
}
.textarea { resize: vertical; min-height: 110px; }
.input:focus, .textarea:focus { outline: none; border-color: var(--heading); box-shadow: 0 0 0 3px color-mix(in srgb, var(--heading) 18%, transparent); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  min-height: 44px; padding: 8px 14px; border-radius: 999px; cursor: pointer;
  border: 1.5px solid var(--line-strong); background: var(--surface); color: var(--heading); font: 600 .875rem/1.3 var(--sans);
}
.chip[aria-pressed="true"] { background: var(--heading); color: var(--on-heading); border-color: var(--heading); }

/* ---------- options (answers) ---------- */
.options { display: grid; gap: 10px; }
.option {
  display: block; width: 100%; text-align: left; cursor: pointer;
  min-height: 56px; padding: 14px 18px; border-radius: 16px;
  border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
  font: 600 1rem/1.4 var(--sans); box-shadow: 0 2px 0 var(--line);
}
.option:active:not([disabled]) { transform: translateY(1px); box-shadow: none; }
/* Answers you pick from carry a radio dot; the picked one fills it and tints the whole option. */
.option[aria-pressed] { position: relative; padding-left: 50px; }
.option[aria-pressed]::before {
  content: ""; position: absolute; left: 18px; top: 50%; width: 20px; height: 20px; margin-top: -10px;
  border-radius: 50%; border: 2px solid var(--line-strong); background: var(--surface); box-sizing: border-box;
}
.option[aria-pressed="true"] { border-color: var(--heading); box-shadow: inset 0 0 0 1px var(--heading); background: color-mix(in srgb, var(--heading) 8%, var(--surface)); }
.option[aria-pressed="true"]::before { border-color: var(--heading); background: radial-gradient(circle, var(--heading) 0 4.5px, var(--surface) 5px); }
.option.correct { border-color: var(--green); background: var(--green-tint); box-shadow: none; }
.option.wrong { border-color: var(--red); background: var(--red-tint); box-shadow: none; }
.option.correct::before { border-color: var(--green); background: radial-gradient(circle, var(--green) 0 4.5px, var(--surface) 5px); }
.option.wrong::before { border-color: var(--red); background: radial-gradient(circle, var(--red) 0 4.5px, var(--surface) 5px); }
.option[disabled] { cursor: default; }

/* ---------- progress ---------- */
.bar { height: 8px; border-radius: 999px; background: var(--sunk); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: inherit; background: var(--heading); transition: width .4s ease; }
.working { height: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--sunk) 0%, var(--heading) 50%, var(--sunk) 100%); background-size: 200% 100%; animation: mu-work 1.3s linear infinite; }
@keyframes mu-work { from { background-position: 200% 0; } to { background-position: 0 0; } }
.skeleton { border-radius: 10px; background: linear-gradient(90deg, var(--sunk), color-mix(in srgb, var(--sunk) 50%, var(--surface)), var(--sunk)); background-size: 200% 100%; animation: mu-work 1.6s linear infinite; }

/* ---------- toasts ---------- */
.toasts { position: fixed; left: 0; right: 0; bottom: calc(var(--tabbar-h) + 16px + env(safe-area-inset-bottom, 0px)); z-index: 60; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; padding: 0 16px; }
.toast { max-width: 520px; padding: 12px 18px; border-radius: 14px; background: var(--heading); color: var(--on-heading); font: 600 .9375rem/1.4 var(--sans); box-shadow: var(--shadow); pointer-events: auto; animation: mu-rise .25s ease-out; }
.toast.good { background: var(--green); color: var(--on-green); }
.toast.bad { background: var(--red); color: var(--on-red); }
@keyframes mu-rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- sheets ---------- */
.scrim { position: fixed; inset: 0; z-index: 70; background: var(--scrim); animation: mu-fade .2s ease-out; }
@keyframes mu-fade { from { opacity: 0; } to { opacity: 1; } }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 71; max-height: min(88vh, 860px); overflow: auto; overscroll-behavior: contain;
  background: var(--surface); border-radius: 24px 24px 0 0; box-shadow: 0 -12px 34px rgba(0, 0, 0, .16);
  padding: 8px 20px calc(20px + env(safe-area-inset-bottom, 0px)); animation: mu-up .28s cubic-bezier(.2, .9, .3, 1);
}
@keyframes mu-up { from { transform: translateY(40%); opacity: .4; } to { transform: none; opacity: 1; } }
.sheet-in { max-width: var(--col); margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
/* Swipe down on the grip or the heading to close (phones). */
.sheet-grip { width: 40px; height: 5px; border-radius: 3px; background: var(--line-strong); margin: 4px auto 6px; touch-action: none; position: relative; }
.sheet-grip::after { content: ""; position: absolute; inset: -14px -40px; }
.sheet-head { display: flex; align-items: center; gap: 12px; touch-action: pan-x; }
.sheet-head h2 { flex: 1; font-size: 1.15rem; }
.sheet-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; }
/* More below (a sheet that sets has-more while it can scroll further, like Settings): the
   bottom edge fades out, so a row cut in half reads as "there is more", not as the end.
   A sticky box stops at the sheet's padding, so bottom gives that padding back to reach the edge. */
.sheet.has-more::after {
  content: ""; position: sticky; bottom: calc(-20px - env(safe-area-inset-bottom, 0px)); display: block; height: 56px; margin-top: -56px; pointer-events: none;
  background: linear-gradient(to bottom, color-mix(in srgb, var(--surface) 0%, transparent), var(--surface));
}
:root[data-layout="laptop"] .sheet-grip { display: none; }
:root[data-layout="laptop"] .sheet { left: 50%; right: auto; bottom: auto; top: 50%; width: min(620px, calc(100vw - 32px)); transform: translate(-50%, -50%); border-radius: 24px; animation: mu-fade .2s ease-out; }

/* ---------- celebration (shared) ---------- */
.cheer { position: fixed; left: 50%; top: 38%; z-index: 80; display: grid; justify-items: center; gap: 10px; transform: translate(-50%, -50%); pointer-events: none; }
.cheer-bubble { width: 76px; height: 76px; border-radius: 50%; background: var(--green); color: var(--on-green); display: grid; place-items: center; box-shadow: 0 10px 30px rgba(46, 125, 79, .35); animation: mu-pop 1.6s cubic-bezier(.2, .9, .3, 1.2) forwards; }
.cheer-bubble svg { width: 40px; height: 40px; }
.cheer-text { padding: 8px 16px; border-radius: 999px; background: var(--green); color: var(--on-green); font: 700 .9375rem/1.3 var(--sans); animation: mu-pop 1.6s cubic-bezier(.2, .9, .3, 1.2) forwards; }
@keyframes mu-pop { 0% { opacity: 0; transform: scale(.6); } 18% { opacity: 1; transform: scale(1.06); } 28% { transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-8px); } }

/* ---------- empty / error states ---------- */
.empty { text-align: center; padding: 40px 12px; color: var(--muted); }
.empty h1, .empty h2 { margin-bottom: 6px; font-size: 1.3rem; }
.not-here-go { margin-top: 16px; }
.notice { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); font-size: .9375rem; }
.notice.bad { border-color: color-mix(in srgb, var(--red) 40%, var(--line)); background: var(--red-tint); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition: none !important; }
}

/* src/css/32-sandbox.css */
/* Kit host: the card an interactive lives in (32-sandbox.js). The iframe's own page is themed by
   the kit to the card colour, so the frame reads as one calm surface; it grows to its content
   while loading behind a quiet progress line. */
.kit-frame {
  position: relative; overflow: hidden;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  box-shadow: var(--shadow);
}
.kit-iframe {
  display: block; width: 100%; border: 0; background: transparent; color-scheme: normal;
  transition: height .25s ease, opacity .3s ease;
}
.kit-frame[data-state="loading"] .kit-iframe { opacity: 0; }
.kit-loading {
  position: absolute; inset: 0; z-index: 1;
  display: flex; flex-direction: column; justify-content: center; align-items: stretch; gap: 12px;
  padding: 24px 28px; text-align: center;
}
.kit-loading .working { max-width: 220px; width: 100%; margin: 0 auto; }
.kit-frame[data-state="failed"] .kit-loading { position: static; color: var(--red); }
/* Hidden self-test frames (inline styles carry the essentials; this is belt and braces). */
.kit-test { position: fixed; left: 0; top: 0; opacity: 0; pointer-events: none; z-index: -1; border: 0; }
@media (prefers-reduced-motion: reduce) { .kit-iframe { transition: none; } }

/* src/css/40-review.css */
/* Check and review cards (41-cards.js), the Today tab and the review session (60-today.js).
   Phone first: chunky full-width answers, the action button and feedback panel docked to the
   bottom of the screen in review. Colour carries meaning only: navy for controls and progress,
   green for right/finished, red for mistakes, teal for small labels. */

/* ---------- card shell ---------- */
.qc { display: flex; flex-direction: column; gap: 14px; }
.qc-kind { margin: 0; }
.qc-q { font-size: 1.2rem; line-height: 1.38; font-weight: 700; color: var(--heading); text-wrap: pretty; outline: none; }
.qc-body { display: flex; flex-direction: column; gap: 12px; }
.qc-foot { display: flex; flex-direction: column; gap: 10px; padding-top: 6px; }
.qc-label { font: 700 .75rem/1.4 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--teal); }
.qc-label.bad { color: var(--red); }
.qc-prose p { font-size: 1rem; line-height: 1.6; }
.qc-prose p + p { margin-top: .7em; }
.qc-tip { margin-top: -2px; }

/* In review the card fills the screen and its button / feedback dock to the bottom edge. */
.qc-review .qc-foot {
  margin-top: auto; position: sticky; bottom: 0; z-index: 4;
  padding: 14px 0 calc(14px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(to bottom, transparent, var(--bg) 20px);
}
.qc-review .qc-foot.qc-foot-fb { padding: 8px 0 0; background: none; }
.qc-review .qc-foot.qc-unstick { position: static; }
/* Target cards: the interactive can be taller than the screen, so the button stays in the flow
   (never over the controls) and repeats the goal beside it. */
.qc-type-target .qc-foot, .qc-review.qc-type-target .qc-foot { position: static; background: none; padding-top: 10px; }
.qc-aim { margin: 0; }
.qc-aim strong { color: var(--heading); }

/* ---------- feedback panel ---------- */
.qc-fb {
  display: flex; flex-direction: column; gap: 12px;
  padding: 18px; border-radius: var(--r-lg);
  background: var(--surface); border: 1.5px solid var(--line); box-shadow: var(--shadow);
  animation: qc-up .32s cubic-bezier(.2, .9, .3, 1);
}
@keyframes qc-up { from { transform: translateY(28px); opacity: 0; } to { transform: none; opacity: 1; } }
.qc-fb.is-right { background: var(--green-tint); border-color: color-mix(in srgb, var(--green) 40%, transparent); }
.qc-fb.is-wrong { background: var(--red-tint); border-color: color-mix(in srgb, var(--red) 35%, transparent); }
.qc-fb-head { display: flex; align-items: center; gap: 10px; }
.qc-fb-head h3 { font-size: 1.2rem; }
.is-right .qc-fb-head h3 { color: var(--green); }
.is-wrong .qc-fb-head h3 { color: var(--red); }
.qc-fb-icon { flex: none; display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; color: var(--surface); }
.qc-fb-icon svg { width: 20px; height: 20px; }
.qc-fb-icon.good { background: var(--green); }
.qc-fb-icon.bad { background: var(--red); }
.qc-answer { font-size: 1rem; line-height: 1.5; }
.qc-answer strong { color: var(--heading); }
.qc-why { display: flex; flex-direction: column; gap: 4px; }
.qc-mis { display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border-radius: 14px; background: var(--surface); border-left: 4px solid var(--red); }
.qc-continue { margin-top: 2px; }
.qc-finished .qc-foot { position: static; }
.qc-finished .qc-fb { animation: none; }

/* Phone review: the panel becomes a sheet across the full width of the screen. */
:root:not([data-layout="laptop"]) .qc-review .qc-fb {
  margin: 0 -16px; border-radius: 22px 22px 0 0; border-width: 1.5px 0 0;
  padding: 18px 16px calc(16px + env(safe-area-inset-bottom, 0px));
  box-shadow: 0 -8px 24px rgba(23, 50, 77, .08);
}

/* ---------- grade: auto line + override picker ---------- */
.qc-grade { display: flex; flex-direction: column; gap: 10px; }
.qc-grade-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.qc-grade-line { flex: 1; min-width: 0; font: 600 .875rem/1.4 var(--sans); color: var(--ink); }
.qc-grade-name { color: var(--muted); font-weight: 600; }
.qc-change {
  min-height: 44px; padding: 6px 4px; border: 0; background: none; cursor: pointer;
  font: 700 .875rem/1.2 var(--sans); color: var(--heading); text-decoration: underline; text-underline-offset: 3px;
}
.qc-grades { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
/* Two by two when the row would crack: narrow screens, or large text on a phone. */
@container view (max-width: 307px) { .qc-grades { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@container view (max-width: 388px) { :root[data-size="l"] .qc-grades, :root[data-size="xl"] .qc-grades { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
/* All four keep one height; Claude's pick is a small badge inside that height, so marking it
   never moves the buttons. */
.qc-g {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  min-height: 4rem; padding: 6px 4px 1.3rem; border-radius: 14px; cursor: pointer;
  border: 1.5px solid var(--line-strong); background: var(--surface); color: var(--heading);
  box-shadow: 0 2px 0 var(--line);
}
.qc-g:active:not([disabled]) { transform: translateY(1px); box-shadow: none; }
.qc-g[aria-pressed="true"] { background: var(--heading); border-color: var(--heading); color: var(--on-heading); box-shadow: none; }
.qc-g-label { font: 700 .9375rem/1.2 var(--sans); }
.qc-g-days { font: 600 .75rem/1.2 var(--sans); opacity: .8; }
.qc-g-claude {
  position: absolute; left: 50%; bottom: 4px; transform: translateX(-50%); padding: 0 6px; border: 1px solid currentColor; border-radius: 999px;
  font: 700 .75rem/1.25 var(--sans); color: var(--teal); white-space: nowrap;
}
.qc-g[aria-pressed="true"] .qc-g-claude { color: inherit; }
.qc-pick-note { margin-top: -6px; }

/* ---------- choice ---------- */
.qc-opt { display: flex; align-items: center; gap: 12px; }
.qc-opt-text { flex: 1; min-width: 0; }
.qc-mark { flex: none; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; color: var(--surface); }
.qc-mark svg { width: 17px; height: 17px; }
.qc-mark.good { background: var(--green); }
.qc-mark.bad { background: var(--red); }
.option.qc-dim { opacity: .55; }
.option.correct, .option.wrong { color: var(--ink); }

/* ---------- order ---------- */
.qc-order { display: flex; flex-direction: column; gap: 10px; }
.qc-seq, .qc-right-order { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.qc-step-btn, .qc-step.correct, .qc-step.wrong, .qc-slot {
  display: flex; align-items: center; gap: 12px; width: 100%; min-height: 54px; padding: 10px 14px;
  border-radius: 16px; text-align: left; font: 600 1rem/1.4 var(--sans); color: var(--ink);
}
.qc-step-btn { border: 1.5px solid var(--heading); background: var(--surface); cursor: pointer; animation: qc-place .2s ease-out; }
@keyframes qc-place { from { transform: translateY(6px); opacity: .3; } to { transform: none; opacity: 1; } }
.qc-step.correct { border: 1.5px solid var(--green); background: var(--green-tint); }
.qc-step.wrong { border: 1.5px solid var(--red); background: var(--red-tint); }
.qc-slot { border: 1.5px dashed var(--line-strong); color: var(--muted); }
.qc-step-text { flex: 1; min-width: 0; }
.qc-num {
  flex: none; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%;
  background: var(--heading); color: var(--on-heading); font: 800 .875rem/1 var(--sans);
}
.qc-slot .qc-num { background: transparent; border: 1.5px dashed var(--line-strong); color: var(--muted); }
.qc-order-tools { display: flex; justify-content: flex-end; min-height: 44px; margin: -4px 0 -6px; }
.qc-undo[disabled] { visibility: hidden; }
.qc-pool { display: grid; gap: 8px; }
.option.qc-chip { min-height: 54px; padding: 12px 16px; border-style: solid; }
.qc-right-order li { display: flex; align-items: flex-start; gap: 12px; font: 600 .9375rem/1.45 var(--sans); }
.qc-right-order .qc-num { width: 26px; height: 26px; font-size: .8125rem; }
.qc-right-order li.moved .qc-num { background: var(--red); color: var(--surface); }
.qc-had { display: block; font-weight: 600; font-size: .875rem; color: var(--red); }

/* ---------- estimate ---------- */
.qc-est { display: flex; flex-direction: column; gap: 6px; padding: 8px 0 4px; }
.qc-est-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.qc-est-value { flex: 1; text-align: center; color: var(--heading); font-variant-numeric: tabular-nums; }
.qc-est-num { font: 800 2.1rem/1.1 var(--sans); letter-spacing: -.02em; }
.qc-est-unit { font: 700 1.05rem/1.1 var(--sans); }
.qc-nudge { width: 48px; height: 48px; font: 700 1.5rem/1 var(--sans); }
.qc-nudge[disabled] { opacity: .4; }
.qc-track-wrap { --qc-thumb: 34px; position: relative; height: 56px; margin-top: 22px; }
.qc-track {
  position: absolute; left: calc(var(--qc-thumb) / 2); right: calc(var(--qc-thumb) / 2); top: 50%;
  height: 10px; margin-top: -5px; border-radius: 999px; background: var(--sunk); box-shadow: inset 0 0 0 1px var(--line);
}
.qc-band {
  position: absolute; top: 50%; height: 22px; margin-top: -11px; min-width: 6px; transform: translateX(-3px);
  padding: 0 3px; box-sizing: content-box;
  border-radius: 8px; background: color-mix(in srgb, var(--teal) 22%, transparent); border: 1.5px solid var(--teal);
}
.qc-ans { position: absolute; top: 50%; width: 4px; height: 34px; margin: -17px 0 0 -2px; border-radius: 2px; background: var(--teal); }
.qc-ans-tag {
  position: absolute; top: -20px; white-space: nowrap;
  font: 700 .8125rem/1.2 var(--sans); color: var(--teal);
}
.qc-range {
  -webkit-appearance: none; appearance: none; position: absolute; inset: 0;
  width: 100%; height: 100%; margin: 0; padding: 0; background: transparent; cursor: pointer;
}
.qc-range:focus { outline: none; }
.qc-range::-webkit-slider-runnable-track { height: 56px; background: transparent; border: 0; }
.qc-range::-moz-range-track { height: 56px; background: transparent; border: 0; }
.qc-range::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: var(--qc-thumb); height: var(--qc-thumb); margin-top: calc((56px - var(--qc-thumb)) / 2);
  border-radius: 50%; background: var(--heading); border: 4px solid var(--surface); box-shadow: 0 2px 8px rgba(0, 0, 0, .28);
}
.qc-range::-moz-range-thumb {
  width: var(--qc-thumb); height: var(--qc-thumb); box-sizing: border-box;
  border-radius: 50%; background: var(--heading); border: 4px solid var(--surface); box-shadow: 0 2px 8px rgba(0, 0, 0, .28);
}
.qc-range:focus-visible::-webkit-slider-thumb { outline: 3px solid var(--teal); outline-offset: 2px; }
.qc-range[disabled] { cursor: default; }
/* After locking in, Dan's guess becomes a ring so the band and the answer line show through. */
.is-right .qc-range::-webkit-slider-thumb { background: color-mix(in srgb, var(--green) 14%, transparent); border-color: var(--green); }
.is-wrong .qc-range::-webkit-slider-thumb { background: color-mix(in srgb, var(--red) 14%, transparent); border-color: var(--red); }
.is-right .qc-range::-moz-range-thumb { background: color-mix(in srgb, var(--green) 14%, transparent); border-color: var(--green); }
.is-wrong .qc-range::-moz-range-thumb { background: color-mix(in srgb, var(--red) 14%, transparent); border-color: var(--red); }
.qc-scale { display: flex; justify-content: space-between; gap: 8px; font: 600 .8125rem/1.3 var(--sans); color: var(--muted); }

/* ---------- target ---------- */
.qc-goal { font-size: 1rem; line-height: 1.5; }
.qc-goal strong { color: var(--heading); }
.qc-stage { min-height: 280px; border-radius: var(--r); overflow: hidden; background: var(--surface); border: 1px solid var(--line); }
.qc-stage iframe { display: block; width: 100%; border: 0; }
.qc-hint { margin-bottom: 2px; display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border-radius: 14px; background: var(--red-tint); font-size: 1rem; line-height: 1.5; animation: qc-up .25s ease-out; }
.qc-unavailable { flex-direction: column; }

/* ---------- recall ---------- */
.qc-recall-input { min-height: 140px; font-size: 1.0625rem; }
.qc-recall-input.qc-locked { background: var(--sunk); border-color: var(--line); }
.qc-model { padding: 12px 14px; border-radius: 14px; background: var(--amber); }
.qc-rubric { display: flex; flex-direction: column; gap: 6px; }
.qc-points { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.qc-point { display: flex; align-items: flex-start; gap: 10px; font: 500 .9375rem/1.45 var(--sans); }
.qc-dot {
  flex: none; display: grid; place-items: center; width: 22px; height: 22px; margin-top: 1px; border-radius: 50%;
  border: 2px solid var(--line-strong); color: var(--surface);
}
.qc-dot svg { width: 14px; height: 14px; }
.qc-point.met .qc-dot { background: var(--green); border-color: var(--green); }
.qc-point.missed .qc-dot { border-color: var(--red); }
.qc-claude { display: flex; flex-direction: column; gap: 6px; min-height: 22px; }
/* In review the verdict's space is kept from the start, so the grade buttons and Continue stay put
   when Claude's grade arrives. */
.qc-review .qc-claude { min-height: 6rem; }
.qc-claude .working { max-width: 160px; }
.qc-verdict { display: inline-flex; align-items: center; gap: 6px; font: 700 1rem/1.3 var(--sans); }
.qc-verdict svg { width: 20px; height: 20px; }
.qc-verdict.good { color: var(--green); }
.qc-verdict.mid { color: var(--heading); }
.qc-verdict.bad { color: var(--red); }
.qc-follow { display: flex; flex-direction: column; gap: 4px; }
/* Dan's words from the lesson, folded away: a row with a chevron, like the lesson's disclosures,
   so it reads as something to open rather than a heading. */
.qc-mine { border-block: 1px solid var(--line); }
.qc-mine summary {
  list-style: none; min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  cursor: pointer; font: 700 .875rem/1.3 var(--sans); color: var(--heading);
}
.qc-mine summary::-webkit-details-marker { display: none; }
.qc-chev { flex: none; display: grid; place-items: center; color: var(--muted); }
.qc-chev svg { width: 20px; height: 20px; transform: rotate(-90deg); transition: transform .2s ease; }
.qc-mine[open] .qc-chev svg { transform: rotate(90deg); }
.qc-mine p { padding: 0 0 12px; font-size: .9375rem; line-height: 1.55; color: var(--muted); white-space: pre-wrap; }

/* ---------- Today ---------- */
.td { display: flex; flex-direction: column; gap: 18px; }
.td-loading { display: flex; flex-direction: column; gap: 16px; padding-top: 8px; }
.td-date { margin-bottom: -10px; }
.td-lead { font-size: 1.0625rem; line-height: 1.6; color: var(--ink); max-width: 34em; }
.td-plan { display: flex; flex-direction: column; gap: 6px; }
.td-count { display: flex; align-items: baseline; flex-wrap: wrap; gap: 0 10px; color: var(--heading); }
.td-count-n { font: 800 3.2rem/1 var(--sans); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.td-count-word { font: 700 1.15rem/1.3 var(--sans); }
.td-meta { font-size: .9375rem; }
/* The switch itself is the shared .switch (70-views.css), the same one Settings uses. */
.td-light { display: flex; align-items: center; gap: 14px; margin: 10px 0 8px; padding: 14px 0 4px; border-top: 1px solid var(--line); cursor: pointer; min-height: 56px; }
.td-light-text { flex: 1; display: flex; flex-direction: column; gap: 2px; color: var(--heading); }
.td-start svg { width: 20px; height: 20px; }

.td-clear { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; padding: 24px 0 8px; }
.td-clear .td-lead { max-width: 28em; }
.td-done-mark { display: grid; place-items: center; width: 64px; height: 64px; border-radius: 50%; background: var(--green); color: var(--surface); margin-bottom: 4px; }
.td-done-mark svg { width: 34px; height: 34px; }
.td-actions { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 420px; margin: 8px auto 0; }
.td-more-note { max-width: 26em; }

.td-relearn { display: flex; flex-direction: column; gap: 8px; }
.td-relearn-lead { font-size: .9375rem; line-height: 1.55; }
.td-relearn-list { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 8px; }
.td-relearn-link {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; min-height: 60px; padding: 12px 14px; border-radius: 14px;
  border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); text-decoration: none;
}
.td-relearn-text { flex: 1 1 210px; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.td-relearn-text strong { color: var(--heading); font-size: .9375rem; }
.td-relearn-go { flex: none; display: inline-flex; align-items: center; gap: 4px; font: 700 .875rem/1.2 var(--sans); color: var(--heading); }
.td-relearn-go svg { width: 18px; height: 18px; }

.td-week { display: flex; flex-direction: column; gap: 10px; padding-top: 6px; }
.td-week-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.td-days { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.td-day { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.td-day-name { font: 700 .75rem/1 var(--sans); color: var(--muted); }
.td-day-dot { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--line); color: var(--on-heading); }
.td-day-dot svg { width: 16px; height: 16px; }
.td-day.on .td-day-dot { background: var(--heading); border-color: var(--heading); }
.td-day.today .td-day-name { color: var(--heading); }
.td-day.today .td-day-dot { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--heading); }
.td-day.future .td-day-dot { border-style: dashed; opacity: .6; }

/* ---------- review session ---------- */
.rv { display: flex; flex-direction: column; gap: 8px; min-height: calc(100vh - var(--topbar-h) - 20px); min-height: calc(100dvh - var(--topbar-h) - 20px); }
.focus .view:has(> .rv) { padding-bottom: 0; }
/* Close and progress stay in reach while the feedback panel is open. */
.rv-top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 8px 16px; margin: -8px -16px 0; background: var(--bg); }
.rv-close { flex: none; }
.rv-close svg { width: 20px; height: 20px; }
.rv-bar { flex: 1; }
.rv-count { flex: none; min-width: 3.5em; text-align: right; font: 700 .8125rem/1 var(--sans); color: var(--muted); font-variant-numeric: tabular-nums; }
.rv-where { min-height: 20px; margin: 4px 0 -4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 600 .875rem/1.4 var(--sans); color: var(--muted); }
.rv-stage { flex: 1; display: flex; flex-direction: column; padding-top: 4px; }
.rv-stage > .qc { flex: 1; }
.rv-loading { height: 220px; margin-top: 40px; opacity: .6; }
.rv-wait { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 60px 0; }
.rv-wait .working { width: 160px; }
.rv-done { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; padding: 24px 0 40px; }
/* Everything in the summary shares one width, so tiles, list, card and buttons line up. */
.rv-done > * { width: 100%; max-width: 560px; }
.rv-done > .td-done-mark { width: 64px; }
.rv-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 4px 0 0; }
.rv-stats > div { padding: 14px 10px; border-radius: var(--r); background: var(--surface); box-shadow: var(--shadow); }
.rv-stats dt { font: 700 .75rem/1.3 var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--teal); }
.rv-stats dd { margin: 4px 0 0; font: 800 2rem/1 var(--sans); color: var(--heading); font-variant-numeric: tabular-nums; }
.rv-back { text-align: left; display: flex; flex-direction: column; gap: 6px; }
.rv-back-count { font-size: .9375rem; color: var(--muted); }
.rv-back ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: .9375rem; }
.rv-done .td-relearn { text-align: left; }

:root[data-layout="laptop"] .qc-q { font-size: 1.35rem; }
:root[data-layout="laptop"] .qc-review .qc-foot.qc-foot-fb { padding-bottom: 20px; }

/* ---------- laptop review: use the width ----------
   The question and answers keep a column on the left, Check follows the answers, and the
   feedback appears beside them, so the question, Dan's answer and the feedback share one
   screen. A target card keeps its interactive in that column with the goal and Check beside it;
   only an interactive whose K.stage puts the controls beside the picture (.qc-wide, which the
   kit reports) gets the full width, with the goal and Check docked under it. These follow the
   width the review actually gets, so a narrow laptop window keeps the phone shapes. */
:root[data-layout="laptop"] .view[data-screen="review"] { max-width: 1120px; }
@container view (min-width: 900px) {
  /* The last row soaks up the card's spare height, so a tall panel beside never spreads the
     question and answers apart. */
  .qc-review {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 400px); grid-template-rows: auto auto auto 1fr;
    column-gap: 48px; row-gap: 14px; align-content: start;
  }
  .qc-review > * { grid-column: 1; }
  .qc-review .qc-foot { position: static; align-self: start; margin-top: 0; padding: 6px 0 0; background: none; }
  /* The panel lines up with the question, beside the answers it marks. */
  .qc-review .qc-foot.qc-foot-fb { grid-column: 2; grid-row: 2 / -1; padding-top: 0; }

  /* Target card: the goal, the hint and Check (then the feedback) sit beside the interactive,
     held just under the review bar (60 px) while Dan scrolls a tall interactive, so they never
     cover a control or the readout he is aiming at. They let go (reveal() in 41-cards.js) only
     when the panel cannot fit below the bar. The hint restates the goal, and the aim shows only
     once the goal's number has left the screen (.qc-goal-away), so it never shows twice. */
  .qc-review.qc-type-target > .qc-foot { position: sticky; top: 76px; bottom: auto; grid-column: 2; grid-row: 2 / -1; padding: 0; }
  .qc-review.qc-type-target > .qc-foot > .qc-hint:not([hidden]) + .qc-aim,
  .qc-review.qc-type-target:not(.qc-goal-away) > .qc-foot > .qc-aim { display: none; }
  .qc-review.qc-type-target > .qc-foot.qc-unstick { position: static; }

  /* A K.stage that goes side by side gets the full width, and the goal and Check dock in one row
     under it: the aim (once the goal's number has left the screen) or, after a miss, the hint
     beside the button, so the bar stays low. */
  .qc-review.qc-wide > .qc-body { grid-column: 1 / -1; }
  .qc-review.qc-wide > .qc-foot {
    grid-column: 1 / -1; grid-row: auto; align-self: end; top: auto; bottom: 0; z-index: 4;
    padding: 18px 0 16px; background: linear-gradient(to bottom, transparent, var(--bg) 20px);
  }
  .qc-review.qc-wide > .qc-foot:not(.qc-foot-fb) { display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, 340px); align-items: center; gap: 10px 24px; }
  .qc-review.qc-wide > .qc-foot > .qc-hint, .qc-review.qc-wide > .qc-foot > .qc-aim { grid-column: 1; grid-row: 1; margin: 0; }
  .qc-review.qc-wide > .qc-foot > .qc-aim { justify-self: end; text-align: right; }
  .qc-review.qc-wide > .qc-foot > .btn { grid-column: 2; }
  /* After Check: the panel docks where the button was, a reading width wide. */
  .qc-review.qc-wide > .qc-foot.qc-foot-fb { padding: 8px 0 20px; background: none; }
  .qc-review.qc-wide > .qc-foot.qc-unstick { position: static; }
  .qc-review.qc-wide .qc-fb { width: 100%; max-width: 720px; margin-inline: auto; }
}
:root[data-layout="laptop"] .td-actions { flex-direction: row; }
:root[data-layout="laptop"] .td-actions .btn { flex: 1; }

/* src/css/50-lesson.css */
/* Lesson screen (50-lesson.js) and the Ask Claude sheet (51-tutor.js).
   One focus per stage: generous vertical rhythm, chunky actions, the interactive in a rounded
   panel with its height reserved so nothing jumps while it loads. Colour only for meaning:
   navy = progress and controls, green = completion, red = disagreement and problems,
   amber = "remember this", teal = small labels. */

/* --lsn-hrem is the rem for headings: it grows half as fast with Text size (16 px at M, 18 px at
   XL instead of 20), so at L and XL a long question still leaves room on screen for the answers. */
.lsn { --lsn-bar-h: 56px; --lsn-hrem: calc(.5rem + 8px); padding-bottom: 8px; }

/* ---------- sticky bar: close, segmented progress, Ask ---------- */
.lsn-bar {
  position: sticky; top: calc(var(--topbar-h) + env(safe-area-inset-top, 0px)); z-index: 15;
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px;
  min-height: var(--lsn-bar-h); margin: -20px -16px 0; padding: 6px 16px;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.lsn-close { border-color: var(--line); }
.lsn-close svg { width: 22px; height: 22px; }
.lsn-steps { position: relative; min-width: 0; }
.lsn-steps-row { display: flex; gap: 4px; }
.lsn-step {
  flex: 1; min-width: 0; height: 44px; padding: 12px 0 0; border: 0; background: none; cursor: pointer;
  display: flex; flex-direction: column; justify-content: flex-start;
}
.lsn-step[disabled] { cursor: default; }
.lsn-step > i { display: block; height: 6px; border-radius: 3px; background: var(--sunk); transition: background-color .35s ease; }
.lsn-step.is-done > i { background: var(--heading); }
.lsn-step.is-now > i { background: linear-gradient(90deg, var(--heading) 0 45%, color-mix(in srgb, var(--heading) 24%, var(--sunk)) 45% 100%); }
.lsn-step.is-all > i { background: var(--green); }
.lsn-step:focus-visible { outline-offset: -2px; }
.lsn-steps-label {
  position: absolute; left: 0; right: 0; bottom: 3px; pointer-events: none;
  font: 700 .75rem/1.2 var(--sans); letter-spacing: .07em; text-transform: uppercase; color: var(--teal);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.lsn-bar.is-all .lsn-steps-label { color: var(--green); }
.lsn-ask {
  display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px 0 11px;
  border-radius: 999px; border: 1.5px solid var(--line-strong); background: var(--surface); color: var(--heading);
  font: 700 .9375rem/1 var(--sans); cursor: pointer; box-shadow: 0 2px 0 var(--line);
}
.lsn-ask:active { transform: translateY(1px); box-shadow: none; }
.lsn-ask svg { width: 20px; height: 20px; flex: none; }
.lsn-wide { display: none; }
@container view (min-width: 528px) { .lsn-wide { display: inline; } }

/* ---------- heading ---------- */
.lsn-head { display: flex; flex-direction: column; gap: 10px; padding: 28px 0 4px; }
.lsn-eb { min-height: 17px; }
/* "Topic name · Idea 1 of 5" on one line. When both don't fit (a narrow phone at XL, a long
   name), the name drops out whole rather than wrapping: the row runs right to left with the count
   placed first, so the name is what wraps to a second line, and that line is clipped. The DOM
   keeps name, then count, for screen readers. */
.lsn-eb.is-filled { display: flex; flex-flow: row-reverse wrap; justify-content: flex-end; max-height: 1.4em; overflow: hidden; }
.lsn-eb-topic::after { content: "\00a0·\00a0"; }
.lsn-eb-n { order: -1; white-space: nowrap; }
.lsn-title { font-size: clamp(calc(1.65 * var(--lsn-hrem)), 6.6vw, calc(2.15 * var(--lsn-hrem))); font-size: clamp(calc(1.65 * var(--lsn-hrem)), 6.6cqi, calc(2.15 * var(--lsn-hrem))); }
.lsn-one { color: var(--muted); font-size: 1.0625rem; line-height: 1.5; max-width: 34em; }
.lsn-sk-eb { display: inline-block; width: 46%; height: 12px; vertical-align: middle; }
.lsn-sk-h1 { display: block; width: 78%; height: 32px; }

/* ---------- stages ---------- */
.lsn-flow { display: flex; flex-direction: column; }
.lsn-stage, .lsn-past { scroll-margin-top: calc(var(--topbar-h) + var(--lsn-bar-h) + 12px); }
.lsn-stage { display: flex; flex-direction: column; gap: 18px; padding: 40px 0 8px; }
.lsn-stage + .lsn-stage { margin-top: 32px; border-top: 1px solid var(--line); }
.lsn-past + .lsn-stage { margin-top: 12px; }
.lsn-stage > .eyebrow { margin-bottom: -10px; }
.lsn-h { font-size: calc(1.35 * var(--lsn-hrem)); line-height: 1.3; }
.lsn-h:focus { outline: none; }
.lsn-lede { color: var(--muted); font-size: 1rem; line-height: 1.55; max-width: 36em; }
.lsn-go { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; margin-top: 6px; }
.lsn-go > .btn svg { width: 20px; height: 20px; }
@container view (max-width: 527px) {
  .lsn-go > .btn { flex: 1 1 100%; }
  .lsn-go > .linkish { margin-inline: auto; }
}
.lsn-options .option { font-size: 1.0625rem; }
.lsn-stage .input { font-size: 1.0625rem; }

/* earlier stages, collapsed on resume but reviewable */
.lsn-flow > .lsn-past:first-child { margin-top: 24px; }
.lsn-past { margin-top: 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.lsn-past > summary {
  list-style: none; display: grid; grid-template-columns: 30px minmax(0, 1fr) 22px; align-items: center; gap: 12px;
  min-height: 62px; padding: 10px 14px; cursor: pointer; border-radius: var(--r);
}
.lsn-past > summary::-webkit-details-marker { display: none; }
.lsn-past-tick { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--sunk); color: var(--heading); }
.lsn-past-tick svg { width: 17px; height: 17px; }
.lsn-past-label { display: block; font: 700 .75rem/1.3 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--teal); }
/* The summary wraps: the script already shortens it at a word ("…"), so no word is cut in half.
   Three lines at most, for a very large text size. */
.lsn-past-sum { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; margin-top: 2px; font: 500 .9375rem/1.4 var(--sans); color: var(--ink); }
.lsn-chev { display: grid; place-items: center; color: var(--muted); }
.lsn-chev svg { width: 20px; height: 20px; transform: rotate(-90deg); transition: transform .2s ease; }
details[open] > summary .lsn-chev svg { transform: rotate(90deg); }
.lsn-past-body { display: flex; flex-direction: column; gap: 16px; padding: 6px 16px 22px; border-top: 1px solid var(--line); }
.lsn-past-body > :first-child { margin-top: 16px; }
.lsn-past-body .lsn-h { font-size: calc(1.15 * var(--lsn-hrem)); }

/* ---------- preparing ---------- */
.lsn-prep { display: flex; flex-direction: column; gap: 14px; margin-top: 28px; padding: 20px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); }
.lsn-flow:not(:empty) + .lsn-prep-slot .lsn-prep { margin-top: 40px; }
.lsn-panel .lsn-prep { margin: 0; padding: 0; border: 0; background: none; }
.lsn-prep-head { font: 700 1.0625rem/1.3 var(--sans); color: var(--heading); }
.lsn-prep-lines { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.lsn-prep-lines li { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 10px; align-items: start; font-size: .9688rem; line-height: 1.45; }
.lsn-prep-lines li.is-done { color: var(--muted); }
.lsn-prep-mark { display: grid; place-items: center; height: 22px; }
.lsn-prep-mark i { width: 9px; height: 9px; border-radius: 50%; background: var(--heading); animation: lsn-breathe 1.6s ease-in-out infinite; }
.lsn-prep-mark svg { display: none; width: 17px; height: 17px; color: var(--teal); }
.lsn-prep-lines li.is-done .lsn-prep-mark i, .lsn-prep-lines li.is-failed .lsn-prep-mark i { display: none; }
.lsn-prep-lines li.is-done .lsn-prep-mark .lsn-prep-ok { display: block; }
/* The step that failed: a red cross, never a tick. */
.lsn-prep-lines li.is-failed { color: var(--red); }
.lsn-prep-lines li.is-failed .lsn-prep-mark .lsn-prep-x { display: block; color: var(--red); }
.lsn-prep-slow { color: var(--muted); font-size: .875rem; }
@keyframes lsn-breathe { 0%, 100% { opacity: .35; transform: scale(.8); } 50% { opacity: 1; transform: scale(1); } }

/* ---------- play ---------- */
.lsn-play { display: flex; flex-direction: column; gap: 10px; }
@container view (max-width: 527px) { .lsn-play > .lsn-panel { margin-inline: -6px; } }
.lsn-panel { position: relative; }
.lsn-panel.is-waiting { min-height: 240px; padding: 20px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
.lsn-panel-foot { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding-inline: 4px; }
.lsn-panel-foot:empty { display: none; }
.lsn-selfcheck { display: inline-flex; align-items: center; gap: 6px; font: 600 .8125rem/1.3 var(--sans); color: var(--muted); }
.lsn-selfcheck svg { width: 16px; height: 16px; color: var(--teal); }
.lsn-selfwarn { font-size: .875rem; line-height: 1.5; padding: 10px 14px; }
.lsn-none { display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: var(--r); background: var(--sunk); }
.lsn-none-head { font: 700 1rem/1.3 var(--sans); color: var(--heading); }
.lsn-after { display: flex; flex-direction: column; gap: 16px; }
.lsn-after:empty { display: none; }

/* disclosures: "What am I looking at?", "What this model ignores", sources */
.lsn-discs { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.lsn-discs:empty { display: none; }
.lsn-disc { border-bottom: 1px solid var(--line); }
.lsn-disc > summary {
  list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  min-height: 54px; cursor: pointer; font: 700 1rem/1.3 var(--sans); color: var(--heading);
}
.lsn-disc > summary::-webkit-details-marker { display: none; }
.lsn-disc-body { display: flex; flex-direction: column; gap: 14px; padding: 0 0 20px; font-size: 1rem; line-height: 1.65; }
.lsn-disc-text p + p { margin-top: .8em; }
.lsn-nums { display: flex; flex-direction: column; margin: 0; border-radius: var(--r-sm); background: var(--sunk); padding: 4px 14px; }
.lsn-num { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 12px; padding: 10px 0; }
.lsn-num + .lsn-num { border-top: 1px solid var(--line); }
.lsn-num-options { flex-basis: 100%; margin: 0; color: var(--muted); font-size: .875rem; line-height: 1.45; }
.lsn-num dt { font-weight: 600; color: var(--ink); }
.lsn-num dd { margin: 0; display: inline-flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; }
.lsn-num-val { font: 700 .9375rem/1.4 var(--mono); color: var(--heading); }
.lsn-num-now { font: 700 .875rem/1.4 var(--mono); color: var(--teal); }
.lsn-num-kind { font: 600 .75rem/1.3 var(--sans); color: var(--teal); }

/* predict vs what happens */
.lsn-reveal { display: grid; gap: 12px; }
@container view (min-width: 528px) { .lsn-reveal { grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); align-items: start; } }
.lsn-reveal-guess { padding: 16px 18px; border-radius: var(--r); border: 1.5px dashed var(--line-strong); }
.lsn-reveal-guess.is-right { border-style: solid; border-color: color-mix(in srgb, var(--green) 55%, var(--line)); }
.lsn-reveal .lsn-called { display: flex; align-items: center; gap: 6px; margin-top: 8px; font: 700 .9375rem/1.3 var(--sans); color: var(--green); }
.lsn-called svg { width: 18px; height: 18px; flex: none; }
.lsn-reveal .eyebrow { margin-bottom: 6px; }
.lsn-reveal p:not(.eyebrow) { font-size: 1.0625rem; line-height: 1.55; }
.lsn-reveal-text p + p { margin-top: .6em; }

/* ---------- explain ---------- */
/* The explanation is the main reading: about 65-70 characters a line of Literata on a laptop
   (the analogy and sources below keep the wider column). A phone column is narrower anyway. */
.lsn-reading p { max-width: 33em; }
.lsn-quiet { padding: 2px 0 2px 12px; border-left: 3px solid var(--line-strong); color: var(--muted); font-size: .875rem; line-height: 1.55; }
.lsn-quiet strong { color: var(--ink); font-weight: 700; }
.lsn-analogy { display: flex; flex-direction: column; gap: 8px; padding: 18px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); }
.lsn-analogy-text { font: 400 calc(var(--fs) - 1px)/1.7 var(--serif); }
.lsn-breaks { margin-top: 8px; padding-top: 12px; border-top: 1px dashed var(--line-strong); font: 400 calc(var(--fs) - .0625rem)/1.65 var(--serif); color: var(--ink); }
.lsn-breaks .eyebrow { margin-bottom: 4px; }
.lsn-contest { display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: var(--r); border: 1.5px solid color-mix(in srgb, var(--red) 38%, var(--line)); }
.lsn-flag {
  align-self: flex-start; padding: 5px 11px; border-radius: 999px; background: var(--red-tint); color: var(--red);
  font: 800 .75rem/1.3 var(--sans); letter-spacing: .08em; text-transform: uppercase;
}
.lsn-contest-lede { color: var(--muted); font-size: .9375rem; }
.lsn-views { display: grid; gap: 12px; }
@container view (min-width: 528px) { .lsn-views { grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); } }
.lsn-view { display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border-radius: var(--r-sm); background: var(--surface); border: 1px solid var(--line); }
.lsn-view-text { font-size: .9688rem; line-height: 1.6; }
.lsn-sources { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.lsn-source-btn {
  display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; align-items: start; width: 100%; min-height: 44px; padding: 8px 0;
  border: 0; background: none; text-align: left; cursor: pointer; color: var(--ink); font: 600 .9375rem/1.4 var(--sans);
}
.lsn-source-n { display: grid; place-items: center; height: 22px; border-radius: 6px; background: var(--teal-tint); color: var(--teal); font: 700 .75rem/1 var(--sans); }
.lsn-source-host { display: block; color: var(--muted); font-weight: 500; font-size: .8125rem; }

/* source sheet */
.lsn-src { display: flex; flex-direction: column; gap: 14px; }
.lsn-quote { margin: 0; padding: 4px 0 4px 16px; border-left: 3px solid var(--teal); font: italic 400 1.0625rem/1.65 var(--serif); color: var(--ink); }
.lsn-src-go { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.lsn-src-link svg { width: 18px; height: 18px; }
.lsn-src-host { min-width: 0; color: var(--muted); font-size: .875rem; overflow-wrap: anywhere; }

/* ---------- say it back ---------- */
.lsn-say-log { display: flex; flex-direction: column; gap: 18px; }
.lsn-say-log:empty { display: none; }
.lsn-attempt { display: flex; flex-direction: column; gap: 10px; }
.lsn-bubble { align-self: flex-end; max-width: 92%; padding: 12px 16px; border-radius: 18px 18px 6px 18px; background: var(--sunk); }
.lsn-bubble-label { font: 700 .75rem/1.3 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--teal); margin-bottom: 4px; }
.lsn-bubble-text { font-size: 1rem; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
.lsn-grading { display: flex; flex-direction: column; gap: 8px; color: var(--muted); font-size: .9375rem; }
.lsn-grade { display: flex; flex-direction: column; gap: 10px; padding: 16px 18px; border-radius: var(--r); background: var(--surface); box-shadow: var(--shadow); }
.lsn-verdict { font: 800 1.0625rem/1.3 var(--sans); color: var(--heading); }
.lsn-nailed { font-size: 1rem; line-height: 1.55; }
.lsn-met { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.lsn-met li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; align-items: start; font-size: .9688rem; line-height: 1.45; }
.lsn-tick { width: 22px; height: 22px; color: var(--green); }
.lsn-ring { width: 18px; height: 18px; margin: 2px; border-radius: 50%; border: 2px solid var(--line-strong); }
.lsn-rubric li:not(.is-met) { color: var(--muted); }
.lsn-follow { display: flex; flex-direction: column; gap: 4px; margin-top: 2px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 1rem; line-height: 1.55; }
.lsn-model { display: flex; flex-direction: column; gap: 10px; }
.lsn-model-text { font: 400 calc(var(--fs) - 1px)/1.7 var(--serif); }
.lsn-model-text p + p { margin-top: .8em; }
.lsn-compose { display: flex; flex-direction: column; gap: 10px; }
.lsn-say-input { min-height: 132px; font-size: 1.0625rem; line-height: 1.5; }
.lsn-say-slot:empty { display: none; }

/* ---------- checks ---------- */
.lsn-checks { display: flex; flex-direction: column; gap: 32px; }
.lsn-check { display: flex; flex-direction: column; gap: 10px; scroll-margin-top: calc(var(--topbar-h) + var(--lsn-bar-h) + 12px); }
.lsn-check-count { font: 700 .75rem/1.3 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--teal); }
.lsn-check-list { margin: 0; padding: 0 0 0 20px; display: flex; flex-direction: column; gap: 12px; }
.lsn-check-list li { font-size: .9688rem; line-height: 1.5; }
.lsn-check-q { display: block; }
.lsn-check-res { display: inline-block; margin-top: 4px; font: 700 .8125rem/1.3 var(--sans); color: var(--muted); }
.lsn-check-res.is-right { color: var(--green); }
.lsn-check-res.is-wrong { color: var(--red); }

/* ---------- done ---------- */
.lsn-done { align-items: center; text-align: center; }
/* Same size as U.cheer's bubble: on a first finish the section is scrolled so this mark sits where
   the cheer pops (38% down the viewport), and the bubble fades into it. */
.lsn-done-mark { width: 76px; height: 76px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--green); color: var(--bg); box-shadow: 0 8px 24px color-mix(in srgb, var(--green) 30%, transparent); }
.lsn-done-mark svg { width: 40px; height: 40px; }
.lsn-stage.lsn-done.is-fresh { scroll-margin-top: max(calc(var(--topbar-h) + var(--lsn-bar-h) + 12px), calc(38vh - 78px)); }
.lsn-done .lsn-h { font-size: calc(1.6 * var(--lsn-hrem)); }
.lsn-done-text { color: var(--muted); max-width: 30em; font-size: 1rem; line-height: 1.6; }
.lsn-done-text > span { display: block; text-wrap: balance; }
.lsn-done-score { color: var(--ink); font-weight: 700; }
.lsn-next { align-self: stretch; display: flex; flex-direction: column; gap: 8px; margin-top: 8px; padding: 20px; text-align: left; border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--shadow); }
.lsn-next h3 { font-size: 1.15rem; }
.lsn-next .lsn-go { margin-top: 10px; }
.lsn-again { margin-top: -4px; }

/* ---------- footer ---------- */
.lsn-foot { display: flex; flex-direction: column; align-items: center; margin-top: 56px; padding-top: 8px; border-top: 1px solid var(--line); }
.lsn-flag-link { color: var(--muted); font-size: .875rem; font-weight: 600; }
.lsn-flag-kept { color: var(--muted); font: 600 .875rem/1.4 var(--sans); text-align: center; }
.lsn-flag-kept svg { display: inline-block; width: 16px; height: 16px; margin-right: 6px; vertical-align: -3px; color: var(--teal); }
.lsn-missing-go { margin-top: 16px; }
.lsn-notice { margin-top: 16px; }

/* ---------- laptop ----------
   The interactive gets the full width (its controls sit beside the picture); everything you
   read keeps a comfortable line length, centred above and below it. */
@container view (min-width: 900px) {
  .lsn-head, .lsn-notice, .lsn-flow > .lsn-past, .lsn-prep-slot, .lsn-foot { width: 100%; max-width: var(--measure); margin-inline: auto; }
  .lsn-stage > * { width: 100%; max-width: var(--measure); align-self: center; }
  .lsn-stage > .lsn-play { max-width: none; }
  .lsn-done > .lsn-done-mark { width: 76px; }
  .lsn-done > .lsn-next { align-self: center; }
}

/* ---------- Ask Claude sheet ---------- */
.tutor-sheet { display: flex; flex-direction: column; height: min(88vh, 860px); padding-bottom: 0; }
.tutor-sheet > .sheet-in { flex: 1; width: 100%; min-height: 0; }
:root[data-layout="laptop"] .tutor-sheet { height: min(82vh, 720px); }
/* Before the first question there is only a line of welcome, the chips and the input: no tall
   empty sheet, and on a phone the lesson stays in view above it. */
.tutor-sheet.is-empty, :root[data-layout="laptop"] .tutor-sheet.is-empty { height: auto; }
.tutor { flex: 1; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.tutor-about { margin-top: -8px; color: var(--muted); font-size: .875rem; }
.tutor-log { flex: 1; display: flex; flex-direction: column; gap: 16px; padding-bottom: 8px; }
.tutor-empty { display: flex; flex-direction: column; gap: 8px; padding: 12px 0; color: var(--muted); font-size: .9688rem; line-height: 1.55; }
.tutor-empty-head { font: 700 1.0625rem/1.3 var(--sans); color: var(--heading); }
.tutor-msg.me { align-self: flex-end; max-width: 88%; padding: 10px 15px; border-radius: 18px 18px 6px 18px; background: var(--sunk); }
.tutor-msg.me p { font-size: 1rem; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
.tutor-msg.bot { max-width: 100%; }
.tutor-text { font: 400 1.0625rem/1.7 var(--serif); color: var(--ink); overflow-wrap: anywhere; }
.tutor-text p + p, .tutor-text ul { margin-top: .7em; }
.tutor-text ul { padding-left: 1.2em; }
.tutor-wait { display: flex; flex-direction: column; gap: 8px; max-width: 220px; color: var(--muted); font-size: .875rem; }
.tutor-dock {
  position: sticky; bottom: 0; z-index: 1; display: flex; flex-direction: column; gap: 10px;
  margin: 0 -20px; padding: 12px 20px calc(16px + env(safe-area-inset-bottom, 0px));
  background: var(--surface); border-top: 1px solid var(--line);
}
.tutor-chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -20px; padding: 0 20px; }
.tutor-chips::-webkit-scrollbar { display: none; }
.tutor-chips .chip { flex: none; min-height: 44px; }
.tutor-chips .chip[disabled] { opacity: .5; cursor: default; }
.tutor-compose { display: grid; grid-template-columns: minmax(0, 1fr) 52px; gap: 8px; align-items: end; }
.tutor-input.textarea { min-height: 52px; max-height: 160px; resize: none; padding-block: 13px; overflow-y: auto; }
.tutor-send {
  width: 52px; height: 52px; display: grid; place-items: center; border: 0; border-radius: 16px; cursor: pointer;
  background: var(--heading); color: var(--on-heading); box-shadow: 0 3px 0 color-mix(in srgb, var(--heading) 70%, #000);
}
.tutor-send:active:not([disabled]) { transform: translateY(2px); box-shadow: 0 1px 0 color-mix(in srgb, var(--heading) 70%, #000); }
.tutor-send[disabled] { opacity: .4; cursor: default; }
.tutor-send svg { width: 24px; height: 24px; }

/* src/css/70-views.css */
/* Views: Learn (home), topic page, Map, Book, reading settings and the boot notice.
   Calm by design: generous space, soft cards, colour only for meaning (navy = progress and
   controls, green = finished, red = warnings, teal = small labels, amber = highlights).
   Built only on the tokens in 00-tokens.css, so light, dark and text sizes all follow. */

/* ---------- shared ---------- */
.backlink {
  display: inline-flex; align-items: center; gap: 4px; align-self: flex-start;
  min-height: 44px; margin-left: -8px; padding: 0 10px 0 4px; border-radius: 12px;
  color: var(--heading); font: 700 .9375rem/1 var(--sans); text-decoration: none;
}
.backlink svg { width: 22px; height: 22px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.section-head h2 { font-size: 1.25rem; }
.page-head { display: flex; flex-direction: column; gap: 8px; margin: 8px 0 28px; }
.page-head h1 { font-size: clamp(1.8rem, 6.6vw, 2.4rem); font-size: clamp(1.8rem, 6.6cqi, 2.4rem); }
.page-head > p.muted { font-size: 1.0625rem; max-width: 34em; }
.v-empty { display: grid; justify-items: center; gap: 12px; text-align: center; padding: 36px 8px 24px; }
.v-empty p { max-width: 30em; color: var(--muted); }
.v-empty .btn { margin-top: 8px; }
.v-empty-art { display: grid; place-items: center; margin-bottom: 6px; }
.book-empty-art { width: 84px; height: 84px; border-radius: 50%; background: var(--teal-tint); color: var(--teal); }
.book-empty-art svg { width: 40px; height: 40px; }
.sk-line { height: 14px; margin: 6px 0; }
.sk-line.short { width: 55%; }
.sk-line.tall { height: 34px; width: 80%; }
/* Segmented control: one choice from a few (level, theme, text size, review cap). */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px; padding: 4px; border-radius: 16px; background: var(--sunk); }
.seg-btn {
  min-height: 44px; padding: 8px 6px; border: 0; border-radius: 12px; background: transparent; cursor: pointer;
  color: var(--heading); font: 700 .9062rem/1.2 var(--sans);
}
.seg-btn[aria-checked="true"] { background: var(--heading); color: var(--on-heading); box-shadow: 0 2px 0 color-mix(in srgb, var(--heading) 70%, #000); }
/* Icons inside buttons in these views (the base .btn leaves svg unsized). */
.learn .btn svg, .tp .btn svg, .v-empty .btn svg { flex: none; width: 20px; height: 20px; }
.done-note { display: inline-flex; align-items: center; gap: 6px; color: var(--green); font-weight: 700; }
.done-note svg { width: 18px; height: 18px; }
.bar.is-complete > i { background: var(--green); }

/* ---------- generated covers ---------- */
.cover { display: block; width: 100%; height: 100%; }
.cover .cv-bg { fill: color-mix(in oklab, hsl(var(--h) 40% 62%) 15%, var(--surface)); }
.cover .cv-1 { fill: color-mix(in oklab, hsl(var(--h) 40% 60%) 28%, var(--surface)); }
.cover .cv-2 { fill: color-mix(in oklab, hsl(var(--h) 38% 55%) 46%, var(--surface)); }
.cover .cv-3 { fill: color-mix(in oklab, hsl(var(--h) 36% 44%) 68%, var(--surface)); }
.cover .cv-4 { fill: var(--heading); }
.cover .cv-sun { fill: color-mix(in oklab, #F2C75C 70%, var(--surface)); }
.cover .cv-soft { opacity: .55; }
.cover .cv-ring { fill: none; stroke: color-mix(in oklab, hsl(var(--h) 38% 52%) 40%, var(--surface)); stroke-width: 2; }
.cover .cv-line { fill: none; stroke: color-mix(in oklab, hsl(var(--h) 38% 48%) 55%, var(--surface)); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: .1 7; }

/* ---------- Learn ---------- */
.learn { display: flex; flex-direction: column; gap: 36px; }
.learn-continue:empty, .learn-today:empty { display: none; }
.ask { display: flex; flex-direction: column; gap: 12px; padding-top: 8px; }
.ask h1 { font-size: clamp(2rem, 7.4vw, 2.7rem); font-size: clamp(2rem, 7.4cqi, 2.7rem); letter-spacing: -.025em; }
.ask-sub { font-size: 1.0625rem; max-width: 32em; }
.ask-form { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; --ask-h: max(60px, calc(1.125rem * 1.45 + 35px)); }
/* A textarea (rows=1) that 70-learn.js grows to three lines; one line is --ask-h tall. */
.ask-input.input { display: block; min-height: var(--ask-h); padding: 16px 18px; border-radius: 18px; font-size: 1.125rem; box-shadow: var(--shadow); border-color: var(--line); resize: none; overflow-y: hidden; }
.ask-input.input:focus { border-color: var(--heading); }
.ask-input::placeholder { color: color-mix(in srgb, var(--muted) 80%, transparent); }
.ask-go.btn { min-height: var(--ask-h); border-radius: 18px; font-size: 1.0625rem; white-space: nowrap; }
.ask-levels { max-width: 440px; }
.ask-levels .seg-btn { font-size: .875rem; }
.ask-working { display: grid; gap: 10px; padding: 2px 4px; }
.ask-row { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.ask-label { font: 700 .8125rem/1.3 var(--sans); color: var(--muted); }
.chip-soft { border-color: var(--line); color: var(--ink); font-weight: 500; }
.chip[disabled] { opacity: .55; cursor: default; }
/* Returning (any width): a compact ask, input and a round go button on one line, so reviews and
   Continue sit on the first screen. The level choice appears below it once Dan starts typing. */
.learn.is-returning { gap: 28px; }
.learn.is-returning .ask-sub, .learn.is-returning .ask-try { display: none; }
.learn.is-returning:not(.is-typing) .ask-level-row { display: none; }
.learn.is-returning .ask-level-row { order: 1; }
.learn.is-returning .ask-form { flex-direction: row; align-items: flex-end; }
.learn.is-returning .ask-input { flex: 1; min-width: 0; }
.learn.is-returning .ask-go:not(.is-busy) { flex: none; width: 60px; padding: 0; }
.learn.is-returning .ask-go:not(.is-busy) .ask-go-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.learn.is-returning .ask-go svg { width: 24px; height: 24px; }
.learn.is-returning .ask h1 { font-size: clamp(1.6rem, 5.4vw, 2rem); font-size: clamp(1.6rem, 5.4cqi, 2rem); }
.learn-note:empty { display: none; }
.v-load-error { align-items: center; }
.v-slow { padding: 4px 2px 12px; }
.v-load-error .working { max-width: 200px; margin-top: 4px; }
@container view (min-width: 568px) {
  .ask-form { flex-direction: row; align-items: flex-end; }
  .ask-form .ask-input { flex: 1; min-width: 0; }
