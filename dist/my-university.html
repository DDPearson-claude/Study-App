 the lesson. Never invent data, rates or chances.\n- The `.say` sentence describes what is on screen now, plainly and warmly, and reads right at the\n  extremes (\"none of the 100\", not \"0 of the 100\"). Never claim Dan did something (\"When you\n  slid it to 20\"); describe the state, or write conditionally (\"Push it past 20 and…\").\n- 3-5 `K.check` known answers worked out by hand: an edge case, a shape fact (rises, halves,\n  always last), and at least one answer from outside your formula (a worked example, an everyday\n  case, a value from the lesson's sources). `source` may ONLY be a URL from the lesson's own\n  sources; if it has none, omit `source`. Never cite from memory. Compare numbers with\n  `K.near(a, b, tol)`: a tolerance of about a millionth of the size for exact rules, wider (a\n  thousandth) where square roots or small steps meet rounding.\n- Ids that lesson checks use must exist.\n- Each update well under 150 ms; `K.anim` for motion, never endless timers.\n- No `vh` units, `position: fixed` or `height: 100%` (the frame grows to fit you).\n- Ideas without numbers (mechanism, process, structure, history, concept) use `K.stepper`, `K.choice`, a\n  timeline slider or a sorter with an HTML or SVG diagram; checks assert order and structure facts.\n\n## The self-test\nBefore Dan sees it, the app loads your body at 340, 720 and 1040 px wide, runs every check, sets each\ncontrol to five values from min to max (every option of a choice), reveals the after-move parts,\npresses every `K.button` and plays every `K.anim` for 60 frames. It fails on an exception, NaN or\nInfinity, a list or object output, an update over 150 ms, sideways overflow, text cut off at any\nof those settings (hidden overflow, an ellipsis, SVG text outside its drawing or over another\nlabel), a control not on the page, or no `K.ready()`. It warns when the first control sits over a\nphone screen below the main figure.\n\n## Example\n```html\n<p class=\"lead\">Lengthen the string and watch each swing take longer.</p>\n<div id=\"plot\"></div>\n<div class=\"k-controls\" id=\"controls\"></div>\n<div class=\"k-readouts\" id=\"outs\"></div>\n<p class=\"say\" id=\"say\"></p>\n<p class=\"caption\">Small swings: period T = 2π √(L / g), with g = 9.81 m/s².</p>\n<script>\n  const g = 9.81;\n  const period = (L) => 2 * Math.PI * Math.sqrt(L / g);\n  K.control({ id: 'L', label: 'String length', min: 0.1, max: 3, step: 0.05, value: 1, unit: 'm', into: '#controls' });\n  K.stage('#plot', '#controls');\n  K.readout({ id: 'T', label: 'One full swing takes', unit: 's', decimals: 2, into: '#outs' });\n  const plot = K.plot('#plot', { x: { min: 0, max: 3, label: 'Length (m)' }, y: { min: 0, max: 4, label: 'Period (s)' } });\n  K.model((p) => ({ T: period(p.L) }));\n  K.update((p, o) => {\n    plot.draw({ series: [{ fn: period }], marks: [{ x: p.L, y: o.T, label: K.fmt(o.T, { decimals: 2 }) + ' s', guides: true }] });\n    document.getElementById('say').textContent = !K.moved ? 'Make the string four times longer: how much longer is each swing?'\n      : 'A ' + K.fmt(p.L, { decimals: 2 }) + ' m string swings there and back every ' + K.fmt(o.T, { decimals: 2 }) + ' s. Four times the length only doubles that.';\n  });\n  K.check('No length, no swing time', () => K.near(period(0), 0));\n  // This lesson's sources include the seconds-pendulum page; with no sources, keep the check and drop source.\n  K.check('A seconds pendulum (2 s per swing) is 0.994 m long', () => K.near(period(0.994), 2, 0.002),\n    { source: 'https://en.wikipedia.org/wiki/Seconds_pendulum' });\n  K.check('Four times the length doubles the period', () => K.near(K.at({ L: 2 }).T / K.at({ L: 0.5 }).T, 2, 1e-9));\n  K.ready();\n<\/script>\n```\n";
U.KIT_EXAMPLES = [{"name":"bill-to-law","kind":"process","body":"<\u0021-- kind: process -->\n<style>\n  .flow { list-style: none; padding: 0; margin-top: 6px; }\n  .start { margin-left: 40px; }\n  .grp { position: relative; display: block; margin: 16px 0 4px 40px; }\n  .row-item { position: relative; }\n  /* The thread joining the stages runs behind the dots and through the group labels. */\n  .row-item::before, .grp::before { content: \"\"; position: absolute; width: 2px; background: var(--k-line); }\n  .row-item::before { left: 13px; top: 0; bottom: 0; }\n  .grp::before { left: -27px; top: -16px; bottom: -4px; }\n  .flow > li:first-child .row-item::before { top: 22px; }\n  .flow > li:last-child .row-item::before { bottom: auto; height: 22px; }\n  .stage {\n    position: relative; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 44px;\n    padding: 6px 0; border: 0; background: none; text-align: left; cursor: pointer; color: var(--k-muted); font: inherit;\n  }\n  .dot {\n    flex: none; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%;\n    border: 2px solid var(--k-strong); background: var(--k-bg); font-size: 13px; font-weight: 700; color: var(--k-muted);\n  }\n  .stage.done { color: var(--k-ink); }\n  .stage.done .dot { background: var(--k-accent2); border-color: var(--k-accent2); color: var(--k-on-accent2); }\n  .stage.now { color: var(--k-ink); font-weight: 700; }\n  .stage.now .dot { border-color: var(--k-accent2); color: var(--k-accent2); box-shadow: 0 0 0 4px color-mix(in srgb, var(--k-accent2) 16%, transparent); }\n  .stage.skip { text-decoration: line-through; opacity: .55; }\n  .loop { display: inline-flex; align-items: center; gap: 4px; font-size: .85rem; font-weight: 600; color: var(--k-accent); }\n  .loop svg { width: 16px; height: 16px; }\n  .detail { margin: 0 0 8px 40px; padding: 10px 14px; border-radius: 12px; background: var(--k-panel); }\n</style>\n\n<p class=\"lead\">Follow a bill on its way to becoming law. Then flip the switch to see what happens when the second House changes it.</p>\n\n<div>\n  <span class=\"k-label start\">The House where it starts</span>\n  <ol class=\"flow\" id=\"flow\" aria-label=\"Stages of a bill\"></ol>\n</div>\n\n<div class=\"k-controls\" id=\"controls\"></div>\n\n<p class=\"caption\">Simplified from UK Parliament's guide to the passage of a bill. Timings vary, and under the Parliament Acts the Commons can, in limited cases, pass a bill without the Lords' agreement.</p>\n\n<script>\n  const SOURCE = 'https://www.parliament.uk/about/how/laws/passage-bill/';\n  const LOOP = '<svg viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"M3 6.5a4.5 4.5 0 0 1 8.4-2.2M13 9.5a4.5 4.5 0 0 1-8.4 2.2M11.6 1.8v2.7H8.9M4.4 14.2v-2.7h2.7\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>';\n\n  // Each stage in order. `group` starts a labelled section of the diagram.\n  const FIRST = [\n    { key: 'first', title: 'First reading', text: 'The bill is introduced: its title is read out and it is printed. There is no debate and no vote yet.' },\n    { key: 'second', title: 'Second reading', text: 'The first debate, about the bill\\'s main ideas rather than its details. Members can vote it down here.' },\n    { key: 'committee', title: 'Committee stage', text: 'Members go through it line by line and can change the wording. Each change is called an amendment.' },\n    { key: 'report', title: 'Report stage', text: 'The whole House looks at the amended bill and can make more changes.' },\n    { key: 'third', title: 'Third reading', text: 'A last debate on the bill as a whole. In the Commons it can no longer be changed at this point; in the Lords it still can.' },\n  ];\n  const OTHER = { key: 'other', title: 'The same five stages again', group: 'The other House', text: 'The bill goes through first reading to third reading in the other House. (A bill can start in either the Commons or the Lords.)' };\n  const PING = { key: 'ping', title: 'Consideration of amendments', group: 'Back to the first House', text: 'The House where it started votes on the other House\\'s changes. If they still disagree, the bill goes back and forth (nicknamed ping-pong) until both agree on every word.' };\n  const ASSENT = { key: 'assent', title: 'Royal Assent', group: 'The monarch', text: 'The monarch formally agrees, and the bill becomes an Act of Parliament: it is now law.' };\n  const ALL = FIRST.concat([OTHER, PING, ASSENT]);\n  const stepsFor = (amended) => FIRST.concat([OTHER], amended ? [PING] : [], [ASSENT]);\n\n  const step = K.stepper({ id: 'step', steps: stepsFor(true).map((s) => s.title), value: 0, compact: true, into: '#controls' });\n  const amended = K.toggle({ id: 'amended', label: 'The other House amends it', hint: 'It changes the wording, so both Houses must agree', value: true, into: '#controls' });\n\n  // Build the diagram once; each update only changes classes and text.\n  const flow = document.getElementById('flow');\n  const rows = {};\n  ALL.forEach((s) => {\n    const btn = K.el('button', { type: 'button', class: 'stage' }, K.el('span', { class: 'dot' }), K.el('span', { class: 'name' }, s.title));\n    const detail = K.el('p', { class: 'detail', hidden: true });\n    const li = K.el('li', null, s.group ? K.el('span', { class: 'k-label grp' }, s.group) : null, K.el('div', { class: 'row-item' }, btn, detail));\n    btn.addEventListener('click', () => { const i = stepsFor(amended.get()).findIndex((x) => x.key === s.key); if (i >= 0) step.set(i); });\n    flow.appendChild(li);\n    rows[s.key] = { btn, detail, dot: btn.querySelector('.dot') };\n  });\n  // The ping-pong row carries a loop badge: the stage that can repeat.\n  const badge = K.el('span', { class: 'loop', html: LOOP + 'repeats until both agree' });\n  rows.ping.btn.querySelector('.name').appendChild(K.el('br'));\n  rows.ping.btn.querySelector('.name').appendChild(badge);\n\n  // The pure model: (step index, amended?) -> where the bill is (numbers and short strings only).\n  const orderFor = (amended) => stepsFor(amended).map((s) => s.title);\n  K.model((p) => {\n    const steps = stepsFor(p.amended);\n    const i = Math.min(Math.max(0, p.step), steps.length - 1);\n    return { total: steps.length, stage: steps[i].title, key: steps[i].key };\n  });\n\n  K.update((p, o) => {\n    step.setSteps(stepsFor(p.amended).map((s) => s.title));\n    const steps = stepsFor(p.amended);\n    ALL.forEach((s) => {\n      const r = rows[s.key], i = steps.findIndex((x) => x.key === s.key), cur = steps.findIndex((x) => x.key === o.key);\n      const skipped = i < 0;\n      r.btn.className = 'stage' + (skipped ? ' skip' : i < cur ? ' done' : i === cur ? ' now' : '');\n      r.btn.disabled = skipped;\n      r.btn.setAttribute('aria-current', i === cur ? 'step' : 'false');\n      r.dot.textContent = skipped ? '' : String(i + 1);\n      r.detail.hidden = i !== cur;\n      if (i === cur) {\n        let text = s.text;\n        if (s.key === 'other') text += p.amended ? ' Here it makes changes, so the bill has to go back.' : ' It makes no changes, so the bill is ready for Royal Assent.';\n        r.detail.textContent = text;\n      }\n      if (s.key === 'ping') {\n        r.btn.querySelector('.name').firstChild.textContent = skipped ? 'Consideration of amendments: not needed' : s.title;\n        badge.hidden = skipped;\n      }\n    });\n  });\n\n  // Known answers from UK Parliament's guide.\n  K.check('Each House\\'s stages run: first reading, second reading, committee, report, third reading', () =>\n    orderFor(false).slice(0, 5).join('|') === 'First reading|Second reading|Committee stage|Report stage|Third reading', { source: SOURCE });\n  K.check('With amendments there are 8 steps; without, 7 (no ping-pong)', () =>\n    K.at({ amended: true }).total === 8 && K.at({ amended: false }).total === 7);\n  K.check('Royal Assent is always the last step', () =>\n    [true, false].every((a) => K.at({ amended: a, step: 99 }).stage === 'Royal Assent' && orderFor(a).indexOf('Royal Assent') === orderFor(a).length - 1));\n  K.check('Ping-pong comes after the other House and before Royal Assent', () => {\n    const o = orderFor(true);\n    return o.indexOf('Consideration of amendments') === o.indexOf('The same five stages again') + 1 && o.indexOf('Royal Assent') === o.length - 1;\n  });\n\n  K.ready();\n<\/script>\n"},{"name":"brayton-efficiency","kind":"quantity","body":"<\u0021-- kind: quantity -->\n<style>\n  .split { display: flex; height: 26px; border-radius: 8px; overflow: hidden; background: var(--k-sunk); }\n  .split .work { background: var(--k-accent2); transition: width .2s ease; }\n  .split-key { display: flex; justify-content: space-between; gap: 12px; margin-top: 6px; font-size: .9rem; color: var(--k-muted); }\n  .split-key b { color: var(--k-ink); font-variant-numeric: tabular-nums; }\n  .nowrap { white-space: nowrap; }\n</style>\n\n<p class=\"lead\">Squeeze the air harder before the fuel burns in it, and watch how much more of the fuel's heat turns into useful work.</p>\n\n<div id=\"plot\"></div>\n<div class=\"k-controls\" id=\"controls\"></div>\n\n<div class=\"k-readouts\" id=\"outs\"></div>\n\n<div>\n  <span class=\"k-label\">Of every 100 units of heat from the fuel</span>\n  <div class=\"split\" role=\"img\" id=\"split\" aria-label=\"\"><i class=\"work\" id=\"work\"></i></div>\n  <div class=\"split-key\"><span><b id=\"w\">0</b> become work</span><span><b id=\"x\">0</b> leave in the hot exhaust</span></div>\n</div>\n\n<p class=\"say\" id=\"say\"></p>\n\n<p class=\"caption\">Ideal Brayton cycle: <span class=\"nowrap\">efficiency = 1 − r<sup>−(γ−1)/γ</sup></span>, with γ = 1.4 for air (NASA Glenn Research Center). It is an upper limit: real compressors and turbines lose some energy to friction and turbulence, so real engines sit below this curve.</p>\n\n<script>\n  // gamma: ratio of specific heats for air, the value NASA Glenn's Brayton page uses.\n  const GAMMA = 1.4;\n  const SOURCE = 'https://www.grc.nasa.gov/www/k-12/airplane/brayton.html';\n  const pct = (r) => 100 * (1 - Math.pow(r, -(GAMMA - 1) / GAMMA));\n\n  const r = K.control({ id: 'r', label: 'Pressure ratio', hint: 'Pressure after the compressor ÷ pressure before it', min: 1, max: 50, step: 1, value: 8, unit: ':1', into: '#controls' });\n  K.readout({ id: 'eff', label: 'Ideal efficiency', unit: '%', decimals: 1, big: true, into: '#outs' });\n\n  K.stage('#plot', '#controls');   // stacked on a phone, side by side on a laptop\n\n  const plot = K.plot('#plot', {\n    x: { min: 1, max: 50, label: 'Pressure ratio' },\n    y: { min: 0, max: 100, label: 'Ideal efficiency (%)' },\n    label: 'Ideal efficiency rises steeply at low pressure ratios, then flattens',\n  });\n\n  // The pure model: pressure ratio -> ideal efficiency in percent.\n  K.model((p) => ({ eff: pct(p.r) }));\n\n  K.update((p, o) => {\n    plot.draw({\n      series: [{ fn: pct, label: 'Ideal efficiency' }],\n      marks: [{ x: p.r, y: o.eff, label: o.eff.toFixed(1) + '%', guides: true }],\n    });\n    document.getElementById('work').style.width = o.eff + '%';\n    document.getElementById('w').textContent = o.eff.toFixed(1);\n    document.getElementById('x').textContent = (100 - o.eff).toFixed(1);\n    document.getElementById('split').setAttribute('aria-label', o.eff.toFixed(1) + ' of every 100 units become work');\n\n    let s;\n    if (p.r === 1) {\n      s = 'With no squeeze at all (r = 1), the hot gas has no extra pressure to push the turbine with, so no work comes out: 0%.';\n    } else if (p.r * 2 <= 50) {\n      const more = pct(p.r * 2) - o.eff;\n      s = 'At ' + p.r + ':1 an ideal engine turns ' + o.eff.toFixed(1) + '% of the fuel\\'s heat into work. Doubling the squeeze to ' +\n        p.r * 2 + ':1 would add ' + more.toFixed(1) + ' more points.';\n    } else {\n      const less = o.eff - pct(p.r / 2);\n      s = 'At ' + p.r + ':1 an ideal engine turns ' + o.eff.toFixed(1) + '% of the fuel\\'s heat into work. Halving the squeeze would cost only ' +\n        less.toFixed(1) + ' points: the curve has flattened.';\n    }\n    // Until Dan moves the slider the sentence invites rather than answers his prediction.\n    document.getElementById('say').textContent = K.moved ? s : 'Does doubling the squeeze double the work you get? Move the pressure ratio and see.';\n  });\n\n  // Known answers, worked out by hand from the formula.\n  K.check('No squeeze (r = 1) gives 0% efficiency', () => K.near(K.at({ r: 1 }).eff, 0, 1e-9));\n  K.check('r = 10 gives 48.2%, from the ideal Brayton formula', () => K.near(K.at({ r: 10 }).eff, 48.205, 0.001), { source: SOURCE });\n  K.check('Efficiency rises with every step up in pressure ratio', () => {\n    for (let x = 1; x < 50; x++) if (!(K.at({ r: x + 1 }).eff > K.at({ r: x }).eff)) return false;\n    return true;\n  });\n  K.check('Diminishing returns: 1 → 2 adds 18.0 points, 20 → 40 adds only 7.6', () =>\n    K.near(K.at({ r: 2 }).eff - K.at({ r: 1 }).eff, 17.97, 0.01) && K.near(K.at({ r: 40 }).eff - K.at({ r: 20 }).eff, 7.63, 0.01));\n  K.check('Even at r = 50 the ideal stays below 100% (67.3%)', () => K.near(K.at({ r: 50 }).eff, 67.30, 0.01));\n\n  K.ready();\n<\/script>\n"},{"name":"compound-growth","kind":"mechanism","body":"<\u0021-- kind: mechanism -->\n<p class=\"lead\">Compound interest pays interest on your interest, so the pot grows faster every year. Set a rate and a time, and compare it with simple interest, which only ever pays on the starting amount.</p>\n\n<div id=\"plot\"></div>\n<div class=\"k-controls\" id=\"controls\"></div>\n<div class=\"k-readouts\" id=\"outs\"></div>\n<p class=\"say\" id=\"say\"></p>\n<p class=\"caption\">Compound: balance = P × (1 + r)<sup>t</sup>. Simple: balance = P × (1 + r × t). Interest is added once a year at a fixed rate, and the line joins the year-end balances smoothly. Leaves out tax, fees, inflation and rates that change.</p>\n\n<script>\n  const SOURCE = 'https://en.wikipedia.org/wiki/Rule_of_72';\n  const money = (v) => '£' + K.fmt(v, { decimals: v < 1000 ? 2 : 0 });\n  const years1 = (v) => K.fmt(v, { decimals: 1 }) + ' years';\n\n  K.control({ id: 'principal', label: 'Starting amount', min: 100, max: 10000, step: 100, value: 1000, prefix: '£', into: '#controls' });\n  K.control({ id: 'rate', label: 'Interest rate per year', min: 0.5, max: 15, step: 0.5, value: 6, unit: '%', into: '#controls' });\n  K.control({ id: 'years', label: 'Years', min: 1, max: 50, step: 1, value: 30, fmt: (v) => v + (v === 1 ? ' year' : ' years'), into: '#controls' });\n\n  K.readout({ id: 'compound', label: 'Compound', fmt: money, into: '#outs' });\n  K.readout({ id: 'simple', label: 'Simple', fmt: money, into: '#outs' });\n  K.readout({ id: 'rule72', label: 'Doubling, rule of 72', unit: 'years', decimals: 1, into: '#outs' });\n  K.readout({ id: 'exact', label: 'Doubling, exact', unit: 'years', decimals: 1, into: '#outs' });\n\n  K.stage('#plot', '#controls', { max: 760 });   // three sliders: let the pair run a little taller on a phone\n\n  const plot = K.plot('#plot', {\n    x: { min: 0, max: 30, label: 'Years' },\n    y: { label: 'Balance', prefix: '£' },\n    label: 'Compound growth curves upward while simple growth is a straight line',\n  });\n\n  // The pure model. Rates are entered in percent; r is the yearly fraction.\n  const grow = (P, r, t) => P * Math.pow(1 + r, t);\n  K.model((p) => {\n    const r = p.rate / 100;\n    return {\n      compound: grow(p.principal, r, p.years),\n      simple: p.principal * (1 + r * p.years),\n      rule72: 72 / p.rate,\n      exact: Math.LN2 / Math.log(1 + r),\n    };\n  });\n\n  K.update((p, o) => {\n    const r = p.rate / 100;\n    // Each doubling takes the same time: mark the last four that fit.\n    const marks = [];\n    for (let k = 1; k * o.exact <= p.years && k <= 10; k++) marks.push({ x: k * o.exact, y: p.principal * Math.pow(2, k), label: '×' + Math.pow(2, k), r: 5 });\n    plot.draw({\n      x: { min: 0, max: p.years, label: 'Years' },\n      series: [\n        { fn: (t) => grow(p.principal, r, t), label: 'Compound: interest on interest' },\n        { fn: (t) => p.principal * (1 + r * t), label: 'Simple: interest on the start only', color: 'muted', dash: true },\n      ],\n      marks: marks.slice(-4),\n    });\n    const extra = o.compound - o.simple;\n    const gap = Math.abs(o.rule72 - o.exact);\n    const first = p.years === 1\n      ? 'After 1 year both give ' + money(o.compound) + ': interest on interest only starts once the first year\\'s interest has been added.'\n      : 'After ' + p.years + ' years at ' + p.rate + '%, compounding gives ' + money(o.compound) + ' against ' + money(o.simple) +\n        ' with simple interest: ' + money(extra) + ' more, earned as interest on earlier interest.';\n    document.getElementById('say').textContent = first + ' The pot doubles every ' + years1(o.exact) +\n      ' whatever the starting amount; the rule of 72 says ' + years1(o.rule72) + (gap < 0.05 ? ', almost exactly right.' : ', off by ' + years1(gap) + '.');\n  });\n\n  // Known answers, worked by hand, plus Wikipedia's rule of 72 example.\n  K.check('£1,000 at 5% for 10 years compounds to £1,628.89', () => K.near(K.at({ principal: 1000, rate: 5, years: 10 }).compound, 1628.89, 0.005));\n  K.check('£1,000 at 5% simple interest for 10 years gives £1,500', () => K.near(K.at({ principal: 1000, rate: 5, years: 10 }).simple, 1500, 1e-9));\n  K.check('At 9% the rule of 72 says 8 years and the exact answer is 8.0432 years', () => {\n    const o = K.at({ rate: 9 });\n    return K.near(o.rule72, 8, 1e-9) && K.near(o.exact, 8.0432, 0.0001);\n  }, { source: SOURCE });\n  K.check('Doubling time does not depend on the starting amount', () =>\n    K.near(K.at({ principal: 100, rate: 6 }).exact, K.at({ principal: 10000, rate: 6 }).exact, 1e-12));\n  K.check('After one doubling time the balance really has doubled', () => {\n    const o = K.at({ principal: 1000, rate: 6 });\n    return K.near(grow(1000, 0.06, o.exact), 2000, 1e-6);\n  });\n\n  K.ready();\n<\/script>\n"},{"name":"heart-chambers","kind":"structure","body":"<\u0021-- kind: structure -->\n<style>\n  .heart text { font: 600 11.5px var(--k-font); fill: var(--k-ink); }\n  .heart .organ { fill: var(--k-panel); stroke: var(--k-line); stroke-width: 1.5; }\n  .heart .vessel { fill: none; stroke: var(--k-sunk); stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }\n  .heart .room { fill: var(--k-bg); stroke: var(--k-strong); stroke-width: 2; }\n  .heart .room.here { fill: var(--k-fill1); stroke: var(--k-accent2); }\n  .heart .room.thick { stroke-width: 5; }\n  .heart .trail { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }\n  .heart .poor { stroke: var(--k-cat1); }\n  .heart .rich { stroke: var(--k-cat2); }\n  .heart .valve { stroke: var(--k-ink); stroke-width: 2.5; stroke-linecap: round; }\n  .heart .arrow { fill: var(--k-muted); }\n  .heart .side { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; fill: var(--k-accent); }\n  .heart .valve-name { font-size: 11.5px; fill: var(--k-accent2); }\n  .heart .drop { stroke: var(--k-bg); stroke-width: 2.5; }\n  .dot-poor { background: var(--k-cat1); }\n  .dot-rich { background: var(--k-cat2); }\n</style>\n\n<p class=\"lead\">Follow one drop of blood through the heart. Drag it along, or press Play, and watch which chamber it passes through.</p>\n\n<div id=\"scene\">\n  <svg class=\"heart\" id=\"heart\" viewBox=\"0 0 340 340\" role=\"img\" aria-label=\"\">\n    <rect class=\"organ\" x=\"80\" y=\"6\" width=\"200\" height=\"46\" rx=\"14\"/>\n    <text x=\"104\" y=\"40\">Lungs</text>\n    <rect class=\"organ\" x=\"80\" y=\"292\" width=\"200\" height=\"42\" rx=\"14\"/>\n    <text x=\"180\" y=\"326\" text-anchor=\"middle\">Rest of the body</text>\n    <path class=\"vessel\" id=\"vessels\"/>\n    <rect class=\"room\" id=\"room-ra\" x=\"58\" y=\"92\" width=\"90\" height=\"58\" rx=\"12\"/>\n    <rect class=\"room\" id=\"room-la\" x=\"192\" y=\"92\" width=\"90\" height=\"58\" rx=\"12\"/>\n    <rect class=\"room\" id=\"room-rv\" x=\"58\" y=\"160\" width=\"90\" height=\"86\" rx=\"14\"/>\n    <rect class=\"room thick\" id=\"room-lv\" x=\"192\" y=\"160\" width=\"90\" height=\"86\" rx=\"14\"/>\n    <text x=\"117\" y=\"114\" text-anchor=\"middle\">Right</text><text x=\"117\" y=\"129\" text-anchor=\"middle\">atrium</text>\n    <text x=\"225\" y=\"114\" text-anchor=\"middle\">Left</text><text x=\"225\" y=\"129\" text-anchor=\"middle\">atrium</text>\n    <text x=\"117\" y=\"191\" text-anchor=\"middle\">Right</text><text x=\"117\" y=\"206\" text-anchor=\"middle\">ventricle</text>\n    <text x=\"225\" y=\"191\" text-anchor=\"middle\">Left</text><text x=\"225\" y=\"206\" text-anchor=\"middle\">ventricle</text>\n    <text class=\"side\" x=\"103\" y=\"266\" text-anchor=\"middle\">THEIR RIGHT</text>\n    <text class=\"side\" x=\"237\" y=\"266\" text-anchor=\"middle\">THEIR LEFT</text>\n    <path class=\"trail poor\" id=\"trail-poor\"/>\n    <path class=\"trail rich\" id=\"trail-rich\"/>\n    <g id=\"valves\"></g>\n    <g class=\"k-after-move\" id=\"arrows\"></g>\n    <g id=\"valve-label\"></g>\n    <circle class=\"drop\" id=\"drop\" r=\"7\"/>\n  </svg>\n  <div class=\"key\" aria-hidden=\"true\">\n    <span><i class=\"swatch dot-poor\"></i>Blood low in oxygen</span>\n    <span><i class=\"swatch dot-rich\"></i>Blood rich in oxygen</span>\n  </div>\n</div>\n<div class=\"k-controls\" id=\"controls\"></div>\n<div class=\"k-readouts\" id=\"outs\"></div>\n<p class=\"say\" id=\"say\"></p>\n<p class=\"caption\">A flat map of the heart, seen as if facing the person, so their right side is on your left. Real chambers squeeze together in a beat rather than one drop at a time.</p>\n\n<script>\n  // Source [1] of the lesson: the heart's chambers, valves and the two circuits.\n  const SOURCE = 'https://en.wikipedia.org/wiki/Heart';\n\n  // The drop's loop, leg by leg: the path it follows (viewBox units), its share of the slider\n  // (weights add up to 100, so short valves still get room), what it is, and where it goes next.\n  const LEGS = [\n    { key: 'body', name: 'Rest of the body', pts: [[180, 303], [80, 303]], w: 10, next: 'Right atrium',\n      say: 'The drop is out in the body, where its oxygen has just been handed to the cells. Next it heads back to the heart.' },\n    { key: 'veins', name: 'Big veins from the body', pts: [[80, 303], [30, 303], [30, 135], [58, 135]], w: 8, next: 'Right atrium',\n      say: 'Low on oxygen, it rides the big veins (the venae cavae) back to the heart\\'s right side.' },\n    { key: 'ra', name: 'Right atrium', room: 'ra', pts: [[58, 135], [80, 135], [80, 150]], w: 8, next: 'Right ventricle',\n      say: 'It collects in the right atrium, the holding chamber at the top of the heart\\'s right side.' },\n    { key: 'tricuspid', name: 'Tricuspid valve', valve: true, pts: [[80, 150], [80, 160]], w: 3, next: 'Right ventricle',\n      say: 'The tricuspid valve opens one way only: blood can drop into the right ventricle but not flow back.' },\n    { key: 'rv', name: 'Right ventricle', room: 'rv', pts: [[80, 160], [80, 225], [148, 225]], w: 8, next: 'Lungs',\n      say: 'The right ventricle squeezes it out to the lungs, not to the body.' },\n    { key: 'pulmonary', name: 'Pulmonary valve', valve: true, pts: [[148, 225], [158, 225]], w: 3, next: 'Lungs',\n      say: 'Through the pulmonary valve, another one-way door.' },\n    { key: 'artery', name: 'Pulmonary artery', pts: [[158, 225], [170, 225], [170, 52]], w: 6, next: 'Lungs',\n      say: 'The pulmonary artery carries it to the lungs. It counts as an artery because it leads away from the heart, even though this blood is low in oxygen.' },\n    { key: 'lungs', name: 'Lungs', pts: [[170, 52], [170, 20], [260, 20], [260, 52]], w: 9, next: 'Left atrium',\n      say: 'In the lungs it gives up carbon dioxide and picks up oxygen from the air breathed in.' },\n    { key: 'pveins', name: 'Pulmonary veins', pts: [[260, 52], [260, 92]], w: 5, next: 'Left atrium',\n      say: 'Rich in oxygen now, it returns along the pulmonary veins to the heart\\'s left side.' },\n    { key: 'la', name: 'Left atrium', room: 'la', pts: [[260, 92], [260, 150]], w: 8, next: 'Left ventricle',\n      say: 'It collects in the left atrium.' },\n    { key: 'mitral', name: 'Mitral valve', valve: true, pts: [[260, 150], [260, 160]], w: 3, next: 'Left ventricle',\n      say: 'The mitral valve lets it into the left ventricle and stops it flowing back.' },\n    { key: 'lv', name: 'Left ventricle', room: 'lv', pts: [[260, 160], [260, 225], [282, 225]], w: 8, next: 'Rest of the body',\n      say: 'The left ventricle has the thickest wall of the four: it pushes blood all the way round the body.' },\n    { key: 'aortic', name: 'Aortic valve', valve: true, pts: [[282, 225], [292, 225]], w: 3, next: 'Rest of the body',\n      say: 'Out through the aortic valve, the last of the four one-way doors.' },\n    { key: 'aorta', name: 'Aorta', pts: [[292, 225], [310, 225], [310, 303], [280, 303]], w: 8, next: 'Rest of the body',\n      say: 'Into the aorta, the body\\'s biggest artery, which branches to every part of the body.' },\n    { key: 'body2', name: 'Rest of the body', pts: [[280, 303], [180, 303]], w: 10, next: 'Right atrium',\n      say: 'Back in the body, it hands over its oxygen. One loop has taken it through the heart twice: once on each side.' },\n  ];\n  // Each leg's span of the slider [from, to) and its path length.\n  let at0 = 0;\n  LEGS.forEach((L) => {\n    L.from = at0; at0 += L.w; L.to = at0;\n    L.len = L.pts.slice(1).reduce((s, q, i) => s + Math.hypot(q[0] - L.pts[i][0], q[1] - L.pts[i][1]), 0);\n  });\n  const LUNGS = LEGS.find((L) => L.key === 'lungs'), LUNGS_MID = LUNGS.from + LUNGS.w / 2;   // oxygen picked up from here on\n  const legAt = (pos) => LEGS.find((L) => pos < L.to) || LEGS[LEGS.length - 1];\n  // The point a fraction f of the way along a leg's path.\n  function pointOn(L, f) {\n    let d = f * L.len;\n    for (let i = 1; i < L.pts.length; i++) {\n      const a = L.pts[i - 1], b = L.pts[i], s = Math.hypot(b[0] - a[0], b[1] - a[1]);\n      if (d <= s || i === L.pts.length - 1) { const t = s ? Math.min(1, d / s) : 0; return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]; }\n      d -= s;\n    }\n    return L.pts[L.pts.length - 1];\n  }\n  const where = (pos) => { const L = legAt(pos); return pointOn(L, Math.min(1, (pos - L.from) / L.w)); };\n  // The path from slider position a to b, as an SVG path.\n  function pathBetween(a, b) {\n    if (!(b > a)) return '';\n    const pts = [where(a)];\n    LEGS.forEach((L) => L.pts.forEach((q, i) => {\n      const pos = L.from + L.w * (L.len ? L.pts.slice(1, i + 1).reduce((s, r, j) => s + Math.hypot(r[0] - L.pts[j][0], r[1] - L.pts[j][1]), 0) / L.len : 0);\n      if (pos > a && pos < b) pts.push(q);\n    }));\n    pts.push(where(b));\n    return 'M' + pts.map((q) => q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join('L');\n  }\n  const oxygen = (pos) => pos >= LUNGS_MID ? 'Plenty' : 'Little';\n\n  const pos = K.control({ id: 'pos', label: 'Round the loop', min: 0, max: 100, step: 1, value: 22, unit: '%', into: '#controls' });\n  // Play moves the slider. The slider moves in whole steps, so the drawing follows the exact\n  // position while playing; Dan dragging the slider takes over from wherever he leaves it.\n  let smooth = null;\n  K.anim({ label: 'Play the loop', into: '#controls', step: (dt) => {\n    const from = smooth !== null && Math.abs(smooth - pos.get()) < 1 ? smooth : pos.get();\n    smooth = (from + dt * 5) % 100;\n    pos.set(smooth);\n  } });\n  K.stage('#scene', '#controls');\n\n  K.readout({ id: 'place', label: 'Where the drop is', into: '#outs' });\n  K.readout({ id: 'oxygen', label: 'Oxygen it carries', into: '#outs' });\n  // Shows \"?\" until Dan moves something: it would answer his prediction.\n  K.readout({ id: 'next', label: 'Where it goes next', afterMove: true, into: '#outs' });\n\n  // The pure model: position round the loop -> where the drop is (text outputs only).\n  K.model((p) => {\n    const L = legAt(p.pos);\n    return { place: L.name, oxygen: oxygen(p.pos), next: L.next, leg: L.key };\n  });\n\n  // The drawing that never changes: vessels, valves, and the flow arrows kept for after a move.\n  const svg = document.getElementById('heart');\n  document.getElementById('vessels').setAttribute('d', pathBetween(0, 100));\n  LEGS.filter((L) => L.valve).forEach((L) => {\n    const [a, b] = L.pts, cx = (a[0] + b[0]) / 2, cy = (a[1] + b[1]) / 2, across = a[0] === b[0];\n    document.getElementById('valves').appendChild(across\n      ? K.svg('path', { class: 'valve', d: `M${cx - 8} ${cy - 2}L${cx} ${cy + 3}L${cx + 8} ${cy - 2}` })\n      : K.svg('path', { class: 'valve', d: `M${cx - 2} ${cy - 8}L${cx + 3} ${cy}L${cx - 2} ${cy + 8}` }));\n  });\n  [['veins', 0.55], ['artery', 0.55], ['pveins', 0.5], ['aorta', 0.5], ['body', 0.5], ['lungs', 0.5]].forEach(([key, f]) => {\n    const L = LEGS.find((x) => x.key === key), a = pointOn(L, f - 0.02), b = pointOn(L, f + 0.02);\n    const ang = Math.atan2(b[1] - a[1], b[0] - a[0]) * 180 / Math.PI, c = pointOn(L, f);\n    document.getElementById('arrows').appendChild(K.svg('path', { class: 'arrow', d: 'M-5 -5L5 0L-5 5Z', transform: `translate(${c[0]} ${c[1]}) rotate(${ang})` }));\n  });\n\n  K.update((p, o) => {\n    const at = smooth !== null && Math.abs(smooth - p.pos) < 1 ? smooth : p.pos;\n    const L = legAt(at), [x, y] = where(at), rich = at >= LUNGS_MID;\n    document.getElementById('trail-poor').setAttribute('d', pathBetween(0, Math.min(at, LUNGS_MID)));\n    document.getElementById('trail-rich').setAttribute('d', pathBetween(LUNGS_MID, at));\n    const drop = document.getElementById('drop');\n    drop.setAttribute('cx', x.toFixed(1)); drop.setAttribute('cy', y.toFixed(1));\n    drop.style.fill = K.color(rich ? 'cat2' : 'cat1');\n    ['ra', 'rv', 'la', 'lv'].forEach((r) => document.getElementById('room-' + r).classList.toggle('here', L.room === r));\n    // Name a valve while the drop is going through it, placed clear of the other labels.\n    const v = L.valve ? L : null;\n    K.labels('#valve-label', v ? [{ x: v.pts[0][0] + 12, y: v.pts[0][1] + 9, text: v.name.toLowerCase(), anchor: 'start', class: 'valve-name' }] : []);\n    svg.setAttribute('aria-label', 'Map of the heart. The drop is in the ' + L.name.toLowerCase() + ', carrying ' + o.oxygen.toLowerCase() + ' oxygen.');\n    // Until Dan moves something, the sentence asks rather than tells.\n    document.getElementById('say').textContent = K.moved ? L.say : 'Where will this drop go after the right atrium? Make your guess, then move it on.';\n  });\n\n  // Known answers: the route and the valves, as the source describes them.\n  const visits = (keep) => {\n    const out = [];\n    for (let q = 0; q < 100; q += 0.5) { const n = K.at({ pos: q }).place; if (keep(n) && out[out.length - 1] !== n) out.push(n); }\n    return out;\n  };\n  const STOPS = ['Rest of the body', 'Right atrium', 'Right ventricle', 'Lungs', 'Left atrium', 'Left ventricle'];\n  K.check('One loop: body, right atrium, right ventricle, lungs, left atrium, left ventricle, body', () =>\n    visits((n) => STOPS.includes(n)).join('|') === STOPS.concat(['Rest of the body']).join('|'), { source: SOURCE });\n  K.check('Four valves, each passed once, in order: tricuspid, pulmonary, mitral, aortic', () =>\n    visits((n) => / valve$/.test(n)).join('|') === 'Tricuspid valve|Pulmonary valve|Mitral valve|Aortic valve', { source: SOURCE });\n  K.check('The right side carries blood low in oxygen, the left side blood rich in it', () =>\n    ['Right atrium', 'Right ventricle', 'Pulmonary artery'].every((n) => K.at({ pos: LEGS.find((L) => L.name === n).from + 1 }).oxygen === 'Little') &&\n    ['Pulmonary veins', 'Left atrium', 'Left ventricle', 'Aorta'].every((n) => K.at({ pos: LEGS.find((L) => L.name === n).from + 1 }).oxygen === 'Plenty'));\n  K.check('Each loop goes through the heart twice, once on each side', () =>\n    visits((n) => /atrium$/.test(n)).length === 2);\n  K.check('The ends of the slider are the same place: the loop closes', () =>\n    at0 === 100 && K.at({ pos: 0 }).place === K.at({ pos: 100 }).place && Math.hypot(where(0)[0] - where(100)[0], where(0)[1] - where(100)[1]) < 1e-9);\n\n  K.ready();\n<\/script>\n"},{"name":"july-1914","kind":"history","body":"<\u0021-- kind: history -->\n<style>\n  .scene { max-width: 560px; margin-left: auto; margin-right: auto; }\n  .line text { font: 600 11.5px var(--k-font); fill: var(--k-muted); }\n  .line .axis { stroke: var(--k-strong); stroke-width: 2; stroke-linecap: round; }\n  .line .past { stroke: var(--k-accent2); stroke-width: 4; stroke-linecap: round; }\n  .line .event { fill: var(--k-accent2); stroke: var(--k-bg); stroke-width: 2; }\n  .line .now-line { stroke: var(--k-accent2); stroke-width: 1.5; stroke-dasharray: 3 3; }\n  .line .now { font-size: 12.5px; font-weight: 700; fill: var(--k-ink); }\n  .nations { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; margin-top: 10px; }\n  .nation { padding: 8px 10px; border-radius: 12px; background: var(--k-panel); border: 1.5px solid transparent; }\n  .nation b { display: block; font-size: .9rem; line-height: 1.25; }\n  .nation span { display: block; font-size: .8rem; color: var(--k-muted); }\n  .nation.war { background: var(--k-fill2); border-color: var(--k-amber-line); }\n  .nation.war span { color: var(--k-ink); font-weight: 600; }\n  .chain { list-style: none; padding: 0; }\n  .chain li { position: relative; padding: 0 0 12px 22px; }\n  .chain li::before { content: \"\"; position: absolute; left: 5px; top: 7px; width: 9px; height: 9px; border-radius: 50%; background: var(--k-accent2); }\n  .chain li:not(:last-child)::after { content: \"\"; position: absolute; left: 9px; top: 19px; bottom: -4px; border-left: 2px solid var(--k-line); }\n  .chain .when { display: block; font-size: .8rem; font-weight: 700; letter-spacing: .04em; color: var(--k-accent); }\n  .chain .so { display: block; font-size: .85rem; color: var(--k-muted); }\n  .chain li.latest { font-weight: 600; }\n</style>\n\n<p class=\"lead\">Slide through the summer of 1914 and watch one killing pull country after country into war.</p>\n\n<div class=\"scene\" id=\"scene\">\n  <svg class=\"line\" id=\"line\" viewBox=\"0 0 340 64\" role=\"img\" aria-label=\"\"></svg>\n  <div class=\"nations\" id=\"nations\"></div>\n</div>\n<div class=\"k-controls\" id=\"controls\"></div>\n<div class=\"k-readouts\" id=\"outs\"></div>\n<p class=\"say\" id=\"say\"></p>\n<div>\n  <span class=\"k-label\">How each step led to the next</span>\n  <ol class=\"chain\" id=\"chain\"></ol>\n</div>\n<p class=\"caption\">Dates of the July Crisis, 1914. Other countries, such as Japan and the Ottoman Empire, joined the war later that year.</p>\n\n<script>\n  // Source [1] of the lesson: the dates of the July Crisis.\n  const SOURCE = 'https://en.wikipedia.org/wiki/July_Crisis';\n\n  // Days after 28 June 1914. Each event says what it caused next (\"so\").\n  const EVENTS = [\n    { day: 0, text: 'In Sarajevo, Gavrilo Princip, a Bosnian Serb, shoots dead Archduke Franz Ferdinand, heir to the throne of Austria-Hungary.',\n      so: 'Austria-Hungary blames Serbia and decides to punish it.' },\n    { day: 7, text: 'Germany promises Austria-Hungary its full support against Serbia, even if Russia steps in: the \"blank cheque\".',\n      so: 'Austria-Hungary can take a hard line.' },\n    { day: 25, text: 'Austria-Hungary sends Serbia an ultimatum: accept every demand within 48 hours.',\n      so: 'Serbia has two days to answer.' },\n    { day: 27, text: 'Serbia accepts most of the demands, but not all. Austria-Hungary breaks off relations.',\n      so: 'Austria-Hungary prepares to fight.' },\n    { day: 30, text: 'Austria-Hungary declares war on Serbia.', so: 'Russia, which backs Serbia, gets ready to defend it.' },\n    { day: 32, text: 'Russia orders its whole army to mobilise.', so: 'Germany, Austria-Hungary\\'s ally, sees a threat on its border.' },\n    { day: 34, text: 'Germany declares war on Russia.', so: 'France, Russia\\'s ally, is next in Germany\\'s plans.' },\n    { day: 36, text: 'Germany declares war on France.', so: 'German armies head for France through Belgium.' },\n    { day: 37, text: 'German troops march into Belgium. Britain, pledged since 1839 to protect Belgium, declares war on Germany.', so: '' },\n  ];\n  // The day each country was first at war with one of the others.\n  const NATIONS = [['Serbia', 30], ['Austria-Hungary', 30], ['Germany', 34], ['Russia', 34], ['France', 36], ['Belgium', 37], ['Britain', 37]];\n  const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August'];\n  const dateOf = (d) => { const t = new Date(1914, 5, 28 + d); return t.getDate() + ' ' + MONTHS[t.getMonth()]; };\n  const short = (d) => { const t = dateOf(d).split(' '); return t[0] + '\\u00a0' + t[1].slice(0, 3); };   // \"28 Jul\", kept on one line\n\n  const day = K.control({ id: 'day', label: 'Date in 1914', min: 0, max: 37, step: 1, value: 25, fmt: dateOf, into: '#controls' });\n  K.stage('#scene', '#controls');\n  K.readout({ id: 'days', label: 'Days since the shots in Sarajevo', into: '#outs' });\n  K.readout({ id: 'atWar', label: 'Of these seven, at war', into: '#outs' });\n\n  // The pure model: date -> how far the crisis has gone.\n  K.model((p) => {\n    const happened = EVENTS.filter((e) => e.day <= p.day);\n    return { days: p.day, atWar: NATIONS.filter((n) => n[1] <= p.day).length, latest: happened[happened.length - 1].text };\n  });\n\n  // The timeline: an axis with the date marks, a line for the days gone by, and a dot for each\n  // event so far (later events stay off the page until their day comes).\n  const svg = document.getElementById('line');\n  const X0 = 20, X1 = 320, x = (d) => X0 + (X1 - X0) * d / 37;\n  const nations = NATIONS.map(([name]) => {\n    const status = K.el('span');\n    const tile = K.el('div', { class: 'nation' }, K.el('b', null, name), status);\n    document.getElementById('nations').appendChild(tile);\n    return { tile, status };\n  });\n\n  K.update((p, o) => {\n    svg.textContent = '';\n    svg.appendChild(K.svg('line', { class: 'axis', x1: X0, x2: X1, y1: 34, y2: 34 }));\n    svg.appendChild(K.svg('line', { class: 'past', x1: X0, x2: x(p.day), y1: 34, y2: 34 }));\n    [0, 17, 34].forEach((d) => svg.appendChild(K.svg('text', { x: x(d), y: 58, 'text-anchor': d === 0 ? 'start' : d === 34 ? 'end' : 'middle' }, short(d))));\n    EVENTS.filter((e) => e.day <= p.day).forEach((e) => svg.appendChild(K.svg('circle', { class: 'event', cx: x(e.day), cy: 34, r: 5 })));\n    svg.appendChild(K.svg('line', { class: 'now-line', x1: x(p.day), x2: x(p.day), y1: 18, y2: 42 }));\n    const label = K.svg('g');\n    svg.appendChild(label);\n    K.labels(label, [{ x: x(p.day), y: 13, text: dateOf(p.day), class: 'now' }]);\n    svg.setAttribute('aria-label', 'Timeline from 28 June to 4 August 1914, now at ' + dateOf(p.day));\n\n    NATIONS.forEach(([name, from], i) => {\n      const war = from <= p.day;\n      nations[i].tile.classList.toggle('war', war);\n      nations[i].status.textContent = war ? 'At war from ' + short(from) : 'At peace';\n    });\n\n    const chain = document.getElementById('chain');\n    chain.textContent = '';\n    const done = EVENTS.filter((e) => e.day <= p.day);\n    done.forEach((e, i) => chain.appendChild(K.el('li', { class: i === done.length - 1 ? 'latest' : '' },\n      K.el('span', { class: 'when' }, dateOf(e.day)), e.text, i < done.length - 1 && e.so ? K.el('span', { class: 'so' }, 'So: ' + e.so) : null)));\n\n    const n = o.atWar;\n    document.getElementById('say').textContent = !K.moved\n      ? 'Nobody is at war yet. How long do you think it took to reach Britain? Slide on through the summer to see.'\n      : p.day === 0\n      ? '28 June: the shots in Sarajevo. For now it is a crime in one city, and nobody is at war.'\n      : n === 0\n      ? dateOf(p.day) + ', ' + p.day + ' days after the shots: nobody is at war yet, but each step so far has made the next one harder to stop.'\n      : n === NATIONS.length\n        ? 'By ' + dateOf(p.day) + ', ' + p.day + ' days after one killing, all seven countries are at war. Promises between allies turned a quarrel between two countries into a European war.'\n        : dateOf(p.day) + ': ' + n + ' of the seven are at war. Each one\\'s ally is now under pressure to join in.';\n  });\n\n  // Known answers from the dates of the crisis.\n  K.check('Day 37 after 28 June 1914 is 4 August (June has 30 days)', () => dateOf(37) === '4 August' && dateOf(3) === '1 July');\n  K.check('Austria-Hungary declared war on Serbia on 28 July, one month after the shots', () =>\n    dateOf(30) === '28 July' && K.at({ day: 29 }).atWar === 0 && K.at({ day: 30 }).atWar === 2, { source: SOURCE });\n  K.check('Britain was at war on 4 August, 37 days after Sarajevo, the last of the seven', () =>\n    K.at({ day: 36 }).atWar === 5 && K.at({ day: 37 }).atWar === 7 && NATIONS.find((n) => n[0] === 'Britain')[1] === 37, { source: SOURCE });\n  K.check('Events run in date order, and no country is at war before the event that brought it in', () =>\n    EVENTS.every((e, i) => i === 0 || e.day > EVENTS[i - 1].day) && NATIONS.every(([, from]) => EVENTS.some((e) => e.day === from)));\n  K.check('The number at war never goes down as the days pass', () => {\n    for (let d = 1; d <= 37; d++) if (K.at({ day: d }).atWar < K.at({ day: d - 1 }).atWar) return false;\n    return true;\n  });\n\n  K.ready();\n<\/script>\n"},{"name":"sorting-elements","kind":"concept","body":"<\u0021-- kind: concept -->\n<style>\n  .groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }\n  .group { padding: 10px 12px 12px; border-radius: var(--k-r); background: var(--k-panel); }\n  .group-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 10px; }\n  .group-head b { font-size: .95rem; }\n  .group-head span { font-size: .8rem; color: var(--k-muted); }\n  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 6px; margin-top: 8px; }\n  .card { display: grid; grid-template-columns: auto 1fr; align-items: center; column-gap: 7px; padding: 6px 8px; border-radius: 10px; background: var(--k-bg); }\n  .card i { font-style: normal; font-size: 13px; line-height: 1; }\n  .card b { font-size: 1rem; line-height: 1.1; }\n  .card span { grid-column: 1 / -1; font-size: .75rem; color: var(--k-muted); }\n</style>\n\n<p class=\"lead\">Sort these ten elements three ways. Which way puts elements that behave alike in the same group?</p>\n\n<div class=\"k-controls\" id=\"controls\"></div>\n<div class=\"groups\" id=\"groups\" role=\"img\" aria-label=\"\"></div>\n<div class=\"key\" id=\"key\" aria-hidden=\"true\"></div>\n<div class=\"k-readouts\" id=\"outs\"></div>\n<p class=\"say\" id=\"say\"></p>\n<p class=\"caption\">Behaviour and state at room temperature, as in the source. A good grouping predicts things you did not sort by; a pair of group-mates \"behaves alike\" when they share the behaviour in the key.</p>\n\n<script>\n  // Source [1] of the lesson: the halogens, alkali metals and noble gases.\n  const SOURCE = 'https://en.wikipedia.org/wiki/Halogen';\n\n  // A fair set: the first members of three families in order (no hand-picking to make one sort\n  // look good), with hydrogen left out because it is not an alkali metal.\n  const ELEMENTS = [\n    { sym: 'Li', name: 'Lithium', column: 1, state: 'Solid', mass: 6.94, does: 'metal' },\n    { sym: 'Na', name: 'Sodium', column: 1, state: 'Solid', mass: 22.99, does: 'metal' },\n    { sym: 'K', name: 'Potassium', column: 1, state: 'Solid', mass: 39.10, does: 'metal' },\n    { sym: 'F', name: 'Fluorine', column: 17, state: 'Gas', mass: 19.00, does: 'salt' },\n    { sym: 'Cl', name: 'Chlorine', column: 17, state: 'Gas', mass: 35.45, does: 'salt' },\n    { sym: 'Br', name: 'Bromine', column: 17, state: 'Liquid', mass: 79.90, does: 'salt' },\n    { sym: 'I', name: 'Iodine', column: 17, state: 'Solid', mass: 126.90, does: 'salt' },\n    { sym: 'He', name: 'Helium', column: 18, state: 'Gas', mass: 4.00, does: 'inert' },\n    { sym: 'Ne', name: 'Neon', column: 18, state: 'Gas', mass: 20.18, does: 'inert' },\n    { sym: 'Ar', name: 'Argon', column: 18, state: 'Gas', mass: 39.95, does: 'inert' },\n  ];\n  // Three equal kinds of behaviour: categorical colours, each with its own shape too.\n  const DOES = {\n    metal: { text: 'Soft metal that fizzes in water', role: 'cat1', mark: '●' },\n    salt: { text: 'Joins with sodium to make a salt', role: 'cat2', mark: '▲' },\n    inert: { text: 'Hardly ever reacts', role: 'cat3', mark: '■' },\n  };\n  // Each way of sorting: the group an element goes in, and the groups in display order.\n  const SORTS = {\n    state: { groupOf: (e) => e.state, order: ['Solid', 'Liquid', 'Gas'] },\n    mass: { groupOf: (e) => e.mass < 30 ? 'Lighter atoms' : 'Heavier atoms', order: ['Lighter atoms', 'Heavier atoms'] },\n    column: { groupOf: (e) => 'Column ' + e.column, order: ['Column 1', 'Column 17', 'Column 18'] },\n  };\n  const groupsFor = (by) => SORTS[by].order.map((g) => ({ name: g, members: ELEMENTS.filter((e) => SORTS[by].groupOf(e) === g) }));\n  // Pairs of group-mates, and how many of them share a behaviour.\n  function pairs(by) {\n    let all = 0, alike = 0;\n    groupsFor(by).forEach((g) => g.members.forEach((a, i) => g.members.slice(i + 1).forEach((b) => { all++; if (a.does === b.does) alike++; })));\n    return { all, alike };\n  }\n\n  // The lesson's control: named options, opening on the first (index 0).\n  K.choice({ id: 'by', label: 'Sort them by', value: 0, into: '#controls', options: [\n    { value: 'state', label: 'Solid, liquid, gas' },\n    { value: 'mass', label: 'Weight' },\n    { value: 'column', label: 'Table column' },\n  ] });\n  K.readout({ id: 'alike', label: 'Group-mates alike', unit: '%', decimals: 0, into: '#outs' });\n  K.readout({ id: 'mixed', label: 'Mixed groups', into: '#outs' });\n\n  // The pure model: a way of sorting -> how well its groups predict behaviour.\n  K.model((p) => {\n    const n = pairs(p.by), groups = groupsFor(p.by);\n    return {\n      alike: n.all ? 100 * n.alike / n.all : 0,\n      mixed: groups.filter((g) => new Set(g.members.map((e) => e.does)).size > 1).length,\n      groups: groups.length,\n    };\n  });\n\n  const key = document.getElementById('key');\n  Object.keys(DOES).forEach((k) => key.appendChild(K.el('span', null, K.el('i', { style: { color: K.color(DOES[k].role), fontStyle: 'normal' } }, DOES[k].mark), DOES[k].text)));\n\n  K.update((p, o) => {\n    const box = document.getElementById('groups');\n    box.textContent = '';\n    groupsFor(p.by).forEach((g) => {\n      const kinds = new Set(g.members.map((e) => e.does)).size;\n      const verdict = g.members.length < 2 ? 'on its own' : kinds === 1 ? 'all behave alike' : 'mixed: ' + kinds + ' kinds';\n      box.appendChild(K.el('div', { class: 'group' },\n        K.el('div', { class: 'group-head' }, K.el('b', null, g.name + ' · ' + g.members.length), K.el('span', null, verdict)),\n        K.el('div', { class: 'cards' }, g.members.map((e) => K.el('div', { class: 'card' },\n          K.el('i', { style: { color: K.color(DOES[e.does].role) }, 'aria-hidden': 'true' }, DOES[e.does].mark), K.el('b', null, e.sym), K.el('span', null, e.name))))));\n    });\n    box.setAttribute('aria-label', groupsFor(p.by).map((g) => g.name + ': ' + g.members.map((e) => e.name + ' (' + DOES[e.does].text.toLowerCase() + ')').join(', ')).join('. '));\n    // The sentence uses the readout's own rounding (whole percent), so the two always agree.\n    const pct = K.fmt(o.alike, { decimals: 0 }) + '%';\n    document.getElementById('say').textContent = !K.moved ? 'Which way of sorting will keep elements that behave alike together? Make your guess, then try each one.' : {\n      state: 'Sorted by state, only ' + pct + ' of group-mates behave alike: bromine sits alone as the only liquid, and the gases mix elements that react eagerly with ones that hardly react at all.',\n      mass: 'Sorted by weight, just ' + pct + ' of group-mates behave alike: lithium shares a group with neon, potassium with bromine. Weight alone predicts almost nothing here.',\n      column: 'Sorted by column, ' + pct + ' of group-mates behave alike. Knowing the column tells you how an element reacts: a natural grouping, and the reason the periodic table is laid out this way.',\n    }[p.by];\n  });\n\n  // Known answers, counted by hand from the table above.\n  K.check('By column, all 12 pairs of group-mates behave alike (100%)', () => K.near(K.at({ by: 'column' }).alike, 100) && K.at({ by: 'column' }).mixed === 0);\n  K.check('By state, 7 of 16 pairs behave alike (43.75%)', () => K.near(K.at({ by: 'state' }).alike, 43.75));\n  K.check('By weight, 5 of 20 pairs behave alike (25%)', () => K.near(K.at({ by: 'mass' }).alike, 25) && K.at({ by: 'mass' }).mixed === 2);\n  K.check('At room temperature bromine is the only liquid; fluorine and chlorine are gases, iodine a solid', () =>\n    groupsFor('state')[1].members.map((e) => e.sym).join() === 'Br' &&\n    ['F', 'Cl'].every((s) => ELEMENTS.find((e) => e.sym === s).state === 'Gas') && ELEMENTS.find((e) => e.sym === 'I').state === 'Solid', { source: SOURCE });\n  K.check('A fair test: every sort places each of the ten exactly once', () =>\n    Object.keys(SORTS).every((by) => groupsFor(by).reduce((n, g) => n + g.members.length, 0) === 10 &&\n      ELEMENTS.every((e) => groupsFor(by).filter((g) => g.members.includes(e)).length === 1)));\n\n  K.ready();\n<\/script>\n"}];   // [{name, kind, body}] from app/kit/examples

U.interactive = (function () {
  // Which exemplar anchors which kind of idea: its own kind, then the nearest cousins.
  var NEAREST = {
    quantity: ['quantity', 'mechanism', 'skill'],
    mechanism: ['mechanism', 'quantity'],
    skill: ['skill', 'quantity', 'mechanism'],
    process: ['process', 'history', 'structure'],
    history: ['history', 'process', 'structure'],
    structure: ['structure', 'process', 'concept'],
    concept: ['concept', 'structure', 'process'],
  };
  var LEVEL = { new: 'Dan is new to this topic.', some: 'Dan knows a little about this topic.', solid: 'Dan is already fairly solid on this topic.' };
  var MAX_ATTEMPTS = 3; // the first build plus two repairs

  function str(v) { return v == null ? '' : String(v).trim(); }
  function clip(v, n) { v = str(v); return v.length > n ? v.slice(0, n - 1) + '…' : v; }
  function num(v) { var n = Number(v); return isFinite(n) ? String(+n.toPrecision(4)) : str(v); }
  function examples() { return Array.isArray(U.KIT_EXAMPLES) ? U.KIT_EXAMPLES : []; }
  function kitMd() { return typeof U.KIT_MD === 'string' && U.KIT_MD.indexOf('@@') !== 0 ? U.KIT_MD : '(kit reference missing from this build)'; }
  function kitHas(name) { return kitMd().indexOf(name) >= 0; }
  function exampleFor(kind) {
    var list = examples(), order = NEAREST[kind] || NEAREST.concept;
    for (var i = 0; i < order.length; i++) {
      var hit = list.filter(function (e) { return e.kind === order[i]; })[0];
      if (hit) return hit;
    }
    return list[0] || null;
  }

  // ---------- what the lesson needs from the page ----------
  function targetChecks(lesson) {
    return ((lesson && lesson.checks) || []).filter(function (c) { return c && c.type === 'target' && c.control && c.output; });
  }
  // Ids the page must have: controls that target checks set, and model outputs that target
  // checks read or the lesson declares.
  function requiredIds(lesson) {
    var out = { controls: [], outputs: [] };
    function add(list, id) { id = str(id); if (id && list.indexOf(id) < 0) list.push(id); }
    targetChecks(lesson).forEach(function (c) { add(out.controls, c.control); add(out.outputs, c.output); });
    (((lesson && lesson.interactive) || {}).outputs || []).forEach(function (o) { if (o) add(out.outputs, o.id); });
    return out;
  }

  // Web addresses: a page may contain only its lesson's own sources (SVG/XML namespaces aside).
  function sourceList(lesson) { return ((lesson && lesson.sources) || []).filter(function (s) { return s && s.url; }); }
  function urlKey(u) {
    return str(u).toLowerCase().replace(/^https?:\/\//, '').replace(/^www\d?\./, '').replace(/#.*$/, '').replace(/\/+$/, '');
  }
  function urlsIn(text) {
    var out = [], re = /https?:\/\/[^\s'"`<>\\)\]]+/gi, m;
    while ((m = re.exec(String(text || '')))) {
      var u = m[0].replace(/[.,;:!?]+$/, '');
      if (!/^https?:\/\/(www\.)?w3\.org\//i.test(u) && out.indexOf(u) < 0) out.push(u);
    }
    return out;
  }
  // Addresses in the body, or in the self-test's check sources, that are not the lesson's sources.
  function foreignUrls(html, lesson, report) {
    var allowed = sourceList(lesson).map(function (s) { return urlKey(s.url); }), found = urlsIn(html);
    ((report && report.checks) || []).forEach(function (c) {
      if (c && c.source) urlsIn(c.source).forEach(function (u) { if (found.indexOf(u) < 0) found.push(u); });
    });
    return found.filter(function (u) { return allowed.indexOf(urlKey(u)) < 0; });
  }
  function stripUrls(html, urls) {
    var out = String(html || '');
    urls.slice().sort(function (a, b) { return b.length - a.length; }).forEach(function (u) { out = out.split(u).join(''); });
    return out;
  }

  // Target checks the page can't satisfy by moving their control alone (U.sandbox.reach, when the
  // host has it) -> [{id, q, control, output, target, tolerance, best}]
  function unreachable(html, lesson) {
    var S = U.sandbox, list = targetChecks(lesson), out = [];
    if (!html || !S || typeof S.reach !== 'function' || !list.length) return Promise.resolve(out);
    return list.reduce(function (p, c) {
      return p.then(function () {
        return Promise.resolve().then(function () {
          return S.reach(html, { control: str(c.control), output: str(c.output), target: Number(c.target), tolerance: Math.abs(Number(c.tolerance)) || 0 });
        }).then(function (r) {
          // A page that could not be asked at all (load trouble) tells us nothing about the target.
          if (r && r.error && !r.tried) console.warn('target reach could not be checked', r.error);
          else if (r && r.reachable === false) out.push({ id: str(c.id), q: str(c.q), control: str(c.control), output: str(c.output), target: c.target, tolerance: c.tolerance, best: r.best || null });
        }, function (e) { console.warn('target reach could not be checked', e); });
      });
    }, Promise.resolve()).then(function () { return out; });
  }
  // best = {value: the control's setting, output: the reading there}, as U.sandbox.reach gives it.
  function bestText(b, control) {
    if (!b || b.output == null || !isFinite(Number(b.output))) return '';
    return ', but the closest this page gets is ' + num(b.output) + (b.value != null && b.value !== '' ? ', with "' + control + '" at ' + num(b.value) : '');
  }

  // ---------- prompt sections ----------
  function ideaSection(topic, idea) {
    topic = topic || {}; idea = idea || {};
    return [
      '## The idea',
      'Topic: ' + str(topic.title || topic.query),
      'Idea: ' + str(idea.title) + (idea.oneLine ? ' (' + str(idea.oneLine) + ')' : ''),
      'Kind: ' + (str(idea.kind) || 'concept'),
      LEVEL[topic.level] || LEVEL.new,
    ].join('\n');
  }
  function controlLine(c) {
    var head = '- id "' + str(c.id) + '": ' + str(c.label) + ', ';
    if (Array.isArray(c.options)) {
      var open = c.options[c.value] != null ? c.options[c.value] : c.options[0];
      return head + 'named options in this order: ' + c.options.map(function (x) { return '"' + str(x) + '"'; }).join(' / ') +
        ', opening on "' + str(open) + '" (K.choice; K.stepper when they are stages in order)';
    }
    if (c.min === 0 && c.max === 1 && c.step === 1) return head + 'an on/off switch (K.toggle), starting ' + (c.value ? 'on' : 'off');
    var unit = c.unit ? (/^[%°:×]/.test(str(c.unit)) ? '' : ' ') + str(c.unit) : '';
    return head + 'from ' + c.min + ' to ' + c.max + (c.step != null ? ' in steps of ' + c.step : '') + ', opening at ' + c.value + unit;
  }
  function isDp(o) { return typeof o.decimals === 'number' && o.decimals >= 0 && o.decimals <= 6 && Math.floor(o.decimals) === o.decimals; }
  function numberLine(n) {
    return '- ' + str(n.label) + ': ' + str(n.value) + ' (' + (str(n.kind) || 'number') + (n.source != null ? ', source [' + n.source + ']' : '') + ')';
  }
  function briefSection(lesson) {
    var spec = (lesson && lesson.interactive) || {}, out = ['## What the interactive must show'];
    if (spec.brief) out.push('Brief: ' + str(spec.brief));
    if (spec.title) out.push('Title (the app shows it above the frame, so do not repeat it): ' + str(spec.title));
    if (spec.whatAmILookingAt) out.push('The rule (the app also shows it beside the page, under "What am I looking at?"): ' + str(spec.whatAmILookingAt));
    if (spec.ignores) out.push('What the model leaves out (the app shows this in its own panel; do not repeat it on the page): ' + str(spec.ignores));
    var controls = (spec.controls || []).filter(function (c) { return c && c.id; });
    if (controls.length) {
      out.push('Controls (use these ids, ranges and opening values exactly):');
      controls.forEach(function (c) { out.push(controlLine(c)); });
    } else out.push('No controls were specified: choose the one that best shows the idea.');
    var outs = (spec.outputs || []).filter(function (o) { return o && o.id; });
    if (outs.length) {
      out.push('Outputs (return each from K.model under exactly this key, and show it with K.readout using the same id' +
        (outs.some(isDp) ? ' and the decimals given, which is how the explanation rounds it' : '') + '):');
      outs.forEach(function (o) {
        out.push('- id "' + str(o.id) + '": ' + str(o.label) + (o.unit ? ' (' + str(o.unit) + ')' : '') + (isDp(o) ? ', decimals: ' + o.decimals : ''));
      });
    } else if (Array.isArray(spec.outputs)) {
      out.push('Outputs: none. No rule computes a number here, so show no readouts beyond plain counts of what is on screen ("4 of 7 at war"): the picture, its labels and the .say line do the teaching.');
    }
    var nums = (spec.numbers || []).filter(function (n) { return n && n.label; });
    if (nums.length) {
      out.push('Numbers it may show (control = Dan sets it; computed = from the rule; constant = a fixed real value; assumed = an example value, shown as "for example"; date = a historical date or fact):');
      nums.forEach(function (n) { out.push(numberLine(n)); });
    }
    targetChecks(lesson).forEach(function (c) {
      out.push('A lesson check asks Dan: "' + clip(c.q, 200) + '" It sets control "' + str(c.control) + '" and reads "' + str(c.output) + '" through the kit (target ' + c.target +
        ', give or take ' + c.tolerance + '), every other control at its opening value. "' + str(c.output) + '" must be a key of what K.model returns, and the app checks that moving "' +
        str(c.control) + '" alone can reach the target.');
    });
    var pr = lesson && lesson.predict;
    if (pr && pr.q) {
      out.push('Dan\'s prediction, made before playing: "' + clip(pr.q, 240) + '"' + (pr.options && pr.options.length ? ' (options: ' + pr.options.map(str).join(' / ') + ')' : '') +
        '.');
    }
    return out.join('\n');
  }
  function explainSection(lesson) {
    var t = lesson && lesson.explain && lesson.explain.text;
    if (!t) return '';
    return '## The explanation Dan reads after playing (use the same words for the same things)\n' + clip(U.plain ? U.plain(t) : t, 1400);
  }
  function sourcesSection(lesson) {
    var src = sourceList(lesson);
    if (!src.length) {
      return '## Sources\nThis lesson has no checked sources, so the page contains no web addresses at all: its K.check entries are known-answer checks with no {source}, ' +
        'and the caption cites nothing. Use only textbook-standard rules, values and facts you are certain of. The app rejects any web address.';
    }
    return '## Sources\nThe only web addresses this page may contain, each only as a K.check {source} (the caption names a source in words); the app rejects any other:\n' + src.map(function (s) {
      return '[' + s.n + '] ' + clip(s.title, 120) + ' (' + str(s.url) + ')' + (s.quote ? ': "' + clip(s.quote, 240) + '"' : '');
    }).join('\n');
  }
  var DAN = [
    '## Dan and how he learns',
    '- He learns best by doing: something visual he can push and watch respond. Warm, plain words, first principles; no jargon unless explained.',
    '- He uses an Android phone (this frame is about 340 px wide there, touch only) and a laptop (about 1000 px, where K.stage puts the controls beside the visual). Design for the phone first.',
  ].join('\n');
  // What this lesson asks of the page beyond the kit reference's general rules (which cover
  // captions, rounding, colour words, extremes, checks and sound). Hiding the answer falls back
  // to a plain instruction when this build's KIT.md does not document k-after-move.
  function rulesSection() {
    return [
      '## Rules for this page',
      '- Dan answers his prediction by moving away from the opening state, so whatever gives the answer away stays hidden until his first move' +
        (kitHas('k-after-move') ? ' (the kit reference shows how: k-after-move, K.moved).' : ': reveal it once any control differs from its opening value.') +
        ' The opening view still looks alive: the picture, its labels and the opening state are drawn, and the lead line says what to try.',
      '- Show only the numbers listed above or computed from the rule, each written the way the explanation writes it (the same rounding). Show assumed values as examples ("for example, £1,000").',
      '- Any example cases you choose are fair and representative, never picked to exaggerate the effect.',
      '- Money, health and law: show how it works, never advice, and never a guaranteed outcome.',
    ].join('\n');
  }
  // KIT.md nested under this section: its title dropped, its headings one level down.
  function kitSection() { return '## The house kit (complete API reference)\n' + kitMd().replace(/^# [^\n]*\n+/, '').replace(/^(#{2,}) /gm, '#$1 '); }
  function outputSection(repair) {
    return '## Output\nReturn ONLY the ' + (repair ? 'complete corrected ' : '') + 'body: HTML elements, an optional <style>, then one inline <script> that ends with K.ready(). ' +
      'No <html>, <head> or <body> tags, no markdown fences, no commentary before or after. Keep it under 40 KB.';
  }

  // TASK: build-interactive
  function prompt(topic, idea, lesson, o) {
    o = o || {};
    var ex = exampleFor(idea && idea.kind);
    var parts = [
      'TASK: build-interactive',
      'You are building one small interactive page for "My University", Dan\'s personal learning app. It lets him see one idea for himself by playing with it. ' +
        'It runs inside a sandboxed iframe on top of the house kit described below, and the app tests it automatically before Dan sees it.',
      ideaSection(topic, idea),
      briefSection(lesson),
      explainSection(lesson),
      sourcesSection(lesson),
      DAN,
      rulesSection(),
      kitSection(),
    ];
    if (ex) {
      parts.push('## A finished example (kind: ' + ex.kind + '). Match its standard and structure, not its topic. Its SOURCE line and {source} addresses belong to that example\'s own lesson: never copy them\n' + ex.body.trim());
    }
    if (o.avoid) {
      parts.push('## Make it different\nA previous interactive for this idea did this: "' + clip(o.avoid, 400) + '". Dan has already seen it. ' +
        'Build a clearly different one: a different picture, or a different thing to push and watch.');
    }
    parts.push(outputSection(false));
    return parts.filter(Boolean).join('\n\n');
  }

  // ---------- problems, as lines a repair can act on ----------
  // Ids the lesson needs that the tested page lacks.
  function missingIds(report, lesson) {
    var req = requiredIds(lesson), out = [];
    var controls = (report && report.controls) || [], outs = (report && report.outputs) || [];
    req.controls.forEach(function (id) { if (controls.indexOf(id) < 0) out.push('Missing control id "' + id + '": a lesson check sets it, so a control must use exactly this id.'); });
    req.outputs.forEach(function (id) { if (outs.indexOf(id) < 0) out.push('Missing output "' + id + '": the lesson reads it, so K.model must return it under exactly this key (a readout alone is not enough).'); });
    return out;
  }
  function urlProblem(u, lesson) {
    return 'Unlisted web address "' + u + '": ' + (sourceList(lesson).length
      ? 'only the addresses under Sources may appear.'
      : 'this lesson has no checked sources, so the page must contain no web addresses.') + ' Remove it, and the {source} that holds it.';
  }
  function reachProblem(x) {
    return 'Target out of reach: check "' + x.id + '" asks Dan to move "' + x.control + '" until "' + x.output + '" reads ' + num(x.target) +
      (x.tolerance ? ' (give or take ' + num(x.tolerance) + ')' : '') + bestText(x.best, x.control) + '.';
  }
  // The failing report as plain lines (also used for the build loop's progress events).
  function problems(report, lesson, html) {
    if (!report) return ['The self-test did not run.'];
    var out = [];
    (report.errors || []).forEach(function (e) { out.push('Error: ' + e); });
    (report.checks || []).forEach(function (c) { if (!c.ok) out.push('Check failed: "' + c.label + '"' + (c.error ? ' (' + c.error + ')' : '')); });
    ((report.sweep && report.sweep.problems) || []).forEach(function (p) { out.push('While sweeping the controls: ' + p); });
    if (report.overflow) out.push('Too wide: ' + (report.overflowDetail || 'the page scrolls sideways at 340 px') + '.');
    (report.clipped || []).forEach(function (c) { out.push('Text cut off: ' + c); });
    out = out.concat(missingIds(report, lesson));
    var foreign = Array.isArray(report.foreign) ? report.foreign : html != null ? foreignUrls(html, lesson, report) : [];
    foreign.forEach(function (u) { out.push(urlProblem(u, lesson)); });
    (report.unreachable || []).forEach(function (x) { out.push(reachProblem(x)); });
    return out;
  }
  // The kit's warnings, minus advice to cite a source when the lesson has none to cite.
  function advice(report, lesson) {
    var sourced = sourceList(lesson).length > 0;
    return ((report && report.warnings) || []).filter(function (w) { return sourced || !/source/i.test(w); }).map(function (w) { return 'Advice: ' + w; });
  }

  // TASK: repair-interactive
  function repairPrompt(topic, idea, lesson, html, report) {
    var found = problems(report, lesson, html).concat(advice(report, lesson));
    return [
      'TASK: repair-interactive',
      'The interactive below, written for Dan\'s learning app, failed its automatic checks. Fix every problem listed and return the complete corrected body. Keep what already works.',
      ideaSection(topic, idea),
      briefSection(lesson),
      '## What the checks found (at 340, 720 and 1040 px wide)\n' + (found.length ? found.map(function (p) { return '- ' + p; }).join('\n') : '- It did not pass, but reported no details. Check that K.ready() is called once at the end.'),
      '## How to fix the usual problems\n' + [
        '- A thrown error (also from a K.button press or a K.anim step): go to the body line it names; check element ids, variable names and the kit call signatures.',
        '- NaN or Infinity: guard the maths at the ends of every control\'s range (division by zero, log of 0, square root of a negative), or start the range where the rule makes sense.',
        '- A model output that is a list or object: K.model returns single numbers or short strings; keep lists in your own variables.',
        '- Too wide at 340 px: let rows wrap (flex-wrap), use width:100% and max-width:100%, give SVG a viewBox with width 100%, no fixed widths over 300 px, shorter labels.',
        '- Text cut off: shorten it or let it wrap, or give it room (a wider box, a bigger viewBox); never cut it off or hide the overflow. SVG labels printed over each other, even by a letter or two: move one, or place them with K.labels. A plot\'s axis title too long for a phone: shorten it (about 30 characters).',
        '- The first control far below the main figure (phone layout): put the visual and its controls together with K.stage(visual, controls), secondary figures below.',
        '- K.sound: frequencies 20 to 20,000 Hz (200 to 2,000 for anything Dan must hear on a phone), dur above 0 and at most 10 s, gain 0 to 1, a listed type; play it from a K.button press.',
        '- Navigation, links out, connections or frames: everything stays on this page (no <a href> or forms, no location changes, no WebSocket, XMLHttpRequest or iframes); name sources in words.',
        '- A failing check: work the expected value out again by hand. Fix whichever is wrong, the model or the check. Never delete a correct check or change its expected answer to pass. A tolerance that was unrealistically tight (a millionth, where square roots or small steps meet rounding) may be widened to a sensible one (a thousandth of the size).',
        '- Slow updates: sample curves less densely and do not rebuild large parts of the page on every change.',
        '- Missing ids: use exactly the ids listed; an output must be a key of the object K.model returns.',
        '- An unlisted web address: delete it, and the {source} that held it.',
        '- A target out of reach: make the model follow the lesson\'s rule with the lesson\'s ranges and opening values, so moving that one control brings the output to the target.',
      ].join('\n'),
      sourcesSection(lesson),
      rulesSection(),
      kitSection(),
      '## The body that failed\n' + String(html || '(empty reply)'),
      outputSection(true),
    ].filter(Boolean).join('\n\n');
  }

  // A reply -> the body: strips fences, prose around the HTML, doctype and outer html/head/body
  // (keeping any <style> or <script> that was in the head).
  function extract(text) {
    var t = String(text || '');
    var fences = [], re = /```[a-zA-Z0-9-]*[ \t]*\n([\s\S]*?)```/g, m;
    while ((m = re.exec(t))) fences.push(m[1]);
    if (fences.length) t = fences.sort(function (a, b) { return b.length - a.length; })[0];
    else t = t.replace(/^\s*```[a-zA-Z0-9-]*[ \t]*\n/, '').replace(/\n```\s*$/, '');
    t = t.replace(/<!doctype[^>]*>/gi, '');
    t = t.replace(/<head\b[^>]*>([\s\S]*?)<\/head\s*>/i, function (_, inner) {
      return (inner.match(/<style\b[\s\S]*?<\/style\s*>|<script\b[\s\S]*?<\/script\s*>/gi) || []).join('\n');
    });
    t = t.replace(/<\/?(?:html|body)\b[^>]*>/gi, '').replace(/<title\b[\s\S]*?<\/title\s*>/gi, '').replace(/<meta\b[^>]*>/gi, '');
    var first = t.search(/<[a-zA-Z!]/);
    if (first > 0) t = t.slice(first);
    var last = t.lastIndexOf('>');
    if (last >= 0) t = t.slice(0, last + 1);
    return first < 0 ? '' : t.trim();
  }

  // Test one body against the kit's self-test and the lesson's own needs. The report gains
  // missing (ids), foreign (web addresses), unreachable (target checks) and passed (the
  // self-test proper, with the lesson's ids); ok is true only when nothing at all is wrong.
  function testBody(html, lesson) {
    if (!html) return Promise.resolve({ ok: false, passed: false, errors: ['The reply contained no HTML.'], overflow: false, checks: [], sweep: { ok: false, problems: [] }, controls: [], readouts: [], outputs: [], warnings: [], missing: [], foreign: [], unreachable: [] });
    return U.sandbox.test(html, { widths: [340, 720, 1040] }).then(function (r) {
      r.missing = missingIds(r, lesson);
      r.foreign = foreignUrls(html, lesson, r);
      r.unreachable = [];
      r.passed = !!r.ok && !r.missing.length;
      r.ok = r.passed && !r.foreign.length;
      if (!r.passed) return r;
      return unreachable(html, lesson).then(function (list) {
        r.unreachable = list;
        if (list.length) r.ok = false;
        return r;
      });
    });
  }

  // build(topic, idea, lesson, {onStatus, avoid, signal, priority, key})   priority: 'background' for
  //   a prefetch, or a function returning it (read at each call); key: U.ask's gate key
  //   -> Promise<{html, title, brief, selftest, attempts, unreachable?:[check ids]} | null>
  // Resolves null when the lesson has no interactive brief or no attempt passed its self-test;
  // rejects only when Claude can't be reached ({code, message} from U.ask). `unreachable` lists
  // target checks the final page could not satisfy: the caller drops them from the lesson.
  function build(topic, idea, lesson, o) {
    o = o || {};
    var spec = lesson && lesson.interactive;
    if (!spec) return Promise.resolve(null);
    var status = function (t) { if (o.onStatus) try { o.onStatus(t); } catch (e) { console.error(e); } };
    var attempts = 0, html = '';
    function ask(text, label) {
      var priority = typeof o.priority === 'function' ? o.priority() : o.priority;
      return U.ask(text, { tier: 'complex', label: label, signal: o.signal, priority: priority, key: o.key });
    }
    function check(reply) {
      attempts++;
      html = extract(reply);
      status(attempts === 1 ? 'Testing it on a phone-sized screen…' : 'Testing the fix…');
      return testBody(html, lesson);
    }
    function result(report) {
      return { html: html, title: str(spec.title) || str(idea && idea.title) || 'Interactive', brief: str(spec.brief), selftest: report, attempts: attempts };
    }
    function next(report) {
      U.emit('interactive-test', { idea: idea && idea.id, attempt: attempts, ok: report.ok, problems: report.ok ? [] : problems(report, lesson).slice(0, 6) });
      if (report.ok) return result(report);
      if (attempts < MAX_ATTEMPTS) {
        status('Fixing something the test found…');
        return ask(repairPrompt(topic, idea, lesson, html, report), 'repair-interactive').then(check).then(next);
      }
      return salvage(report);
    }
    // Out of repairs, a page that passes its own self-test is still kept: unlisted web addresses
    // are stripped (and the page tested again), and unreachable target checks are reported.
    function salvage(report) {
      if (!report.passed) return null;
      var again = report.foreign.length ? testBody(html = stripUrls(html, report.foreign), lesson) : Promise.resolve(report);
      return again.then(function (r) {
        if (!r.passed || r.foreign.length) return null;
        r.ok = true;
        var out = result(r);
        if (r.unreachable.length) out.unreachable = r.unreachable.map(function (x) { return x.id; });
        return out;
      });
    }
    status('Building the interactive…');
    return ask(prompt(topic, idea, lesson, { avoid: o.avoid }), 'build-interactive').then(check).then(next);
  }

  return {
    prompt: prompt, repairPrompt: repairPrompt, extract: extract, build: build, problems: problems,
    exampleFor: exampleFor, requiredIds: requiredIds, foreignUrls: foreignUrls, stripUrls: stripUrls, unreachable: unreachable,
  };
})();

// ---- src/js/40-fsrs.js ----
// Spaced-review scheduler: FSRS-4.5 at day granularity (docs/ARCHITECTURE.md section 8).
//
// A card's memory state is s = { due, stability, difficulty, reps, lapses, last }, where
// stability is the number of days until recall probability falls to 90%, difficulty runs 1..10,
// and due/last are local 'YYYY-MM-DD' days. Grades: 1 Again, 2 Hard, 3 Good, 4 Easy.
//
//   U.fsrs.init(day)                       new card, first due the day after `day`
//   U.fsrs.review(s, grade, day, cardId?)  state after a review on `day`
