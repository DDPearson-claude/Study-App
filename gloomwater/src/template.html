<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05070b">
<meta name="description" content="Gloomwater — a lantern-lit 3D fishing survival roguelite. Fish, survive the Gloomtide, descend.">
<title>Gloomwater</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap">
<style>
  :root { color-scheme: dark; --ink: #05070b; --bone: #e9e2cf; --amber: #ffbf6b; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ink); color: var(--bone);
    font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #game { position: fixed; inset: 0; touch-action: none; }
  #game canvas { display: block; width: 100%; height: 100%; outline: none; }
  #ui { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  #loader { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 60%, #0c1018 0%, #05070b 70%); transition: opacity 1s ease; }
  #loader.done { opacity: 0; pointer-events: none; }
  #loader h1 { font-family: Cinzel, Georgia, serif; font-weight: 400; letter-spacing: .35em; font-size: clamp(28px, 6vw, 56px); margin: 0 0 .4em; color: var(--bone); text-shadow: 0 0 24px rgba(180, 196, 240, .35); }
  #loader .flame { width: 14px; height: 22px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; background: radial-gradient(circle at 50% 70%, #fff6d8, var(--amber) 45%, rgba(255,120,40,0) 75%);
    filter: blur(.4px); animation: flick 1.4s ease-in-out infinite; box-shadow: 0 0 30px 8px rgba(255,170,80,.35); }
  #loader p { margin-top: 1.4em; font-style: italic; opacity: .6; letter-spacing: .08em; }
  @keyframes flick { 0%,100% { transform: scale(1) translateY(0); } 50% { transform: scale(.88, 1.08) translateY(-2px); } }
  #fatal { position: fixed; inset: 0; z-index: 200; display: none; align-items: center; justify-content: center; text-align: center; padding: 24px; background: #05070b; }
</style>
</head>
<body>
<div id="game"></div>
<div id="ui"></div>
<div id="loader"><div class="flame"></div><h1>GLOOMWATER</h1><p>kindling the lantern…</p></div>
<div id="fatal"><div><h2 style="font-family:Cinzel,Georgia,serif;letter-spacing:.2em">The lantern will not light</h2><p id="fatal-msg">This game needs WebGL2. Try a recent Chrome, Edge, Firefox or Safari.</p></div></div>
<script>
  (function () {
    try {
      var c = document.createElement('canvas');
      if (!c.getContext('webgl2')) throw new Error('no webgl2');
    } catch (e) {
      document.getElementById('fatal').style.display = 'flex';
      document.getElementById('loader').style.display = 'none';
    }
  })();
</script>
<!--GAME_SCRIPT-->
</body>
</html>
