<div class="sk"><svg id="sk-svg" viewBox="0 0 320 120" role="img" aria-label="A skater throwing a ball"><rect x="0" y="100" width="320" height="4" fill="currentColor" opacity=".3"/><circle id="sk-me" cx="160" cy="80" r="16" fill="currentColor"/><circle id="sk-ball" cx="130" cy="88" r="7" fill="currentColor" opacity=".6"/></svg></div>
<div id="controls"></div>
<div id="outs"></div>
<div id="plot"></div>
<script>
var c = K.theme.c;
K.control({ id: 'ballMass', label: 'Mass of the ball', min: 0.5, max: 10, step: 0.5, value: 2, unit: 'kg', into: '#controls' });
K.control({ id: 'throwSpeed', label: 'How fast you throw it backwards', min: 1, max: 20, step: 1, value: 10, unit: 'm/s', into: '#controls' });
K.readout({ id: 'skaterSpeed', label: 'Your speed forwards', unit: 'm/s', into: '#outs' });
K.model(function (p) { return { skaterSpeed: p.ballMass * p.throwSpeed / 70 }; });
var plot = K.plot('#plot', { x: { min: 0.5, max: 10, label: 'Ball mass (kg)' }, y: { min: 0, max: 3, label: 'Your speed (m/s)' }, series: [{ fn: function (m) { return m * K.params().throwSpeed / 70; } }] });
K.update(function (p, o) { plot.draw({ marks: [{ x: p.ballMass, y: o.skaterSpeed, label: o.skaterSpeed.toFixed(2) + ' m/s' }] }); document.getElementById('sk-me').setAttribute('cx', 160 + o.skaterSpeed * 20); });
K.check('A 2 kg ball at 10 m/s sends a 70 kg skater off at about 0.29 m/s', function () { return Math.abs(2 * 10 / 70 - 0.2857) < 0.001; });
K.check('A 7 kg ball at 10 m/s gives 1 m/s', function () { return Math.abs(7 * 10 / 70 - 1) < 1e-9; });
K.ready();
</script>
