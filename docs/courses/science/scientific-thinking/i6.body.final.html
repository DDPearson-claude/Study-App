<p class="caption">Light leaves a mirror at the angle it arrives. The image is as far behind as the object is in front.</p>

<script>
  // ---------- helpers ----------
  const BITESIZE = 'https://www.bbc.co.uk/bitesize/guides/zw42ng8/revision/1';
  const OPENSTAX = 'https://openstax.org/books/university-physics-volume-3/pages/2-1-images-formed-by-plane-mirrors';
  const el = (id) => document.getElementById(id);
  const rad = (d) => d * Math.PI / 180, deg = (r) => r * 180 / Math.PI;
  const r3 = (v) => Math.round(v * 1000) / 1000, r1 = (v) => Math.round(v * 10) / 10;
  const near = (a, b, tol) => Math.abs(a - b) <= tol;
  const whole = (v) => Math.round(Math.round(v * 1e6) / 1e6);
  const fm = (v) => K.fmt(v, { decimals: Number.isInteger(r1(v)) ? 0 : 1 });
  const f1 = (v) => K.fmt(v, { decimals: 1 });
  // Points and directions on the page.
  const P2 = (x, y) => ({ x, y });
  const plus = (a, b) => P2(a.x + b.x, a.y + b.y), minus = (a, b) => P2(a.x - b.x, a.y - b.y), times = (a, k) => P2(a.x * k, a.y * k);
  const dot = (a, b) => a.x * b.x + a.y * b.y, size = (a) => Math.hypot(a.x, a.y), unit = (a) => times(a, 1 / (size(a) || 1));
  const dist = (a, b) => size(minus(a, b)), lerpP = (a, b, t) => P2(a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t);
  const angDeg = (a, b) => deg(Math.acos(K.clamp(dot(unit(a), unit(b)), -1, 1)));
  const rotV = (v, a) => P2(v.x * Math.cos(rad(a)) - v.y * Math.sin(rad(a)), v.x * Math.sin(rad(a)) + v.y * Math.cos(rad(a)));

  // ---------- the rule: a flat mirror and the law of reflection ----------
  // A mirror: its centre c, its surface turned a degrees, h long each side of c. Its shiny front faces n.
  function mirror(c, a, h) { const u = P2(Math.cos(rad(a)), Math.sin(rad(a))); return { c, a, h, u, n: P2(-u.y, u.x) }; }
  const ends = (m) => [plus(m.c, times(m.u, -m.h)), plus(m.c, times(m.u, m.h))];
  // The law: the part of the light's direction along the normal turns round; the part along the surface stays.
  const bounce = (d, m) => minus(d, times(m.n, 2 * dot(d, m.n)));
  // Where a point's image sits: straight across the mirror's line, as far behind as the point is in front.
  const imageOf = (p, m) => minus(p, times(m.n, 2 * dot(minus(p, m.c), m.n)));
  // Where the line from a to b crosses the mirror's line, and whether that is on the mirror itself.
  function cross(a, b, m) {
    const da = dot(minus(a, m.c), m.n), db = dot(minus(b, m.c), m.n);
    if (Math.abs(da - db) < 1e-12) return null;
    const t = da / (da - db), p = lerpP(a, b, t);
    return { p, t, on: Math.abs(dot(minus(p, m.c), m.u)) <= m.h + 1e-9 };
  }
  // The light from a source s that reaches an eye e: the eye's line back to the image must cross the mirror.
  function path(s, e, m) {
    const img = imageOf(s, m), x = cross(e, img, m);
    const front = dot(minus(s, m.c), m.n) > 0 && dot(minus(e, m.c), m.n) > 0;
    if (!x) return { img, seen: false };
    return { img, seen: front && x.on && x.t > 0 && x.t < 1, P: x.p, inc: angDeg(minus(s, x.p), m.n), ref: angDeg(minus(e, x.p), m.n) };
  }

  // The torch bench: a mirror across the top, a torch 150 units from where its beam strikes.
  const TC = P2(170, 62), TH = 125, TL = 150, RL = 160, M0 = mirror(TC, 0, TH);
  const torchPos = (th) => plus(TC, times(plus(times(M0.n, Math.cos(rad(th))), times(M0.u, -Math.sin(rad(th)))), TL));
  function beam(tp, m) { const d = unit(minus(m.c, tp)), out = bounce(d, m); return { d, out, inc: angDeg(minus(tp, m.c), m.n), ref: angDeg(out, m.n) }; }
  // The lamp-and-eye bench: the mirror's line, 2 drawing units to the centimetre.
  const BM = 120;
  // The wall mirror for standing in front of: 50 drawing units to the metre.
  const YM = 110, PERM = 50;
  // The periscope: the top mirror, 60 drawing units to the metre of drop.
  const PX = 226, PYT = 58, PPM = 60;

  // The lesson's example figures.
  const SURF = 25, MOVE = 30, D0 = 1.2, STEP = 0.4, KNOCK = 2;
  // The knock as drawn: larger than real, so the turn can be seen. Labels give the lesson's figure.
  const KDRAW = 8;
  const PER_A = { L: 10, gap: 1.5, e: 0.1 }, PER_B = { L: 30, gap: 2, e: 0.1 };
  // The target's two spots, as directions from where the beam strikes: it moves MOVE degrees round the mirror.
  const TARGET0 = beam(torchPos(30), M0).out, TARGET1 = rotV(TARGET0, -MOVE);
  // How far off vertical a 45° periscope mirror sends level light once it is knocked k degrees.
  const knockOff = (k) => angDeg(bounce(P2(1, 0), mirror(P2(0, 0), 45 + k, 1)), P2(0, 1));

      want: 'At the same slant, tipped the other way',

        'Along the mirror\'s surface': 'A mirror sends light back off it, not along it.' },
      why: 'A mirror sends light off at the same slant it arrives at. It leaves on the other side of the line square to the mirror.' },
    { show: true, name: 'Equal angles', pic: 'torch', H: 236, swing: [60, 35], drag: ['torch'], dur: 3.9,
      tl: { in: [0.4, 1.0], out: [1.0, 1.6], nrm: 1.7, ang: 2.0, swing: [2.6, 3.8] },

    { kind: 'typed', name: 'From the normal', pic: 'torch', H: 206, th: 90 - SURF, nrm: true, run: 1.3, ans: 'norm', unit: '°', decimals: 0,

      task: 'A beam strikes a mirror at 25° to the mirror\'s surface. What is the angle of reflection?',

    { show: true, name: 'Turn the mirror', pic: 'torch', H: 244, tlab: 'left', th: 30, turnTo: -10, nrm: true, drag: ['handle'], dur: 3.7,

      text: 'With the torch still, the reflected beam turns twice as far as the mirror. Turn the mirror 10°, and the normal turns 10° with it. So the angle of incidence goes from 30° to 40°. The angle of reflection does too. The angle between the arriving and leaving beams is the two added. So it changes by 20°.',

    { kind: 'typed', name: 'Follow the target', pic: 'torch', H: 252, tlab: 'left', th: 30, target: true, run: 1.0, dragAfter: ['handle'], actAfter: 'Now turn the mirror by its handle onto the target.', ans: 'tgt', unit: '°', decimals: 0,

    }
    const Dn = d.dist - d.step, k = sv ? G(0.2, 1.2) : 0, D = K.lerp(d.dist, Dn, k), you = P2(170, YM + D * PERM);
    const qa = sv ? 1 - A(0.2) : 1, s0 = P2(206, YM + d.dist * PERM), s1 = P2(206, YM + Dn * PERM);
    part(qa, () => { dim(134, YM + d.dist * PERM, YM + 2); line('stepl', s0, plus(s1, P2(0, 2))); head('steph', s1, minus(s1, s0), 9); });
    lab(P2(126, YM + d.dist * PERM / 2 + 5), f1(d.dist) + ' m', 'lab', qa, 'end');
    lab(P2(216, (s0.y + s1.y) / 2 + 5), f1(d.step) + ' m step', 'lab', qa, 'start');
    lab(P2(170, 62), 'your image: ? m away', 'q', qa);
    personAt(you, false);
    lab(plus(you, P2(0, 30)), 'you', 'tag', 1);
    if (sv) {
      const img = imageOf(P2(170, YM + Dn * PERM), m), gap = (YM - img.y) / PERM, a1 = A(1.0), a3 = A(1.4);
      part(a1, () => { personAt(img, true); dim(206, YM + Dn * PERM, YM + 2); dim(206, YM - 2, img.y); });
      lab(plus(img, P2(0, -20)), 'image', 'tag', a1);
      lab(P2(214, YM + Dn * PERM / 2 + 5), f1(Dn) + ' m', 'lab', a1, 'start');
      lab(P2(214, (YM + img.y) / 2 + 5), f1(gap) + ' m', 'lab', a1, 'start');
      part(a3, () => dim(134, YM + Dn * PERM, img.y));
      lab(P2(126, YM + Dn * PERM / 2 + 5), f1(Dn) + ' + ' + f1(gap) + ' = ' + f1(Dn + gap) + ' m', 'lab', a3, 'end');
      REC.you = { D: Dn, gap };
      REC.say.push('You now stand ' + f1(Dn) + ' m from the mirror. Your image is ' + f1(gap) + ' m behind it, ' + f1(Dn + gap) + ' m from you.');
    } else REC.say.push('You stand ' + f1(d.dist) + ' m from a wall mirror, about to step ' + f1(d.step) + ' m closer.');
  }

  // ---------- the periscope (steps 12 and 13) ----------
  function scenePeri(d, st) {
    const sv = solved(st), q = d.per, yB = PYT + q.gap * PPM;
    const mt = mirror(P2(PX, PYT), 45, 26), mb = mirror(P2(PX, yB), 225, 26);
    const lamp = P2(34, PYT), dIn = unit(minus(mt.c, lamp)), down = bounce(dIn, mt);
    const second = d.sw ? st.second : true, T1 = !!(d.sw && st.second);
    // On the switch screen the opening runs until the switch is on; then only the second mirror's parts move.
    const g0 = (t) => (T1 || !d.show ? 1 : G(t[0], t[1])), a0 = (t) => (T1 || !d.show ? 1 : A(t));
    const x = cross(mt.c, plus(mt.c, times(down, 1000)), mb), hit = x.p, out = bounce(down, mb);
    const eye = plus(hit, times(out, 74)), imgP = minus(hit, times(out, hit.x - lamp.x));
    REC.peri = { dIn, down, out, hit, mbc: mb.c, second };
    drawMirror(mt);
    lampAt(lamp);
    lab(plus(lamp, P2(0, 30)), d.show ? 'lamp' : 'object', 'tag', 1);
    ray(lamp, mt.c, d.show ? g0(d.tl.in) : 1);
    if (second) {
      const am = T1 ? A(d.tl2.mb) : 1;
      part(am, () => drawMirror(mb));
      ray(mt.c, hit, d.show ? g0(d.tl.down) : 1);
      ray(hit, eye, T1 ? G(d.tl2.out[0], d.tl2.out[1]) : 1);
      lab(P2((hit.x + eye.x) / 2, yB + 26), fm(q.e) + ' m', 'lab', am);
    } else ray(mt.c, P2(PX, yB + 24), g0(d.tl.down));
    eyeAt(eye, minus(hit, eye));
    lab(plus(eye, P2(0, 28)), 'eye', 'tag', 1);
    lab(P2((lamp.x + PX) / 2, PYT - 12), fm(q.L) + ' m', 'lab', 1);
    if (second) lab(P2(PX + 10, (PYT + yB) / 2 + 5), fm(q.gap) + ' m', 'lab', T1 ? A(d.tl2.mb) : 1, 'start');
    if (d.sw) {
      const an = a0(d.tl.nrm), aa = a0(d.tl.ang), toLamp = minus(lamp, mt.c);
      part(an, () => line('nrm', mt.c, plus(mt.c, times(mt.n, 34))));
      lab(P2(PX - 32, PYT + 52), 'normal', 'tag', an, 'end');
      part(aa, () => { arc(mt.c, toLamp, mt.n, 18); arc(mt.c, mt.n, down, 18); });
      lab(bisect(mt.c, toLamp, mt.n, 46), whole(angDeg(toLamp, mt.n)) + '°', 'ang', aa);
      lab(bisect(mt.c, mt.n, down, 46), whole(angDeg(down, mt.n)) + '°', 'ang', aa);
    }
    let ab = 0, ai = 0, ar = 0;
    if (d.sw) { if (st.second) { ab = A(d.tl2.back); ai = A(d.tl2.img); ar = A(d.tl2.ro); } }
    else if (sv) { ab = A(0.2); ai = A(0.8); ar = A(1.2); }
    part(ab, () => line('back', hit, imgP));
    part(ai, () => imgAt(imgP));
    lab(plus(imgP, P2(0, 28)), 'image', 'tag', ai);
    const total = r1(q.L + q.gap + q.e);
    REC.peri.total = total;
    if (ar > 0) part(ar, () => text(12, d.H - 34, 'image from the eye: ' + fm(q.L) + ' + ' + fm(q.gap) + ' + ' + fm(q.e) + ' = ' + fm(total) + ' m', 'ro'));
    else if (!d.sw) text(12, d.H - 34, 'image from the eye: ? m', 'ro');
    keyRow(d.H - 8, [['back', 'traced back, no light.'], [null, 'Not to scale.']]);
    REC.say.push('Light from ' + (d.show ? 'a lamp' : 'an object') + ' ' + fm(q.L) + ' m away strikes a mirror at 45° and turns down through 90°.' +
      (second ? ' It drops ' + fm(q.gap) + ' m to a second mirror at 45°, which turns it out to an eye ' + fm(q.e) + ' m away.' : ''));
    if (ar >= 0.5) REC.say.push('The image looks ' + fm(total) + ' m away, the whole folded path.');
  }

  // ---------- a knocked periscope mirror (step 14) ----------
  function sceneKnock(d, st) {
    const sv = solved(st), P = P2(196, 76), m = mirror(P, 45 + KDRAW, 80), ref = mirror(P, 45, 80);
    const out = bounce(P2(1, 0), m), yEnd = 228, end = plus(P, times(out, (yEnd - P.y) / out.y)), off = whole(knockOff(d.knock));
    REC.knock = { off: knockOff(d.knock), turn: d.knock, drawnOff: angDeg(out, P2(0, 1)), drawnTurn: angDeg(m.u, ref.u) };
    line('was', ...ends(ref));
    line('was', P, P2(P.x, yEnd));
    drawMirror(m);
    ray(P2(16, P.y), P, 1);
    ray(P, end, 1);
    arc(P, P2(0, 1), out, 150);
    arc(P, ref.u, m.u, 58);
    lab(P2(80, P.y - 12), 'level light', 'tag', 1);
    lab(plus(ends(ref)[0], P2(-8, 4)), 'at 45°', 'tag', 1, 'end');
    lab(plus(ends(m)[1], P2(8, 12)), 'knocked ' + whole(REC.knock.turn) + '°', 'lab', 1, 'start');
    lab(P2(P.x + 10, yEnd - 14), 'straight down', 'tag', 1, 'start');
    if (sv) lab(P2(end.x - 10, yEnd - 14), off + '° off vertical', 'ang', A(0.3), 'end');
    else lab(P2(end.x - 10, yEnd - 14), '? off vertical', 'q', 1, 'end');
    text(12, d.H - 30, 'Not to scale: the knock is drawn larger.', 'key');
    keyRow(d.H - 8, [['was', 'Dashed: the mirror at 45°, and straight down.']]);
    REC.say.push('Level light strikes a periscope\'s top mirror, knocked ' + whole(REC.knock.turn) + '° off 45°, drawn larger than real.' + (sv ? ' It now goes down ' + off + '° off vertical.' : ''));
  }

  // ---------- the scene for a step: draw, then place every label clear of the rest ----------
  function scene(i, st) {
    const d = STEPS[i];
    REC = { texts: [], rays: [], say: [], handles: {} };
    LAB = [];
    art.textContent = '';
    into = null;
    svg.setAttribute('viewBox', '0 0 340 ' + d.H);
    if (d.pic === 'torch') sceneTorch(d, st);
    else if (d.pic === 'bench') sceneBench(d, st);
    else if (d.pic === 'you') sceneYou(d, st);
    else if (d.pic === 'peri') scenePeri(d, st);
    else sceneKnock(d, st);
    const g = art.appendChild(K.svg('g', { class: 'labs' }));
    const avoid = Array.from(art.querySelectorAll('line, path, circle, ellipse, rect, polygon')).filter((n) => !n.classList.contains('lit') && !g.contains(n));
    const ts = K.labels(g, LAB.map((l) => ({ x: r3(l.x), y: r3(l.y), text: l.text, anchor: l.anchor, class: l.cls })), { avoid });
    ts.forEach((t, k) => K.fade(t, LAB[k].a, 0));
    LAB.forEach((l) => { if (l.a >= 0.5) REC.texts.push(l.text); });
    svg.setAttribute('aria-label', REC.say.join(' '));
  }

  // ---------- controls ----------
  const stepper = K.stepper({ id: 'step', label: 'Step', steps: STEPS.map((d) => d.name), value: 0, compact: true, into: '#prog' });
  const cur = () => Math.round(stepper.get());
  // Which handles can be dragged on a step: a SHOW step's own, or a puzzle's once it is checked.
  const dragsOf = (i) => STEPS[i].drag || (STEPS[i].dragAfter && solved(ST[i]) ? STEPS[i].dragAfter : null);
  const hintFor = (d, st) => (d.hints && d.hints[st.pick]) || d.hint;
  const anim = K.anim({ button: false, label: 'Moving', step: (dt) => {
    if (finished) return false;
    T += dt;
    paint();
    return T < motionEnd;
  } });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !anim.playing() && T !== Infinity) { T = Infinity; paint(); } });
  function play(dur) {
    if (quiet()) { anim.pause(); T = Infinity; paint(); return; }
    motionEnd = dur; T = 0; anim.play();
  }
  function finishNow() { anim.pause(); T = Infinity; K.refresh(); }
  function enter(id) {
    if (REDUCE) return;
    const box = el(id);
    box.classList.remove('enter'); void box.offsetWidth; box.classList.add('enter');
  }
  function resetShow(st) { st.th = null; st.phi = null; st.eye = null; st.lamp = null; st.dragged = false; st.second = false; }
  function enterStep(i) {
    lastStep = i; enter('stepbox'); hold = null;
    const d = STEPS[i], st = ST[i];
    if (d.show) { resetShow(st); play(d.dur); } else { anim.pause(); T = Infinity; }
  }
  function startRun(i) { play(STEPS[i].run); }

  // ---------- Dan's hands on the picture: drag the torch, the mirror's handle, the eye or the lamp ----------
  function paint(i) {
    if (i == null) i = cur();
    scene(i, ST[i]);
    placeHits(i);
  }
  const HITS = [0, 1].map(() => {
    const c = ui.appendChild(K.svg('circle', { class: 'hit', r: 24, cx: -100, cy: -100, tabindex: -1, role: 'button' }));
    c.style.display = 'none';
    return c;
  });
  const NAMES = { torch: 'The torch: drag it round, or use the arrow keys', handle: 'The mirror\'s handle: drag it to turn the mirror, or use the arrow keys',
    eye: 'The eye: drag it, or use the arrow keys', lamp: 'The lamp: drag it, or use the arrow keys' };
  function placeHits(i) {
    const kinds = finished || !dragsOf(i) ? [] : dragsOf(i);
    HITS.forEach((c, k) => {
      const kind = kinds[k], p = kind && REC.handles[kind];
      c.style.display = p ? '' : 'none';
      c.setAttribute('tabindex', p ? '0' : '-1');
      if (!p) return;
      c.dataset.kind = kind;
      c.setAttribute('cx', r3(p.x)); c.setAttribute('cy', r3(p.y));
      c.setAttribute('aria-label', NAMES[kind]);
    });
  }
  function svgPt(e) {
    const m = svg.getScreenCTM();
    if (!m) return null;
    const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(m.inverse());
    return P2(p.x, p.y);
  }
  function moveTo(kind, q) {
    const i = cur(), d = STEPS[i], st = ST[i];
    const dr = dragsOf(i);
    if (finished || !dr || dr.indexOf(kind) < 0) return;
    if (kind === 'torch') { const v = minus(q, TC); st.th = Math.round(K.clamp(deg(Math.atan2(-v.x, v.y)), 25, 75)); }
    else if (kind === 'handle') {
      st.phi = Math.round(K.clamp(deg(Math.atan2(q.y - TC.y, q.x - TC.x)), -20, 20));
      // Within 2° of the target, the mirror settles onto it.
      if (d.target && Math.abs(st.phi + d.answer) <= 2) st.phi = -d.answer;
    }
    else if (kind === 'eye') st.eye = P2(K.clamp(q.x, 16, 324), K.clamp(q.y, BM + 26, 250));
    else if (kind === 'lamp') st.lamp = P2(Math.round(K.clamp(q.x, 40, 300)), BM + 2 * Math.round(K.clamp((q.y - BM) / 2, 15, 65)));
    st.dragged = true;
    if (anim.playing()) anim.pause();
    T = Infinity;
    K.reveal(); K.refresh();
  }
  HITS.forEach((c) => {
    c.addEventListener('pointerdown', (e) => {
      const kind = c.dataset.kind;
      if (!kind) return;
      hold = { id: e.pointerId, kind };
      try { c.setPointerCapture(e.pointerId); } catch (err) { /* the drag still follows the pointer while it stays on the target */ }
      e.preventDefault();
      const q = svgPt(e);
      if (q) moveTo(kind, q);
    });
    c.addEventListener('pointermove', (e) => { if (!hold || hold.id !== e.pointerId) return; const q = svgPt(e); if (q) moveTo(hold.kind, q); });
    const letGo = (e) => { if (hold && hold.id === e.pointerId) hold = null; };
    c.addEventListener('pointerup', letGo);
    c.addEventListener('pointercancel', letGo);
    c.addEventListener('lostpointercapture', () => { hold = null; });
    c.addEventListener('keydown', (e) => {
      const kind = c.dataset.kind, by = { ArrowUp: P2(0, -8), ArrowDown: P2(0, 8), ArrowLeft: P2(-8, 0), ArrowRight: P2(8, 0) }[e.key];
      if (!kind || !by || !REC.handles[kind]) return;
      e.preventDefault();
      moveTo(kind, plus(REC.handles[kind], by));
    });
  });

  // ---------- answers: up to four choices, or a typed field for each figure ----------
  const pickBtns = [0, 1, 2, 3].map((k) => K.button({ label: 'Answer ' + (k + 1), secondary: true, into: '#picks', press: () => {
    const i = cur(), d = STEPS[i], st = ST[i];
    if (finished || d.kind !== 'pick' || k >= d.opts.length || solved(st)) return;
    st.pick = d.opts[k]; st.res = null;
  } }));
  const FIELDS = {};
  STEPS.forEach((d, i) => {
    if (d.kind !== 'typed') return;
    el('answers').appendChild(K.el('div', { id: 'ans-' + d.ans }));
    const a = K.answer({ id: 'a-' + d.ans, unit: d.unit, answer: d.answer, decimals: d.decimals, slips: d.slips, into: '#ans-' + d.ans,
      onCheck: (r) => {
        const st = ST[i];
        if (solved(st)) return;
        if (r.state === 'right') { st.res = 'right'; startRun(i); }
        else if (r.state === 'wrong') {
          st.tries += 1; st.hint = r.hint || d.hint;
          if (st.tries >= 2) { st.res = 'shown'; st.why = true; a.reveal(); startRun(i); } else st.res = 'wrong';
        } else { st.res = null; st.hint = ''; }
        K.refresh();
      } });
    FIELDS[d.ans] = a;
  });
  const checkBtn = K.button({ label: 'Check', into: '#acts', press: () => {
    const i = cur(), d = STEPS[i], st = ST[i];
    if (finished || d.show || solved(st)) return;
    if (d.kind === 'typed') { FIELDS[d.ans].check(); return; }
    if (st.pick == null) { st.res = 'empty'; return; }
    if (st.pick === d.want) { st.res = 'right'; startRun(i); } else { st.res = 'wrong'; st.tries += 1; }
  } });
  const whyBtn = K.button({ label: 'Why?', secondary: true, into: '#acts', press: () => {
    const d = STEPS[cur()], st = ST[cur()];
    if (d.show || finished || (!solved(st) && st.tries === 0)) return;
    st.why = !st.why;
  } });
  const swBtn = K.button({ label: 'Switch on the second mirror', into: '#swrow', press: () => {
    const i = cur(), d = STEPS[i], st = ST[i];
    if (!d.sw || finished) return;
    st.second = !st.second;
    if (st.second) play(d.swRun); else { anim.pause(); T = Infinity; }
  } });
  const replayBtn = K.button({ label: 'Play again', secondary: true, into: '#replay', press: () => {
    const i = cur(), d = STEPS[i];
    if (!d.show || finished) return;
    resetShow(ST[i]);
    play(d.dur);
  } });
  const backBtn = K.button({ label: 'Back', secondary: true, into: '#nav', press: () => {
    if (finished) { finished = false; return; }
    stepper.set(Math.max(0, cur() - 1), true);
  } });
  const nextBtn = K.button({ label: 'Continue', into: '#nav', press: () => {
    const i = cur();
    if (finished || (!STEPS[i].show && !solved(ST[i]))) return;
    if (i < STEPS.length - 1) { stepper.set(i + 1, true); return; }
    finished = true; anim.pause(); T = Infinity;
    if (typeof K.complete === 'function') K.complete();
  } });
  K.button({ label: 'Start again', secondary: true, into: '#again', press: () => {
    ST = STEPS.map(fresh); finished = false; lastStep = -1; hold = null;
    Object.keys(FIELDS).forEach((k) => FIELDS[k].reset());
    stepper.set(0, true);
  } });

  // ---------- words (built with K.el, never innerHTML): *a key term*, `kept on one line` ----------
  function write(node, s) {
    node.textContent = '';
    String(s || '').split('`').forEach((part, k) => {
      if (!part) return;
      if (k % 2) { node.appendChild(K.el('span', { class: 'nw' }, part)); return; }
      const re = /\*([^*]+)\*/g;
      let from = 0, m;
      while ((m = re.exec(part))) {
        if (m.index > from) node.appendChild(document.createTextNode(part.slice(from, m.index)));
        node.appendChild(K.el('span', { class: 'term' }, m[1]));
        from = m.index + m[0].length;
      }
      if (from < part.length) node.appendChild(document.createTextNode(part.slice(from)));
    });
    return node;
  }
  write(el('finish'), FINISH);

  K.update((p) => {
    const i = Math.round(p.step), d = STEPS[i], st = ST[i];
    if (!anim.playing()) T = Infinity;
    if (i !== lastStep) enterStep(i);
    if (finished !== lastDone) { lastDone = finished; enter(finished ? 'done' : 'stepbox'); }
    const sv = solved(st);
    el('stepbox').hidden = finished;
    el('done').hidden = !finished;
    el('count').textContent = 'Step ' + (i + 1) + ' of ' + STEPS.length;
    const task = el('task');
    task.className = 'task' + (d.show ? ' show' : '');
    write(task, d.show ? d.text : d.task);
    const actS = d.act || (sv && d.actAfter) || '';
    el('act').hidden = !actS;
    write(el('act'), actS);
    paint(i);
    el('swrow').hidden = !d.sw;
    swBtn.setLabel(st.second ? 'Take the second mirror away' : 'Switch on the second mirror');
    swBtn.el.setAttribute('aria-pressed', st.second ? 'true' : 'false');
    replayBtn.el.hidden = !d.show || REDUCE;
    el('replay').hidden = replayBtn.el.hidden;
    const opts = d.kind === 'pick' ? d.opts : [];
    const picks = el('picks');
    picks.hidden = !opts.length;
    picks.classList.toggle('col', !!d.col);
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      b.setLabel(opts[k]);
      b.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });
    STEPS.forEach((x, k) => { if (x.kind === 'typed') el('ans-' + x.ans).hidden = finished || k !== i; });
    el('answers').hidden = d.kind !== 'typed';
    el('acts').hidden = !!d.show;
    checkBtn.el.hidden = sv;
    const fb = el('fb');
    fb.hidden = !!d.show;
    fb.className = 'fb' + (st.res === 'right' ? ' right' : '');
    write(fb, d.show ? '' : st.res === 'right' ? 'That\'s it.' : st.res === 'shown' ? 'Here is the working.' :
      st.res === 'wrong' ? (d.kind === 'typed' ? st.hint : hintFor(d, st)) : st.res === 'empty' ? 'Tap one of the answers.' : '');
    const why = el('why');
    why.hidden = !!d.show || !st.why;
    write(why, d.show ? '' : d.why);
    whyBtn.setLabel(st.why ? 'Hide why' : 'Why?');
    whyBtn.el.hidden = !sv && st.tries === 0;
    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !sv);
    nextBtn.setLabel(i === STEPS.length - 1 ? 'Finish' : 'Continue');
    el('nav').hidden = backBtn.el.hidden && nextBtn.el.hidden;
  });

  // ---------- known answers, worked out by hand ----------
  const IX = (name) => STEPS.findIndex((d) => d.name === name);
  const openSt = () => fresh();
  const doneSt = (i) => Object.assign(fresh(), { res: 'right', pick: STEPS[i].want });
  // A step drawn in the state given (finished unless t is given): what it draws, then the current step again.
  function drawn(i, st, t) {
    const keepS = ST[i], keepT = T;
    ST[i] = st; T = t == null ? Infinity : t; latest = 0; earliest = Infinity;
    try { scene(i, st); return Object.assign({}, REC, { latest, earliest }); }
    finally { ST[i] = keepS; T = keepT; paint(); }
  }

  K.check('The law of reflection states that: angle of incidence = angle of reflection: for every torch angle from 25° to 65° and every turn of the mirror up to 20° either way, the beam leaves at the same angle to the normal as it arrives, and the Equal angles screen labels both 35°', () => {
    let ok = true;
    for (let th = 25; th <= 65; th += 5) for (let ph = -20; ph <= 20; ph += 5) { const b = beam(torchPos(th), mirror(TC, ph, TH)); ok = ok && near(b.inc, b.ref, 1e-9); }
    const t = drawn(IX('Equal angles'), openSt()).texts;
    return ok && t.filter((s) => s === '35°').length === 2;
  }, { source: BITESIZE });

  K.check('The distance from the object to the mirror is the same as the distance from the mirror to the image: for lamps 15 to 65 cm in front, light from the lamp that bounces by the law into any eye has its traced-back line end at one point, as far behind the mirror as the lamp is in front; the image screen labels 40 cm and 40 cm', () => {
    const m = mirror(P2(170, BM), 0, 130);
    let ok = true;
    [P2(80, 150), P2(130, 200), P2(220, 250)].forEach((lamp) => {
      const img = imageOf(lamp, m);
      ok = ok && near(BM - img.y, lamp.y - BM, 1e-9) && near(img.x, lamp.x, 1e-9);
      for (let ex = 20; ex <= 320; ex += 30) for (let ey = 150; ey <= 258; ey += 36) {
        const e = P2(ex, ey), pth = path(lamp, e, m);
        if (!pth.seen) continue;
        const bounced = bounce(unit(minus(pth.P, lamp)), m);
        // the bounced light heads for the eye, and the eye's line back through the bounce passes the image
        ok = ok && near(angDeg(bounced, minus(e, pth.P)), 0, 1e-4) && near(Math.abs((pth.P.x - e.x) * (img.y - e.y) - (pth.P.y - e.y) * (img.x - e.x)), 0, 1e-6);
      }
    });
    const r = drawn(IX('Where the image sits'), openSt());
    return ok && r.texts.filter((s) => s === '40 cm').length === 2 && r.path.seen;
  }, { source: OPENSTAX });

  K.check('Turning the mirror turns the reflected beam twice as far: 10° turns it 20° while both angles to the turning normal go from 30° to 40°, the 15° answer turned by its handle puts the beam on the target\'s new spot 30° round, and a 45° mirror knocked 2° sends level light down 4° off vertical (drawn larger, 8° and 16°)', () => {
    let ok = true;
    for (let ph = -20; ph <= 20; ph += 1) { const tp = torchPos(30); ok = ok && near(angDeg(beam(tp, M0).out, beam(tp, mirror(TC, ph, TH)).out), 2 * Math.abs(ph), 1e-4); }
    const t4 = drawn(IX('Turn the mirror'), openSt()), t5 = drawn(IX('Follow the target'), Object.assign(doneSt(IX('Follow the target')), { phi: -MOVE / 2 })), t5a = drawn(IX('Follow the target'), doneSt(IX('Follow the target'))), t14 = drawn(IX('A knocked mirror'), doneSt(IX('A knocked mirror')));
    return ok && near(t4.turn.mirror, 10, 1e-9) && near(t4.turn.beam, 20, 1e-4) && t4.texts.includes('mirror 10°') && t4.texts.includes('beam 20°') && t4.texts.filter((s) => s === '40°').length === 2 && drawn(IX('Turn the mirror'), openSt(), 0.88).texts.filter((s) => s === '30°').length === 2 &&
      near(t5.target.hit, 0, 1e-4) && t5.texts.includes('turned 15°') && t5.texts.includes('on target') && t5a.target.hit > 10 && !t5a.texts.includes('on target') && near(t14.knock.turn, 2, 1e-9) && near(t14.knock.off, 4, 1e-4) && t14.texts.includes('4° off vertical') && near(t14.knock.drawnTurn, KDRAW, 1e-6) && near(t14.knock.drawnOff, 2 * KDRAW, 1e-4) && t14.texts.includes('knocked 2°');
  });

  K.check('A mirror at 45° turns level light through 90°, so two of them, one above the other, send it out the way it came in; the folded paths add to 10 + 1.5 + 0.1 = 11.6 m and 30 + 2 + 0.1 = 32.1 m', () => {
    const on = Object.assign(openSt(), { second: true }), a = drawn(IX('Two mirrors'), on), b = drawn(IX('The periscope'), doneSt(IX('The periscope'))), p = a.peri;
    return near(angDeg(p.dIn, p.down), 90, 1e-9) && near(angDeg(p.down, p.out), 90, 1e-9) && near(angDeg(p.out, p.dIn), 0, 1e-4) && dist(p.hit, p.mbc) < 1e-6 &&
      a.texts.includes('image from the eye: 10 + 1.5 + 0.1 = 11.6 m') && b.texts.includes('image from the eye: 30 + 2 + 0.1 = 32.1 m') &&
      near(a.peri.total, 11.6, 1e-9) && near(b.peri.total, 32.1, 1e-9);
  });

  K.check('Only an eye that reflected light reaches sees the image: the eye at the start of Only where the light goes sees it and the eye past the mirror\'s end does not; A and B see it, and C, past the end, does not', () => {
    const i = IX('Only where the light goes'), d = STEPS[i], m = mirror(P2(170, BM), 0, d.mh);
    const r = drawn(IX('Who sees it?'), doneSt(IX('Who sees it?'))), end = drawn(i, openSt());
    return path(d.lamp, d.eye, m).seen && !path(d.lamp, d.eye2, m).seen && !end.path.seen && end.texts.includes('The image cannot be seen from here.') &&
      r.people.A === true && r.people.B === true && r.people.C === false;
  });

  K.check('Each typed answer and slip is worked from the lesson\'s figures: 90 − 25 = 65° (25, 115); 30 ÷ 2 = 15° (30, 60); 0.8 + 0.8 = 1.6 m (2.0, 0.8, 2.4); 30 + 2 + 0.1 = 32.1 m (30, 32, 2.1); 2 × 2 = 4° (2, 1); each answer as printed is graded right and each slip wrong', () => {
    const want = { norm: [65, '65°', [25, 115]], tgt: [15, '15°', [30, 60]], close: [1.6, '1.6 m', [2.0, 0.8, 2.4]], peri: [32.1, '32.1 m', [30, 32, 2.1]], knock: [4, '4°', [2, 1]] };
    return Object.keys(want).every((k) => {
      const d = STEPS.find((x) => x.ans === k), [ans, w, sl] = want[k], sp = { answer: d.answer, decimals: d.decimals, unit: d.unit, slips: d.slips };
      return near(d.answer, ans, 1e-9) && d.want === w && d.slips.length === sl.length && d.slips.every((x, n) => near(x.value, sl[n], 1e-9)) &&
        K.answer.grade(w, sp).state === 'right' && K.answer.grade(String(ans), sp).state === 'right' && sl.every((v) => K.answer.grade(String(v), sp).state === 'wrong');
    });
  });

  K.check('Before Check nothing gives the answer away: no typed answer is drawn, the beam on Which way? has not left, and no ray or image is drawn on Find the image or Who sees it?', () => {
    const typedOk = STEPS.every((d, i) => d.kind !== 'typed' || drawn(i, openSt()).texts.every((s) => s.indexOf(d.want) < 0));
    const w = drawn(IX('Which way?'), openSt()), f = drawn(IX('Find the image'), openSt()), s = drawn(IX('Who sees it?'), openSt());
    return typedOk && w.rays.length === 1 && f.rays.length === 0 && !f.texts.includes('image') && s.rays.length === 0 && !s.texts.includes('image');
  });

  K.check('Every demonstration settles within 5 s of its screen opening, none starting before the 0.35 s screen fade ends; the second mirror\'s motion and every answer\'s motion settle within 3 s', () =>
    STEPS.every((d, i) => {
      if (d.show) {
        const r = drawn(i, openSt());
        let ok = r.latest <= d.dur + 1e-9 && d.dur <= 5 && r.earliest >= 0.35;
        if (d.sw) { const s = drawn(i, Object.assign(openSt(), { second: true })); ok = ok && s.latest <= d.swRun + 1e-9 && d.swRun <= 3; }
        return ok;
      }
      const r = drawn(i, doneSt(i));
      return r.latest <= d.run + 1e-9 && d.run <= 3;
    }));

  K.ready();
</script>
