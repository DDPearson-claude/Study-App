<script>
  // ---------- helpers ----------
  const NB = ' ', MINUS = '−', MAXD = 10, SEP = 9, FOLD_T = 0.9;
  const r2 = (v) => Math.round(v * 100) / 100;
  const r1 = (v) => Math.round(v * 10) / 10;
  const c01 = (p) => Math.min(1, Math.max(0, p));
  // How far a move timed from t0 to t1 has got at T seconds: 0 before, 1 after, eased between.
  const tw = (T, t0, t1) => (T >= t1 ? 1 : T <= t0 ? 0 : K.ease(c01((T - t0) / (t1 - t0))));
  const arr = (T, t0) => tw(T, t0, t0 + 0.6);
  const lerp = (a, b, t) => a + (b - a) * t;
  const near = (a, b) => Math.abs(a - b) <= 1e-9 * Math.max(1, Math.abs(a), Math.abs(b));
  const snap = (v) => Math.round(v * 2) / 2;
  // One rounding everywhere: whole numbers plain, others to at most two places (22.5, 1.5, 0.8).
  const num = (v) => String(Math.round(Math.abs(v) * 100) / 100);
  const q = (v, u) => num(v) + NB + u;
  const AQA = 'https://filestore.aqa.org.uk/resources/science/AQA-GCSE-SCIENCE-BOOKLET1-PHYSICS-EQUATIONS-MATHS-SKILLS.PDF';
  const BBC_PERP = 'https://www.bbc.co.uk/bitesize/articles/z96g3j6';
  const BBC_BAL = 'https://www.bbc.co.uk/bitesize/guides/ztjpb82/revision/2';

  // ---------- the mobiles: x is each weight's distance from its pivot (left negative), w its weight ----------
  // s: drawing px per unit; lanes: most distance brackets on one side; gmax: the gauges' full scale.

    rule: { rule: true, s: 3, lanes: 1, gmax: 100, items: [{ id: 'W', w: 0, x: 20, str: 40, blank: true }] },
    rule2: { rule: true, s: 3, lanes: 1, gmax: 160, items: [{ id: 'L3', w: 3, x: -40, str: 40, reveal: true }, { id: 'R4', w: 4, x: 30, unk: 'x', park: 45, str: 40, reveal: true }] },

    three: { s: 3.6, lanes: 2, tl: 2, gmax: 160, items: [{ id: 'L5', w: 5, x: -24, str: 46 }, { id: 'R4', w: 4, x: 15, str: 38 }, { id: 'R3', w: 3, x: 20, unk: 'x', park: 38, str: 78 }] },

      items: [{ id: 'CW', w: 59, x: -4, unk: 'w', str: 14 }, { id: 'LD', w: 20, x: 10, str: 62 }] },
    two: { s: 3.6, lanes: 1, gmax: 120, lmax: 60, items: [{ id: 'H', x: -15, str: 54, sub: [{ id: 'A', w: 4, x: -10, unk: 'w', str: 34, name: 'A', inBox: true }, { id: 'B', w: 2, x: 20, unk: 'w', str: 34, name: 'B', inBox: true }] }, { id: 'S6', w: 6, x: 15, str: 40 }] },
    seesaw: { seesaw: true, du: 'm', s: 40, half: 3, ref: 300, maxD: 10.3, gmax: 900, items: [{ id: 'CH', w: 250, x: -2.4, name: 'child' }, { id: 'AD', w: 750, x: 0.8, unk: 'x', park: 0.8, name: 'adult' }] },

  // A lower level weighs everything below its string.
  const weightOf = (it) => (it.sub ? it.sub.reduce((a, b) => a + b.w, 0) : it.w);
  const itemOf = (B, id) => B.items.find((it) => it.id === id);

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  const pegOut = (T, v) => { v.pin = 1 - tw(T, 0.1, 0.6); v.hold = 1 - tw(T, 0.6, 1.8); };

  const STEPS = [
    { kind: 'pick', name: 'Which way will it tip?', pic: 'tip', peg: true, col: true, rdur: 1.8,
      task: 'The peg is about to come out. Which way will the bar tip?',

      read: 'When the 4 N weight moves in to 22.5 cm, it makes 90 N cm. The two gauges match, and the bar hangs level.',
      open: (T, v) => { v.ga = arr(T, 0.4); v.pos.L4 = snap(lerp(-30, -22.5, tw(T, 1.4, 3.8))); } },
    { kind: 'typed', name: 'Where it balances', pic: 'where', peg: true, ans: 'whr', unit: 'cm', decimals: 0, rdur: 2.2,

      slips: [{ value: r1(5 * 20 / 3), hint: 'That puts the heavier weight further out. The heavier one hangs nearer the pivot.' },
        { value: 20, hint: 'Equal distances balance only equal weights.' }],
      task: 'A 3 N weight hangs 20 cm right of the pivot. How far left of the pivot must a 5 N weight hang to balance it?',

      text: 'Measure each distance from the pivot, at right angles to the weight\'s string. On a level bar, that is the distance along the bar. A rule\'s marks count from its end. So take away the pivot\'s mark.',
      act: 'Drag the weight along the rule.',
      read: 'The pivot sits at the 50 cm mark. A weight at the 70 cm mark hangs 20 cm from it. Its distance readout shows 20 cm.',
      open: (T, v) => { v.ga = arr(T, 0.4); v.pos.W = snap(lerp(40, 20, tw(T, 0.8, 3.0))); } },
    { kind: 'typed', name: 'Read the rule', pic: 'rule2', peg: true, ans: 'rul', unit: 'cm', decimals: 0, rdur: 1.8,
      answer: 50 + 3 * (50 - 10) / 4,
      slips: [{ value: 3 * (50 - 10) / 4, hint: 'That is its distance from the pivot. Add the pivot\'s 50 cm to find the mark.' },
        { value: 50 + 3 * 10 / 4, hint: 'You took the 10 cm mark as the distance. The 3 N hangs 40 cm from the pivot.' }],
      task: 'A metre rule is pivoted at its 50 cm mark. A 3 N weight hangs at its 10 cm mark. At which mark must a 4 N weight hang to balance it?',
      hint: 'Find each distance from the pivot\'s mark first.',
      why: 'The 3 N hangs 50 − 10 = 40 cm from the pivot. So it makes 3 × 40 = 120 N cm. The 4 N must make 120 N cm too. So it hangs 120 ÷ 4 = 30 cm out, at the 50 + 30 = 80 cm mark. The rule is pivoted at its middle. So its own weight turns nothing.',
      run: (T, v, B) => { slide(T, v, B, 'R4'); v.ba = tw(T, 1.1, 1.7); v.pin = v.hold = 1 - tw(T, 1.2, 1.7); } },
    { show: true, name: 'Add each side', pic: 'add', dur: 3.4, drag: ['L2', 'R3', 'R15'],

      run: pegOut },
  ];
  STEPS.forEach((d) => { if (d.kind === 'typed') d.want = num(d.answer) + ' ' + d.unit; });
  const FINISH = 'A bar hangs level when its total clockwise moment about the pivot equals its total anticlockwise moment.';

  // ---------- state of a step's picture (pure) ----------
  // res: 'right', 'wrong', 'shown' or 'empty'. free: Dan has moved something himself (pos, al, p and
  // the fold f0 -> f1 hold it). pin: how far the peg is in; hold: how far it still holds the bar level.
  const blank = () => ({ pick: null, res: null, why: false, tries: 0, hint: '', free: false, pos: {}, al: null, p: null, f0: null, f1: null });
  const solved = (st) => !!st && (st.res === 'right' || st.res === 'shown');
  let FORCE = 0;   // the viewBox sizing tips each bar fully (and drags to the ends) to fit every pose
  function view(i, st, T) {
    const d = STEPS[i], B = BD[d.pic], sv = !d.show && solved(st);
    const v = { sv, pos: {}, al: {}, pin: d.peg ? 1 : 0, hold: d.peg ? 1 : 0, fold: st.f1 != null ? st.f1 : 0, p: B.own ? B.own.p : 0, seat: 1, u: 1, ga: 1, ba: sv || d.show ? 1 : 0 };
    B.items.forEach((it) => { v.pos[it.id] = it.unk === 'x' && !sv ? it.park : it.x; v.al[it.id] = 1; });
    if (st.free) {
      Object.keys(st.pos || {}).forEach((k) => { v.pos[k] = st.pos[k]; });
      if (st.al) Object.assign(v.al, st.al);
      if (st.p != null) v.p = st.p;
      if (st.f0 != null && st.f1 != null) v.fold = lerp(st.f0, st.f1, tw(T, 0, FOLD_T));
    } else {
      if (sv) v.ga = tw(T, 0.05, 0.6);
      const f = sv ? d.run : d.open;
      if (f) f(T, v, B);
    }
    if (FORCE) {
      (d.drag || []).forEach((id) => { const it = itemOf(B, id); v.pos[id] = 40 * (B.rule ? FORCE : Math.sign(it.x)); });
      if (d.dragPivot) v.p = FORCE > 0 ? 0 : 60;
    }
    return v;
  }
  // A bar about its pivot. Each weight's moment is its force × its distance from the pivot, clockwise
  // when it hangs right of the pivot. The bar tilts towards the bigger total, in proportion to the gap,
  // up to a limit; a peg holds it level until it comes out.
  function node(B, list, px, py, v, top, fold) {
    const N = { B, px, py, s: B.s, items: [], top: !!top, boff: B.rule ? 19 : B.crane ? 14 : B.seesaw ? 54 : 10 };
    let net = 0;
    list.forEach((it) => {
      const mx = top ? (it.end ? -v.p : v.pos[it.id]) : it.x, x = top ? mx : it.x * (1 - (fold || 0));
      const a = top && v.al[it.id] != null ? v.al[it.id] : 1, on = it.id === 'AD' ? v.seat : 1, w = weightOf(it);
      net += w * mx * a * on;
      N.items.push({ it, x, mx, a, on, w });
    });
    if (top && B.own) { N.ownX = B.own.len / 2 - v.p; net += B.own.w * N.ownX; }
    if (top && B.arm) net += B.arm.w * B.arm.x;
    N.net = net;
    const mx = (B.maxD || MAXD) * Math.PI / 180;
    N.ang = mx * Math.max(-1, Math.min(1, net / (B.ref || 40))) * (1 - (top ? v.hold : 0));
    if (FORCE && top) N.ang = FORCE * mx;
    return N;
  }
  // The two gauges at a pivot: force × distance for every weight on each side, and each side's total.
  function gaugeOf(N) {
    const B = N.B, du = B.du || 'cm', fu = B.fu || 'N', g = { terms: { A: [], C: [] }, tot: { A: 0, C: 0 }, fill: { A: 0, C: 0 }, mu: fu + NB + du };
    const put = (left, label, w, x, a) => {
      const sd = left ? 'A' : 'C', m = w * Math.abs(x);
      g.fill[sd] += m * a;
      if (a < 0.5) return;
      g.tot[sd] += m;
      g.terms[sd].push((label ? label + ' ' : '') + q(w, fu) + ' × ' + q(x, du));
    };
    N.items.forEach((o) => put(o.mx < 0 || (o.mx === 0 && o.it.x < 0), o.it.inBox ? o.it.name : '', o.w, o.mx, o.a * o.on));
    if (N.ownX != null) put(N.ownX < 0, 'bar', B.own.w, N.ownX, 1);
    if (N.top && B.arm) put(B.arm.x < 0, 'arm', B.arm.w, B.arm.x, 1);
    return g;
  }
  // Brackets: nearer weights take the lane next to the bar, further ones the lanes above.
  function laneOf(N) {
    const L = N.items.map((o) => ({ x: o.x, f: o.it.lane }));
    if (N.ownX != null) L.push({ x: N.ownX });
    return L.map((e) => (e.f != null ? e.f : L.filter((g) => g !== e && g.f == null && Math.sign(g.x) === Math.sign(e.x) && Math.abs(g.x) < Math.abs(e.x)).length));
  }
  function boxText(B, it, sv) {
    if (it.blank) return '';
    const val = q(weightOf(it), B.fu || 'N'), hide = it.unk === 'w' && !sv;
    if (it.inBox) return it.name + NB + (hide ? '?' : val);
    return hide ? '?' : val;
  }
  const tiltWords = (a) => (a < -1e-9 ? 'The bar tips left side down.' : a > 1e-9 ? 'The bar tips right side down.' : 'The bar hangs level.');

  // ---------- drawing ----------
  const el = (id) => document.getElementById(id);
  const svg = el('scene'), art = el('art'), ui = el('ui');
  let EXT = [0, 0], REC = null, into = null, LASTV = null;
  const add = (n) => (into || art).appendChild(n);
  const ext = (a, b) => { if (a < EXT[0]) EXT[0] = a; if (b > EXT[1]) EXT[1] = b; };
  function part(a, rise, fn) { if (a <= 0.001) return; const g = add(K.svg('g')); K.fade(g, a, rise); const keep = into; into = g; fn(); into = keep; }
  const TW = (s) => String(s).length * 7.8;
  // Text; without an anchor it is kept inside the picture's edges.
  function txt(x, y, s, cls, anchor) {
    if (!anchor) { const w = TW(s); x = Math.min(Math.max(x, 4 + w / 2), 336 - w / 2); }
    add(K.svg('text', { class: cls, x: r2(x), y: r2(y), 'text-anchor': anchor || 'middle' }, String(s)));
    ext(y - 14, y + 4);
    REC.texts.push(String(s));
  }
  function line(x1, y1, x2, y2, cls) {
    add(K.svg('line', { class: cls, x1: r2(x1), y1: r2(y1), x2: r2(x2), y2: r2(y2) }));
    ext(Math.min(y1, y2) - 3, Math.max(y1, y2) + 3);
  }
  function box(cx, top, s, unk) {
    const w = Math.max(30, 10 + 7.4 * String(s).length);
    add(K.svg('rect', { class: 'wt' + (unk ? ' unk' : ''), x: r2(cx - w / 2), y: r2(top), width: r2(w), height: 26, rx: 5 }));
    ext(top - 1, top + 27);
    if (s) txt(cx, top + 18, s, 'wl', 'middle');

  function pivotDot(x, y) { add(K.svg('circle', { class: 'piv', cx: r2(x), cy: r2(y), r: 4.5 })); ext(y - 6, y + 6); }
  const head = (x, y) => 'M' + r2(x - 5) + ' ' + r2(y) + ' L' + r2(x + 5) + ' ' + r2(y) + ' L' + r2(x) + ' ' + r2(y + 9) + 'Z';
  // A distance from a pivot, drawn along its bar: a line parallel to the bar, in a lane above it, with
  // end ticks and its length; a label too long for its bracket sits just beyond the far end.
  function bracket(N, x, lane, text, o) {
    const c = Math.cos(N.ang), sn = Math.sin(N.ang), off = N.boff + 22 * lane;
    const P = (u, h) => [N.px + u * c + h * sn, N.py + u * sn - h * c];
    const L = x * N.s, a = P(0, off), b = P(L, off);
    line(a[0], a[1], b[0], b[1], 'dim' + (o.dash ? ' dash' : ''));
    const t0 = P(0, off - 4), t1 = P(0, off + 4);
    line(t0[0], t0[1], t1[0], t1[1], 'dim');
    if (!o.open) { const e0 = P(L, off - 4), e1 = P(L, off + 4); line(e0[0], e0[1], e1[0], e1[1], 'dim'); }
    const w = TW(text), Lp = Math.abs(L), sg = L < 0 ? -1 : 1;
    const m = P(w + 4 <= Lp ? L / 2 : sg * (Lp + 4 + w / 2), off);
    txt(m[0], m[1] - 6, text, 'lab');
  }
  // A metre rule with its marks printed on it, pivoted at its 50 cm mark.
  function drawRule(px) {
    add(K.svg('rect', { class: 'rule', x: px - 156, y: -11, width: 312, height: 22, rx: 2 }));
    for (let m = 0; m <= 100; m += 5) {
      const x = px + (m - 50) * 3;
      line(x, -11, x, m % 10 ? -8 : -5, 'tick');
      if (m % 10 === 0) add(K.svg('text', { class: 'num', x: r2(x), y: 8, 'text-anchor': 'middle' }, String(m)));
    }
    ext(-12, 12);
  }

  // A mobile, a bar or a rule, hanging from the ceiling.
  function drawHanging(d, B, v, said) {
    const s = B.s, sv = v.sv, own = B.own, du = 'cm';
    const px = own ? 170 + (v.p - own.len / 2) * s : 170;
    const N = node(B, B.items, px, 0, v, true);
    REC.top = N;
    const x0 = own ? -v.p : B.rule ? -52 : -40, x1 = own ? own.len - v.p : B.rule ? 52 : 40;
    const ceilY = -(N.boff + 22 * (B.lanes - 1) + 33);
    const Ly = { str: [], bar: [], box: [], dim: [] };
    const op = (k, a, fn, rise) => { if (a > 0.001) Ly[k].push(() => part(a, rise || 0, fn)); };
    const c = Math.cos(N.ang), sn = Math.sin(N.ang), hook = (u) => (B.rule ? [px + u * s, 11] : [px + u * s * c, u * s * sn]);
    op('str', 1, () => { line(20, ceilY, 320, ceilY, 'ceil'); line(px, ceilY + 2, px, B.rule ? -8.5 : 0, 'hang'); });
    if (v.pin > 0.001) {
      REC.pin = true;
      const xr = px + x0 * s + 8, lift = (1 - v.pin) * 14, yb = B.rule ? -11 : -2;
      op('bar', v.pin, () => {
        add(K.svg('rect', { class: 'peg', x: r2(xr - 3), y: r2(ceilY + 2 - lift), width: 6, height: r2(yb - ceilY - 2), rx: 2 }));
        txt(xr + 8, ceilY + 17 - lift, 'peg', 'cap', 'start');

    }
    op('bar', 1, () => { if (B.rule) drawRule(px); else { const a = hook(x0), b = hook(x1); line(a[0], a[1], b[0], b[1], 'bar'); } });
    op('box', 1, () => pivotDot(px, B.rule ? -5 : 0));
    const lanes = laneOf(N);
    N.items.forEach((o, k) => {
      const it = o.it, hk = hook(o.x), unkX = it.unk === 'x' && (!sv || v.u < 1), a = o.a;
      const rec = (REC.items[it.id] = {});
      // its distance from the pivot, along the bar
      const ba = a * (it.reveal ? v.ba : 1);
      if (Math.abs(o.x) > 1e-9) {

      if (d.drag && d.drag.indexOf(it.id) >= 0 && !finished) {

      }

      const top = hk[1] + it.str, lab = boxText(B, it, sv);
      op('str', a, () => line(hk[0], hk[1], hk[0], top, 'str' + (unkX ? ' dash' : '')), -6);
      op('box', a, () => box(hk[0], top, lab, it.unk === 'w' && !sv), -6);
      rec.box = lab;
      if (B.rule) {
        const mk = unkX ? '?' + NB + 'cm mark' : q(50 + o.x, 'cm') + ' mark';

      }
      if (a >= 0.5) said.push((lab || 'A weight') + ' hangs ' + (unkX ? '? cm' : q(o.x, du)) + (o.x < 0 ? ' left of' : ' right of') + ' the pivot' + (B.rule && !unkX ? ', at the ' + q(50 + o.x, 'cm') + ' mark.' : '.'));
    });
    if (own) {
      const m = hook(N.ownX);
      op('box', 1, () => {
        line(m[0], m[1] + 3, m[0], m[1] + 28, 'force');
        add(K.svg('path', { class: 'head', d: head(m[0], m[1] + 27) }));
        txt(m[0], m[1] + 54, 'bar' + NB + q(own.w, 'N'), 'lab');
      });
      const has = Math.abs(N.ownX) > 1e-9;
      if (has) op('dim', 1, () => bracket(N, N.ownX, lanes[N.items.length], q(N.ownX, du), {}));

      said.push('The bar is ' + q(own.len, du) + ' long and weighs ' + q(own.w, 'N') + ', acting at its middle. Its pivot is ' + q(v.p, du) + ' from its left end.');

    }
    ['str', 'bar', 'box', 'dim'].forEach((k) => Ly[k].forEach((f) => f()));
    said.unshift(B.rule ? 'A metre rule, marked from 0 to 100 cm, hangs from a pivot at its 50 cm mark.' : 'A bar hangs from a pivot on a string.');

  // A lower level: its own bar on the string from a hook. Folding slides its weights together into one

  function drawLow(d, B, v, it, hk, a, op, said) {
    const s = B.s, sv = v.sv, e = c01(v.fold), lpx = hk[0], lpy = hk[1] + it.str;
    const L = node(B, it.sub, lpx, lpy, v, false, e);

      ', its own bar holding ' + L.items.map((o) => boxText(B, o.it, sv) + ' ' + q(o.it.x, 'cm') + (o.it.x < 0 ? ' left' : ' right') + ' of its string').join(' and ') + '.'));
  }
  // A crane arm on a tower, seen from the side.
  function drawCrane(d, B, v, said) {
    const s = B.s, px = 110, sv = v.sv, G = 140, N = node(B, B.items, px, 0, v, true);
    REC.top = N;
    const c = Math.cos(N.ang), sn = Math.sin(N.ang), hook = (u) => [px + u * s * c, u * s * sn];

      const it = o.it, hk = hook(o.x), top = hk[1] + 4 + it.str, lab = boxText(B, it, sv);
      line(hk[0], hk[1], hk[0], top, 'str');

        txt(xp + 9, G - 8, 'peg', 'cap', 'start');
      });
    }

    N.items.forEach((o, k) => bracket(N, o.x, lanes[k], q(o.x, 'm'), {}));

      'A counterweight of ' + REC.items.CW.box + ' hangs from its back end. The arm\'s own ' + q(B.arm.w, 'kN') + ' acts at its middle.');

  }
  // A see-saw on its pivot, the people sitting on the plank.
  function drawSeesaw(d, B, v, said) {
    const s = B.s, px = 160, sv = v.sv, N = node(B, B.items, px, 0, v, true);
    REC.top = N;
    const c = Math.cos(N.ang), sn = Math.sin(N.ang), P = (u, h) => [px + u * c + h * sn, u * sn - h * c];
    line(10, 24, 330, 24, 'ground');
    add(K.svg('path', { class: 'tower', d: 'M160 0 L147 24 L173 24 Z' }));
    const e0 = P(-B.half * s, 0), e1 = P(B.half * s, 0);
    line(e0[0], e0[1], e1[0], e1[1], 'plank');
    const x0 = P(0, 8), x1 = P(0, N.boff + 4);
    line(x0[0], x0[1], x1[0], x1[1], 'dim dash');
    N.items.forEach((o) => {
      const it = o.it, lab = q(it.w, 'N'), seat = P(o.x * s, 2.5), moving = it.id === 'AD' && v.u < 1;
      const bx = moving ? lerp(312, seat[0], v.u) : seat[0], by = moving ? lerp(24, seat[1], v.u) - 22 * Math.sin(Math.PI * v.u) : seat[1];
      box(bx, by - 26, lab, false);

      bracket(N, known ? o.x : 2.9, 0, bt, { dash: !known, open: !known });
      REC.items[it.id] = { box: lab, brk: bt };
    });
    const ad = REC.items.AD.brk;
    said.push('A see-saw: a 250 N child sits ' + q(2.4, 'm') + ' left of the pivot. ' + (v.u >= 1 && v.seat > 0.5 ? 'A 750 N adult sits ' + ad + ' right of it. ' : 'A 750 N adult stands on the ground beside it, ' + ad + ' from the pivot. ') + tiltWords(N.ang).replace('bar', 'see-saw'));
  }
  // The whole picture for step i in state st, T seconds into its motion; returns it in words.
  function scene(i, st, t) {
    const d = STEPS[i], B = BD[d.pic], v = view(i, st, t), said = [];
    REC = { texts: [], items: {}, hits: [], gauges: [], top: null, low: null, merged: null, dist: null, pin: false, armBrk: null, gOpen: !!(d.show || v.sv) };
