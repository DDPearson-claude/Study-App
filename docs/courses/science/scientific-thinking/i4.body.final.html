<script>
  // ---------- helpers ----------
  const NB = ' ', MINUS = '−', DEG = '°';
  const BBC = 'https://www.bbc.co.uk/bitesize/guides/zytb8mn/revision/2';
  const OSX = 'https://openstax.org/books/physics/pages/8-3-elastic-and-inelastic-collisions';
  const LIGHT = 0.2, HEAVY = 0.4, RL = 11, RH = 14;
  // Time is slowed: a ball covers 60 drawing units a second for each m/s. The hit itself is
  // slowed far more (TAU seconds), so the pushes can be seen; the balls barely move while it lasts.
  const KPX = 60, TAU = 0.5, POST = 1.5, VMIN = 0.5, VMAX = 4, LEAD = 1.2;
  const r2 = (v) => Math.round(v * 100) / 100;
  const r1 = (v) => Math.round(v * 10) / 10;
  const c01 = (p) => Math.min(1, Math.max(0, p));
  const tw = (T, t0, t1) => (T >= t1 ? 1 : T <= t0 ? 0 : K.ease(c01((T - t0) / (t1 - t0))));
  const arr = (T, t0) => tw(T, t0, t0 + 0.6);
  const lerp = (a, b, t) => a + (b - a) * t;
  const near = (a, b, tol) => Math.abs(a - b) <= (tol != null ? tol : 1e-9 * Math.max(1, Math.abs(a), Math.abs(b)));
  const rad = (dg) => dg * Math.PI / 180;
  // One rounding everywhere: speeds to one place, or two where needed (2.0, 1.73); momenta and
  // energies to at most two places (0.4, 0.17, 1.2).
  const spd = (v) => { const a = r2(Math.abs(v)); if (a >= 10) return String(Math.round(a)); return Math.abs(a * 10 - Math.round(a * 10)) < 1e-6 ? a.toFixed(1) : a.toFixed(2); };
  const mag = (v) => String(r2(Math.abs(v)));
  const sg = (v) => (r2(v) > 0 ? '+' : r2(v) < 0 ? MINUS : '');
  const thou = (v) => String(Math.round(Math.abs(v))).replace(/\B(?=(\d{3})+(?!\d))/g, NB);
  const KGMS = NB + 'kg' + NB + 'm/s', MS = NB + 'm/s';
  const kgs = (m) => String(m) + NB + 'kg';
  const jj = (x) => mag(x) + NB + 'J';
  const keOf = (o, V) => 0.5 * o.m * (V.x * V.x + V.y * V.y);
  const hyp = (V) => Math.hypot(V.x, V.y);
  const degOf = (V) => Math.atan2(V.y, V.x) * 180 / Math.PI;

  // ---------- the pictures ----------
  const TB1 = { x0: 6, x1: 334, y0: 0, y1: 100, Y: 50 };     // a straight shot
  const TB2 = { x0: 6, x1: 334, y0: 0, y1: 150, Y: 82 };     // a glancing shot
  const TW1 = { x0: 6, x1: 334, y0: 0, y1: 104, Y: 66 };     // the railway
  const CANNON = { mc: 96, mb: 4, vb: 120 };
  const rOf = (m) => (m > LIGHT ? RH : RL);
  const momFmt = (d) => (d.pic === 'wagons' ? (p) => sg(p) + thou(p) : d.pic === 'cannon' ? (p) => sg(p) + String(Math.round(Math.abs(p))) : (p) => sg(p) + mag(p));

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  const OPT13 = ['The cue ball stops, the struck ball leaves at 2.0 m/s', 'The cue ball rolls on at 0.5 m/s, the struck ball at 1.5 m/s',
    'The cue ball rolls on at 0.5 m/s, the struck ball at 1.0 m/s', 'Both roll on together at 1.0 m/s'];
  const STEPS = [
    { kind: 'pick', name: 'What does the cue ball do?', pic: 'shot', m: [LIGHT, LIGHT], v: 2, e: 1, sc: 70, ox: 50, noArrow: true, col: true,
      task: 'Two equal balls, set to ideal bouncy, so no kinetic energy is lost in the bounce. A cue ball at 2.0 m/s hits a still one dead centre. What does the cue ball do?',
      read: 'Two equal balls are set to ideal bouncy, so no kinetic energy is lost in the bounce. A cue ball at 2.0 m/s hits a still one dead centre. What does the cue ball do?',
      opts: ['It stops, and the other ball goes on at its speed', 'Both roll on together at half speed', 'It bounces back the way it came'],
      want: 'It stops, and the other ball goes on at its speed',
      hint: 'Think about the kinetic energy as well as the momentum.',
      hints: { 'Both roll on together at half speed': 'That is what balls do when they stick. These are set to ideal bouncy.',
        'It bounces back the way it came': 'Then the struck ball would leave faster than the cue ball came in. It would have more energy than the shot had.' },
      why: 'Each ball is an example 0.2 kg. Before the hit, the shot carries 0.2 × 2.0 = 0.4 kg m/s of momentum. It also carries ½ × 0.2 × 2.0² = 0.4 J of kinetic energy. The struck ball leaving at 2.0 m/s carries both, exactly. Rolling on together at 1.0 m/s keeps the 0.4 kg m/s but only 0.2 J. An ideal bouncy hit keeps both. So the cue ball stops dead.' },
    { show: true, name: 'Momentum has a direction', pic: 'pair', m: [LIGHT, LIGHT], u: [2, -1.5], pull: true, sc: 70, ox: 170,
      text: 'A ball\'s *momentum* is its mass × its velocity, in kg m/s. Velocity has a direction, so momentum has one too. Call one way positive. Then a ball going the other way has negative momentum.',
      act: 'Pull back either ball.',
      read: 'A ball\'s momentum is its mass × its velocity, in kg m/s. Call one way positive. A ball going the other way has negative momentum. A 0.2 kg ball at 2.0 m/s to the right carries +0.4 kg m/s. An equal ball at 1.5 m/s to the left carries −0.3 kg m/s. Nose to tail, the arrows total 0.1 kg m/s to the right.' },
    { kind: 'typed', name: 'The total', pic: 'pair', m: [HEAVY, LIGHT], u: [2, -3], sc: 70, ox: 170, askTotal: true, ans: 'tot', unit: 'kg m/s', decimals: 1,
      answer: r2(HEAVY * 2 - LIGHT * 3),
      slips: [{ value: r2(HEAVY * 2 + LIGHT * 3), hint: 'You added the sizes. The ball rolling left counts as negative.' },
        { value: -r2(HEAVY * 2 - LIGHT * 3), hint: 'Right is positive here. The heavier ball\'s arrow is the longer one.' }],
      task: 'Take right as positive. A 0.4 kg ball rolls right at 2.0 m/s. A 0.2 kg ball rolls left at 3.0 m/s. What is their total momentum?',
      hint: 'Give each ball\'s momentum its sign, then add.',
      why: '0.4 × 2.0 = 0.8 kg m/s to the right. 0.2 × 3.0 = 0.6 kg m/s to the left. That is −0.6 kg m/s. The total is 0.8 − 0.6 = 0.2 kg m/s, to the right.' },
    { show: true, name: 'The total survives', pic: 'shot', m: [LIGHT, LIGHT], v: 2, e: 1, sc: 70, ox: 50, pull: true,
      text: 'In a hit, each ball\'s momentum changes. The total does not. The two balls push on each other equally hard, in opposite directions, for the same time. So what one ball loses, the other gains. That holds while nothing outside pushes.',
      act: 'Pull back and play a shot.',
      read: 'In a hit, each ball\'s momentum changes, but the total does not. The two balls push on each other equally hard, in opposite directions, for the same time. So the cue ball\'s arrow shrinks to nothing as the struck ball\'s grows to the same length. For a 2.0 m/s shot, the total stays 0.4 kg m/s forward.' },
    { kind: 'typed', name: 'They stick', pic: 'shot', m: [HEAVY, LIGHT], v: 3, e: 0, sc: 70, ox: 40, ans: 'stk', unit: 'm/s', decimals: 1,
      answer: r2(HEAVY * 3 / (HEAVY + LIGHT)),
      slips: [{ value: 3 / 2, hint: 'You halved the speed. Divide the momentum by the joined mass instead.' },
        { value: r2(HEAVY * 3 / LIGHT), hint: 'They move as one, so divide by both masses together.' }],
      task: 'A 0.4 kg ball at 3.0 m/s hits a still 0.2 kg ball. They stick together. How fast do they move off?',
      hint: 'Find the momentum before. Then divide it by the joined mass.',
      why: 'Before the hit, 0.4 × 3.0 = 1.2 kg m/s. After it, the joined 0.6 kg carries the same 1.2 kg m/s. So it moves at 1.2 ÷ 0.6 = 2.0 m/s.' },
    { show: true, name: 'Energy is not kept', pic: 'shot', m: [HEAVY, LIGHT], v: 3, e: 0, sc: 70, ox: 40, pull: true, bounce: true, ke: true, kmax: 0.5 * HEAVY * VMAX * VMAX,
      text: '*Kinetic energy*, ½mv², behaves differently. In a hit, some of it goes into squashing the balls. A perfectly springy ball would give it all back. These balls stick. So 1.8 J before becomes 1.2 J after. The other 0.6 J leaves as heat and sound. The momentum total stays 1.2 kg m/s. A hit that keeps all its kinetic energy is *elastic*. One that loses some is *inelastic*.',
      act: 'Slide the bounce up towards ideal bouncy.',
      read: 'Kinetic energy, ½mv², is not kept the way momentum is. In a hit, some of it can go into squashing the balls and leave as heat and sound. A hit that keeps all its kinetic energy is elastic. One that loses some is inelastic. At ideal bouncy, the kinetic energy bar ends as long as it started. Towards sticky, it ends shorter. At sticky, it ends a third shorter, 1.8 J down to 1.2 J. The total momentum arrow is the same at every setting.' },
    { kind: 'typed', name: 'Energy lost', pic: 'shot', m: [LIGHT, LIGHT], v: 4, e: 0, sc: 70, ox: 50, ke: true, kmax: 0.5 * LIGHT * 16, ans: 'nrg', unit: 'J', decimals: 1,
      answer: r2(0.5 * LIGHT * 16 - 0.5 * (2 * LIGHT) * 4),
      slips: [{ value: 0, hint: 'Momentum is kept, but kinetic energy is not. Work out the speed after first.' },

    { show: true, name: 'Light into heavy', pic: 'shot', m: [LIGHT, HEAVY], v: 3, e: 1, sc: 70, ox: 70, pull: true, heavySw: true,

    { kind: 'typed', name: 'Bounce back', pic: 'shot', m: [LIGHT, HEAVY], v: 3, e: 0.8, sc: 70, ox: 70, given: [true, false], ans: 'bnc', unit: 'm/s', decimals: 1,

        { value: r2(LIGHT * 3 / HEAVY), hint: 'The light ball still moves after the hit. Count its momentum too.' }],
      task: 'A 0.2 kg ball at 3.0 m/s hits a still 0.4 kg ball. It comes back at 0.6 m/s. How fast does the 0.4 kg ball move off?',
      hint: 'Give the light ball\'s momentum after the hit its minus sign.',

    { show: true, name: 'Glancing hits', pic: 'shot', glance: true, m: [LIGHT, LIGHT], v: 2, e: 1, aim: 60, sc: 110, ox: 60, hUp: 44, pull: true, aimDrag: true, parts: 'mom',
      text: 'On a *glancing hit*, split each arrow into a part along the cue ball\'s first line and a part across it. Each direction keeps its own total. Before the hit, nothing moves across. So after it, the across parts cancel.',

    { kind: 'typed', name: 'Along the line', pic: 'shot', glance: true, m: [LIGHT, LIGHT], v: 3, e: 1, aim: 60, sc: 110, ox: 60, hUp: 30, parts: 'spd', path1: true, given: [false, true],

    add(K.svg('path', { class: 'arc', d: 'M' + r2(P.x + R0) + ' ' + r2(P.y) + ' A' + R0 + ' ' + R0 + ' 0 0 ' + (th > 0 ? 1 : 0) + ' ' + r2(P.x + R0 * ux) + ' ' + r2(P.y + R0 * uy) }));
    if (dg >= 30) { txt(P.x + 60 * Math.cos(th / 2), P.y + 60 * Math.sin(th / 2) + 4.5, dg + DEG, 'lab', 'middle'); REC.angles[who] = dg; }
  }

  function drawKey(L, d, v) {
    const y = L.keyY;
    arrow(10, y - 4, 32, y - 4, 'mo');
    txt(38, y, 'momentum', 'cap', 'start');
    if (d.pic !== 'pair' && d.pic !== 'cannon') { arrow(124, y - 4, 140, y - 4, 'push'); txt(146, y, 'push in the hit', 'cap', 'start'); }
    if (L.key2) { line(10, L.key2 - 4, 32, L.key2 - 4, 'leg'); txt(38, L.key2, 'parts along and across the line', 'cap', 'start'); }
  }

  function drawPool(i, st, v, said) {
    const d = v.d, c = v.cfg, TB = c.TB, f = v.f, S = v.S, A = c.balls[0], B = c.balls[1];
    add(K.svg('rect', { class: 'cloth', x: TB.x0, y: TB.y0, width: TB.x1 - TB.x0, height: TB.y1 - TB.y0, rx: 6 }));
    if (c.glance) {
      line(TB.x0 + 4, A.y, TB.x1 - 4, A.y, 'ref');
      txt(12, A.y - 14, 'first line', 'lab', 'start');
      if (S.tc !== Infinity) {
        part(Math.max(v.wedge, d.path1 ? 1 : 0), () => wedge(S.Bc, S.vB, 'B'));
        part(v.wedge, () => wedge(S.Ac, S.vA, 'A'));
      }
      if (d.aimDrag) {
        const gx = B.x - (A.r + B.r) * Math.cos(rad(st.aim));
        add(K.svg('circle', { class: 'ghost', cx: r2(gx), cy: r2(A.y), r: A.r }));
        if (!finished) REC.hits.push({ kind: 'aim', x: gx - 22, y: A.y - 22, w: 44, h: 44, aria: 'The aim: the dashed circle marks where the cue ball will touch the struck ball, ' + st.aim + DEG + ' off centre. Drag it round the struck ball, or use the arrow keys.' });
      }
    }
    if (d.pull && v.stick > 0.001) part(v.stick, () => line(A.x - A.r - 5, A.y, A.x - A.r - 5 - 15 * st.v, A.y, 'stick'));
    if (d.pull && !finished) REC.hits.push({ kind: 'pull', j: 0, dir: 1, bx: A.x, x: A.x - 82, y: A.y - 22, w: 82 + A.r + 8, h: 44, aria: 'The cue ball, set for a ' + spd(st.v) + ' m/s shot. Pull back from it and let go to play the shot, or use the arrow keys and Enter.' });
    if (d.noArrow && f.P[0].x + A.r + 10 < f.P[1].x - B.r) line(f.P[0].x + A.r + 4, A.y, f.P[1].x - B.r - 4, A.y, 'aimline');
    f.P.forEach((p, j) => dot(p.x, p.y, c.balls[j].r, 'ball' + j));
    if (f.push > 0.01 && v.arrow > 0.5) part(f.push, () => pushes(f.C, S.n));
    part(v.arrow, () => f.P.forEach((p, j) => momArrow(c, j, p, f.V[j], v)));
    const nm = ['The cue ball', 'The struck ball'];
    f.P.forEach((p, j) => said.push(nm[j] + ', ' + kgs(c.balls[j].m) + ', ' + (hyp(f.V[j]) < 0.005 ? 'is still.' : 'moves ' + vtxt(f.V[j], c.glance) + '.')));
    said.unshift('A pool table seen from above.' + (c.glance ? ' The cue ball is aimed ' + st.aim + DEG + ' off centre.' : ''));
  }
  function drawPair(i, st, v, said) {
    const d = v.d, c = v.pc;
    add(K.svg('rect', { class: 'cloth', x: TB1.x0, y: TB1.y0, width: TB1.x1 - TB1.x0, height: TB1.y1 - TB1.y0, rx: 6 }));
    c.balls.forEach((o, j) => {
      const dir = j ? -1 : 1, s = j ? st.v2 : st.v;
      if (d.pull && v.stick > 0.001) part(v.stick, () => line(o.x - dir * (o.r + 5), o.y, o.x - dir * (o.r + 5 + 15 * s), o.y, 'stick'));
      if (d.pull && !finished) REC.hits.push({ kind: 'pull', j, dir, bx: o.x, x: j ? o.x - o.r - 8 : o.x - 82, y: o.y - 22, w: 82 + o.r + 8, h: 44, aria: 'The ' + (j ? 'right' : 'left') + ' ball, rolling ' + spd(s) + ' m/s. Pull back from it to change its speed, or use the arrow keys.' });
    });
    c.balls.forEach((o, j) => dot(o.x, o.y, o.r, 'ball' + j));
    part(v.arrow, () => c.balls.forEach((o, j) => momArrow(c, j, o, { x: o.vx, y: 0 }, v)));
    said.push('A pool table seen from above. Two balls roll towards each other.');
    c.balls.forEach((o, j) => said.push('The ' + (j ? 'right' : 'left') + ' ball, ' + kgs(o.m) + ', rolls ' + vtxt({ x: o.vx, y: 0 }) + '.'));
  }
  function drawCannon(i, st, v, said) {
    const run = Math.max(0, Math.min(v.tau, 2.0)), ka = 4, vc = CANNON.mb * CANNON.vb / CANNON.mc, sc = v.d.sc;
    const cx = 170 - vc * ka * run, bx = 232 + CANNON.vb * ka * run;
    line(6, 100, 334, 100, 'ground');
    add(K.svg('rect', { class: 'body', x: r2(cx - 36), y: 62, width: 66, height: 14, rx: 3 }));
    add(K.svg('rect', { class: 'body', x: r2(cx - 32), y: 46, width: 86, height: 18, rx: 9 }));
    dot(cx - 20, 86, 13, 'wheel'); dot(cx + 18, 86, 13, 'wheel');
    if (bx < 352) dot(bx, 55, 7, 'ball1');
    part(v.arrow, () => {
      arrow(cx, 36, cx - CANNON.mb * CANNON.vb * sc, 36, 'mo');
      if (bx < 352) arrow(bx + 8, 55, bx + 8 + CANNON.mb * CANNON.vb * sc, 55, 'mo');
    });
    said.push('A cannon on wheels, seen from the side, on level ground. ' + (bx < 352 ? 'Its ball has just left the muzzle, moving right. ' : 'Its ball has flown off to the right. ') + 'The cannon\'s arrow points back.');
  }
  function drawWagons(i, st, v, said) {
    const c = v.cfg, f = v.f, S = v.S;
    line(6, 96, 334, 96, 'rail');
    f.P.forEach((p, j) => {
      const o = c.balls[j];
      add(K.svg('rect', { class: j ? 'body2' : 'body', x: r2(p.x - o.r), y: 50, width: o.r * 2, height: 32, rx: 3 }));
      dot(p.x - o.r + 12, 88, 7, 'wheel'); dot(p.x + o.r - 12, 88, 7, 'wheel');
      txt(p.x, 71, (j ? '20' : '30') + NB + 't', 'wl', 'middle');
    });
    if (f.push > 0.01) part(f.push, () => pushes({ x: f.P[0].x + c.balls[0].r, y: 66 }, { x: 1, y: 0 }));
    part(v.arrow, () => f.P.forEach((p, j) => { const L = c.balls[j].m * f.V[j].x * c.sc, y = j ? 26 : 40; if (Math.abs(L) >= 0.8) arrow(p.x, y, p.x + L, y, 'mo'); }));
    said.push('Two railway wagons on a level track, seen from the side.');
    f.P.forEach((p, j) => said.push('The ' + (j ? '20' : '30') + ' t wagon ' + (hyp(f.V[j]) < 0.005 ? 'is still.' : 'moves ' + vtxt(f.V[j]) + '.')));
  }

  function drawPanel(i, st, v, L) {
    const d = v.d, fm = momFmt(d), base = { ox: d.ox, sc: d.sc, fmt: fm, lab: v.lab };
    txt(8, L.pY, 'Total momentum, arrows nose to tail', 'cap', 'start');
    const y0 = L.rows[0], y1 = L.rows[1];
    if (d.pic === 'pair') {
      const items = v.pc.balls.map((o, j) => ({ p: o.m * o.vx, j }));
      row1D(y0, '', items, Object.assign({}, base, { ia: v.copies, ta: v.tot, q: d.askTotal && !v.sv }));
      return;
    }
    if (d.pic === 'cannon') {
      const p = CANNON.mb * CANNON.vb;
      row1D(y0, 'Before firing', [], base);
      row1D(y1, 'After firing', [{ p, j: 1 }, { p: -p, j: 0 }], base);
      return;
    }
    const c = v.cfg, S = v.S, jj2 = c.wag ? [0, 2] : [0, 1];
    row1D(y0, 'Before the hit', c.balls.map((o, j) => ({ p: o.m * o.vx, j: jj2[j] })), base);
    if (d.outcome) {
      if (v.out > 0.001) row1D(y1, 'The third outcome', d.outcome.map((s, j) => ({ p: LIGHT * s, j })), Object.assign({}, base, { a: v.out, cls: 'bad', note: ', not +0.4' }));
      else { txt(8, y1 + 13, 'After the hit', 'cap', 'start'); txt(d.ox, y1 + 32.5, '?', 'lab', 'start'); }
      return;
    }
    const fin = [S.vA, S.vB];
    if (v.after > 0.001) {
      if (c.glance) row2D(y1, 'After the hit', c.balls.map((o, j) => ({ p: { x: o.m * fin[j].x, y: o.m * fin[j].y }, j })), Object.assign({}, base, { a: v.after, hUp: d.hUp }));
      else row1D(y1, 'After the hit', c.balls.map((o, j) => ({ p: o.m * fin[j].x, j: jj2[j] })), Object.assign({}, base, { a: v.after }));
    } else {
      txt(8, y1 + 13, 'After the hit', 'cap', 'start');
      if (!d.show) txt(d.ox, y1 + 32.5, '?', 'lab', 'start');
    }
  }

  // The whole picture for step i in state st, T seconds into its motion; returns it in words.
  function scene(i, st, T) {
    const d = STEPS[i], v = view(i, st, T), L = layout(i), said = [];
    REC = { texts: [], rows: [], angles: {}, hits: [], v, F: facts(i, st, v), L };
    art.textContent = ''; into = null;
    if (d.pic === 'pair') drawPair(i, st, v, said);
    else if (d.pic === 'cannon') drawCannon(i, st, v, said);
    else if (d.pic === 'wagons') drawWagons(i, st, v, said);
    else drawPool(i, st, v, said);
    if (!d.noArrow) { drawKey(L, d, v); drawPanel(i, st, v, L); }
    return said.join(' ');
  }

  // ---------- the tables under the picture ----------
  function fillTable(box, title, T1) {
    box.textContent = '';
    box.hidden = !T1;
    if (!T1) return;
    box.appendChild(K.el('span', { class: 'k-label' }, title));
    const g = K.el('div', { class: 'tbl c' + T1.cols.length });
    box.appendChild(g);
    g.appendChild(K.el('span', { class: 'th' }, ''));
    T1.cols.forEach((t) => g.appendChild(K.el('span', { class: 'th' }, t)));
    T1.rows.forEach((r) => {
      const n = K.el('span', { class: 'nm' });
      if (r.sw != null) n.appendChild(K.el('i', { class: 'sw sw' + r.sw, 'aria-hidden': 'true' }));
      n.appendChild(document.createTextNode(r.name));
      g.appendChild(n);
      r.cells.forEach((c) => { const b = c.full && c.full !== c.t ? K.el('b', { class: 'cell stack' }, K.el('span', { class: 'sizer', 'aria-hidden': 'true' }, c.full), K.el('span', {}, c.t)) : K.el('b', { class: 'cell' }, c.t); if (c.a != null && c.a < 1) b.style.opacity = Math.max(0, c.a).toFixed(3); g.appendChild(b); });
    });
  }
  function fillKE(box, E) {
    box.textContent = '';
    box.hidden = !E;
    if (!E) return;
    box.appendChild(K.el('span', { class: 'k-label' }, 'Kinetic energy, all balls'));
    [['Before', E.b, 1, E.bt], ['After', E.a, E.aa, E.at]].forEach((r) => {
      const fill = K.el('i');
      fill.style.width = (r[1] == null ? 0 : Math.min(100, 100 * r[1] / E.max) * r[2]).toFixed(2) + '%';
      box.appendChild(K.el('div', { class: 'kerow' }, K.el('span', {}, r[0]), K.el('div', { class: 'meter' }, fill), K.el('b', {}, r[3])));
    });
  }

  // ---------- state, motion and controls ----------
  let ST = STEPS.map(fresh);
  let T = Infinity, motionEnd = 0, lastStep = -1, finished = false, lastDone = false, HITS = [];
  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const testing = () => document.documentElement.classList.contains('k-testing');
  const quiet = () => REDUCE || testing();
  const stepper = K.stepper({ id: 'step', label: 'Step', steps: STEPS.map((d) => d.name), value: 0, compact: true, into: '#prog' });
  const cur = () => Math.round(stepper.get());
  const hintFor = (d, st) => (d.hints && d.hints[st.pick]) || d.hint;
  const ctlB = K.control({ id: 'bounce', label: 'Bounce', hint: 'How fast the balls part ÷ how fast they met', min: 0, max: 1, step: 0.1, value: 0,
    fmt: (x) => (x >= 0.999 ? 'Ideal bouncy' : x <= 0.001 ? 'Sticky' : K.fmt(x, { decimals: 1 })), snap: [0, 1], into: '#ctl' });
  const ctlH = K.toggle({ id: 'heavy', label: 'Heavy struck ball', hint: '0.4 kg instead of 0.2 kg', value: true, into: '#ctl' });

  function paint(i) {
    if (i == null) i = cur();
    const L = layout(i), words = scene(i, ST[i], T);
    svg.setAttribute('viewBox', '0 -6 340 ' + r2(L.H + 6));
    svg.setAttribute('aria-label', words);
    HITS = REC.hits;
    placeUI();
    const F = finished ? {} : REC.F;
    fillTable(el('facts'), 'Speeds', F.speed);
    fillKE(el('ke'), F.ke);
    fillTable(el('parts'), F.parts ? F.parts.title : '', F.parts);
  }
  const anim = K.anim({ button: false, label: 'Moving', step: (dt) => {
    if (finished) return false;
    T += dt;
    paint();
    return T < motionEnd;
  } });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !anim.playing() && T !== Infinity) { T = Infinity; paint(); } });
  function play(dur) {
    if (quiet()) { T = Infinity; anim.pause(); paint(); return; }
    motionEnd = dur; T = 0; anim.play();
  }
  function demoDur(i) { const d = STEPS[i]; if (d.pic === 'pair') return 3.2; const S1 = simulate(cfgOf(i, ST[i])); return leadOf(S1) + S1.done + 0.05; }
  function runDur(i) {
    const d = STEPS[i];
    if (d.pic === 'pair') return 1.0;
    if (d.pic === 'cannon') return 2.4;
    if (d.outcome) return 0.9;
    return 0.3 + simulate(cfgOf(i, ST[i])).done + 0.05;
  }
  const shotDur = (i) => 0.15 + simulate(cfgOf(i, ST[i])).done + 0.05;
  function startShot(i) { ST[i].mode = 'shot'; play(shotDur(i)); }
  function toIdle(i) { ST[i].mode = 'idle'; anim.pause(); T = Infinity; }
  function startRun(i) { ST[i].mode = 'run'; play(runDur(i)); }
  function enter(id) {
    if (REDUCE) return;
    const box = el(id);
    box.classList.remove('enter'); void box.offsetWidth; box.classList.add('enter');
  }
  function enterStep(i) {
    const d = STEPS[i], st = ST[i];
    lastStep = i; enter('stepbox');
    if (d.show) {
      const f0 = fresh(d);
      st.v = f0.v; st.v2 = f0.v2; st.e = f0.e; st.heavy = true; st.aim = f0.aim; st.mode = 'demo';
    } else st.mode = solved(st) ? 'end' : 'idle';
    if (d.bounce) ctlB.set(st.e, true);
    if (d.heavySw) ctlH.set(st.heavy, true);
    if (d.show) play(demoDur(i)); else { anim.pause(); T = Infinity; }
  }

  // Dan's hands on the table: pull back from a ball for speed; drag the aim round the struck ball.
  const svgPt = (e) => { const ctm = svg.getScreenCTM(); return ctm ? new DOMPoint(e.clientX, e.clientY).matrixTransform(ctm.inverse()) : null; };
  let DRAG = null;
  const HITEL = [];
  function aimAt(i, p) {
    const c = cfgOf(i, ST[i]), B = c.balls[1];
    const a = Math.atan2(B.y - p.y, B.x - p.x) * 180 / Math.PI;
    return K.clamp(Math.round(a / 5) * 5, 0, 75);
  }
  function setSpeed(i, h, s) { const st = ST[i]; if (h.j) st.v2 = K.clamp(s, VMIN, VMAX); else st.v = K.clamp(s, VMIN, VMAX); }
  function release(h) { const i = cur(); if (h.kind === 'pull' && STEPS[i].pic === 'shot') startShot(i); else paint(); }
  function bindHit(r) {
    const H = () => HITS[+r.dataset.k];
    r.addEventListener('pointerdown', (e) => {
      const h = H();
      if (!h) return;
      const p = svgPt(e);
      if (!p) return;
      toIdle(cur());
      DRAG = { pid: e.pointerId, h: Object.assign({}, h), x0: p.x, y0: p.y, moved: false };
      try { r.setPointerCapture(e.pointerId); } catch (err) { /* the drag still follows the pointer over the target */ }
      e.preventDefault();
      paint();
    });
    r.addEventListener('pointermove', (e) => {
      if (!DRAG || DRAG.pid !== e.pointerId) return;
      const p = svgPt(e);
      if (!p) return;
      if (!DRAG.moved && Math.hypot(p.x - DRAG.x0, p.y - DRAG.y0) < 3) return;
      DRAG.moved = true;
      const i = cur(), h = DRAG.h;
      if (h.kind === 'aim') ST[i].aim = aimAt(i, p);
      else setSpeed(i, h, Math.round((h.bx - p.x) * h.dir / 7.5) / 2);
      paint();
    });
    r.addEventListener('pointerup', (e) => { if (!DRAG || DRAG.pid !== e.pointerId) return; const h = DRAG.h; DRAG = null; release(h); });
    r.addEventListener('pointercancel', (e) => { if (DRAG && DRAG.pid === e.pointerId) DRAG = null; });
    r.addEventListener('keydown', (e) => {
      const h = H();
      if (!h) return;
      const i = cur(), st = ST[i];
      if (h.kind === 'pull' && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); toIdle(i); release(h); return; }
      const by = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1 }[e.key];
      if (!by) return;
      e.preventDefault();
      toIdle(i);
      if (h.kind === 'aim') st.aim = K.clamp(st.aim + 5 * by, 0, 75);
      else setSpeed(i, h, (h.j ? st.v2 : st.v) + 0.5 * by);
      paint();
    });
  }
  function placeUI() {
    while (HITEL.length < HITS.length) {
      const r = ui.appendChild(K.svg('rect', { class: 'hit', tabindex: '0', rx: 8 }));
      r.dataset.k = HITEL.length; bindHit(r); HITEL.push(r);
    }
    HITEL.forEach((r, k) => {
      const h = HITS[k];
      r.style.display = h ? '' : 'none';
      r.setAttribute('tabindex', h ? '0' : '-1');
      if (!h) return;
      r.setAttribute('x', r2(h.x)); r.setAttribute('y', r2(h.y)); r.setAttribute('width', r2(h.w)); r.setAttribute('height', r2(h.h));
      r.setAttribute('aria-label', h.aria);
    });
  }

  // Answers: up to four choices; a typed field for each figure.
  const pickBtns = [0, 1, 2, 3].map((k) => K.button({ label: 'Answer ' + (k + 1), secondary: true, into: '#picks', press: () => {
    const i = cur(), d = STEPS[i], st = ST[i];
    if (finished || d.kind !== 'pick' || k >= d.opts.length || solved(st)) return;
    st.pick = d.opts[k]; st.res = null;
  } }));
  const FIELDS = {};
  STEPS.forEach((d, i) => {
    if (d.kind !== 'typed') return;
    el('answers').appendChild(K.el('div', { id: 'ans-' + d.ans }));
    const a = K.answer({ id: 'a-' + d.ans, unit: d.unit, answer: d.answer, decimals: d.decimals, slips: d.slips, into: '#ans-' + d.ans,
      onCheck: (r) => {
        const st = ST[i];
        if (solved(st)) return;
        if (r.state === 'right') { st.res = 'right'; startRun(i); }
        else if (r.state === 'wrong') {
          st.tries += 1; st.hint = r.hint || d.hint;
          if (st.tries >= 2) { st.res = 'shown'; st.why = true; a.reveal(); startRun(i); } else st.res = 'wrong';
        } else { st.res = null; st.hint = ''; }
        K.refresh();
      } });
    FIELDS[d.ans] = a;
  });
  const checkBtn = K.button({ label: 'Check', into: '#acts', press: () => {
    const i = cur(), d = STEPS[i], st = ST[i];
    if (finished || d.show || solved(st)) return;
    if (d.kind === 'typed') { FIELDS[d.ans].check(); return; }
    if (st.pick == null) { st.res = 'empty'; return; }
    st.res = st.pick === d.want ? 'right' : 'wrong';
    if (st.res === 'right') startRun(i); else st.tries += 1;
  } });
  const whyBtn = K.button({ label: 'Why?', secondary: true, into: '#acts', press: () => {
    const d = STEPS[cur()], st = ST[cur()];
    if (d.show || finished || (!solved(st) && st.tries === 0)) return;
    st.why = !st.why;
  } });
  const replayBtn = K.button({ label: 'Play again', secondary: true, into: '#replay', press: () => {
    const i = cur(), d = STEPS[i], st = ST[i];
    if (!d.show || finished) return;
    st.mode = 'demo';
    play(demoDur(i));
  } });
  const backBtn = K.button({ label: 'Back', secondary: true, into: '#nav', press: () => {
    if (finished) { finished = false; return; }
    stepper.set(Math.max(0, cur() - 1), true);
  } });
  const nextBtn = K.button({ label: 'Continue', into: '#nav', press: () => {
    const i = cur();
    if (finished || (!STEPS[i].show && !solved(ST[i]))) return;
    if (i < STEPS.length - 1) { stepper.set(i + 1, true); return; }
    finished = true; anim.pause(); T = Infinity;
    if (typeof K.complete === 'function') K.complete();
  } });
  K.button({ label: 'Start again', secondary: true, into: '#again', press: () => {
    ST = STEPS.map(fresh); finished = false; lastStep = -1;
    Object.keys(FIELDS).forEach((k) => FIELDS[k].reset());
    stepper.set(0, true);
  } });

  // ---------- words (built with K.el, never innerHTML): *a key term*, `kept on one line` ----------
  function write(node, s) {
    node.textContent = '';
    String(s || '').split('`').forEach((seg, k) => {
      if (!seg) return;
      if (k % 2) { node.appendChild(K.el('span', { class: 'nw' }, seg)); return; }
      const re = /\*([^*]+)\*/g;
      let from = 0, m;
      while ((m = re.exec(seg))) {
        if (m.index > from) node.appendChild(document.createTextNode(seg.slice(from, m.index)));
        node.appendChild(K.el('span', { class: 'term' }, m[1]));
        from = m.index + m[0].length;
      }
      if (from < seg.length) node.appendChild(document.createTextNode(seg.slice(from)));
    });
    return node;
  }
  write(el('finish'), FINISH);

  K.update((p) => {
    const i = Math.round(p.step), d = STEPS[i], st = ST[i];
    if (!anim.playing()) T = Infinity;
    if (i !== lastStep) enterStep(i);
    else {
      if (d.bounce && Math.abs(ctlB.get() - st.e) > 1e-9) { st.e = ctlB.get(); st.mode = 'end'; anim.pause(); T = Infinity; }
      if (d.heavySw && ctlH.get() !== st.heavy) { st.heavy = ctlH.get(); startShot(i); }
    }
    if (finished !== lastDone) { lastDone = finished; enter(finished ? 'done' : 'stepbox'); }
    const sv = solved(st);
    el('stepbox').hidden = finished;
    el('done').hidden = !finished;
    el('count').textContent = 'Step ' + (i + 1) + ' of ' + STEPS.length;
    const task = el('task');
    task.className = 'task' + (d.show ? ' show' : '');
    write(task, d.show ? d.text : d.task);
    el('act').hidden = !d.act;
    write(el('act'), d.act || '');
    ctlB.el.hidden = !d.bounce;
    ctlH.el.hidden = !d.heavySw;
    el('ctl').hidden = finished || (!d.bounce && !d.heavySw);
    paint(i);
    replayBtn.el.hidden = !d.show || REDUCE;
    el('replay').hidden = replayBtn.el.hidden;
    const opts = d.kind === 'pick' ? d.opts : [];
    const picks = el('picks');
    picks.hidden = !opts.length;
    picks.classList.toggle('col', !!d.col);
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      b.setLabel(opts[k]);
      b.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });
    STEPS.forEach((x, k) => { if (x.kind === 'typed') el('ans-' + x.ans).hidden = finished || k !== i; });
    el('answers').hidden = d.kind !== 'typed';
    el('acts').hidden = !!d.show;
    checkBtn.el.hidden = sv;
    const fb = el('fb');
    fb.hidden = !!d.show;
    fb.className = 'fb' + (st.res === 'right' ? ' right' : '');
    write(fb, d.show ? '' : st.res === 'right' ? 'That\'s it.' : st.res === 'shown' ? 'Here is the working.' :
      st.res === 'wrong' ? (d.kind === 'typed' ? st.hint : hintFor(d, st)) : st.res === 'empty' ? 'Tap one of the answers.' : '');
    const why = el('why');
    why.hidden = !!d.show || !st.why;
    write(why, d.show ? '' : d.why);
    whyBtn.setLabel(st.why ? 'Hide why' : 'Why?');
    whyBtn.el.hidden = !sv && st.tries === 0;
    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !sv);
    nextBtn.setLabel(i === STEPS.length - 1 ? 'Finish' : 'Continue');
    el('nav').hidden = backBtn.el.hidden && nextBtn.el.hidden;
  });

  // ---------- known answers, worked out by hand ----------
  const IX = (name) => STEPS.findIndex((d) => d.name === name);
  const openSt = (i) => fresh(STEPS[i]);
  const doneSt = (i) => Object.assign(fresh(STEPS[i]), { res: 'right', mode: 'end' });
  function drawn(i, st, t) { try { scene(i, st, t == null ? Infinity : t); return REC; } finally { paint(); } }
  const momOf = (c, V) => ({ x: c.balls[0].m * V[0].x + c.balls[1].m * V[1].x, y: c.balls[0].m * V[0].y + c.balls[1].m * V[1].y });
  const shotSteps = STEPS.map((d, i) => i).filter((i) => STEPS[i].pic === 'shot' || STEPS[i].pic === 'wagons');
  function everyShot(fn) {
    for (const i of shotSteps) for (let s = VMIN; s <= VMAX + 1e-9; s += 0.5) for (const e of [0, 0.3, 0.8, 1]) for (const heavy of [false, true]) for (const aim of [0, 30, 60, 75]) {
      const c = cfgOf(i, Object.assign(fresh(STEPS[i]), { v: s, e, heavy, aim })), S1 = simulate(c);
      if (S1.tc === Infinity || !fn(c, S1)) return false;
    }
    return true;
  }

  K.check('In a closed system, total momentum before an event = total momentum after: every shot drawn, at every speed, bounce, mass and aim, keeps its total before, during and after the hit', () =>
    everyShot((c, S1) => {
      const b = momOf(c, c.balls.map((o) => ({ x: o.vx, y: o.vy }))), tol = 1e-9 * Math.max(1, Math.abs(b.x));
      return [S1.tc * 0.5, S1.tc + TAU * 0.3, S1.tc + TAU * 0.8, Infinity].every((t) => { const m = momOf(c, at(S1, t).V); return near(m.x, b.x, tol) && near(m.y, b.y, tol); });
    }), { source: BBC });
  K.check('A closed system is not affected by external forces: in each hit the two pushes are equal and opposite, so one body gains exactly what the other loses', () =>
    everyShot((c, S1) => {
      const A = c.balls[0], B = c.balls[1], tol = 1e-9 * Math.max(1, A.m * A.vx);
      return near(A.m * (S1.vA.x - A.vx), -B.m * (S1.vB.x - B.vx), tol) && near(A.m * (S1.vA.y - A.vy), -B.m * (S1.vB.y - B.vy), tol);
    }), { source: BBC });
  K.check('Momentum is conserved, but kinetic energy is not conserved: below ideal bouncy every hit ends with less kinetic energy than it began with, and at ideal bouncy with the same', () =>
    everyShot((c, S1) => {
      const kb = keOf(c.balls[0], { x: c.balls[0].vx, y: 0 }) + keOf(c.balls[1], { x: c.balls[1].vx, y: 0 }), ka = keOf(c.balls[0], S1.vA) + keOf(c.balls[1], S1.vB);
      return c.e >= 1 ? near(ka, kb, 1e-9 * Math.max(1, kb)) : ka < kb - 1e-9 * Math.max(1, kb);
    }), { source: OSX });
  K.check('Each screen\'s figures come from the rule: 2.0 m/s dead centre stops the cue ball; sticking gives 2.0 m/s and 1.8 J to 1.2 J; light into heavy gives −1.0 and 2.0 m/s, and −0.6 and 1.8 m/s at a bounce of 0.8; a 60° glancing hit gives 1.73 m/s at 30° and 1.0 m/s at 60°; the cannon 5.0 m/s; the wagons 0.8 m/s', () => {
    const fin = (n, over) => { const i = IX(n), st = Object.assign(fresh(STEPS[i]), over || {}), c = cfgOf(i, st); return { c, S: simulate(c) }; };
    const a = fin('What does the cue ball do?'), b = fin('They stick'), e1 = fin('Energy is not kept', { e: 1 }), n = fin('Energy lost');
    const l = fin('Light into heavy'), k = fin('Bounce back'), g = fin('Glancing hits'), h = fin('Along the line'), w = fin('Coupling wagons');
    const ke = (x, V) => keOf(x.c.balls[0], V[0]) + keOf(x.c.balls[1], V[1]);
    const pair = drawn(IX('Momentum has a direction'), openSt(IX('Momentum has a direction'))).rows[0];
    return near(a.S.vA.x, 0, 1e-12) && near(a.S.vB.x, 2) && near(b.S.vA.x, 2) && near(b.S.vB.x, 2) &&
      near(ke(b, [{ x: 3, y: 0 }, { x: 0, y: 0 }]), 1.8) && near(ke(b, [b.S.vA, b.S.vB]), 1.2) && near(ke(e1, [e1.S.vA, e1.S.vB]), 1.8) &&
      near(ke(n, [{ x: 4, y: 0 }, { x: 0, y: 0 }]) - ke(n, [n.S.vA, n.S.vB]), 0.8) &&
      near(l.S.vA.x, -1) && near(l.S.vB.x, 2) && near(k.S.vA.x, -0.6) && near(k.S.vB.x, 1.8) &&
      near(hyp(g.S.vA), Math.sqrt(3)) && near(degOf(g.S.vA), -30) && near(hyp(g.S.vB), 1) && near(degOf(g.S.vB), 60) &&
      r2(LIGHT * g.S.vA.x) === 0.3 && r2(LIGHT * g.S.vB.x) === 0.1 && r2(-LIGHT * g.S.vA.y) === 0.17 && r2(LIGHT * g.S.vB.y) === 0.17 &&
      near(h.S.vA.x, 2.25) && near(h.S.vB.x, 0.75) && r2(-h.S.vA.y) === 1.3 && near(hyp(h.S.vB), 1.5) &&
      near(CANNON.mb * CANNON.vb / CANNON.mc, 5) && near(w.S.vA.x, 0.8) && near(w.S.vB.x, 0.8) &&
      pair.copies[0] === '+0.4' && pair.copies[1] === MINUS + '0.3' && pair.total === 'total +0.1' + KGMS;
  });
  K.check('Each typed answer and slip is worked from the lesson\'s figures: 0.2 kg m/s (1.4, −0.2), 2.0 m/s (1.5, 6.0), 0.8 J (0, 1.6, 1.2), 1.8 m/s (1.2, 1.5), 2.25 m/s (1.5, 1.70), 5.0 m/s (120, 4.8, 0) and 0.8 m/s (1.6, 1.3, 2.0)', () => {
    const one = (name, ans, sl, want) => {
      const d = STEPS[IX(name)], sp = { answer: d.answer, decimals: d.decimals, unit: d.unit, slips: d.slips };
      return near(d.answer, ans) && d.want === want && d.slips.length === sl.length && K.answer.grade(d.want, sp).state === 'right' &&
        d.slips.every((x, j) => near(x.value, sl[j]) && K.answer.grade(String(sl[j]), sp).state === 'wrong');
    };
    return one('The total', 0.2, [1.4, -0.2], '0.2 kg m/s') && one('They stick', 2, [1.5, 6], '2.0 m/s') && one('Energy lost', 0.8, [0, 1.6, 1.2], '0.8 J') &&
      one('Bounce back', 1.8, [1.2, 1.5], '1.8 m/s') && one('Along the line', 2.25, [1.5, 1.7], '2.25 m/s') && one('The cannon', 5, [120, 4.8, 0], '5.0 m/s') &&
      one('Coupling wagons', 0.8, [1.6, 1.3, 2], '0.8 m/s');
  });
  K.check('Before an answer nothing gives it away: each asked figure reads "?" and no momentum is labelled; after it, each shows its figure', () => {
    const F = (n, done) => { const i = IX(n); return drawn(i, done ? doneSt(i) : openSt(i)); };
    const cell = (R, j, k) => R.F.speed.rows[j].cells[k].t;
    const tot = F('The total'), tot2 = F('The total', true), stk = F('They stick'), stk2 = F('They stick', true);
    const nrg = F('Energy lost'), nrg2 = F('Energy lost', true), bnc = F('Bounce back'), bnc2 = F('Bounce back', true);
    const alg = F('Along the line'), alg2 = F('Along the line', true), can = F('The cannon'), can2 = F('The cannon', true), wag = F('Coupling wagons'), wag2 = F('Coupling wagons', true);
    const quietRows = (R) => R.rows.every((r) => !r.copies.length && (!r.total || r.total === 'total ?'));
    return tot.rows[0].total === 'total ?' && quietRows(tot) && tot2.rows[0].total === 'total +0.2' + KGMS &&
      cell(stk, 0, 1) === '?' && cell(stk, 1, 1) === '?' && quietRows(stk) && cell(stk2, 1, 1) === '2.0' + MS + ' right' &&
      nrg.F.ke.at === '?' && quietRows(nrg) && nrg2.F.ke.at === '0.8' + NB + 'J' &&
      cell(bnc, 0, 1) === '0.6' + MS + ' left' && cell(bnc, 1, 1) === '?' && cell(bnc2, 1, 1) === '1.8' + MS + ' right' &&
      cell(alg, 0, 1) === '?' && cell(alg, 1, 1) === '1.5' + MS + ' at 60' + DEG && alg.angles.B === 60 && alg.F.parts.rows[0].cells[1].t === '?' &&
      alg2.F.parts.rows[0].cells[1].t === '2.25 + 0.75 = 3.0' && alg2.F.parts.rows[1].cells[1].t === '1.3 ' + MINUS + ' 1.3 = 0' &&
      cell(can, 1, 1) === '?' && quietRows(can) && cell(can2, 1, 1) === '5.0' + MS + ' left' &&
      cell(wag, 0, 1) === '?' && quietRows(wag) && cell(wag2, 0, 1) === '0.8' + MS + ' right';
  });
  K.check('The choices follow the rule: two equal balls at ideal bouncy leave the cue ball still, and of the four outcomes only the third, at 0.3 kg m/s, misses the 0.4 kg m/s total', () => {
    const i0 = IX('What does the cue ball do?'), i1 = IX('Which cannot happen?'), d1 = STEPS[i1];
    const R = drawn(i1, doneSt(i1)), totals = [[0, 2], [0.5, 1.5], [0.5, 1.0], [1, 1]].map((x) => LIGHT * (x[0] + x[1]));
    return STEPS[i0].want === STEPS[i0].opts[0] && drawn(i0, doneSt(i0)).F.speed.rows[0].cells[1].t === 'still' && d1.want === OPT13[2] &&
      totals.filter((t) => !near(t, 0.4, 1e-9)).length === 1 && near(totals[2], 0.3) && R.rows[1].total === 'total +0.3' + KGMS + ', not +0.4';
  });
  K.check('Every demonstration is over within 5 s and settles; every answer\'s motion is over within 3.5 s; the cue ball on the first screen stops within 3 s of Check', () => {
    const J = (i, st, t) => JSON.stringify(scene(i, st, t)) + JSON.stringify(REC.F) + REC.texts.join('|');
    try {
      const ok = STEPS.every((d, i) => {
        const b = Object.assign(openSt(i), { mode: 'demo' }), r = Object.assign(doneSt(i), { mode: 'run' });
        if (d.show) { const D = demoDur(i); return D >= 3 && D <= 5 && J(i, b, D) === J(i, b, Infinity); }
        const R = runDur(i); return R <= 3.5 && J(i, r, R) === J(i, r, Infinity);
      });
      const i0 = IX('What does the cue ball do?'), S0 = simulate(cfgOf(i0, openSt(i0)));
      return ok && 0.3 + S0.tc + TAU < 3;
    } finally { paint(); }
  });

  K.ready();
</script>
