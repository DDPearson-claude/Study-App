<p class="caption">Light bends at the surface because it changes speed there.</p>

<script>
  // ---------- helpers ----------
  const OPENSTAX = 'https://openstax.org/books/college-physics-2e/pages/25-3-the-law-of-refraction';
  const BRITANNICA = 'https://www.britannica.com/science/refractive-index';
  const NCBI = 'https://www.ncbi.nlm.nih.gov/sites/books/NBK592413/';
  const el = (id) => document.getElementById(id);
  const rad = (d) => d * Math.PI / 180, deg = (r) => r * 180 / Math.PI;
  const r1 = (v) => Math.round(v * 10) / 10, r2 = (v) => Math.round(v * 100) / 100, r3 = (v) => Math.round(v * 1000) / 1000;
  const near = (a, b, tol) => Math.abs(a - b) <= tol;
  const fm = (v) => K.fmt(r1(v), { decimals: Number.isInteger(r1(v)) ? 0 : 1 });
  const f1 = (v) => K.fmt(v, { decimals: 1 }), f2 = (v) => K.fmt(v, { decimals: 2 });
  // Short groups of maths kept on one line in the words (no-break spaces).
  const nb = (s) => s.replace(/ /g, ' ');
  const P2 = (x, y) => ({ x, y });
  const plus = (a, b) => P2(a.x + b.x, a.y + b.y), minus = (a, b) => P2(a.x - b.x, a.y - b.y), times = (a, k) => P2(a.x * k, a.y * k);
  const dot = (a, b) => a.x * b.x + a.y * b.y, size = (a) => Math.hypot(a.x, a.y), unit = (a) => times(a, 1 / (size(a) || 1));
  const dist = (a, b) => size(minus(a, b)), lerpP = (a, b, t) => P2(a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t);
  const cross2 = (a, b) => a.x * b.y - a.y * b.x;
  const angDeg = (a, b) => deg(Math.acos(K.clamp(dot(unit(a), unit(b)), -1, 1)));

  // ---------- the rule: light slows in water and glass, and n1 sin i = n2 sin r ----------
  const N = { air: 1, water: 1.333, glass: 1.5 };
  const NTXT = { air: '1', water: '1.333', glass: '1.50' };
  const C0 = 3.00e8, CG = 2.00e8;   // light's speed in empty space, and in the example glass block
  // The angle of refraction, or null when no angle has the sine the law asks for (all of it reflects).
  function snell(i, n1, n2) { const s = n1 * Math.sin(rad(i)) / n2; return s > 1 + 1e-9 ? null : deg(Math.asin(Math.min(1, s))); }
  const critical = (n1, n2) => deg(Math.asin(n2 / n1));
  // The same law for a ray along d meeting a face whose normal nf points back towards the light.
  function refractV(d, nf, n1, n2) {
    const eta = n1 / n2, ci = -dot(nf, d), k = 1 - eta * eta * (1 - ci * ci);
    if (k < 0) return null;
    return unit(plus(times(d, eta), times(nf, eta * ci - Math.sqrt(k))));
  }
  const reflectV = (d, nf) => minus(d, times(nf, 2 * dot(d, nf)));

  // The boundary: the surface across the picture, the ray striking it at BP.
  const SY = 112, BX = 170, BP = P2(BX, SY), RL = 120, RO = 110, BOT = 244;
  // The row of marchers: seven marchers side by side, square to the ray. Each walks its own line
  // beside the ray at the speed outside, crosses the surface, then walks on along the bent ray
  // at n1 / n2 of that speed. Time is counted in units walked outside.
  function marchModel(th, n1, n2, sg) {
    const r = snell(th, n1, n2), s = Math.sin(rad(th)), c = Math.cos(rad(th)), tn = s / c;
    const d1 = P2(s, sg * c), d2 = P2(Math.sin(rad(r)), sg * Math.cos(rad(r))), w = P2(c, -sg * s);
    const W = Math.min(64, 170 * c), offs = K.linspace(-W / 2, W / 2, 7), D0 = (W / 2) * tn + 60, k = n1 / n2;
    const pos = (o, t) => {
      const t0 = D0 + o * tn, Q = minus(plus(BP, times(w, o)), times(d1, D0));
      return t <= t0 ? plus(Q, times(d1, t)) : plus(plus(Q, times(d1, t0)), times(d2, (t - t0) * k));
    };
    return { r, d1, d2, k, pos, tA: D0 - (W / 2) * tn - 50, tB: D0 + (W / 2) * tn + 44, row: (t) => offs.map((o) => pos(o, t)) };
  }

  // The tank: water surface at TS, 125 drawing units to the metre of depth, the coin at CX.
  const TS = 100, SC = 125, TLW = 22, TRW = 318, CX = 130, PW = 11;
  // Where on the surface light from the coin C must leave to reach the point E above.
  function crossAt(C, E) {
    let lo = Math.min(C.x, E.x), hi = Math.max(C.x, E.x);
    if (hi - lo < 1e-9) return P2(C.x, TS);
    const f = (x) => N.water * (x - C.x) / Math.hypot(x - C.x, C.y - TS) - (E.x - x) / Math.hypot(E.x - x, TS - E.y);
    for (let k = 0; k < 60; k++) { const m = (lo + hi) / 2; if (f(m) < 0) lo = m; else hi = m; }
    return P2((lo + hi) / 2, TS);
  }
  // Two rays from the coin into the two sides of the eye's pupil, and where the eye's lines back meet.
  function view(C, E) {
    const X0 = crossAt(C, E), look = unit(minus(X0, E)), pp = P2(-look.y, look.x);
    const E1 = plus(E, times(pp, PW)), E2 = minus(E, times(pp, PW)), X1 = crossAt(C, E1), X2 = crossAt(C, E2);
    const u1 = unit(minus(X1, E1)), u2 = unit(minus(X2, E2)), den = cross2(u1, u2);
    const I = Math.abs(den) < 1e-12 ? P2(C.x, TS + (C.y - TS) / N.water) : plus(X1, times(u1, cross2(minus(X2, X1), u2) / den));
    return { X0, look, E1, E2, X1, X2, I };
  }

  // The prism: 60° at the top, white light entering the left face at the angle that runs it level inside.
  const PA = P2(170, 34), PH = 160, PHW = PH * Math.tan(rad(30)), PB = P2(170 - PHW, 34 + PH), PC = P2(170 + PHW, 34 + PH);
  // Each colour's index, red to violet. The spread is drawn wider than real glass has it.
  const COLS = [['red', 1.44], ['', 1.47], ['', 1.50], ['', 1.52], ['', 1.54], ['violet', 1.56]];
  function prismModel() {
    const tL = unit(minus(PA, PB)), nL = P2(tL.y, -tL.x), tR = unit(minus(PC, PA)), nR = P2(tR.y, -tR.x);
    const F1 = lerpP(PA, PB, 0.55), i0 = deg(Math.asin(N.glass * Math.sin(rad(30))));
    const d0 = unit(plus(times(nL, -Math.cos(rad(i0))), times(tL, Math.sin(rad(i0)))));
    const W0 = minus(F1, times(d0, 92)), e = minus(PC, PA);
    const paths = COLS.map(([name, n]) => {
      const din = refractV(d0, nL, 1, n), F2 = plus(F1, times(din, cross2(minus(PA, F1), e) / cross2(din, e)));
      const dout = refractV(din, times(nR, -1), n, 1);
      return { name, n, din, F2, dout, turn: angDeg(d0, dout) };
    });
    return { F1, W0, d0, paths };
  }

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  const ANS7 = r1(snell(50, 1, N.glass)), ANS11 = r1(critical(N.glass, 1));
  const STEPS = [
    { kind: 'pick', name: 'The coin in the tank', pic: 'tank', H: 292, depth: 1.2, eye: P2(276, 40), rod: true, run: 2.4, col: true,
      tl: { ray: [0.1, 0.6, 1.1], back: 1.2, img: 1.5 },
      task: 'You see a coin in a tank and push a rod straight at it. The rod misses. Where is the coin really?',

    { show: true, name: 'Slower means a bend', pic: 'bound', H: 296, bot: 'water', swing: [62, 40], drag: ['ray'], sw: ['march'], marchOn: true, tiles: ['i', 'r'], dur: 4.1, swRun: 3.0,
      tl: { in: [0.4, 1.0], out: [1.0, 1.6], refl: 1.6, nrm: 1.9, ang: 2.2, march: [0.4, 2.7], swing: [2.8, 4.0] },

  const sci = (v) => f2(v / 1e8) + ' × 10⁸ m/s';
  function sceneSpeeds(d, st) {
    const sv = solved(st), y0 = 108, yb = 214, PER = 50;   // 50 drawing units to every 10⁸ m/s
    add(K.svg('rect', { class: 'mat glass', x: 0, y: y0, width: 340, height: yb - y0 }));
    line('surf', P2(0, y0), P2(340, y0));
    line('edge', P2(0, yb), P2(340, yb));
    lab(P2(332, 24), 'empty space', 'reg', 1, 'end');
    lab(P2(332, yb - 10), 'glass', 'reg', 1, 'end');
    [[C0, 66], [CG, 166]].forEach(([v, y]) => {
      const a = P2(28, y), b = P2(28 + v / 1e8 * PER, y);
      line('spd', a, minus(b, P2(6, 0)));
      head('spdh', b, P2(1, 0), 11);
      lab(P2((a.x + b.x) / 2, y - 14), sci(v), 'lab', 1);
    });
    REC.idx = C0 / CG;
    if (sv) lab(P2(330, 190), 'index = ' + f2(C0 / 1e8) + ' ÷ ' + f2(CG / 1e8) + ' = ' + f2(C0 / CG), 'ang', A(0.2), 'end');
    else lab(P2(300, 190), 'index = ?', 'q', 1, 'end');
    keyRow(d.H - 10, [['spd', "arrow length: light's speed"]]);
    REC.say.push('Light travels at ' + sci(C0) + ' in empty space and ' + sci(CG) + ' in a glass block.' + (sv ? ' The glass\'s index is ' + f2(C0 / CG) + '.' : ''));
  }

  // ---------- the coin in the tank (steps 1, 8 and 9) ----------
  function sceneTank(d, st) {
    const sv = solved(st), on = d.show || sv, tl = d.tl;
    const C = P2(CX, TS + d.depth * SC), floor = C.y + 4;
    add(K.svg('rect', { class: 'mat water', x: TLW, y: TS, width: TRW - TLW, height: floor - TS }));
    line('surf', P2(TLW, TS), P2(TRW, TS));
    shape('wall', 'M' + TLW + ' ' + (TS - 24) + 'L' + TLW + ' ' + floor + 'L' + TRW + ' ' + floor + 'L' + TRW + ' ' + (TS - 24));
    lab(P2(TRW - 8, floor - 10), d.nlab ? 'water, n = 1.333' : 'water', 'reg', 1, 'end');
    const eye = st.eye || (d.eye2 ? lerpP(d.eye, d.eye2, G(tl.glide[0], tl.glide[1])) : d.eye);
    const v = view(C, eye), looks = (v.I.y - TS) / SC;
    REC.handles = { eye };
    Object.assign(REC, { view: v, looks, C, eye });
    // The rod, held beside the eye and pushed along its line of sight at where the coin looks.
    if (d.rod) {
      const u0 = unit(minus(v.I, eye)), R0 = plus(plus(eye, times(P2(u0.y, -u0.x), 22)), times(u0, 4)), u = unit(minus(v.I, R0));
      let t = (floor - 3 - R0.y) / u.y;
      if (R0.x + u.x * t > TRW - 4) t = (TRW - 4 - R0.x) / u.x;
      line('rod', R0, plus(R0, times(u, t)));
      lab(plus(R0, P2(8, 2)), 'rod', 'tag', 1, 'start');
      REC.rod = { overY: R0.y + u.y * (CX - R0.x) / u.x };
    }
    if (d.dims) {
      const a = d.show ? A(tl.dims) : 1;
      part(a, () => dim(44, TS + 2, C.y));
      lab(P2(52, (TS + C.y) / 2 + 5), d.depthTxt, 'lab', a, 'start');
    }
    if (on) {
      // Light from the coin to both sides of the eye, bent at the surface; the eye's lines back meet above the coin.
      const g1 = G(tl.ray[0], tl.ray[1]), g2 = G(tl.ray[1], tl.ray[2]);
      [[v.X1, v.E1], [v.X2, v.E2]].forEach(([X, E]) => { ray(C, X, g1, true); ray(X, E, g2); });
      const ab = A(tl.back), ag = A(tl.img);
      part(ab, () => { line('back', v.X1, v.I); line('back', v.X2, v.I); });
      part(ag, () => add(K.svg('ellipse', { class: 'img', cx: r3(v.I.x), cy: r3(v.I.y), rx: 11, ry: 3.5 })));
      if (d.dims) {
        const ad = A(tl.dims);
        part(ad, () => dim(v.I.x - 26, TS + 2, v.I.y));
        lab(plus(v.I, P2(16, 5)), 'looks ' + f2(looks) + ' m down', 'lab', ad, 'start');
      } else lab(plus(v.I, P2(16, 5)), 'seems to be here', 'lab', ag, 'start');
      keyRow(d.H - 10, [['ray', 'light'], ['back', 'traced back, no light']]);
    } else if (d.dims) lab(P2(CX + 16, TS + 30), 'looks ? m down', 'q', 1, 'start');
    add(K.svg('ellipse', { class: 'coin', cx: r3(C.x), cy: r3(C.y), rx: 11, ry: 3.5 }));
    lab(plus(C, P2(16, 5)), 'coin', 'tag', 1, 'start');
    eyeAt(eye, v.look);
    lab(plus(eye, P2(0, -16)), 'eye', 'tag', 1);
    REC.say.push('A coin lies on the floor of a tank of water' + (d.depthTxt ? ', ' + d.depthTxt + ' down' : '') + ', with an eye above it' + (Math.abs(eye.x - CX) < 1 ? '.' : ', off to one side.'));
    if (d.rod) REC.say.push('A rod held beside the eye and pushed along its line of sight at where the coin looks passes over it.');
    if (on) REC.say.push('Light from the coin bends at the surface on its way to the eye. Traced straight back, it seems to come from a point above the coin' + (d.dims ? ', ' + f2(looks) + ' m down.' : '.'));
  }

  // ---------- a prism (step 12) ----------
  function scenePrism(d, st) {
    const m = prismModel(), tl = d.tl, pts = [PA, PB, PC].map(pt).join(' ');
    add(K.svg('polygon', { class: 'mat glass', points: pts }));
    add(K.svg('polygon', { class: 'prz', points: pts }));
    lab(P2(170, PB.y - 12), 'glass', 'reg', 1);
    ray(m.W0, m.F1, G(tl.in[0], tl.in[1]));
    lab(plus(m.W0, P2(-22, -30)), 'white light', 'tag', A(tl.in[0]), 'start');
    const gm = G(tl.mid[0], tl.mid[1]), go = G(tl.out[0], tl.out[1]), al = A(tl.lab);
    m.paths.forEach((p, k) => {
      cray('sp sp' + k, m.F1, p.F2, gm);
      const end = plus(p.F2, times(p.dout, 92));
      cray('sp sp' + k, p.F2, end, go);
      if (p.name) lab(plus(end, P2(0, k ? 18 : -9)), p.name, 'tag', al, 'end');
    });
    REC.prism = m;
    text(12, d.H - 10, 'The fan is drawn wider than real.', 'key');
    REC.say.push('White light enters a glass prism and leaves as a fan of colours, red turned least and violet most.');
  }

  // ---------- a glass prism and a water prism, each with a 45° corner (step 13) ----------
  function sceneWPrism(d, st) {
    const sv = solved(st);
    REC.wp = {};
    [['glass', 24], ['water', 194]].forEach(([m, x0]) => {
      const pa = P2(x0, 44), pb = P2(x0, 154), pc = P2(x0 + 110, 154), H = P2(x0 + 55, 99), d0 = P2(1, 0), nf = unit(P2(-1, 1));
      const pts = [pa, pb, pc].map(pt).join(' ');
      add(K.svg('polygon', { class: 'mat ' + m, points: pts }));
      add(K.svg('polygon', { class: 'prz' + (m === 'water' ? ' thin' : ''), points: pts }));
      lab(P2(x0 + 8, 146), m, 'reg', 1, 'start');
      ray(P2(x0 - 20, 99), H, 1);
      line('nrm', minus(H, times(nf, 22)), plus(H, times(nf, 22)));
      arc(H, P2(-1, 0), nf, 18);
      const inc = angDeg(P2(-1, 0), nf);
      lab(bisect(H, P2(-1, 0), nf, 34), fm(inc) + '°', 'ang', 1);
      const out = refractV(d0, nf, N[m], 1), refl = reflectV(d0, nf);
      REC.wp[m] = { out, refl, inc };
      if (!out) {
        ray(H, P2(H.x, 198), 1);
        lab(P2(H.x + 12, 192), 'all of it reflects', 'lab', 1, 'start');
      } else if (sv) {
        const end = plus(H, times(out, 56)), ar = A(0.6), al = A(1.1);
        ray(H, end, G(0.2, 1.0));
        part(ar, () => { line('refl', H, P2(H.x, 198)); head('reflh', P2(H.x, 186), P2(0, 1), 9); });
        lab(plus(end, P2(-2, -14)), 'leaks out', 'lab', al, 'end');
      } else lab(plus(H, P2(30, -20)), '?', 'q', 1);
    });
    keyRow(d.H - 10, sv ? [['nrm', 'normal'], ['refl', 'some light reflects']] : [['nrm', 'normal']]);
    REC.say.push('Light enters a glass prism and a thin-walled water prism square on, and meets each long face at 45°. In glass all of it reflects, turning through 90°.' +
      (sv ? ' In water much of it leaks out through the long face.' : ''));
  }

  // ---------- the scene for a step: draw, then place every label clear of the rest ----------
  function scene(i, st) {
    const d = STEPS[i];
    REC = { texts: [], rays: [], say: [], handles: {} };
    LAB = [];
    art.textContent = '';
    into = null;
    svg.setAttribute('viewBox', '0 0 340 ' + d.H);
    if (d.pic === 'bound') sceneBound(d, st);
    else if (d.pic === 'speeds') sceneSpeeds(d, st);
    else if (d.pic === 'tank') sceneTank(d, st);
    else if (d.pic === 'prism') scenePrism(d, st);
    else sceneWPrism(d, st);
    const g = art.appendChild(K.svg('g', { class: 'labs' }));
    const skip = ['mat', 'trail', 'rowl', 'mch'];
    const avoid = Array.from(art.querySelectorAll('line, path, circle, ellipse, rect, polygon, polyline')).filter((n) => !skip.some((c) => n.classList.contains(c)) && !g.contains(n));
    const ts = K.labels(g, LAB.map((l) => ({ x: r3(l.x), y: r3(l.y), text: l.text, anchor: l.anchor, class: l.cls })), { avoid });
    ts.forEach((t, k) => K.fade(t, LAB[k].a, 0));
    LAB.forEach((l) => { if (l.a >= 0.5) REC.texts.push(l.text); });
    svg.setAttribute('aria-label', REC.say.join(' '));
  }

  // ---------- controls ----------
  const stepper = K.stepper({ id: 'step', label: 'Step', steps: STEPS.map((d) => d.name), value: 0, compact: true, into: '#prog' });
  const cur = () => Math.round(stepper.get());
  const hintFor = (d, st) => (d.hints && d.hints[st.pick]) || d.hint;
  const anim = K.anim({ button: false, label: 'Moving', step: (dt) => {
    if (finished) return false;
    T += dt;
    paint();
    return T < motionEnd;
  } });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !anim.playing() && T !== Infinity) { T = Infinity; paint(); } });
  function play(dur) {
    if (quiet()) { anim.pause(); T = Infinity; paint(); return; }
    motionEnd = dur; T = 0; anim.play();
  }
  function finishNow() { anim.pause(); T = Infinity; K.refresh(); }
  function enter(id) {
    if (REDUCE) return;
    const box = el(id);
    box.classList.remove('enter'); void box.offsetWidth; box.classList.add('enter');
  }
  function resetShow(st, d) { Object.assign(st, { th: null, eye: null, march: !!(d && d.marchOn), mat: null, fromMat: null, rev: null, sw: null, dragged: false }); }
  function enterStep(i) {
    lastStep = i; enter('stepbox'); hold = null;
    const d = STEPS[i], st = ST[i];
    if (d.show) { resetShow(st, d); play(d.dur); } else { anim.pause(); T = Infinity; }
  }
  function startRun(i) { play(STEPS[i].run); }

  // The readouts under the boundary: the two angles and sin i ÷ sin r.
  const TILE = {};
  [['i', 'Angle of incidence, i'], ['r', 'Angle of refraction, r'], ['q', 'sin i ÷ sin r']].forEach(([k, name]) => {
    const v = K.el('span', { class: 'tv' });
    const t = el('tiles').appendChild(K.el('div', { class: 'tile' }, K.el('span', { class: 'tk' }, name), v));
    TILE[k] = { t, v };
  });

  // ---------- Dan's hands on the picture: drag the ray round, or the eye ----------
  function paint(i) {
    if (i == null) i = cur();
    scene(i, ST[i]);
    placeHits(i);
    const ks = STEPS[i].tiles || [];
    el('tiles').hidden = finished || !ks.length;
    Object.keys(TILE).forEach((k) => { TILE[k].t.hidden = ks.indexOf(k) < 0; TILE[k].v.textContent = (REC.tiles && REC.tiles[k]) || ''; });
  }
  const HITS = [0, 1].map(() => {
    const c = ui.appendChild(K.svg('circle', { class: 'hit', r: 24, cx: -100, cy: -100, tabindex: -1, role: 'button' }));
    c.style.display = 'none';
    return c;
  });
  const NAMES = { ray: 'The ray: drag it round, or use the arrow keys', eye: 'The eye: drag it, or use the arrow keys' };
  function placeHits(i) {
    const kinds = finished || !STEPS[i].drag ? [] : STEPS[i].drag;
    HITS.forEach((c, k) => {
      const kind = kinds[k], p = kind && REC.handles[kind];
      c.style.display = p ? '' : 'none';
      c.setAttribute('tabindex', p ? '0' : '-1');
      if (!p) return;
      c.dataset.kind = kind;
      c.setAttribute('cx', r3(p.x)); c.setAttribute('cy', r3(p.y));
      c.setAttribute('aria-label', NAMES[kind]);
    });
  }
  function svgPt(e) {
    const m = svg.getScreenCTM();
    if (!m) return null;
    const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(m.inverse());
    return P2(p.x, p.y);
  }
  function moveTo(kind, q) {
    const i = cur(), d = STEPS[i], st = ST[i];
    if (finished || !d.drag || d.drag.indexOf(kind) < 0) return;
    if (kind === 'ray') {
      const up = st.rev != null ? st.rev : !!d.up, v = minus(q, BP);
      let th = Math.round(K.clamp(deg(Math.atan2(-v.x, up ? v.y : -v.y)), 3, 80));
      // Near the critical angle, the ray settles onto it.
      if (d.crit && up) { const c = critical(N[st.mat || d.bot], 1); if (Math.abs(th - c) <= 1.2) th = c; }
      st.th = th;
    } else if (kind === 'eye') {
      let x = K.clamp(q.x, 40, 300);
      if (Math.abs(x - CX) < 8) x = CX;
      st.eye = P2(Math.round(x), Math.round(K.clamp(q.y, 24, TS - 30)));
    }
    st.dragged = true;
    if (anim.playing()) anim.pause();
    T = Infinity;
    K.reveal(); K.refresh();
  }
  HITS.forEach((c) => {
    c.addEventListener('pointerdown', (e) => {
      const kind = c.dataset.kind;
      if (!kind) return;
      hold = { id: e.pointerId, kind };
      try { c.setPointerCapture(e.pointerId); } catch (err) { /* the drag still follows the pointer while it stays on the target */ }
      e.preventDefault();
      const q = svgPt(e);
      if (q) moveTo(kind, q);
    });
    c.addEventListener('pointermove', (e) => { if (!hold || hold.id !== e.pointerId) return; const q = svgPt(e); if (q) moveTo(hold.kind, q); });
    const letGo = (e) => { if (hold && hold.id === e.pointerId) hold = null; };
    c.addEventListener('pointerup', letGo);
    c.addEventListener('pointercancel', letGo);
    c.addEventListener('lostpointercapture', () => { hold = null; });
    c.addEventListener('keydown', (e) => {
      const kind = c.dataset.kind, by = { ArrowUp: P2(0, -8), ArrowDown: P2(0, 8), ArrowLeft: P2(-8, 0), ArrowRight: P2(8, 0) }[e.key];
      if (!kind || !by || !REC.handles[kind]) return;
      e.preventDefault();
      moveTo(kind, plus(REC.handles[kind], by));
    });
  });

  // ---------- answers: up to four choices, or a typed field for each figure ----------
  const pickBtns = [0, 1, 2, 3].map((k) => K.button({ label: 'Answer ' + (k + 1), secondary: true, into: '#picks', press: () => {
    const i = cur(), d = STEPS[i], st = ST[i];
    if (finished || d.kind !== 'pick' || k >= d.opts.length || solved(st)) return;
    st.pick = d.opts[k]; st.res = null;
  } }));
  const FIELDS = {};
  STEPS.forEach((d, i) => {
    if (d.kind !== 'typed') return;
    el('answers').appendChild(K.el('div', { id: 'ans-' + d.ans }));
    const a = K.answer({ id: 'a-' + d.ans, unit: d.unit, answer: d.answer, decimals: d.decimals, slips: d.slips, into: '#ans-' + d.ans,
      onCheck: (r) => {
        const st = ST[i];
        if (solved(st)) return;
        if (r.state === 'right') { st.res = 'right'; startRun(i); }
        else if (r.state === 'wrong') {
          st.tries += 1; st.hint = r.hint || d.hint;
          if (st.tries >= 2) { st.res = 'shown'; st.why = true; a.reveal(); startRun(i); } else st.res = 'wrong';
        } else { st.res = null; st.hint = ''; }
        K.refresh();
      } });
    FIELDS[d.ans] = a;
  });
  const checkBtn = K.button({ label: 'Check', into: '#acts', press: () => {
    const i = cur(), d = STEPS[i], st = ST[i];
    if (finished || d.show || solved(st)) return;
    if (d.kind === 'typed') { FIELDS[d.ans].check(); return; }
    if (st.pick == null) { st.res = 'empty'; return; }
    if (st.pick === d.want) { st.res = 'right'; startRun(i); } else { st.res = 'wrong'; st.tries += 1; }
  } });
  const whyBtn = K.button({ label: 'Why?', secondary: true, into: '#acts', press: () => {
    const d = STEPS[cur()], st = ST[cur()];
    if (d.show || finished || (!solved(st) && st.tries === 0)) return;
    st.why = !st.why;
  } });
  // The switches: the marchers, the material, and which way the ray goes.
  const swOK = (k) => { const d = STEPS[cur()]; return !finished && !!d.sw && d.sw.indexOf(k) >= 0; };
  const SW = {
    march: K.button({ label: 'Switch on the marchers', into: '#swrow', press: () => {
      if (!swOK('march')) return;
      const st = ST[cur()];
      st.march = !st.march; st.sw = 'march';
      if (st.march) play(STEPS[cur()].swRun); else { anim.pause(); T = Infinity; }
    } }),
    mat: K.button({ label: 'Swap to glass', into: '#swrow', press: () => {
      if (!swOK('mat')) return;
      const d = STEPS[cur()], st = ST[cur()], now = st.mat || d.bot;
      st.fromMat = now; st.mat = now === 'water' ? 'glass' : 'water'; st.sw = 'mat';
      play(d.swRun);
    } }),
    rev: K.button({ label: 'Send the ray in from the air', into: '#swrow', press: () => {
      if (!swOK('rev')) return;
      const d = STEPS[cur()], st = ST[cur()], up = st.rev != null ? st.rev : !!d.up;
      st.rev = !up; st.sw = 'rev';
      play(d.swRun);
    } }),
  };
  const replayBtn = K.button({ label: 'Play again', secondary: true, into: '#replay', press: () => {
    const i = cur(), d = STEPS[i];
    if (!d.show || finished) return;
    resetShow(ST[i], d);
    play(d.dur);
  } });
  const backBtn = K.button({ label: 'Back', secondary: true, into: '#nav', press: () => {
    if (finished) { finished = false; return; }
    stepper.set(Math.max(0, cur() - 1), true);
  } });
  const nextBtn = K.button({ label: 'Continue', into: '#nav', press: () => {
    const i = cur();
    if (finished || (!STEPS[i].show && !solved(ST[i]))) return;
    if (i < STEPS.length - 1) { stepper.set(i + 1, true); return; }
    finished = true; anim.pause(); T = Infinity;
    if (typeof K.complete === 'function') K.complete();
  } });
  K.button({ label: 'Start again', secondary: true, into: '#again', press: () => {
    ST = STEPS.map(fresh); finished = false; lastStep = -1; hold = null;
    Object.keys(FIELDS).forEach((k) => FIELDS[k].reset());
    stepper.set(0, true);
  } });

  // ---------- words (built with K.el, never innerHTML): *a key term* ----------
  function write(node, s) {
    node.textContent = '';
    const part0 = String(s || ''), re = /\*([^*]+)\*/g;
    let from = 0, m;
    while ((m = re.exec(part0))) {
      if (m.index > from) node.appendChild(document.createTextNode(part0.slice(from, m.index)));
      node.appendChild(K.el('span', { class: 'term' }, m[1]));
      from = m.index + m[0].length;
    }
    if (from < part0.length) node.appendChild(document.createTextNode(part0.slice(from)));
    return node;
  }
  write(el('finish'), FINISH);

  K.update((p) => {
    const i = Math.round(p.step), d = STEPS[i], st = ST[i];
    if (!anim.playing()) T = Infinity;
    if (i !== lastStep) enterStep(i);
    if (finished !== lastDone) { lastDone = finished; enter(finished ? 'done' : 'stepbox'); }
    const sv = solved(st);
    el('stepbox').hidden = finished;
    el('done').hidden = !finished;
    el('count').textContent = 'Step ' + (i + 1) + ' of ' + STEPS.length;
    const task = el('task');
    task.className = 'task' + (d.show ? ' show' : '');
    write(task, d.show ? d.text : d.task);
    el('act').hidden = !d.act;
    write(el('act'), d.act || '');
    paint(i);
    const up = st.rev != null ? st.rev : !!d.up, mat = st.mat || d.bot;
    el('swrow').hidden = !d.sw;
    Object.keys(SW).forEach((k) => { SW[k].el.hidden = !d.sw || d.sw.indexOf(k) < 0; });
    SW.march.setLabel(st.march ? 'Switch off the marchers' : 'Switch on the marchers');
    SW.march.el.setAttribute('aria-pressed', st.march ? 'true' : 'false');
    SW.mat.setLabel(mat === 'glass' ? 'Swap to water' : 'Swap to glass');
    SW.rev.setLabel(up ? 'Send the ray in from the air' : 'Send the ray out from the water');
    SW.rev.el.setAttribute('aria-pressed', up ? 'true' : 'false');
    replayBtn.el.hidden = !d.show || REDUCE;
    el('replay').hidden = replayBtn.el.hidden;
    const opts = d.kind === 'pick' ? d.opts : [];
    const picks = el('picks');
    picks.hidden = !opts.length;
    picks.classList.toggle('col', !!d.col);
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      b.setLabel(opts[k]);
      b.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });
    STEPS.forEach((x, k) => { if (x.kind === 'typed') el('ans-' + x.ans).hidden = finished || k !== i; });
    el('answers').hidden = d.kind !== 'typed';
    el('acts').hidden = !!d.show;
    checkBtn.el.hidden = sv;
    const fb = el('fb');
    fb.hidden = !!d.show;
    fb.className = 'fb' + (st.res === 'right' ? ' right' : '');
    write(fb, d.show ? '' : st.res === 'right' ? "That's it." : st.res === 'shown' ? 'Here is the working.' :
      st.res === 'wrong' ? (d.kind === 'typed' ? st.hint : hintFor(d, st)) : st.res === 'empty' ? 'Tap one of the answers.' : '');
    const why = el('why');
    why.hidden = !!d.show || !st.why;
    write(why, d.show ? '' : d.why);
    whyBtn.setLabel(st.why ? 'Hide why' : 'Why?');
    whyBtn.el.hidden = !sv && st.tries === 0;
    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !sv);
    nextBtn.setLabel(i === STEPS.length - 1 ? 'Finish' : 'Continue');
    el('nav').hidden = backBtn.el.hidden && nextBtn.el.hidden;
  });

  // ---------- known answers, worked out by hand ----------
  const IX = (name) => STEPS.findIndex((d) => d.name === name);
  const doneSt = (i) => Object.assign(fresh(), { res: 'right', pick: STEPS[i].want });
  // The state a switch leaves a demonstration in.
  function swState(d) {
    const s = fresh();
    s.sw = d.sw[0];
    if (s.sw === 'march') s.march = true;
    if (s.sw === 'mat') { s.fromMat = d.bot; s.mat = d.bot === 'water' ? 'glass' : 'water'; }
    if (s.sw === 'rev') s.rev = !d.up;
    return s;
  }
  // A step drawn in the state given (finished unless t is given): what it draws, then the current step again.
  function drawn(i, st, t) {
    const keepS = ST[i], keepT = T;
    ST[i] = st; T = t == null ? Infinity : t; latest = 0; earliest = Infinity; probing = true;
    try { scene(i, st); return Object.assign({}, REC, { latest, earliest }); }
    finally { probing = false; ST[i] = keepS; T = keepT; paint(); }
  }

  K.check('Medium 2 has a greater index of refraction than medium 1. This means that the speed of light is less in medium 2 than in medium 1: each marcher walks 1.333 times slower once in the water, and the row, square to the ray before, stands square to the bent ray after, turned towards the normal, for angles from 5° to 75°; square on it does not turn', () => {
    let ok = true;
    for (let th = 0; th <= 75; th += 5) {
      const m = marchModel(th, 1, N.water, 1), row = m.row(m.tB), row0 = m.row(m.tA);
      for (let k = 1; k < row.length; k++) ok = ok && near(dot(unit(minus(row[k], row[0])), m.d2), 0, 1e-9) && near(dot(unit(minus(row0[k], row0[0])), m.d1), 0, 1e-9);
      ok = ok && near(dist(m.pos(0, m.tB - 10), m.pos(0, m.tB)), 10 / N.water, 1e-9);
      ok = ok && (th === 0 ? near(snell(th, 1, N.water), 0, 1e-12) : snell(th, 1, N.water) < th);
    }
    const s2 = drawn(IX('Slower means a bend'), Object.assign(fresh(), { march: true, sw: 'march' }));
    return ok && !!s2.march && s2.tiles.i === '40°' && s2.tiles.r === '28.8°';
  }, { source: OPENSTAX });

  K.check('The refractive index is the ratio of the sine of the angle of incidence to the sine of the angle of refraction: for every angle from 3° to 80°, sin i ÷ sin r is 1.333 into water and 1.50 into glass, and Snell\'s law screen ends on 40°, 28.8° and 1.333 (sin 40° = 0.643, sin r = 0.482)', () => {
    let ok = true;
    for (let th = 3; th <= 80; th++) {
      ok = ok && near(Math.sin(rad(th)) / Math.sin(rad(snell(th, 1, N.water))), 1.333, 1e-9) && near(Math.sin(rad(th)) / Math.sin(rad(snell(th, 1, N.glass))), 1.5, 1e-9);
    }
    const t = drawn(IX("Snell's law"), fresh()).tiles;
    return ok && t.i === '40°' && t.r === '28.8°' && t.q === '1.333' && near(r3(Math.sin(rad(40))), 0.643, 1e-9) && near(r3(0.643 / N.water), 0.482, 1e-9);
  }, { source: BRITANNICA });

  K.check('Refractive index is the velocity of light in empty space divided by its velocity in a substance: 3.00 × 10⁸ ÷ 1.333 = 2.25 × 10⁸ m/s in water, and the glass block\'s 3.00 × 10⁸ ÷ 2.00 × 10⁸ = 1.50', () =>
    near(r2(C0 / N.water / 1e8), 2.25, 1e-9) && near(C0 / CG, 1.5, 1e-12) && drawn(IX('Find the index'), doneSt(IX('Find the index'))).texts.includes('index = 3.00 ÷ 2.00 = 1.50'),
  { source: BRITANNICA });

  K.check('The critical angle is reached when the angle of refraction reaches 90 degrees: from water into air that is 48.6° (sin c = 1 ÷ 1.333 = 0.750), where the bent ray lies along the surface; past it no ray leaves and all of it reflects; from glass it is 41.8°', () => {
    const c = critical(N.water, 1), i = IX('The way out');
    const end = drawn(i, fresh()), atC = drawn(i, Object.assign(fresh(), { th: c })), before = drawn(i, Object.assign(fresh(), { th: 40 }));
    return near(snell(c, N.water, 1), 90, 1e-6) && snell(c + 0.2, N.water, 1) === null && fm(c) === '48.6' && near(r3(1 / N.water), 0.75, 1e-9) &&
      end.tir && near(end.th, 50, 1e-9) && end.texts.includes('all of it reflects') && end.tiles.r === 'none' &&
      !atC.tir && atC.tiles.r === '90°' && atC.texts.includes('along the surface') && !before.tir && before.tiles.q === '0.750' &&
      fm(critical(N.glass, 1)) === '41.8' && snell(critical(N.glass, 1), N.glass, 1) !== null;
  }, { source: NCBI });

  K.check('Traced straight back, the eye\'s rays from a coin 1.2 m down meet 0.90 m down when the eye is straight above (1.2 ÷ 1.333), and 0.45 m down for a coin 0.60 m down; every ray obeys the law at the surface, from every eye position the lines back meet above the coin, and the rod aimed there passes over it', () => {
    const a = drawn(IX('Why the coin looks higher'), fresh()), b = drawn(IX('How deep?'), doneSt(IX('How deep?'))), c = drawn(IX('The coin in the tank'), fresh());
    let ok = a.texts.includes('looks 0.90 m down') && b.texts.includes('looks 0.45 m down') && near(r2(1.2 / N.water), 0.9, 1e-9) && near(r2(0.6 / N.water), 0.45, 1e-9);
    const C = P2(CX, TS + 1.2 * SC);
    for (let x = 40; x <= 300; x += 20) for (let y = 24; y <= TS - 30; y += 15) {
      const v = view(C, P2(x, y));
      [[v.X1, v.E1], [v.X2, v.E2]].forEach(([X, E]) => {
        const si = Math.abs(E.x - X.x) / dist(E, X), sr = Math.abs(X.x - C.x) / dist(X, C);
        ok = ok && near(N.water * sr, si, 1e-6);
      });
      ok = ok && v.I.y > TS && v.I.y < C.y - 20;
    }
    return ok && c.rod.overY < c.C.y - 20;
  });

  K.check('A higher index turns light further: through the prism violet is turned most and red least; inside a 45° prism the light meets the long face at 45°, past glass\'s 41.8° critical angle, so all of it reflects through 90°, but short of water\'s 48.6°, so in water it gets out', () => {
    const t = prismModel().paths.map((p) => p.turn);
    const w = drawn(IX('A water prism'), doneSt(IX('A water prism'))).wp;
    return t.every((v, k) => k === 0 || v > t[k - 1]) && w.glass.out === null && near(angDeg(P2(1, 0), w.glass.refl), 90, 1e-9) &&
      !!w.water.out && near(w.water.inc, 45, 1e-9) && critical(N.glass, 1) < 45 && critical(N.water, 1) > 45;
  });

  K.check('Each typed answer and slip is worked from the lesson\'s figures: 3.00 ÷ 2.00 = 1.50 (0.67, 1.33); sin r = 0.766 ÷ 1.50 gives 30.7° (33.3, 59.3, 50); 0.60 ÷ 1.333 = 0.45 m (0.80, 0.60); sin c = 1 ÷ 1.50 gives 41.8° (48.6, 48.2); 1.333 × 0.5 ÷ 1.50 = 0.444 gives 26.4° (19.5, 34.2); each answer as printed is graded right and each slip wrong, and each solved picture prints its answer', () => {
    const want = { idx: [1.5, '1.50', [0.67, 1.33]], glass: [30.7, '30.7°', [33.3, 59.3, 50]], deep: [0.45, '0.45 m', [0.8, 0.6]], crit: [41.8, '41.8°', [48.6, 48.2]], wg: [26.4, '26.4°', [19.5, 34.2]] };
    return Object.keys(want).every((k) => {
      const i = STEPS.findIndex((x) => x.ans === k), d = STEPS[i], [ans, w, sl] = want[k], sp = { answer: d.answer, decimals: d.decimals, unit: d.unit, slips: d.slips };
      return near(d.answer, ans, 1e-9) && d.want === w && d.slips.length === sl.length && d.slips.every((x, n) => near(x.value, sl[n], 1e-9)) &&
        K.answer.grade(w, sp).state === 'right' && K.answer.grade(String(ans), sp).state === 'right' && sl.every((v) => K.answer.grade(String(v), sp).state === 'wrong') &&
        drawn(i, doneSt(i)).texts.some((s) => s.indexOf(w) >= 0);
    });
  });

  K.check('Before Check nothing gives the answer away: no typed answer is drawn, no ray or seeming coin is drawn in the tank, the square-on ray stops at the surface, and nothing leaves the water prism', () => {
    const typedOk = STEPS.every((d, i) => d.kind !== 'typed' || drawn(i, fresh()).texts.every((s) => s.indexOf(d.want) < 0));
    const c = drawn(IX('The coin in the tank'), fresh()), q = drawn(IX('Square on'), fresh()), w = drawn(IX('A water prism'), fresh());
    return typedOk && c.rays.length === 0 && !c.texts.includes('seems to be here') && q.rays.length === 1 && !q.march && w.rays.length === 3 && !w.texts.includes('leaks out');
  });

  K.check('Every demonstration settles within 5 s of its screen opening, none starting before the 0.35 s screen fade ends; each switch\'s motion and every answer\'s motion settle within 3 s', () =>
    STEPS.every((d, i) => {
      if (d.show) {
        const r = drawn(i, fresh());
        let ok = r.latest <= d.dur + 1e-9 && d.dur <= 5 && r.earliest >= 0.35;
        if (d.sw) { const s = drawn(i, swState(d)); ok = ok && s.latest <= d.swRun + 1e-9 && d.swRun <= 3; }
        return ok;
      }
      const r = drawn(i, doneSt(i));
      return r.latest <= d.run + 1e-9 && d.run <= 3;
    }));

  K.ready();
</script>
