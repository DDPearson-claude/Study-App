<p class="caption">Each bar fixes the distance between its two pins. At every joint, the forces balance.</p>

<script>
  // ---------- helpers ----------
  const IITB = 'https://www.civil.iitb.ac.in/~minamdar/ce102/Files/Trusses.pdf';
  const CSUS = 'https://athena.ecs.csus.edu/~grandajj/e70/CHAP06.PDF';
  const BOX = 'https://boxsand.physics.oregonstate.edu/PH201/Mechanics/Mechanical-Advantage/Content/Mechanical-Advantage-of-Simple-Machines';
  const el = (id) => document.getElementById(id);
  const rad = (dg) => dg * Math.PI / 180;
  const r1 = (v) => Math.round(v * 10) / 10;
  const r2 = (v) => Math.round(v * 100) / 100;
  const r3 = (v) => Math.round(v * 1000) / 1000;
  const near = (a, b, tol) => Math.abs(a - b) <= (tol != null ? tol : 1e-9 * Math.max(1, Math.abs(a), Math.abs(b)));
  const dist = (p, q) => Math.hypot(p[0] - q[0], p[1] - q[1]);
  const KN = 4.4;   // drawing units for each kN of a load or a support's push
  // A force as the lesson writes it: whole numbers plain, others to two places.
  const kn = (v, dp) => { const a = Math.abs(v), d = dp != null ? dp : Math.abs(a - Math.round(a)) < 1e-6 ? 0 : 2; return a.toFixed(d) + ' kN'; };
  const pp = (t) => (t > 0 ? 'pull' : 'push');

  // ---------- the rule: bars fix lengths, joints balance ----------
  // A frame: joints [x, y] (y up, in frame units), bars [a, b], the pin's joint and the roller's.
  // A frame with a `mode` has one way left to move; pose(F, q) is where its joints are at q.
  function pose(F, q) {
    if (!F.mode || !q) return F.J;
    const s = Math.sin(q), c = Math.cos(q);
    if (F.mode === 'lean') return [[0, 0], [1, 0], [1 + s, c], [s, c]].concat(F.J.length > 4 ? [[0.5 + s, c + 0.5]] : []);
    // 'kink': the braced left bay turns q about the pin, the roller rolls, the right bay follows.
    const rot = (p) => [p[0] * c - p[1] * s, p[0] * s + p[1] * c], j1 = rot([1, 0]), j3 = rot([0, 1]), j4 = rot([1, 1]);
    const j2 = [j1[0] + Math.sqrt(Math.max(0, 1 - j1[1] * j1[1])), 0];
    return [[0, 0], j1, j2, j3, j4, [j2[0] + j4[0] - j1[0], j4[1] - j1[1]]];
  }
  function rank(M) {
    M = M.map((r) => r.slice());
    let rk = 0;
    const cols = M[0].length;
    for (let c = 0; c < cols && rk < M.length; c++) {
      let p = rk;
      for (let i = rk + 1; i < M.length; i++) if (Math.abs(M[i][c]) > Math.abs(M[p][c])) p = i;
      if (Math.abs(M[p][c]) < 1e-9) continue;
      const t = M[rk]; M[rk] = M[p]; M[p] = t;
      for (let i = 0; i < M.length; i++) if (i !== rk) { const f = M[i][c] / M[rk][c]; if (f) for (let k = c; k < cols; k++) M[i][k] -= f * M[rk][k]; }
      rk++;
    }
    return rk;
  }
  // Ways left to move: 2 for each joint, less one for each bar or support that locks a new one.
  function freedoms(F, P) {
    P = P || F.J;
    const n = 2 * P.length, rows = [], e = (k) => { const r = new Array(n).fill(0); r[k] = 1; return r; };
    F.B.forEach(([a, b]) => { const r = new Array(n).fill(0), dx = P[a][0] - P[b][0], dy = P[a][1] - P[b][1]; r[2 * a] = dx; r[2 * a + 1] = dy; r[2 * b] = -dx; r[2 * b + 1] = -dy; rows.push(r); });
    rows.push(e(2 * F.pin), e(2 * F.pin + 1), e(2 * F.roller + 1));
    return n - rank(rows);
  }
  function gauss(A, b) {
    const n = b.length, M = A.map((r, i) => r.concat([b[i]]));
    for (let c = 0; c < n; c++) {
      let p = c;
      for (let r = c + 1; r < n; r++) if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
      if (Math.abs(M[p][c]) < 1e-12) return null;
      const t = M[c]; M[c] = M[p]; M[p] = t;
      for (let r = 0; r < n; r++) if (r !== c) { const f = M[r][c] / M[c][c]; if (f) for (let k = c; k <= n; k++) M[r][k] -= f * M[c][k]; }
    }
    return M.map((r, i) => r[n] / r[i]);
  }
  // Bar forces (pull positive, kN) and the supports' pushes, from balancing every joint at once.
  function solve(F, loads) {
    const P = F.J, m = F.B.length, n = 2 * P.length, A = [], rhs = [];
    for (let r = 0; r < n; r++) { A.push(new Array(m + 3).fill(0)); rhs.push(0); }
    F.B.forEach(([a, b], k) => { const L = dist(P[a], P[b]), ux = (P[b][0] - P[a][0]) / L, uy = (P[b][1] - P[a][1]) / L; A[2 * a][k] += ux; A[2 * a + 1][k] += uy; A[2 * b][k] -= ux; A[2 * b + 1][k] -= uy; });
    A[2 * F.pin][m] = 1; A[2 * F.pin + 1][m + 1] = 1; A[2 * F.roller + 1][m + 2] = 1;
    loads.forEach((l) => { rhs[2 * l.j + 1] += l.w; });
    const x = gauss(A, rhs);
    return x ? { T: x.slice(0, m), px: x[m], py: x[m + 1], ry: x[m + 2] } : null;
  }
  // What is left over at the worst joint once every force on it is added (none, in balance).
  function resid(F, sol, loads) {
    const P = F.J, s = P.map(() => [0, 0]);
    F.B.forEach(([a, b], k) => { const L = dist(P[a], P[b]), ux = (P[b][0] - P[a][0]) / L, uy = (P[b][1] - P[a][1]) / L; s[a][0] += sol.T[k] * ux; s[a][1] += sol.T[k] * uy; s[b][0] -= sol.T[k] * ux; s[b][1] -= sol.T[k] * uy; });
    s[F.pin][0] += sol.px; s[F.pin][1] += sol.py; s[F.roller][1] += sol.ry;
    loads.forEach((l) => { s[l.j][1] -= l.w; });
    return Math.max.apply(null, s.map((v) => Math.max(Math.abs(v[0]), Math.abs(v[1]))));
  }
  // The force bar k puts on joint j: along the bar, away from j when it pulls.
  function onJoint(F, sol, j, k) { const [a, b] = F.B[k], o = a === j ? b : a, L = dist(F.J[j], F.J[o]); return [sol.T[k] * (F.J[o][0] - F.J[j][0]) / L, sol.T[k] * (F.J[o][1] - F.J[j][1]) / L]; }
  const lengthsKept = (F, P) => F.B.every(([a, b]) => near(dist(P[a], P[b]), dist(F.J[a], F.J[b]), 1e-9));
  // The setting q that brings joint j nearest a point (frame units), for a drag.
  function bestQ(F, j, tgt, lo, hi, qNow) {
    if (!F.mode) return qNow;
    const cost = (q) => { const p = pose(F, q)[j]; return Math.hypot(p[0] - tgt[0], p[1] - tgt[1]) + 1e-4 * Math.abs(q - qNow); };
    let best = qNow, bd = Infinity;
    for (let n = 0; n <= 240; n++) { const q = lo + (hi - lo) * n / 240, c = cost(q); if (c < bd - 1e-12) { bd = c; best = q; } }
    let a = Math.max(lo, best - (hi - lo) / 240), b = Math.min(hi, best + (hi - lo) / 240);
    for (let k = 0; k < 30; k++) { const m1 = a + (b - a) / 3, m2 = b - (b - a) / 3; if (cost(m1) < cost(m2)) b = m2; else a = m1; }
    return (a + b) / 2;
  }
  // A frame's count against 2j − 3, and whether it holds.
  function countLines(F) {
    const j = F.J.length, m = F.B.length, need = 2 * j - 3, free = freedoms(F), spare = m - (need - free);
    return [{ s: j + ' joints, ' + m + ' bars', c: 'cnt' }, { s: 'needs 2 × ' + j + ' − 3 = ' + need, c: 'cnt' },
      free ? { s: need > m ? (need - m) + ' short: folds' : spare > 0 ? spare + ' spare: folds' : 'folds', c: 'cnt bad' } : { s: 'holds', c: 'cnt v' }];
  }

  // ---------- the frames ----------
  const R3 = Math.sqrt(3);
  const F_EQ = { J: [[0, 0], [1, 0], [0.5, R3 / 2]], B: [[0, 1], [1, 2], [2, 0]], pin: 0, roller: 1 };
  const tri = (dg) => ({ J: [[0, 0], [1, 0], [0.5, Math.tan(rad(dg)) / 2]], B: [[0, 1], [0, 2], [1, 2]], pin: 0, roller: 1 });
  const F_T30 = tri(30), F_T45 = tri(45);
  const square = (diag) => ({ J: [[0, 0], [1, 0], [1, 1], [0, 1]], B: [[0, 1], [1, 2], [2, 3], [3, 0]].concat(diag ? [[0, 2]] : []), pin: 0, roller: 1, mode: diag ? null : 'lean' });
  const F_SQ = square(false), F_SQD = square(true);
  // A square with a triangle roof: 5 joints, 6 bars; the diagonal across the square is bar 6.
  const house = (diag) => ({ J: [[0, 0], [1, 0], [1, 1], [0, 1], [0.5, 1.5]], B: [[0, 1], [1, 2], [2, 3], [3, 0], [3, 4], [4, 2]].concat(diag ? [[0, 2]] : []), pin: 0, roller: 1, mode: diag ? null : 'lean' });
  const F_HO = house(false), F_HOD = house(true);
  // The screw: one turn of a 20 mm screw is a ramp π × 20 = 62.8 mm long; load ÷ push = that ÷ the pitch.
  const SC_C1 = r1(Math.PI * 20), scGain = (pitch) => r1(SC_C1 / pitch);
  const bays = (diags, mode) => ({ J: [[0, 0], [1, 0], [2, 0], [0, 1], [1, 1], [2, 1]], B: [[0, 1], [1, 2], [3, 4], [4, 5], [0, 3], [1, 4], [2, 5]].concat(diags), pin: 0, roller: 2, mode: mode || null });
  const F_B1 = bays([[0, 4]], 'kink'), F_B2 = bays([[0, 4], [1, 5]]), F_BB = bays([[0, 4], [1, 3]], 'kink');
  const F_W = { J: [[0, 0], [2, 0], [4, 0], [6, 0], [1, R3], [3, R3], [5, R3]], B: [[0, 1], [1, 2], [2, 3], [4, 5], [5, 6], [0, 4], [4, 1], [1, 5], [5, 2], [2, 6], [6, 3]], pin: 0, roller: 3 };
  const S30 = solve(F_T30, [{ j: 2, w: 10 }]), S45 = solve(F_T45, [{ j: 2, w: 12 }]), SW = solve(F_W, [{ j: 1, w: 12 }]);
  const JNAME = ['left foot', 'right foot', 'top joint'];

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  const STEPS = [
    { kind: 'pick', name: 'Which holds?', pic: 'pair', col: true, dragAfter: true, run: 2.8,
      task: 'Push sideways on the top of each frame. Which one keeps its shape?',
      read: 'A square frame and a triangle frame of pinned bars each stand on two supports. Push sideways on the top of each. Which one keeps its shape?',
      opts: ['The square', 'The triangle', 'Both keep their shape', 'Neither keeps its shape'], want: 'The triangle',
      hint: 'Watch the square\'s corners. They turn freely.',
      hints: { 'The square': 'Its four corners are hinges. Nothing stops it leaning over.', 'Both keep their shape': 'Watch the square\'s corners. They turn freely.',
        'Neither keeps its shape': 'Three bars of fixed length fit together only one way.' },
      why: 'Every joint is a pin, free to turn like a hinge. The square\'s four bars can all lean over into a diamond. So the square folds. Three bars of fixed length make one triangle and no other. So the triangle cannot change shape.' },
    { show: true, name: 'Triangles hold', pic: 'pair', drag: true, dur: 3.0,
      text: 'A pin lets bars turn at a joint, like a hinge. So a bar fixes only the distance between its two pins. Three fixed lengths make one triangle and no other. So a triangle of pinned bars is *rigid*. Four fixed lengths can make a square or a thin diamond. So a square folds.',
      act: 'Drag any joint.',
      read: 'When one joint is dragged, the square leans over until it folds flat. The triangle\'s joints will not move.', still: () => finishNow() },
    { show: true, name: 'Counting ways to move', pic: 'pair', count: true, dur: 5.0,
      text: 'On a flat page, each joint can move two ways, across and up. So j joints have 2j ways to move. Three of those ways slide or turn the whole frame without changing its shape. Each bar can stop one of the rest. So a frame of j joints needs at least `2j − 3` bars to hold its shape.',
      act: 'Tap the triangle, then the square.',
      read: 'The triangle has 3 joints and 3 bars. It needs 2 × 3 − 3 = 3, so it holds. The square has 4 joints and 4 bars. It needs 2 × 4 − 3 = 5, so it is one short and folds.', still: () => finishNow() },
    { kind: 'typed', name: 'Lock the frame', pic: 'square', drag: true, run: 2.6, ans: 'lock', unit: 'bars', decimals: 0,
      answer: 2 * F_HO.J.length - 3, want: '7 bars',
      slips: [{ value: F_HO.B.length, hint: 'That is what the frame has now. Its square part still leans over.' },
        { value: 2 * F_HO.J.length, hint: 'That counts all 2 × 5 ways to move. Three of them only slide or turn the whole frame.' },
        { value: F_HO.J.length, hint: 'That is one bar for each joint. Each joint can move two ways.' }],
      task: 'This frame is a square with a roof on top. It has 5 joints. What is the fewest bars it needs to hold its shape?',
      read: 'A square frame with a triangle roof on top has 5 joints and 6 bars. What is the fewest bars it needs to hold its shape?',
      hint: 'Use `2j − 3`, with j the number of joints.',
      why: 'It needs 2 × 5 − 3 = 7 bars. It has only 6. So it has one way left to move, and its square part leans over. A diagonal across the square is the seventh bar. Then the whole frame is triangles.' },
    { kind: 'typed', name: 'Grow the frame', pic: 'bays', drag: true, run: 2.6, ans: 'grow', unit: 'bar', decimals: 0,
      answer: 2 * F_B1.J.length - 3 - F_B1.B.length, want: '1 bar',
      slips: [{ value: 2 * F_B1.J.length - F_B1.B.length, hint: '2 × 6 − 8 leaves out the three ways that only slide or turn the whole frame.' },
        { value: 2 * F_B1.J.length - 3, hint: '9 is the total it needs. It already has 8.' },
        { value: 0, hint: 'The right bay still leans over. Check the count against `2j − 3` again.' }],
      task: 'This frame has 6 joints and 8 bars. How many more bars does it need to hold its shape?',
      read: 'A frame of two square bays has 6 joints and 8 bars. How many more bars does it need to hold its shape?',
      hint: 'Work out `2j − 3`. Then take away the 8 bars it has.',
      why: 'It needs 2 × 6 − 3 = 9 bars. It has 8, so it needs 1 more. That is a diagonal across the right bay. Each new joint brings two ways to move, so it needs two new bars. That is why a frame grown one triangle at a time keeps the count right.' },
    { show: true, name: 'The supports push back', pic: 'reac', dur: 3.2,
      text: 'Hang a load on a joint, and the supports push back. Find those pushes first. Treat the whole frame as one body. Take moments about one support, as for a mobile\'s bar. The pin can push any way. The roller can only push straight up.',
      act: 'Tap a joint to hang the load there.',
      read: 'A 10 kN load hangs from the top joint, midway between the supports. Each support pushes up with 5 kN.', still: () => finishNow() },
    { kind: 'typed', name: 'Off centre', pic: 'warren', run: 1.8, ans: 'off', unit: 'kN', decimals: 0,
      answer: r2(SW.py), want: '8 kN',
      slips: [{ value: r2(SW.ry), hint: 'That is the right support\'s share. The support nearer the load carries more.' },
        { value: 12 / 2, hint: 'Half each is right only for a load in the middle.' }],
      task: 'A frame spans 6 m between its supports. A 12 kN load hangs from a joint 2 m from the left support. How hard does the left support push up?',
      read: 'A frame spans 6 m between its supports. A 12 kN load hangs from a joint 2 m from the left support. How hard does the left support push up?',
      hint: 'Take moments about the right support.',
      why: 'The load is 6 − 2 = 4 m from the right support. Its moment about that support is 12 × 4 = 48 kN m. The left support is 6 m away, and its push must balance that moment. So it pushes 48 ÷ 6 = 8 kN. The right support takes the rest, 12 − 8 = 4 kN.' },
    { show: true, name: 'Pull or push', pic: 'bar', dur: 3.6,
      text: 'Each bar in a loaded frame is pulled or pushed along its length. Look at its arrow at a pin. If it points away from the pin, the bar pulls. It is in *tension*. If it points into the pin, the bar pushes. It is in *compression*.',
      act: 'Drag one pin to stretch or squash the bar.',
      read: 'A stretched bar pulls its pins towards each other. So its arrow at each pin points away from that pin, labelled pull. A squashed bar pushes its pins apart. So each arrow points into its pin, labelled push.', still: () => finishNow() },
    { kind: 'pick', name: 'Which is pulled?', pic: 'tri', col: true, run: 1.6,
      task: 'A triangle frame carries a load at its top joint. Which bar is in tension?',
      read: 'A triangle frame carries a load at its top joint. Which bar is in tension?',

    T = Infinity;
    if (!st.dragged) { st.q = REC.q.slice(); st.dragged = true; }
    st.q[I.k] = K.clamp((st.q[I.k] || 0) + dir * rad(4), rad(I.lo), rad(I.hi));
    K.refresh();
  }
  function tap(h) {
    const i = cur(), d = STEPS[i], st = ST[i];
    if (finished) return;
    K.reveal();
    if (d.pic === 'reac') st.load = h.j;
    play(d.dur);
    K.refresh();
  }
  function tapFrame(part) {
    const i = cur(), d = STEPS[i], st = ST[i];
    if (finished || !d.count) return;
    K.reveal();
    st.focus = part;
    play(3.0);
    K.refresh();
  }
  function hookHit(c, get, onTap) {
    c.addEventListener('pointerdown', (e) => {
      const h = get(), p = svgPt(e);
      if (!h || !p) return;
      e.preventDefault();
      try { c.setPointerCapture(e.pointerId); } catch (err) { /* the drag still follows the pointer while it stays on the target */ }
      hold = { id: e.pointerId, h, x0: p[0], y0: p[1], moved: false };
      K.reveal();
    });
    c.addEventListener('pointermove', (e) => {
      if (!hold || hold.id !== e.pointerId) return;
      const p = svgPt(e);
      if (!p) return;
      if (!hold.moved && Math.hypot(p[0] - hold.x0, p[1] - hold.y0) < 6) return;
      hold.moved = true;
      if (hold.h.kind === 'drag') dragTo(hold.h, p);
    });
    c.addEventListener('pointerup', (e) => {
      if (!hold || hold.id !== e.pointerId) return;
      const was = hold;
      hold = null;
      if (!was.moved && was.h.kind !== 'drag') onTap(was.h);
      endDrag();
    });
    c.addEventListener('pointercancel', (e) => { if (hold && hold.id === e.pointerId) { hold = null; endDrag(); } });
    c.addEventListener('lostpointercapture', () => { if (hold) { hold = null; endDrag(); } });
    c.addEventListener('keydown', (e) => {
      const h = get();
      if (!h) return;
      if ((e.key === 'Enter' || e.key === ' ') && h.kind !== 'drag') { e.preventDefault(); onTap(h); }
      else if (h.kind === 'drag' && /^Arrow/.test(e.key)) { e.preventDefault(); nudge(h, e.key === 'ArrowLeft' || e.key === 'ArrowDown' ? -1 : 1); }
    });
  }
  const HITS = [];
  for (let n = 0; n < 14; n++) {
    const c = ui.appendChild(K.svg('circle', { class: 'hit', r: 22, cx: -60, cy: -60, tabindex: -1, role: 'button', 'aria-label': 'Joint' }));
    c.style.display = 'none';
    HITS.push(c);
    hookHit(c, () => (REC ? REC.jh[n] : null), tap);
  }
  const FHITS = [0, 1].map((n) => {
    const r = ui.appendChild(K.svg('rect', { class: 'hit tap', x: -60, y: -60, width: 1, height: 1, tabindex: -1, role: 'button', 'aria-label': 'Frame' }));
    r.style.display = 'none';
    hookHit(r, () => (REC && REC.fh[n] ? Object.assign({ kind: 'tapf' }, REC.fh[n]) : null), (h) => tapFrame(h.part));
    return r;
  });
  function placeUI() {
    const jh = finished ? [] : REC.jh, fh = finished ? [] : REC.fh;
    HITS.forEach((c, n) => {
      const h = jh[n];
      c.style.display = h ? '' : 'none';
      c.setAttribute('tabindex', h ? '0' : '-1');
      if (!h) return;
      c.setAttribute('cx', r3(h.x)); c.setAttribute('cy', r3(h.y));
      c.setAttribute('aria-label', h.aria);
      c.classList.toggle('tap', h.kind === 'tap');
    });
    FHITS.forEach((r, n) => {
      const h = fh[n];
      r.style.display = h ? '' : 'none';
      r.setAttribute('tabindex', h ? '0' : '-1');
      if (!h) return;
      r.setAttribute('x', h.x); r.setAttribute('y', h.y); r.setAttribute('width', h.w); r.setAttribute('height', h.h);
      r.setAttribute('aria-label', h.aria);
    });
  }

  // ---------- answers: up to four choices, or a typed field for each figure ----------
  const pickBtns = [0, 1, 2, 3].map((k) => K.button({ label: 'Answer ' + (k + 1), secondary: true, into: '#picks', press: () => {
    const i = cur(), d = STEPS[i], st = ST[i];
    if (finished || d.kind !== 'pick' || k >= d.opts.length || solved(st)) return;
    st.pick = d.opts[k]; st.res = null;
  } }));
  const FIELDS = {};
  STEPS.forEach((d, i) => {
    if (d.kind !== 'typed') return;
    el('answers').appendChild(K.el('div', { id: 'ans-' + d.ans }));
    const a = K.answer({ id: 'a-' + d.ans, unit: d.unit, answer: d.answer, decimals: d.decimals, slips: d.slips, into: '#ans-' + d.ans,
      onCheck: (r) => {
        const st = ST[i];
        if (solved(st)) return;
        if (r.state === 'right') { st.res = 'right'; startRun(i); }
        else if (r.state === 'wrong') {
          st.tries += 1; st.hint = r.hint || d.hint;
          if (st.tries >= 2) { st.res = 'shown'; st.why = true; a.reveal(); startRun(i); } else st.res = 'wrong';
        } else { st.res = null; st.hint = ''; }
        K.refresh();
      } });
    FIELDS[d.ans] = a;
  });
  const checkBtn = K.button({ label: 'Check', into: '#acts', press: () => {
    const i = cur(), d = STEPS[i], st = ST[i];
    if (finished || d.show || solved(st)) return;
    if (d.kind === 'typed') { FIELDS[d.ans].check(); return; }
    if (st.pick == null) { st.res = 'empty'; return; }
    if (st.pick === d.want) { st.res = 'right'; startRun(i); } else { st.res = 'wrong'; st.tries += 1; }
  } });
  const whyBtn = K.button({ label: 'Why?', secondary: true, into: '#acts', press: () => {
    const d = STEPS[cur()], st = ST[cur()];
    if (d.show || finished || (!solved(st) && st.tries === 0)) return;
    st.why = !st.why;
  } });
  const replayBtn = K.button({ label: 'Play again', secondary: true, into: '#replay', press: () => {
    const i = cur(), d = STEPS[i], st = ST[i];
    if (!d.show || finished) return;
    st.dragged = false; st.focus = null; st.ax = null; st.bx = null; st.pull = null;
    play(d.dur);
  } });
  const backBtn = K.button({ label: 'Back', secondary: true, into: '#nav', press: () => {
    if (finished) { finished = false; return; }
    stepper.set(Math.max(0, cur() - 1), true);
  } });
  const nextBtn = K.button({ label: 'Continue', into: '#nav', press: () => {
    const i = cur();
    if (finished || (!STEPS[i].show && !solved(ST[i]))) return;
    if (i < STEPS.length - 1) { stepper.set(i + 1, true); return; }
    finished = true; anim.pause(); T = Infinity;
    if (typeof K.complete === 'function') K.complete();
  } });
  K.button({ label: 'Start again', secondary: true, into: '#again', press: () => {
    ST = STEPS.map(fresh); finished = false; lastStep = -1; hold = null;
    Object.keys(FIELDS).forEach((k) => FIELDS[k].reset());
    stepper.set(0, true);
  } });

  // ---------- words (built with K.el, never innerHTML): *a key term*, `kept on one line` ----------
  function write(node, s) {
    node.textContent = '';
    String(s || '').split('`').forEach((part, k) => {
      if (!part) return;
      if (k % 2) { node.appendChild(K.el('span', { class: 'nw' }, part)); return; }
      const re = /\*([^*]+)\*/g;
      let from = 0, m;
      while ((m = re.exec(part))) {
        if (m.index > from) node.appendChild(document.createTextNode(part.slice(from, m.index)));
        node.appendChild(K.el('span', { class: 'term' }, m[1]));
        from = m.index + m[0].length;
      }
      if (from < part.length) node.appendChild(document.createTextNode(part.slice(from)));
    });
    return node;
  }
  write(el('finish'), FINISH);

  K.update((p) => {
    const i = Math.round(p.step), d = STEPS[i], st = ST[i];
    if (!anim.playing()) T = Infinity;
    if (i !== lastStep) enterStep(i);
    if (finished !== lastDone) { lastDone = finished; enter(finished ? 'done' : 'stepbox'); }
    const sv = solved(st);
    el('stepbox').hidden = finished;
    el('done').hidden = !finished;
    el('count').textContent = 'Step ' + (i + 1) + ' of ' + STEPS.length;
    const task = el('task');
    task.className = 'task' + (d.show ? ' show' : '');
    write(task, d.show ? d.text : d.task);
    el('act').hidden = !d.act;
    write(el('act'), d.act || '');
    paint(i);
    replayBtn.el.hidden = !d.show || REDUCE;
    replayBtn.setLabel(d.pic === 'screw' ? 'Play the unrolling' : 'Play again');
    el('replay').hidden = replayBtn.el.hidden;
    const opts = d.kind === 'pick' ? d.opts : [];
    const picks = el('picks');
    picks.hidden = !opts.length;
    picks.classList.toggle('col', !!d.col);
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      b.setLabel(opts[k]);
      b.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });
    STEPS.forEach((x, k) => { if (x.kind === 'typed') el('ans-' + x.ans).hidden = finished || k !== i; });
    el('answers').hidden = d.kind !== 'typed';
    el('acts').hidden = !!d.show;
    checkBtn.el.hidden = sv;
    const fb = el('fb');
    fb.hidden = !!d.show;
    fb.className = 'fb' + (st.res === 'right' ? ' right' : '');
    write(fb, d.show ? '' : st.res === 'right' ? 'That\'s it.' : st.res === 'shown' ? 'Here is the working.' :
      st.res === 'wrong' ? (d.kind === 'typed' ? st.hint : hintFor(d, st)) : st.res === 'empty' ? 'Tap one of the answers.' : '');
    const why = el('why');
    why.hidden = !!d.show || !st.why;
    write(why, d.show ? '' : d.why);
    whyBtn.setLabel(st.why ? 'Hide why' : 'Why?');
    whyBtn.el.hidden = !sv && st.tries === 0;
    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !sv);
    nextBtn.setLabel(i === STEPS.length - 1 ? 'Finish' : 'Continue');
    el('nav').hidden = backBtn.el.hidden && nextBtn.el.hidden;
  });

  // ---------- known answers, worked out by hand ----------
  const IX = (name) => STEPS.findIndex((d) => d.name === name);
  const openSt = (i) => fresh(STEPS[i]);
  const doneSt = (i) => Object.assign(fresh(STEPS[i]), { res: 'right', pick: STEPS[i].want, qFrom: 0 });
  // A step drawn in the state given, finished: what it draws (then the current step is drawn again).
  function drawn(i, st, t) {
    const keepS = ST[i], keepT = T;
    ST[i] = st; T = t == null ? Infinity : t; latest = 0;
    try { scene(i, st); return { texts: REC.texts.slice(), arrows: REC.arrows.slice(), polys: REC.polys.slice(), reac: REC.reac.slice(), q: REC.q.slice(), latest }; }
    finally { ST[i] = keepS; T = keepT; paint(); }
  }

  K.check('In a simple truss, m = 2j − 3, where m is the total number of members and j is the number of joints: every frame here grown one triangle at a time (the triangles, the braced square, the braced square with its roof, the two braced bays, the frame of five triangles) has exactly 2j − 3 bars and no way left to move', () =>
    [F_EQ, F_T30, F_T45, F_SQD, F_HOD, F_B2, F_W].every((F) => F.B.length === 2 * F.J.length - 3 && freedoms(F) === 0), { source: IITB });

  K.check('A triangular truss of three members connected at three joints is clearly a rigid truss: the triangle has no way to move, while a drag on the square\'s top corner folds it, every bar keeping its length', () => {
    const q = bestQ(F_SQ, 3, [0.6, 0.9], rad(-80), rad(85), 0), P = pose(F_SQ, q);
    return freedoms(F_EQ) === 0 && !F_EQ.mode && freedoms(F_SQ) === 1 && dist(P[3], F_SQ.J[3]) > 0.3 && lengthsKept(F_SQ, P);
  }, { source: CSUS });

  K.check('If an object is balanced, the total clockwise moment about a pivot is equal to the total anticlockwise moment about that pivot: the supports\' pushes, found by balancing every joint, balance the load\'s moment about either support (10 kN at mid-span gives 5 kN each; 12 kN 2 m from the left of a 6 m span gives 8 kN and 4 kN)', () => {
    const cases = [[F_T30, [{ j: 2, w: 10 }]], [F_T30, [{ j: 0, w: 10 }]], [F_T45, [{ j: 2, w: 12 }]], [F_W, [{ j: 1, w: 12 }]]];
    const ok = cases.every(([F, L]) => {
      const s = solve(F, L), xp = F.J[F.pin][0], xr = F.J[F.roller][0];
      const mL = L.reduce((a, l) => a + l.w * (F.J[l.j][0] - xp), 0), mR = L.reduce((a, l) => a + l.w * (xr - F.J[l.j][0]), 0);
      return near(s.ry * (xr - xp), mL, 1e-9) && near(s.py * (xr - xp), mR, 1e-9) && near(s.px, 0, 1e-9);
    });
    return ok && near(S30.py, 5, 1e-9) && near(S30.ry, 5, 1e-9) && near(SW.py, 8, 1e-9) && near(SW.ry, 4, 1e-9);
  });

  K.check('If the force exerted by a member on a pin is directed toward that pin, the member is in compression; if it is directed away from the pin, the member is in tension: every bar arrow drawn at a pin points away from it exactly when its bar pulls, and each bar\'s label says pull or push to match', () => {
    const bi = IX('Pull or push');
    const recs = [drawn(IX('Which is pulled?'), doneSt(IX('Which is pulled?'))), drawn(IX('Joint by joint'), openSt(IX('Joint by joint'))),
      drawn(IX('The bottom bar'), doneSt(IX('The bottom bar'))), drawn(IX('A steeper frame'), doneSt(IX('A steeper frame'))),
      drawn(bi, Object.assign(openSt(bi), { bx: 300 })), drawn(bi, Object.assign(openSt(bi), { bx: 240 }))];
    const all = recs.reduce((a, r) => a.concat(r.arrows), []);
    const away = (a) => dist(a.tip, a.pin) > dist(a.tail, a.pin);
    return all.length === 20 && all.every((a) => away(a) === (a.kind === 'pull') && (a.T > 0) === (a.kind === 'pull')) &&
      recs[0].texts.filter((s) => s === 'pull').length === 1 && recs[0].texts.filter((s) => s === 'push').length === 2 &&
      recs[4].texts.filter((s) => s === 'pull').length === 2 && recs[5].texts.filter((s) => s === 'push').length === 2;
  }, { source: CSUS });

  K.check('Every joint is in balance: at each joint of each loaded frame the bar forces, the load and the support pushes add to nothing, so each nose-to-tail drawing closes back on its start', () => {
    const cases = [[F_T30, [{ j: 2, w: 10 }]], [F_T30, [{ j: 1, w: 10 }]], [F_T45, [{ j: 2, w: 12 }]], [F_W, [{ j: 1, w: 12 }]]];
    const polys = [drawn(IX('Joint by joint'), openSt(IX('Joint by joint'))), drawn(IX('The bottom bar'), doneSt(IX('The bottom bar'))),
      drawn(IX('A steeper frame'), doneSt(IX('A steeper frame')))].map((r) => r.polys[0]);
    return cases.every(([F, L]) => resid(F, solve(F, L), L) < 1e-9) && polys.every((p) => p && p.pts.length === 4 && dist(p.pts[0], p.pts[3]) < 1e-6);
  });

  K.check('The figures come from the rule: 2 × 3 − 3 = 3, 2 × 4 − 3 = 5 and 2 × 6 − 3 = 9; 10 kN at the top joint gives 5 kN pushes, 10 kN in each 30° bar and 8.66 kN in the bottom bar; 12 kN at 45° gives 8.49 kN and 6.00 kN; 12 kN at 2 m of 6 m gives 8 kN and 4 kN; π × 20 = 62.8 mm, 62.8 ÷ 2 = 31.4 and 62.8 ÷ 1.5 = 41.9; 2 × 5 − 3 = 7', () => {
    const t = (nm, done) => { const i = IX(nm); return drawn(i, done ? doneSt(i) : openSt(i)).texts; };
    const t3 = t('Counting ways to move'), t10 = t('Joint by joint'), t11 = t('The bottom bar', true), t14 = t('A steeper frame', true), t7 = t('Off centre', true), t12 = t('A screw is a ramp'), t13 = t('A finer thread', true), t4 = t('Lock the frame', true);
    return near(S30.py, 5, 1e-9) && near(-S30.T[1], 10, 1e-9) && near(-S30.T[2], 10, 1e-9) && r2(S30.T[0]) === 8.66 && r2(-S45.T[1]) === 8.49 && r2(S45.T[0]) === 6 &&
      ['needs 2 × 3 − 3 = 3', 'needs 2 × 4 − 3 = 5', 'holds', '1 short: folds'].every((s) => t3.includes(s)) && countLines(F_B2)[1].s === 'needs 2 × 6 − 3 = 9' &&
      t10.filter((s) => s === '10 kN push').length === 2 && t11.includes('8.66 kN pull') && t14.filter((s) => s === '8.49 kN push').length === 2 && t14.includes('6.00 kN pull') &&
      t7.includes('8 kN') && t7.includes('4 kN') && t7.includes('2 m') && t7.includes('6 m') && t12.includes('62.8 mm') && t12.includes('load lifted ÷ push = 62.8 ÷ 2 = 31.4') &&
      t13.includes('load lifted ÷ push = 62.8 ÷ 1.5 = 41.9') && t13.includes('climbs 1.5 mm') && t4.includes('needs 2 × 5 − 3 = 7') && t4.includes('holds');
  });

  K.check('Each typed answer and slip is worked from the lesson\'s figures: 7 bars (6, 10, 5), 1 bar (4, 9, 0), 8 kN (4, 6), 8.66 kN (10, 5, 11.55), 41.9 times (31.4, 13.3, 94.2) and 8.49 kN (6, 12, 4.24); each answer as printed is graded right and each slip wrong', () => {
    const want = { 'Lock the frame': [7, '7 bars', [6, 10, 5]], 'A finer thread': [41.9, '41.9 times', [31.4, 13.3, 94.2]], 'Grow the frame': [1, '1 bar', [4, 9, 0]], 'Off centre': [8, '8 kN', [4, 6]],
      'The bottom bar': [8.66, '8.66 kN', [10, 5, 11.55]], 'A steeper frame': [8.49, '8.49 kN', [6, 12, 4.24]] };
    return Object.keys(want).every((nm) => {
      const d = STEPS[IX(nm)], [ans, w, sl] = want[nm], sp = { answer: d.answer, decimals: d.decimals, unit: d.unit, slips: d.slips };
      return d.kind === 'typed' && near(d.answer, ans, 1e-9) && d.want === w && d.slips.length === sl.length && d.slips.every((x, n) => near(x.value, sl[n], 1e-9)) &&
        K.answer.grade(w, sp).state === 'right' && K.answer.grade(String(ans), sp).state === 'right' && sl.every((v) => K.answer.grade(String(v), sp).state === 'wrong');
    });
  });

  K.check('Every pose a frame can be dragged into keeps each bar\'s length and each foot on its support: the square without a diagonal, with or without its roof, and the two bays with one bay unbraced, each have exactly one way left to move, and that is the motion drawn', () =>
    [[F_SQ, -80, 85], [F_HO, -80, 80], [F_B1, -20, 20], [F_BB, -18, 18]].every(([F, a, b]) => freedoms(F) === 1 && K.linspace(a, b, 25).every((dg) => {
      const P = pose(F, rad(dg));
      return lengthsKept(F, P) && near(P[F.pin][0], 0) && near(P[F.pin][1], 0) && near(P[F.roller][1], 0);
    })));

  K.check('Before an answer nothing gives it away: each asked figure reads "?", no bar is labelled pull or push, and the frames stand unmoved; after it, each shows', () => {
    const ask = { 'Lock the frame': 'needs 2 × 5 − 3 = 7', 'A finer thread': 'load lifted ÷ push = 62.8 ÷ 1.5 = 41.9', 'Grow the frame': 'needs 2 × 6 − 3 = 9', 'Off centre': '8 kN', 'The bottom bar': '8.66 kN pull', 'A steeper frame': '8.49 kN push' };
    const typedOk = Object.keys(ask).every((nm) => {
      const i = IX(nm), b = drawn(i, openSt(i)).texts, a = drawn(i, doneSt(i)).texts;
      return b.some((s) => /\?/.test(s)) && !b.includes(ask[nm]) && a.includes(ask[nm]) && !a.some((s) => /\?/.test(s));
    });
    const i9 = IX('Which is pulled?'), b9 = drawn(i9, openSt(i9)), a9 = drawn(i9, doneSt(i9));
    const i13 = IX('Same count'), b13 = drawn(i13, openSt(i13)), a13 = drawn(i13, doneSt(i13));
    const i1 = IX('Which holds?'), b1 = drawn(i1, openSt(i1)), a1 = drawn(i1, doneSt(i1));
    return typedOk && b9.arrows.length === 0 && !b9.texts.includes('pull') && a9.texts.includes('pull') &&
      b13.q[1] === 0 && !b13.texts.some((s) => /folds/.test(s)) && a13.q[1] > rad(10) && a13.texts.some((s) => /folds/.test(s)) &&
      b1.q[0] === 0 && a1.q[0] > rad(60);
  });

  K.check('The mechanical advantage of a screw can be found by dividing the circumference of the screw by the pitch (lead) of the screw: one turn of each screw drawn unrolls into a ramp as long as its circumference that climbs one pitch, and its load lifted ÷ push is that length ÷ the pitch, more for the finer thread', () => {
    const a = drawn(IX('A screw is a ramp'), openSt(IX('A screw is a ramp'))).texts, b = drawn(IX('A finer thread'), doneSt(IX('A finer thread'))).texts;
    return SC_C1 === r1(Math.PI * 20) && a.includes(SC_C1 + ' mm') && a.includes('climbs 2 mm') && a.includes('load lifted ÷ push = ' + SC_C1 + ' ÷ 2 = ' + r1(SC_C1 / 2)) &&
      b.includes(SC_C1 + ' mm') && b.includes('climbs 1.5 mm') && b.includes('load lifted ÷ push = ' + SC_C1 + ' ÷ 1.5 = ' + r1(SC_C1 / 1.5)) && scGain(1.5) > scGain(2);
  }, { source: BOX });

  K.check('The choices follow the rule: the triangle holds and the square folds; with a load at its top joint only the triangle\'s bottom bar pulls; of the two frames with 9 bars only Frame B can move', () =>
    freedoms(F_EQ) === 0 && freedoms(F_SQ) === 1 && STEPS[IX('Which holds?')].want === 'The triangle' &&
    S30.T[0] > 0 && S30.T[1] < 0 && S30.T[2] < 0 && STEPS[IX('Which is pulled?')].want === 'The bottom bar' &&
    freedoms(F_B2) === 0 && freedoms(F_BB) === 1 && STEPS[IX('Same count')].want.indexOf('Frame B') === 0);

  K.check('Every demonstration settles within 5 s of its screen opening, and every answer\'s motion within 3.5 s', () =>
    STEPS.every((d, i) => (d.show ? drawn(i, openSt(i)).latest <= d.dur + 1e-9 && d.dur <= 5 : drawn(i, doneSt(i)).latest <= d.run + 1e-9 && d.run <= 3.5)));

  K.ready();
</script>
