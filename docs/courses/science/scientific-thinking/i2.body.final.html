<p class="lead">Gear trains seen face on, meshing tooth in tooth, with two gears fixed to each middle shaft. Every tooth count, speed and load is an example.</p>

<script>
  // ---------- helpers ----------
  const TAU = 2 * Math.PI, NB = ' ';
  const r2 = (v) => Math.round(v * 100) / 100;
  const clamp01 = (p) => Math.min(1, Math.max(0, p));
  // How far a move timed from t0 to t1 has got at T seconds: 0 before, 1 after, eased between.
  const tw = (T, t0, t1) => (T >= t1 ? 1 : T <= t0 ? 0 : K.ease(clamp01((T - t0) / (t1 - t0))));
  const sym = (x, P) => x - P * Math.round(x / P);
  const near = (a, b) => Math.abs(a - b) <= 1e-9 * Math.max(1, Math.abs(a), Math.abs(b));
  const whole = (v) => Math.abs(v - Math.round(v)) < 1e-9;
  const r1 = (v) => Math.round(v * 10) / 10;
  // One rounding everywhere: whole numbers plain, others to one place (1450, 483.3, 120.8).
  const num = (v) => (whole(v) ? String(Math.round(v)) : String(r1(v)));
  // A ratio as so many to 1: whole numbers plain, others to two places.
  const ratioText = (r) => (whole(r) ? String(Math.round(r)) : r.toFixed(2)) + NB + ':' + NB + '1';
  const turnsText = (n) => n + NB + (n === 1 ? 'turn' : 'turns');
  const rpmText = (v) => num(v) + NB + 'rev/min';
  const nmText = (v) => num(v) + NB + 'N' + NB + 'm';
  const NS = 'https://www.notesandsketches.co.uk/Gears.html';
  const REV = 'https://docs.revrobotics.com/ion-build/motion/gears/advanced-gears';

  // ---------- the trains: tooth counts shaft by shaft, the motor's first. A middle shaft holds the
  // wheel driven by the stage before it, then the pinion keyed beside it that drives the next. ----------
  const TEETH = {
    two: [[12], [36, 12], [36]],
    speed: [[15], [45, 12], [48]],
    winch: [[12], [60, 10], [100]],
    split: [[12], [48, 12], [60]],
    equal: [[15], [15 * Math.sqrt(36), 15], [15 * Math.sqrt(36)]],
    crank: [[48], [16, 40], [10]],
    three: [[12], [24, 12], [36, 12], [60]],
  };
  // A stage's ratio is the driven gear's teeth ÷ the driver's teeth; the train's is them multiplied.
  const stagesOf = (t) => t.slice(1).map((ts, k) => ts[0] / t[k][t[k].length - 1]);
  const overall = (t) => stagesOf(t).reduce((a, b) => a * b, 1);
  const added = (t) => stagesOf(t).reduce((a, b) => a + b, 0);
  // The winch examples: the drum's torque is the cable's pull × the drum's radius.
  const W8 = { kN: 5, r: 0.2 }, W9 = { kN: 4, r: 0.25, ratio: 40 };
  const drumTorque = (w) => w.kN * 1000 * w.r;
  const T2 = TEETH.two, TS = TEETH.speed, T3 = TEETH.three;

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // pic: the train drawn. open(T): the motion as a SHOW screen opens; run(T): the motion after a right
  // answer. Every typed answer and slip is worked from the tooth counts.
  const STEPS = [
    { kind: 'tap', name: 'The fastest gear', pic: 'two', cnt: true, rdur: 2.4,
      task: 'The motor turns the first 12\u2011tooth pinion. Which gear turns fastest?', act: 'Tap a gear.',
      read: 'The motor turns the first 12\u2011tooth pinion. Which gear turns fastest?',
      opts: ['The motor pinion', 'The 36\u2011tooth wheel', 'The second pinion', 'The output wheel'], gears: [0, 1, 2, 3], want: 'The motor pinion',
      hint: 'A gear with three times its driver\'s teeth turns at a third of the driver\'s speed.',
      hints: { 'The second pinion': 'It is fixed to the 36\u2011tooth wheel\'s shaft. So it turns with that wheel.' },
      why: 'The 36\u2011tooth wheel turns at a third of the motor\'s speed. The second pinion turns with it. The output wheel turns at a third of that again: a ninth of the motor\'s speed. So the motor pinion turns fastest.',
      run: (T) => ({ al: tw(T, 0.1, 2.4) * 3 * TAU }) },
    { show: true, name: 'One shaft, one speed', pic: 'two', cnt: true, dur: 4.6,
      text: 'The second pinion is fixed to the wheel\'s shaft. So the two turn together, the same way and at the same speed. Nine turns of the motor pinion make three turns of that shaft. Those three turns make one turn of the output wheel. Each meshed pair is one stage.',
      act: 'Turn the motor.',
      read: 'After nine turns of the motor pinion, the wheel and the second pinion both show three turns. The output wheel shows one.',
      open: (T) => ({ al: tw(T, 0.6, 4.6) * 9 * TAU }) },
    { kind: 'typed', name: 'Count the turns', pic: 'two', cnt: true, hideCnt: [1, 2, 3], ans: 'cnt', unit: 'turns', decimals: 0, rdur: 0.8,
      answer: 18 / overall(T2),
      slips: [{ value: 18 / stagesOf(T2)[0], hint: 'That is the middle shaft. The second stage divides by 3 again.' },
        { value: 18 / added(T2), hint: 'You added the ratios, 3 + 3. Each stage divides. So multiply them.' },
        { value: 18 * overall(T2), hint: 'That makes the output faster than the motor. Divide by the ratios.' }],
      task: 'The motor pinion turns 18 times. How many turns does the output wheel make?',
      hint: 'Work one stage at a time. The second pinion turns with the wheel.',
      why: '18 ÷ 3 = 6 turns of the middle shaft. So the second pinion turns 6 times too. Then 6 ÷ 3 = 2 turns of the output wheel.',
      open: () => ({ al: 18 * TAU }),
      run: (T) => ({ al: 0, q: tw(T, 0.1, 0.8) }) },
    { show: true, name: 'Ratios multiply', pic: 'drag', tiles: 'ratio', dur: 3.8,
      text: 'Each stage divides the speed by its ratio. That ratio is the driven gear\'s teeth ÷ the driver\'s teeth. The second stage starts from the speed the first stage leaves. So the overall ratio is `3 × 3 = 9`, written `9 : 1`.',
      act: 'Drag a tooth count.',
      read: 'With 12, 36, 12 and 36 teeth, the stages read 3 : 1 and 3 : 1. The overall ratio reads 9 : 1.',
      open: (T) => ({ al: tw(T, 0.6, 3.8) * 1.5 * TAU, t0: K.arrive(T, 1.2), t1: K.arrive(T, 1.8), t2: K.arrive(T, 2.4) }) },
    { kind: 'typed', name: 'The motor\'s speed', pic: 'speed', tiles: 'speed', rpm: 1450, ans: 'spd', unit: 'rev/min', decimals: 1, rdur: 2.2,
      answer: r1(1450 / overall(TS)),
      slips: [{ value: r1(1450 / added(TS)), hint: 'You added the ratios, 3 + 4. Multiply them.' },
        { value: r1(1450 / stagesOf(TS)[0]), hint: 'That is the middle shaft. Divide by the second stage\'s 4 as well.' },
        { value: 1450 * overall(TS), hint: 'That makes the output faster than the motor. Divide by the ratio.' }],
      task: 'A motor turns at 1450 rev/min. Its 15-tooth pinion drives a 45-tooth wheel. A 12-tooth pinion on that shaft drives a 48-tooth wheel. How fast does the output wheel turn?',
      hint: 'Find each stage\'s ratio and multiply them. Then divide the motor\'s speed by that.',
      why: '45 ÷ 15 = 3 and 48 ÷ 12 = 4. So the overall ratio is 3 × 4 = 12. Then 1450 ÷ 12 = 120.8 rev/min.',
      run: (T) => ({ al: tw(T, 0.1, 2.2) * TAU }) },
    { show: true, name: 'Speed for torque', pic: 'twoD', bars: true, dur: 4.2,
      text: 'Each stage divides the speed by its ratio. It multiplies the torque by the same ratio. So along the train, the speed bars fall as the torque bars rise. Their product is the power. It stays the same all the way through an ideal train.',
      act: 'Turn the motor.',
      read: 'From the motor to the drum, the speed bar falls to a ninth. The torque bar grows nine times. The power bar keeps one length.',
      open: (T) => ({ al: tw(T, 0.6, 4.2) * 2 * TAU, b0: K.arrive(T, 0.9), b1: K.arrive(T, 1.6), b2: K.arrive(T, 2.3) }) },
    { kind: 'pick', name: 'Faster and stronger', pic: 'twoD', bars: true, col: true, rdur: 2.2,
      task: 'Can a gear train make its output turn faster than the motor and with more torque?',
      opts: ['Yes, with enough stages', 'No, it trades one for the other', 'Yes, with an idler gear'], want: 'No, it trades one for the other',
      hint: 'Watch the power bar. Adding stages cannot make it grow.',
      hints: { 'Yes, with an idler gear': 'An idler flips the direction but leaves the ratio unchanged.' },
      why: 'Power is torque × speed. In an ideal train it stays the same. Friction only takes some away. So the output can turn faster only with less torque. It gets more torque only by turning slower.',
      run: (T) => ({ al: tw(T, 0.1, 2.2) * 1.5 * TAU }) },
    { show: true, name: 'The winch drum', pic: 'winch', tiles: 'torque', dur: 4.2,
      text: 'The load pulls on the cable at the drum\'s rim. So the drum needs a torque of pull × radius. That is `5000 N × 0.2 m = 1000 N m`. An ideal `50 : 1` train divides that by 50. So the motor gives just `20 N m`.',
      read: 'The load pulls on the cable at the drum\'s rim. So the drum needs a torque of pull × radius. That is 5000 N × 0.2 m = 1000 N m. An ideal 50 : 1 train divides that by 50. So the motor gives just 20 N m.',
      open: (T) => ({ al: tw(T, 0.6, 4.2) * 4 * TAU, t0: K.arrive(T, 1.2), t1: K.arrive(T, 1.8) }) },
    { kind: 'typed', name: 'The motor\'s torque', pic: 'box', tiles: 'torque', ans: 'trq', unit: 'N m', decimals: 0, rdur: 2.2,
      answer: drumTorque(W9) / W9.ratio,
      slips: [{ value: drumTorque(W9), hint: 'That is the drum\'s torque. The train divides it by 40 for the motor.' },
        { value: drumTorque(W9) * W9.ratio, hint: 'That multiplies at the motor. The motor turns faster, so it needs less torque.' },
        { value: W9.kN * W9.r / W9.ratio, hint: 'Turn 4 kN into 4000 N first.' }],
      task: 'A winch drum of 0.25 m radius takes a 4 kN pull. Its ideal train is 40 : 1. What torque must the motor give?',
      hint: 'Work out the drum\'s torque first: pull × radius.',
      why: '4000 × 0.25 = 1000 N m at the drum. Then 1000 ÷ 40 = 25 N m at the motor.',
      run: (T) => ({ al: tw(T, 0.1, 2.2) * W9.ratio * 0.1 * TAU }) },
    { show: true, name: 'Split the ratio', pic: 'split', tiles: 'ratio', dur: 3.8,
      text: 'One pair stops at about `10 : 1`. Past that, the wheel grows huge beside its pinion. So a bigger ratio takes a second stage. To get `20 : 1` from two stages, pick stage ratios that multiply to 20, such as `4 × 5`. A 12-tooth pinion into a 48-tooth wheel gives `4 : 1`. A 12-tooth pinion into a 60-tooth wheel gives `5 : 1`.',
      read: 'One pair stops at about 10 : 1. Past that, the wheel grows huge beside its pinion. So a bigger ratio takes a second stage. To get 20 : 1 from two stages, pick stage ratios that multiply to 20, such as 4 × 5. A 12-tooth pinion into a 48-tooth wheel gives 4 : 1. A 12-tooth pinion into a 60-tooth wheel gives 5 : 1.',
      open: (T) => ({ al: tw(T, 0.6, 3.8) * 1.5 * TAU, t0: K.arrive(T, 1.2), t1: K.arrive(T, 1.8), t2: K.arrive(T, 2.4) }) },
    { kind: 'typed', name: 'Two equal stages', pic: 'equal', hide: true, ans: 'tth', unit: 'teeth', decimals: 0, rdur: 2.4,
      answer: TEETH.equal[1][0],
      slips: [{ value: 15 * 36 / 2, hint: 'You halved 36. Equal stages multiply. So each stage needs the ratio that makes 36 when multiplied by itself.' },
        { value: 15 * 36, hint: 'That makes one stage do all of 36 : 1. Each stage needs only part of it.' }],
      task: 'You need 36 : 1 from two equal stages. Each pinion has 15 teeth. How many teeth must each wheel have?',
      hint: 'Which ratio multiplied by itself makes 36?',
      why: '6 × 6 = 36, so each stage is 6 : 1. Each wheel has 15 × 6 = 90 teeth.',
      run: (T) => ({ gear: tw(T, 0.1, 0.8), al: tw(T, 0.9, 2.4) * TAU }) },
    { kind: 'tap', name: 'Speeding up', pic: 'crank', rdur: 2.4,
      task: 'The crank turns the 48\u2011tooth wheel. Which gear turns fastest?', act: 'Tap a gear.',
      read: 'The crank turns the 48\u2011tooth wheel. Which gear turns fastest?',
      opts: ['The 48\u2011tooth wheel', 'The 16\u2011tooth pinion', 'The 40\u2011tooth wheel', 'The 10\u2011tooth pinion'], gears: [0, 1, 2, 3], want: 'The 10\u2011tooth pinion',
      hint: 'A small gear driven by a big one turns faster.',
      hints: { 'The 16\u2011tooth pinion': 'The second stage speeds things up again.', 'The 40\u2011tooth wheel': 'It shares a shaft with the 16\u2011tooth pinion. So it turns at the same speed.' },
      why: '48 ÷ 16 = 3. So the 16\u2011tooth pinion and the 40\u2011tooth wheel turn 3 times as fast as the crank. Then 40 ÷ 10 = 4. So the 10\u2011tooth pinion turns 3 × 4 = 12 times as fast. When a train speeds up at every stage, its last gear is the fastest.',
      run: (T) => ({ al: tw(T, 0.1, 2.4) * 0.35 * TAU }) },
    { kind: 'typed', name: 'Three stages', pic: 'three', tiles: 'speed3', rpm: 2400, hideDir: 'always', noTurn: true, ans: 'thr', unit: 'rev/min', decimals: 0, rdur: 0.6,
      answer: 2400 / overall(T3),
      slips: [{ value: 2400 / added(T3), hint: 'You added the ratios, 2 + 3 + 5. Multiply them.' },
        { value: 2400 * overall(T3), hint: 'That makes the output faster than the motor. Divide by the ratio.' }],
      task: 'A motor turns at 2400 rev/min. Its three stages are 2 : 1, 3 : 1 and 5 : 1. How fast does the output turn?',
      hint: 'Multiply the three stage ratios first.',
      why: '2 × 3 × 5 = 30. Then 2400 ÷ 30 = 80 rev/min.' },
    { kind: 'pick', name: 'Which way', pic: 'three', hideDir: true, rdur: 2.2,
      task: 'The motor turns clockwise. Which way does the output turn?',
      opts: ['Clockwise', 'Anticlockwise'], want: 'Anticlockwise',
      hint: 'Each stage is one mesh. Each mesh flips the direction. Count the stages.',
      why: 'Three stages make three flips. The two gears on each shaft turn the same way, so they add no flip. So the output turns anticlockwise.',
      run: (T) => ({ arr: tw(T, 0.1, 0.6), al: tw(T, 0.3, 2.2) * 1.5 * TAU }) },
  ];
  STEPS.forEach((d) => { if (d.kind === 'typed') d.want = num(d.answer) + ' ' + d.unit; });
  const FINISH = 'Two gears fixed to one shaft turn together. So a compound train\'s overall ratio is its stage ratios multiplied.';

  // ---------- building a train (pure) ----------
  // A gear: T teeth of module m (px per tooth of pitch diameter) at (x, y). Pitch radius mT/2; tips one module out.
  const rP = (g) => g.m * g.T / 2, rO = (g) => rP(g) + g.m, rR = (g) => rP(g) - 1.25 * g.m;
  let TT = [12, 36, 12, 36];   // the tooth counts Dan drags on screen 4
  const SPEC = {
    two: () => ({ teeth: T2, motor: true, names: ['motor pinion', '36-tooth wheel', 'second pinion', 'output wheel'] }),
    twoD: () => ({ teeth: T2, motor: true, mMax: 3.6, drum: { rd: 15 } }),
    speed: () => ({ teeth: TS, motor: true }),
    winch: () => ({ teeth: TEETH.winch, motor: true, ang: [-35, 0], side: { 0: 180 }, drum: { rd: 22, rad: W8.r + NB + 'm', pull: W8.kN + NB + 'kN' } }),
    split: () => ({ teeth: TEETH.split, motor: true }),
    equal: () => ({ teeth: TEETH.equal, motor: true, hide: [1, 3] }),
    crank: () => ({ teeth: TEETH.crank, crank: true }),
    three: () => ({ teeth: T3, motor: true }),
    drag: () => ({ teeth: [[TT[0]], [TT[1], TT[2]], [TT[3]]], motor: true, hMax: 180, drag: true, vb: [-108, 232] }),
    box: () => ({ box: true }),
  };
  function build(spec) {
    if (spec.box) return { spec, box: true, gears: [], ratio: [], stages: [], pairs: [], shafts: [] };
    const sh = spec.teeth, n = sh.length, G = [], inn = [], out = [];
    sh.forEach((ts, s) => { inn[s] = G.length; ts.forEach((T) => G.push({ T, s })); out[s] = G.length - 1; });
    // shaft centres at module 1: each stage's centres sit a pitch radius apart, along its angle
    const px = [0], py = [0];
    for (let k = 0; k < n - 1; k++) {
      const a = ((spec.ang && spec.ang[k]) || 0) * Math.PI / 180, L = (G[out[k]].T + G[inn[k + 1]].T) / 2;
      px.push(px[k] + L * Math.cos(a)); py.push(py[k] + L * Math.sin(a));
    }
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    G.forEach((g) => { const r = g.T / 2 + 1; x0 = Math.min(x0, px[g.s] - r); x1 = Math.max(x1, px[g.s] + r); y0 = Math.min(y0, py[g.s] - r); y1 = Math.max(y1, py[g.s] + r); });
    const m = Math.min(spec.mMax || 4.2, (spec.w || 310) / (x1 - x0), (spec.hMax || 200) / (y1 - y0));
    const ox = 172 - m * (x0 + x1) / 2, oy = -m * (y0 + y1) / 2;
    G.forEach((g) => { g.m = m; g.x = ox + m * px[g.s]; g.y = oy + m * py[g.s]; });

    return sh.every((s) => near(s.sp * s.tq, 1)) && near(sh[2].sp, 1 / 9) && near(sh[2].tq, 9) && boardOf('winch').shafts.every((s) => near(s.sp * s.tq, 1)) &&
      tl('The winch drum', blank()) === [nmText(1000), nmText(20)].join() && tl('The motor\'s torque', solvedSt()) === [nmText(1000), nmText(25)].join();
  });
  K.check('Turning the motor forward winds the cable onto the drum and lifts the load: two motor turns lift it by the drum\'s radius × two ninths of a turn', () => {
    const D = boardOf('twoD').drum, a = drawn(IX('Speed for torque'), blank(), Infinity).lift;
    return a > 0 && near(a, D.rd * 2 * TAU / 9) && near(D.cx, D.x - D.rd);
  });
  K.check('Before an answer nothing gives it away: the middle-shaft and output counters read "? turns", the output speeds and the motor\'s torque read "?", the wheels hide behind "? teeth", and only the motor shows its way round; after it, each is shown', () => {
    const u = (n) => drawn(IX(n), blank(), Infinity), s = (n) => drawn(IX(n), solvedSt(), Infinity);
    const c0 = u('Count the turns'), c1 = drawn(IX('Count the turns'), Object.assign(solvedSt(), { ba: 18 * TAU, bd: 18 * TAU }), Infinity), e0 = u('Two equal stages'), e1 = s('Two equal stages');
    const w0 = u('Which way'), w1 = s('Which way'), h1 = s('Three stages');
    return [1, 2, 3].every((k) => c0.turns[k] === '?' + NB + 'turns') && c0.texts.indexOf(turnsText(2)) < 0 && c1.turns[3] === turnsText(2) && c1.turns[1] === turnsText(6) &&
      tl('The motor\'s speed', blank()).split(',')[2].indexOf('?') === 0 && tl('The motor\'s speed', solvedSt()).split(',')[2] === rpmText(1450 / 12) &&
      tl('The motor\'s torque', blank()).split(',')[1].indexOf('?') === 0 && tl('Three stages', blank()).split(',')[1].indexOf('?') === 0 && tl('Three stages', solvedSt()).split(',')[1] === rpmText(80) &&
      e0.holes === 2 && e0.texts.indexOf('90') < 0 && e1.holes === 0 && e1.texts.indexOf('90') >= 0 &&
      w0.arrows.length === 1 && w1.arrows.length > 1 && h1.arrows.length === 1;
  });
  K.check('Every mesh is drawn with its gears touching at their pitch circles and tooth in gap, gears on one shaft share a centre, and no two gears in one layer overlap unless they mesh', () =>
    KEYS.every((key) => {
      const B = boardOf(key), G = B.gears;
      const pitch = B.stages.every((e) => Math.abs(Math.hypot(G[e[0]].x - G[e[1]].x, G[e[0]].y - G[e[1]].y) - rP(G[e[0]]) - rP(G[e[1]])) < 1e-6 && Math.abs(B.miss(e)) < 1e-6);
      const keyed = B.pairs.every((q) => near(G[q[0]].x, G[q[1]].x) && near(G[q[0]].y, G[q[1]].y));
      const meshed = (a, b) => B.stages.some((e) => (e[0] === a && e[1] === b) || (e[0] === b && e[1] === a));
      const apart = G.every((g, a) => G.every((h, b) => b <= a || g.s === h.s || B.layer(a) !== B.layer(b) || meshed(a, b) || Math.hypot(g.x - h.x, g.y - h.y) > rO(g) + rO(h) + 1));
      return pitch && keyed && apart;
    }));
  K.check('Dragged tooth counts set the ratios: 10 into 60 twice reads 6 : 1, 6 : 1 and 36 : 1, and 60 into 10 twice speeds up, reading 0.17 : 1, 0.17 : 1 and 0.03 : 1', () => {
    const keep = TT.slice();
    try {
      TT = [10, 60, 10, 60]; const a = tl('Ratios multiply', blank());
      TT = [60, 10, 60, 10]; const b = tl('Ratios multiply', blank());
      return a === ['6', '6', '36'].map(rt).join() && b === ['0.17', '0.17', '0.03'].map(rt).join();
    } finally { TT = keep; paint(); }
  });
  K.check('Every demonstration is over within 5 s of its screen opening and nothing moves during the 0.35 s screen fade; every answer\'s motion is over within 2.5 s', () => {
    const J = (i, st, t) => JSON.stringify(motion(i, st, t), (k, v) => (typeof v === 'number' ? Math.round(v * 1e6) / 1e6 : v));
    return STEPS.every((d, i) => {
      const b = blank(), r = solvedSt();
      const open = !d.show ? true : d.dur >= 3 && d.dur <= 5 && J(i, b, d.dur) === J(i, b, Infinity) && J(i, b, 0.35) === J(i, b, 0);
      const run = d.show ? true : d.rdur <= 2.5 && J(i, r, d.rdur) === J(i, r, Infinity);
      return open && run;
    });
  });

  K.ready();
