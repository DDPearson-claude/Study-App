<p class="caption">Made-up example readings that sit exactly on their lines; a faint ring marks what you can drag.</p>

<script>
  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // kind 'tri': readings on a line, a step triangle, and (with back/icpt) the line carried back to the upright axis;
  // 'use': a law read both ways with guides; 'two': two lines, a triangle on each; 'swap': a resistor's readings with
  // the axes swapped. tl: when each part of a demonstration arrives (seconds). A puzzle: its options and what each
  // stands for (vals), the right answer worked from the puzzle's own readings (right), each wrong option's slip, and its own hint.
  const W1 = { m: 0.04, c: 10 };                                      // the first winding: R = 0.04T + 10
  const UW = { xu: '°C', yu: 'Ω', xv: 'T', yv: 'R', xn: 'Temperature _T_ (°C)', yn: 'Resistance _R_ (Ω)', yd: 1 };
  const WIND = { x1: 120, y1: 16, xt: 20, yt: 2 };
  const W2V = { x1: 70, y1: 7, xt: 10, yt: 1 };
  const HEAD_G = 'Gradient = rise ÷ run, in _R_\'s unit per _T_\'s unit';
  const HEAD_C = 'The intercept _c_ is the value of _R_ where the line meets the _R_ axis, at 0 °C';
  const HEAD_U = 'Law: `_R_ = 0.04_T_ + 10`, read up then across, or across then down';
  const HEAD_H = 'Height is where a line sits; steepness is its gradient';
  const HEAD_X = 'Gradient = rise ÷ run, in the up axis\'s unit per the along axis\'s unit';
  const PICK = 'Tap one of the answers.';
  const MINRUN = 20;
  const near = (a, b, tol) => Math.abs(a - b) <= (tol == null ? 1e-9 : tol);
  const lf = (L) => (x) => L.m * x + L.c;
  const TRI = (d) => { const f = lf(d.L), a = d.tri[0], b = d.tri[1]; return { a, b, f, run: b - a, rise: f(b) - f(a) }; };
  const cOf = (d) => { const f = lf(d.L), x0 = d.rx[0]; return f(x0) - d.L.m * x0; };
  const perU = (u, up) => (up ? u.yu + ' per ' + u.xu : u.xu + ' per ' + u.yu);
  const lawOf = (d) => { const t = TRI(d), a = t.rise / t.run; return [a, t.f(d.rx[0]) - a * d.rx[0]]; };
  function higherSteeper(d) {
    const P = d.lines[0], Q = d.lines[1], xs = K.linspace(0, d.view.x1, 21);
    const hi = xs.every((x) => lf(P)(x) > lf(Q)(x)) ? P.n : xs.every((x) => lf(Q)(x) > lf(P)(x)) ? Q.n : '?';
    return [hi, P.m > Q.m ? P.n : Q.n];
  }

  const STEPS = [
    { show: true, kind: 'tri', name: 'Gradient with units', view: WIND, u: UW, L: W1, rx: [20, 40, 60, 80], lo: 20, hi: 80,
      tri0: [20, 60], tri: [20, 80], stretch: true, dotLab: true, glab: true, rowsOf: ['run', 'rise', 'grad', 'soFar'], drag: ['move', 'tip'], dur: 4.7,
      tl: { dots: 0.5, dstep: 0.25, line: 1.4, grow: true, run: 2.1, rise: 2.6, glab: 3.0, r0: 2.2, r1: 2.7, r2: 3.0, r3: 3.3, stretch: 3.8 },
      head: HEAD_G,
      text: 'An example motor winding\'s readings lie on a straight line. A step triangle on it runs 40 °C and rises 1.6 Ω, so the *gradient* is `1.6 Ω ÷ 40 °C = 0.04 Ω per °C`. Stretched to a 60 °C run it rises 2.4 Ω, and the gradient is still 0.04 Ω per °C.' },
    { kind: 'tri', name: 'Read a gradient', view: W2V, u: UW, L: { m: 0.02, c: 5 }, rx: [10, 50], tri: [10, 50], dotLab: true, post: { tri: true },
      rowsOf: ['run', 'rise', 'grad'], ask: { lab: 'Gradient', s: '?' }, head: HEAD_G, optKind: 'unit',
      task: 'Another example winding reads 5.2 Ω at 10 °C and 6.0 Ω at 50 °C. What is its gradient?',
      opts: ['50 °C per Ω', '0.02 Ω per °C', '0.12 Ω per °C'], want: '0.02 Ω per °C',
      vals: { '50 °C per Ω': [50, '°C per Ω'], '0.02 Ω per °C': [0.02, 'Ω per °C'], '0.12 Ω per °C': [0.12, 'Ω per °C'] },
      right: (d) => { const t = TRI(d); return [t.rise / t.run, perU(d.u, true)]; },
      slip: { '50 °C per Ω': (d, v) => { const t = TRI(d); return near(v[0], t.run / t.rise) && v[1] === perU(d.u, false); },
        '0.12 Ω per °C': (d, v) => { const x = d.rx[1]; return near(v[0], lf(d.L)(x) / x) && v[1] === perU(d.u, true); } },
      wrongDraw: { '0.12 Ω per °C': (d) => { const x = d.rx[1], y = lf(d.L)(x); return { seg: [[0, 0], [x, y]], text: fy(d.u, y) + ' Ω ÷ ' + fx(d.u, x) + ' °C' }; } },
      hint: 'Not quite. Divide the rise between the readings by the run between them.',
      hints: { '50 °C per Ω': 'Not quite. That is run ÷ rise, upside down. The gradient is rise ÷ run, in Ω per °C.',
        '0.12 Ω per °C': 'Not quite. `6.0 Ω ÷ 50 °C` measures from the origin, which this line misses. Use the rise between the two readings.' },
      why: 'The run is `50 − 10 = 40 °C` and the rise is `6.0 − 5.2 = 0.8 Ω`. Rise ÷ run is `0.8 Ω ÷ 40 °C = 0.02 Ω per °C`.' },
    { show: true, kind: 'tri', name: 'R at 0 °C', view: WIND, u: UW, L: W1, rx: [20, 40, 60, 80], lo: 20, hi: 80, tri: [40, 80], back: true, icpt: true,
      iName: '_R_ at 0 °C', rowsOf: ['c', 'law', 'slip'], drag: ['move', 'tip'], dur: 4.2,
      tl: { dots: 0.4, dstep: 0, line: 0.4, run: 0.6, rise: 0.6, back: 1.0, icpt: 2.0, r0: 2.5, r1: 2.9, r2: 3.3 },
      head: HEAD_C,
      text: 'Carry the line back past the first reading, dashed, to where _T_ is 0. There the `0.04_T_` part is 0, so the *intercept* _c_ is _R_ at 0 °C: `10.8 − 0.04 × 20 = 10.0 Ω`. Each reading includes that 10 Ω, so one reading ÷ its temperature is not the gradient.' },
    { kind: 'tri', name: 'Find R at 0 °C', view: W2V, u: UW, L: { m: 0.02, c: 5 }, rx: [10, 50], dotLab: true, post: { back: true, icpt: true },
      iName: '_R_ at 0 °C', rowsOf: ['c', 'law'], ask: { lab: '_R_ at 0 °C', s: '?' }, head: HEAD_C, optKind: 'unit',
      task: 'That winding gains 0.02 Ω per °C and reads 5.2 Ω at 10 °C. What is _R_ at 0 °C?',
      opts: ['5.2 Ω', '−250 °C', '5.0 Ω'], want: '5.0 Ω',
      vals: { '5.2 Ω': [5.2, 'Ω'], '−250 °C': [-250, '°C'], '5.0 Ω': [5, 'Ω'] },
      right: (d) => [cOf(d), d.u.yu],
      slip: { '5.2 Ω': (d, v) => near(v[0], lf(d.L)(d.rx[0])) && v[1] === d.u.yu, '−250 °C': (d, v) => near(v[0], -cOf(d) / d.L.m) && v[1] === d.u.xu },
      wrongDraw: { '5.2 Ω': (d) => { const x = d.rx[0], y = lf(d.L)(x); return { flat: [x, y], text: fy(d.u, y) + ' Ω is _R_ at ' + fx(d.u, x) + ' °C' }; } },
      hint: 'Not quite. Carry the line back from the reading at 10 °C to 0 °C.',
      hints: { '5.2 Ω': 'Not quite. 5.2 Ω is _R_ at 10 °C. Carry the line back 10 °C: `5.2 − 0.02 × 10`.',
        '−250 °C': 'Not quite. That is where the line would cross the _T_ axis. _R_ at 0 °C is where it crosses the _R_ axis.' },
      why: 'Carry the line back 10 °C from the reading at 10 °C. It falls `0.02 × 10 = 0.2 Ω`, so _R_ at 0 °C is `5.2 − 0.2 = 5.0 Ω`, and the law is `_R_ = 0.02_T_ + 5`.' },
    { show: true, kind: 'use', name: 'Both ways', view: WIND, u: UW, L: W1, rx: [20, 40, 60, 80], back: true, fwd: true, fw: 50, bk: 12.8, drag: ['pt'], dur: 4.0,
      tl: { dots: 0.4, dstep: 0, line: 0.4, g1: 0.9, r0: 1.7, g2: 2.2, r1: 3.0 },
      head: HEAD_U,
      text: 'A law works both ways. At 50 °C it gives `_R_ = 0.04 × 50 + 10 = 12.0 Ω`. A reading of 12.8 Ω means `12.8 − 10 = 0.04_T_`, so _T_ is 70 °C.' },
    { kind: 'use', name: 'How hot is it?', view: WIND, u: UW, L: W1, rx: [20, 40, 60, 80], back: true, fwd: true, bk: 13.6, ask: { lab: '_T_', s: '?' }, head: HEAD_U, optKind: 'unit',
      task: 'The first winding\'s law is `_R_ = 0.04_T_ + 10`. It reads 13.6 Ω. How hot is it?',
      opts: ['340 °C', '90 °C', '10.544 Ω'], want: '90 °C',
      vals: { '340 °C': [340, '°C'], '90 °C': [90, '°C'], '10.544 Ω': [10.544, 'Ω'] },
      right: (d) => [(d.bk - d.L.c) / d.L.m, d.u.xu],
      slip: { '340 °C': (d, v) => near(v[0], d.bk / d.L.m) && v[1] === d.u.xu, '10.544 Ω': (d, v) => near(v[0], d.L.m * d.bk + d.L.c) && v[1] === d.u.yu },
      hint: 'Not quite. Put the reading in for _R_ and solve for _T_.',
      hints: { '340 °C': 'Not quite. Take the 10 away first: `13.6 − 10 = 0.04_T_`.',
        '10.544 Ω': 'Not quite. 13.6 Ω is the reading, so it goes in for _R_, not _T_: `13.6 = 0.04_T_ + 10`.' },
      why: 'Put the reading in for _R_: `13.6 = 0.04_T_ + 10`. Take the 10 away: `3.6 = 0.04_T_`, so `_T_ = 3.6 ÷ 0.04 = 90 °C`. That is past the last reading, so it trusts the line to stay straight up there.' },
    { show: true, kind: 'two', name: 'Higher is not steeper', view: { x1: 100, y1: 16, xt: 20, yt: 2 }, u: UW,
      lines: [{ n: 'A', m: 0.02, c: 12 }, { n: 'B', m: 0.05, c: 8 }], a: 10, run: 40, amax: 30, drag: ['move', 'move2'], dur: 4.0,
      tl: { l0: 0.4, n0: 1.0, l1: 1.1, n1: 1.7, run: 1.9, rise: 2.3, r0: 2.4, r1: 2.9, r2: 3.4 },
      head: HEAD_H, rowsFn: rowsHigher,
      text: 'Height and steepness are different things. Example winding A sits above B everywhere from 0 to 100 °C, yet B gains 0.05 Ω per °C, 2.5 times as fast as A.' },
    { kind: 'two', name: 'Which is which?', view: { x1: 100, y1: 20, xt: 20, yt: 4 }, u: UW,
      lines: [{ n: 'C', m: 0.03, c: 15 }, { n: 'D', m: 0.06, c: 9 }], a: 10, run: 40, ask: { lab: 'Higher, steeper', s: '?' }, head: HEAD_H, rowsFn: rowsWhich, optKind: 'names',
      task: 'Two more example windings, C and D. Which sits higher, and which gains resistance faster as it warms?',
      opts: ['C higher, C steeper', 'C higher, D steeper', 'D higher, D steeper'], want: 'C higher, D steeper',
      vals: { 'C higher, C steeper': ['C', 'C'], 'C higher, D steeper': ['C', 'D'], 'D higher, D steeper': ['D', 'D'] },
      right: (d) => higherSteeper(d),
      slip: { 'C higher, C steeper': (d, v) => v[0] === higherSteeper(d)[0] && v[1] === v[0], 'D higher, D steeper': (d, v) => v[1] === higherSteeper(d)[1] && v[0] === v[1] },
      hint: 'Not quite. Height is where a line sits; steepness is how fast it climbs.',
      hints: { 'C higher, C steeper': 'Not quite. C sits higher, but D\'s line climbs more for each degree: 0.06 Ω per °C against 0.03.',
        'D higher, D steeper': 'Not quite. D climbs faster, but C sits above it everywhere from 0 to 100 °C: 18 Ω against 15 Ω at 100 °C.' },
      why: 'C sits higher: it reads 18 Ω at 100 °C to D\'s 15 Ω, and stays above D all the way along. D is steeper: it gains 0.06 Ω per °C, C only 0.03. Height and steepness are different things.' },
    { show: true, kind: 'swap', name: 'Swap the axes', IV: [[0.5, 6], [2, 24]], view: { x1: 4, y1: 40, xt: 1, yt: 10 }, v0: null, v1: { x1: 40, y1: 4, xt: 10, yt: 1 },
      u0: { xu: 'A', yu: 'V', xn: 'Current _I_ (A)', yn: 'Voltage _V_ (V)' }, u1: { xu: 'V', yu: 'A', xn: 'Voltage _V_ (V)', yn: 'Current _I_ (A)' }, dur: 4.8,
      tl: { dots: 0.4, dstep: 0.3, line: 1.0, run: 1.6, rise: 2.0, r0: 1.7, r1: 2.0, r2: 2.3, swap: 3.2 },
      head: HEAD_X,
      text: 'Plot an example resistor\'s voltage up the side against its current along, and the gradient is its resistance: `18 V ÷ 1.5 A = 12 V per A`, which is 12 Ω. Swap the axes and the gradient flips to amps per volt, which is not the resistance. Read the axis labels before you name a gradient.' },
    { kind: 'tri', name: 'Current up the side', view: { x1: 40, y1: 2, xt: 10, yt: 0.5 }, u: { xu: 'V', yu: 'A', xv: 'V', yv: 'I', xn: 'Voltage _V_ (V)', yn: 'Current _I_ (A)' },
      L: { m: 0.05, c: 0 }, rx: [10, 30], tri: [10, 30], dotLab: true, post: { tri: true }, rowsOf: ['run', 'rise', 'grad', 'res'], ask: { lab: 'Resistance', s: '?' }, head: HEAD_X, optKind: 'unit',
      task: 'Here an example resistor\'s current is up the side and its voltage along. What is its resistance?',
      opts: ['0.05 A per V', '0.05 Ω', '20 Ω'], want: '20 Ω',
      vals: { '0.05 A per V': [0.05, 'A per V'], '0.05 Ω': [0.05, 'Ω'], '20 Ω': [20, 'Ω'] },
      right: (d) => { const t = TRI(d); return [t.run / t.rise, 'Ω']; },
      slip: { '0.05 A per V': (d, v) => { const t = TRI(d); return near(v[0], t.rise / t.run) && v[1] === perU(d.u, true); },
        '0.05 Ω': (d, v) => { const t = TRI(d); return near(v[0], t.rise / t.run) && v[1] === 'Ω'; } },
      hint: 'Not quite. Resistance is volts per amp. Read the axis labels first.',
      hints: { '0.05 A per V': 'Not quite. That is the gradient, in amps per volt. The resistance is volts per amp, so here it is the run ÷ the rise.',

      ['Gradient with units', ['Run: 80 − 20 = 60 °C', 'Rise: 13.2 − 10.8 = 2.4 Ω', 'Gradient: 2.4 Ω ÷ 60 °C = 0.04 Ω per °C', 'Law so far: R = 0.04T + c']],
      ['Read a gradient', ['Run: 50 − 10 = 40 °C', 'Rise: 6.0 − 5.2 = 0.8 Ω', 'Gradient: 0.8 Ω ÷ 40 °C = 0.02 Ω per °C']],
      ['R at 0 °C', ['c = R at 0 °C: 10.8 − 0.04 × 20 = 10.0 Ω', 'Law: R = 0.04T + 10', 'One reading ÷ its T: 10.8 ÷ 20 = 0.54, 13.2 ÷ 80 = 0.165, not the gradient']],
      ['Find R at 0 °C', ['c = R at 0 °C: 5.2 − 0.02 × 10 = 5.0 Ω', 'Law: R = 0.02T + 5']],
      ['Both ways', ['At 50 °C: R = 0.04 × 50 + 10 = 12.0 Ω', 'Reading 12.8 Ω: 12.8 − 10 = 0.04T, so T = 2.8 ÷ 0.04 = 70 °C']],
      ['How hot is it?', ['Reading 13.6 Ω: 13.6 − 10 = 0.04T, so T = 3.6 ÷ 0.04 = 90 °C']],
      ['Higher is not steeper', ['Same run, 40 °C: A rises 0.8 Ω, B rises 2.0 Ω', 'B climbs 0.05 ÷ 0.02 = 2.5 times as fast as A', 'Yet A sits higher: 14 Ω against 13 Ω at 100 °C']],
      ['Which is which?', ['C: R = 0.03T + 15, 0.03 Ω per °C', 'D: R = 0.06T + 9, 0.06 Ω per °C', 'At 100 °C: C reads 18 Ω, D 15 Ω']],
      ['Swap the axes', ['Run: 24 − 6 = 18 V', 'Rise: 2 − 0.5 = 1.5 A', 'Gradient: 1.5 A ÷ 18 V ≈ 0.083 A per V, not the resistance']],
      ['Current up the side', ['Run: 30 − 10 = 20 V', 'Rise: 1.5 − 0.5 = 1 A', 'Gradient: 1 A ÷ 20 V = 0.05 A per V', 'Resistance: 20 V ÷ 1 A = 20 Ω']],
      ['A spring', ['Run: 12 − 4 = 8 mm', 'Rise: 30 − 10 = 20 N', 'Gradient: 20 N ÷ 8 mm = 2.5 N per mm']],
      ['A lifting machine', ['Run: 300 − 100 = 200 N', 'Rise: 46 − 22 = 24 N', 'Gradient a: 24 N ÷ 200 N = 0.12 N of effort per N of load', 'b = E at no load: 22 − 0.12 × 100 = 10 N', 'Law: E = 0.12W + 10']],
    ];
    const ok = TABLE.length === STEPS.length && TABLE.every((r) => { const g = shown(idx(r[0])); return g.rows.length === r[1].length && g.rows.every((s, n) => s === r[1][n]); });
    const mid = drawn(I0, blank(), 3.3).rows.join(' | '), back = swapped0().rows.join(' | '), dr = drawn(I4, withDr(I4, { t: 30 })).rows.join(' | ');
    return ok && mid === 'Run: 60 − 20 = 40 °C | Rise: 12.4 − 10.8 = 1.6 Ω | Gradient: 1.6 Ω ÷ 40 °C = 0.04 Ω per °C | Law so far: R = 0.04T + c' &&
      back === 'Run: 2 − 0.5 = 1.5 A | Rise: 24 − 6 = 18 V | Gradient: 18 V ÷ 1.5 A = 12 V per A, which is 12 Ω' &&
      dr === 'At 30 °C: R = 0.04 × 30 + 10 = 11.2 Ω | Reading 11.2 Ω: 11.2 − 10 = 0.04T, so T = 1.2 ÷ 0.04 = 30 °C';
  });
  K.check('Before an answer a puzzle keeps back its working, triangles, intercept and guides; a right answer or Why? draws them; each wrong pick has a hint of its own, and a slip that can be drawn is drawn dashed', () => DO.every((i) => {
    const d = STEPS[i], post = d.post || {}, g0 = drawn(i, blank()), g1 = drawn(i, solvedSt(i)), g2 = drawn(i, Object.assign(blank(), { why: true }));
    const kept = g0.tris.length === 0 && !g0.icpt && g0.guides.length === 0 && g0.rows.length === 1 && /\?$/.test(g0.rows[0]);
    const opens = [g1, g2].every((g) => g.rows.length >= 1 && g.rows.every((r) => r.indexOf('?') < 0) &&
      (post.tri || d.kind === 'two' ? g.tris.length >= 1 : true) && (post.icpt ? !!g.icpt : true) && (d.kind === 'use' ? g.guides.length === 1 : true));
    const wrongs = d.opts.every((o) => o === d.want || (!!d.hints[o] && d.hints[o] !== d.hint &&
      (!(d.wrongDraw && d.wrongDraw[o]) || !!drawn(i, Object.assign(blank(), { pick: o, res: 'wrong' })).wrong)));
    return kept && opens && wrongs;
  }));
  K.check('Every answer offered is written from its own numbers; the right one is worked from the puzzle\'s own readings, and each wrong one is a real slip: run over rise, one reading divided by its own x, a reading taken as the intercept, the other axis\'s crossing, the reading put in for the wrong letter, the intercept not taken away, height taken for steepness, the gradient named as the resistance, or the units turned round', () => DO.every((i) => {
    const d = STEPS[i], R = d.right(d);
    const eq = (a, b) => a.length === b.length && a.every((x, k) => (typeof x === 'number' ? near(x, b[k]) : x === b[k]));
    const text = (o) => {
      const v = d.vals[o];
      if (d.optKind === 'names') return o === v[0] + ' higher, ' + v[1] + ' steeper';
      if (d.optKind === 'law') return o === strip(lawStr(d.u, v[0], v[1]));
      return o.endsWith(' ' + v[1]) && near(parseFloat(o.replace('−', '-')), v[0]);
    };
    return d.opts.length === 3 && d.opts.indexOf(d.want) >= 0 && d.opts.every(text) && eq(d.vals[d.want], R) &&
      d.opts.every((o) => o === d.want || (!eq(d.vals[o], R) && !!d.slip[o] && d.slip[o](d, d.vals[o])));
  }));
  K.check('Height and steepness are different things: A sits above B, and C above D, all the way along their graphs, yet over the same run the lower line\'s triangle rises further, wherever the triangles are dragged', () => {
    const ok = [I6, I7].every((i) => {
      const d = STEPS[i], P = d.lines[0], Q = d.lines[1], g = shown(i);
      return K.linspace(0, d.view.x1, 21).every((x) => lf(P)(x) > lf(Q)(x)) && Q.m > P.m && g.tris.length === 2 && near(g.tris[0].run, g.tris[1].run) && g.tris[1].rise > g.tris[0].rise;
    });
    return ok && [0, 10, 20, 30].every((a) => { const g = drawn(I6, withDr(I6, { a })); return g.tris.length === 2 && g.tris.every((t) => t.xa === a && near(t.run, 40)); });
  });
  K.check('Swapping the axes carries each reading from its place with current along to its place with voltage along, and turns the gradient upside down, from volts per amp to amps per volt', () => {
    const d = STEPS[I8], PH = geo(d.v0).PH;
    const placed = (g, o) => g.dots.length === 2 && g.dots.every((p) => {
      const n = o ? [p.V / d.v1.x1, p.I / d.v1.y1] : [p.I / d.v0.x1, p.V / d.v0.y1];
      return near(p.X, ML + n[0] * PW, 1e-6) && near(p.Y, MT + PH - n[1] * PH, 1e-6);
    });
    const before = drawn(I8, blank(), 2.9), mid = drawn(I8, blank(), 3.9), after = drawn(I8, blank()), back = swapped0();
    return placed(before, 0) && placed(after, 1) && placed(back, 0) && mid.dots.length === 2 && !placed(mid, 0) && !placed(mid, 1) &&
      after.tris.length === 1 && back.tris.length === 1 && near(after.grads[0].g * back.grads[0].g, 1);
  });
  K.check('The line is solid only between the first and last readings; carried back towards 0, or on past the readings, it is dashed, and a key in the drawing says what the dashes mean', () => STEPS.every((d, i) => {
    if (!d.rx) return true;
    const g = shown(i), x0 = d.rx[0], xN = d.rx[d.rx.length - 1], solid = g.lines.filter((l) => !l.dash), dash = g.lines.filter((l) => l.dash);
    return solid.length === 1 && solid[0].x0 === x0 && solid[0].x1 === xN && dash.every((l) => l.x1 <= x0 + 1e-9 || l.x0 >= xN - 1e-9) && (dash.length === 0 || g.key);
  }));
  K.check('Read both ways, the law\'s guides land where its rule says: up from 50 °C and across to 12.0 Ω, across from 12.8 Ω and down to 70 °C, and across from 13.6 Ω and down to 90 °C', () => {
    const g4 = shown(I4), g5 = shown(idx('How hot is it?'));
    return g4.guides.length === 2 && near(g4.guides[0].y, 12) && near(g4.guides[1].x, 70) && g4.marks.indexOf('12.0') >= 0 && g4.marks.indexOf('70') >= 0 &&
      g5.guides.length === 1 && near(g5.guides[0].x, 90) && g5.marks.indexOf('90') >= 0;
  });
  K.check('Every demonstration has finished arriving within its 2.8 to 5 s, none starting before the 0.35 s screen fade ends; a puzzle\'s drawing finishes within 2.5 s', () => {
    const keepT = T;
    const timed = (i, st, limit) => {
      const keepS = S[i];
      T = Infinity; latest = 0; earliest = Infinity; S[i] = st;
      try { paint(i); } finally { S[i] = keepS; }
      return latest <= limit + 1e-9;
    };
    const ok = STEPS.every((d, i) => (d.show ? timed(i, blank(), d.dur) && d.dur >= 2.8 && d.dur <= 5 && earliest >= FADE
      : timed(i, solvedSt(i), FB) && timed(i, Object.assign(blank(), { why: true }), FB)));
    T = keepT; paint();
    return ok && FB <= 2.5;
  });

  K.ready();
</script>
