<style>
  [hidden] { display: none !important; }
  .pz, .lead, .caption { max-width: 30rem; }
  .pz > * + *, #stepbox > * + * { margin-top: 14px; }
  /* The stepper is the page's step control: its dots are the progress bar; Back and Continue are below. */
  .pz .k-stepper { gap: 0; }
  .pz .k-stepper .k-label, .pz .k-stepper-nav { display: none; }
  .pz .count { margin-top: 10px; }
  .task { font-size: 1.2rem; font-weight: 700; line-height: 1.5; margin-top: 4px; }
  .task.show { font-size: 1.12rem; font-weight: 400; line-height: 1.6; }
  .nw { white-space: nowrap; }
  .v { font-style: italic; }
  /* The working under the grid: the rule, the method in one line, then the rows as they fill in. */
  .ro { border-left: 3px solid var(--k-accent2); padding: 4px 0 4px 12px; }
  .ro p { margin: 0; }
  .ro .rule { font-weight: 700; line-height: 1.5; }
  .ro .ronote { color: var(--k-muted); font-size: .9rem; line-height: 1.45; }
  .ro .wk { line-height: 1.55; min-height: 1.55em; margin-top: 4px; }
  #rows { position: relative; }
  .ro .wk.ph { position: absolute; top: 0; left: 0; }
  .ro .wk .lab { color: var(--k-muted); font-weight: 700; }
  .ro .pc { white-space: nowrap; }
  .ro .pc.end { font-weight: 700; color: var(--k-accent2); }
  .ro .pc.q { color: var(--k-muted); }
  .scene { display: block; width: 100%; max-width: 22rem; margin-inline: auto; touch-action: pan-y; }
  .scene.grab { touch-action: none; }
  /* The squared grid, its axes and their numbers. */
  .scene .gl { stroke: var(--k-line); stroke-width: 1; }
  .scene .ax { stroke: var(--k-strong); stroke-width: 1.5; }
  .scene .tk { font: 400 13px var(--k-font); fill: var(--k-muted); }
  .scene .at { font: 600 13px var(--k-font); fill: var(--k-muted); }
  /* The line (navy), the faint fan of lines it could be, a given line, its sliding copy, and a wrong pick (red, dashed). */
  .scene .ln { stroke: var(--k-accent2); stroke-width: 2.5; stroke-linecap: round; fill: none; }
  .scene .fan { stroke: var(--k-accent2); stroke-opacity: .3; stroke-width: 1.5; stroke-linecap: round; fill: none; }
  .scene .gv { stroke: var(--k-muted); stroke-width: 2; stroke-linecap: round; fill: none; }
  .scene .gh { stroke: var(--k-muted); stroke-width: 2.2; stroke-dasharray: 6 5; fill: none; }
  .scene .wrl { stroke: var(--k-warn); stroke-width: 2.4; stroke-dasharray: 7 5; fill: none; }
  /* The step: 1 along and m up or down from a pin, or the run and the rise between two points. */
  .scene .tri { fill: var(--k-accent2); fill-opacity: .07; stroke: none; }
  .scene .sh { stroke: var(--k-accent2); stroke-width: 2.5; stroke-linecap: round; fill: none; }
  .scene .hd { fill: var(--k-accent2); stroke: none; }
  /* The round c dot, the m handle, a pin (a ring with a centre), a point read off a graph (teal). */
  .scene .pt { fill: var(--k-accent2); stroke: var(--k-bg); stroke-width: 2; }
  .scene .mh { fill: var(--k-accent2); stroke: var(--k-bg); stroke-width: 2; }
  .scene .pin { fill: var(--k-bg); stroke: var(--k-accent2); stroke-width: 3; }
  .scene .pinc { fill: var(--k-accent2); stroke: none; }
  .scene .rd { fill: var(--k-accent); stroke: var(--k-bg); stroke-width: 2; }
  /* A faint ring marks whatever can be dragged. */
  .scene .ring { fill: none; stroke: var(--k-accent2); stroke-opacity: .4; stroke-width: 1.5; }
  /* Labels carry a halo of the page colour, so a line passing behind one never strikes through it. */
  .scene .lab { font: 700 14px var(--k-font); fill: var(--k-ink); paint-order: stroke; stroke: var(--k-bg); stroke-width: 4px; stroke-linejoin: round; }
  .scene .lab.nv { fill: var(--k-accent2); }
  .scene .lab.tl { fill: var(--k-accent); }
  .scene .lab.mu { fill: var(--k-muted); font-weight: 600; }
  .scene .lab.wt { fill: var(--k-warn); }
  .scene .v { font-style: italic; }
  .scene #art *, .scene #labs * { pointer-events: none; }
  .scene .grip { fill: var(--k-bg); fill-opacity: 0; stroke: none; cursor: grab; touch-action: none; }
  .scene .grip:active { cursor: grabbing; }
  .scene .grip:focus { outline: none; }
  .scene .grip:focus-visible { stroke: var(--k-accent); stroke-width: 3; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  .row .k-btn { flex: 1 1 7rem; }
  .replay { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 10px; }
  .replay .k-btn { flex: 0 0 auto; min-height: 44px; padding-left: 16px; padding-right: 16px; font-size: .95rem; white-space: nowrap; }
  /* The answers stay on one row, each label whole; longer ones stack one to a row. */
  .row.picks { flex-wrap: nowrap; }
  .picks .k-btn { font-size: 1.15rem; min-height: 56px; flex: 1 1 0; min-width: 0; white-space: nowrap; padding-inline: 6px; }
  .row.picks.long { flex-direction: column; gap: 8px; }
  .picks.long .k-btn { flex: 0 0 auto; width: 100%; min-height: 48px; }
  .picks .k-btn[aria-pressed="true"] { background: var(--k-accent2); color: var(--k-on-accent2); border-color: var(--k-accent2); }
  .fb { font-weight: 700; min-height: 1.5em; margin-top: 10px; }
  .pz.ask .fb:empty { min-height: 0; }
  .fb.right { color: var(--k-good); }
  .fb.wrong { color: var(--k-ink); }
  .why { line-height: 1.6; }
  .done { line-height: 1.6; }
  .done strong { color: var(--k-accent2); }
  .done .row { margin-top: 14px; }
  /* Each new screen settles in softly: its words and picture fade in and rise 4 px. */
  #stepbox.enter, #done.enter { animation: screen-in .35s ease-out both; }
  @keyframes screen-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  html.k-testing #stepbox.enter, html.k-testing #done.enter { animation: none; }
  @media (prefers-reduced-motion: reduce) { #stepbox.enter, #done.enter { animation: none; } }
</style>

<p class="lead">Pins hold a line at example points on a squared grid, and the working for its rule fills in under the grid.</p>

<div class="pz" id="pz">

  <div id="stepbox">
    <p class="k-label count" id="count"></p>
    <p class="task" id="task"></p>
    <svg class="scene" id="scene" viewBox="0 0 340 360" width="100%" role="img" aria-label=""><g id="art"></g><g id="labs"></g><g id="ui"></g></svg>

      <p class="rule" id="rule"></p>
      <p class="ronote" id="ronote"></p>

<p class="caption">A faint ring marks whatever you can drag. Pins snap to whole numbers, m to halves.</p>

<script>
  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // kind 'pin': a point and a gradient (P1, m); 'two': two points (pts, sub: which one is put in for c);
  // 'par': parallel to a given line through a pin; 'graph': a line drawn with no rule, read at two exact points.
  // tl: when each part of a demonstration arrives (seconds). A puzzle: its options and their [m, c] (vals),
  // want, each wrong option's slip (a test on its value, worked from the puzzle's own numbers) and its own hint.
  const PICK = 'Tap one of the answers.';
  const RULE = '`y = mx + c`';
  const NOTE = 'Get `m` first, then put one point\'s x and y into the rule and solve for `c`.';
  const NOTE_P = 'A parallel line has the same `m`, so only `c` changes.';
  const NOTE_G = 'Read `c` where the line crosses the y-axis, and `m` from two points it passes through exactly.';
  const SQ = (x0, x1, y0, y1, hmax) => ({ x0, x1, y0, y1, hmax: hmax || 300 });
  const MMAX = 4;                                                  // the m handle turns the line no steeper than 4 for each 1 along
  const FANA = [-75, -60, -45, -30, -15, 0, 15, 30, 45, 60, 75];   // the tilts (degrees) of the fan's lines
  const same = (a, b, tol) => {
    const t = tol == null ? 1e-9 : tol;
    return Array.isArray(a) ? Array.isArray(b) && a.length === b.length && a.every((x, n) => Math.abs(x - b[n]) <= t) : !Array.isArray(b) && Math.abs(a - b) <= t;
  };
  const TL_PIN = { sweep: 0.4, swept: 1.8, close: 1.9, closed: 2.6, step: 2.5, mlab: 3.2, r0: 2.5, r1: 2.8, r2: 3.3, cdot: 3.3, r3: 3.6, r4: 3.9 };
  const TL_TWO = { fan: 0.4, p2: 1.0, close: 1.3, closed: 1.9, run: 1.8, rise: 2.2, r0: 2.3, r1: 2.9, r2: 3.3, cdot: 3.3, r3: 3.6, r4: 3.9 };
  const STEPS = [
    { show: true, kind: 'pin', name: 'One pin', view: SQ(-2, 6, -2, 10), P1: [2, 5], m: 3, slipRow: true, drag: ['p1', 'm'], dur: 4.6, tl: TL_PIN,
      text: 'A pin at (2, 5) lets the line swing to any tilt, leaving a fan of lines it could be. Set `m = 3` and the fan closes to one line, `y = 3x + c`. The pin must fit that rule, so put its x and y in, *substituting* them, and solve for c.' },
    { kind: 'pin', name: 'Through a point', view: SQ(-3, 4, -2, 9), P1: [1, 4], m: 2,
      opts: ['y = 2x + 4', 'y = 2x + 2', 'y = 2x + 6'], vals: { 'y = 2x + 4': [2, 4], 'y = 2x + 2': [2, 2], 'y = 2x + 6': [2, 6] }, want: 'y = 2x + 2',
      slip: { 'y = 2x + 4': (d, v) => same(v, [d.m, d.P1[1]]), 'y = 2x + 6': (d, v) => same(v, [d.m, d.P1[1] + d.m * d.P1[0]]) },
      task: 'A line goes through (1, 4) with gradient 2. Which is its rule?',
      why: 'The gradient is 2, so the rule is `y = 2x + c`. Put (1, 4) in: `4 = 2 × 1 + c`, so `4 = 2 + c`, and `c = 4 − 2 = 2`. The rule is `y = 2x + 2`.',
      hint: 'Not quite. Put the point\'s x and y into `y = 2x + c` and solve for c.',
      hints: { 'y = 2x + 4': 'Not quite. 4 is the point\'s y, which is c only on the y-axis. Put (1, 4) in: `4 = 2 × 1 + c`.', 'y = 2x + 6': 'Not quite. `4 = 2 + c`, so take the 2 away: `c = 4 − 2`.' } },
    { show: true, kind: 'pin', name: 'A falling line', view: SQ(-1, 5, -2, 9), P1: [3, 1], m: -2, drag: ['p1', 'm'], dur: 4.6, tl: TL_PIN,
      text: 'With a falling line, keep the minus in m. Through (3, 1) with `m = −2`, the pin gives `1 = −6 + c`, so `c = 7`, and putting the point back in checks it.' },
    { kind: 'pin', name: 'Keep the minus', view: SQ(-2, 4, -7, 6, 320), P1: [2, -1], m: -3,
      opts: ['y = −3x − 7', 'y = 3x − 7', 'y = −3x + 5'], vals: { 'y = −3x − 7': [-3, -7], 'y = 3x − 7': [3, -7], 'y = −3x + 5': [-3, 5] }, want: 'y = −3x + 5',
      slip: { 'y = −3x − 7': (d, v) => same(v, [d.m, d.P1[1] + d.m * d.P1[0]]), 'y = 3x − 7': (d, v) => same(v, [-d.m, d.P1[1] - -d.m * d.P1[0]]) },
      task: 'A line goes through (2, −1) with gradient −3. Which is its rule?',
      why: 'The gradient is −3, so `y = −3x + c`. Put (2, −1) in: `−1 = −3 × 2 + c`, so `−1 = −6 + c`, and `c = −1 + 6 = 5`. The rule is `y = −3x + 5`.',
      hint: 'Not quite. Put the point\'s x and y into `y = −3x + c` and solve for c.',
      hints: { 'y = −3x − 7': 'Not quite. `−1 = −6 + c`, so add the 6: `c = −1 + 6`.', 'y = 3x − 7': 'Not quite. The gradient is −3, so the line falls. Keep the minus in m.' } },
    { show: true, kind: 'two', name: 'Two pins', view: SQ(-1, 6, -1, 10), pts: [[1, 3], [4, 9]], names: ['A', 'B'], drag: ['p1', 'p2'], dur: 4.6, tl: TL_TWO,
      text: 'A second pin locks the line, as two points have only one gradient between them. The step from A to B gives m first, then A gives c, and B makes a free check.' },
    { kind: 'two', name: 'From two points', view: SQ(-1, 6, -4, 8), pts: [[2, 1], [5, 7]],
      opts: ['y = 2x + 1', 'y = 2x − 3', 'y = 0.5x'], vals: { 'y = 2x + 1': [2, 1], 'y = 2x − 3': [2, -3], 'y = 0.5x': [0.5, 0] }, want: 'y = 2x − 3',
      slip: { 'y = 0.5x': (d, v) => { const a = d.pts[0], b = d.pts[1], m2 = (b[0] - a[0]) / (b[1] - a[1]); return same(v, [m2, a[1] - m2 * a[0]]); },
        'y = 2x + 1': (d, v) => { const a = d.pts[0], b = d.pts[1]; return same(v, [(b[1] - a[1]) / (b[0] - a[0]), a[1]]); } },
      task: 'Which rule goes through (2, 1) and (5, 7)?',
      why: '`m = (7 − 1) ÷ (5 − 2) = 6 ÷ 3 = 2`. Put (2, 1) in: `1 = 2 × 2 + c`, so `1 = 4 + c`, and `c = −3`. The rule is `y = 2x − 3`, and (5, 7) checks: `2 × 5 − 3 = 7`.',
      hint: 'Not quite. Get m first, rise ÷ run, then put one point in to find c.',
      hints: { 'y = 0.5x': 'Not quite. That is run ÷ rise, upside down. m is rise ÷ run: `6 ÷ 3 = 2`.', 'y = 2x + 1': 'Not quite. 1 is the first point\'s y, not c. Put (2, 1) in: `1 = 2 × 2 + c`.' } },
    { show: true, kind: 'two', name: 'Brackets', view: SQ(-2, 4, -4, 6), pts: [[-1, 5], [3, -3]], drag: ['p1', 'p2'], dur: 4.6, tl: TL_TWO,
      text: 'Put brackets round negative coordinates: the run from −1 to 3 is `3 − (−1) = 4`. With a rise of −8, `m = −2`, and the pin at (−1, 5) gives c.' },
    { kind: 'two', name: 'Mind the brackets', view: SQ(-3, 3, -1, 9), pts: [[-2, 1], [1, 7]], sub: 1, subNote: 'no minus signs',
      opts: ['y = 2x + 5', 'y = −6x + 13', 'y = 2x − 3'], vals: { 'y = 2x + 5': [2, 5], 'y = −6x + 13': [-6, 13], 'y = 2x − 3': [2, -3] }, want: 'y = 2x + 5',
      slip: { 'y = −6x + 13': (d, v) => { const a = d.pts[0], b = d.pts[1], m2 = (b[1] - a[1]) / (b[0] + a[0]); return same(v, [m2, b[1] - m2 * b[0]]); },
        'y = 2x − 3': (d, v) => { const a = d.pts[0], b = d.pts[1], m = (b[1] - a[1]) / (b[0] - a[0]); return same(v, [m, a[1] - m * -a[0]]); } },
      task: 'Which rule goes through (−2, 1) and (1, 7)?',
      why: '`m = (7 − 1) ÷ (1 − (−2)) = 6 ÷ 3 = 2`. Either point works, and (1, 7) has no minus signs, so it is the easier one to put in: `7 = 2 × 1 + c`, so `7 = 2 + c`, and `c = 5`. The rule is `y = 2x + 5`, and (−2, 1) checks: `2 × (−2) + 5 = 1`.',
      hint: 'Not quite. Put brackets round the negative x, get m, then c.',
      hints: { 'y = −6x + 13': 'Not quite. The brackets were dropped. The run is `1 − (−2) = 3`, not −1.', 'y = 2x − 3': 'Not quite. The minus on −2 was lost: `2 × (−2)` is −4, not 4.' } },
    { show: true, kind: 'par', name: 'Same m', view: SQ(-2, 5, -5, 8, 320), given: { m: 2, c: 1 }, P1: [3, 2], drag: ['p1'], dur: 4.0, note: NOTE_P,
      tl: { ghost: 0.5, slide: 1.0, slid: 2.3, land: 2.3, r0: 0.6, r1: 2.6, r2: 3.2, cdot: 3.2, r3: 3.5 },
      text: 'A line *parallel* to `y = 2x + 1` has the same m, so only c changes. A copy slides with the same tilt until it passes through the pin at (3, 2), and the pin gives c.' },
    { kind: 'par', name: 'Parallel', view: SQ(-2, 4, -3, 10, 320), given: { m: -3, c: 4 }, P1: [1, 5], note: NOTE_P,
      opts: ['y = −3x + 5', 'y = −3x + 4', 'y = −3x + 8'], vals: { 'y = −3x + 5': [-3, 5], 'y = −3x + 4': [-3, 4], 'y = −3x + 8': [-3, 8] }, want: 'y = −3x + 8',
      slip: { 'y = −3x + 4': (d, v) => same(v, [d.given.m, d.given.c]), 'y = −3x + 5': (d, v) => same(v, [d.given.m, d.P1[1]]) },
      task: 'Which line is parallel to `y = −3x + 4` and goes through (1, 5)?',
      why: 'A parallel line keeps `m = −3`, so `y = −3x + c`. Put (1, 5) in: `5 = −3 × 1 + c`, so `5 = −3 + c`, and `c = 5 + 3 = 8`. The rule is `y = −3x + 8`.',
      hint: 'Not quite. Keep the given m, then put (1, 5) in to find the new c.',
      hints: { 'y = −3x + 4': 'Not quite. That keeps the old c: `−3 × 1 + 4 = 1`, not 5, so it misses the pin.', 'y = −3x + 5': 'Not quite. 5 is the pin\'s y, which is c only on the y-axis. Put (1, 5) in: `5 = −3 × 1 + c`.' } },
    { show: true, kind: 'graph', name: 'Read a graph', view: SQ(-2, 5, -5, 8, 320), pts: [[0, -2], [3, 4]], drag: ['p2'], dur: 4.0, note: NOTE_G,
      tl: { p1: 0.5, p2: 1.0, r0: 1.2, run: 1.5, rise: 2.0, r1: 2.4, r2: 3.1, cdot: 3.1, r3: 3.5 },
      text: 'This line comes with no rule. Read two points where it crosses grid lines exactly, here (0, −2) and (3, 4), as anywhere else you could only estimate. The step between them gives m, and (0, −2) on the y-axis gives c.' },
    { kind: 'graph', name: 'Graph to rule', view: SQ(-1, 7, -2, 5), pts: [[0, 3], [6, 0]], note: NOTE_G,
      opts: ['y = −2x + 3', 'y = −0.5x + 6', 'y = −0.5x + 3'], vals: { 'y = −2x + 3': [-2, 3], 'y = −0.5x + 6': [-0.5, 6], 'y = −0.5x + 3': [-0.5, 3] }, want: 'y = −0.5x + 3',
      slip: { 'y = −0.5x + 6': (d, v) => { const R = ruleOf(d); return same(v, [R.m, -R.c / R.m]); }, 'y = −2x + 3': (d, v) => { const R = ruleOf(d); return same(v, [1 / R.m, R.c]); } },
      task: 'Which rule fits the line drawn?',
      why: 'The line passes exactly through (0, 3) and (6, 0). `m = (0 − 3) ÷ (6 − 0) = −3 ÷ 6 = −0.5`, and (0, 3) is on the y-axis, so `c = 3`. The rule is `y = −0.5x + 3`.',
      hint: 'Not quite. Read c where the line crosses the y-axis, and m from two points it passes through exactly.',
      hints: { 'y = −0.5x + 6': 'Not quite. 6 is where the line crosses the x-axis. c is where it crosses the y-axis, at `x = 0`.', 'y = −2x + 3': 'Not quite. That is run ÷ rise, upside down. m is rise ÷ run: `−3 ÷ 6`.' } },
    { kind: 'two', name: 'Two more points', view: SQ(-2, 4, -3, 8), pts: [[0, -1], [2, 5]],
      opts: ['y = 3x + 5', 'y = 3x − 1', 'y = 2x − 1'], vals: { 'y = 3x + 5': [3, 5], 'y = 3x − 1': [3, -1], 'y = 2x − 1': [2, -1] }, want: 'y = 3x − 1',
      slip: { 'y = 2x − 1': (d, v) => { const a = d.pts[0], b = d.pts[1], m2 = (b[1] + a[1]) / (b[0] - a[0]); return same(v, [m2, a[1] - m2 * a[0]]); },
        'y = 3x + 5': (d, v) => { const a = d.pts[0], b = d.pts[1]; return same(v, [(b[1] - a[1]) / (b[0] - a[0]), b[1]]); } },
      task: 'Last one. Which rule goes through (0, −1) and (2, 5)?',
      why: '`m = (5 − (−1)) ÷ (2 − 0) = 6 ÷ 2 = 3`. (0, −1) is on the y-axis, so `c = −1` straight away. The rule is `y = 3x − 1`, and (2, 5) checks: `3 × 2 − 1 = 5`.',

      hints: { 'y = 2x − 1': 'Not quite. The brackets were dropped. The rise is `5 − (−1) = 6`, not 4.', 'y = 3x + 5': 'Not quite. 5 is the later point\'s y. (0, −1) is on the y-axis, so `c = −1`.' } },
  ];
  const FINISH = 'One point and a gradient, or two different points, pin down exactly one straight line. Get m first, from the gradient you are given or from two points, then put one point\'s x and y into `y = mx + c` and solve for c.';
  // Sources the checks restate (the lesson's own).
  const SRC_KA = 'https://www.khanacademy.org/math/algebra/x2f8bb11595b61c86:forms-of-linear-equations/x2f8bb11595b61c86:intro-to-slope-intercept-form/v/equation-of-a-line-3';
  const SRC_N5 = 'https://www.bbc.co.uk/bitesize/guides/z24qcj6/revision/1';
  const SRC_M3 = 'https://www.bbc.co.uk/bitesize/articles/zjbf9ty';
  const SRC_V = 'https://www.bbc.co.uk/bitesize/guides/z8383k7/revision/3';
  // Margins round the grid (numbers left and below, axis names above and below).
  const ML = 36, MR = 8, MT = 28, W = 340 - ML - MR;
  const FB = 2.4;     // seconds a puzzle's drawing takes after a right answer or Why?
  const FADE = 0.35;
  const GAP = 0.25;   // seconds between the pieces of one row of working

    if (st.dr && same(o.P1, st.dr.P1) && (!o.P2 || same(o.P2, st.dr.P2)) && o.m === st.dr.m) return;
    st.dr = o;
    if (anim.playing()) anim.pause();
    T = Infinity;
    K.reveal(); K.refresh();
  }
  function svgPt(e) {
    const mtx = svg.getScreenCTM();
    if (!mtx) return null;
    return new DOMPoint(e.clientX, e.clientY).matrixTransform(mtx.inverse());
  }
  let held = null;
  grips.forEach((g, k) => {
    g.addEventListener('pointerdown', (e) => {
      if (!canDrag(STEPS[at()])) return;
      const q = svgPt(e);
      if (!q) return;
      // The nearest live handle to the touch takes it (the pin and the m handle sit close together).
      let best = null, bd = Infinity;
      LIVE.forEach((h) => { const dd = Math.hypot(h.x - q.x, h.y - q.y); if (dd < bd) { bd = dd; best = h.n; } });
      if (!best) return;
      held = { id: e.pointerId, n: best };
      try { g.setPointerCapture(e.pointerId); } catch (err) { /* the drag still follows while the pointer stays on the handle */ }
      e.preventDefault();
    });
    g.addEventListener('pointermove', (e) => {
      if (!held || held.id !== e.pointerId) return;
      e.preventDefault();
      const q = svgPt(e);
      if (q) setHandle(held.n, geo(STEPS[at()]).inv(q.x, q.y));
    });
    const letGo = (e) => { if (held && held.id === e.pointerId) held = null; };
    g.addEventListener('pointerup', letGo);
    g.addEventListener('pointercancel', letGo);
    g.addEventListener('lostpointercapture', letGo);
    g.addEventListener('keydown', (e) => {
      const d = STEPS[at()], st = S[at()], n = HN[k];
      const by = { ArrowRight: [1, 0], ArrowLeft: [-1, 0], ArrowUp: [0, 1], ArrowDown: [0, -1] }[e.key];
      if (!canDrag(d) || !by) return;
      e.preventDefault();
      const cur = st.dr || startDr(d);
      if (n === 'm') { if (by[1]) setHandle('m', [0, cur.P1[1] + cur.m + by[1] * 0.5]); return; }
      if (d.kind === 'graph') { setHandle('p2', [cur.P2[0] + (by[0] || by[1]), 0]); return; }
      const p = n === 'p2' ? cur.P2 : cur.P1;
      setHandle(n, [p[0] + by[0], p[1] + by[1]]);
    });
  });

  write(el('finish'), FINISH);
  K.update((p) => {
    const i = Math.round(p.step), d = STEPS[i], st = S[i];
    if (!anim.playing()) T = Infinity;   // motion that was stopped (the page hidden, a test) shows finished
    if (i !== lastStep) {
      lastStep = i; enter('stepbox');
      if (d.show) { st.dr = null; play(d.dur); } else { anim.pause(); T = Infinity; }
    }
    if (finished !== lastDone) { lastDone = finished; enter(finished ? 'done' : 'stepbox'); }
    const right = st.res === 'right';
    el('pz').classList.toggle('ask', !d.show && !right && !st.why);
    el('stepbox').hidden = finished;
    el('done').hidden = !finished;
    el('count').textContent = 'Step ' + (i + 1) + ' of ' + STEPS.length;
    const task = el('task');
    task.className = 'task' + (d.show ? ' show' : '');
    write(task, d.show ? d.text : d.task);
    write(el('rule'), RULE);
    write(el('ronote'), d.note || NOTE);
    paint(i);

    replayBtn.el.hidden = !d.show || REDUCE;
    el('replay').hidden = replayBtn.el.hidden;
    const opts = d.show ? [] : d.opts;
    el('picks').hidden = !opts.length;
    el('picks').classList.toggle('long', opts.some((o) => o.length > 6));
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      b.setLabel(opts[k]);
      b.el.setAttribute('aria-label', say(opts[k]));
      b.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });
    el('acts').hidden = !!d.show;
    checkBtn.el.hidden = right;
    const fb = el('fb');
    fb.hidden = !!d.show;
    fb.className = 'fb' + (right ? ' right' : st.res === 'wrong' ? ' wrong' : '');
    write(fb, d.show ? '' : right ? 'That\'s it.' : st.res === 'wrong' ? hintFor(i, st) : st.res === 'empty' ? PICK : '');
    const why = el('why');
    why.hidden = d.show || !st.why;
    write(why, d.show ? '' : d.why);
    whyBtn.setLabel(st.why ? 'Hide why' : 'Why?');
    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !right);
    nextBtn.setLabel(i === STEPS.length - 1 ? 'Finish' : 'Continue');
    nav.hidden = backBtn.el.hidden && nextBtn.el.hidden;
  });

  // ---------- known answers, worked out by hand ----------
  const DO = STEPS.map((d, i) => i).filter((i) => !STEPS[i].show);
  const ofKind = (...ks) => STEPS.map((d, i) => i).filter((i) => ks.indexOf(STEPS[i].kind) >= 0);
  const idx = (name) => STEPS.findIndex((d) => d.name === name);
  const solvedSt = (i) => Object.assign(blank(), { pick: STEPS[i].want, res: 'right' });
  const withDr = (i, o) => Object.assign(blank(), { dr: Object.assign(startDr(STEPS[i]), o) });
  const answerOk = (d, v) => { const R = ruleOf(d); return same(v, [R.m, R.c]); };
  // A step painted in the state given (finished, or at t seconds into its motion): what it draws.
  function drawn(i, st, t) {
    const keepS = S[i], keepT = T;
    S[i] = st; T = t == null ? Infinity : t;
    try { paint(i); return REC; } finally { S[i] = keepS; T = keepT; paint(); }
  }
  const shown = (i) => drawn(i, STEPS[i].show ? blank() : solvedSt(i));
  // The line drawn runs exactly along the rule, inside the grid.
  function runs(i, g) {
    if (!g.line || g.m == null) return false;
    const d = STEPS[i], G = geo(d), v = d.view, a = G.inv(g.line[0], g.line[1]), b = G.inv(g.line[2], g.line[3]);
    const inV = (p) => p[0] >= v.x0 - 1e-6 && p[0] <= v.x1 + 1e-6 && p[1] >= v.y0 - 1e-6 && p[1] <= v.y1 + 1e-6;
    return Math.abs(a[1] - (g.m * a[0] + g.c)) < 1e-6 && Math.abs(b[1] - (g.m * b[0] + g.c)) < 1e-6 && inV(a) && inV(b) && b[0] - a[0] > 0.5;
  }

  K.check('Given two points on a line, its equation comes from the slope between them, then solving for the y-intercept in the slope-intercept equation: on every two-point and graph screen, and with either pin dragged, the one line drawn passes through both points, its m is the slope between them and its c is solved from one of them', () => {
    const fit = (i, g) => {
      const a = g.P1, b = g.P2, m = (b[1] - a[1]) / (b[0] - a[0]), s = STEPS[i].sub ? b : a;
      return runs(i, g) && same(g.m, m) && same(g.c, s[1] - m * s[0]) && fitsRule(g.m, g.c, a) && fitsRule(g.m, g.c, b) && g.fan.length === 0;
    };
    const i4 = idx('Two pins'), i6 = idx('Brackets');
    const drags = [[[0, 0], [2, 5]], [[-1, 9], [5, -1]], [[3, 2], [0, 8]], [[5, 4], [-1, 4]]].every(([p, q]) => fit(i4, drawn(i4, withDr(i4, { P1: p, P2: q })))) &&
      fit(i6, drawn(i6, withDr(i6, { P1: [-2, -4], P2: [4, 6] })));
    return ofKind('two', 'graph').every((i) => fit(i, shown(i))) && drags;
  }, { source: SRC_KA });
  K.check('We can find the equation of a straight line when given the gradient and a point on the line: on every point-and-gradient screen and both parallel screens, and with the pin or the m handle dragged, the fan has closed to one line, through the pin with that gradient', () => {
    const fit = (i, g, m, P) => runs(i, g) && same(g.m, m) && fitsRule(g.m, g.c, P) && g.fan.length === 0 && same(g.P1, P);
    const all = ofKind('pin', 'par').every((i) => { const d = STEPS[i]; return fit(i, shown(i), d.kind === 'par' ? d.given.m : d.m, d.P1); });
    const i0 = idx('One pin'), i8 = idx('Same m');
    const drags = [[[2, 5], -1.5], [[0, 3], 2], [[4, 1], 0], [[-2, 0], 4], [[5, 9], -4]].every(([P, m]) => fit(i0, drawn(i0, withDr(i0, { P1: P, m })), m, P)) &&
      [[0, 5], [-1, -3], [4, 7]].every((P) => fit(i8, drawn(i8, withDr(i8, { P1: P })), 2, P));
    return all && drags;
  }, { source: SRC_N5 });
  K.check('The equation is a rule connecting the x and y coordinates, true for all points on the line: on every screen every pin and point read fits the finished rule, and every check row puts a point back in and gets its y', () => {
    const fits = (g) => g.vert == null && [g.P1, g.P2].filter(Boolean).every((p) => fitsRule(g.m, g.c, p)) && g.rows.filter((r) => /^Check /.test(r)).every((r) => /, on the line$/.test(r));
    const i4 = idx('Two pins');
    return STEPS.every((d, i) => fits(shown(i))) && [[[0, 1], [3, 7]], [[1, 3], [4, 5]], [[-1, 2], [6, 2]]].every(([p, q]) => fits(drawn(i4, withDr(i4, { P1: p, P2: q }))));
  }, { source: SRC_M3 });
  K.check('The y coordinate where the line crosses the y axis is called the intercept, and in y = mx + c, c is the intercept: on every screen, and with a pin dragged, the round c dot sits on the y-axis where the line crosses it, and its label gives that c', () => {
    const fit = (i, g) => { const G = geo(STEPS[i]); return !!g.cdot && Math.abs(g.cdot.x - G.px(0)) < 1e-9 && Math.abs(g.cdot.y - G.py(g.c)) < 1e-9 && g.labels.indexOf('c = ' + neg(g.c)) >= 0 && runs(i, g); };
    const i0 = idx('One pin'), i4 = idx('Two pins'), i8 = idx('Same m');
    return STEPS.every((d, i) => fit(i, shown(i))) && fit(i0, drawn(i0, withDr(i0, { P1: [3, 2], m: 1 }))) &&
      fit(i4, drawn(i4, withDr(i4, { P1: [1, 1], P2: [3, 5] }))) && fit(i8, drawn(i8, withDr(i8, { P1: [-1, 1] })));
  }, { source: SRC_M3 });
  K.check('To find the gradient of a line joining two points, divide the difference in the y-coordinates by the difference in the x-coordinates: on every two-point and graph screen the run arrow spans the difference in x, the rise arrow the difference in y, their labels give both, and m is the rise divided by the run', () => {
    const fit = (i, g) => {
      const G = geo(STEPS[i]), s = g.step;
      if (!s) return false;
      const O = G.inv(s.O[0], s.O[1]), Cn = G.inv(s.Cn[0], s.Cn[1]), Tp = G.inv(s.Tp[0], s.Tp[1]), run = g.P2[0] - g.P1[0], rise = g.P2[1] - g.P1[1];
      return same(O, g.P1, 1e-6) && same(Cn, [g.P2[0], g.P1[1]], 1e-6) && same(Tp, g.P2, 1e-6) &&
        g.labels.indexOf('run ' + neg(run)) >= 0 && g.labels.indexOf('rise ' + neg(rise)) >= 0 && same(g.m, rise / run);
    };
    const i4 = idx('Two pins'), i10 = idx('Read a graph');
    return ofKind('two', 'graph').every((i) => fit(i, shown(i))) && fit(i4, drawn(i4, withDr(i4, { P1: [5, 9], P2: [1, 1] }))) &&
      fit(i10, drawn(i10, withDr(i10, { P2: [5, 8] })));
  }, { source: SRC_M3 });
  K.check('Vertical lines have a gradient which is undefined, with equation x = a: with one pin dragged straight above the other, the line drawn stands upright through both, and the working gives no gradient and x = a in place of y = mx + c', () => {
    const i = idx('Two pins'), G = geo(STEPS[i]), g = drawn(i, withDr(i, { P1: [2, 1], P2: [2, 7] }));
    return g.vert === 2 && !!g.line && Math.abs(g.line[0] - G.px(2)) < 1e-9 && Math.abs(g.line[2] - G.px(2)) < 1e-9 && !g.cdot &&
      g.rows.length === 2 && /no gradient$/.test(g.rows[0]) && g.rows[1] === 'so the line is straight up: x = 2' && !g.rows.some((r) => /y =/.test(r));
  }, { source: SRC_V });
  K.check('With only the pin in, every line of the fan passes through the pin, each at its own gradient; set m, or drop in a second pin, and only one line is left', () => {
    const through = (i, g) => g.fan.every((f) => {
      const G = geo(STEPS[i]), a = G.inv(f.s[0], f.s[1]), b = G.inv(f.s[2], f.s[3]);
      return Math.abs(a[1] - g.P1[1] - f.m * (a[0] - g.P1[0])) < 1e-6 && Math.abs(b[1] - g.P1[1] - f.m * (b[0] - g.P1[0])) < 1e-6;
    });
    const distinct = (g) => new Set(g.fan.map((f) => f.m.toFixed(6))).size === g.fan.length;
    const i0 = idx('One pin'), i1 = idx('Through a point'), i4 = idx('Two pins');
    const mid = drawn(i0, blank(), 1.85), end = drawn(i0, blank()), q0 = drawn(i1, blank()), q1 = drawn(i1, solvedSt(i1)), t0 = drawn(i4, blank(), 1.1), t1 = drawn(i4, blank());
    return mid.fan.length >= 8 && through(i0, mid) && distinct(mid) && end.fan.length === 0 && runs(i0, end) &&
      q0.fan.length === FANA.length && through(i1, q0) && distinct(q0) && !q0.line && q1.fan.length === 0 && runs(i1, q1) &&
      t0.fan.length >= 8 && through(i4, t0) && distinct(t0) && t1.fan.length === 0 && runs(i4, t1);
  });
  K.check('A parallel line has the same m, so only c changes: the copy of the given line keeps its tilt as it slides from the given line towards the pin, and the line it leaves goes through the pin with the given m; a pin on the given line gives the given line itself', () => {
    const i = idx('Same m'), d = STEPS[i], cs = [1.2, 1.6, 2.0].map((t) => drawn(i, blank(), t).ghost);
    const slides = cs.every((gh) => !!gh && gh.m === d.given.m) && cs[0].c < d.given.c && cs[1].c < cs[0].c && cs[2].c < cs[1].c && cs[2].c > -4 - 1e-9;
    const end = shown(i), q = shown(idx('Parallel')), on = drawn(i, withDr(i, { P1: [1, 3] }));
    return slides && !end.ghost && same(end.m, 2) && same(end.c, -4) && same(q.m, -3) && same(q.c, 8) && same(on.c, 1) && /the given line itself$/.test(on.rows[on.rows.length - 1]);
  });
  K.check('Every worked row is right, by hand: c = 5 − 6 = −1 and 3 × 2 + 5 = 11 for the pin at (2, 5), c = 7 for (3, 1), m = 6 ÷ 3 = 2 and c = 1 for A and B, m = −8 ÷ 4 = −2 with brackets, y = 2x − 4 parallel through (3, 2), y = 2x − 2 read off a graph, and every puzzle\'s working', () => {
    const table = [
      ['One pin', ['m = 3: y = 3x + c', 'Put in (2, 5): 5 = 3 × 2 + c, so 5 = 6 + c,', 'so c = 5 − 6 = −1', 'so y = 3x − 1', '5 as c: 3 × 2 + 5 = 11, not 5']],
      ['Through a point', ['m = 2: y = 2x + c', 'Put in (1, 4): 4 = 2 × 1 + c, so 4 = 2 + c,', 'so c = 4 − 2 = 2', 'so y = 2x + 2', 'Check (1, 4): 2 × 1 + 2 = 4, on the line']],
      ['A falling line', ['m = −2: y = −2x + c', 'Put in (3, 1): 1 = −2 × 3 + c, so 1 = −6 + c,', 'so c = 1 + 6 = 7', 'so y = −2x + 7', 'Check (3, 1): −2 × 3 + 7 = 1, on the line']],
      ['Keep the minus', ['m = −3: y = −3x + c', 'Put in (2, −1): −1 = −3 × 2 + c, so −1 = −6 + c,', 'so c = −1 + 6 = 5', 'so y = −3x + 5', 'Check (2, −1): −3 × 2 + 5 = −1, on the line']],
      ['Two pins', ['m = rise ÷ run: (9 − 3) ÷ (4 − 1) = 6 ÷ 3 = 2', 'Put in A (1, 3): 3 = 2 × 1 + c, so 3 = 2 + c,', 'so c = 3 − 2 = 1', 'so y = 2x + 1', 'Check B (4, 9): 2 × 4 + 1 = 9, on the line']],
      ['From two points', ['m = rise ÷ run: (7 − 1) ÷ (5 − 2) = 6 ÷ 3 = 2', 'Put in (2, 1): 1 = 2 × 2 + c, so 1 = 4 + c,', 'so c = 1 − 4 = −3', 'so y = 2x − 3', 'Check (5, 7): 2 × 5 − 3 = 7, on the line']],
      ['Brackets', ['m = rise ÷ run: (−3 − 5) ÷ (3 − (−1)) = −8 ÷ 4 = −2', 'Put in (−1, 5): 5 = −2 × (−1) + c, so 5 = 2 + c,', 'so c = 5 − 2 = 3', 'so y = −2x + 3', 'Check (3, −3): −2 × 3 + 3 = −3, on the line']],
      ['Mind the brackets', ['m = rise ÷ run: (7 − 1) ÷ (1 − (−2)) = 6 ÷ 3 = 2', 'Put in (1, 7), no minus signs: 7 = 2 × 1 + c, so 7 = 2 + c,', 'so c = 7 − 2 = 5', 'so y = 2x + 5', 'Check (−2, 1): 2 × (−2) + 5 = 1, on the line']],
      ['Same m', ['Given: y = 2x + 1', 'Parallel, same m: y = 2x + c', 'Put in (3, 2): 2 = 2 × 3 + c, so 2 = 6 + c,', 'so c = 2 − 6 = −4', 'so y = 2x − 4']],
      ['Parallel', ['Given: y = −3x + 4', 'Parallel, same m: y = −3x + c', 'Put in (1, 5): 5 = −3 × 1 + c, so 5 = −3 + c,', 'so c = 5 + 3 = 8', 'so y = −3x + 8']],
      ['Read a graph', ['Read: (0, −2) and (3, 4)', 'm = rise ÷ run: (4 − (−2)) ÷ (3 − 0) = 6 ÷ 3 = 2', 'On the y-axis: (0, −2), so c = −2', 'so y = 2x − 2']],
      ['Graph to rule', ['Read: (0, 3) and (6, 0)', 'm = rise ÷ run: (0 − 3) ÷ (6 − 0) = −3 ÷ 6 = −0.5', 'On the y-axis: (0, 3), so c = 3', 'so y = −0.5x + 3']],
      ['Two more points', ['m = rise ÷ run: (5 − (−1)) ÷ (2 − 0) = 6 ÷ 2 = 3', 'On the y-axis: (0, −1), so c = −1', 'so y = 3x − 1', 'Check (2, 5): 3 × 2 − 1 = 5, on the line']],
    ];
    const rowsOk = table.length === STEPS.length && table.every((r) => { const g = shown(idx(r[0])); return g.rows.length === r[1].length && g.rows.every((s, n) => s === r[1][n]); });
    const i0 = idx('One pin'), i4 = idx('Two pins');
    const flat = drawn(i0, withDr(i0, { P1: [2, 5], m: 0 })).rows.join(' | ');
    const third = drawn(i4, withDr(i4, { P1: [1, 3], P2: [4, 5] })).rows[0];
    return rowsOk && flat === 'm = 0: y = 0x + c | Put in (2, 5): 5 = 0 × 2 + c, so 5 = 0 + c, | so c = 5 − 0 = 5 | so y = 5 | 5 as c: 0 × 2 + 5 = 5, so here it is c' &&
      third === 'm = rise ÷ run: (5 − 3) ÷ (4 − 1) = 2 ÷ 3 ≈ 0.67';
  });
  K.check('Before an answer a puzzle keeps back its line and c, and its working reads y = ?; a right answer or Why? draws them and fills in the working; a wrong pick draws its own line dashed, which misses a point or has the wrong gradient, with a hint of its own', () =>
    DO.every((i) => {
      const d = STEPS[i], R = ruleOf(d), g0 = drawn(i, blank()), g1 = drawn(i, solvedSt(i)), g2 = drawn(i, Object.assign(blank(), { why: true }));
      const kept = !g0.cdot && (d.kind === 'graph' ? !!g0.line && g0.reads.length === 0 : !g0.line) && g0.rows.some((r) => /y = \?$/.test(r));
      const shownOk = [g1, g2].every((g) => runs(i, g) && !!g.cdot && g.fan.length === 0 && g.rows.every((r) => r.indexOf('?') < 0));
      const wrongs = d.opts.every((o) => {
        if (o === d.want) return true;
        const v = d.vals[o], g = drawn(i, Object.assign(blank(), { pick: o, res: 'wrong' }));
        return !!g.wrong && same([g.wrong.m, g.wrong.c], v) && ([g.P1, g.P2].filter(Boolean).some((p) => !fitsRule(v[0], v[1], p)) || !same(v[0], R.m)) &&
          !!d.hints[o] && d.hints[o] !== d.hint;
      });
      return kept && shownOk && wrongs;
    }));
  K.check('Every answer offered is written from its own numbers, the right one is worked from the puzzle\'s own points and gradient, and each wrong one is a real slip: a point\'s y taken as c, adding instead of taking away or the other way round, a lost minus, the run over the rise, brackets dropped, the old c kept, or the x-axis crossing taken as c', () =>
    DO.every((i) => {
      const d = STEPS[i];
      return d.opts.every((o) => ruleTidy(d.vals[o][0], d.vals[o][1]) === o) && answerOk(d, d.vals[d.want]) &&
        d.opts.every((o) => o === d.want || (!answerOk(d, d.vals[o]) && !!d.slip[o] && d.slip[o](d, d.vals[o])));
    }));
  K.check('Every demonstration has finished arriving within its 2.8 to 5 s, none starting before the 0.35 s screen fade ends; a puzzle\'s drawing finishes within 2.5 s', () => {
    const keepT = T;
    const timed = (i, st, limit) => {
      const keepS = S[i];
      T = Infinity; latest = 0; earliest = Infinity; S[i] = st;
      try { paint(i); } finally { S[i] = keepS; }
      return latest <= limit + 1e-9;
    };
    const ok = STEPS.every((d, i) => (d.show ? timed(i, blank(), d.dur) && d.dur >= 2.8 && d.dur <= 5 && earliest >= FADE
      : timed(i, solvedSt(i), FB) && timed(i, Object.assign(blank(), { why: true }), FB)));
    T = keepT; paint();
    return ok && FB <= 2.5;
  });

  K.ready();
</script>
