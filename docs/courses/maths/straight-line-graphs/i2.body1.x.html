<style>
  [hidden] { display: none !important; }
  .pz, .lead, .caption { max-width: 30rem; }
  .pz > * + *, #stepbox > * + * { margin-top: 14px; }
  /* The stepper is the page's step control: its dots are the progress bar; Back and Continue are below. */
  .pz .k-stepper { gap: 0; }
  .pz .k-stepper .k-label, .pz .k-stepper-nav { display: none; }
  .pz .count { margin-top: 10px; }
  .task { font-size: 1.2rem; font-weight: 700; line-height: 1.5; margin-top: 4px; }
  .task.show { font-size: 1.12rem; font-weight: 400; line-height: 1.6; }
  .nw { white-space: nowrap; }
  .v { font-style: italic; }
  /* The readout above the grid: the rule, which point gives which numbers, then the working. */
  .ro { border-left: 3px solid var(--k-accent2); padding: 4px 0 4px 12px; }
  .ro p { margin: 0; }
  .ro .rule { font-weight: 700; line-height: 1.5; }
  .ro .ronote { color: var(--k-muted); font-size: .9rem; line-height: 1.45; }
  .ro .wk { line-height: 1.55; min-height: 3.1em; margin-top: 4px; }
  .ro .wk .lab { color: var(--k-muted); font-weight: 700; }
  .ro .pc { white-space: nowrap; }
  .ro .pc.end { font-weight: 700; color: var(--k-accent2); }
  .ro .pc.q { color: var(--k-muted); }
  .scene { display: block; width: 100%; max-width: 22rem; margin-inline: auto; touch-action: pan-y; }
  .scene.grab { touch-action: none; }
  /* The squared grid, its axes and their numbers. */
  .scene .gl { stroke: var(--k-line); stroke-width: 1; }
  .scene .ax { stroke: var(--k-strong); stroke-width: 1.5; }
  .scene .tk { font: 400 13px var(--k-font); fill: var(--k-muted); }
  .scene .at { font: 600 13px var(--k-font); fill: var(--k-muted); }
  /* The long side, the step triangle (run and rise arrows, right-angle mark), the points. A second step is teal. */
  .scene .ln { stroke: var(--k-accent2); stroke-width: 2.5; stroke-linecap: round; fill: none; }
  .scene .tri { fill: var(--k-accent2); fill-opacity: .07; stroke: none; }
  .scene .tri.teal { fill: var(--k-accent); }
  .scene .sh { stroke: var(--k-accent2); stroke-width: 2.5; stroke-linecap: round; fill: none; }
  .scene .sh.teal { stroke: var(--k-accent); }
  .scene .hd { fill: var(--k-accent2); stroke: none; }
  .scene .hd.teal { fill: var(--k-accent); }
  .scene .ra { fill: none; stroke: var(--k-muted); stroke-width: 1.4; }
  .scene .pt { fill: var(--k-accent2); stroke: var(--k-bg); stroke-width: 2; }
  /* The midpoint: a teal dot, ticks halfway along the run and up the rise, dashed lines to the axes. */
  .scene .mp { fill: var(--k-accent); stroke: var(--k-bg); stroke-width: 2; }
  .scene .hk { stroke: var(--k-accent); stroke-width: 2.5; stroke-linecap: round; }
  .scene .dsh { stroke: var(--k-accent); stroke-width: 1.6; stroke-dasharray: 5 4; fill: none; }
  .scene .ft { font: 700 13px var(--k-font); fill: var(--k-accent); }
  /* A faint ring marks a point that can be dragged. */
  .scene .ring { fill: none; stroke: var(--k-accent2); stroke-opacity: .4; stroke-width: 1.5; }
  /* Labels carry a halo of the page colour, so a line passing behind one never strikes through it. */
  .scene .lab { font: 700 14px var(--k-font); fill: var(--k-ink); paint-order: stroke; stroke: var(--k-bg); stroke-width: 4px; stroke-linejoin: round; }
  .scene .lab.arw, .scene .lab.dl { fill: var(--k-accent2); }
  .scene .lab.arw.teal, .scene .lab.mid { fill: var(--k-accent); }
  .scene .v { font-style: italic; }
  .scene #art *, .scene #labs * { pointer-events: none; }
  .scene .grip { fill: var(--k-bg); fill-opacity: 0; stroke: none; cursor: grab; touch-action: none; }
  .scene .grip:active { cursor: grabbing; }
  .scene .grip:focus { outline: none; }
  .scene .grip:focus-visible { stroke: var(--k-accent); stroke-width: 3; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  .row .k-btn { flex: 1 1 7rem; }
  .replay { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 10px; }
  .replay .k-btn { flex: 0 0 auto; min-height: 44px; padding-left: 16px; padding-right: 16px; font-size: .95rem; white-space: nowrap; }
  /* The answers stay on one row, each label whole; longer ones stack one to a row. */
  .row.picks { flex-wrap: nowrap; }
  .picks .k-btn { font-size: 1.15rem; min-height: 56px; flex: 1 1 0; min-width: 0; white-space: nowrap; padding-inline: 6px; }
  .row.picks.long { flex-direction: column; gap: 8px; }
  .picks.long .k-btn { flex: 0 0 auto; width: 100%; min-height: 48px; }
  .picks .k-btn[aria-pressed="true"] { background: var(--k-accent2); color: var(--k-on-accent2); border-color: var(--k-accent2); }
  .fb { font-weight: 700; min-height: 1.5em; margin-top: 10px; }
  /* Before a puzzle is answered its working is one line and the empty feedback line takes no room. */
  .pz.ask .ro .wk { min-height: 1.55em; }
  .pz.ask .fb:empty { min-height: 0; }
  .fb.right { color: var(--k-good); }
  .fb.wrong { color: var(--k-ink); }
  .why { line-height: 1.6; }
  .done { line-height: 1.6; }
  .done strong { color: var(--k-accent2); }
  .done .row { margin-top: 14px; }
  /* Each new screen settles in softly: its words and picture fade in and rise 4 px. */
  #stepbox.enter, #done.enter { animation: screen-in .35s ease-out both; }
  @keyframes screen-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  html.k-testing #stepbox.enter, html.k-testing #done.enter { animation: none; }
  @media (prefers-reduced-motion: reduce) { #stepbox.enter, #done.enter { animation: none; } }
</style>

<p class="lead">Points on a squared grid, the step triangle between them, its long side and its midpoint. The two ceiling lights are example positions.</p>

<p class="caption">The distance is Pythagoras on the step triangle. The midpoint averages the x's and the y's.</p>

<script>
  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // view: the grid's window (squares of 1 both ways, so a square across and a square up are the same length).
  // pts: A and B; on a working-back screen A and the midpoint M (B is found). focus: 'd' the distance,
  // 'm' the midpoint, 'both', or 'back' (working back to a missing end). keys: on a SHOW step, the
  // pairs of points it slides through, each starting its slide at `at`. drag: A and B can be dragged.
  // A puzzle: opts, want, and each wrong option's slip, worked from the puzzle's own points, with its own hint.
  const PICK = 'Tap one of the answers.';
  const RULE_D = '`d = √((x₂ − x₁)² + (y₂ − y₁)²)`';
  const RULE_M = '`M = ((x₁ + x₂) ÷ 2, (y₁ + y₂) ÷ 2)`';
  const RULE_B = 'B is the same step on from M as M is from A.';
  const NOTE = 'A gives `x₁` and `y₁`, and B gives `x₂` and `y₂`.';
  const NOTE_B = 'A is the end you know, and M is the midpoint.';
  const NOTE_L = 'The first light gives `x₁` and `y₁`, and the second gives `x₂` and `y₂`.';
  const SQ = (x0, x1, y0, y1, hmax) => ({ x0, x1, y0, y1, xt: 'x', yt: 'y', u: '', hmax: hmax || 250 });
  const PLAN = { x0: 0, x1: 14, y0: 0, y1: 8, xt: 'Across the ceiling (m)', yt: 'Along the ceiling (m)', u: ' m', hmax: 250 };
  const AB = ['A', 'B'], AMB = ['A', 'M', 'B'];
  const ab = (P) => [Math.abs(P[1][0] - P[0][0]), Math.abs(P[1][1] - P[0][1])];
  const halves = (P) => [(P[1][0] - P[0][0]) / 2, (P[1][1] - P[0][1]) / 2];
  const totals = (P) => [P[0][0] + P[1][0], P[0][1] + P[1][1]];
  const HINT_D = 'Not quite. Square the run and the rise, add, then take the square root.';
  const HINT_M = 'Not quite. Add the two x\'s and halve, then add the two y\'s and halve.';
  const STEPS = [
    { show: true, name: 'The long side', view: SQ(-1, 9, 0, 11), pts: [[1, 2], [7, 10]], names: AB, drag: true, focus: 'd', dur: 3.6,
      text: 'The run and the rise meet at a right angle, so the long side from A to B is the hypotenuse, and Pythagoras gives its length, `d`. Square the run and the rise, add, then take the square root, `√(36 + 64) = √100 = 10`. Written with the coordinates, that is the *distance formula*, and it works wherever you drag A or B.' },
    { kind: 'pick', name: 'Your turn', view: SQ(-1, 7, -1, 7), pts: [[2, 1], [5, 5]], names: AB, focus: 'd',
      opts: ['5', '7', '25'], want: '5', slip: { '7': (P) => ab(P)[0] + ab(P)[1], '25': (P) => ab(P)[0] ** 2 + ab(P)[1] ** 2 },
      task: 'How far apart are A and B?',
      why: 'The run is `5 − 2 = 3` and the rise is `5 − 1 = 4`. So `d = √(3² + 4²) = √(9 + 16) = √25 = 5`.',
      hint: HINT_D,
      hints: { '7': 'Not quite. `3 + 4 = 7` goes round the two short sides, which is further than going straight.', '25': 'Not quite. 25 is the distance squared. Take its square root.' } },
    { show: true, name: 'Across both axes', view: SQ(-6, 8, -7, 11, 300), names: AB, drag: true, focus: 'd', dur: 4.0,
      keys: [{ pts: [[1, 2], [7, 10]] }, { pts: [[1, 2], [7, -6]], at: 1.0 }, { pts: [[1, 2], [-5, -6]], at: 2.6 }],
      text: 'B crosses one axis, then the other, and the run and the rise turn negative. A negative times a negative is positive, so `(−6)² = 36` and `(−8)² = 64`, the same squares as before, and the distance is still 10.' },
    { kind: 'pick', name: 'Mind the brackets', view: SQ(-2, 6, -5, 5), pts: [[-1, 4], [5, -4]], names: AB, focus: 'd',
      opts: ['10', '8.9', '14'], want: '10',
      slip: { '8.9': (P) => Math.hypot(P[1][0] - Math.abs(P[0][0]), P[1][1] - P[0][1]), '14': (P) => ab(P)[0] + ab(P)[1] },
      task: 'How far apart are A and B? Mind the negative coordinates.',
      why: 'The run is `5 − (−1) = 6` and the rise is `−4 − 4 = −8`. So `d = √(6² + (−8)²) = √(36 + 64) = √100 = 10`.',
      hint: 'Not quite. Put brackets round each negative coordinate, then square, add and take the square root.',
      hints: { '8.9': 'Not quite. Without brackets, `5 − (−1)` became `5 − 1`. Taking away −1 adds 1, so the run is 6.', '14': 'Not quite. `6 + 8 = 14` goes round the two short sides. Square, add, then take the square root.' } },
    { show: true, name: 'Halfway', view: SQ(-1, 9, 0, 11), pts: [[1, 2], [7, 10]], names: AB, drag: true, focus: 'm', dur: 3.0,
      text: 'Halfway along the run is 3 and halfway up the rise is 4, so the *midpoint* is `(1 + 3, 2 + 4) = (4, 6)`. It sits on the long side, because half the run along gives half the rise up. Each coordinate is the average of the two, `(1 + 7) ÷ 2 = 4` and `(2 + 10) ÷ 2 = 6`.' },
    { kind: 'pick', name: 'Find the middle', view: SQ(0, 9, 0, 8), pts: [[2, 3], [8, 7]], names: AB, focus: 'm',
      opts: ['(5, 5)', '(3, 2)', '(10, 10)'], want: '(5, 5)', slip: { '(3, 2)': halves, '(10, 10)': totals },
      task: 'Find the midpoint of A and B.',
      why: 'The average of the x\'s is `(2 + 8) ÷ 2 = 5` and of the y\'s `(3 + 7) ÷ 2 = 5`, so the midpoint is (5, 5). That is half the run, 3, along from A and half the rise, 2, up.',
      hint: HINT_M,
      hints: { '(3, 2)': 'Not quite. (3, 2) is half the run and half the rise, the step from A to the middle. Add it on to A.', '(10, 10)': 'Not quite. Those are the totals. Halve each one.' } },
    { show: true, name: 'Negatives too', view: SQ(-4, 6, -2, 6), pts: [[-3, 5], [5, -1]], names: AB, drag: true, focus: 'm', dur: 3.0,
      text: 'With negatives the average works the same way. `(−3 + 5) ÷ 2 = 1` and `(5 + (−1)) ÷ 2 = 2`, so the midpoint is (1, 2).' },
    { kind: 'pick', name: 'Mind the signs', view: SQ(-5, 3, -3, 7), pts: [[-4, -2], [2, 6]], names: AB, focus: 'm',
      opts: ['(−1, 2)', '(3, 4)', '(3, 2)'], want: '(−1, 2)',
      slip: { '(3, 4)': halves, '(3, 2)': (P) => [(Math.abs(P[0][0]) + P[1][0]) / 2, (P[0][1] + P[1][1]) / 2] },
      task: 'Find the midpoint of A and B. Mind the negative coordinates.',
      why: '`(−4 + 2) ÷ 2 = −2 ÷ 2 = −1` and `(−2 + 6) ÷ 2 = 4 ÷ 2 = 2`, so the midpoint is (−1, 2).',
      hint: HINT_M,
      hints: { '(3, 4)': 'Not quite. (3, 4) is half the run and half the rise, the step from A to the middle. Add it on to A.', '(3, 2)': 'Not quite. The −4 lost its minus. `−4 + 2 = −2`, and half of that is −1.' } },
    { show: true, name: 'Working back', view: SQ(-1, 9, 0, 11), pts: [[1, 2], [4, 6]], names: AMB, focus: 'back', dur: 3.8,
      text: 'To find a missing end, take the same step again. From A to the midpoint M is a run of 3 and a rise of 4, so B is a run of 3 and a rise of 4 on from M, at (7, 10).' },
    { kind: 'pick', name: 'The other end', view: SQ(0, 9, -3, 7), pts: [[3, 6], [5, 2]], names: AMB, focus: 'back',
      opts: ['(7, −2)', '(4, 4)', '(2, −4)'], want: '(7, −2)',
      slip: { '(4, 4)': (P) => [(P[0][0] + P[1][0]) / 2, (P[0][1] + P[1][1]) / 2], '(2, −4)': (P) => [P[1][0] - P[0][0], P[1][1] - P[0][1]] },
      task: 'A is one end and M is the midpoint. Where is the other end, B?',
      why: 'From A to M the run is `5 − 3 = 2` and the rise is `2 − 6 = −4`. Take the same step again from M, and B is at `(5 + 2, 2 + (−4)) = (7, −2)`.',
      hint: 'Not quite. Find the step from A to M, then take it again from M.',
      hints: { '(4, 4)': 'Not quite. (4, 4) is the midpoint of A and M. Take the step from A to M again, past M.', '(2, −4)': 'Not quite. (2, −4) is the step from A to M. Add it on to M.' } },
    { show: true, name: 'A ceiling plan', view: PLAN, pts: [[1, 2], [13, 7]], names: ['Light', 'Light'], drag: true, focus: 'both', dur: 4.4, note: NOTE_L,
      text: 'On a plan drawn in metres both ways, the long side is a real length. These two lights are `√(12² + 5²) = 13` m apart, and their midpoint is (7, 4.5). On a graph of volts against amps, the long side would not be a length at all.' },
    { kind: 'pick', name: 'Between the lines', view: SQ(-1, 6, 0, 10), pts: [[1, 3], [4, 9]], names: AB, focus: 'm',
      opts: ['(2.5, 6)', '(1.5, 3)', '(5, 12)'], want: '(2.5, 6)', slip: { '(1.5, 3)': halves, '(5, 12)': totals },
      task: 'Find the midpoint of A and B. It can land between the gridlines.',
      why: '`(1 + 4) ÷ 2 = 5 ÷ 2 = 2.5` and `(3 + 9) ÷ 2 = 12 ÷ 2 = 6`, so the midpoint is (2.5, 6).',
      hint: HINT_M,
      hints: { '(1.5, 3)': 'Not quite. (1.5, 3) is half the run and half the rise. Add it on to A.', '(5, 12)': 'Not quite. Those are the totals. Halve each one.' } },
    { kind: 'pick', name: 'One last mix', view: SQ(-4, 3, -2, 12, 280), pts: [[-3, -1], [2, 11]], names: AB, focus: 'd',
      opts: ['13', '17', '169'], want: '13', slip: { '17': (P) => ab(P)[0] + ab(P)[1], '169': (P) => ab(P)[0] ** 2 + ab(P)[1] ** 2 },
      task: 'One last mix. How far apart are A and B?',
      why: 'The run is `2 − (−3) = 5` and the rise is `11 − (−1) = 12`. So `d = √(5² + 12²) = √(25 + 144) = √169 = 13`.',
      hint: HINT_D,
      hints: { '17': 'Not quite. `5 + 12 = 17` goes round the two short sides. Square, add, then take the square root.', '169': 'Not quite. 169 is the distance squared. Take its square root.' } },
  ];
  const FINISH = 'The distance between two points is `√(run² + rise²)`, Pythagoras on the step triangle, and the midpoint is the average of the two x\'s and the average of the two y\'s. To find a missing end, take the same step again past the midpoint.';
  // Sources the checks restate (the lesson's own).
  const PLOT = 'https://openstax.org/books/intermediate-algebra/pages/11-1-distance-and-midpoint-formulas-circles';
  const PYTH = 'https://openstax.org/books/college-algebra/pages/2-1-the-rectangular-coordinate-systems-and-graphs';
  const MID = 'https://www.bbc.co.uk/bitesize/articles/z4863qt';
  // Margins round the grid (numbers left and below, axis names above and below).
  const ML = 36, MR = 8, MT = 28, W = 340 - ML - MR;
  const TR = 0.9;   // seconds a slide from one pair of points to the next takes
  const FB = 2.4;   // seconds a puzzle's drawing takes after a right answer or Why?
  const FADE = 0.35;
  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const testing = () => document.documentElement.classList.contains('k-testing');
  const el = (id) => document.getElementById(id);

  // ---------- numbers, written as the explanation writes them ----------
  const r2 = (v) => Math.round(v * 100) / 100;
  const neg = (v) => { v = r2(v); return v < 0 ? '−' + Math.abs(v) : String(Math.abs(v) < 1e-12 ? 0 : v); };
  const br = (v) => (v < 0 ? '(' + neg(v) + ')' : neg(v));
  const sqT = (v) => (v < 0 ? '(' + neg(v) + ')²' : neg(v) + '²');
  const coord = (p) => '(' + neg(p[0]) + ', ' + neg(p[1]) + ')';
  const d1 = (v) => (Math.round(v * 10) / 10).toFixed(1);
  const dist = (p, q) => Math.hypot(q[0] - p[0], q[1] - p[1]);
  const midOf = (p, q) => [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
  // d as the explanation writes it: a whole number, or to one decimal place.
  function dEnd(p, q, u) {
    const dd = dist(p, q), whole = Math.abs(dd - Math.round(dd)) < 1e-9;
    return (whole ? '= ' + neg(Math.round(dd)) : '≈ ' + d1(dd)) + u;
  }
  // The distance working, piece by piece: the rule filled in, the two squares, their values, the total, d.
  function dWork(p, q, u) {
    const run = q[0] - p[0], rise = q[1] - p[1];
    return ['d = √((' + neg(q[0]) + ' − ' + br(p[0]) + ')² + (' + neg(q[1]) + ' − ' + br(p[1]) + ')²)',
      '= √(' + sqT(run) + ' + ' + sqT(rise) + ')', '= √(' + neg(run * run) + ' + ' + neg(rise * rise) + ')',
      '= √' + neg(run * run + rise * rise), dEnd(p, q, u)];
  }
  const dLabel = (p, q, u) => 'd = √(' + sqT(q[0] - p[0]) + ' + ' + sqT(q[1] - p[1]) + ') ' + dEnd(p, q, u);
  // The midpoint working: the averages filled in, the totals, the point.
  function mWork(p, q) {
    const sx = p[0] + q[0], sy = p[1] + q[1];
    return ['M = ((' + neg(p[0]) + ' + ' + br(q[0]) + ') ÷ 2, (' + neg(p[1]) + ' + ' + br(q[1]) + ') ÷ 2)', '= (' + neg(sx) + ' ÷ 2, ' + neg(sy) + ' ÷ 2)', '= ' + coord([sx / 2, sy / 2])];
  }
  // Working back: the step from A to M, then the same step on from M.
  const stepWork = (a, m) => ['run ' + neg(m[0]) + ' − ' + br(a[0]) + ' = ' + neg(m[0] - a[0]) + ',', 'rise ' + neg(m[1]) + ' − ' + br(a[1]) + ' = ' + neg(m[1] - a[1])];
  const bWork = (a, m) => ['B = (' + neg(m[0]) + ' + ' + br(m[0] - a[0]) + ', ' + neg(m[1]) + ' + ' + br(m[1] - a[1]) + ')', '= ' + coord([2 * m[0] - a[0], 2 * m[1] - a[1]])];
  const say = (s) => String(s).replace(/−/g, 'minus ');

  // ---------- each step's state ----------
  // pick: the answer chosen; res: 'right', 'wrong' or 'empty' once checked; why: the Why? note open;
  // pts: on a SHOW screen, the points where Dan has dragged them (null until he drags).
  function blank() { return { pick: null, res: null, why: false, pts: null }; }
  const isRight = (i, st) => st.pick != null && st.pick === STEPS[i].want;
  const hintFor = (i, st) => { const d = STEPS[i]; return (d.hints && d.hints[st.pick]) || d.hint; };
  const finalPts = (d) => (d.keys ? d.keys[d.keys.length - 1].pts : d.pts);
  let S = STEPS.map(() => blank());
  let finished = false, lastStep = -1, lastDone = false, T = Infinity;   // T: seconds into the current motion
  let motionEnd = 0;
  let REC = null;                                                        // what the last paint drew, for the checks
  let OBS = { hard: [], segs: [] };                                      // what labels keep clear of: boxes always, lines where they can

  // ---------- text with amber key terms and italic letters (built with K.el, never innerHTML) ----------
  const ITAL = /((?<![A-Za-z])[xyd][₁₂]?(?![A-Za-z]))/;

      ['Halfway', ['M = ((1 + 7) ÷ 2, (2 + 10) ÷ 2) = (8 ÷ 2, 12 ÷ 2) = (4, 6)']],
      ['Find the middle', ['M = ((2 + 8) ÷ 2, (3 + 7) ÷ 2) = (10 ÷ 2, 10 ÷ 2) = (5, 5)']],
      ['Negatives too', ['M = ((−3 + 5) ÷ 2, (5 + (−1)) ÷ 2) = (2 ÷ 2, 4 ÷ 2) = (1, 2)']],
      ['Mind the signs', ['M = ((−4 + 2) ÷ 2, (−2 + 6) ÷ 2) = (−2 ÷ 2, 4 ÷ 2) = (−1, 2)']],
      ['Working back', ['run 4 − 1 = 3, rise 6 − 2 = 4', 'B = (4 + 3, 6 + 4) = (7, 10)']],
      ['The other end', ['run 5 − 3 = 2, rise 2 − 6 = −4', 'B = (5 + 2, 2 + (−4)) = (7, −2)']],
      ['A ceiling plan', ['d = √((13 − 1)² + (7 − 2)²) = √(12² + 5²) = √(144 + 25) = √169 = 13 m', 'M = ((1 + 13) ÷ 2, (2 + 7) ÷ 2) = (14 ÷ 2, 9 ÷ 2) = (7, 4.5)']],
      ['Between the lines', ['M = ((1 + 4) ÷ 2, (3 + 9) ÷ 2) = (5 ÷ 2, 12 ÷ 2) = (2.5, 6)']],
      ['One last mix', ['d = √((2 − (−3))² + (11 − (−1))²) = √(5² + 12²) = √(25 + 144) = √169 = 13']],
    ];
    const rowsOk = table.every((r) => { const g = shown(idx(r[0])); return g.rows.length === r[1].length && g.rows.every((x, n) => x.s === r[1][n]); });
    const dragged = drawn(idx('The long side'), Object.assign(blank(), { pts: [[1, 2], [4, 10]] })).rows[0].s === 'd = √((4 − 1)² + (10 − 2)²) = √(3² + 8²) = √(9 + 64) = √73 ≈ 8.5';
    return rowsOk && dragged && dWork([-2, 7], [4, -1], '').join(' ') === 'd = √((4 − (−2))² + (−1 − 7)²) = √(6² + (−8)²) = √(36 + 64) = √100 = 10' &&
      mWork([-2, 7], [4, -1]).join(' ') === 'M = ((−2 + 4) ÷ 2, (7 + (−1)) ÷ 2) = (2 ÷ 2, 6 ÷ 2) = (1, 3)';
  });
  K.check('A negative difference leaves its square, and so the distance, unchanged: with A at (1, 2), B at (7, 10), (7, −6) and (−5, −6) all give 36 + 64 = 100 and d = 10, and starting from B gives the same distance as starting from A', () => {
    const i = idx('Across both axes'), early = drawn(i, blank(), 0.5).rows, mid = drawn(i, blank(), 2.4).rows, end = drawn(i, blank()).rows;
    const ok = (r, lab) => !!r && r.lab === lab && /= √\(36 \+ 64\) = √100 = 10$/.test(r.s);
    const swap = [[[1, 2], [7, 10]], [[-1, 4], [5, -4]], [[-3, -1], [2, 11]], [[1, 2], [4, 10]]].every(([p, q]) => dWork(p, q, '').pop() === dWork(q, p, '').pop());
    return ok(early[0], 'B (7, 10)') && ok(mid[1], 'B (7, −6)') && ok(end[1], 'B (−5, −6)') && /√\(6² \+ \(−8\)²\)/.test(mid[1].s) && /√\(\(−6\)² \+ \(−8\)²\)/.test(end[1].s) && swap;
  });
  K.check('The distance is never shorter than the larger difference nor longer than the two added: 8 ≤ 10 ≤ 14 for (−2, 7) and (4, −1), and the same on every distance screen', () => {
    const fits = (p, q) => { const a = Math.abs(q[0] - p[0]), b = Math.abs(q[1] - p[1]), dd = dist(p, q); return Math.max(a, b) <= dd + 1e-9 && dd <= a + b + 1e-9; };
    const we = dist([-2, 7], [4, -1]);
    return same(we, 10) && 8 <= we && we <= 14 && STEPS.every((d, i) => shown(i).rows.filter((r) => r.kind === 'd').every((r) => fits(r.p, r.q)));
  });
  K.check('The midpoint lands on the long side, the same distance from each end, and its dashed lines cross the run and the rise at their halfway points and reach the number scales, wherever B is dragged on the first midpoint screen', () => {
    const i = idx('Halfway'), G = geo(STEPS[i]);
    for (let x = -1; x <= 9; x += 2) for (let y = 0; y <= 11; y += 3) {
      const g = drawn(i, Object.assign(blank(), { pts: [[1, 2], [x, y]] })), r = g.tris[0], D = g.dash;
      if (!r || !g.mid || !D) return false;
      const M = g.mid.px;
      const onSeg = Math.abs((M[0] - r.A[0]) * (r.B[1] - r.A[1]) - (M[1] - r.A[1]) * (r.B[0] - r.A[0])) < 1e-6 &&
        Math.abs(Math.hypot(M[0] - r.A[0], M[1] - r.A[1]) - Math.hypot(M[0] - r.B[0], M[1] - r.B[1])) < 1e-6;
      const halfway = Math.abs(D.vx - (r.A[0] + r.C[0]) / 2) < 1e-6 && Math.abs(D.hy - (r.C[1] + r.B[1]) / 2) < 1e-6;
      const reach = D.vBot === G.gy + G.gh && D.hLeft === G.gx && D.vTop <= Math.min(r.A[1], M[1]) + 1e-6 && D.hRight >= Math.max(r.C[0], M[0]) - 1e-6;
      if (!(onSeg && halfway && reach)) return false;
    }
    return true;
  });
  K.check('Working back takes the same step again: on both working-back screens the step from M to B equals the step from A to M, so M is the midpoint of A and B, and B is never the midpoint of A and M', () =>
    STEPS.every((d, i) => {
      if (d.focus !== 'back') return true;
      const g = shown(i), a = g.P[0], m = g.P[1], b = g.P[2];
      return same([m[0] - a[0], m[1] - a[1]], [b[0] - m[0], b[1] - m[1]]) && same(midOf(a, b), m) && !same(b, midOf(a, m)) &&
        g.labels.indexOf('B ' + coord(b)) >= 0 && g.tris.length === 2 && g.tris[0].run === g.tris[1].run && g.tris[0].rise === g.tris[1].rise;
    }));
  K.check('Before an answer a puzzle draws no triangle and no marker, and its working reads ?; a right answer or Why? draws them and fills in the working; every wrong answer has a hint of its own', () =>
    DO.every((i) => {
      const d = STEPS[i], g0 = drawn(i, blank()), g1 = drawn(i, solvedSt(i)), g2 = drawn(i, Object.assign(blank(), { why: true }));
      const before = g0.tris.length === 0 && !g0.mid && g0.rows.length === 1 && /\?$/.test(g0.rows[0].s) &&
        (d.focus !== 'back' || !g0.labels.some((t) => /^B /.test(t))) && (d.focus !== 'd' || g0.dlab === 'd = ?');
      const after = (g) => g.tris.length >= 1 && g.rows.every((r) => !/\?/.test(r.s)) && (d.focus !== 'm' || !!g.mid) && (d.focus !== 'd' || /^d = √/.test(g.dlab || ''));
      return before && after(g1) && after(g2) && d.opts.every((o) => o === d.want || (d.hints[o] && d.hints[o] !== d.hint));
    }));
  K.check('Every wrong answer offered is a real slip worked from the puzzle\'s own points: run plus rise, no square root, dropped brackets, halved differences, totals not halved, a lost minus, the midpoint of A and M, or the step alone', () =>
    DO.every((i) => { const d = STEPS[i]; return d.opts.every((o) => o === d.want || (d.slip[o] && same(valueOf(o), d.slip[o](d.pts), 0.05))); }));
  K.check('Every demonstration has finished arriving within 4.5 s of its screen opening, none starting before the 0.35 s screen fade ends; a puzzle\'s drawing finishes within 2.5 s', () => {
    const keepT = T;
    const timed = (i, st, limit) => {
      const keepS = S[i];
      T = Infinity; latest = 0; earliest = Infinity; S[i] = st;
      try { paint(i); } finally { S[i] = keepS; }
      return latest <= limit + 1e-9;
    };
    const ok = STEPS.every((d, i) => (d.show ? timed(i, blank(), d.dur) && d.dur >= 2.8 && d.dur <= 4.5 && earliest >= FADE
      : timed(i, solvedSt(i), FB) && timed(i, Object.assign(blank(), { why: true }), FB)));
    T = keepT; paint();
    return ok && FB <= 2.5;
  });

  K.ready();
