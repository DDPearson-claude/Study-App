<style>
  [hidden] { display: none !important; }
  .pz, .lead, .caption { max-width: 30rem; }
  .pz > * + *, #stepbox > * + * { margin-top: 14px; }
  /* The stepper is the page's step control: its dots are the progress bar; Back and Continue are below. */
  .pz .k-stepper { gap: 0; }
  .pz .k-stepper .k-label, .pz .k-stepper-nav { display: none; }

  /* The working under the graph: what the screen is about in one line, then the rows as they fill in. */

  .ro p { margin: 0; }
  .ro .rule { font-weight: 700; line-height: 1.5; }

  .ro .pc.end { font-weight: 700; color: var(--k-accent2); }

  .scene { display: block; width: 100%; max-width: 22rem; margin-inline: auto; touch-action: pan-y; }
  .scene.grab { touch-action: none; }
  /* The graph: its grid, axes, scale numbers and axis names. */
  .scene .gl { stroke: var(--k-line); stroke-width: 1; }
  .scene .ax { stroke: var(--k-strong); stroke-width: 1.5; }
  .scene .tk { font: 400 13px var(--k-font); fill: var(--k-muted); }
  .scene .at { font: 600 13px var(--k-font); fill: var(--k-muted); }
  /* The laid line (navy), the other lines on the machine screen, the stretch carried past the readings (dashed), a wrong pick (red, dashed). */
  .scene .ln { stroke: var(--k-accent2); stroke-width: 2.5; stroke-linecap: round; fill: none; }
  .scene .ln2 { stroke: var(--k-ink); stroke-width: 2; stroke-linecap: round; fill: none; }
  .scene .oth { stroke: var(--k-muted); stroke-width: 1.6; stroke-linecap: round; fill: none; }
  .scene .dsh { stroke-dasharray: 7 6; stroke-linecap: butt; }
  .scene .ghost { stroke: var(--k-muted); stroke-width: 2; stroke-dasharray: 5 5; fill: none; }
  .scene .wrl { stroke: var(--k-warn); stroke-width: 2.4; stroke-dasharray: 7 5; fill: none; }
  /* The sticks from each reading to the line: one colour for readings above it, another for readings below. */
  .scene .stk { stroke-width: 2.5; stroke-linecap: butt; fill: none; }
  .scene .stk.up { stroke: var(--k-cat1); }
  .scene .stk.dn { stroke: var(--k-cat2); }
  /* The step triangle: its area, then the run and the rise as arrows. */
  .scene .tri { fill: var(--k-accent2); fill-opacity: .08; stroke: none; }
  .scene .sh { stroke: var(--k-accent2); stroke-width: 2.5; stroke-linecap: round; fill: none; }
  .scene .hd { fill: var(--k-accent2); stroke: none; }
  /* Readings (navy dots), points read off the line (ink), the intercept (a ring with a centre), a wrong pick's point (red). */
  .scene .rd { fill: var(--k-accent2); stroke: var(--k-bg); stroke-width: 1.5; }
  .scene .rd2 { fill: var(--k-ink); stroke: var(--k-bg); stroke-width: 1.5; }
  .scene .wd { fill: var(--k-warn); stroke: var(--k-bg); stroke-width: 2; }
  .scene .pt { fill: var(--k-bg); stroke: var(--k-accent2); stroke-width: 3; }
  .scene .ptc { fill: var(--k-accent2); stroke: none; }
  /* The line's round handles, and the pin at (0, 0). */
  .scene .hdl { fill: var(--k-accent2); stroke: var(--k-bg); stroke-width: 2; }
  .scene .pinr { fill: var(--k-bg); stroke: var(--k-ink); stroke-width: 2.5; }
  .scene .pinc { fill: var(--k-ink); stroke: none; }
  /* The spring's limit of proportionality: a band across the extensions where it lies. */
  .scene .band { fill: var(--k-sunk); stroke: none; }
  /* How closely a height is read: a short bar at each point; the fan of gradients the bars allow. */
  .scene .bar { stroke: var(--k-ink); stroke-width: 2; fill: none; }
  .scene .bar.fr { stroke: var(--k-accent); }
  .scene .bar.wr { stroke: var(--k-warn); }
  .scene .fan { stroke-width: 1.6; fill: none; }
  .scene .fan.cl { stroke: var(--k-muted); }
  .scene .fan.fr { stroke: var(--k-accent); }
  .scene .fan.wr { stroke: var(--k-warn); stroke-dasharray: 6 4; }
  .scene .fanf { stroke: none; fill-opacity: .12; }
  .scene .fanf.cl { fill: var(--k-muted); }
  .scene .fanf.fr { fill: var(--k-accent); }
  .scene .fanf.wr { fill: var(--k-warn); fill-opacity: .08; }
  /* A faint ring marks whatever can be dragged. */
  .scene .ring { fill: none; stroke: var(--k-accent2); stroke-opacity: .4; stroke-width: 1.5; }
  /* Labels carry a halo of the page colour, so a line passing behind one never strikes through it. */
  .scene .lab { font: 700 14px var(--k-font); fill: var(--k-ink); paint-order: stroke; stroke: var(--k-bg); stroke-width: 4px; stroke-linejoin: round; }
  .scene .lab.nv { fill: var(--k-accent2); }
  .scene .lab.tl { fill: var(--k-accent); }
  .scene .lab.wt { fill: var(--k-warn); }
  .scene .lab.mu { fill: var(--k-muted); }
  .scene .keyt { font: 600 13px var(--k-font); fill: var(--k-muted); paint-order: stroke; stroke: var(--k-bg); stroke-width: 4px; stroke-linejoin: round; }
  .scene .v { font-style: italic; }
  .scene #art *, .scene #labs * { pointer-events: none; }
  .scene .grip { fill: var(--k-bg); fill-opacity: 0; stroke: none; cursor: grab; touch-action: none; }
  .scene .grip:active { cursor: grabbing; }
  .scene .grip:focus { outline: none; }
  .scene .grip:focus-visible { stroke: var(--k-accent); stroke-width: 3; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  .row .k-btn { flex: 1 1 7rem; }
  .tools, .replay { display: flex; flex-wrap: wrap; gap: 10px; }
  .tools { justify-content: center; }
  .replay { justify-content: flex-end; }
  .tools .k-btn, .replay .k-btn { flex: 0 0 auto; min-height: 44px; padding-left: 16px; padding-right: 16px; font-size: .95rem; white-space: nowrap; }
  .tools .k-btn[aria-pressed="true"] { background: var(--k-accent2); color: var(--k-on-accent2); border-color: var(--k-accent2); }
  /* The answers stay on one row, each label whole; longer ones stack one to a row. */
  .row.picks { flex-wrap: nowrap; }
  .picks .k-btn { font-size: 1.15rem; min-height: 56px; flex: 1 1 0; min-width: 0; white-space: nowrap; padding-inline: 6px; }
  .row.picks.long { flex-direction: column; gap: 8px; }
  .picks.long .k-btn { flex: 0 0 auto; width: 100%; min-height: 48px; white-space: normal; }
  .picks .k-btn[aria-pressed="true"] { background: var(--k-accent2); color: var(--k-on-accent2); border-color: var(--k-accent2); }
  .fb { font-weight: 700; min-height: 1.5em; margin-top: 10px; }
  .pz.ask .fb:empty { min-height: 0; }
  .fb.right { color: var(--k-good); }
  .fb.wrong { color: var(--k-ink); }
  .why { line-height: 1.6; }
  .done { line-height: 1.6; }
  .done strong { color: var(--k-accent2); }
  .done .row { margin-top: 14px; }
  /* Each new screen settles in softly: its words and picture fade in and rise 4 px. */
  #stepbox.enter, #done.enter { animation: screen-in .35s ease-out both; }
  @keyframes screen-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  html.k-testing #stepbox.enter, html.k-testing #done.enter { animation: none; }
  @media (prefers-reduced-motion: reduce) { #stepbox.enter, #done.enter { animation: none; } }

<p class="caption">Made-up example readings with a small scatter of their own; the line is laid by eye.</p>

<script>
  // ---------- the lesson's readings, scales and lines ----------
  const UW = { xu: '°C', yu: 'Ω', xv: 'T', yv: 'R', xn: 'Temperature _T_ (°C)', yn: 'Resistance _R_ (Ω)', yd: 1 };
  const US = { xu: 'mm', yu: 'N', xv: 'x', yv: 'F', xn: 'Extension _x_ (mm)', yn: 'Force _F_ (N)', yd: null };
  const UM = { xu: 'N', yu: 'N', xv: 'W', yv: 'P', xn: 'Load _W_ (N)', yn: 'Effort _P_ (N)', yd: null };
  // The winding close up (the scale uses most of the graph), the winding from 0, the spring, the machine.
  const WZ = { x0: 0, x1: 90, xt: 10, y0: 9.5, y1: 14.5, yt: 1 };
  const WF = { x0: 0, x1: 90, xt: 10, y0: 0, y1: 24, yt: 4 };
  const SV = { x0: 0, x1: 18, xt: 2, y0: 0, y1: 50, yt: 10 };
  const MV = { x0: 0, x1: 280, xt: 40, y0: 0, y1: 60, yt: 10 };
  // Example readings: the winding (°C, Ω), the spring's straight part and the two past its limit (mm, N), the machine (N of load, N of effort).
  const RW = [[10, 10.5], [20, 10.6], [30, 11.4], [40, 11.5], [50, 11.9], [60, 12.6], [70, 12.7], [80, 13.3]];
  const RS = [[2, 5.2], [4, 9.9], [6, 15.1], [8, 19.8], [10, 25.2], [12, 29.9]];
  const RSO = [[14, 33.2], [16, 35.0]];
  const RM = [[40, 12.4], [80, 17.5], [120, 24.3], [160, 29.6], [200, 36.4], [240, 41.7]];
  const FIT = { m: 0.04, c: 10 };        // the line through the winding's middle: R = 0.04T + 10
  const OPEN = { m: 0.04, c: 11 };       // the lay-it puzzle's opening line, above every reading
  const PIN = 0.26;                      // the pinned line's swing: R = 0.26T
  const SPRING = { m: 2.5, c: 0 };       // F = 2.5x, pinned through (0, 0)
  const LC = { m: 0.15, c: 6 };          // the machine's line C: P = 0.15W + 6
  const MACH = [{ n: 'A', m: 0.15, c: 4 }, { n: 'B', m: 0.25, c: -8 }, { n: 'C', m: 0.15, c: 6 }];
  const BAR = 0.1;     // how closely a height is read off the line, in Ω (the picture's figure)
  const LIMIT = 0.4;   // the longest stick the lay-it Check allows, in Ω
  const XA = 5, XB = 85;   // where the winding line's two handles sit, in °C
  const SRC_SERC = 'https://serc.carleton.edu/mathyouneed/graphing/bestfit.html';
  const SRC_RES = 'https://openstax.org/books/university-physics-volume-2/pages/9-3-resistivity-and-resistance';
  const SRC_HOOKE = 'https://www.bbc.co.uk/bitesize/articles/zqt6b7h';
  const SRC_MCA = 'https://www.edumaritime.net/images/docs/mca-second-engineer-written-exams.pdf';

  const near = (a, b, tol) => Math.abs(a - b) <= (tol == null ? 1e-9 : tol);
  const lf = (L) => (x) => L.m * x + L.c;
  const snapTo = (v, s) => Math.round(Math.round(v / s) * s * 1e6) / 1e6;
  const fromH = (h, hx) => { const m = (h[1] - h[0]) / (hx[1] - hx[0]); return { m, c: h[0] - m * hx[0] }; };
  const hOf = (L, hx) => hx.map((x) => snapTo(L.m * x + L.c, 0.1));
  // Which readings sit above the line, which below, and the longest stick on each side.
  function tallyOf(L, rd) {
    const t = { up: 0, dn: 0, on: 0, mx: 0, upMax: null, dnMax: null, sides: [] };
    rd.forEach((p) => {
      const r = p[1] - (L.m * p[0] + L.c), a = Math.abs(r);
      if (r > 1e-9) { t.up++; t.sides.push(1); if (!t.upMax || a > t.upMax.r + 1e-9) t.upMax = { x: p[0], y: p[1], r: a }; }
      else if (r < -1e-9) { t.dn++; t.sides.push(-1); if (!t.dnMax || a > t.dnMax.r + 1e-9) t.dnMax = { x: p[0], y: p[1], r: a }; }
      else { t.on++; t.sides.push(0); }
      if (a > t.mx) t.mx = a;
    });
    return t;
  }
  const flips = (s) => s.slice(1).filter((x, k) => x !== s[k]).length;
  // The lay-it Check: four above, four below, and no stick longer than 0.4 Ω; otherwise a hint naming the slip.
  function layVerdict(L) {
    const t = tallyOf(L, RW), sit = (n) => n + (n === 1 ? ' sits' : ' sit');
    if (t.up === 4 && t.dn === 4 && t.mx <= LIMIT + 1e-9) return { ok: true, t };
    if (t.on > 0) return { ok: false, t, hint: 'Not quite. ' + (t.on === 1 ? 'One reading sits' : t.on + ' readings sit') + ' right on the line. Nudge a handle up or down.' };
    if (t.up !== t.dn) return { ok: false, t, hint: 'Not quite. ' + sit(t.up) + ' above the line and ' + t.dn + ' below. Move it ' + (t.up > t.dn ? 'up' : 'down') + ' until the count is even.' };
    return { ok: false, t, hint: 'Not quite. The count is even, but a stick is longer than 0.4 Ω, so the line is tilted. Swing it so the sticks stay short at both ends.' };
  }

  // ---------- numbers, written as the explanation writes them ----------
  const r2 = (v) => Math.round(v * 100) / 100;
  const MINUS = (s) => String(s).replace(/^-/, '−');
  function trim(v) { const r = Math.round(v * 1000) / 1000; return MINUS(Math.abs(r) < 1e-12 ? 0 : r); }
  function fixed(v, dp) { return MINUS((Math.abs(v) < 0.5 * Math.pow(10, -dp) ? 0 : v).toFixed(dp)); }
  const exactTo = (v, dp) => { const k = Math.pow(10, dp); return Math.abs(v * k - Math.round(v * k)) < 1e-6; };
  function fy(u, v) { return u.yd != null ? fixed(v, u.yd) : trim(v); }
  function fx(u, v) { return trim(v); }
  const perU = (u) => u.yu + ' per ' + u.xu;
  function lawStr(u, m, c) {
    const cr = Math.round(c * 10) / 10, ok = exactTo(m, 3) && exactTo(c, 1);
    return '_' + u.yv + '_ ' + (ok ? '=' : '≈') + ' ' + trim(m) + '_' + u.xv + '_' + (Math.abs(cr) < 1e-9 ? '' : (cr < 0 ? ' − ' : ' + ') + trim(Math.abs(cr)));
  }
  function rng(lo, hi) { return (exactTo(lo, 3) && exactTo(hi, 3) ? '' : 'about ') + trim(lo) + ' to ' + trim(hi); }
  const strip = (s) => String(s).replace(/[_*`]/g, '');

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // kind 'fit': readings, a line with handles, a stick from each reading and the count; 'read': the law read off a laid line
  // (two points, a step triangle, the line carried back); 'far': the bars and fans of two points close and far apart;
  // 'three': three lines on the machine's readings. tl: when each part of a demonstration arrives (seconds).
  const H_FIT = 'A line through the middle: about as many readings above it as below, with short sticks';
  const H_READ = 'Take _m_ and _c_ from two points on the line, far apart, never from the readings';
  const H_PIN = 'Pin a line through (0, 0) only when _y_ is 0 when _x_ is 0';
  const H_C = 'The intercept _c_ is _R_ at 0 °C, where the line meets the _R_ axis';
  const H_FAR = 'Each height is read off to within 0.1 Ω, so take two points far apart';
  const H_SPR = 'Pinned through (0, 0), and fitted to the straight part only';
  const H_FITM = 'The line that fits: about as many above as below, spread along it';
  const H_MACH = 'Law: `_P_ = _aW_ + _b_`, with _a_ the gradient and _b_ the intercept';
  const PICK = 'Tap one of the answers.';

  const STEPS = [
    { show: true, kind: 'fit', name: 'Lay one line', view: WZ, u: UW, rd: RW, L0: FIT, hx: [XA, XB], hRange: [9.6, 14.4], drag: true, dur: 3.9,
      tl: { dots: 0.4, dstep: 0.12, line: 1.5, hdl: 2.0, stk: 2.2, tally: 2.3, slab: 2.7, r0: 2.9, r1: 3.1, r2: 3.3 },
      head: H_FIT,
      text: 'Eight example readings of a motor winding scatter a little. One straight line lies through their *middle*, touching none of them. A thin *stick* joins each reading to the line, and four sit above it and four below.' },
    { kind: 'fit', lay: true, name: 'Lay it yourself', view: WZ, u: UW, rd: RW, L0: OPEN, hx: [XA, XB], hRange: [9.6, 14.4], head: H_FIT,
      task: 'Here the line sits above every reading. Drag its two handles to lay it through their middle, then press Check.',
      hint: 'Not quite. Aim for four above and four below, with short sticks.',
      why: 'A line through the middle leaves about as many readings above it as below, with short sticks spread along it. Four above, four below and no stick longer than 0.4 Ω will do. The dashed line, `_R_ = 0.04_T_ + 10`, is one that does.' },
    { show: true, kind: 'read', name: 'Read the law', view: WZ, u: UW, rd: RW, L: FIT, pts: [20, 70], lo: 10, hi: 80, ptLab: true, tri: true, back: true, icpt: true, drag: true,
      iName: '_R_ at 0 °C', rowsOf: ['run', 'rise', 'grad', 'c', 'law'], dur: 4.0,
      tl: { dots: 0.4, dstep: 0, line: 0.4, pts: 0.9, run: 1.3, rise: 1.7, back: 2.2, icpt: 2.9, r0: 1.5, r1: 1.9, r2: 2.3, r3: 3.1, r4: 3.4 },
      head: H_READ,
      text: 'Take the law from the line, not the readings. Two points on it far apart, at 20 °C and 70 °C, rise 2.0 Ω over 50 °C, so the *gradient* is 0.04 Ω per °C. Carried back to 0 °C, the line gives `_c_ = 10.0 Ω`.' },
    { kind: 'read', name: 'Find the gradient', view: WZ, u: UW, rd: RW, L: FIT, pts: [20, 70], ptLab: true, rdLab: [20, 30], post: { tri: true },
      rowsOf: ['run', 'rise', 'grad'], ask: { lab: 'Gradient', s: '?' }, head: H_READ, optKind: 'unit',
      task: 'What is the gradient of the line through the winding\'s readings?',
      opts: ['0.08 Ω per °C', '0.04 Ω per °C', '25 °C per Ω'], want: '0.04 Ω per °C',
      vals: { '0.08 Ω per °C': [0.08, 'Ω per °C'], '0.04 Ω per °C': [0.04, 'Ω per °C'], '25 °C per Ω': [25, '°C per Ω'] },
      right: (d) => { const f = lf(d.L); return [(f(70) - f(20)) / 50, 'Ω per °C']; },
      slip: { '0.08 Ω per °C': (d) => [(RW[2][1] - RW[1][1]) / (RW[2][0] - RW[1][0]), 'Ω per °C'], '25 °C per Ω': (d) => { const f = lf(d.L); return [50 / (f(70) - f(20)), '°C per Ω']; } },
      draws: ['0.08 Ω per °C'],
      wrongDraw: { '0.08 Ω per °C': () => { const m = (RW[2][1] - RW[1][1]) / (RW[2][0] - RW[1][0]); return { line: { m, c: RW[1][1] - m * RW[1][0] }, from: 12, to: 50, text: fixed(RW[2][1] - RW[1][1], 1) + ' Ω ÷ 10 °C' }; } },
      hint: 'Not quite. Divide the rise between two points on the line by the run between them.',
      hints: { '0.08 Ω per °C': 'Not quite. That uses two readings, 10.6 and 11.4 Ω, and each brings its own stray. Take the gradient from the line.',
        '25 °C per Ω': 'Not quite. That is run ÷ rise, upside down. The gradient is rise ÷ run, in Ω per °C.' },
      why: 'Two points on the line, far apart: 10.8 Ω at 20 °C and 12.8 Ω at 70 °C. The rise is `12.8 − 10.8 = 2.0 Ω` and the run `70 − 20 = 50 °C`, so the gradient is `2.0 Ω ÷ 50 °C = 0.04 Ω per °C`. The readings at 20 and 30 °C give `0.8 Ω ÷ 10 °C = 0.08 Ω per °C`, twice the line\'s, because each brings its own stray.' },
    { show: true, kind: 'fit', pinBtn: true, name: 'Through zero', view: WF, u: UW, rd: RW, L0: FIT, hx: [XA, XB], hxp: XB, hRange: [0.5, 23.5], mSnap: 0.01, mRange: [0.1, 0.28], drag: true, dur: 4.4,
      tl: { dots: 0.4, dstep: 0, line: 0.4, hdl: 0.4, stk: 0.7, tally: 0.7, pin: 1.4, swing: 1.7, slab: 3.4, r0: 3.5, r1: 3.7, r2: 3.9 },
      head: H_PIN,

  // ---------- labels: clear of each other, the dots, the arrowheads and the key; off the lines where they can be ----------
  const widths = {};
  function tw(s, cls) {
    const key = cls + '|' + s;

    const t = svg.appendChild(K.svg('text', { class: cls, x: 0, y: -50 }, s));
    try { w = t.getComputedTextLength(); } catch (e) { w = 0; }

  function boxOf(x, y, w, anchor) {

  const meets = (a, b, pad) => a.x0 < b.x1 + pad && b.x0 < a.x1 + pad && a.y0 < b.y1 + pad && b.y0 < a.y1 + pad;
  // Does a line segment pass through a box? (Liang-Barsky)
  function segHits(s, b) {

  // Each label tries spots round where it wants to be (or round each of its alternatives, in order),

  function placeLabels(items, hard, segs, B) {
    const placed = [];
    return items.map((it) => {
      const w = tw(strip(it.text), 'lab'), h = 15.5, g = 4;
      const C = [[0, 0], [0, -(h + g)], [0, h + g], [w / 2 + 2 * g, 0], [-(w / 2 + 2 * g), 0], [w / 2 + g, -(h + g)], [-(w / 2 + g), -(h + g)], [w / 2 + g, h + g], [-(w / 2 + g), h + g],
        [0, -2 * (h + g)], [0, 2 * (h + g)], [w + g, 0], [-(w + g), 0], [w + g, -(h + g)], [-(w + g), -(h + g)], [w + g, h + g], [-(w + g), h + g], [0, -3 * (h + g)], [0, 3 * (h + g)]];

  const spots = (X, Y, list) => { const alts = list.map((o) => ({ x: X + o[0], y: Y + o[1], anchor: o[2] })); return Object.assign({}, alts[0], { alts }); };

  // ---------- the parts every graph shares ----------

  function drawDots(ctx) {
    const { d, demo, tl, A, G, items } = ctx, u = d.u;

      const a = demo ? A(tl.dots + k * (tl.dstep || 0)) : 1;

  // The spring's limit of proportionality: a band across the extensions where the readings stop following the line.

  // A stick from each reading straight up or down to the line, in its side's colour; the longest each side labelled when it is long enough to see.

  // ---------- the line and its handles on the laying screens ----------

      const p = geo(STEPS[at()].view).inv(q.x, q.y);
      setHandle(held.n, held.n[0] === 'p' ? p[0] : p[1]);
    });
    const letGo = (e) => { if (held && held.id === e.pointerId) held = null; };
    g.addEventListener('pointerup', letGo);
    g.addEventListener('pointercancel', letGo);
    g.addEventListener('lostpointercapture', letGo);
    g.addEventListener('keydown', (e) => {
      const d = STEPS[at()], n = g.getAttribute('data-n');
      const by = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1 }[e.key];
      if (!canDrag(d, S[at()]) || !by || !n) return;
      e.preventDefault();
      const stepBy = n[0] === 'p' ? 10 : n === 'hp' ? d.mSnap * d.hxp : 0.1;
      setHandle(n, handleVal(n) + by * stepBy);
    });
  });

  write(el('finish'), FINISH);
  K.update((p) => {
    const i = Math.round(p.step), d = STEPS[i];
    if (!anim.playing()) T = Infinity;   // motion that was stopped (the page hidden, a test) shows finished
    if (i !== lastStep) {
      lastStep = i; enter('stepbox');
      if (d.show) { S[i] = blank(i); play(d.dur); } else { anim.pause(); T = Infinity; }
    }
    const st = S[i];
    if (finished !== lastDone) { lastDone = finished; enter(finished ? 'done' : 'stepbox'); }
    const right = st.res === 'right';
    el('pz').classList.toggle('ask', !d.show && !right && !st.why);
    el('stepbox').hidden = finished;
    el('done').hidden = !finished;
    el('count').textContent = 'Step ' + (i + 1) + ' of ' + STEPS.length;
    const task = el('task');
    task.className = 'task' + (d.show ? ' show' : '');
    write(task, d.show ? d.text : d.task);
    write(el('rule'), d.head);
    paint(i);

    el('tools').hidden = !d.pinBtn;
    replayBtn.el.hidden = !d.show || REDUCE;
    el('replay').hidden = replayBtn.el.hidden;
    const opts = d.show || d.lay ? [] : d.opts;
    el('picks').hidden = !opts.length;
    el('picks').classList.toggle('long', opts.some((o) => o.length > 6));
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      b.setLabel(opts[k]);
      b.el.setAttribute('aria-label', opts[k].replace(/−/g, 'minus '));
      b.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });
    el('acts').hidden = !!d.show;
    checkBtn.el.hidden = right;
    const fb = el('fb');
    fb.hidden = !!d.show;
    fb.className = 'fb' + (right ? ' right' : st.res === 'wrong' ? ' wrong' : '');
    const yes = i === STEPS.length - 1 ? LAST : d.lay ? 'That\'s it: four above, four below, and every stick short.' : 'That\'s it.';
    write(fb, d.show ? '' : right ? yes : st.res === 'wrong' ? hintFor(i, st) : st.res === 'empty' ? PICK : '');
    const why = el('why');
    why.hidden = d.show || !st.why;
    write(why, d.show ? '' : d.why);
    whyBtn.setLabel(st.why ? 'Hide why' : 'Why?');
    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !right);
    nextBtn.setLabel(i === STEPS.length - 1 ? 'Finish' : 'Continue');
    nav.hidden = backBtn.el.hidden && nextBtn.el.hidden;
  });

  // ---------- known answers, worked out by hand ----------
  const idx = (name) => STEPS.findIndex((d) => d.name === name);
  const I0 = idx('Lay one line'), I1 = idx('Lay it yourself'), I2 = idx('Read the law'), I3 = idx('Find the gradient'), I4 = idx('Through zero'), I5 = idx('R at 0 °C'),
    I6 = idx('Far apart'), I7 = idx('Which two points?'), I8 = idx('A spring'), I9 = idx('Spring constant'), I10 = idx('Which line fits?'), I11 = idx('Read its law');
  const PICKS = STEPS.map((d, i) => i).filter((i) => !STEPS[i].show && !STEPS[i].lay);
  const solvedSt = (i) => Object.assign(blank(i), { pick: STEPS[i].want, res: 'right' });
  const withSt = (i, o) => Object.assign(blank(i), o);
  // A step painted in the state given (finished, or at t seconds into its motion): what it draws.
  function drawn(i, st, t) {
    const keepS = S[i], keepT = T;
    S[i] = st; T = t == null ? Infinity : t;
    try { paint(i); return REC; } finally { S[i] = keepS; T = keepT; paint(); }
  }
  const shown = (i) => drawn(i, STEPS[i].show ? blank(i) : solvedSt(i));

  K.check('The idea is to get a line that has equal numbers of points on either side, and the line may not pass through many of them: the line laid through the winding\'s readings has as many above it as below and passes through none', () => {
    const g = shown(I0), t = g.tally;
    return !!t && t.up === t.dn && t.up > 0 && t.on === 0 && g.sticks.length === RW.length;
  }, { source: SRC_SERC });
  K.check('By hand: R = 0.04T + 10 leaves 4 above and 4 below, no stick over 0.2 Ω; the opening line R = 0.04T + 11 has all 8 below it; pinned, R = 0.26T still splits them 4 and 4, yet its sticks are 7.9 Ω at 10 °C and 7.5 Ω at 80 °C, all 4 above on the left', () => {
    const a = shown(I0).tally, b = drawn(I1, blank(I1)).tally, p = shown(I4), c = p.tally;
    const s10 = p.sticks.find((s) => s.x === 10), s80 = p.sticks.find((s) => s.x === 80);
    return a.up === 4 && a.dn === 4 && near(a.mx, 0.2, 1e-9) && b.up === 0 && b.dn === 8 &&
      p.pin && near(p.L.m, 0.26, 1e-9) && near(p.L.c, 0, 1e-9) && c.up === 4 && c.dn === 4 && c.sides.join() === '1,1,1,1,-1,-1,-1,-1' &&
      !!s10 && !!s80 && near(s10.y - s10.yl, 7.9, 1e-9) && near(s80.yl - s80.y, 7.5, 1e-9) && p.labels.indexOf('7.9 Ω') >= 0 && p.labels.indexOf('7.5 Ω') >= 0;
  });
  K.check('The lay-it Check passes exactly when 4 sit above and 4 below with no stick over 0.4 Ω: the line through the middle passes, the opening line fails, a line tilted to 0.05 Ω per °C fails on its long sticks though it splits them 4 and 4, and a gentler 0.0375 passes', () => {
    const v = (h) => layVerdict(fromH(h, [XA, XB])), tilt = tallyOf(fromH([9.8, 13.8], [XA, XB]), RW);
    return v([10.2, 13.4]).ok && !v([11.2, 14.4]).ok && /below/.test(v([11.2, 14.4]).hint) && tilt.up === 4 && tilt.dn === 4 &&
      !v([9.8, 13.8]).ok && /longer than/.test(v([9.8, 13.8]).hint) && v([10.3, 13.3]).ok && near(fromH([10.3, 13.3], [XA, XB]).m, 0.0375, 1e-12);
  });
  K.check('In many materials the dependence of resistance on temperature is approximately linear and can be modelled using a linear equation: every example winding reading sits close to one straight line, its stick far shorter than the line\'s rise across the readings', () => {
    const t = tallyOf(FIT, RW), f = lf(FIT);
    return t.mx < 0.1 * (f(80) - f(10));
  }, { source: SRC_RES });
  K.check('Read off the line at 20 °C and 70 °C: 12.8 − 10.8 = 2.0 Ω over 50 °C gives 0.04 Ω per °C, and c = 10.8 − 0.04 × 20 = 10.0 Ω; dragged anywhere along the line, the two points give the same gradient and the same c', () => {
    const want = ['Run: 70 − 20 = 50 °C', 'Rise: 12.8 − 10.8 = 2.0 Ω', 'Gradient: 2.0 Ω ÷ 50 °C = 0.04 Ω per °C', 'c = R at 0 °C: 10.8 − 0.04 × 20 = 10.0 Ω', 'Law: R = 0.04T + 10'];
    const g = shown(I2);
    let ok = g.rows.length === 5 && g.rows.every((r, k) => r === want[k]) && !!g.icpt && near(g.icpt.c, 10, 1e-9) && g.tris.length === 1;
    for (let a = 10; a <= 70; a += 10) for (let b = a + 10; b <= 80; b += 10) {
      const h = drawn(I2, withSt(I2, { dr: { a, b } }));
      ok = ok && h.grads.length === 1 && near(h.grads[0].g, 0.04, 1e-9) && / = 10\.0 Ω$/.test(h.rows[3]) && h.tris.length === 1 && h.tris[0].xa === a && h.tris[0].xb === b;
    }
    return ok;
  });
  K.check('Read to within 0.1 Ω, the line at 40 and 50 °C allows 0.02 to 0.06 Ω per °C, at 20 and 70 °C only 0.036 to 0.044, so the far pair\'s fan is the narrower; spread wider still, it narrows further', () => {
    const g = shown(I6), cl = g.fans.find((p) => p.k === 'cl'), fr = g.fans.find((p) => p.k === 'fr');
    const w = drawn(I6, withSt(I6, { dr: { a: 10, b: 80 } })).fans.find((p) => p.k === 'fr');
    return !!cl && !!fr && !!w && near(cl.lo, 0.02, 1e-9) && near(cl.hi, 0.06, 1e-9) && near(fr.lo, 0.036, 1e-9) && near(fr.hi, 0.044, 1e-9) &&
      fr.hi - fr.lo < cl.hi - cl.lo && w.hi - w.lo < fr.hi - fr.lo && g.labels.indexOf('0.02 to 0.06 Ω per °C') >= 0 && g.labels.indexOf('0.036 to 0.044 Ω per °C') >= 0 &&
      g.rows[1] === 'At 20 and 70 °C: rise 2.0 Ω, read as 1.8 to 2.2 Ω, so 0.036 to 0.044 Ω per °C';
  });
  K.check('Provided that the limit of proportionality is not exceeded, a graph of stretching force against extension is a straight line through the origin: the spring\'s line passes through the origin, is laid only through readings before the limit, and the readings past it fall below the line', () => {
    const d = STEPS[I8], g = shown(I8);
    return g.pin && near(g.L.c, 0) && g.band && d.rd.every((p) => p[0] < d.band[0]) && d.out.every((p) => p[0] > d.band[1] && p[1] < g.L.m * p[0]) &&
      g.tally.up + g.tally.dn + g.tally.on === d.rd.length && g.out.length === d.out.length;
  }, { source: SRC_HOOKE });
  K.check('The gradient of the graph of force (y-axis) and extension (x-axis) is numerically equal to the spring constant: on the spring screens force is up the side and extension along, and the gradient comes out in newtons per millimetre, named the spring constant', () => {
    const d = STEPS[I9], g = shown(I9);
    return /^Force/.test(d.u.yn) && /^Extension/.test(d.u.xn) && g.grads.length === 1 && near(g.grads[0].g, d.L.m) && / N per mm, the spring constant$/.test(g.rows[2]) && /spring constant/.test(d.why);
  }, { source: SRC_HOOKE });
  K.check('The law of a straight line graph is of the form y = ax + b: the lifting machine\'s law is written P = aW + b, with a the step triangle\'s rise over its run and b where the line, carried back, meets the effort axis', () => {
    const g = shown(I11), t = g.tris[0];
    return !!t && !!g.icpt && g.grads.length === 1 && near(g.grads[0].g, t.rise / t.run) && near(g.icpt.c, STEPS[I11].L.c, 1e-9) && g.rows.indexOf('Law: ' + strip(lawStr(UM, g.grads[0].g, g.icpt.c))) >= 0;
  }, { source: SRC_MCA });
  K.check('Every answer offered is written from its own numbers: the right one is worked from the screen\'s own line, and each wrong one is a real slip (two readings, run over rise, the line pinned through zero, the first reading taken as c, the bent part, or through zero from the last reading)', () => [I3, I5, I9, I11].every((i) => {
    const d = STEPS[i], R = d.right(d);
    const eq = (a, b, tol) => a.length === b.length && a.every((x, k) => (typeof x === 'number' ? near(x, b[k], tol) : x === b[k]));
    const text = (o) => (d.optKind === 'law' ? o === strip(lawStr(d.u, d.vals[o][0], d.vals[o][1])) : o.endsWith(' ' + d.vals[o][1]) && near(parseFloat(o), d.vals[o][0]));
    return d.opts.length === 3 && d.opts.indexOf(d.want) >= 0 && d.opts.every(text) && eq(d.vals[d.want], R, 1e-9) &&
      d.opts.every((o) => o === d.want || (!eq(d.vals[o], R, 1e-6) && !!d.slip[o] && eq(d.vals[o], d.slip[o](d), (d.stol && d.stol[o]) || 1e-9)));
  }));
  K.check('Which line fits: A leaves 6 above and none below; B leaves 3 and 3 but all 3 above sit on the left; C leaves 3 and 3 spread along it, with the shortest sticks', () => {
    const t = MACH.map((L) => tallyOf(L, RM));
    return t[0].up === 6 && t[0].dn === 0 && t[1].up === 3 && t[1].dn === 3 && t[1].sides.slice(0, 3).every((x) => x === 1) && flips(t[1].sides) === 1 &&
      t[2].up === 3 && t[2].dn === 3 && flips(t[2].sides) >= 3 && t[2].mx < t[0].mx && t[2].mx < t[1].mx && STEPS[I10].want === 'C' &&
      shown(I10).rows.join(' | ') === 'A: P = 0.15W + 4, 6 above, 0 below | B: P = 0.25W − 8, 3 above, 3 below, all 3 above on the left | C: P = 0.15W + 6, 3 above, 3 below, spread along it';
  });
  K.check('Which two points: the line far apart allows the narrowest range of gradients, the line close together a range five times as wide, and two readings give 0.08 Ω per °C, twice the line\'s', () => {
    const g = shown(I7), wc = drawn(I7, withSt(I7, { pick: STEPS[I7].opts[0], res: 'wrong' })), wr = drawn(I7, withSt(I7, { pick: STEPS[I7].opts[2], res: 'wrong' }));
    const fr = g.fans.find((p) => p.k === 'fr'), m = (RW[2][1] - RW[1][1]) / (RW[2][0] - RW[1][0]);
    return STEPS[I7].want === 'Line at 20 and 70 °C' && !!fr && near((0.06 - 0.02) / (fr.hi - fr.lo), 5, 1e-6) && !!wc.wrong && !!wr.wrong && near(m, 2 * FIT.m, 1e-9) && /0\.08 Ω per °C/.test(wr.wrong.text);
  });
  K.check('Before an answer a puzzle keeps back its working, triangle, intercept and fans; a right answer or Why? draws them; each wrong pick has a hint of its own, and a slip that can be drawn is drawn dashed', () => PICKS.every((i) => {
    const d = STEPS[i], post = d.post || {}, g0 = drawn(i, blank(i)), g1 = drawn(i, solvedSt(i)), g2 = drawn(i, withSt(i, { why: true }));
    const kept = g0.tris.length === 0 && !g0.icpt && g0.fans.length === 0 && g0.rows.length === 1 && /\?$/.test(g0.rows[0]);
    const opens = [g1, g2].every((g) => g.rows.length >= 1 && g.rows.every((r) => r.indexOf('?') < 0) && (post.tri ? g.tris.length === 1 : true) &&
      (post.icpt ? !!g.icpt : true) && (d.kind === 'far' ? g.fans.length === 1 : true));
    const wrongs = d.opts.every((o) => o === d.want || (!!d.hints[o] && d.hints[o] !== d.hint &&
      (d.draws.indexOf(o) < 0 || !!drawn(i, withSt(i, { pick: o, res: 'wrong' })).wrong)));
    return kept && opens && wrongs;
  }));
  K.check('Every stick runs straight up or down from its reading to the line, and the count above the graph matches the sticks drawn, wherever the handles are dragged', () => {
    const cases = [shown(I0), drawn(I1, blank(I1)), shown(I4), shown(I8), drawn(I10, withSt(I10, { pick: 'B' })),
      drawn(I0, withSt(I0, { touched: true, h: [9.8, 13.8] })), drawn(I4, withSt(I4, { touched: true, pin: false, h: [10.2, 13.4] })), drawn(I8, withSt(I8, { touched: true, pm: 2 }))];
    return cases.every((g) => !!g.tally && g.sticks.length === g.tally.up + g.tally.dn &&
      g.sticks.every((s) => near(s.yl, s.m * s.x + s.c, 1e-9) && (s.up ? s.y > s.yl : s.y < s.yl)) && g.sticks.filter((s) => s.up).length === g.tally.up &&
      g.tallyText.indexOf(g.tally.up + ' above') >= 0 && g.tallyText.indexOf(g.tally.dn + ' below') >= 0);
  });
  K.check('The through-zero switch pins the line at the origin: on, the line\'s c is 0 and one handle swings it; off, both handles are back on the line through the middle', () => {
    const on = drawn(I4, withSt(I4, { touched: true, pin: true, pm: PIN })), off = drawn(I4, withSt(I4, { touched: true, pin: false, h: hOf(FIT, [XA, XB]) }));
    return on.pin && near(on.L.c, 0) && on.handles.length === 1 && on.handles[0].n === 'hp' && !off.pin && off.handles.length === 2 && near(off.L.m, 0.04, 1e-9) && near(off.L.c, 10, 1e-9) &&
      on.rows[2] === 'Law: R = 0.26T' && off.rows[2] === 'Law: R = 0.04T + 10';
  });
  K.check('Every demonstration has finished arriving within its 2.8 to 5 s, none starting before the 0.35 s screen fade ends; a puzzle\'s drawing finishes within 2.5 s', () => {
    const keepT = T;
    const timed = (i, st, limit) => {
      const keepS = S[i];
      T = Infinity; latest = 0; earliest = Infinity; S[i] = st;
      try { paint(i); } finally { S[i] = keepS; }
      return latest <= limit + 1e-9;
    };
    const ok = STEPS.every((d, i) => (d.show ? timed(i, blank(i), d.dur) && d.dur >= 2.8 && d.dur <= 5 && earliest >= FADE
      : timed(i, solvedSt(i), FB) && timed(i, withSt(i, { why: true }), FB)));
    T = keepT; paint();
    return ok && FB <= 2.5;
  });

  K.ready();
</script>
