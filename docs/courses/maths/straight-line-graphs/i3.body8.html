  .ro .pc { white-space: nowrap; }

  .scene .at { font: 600 13px var(--k-font); fill: var(--k-muted); }

  .scene .ln.alt { stroke: var(--k-accent); }
  .scene .gh { stroke: var(--k-muted); stroke-width: 2; stroke-opacity: .5; stroke-linecap: round; fill: none; }
  /* The small step under the m handle: 1 across, then m up or down. A second step is teal. */
  .scene .tri { fill: var(--k-accent2); fill-opacity: .07; stroke: none; }
  .scene .tri.teal { fill: var(--k-accent); }
  .scene .sh { stroke: var(--k-accent2); stroke-width: 2.5; stroke-linecap: round; fill: none; }
  .scene .sh.teal { stroke: var(--k-accent); }
  .scene .hd { fill: var(--k-accent2); stroke: none; }
  .scene .hd.teal { fill: var(--k-accent); }

  .scene .mh { fill: var(--k-accent2); stroke: var(--k-bg); stroke-width: 2; }
  .scene .xi { fill: var(--k-accent); stroke: var(--k-bg); stroke-width: 2; }

  .scene .ring { fill: none; stroke: var(--k-accent2); stroke-opacity: .4; stroke-width: 1.5; }

    const kk = keys[k], nx = keys[k + 1];

    if (k > 0) {
      const s = (T - kk.at) / kk.tr;
      if (s < 1) {
        const e = K.ease(Math.max(0, s));
        m = K.lerp(keys[k - 1].m, kk.m, e); c = K.lerp(keys[k - 1].c, kk.c, e);
        moving = true; lin = 0;
      } else lin = arr(kk.at + kk.tr, 0.4);
    }
    const out = nx ? 1 - arr(nx.at - 0.3, 0.3) : 1;
    return { m, c, k, moving, la: moving ? 0 : lin * out };
  }
  function values(d, st) {
    if (d.kind === 'set' && (st.res === 'right' || st.why)) return { m: d.m, c: d.c, la: 1, moving: false };
    if (st.mc) return { m: st.mc.m, c: st.mc.c, la: 1, moving: false };
    if (d.keys) return phase(d);
    if (d.start) return { m: d.start.m, c: d.start.c, la: 1, moving: false };
    return { m: d.m, c: d.c, la: 1, moving: false };
  }
  function keyNow(d) {
    if (d.start) return { m: d.start.m, c: d.start.c };
    if (!d.keys) return { m: d.m, c: d.c };
    const k = T === Infinity ? d.keys.length - 1 : phase(d).k;
    return { m: d.keys[k].m, c: d.keys[k].c };
  }

  // ---------- the working rows above the grid ----------
  function testRow(lab, p, m, c, a1, a2, cf, live) {
    const val = m * p[0] + c, fits = fitsRule(m, c, p);
    return { lab, live, pieces: [{ s: (cf ? cfirstMul(m, c, p[0]) : mulStr(m, p[0], c)) + ' = ' + neg(val) + ',', a: a1, cls: '' }, { s: fits ? 'on the line' : 'not ' + neg(p[1]), a: a2, cls: fits ? 'end' : '' }] };
  }
  function rowsNow(d, st, V, open, A, tl) {
    const m = V.m, c = V.c, dragged = !!(st.mc || st.P);
    const rt = (j) => (d.show ? tl['r' + j] : PZ['r' + j]);
    const pcs = (list, t0, endLast, a0) => list.map((s, n) => ({ s, a: (a0 == null ? 1 : a0) * (t0 == null ? 1 : A(t0 + 0.3 * n)), cls: endLast && n === list.length - 1 ? 'end' : '' }));
    const q = (s) => [{ pieces: [{ s, a: 1, cls: 'q' }] }];
    if (d.kind === 'from2') {
      const a = d.pts[0], b = d.pts[1], g = (b[1] - a[1]) / (b[0] - a[0]);
      return [
        { pieces: [{ s: 'm = (' + neg(b[1]) + ' − ' + br(a[1]) + ') ÷ (' + neg(b[0]) + ' − ' + br(a[0]) + ') = ' + neg(g) + ',', a: A(tl.r0), cls: '' },
          { s: 'c = ' + neg(a[1]) + ' − ' + neg(g * a[0]) + ' = ' + neg(a[1] - g * a[0]), a: A(tl.clab), cls: '' }] },
        { pieces: [{ s: 'so ' + ruleTidy(m, c), a: A(tl.r1), cls: 'end' }] },
        testRow('B ' + coord(b), b, m, c, A(tl.lit), A(tl.lit2))];
    }
    if (d.kind === 'test') {
      if (!open) return q(d.ask);
      return d.opts.map((o, j) => testRow(o, d.vals[o], m, c, A(rt(j)), A(rt(j) + 0.3)));
    }
    if (d.kind === 'handles') {
      const ks = d.keys, start = { lab: 'Start', pieces: pcs([ruleRow(ks[0].m, ks[0].c)]) };
      if (dragged) return [start, { lab: 'Now', pieces: pcs(['m = ' + neg(m) + ',', 'c = ' + neg(c)]) }, { pieces: pcs(['so ' + ruleRow(m, c)], null, true) }];
      return [start].concat(ks.filter((k) => k.lab).map((k) => ({ lab: k.lab, pieces: [{ s: ruleRow(k.m, k.c), a: arr(k.at + k.tr, 0.4), cls: 'end' }] })));
    }
    if (d.kind === 'set') {
      if (!open) return [{ lab: 'Your line', live: true, pieces: pcs(['m = ' + neg(m) + ',', 'c = ' + neg(c) + ',', 'so ' + ruleRow(m, c)]) }].concat(q(d.ask));
      return [{ lab: 'Start at c', pieces: pcs([coord([0, d.c])], rt(0)) }, { lab: 'Each 1 along', pieces: pcs([(d.m < 0 ? 'down ' : 'up ') + neg(Math.abs(d.m)) + ',', 'so ' + ruleTidy(d.m, d.c)], rt(1), true) }];
    }
    if (d.kind === 'read' || d.kind === 'bill') {
      if (!open) return q(d.ask);
      const out = [{ pieces: pcs(['m = ' + neg(m) + ',', 'c = ' + neg(c) + ',', 'so ' + ruleTidy(m, c)], rt(0), true) }];
      if (d.tp) { const y = m * d.tp[0] + c; out.push({ lab: neg(d.tp[0]) + ' hours', pieces: pcs([mulStr(m, d.tp[0], c) + ' = ' + neg(y) + ',', 'so £' + neg(y)], rt(1), true) }); }
      return out;
    }
    if (d.kind === 'cfirst') {
      const r0 = { pieces: [{ s: cfirstStr(m, c), a: 1, cls: '' }] };
      if (!open) return [r0].concat(q(d.ask));
      r0.pieces.push({ s: '= ' + tidyRHS(m, c), a: A(rt(0)), cls: '' });
      const out = [r0, { pieces: pcs(['so m = ' + neg(m) + ',', 'c = ' + neg(c)], rt(1), true) }];
      if (d.P) { const p = st.P || d.P; out.push(testRow('P ' + coord(p), p, m, c, A(tl.r2), A(tl.lit), true, true)); }
      return out;
    }
    if (d.kind === 'xint') {
      if (!open) return q(d.ask);
      const r1 = solvePieces(m, c), xv = -c / m;
      if (Math.abs(m) > 1e-12 && (xv < d.view.x0 - 1e-9 || xv > d.view.x1 + 1e-9)) r1[r1.length - 1] += ', beyond the grid';
      return [{ lab: 'At x = 0', pieces: pcs(['y = ' + mulStr(m, 0, c), '= ' + neg(c)], rt(0), true) },
        { lab: 'At y = 0', live: !!d.drag, pieces: pcs(r1, rt(1), true) }];
    }
    if (d.kind === 'par') {
      if (d.show) {
        const g = d.ghost;
        return [{ lab: 'Faint', pieces: pcs([ruleTidy(g.m, g.c)]) }, { lab: 'Now', pieces: pcs([ruleTidy(m, c)], null, false, V.la) },
          { live: true, pieces: pcs(parSay(g, m, c, false), dragged ? null : tl.r2, true, V.moving ? 0 : 1) }];
      }
      if (!open) return q(d.ask);
      return d.opts.map((o, j) => ({ lab: o, pieces: pcs(parSay({ m: d.m, c: d.c }, d.vals[o][0], d.vals[o][1], true), rt(j), true) }));
    }
    if (d.kind === 'halve') {
      const r0 = { pieces: [{ s: kForm(d.k, m, c), a: 1, cls: '' }] };
      if (!open) return [r0].concat(q(d.ask));
      return [r0, { lab: 'Divide every term by ' + d.k, live: !!d.drag, pieces: pcs([ruleRow(m, c)], rt(1)) }, { pieces: pcs(['so m = ' + neg(m) + ',', 'c = ' + neg(c)], rt(2), true) }];
    }
    return [];
  }
  function drawRows(rows) {
    const box = el('rows');
    box.textContent = '';
    rows.forEach((r) => {
      const p = box.appendChild(K.el('p', { class: 'wk' + (r.live ? ' live' : '') }));
      if (r.lab) { const h = p.appendChild(K.el('span', { class: 'lab' })); italics(h, r.lab + ': ', false); K.fade(h, r.pieces[0].a, 0); }   // a heading arrives with its row
      r.pieces.forEach((pc, n) => {
        const s = p.appendChild(K.el('span', { class: 'pc ' + (pc.cls || '') }));
        italics(s, pc.s, false);
        K.fade(s, pc.a, 0);
        if (n < r.pieces.length - 1) p.appendChild(document.createTextNode(' '));
      });
      REC.rows.push((r.lab ? r.lab + ': ' : '') + r.pieces.map((pc) => pc.s).join(' '));
    });
  }
  function describe(d, V, open) {
    let s = d.kind === 'bill' ? 'A grid of hours across and pounds up, with a straight line' : 'A squared grid with a straight line';
    if (!d.show && !open && (d.q || (d.hide && d.hide.cdot))) return s + ' to read.';
    s += ', ' + say(ruleTidy(V.m, V.c)) + '. The round c dot is on the y-axis at ' + say(coord([0, V.c])) + ', and the step under the m handle goes 1 along and ' +
      (Math.abs(V.m) < 1e-12 ? 'stays level.' : V.m > 0 ? say(neg(V.m)) + ' up.' : say(neg(-V.m)) + ' down.');
    if (REC.xi) s += ' A diamond marks the x-intercept at ' + say(coord([REC.xi.v, 0])) + '.';
    if (REC.ghost) s += ' A faint copy of ' + say(ruleTidy(d.ghost.m, d.ghost.c)) + ' stays put.';
    if (REC.ans) s += ' The line ' + say(ruleTidy(REC.ans[0], REC.ans[1])) + ' runs alongside it.';
    REC.tps.forEach((t) => { s += ' The point ' + say(coord(t.p)) + (t.lit ? ' lights up, on the line.' : t.fits ? ' is on the line.' : ' is off the line.'); });
    return s;
  }

  // The scene for a step (the animation calls this every frame).
  function paint(i) {
    if (i == null) i = at();
    const d = STEPS[i], st = S[i], G = geo(d), v = d.view;
    art.textContent = '';
    REC = { m: 0, c: 0, line: null, ghost: null, ans: null, cdot: null, mh: null, step: null, xi: null, tps: [], gaps: [], rows: [], labels: [] };
    OBS = { hard: [], segs: [] };
    svg.setAttribute('viewBox', '0 0 340 ' + G.H);
    const dragged = !!(st.mc || st.P);
    const V = values(d, st), m = V.m, c = V.c, la = V.la;
    REC.m = m; REC.c = c;
    const open = !!d.show || st.res === 'right' || st.why;
    const tl = d.show ? (dragged ? {} : d.tl || {}) : PZ, sc = d.show ? 1 : 0.6;
    const A = (t0, dd) => (t0 == null ? 1 : arr(t0 * sc, (dd == null ? 0.4 : dd) * sc));
    const hid = (name) => !d.show && !!d.hide && !!d.hide[name];
    const part = (name, key) => (d.show ? A(tl[key || name]) : hid(name) ? (open ? A(PZ[key || name]) : 0) : 1);
    const asked = (name) => !d.show && !!d.q && !!d.q[name];
    const askA = (name) => (asked(name) && open ? A(PZ.lab) : 1);
    const xy = (p) => [G.px(p[0]), G.py(p[1])];
    const items = [];
    drawGrid(G);

    // The faint copy that stays put (the parallel screen).
    if (d.ghost) {
      const s = clipLine(G, d.ghost.m, d.ghost.c);
      if (s) {
        ln('gh', s[0], s[1], s[2], s[3]); OBS.segs.push({ s, c: 60 }); REC.ghost = s;
        items.push(Object.assign(along(s, [0.86, 0.7, 0.14, 0.3]), { text: ruleTidy(d.ghost.m, d.ghost.c), class: 'lab mu', a: 1 }));
      }
    }
    // Gap brackets measure from a base line to another: the faint copy to the line, or the given line to the answer.
    let other = null;
    if (d.kind === 'par') other = d.show ? { m, c, base: d.ghost } : { m: d.vals[d.want][0], c: d.vals[d.want][1], base: { m: d.m, c: d.c } };
    if (other && !d.show) {
      const aAns = part('ans'), s = clipLine(G, other.m, other.c);
      if (s && aAns > 0) {
        K.fade(ln('ln alt', s[0], s[1], s[2], s[3]), aAns, 0); OBS.segs.push({ s, c: 120 });
        items.push(Object.assign(along(s, [0.82, 0.66, 0.18, 0.34]), { text: ruleTidy(other.m, other.c), class: 'lab tl', a: aAns }));
      }
      if (aAns >= 0.5) REC.ans = [other.m, other.c];
    }
    if (other) {
      const b = other.base;
      (d.gx || []).forEach((x, j) => {
        const y1 = b.m * x + b.c, y2 = other.m * x + other.c, g = y2 - y1;
        const a = d.show ? (dragged ? 1 : A(tl.gaps ? tl.gaps[j] : null)) * (V.moving ? 0 : 1) : open ? A(PZ.gaps[Math.min(j, PZ.gaps.length - 1)]) : 0;
        if (Math.abs(g) < 1e-9 || y1 < v.y0 || y1 > v.y1 || y2 < v.y0 || y2 > v.y1 || a <= 0) return;
        const X = G.px(x), Y1 = G.py(y1), Y2 = G.py(y2);
        [ln('gap', X, Y1, X, Y2), ln('gap', X - 5, Y1, X + 5, Y1), ln('gap', X - 5, Y2, X + 5, Y2)].forEach((e) => K.fade(e, a, 0));
        OBS.segs.push({ s: [X, Y1, X, Y2], c: 300 });
        items.push(Object.assign(spots(X, (Y1 + Y2) / 2, [[8, 5, 'start'], [-8, 5, 'end']]), { text: neg(Math.abs(g)), class: 'lab tl', a }));
        if (a >= 0.5) REC.gaps.push({ x, g });
      });
    }
    // The line itself.
    const L = clipLine(G, m, c);
    if (L) { ln('ln', L[0], L[1], L[2], L[3]); OBS.segs.push({ s: L, c: 120 }); REC.line = L; }

    // The small step under the m handle: from the c dot, 1 across, then m up or down.
    const O = xy([0, c]), Cn = xy([1, c]), Tp = xy([1, c + m]), flat = Math.abs(m) < 1e-12;
    const grow = (off) => (d.show ? (tl.step == null ? 1 : A(tl.step + off, 0.6)) : hid('step') ? (open ? A(PZ.step + off, 0.6) : 0) : 1);
    const gRun = grow(0), gRise = grow(0.6);
    stepDraw(O, Cn, Tp, gRun, gRise, '');
    if (gRun >= 1 && gRise >= 1) REC.step = { O, Cn, Tip: Tp };
    if (gRun > 0) {
      const ry = m >= 0 ? O[1] + 19 : O[1] - 8, oy = m >= 0 ? O[1] - 8 : O[1] + 19, mx = (O[0] + Cn[0]) / 2;
      items.push({ x: mx, y: ry, anchor: 'middle', alts: [{ x: mx, y: ry, anchor: 'middle' }, { x: mx, y: oy, anchor: 'middle' }], text: v.run, class: 'lab nv', a: gRun });
      const mTxt = asked('m') && !open ? 'm = ?' : 'm = ' + neg(m);
      const aMl = (flat ? gRun : gRise) * (d.show ? A(tl.mlab) : askA('m')) * la;
      const mid = (Cn[1] + Tp[1]) / 2;
      const ms = flat ? spots(Tp[0], Tp[1], [[13, -9, 'start'], [0, -14, 'middle'], [13, 19, 'start']]) : spots(Cn[0], mid, [[9, 5, 'start'], [-9, 5, 'end'], [13, Tp[1] - mid + 5, 'start']]);
      items.push(Object.assign(ms, { text: mTxt, class: 'lab nv', a: aMl }));
    }
    // A second step on (teal), 1 more across and m more, on the number-first screen.
    if (d.step2) {
      const g1 = d.show && tl.step2 != null ? A(tl.step2, 0.6) : 1, g2 = d.show && tl.step2 != null ? A(tl.step2 + 0.6, 0.6) : 1;
      const C2 = xy([2, c + m]), T2 = xy([2, c + 2 * m]);
      stepDraw(Tp, C2, T2, g1, g2, ' teal');
      const mx = (Tp[0] + C2[0]) / 2, ry = m >= 0 ? Tp[1] + 19 : Tp[1] - 8;
      items.push({ x: mx, y: ry, anchor: 'middle', text: '1', class: 'lab tl', a: g1 });
      if (!flat) items.push(Object.assign(spots(C2[0], (C2[1] + T2[1]) / 2, [[9, 5, 'start'], [-9, 5, 'end']]), { text: neg(m), class: 'lab tl', a: g2 }));
    }
    const handles = d.drag === 'cm' && canDrag(d, st);
    // The m handle at the step's tip, on the line 1 along from the crossing.
    const aMh = Math.min(gRun, gRise);
    if (aMh > 0 && !d.pts) {
      if (handles) add(K.svg('circle', { class: 'ring', cx: r2(Tp[0]), cy: r2(Tp[1]), r: 10 }));
      K.fade(add(K.svg('circle', { class: 'mh', cx: r2(Tp[0]), cy: r2(Tp[1]), r: 5.5 })), aMh, 0);
      OBS.hard.push({ x0: Tp[0] - 9, y0: Tp[1] - 9, x1: Tp[0] + 9, y1: Tp[1] + 9 });
      if (aMh >= 0.5) REC.mh = { x: Tp[0], y: Tp[1] };
    }
    // The round c dot where the line crosses the y-axis.
    const aC = part('cdot');
    if (aC > 0) {
      if (handles) add(K.svg('circle', { class: 'ring', cx: r2(O[0]), cy: r2(O[1]), r: 11 }));
      K.fade(add(K.svg('circle', { class: 'pt', cx: r2(O[0]), cy: r2(O[1]), r: 7 })), aC, 0);
      OBS.hard.push({ x0: O[0] - 10, y0: O[1] - 10, x1: O[0] + 10, y1: O[1] + 10 });
      // c's label sits beside the dot, left of the y-axis first, reaching into the number margin when the
      // axis is near the grid's edge; it may cover only the number at c's own height, which fades as it
      // arrives. On a puzzle that asks for c it waits for the answer, so that number stays readable.
      const cTxt = asked('c') && !open ? 'c = ?' : 'c = ' + neg(c);
      const aCl = aC * (d.show ? A(tl.clab) : asked('c') ? (open ? A(PZ.lab) : 0) : 1) * la;
      items.unshift(Object.assign(spots(O[0], O[1], C_AT), { text: cTxt, class: 'lab nv', a: aCl, B: { x0: 2, x1: 338, y0: 3, y1: G.gy + G.gh - 2 }, isC: true }));
      YT.forEach((t) => { if (Math.abs(t.val - c) > 1e-9) OBS.hard.push(t.box); });
      if (aC >= 0.5) REC.cdot = { x: O[0], y: O[1], shape: 'circle' };
    }
    // The x-intercept: a diamond where y = 0, a different shape from the round c dot.
    if (d.xi && !flat) {
      const xv = -c / m, aX = part('xi');
      if (xv >= v.x0 - 1e-9 && xv <= v.x1 + 1e-9 && aX > 0) {
        const X = G.px(xv), Y = G.py(0), s = 7.5;
        K.fade(add(K.svg('path', { class: 'xi', d: 'M' + r2(X) + ' ' + r2(Y - s) + ' L' + r2(X + s) + ' ' + r2(Y) + ' L' + r2(X) + ' ' + r2(Y + s) + ' L' + r2(X - s) + ' ' + r2(Y) + ' Z' })), aX, 0);
        OBS.hard.push({ x0: X - 10, y0: Y - 10, x1: X + 10, y1: Y + 10 });
        items.push(Object.assign(spots(X, Y, XI_AT), { text: 'x-intercept (' + (exact(xv) ? '' : '≈ ') + neg(xv) + ', 0)', class: 'lab tl', a: aX * part('xi', 'xlab') }));
        if (aX >= 0.5) REC.xi = { v: xv, x: X, y: Y, shape: 'diamond' };
      }
    }
    // Named points (lesson 1's A and B) and test points: hollow, lit with a halo and "on the line" when they fit.
    if (d.pts) {
      const p = d.pts[0], X = G.px(p[0]), Y = G.py(p[1]);
      add(K.svg('circle', { class: 'pt', cx: r2(X), cy: r2(Y), r: 6.5 }));
      OBS.hard.push({ x0: X - 9, y0: Y - 9, x1: X + 9, y1: Y + 9 });
      items.push(Object.assign(spots(X, Y, [[-13, 5, 'end'], [0, -14, 'middle'], [13, 5, 'start'], [0, 24, 'middle']]), { text: 'A ' + coord(p), class: 'lab', a: 1 }));
    }
    const tests = [];
    if (d.kind === 'from2') tests.push({ p: d.pts[1], name: 'B ' + coord(d.pts[1]), solid: true, aS: 1, aL: A(tl.lit) });
    if (d.kind === 'test') d.opts.forEach((o) => tests.push({ p: d.vals[o], name: o, aS: part('cands'), aL: part('cands', 'lit') }));
    if (d.P) tests.push({ p: st.P || d.P, name: 'P ' + coord(st.P || d.P), aS: 1, aL: A(tl.lit), drag: d.drag === 'p' && !finished });
    if (d.tp) tests.push({ p: d.tp, name: coord(d.tp), aS: part('tp'), aL: part('tp', 'lit') });
    tests.forEach((t) => {
      if (t.aS <= 0) return;
      const X = G.px(t.p[0]), Y = G.py(t.p[1]), fits = fitsRule(m, c, t.p), cx = r2(X), cy = r2(Y);
      if (t.drag) add(K.svg('circle', { class: 'ring', cx, cy, r: 11 }));
      if (fits) K.fade(add(K.svg('circle', { class: 'halo', cx, cy, r: 12.5 })), t.aS * t.aL, 0);
      K.fade(add(K.svg('circle', { class: t.solid ? 'pt' : 'tp', cx, cy, r: 6.5 })), t.aS, 0);
      if (fits && !t.solid) K.fade(add(K.svg('circle', { class: 'tp on', cx, cy, r: 6.5 })), t.aS * t.aL, 0);
      OBS.hard.push({ x0: X - 12, y0: Y - 12, x1: X + 12, y1: Y + 12 });
      items.push(Object.assign(spots(X, Y, PT_AT), { text: t.name, class: 'lab', a: t.aS }));
      if (fits) items.push(Object.assign(spots(X, Y, ON_AT), { text: 'on the line', class: 'lab tl', a: t.aS * t.aL }));
      REC.tps.push({ p: t.p, fits, lit: fits && t.aS >= 0.5 && t.aL >= 0.5 });
    });

    const pos = placeLabels(items, OBS.hard, OBS.segs, { x0: G.gx + 2, x1: 338, y0: 3, y1: G.gy + G.gh - 2 });
    labs.textContent = '';
    items.forEach((it, n) => {
      const t = labs.appendChild(K.svg('text', { class: it.class, x: r2(pos[n].x), y: r2(pos[n].y), 'text-anchor': pos[n].anchor || 'middle' }));
      italics(t, it.text, true);
      K.fade(t, it.a, 0);
      if (it.a >= 0.5) REC.labels.push(it.text);
      if (it.isC) YT.forEach((y) => { if (meets(pos[n].b, y.box, 1)) K.fade(y.el, 1 - it.a, 0); });   // the number c's label covers
    });
    drawRows(rowsNow(d, st, V, open, A, tl));
    svg.setAttribute('aria-label', describe(d, V, open));
    placeGrips(d, V, st, G);
  }

  // ---------- dragging: the c handle slides c, the m handle turns m, P moves on whole numbers ----------
  const HN = ['c', 'm', 'p'];

        d.opts.every((o) => o === d.want || (!answerOk(d, d.vals[o]) && !!d.slip[o] && d.slip[o](d, d.vals[o])));
    }));
  K.check('Every demonstration has finished arriving within its 2.8 to 5 s, none starting before the 0.35 s screen fade ends; a puzzle\'s drawing finishes within 2.5 s', () => {
    const keepT = T;
    const timed = (i, st, limit) => {
      const keepS = S[i];
      T = Infinity; latest = 0; earliest = Infinity; S[i] = st;
      try { paint(i); } finally { S[i] = keepS; }
      return latest <= limit + 1e-9;
    };
    const ok = STEPS.every((d, i) => (d.show ? timed(i, blank(), d.dur) && d.dur >= 2.8 && d.dur <= 5 && earliest >= FADE
      : timed(i, solvedSt(i), FB) && timed(i, Object.assign(blank(), { why: true }), FB)));
    T = keepT; paint();
    return ok && FB <= 2.5;
  });

  K.ready();
</script>
