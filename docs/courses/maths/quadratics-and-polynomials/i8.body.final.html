<p class="caption">A sketch from each screen's own rule, its height squashed to fit; where it meets the axis is exact.</p>

<script>
  // ---------- the rules (pure, so the checks can test them) ----------
  // A rule is a list of its numbers, highest power first: x³ − 6x² + 11x − 6 is [1, −6, 11, −6].
  const close = (a, b) => Math.abs(a - b) < 1e-9 * Math.max(1, Math.abs(a), Math.abs(b));
  const fmtN = (v) => { let r = Math.round(v * 100) / 100; if (Math.abs(r) < 1e-12) r = 0; return (r < 0 ? '−' : '') + String(Math.abs(r)); };
  const distinct = (a) => a.filter((v, i) => a.indexOf(v) === i);
  const same = (a, b) => a.length === b.length && a.every((v, k) => close(v, b[k]));
  const evalP = (cs, x) => cs.reduce((v, c) => v * x + c, 0);
  const mul = (p, q) => { const o = new Array(p.length + q.length - 1).fill(0); p.forEach((u, i) => q.forEach((w, j) => { o[i + j] += u * w; })); return o; };
  const fromRoots = (rs) => rs.reduce((c, r) => mul(c, [1, -r]), [1]);
  const addC = (cs, k) => cs.map((c, i) => (i === cs.length - 1 ? c + k : c));
  // Dividing by (x − a), the four moves at a time: what comes out (q) and what is left over (r).
  function divide(cs, a) { const q = []; let r = 0; cs.forEach((c, k) => { r = r * a + c; if (k < cs.length - 1) q.push(r); }); return { q, r }; }
  const POW = ['', 'x', 'x²', 'x³'], SUP = ['', '', '²', '³'];
  function term(c, p, lead) {
    if (c === 0) return null;
    const m = Math.abs(c), body = p === 0 ? String(m) : (m === 1 ? '' : String(m)) + POW[p];
    return lead ? (c < 0 ? '−' : '') + body : (c < 0 ? '− ' : '+ ') + body;
  }
  function fmtPoly(cs) { const deg = cs.length - 1, out = []; cs.forEach((c, k) => { const t = term(c, deg - k, !out.length); if (t) out.push(t); }); return out.length ? out.join(' ') : '0'; }
  // The bracket a root makes zero: the root 2 gives (x − 2), the root −2 gives (x + 2), the root 0 gives x.
  const brOf = (r) => (r === 0 ? 'x' : '(x ' + (r > 0 ? '− ' : '+ ') + fmtN(Math.abs(r)) + ')');
  const divisorText = (a) => (a === 0 ? 'x' : 'x ' + (a > 0 ? '− ' : '+ ') + fmtN(Math.abs(a)));
  function bracketsOf(rs) {
    const gs = [];
    rs.forEach((r) => { const g = gs.find((s) => s.r === r); if (g) g.n++; else gs.push({ r, n: 1 }); });
    gs.sort((a, b) => (a.r === 0 ? -1 : 0) - (b.r === 0 ? -1 : 0));
    return gs.map((g) => (g.r === 0 ? 'x' + SUP[g.n] : brOf(g.r) + SUP[g.n])).join('');
  }
  // A value put into the rule term by term, as the lesson writes it: 64 − 96 + 44 − 6 = 6.
  function termsText(cs, a) {
    const deg = cs.length - 1, vals = [];
    cs.forEach((c, k) => { const v = c * Math.pow(a, deg - k); if (v !== 0) vals.push(v); });
    const P = evalP(cs, a);
    if (vals.length < 2) return fmtN(P);
    let s = fmtN(vals[0]);
    vals.slice(1).forEach((v) => { s += (v < 0 ? ' − ' : ' + ') + fmtN(Math.abs(v)); });
    return s + ' = ' + fmtN(P);
  }
  const workP = (cs, a) => 'P(' + fmtN(a) + ') = ' + termsText(cs, a);
  // A rule in brackets, put back at x: each bracket's value, multiplied.
  const prodText = (rs, x) => { const v = rs.map((r) => x - r); return v.map(fmtN).join(' × ') + ' = ' + fmtN(v.reduce((s, u) => s * u, 1)); };
  // Where the curve meets the axis: a root twice touches, once or three times crosses.
  function shapeText(rs, lower) {
    const gs = distinct(rs).sort((a, b) => a - b).map((r) => ({ r, n: rs.filter((v) => v === r).length }));
    const runs = [];
    gs.forEach((g) => {
      const kind = g.n === 2 ? 'touches' : 'crosses', last = runs[runs.length - 1];
      if (last && last.kind === kind && !last.flat && g.n !== 3) last.rs.push(g.r); else runs.push({ kind, rs: [g.r], flat: g.n === 3 });
    });
    const list = (a) => (a.length === 1 ? fmtN(a[0]) : a.slice(0, -1).map(fmtN).join(', ') + ' and ' + fmtN(a[a.length - 1]));
    const s = runs.map((u) => u.kind + ' at ' + list(u.rs) + (u.flat ? ', flattening' : '')).join(', ');
    return lower ? s : s.charAt(0).toUpperCase() + s.slice(1);
  }

  const OPEN = [1, -6, 11, -6];
  // The spot-the-slip division of x³ − 6x² + 11x − 6 by (x − 1): the slip takes −x² away as if adding it.
  const SLIP = (() => {
    const a = 1, b = OPEN[1], c = OPEN[2], dd = OPEN[3];
    const back = mul([1, 0, 0], [1, -a]);              // x² times (x − 1)
    const slip = b + (-a), q0s = c + a * slip, Rs = dd + a * q0s;
    const L2 = term(b, 2, true) + ' − (' + term(-a, 2, true) + ') = ' + term(slip, 2, true);
    const after = [1, slip, q0s];
    return {
      slip, q0s, Rs, back, after,
      lines: [
        { s: 'x²(x − 1) = ' + fmtPoly(back), desc: 'multiply back' },
        { s: L2, desc: 'take away' },
        { s: 'x² ' + term(slip, 1) + ' ' + term(q0s, 0) + ', remainder ' + fmtN(Rs), desc: 'what comes out at the end' },
      ],
      fix: term(b, 2, true) + ' − (' + term(-a, 2, true) + ') is ' + term(b, 2, true) + ' ' + term(a, 2) + ' = ' + term(b + a, 2, true),
      l1check: 'x² × x = x³ and x² × −1 = −x²',
      back1: '(x − 1)(' + fmtPoly(after) + ') ' + (Rs < 0 ? '− ' : '+ ') + fmtN(Math.abs(Rs)),
      back2: '= ' + fmtPoly(addC(mul([1, -a], after), Rs)) + ', not ' + term(b, 2, true),
    };
  })();
  // The look ahead: (5x + 1) ÷ ((x − 1)(x + 2)) = A ÷ (x − 1) + B ÷ (x + 2).
  const pfN = (x) => 5 * x + 1;
  const PF_A = pfN(1) / (1 + 2), PF_B = pfN(-2) / (-2 - 1);
  const pfL = (x) => pfN(x) / ((x - 1) * (x + 2));
  const pfR = (x) => PF_A / (x - 1) + PF_B / (x + 2);
  const Q12 = divide([1, 0, -3, 2], 1).q;

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // roots: the handles (a rule from its brackets); poly + real: a rule given as numbers and its real roots.
  // hand: how the handles show (drag, show, after a right answer, found where the marker reads 0, pf).
  // rows: what the two rows above the grid say. marker: the try marker {lo, hi, x0, drag}. lo..hi: the grid's x.
  // mode: 'lin' draws the height to scale and lets the curve leave the grid; 'sq' squashes it so every value fits.
  // moves: a demonstration, {k: handle | m: marker, t0, t1, to}. A puzzle: opts, want; ans, where the marker
  // ends after a right answer; wrong: what each wrong pick puts back. nW: lines of working the screen keeps room for.
  const PICK = 'Tap one of the answers.';
  const STEPS = [
    { show: true, name: 'Roots make brackets', roots: [1, 2, 3], hand: 'drag', rows: 'roots', curve: true, shape: true, lo: -4.5, hi: 4.5, mode: 'lin', nW: 1,
      moves: [{ k: 0, t0: 0.9, t1: 1.9, to: -2 }, { k: 2, t0: 2.6, t1: 3.6, to: 4 }], dur: 4.0,
      text: 'A *polynomial* adds up whole-number powers of `x`, and its highest power is its *degree*: a *cubic*, such as `x³ − 6x² + 11x − 6`, has degree 3. A round handle at `a` puts the bracket `(x − a)` in the rule, and at `x = a` that bracket is 0, so the whole product is 0 and the curve meets the axis there. A fourth bracket would make `x⁴`, so a cubic meets the axis at most three times; drag a handle and both rows rewrite.' },
    { name: 'Read the handles', roots: [-1, 2, 4], hand: 'show', rows: 'hidden', curve: true, shape: true, lo: -4.5, hi: 4.5, mode: 'lin', nW: 2,
      opts: ['(x − 1)(x + 2)(x + 4)', '(x + 1)(x − 2)(x − 4)', '(x − 1)(x − 2)(x − 4)'], want: '(x + 1)(x − 2)(x − 4)',
      wrong: { '(x − 1)(x + 2)(x + 4)': { ring: 2, brs: [1, -2, -4] }, '(x − 1)(x − 2)(x − 4)': { ring: -1, brs: [1, 2, 4] } },
      task: 'The handles sit at −1, 2 and 4. Which rule has this curve?',
      why: 'The root −1 needs the bracket that −1 makes zero, which is `(x + 1)`. So the three handles give `(x + 1)(x − 2)(x − 4)`, which multiplies out to `x³ − 5x² + 2x + 8`.',
      hint: 'Not quite. Which bracket does each handle make zero?',
      hints: { '(x − 1)(x + 2)(x + 4)': 'Not quite. At the root 2 that rule gives `1 × 4 × 6 = 24`, not 0.', '(x − 1)(x − 2)(x − 4)': 'Not quite. At the root −1 that rule gives `−2 × −3 × −5 = −30`, not 0.' } },
    { show: true, name: 'Two roots together', roots: [1, 2, 3], hand: 'drag', rows: 'roots', curve: true, shape: true, lo: -4.5, hi: 4.5, mode: 'lin', nW: 1,
      moves: [{ k: 2, t0: 0.9, t1: 1.9, to: 2 }, { k: 0, t0: 2.7, t1: 3.7, to: 2 }], dur: 4.0,
      text: 'Push two handles together at 2 and that bracket comes twice, `(x − 1)(x − 2)²`: near 2 the square is never negative and `(x − 1)` stays about 1, so the curve comes down to the axis and goes back up, touching instead of crossing. A bracket that comes once or three times changes sign as `x` passes its root, so push the third handle to 2 too and `(x − 2)³` crosses, flattening as it goes. It multiplies out by `(a + b)³` = `(a + b)(a + b)²` = `a³ + 3a²b + 3ab² + b³`, with `a = x` and `b = −2`.' },
    { name: 'Cross or touch', roots: [-1, 3, 3], hand: 'after', rows: 'hidden', curve: true, shape: true, lo: -4.5, hi: 4.5, mode: 'lin', nW: 2,
      opts: ['(x − 1)(x + 3)²', '(x + 1)²(x − 3)', '(x + 1)(x − 3)²'], want: '(x + 1)(x − 3)²',
      wrong: { '(x − 1)(x + 3)²': { roots: [1, -3, -3] }, '(x + 1)²(x − 3)': { roots: [-1, -1, 3] } },
      task: 'This curve crosses the axis at −1 and touches it at 3. Which rule is it?',
      why: 'Touching at 3 means the root 3 comes twice, so `(x − 3)` is squared. Crossing at −1 means `(x + 1)` comes once. So the rule is `(x + 1)(x − 3)²`, which multiplies out to `x³ − 5x² + 3x + 9`.',
      hint: 'Not quite. A touch means that bracket comes twice.',
      hints: { '(x − 1)(x + 3)²': 'Not quite. That one touches at −3 and crosses at 1, so its signs are swapped.', '(x + 1)²(x − 3)': 'Not quite. That one touches at −1 and crosses at 3, the other way round.' } },
    { show: true, name: 'Hunt for a zero', poly: OPEN, real: [1, 2, 3], hand: 'found', rows: 'split', curve: true, marker: { lo: -1, hi: 5, x0: 0, drag: true }, lo: -1.5, hi: 5.5, mode: 'sq', nW: 2,
      moves: [{ m: 1, t0: 0.9, t1: 1.8, to: 1 }, { m: 1, t0: 2.6, t1: 3.4, to: 2 }], dur: 4.0,
      text: 'Now the handles are hidden and only the rule is left: slide the try marker, and where `P(a)` reads 0 the curve is on the axis. The *factor theorem* says that if `P(a) = 0`, then `(x − a)` is a factor, so there that bracket splits off and leaves a quadratic.' },
    { name: 'Which bracket?', poly: [1, 0, -7, 6], real: [-3, 1, 2], hand: 'found', rows: 'split', curve: 'after', marker: { lo: -3, hi: 6, x0: 0 }, ans: 2, lo: -4, hi: 6.5, mode: 'sq', nW: 2,
      opts: ['(x + 2)', '(x − 2)', '(x − 6)'], want: '(x − 2)',
      wrong: { '(x + 2)': { at: -2, not: true }, '(x − 6)': { at: 6, not: true } },
      task: 'Use the factor theorem: which bracket is a factor of `x³ − 7x + 6`?',
      why: 'Put in `x = 2` and the rule gives `8 − 14 + 6 = 0`, so `(x − 2)` is a factor. Dividing it out leaves `x² + 2x − 3`, so the rule is `(x − 2)(x² + 2x − 3)`.',
      hint: 'Not quite. Put each bracket\'s root into the rule and look for 0.',
      hints: { '(x + 2)': 'Not quite. `(x + 2)` has the root −2, where `P` is `−8 + 14 + 6 = 12`.', '(x − 6)': 'Not quite. `(x − 6)` has the root 6, where `P` is `216 − 42 + 6 = 180`.' } },
    { show: true, name: 'Divide like numbers', poly: OPEN, graph: false, rows: 'divres', div: { a: 1, num: true, t0: 0, t: 0.6, RT: 1.15, MT: 0.38, RS: 22, x10: 3.8 }, dur: 4.4,
      text: 'Dividing by a bracket uses the same four moves as long division with numbers. Divide the front (`x³ ÷ x = x²`), multiply back, take away and bring down, then repeat until a plain number is left. Put `x = 10` into each line and the two sums match.' },
    { name: 'Your move', poly: OPEN, graph: false, rows: 'plain', div: { a: 1, stop: 2, RS: 22 }, nW: 2,
      opts: ['−5x²', '−5x', '5x'], want: '−5x',
      wrong: { '−5x²': { extra: ['−5x²(x − 1) = −5x³ + 5x², but no x³ is left'] }, '5x': { extra: ['5x(x − 1) = 5x² − 5x, but the front is −5x²'] } },
      task: 'The first round of dividing by `(x − 1)` left `−5x² + 11x`. What goes on top next?',
      why: 'Divide the front each time: `−5x² ÷ x = −5x`. Then `−5x(x − 1) = −5x² + 5x`, and taking that away from `−5x² + 11x` leaves `6x`, ready for the last round.',
      hint: 'Not quite. Divide the front term by the x in (x − 1).',
      hints: { '−5x²': 'Not quite. Times `(x − 1)` that gives `−5x³ + 5x²`, but there is no `x³` left.', '5x': 'Not quite. Mind the sign: `−5x² ÷ x` is `−5x`.' } },
    { name: 'Spot the slip', poly: OPEN, graph: false, rows: 'plain', slip: true, nW: 2,
      opts: ['Line 1', 'Line 2', 'Line 3'], want: 'Line 2',
      wrong: { 'Line 1': { slipRing: 0 }, 'Line 3': { slipRing: 2 } },
      task: 'This division of `x³ − 6x² + 11x − 6` by `(x − 1)` has one slip. Which line holds it?',
      why: 'Taking away a minus is adding, so `−6x² − (−x²)` is `−6x² + x²`, which is `−5x²`. The slip leaves a remainder of −2, though `P(1) = 0` says there is none.',
      hint: 'Not quite. Look for a minus being taken away.',
      hints: { 'Line 1': 'Not quite. `x²` times `(x − 1)` is `x³ − x²`, so line 1 is right.', 'Line 3': 'Not quite. Line 3 follows from line 2, but `(x − 1)(x² − 7x + 4) − 2` expands to `x³ − 8x² + 11x − 6`, not `−6x²`.' } },
    { show: true, name: 'The remainder is P(a)', poly: OPEN, real: [1, 2, 3], hand: 'show', rows: 'rem', curve: true, marker: { lo: -1, hi: 5, x0: 0, drag: true }, lo: -1.5, hi: 5.5, mode: 'sq', GH: 100, nW: 2,
      div: { a: 'marker', t0: 1.6, t: 1.85, RT: 0.72, MT: 0.24, RS: 20 },
      moves: [{ m: 1, t0: 0.7, t1: 1.6, to: 4 }], dur: 4.4,
      text: 'Divide by `(x − 4)` and `x² − 2x + 3` comes out, with 6 left over. At `x = 4` that bracket is 0, so the whole product is 0 and only the 6 is left. So `P(4)`, which is `64 − 96 + 44 − 6`, is the remainder too: this is the *remainder theorem*.' },
    { name: 'Find the remainder', poly: OPEN, real: [1, 2, 3], hand: 'show', rows: 'remAfter', curve: true, marker: { lo: -1, hi: 5, x0: 0 }, ans: 5, lo: -1.5, hi: 5.5, mode: 'sq', nW: 2,
      opts: ['0', '24', '−336'], want: '24',
      wrong: { '0': { at: 5, not: true }, '−336': { at: -5, extra: ['That is the remainder for ' + brOf(-5) + '.'] } },
      task: 'What is the remainder when `x³ − 6x² + 11x − 6` is divided by `(x − 5)`?',
      why: 'By the remainder theorem, putting `x = 5` into the rule gives the remainder without any dividing, `125 − 150 + 55 − 6 = 24`. So the rule is `(x − 5)(x² − x + 6) + 24`.',
      hint: 'Not quite. Put the bracket\'s root into the rule.',
