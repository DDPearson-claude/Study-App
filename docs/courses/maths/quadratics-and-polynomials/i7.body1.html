<p class="lead">Example figures for three jobs: a ball thrown up at 19.6 m/s, a 12 V battery with 0.5 Ω inside it, and a 6 m beam carrying 2 kN on every metre.</p>

<div class="pz" id="pz">

  <div id="stepbox">
    <p class="k-label count" id="count"></p>

<p class="caption">Example figures. Each graph is its job's straight-line part, its squared part and the gap between them.</p>

<script>
  // ---------- the three jobs: each rule is a straight-line part minus a squared part ----------
  // h = h0 + vt − (g ÷ 2)t² for a ball thrown straight up; P = EI − rI² for a battery of voltage E with
  // r inside it; M = (wL ÷ 2)x − (w ÷ 2)x² for a beam of span L on two simple supports carrying w on
  // every metre. Written c + ax − bx²: c + ax is the straight-line part, bx² the squared part.
  const GRAV = 9.8;   // gravity, roughly, in m/s²; half of it, 4.9, is the ball's squared-part number
  const PIC = {
    ball:    { job: 'ball', v: 19.6, h0: 0, x0: 0, x1: 4, xt: [0, 1, 2, 3, 4], ym: 80, yt: [0, 20, 40, 60, 80], step: 0.1 },
    deck:    { job: 'ball', v: 4.9, h0: 9.8, x0: -1.2, x1: 2.2, xt: [-1, 0, 1, 2], ym: 25, yt: [0, 10, 20], deck: true },
    supply:  { job: 'supply', E: 12, r: 0.5, x0: 0, x1: 24, xt: [0, 4, 8, 12, 16, 20, 24], ym: 300, yt: [0, 100, 200, 300], step: 1 },
    supply2: { job: 'supply', E: 24, r: 1.5, x0: 0, x1: 16, xt: [0, 4, 8, 12, 16], ym: 400, yt: [0, 100, 200, 300, 400] },
    beam:    { job: 'beam', w: 2, L: 6, x0: 0, x1: 6, xt: [0, 1, 2, 3, 4, 5, 6], ym: 40, yt: [0, 10, 20, 30, 40], step: 0.5 },
    beam2:   { job: 'beam', w: 3, L: 4, x0: 0, x1: 4, xt: [0, 1, 2, 3, 4], ym: 25, yt: [0, 10, 20] },
  };
  const JOB = {
    ball: { name: 'Ball', xv: 't', yv: 'h', xu: 's', yu: 'm', yTitle: 'metres', xname: 'time', slider: 'Time',
      rows: ['no gravity', 'gravity\'s pull', '`h`, the gap'], said: ['where it would be with no gravity', 'gravity\'s pull'], roots: ['throw', 'lands'] },
    supply: { name: 'Supply', xv: 'I', yv: 'P', xu: 'A', yu: 'W', yTitle: 'watts', xname: 'current', slider: 'Current',
      rows: ['battery makes', 'lost inside', '`P`, the gap'], said: ['the power the battery makes', 'the power lost inside it'], roots: ['nothing connected', 'short circuit'] },
    beam: { name: 'Beam', xv: 'x', yv: 'M', xu: 'm', yu: 'kN·m', yTitle: 'kN·m', xname: 'distance along the beam', slider: 'Point along the beam',
      rows: ['support\'s turn', 'load\'s turn', '`M`, the gap'], said: ['the support\'s turning effect', 'the load\'s turning effect'], roots: ['support', 'support'] },
  };
  const pBall = PIC.ball, pDeck = PIC.deck, pSup = PIC.supply, pSup2 = PIC.supply2, pBeam = PIC.beam, pBeam2 = PIC.beam2;
  function coef(P) {
    if (P.job === 'ball') return { c: P.h0, a: P.v, b: GRAV / 2 };
    if (P.job === 'supply') return { c: 0, a: P.E, b: P.r };
    return { c: 0, a: P.w * P.L / 2, b: P.w / 2 };
  }
  const r3 = (v) => Math.round(v * 1000) / 1000;
  const n = (v) => { const r = r3(v); return (r < 0 ? '−' : '') + String(Math.abs(r)); };
  const stOf = (P, x) => { const k = coef(P); return k.c + k.a * x; };
  const qOf = (P, x) => coef(P).b * x * x;
  const gapOf = (P, x) => stOf(P, x) - qOf(P, x);
  function rootsOf(P) { const k = coef(P), s = Math.sqrt(k.a * k.a + 4 * k.b * k.c); return [r3((k.a - s) / (2 * k.b)), r3((k.a + s) / (2 * k.b))]; }
  const topOf = (P) => { const k = coef(P); return r3(k.a / (2 * k.b)); };
  const lineOf = (P) => { const k = coef(P); return (k.c ? n(k.c) + ' + ' : '') + (k.a === 1 ? '' : n(k.a)) + JOB[P.job].xv; };
  const sqOf = (P) => { const k = coef(P); return (k.b === 1 ? '' : n(k.b)) + JOB[P.job].xv + '²'; };
  // As drawn and written: each part to 3 decimal places (exact on every slider step), the gap their difference.
  function parts(P, x) { const S = r3(stOf(P, x)), Q = r3(qOf(P, x)); return { S, Q, G: r3(S - Q) }; }
  const uy = (P) => JOB[P.job].yu, ux = (P) => JOB[P.job].xu;
  function rowS(P, x) { const k = coef(P); return (k.c ? n(k.c) + ' + ' : '') + (k.a === 1 ? '' : n(k.a) + ' × ') + n(x) + ' = ' + n(parts(P, x).S) + ' ' + uy(P); }
  function rowQ(P, x) { const k = coef(P); return (k.b === 1 ? '' : n(k.b) + ' × ') + n(x) + '² = ' + n(parts(P, x).Q) + ' ' + uy(P); }
  function rowG(P, x) { const p = parts(P, x); return n(p.S) + ' − ' + n(p.Q) + ' = ' + n(p.G) + ' ' + uy(P); }
  const atRow = (P, x) => 'At ' + n(x) + ' ' + ux(P) + ': ' + rowG(P, x);
  const eq = (P) => '`' + lineOf(P) + ' = ' + sqOf(P) + '`';
  const rule = (P) => '`' + JOB[P.job].yv + ' = ' + lineOf(P) + ' − ' + sqOf(P) + '`';

  // Worked values the screens need, each from the rules above.
  const R_BALL = rootsOf(pBall), R_DECK = rootsOf(pDeck), R_SUP = rootsOf(pSup), R_SUP2 = rootsOf(pSup2);
  const I_BEST = topOf(pSup), V_LOAD = pSup.E - pSup.r * I_BEST, R_LOAD = V_LOAD / I_BEST, R_TWICE = 2 * R_LOAD, I_TWICE = pSup.E / (pSup.r + R_TWICE);
  const deckDiv = (() => { const k = coef(pDeck), A = k.a / k.b, C = k.c / k.b; return '`t² − ' + (A === 1 ? '' : n(A)) + 't − ' + n(C) + ' = 0`'; })();
  const allOn = (P, x) => 2 * stOf(P, x) - qOf(P, x);   // one support taking the whole load

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // pic: which job and figures. A SHOW step's glide moves the job's input over time [from s, to s,
  // from value, to value]; roots, peak and bar are when those marks arrive; work, extra lines of
  // working [text, when]. slide: Dan can drag the input himself. A puzzle: q, the lines of working
  // shown with the question; given, the marks shown from the start; reveal, what a right answer
  // lights; pts, the point on the graph each answer names; right, the working a right answer adds;
  // ow, the working each wrong answer puts back into the rule.
  const PICK = 'Tap one of the answers.';
  const STEPS = [
    { show: true, name: 'Thrown up', pic: 'ball', slide: true, dur: 4.0, glide: [[0.4, 2.2, 1, 4], [2.5, 3.8, 4, 1]],
      text: 'A ball is thrown straight up at 19.6 m/s. With no gravity it would rise `19.6t` metres in `t` seconds, its *straight-line part*, but gravity pulls it `4.9t²` below that line, its *squared part*. Its height `h` is the gap between the two, so slide the time and watch it open and close.' },
    { kind: 'pick', name: 'When it lands', pic: 'ball', given: [], reveal: ['curve', 'roots'],
      task: 'When does the ball land back on the ground?',
      q: ['It lands when `h` = 0, where ' + eq(pBall)],
      opts: ['4 s', '2 s', '0.25 s'], want: '4 s',
      pts: { '4 s': [R_BALL[1], 0], '2 s': [2, gapOf(pBall, 2)], '0.25 s': [0.25, gapOf(pBall, 0.25)] },
      right: [atRow(pBall, R_BALL[1]) + ', back on the ground'],
      ow: { '2 s': atRow(pBall, 2) + ', its top', '0.25 s': atRow(pBall, 0.25) + ', still rising' },
      hint: 'Not quite. It lands where the two parts are equal again.',
      hints: { '2 s': 'Not quite. At 2 s the ball is at its top, 19.6 m up.', '0.25 s': 'Not quite. That divides the wrong way, 4.9 ÷ 19.6.' },
      why: 'It lands when the gap closes, where `19.6t = 4.9t²`. Taking out `4.9t` gives `4.9t(4 − t) = 0`, so 0 s, the throw, or 4 s, the landing.' },
    { show: true, name: 'Roots and top', pic: 'ball', dur: 4.0, glide: [[1.8, 2.8, 1, 2]], roots: 0.4, peak: 2.9,
      work: [[eq(pBall) + ' when `' + n(coef(pBall).b) + 't(' + n(R_BALL[1]) + ' − t) = 0`', 0.9], ['Roots 0 s and ' + n(R_BALL[1]) + ' s, so the top is at ' + n(topOf(pBall)) + ' s', 1.5]],
      text: 'The gap closes where the two parts are equal, `19.6t = 4.9t²`, which is `4.9t(4 − t) = 0`. So it is zero at 0 s, the throw, and 4 s, the landing, the two *roots*. The top sits halfway, at 2 s, `39.2 − 19.6 = 19.6` m, the same digits as the speed only because of the speed chosen.' },
    { kind: 'pick', name: 'Off the deck', pic: 'deck', given: [], reveal: ['curve', 'roots'],
      task: 'Now a ball is thrown up at 4.9 m/s from a deck 9.8 m above the water, example figures. Its straight-line part starts at 9.8, so `h = 9.8 + 4.9t − 4.9t²`, drawn dashed before the throw. When does it hit the water?',
      q: ['Water when ' + eq(pDeck), 'Divide by ' + n(coef(pDeck).b) + ': ' + deckDiv],
      opts: ['2 s', '−1 s', '1 s'], want: '2 s',
      pts: { '2 s': [R_DECK[1], 0], '−1 s': [R_DECK[0], 0], '1 s': [1, gapOf(pDeck, 1)] },
      right: ['`(t − ' + n(R_DECK[1]) + ')(t + ' + n(-R_DECK[0]) + ')` = 0, so ' + n(R_DECK[1]) + ' s or ' + n(R_DECK[0]) + ' s', n(R_DECK[0]) + ' s is before the throw, so ' + n(R_DECK[1]) + ' s'],
      ow: { '−1 s': atRow(pDeck, R_DECK[0]) + ', before the throw', '1 s': atRow(pDeck, 1) + ', deck height' },
      hint: 'Not quite. Find where the two parts are equal, and keep a time after the throw.',
      hints: { '−1 s': 'Not quite. −1 s makes the rule zero, but it is before the throw.', '1 s': 'Not quite. At 1 s the ball is back level with the deck, 9.8 m up.' },
      why: 'Set the parts equal, `9.8 + 4.9t = 4.9t²`, and divide by 4.9 to get `t² − t − 2 = 0`. That is `(t − 2)(t + 1) = 0`, so 2 s or −1 s, and −1 s is before the throw.' },
    { show: true, name: 'A battery and a load', pic: 'supply', slide: true, dur: 4.2, glide: [[1.4, 2.8, 4, 24], [3.0, 4.1, 24, 4]], roots: 0.4,
      work: [['Short circuit: `E ÷ r` = ' + n(pSup.E) + ' ÷ ' + n(pSup.r) + ' = ' + n(pSup.E / pSup.r) + ' A', 0.9]],
      text: 'A 12 V battery with 0.5 Ω inside it makes `12I` watts at a current `I`, its straight-line part, and burns `0.5I²` of that inside, its squared part. The load gets the gap, `P`. Slide the current, and the gap closes at 0 A, nothing connected, and at `12 ÷ 0.5 = 24` A, a short circuit.' },
    { kind: 'pick', name: 'The best current', pic: 'supply', given: ['roots'], reveal: ['curve', 'peak'],
      task: 'What current gives the load the most power?',
      q: ['`P` is 0 at 0 A and at ' + n(R_SUP[1]) + ' A'],
      opts: ['12 A', '24 A', '6 A'], want: '12 A',
      pts: { '12 A': [I_BEST, gapOf(pSup, I_BEST)], '24 A': [R_SUP[1], 0], '6 A': [6, gapOf(pSup, 6)] },
      right: ['Halfway: (0 + ' + n(R_SUP[1]) + ') ÷ 2 = ' + n(I_BEST) + ' A', atRow(pSup, I_BEST)],
      ow: { '24 A': atRow(pSup, R_SUP[1]) + ', all lost inside', '6 A': atRow(pSup, 6) },
      hint: 'Not quite. The most power sits halfway between the roots.',
      hints: { '24 A': 'Not quite. 24 A is the short circuit, where the load gets 288 − 288 = 0 W.', '6 A': 'Not quite. 6 A gives the load 72 − 18 = 54 W. Try halfway between the roots.' },
      why: 'The gap is zero at 0 A and 24 A, and a parabola is the same either side of its middle. So the most power is halfway, at 12 A, where the load gets `144 − 72 = 72` W.' },
    { show: true, name: 'The most power', pic: 'supply', dur: 4.0, glide: [[0.4, 1.6, 4, 12]], peak: 1.8, bar: 3.2,
      work: [['Load\'s volts: ' + n(pSup.E) + ' − ' + n(pSup.r) + ' × ' + n(I_BEST) + ' = ' + n(V_LOAD) + ' V', 2.3], ['Load: ' + n(V_LOAD) + ' ÷ ' + n(I_BEST) + ' = ' + n(R_LOAD) + ' Ω, the same as `r`', 2.8]],
      text: 'The most power sits halfway between the roots, at 12 A, where the load gets `144 − 72 = 72` W. The load then has 6 V across it, so its resistance is `6 ÷ 12 = 0.5` Ω, the same as the battery\'s `r`. This is *maximum power transfer*, and half of the 144 W made is lost inside.' },
    { kind: 'pick', name: 'Double the load', pic: 'supply', loadR: R_TWICE, given: ['curve', 'roots', 'peak'], reveal: ['point'],
      task: 'At 12 A the load is 0.5 Ω. Double it to 1 Ω. What power does the load get now?',
      q: ['Before: 72 W at 12 A, with 0.5 Ω in the load'],

  // ---------- the graph: the two parts, the gap between them and the gap stood up from the axis ----------

  // ---------- the ball itself, beside the graph on the same heights ----------

  // ---------- lines of working: the two parts and the gap, then the working ----------
  function drawRows(P, L, xv, pl) {
    let y = L.rows + 15;
    const J = JOB[P.job];
    pl.rows.forEach((r) => {
      if (r.part != null) {
        const val = [rowS, rowQ, rowG][r.part](P, xv), yy = y;
        line(['c1', 'c2', 'c3'][r.part], 8, yy - 5, 24, yy - 5);

      }
      const lines = wrap(r.text, WRAPW, 'wk'), a = vis(r.t), yy = y;
      part(a, 4, () => lines.forEach((ln, m) => text(10, yy + m * LINEH, ln, 'wk' + (r.bad ? ' bad' : ''), 'start')));
      if (a >= 0.5) REC.rows.push({ text: r.text, bad: !!r.bad });

  }
  // The battery's power at its peak, split into the load's share and what is lost inside.
  function drawBar(P, L, pl) {
    part(vis(pl.bar), 4, () => {
      const p = parts(P, topOf(P)), x0 = 20, W = 300, y = L.bar, wl = W * p.G / p.S;
      text(170, y + 12, n(p.S) + ' W made by the battery', 'lb');
      path('brk', 'M' + x0 + ' ' + (y + 24) + 'V' + (y + 18) + 'H' + (x0 + W) + 'V' + (y + 24));

  }
  function describe(d, P, xv) {
    const J = JOB[P.job];
    let s = J.name + '. A graph against ' + J.xname + ' of ' + lineOf(P) + ', ' + J.said[0] + ', and ' + sqOf(P) + ', ' + J.said[1] + '.';
    if (REC.curve) s += ' The gap between them, drawn up from the axis, makes an upside-down U.';
    if (xv != null) s += ' At ' + n(xv) + ' ' + J.xu + ' the gap is ' + n(parts(P, xv).G) + ' ' + J.yu + '.';
    return s;
  }

  // The whole picture for a step now (the animations call this every frame).
  function paint(i) {
    if (i == null) i = at();
    const d = STEPS[i], st = S[i], P = PIC[d.pic], L = layout(d), pl = plan(d, st);
    art.textContent = '';
    into = null; DYN = []; FLOW = null;
    svg.setAttribute('viewBox', '0 0 340 ' + L.H);
    REC = { curve: false, dashed: false, samples: null, roots: null, peak: null, gap: null, ring: null, point: null, rows: [], ball: null, beamX: null, bar: null, supports: 0, texts: [] };
    const xv = inputNow(d, st);
    if (P.job === 'supply') drawCircuit(d, P, L, xv);
    if (P.job === 'beam') drawBeam(d, P, L, xv, pl);
    drawGraph(d, P, L, xv, pl);
    if (P.job === 'ball') drawColumn(d, P, L, d.show ? xv : pl.ballGlide ? glide(pl.ballGlide) : 0, pl);
    drawRows(P, L, xv, pl);
    if (d.bar != null) drawBar(P, L, pl);
    flushLabels();

    svg.setAttribute('aria-label', describe(d, P, xv));
  }

  // ---------- Dan sets the input himself: drag along the graph (or the beam) ----------
  const grip = ui.appendChild(K.svg('rect', { class: 'grip', x: 0, y: 0, width: 0, height: 0, tabindex: -1, role: 'slider', 'aria-orientation': 'horizontal' }));
  grip.style.display = 'none';
  let GL = null;
  function placeGrip(d, L, xv) {
    const on = !!d.slide && !finished, P = PIC[d.pic];
    grip.style.display = on ? '' : 'none';
    grip.setAttribute('tabindex', on ? '0' : '-1');
    GL = on ? L : null;
    if (!on) return;
    const top = P.job === 'beam' ? L.panel + 30 : L.PT, bot = P.job === 'beam' ? L.PB + 4 : L.track + 22;
    grip.setAttribute('x', L.PL - 16); grip.setAttribute('width', L.PR - L.PL + 32);
    grip.setAttribute('y', top); grip.setAttribute('height', bot - top);
    grip.setAttribute('aria-label', JOB[P.job].slider);
    grip.setAttribute('aria-valuemin', P.x0); grip.setAttribute('aria-valuemax', P.x1); grip.setAttribute('aria-valuenow', xv);
    grip.setAttribute('aria-valuetext', n(xv) + ' ' + JOB[P.job].xu);
  }
  const sliding = () => !finished && !!STEPS[at()].slide && !!GL;
  function setX(v) {
    const i = at(), d = STEPS[i], st = S[i], P = PIC[d.pic];
    v = snap(P, K.clamp(v, P.x0, P.x1));
    if (st.x === v && T === Infinity) return;

    st.x = v;

  }
  function xFrom(e) {
    const ctm = svg.getScreenCTM();

    const q = new DOMPoint(e.clientX, e.clientY).matrixTransform(ctm.inverse()), P = PIC[STEPS[at()].pic];
    return P.x0 + (q.x - GL.PL) / (GL.PR - GL.PL) * (P.x1 - P.x0);
  }
  let held = null;
  grip.addEventListener('pointerdown', (e) => {

    const v = xFrom(e);

  });
  grip.addEventListener('pointermove', (e) => {

    if (v != null) setX(v);
  });
  const letGo = (e) => { if (held === e.pointerId) held = null; };
  grip.addEventListener('pointerup', letGo);
  grip.addEventListener('pointercancel', letGo);
  grip.addEventListener('lostpointercapture', () => { held = null; });
  grip.addEventListener('keydown', (e) => {
    if (!sliding()) return;
    const d = STEPS[at()], P = PIC[d.pic], now = inputNow(d, S[at()]);
    const by = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1 }[e.key];
    if (by == null && e.key !== 'Home' && e.key !== 'End') return;
    e.preventDefault();
    setX(e.key === 'Home' ? P.x0 : e.key === 'End' ? P.x1 : now + by * (P.step || 0.1));
  });

  const byId = (id) => document.getElementById(id);
  write(byId('finish'), FINISH);
  const pills = Array.from(byId('jobs').children);
  K.update((p) => {
    const i = Math.round(p.step), d = STEPS[i], st = S[i], P = PIC[d.pic];
    if (!anim.playing()) T = Infinity;   // motion that was stopped (the page hidden, a test) shows finished
    if (i !== lastStep) {
      lastStep = i; enter('stepbox');
      if (d.show) { st.x = null; play(d.dur); } else { anim.pause(); T = Infinity; }
    }

    const right = st.res === 'right';
    byId('stepbox').hidden = finished;
    byId('done').hidden = !finished;
    byId('count').textContent = 'Step ' + (i + 1) + ' of ' + STEPS.length + ' · ' + JOB[P.job].name;
    pills.forEach((s, k) => s.classList.toggle('on', ['ball', 'supply', 'beam'][k] === P.job));
    const task = byId('task');
    task.className = 'task' + (d.show ? ' show' : '');
    write(task, d.show ? d.text : d.task);
    paint(i);
    if (flowing(d)) { if (!flow.playing()) flow.play(); } else if (flow.playing()) flow.pause();

    replayBtn.el.hidden = !d.show || REDUCE;
    byId('replay').hidden = replayBtn.el.hidden;
    const opts = d.show ? [] : d.opts || [];
    byId('picks').hidden = !opts.length;
    byId('picks').classList.toggle('long', opts.some((o) => o.length > 6));
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      b.setLabel(opts[k]);
      b.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });
    byId('acts').hidden = !!d.show;
    checkBtn.el.hidden = right;
    const fb = byId('fb');
    fb.hidden = !!d.show;
    fb.className = 'fb' + (right ? ' right' : st.res === 'wrong' ? ' wrong' : '');
    write(fb, d.show ? '' : right ? 'That\'s it.' : st.res === 'wrong' ? hintFor(i, st) : st.res === 'empty' ? PICK : '');
    const why = byId('why');
    why.hidden = d.show || !st.why;
    write(why, d.show ? '' : d.why);
    whyBtn.setLabel(st.why ? 'Hide why' : 'Why?');
    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !right);
    nextBtn.setLabel(i === STEPS.length - 1 ? 'Finish' : 'Continue');
    nav.hidden = backBtn.el.hidden && nextBtn.el.hidden;
  });

  // ---------- known answers, worked out by hand ----------
  const DO = STEPS.map((d, i) => i).filter((i) => !STEPS[i].show);
  const idx = (name) => STEPS.findIndex((d) => d.name === name);
  const solvedSt = (i) => Object.assign(blank(), { pick: STEPS[i].want, res: 'right' });
  const wrongSt = (i, o) => Object.assign(blank(), { pick: o, res: 'wrong' });
  const near = (a, b, tol) => Math.abs(a - b) <= (tol == null ? 1e-9 * Math.max(1, Math.abs(a), Math.abs(b)) : tol);
  // A step painted in the state given (finished, or t seconds into its motion): what it drew.
  function drawn(i, st, t) {
    const keepS = S[i], keepT = T, keepQ = QUICK;

    try {
      latest = 0; earliest = Infinity;
      paint(i);
      REC.latest = latest; REC.earliest = earliest;
      return REC;
    } finally { S[i] = keepS; T = keepT; paint(); QUICK = keepQ; }
  }
  // Each check ends by drawing the screen on show properly again.
  function check(label, fn, o) { K.check(label, () => { try { return fn(); } finally { QUICK = false; paint(); } }, o); }
  // Sums in a line of working: a − b = c, a × b = c, a ÷ b = c, brackets and squares.
  function evalNum(src0) {
    const src = src0.replace(/\s+/g, '');
    let i = 0;
    function expr() { let v = term(); while (src[i] === '+' || src[i] === '−') { const op = src[i++]; const t = term(); v = op === '+' ? v + t : v - t; } return v; }
    function term() { let v = pow(); while (src[i] === '×' || src[i] === '÷') { const op = src[i++]; const t = pow(); v = op === '×' ? v * t : v / t; } return v; }
    function pow() { let v = unary(); while (src[i] === '²') { i++; v *= v; } return v; }
    function unary() {
      if (src[i] === '−') { i++; return -unary(); }
      if (src[i] === '(') { i++; const v = expr(); if (src[i] !== ')') throw new Error('no closing bracket'); i++; return v; }
      const m = /^\d+(?:\.\d+)?/.exec(src.slice(i));
      if (!m) throw new Error('no number at ' + src.slice(i));
      i += m[0].length;
      return +m[0];
    }
    const v = expr();
    if (i !== src.length) throw new Error('left over ' + src.slice(i));
    return v;
  }
  const NUMCH = /[0-9.\s+−×÷()²]/;
  function leftOf(p) {
    let j = p.length;
    while (j > 0 && NUMCH.test(p[j - 1])) j--;
    while (j < p.length && p[j] === ' ') j++;
    const e = p.slice(j).trim();
    if (!e || !/^(\d|\(|−\d)/.test(e)) return null;
    if (j > 0 && !/[\s:]/.test(p[j - 1])) return null;
    return e;
  }
  function rightOf(p) {
    let j = 0;
    while (j < p.length && NUMCH.test(p[j])) j++;
    const e = p.slice(0, j).trim();
    if (!e || !/^(\d|\(|−\d)/.test(e)) return null;
    const dec = Math.max(0, ...(e.match(/\.\d+/g) || []).map((x) => x.length - 1));
    return { e, tol: 0.5 * Math.pow(10, -dec) + 1e-9 };
  }
  function sums(t) {
    const ps = plain(t).split(' = ');
    for (let k = 0; k + 1 < ps.length; k++) {
      const a = leftOf(ps[k]), b = rightOf(ps[k + 1]);
      if (a == null || b == null) continue;
      let va, vb;
      try { va = evalNum(a); vb = evalNum(b.e); } catch (e) { return false; }
      if (!(Math.abs(va - vb) <= b.tol)) return false;
    }
    return true;
  }

  check('The coefficient 4.9 comes from ½ × 9.8, since gravity accelerates objects at approximately 9.8 m/s²: on both ball screens the squared part is 4.9t², and at every time on the slider the ball, its two parts and the gap drawn follow h = 19.6t − 4.9t² (14.7 m at 1 s)', () => {
    if (!(near(GRAV / 2, 4.9) && near(coef(pBall).b, 4.9) && near(coef(pDeck).b, 4.9) && sqOf(pBall) === '4.9t²' && lineOf(pBall) === '19.6t' && sqOf(pDeck) === '4.9t²')) return false;
    const i = idx('Thrown up');
    for (let k = 0; k <= 40; k++) {
      const t = k / 10, g = drawn(i, Object.assign(blank(), { x: snap(pBall, t) }));
      if (!g.gap || !near(g.gap.lo, 4.9 * t * t, 1e-6) || !near(g.gap.hi, 19.6 * t, 1e-6) || !near(g.gap.bar, 19.6 * t - 4.9 * t * t, 1e-6) || !near(g.ball, g.gap.bar, 1e-9)) return false;
    }
    const p = parts(pBall, 1);
    return near(p.S, 19.6) && near(p.Q, 4.9) && near(p.G, 14.7);
  }, { source: SRC[1] });
  check('The maximum height in a parabola sits in the middle of its roots: on every job the top drawn is halfway between the two roots drawn, where the straight-line part and the squared part are equal, and no setting gives a bigger gap', () => {
    let tops = 0;
    const ok = STEPS.every((d, i) => {
      const P = PIC[d.pic], g = drawn(i, d.show ? blank() : solvedSt(i)), R = rootsOf(P);
      if (!R.every((r) => near(stOf(P, r), qOf(P, r), 1e-6))) return false;
      if (g.roots && !(near(g.roots[0], R[0]) && near(g.roots[1], R[1]))) return false;
      if (!g.peak) return true;
      tops++;
      const mid = (R[0] + R[1]) / 2;
      return near(g.peak.x, mid, 1e-9) && near(g.peak.y, gapOf(P, mid), 1e-9) && K.linspace(R[0], R[1], 61).every((x) => gapOf(P, x) <= g.peak.y + 1e-9);
    });
    return ok && tops >= 6;
  }, { source: SRC[5] });
  check('The output power is a concave parabola in the current, vanishing at the no-load point (I = 0) and the short-circuit point (I = E ÷ r): for both supplies the load gets 0 W at 0 A and at E ÷ r, 24 A and 16 A, more than 0 W between, and each step up in current adds less than the one before', () =>
    near(pSup.E / pSup.r, 24) && near(pSup2.E / pSup2.r, 16) && [pSup, pSup2].every((P) => {
      const sc = P.E / P.r, R = rootsOf(P), f = (I) => gapOf(P, I), pts = K.linspace(0, sc, 49);
      return near(f(0), 0) && near(f(sc), 0, 1e-9) && near(R[0], 0) && near(R[1], sc, 1e-9) &&
        pts.slice(1, -1).every((I) => f(I) > 0) && pts.slice(1, -1).every((I, m) => f(pts[m]) + f(pts[m + 2]) < 2 * f(I));
    }), { source: SRC[3] });
  check('The most power reaches the load when its resistance is exactly the internal resistance r, at the optimal current E ÷ (2r): 12 ÷ (2 × 0.5) = 12 A, where the load has 12 − 0.5 × 12 = 6 V across it and 6 ÷ 12 = 0.5 Ω, and 24 ÷ (2 × 1.5) = 8 A; doubling the load to 1 Ω gives 8 A and only 64 W', () => {
    const g = drawn(idx('The most power'), blank());
    return near(I_BEST, pSup.E / (2 * pSup.r)) && near(I_BEST, 12) && near(V_LOAD, 6) && near(R_LOAD, pSup.r) &&
      near(topOf(pSup2), pSup2.E / (2 * pSup2.r)) && near(topOf(pSup2), 8) &&
      g.rows.some((r) => plain(r.text).indexOf('6 ÷ 12 = 0.5 Ω') >= 0) && !!g.bar && near(g.bar.load, g.bar.inside) && near(g.bar.made, 144) &&
      near(R_TWICE, 1) && near(I_TWICE, 8) && near(I_TWICE * I_TWICE * R_TWICE, 64) && near(gapOf(pSup, I_TWICE), 64) && gapOf(pSup, I_TWICE) < gapOf(pSup, I_BEST);
  }, { source: SRC[3] });
  check('From a uniformly distributed load w the maximum bending moment is M = w·L²/8, and the peak lands at midspan: 2 × 6² ÷ 8 = 9 kN·m at 3 m and 3 × 4² ÷ 8 = 6 kN·m at 2 m, the largest M drawn on each beam', () =>
    [['beam', 'Largest moment'], ['beam2', 'A shorter beam']].every((pair) => {
      const P = PIC[pair[0]], i = idx(pair[1]), g = drawn(i, solvedSt(i)), M8 = P.w * P.L * P.L / 8;
      return !!g.peak && near(g.peak.x, P.L / 2) && near(g.peak.y, M8) && K.linspace(0, P.L, 49).every((x) => gapOf(P, x) <= M8 + 1e-9);
    }) && near(pBeam.w * pBeam.L * pBeam.L / 8, 9) && near(pBeam2.w * pBeam2.L * pBeam2.L / 8, 6), { source: SRC[2] });
  check('The bending moment must vanish at the ends of the beam, since there they are simply supported: on both beams M is zero at each support, the roots drawn sit on the supports, and the beam is drawn resting on a support at each end', () => {
    const g = drawn(idx('A loaded beam'), blank());
    return [pBeam, pBeam2].every((P) => near(gapOf(P, 0), 0) && near(gapOf(P, P.L), 0, 1e-9) && near(rootsOf(P)[0], 0) && near(rootsOf(P)[1], P.L)) &&
      !!g.roots && near(g.roots[0], 0) && near(g.roots[1], pBeam.L) && g.supports === 2;
  }, { source: SRC[4] });
  check('The negative value of time implies an event before the start of motion, so we discard it: the deck rule has a negative root, drawn dashed before the throw, and it is never accepted as when the ball hits the water', () => {
    const i = idx('Off the deck'), d = STEPS[i], R = rootsOf(pDeck), g = drawn(i, solvedSt(i));
    const neg = d.opts.filter((o) => d.pts[o][0] < 0);
    return R[0] < 0 && R[1] > 0 && near(gapOf(pDeck, R[0]), 0, 1e-9) && g.dashed && g.curve && neg.length === 1 && neg[0] !== d.want &&
      near(d.pts[neg[0]][0], R[0]) && near(d.pts[d.want][0], R[1]) && !isRight(i, neg[0]);
  }, { source: SRC[7] });
  check('The lesson\'s numbers follow from the rules: 19.6, 4.9 and 14.7 m at 1 s; 39.2 − 19.6 = 19.6 m at 2 s; 48 − 8 = 40 W at 4 A; 144 − 72 = 72 W at 12 A; 6 − 1 = 5 kN·m at 1 m; 18 − 9 = 9 kN·m at 3 m; the deck ball\'s roots 2 s and −1 s and top at 0.5 s; 96 W at 8 A on the 24 V supply; 6 kN·m at 2 m on the 4 m beam; and the wrong picks\' 4.594 m, 0 W at 24 A, 54 W at 6 A, 27 and 18 kN·m', () => {
    const list = [['ball', 1, 19.6, 4.9, 14.7], ['ball', 2, 39.2, 19.6, 19.6], ['supply', 4, 48, 8, 40], ['supply', 12, 144, 72, 72], ['beam', 1, 6, 1, 5], ['beam', 3, 18, 9, 9],
      ['supply2', 8, 192, 96, 96], ['beam2', 2, 12, 6, 6], ['supply', 24, 288, 288, 0], ['supply', 6, 72, 18, 54], ['deck', 1, 14.7, 4.9, 9.8], ['supply2', 16, 384, 384, 0]];
    return list.every((r) => { const p = parts(PIC[r[0]], r[1]); return near(p.S, r[2]) && near(p.Q, r[3]) && near(p.G, r[4]); }) &&
      near(R_DECK[0], -1) && near(R_DECK[1], 2) && near(topOf(pDeck), 0.5) && near(parts(pBall, 0.25).G, 4.594) &&
      near(allOn(pBeam, 3), 27) && near(allOn(pBeam2, 2), 18) && near(R_BALL[1], 4) && near(R_SUP[1], 24) && near(R_SUP2[1], 16);
  });
  check('Every puzzle accepts only its right answer; before Check its picture shows no answer (no curve it asks about, no answer mark and no answer working); after a right answer the curve and its marks arrive where the rule puts them; and every wrong pick is ringed in red where its own numbers put it, with a red line of working', () =>
    DO.every((i) => {
      const d = STEPS[i], P = PIC[d.pic], given = d.given || [], rev = d.reveal, w = d.pts[d.want];
      if (!d.opts.every((o) => isRight(i, o) === (o === d.want))) return false;
      const b = drawn(i, blank());
      if (b.curve !== (given.indexOf('curve') >= 0) || b.ring || b.point || b.beamX != null) return false;
      if ((rev.indexOf('peak') >= 0 && b.peak) || (rev.indexOf('roots') >= 0 && b.roots)) return false;
      if (b.rows.some((r) => d.right.indexOf(r.text) >= 0)) return false;
      const s = drawn(i, solvedSt(i));
      if (!s.curve || !d.right.every((r) => s.rows.some((x) => x.text === r && !x.bad))) return false;
      if (rev.indexOf('peak') >= 0 && !(s.peak && near(s.peak.x, w[0]) && near(s.peak.y, w[1]))) return false;
      if (rev.indexOf('roots') >= 0 && !s.roots) return false;
      if (rev.indexOf('roots') >= 0 && rev.indexOf('peak') < 0 && !(s.roots.some((r) => near(r, w[0])) && near(w[1], 0))) return false;
      if (rev.indexOf('point') >= 0 && !(s.point && near(s.point.x, w[0]) && near(s.point.y, gapOf(P, w[0])))) return false;
      return d.opts.filter((o) => o !== d.want).every((o) => {
        const g = drawn(i, wrongSt(i, o)), q = d.pts[o], last = g.rows[g.rows.length - 1];
        return !!g.ring && near(g.ring.x, q[0]) && near(g.ring.y, q[1]) && !(near(q[0], w[0]) && near(q[1], w[1])) && !!last && last.bad && last.text === d.ow[o];
      });
    }));
  check('Every line of working on every screen adds up (each a − b = c, a × b = c and a ÷ b = c in it is true), and at every setting of the time, the current and the point the rows show the rule\'s own two parts and their gap, with the amber gap between the parts drawn the same length as the amber gap stood up from the axis', () => {
    const rowsOk = (rows) => rows.every((r) => sums(r.text));
    for (let i = 0; i < STEPS.length; i++) {
      const d = STEPS[i];
      const states = d.show ? [blank()] : [blank(), solvedSt(i)].concat(d.opts.filter((o) => o !== d.want).map((o) => wrongSt(i, o)));
      if (!states.every((st) => rowsOk(drawn(i, st).rows))) return false;
      if (!d.show || !d.slide) continue;
      const P = PIC[d.pic];
      for (let x = P.x0; x <= P.x1 + 1e-9; x += P.step) {
        const v = snap(P, x), g = drawn(i, Object.assign(blank(), { x: v })), p = parts(P, v);
        if (!rowsOk(g.rows) || g.rows.length < 3 || g.rows[0].text !== rowS(P, v) || g.rows[1].text !== rowQ(P, v) || g.rows[2].text !== rowG(P, v)) return false;
        if (!g.gap || !near(g.gap.pxGap, g.gap.pxBar, 1e-6) || !near(p.G, p.S - p.Q, 1e-9) || Math.abs(p.G - gapOf(P, v)) > 5e-4) return false;
      }
    }
    return true;
  });
  check('Every demonstration has finished arriving within 4.5 s of its screen opening, none starting before the 0.35 s screen fade ends; every answer\'s motion, right or wrong, within 2.5 s', () =>
    STEPS.every((d, i) => {
      if (d.show) { const g = drawn(i, blank()); return g.latest <= d.dur + 1e-9 && d.dur >= 3 && d.dur <= 4.5 && g.earliest >= FADE; }
      const g = drawn(i, solvedSt(i));
      return g.latest <= FB[0] + 1e-9 && FB[0] <= 2.5 && FB[1] <= 2.5 && d.opts.filter((o) => o !== d.want).every((o) => drawn(i, wrongSt(i, o)).latest <= FB[1] + 1e-9);
    }));

  K.ready();
</script>
