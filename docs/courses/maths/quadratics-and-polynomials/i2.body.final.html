      text: '`x² + 5x + 6` is one `x²` tile, 5 strips and 6 unit squares. With 2 strips along one side and 3 along the other, that is 2 + 3 = 5 strips, and the 2 by 3 corner takes 2 × 3 = 6 squares exactly. The sides read off as the brackets, so `x² + 5x + 6 = (x + 2)(x + 3)`, and finding them is *factorising*.' },
    { kind: 'pick', name: 'Which brackets?', pic: 'rect', quad: [1, 6, 8],

    { show: true, name: 'A minus sign', pic: 'grid', quad: [1, -1, -12], f: F(1, 1, -4, 1, 3), try: { x: 5 },

    { kind: 'pick', name: 'No squares', pic: 'rect', quad: [1, 6, 0], try: { x: 1 },

      task: '`x² + 6x` has no unit squares. Which brackets make it?',
      why: 'With no squares, all 6 strips lie along one side, so the rectangle is `x` by `x + 6`. That is the common factor `x` taken out, so `x² + 6x = x(x + 6)`.',

    { show: true, name: 'Two x² tiles', pic: 'rect', quad: [2, 7, 3], f: F(1, 2, 1, 1, 3), table: false, groups: true,
      rule: ['2x² + 7x + 3 = 2x² + 6x + x + 3', '= 2x(x + 3) + 1(x + 3)', '= (2x + 1)(x + 3)'],

      text: 'With `2x²`, the 2 `x²` tiles sit side by side, 2 by 1, and the 3 squares sit 1 by 3. The strips fill a 2 by 3 block of 6 under the tiles and a 1 by 1 block of 1 beside them, made from the same four numbers, so 6 × 1 = 2 × 3 and the pair must multiply to 6 as well as add to 7. The two columns are `2x(x + 3)` and `1(x + 3)`, so `2x² + 7x + 3 = (2x + 1)(x + 3)`.' },

      hints: { '(3x + 2)(x + 4)': 'Not quite. 2 and 4 multiply to 8, but that rectangle needs 14 strips and you have 10.',

    { kind: 'pick', name: 'Mixed: a square', pic: 'grid', quad: [1, -6, 9], try: { x: 1 },
      opts: [F(1, 1, 3, 1, 3, true), F(1, 1, -3, 1, -3, true), F(1, 1, 3, 1, -3)], want: 1,
      task: 'A mix. Factorise `x² − 6x + 9`.',
      why: 'The pair must multiply to 9 and add to −6, so both numbers are below zero, −3 and −3. Equal numbers make a square, so `x² − 6x + 9 = (x − 3)²`, a *perfect square*. At `x = 1` both make 4.',

      hints: { '(x + 3)²': 'Not quite. Its `x` cells are `3x` and `3x`, which add to `6x`, not `−6x`. At `x = 1` it makes 16, not 4.',

  const KHAN = 'https://www.khanacademy.org/math/algebra/x2f8bb11595b61c86:quadratics-multiplying-factoring/x2f8bb11595b61c86:multiply-binomial/v/area-model-for-multiplying-binomials';

  const GX0 = 84, GY = 62, CW = 116, CH = 58;

  const TL_TRY = { lab: 0.2, rule: [0.4], work: [0.6] };
  const TLG_DO = { cells: [0.1, 0.35], head: 0.6, cancel: 0.9, note: 1.0, rule: [1.1], work: [1.3] };

  const testing = () => document.documentElement.classList.contains('k-testing');
  const NB = ' ';

  // ---------- terms and expressions (pure, so the checks can test them) ----------
  function fmtTerm(c, p, lead) {
    const a = Math.abs(c), body = p === 0 ? String(a) : (a === 1 ? '' : String(a)) + (p === 2 ? 'x²' : 'x');
    return lead ? (c < 0 ? '−' : '') + body : (c < 0 ? ' − ' : ' + ') + body;
  }
  const fmtPoly = (ts) => ts.filter((t) => t[0] !== 0).map((t, k) => fmtTerm(t[0], t[1], k === 0)).join('') || '0';
  const quadS = (q) => fmtPoly([[q[0], 2], [q[1], 1], [q[2], 0]]);
  const brS = (b) => '(' + fmtPoly([[b[0], 1], [b[1], 0]]) + ')';
  const monoS = (b) => (b[0] === 1 ? '' : String(b[0])) + 'x';
  function fmtF(f) {
    const b0 = f.br[0], b1 = f.br[1], pre = f.k === 1 ? '' : String(f.k);
    if (b0[1] === 0 && b1[1] === 0) return pre + monoS(b0) + ' × ' + monoS(b1);
    if (b1[1] === 0) return pre + monoS(b1) + brS(b0);
    if (b0[1] === 0) return pre + monoS(b0) + brS(b1);
    if (f.sq) return pre + brS(b0) + '²';
    return pre + brS(b0) + brS(b1);

  const expand = (f) => { const p1 = f.br[0][0], q1 = f.br[0][1], p2 = f.br[1][0], q2 = f.br[1][1]; return [f.k * p1 * p2, f.k * (p1 * q2 + q1 * p2), f.k * q1 * q2]; };
  const needsOf = (f) => { const e = expand(f); return { 2: e[0], 1: e[1], 0: e[2] }; };
  const hdr1 = (q) => (q < 0 ? '−' : '+') + Math.abs(q);
  const num = (n) => (n < 0 ? '−' : '') + String(Math.abs(Math.round(n * 1e9) / 1e9));
  const sumS = (c) => (c === 0 ? '0' : fmtTerm(c, 1, true));
  const range = (a, b) => Array.from({ length: b - a + 1 }, (z, n) => a + n);

  // Reads +, −, ×, ², brackets, a minus in front and terms side by side (2x², 6x(x + 1)).
  function evalExpr(s, vars) {
    const src = String(s).replace(/ /g, ' ').replace(/−/g, '-').replace(/×/g, '*').replace(/\s+/g, '');
    let i = 0;
    const peek = () => src[i];
    function expr() { let v = term(); while (peek() === '+' || peek() === '-') { const op = src[i++]; const t = term(); v = op === '+' ? v + t : v - t; } return v; }
    function term() { let v = unary(); while (i < src.length && peek() !== '+' && peek() !== '-' && peek() !== ')') { if (peek() === '*') i++; v *= unary(); } return v; }
    function unary() { if (peek() === '-') { i++; return -unary(); } if (peek() === '+') { i++; return unary(); } return power(); }
    function power() { let v = atom(); while (peek() === '²') { i++; v *= v; } return v; }
    function atom() {
      if (peek() === '(') { i++; const v = expr(); if (src[i] !== ')') throw new Error('no closing bracket'); i++; return v; }
      const m = /^\d+(?:\.\d+)?/.exec(src.slice(i));
      if (m) { i += m[0].length; return +m[0]; }
      if (peek() === 'x') { i++; if (!('x' in vars)) throw new Error('no value for x'); return vars.x; }
      throw new Error('cannot read ' + src.slice(i));
    }
    const v = expr();
    if (i !== src.length) throw new Error('left over: ' + src.slice(i));
    return v;
  }
  // An expression tried at x, worked out from the expression itself: factors as their values
  // multiplied ('2 × 5 × 1 = 10', '(−2)² = 4'), anything else term by term ('25 − 5 − 12 = 8').
  function valueLine(e, x) {
    const k = e.indexOf('(');
    if (k >= 0) {
      const pre = e.slice(0, k), rest = e.slice(k), parts = [];

    nextBtn.el.hidden = finished || (!d.show && !right);
    nextBtn.setLabel(i === STEPS.length - 1 ? 'Finish' : 'Continue');
    nav.hidden = backBtn.el.hidden && nextBtn.el.hidden;
  });

  // ---------- known answers, worked out by hand ----------
  const DO = STEPS.map((d, i) => i).filter((i) => !STEPS[i].show);
  const solvedSt = (i) => Object.assign(blank(), { pick: STEPS[i].optS[STEPS[i].want], res: 'right' });
  const wrongSt = (i, o) => Object.assign(blank(), { pick: o, res: 'wrong' });
  const answerOf = (d) => d.ans || (d.show ? d.f : d.opts[d.want]);
  const close = (a, b) => Math.abs(a - b) < 1e-9 * Math.max(1, Math.abs(a), Math.abs(b));
  const idx = (name) => STEPS.findIndex((d) => d.name === name);
  // Values tried for x: whole numbers, a half and a negative.
  const ENVS = [1, 2, 3, 4, 7, 10, 0.5, -4].map((x) => ({ x }));
  const same = (p, q) => ENVS.every((e) => close(evalExpr(p, e), evalExpr(q, e)));
  const endOf = (w) => evalExpr(String(w).split('=').pop(), {});
  const pairs = (c) => range(1, c).filter((a) => c % a === 0 && a <= c / a).map((a) => [a, c / a]);
  // Every line of working a step can show, with the x it was tried at.
  function works(i) {
    const d = STEPS[i], out = [];
    if (!d.try) return out;
    const x = d.try.x, es = [quadS(d.quad)].concat(d.show ? [fmtF(d.f)] : d.optS);
    es.forEach((e) => out.push({ e, w: valueLine(e, x), v: { x } }));
    return out;
  }
  const workAddsUp = (r) => { const ps = r.w.split('='), end = evalExpr(ps[ps.length - 1], {}); return close(evalExpr(r.e, r.v), end) && ps.slice(0, -1).every((p) => close(evalExpr(p, {}), end)); };
  // A step painted in the state given (finished, or at t seconds into its motion): what it draws.
  function drawn(i, st, t) {
    const keepS = S[i], keepT = T;
    S[i] = st; T = t == null ? Infinity : t;
    try {
      paint(i);
      return Object.assign({}, REC, { texts: Array.from(art.querySelectorAll('text')).map((n) => n.textContent.replace(/ /g, ' ')) });
    } finally { S[i] = keepS; T = keepT; paint(); }
  }
  const closedSt = (i) => { const d = STEPS[i]; return d.drag ? Object.assign(blank(), { a: 2, b: 3 }) : d.show ? blank() : solvedSt(i); };

  K.check('To factorise x² + bx + c, the sum of the two numbers in the brackets must be b and the product must be c: on every screen the answer\'s two numbers do both (after any common factor), and the answer equals its quadratic at every number tried, whole, a half or negative', () =>
    STEPS.every((d) => {
      const f = answerOf(d), inner = d.quad.map((c) => c / f.k), b0 = f.br[0], b1 = f.br[1];
      const monic = b0[0] === 1 && b1[0] === 1;
      return same(fmtF(f), quadS(d.quad)) && (!monic || (b0[1] + b1[1] === inner[1] && b0[1] * b1[1] === inner[2]));
    }), { source: BITESIZE });
  K.check('The brackets and the tiles are two ways of expressing the same area, so they are equal: every rectangle a screen closes is exactly as wide times as tall as all its tiles together, one tile for each term of the quadratic', () =>
    STEPS.every((d, i) => {
      if (d.pic !== 'rect') return true;
      const g = drawn(i, closedSt(i));
      if (!g.built || !g.closed) return false;
      const area = g.tiles.reduce((s, t) => s + t.w * t.h, 0);
      const kinds = [2, 1, 0].every((p) => g.tiles.filter((t) => t.p === p).length === d.quad[2 - p]);
      const each = g.tiles.every((t) => close(t.w * t.h, t.p === 2 ? g.XL * g.XL : t.p === 1 ? g.XL * g.U : g.U * g.U));
      return kinds && each && close(area, g.copies * g.W * g.H);
    }), { source: KHAN });
  K.check('The rectangle of x² + 5x + 6 closes only for 2 and 3 strips (either way round): for every split from 0 to 6 strips on each side it needs that many strips added and squares multiplied, and any other split leaves tiles missing or left over', () => {
    const i = idx('Pairs that make 6');
    return range(0, 6).every((a) => range(0, 6).every((b) => {
      const g = drawn(i, Object.assign(blank(), { a, b }));
      const shut = a + b === 5 && a * b === 6, holes = total(g.nGap) + total(g.nLeft);
      return g.closed === shut && g.need[2] === 1 && g.need[1] === a + b && g.need[0] === a * b &&
        (shut ? holes === 0 && g.rule[0] === 'x² + 5x + 6 = (x + ' + a + ')(x + ' + b + ')' : holes > 0);
    }));
  });
  K.check('(x + 3)(x + 3) needs 9 squares and 6 strips, which is x² + 6x + 9: built from the 6 squares and 5 strips of x² + 5x + 6 it has 3 squares and 1 strip missing', () => {
    const g = drawn(idx('Pairs that make 6'), blank());
    return g.built && !g.closed && g.need[0] === 9 && g.need[1] === 6 && g.nGap[0] === 3 && g.nGap[1] === 1 && total(g.nLeft) === 0 &&
      g.rule[0] === '(x + 3)(x + 3) = x² + 6x + 9' && same('(x + 3)(x + 3)', 'x² + 6x + 9');
  });
  K.check('Pairs making 6: 1 and 6 add to 7, and 2 and 3 add to 5; of the pairs making 8, only 2 and 4 add to 6, and of those making 20, only 4 and 5 add to 9', () =>
    JSON.stringify(pairs(6).map((p) => p[0] + p[1])) === '[7,5]' && pairs(8).filter((p) => p[0] + p[1] === 6).join() === '2,4' &&
    pairs(20).filter((p) => p[0] + p[1] === 9).join() === '4,5');
  K.check('Every count and value listed is right: (x + 3)(x + 3) needs 9 squares, (x + 1)(x + 8) 9 strips, (x + 2)(x + 10) 12 strips, (x + 3)(x + 6) 18 squares, (3x + 2)(x + 4) 14 strips and (3x + 8)(x + 1) 11; the values at x = 5, 4, 1 and 3 match by hand; and every line of working adds up', () => {
    const needs = [[F(1, 1, 3, 1, 3), 0, 9], [F(1, 1, 1, 1, 8), 1, 9], [F(1, 1, 2, 1, 10), 1, 12], [F(1, 1, 3, 1, 6), 0, 18], [F(1, 3, 2, 1, 4), 1, 14], [F(1, 3, 8, 1, 1), 1, 11],
      [F(1, 3, 4, 1, 2), 1, 10], [F(1, 3, 4, 1, 2), 0, 8], [F(1, 1, 2, 1, 3), 1, 5], [F(1, 1, 2, 1, 3), 0, 6], [F(6, 1, 1, 1, 0), 2, 6]];
    const vals = [['(x − 4)(x + 3)', 5, 8], ['x² − x − 12', 5, 8], ['x² + 2x − 15', 4, 9], ['(x − 5)(x + 3)', 4, -7], ['(x + 5)(x + 3)', 4, 63], ['(x + 5)(x − 3)', 4, 9],
      ['x² + 6x', 1, 7], ['(x + 3)(x + 3)', 1, 16], ['6x(x + 1)', 1, 12], ['x(x + 6)', 1, 7], ['(2x + 1)(x + 3)', 1, 12], ['2x² + 7x + 3', 1, 12],
      ['3x² + 10x + 8', 1, 21], ['(3x + 2)(x + 4)', 1, 25], ['(3x + 8)(x + 1)', 1, 22], ['(3x + 4)(x + 2)', 1, 21], ['x² − 6x + 9', 1, 4], ['(x + 3)²', 1, 16], ['(x + 3)(x − 3)', 1, -8], ['(x − 3)²', 1, 4],
      ['2x² − 8', 3, 10], ['(x + 2)(x − 2)', 3, 5], ['2(x − 2)²', 3, 2], ['2(x + 2)(x − 2)', 3, 10], ['(x + 2)(x + 3)', 4, 42], ['x² + 5x + 6', 4, 42], ['2x² + 2x − 12', 3, 12], ['2(x + 3)(x − 2)', 3, 12]];
    const lines = [['(x − 4)(x + 3)', 5, '1 × 8 = 8'], ['x² − x − 12', 5, '25 − 5 − 12 = 8'], ['(x − 5)(x + 3)', 4, '−1 × 7 = −7'], ['(x − 3)²', 1, '(−2)² = 4'],
      ['2(x + 2)(x − 2)', 3, '2 × 5 × 1 = 10'], ['x² + 6x', 1, '1 + 6 = 7'], ['6x(x + 1)', 1, '6 × 2 = 12'], ['2x² − 8', 3, '18 − 8 = 10']];
    return needs.every((r) => expand(r[0])[2 - r[1]] === r[2]) &&
      vals.every((r) => close(evalExpr(r[0], { x: r[1] }), r[2]) && close(endOf(valueLine(r[0], r[1])), r[2])) &&
      lines.every((r) => valueLine(r[0], r[1]) === r[2]) && STEPS.every((d, i) => works(i).every(workAddsUp));
  });
  K.check('Each puzzle accepts only its right answer, and every wrong answer offered is a different quadratic: its rectangle is left with tiles missing or left over, its grid has a cell that does not match, or it makes a different value at the number tried', () =>
    DO.every((i) => {
      const d = STEPS[i], ws = d.optS[d.want];
      const ok = d.optS.length === 3 && new Set(d.optS).size === 3 && same(ws, quadS(d.quad)) &&
        d.optS.every((o) => isRight(i, Object.assign(blank(), { pick: o })) === (o === ws));
      const g0 = drawn(i, solvedSt(i));
      const rightOk = d.pic === 'rect' ? g0.built && g0.closed : g0.bad.length === 0 && g0.note.indexOf('add to ' + sumS(d.quad[1] / (d.gk || 1))) > 0;
      const wrongs = d.optS.filter((o) => o !== ws).every((o) => {
        if (same(o, ws)) return false;
        const g = drawn(i, wrongSt(i, o)), f = optOf(d, o);
        if (d.pic === 'rect' && drawable(d, f)) return g.built && !g.closed && total(g.nGap) + total(g.nLeft) > 0;
        if (d.pic === 'grid' && !g.bad.length) return false;
        const w = g.work[g.work.length - 1];
        return !!w && w.e === o && w.bad && !close(endOf(w.w), evalExpr(quadS(d.quad), d.try));
      });
      return ok && rightOk && wrongs;
    }));
  K.check('Before an answer, a puzzle\'s picture gives nothing away: its tiles lie loose, or its grid shows only the x² term and the number on its own (2x² and −8, nothing taken out, for 2x² − 8), with ? on the unknown sides', () =>
    DO.every((i) => {
      const d = STEPS[i], g = drawn(i, blank()), ws = d.optS[d.want];
      const quiet = g.texts.every((t) => t.indexOf(ws) < 0) && g.rule.some((r) => /= \?$/.test(r));
      return quiet && (d.pic === 'rect' ? !g.built : g.heads.filter((h) => h === '?').length === (d.gk ? 4 : 2) && g.cells.length === 2);
    }));
  K.check('A cell is hatched exactly when its term is below zero: −4x and −12 in x² − x − 12, while in (x − 3)² the corner −3 × −3 makes 9 and is not', () => {
    const all = STEPS.every((d, i) => d.pic !== 'grid' || [blank()].concat(d.show ? [] : d.optS.map((o) => (o === d.optS[d.want] ? solvedSt(i) : wrongSt(i, o))))
      .every((st) => drawn(i, st).cells.every((c) => c.hatched === (c.c < 0))));
    const g5 = drawn(idx('A minus sign'), blank()), j = idx('Mixed: a square'), g12 = drawn(j, solvedSt(j));
    const corner = g12.cells.filter((c) => c.how === '−3 × −3')[0];
    return all && g5.cells.filter((c) => c.hatched).map((c) => c.term).sort().join() === ['−12', '−4x'].sort().join() && !!corner && corner.term === '9' && !corner.hatched;
  });
  K.check('Every demonstration has finished arriving within 4.5 s of its screen opening, none starting before the 0.35 s screen fade ends; every answer\'s motion, right or wrong, within 2 s', () => {
    const keepT = T;
    const timed = (i, st, limit) => {
      const keepS = S[i];
      T = Infinity; latest = 0; earliest = Infinity;
      S[i] = st;
      try { paint(i); } finally { S[i] = keepS; }
      return latest <= limit + 1e-9;
    };
    const ok = STEPS.every((d, i) => {
      if (d.show) { const r = timed(i, blank(), d.dur); return r && d.dur <= 4.5 && d.dur >= 3 && earliest >= FADE; }
      return d.optS.every((o) => timed(i, o === d.optS[d.want] ? solvedSt(i) : wrongSt(i, o), FB)) && FB <= 2.5;
    });
    T = keepT; paint();
    return ok;
  });

  K.ready();
</script>
