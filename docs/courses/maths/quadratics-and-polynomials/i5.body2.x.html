<p class="caption">A sketch from each screen's own rule; each arrow is √(b² − 4ac) ÷ 2a long.</p>

<script>
  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // q: the quadratic [a, b, c], a x² + b x + c. win: the graph's window [x0, x1, y0, y1].
  // demo: what a SHOW screen plays ('centre' grows the arrows out from the axis, 'derive' writes the
  // formula with letters, 'formula' works one rule through it). sliders: handles drawn in the picture
  // (a, b, c), and the curve itself drags c; moves: [t0, t1, c] glides c on its own first.
  // A puzzle: kind 'roots' (a pair of roots, or none), 'disc' (the number b² − 4ac), 'count' (how
  // many roots), 'which' (which rule of qs has none) or 'slip' (which line of a working slipped).
  // o: its options, each a named slip worked out from the rule ('R' is the right one): 'flip' turns
  // the signs, 'noaxis' measures the spread from 0, 'half' puts only the root over 2a, 'abs' drops
  // the minus under the root, 'axis' gives the centre alone; for 'disc', 'sign' loses the sign of
  // −4ac and 'both' squares −b to a minus too. tips: what each wrong pick's hint adds.
  const PICK = 'Tap one of the answers.';
  const W1 = [-7.5, 1.5, -10, 16];
  const range = (lo, hi) => { const r = []; for (let v = lo; v <= hi; v++) r.push(v); return r; };
  const SL_LIFT = [{ key: 'c', vals: range(0, 12), every: 3 }];
  const SL_ALL = [{ key: 'a', vals: [-3, -2, -1, 1, 2, 3], every: 1 }, { key: 'b', vals: range(-8, 8), every: 4 }, { key: 'c', vals: range(-12, 12), every: 6 }];
  const STEPS = [
    { show: true, name: 'Centre and spread', q: [1, 6, 2], win: W1, demo: 'centre', dur: 3.9,
      text: 'This is `y = x² + 6x + 2` from lesson 4. The dashed line is its *axis*, lesson 4\'s line of symmetry, at `x = −3`. Two equal arrows reach from it to the roots, about 2.65 each way.' },
    { name: 'Roots from the arrows', q: [1, 6, 5], win: W1, kind: 'roots', pre: true, o: ['noaxis', 'flip', 'R'],
      task: 'The axis of `y = x² + 6x + 5` is at `x = −3`, and each arrow is 2 long. What are the roots of `x² + 6x + 5 = 0`?',
      why: 'The roots sit the same distance either side of the axis, so they are `−3 + 2` and `−3 − 2`, which are −1 and −5. Put back into the rule, `1 − 6 + 5 = 0` and `25 − 30 + 5 = 0`.',
      tips: { flip: 'Start at the axis, −3, and go 2 each way.', noaxis: 'The arrows start at the axis, −3, not at 0.' } },
    { show: true, name: 'The formula', q: [1, 6, 2], win: W1, demo: 'derive', letters: true, noRd: true, gb: 182, dur: 4.5,
      text: 'Complete the square on `ax² + bx + c = 0` with letters, as lesson 4 did with numbers. Each line follows from the one above. The last line is the *quadratic formula*, a centre `−b ÷ 2a` with a spread either side.' },
    { name: 'Spot the slip', q: [1, 6, 5], win: [-9, 1, -6, 12], kind: 'slip', noRd: true, gb: 202,
      task: 'This working for `x² + 6x + 5 = 0` gives −4 and −8, and neither makes it 0. Which line slipped?',
      why: 'Line 2 put only the square root over 2. The whole top goes over `2a`, so `x = (−6 ± 4) ÷ 2`, which is −1 or −5, and `1 − 6 + 5 = 0`.' },
    { show: true, name: 'Use the formula', q: [1, 6, 2], win: W1, demo: 'formula', dur: 4.2,
      text: 'Put `a = 1`, `b = 6` and `c = 2` into the formula. The number under the root, `b² − 4ac`, is 28, and it is called the *discriminant*. So `x` is `−3 ± √7`, the two roots lesson 4 found.' },
    { name: 'The number under the root', q: [2, -4, -6], win: [-2.5, 4.5, -10, 10], kind: 'disc', o: ['R', 'sign', 'both'],
      task: 'What is `b² − 4ac` for `2x² − 4x − 6 = 0`?',
      why: 'Here `a = 2`, `b = −4` and `c = −6`. `b²` is `(−4)²`, which is 16, and `−4ac` is `−4 × 2 × (−6)`, which is 48. So `b² − 4ac` is `16 + 48 = 64`, and the roots are `(4 ± 8) ÷ 4`, which are 3 and −1.',
      tips: { sign: 'Mind the sign of `−4ac`. Two minuses make a plus.', both: 'A minus squared is a plus, so `(−4)²` is 16.' } },
    { show: true, name: 'Lift the curve', q: [1, 6, 2], win: W1, sliders: SL_LIFT, moves: [[1.4, 2.5, 9], [2.7, 3.4, 12], [3.6, 4.4, 2]], dur: 4.5,
      text: 'Drag the curve up, or slide `c`. As it lifts, `b² − 4ac`, which is `36 − 4c` here, falls and the arrows shrink. At 0 they meet in one *repeated root*, and below 0 the curve misses the x-axis, so there are no real roots.' },
    { name: 'Below zero', q: [1, 2, 5], win: [-4.5, 2.5, -4, 14], kind: 'roots', o: ['abs', 'axis', 'R'],
      task: 'What are the roots of `x² + 2x + 5 = 0`?',
      why: '`b² − 4ac` is `4 − 20 = −16`, which is below 0. No number on the number line squares to a negative, so there are no real roots, and the curve\'s lowest point, `(−1, 4)`, sits above the x-axis.',
      tips: { abs: 'Work out `b² − 4ac` first, and keep its sign.', axis: 'That is the axis. Work out `b² − 4ac` first.' } },
    { show: true, name: 'Set a, b and c', q: [-1, 4, 10], win: [-10, 10, -30, 30], sliders: SL_ALL, moves: [[1.4, 2.6, -6], [2.9, 4.3, 10]], dur: 4.5,
      text: 'Now set `a`, `b` and `c` yourself. With a minus in front of `x²` the U turns upside down, yet the axis is still at `−b ÷ 2a`, here 2. The two arrows are still equal, about 3.74 each way.' },
    { name: 'How many roots?', q: [4, -12, 9], win: [-1, 4, -3, 10], kind: 'count', o: ['two', 'one', 'none'],
      task: 'How many roots has `4x² − 12x + 9 = 0`?',
      why: '`b² − 4ac` is `144 − 144 = 0`, so the arrows have no length. The two roots meet at the axis, `x = 12 ÷ 8 = 1.5`, where the curve just touches the x-axis.',
      tips: { two: 'Work out `b² − 4ac` first.', none: '`b² − 4ac` is `{D}`, which is not below 0.' } },
    { name: 'Mixed: it factorises', q: [1, -7, 10], win: [-0.5, 7.5, -4, 10], kind: 'roots', o: ['flip', 'R', 'half'],
      task: 'What are the roots of `x² − 7x + 10 = 0`?',
      why: 'It factorises, since 2 and 5 multiply to 10 and add to 7, so it is `(x − 2)(x − 5) = 0`. The formula agrees. `b² − 4ac` is `49 − 40 = 9`, so `x = (7 ± 3) ÷ 2`, which is 5 or 2.',
      tips: { flip: 'Mind the sign. Here `−b` is 7.', half: 'Put the whole top over `2a`.' } },
    { name: 'Mixed: two decimal places', q: [3, 5, -1], win: [-3, 1.5, -5, 8], kind: 'roots', o: ['R', 'half', 'flip'],
      task: 'What are the roots of `3x² + 5x − 1 = 0`, to two decimal places?',
      why: 'No whole-number pair works here, so the formula is the quick way. `b² − 4ac` is `25 + 12 = 37`, and `√37` is about 6.08, so `x = (−5 ± 6.08) ÷ 6`, about 0.18 or −1.85.',
      tips: { half: 'Put the whole top over `2a`, which is 6.', flip: 'Mind the sign. Here `−b` is −5.' } },
    { name: 'Mixed: which has none?', qs: [[1, -4, 3], [1, -4, 4], [1, -4, 5]], win: [-0.5, 4.5, -2, 8], kind: 'which',
      task: 'Which of these has no real roots?',
      why: 'All three have `b² = 16`. For `x² − 4x + 5`, `b² − 4ac` is `16 − 20 = −4`, so there are no real roots. Its roots are *complex numbers*, numbers off the number line, which the Complex numbers course takes up.' },
  ];
  const FINISH = 'The formula `x = (−b ± √(b² − 4ac)) ÷ 2a` is a centre, `−b ÷ 2a`, with a spread either side. Work out `b² − 4ac` first. Above 0 there are two roots, at 0 one repeated root, and below 0 no real roots.';
  // Sources the checks restate (the lesson's own).
  const BITESIZE = 'https://www.bbc.co.uk/bitesize/guides/z3hb97h/revision/2';
  const MATHWORLD = 'https://mathworld.wolfram.com/CompletingtheSquare.html';
  const BRILLIANT = 'https://brilliant.org/wiki/quadratic-discriminant';
  // The picture: the rule at TAGY, the readout of b² − 4ac at RDY, the graph from GT down to each
  // screen's gb (222 unless set), its key 40 below, lines of working 70 below, then the handles.
  const TAGY = 22, RDY = 46, GT = 62, WSTEP = 24, SX0 = 84, SX1 = 320, SSTEP = 46;
  const FADE = 0.35;
  const KI = { a: 0, b: 1, c: 2 };
  const SLNAME = { a: 'the number in front of x squared', b: 'the number in front of x', c: 'the plain number' };
  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const testing = () => document.documentElement.classList.contains('k-testing');

  // ---------- the rule (pure, so the checks can test it) ----------
  const close = (a, b) => Math.abs(a - b) < 1e-9 * Math.max(1, Math.abs(a), Math.abs(b));
  const fmtN = (v) => { let r = Math.round(v * 100) / 100; if (Math.abs(r) < 1e-12) r = 0; return (r < 0 ? '−' : '') + String(Math.abs(r)).replace(/^\d+/, (n) => n.replace(/\B(?=(\d{3})+$)/g, ',')); };
  const round2 = (v) => { const r = Math.round(v * 100) / 100; return Math.abs(r) < 1e-12 ? 0 : r; };
  const paren = (v) => (v < 0 ? '(' + fmtN(v) + ')' : fmtN(v));
  const poly = (q, x) => q[0] * x * x + q[1] * x + q[2];
  const disc = (q) => q[1] * q[1] - 4 * q[0] * q[2];
  const centre = (q) => -q[1] / (2 * q[0]);
  const zeroD = (D) => Math.abs(D) < 1e-9;
  // The spread: how far each root sits from the axis, √(b² − 4ac) ÷ 2a in size; null with no real roots.
  const spread = (q) => { const D = disc(q); return zeroD(D) ? 0 : D < 0 ? null : Math.sqrt(D) / (2 * Math.abs(q[0])); };
  // The formula's roots, + first then −; one when b² − 4ac is 0, none when it is below 0.
  function rootsOf(q) {
    const D = disc(q);
    if (zeroD(D)) return [centre(q)];
    if (D < 0) return [];
    const r = Math.sqrt(D);
    return [(-q[1] + r) / (2 * q[0]), (-q[1] - r) / (2 * q[0])];
  }
  const countKey = (q) => { const D = disc(q); return zeroD(D) ? 'one' : D > 0 ? 'two' : 'none'; };
  const COUNT = { two: 'two roots', one: 'one repeated root', none: 'no real roots' };
  const countWord = (q) => COUNT[countKey(q)];
  function polyText(q) {
    const t = [[q[0], 'x²'], [q[1], 'x'], [q[2], '']].filter((p) => p[0] !== 0);
    if (!t.length) return '0';
    return t.map((p, k) => {
      const a = Math.abs(p[0]), body = p[1] ? (a === 1 ? p[1] : fmtN(a) + p[1]) : fmtN(a);
      return (k === 0 ? (p[0] < 0 ? '−' : '') : p[0] < 0 ? ' − ' : ' + ') + body;
    }).join('');
  }
  const bracket = (h) => (h === 0 ? 'x' : '(x ' + (h > 0 ? '+ ' : '− ') + fmtN(Math.abs(h)) + ')');
  // b² − 4ac as the lesson writes it: 36 − 8 = 28, 16 + 48 = 64.
  function discParts(q) { const B = q[1] * q[1], F = 4 * q[0] * q[2]; return fmtN(B) + (F < 0 ? ' + ' : ' − ') + fmtN(Math.abs(F)); }
  const discText = (q) => discParts(q) + ' = ' + fmtN(disc(q));
  // The rule's value at x, term by term: 1 + 6 + 5 = 12.
  function ruleText(q, x) {
    const t = [q[0] * x * x, q[1] * x, q[2]].filter((v) => !close(v, 0));
    if (!t.length) return '0';
    if (t.length === 1) return fmtN(t[0]);
    let s = fmtN(t[0]);
    for (let k = 1; k < t.length; k++) s += (t[k] < 0 ? ' − ' : ' + ') + fmtN(Math.abs(t[k]));
    return s + ' = ' + fmtN(t.reduce((a, b) => a + b, 0));
  }
  // An answer worked out from the rule, right ('R') or by a named slip.
  function slipOf(q, s) {
    const D = disc(q), a2 = 2 * q[0], r = Math.sqrt(Math.abs(D));
    if (s === 'R') return D < 0 && !zeroD(D) ? 'none' : rootsOf(q);
    if (s === 'flip') return rootsOf(q).map((v) => -v);
    if (s === 'noaxis') return [r / a2, -r / a2];
    if (s === 'half') return [-q[1] + r / a2, -q[1] - r / a2];
    if (s === 'abs') return [(-q[1] + r) / a2, (-q[1] - r) / a2];
    return [centre(q)];   // 'axis'
  }
  const optRoots = (v) => (v === 'none' ? 'No real roots' : v.length === 1 ? 'Just ' + fmtN(v[0]) : fmtN(v[0]) + ' and ' + fmtN(v[1]));
  function discSlip(q, s) { const B = q[1] * q[1], F = 4 * q[0] * q[2]; return s === 'R' ? B - F : s === 'sign' ? B + F : -B + F; }
  STEPS.forEach((d) => {
    if (d.show) return;
    if (d.kind === 'roots') { d.val = d.o.map((s) => slipOf(d.q, s)); d.opts = d.val.map(optRoots); d.right = d.o.indexOf('R'); }
    else if (d.kind === 'disc') { d.val = d.o.map((s) => discSlip(d.q, s)); d.opts = d.val.map(fmtN); d.right = d.o.indexOf('R'); }
    else if (d.kind === 'count') { d.val = d.o; d.opts = d.o.map((k) => COUNT[k].charAt(0).toUpperCase() + COUNT[k].slice(1)); d.right = d.o.indexOf(countKey(d.q)); }
    else if (d.kind === 'which') { d.val = d.qs; d.opts = d.qs.map(polyText); d.right = d.qs.findIndex((q) => countKey(q) === 'none'); d.q = d.qs[d.right]; }
    else { d.opts = ['Line 1', 'Line 2', 'Line 3']; d.right = 1; }   // 'slip': line 2 is where the slip goes in
    d.want = d.opts[d.right];
  });

  // ---------- lines of working ----------
  const putBack = (q, x, wrong) => ({ l: 'x = ' + fmtN(x), r: ruleText(q, x) + (wrong ? ', not 0' : ''), bad: !!wrong });
  function fixLine(q) {
    const rs = rootsOf(q);
    return { l: 'x = (' + fmtN(-q[1]) + ' ± ' + fmtN(Math.sqrt(disc(q))) + ') ÷ ' + fmtN(2 * q[0]) + ' = ' + fmtN(rs[0]) + ' or ' + fmtN(rs[1]) };
  }
  function centreLine(q) { const rs = rootsOf(q); return { l: 'x = ' + fmtN(centre(q)) + ' ± ' + fmtN(spread(q)), r: 'about ' + fmtN(rs[0]) + ' and ' + fmtN(rs[1]) }; }
  const DERIVE = [
    { l: 'ax² + bx + c = 0' },
    { l: 'a(x + b ÷ 2a)² + c − b² ÷ 4a = 0' },
    { l: '(x + b ÷ 2a)² = (b² − 4ac) ÷ 4a²' },
    { l: 'x + b ÷ 2a = ±√(b² − 4ac) ÷ 2a' },
    { l: 'x = (−b ± √(b² − 4ac)) ÷ 2a' },
    { l: 'centre −b ÷ 2a, spread √(b² − 4ac) ÷ 2a', small: true },
  ];
  // √n as k√m, with m having no square factor.
  function surd(n) { for (let f = Math.floor(Math.sqrt(n)); f > 1; f--) if (n % (f * f) === 0) return [f, n / (f * f)]; return [1, n]; }
  function formulaLines(q) {
    const D = disc(q), sk = surd(D), k = sk[0], m = sk[1], a2 = 2 * q[0], rs = rootsOf(q);
    const root = m === 1 ? fmtN(k) : (k === 1 ? '' : fmtN(k)) + '√' + fmtN(m);
    let x = 'x = (' + fmtN(-q[1]) + ' ± ' + root + ') ÷ ' + fmtN(a2);
    if (m > 1 && q[1] % a2 === 0 && k % a2 === 0) { const kk = k / a2; x += ' = ' + fmtN(-q[1] / a2) + ' ± ' + (kk === 1 ? '' : fmtN(kk)) + '√' + fmtN(m); }
    return [
      { l: 'a = ' + fmtN(q[0]) + ', b = ' + fmtN(q[1]) + ', c = ' + fmtN(q[2]) },
      { l: '√' + fmtN(D) + (k > 1 && m > 1 ? ' = √' + fmtN(k * k) + ' × √' + fmtN(m) + ' = ' + root : ''), note: 'about ' + fmtN(Math.sqrt(D)) },
      { l: x },
      { l: 'x is about ' + fmtN(rs[0]) + ' or ' + fmtN(rs[1]) },
    ];

  // y = x² + bx + c with b even: x² + bx + c = 0 is (x + b ÷ 2)² = (b ÷ 2)² − c, and b² − 4ac is 4 times that.
