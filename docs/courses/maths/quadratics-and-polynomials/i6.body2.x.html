<script>
  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // q: the quadratic [a, b, c], a x² + b x + c. ln: a line [m, c], y = m x + c (then q is the curve it
  // crosses). win: the graph's window [x0, x1, y0, y1]. sl: handles drawn in the picture; moves:
  // [t0, t1, handle, value] glides a handle on its own first. far: the ends at x = ±100 (screen 1);
  // demo 'travel': a dot runs along the curve to x = 0; table: heights at whole-number x, xs from..to.
  // A puzzle's kind: 'turn' (highest or lowest point), 'yc' (the y-crossing), 'slip' (which line of a
  // working slipped), 'tab' (a from a table), 'count' (how often a line meets y = x²), 'sketch' (which
  // of three sketches), 'cross' (does it cross the x-axis), 'meet' (where a line meets the curve).
  // o: its options, each a named slip worked out from the rule ('R' is the right one).
  const PICK = 'Tap one of the answers.';
  const range = (lo, hi) => { const r = []; for (let v = lo; v <= hi; v++) r.push(v); return r; };
  const SL = {
    a: { j: 0, name: 'a', vals: [-3, -2, -1, 1, 2, 3], every: 1, rate: 0, aria: 'a, the number in front of x squared' },
    b: { j: 1, name: 'b', vals: range(-8, 8), every: 4, rate: 24, aria: 'b, the number in front of x' },
    c: { j: 2, name: 'c', vals: range(-12, 12), every: 6, rate: 24, aria: 'c, the plain number' },
    m: { j: 0, name: 'm', vals: range(-4, 4), every: 2, rate: 8, aria: 'm, the slope of the line' },
    lc: { j: 1, name: 'c', vals: range(-4, 4), every: 2, rate: 8, aria: 'c, where the line crosses the y-axis' },
  };
  const W1 = [-5, 7, -24, 12], W4 = [-10, 10, -30, 30], WL = [-5.2, 5.2, -5, 25], SKW = [-4, 4, -7, 9], SKN = 'ABC';
  const STEPS = [
    { show: true, name: 'Which way up', q: [1, -2, -8], win: W1, sl: ['a'], moves: [[2.0, 3.6, 'a', -1]], far: true, dur: 4.2, key: [],
      text: 'This U-shaped curve, a *parabola*, is `y = x² − 2x − 8`. Slide `a`, the number in front of `x²`, to −1 and the U turns upside down. Far from 0 the `ax²` part outgrows the rest, so both ends take the sign of `a`.' },
    { name: 'Highest or lowest?', q: [-1, 2, 3], order: [2, 1, 0], win: [-3, 5, -6, 7], kind: 'turn', o: ['low', 'high', 'none'], key: [['tp']],
      task: 'Does `y = 3 + 2x − x²` have a highest point or a lowest point?',
      why: '`a` is the number in front of `x²`, wherever it sits, so here it is −1. Both ends fall, so it is an upside-down U with a highest point, `(1, 4)`. `y` is 3 at `x = 0` and at `x = 2`, and 4 halfway between.' },
    { show: true, name: 'The y-crossing', q: [1, -2, -8], win: W1, demo: 'travel', dur: 3.8, key: [['yc']],
      text: 'At `x = 0` the `x²` and `x` parts are both 0, which leaves `y = c`. So the curve crosses the y-axis at `(0, c)`, here `(0, −8)`.' },
    { name: 'Where it crosses', q: [1, -1, -6], fac: [3, -2], form: '(x − 3)(x + 2)', win: [-4, 5, -9, 8], kind: 'yc', o: ['br', 'b', 'R'], key: [['yc']],
      task: 'Where does `y = (x − 3)(x + 2)` cross the y-axis?',
      why: 'At `x = 0` the rule gives `(0 − 3)(0 + 2) = −6`, so it crosses at `(0, −6)`. Multiplied out it is `x² − x − 6`, whose `c` is −6 too.',
      tips: { br: '3 is a number in one bracket, not the height at `x = 0`.', b: '−1 is `b` in `x² − x − 6`, the number in front of `x`.' } },
    { show: true, name: 'Roots and turning point', q: [1, -2, -8], win: W4, gh: 220, sl: ['a', 'b', 'c'], moves: [[2.4, 3.2, 'c', -3], [3.5, 4.3, 'c', -8]], dur: 4.5, key: [['yc', 'root', 'tp'], ['sym']],
      text: 'The *roots*, where `y = 0`, come from `(x − 4)(x + 2)`, so they are −2 and 4. The *turning point* sits halfway, at `x = 1`, with height `1 − 2 − 8 = −9`. Drag `a`, `b` and `c` and watch the clues move.' },
    { name: 'Spot the slip', q: [1, -6, 5], win: [-1, 7, -6, 8], kind: 'slip', key: [['root', 'tp'], ['sym']],
      task: 'This working looks for the turning point of `y = x² − 6x + 5`. Which line slipped?',
      why: 'Lines 1 and 2 set `y` to 0, so they find the roots, 1 and 5, where the height is 0. The turning point sits halfway, at `x = 3`, and its height is `9 − 18 + 5 = −4`, so it is `(3, −4)`.' },
    { show: true, name: 'Steps in a table', q: [1, -2, -8], xs: [-2, 4], table: true, win: [-3, 5, -11, 3], dur: 4.0, key: [['pt', 'stair']],
      text: 'These are the heights of `y = x² − 2x − 8` at whole-number `x`, with the step from each to the next. The steps go −5, −3, −1, 1, 3, 5, each 2 more than the last, and that 2 is `2a`. A straight line climbs by the same step every time, so `a` is not a slope.' },
    { name: 'Find a from a table', q: [2, 1, 3], xs: [0, 4], table: true, win: [-0.5, 4.5, -4, 44], kind: 'tab', o: ['R', 'slope', 'chg'], key: [['pt']],
      task: 'A quadratic has these heights at `x = 0` to 4. What is `a`?',
      why: 'The steps go 3, 7, 11, 15, each 4 more than the last. That 4 is `2a`, so `a = 2`. The rule is `y = 2x² + x + 3`, and at `x = 2` it gives `8 + 2 + 3 = 13`.' },
    { show: true, name: 'A line across', q: [1, 0, 0], ln: [1, 2], win: WL, gh: 200, rd: true, sl: ['m', 'lc'], moves: [[2.6, 3.4, 'lc', -1], [3.6, 4.4, 'lc', 2]], dur: 4.5, key: [['line', 'meet'], ['lyc']],
      text: 'Lay a line `y = mx + c` across `y = x²`, with its `c` where it crosses the y-axis. Where they meet, `x² = mx + c`, so `x² − mx − c = 0`, whose `b² − 4ac` is `m² + 4c`. Above 0 the line crosses twice, at 0 it touches once, and below 0 it misses.' },
    { name: 'How many meetings?', q: [1, 0, 0], ln: [2, -1], win: WL, gh: 200, rd: true, kind: 'count', o: ['two', 'one', 'none'], key: [['line', 'meet']],
      task: 'How many times does the line `y = 2x − 1` meet `y = x²`?',
      why: 'Where they meet, `x² = 2x − 1`, so `x² − 2x + 1 = 0`. Its `b² − 4ac` is `4 − 4 = 0`, so the line just touches the curve, once, at `(1, 1)`.' },
    { name: 'Mixed: which sketch?', q: [2, -8, 6], qs: [[2, -8, 6], [2, 8, 6], [-2, 8, -6]], o: ['R', 'flip', 'upside'], kind: 'sketch', key: [['yc', 'root', 'tp']],
      task: 'Which sketch is `y = 2x² − 8x + 6`?',
      why: '`a` is 2, so it opens upward. At `x = 0`, `y = 6`. It is `2(x − 1)(x − 3)`, so the roots are 1 and 3, and the lowest point is halfway, at `x = 2`, with height `8 − 16 + 6 = −2`.' },
    { name: 'Mixed: does it cross?', q: [1, 4, 7], win: [-6, 2, -3, 12], kind: 'cross', o: ['two', 'one', 'none'], key: [['yc', 'tp'], ['sym']],
      task: 'Does `y = x² + 4x + 7` cross the x-axis?',
      why: '`b² − 4ac` is `16 − 28 = −12`, which is below 0, so it has no real roots. As `(x + 2)² + 3` its lowest point is `(−2, 3)`, above the x-axis.' },
    { name: 'Mixed: where they meet', q: [1, -2, -8], ln: [2, -8], win: [-4, 6, -14, 10], kind: 'meet', o: ['roots', 'R', 'noy'], key: [['line', 'meet']],
      task: 'Where does the line `y = 2x − 8` meet `y = x² − 2x − 8`?',
      why: 'Set the two rules equal. `x² − 2x − 8 = 2x − 8`, so `x² − 4x = 0`, which is `x(x − 4) = 0`. So `x = 0` or 4, and the line gives the points `(0, −8)` and `(4, 0)`.' },
  ];
  const FINISH = 'Three clues sketch a parabola from its rule. The sign of `a` says which way up it opens, `(0, c)` is where it crosses the y-axis, and any roots are where it crosses the x-axis, with the turning point halfway between them.';
  // Sources the checks restate (the lesson's own).
  const OPENSTAX = 'https://openstax.org/books/precalculus/pages/3-2-quadratic-functions';
  const MATHBITS = 'https://mathbitsnotebook.com/Algebra2/Quadratics/QDGraphInfo.html';
  const BITESIZE = 'https://www.bbc.co.uk/bitesize/guides/z3hb97h/revision/5';
  const WIKI = 'https://en.wikipedia.org/wiki/Projectile_motion';
  const BRILLIANT = 'https://brilliant.org/wiki/quadratic-discriminant';
  // The picture: the rule at TAGY, the readout at RDY, the graph, its key, a table, lines of working, handles.
  const TAGY = 22, RDY = 48, WSTEP = 24, SX0 = 84, SX1 = 320, SSTEP = 46;
  const FADE = 0.35;
  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const testing = () => document.documentElement.classList.contains('k-testing');

  // ---------- the rule (pure, so the checks can test it) ----------
  const close = (a, b) => Math.abs(a - b) < 1e-9 * Math.max(1, Math.abs(a), Math.abs(b));
  const fmtN = (v) => { let r = Math.round(v * 100) / 100; if (Math.abs(r) < 1e-12) r = 0; return (r < 0 ? '−' : '') + String(Math.abs(r)).replace(/^\d+/, (n) => n.replace(/\B(?=(\d{3})+$)/g, ',')); };
  const paren = (v) => (v < 0 ? '(' + fmtN(v) + ')' : fmtN(v));
  const poly = (q, x) => q[0] * x * x + q[1] * x + q[2];
  const disc = (q) => q[1] * q[1] - 4 * q[0] * q[2];
  const centre = (q) => -q[1] / (2 * q[0]);
  const zeroD = (D) => Math.abs(D) < 1e-9;
  const countKey = (D) => (zeroD(D) ? 'one' : D > 0 ? 'two' : 'none');
  // The roots, smaller first: one when b² − 4ac is 0, none below 0.
  function rootsOf(q) {
    if (Math.abs(q[0]) < 1e-12) return [];
    const D = disc(q);
    if (zeroD(D)) return [centre(q)];
    if (D < 0) return [];
    const r = Math.sqrt(D), x1 = (-q[1] - r) / (2 * q[0]), x2 = (-q[1] + r) / (2 * q[0]);
    return x1 < x2 ? [x1, x2] : [x2, x1];
  }
  const tpOf = (q) => { const h = centre(q); return [h, poly(q, h)]; };
  const ptText = (p) => '(' + fmtN(p[0]) + ', ' + fmtN(p[1]) + ')';
  const tpText = (q) => ptText(tpOf(q));
  // The line y = mx + c, l = [m, c], and where it meets the curve q: a x² + (b − m) x + (c − c') = 0.
  const lineAt = (l, x) => l[0] * x + l[1];
  const meetQ = (q, l) => [q[0], q[1] - l[0], q[2] - l[1]];
  const meetsOf = (q, l) => rootsOf(meetQ(q, l)).map((x) => [x, lineAt(l, x)]);
  const lineDisc = (l) => l[0] * l[0] + 4 * l[1];   // b² − 4ac of x² − mx − c = 0
  // Heights at whole-number x, the steps between them and the change in the steps.
  function tableOf(q, xr) {
    const xs = range(xr[0], xr[1]), ys = xs.map((x) => poly(q, x));
    const steps = ys.slice(1).map((v, k) => v - ys[k]), chg = steps.slice(1).map((v, k) => v - steps[k]);
    return { xs, ys, steps, chg };
  }

  // ---------- the rule in words ----------
  function polyText(q, order) {
    const terms = [[q[0], 'x²'], [q[1], 'x'], [q[2], '']];
    const t = (order || [0, 1, 2]).map((k) => terms[k]).filter((p) => p[0] !== 0);
    if (!t.length) return '0';
    return t.map((p, k) => {
      const a = Math.abs(p[0]), body = p[1] ? (a === 1 ? p[1] : fmtN(a) + p[1]) : fmtN(a);
      return (k === 0 ? (p[0] < 0 ? '−' : '') : p[0] < 0 ? ' − ' : ' + ') + body;
    }).join('');
  }
  const lineRHS = (l) => polyText([0, l[0], l[1]]);
  const rdParts = (l) => fmtN(l[0] * l[0]) + (l[1] < 0 ? ' − ' : ' + ') + fmtN(Math.abs(4 * l[1])) + ' = ' + fmtN(lineDisc(l));
  function discText(q) { const B = q[1] * q[1], F = 4 * q[0] * q[2]; return fmtN(B) + (F < 0 ? ' + ' : ' − ') + fmtN(Math.abs(F)) + ' = ' + fmtN(disc(q)); }
  // The rule's value at x, term by term: 1 − 2 − 8 = −9.
  function ruleText(q, x) {
    const t = [q[0] * x * x, q[1] * x, q[2]].filter((v) => !close(v, 0));
    if (!t.length) return '0';
    if (t.length === 1) return fmtN(t[0]);
    let s = fmtN(t[0]);
    for (let k = 1; k < t.length; k++) s += (t[k] < 0 ? ' − ' : ' + ') + fmtN(Math.abs(t[k]));
    return s + ' = ' + fmtN(t.reduce((a, b) => a + b, 0));
  }
  const facOne = (r) => (close(r, 0) ? 'x' : '(x ' + (r > 0 ? '− ' : '+ ') + fmtN(Math.abs(r)) + ')');
  const facText = (rs) => rs.map(facOne).join('');
  const aFacText = (q) => (q[0] === 1 ? '' : q[0] === -1 ? '−' : fmtN(q[0])) + facText(rootsOf(q));
  // (x − 3)(x + 2) at x: (0 − 3)(0 + 2) = −6.
  const facVal = (rs, x) => rs.map((r) => '(' + fmtN(x) + (r > 0 ? ' − ' : ' + ') + fmtN(Math.abs(r)) + ')').join('') + ' = ' + fmtN(rs.reduce((p, r) => p * (x - r), 1));
  const csText = (q) => { const t = tpOf(q); return (q[0] === 1 ? '' : fmtN(q[0])) + facOne(t[0]) + '²' + (t[1] < 0 ? ' − ' : ' + ') + fmtN(Math.abs(t[1])); };
  const lineVal = (l, x) => fmtN(l[0]) + ' × ' + paren(x) + (l[1] === 0 ? '' : (l[1] < 0 ? ' − ' : ' + ') + fmtN(Math.abs(l[1]))) + ' = ' + fmtN(lineAt(l, x));
  const sqText = (x) => paren(x) + '² = ' + fmtN(x * x);
  function zeroLines(q) {
    const a = q[0], b = q[1], c = q[2], sg = (v) => (v < 0 ? ' − ' : ' + ');
    return [
      { l: 'at x = 0, y = ' + (a === 1 ? '' : a === -1 ? '−' : fmtN(a) + ' × ') + '0²' + sg(b) + fmtN(Math.abs(b)) + ' × 0' + sg(c) + fmtN(Math.abs(c)) },
      { l: '= 0' + sg(b) + '0' + sg(c) + fmtN(Math.abs(c)) + ' = ' + fmtN(c), r: 'so y = c' },
    ];
  }
  const TURN = { low: 'A lowest point', high: 'A highest point', none: 'No turning point' };
  const MEETW = { two: 'Twice', one: 'Once', none: 'Never' };
  const CROSSW = { two: 'Yes, twice', one: 'Yes, once', none: 'No' };
  const LCOUNT = { two: 'it crosses twice', one: 'it touches once', none: 'it misses' };
  // Where a line meets the curve, right ('R') or by a slip: the curve's own roots, or the x values with y = 0.
  function meetSlip(q, l, s) {
    if (s === 'roots') return rootsOf(q).map((x) => [x, 0]);
    const m = meetsOf(q, l);
    return s === 'noy' ? m.map((p) => [p[0], 0]) : m;
  }
  const ptsText = (v) => v.map(ptText).join(' and ');

    if (was) { anim.pause(); T = Infinity; enter('scene'); }

    const i = at(), d = STEPS[i], st = S[i];

  } });
