<p class="caption">The inverse plays a move backwards. It exists only when the determinant is not zero.</p>

<script>
  // ---------- numbers and words (pure, so the checks can test them) ----------
  const MINUS = '−', NB = ' ';
  function num(v) { let r = Math.round(v * 100) / 100; if (Math.abs(r) < 1e-9) r = 0; return (r < 0 ? MINUS : '') + String(Math.abs(r)); }
  const paren = (v) => (v < 0 ? '(' + num(v) + ')' : num(v));
  const pt = (v) => '(' + num(v[0]) + ', ' + num(v[1]) + ')';
  const ptU = (v, u) => '(' + num(v[0]) + ' ' + u + ', ' + num(v[1]) + ' ' + u + ')';
  const oneLine = (M) => '[' + M.map((r) => r.map(num).join(' ')).join('; ') + ']';
  const divLine = (M, k) => oneLine(M) + ' ÷ ' + num(k);
  const toNum = (t) => { const f = String(t).replace(MINUS, '-').split('/'); return f.length > 1 ? +f[0] / +f[1] : +f[0]; };
  // '[1/3 1; 1/4 1/2]' or '[6 2; 2 6] ÷ 32' -> its numbers (divided through).
  function parseM(s) {
    const parts = String(s).split('÷'), k = parts[1] ? toNum(parts[1].trim()) : 1;
    return parts[0].replace(/[[\]]/g, '').trim().split(';').map((r) => r.trim().split(/\s+/).map((t) => toNum(t) / k));
  }
  // The same, as written: its entries' words and what it is divided by.
  function splitDiv(s) {
    const parts = String(s).split('÷');
    return { txt: parts[0].replace(/[[\]]/g, '').trim().split(';').map((r) => r.trim().split(/\s+/)), div: parts[1] ? parts[1].trim() : null };
  }
  const parsePt = (s) => String(s).replace(/[()]/g, '').split(',').map((t) => toNum(t.trim()));
  const say = (s) => String(s == null ? '' : s).replace(/ /g, ' ').replace(/⁻¹/g, ' inverse').replace(/−/g, ' minus ').replace(/×/g, ' times ')
    .replace(/÷/g, ' divided by ').replace(/=/g, ' equals ').replace(/Ω/g, ' ohms').replace(/₁/g, ' 1').replace(/₂/g, ' 2').replace(/\s+/g, ' ').trim();

  // ---------- the rule ----------
  // A move sends (x, y) to x lots of column 1 plus y lots of column 2. Its inverse sends every
  // landing spot back where it came from: swap a and d, change the signs of b and c, divide by ad − bc.
  const ID = [[1, 0], [0, 1]];
  const det = (M) => M[0][0] * M[1][1] - M[0][1] * M[1][0];
  const mul = (M, v) => [M[0][0] * v[0] + M[0][1] * v[1], M[1][0] * v[0] + M[1][1] * v[1]];
  const mm = (P, Q) => [[P[0][0] * Q[0][0] + P[0][1] * Q[1][0], P[0][0] * Q[0][1] + P[0][1] * Q[1][1]],
    [P[1][0] * Q[0][0] + P[1][1] * Q[1][0], P[1][0] * Q[0][1] + P[1][1] * Q[1][1]]];
  const scaleM = (M, k) => M.map((r) => r.map((v) => v * k));
  const swapped = (M) => [[M[1][1], -M[0][1]], [-M[1][0], M[0][0]]];
  const inv = (M) => (Math.abs(det(M)) < 1e-12 ? null : scaleM(swapped(M), 1 / det(M)));
  const working = (M) => paren(M[0][0]) + ' × ' + paren(M[1][1]) + ' − ' + paren(M[0][1]) + ' × ' + paren(M[1][0]) + ' = ' + num(det(M));
  const colsOf = (M) => [[M[0][0], M[1][0]], [M[0][1], M[1][1]]];
  const gridOf = (c) => [[c[0][0], c[1][0]], [c[0][1], c[1][1]]];
  const mix = (c, v) => [v[0] * c[0][0] + v[1] * c[1][0], v[0] * c[0][1] + v[1] * c[1][1]];
  const near = (a, b, t) => Math.abs(a - b) < (t || 1e-9);
  const samePt = (a, b) => !!a && !!b && a.length === b.length && a.every((v, k) => near(v, b[k]));
  const sameM = (P, Q) => !!P && !!Q && P.length === Q.length && P.every((r, i) => r.length === Q[i].length && r.every((v, j) => near(v, Q[i][j])));
  // The move on screen, e of the way from P to Q: a straight blend (a turn turns, below).
  const lerpM = (P, Q, e) => (e >= 1 ? Q.map((r) => r.slice()) : e <= 0 ? P.map((r) => r.slice()) : P.map((r, i) => r.map((v, j) => v + (Q[i][j] - v) * e)));
  const rot = (a) => [[Math.cos(a), -Math.sin(a)], [Math.sin(a), Math.cos(a)]];
  const rotAng = (M) => (near(M[0][0], M[1][1]) && near(M[0][1], -M[1][0]) && near(det(M), 1) ? Math.atan2(M[1][0], M[0][0]) : null);

  const A = [[3, 1], [4, 2]], AI = inv(A), SW = swapped(A);
  const TURN = [[0, -1], [1, 0]], BACKT = [[0, 1], [-1, 0]], HALF = [[-1, 0], [0, -1]];
  const B2 = [[2, 1], [1, 1]], B2I = inv(B2);
  const FLAT = [[2, 4], [1, 2]], FLIPM = [[1, 2], [2, 1]];
  const TGT = [4, 6], START = mul(AI, TGT), T2 = [5, 3], SOL2 = mul(B2I, T2);
  // Screen 7: i lands on (2, 1) and j's tip on (x, 1).
  const leanM = (x) => [[2, x], [1, 1]];
  const LT = [3, 2], LT2 = [4, 2], SOLC = LT2[0] / leanM(2)[0][0];
  const landsOn = (M, b) => { const N = inv(M); return N ? mul(N, b) : null; };
  const onLine = (c, p) => near(p[0] * c[1] - p[1] * c[0], 0);
  // The two-loop circuit: loop resistors, the shared one, the two sources (example values).
  const R1 = 4, RS = 2, R2 = 4, E1 = 12, E2 = 4;
  const RG = [[R1 + RS, -RS], [-RS, R2 + RS]], VV = [E1, E2], IL = mul(inv(RG), VV), SWR = swapped(RG);
  const XY = ['x', 'y'], II = ['I₁', 'I₂'];
  // An equation's words: each number times its unknown, then = the right-hand side.
  function eq(row, b, vars) {
    let s = '';
    row.forEach((c, k) => {
      if (c === 0) return;
      s += s ? (c < 0 ? ' − ' : ' + ') : (c < 0 ? MINUS : '');
      s += (Math.abs(c) === 1 ? '' : num(Math.abs(c))) + vars[k];
    });
    return s + ' = ' + num(b);
  }
  // One row of the inverse times the target, worked.
  const rowWork = (N, b, r) => XY[r] + ' = ' + num(N[r][0]) + ' × ' + num(b[0]) + (N[r][1] < 0 ? ' − ' : ' + ') + num(Math.abs(N[r][1])) + ' × ' + num(b[1]) + ' = ' + num(mul(N, b)[r]);
  const divWork = (r) => '(' + num(SWR[r][0]) + ' × ' + num(VV[0]) + ' + ' + num(SWR[r][1]) + ' × ' + num(VV[1]) + ') ÷ ' + num(det(RG)) + ' = ' +
    num(mul(SWR, VV)[r]) + ' ÷ ' + num(det(RG)) + ' = ' + num(IL[r]);
  // The F-shaped flag, corner by corner (squares).
  const FLAG = [[0.25, 0.25], [0.5, 0.25], [0.5, 0.75], [0.85, 0.75], [0.85, 1], [0.5, 1], [0.5, 1.25], [1, 1.25], [1, 1.5], [0.25, 1.5]];

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // win: the patch of plane shown [x0, x1, y0, y1]. rows: worked lines above the picture. dur: a SHOW
  // step's demonstration; from: where Play back starts it. A puzzle: task, opts, want, hints (one per
  // wrong answer), why, slips (the line drawn for each wrong answer), fb (seconds of motion after a
  // right and a wrong answer).
  const WIN = { A: [-0.6, 4.8, -0.6, 7.2], T: [-2.1, 2.1, -2.1, 2.1], B: [-1.1, 4.1, -1.1, 3.1], L: [-9.2, 7.2, -0.8, 10.8],
    F: [-1.6, 6.6, -1.6, 4.6], S: [-0.6, 8.6, -0.6, 5.6], C: [-2.6, 12.6, -2.6, 6.6] };
  const PICK = 'Tap one of the answers.';
  const UNDO = ['[1/3 1; 1/4 1/2]', oneLine(scaleM(A, -1)), oneLine(AI)];
  const NOSIGN = [[B2[1][1], B2[0][1]], [B2[1][0], B2[0][0]]], NOSWAP = [[B2[0][0], -B2[0][1]], [-B2[1][0], B2[1][1]]];
  const INV2 = [oneLine(B2I), oneLine(NOSIGN), oneLine(NOSWAP)];
  const SOLVE = [pt(mul(B2, T2)), pt([SOL2[1], SOL2[0]]), pt(SOL2)];
  const SHARED = [num(IL[0] - IL[1]) + ' A', num(IL[0] + IL[1]) + ' A', num(IL[0]) + ' A'];
  const RINV = [divLine(RG, det(RG)), divLine(SWR, det(RG)), divLine(SWR, RG[0][0] * RG[1][1] + RG[0][1] * RG[1][0])];
  const r11 = (P) => num(mm(parseM(P), A)[0][0]);
  const STEPS = [
    { show: true, key: 'play', name: 'Play it back', win: WIN.A, flag: true, dur: 3.6, from: 1.9, replay: 'Play back',
      still: () => { S[0].pose = true; K.refresh(); },
      text: 'The move `A = [3 1; 4 2]` sends i to `(3, 4)` and j to `(1, 2)`, and the flag leans with the grid. Playing it back slides every point home. That backwards move is the *inverse* of A, written `A⁻¹ = [1 −0.5; −2 1.5]`.' },
    { kind: 'pick', key: 'turn', name: 'Turn it back', win: WIN.T, flag: true, fb: [1.9, 1.9],
      task: 'The quarter turn `[0 −1; 1 0]` has turned the flag anticlockwise. Which matrix brings it back?',
      opts: [oneLine(TURN), oneLine(BACKT), oneLine(HALF)], want: oneLine(BACKT),
      hints: { [oneLine(TURN)]: 'Not quite. That turns it another quarter turn, which makes a half turn in all.', [oneLine(HALF)]: 'Not quite. That is a half turn. The flag would end a quarter turn clockwise of where it began.' },
      slips: { [oneLine(TURN)]: 'Another quarter turn makes a half turn in all', [oneLine(HALF)]: 'A half turn more ends a quarter turn clockwise of home' },
      why: 'Bringing it back means a quarter turn clockwise. That sends i to `(0, −1)` and j to `(1, 0)`. Those are the columns of `[0 1; −1 0]`.' },
    { show: true, key: 'target', name: 'The target', win: WIN.A, rows: 2, dur: 3.4, from: 0.7, replay: 'Play back',
      text: 'A sends `(1, 1)` onto the dot at `(4, 6)`, because `1 × (3, 4) + 1 × (1, 2)` is `(4, 6)`. Playing it back carries that point home to `(1, 1)`. So A then A⁻¹ leaves every point alone, and `A⁻¹A = I`, the do-nothing matrix.' },
    { kind: 'pick', key: 'undo', name: 'Which undoes A?', win: WIN.A, flag: true, fb: [2.4, 2.3],
      task: 'Which of these undoes `A = [3 1; 4 2]`? The one that does gives I when you multiply it by A.',
      opts: UNDO, want: UNDO[2],
      hints: { [UNDO[0]]: 'Not quite. The −1 means undo, not 1 ÷ each entry. Row 1 by column 1 gives `1 + 4 = 5`, not 1.', [UNDO[1]]: 'Not quite. Row 1 by column 1 gives −13, not 1.' },
      slips: { [UNDO[0]]: 'Row 1 by column 1: 1/3 × 3 + 1 × 4 = ' + r11(UNDO[0]) + ', not 1', [UNDO[1]]: 'Row 1 by column 1: −3 × 3 + (−1) × 4 = ' + r11(UNDO[1]) + ', not 1' },
      why: 'Multiply `[1 −0.5; −2 1.5]` by A. Row 1 by column 1 gives `1 × 3 − 0.5 × 4 = 1`. The other entries give 0, 0 and 1, so the answer is I.' },
    { show: true, key: 'recipe', name: 'The recipe', win: WIN.A, flag: true, rows: 3, dur: 4.4, replay: 'Play again',
      text: 'Swap a and d, and change the signs of b and c. That matrix times A gives `[2 0; 0 2]`, which is 2 times I, and 2 is A\'s determinant. So divide by the determinant to get `A⁻¹ = [1 −0.5; −2 1.5]`.' },
    { kind: 'pick', key: 'inv2', name: 'Your turn', win: WIN.B, flag: true, fb: [2.0, 1.6],
      task: 'What is the inverse of `[2 1; 1 1]`? Its determinant is 1.',
      opts: INV2, want: INV2[0],
      hints: { [INV2[1]]: 'Not quite. Change the signs of b and c as well.', [INV2[2]]: 'Not quite. Swap a and d as well.' },
      slips: { [INV2[1]]: 'Times ' + oneLine(B2) + ' it gives ' + oneLine(mm(NOSIGN, B2)) + ', not I', [INV2[2]]: 'Times ' + oneLine(B2) + ' it gives ' + oneLine(mm(NOSWAP, B2)) + ', not I' },
      why: 'Swap a and d to get `[1 1; 1 2]`. Then change the signs of b and c to get `[1 −1; −1 2]`. The determinant is 1, so dividing leaves it as it is.' },
    { show: true, key: 'lean', name: 'Lean it flat', win: WIN.L, rows: 2, jx: true, dur: 4.3, still: { jx: 2 }, replay: 'Lean it again',
      text: 'As j leans onto i\'s line, the determinant falls and the point that lands on `(3, 2)` races away. At 0 the grid lies flat: no point lands on `(3, 2)`, but every point with `x + y = 2` lands on `(4, 2)`. Drag j\'s tip to try it.',
      read: 'As j leans onto i\'s line, the determinant falls from 1 to 0. The point that lands on `(3, 2)` runs from `(1, 1)` out to `(−8, 10)`. At 0, no point lands on `(3, 2)`, and every point with `x + y = 2` lands on `(4, 2)`.' },
    { kind: 'pick', key: 'cannot', name: 'No way back', win: WIN.F, flag: true, fb: [1.9, 1.2],
      task: 'Which move cannot be undone?',
      opts: [oneLine(FLIPM), oneLine(FLAT), oneLine(TURN)], want: oneLine(FLAT),
      hints: { [oneLine(FLIPM)]: 'Not quite. Its determinant is −3. It flips the plane but does not flatten it, so it can be undone.', [oneLine(TURN)]: 'Not quite. A turn is undone by turning back.' },
      slips: { [oneLine(FLIPM)]: 'ad − bc = ' + working(FLIPM) + ', a flip, not flat', [oneLine(TURN)]: 'ad − bc = ' + working(TURN) + ', a turn' },

  K.check('The recipe works for any matrix: [d −b; −c a] times [a b; c d] is (ad − bc) times I, either way round, so dividing by ad − bc gives the inverse', () =>
    [[[3, 1], [4, 2]], [[2, 1], [1, 1]], [[6, -2], [-2, 6]], [[1, 2], [2, 1]], [[5, -3], [7, 2]], [[0.5, 4], [-1, 3]]].every((M) =>
      sameM(mm(swapped(M), M), scaleM(ID, det(M))) && sameM(mm(M, swapped(M)), scaleM(ID, det(M))) && sameM(mm(inv(M), M), ID)));
  K.check('Playing it back: screen 1 holds A, then ends with the grid home and A⁻¹ shown; the recipe screen builds the swapped matrix, divides it into A⁻¹, and that carries the grid home', () => {
    const i0 = idx('play'), mid = drawn(i0, blank(), 2.0), end = drawn(i0, blank()), pose = drawn(i0, Object.assign(blank(), { pose: true }));
    const ir = idx('recipe'), half = drawn(ir, blank(), 3.0), rr = drawn(ir, blank());
    return sameM(mid.M, A) && sameM(end.M, ID) && sameM(end.inv, AI) && sameM(pose.M, A) && sameM(pose.inv, AI) &&
      sameM(half.sw, SW) && half.inv === null && sameM(rr.inv, AI) && sameM(rr.M, ID);
  });
  K.check('Each puzzle\'s answer comes from the rule, and each wrong answer offered is the slip its hint names', () => {
    const g = (k) => STEPS[idx(k)], others = (d) => d.opts.filter((o) => o !== d.want);
    const s1 = g('turn'), s3 = g('undo'), s5 = g('inv2'), s7 = g('cannot'), s9 = g('solve'), s11 = g('shared'), s12 = g('rinv');
    return sameM(mm(parseM(s1.want), TURN), ID) && others(s1).every((o) => !sameM(mm(parseM(o), TURN), ID)) &&
      s1.opts.indexOf(oneLine(TURN)) >= 0 && s1.opts.indexOf(oneLine(HALF)) >= 0 &&
      sameM(mm(parseM(s3.want), A), ID) && others(s3).every((o) => !sameM(mm(parseM(o), A), ID)) &&
      sameM(parseM(s5.want), inv(B2)) && others(s5).every((o) => !sameM(parseM(o), inv(B2))) &&
      sameM(parseM(s5.opts[1]), NOSIGN) && sameM(parseM(s5.opts[2]), NOSWAP) &&
      near(det(parseM(s7.want)), 0) && others(s7).every((o) => !near(det(parseM(o)), 0)) &&
      samePt(parsePt(s9.want), mul(inv(B2), T2)) && s9.opts.indexOf(pt(mul(B2, T2))) >= 0 &&
      s11.want === num(IL[0] - IL[1]) + ' A' && s11.opts.indexOf(num(IL[0] + IL[1]) + ' A') >= 0 && s11.opts.indexOf(num(IL[0]) + ' A') >= 0 &&
      sameM(parseM(s12.want), inv(RG)) && others(s12).every((o) => !sameM(parseM(o), inv(RG)));
  });
  K.check('Each puzzle offers three different answers, accepts only the right one, and draws every wrong one in the warning colour', () =>
    DO.every((i) => {
      const d = STEPS[i];
      if (d.opts.length !== 3 || new Set(d.opts).size !== 3 || d.opts.indexOf(d.want) < 0) return false;
      if (!d.opts.every((o) => isRight(i, Object.assign(blank(), { pick: o })) === (o === d.want))) return false;
      if (drawn(i, solvedSt(i)).bad !== 0) return false;
      return d.opts.filter((o) => o !== d.want).every((o) => drawn(i, wrongSt(i, o)).bad > 0 && !!d.hints[o] && !!d.slips[o]);
    }));
  K.check('Before Check, no puzzle shows its answer; after a right answer, it does', () =>
    DO.every((i) => drawn(i, blank()).reveal === 0 && drawn(i, solvedSt(i)).reveal > 0) &&
    drawn(idx('undo'), blank()).prod === null && drawn(idx('inv2'), blank()).prod === null && drawn(idx('rinv'), blank()).inv === null &&
    drawn(idx('cannot'), blank()).pick === null && drawn(idx('turn'), blank()).pick === null && drawn(idx('shared'), blank()).shared === '?' &&
    samePt(drawn(idx('solve'), blank()).start, T2));
  K.check('Every demonstration has finished arriving within its 3 to 4.5 s, none starting before the 0.35 s screen fade ends; every answer\'s motion, right or wrong, within 2.5 s', () => {
    const keepT = T;
    const timed = (i, st, limit) => {
      const keepS = S[i];
      T = Infinity; latest = 0; earliest = Infinity;
      S[i] = st;
      try { paint(i); } finally { S[i] = keepS; }
      return latest <= limit + 1e-9;
    };
    const ok = STEPS.every((d, i) => {
      if (d.show) { const r = timed(i, blank(), d.dur); return r && d.dur <= 4.5 && d.dur >= 3 && earliest >= FADE; }
      return timed(i, solvedSt(i), d.fb[0]) && d.fb[0] <= 2.5 && d.opts.filter((o) => o !== d.want).every((o) => timed(i, wrongSt(i, o), d.fb[1]) && d.fb[1] <= 2.5);
    });
    T = keepT; paint();
    return ok;
  });

  K.ready();
</script>
