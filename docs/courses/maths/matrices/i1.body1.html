<p class="caption">Rows are equations and columns are arrows. Every landing point is worked out from the grid.</p>

<script>
  // ---------- numbers and words (pure, so the checks can test them) ----------
  const MINUS = '−', NB = ' ';
  function num(v) { let r = Math.round(v * 100) / 100; if (Math.abs(r) < 1e-9) r = 0; return (r < 0 ? MINUS : '') + String(Math.abs(r)); }
  const pt = (v) => '(' + num(v[0]) + ', ' + num(v[1]) + ')';
  const oneLine = (M) => '[' + M.map((r) => r.map(num).join(' ')).join('; ') + ']';
  // A row of numbers as the left side of an equation: [3, 2] -> '3x + 2y', [1, -1] -> 'x − y'.
  function lin(cs, ls) {
    let s = '';
    cs.forEach((c, k) => {
      if (!c) return;
      const a = Math.abs(c), body = (a === 1 ? '' : num(a)) + ls[k];
      s += s ? (c < 0 ? ' ' + MINUS + ' ' : ' + ') + body : (c < 0 ? MINUS : '') + body;
    });
    return s || '0';
  }
  // A row times the unknowns, written out: [1, 3] -> '1 × x + 3 × y'.
  const work = (r, vs) => r.map((c, k) => (k ? (c < 0 ? ' ' + MINUS + ' ' : ' + ') + num(Math.abs(c)) : num(c)) + ' × ' + vs[k]).join('');
  const parseGrid = (s) => String(s).replace(/[[\]]/g, '').split(';').map((r) => r.trim().split(/\s+/).map((t) => +t.replace(MINUS, '-')));
  const parsePt = (s) => String(s).replace(/[()]/g, '').split(',').map((t) => +t.trim().replace(MINUS, '-'));
  const XY = ['x', 'y'], II = ['I₁', 'I₂'];
  const say = (s) => String(s == null ? '' : s).replace(/ /g, ' ').replace(/−/g, ' minus ').replace(/×/g, ' times ').replace(/=/g, ' equals ')
    .replace(/I₁/g, 'I one').replace(/I₂/g, 'I two').replace(/\s+/g, ' ').trim();

  // ---------- the rule ----------
  // A grid times a column: each row multiplies across and adds.
  const mul = (M, v) => M.map((r) => r.reduce((a, m, k) => a + m * v[k], 0));
  const colsOf = (M) => M[0].map((z, k) => M.map((r) => r[k]));
  const gridOf = (cols) => cols[0].map((z, i) => cols.map((c) => c[i]));
  // The chain: so many copies of the first arrow, then of the second, each starting where the last ends.
  function chainOf(arrows, amts) {
    const segs = [];
    let p = [0, 0];
    arrows.forEach((c, k) => { for (let n = 0; n < amts[k]; n++) { const q = [p[0] + c[0], p[1] + c[1]]; segs.push({ a: p, b: q, k }); p = q; } });
    return { segs, end: p };
  }
  const combo = (arrows, amts) => chainOf(arrows, amts).end;

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // pic: what is drawn. M: the grid. dur: a SHOW step's demonstration in seconds. read: its words for
  // the read-through, where its own words ask him to act; still: the state its picture shows there.
  // A puzzle: task, opts (three answers), want, hints (one per wrong answer), why, fb (seconds of
  // motion after a right and a wrong answer). Plane steps: amt, the amounts x and y; sliders, light
  // and drag, what Dan may change; target, a point to hit; hide, the chain waits for Check; wrong,
  // how each wrong answer is drawn.
  const MAIN = [[1, 3], [2, 1]];
  const PICK = 'Tap one of the answers.';
  const STEPS = [
    { show: true, name: 'A grid of numbers', pic: 'cells', M: [[4, 7, 1], [2, 5, 3]], lit: [0, 2], dur: 4.3,
      text: 'A *matrix* is a grid of numbers in rows and columns. This one has 2 rows and 3 columns, so it is a 2 by 3 grid. Each number is an *entry*, named by its row first, then its column.' },
    { kind: 'pick', name: 'Row 2, column 1', pic: 'cells', M: [[4, 7, 1], [2, 5, 3]], ask: [1, 0], fb: [1.4, 1.0],
      task: 'Which number is in row 2, column 1?', opts: ['7', '2', '5'], want: '2',
      hints: { '7': 'Not quite. That is row 1, column 2. Go down to row 2 first.', '5': 'Not quite. That is row 2, column 2. Column 1 is the first one across.' },
      why: 'The row comes first. Row 2 holds 2, 5 and 3. Its entry in column 1 is 2.' },
    { show: true, name: 'Equations as a grid', pic: 'eqs', M: MAIN, rhs: [7, 4], dur: 4.2,
      text: 'Take `x + 3y = 7` and `2x + y = 4`. Each equation\'s numbers make one row of the grid `[1 3; 2 1]`. The unknowns stand in a column beside it, and the answers in a column after the equals sign.' },
    { kind: 'pick', name: 'Which grid?', pic: 'which', M: [[3, 2], [1, -1]], rhs: [13, 1], fb: [1.3, 1.3],
      task: 'Which grid holds `3x + 2y = 13` and `x − y = 1`?', opts: ['[3 2; 1 −1]', '[3 1; 2 −1]', '[3 2; 1 1]'], want: '[3 2; 1 −1]',
      hints: { '[3 1; 2 −1]': 'Not quite. That puts each equation down a column. An equation goes across one row.', '[3 2; 1 1]': 'Not quite. `x − y` has −1 for `y`. Keep the minus sign.' },
      why: 'Row 1 holds the numbers of `3x + 2y`, which are 3 and 2. Row 2 holds the numbers of `x − y`, which are 1 and −1. So the grid is `[3 2; 1 −1]`.' },
    { show: true, name: 'Columns are arrows', pic: 'plane', M: MAIN, amt: [2, 1], sliders: true, joint: true, dur: 4.1,
      text: 'Read down its columns, and the grid is two arrows, `(1, 2)` and `(3, 1)`. The grid times `(2, 1)` takes 2 lots of column 1 and 1 lot of column 2, nose to tail. The chain lands on `(5, 5)`. Slide `x` and `y` to mix other amounts.',
      read: 'Read down its columns, and the grid is two arrows, `(1, 2)` and `(3, 1)`. The grid times `(2, 1)` takes 2 lots of column 1 and 1 lot of column 2, nose to tail. Two lots of `(1, 2)` reach `(2, 4)`, and one `(3, 1)` more lands on `(5, 5)`.' },
    { kind: 'pick', name: 'Two of each', pic: 'plane', M: MAIN, amt: [2, 2], hide: true, fb: [2.0, 1.6],
      task: 'Where does `[1 3; 2 1]` times `(2, 2)` land?', opts: ['(6, 8)', '(4, 3)', '(8, 6)'], want: '(8, 6)', wrong: { '(6, 8)': 'rows', '(4, 3)': 'once' },
      hints: { '(6, 8)': 'Not quite. That mixes the rows as arrows. The arrows are the columns.', '(4, 3)': 'Not quite. That takes each column once. Take 2 lots of each.' },
      why: 'Two lots of `(1, 2)` reach `(2, 4)`. Two lots of `(3, 1)` add `(6, 2)`. Nose to tail, the chain lands on `(8, 6)`.' },
    { show: true, name: 'Rows and columns', pic: 'plane', M: MAIN, amt: [2, 1], light: true, drag: true, dur: 4.3, still: { light: 'c1' },
      text: 'Row 1 adds the across parts of the chain, so it reads `x + 3y = 5`. Row 2 adds the up parts, so it reads `2x + y = 5`. Each column is one arrow. Light each one, and drag a tip to change the grid.',
      read: 'Row 1 adds the across parts of the chain, so it reads `x + 3y = 5`. Row 2 adds the up parts, so it reads `2x + y = 5`. Each column is one arrow, and moving its tip changes the grid\'s numbers.' },
    { kind: 'pick', name: 'Both readings', pic: 'read', M: [[2, 4], [1, 3]], fb: [1.0, 1.0],
      task: 'In `[2 4; 1 3]`, which pair is row 2 as an equation and column 2 as an arrow?', opts: ['4x + 3y and (1, 3)', 'x + 3y and (4, 3)', 'x + 3y and (1, 3)'], want: 'x + 3y and (4, 3)',
      hints: { '4x + 3y and (1, 3)': 'Not quite. That swaps them. A row runs across, and a column runs down.', 'x + 3y and (1, 3)': 'Not quite. The equation is right. Column 2 runs down, through 4 and 3.' },
      why: 'Row 2 runs across, through 1 and 3, so it reads `x + 3y`. Column 2 runs down, through 4 and 3, so it is the arrow `(4, 3)`.' },
    { show: true, name: 'Hit the target', pic: 'plane', M: MAIN, amt: [1, 2], target: [7, 4], sliders: true, dur: 3.9,
      text: 'To land on the target `(7, 4)`, the across parts must make 7 and the up parts 4. That is `x + 3y = 7` and `2x + y = 4`, a pair of *simultaneous equations*. One lot of column 1 and two of column 2 hit it. Slide `x` and `y` to try other mixes.',
      read: 'To land on the target `(7, 4)`, the across parts must make 7 and the up parts 4. That is `x + 3y = 7` and `2x + y = 4`, a pair of *simultaneous equations*. One lot of column 1 and two of column 2 hit it.' },
    { kind: 'pick', name: 'Aim for (9, 8)', pic: 'plane', M: MAIN, amt: [3, 2], target: [9, 8], hide: true, fb: [2.3, 1.0],
      task: 'Which equations find the amounts that hit `(9, 8)`?', opts: ['x + 3y = 8 and 2x + y = 9', 'x + 2y = 9 and 3x + y = 8', 'x + 3y = 9 and 2x + y = 8'], want: 'x + 3y = 9 and 2x + y = 8',
      wrong: { 'x + 2y = 9 and 3x + y = 8': 'cols', 'x + 3y = 8 and 2x + y = 9': 'swap' },
      hints: { 'x + 2y = 9 and 3x + y = 8': 'Not quite. Those read the grid down its columns. Each equation is a row.', 'x + 3y = 8 and 2x + y = 9': 'Not quite. Row 1 adds the across parts, so it must make 9.' },
      why: 'Row 1 adds the across parts, `x + 3y`, and the target is 9 across. Row 2 adds the up parts, `2x + y`, and it is 8 up. They give `x = 3` and `y = 2`.' },
    { kind: 'pick', name: 'How big?', pic: 'size', eqs: [[1, 1], [1, -1], [2, 1]], rhs: [5, 1, 8], fb: [1.1, 1.1],
      task: 'What size is the grid for `x + y = 5`, `x − y = 1` and `2x + y = 8`?', opts: ['2 by 3', '3 by 2', '3 by 3'], want: '3 by 2', wrong: { '2 by 3': 'flip', '3 by 3': 'rhs' },
      hints: { '2 by 3': 'Not quite. Size is rows first, and each equation is a row.', '3 by 3': 'Not quite. The answers 5, 1 and 8 stand in their own column, after the equals sign.' },
      why: 'Three equations make 3 rows. Two unknowns, `x` and `y`, make 2 columns. Rows come first, so it is a 3 by 2 grid.' },
    { kind: 'pick', name: 'Loop currents', pic: 'loop', M: [[6, -2], [-2, 6]], amt: [2.5, 1.5], fb: [1.3, 1.0],
      task: 'A circuit\'s two loops make the grid `[6 −2; −2 6]`, in ohms, times the loop currents. Which column of voltages do currents of 2.5 A and 1.5 A give?',
      opts: ['(12, 4)', '(18, 14)', '(15, 9)'], want: '(12, 4)', wrong: { '(15, 9)': 'diag', '(18, 14)': 'abs' },
      hints: { '(15, 9)': 'Not quite. Each row uses both of its entries, the −2 as well.', '(18, 14)': 'Not quite. Keep the minus signs. `−2 × 1.5` takes 3 away.' },
      why: 'Row 1 gives `6 × 2.5 − 2 × 1.5 = 12`. Row 2 gives `−2 × 2.5 + 6 × 1.5 = 4`. So the voltages are 12 V and 4 V, and `6I₁ − 2I₂ = 12` and `−2I₁ + 6I₂ = 4` both hold.' },
  ];
  const FINISH = 'A matrix times a column of amounts takes that many of each of its columns, added nose to tail. Each row of the grid is one equation for one part of where it lands.';
  // Sources the checks restate (the lesson's own).
  const HELM = 'https://www.lboro.ac.uk/media/media/schoolanddepartments/mlsc/downloads/HELM%20Workbook%207%20Matrices.pdf';
  const LIBRE = 'https://math.libretexts.org/Courses/Canada_College/Linear_Algebra_and_Its_Application/02%3A_Matrices/2.02%3A_Matrix_Multiplication';
  const MESH = 'https://www.electronics-tutorials.ws/dccircuits/dcp_5.html';
  const FADE = 0.35;
  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const testing = () => document.documentElement.classList.contains('k-testing');
  // Step 7's demonstration lights row 1, then row 2, then column 1 (seconds on and off).
  const LIGHTS = [{ k: 'r1', on: 1.0, off: 2.2 }, { k: 'r2', on: 2.5, off: 3.5 }, { k: 'c1', on: 3.8 }];

  // ---------- each step's state ----------
  // pick: the answer chosen; res: 'right', 'wrong' or 'empty' once checked; why: the Why? note open;
  // amt: Dan's amounts on a slider step; light: what Dan lit; c: the two columns after he drags a tip.
  function blank() { return { pick: null, res: null, why: false, amt: null, light: null, c: null }; }
  const isRight = (i, st) => st.pick != null && st.pick === STEPS[i].want;
  const hintFor = (i, st) => { const d = STEPS[i]; return (d.hints && d.hints[st.pick]) || 'Not quite. Try another answer.'; };
  let S = STEPS.map(() => blank());
  let finished = false, lastStep = -1, lastDone = false, T = Infinity, motionEnd = 0;
  let REC = null;   // what the last paint drew, for the checks
  const el = (id) => document.getElementById(id);

  // ---------- text with amber key terms and italic letters (built with K.el, never innerHTML) ----------
  const ITAL = /((?<![A-Za-z])[xy](?![A-Za-z])|I[₁₂])/;
  function italics(parent, s, inSvg) {
    String(s).split(ITAL).forEach((p, k) => {
      if (!p) return;
      parent.appendChild(k % 2 ? (inSvg ? K.svg('tspan', { class: 'v' }, p) : K.el('span', { class: 'v' }, p)) : document.createTextNode(p));
    });
  }
  function write(node, s) {
    node.textContent = '';
    String(s).split('`').forEach((seg, k) => {
      if (!seg) return;
      if (k % 2) { italics(node.appendChild(K.el('span', { class: 'nw' })), seg, false); return; }
      const re = /\*([^*]+)\*/g;
      let at0 = 0, m;
      while ((m = re.exec(seg))) {
        if (m.index > at0) node.appendChild(document.createTextNode(seg.slice(at0, m.index)));
        node.appendChild(K.el('span', { class: 'term' }, m[1]));
        at0 = m.index + m[0].length;
      }
      if (at0 < seg.length) node.appendChild(document.createTextNode(seg.slice(at0)));
    });
  }

  // ---------- controls ----------
  const stepper = K.stepper({ id: 'step', label: 'Step', steps: STEPS.map((d) => d.name), value: 0, compact: true, into: '#prog' });
  const nav = el('nav');
  const at = () => stepper.get();
  // The amounts x and y, on the slider screens only (their box is hidden elsewhere).
  const xCtl = K.control({ id: 'x', label: 'x, lots of column 1', min: 0, max: 3, step: 1, value: 2, into: '#xybox' });
  const yCtl = K.control({ id: 'y', label: 'y, lots of column 2', min: 0, max: 3, step: 1, value: 1, into: '#xybox' });
  // What to light, on the rows-and-columns screen only.
  const litCtl = K.choice({ id: 'light', label: 'Light up', value: 'r1', into: '#litbox', options: [
    { value: 'r1', label: 'Row 1' }, { value: 'r2', label: 'Row 2' }, { value: 'c1', label: 'Column 1' }, { value: 'c2', label: 'Column 2' }] });
  let xShown = xCtl.get(), yShown = yCtl.get(), litShown = litCtl.get();
  function demoLight() { if (T === Infinity) return 'c1'; let k = 'r1'; LIGHTS.forEach((w) => { if (T >= w.on) k = w.k; }); return k; }
  // While a demonstration plays, its controls follow it.
  function syncCtl(i) {
    const d = STEPS[i], st = S[i];
    if (d.sliders) {
      const a = st.amt || d.amt;
      if (xCtl.get() !== a[0]) xCtl.set(a[0], true);
      if (yCtl.get() !== a[1]) yCtl.set(a[1], true);
      xShown = xCtl.get(); yShown = yCtl.get();
    }
    if (d.light) { const v = st.light || demoLight(); if (litCtl.get() !== v) litCtl.set(v, true); litShown = litCtl.get(); }
  }

  const pickBtns = [0, 1, 2].map((k) => K.button({ label: 'Answer ' + (k + 1), secondary: true, into: '#picks', press: () => {
    const i = at(), d = STEPS[i], st = S[i];

  // Three equations; after Check, the grid they make, its rows and columns counted.

  // Loop equations as a grid times the currents; after Check, each row worked.
  function drawLoop(d, st) {
    const right = st.res === 'right', wrong = st.res === 'wrong' && st.pick != null;
    const G = mgeo(30, 40, 2, 2, 40, 30), A = mgeo(G.x1 + 24, 40, 2, 1, 40, 30), R = mgeo(A.x1 + 26, 40, 2, 1, 40, 30);
    brackets(G); entriesOf(G, d.M.map((r) => r.map(num)), 'en');
    text(G.x1 + 12, 40 + 20, '×', 'op');
    brackets(A); entriesOf(A, d.amt.map((v) => [num(v)]), 'en');
    text(A.x1 + 13, 40 + 20, '=', 'op');
    brackets(R);
    const gone = right || wrong ? 1 - arr(0.1, 0.3) : 1;
    part(gone, 0, () => entriesOf(R, [['?'], ['?']], 'q'));
    text((G.x0 + G.x1) / 2, G.bot + 20, 'ohms', 'sm'); text(A.cx(0), G.bot + 20, 'amps', 'sm'); text(R.cx(0), G.bot + 20, 'volts', 'sm');
    part(gone, 0, () => fitText(170, 142, 'Each row gives one loop\'s voltage.', 'ln mu'));
    const ans = mul(d.M, d.amt);
    let said = 'The grid ' + say(oneLine(d.M)) + ' in ohms times the currents ' + d.amt.map(num).join(' and ') + ' amps equals a column of voltages.';
    if (right) {
      part(arr(0.3), 0, () => { entriesOf(R, ans.map((v) => [num(v)]), 'en ok'); REC.ans = ans; REC.reveal++; });
      d.M.forEach((r, i) => { const s = 'Row ' + (i + 1) + ': ' + work(r, d.amt.map(num)) + ' = ' + num(ans[i]) + ' V'; part(arr(0.4 + 0.2 * i), 0, () => fitText(170, 142 + 26 * i, s, 'ln ok')); said += ' ' + say(s) + '.'; });
    }

      part(arr(0.3), 0, () => { entriesOf(R, parsePt(st.pick).map((v) => [num(v)]), 'en bad'); REC.bad++; });
      d.M.forEach((r, i) => {
        const s = w === 'diag'
          ? 'Row ' + (i + 1) + ': ' + num(r[i]) + ' × ' + num(a[i]) + ' = ' + num(r[i] * a[i]) + ' leaves out ' + num(r[1 - i]) + ' × ' + num(a[1 - i])
          : 'Row ' + (i + 1) + ': ' + r.map((c, k) => num(Math.abs(c)) + ' × ' + num(a[k])).join(' + ') + ' = ' + num(r.reduce((t, c, k) => t + Math.abs(c) * a[k], 0)) + ' drops a minus';

    return said;
  }

  // ---------- the tips: Dan drags a column's arrow to a whole point ----------
  const grips = [0, 1].map((k) => ui.appendChild(K.svg('circle', { class: 'grip', cx: -60, cy: -60, r: 22, tabindex: -1, role: 'button', 'aria-label': 'Tip of the column ' + (k + 1) + ' arrow: drag it, or use the arrow keys, to move it' })));
  function placeGrips(d, st) {
    const on = !!d.drag && !finished;
    grips.forEach((g, k) => {
      g.style.display = on ? '' : 'none';
      g.setAttribute('tabindex', on ? '0' : '-1');
      if (!on) return;
      const c = (st.c || colsOf(d.M))[k];
      g.setAttribute('cx', r3(PL.OX + c[0] * PU)); g.setAttribute('cy', r3(PB - c[1] * PU));
    });
  }
  function setTip(k, w) {
    const i = at(), d = STEPS[i], st = S[i];
    if (!d.drag || finished) return;
    const v = [K.clamp(Math.round(w[0]), 0, 3), K.clamp(Math.round(w[1]), 0, 3)];
    if (!v[0] && !v[1]) return;
    const cols = (st.c || colsOf(d.M)).map((c) => c.slice());
    if (cols[k][0] === v[0] && cols[k][1] === v[1] && T === Infinity) return;
    cols[k] = v; st.c = cols;
    if (anim.playing()) anim.pause();
    T = Infinity;
    K.reveal(); K.refresh();
  }
  function worldAt(e) {
    const ctm = svg.getScreenCTM();
    if (!ctm) return null;
    const q = new DOMPoint(e.clientX, e.clientY).matrixTransform(ctm.inverse());
    return [(q.x - PL.OX) / PU, (PB - q.y) / PU];
  }
  grips.forEach((g, k) => {
    g.addEventListener('pointerdown', (e) => {
      if (!STEPS[at()].drag || finished) return;
      const w = worldAt(e);
      if (!w) return;
      held = { id: e.pointerId, k };
      try { g.setPointerCapture(e.pointerId); } catch (err) { /* the drag still follows while the pointer stays on the grip */ }
      e.preventDefault();
      setTip(k, w);
    });
    g.addEventListener('pointermove', (e) => {
      if (!held || held.id !== e.pointerId || held.k !== k) return;
      const w = worldAt(e);
      if (w) setTip(k, w);
    });
    const letGo = (e) => { if (held && (!e || held.id === e.pointerId)) { held = null; K.refresh(); } };
    g.addEventListener('pointerup', letGo);
    g.addEventListener('pointercancel', letGo);
    g.addEventListener('lostpointercapture', () => letGo(null));
    g.addEventListener('keydown', (e) => {
      const d = STEPS[at()];
      if (!d.drag || finished) return;
      const by = { ArrowUp: [0, 1], ArrowDown: [0, -1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] }[e.key];
      if (!by) return;
      e.preventDefault();
      const c = (S[at()].c || colsOf(d.M))[k];
      setTip(k, [c[0] + by[0], c[1] + by[1]]);
    });
  });

  // ---------- the scene for a step (the animations call this every frame) ----------
  const DRAW = { cells: drawCells, eqs: drawEqs, which: drawWhich, plane: drawPlane, read: drawRead, size: drawSize, loop: drawLoop };
  const HEIGHT = { cells: 248, eqs: 212, which: 214, plane: 366, read: 188, size: 152, loop: 182 };
  function paint(i) {
    if (i == null) i = at();
    const d = STEPS[i], st = S[i];
    art.textContent = '';
    into = null; placed = [];
    REC = { texts: [], eqs: [], grid: null, band: null, segs: [], legs: [], end: null, ans: null, hit: false, lit: null, bad: 0, reveal: 0 };
    svg.setAttribute('viewBox', '0 0 340 ' + HEIGHT[d.pic]);
    svg.setAttribute('aria-label', DRAW[d.pic](d, st, i) || '');
    placeGrips(d, st);
  }

  write(el('finish'), FINISH);
  K.update((p) => {
    const i = Math.round(p.step), d = STEPS[i], st = S[i];
    if (!anim.playing()) T = Infinity;   // motion that was stopped (the page hidden, a test) shows finished
    // Dan's own amounts and lighting, told apart from the settings the demonstrations give them.
    const here = i === lastStep && !finished;
    if (p.x !== xShown || p.y !== yShown) {
      xShown = p.x; yShown = p.y;
      if (here && d.sliders) { st.amt = [Math.round(p.x), Math.round(p.y)]; anim.pause(); T = Infinity; }
    }
    if (p.light !== litShown) {
      litShown = p.light;
      if (here && d.light) { st.light = p.light; anim.pause(); T = Infinity; }
    }
    if (i !== lastStep) {
      lastStep = i; enter('stepbox');
      if (d.show) { Object.assign(st, { amt: null, light: null, c: null }); play(d.dur); } else { anim.pause(); T = Infinity; }
    }
    if (finished !== lastDone) { lastDone = finished; enter(finished ? 'done' : 'stepbox'); }
    const right = st.res === 'right';
    el('stepbox').hidden = finished;
    el('done').hidden = !finished;
    el('count').textContent = 'Step ' + (i + 1) + ' of ' + STEPS.length;
    const task = el('task');
    task.className = 'task' + (d.show ? ' show' : '');
    write(task, d.show ? d.text : d.task);
    paint(i);
    syncCtl(i);
    el('xybox').hidden = !d.sliders;
    el('litbox').hidden = !d.light;

    replayBtn.el.hidden = !d.show || REDUCE;
    el('replay').hidden = replayBtn.el.hidden;
    const opts = d.show ? [] : d.opts || [];
    el('picks').hidden = !opts.length;
    el('picks').classList.toggle('long', opts.some((o) => o.length > 8));
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      b.setLabel(opts[k]);
      b.el.textContent = '';
      italics(b.el.appendChild(K.el('span')), opts[k], false);
      b.el.setAttribute('aria-label', say(opts[k]));
      b.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });

    el('acts').hidden = !!d.show;
    checkBtn.el.hidden = right;
    const fb = el('fb');
    fb.hidden = !!d.show;
    fb.className = 'fb' + (right ? ' right' : st.res === 'wrong' ? ' wrong' : '');
    write(fb, d.show ? '' : right ? 'That\'s it.' : st.res === 'wrong' ? hintFor(i, st) : st.res === 'empty' ? PICK : '');

    const why = el('why');
    why.hidden = d.show || !st.why;
    write(why, d.show ? '' : d.why);
    whyBtn.setLabel(st.why ? 'Hide why' : 'Why?');

    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !right);
    nextBtn.setLabel(i === STEPS.length - 1 ? 'Finish' : 'Continue');
    nav.hidden = backBtn.el.hidden && nextBtn.el.hidden;
  });

  // ---------- known answers, worked out by hand ----------
  const DO = STEPS.map((d, i) => i).filter((i) => !STEPS[i].show);
  const idx = (name) => STEPS.findIndex((d) => d.name === name);
  const solvedSt = (i) => Object.assign(blank(), { pick: STEPS[i].want, res: 'right' });
  const wrongSt = (i, o) => Object.assign(blank(), { pick: o, res: 'wrong' });
  const near = (a, b) => Math.abs(a - b) < 1e-9;
  const samePt = (a, b) => !!a && !!b && a.length === b.length && a.every((v, k) => near(v, b[k]));
  const sameGrid = (A, B) => !!A && !!B && A.length === B.length && A.every((r, i) => samePt(r, B[i]));
  // A step painted in the state given (finished, or t seconds into its motion): what it draws.
  function drawn(i, st, t) {
    const keepS = S[i], keepT = T, keepView = view;
    S[i] = st; T = t == null ? Infinity : t; probing = true;
    try { paint(i); return REC; } finally { S[i] = keepS; T = keepT; probing = false; view = keepView; paint(); }
  }

  K.check('All the entries in the second row relate to the second equation: wherever equations become a grid, each equation fills its own row in order, and a row read back gives its equation again', () => {
    const i3 = idx('Equations as a grid'), g3 = drawn(i3, blank());
    const i4 = idx('Which grid?'), d4 = STEPS[i4], g4 = drawn(i4, solvedSt(i4));
    const i11 = idx('How big?'), d11 = STEPS[i11], g11 = drawn(i11, solvedSt(i11));
    const d10 = STEPS[idx('Aim for (9, 8)')];
    return sameGrid(g3.grid, STEPS[i3].M) && g3.eqs.join('|') === 'x + 3y = 7|2x + y = 4' && g3.texts.indexOf('Row 1: 1 × x + 3 × y = 7') >= 0 &&
      sameGrid(parseGrid(d4.want), d4.M) && g4.eqs.join('|') === '3x + 2y = 13|x − y = 1' && g4.texts.indexOf('Row 2 reads x − y = 1') >= 0 &&
      sameGrid(g11.grid, d11.eqs) && g11.eqs.join('|') === 'x + y = 5|x − y = 1|2x + y = 8' &&
      d10.want === d10.M.map((r, k) => lin(r, XY) + ' = ' + num(d10.target[k])).join(' and ');
  }, { source: HELM });
  K.check('A matrix times a column vector is a linear combination of the columns of the matrix: for every pair of whole amounts from none to three and every tip on the paper, the chain of columns, nose to tail, ends where the rows add up to', () => {
    const tips = [];
    for (let a = 0; a <= 3; a++) for (let b = 0; b <= 3; b++) if (a || b) tips.push([a, b]);
    return tips.every((c1) => tips.every((c2) => [0, 1, 2, 3].every((x) => [0, 1, 2, 3].every((y) =>
      samePt(chainOf([c1, c2], [x, y]).end, mul(gridOf([c1, c2]), [x, y]))))));
  }, { source: LIBRE });
  K.check('[V] = [R] × [I], where [I] is the list of currents to be found: the loops\' resistance grid times the loop currents gives the column of voltages, and those voltages make both loop equations true', () => {
    const i12 = idx('Loop currents'), d = STEPS[i12], V = mul(d.M, d.amt), g = drawn(i12, solvedSt(i12));
    return samePt(V, [12, 4]) && d.want === pt(V) && lin(d.M[0], II) + ' = ' + num(V[0]) === '6I₁ − 2I₂ = 12' &&
      lin(d.M[1], II) + ' = ' + num(V[1]) === '−2I₁ + 6I₂ = 4' && samePt(g.ans, V);
  }, { source: MESH });
  K.check('Every worked number is right: row 2, column 1 of [4 7 1; 2 5 3] is 2; [1 3; 2 1] times (2, 1) is (5, 5), through (2, 4), and its rows as arrows give (4, 7); times (2, 2) it is (8, 6), with (6, 8) from the rows and (4, 3) from each column once; (1, 2) hits (7, 4) and (3, 2) hits (9, 8); [6 −2; −2 6] times (2.5, 1.5) is (12, 4), with (15, 9) and (18, 14) from the slips', () => {
    const M1 = STEPS[0].M, L = STEPS[idx('Loop currents')].M, a = [2.5, 1.5];
    const diag = L.map((r, i) => r[i] * a[i]), abs = L.map((r) => r.reduce((t, c, k) => t + Math.abs(c) * a[k], 0));
    return M1[1][0] === 2 && M1[0][1] === 7 && samePt(mul(MAIN, [2, 1]), [5, 5]) && samePt(combo(colsOf(MAIN), [2, 0]), [2, 4]) && samePt(combo(MAIN, [2, 1]), [4, 7]) &&
      samePt(mul(MAIN, [2, 2]), [8, 6]) && samePt(combo(MAIN, [2, 2]), [6, 8]) && samePt(combo(colsOf(MAIN), [1, 1]), [4, 3]) &&
      samePt(mul(MAIN, [1, 2]), [7, 4]) && samePt(mul(MAIN, [3, 2]), [9, 8]) && samePt(mul(L, a), [12, 4]) && samePt(diag, [15, 9]) && samePt(abs, [18, 14]);
  });
  K.check('Each puzzle\'s answer comes from its grid by the rule (the entry row first, the chain\'s landing point, row 2 and column 2, the rows aimed at the target, rows then columns, the loop voltages), and each slip offered is the one its hint names', () => {
    const g = (nm) => STEPS[idx(nm)];
    const s2 = g('Row 2, column 1'), s6 = g('Two of each'), s8 = g('Both readings'), s10 = g('Aim for (9, 8)'), s11 = g('How big?'), s12 = g('Loop currents');
    const key = (d, kind) => Object.keys(d.wrong).find((o) => d.wrong[o] === kind);
    return s2.want === num(s2.M[s2.ask[0]][s2.ask[1]]) && s2.opts.indexOf(num(s2.M[0][1])) >= 0 &&
      s6.want === pt(mul(s6.M, s6.amt)) && key(s6, 'rows') === pt(combo(s6.M, s6.amt)) && key(s6, 'once') === pt(combo(colsOf(s6.M), [1, 1])) &&
      s8.want === lin(s8.M[1], XY) + ' and ' + pt(colsOf(s8.M)[1]) && s8.opts[0] === lin(colsOf(s8.M)[1], XY) + ' and ' + pt(s8.M[1]) &&
      samePt(mul(s10.M, s10.amt), s10.target) && key(s10, 'cols') === colsOf(s10.M).map((r, k) => lin(r, XY) + ' = ' + num(s10.target[k])).join(' and ') &&
      s11.want === s11.eqs.length + ' by ' + s11.eqs[0].length && s12.want === pt(mul(s12.M, s12.amt));
  });
  K.check('Each puzzle offers three different answers, accepts only the right one, and draws every wrong one in the warning colour', () =>
    DO.every((i) => {
      const d = STEPS[i];
      if (d.opts.length !== 3 || new Set(d.opts).size !== 3 || d.opts.indexOf(d.want) < 0) return false;
      if (!d.opts.every((o) => isRight(i, Object.assign(blank(), { pick: o })) === (o === d.want))) return false;
      if (drawn(i, solvedSt(i)).bad !== 0) return false;
      return d.opts.filter((o) => o !== d.want).every((o) => drawn(i, wrongSt(i, o)).bad > 0 && !!d.hints[o]);
    }));
  K.check('Before Check, no puzzle shows its answer (no lit entry, no filled grid, no chain, no landing point); after a right answer, it does', () =>
    DO.every((i) => drawn(i, blank()).reveal === 0 && drawn(i, solvedSt(i)).reveal > 0));
  K.check('The picture follows the rule: one arrow per lot, each a copy of its column, the last nose on the dot and the answer column at the same point, from none of each to three of each; a lit row reads its across or up parts; a dragged tip rewrites its column; and only one lot of column 1 with two of column 2 hits (7, 4)', () => {
    const i5 = idx('Columns are arrows'), i7 = idx('Rows and columns'), i9 = idx('Hit the target'), C = colsOf(MAIN);
    for (let x = 0; x <= 3; x++) for (let y = 0; y <= 3; y++) {
      const r = drawn(i5, Object.assign(blank(), { amt: [x, y] })), want = mul(MAIN, [x, y]);
      if (r.segs.length !== x + y || !r.segs.every((g) => samePt([g.b[0] - g.a[0], g.b[1] - g.a[1]], C[g.k])) || !samePt(r.end, want) || !samePt(r.ans, want)) return false;
      if (drawn(i9, Object.assign(blank(), { amt: [x, y] })).hit !== (x === 1 && y === 2)) return false;
    }
    const r1 = drawn(i7, Object.assign(blank(), { light: 'r1' })), r2 = drawn(i7, Object.assign(blank(), { light: 'r2' })), c2 = drawn(i7, Object.assign(blank(), { light: 'c2' }));
    const dr = drawn(i7, Object.assign(blank(), { light: 'r1', c: [[0, 3], [2, 2]] }));
    return r1.texts.indexOf('Row 1: x + 3y = 1 + 1 + 3 = 5') >= 0 && r1.legs.length === 3 && r2.texts.indexOf('Row 2: 2x + y = 2 + 2 + 1 = 5') >= 0 &&
      c2.texts.indexOf('Column 2 is the arrow (3, 1)') >= 0 && sameGrid(dr.band, [[0, 2], [3, 2]]) && samePt(dr.end, [2, 8]) && dr.texts.indexOf('Row 1: 2y = 0 + 0 + 2 = 2') >= 0 &&
      drawn(i9, blank()).hit === true;
  });
  K.check('Every demonstration has finished arriving within 4.5 s of its screen opening, none starting before the 0.35 s screen fade ends; every answer\'s motion, right or wrong, within 2.5 s', () => {
    const keepT = T;
    const timed = (i, st, limit) => {
      const keepS = S[i];
      T = Infinity; latest = 0; earliest = Infinity; probing = true;
      S[i] = st;
      try { paint(i); } finally { S[i] = keepS; probing = false; }
      return latest <= limit + 1e-9;
    };
    const ok = STEPS.every((d, i) => {
      if (d.show) { const r = timed(i, blank(), d.dur); return r && d.dur <= 4.5 && d.dur >= 3 && earliest >= FADE; }
      return timed(i, solvedSt(i), d.fb[0]) && d.fb[0] <= 2.5 && d.opts.filter((o) => o !== d.want).every((o) => timed(i, wrongSt(i, o), d.fb[1]) && d.fb[1] <= 2.5);
    });
    T = keepT; paint();
    return ok;
  });

  K.ready();
</script>
