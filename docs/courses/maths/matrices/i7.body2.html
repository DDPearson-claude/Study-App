<p class="caption">A row move never changes the answer, and the finished grid says how many answers there are.</p>

<script>
  // ---------- numbers and words (pure, so the checks can test them) ----------
  const MINUS = '−', NB = ' ';
  function num(v) { let r = Math.round(v * 100) / 100; if (Math.abs(r) < 1e-9) r = 0; return (r < 0 ? MINUS : '') + String(Math.abs(r)); }
  const paren = (v) => (v < 0 ? '(' + num(v) + ')' : num(v));
  const pt = (v) => '(' + v.map(num).join(', ') + ')';
  const toNum = (t) => +String(t).trim().replace(MINUS, '-');
  const rowTxt = (r) => '[' + r.slice(0, 3).map(num).join(' ') + ' | ' + num(r[3]) + ']';
  const parseRow = (s) => { const p = String(s).replace(/[[\]]/g, '').split('|'); return p[0].trim().split(/\s+/).map(toNum).concat([toNum(p[1])]); };
  const say = (s) => String(s == null ? '' : s).replace(/ /g, ' ').replace(/[[\]]/g, '').replace(/\|/g, ', ').replace(/−/g, ' minus ')
    .replace(/×/g, ' times ').replace(/÷/g, ' divided by ').replace(/=/g, ' equals ').replace(/Ω/g, ' ohms')
    .replace(/₁/g, ' 1').replace(/₂/g, ' 2').replace(/₃/g, ' 3').replace(/\s+/g, ' ').trim();
  const HEAD = ['x', 'y', 'z'], IHEAD = ['I₁', 'I₂', 'I₃'];
  const near = (a, b, t) => Math.abs(a - b) < (t || 1e-9);
  // "2x + y − z", leaving out letters whose number is 0.
  function termsTxt(c, nm) {
    const parts = [];
    c.forEach((a, k) => {
      if (Math.abs(a) < 1e-9) return;
      const s = (near(Math.abs(a), 1) ? '' : num(Math.abs(a))) + nm[k];
      parts.push(parts.length ? (a < 0 ? ' − ' : ' + ') + s : (a < 0 ? MINUS : '') + s);
    });
    return parts.join('');
  }
  const eqTxt = (r, nm) => (termsTxt(r.slice(0, 3), nm || HEAD) || '0') + ' = ' + num(r[3]);
  // Every letter written, a missing one with its 0: "x + 0y − 2z = 5".
  const fullEq = (r) => r.slice(0, 3).map((a, k) => { const s = (near(Math.abs(a), 1) ? '' : num(Math.abs(a))) + HEAD[k]; return k === 0 ? (a < 0 ? MINUS : '') + s : (a < 0 ? ' − ' : ' + ') + s; }).join('') + ' = ' + num(r[3]);
  const signed = (v) => (v < 0 ? ' − ' : ' + ') + num(Math.abs(v));
  const moveLabel = (mv) => (mv.m === 1 ? '' : num(mv.m) + ' × ') + 'row ' + (mv.sr + 1);
  // A point put into a row: "2 × 1 + 2 × 1 = 4".
  function subLine(r, p) {
    const parts = [];
    [0, 1, 2].forEach((k) => {
      const a = r[k];
      if (Math.abs(a) < 1e-9) return;
      const s = near(Math.abs(a), 1) ? paren(p[k]) : num(Math.abs(a)) + ' × ' + paren(p[k]);
      parts.push(parts.length ? (a < 0 ? ' − ' : ' + ') + s : (a < 0 ? MINUS : '') + s);
    });
    return parts.join('') + ' = ' + num(r[0] * p[0] + r[1] * p[1] + r[2] * p[2]);
  }

  // ---------- the rule ----------
  // A row [a b c | d] is the equation ax + by + cz = d, a flat plane. A row move adds m times row sr
  // to row tg. A point that fits both rows fits the new one, and taking m times row sr away again
  // brings the old row back, so the answers never change. Clearing column 1, then column 2, leaves a
  // staircase, solved from the bottom row up.
  const add = (p, q) => p.map((x, k) => x + q[k]);
  const sub = (p, q) => p.map((x, k) => x - q[k]);
  const scl = (p, s) => p.map((x) => x * s);
  const dot = (p, q) => p[0] * q[0] + p[1] * q[1] + p[2] * q[2];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const norm = (p) => Math.sqrt(dot(p, p));
  const unit = (p) => scl(p, 1 / (norm(p) || 1));
  const samePt = (a, b, t) => !!a && !!b && a.length === b.length && a.every((x, k) => near(x, b[k], t || 1e-9));
  const sameM = (P, Q) => !!P && !!Q && P.length === Q.length && P.every((r, i) => samePt(r, Q[i]));
  const det3 = (M) => M[0][0] * (M[1][1] * M[2][2] - M[1][2] * M[2][1]) - M[0][1] * (M[1][0] * M[2][2] - M[1][2] * M[2][0]) + M[0][2] * (M[1][0] * M[2][1] - M[1][1] * M[2][0]);
  // The one point that fits all three rows, or null when there is not exactly one.
  function solve3(M) {
    const A = M.map((r) => r.slice(0, 3)), D = det3(A);
    if (Math.abs(D) < 1e-9) return null;
    return [0, 1, 2].map((j) => det3(A.map((r, i) => r.map((x, k) => (k === j ? M[i][3] : x)))) / D);
  }
  const rowMove = (M, mv) => M.map((r, i) => (i === mv.tg ? r.map((x, k) => x + mv.m * M[mv.sr][k]) : r.slice()));
  const scaleRow = (M, i, m) => M.map((r, k) => (k === i ? r.map((x) => x * m) : r.slice()));
  const seqOf = (M, moves) => moves.reduce((out, mv) => out.concat([rowMove(out[out.length - 1], mv)]), [M]);
  const fits = (r, p) => near(r[0] * p[0] + r[1] * p[1] + r[2] * p[2], r[3], 1e-7);
  const lerpRow = (a, b, e) => (e >= 1 ? b.slice() : e <= 0 ? a.slice() : a.map((x, k) => x + (b[k] - x) * e));
  // A staircase solved from the bottom row up.
  function backSolve(M) { const s = [0, 0, 0]; for (let i = 2; i >= 0; i--) { let r = M[i][3]; for (let k = i + 1; k < 3; k++) r -= M[i][k] * s[k]; s[i] = r / M[i][i]; } return s; }
  function backLines(M, nm, unitTxt) {
    const s = backSolve(M), out = [];
    for (let i = 2; i >= 0; i--) {
      let lhs = termsTxt([0, 1, 2].map((k) => (k === i ? M[i][k] : 0)), nm);
      for (let k = i + 1; k < 3; k++) if (Math.abs(M[i][k]) > 1e-9) lhs += signed(M[i][k] * s[k]);
      out.push(lhs + ' = ' + num(M[i][3]) + ', so ' + nm[i] + ' = ' + num(s[i]) + (unitTxt || ''));
    }
    return out;
  }
  // A stepped grid whose bottom row is all zeros: y and x for any z (row 2 gives y, row 1 gives x).
  function onLine(M, z) { const y = (M[1][3] - M[1][2] * z) / M[1][1]; return [(M[0][3] - M[0][1] * y - M[0][2] * z) / M[0][0], y, z]; }
  // Where two planes cross: the point on that line nearest C, and its direction; null if they never cross.
  function meet2(r1, r2, C) {
    const n1 = r1.slice(0, 3), n2 = r2.slice(0, 3), dd = cross(n1, n2);
    if (norm(dd) < 1e-9 * Math.max(1, norm(n1) * norm(n2))) return null;
    const p = solve3([n1.concat([r1[3]]), n2.concat([r2[3]]), dd.concat([dot(dd, C)])]);
    return p ? { p, d: unit(dd) } : null;
  }

  // ---------- the lesson's values ----------
  const A1 = [[1, 1, 1, 6], [2, 1, -1, 1], [1, -1, 2, 5]];
  const MV1 = { tg: 1, sr: 0, m: -2 }, MV2 = { tg: 2, sr: 0, m: -1 }, MV3 = { tg: 2, sr: 1, m: -2 };
  const A2 = rowMove(A1, MV1), A3 = rowMove(A2, MV2), A4 = rowMove(A3, MV3);
  const SOL1 = solve3(A1);
  const ROW2 = [1, 0, -2, 5];
  const S6 = [[2, 1, -1, 3], [0, 3, 1, 5], [0, 0, 2, 4]], SOL6 = backSolve(S6);
  const N1 = [[1, 1, 1, 3], [1, -1, 1, 1], [2, 0, 2, 9]], N2 = [[1, 1, 1, 3], [1, -1, 1, 1], [2, 0, 2, 4]];
  const NMOVES = [{ tg: 1, sr: 0, m: -1 }, { tg: 2, sr: 0, m: -2 }, { tg: 2, sr: 1, m: -1 }];
  const N1S = seqOf(N1, NMOVES)[3], N2S = seqOf(N2, NMOVES)[3];
  const M10 = [[1, 2, -1, 4], [2, 1, 1, 5], [3, 3, 0, 9]];
  const M10MOVES = [{ tg: 1, sr: 0, m: -2 }, { tg: 2, sr: 0, m: -3 }, { tg: 2, sr: 1, m: -1 }];
  const M10S = seqOf(M10, M10MOVES)[3];
  const Q1 = [[1, 1, 1, 3], [1, 2, 3, 6], [2, 3, 4, 10]];
  const QMOVES = [{ tg: 1, sr: 0, m: -1 }, { tg: 2, sr: 0, m: -2 }, { tg: 2, sr: 1, m: -1 }];
  const QS = seqOf(Q1, QMOVES)[3];
  // The three-loop circuit (example figures): each loop's own resistance, the one each pair of
  // neighbours shares, and the supply in each loop. Going round a loop gives one row.
  const OWN = [3, 6, 3], SH = 3, VS = [12, 0, 6];
  const RG = [[OWN[0] + SH, -SH, 0, VS[0]], [-SH, OWN[1] + 2 * SH, -SH, VS[1]], [0, -SH, OWN[2] + SH, VS[2]]];
  const RGD = scaleRow(RG, 1, 2), C1 = rowMove(RGD, { tg: 1, sr: 0, m: 1 });
  const C1X7 = scaleRow(C1, 2, 7), C2 = rowMove(C1X7, { tg: 2, sr: 1, m: 1 });
  const C1W2 = rowMove(C1, { tg: 2, sr: 1, m: 1 }), C1W1 = rowMove(scaleRow(C1, 2, 2), { tg: 2, sr: 0, m: 1 });
  const AMPS = backSolve(C2), I23 = AMPS[1] - AMPS[2];
  const MULTS = [-3, -2, -1, 1, 2, 3];
  const FIRST = 'The planes of the first three equations';
  const TAG9 = 'Plane 3 is still ' + eqTxt(N1[2]), TAG4 = 'Plane 3 is now ' + eqTxt(N2[2]);

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // dur: a SHOW step's demonstration. act: what he can do with the picture. work: a working line under
  // the grid; rows: worked lines; view: the 3-D view (first: its planes are the first equations');
  // legend: a key under the view. A puzzle: task, opts, want, hints (one per wrong answer), slips
  // (the red line drawn for each), why, fb (seconds of motion after a right and a wrong answer).
  const PICK = 'Tap one of the answers.';
  const TURN = 'Drag the picture sideways to turn it.';
  const STEPS = [
    { show: true, key: 'grid', name: 'Planes and rows', dur: 3.0, view: true, act: TURN,
      text: 'Each equation in x, y and z is a flat plane. Each one also makes one row of the grid. The last column holds the constant. The answer is the point where all three planes meet, here `(1, 2, 3)`.' },
    { kind: 'pick', key: 'row', name: 'Write the row', work: true, rows: 1, fb: [1.3, 0.7],
      task: 'Which row is `x − 2z = 5`?',
      opts: ['[1 0 −2 | 5]', '[1 −2 0 | 5]', '[1 −2 | 5]'], want: '[1 0 −2 | 5]',
      hints: { '[1 −2 0 | 5]': 'Not quite. Column 2 is for y. The −2 belongs to z, in column 3.', '[1 −2 | 5]': 'Not quite. Every row needs a place for x, y and z. A missing letter gets a 0.' },
      slips: { '[1 −2 0 | 5]': 'That puts −2 under y, so it says x − 2y = 5', '[1 −2 | 5]': 'Two numbers cannot fill three columns' },
      why: 'Write the number in front of x, then y, then z, then the constant. There is no y, so it gets a 0. That gives `[1 0 −2 | 5]`.' },
    { show: true, key: 'move', name: 'A row move', dur: 3.2, work: true, view: true, legend: true,
      act: 'Pick two rows and a multiplier, then press Add. ' + TURN,
      still: () => { S[2] = blank(); T = Infinity; K.refresh(); },
      text: 'A *row move* adds a multiple of one row to another. Here −2 × row 1 goes into row 2. Row 2 becomes 0, −1, −3 and −11. Plane 2 swings about the line it shares with plane 1. So it still passes through the dot at `(1, 2, 3)`.',
      read: 'A row move adds a multiple of one row to another. Here −2 × row 1 goes into row 2. Row 2 becomes 0, −1, −3 and −11. Plane 2 swings about the line it shares with plane 1. So it still passes through the dot at `(1, 2, 3)`.' },
    { kind: 'pick', key: 'clear1', name: 'Clear column 1', work: true, rows: 1, view: true, legend: true, fb: [1.9, 1.6],
      task: 'Add −1 × row 1 to row 3. What does row 3 become?',
      opts: ['[0 −2 1 | −1]', '[0 −2 1 | 5]', '[2 0 3 | 11]'], want: '[0 −2 1 | −1]',
      hints: { '[0 −2 1 | 5]': 'Not quite. The constant column changes too.', '[2 0 3 | 11]': 'Not quite. That adds row 1. −1 lots of row 1 takes it away.' },
      slips: { '[0 −2 1 | 5]': 'The constant stayed 5, so plane 3 misses the dot', '[2 0 3 | 11]': 'Adding row 1 leaves 2 in column 1' },
      why: '−1 × row 1 is −1, −1, −1 and −6. Add it to row 3, entry by entry. 1 − 1 = 0, −1 − 1 = −2, 2 − 1 = 1 and 5 − 6 = −1.' },
    { show: true, key: 'stair', name: 'The staircase', dur: 4.5, work: true, rows: 3, view: true, legend: true, act: TURN,
      text: 'Add −2 × row 2 to row 3, and the grid becomes a *staircase*. It has zeros under its diagonal. Read it from the bottom up: 7z = 21, so z = 3. Then −y − 9 = −11 gives y = 2. Last, x + 2 + 3 = 6 gives x = 1.',
