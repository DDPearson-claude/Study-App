<p class="caption">The determinant ad − bc multiplies every area. A minus sign marks a flip, and 0 a squash.</p>

<script>
  // ---------- numbers and words (pure, so the checks can test them) ----------
  const MINUS = '−', NB = ' ';
  function num(v) { let r = Math.round(v * 100) / 100; if (Math.abs(r) < 1e-9) r = 0; return (r < 0 ? MINUS : '') + String(Math.abs(r)); }
  function num1(v) { let r = Math.round(v * 10) / 10; if (Math.abs(r) < 1e-9) r = 0; return (r < 0 ? MINUS : '') + String(Math.abs(r)); }
  const paren = (v) => (v < 0 ? '(' + num(v) + ')' : num(v));
  const pt = (v) => '(' + num(v[0]) + ', ' + num(v[1]) + ')';
  const oneLine = (M) => '[' + M.map((r) => r.map(num).join(' ')).join('; ') + ']';
  const parseGrid = (s) => String(s).replace(/[[\]]/g, '').split(';').map((r) => r.trim().split(/\s+/).map((t) => +t.replace(MINUS, '-')));
  const say = (s) => String(s == null ? '' : s).replace(/ /g, ' ').replace(/−/g, ' minus ').replace(/×/g, ' times ').replace(/÷/g, ' divided by ')
    .replace(/=/g, ' equals ').replace(/\s+/g, ' ').trim();

  // ---------- the rule ----------
  // A move sends i to column 1 and j to column 2, so the unit square lands on the parallelogram of
  // the two columns, and every area is multiplied by that parallelogram's signed area, ad − bc.
  const ID = [[1, 0], [0, 1]];
  const det = (M) => M[0][0] * M[1][1] - M[0][1] * M[1][0];
  const workingL = (M) => paren(M[0][0]) + ' × ' + paren(M[1][1]) + ' − ' + paren(M[0][1]) + ' × ' + paren(M[1][0]);
  const working = (M) => workingL(M) + ' = ' + num(det(M));
  const mul = (M, v) => M.map((r) => r.reduce((s, a, k) => s + a * v[k], 0));
  const colsOf = (M) => [[M[0][0], M[1][0]], [M[0][1], M[1][1]]];
  const gridOf = (c) => [[c[0][0], c[1][0]], [c[0][1], c[1][1]]];
  // x lots of column 1 plus y lots of column 2: where (x, y) lands.
  const mix = (c, v) => [v[0] * c[0][0] + v[1] * c[1][0], v[0] * c[0][1] + v[1] * c[1][1]];
  // Signed area of a polygon (corners in order): below zero when it reads clockwise, that is, flipped.
  const area = (ps) => ps.reduce((s, p, k) => { const q = ps[(k + 1) % ps.length]; return s + p[0] * q[1] - q[0] * p[1]; }, 0) / 2;
  // The unit square's landing place: the parallelogram of the two columns.
  const parOf = (c) => [[0, 0], c[0], [c[0][0] + c[1][0], c[0][1] + c[1][1]], c[1]];
  const near = (a, b, t) => Math.abs(a - b) < (t || 1e-9);
  const samePt = (a, b) => !!a && !!b && a.length === b.length && a.every((v, k) => near(v, b[k]));
  const sameM = (A, B) => !!A && !!B && A.length === B.length && A.every((r, i) => r.length === B[i].length && r.every((v, j) => near(v, B[i][j])));
  const lerpM = (A, B, e) => A.map((r, i) => r.map((v, j) => K.lerp(v, B[i][j], e)));
  const STRETCH = [[3, 0], [0, 2]], SHEAR = [[1, 1], [0, 1]], LEAN = [[2, 1], [0, 3]], BOXM = [[3, 1], [1, 2]];
  const MOVE = [[2, -1], [1, 1]], DOUBLE = [[2, 0], [0, 2]], FLIPM = [[1, 2], [2, 1]], FLAT = [[2, 4], [1, 2]];
  const NEAR = [[2, 4], [1, 3]], UPSIDE = [[1, 0], [0, -1]], TURN = [[0, -1], [1, 0]], MIRROR = [[-1, 0], [0, 1]];
  // Screen 9: i stays on (2, 0) and j's tip sits on (1, y).
  const jMat = (y) => [[2, 1], [0, y]];
  // The path a move takes on screen, e of the way through it: a turn turns; the others slide straight.
  function pathOf(M, e) {
    if (e <= 0) return ID;
    if (e >= 1) return M;
    if (sameM(M, TURN)) { const a = e * Math.PI / 2; return [[Math.cos(a), -Math.sin(a)], [Math.sin(a), Math.cos(a)]]; }
    return lerpM(ID, M, e);
  }
  // The F-shaped flag, corner by corner (squares); a flip shows at once, as it reads backwards.
  const FLAG = [[0.25, 0.25], [0.5, 0.25], [0.5, 0.75], [0.85, 0.75], [0.85, 1], [0.5, 1], [0.5, 1.25], [1, 1.25], [1, 1.5], [0.25, 1.5]];
  // A shape of 2 squares, and its two squares; screen 8's shape of 6 squares.
  const DOM = [[1, 0], [2, 0], [2, 2], [1, 2]];
  const HALVES = [[[1, 0], [2, 0], [2, 1], [1, 1]], [[1, 1], [2, 1], [2, 2], [1, 2]]];
  const RECT6 = [[0, 0], [3, 0], [3, 2], [0, 2]];
  const centre = (ps) => [ps.reduce((s, p) => s + p[0], 0) / ps.length, ps.reduce((s, p) => s + p[1], 0) / ps.length];
  // Cut and slide: i on (p, 0) and j on (q, h). Cut straight up from (q, 0); the triangle on the
  // left slides along by the base p, e of the way, and with the rest makes a p by h box.
  function cutOf(c, e) {
    const p = c[0][0], q = c[1][0], h = c[1][1];
    return { p, q, h, base: p, e,
      tri: [[0, 0], [q, 0], [q, h]].map((v) => [v[0] + e * p, v[1]]),
      rest: [[q, 0], [p, 0], [p + q, h], [q, h]],
      rect: [[q, 0], [q + p, 0], [q + p, h], [q, h]] };
  }
  // Boxing the parallelogram of [a b; c d]: a + b across, c + d up, and the corners to take away.
  function boxOf(M) {
    const a = M[0][0], b = M[0][1], c = M[1][0], d = M[1][1];
    return { box: [[0, 0], [a + b, 0], [a + b, c + d], [0, c + d]], w: a + b, h: c + d,
      pairs: [
        { each: a * c / 2, pieces: [[[0, 0], [a, 0], [a, c]], [[b, d], [a + b, c + d], [b, c + d]]] },
        { each: b * d / 2, pieces: [[[0, 0], [b, d], [0, d]], [[a, c], [a + b, c], [a + b, c + d]]] },
        { each: b * c, pieces: [[[a, 0], [a + b, 0], [a + b, c], [a, c]], [[0, d], [b, d], [b, c + d], [0, c + d]]] },
      ] };
  }
  const pairSum = (pr) => pr.pieces.reduce((s, pc) => s + Math.abs(area(pc)), 0);
  function meaning(D) {
    if (Math.abs(D) < 1e-9) return 'flat, every area is 0';
    return (D < 0 ? 'flipped, ' : '') + 'every area × ' + num(Math.abs(D));
  }
  // Screen 8's numbers: the area after the move and the move's determinant.
  const BACK_AFTER = area(RECT6.map((p) => mix(colsOf(DOUBLE), p))), BACK_DET = det(DOUBLE);

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // win: the patch of plane shown [x0, x1, y0, y1]. dur: a SHOW step's demonstration; read and still:
  // its words and state for the read-through. A puzzle: task, opts, want, hints (one per wrong
  // answer), why, slips (the line drawn for each wrong answer), fb (seconds of motion after a right
  // and a wrong answer).
  const W1 = [-0.6, 4.6, -0.6, 3.6], W2 = [-0.6, 6.6, -0.6, 4.6], W3 = [-0.6, 2.6, -0.6, 1.6], W4 = [-0.6, 3.6, -0.6, 3.6];
  const W6 = [-1.6, 2.6, -0.6, 2.9], W7 = [-1.6, 4.6, -0.6, 4.6], W9 = [-0.6, 3.6, -1.6, 1.6], W10 = [-0.6, 4.6, -0.6, 3.9];
  const W11 = [-1.1, 6.6, -1.6, 4.6], W12 = [-2.1, 2.1, -1.1, 2.1], WOWN = [-1.6, 6.6, -1.6, 4.6];
  const PICK = 'Tap one of the answers.';
  const SLANT = Math.hypot(colsOf(LEAN)[1][0], colsOf(LEAN)[1][1]);
  const MEAN = ['It shrinks every area to −3', 'It triples every area and does not flip it', 'It triples every area and flips the plane'];
  const STEPS = [
    { show: true, key: 'stretch', name: 'A stretch', win: W1, flag: true, dur: 3.4,
      text: 'The stretch `[3 0; 0 2]` sends i to `(3, 0)` and j to `(0, 2)`. So the shaded square becomes a 3 by 2 box, and its area grows from 1 to 6. Every square of the grid becomes the same box, so every area grows 6 times.' },
    { kind: 'pick', key: 'two', name: 'Two squares', win: W2, fb: [1.9, 0.8],
      task: 'A shape covers 2 squares. What is its area after `[3 0; 0 2]`?', opts: ['6', '12', '8'], want: '12',
      hints: { '6': 'Not quite. Each square becomes 6, so two squares make two lots of 6.', '8': 'Not quite. The areas multiply. They do not add.' },
      slips: { '6': 'One square becomes ' + num(det(STRETCH)) + ', and the shape has ' + num(area(DOM)), '8': num(area(DOM) + det(STRETCH)) + ' is ' + num(area(DOM)) + ' + ' + num(det(STRETCH)) + ', but areas multiply' },
      why: 'The stretch turns every square into a 3 by 2 box of area 6. The shape has 2 squares, so it covers `2 × 6 = 12`.' },
    { show: true, key: 'shear', name: 'A shear', win: W3, dur: 4.1, replay: 'Cut and slide',
      text: 'The shear `[1 1; 0 1]` leans the square over into a parallelogram. Cut the triangle off one end and slide it to the other, and it makes a 1 by 1 square again. So its area is base times height, with the height at right angles to the base.' },
    { kind: 'pick', key: 'lean', name: 'Base times height', win: W4, fb: [2.0, 0.8],
      task: 'Arrow i lands 2 squares across. Arrow j lands 1 across and 3 up. What is the parallelogram\'s area?', opts: ['about 6.3', '3', '6'], want: '6',
      hints: { 'about 6.3': 'Not quite. The height runs at right angles to the base, not along the slanted side.', '3': 'Not quite. 3 is the triangle cut along the diagonal, half the parallelogram.' },
      slips: { 'about 6.3': num1(2 * SLANT) + ' is 2 × ' + num(SLANT) + ', along the slanted side', '3': num(det(LEAN) / 2) + ' is this triangle, half of it' },
      why: 'The base is i, 2 squares long. The height runs straight up from the base to the top edge, 3 squares. So the area is `2 × 3 = 6`.' },
    { show: true, key: 'box', name: 'Box it in', win: W1, dur: 4.5,
      text: 'Box the parallelogram of `[3 1; 1 2]` in a 4 by 3 rectangle, of area 12. The corners take away 3, 2 and 2, which leaves 5. For any `[a b; c d]` the box is `(a + b)(c + d)`, which is `ac + ad + bc + bd`. The corners take away ac, bd and 2bc, which leaves ad − bc. That number is the *determinant*, written det A or |A| for a matrix A.' },
    { kind: 'pick', key: 'work', name: 'Work it out', win: W6, flag: true, fb: [2.0, 0.8],
      task: 'What is the determinant of `[2 −1; 1 1]`?', opts: ['3', '1', '−3'], want: '3',
      hints: { '1': 'Not quite. b is −1, so bc is −1. Taking away −1 adds 1.', '−3': 'Not quite. Start with a × d, then take away b × c.' },
      slips: {
        '1': num(MOVE[0][0]) + ' × ' + num(MOVE[1][1]) + ' − ' + num(-MOVE[0][1]) + ' × ' + num(MOVE[1][0]) + ' = ' + num(MOVE[0][0] * MOVE[1][1] + MOVE[0][1] * MOVE[1][0]) + ' drops the minus on b',
        '−3': paren(MOVE[0][1]) + ' × ' + paren(MOVE[1][0]) + ' − ' + paren(MOVE[0][0]) + ' × ' + paren(MOVE[1][1]) + ' = ' + num(-det(MOVE)) + ' is bc − ad' },
      why: 'a × d is `2 × 1 = 2`. b × c is `−1 × 1 = −1`. So the determinant is `2 − (−1) = 3`.' },
    { show: true, key: 'inside', name: 'A shape inside', win: W7, dur: 3.9,
      text: 'Under `[2 −1; 1 1]` a shape of 2 squares rides with the grid. Each square lands on a copy of the parallelogram, so the shape now covers 6. And `6 ÷ 2 = 3`, the determinant of this matrix.' },
    { kind: 'pick', key: 'back', name: 'Going back', win: W2, fb: [2.0, 0.8],
      task: 'After a move with determinant 4, a shape\'s area is 24. What was its area before?', opts: ['96', '6', '20'], want: '6',
      hints: { '96': 'Not quite. 24 is the area after the move, so divide by 4 to go back.', '20': 'Not quite. The area was multiplied by 4, not added to.' },
      slips: { '96': num(BACK_AFTER * BACK_DET) + ' is ' + num(BACK_AFTER) + ' × ' + num(BACK_DET) + ', but ' + num(BACK_AFTER) + ' is after the move', '20': num(BACK_AFTER - BACK_DET) + ' is ' + num(BACK_AFTER) + ' − ' + num(BACK_DET) + ', but areas multiply' },
      why: 'The move multiplies every area by 4. So to go back, divide: `24 ÷ 4 = 6`.' },
    { show: true, key: 'flip', name: 'Flat, then flipped', win: W9, flag: true, jy: true, dur: 4.2, still: { jy: -1 },
      text: 'Arrow i stays on `(2, 0)` while j\'s tip slides down from `(1, 1)`. When j lies on i\'s line, the parallelogram is flat and the determinant is 0. Past that line it opens again. It is hatched, the flag is mirrored and the determinant is −2. Drag j\'s tip to try it.',
      read: 'Arrow i stays on `(2, 0)` while j\'s tip slides down from `(1, 1)`. When j lies on i\'s line, the parallelogram is flat and the determinant is 0. Past that line it opens again. It is hatched, the flag is mirrored and the determinant is −2.' },
    { kind: 'pick', key: 'mean', name: 'What −3 means', win: W10, flag: true, fb: [2.0, 0.8],

    v.labels.forEach((lb) => ctx.labels.push({ p: g.P(lb.w), s: lb.s, cls: lb.cls, a: lb.a }));
    placeAll(ctx);
    REC.M = M;
    said.unshift((v.mat ? 'The move ' + (v.mat.q >= 0.5 ? 'has its numbers hidden' : 'is ' + say(oneLine(v.mat.M))) + '. ' : '') +
      'On squared paper, arrow i is on ' + say(pt(cols[0])) + ' and arrow j on ' + say(pt(cols[1])) + '. ' +
      (REC.reads.length ? say(REC.reads.join(', ')) + '.' : ''));
    return said.join(' ');
  }

  // ---------- screen 9: Dan drags j's tip up and down ----------
  const grip = ui.appendChild(K.svg('circle', { class: 'grip', cx: -60, cy: -60, r: 22, tabindex: -1, role: 'button', 'aria-label': 'Tip of arrow j: drag it up or down, or use the arrow keys, to move where j lands' }));
  function placeGrip(d) {
    const mine = !!d.own && !finished && !!GEO && !!REC && !!REC.cols;
    ownGrips.forEach((gp, k) => {
      gp.style.display = mine ? '' : 'none';
      gp.setAttribute('tabindex', mine ? '0' : '-1');
      if (mine) { const p = GEO.P(REC.cols[k]); gp.setAttribute('cx', r3(p[0])); gp.setAttribute('cy', r3(p[1])); }
    });
    const on = !!d.jy && !finished && !!GEO && !!REC && !!REC.cols;
    grip.style.display = on ? '' : 'none';
    grip.setAttribute('tabindex', on ? '0' : '-1');
    if (!on) return;
    const p = GEO.P(REC.cols[1]);
    grip.setAttribute('cx', r3(p[0])); grip.setAttribute('cy', r3(p[1]));
  }
  function setY(y) {
    const i = at(), d = STEPS[i], st = S[i];
    if (!d.jy || finished) return;
    const val = K.clamp(Math.round(y * 20) / 20, -1, 1);
    if (st.y === val && !anim.playing()) return;
    if (anim.playing()) anim.pause();
    T = Infinity;
    st.y = val;
    K.reveal();
    jyCtl.set(val, true); jyShown = jyCtl.get();
    K.refresh();
  }
  function worldAt(e) {
    const ctm = svg.getScreenCTM();
    if (!ctm || !GEO) return null;
    const q = new DOMPoint(e.clientX, e.clientY).matrixTransform(ctm.inverse());
    return [GEO.win[0] + (q.x - GEO.left) / GEO.U, GEO.win[3] - (q.y - GEO.top) / GEO.U];
  }
  let held = null;
  grip.addEventListener('pointerdown', (e) => {
    if (!STEPS[at()].jy || finished) return;
    const w = worldAt(e);
    if (!w) return;
    held = e.pointerId;
    try { grip.setPointerCapture(e.pointerId); } catch (err) { /* the drag still follows while the pointer stays on the grip */ }
    e.preventDefault();
    setY(w[1]);
  });
  grip.addEventListener('pointermove', (e) => {
    if (held !== e.pointerId) return;
    const w = worldAt(e);
    if (w) setY(w[1]);
  });
  const letGo = (e) => { if (held != null && (!e || held === e.pointerId)) held = null; };
  grip.addEventListener('pointerup', letGo);
  grip.addEventListener('pointercancel', letGo);
  grip.addEventListener('lostpointercapture', () => letGo(null));
  grip.addEventListener('keydown', (e) => {
    if (!STEPS[at()].jy || finished) return;
    const by = { ArrowUp: 0.05, ArrowDown: -0.05 }[e.key];
    if (!by) return;
    e.preventDefault();
    setY(jyCtl.get() + by);
  });

  // ---------- screen 11: Dan drags either tip onto a grid point ----------
  const ownGrips = [0, 1].map((k) => {
    const nm = k ? 'j' : 'i';
    const gp = ui.appendChild(K.svg('circle', { class: 'grip', cx: -60, cy: -60, r: 18, tabindex: -1, role: 'button', 'aria-label': 'Tip of arrow ' + nm + ': drag it, or use the arrow keys, to move where ' + nm + ' lands' }));
    let hold = null;
    const setTip = (w) => {
      const i = at(), d = STEPS[i], st = S[i];
      if (!d.own || finished || !w) return;
      const p = [K.clamp(Math.round(w[0]), Math.ceil(d.win[0]), Math.floor(d.win[1])), K.clamp(Math.round(w[1]), Math.ceil(d.win[2]), Math.floor(d.win[3]))];
      if (p[0] === 0 && p[1] === 0) return;
      const c = (st.c || colsOf(MOVE)).map((q) => q.slice());
      if (st.c && samePt(c[k], p) && !anim.playing()) return;
      if (anim.playing()) anim.pause();
      T = Infinity;
      c[k] = p; st.c = c;
      K.reveal();
      K.refresh();
    };
    gp.addEventListener('pointerdown', (e) => {
      if (!STEPS[at()].own || finished) return;
      hold = e.pointerId;
      try { gp.setPointerCapture(e.pointerId); } catch (err) { /* the drag still follows while the pointer stays on the grip */ }
      e.preventDefault();
      setTip(worldAt(e));
    });
    gp.addEventListener('pointermove', (e) => { if (hold === e.pointerId) setTip(worldAt(e)); });
    const off = () => { hold = null; };
    gp.addEventListener('pointerup', off);
    gp.addEventListener('pointercancel', off);
    gp.addEventListener('lostpointercapture', off);
    gp.addEventListener('keydown', (e) => {
      const by = { ArrowUp: [0, 1], ArrowDown: [0, -1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] }[e.key];
      if (!by || !STEPS[at()].own || finished) return;
      e.preventDefault();
      const q = (S[at()].c || colsOf(MOVE))[k];
      setTip([q[0] + by[0], q[1] + by[1]]);
    });
    return gp;
  });

  // ---------- the scene for a step (the animations call this every frame) ----------
  const heightOf = (d) => Math.ceil(PTOP + mainGeo(d.win).H + 26);
  function paint(i) {
    if (i == null) i = at();
    const d = STEPS[i], st = S[i];
    art.textContent = '';
    into = null; placed = []; clipN = 0;
    REC = { texts: [], reads: [], cols: null, par: null, parArea: null, flag: null, flagArea: null, shape: null, shapeArea: null, hatched: false,
      cut: null, box: null, mat: null, det: null, detM: null, detText: null, M: null, bad: 0, reveal: 0 };
    svg.setAttribute('viewBox', '0 0 340 ' + heightOf(d));
    svg.setAttribute('aria-label', drawPlane(d, st) || '');
    placeGrip(d);
  }

  write(el('finish'), FINISH);
  K.update((p) => {
    const i = Math.round(p.step), d = STEPS[i], st = S[i];
    if (!anim.playing()) T = Infinity;   // motion that was stopped (the page hidden, a test) shows finished
    // Dan's own setting of j's tip, told apart from the setting the demonstration gives the slider.
    const here = i === lastStep && !finished;
    if (p.jy !== jyShown) {
      jyShown = p.jy;
      if (here && d.jy) { st.y = p.jy; anim.pause(); T = Infinity; K.reveal(); }
    }
    if (i !== lastStep) {
      lastStep = i; enter('stepbox');
      if (d.show) { st.y = null; st.c = null; play(d.dur); } else { anim.pause(); T = Infinity; }
    }
    if (finished !== lastDone) { lastDone = finished; enter(finished ? 'done' : 'stepbox'); }
    const right = st.res === 'right';
    el('stepbox').hidden = finished;
    el('done').hidden = !finished;
    el('count').textContent = 'Step ' + (i + 1) + ' of ' + STEPS.length;
    const task = el('task');
    task.className = 'task' + (d.show ? ' show' : '');
    write(task, d.show ? d.text : d.task);
    paint(i);
    syncCtl(i);
    el('jbox').hidden = !d.jy;

    replayBtn.el.hidden = !d.show || REDUCE;
    replayBtn.setLabel(d.replay || 'Play again');
    el('replay').hidden = replayBtn.el.hidden;
    const opts = d.show ? [] : d.opts || [];
    el('picks').hidden = !opts.length;
    el('picks').classList.toggle('long', opts.some((o) => o.length > 8));
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      b.setLabel(opts[k]);
      b.el.textContent = '';
      italics(b.el.appendChild(K.el('span')), opts[k], false);
      b.el.setAttribute('aria-label', say(opts[k]));
      b.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });

    el('acts').hidden = !!d.show;
    checkBtn.el.hidden = right;
    const fb = el('fb');
    fb.hidden = !!d.show;
    fb.className = 'fb' + (right ? ' right' : st.res === 'wrong' ? ' wrong' : '');
    write(fb, d.show ? '' : right ? 'That\'s it.' : st.res === 'wrong' ? hintFor(i, st) : st.res === 'empty' ? PICK : '');

    const why = el('why');
    why.hidden = d.show || !st.why;
    write(why, d.show ? '' : d.why);
    whyBtn.setLabel(st.why ? 'Hide why' : 'Why?');

    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !right);
    nextBtn.setLabel(i === STEPS.length - 1 ? 'Finish' : 'Continue');
    nav.hidden = backBtn.el.hidden && nextBtn.el.hidden;
  });

  // ---------- known answers, worked out by hand ----------
  const DO = STEPS.map((d, i) => i).filter((i) => !STEPS[i].show);
  const idx = (k) => STEPS.findIndex((d) => d.key === k);
  const solvedSt = (i) => Object.assign(blank(), { pick: STEPS[i].want, res: 'right' });
  const wrongSt = (i, o) => Object.assign(blank(), { pick: o, res: 'wrong' });
  // A step painted in the state given (finished, or t seconds into its motion): what it draws.
  function drawn(i, st, t) {
    const keepS = S[i], keepT = T;
    S[i] = st; T = t == null ? Infinity : t;
    try { paint(i); return REC; } finally { S[i] = keepS; T = keepT; paint(); }
  }
  const finishedSt = (i) => (STEPS[i].show ? blank() : solvedSt(i));
  const FA = area(FLAG);
  const MATS = [STRETCH, SHEAR, LEAN, BOXM, MOVE, DOUBLE, FLIPM, FLAT, NEAR, UPSIDE, TURN, MIRROR, jMat(1), jMat(0), jMat(-1)];
  const YS = [];
  for (let k = -20; k <= 20; k++) YS.push(k / 20);
  const atY = (y) => drawn(idx('flip'), Object.assign(blank(), { y }));

  K.check('If you know how much the area of the one unit square changes, it tells you how the area of any region changes: under every move in the lesson the shaded square, the shape of two squares, the shape of six and the flag all grow by one same factor, and the shapes drawn match', () => {
    const rule = MATS.every((Mx) => {
      const c = colsOf(Mx), s = area(parOf(c));
      return near(s, det(Mx)) && near(area(DOM.map((p) => mix(c, p))), area(DOM) * s) && near(area(RECT6.map((p) => mix(c, p))), area(RECT6) * s) &&
        near(area(FLAG.map((p) => mix(c, p))), FA * s);
    });
    const shown = ['stretch', 'two', 'inside', 'work', 'flip'].every((k) => {
      const i = idx(k), r = drawn(i, finishedSt(i)), s = det(gridOf(r.cols));
      return near(r.parArea, s) && (!r.shape || near(r.shapeArea, area(DOM) * s)) && (!r.flag || near(r.flagArea, FA * s));
    });
    return rule && shown;
  }, { source: TBB });
  K.check('This number ad − bc is the determinant of A: on every screen the number shown is a times d take away b times c of the move it belongs to, and boxing a parallelogram and taking away its corners leaves the same number', () => {
    const shown = STEPS.every((d, i) => {
      const r = drawn(i, finishedSt(i));
      if (!r.detM) return d.key === 'two' || d.key === 'inside' || d.key === 'mean' || d.key === 'own';
      return r.detText === num(det(r.detM)) && (d.key === 'back' ? sameM(r.detM, DOUBLE) : sameM(gridOf(r.cols), r.detM));
    });
    const boxes = [BOXM, [[2, 1], [1, 3]], [[4, 1], [2, 3]], [[1, 1], [0, 1]], [[3, 0], [0, 2]], [[5, 2], [1, 4]]].every((Mx) => {
      const B = boxOf(Mx), taken = B.pairs.reduce((s, pr) => s + pairSum(pr), 0);
      return near(B.w * B.h - taken, det(Mx)) && near(Math.abs(area(B.box)), B.w * B.h);
    });
    return shown && boxes;
  }, { source: MIT });
  K.check('A move that squishes all of space onto a line makes the area of every region zero: with j on the line of i, and under the squash among the mixed puzzles, the shaded square and the flag have no area and the number shown is zero', () => {
    const r0 = atY(0), iF = idx('flat'), rf = drawn(iF, solvedSt(iF));
    return [r0, rf].every((r) => near(r.parArea, 0) && near(r.flagArea, 0) && r.detText === num(0)) && sameM(gridOf(rf.cols), FLAT) && near(det(FLAT), 0);
  }, { source: TBB });
  K.check('Whenever a move inverts the orientation of space, so the flag reads backwards, the determinant is negative: at every setting of j and on every screen, the square is hatched and the flag turned over exactly when the number is below zero', () =>
    YS.every((y) => {
      const r = atY(y), D = det(jMat(y));
      return near(r.det, D) && sameM(gridOf(r.cols), jMat(y)) && r.hatched === (D < -1e-9) && (Math.abs(D) < 1e-9 ? near(r.flagArea, 0) : Math.sign(r.flagArea) === Math.sign(D));
    }) && STEPS.every((d, i) => {
      const r = drawn(i, finishedSt(i)), D = det(gridOf(r.cols));
      return (!!r.cut || r.hatched === (D < -1e-9)) && (!r.flag || Math.abs(D) < 1e-9 || Math.sign(r.flagArea) === Math.sign(D));
    }) && det(MIRROR) < 0 && det(UPSIDE) < 0 && det(FLIPM) < 0 && det(TURN) > 0, { source: TBB });
  K.check('On your own move, wherever you drag the tips, the square lands on the parallelogram of the two columns, the shape covers its area before times the size of ad − bc, and it is hatched exactly when ad − bc is below zero', () => {
    const io = idx('own'), tries = [[[2, 1], [-1, 1]], [[3, 0], [0, 2]], [[2, 1], [4, 2]], [[1, 2], [2, 1]], [[-1, 0], [0, 3]], [[0, 1], [1, 0]], [[4, -1], [2, 3]]];
    return tries.every((c) => {
      const r = drawn(io, Object.assign(blank(), { c })), D = det(gridOf(c));
      return sameM(gridOf(r.cols), gridOf(c)) && near(r.parArea, D) && near(Math.abs(r.shapeArea), area(DOM) * Math.abs(D)) && r.hatched === (D < -1e-9);
    });
  }, { source: TBB });
  K.check('Every worked number is right: 3 × 2 = 6; 2 squares become 12, not 6 or 8; the shear keeps 1; base 2 × height 3 = 6, the slanted side gives about 6.3, the triangle 3; the box is 4 by 3 = 12, its corners take 3, 2 and 2 (7), leaving 5; [2 −1; 1 1] gives 3, not 1 or −3, and 2 squares become 6; 24 ÷ 4 = 6, not 96 or 20; j on (1, 1), (1, 0), (1, −1) gives 2, 0, −2; [1 2; 2 1] gives −3; [2 4; 1 2] gives 0, [2 4; 1 3] 2, [1 0; 0 −1] and the mirror −1; the quarter turn 1', () => {
    const B = boxOf(BOXM), t = B.pairs.map(pairSum);
    return det(STRETCH) === 6 && area(DOM) * det(STRETCH) === 12 && area(DOM) + det(STRETCH) === 8 && det(SHEAR) === 1 &&
      det(LEAN) === 6 && num1(2 * SLANT) === '6.3' && Math.abs(area([[0, 0], colsOf(LEAN)[0], colsOf(LEAN)[1]])) === 3 &&
      B.w === 4 && B.h === 3 && near(t[0], 3) && near(t[1], 2) && near(t[2], 2) && near(t[0] + t[1] + t[2], 7) && det(BOXM) === 5 && working(BOXM) === '3 × 2 − 1 × 1 = 5' &&
      det(MOVE) === 3 && working(MOVE) === '2 × 1 − (−1) × 1 = 3' && near(area(DOM.map((p) => mix(colsOf(MOVE), p))), 6) &&
      BACK_DET === 4 && near(BACK_AFTER, 24) && near(BACK_AFTER / BACK_DET, 6) && near(BACK_AFTER * BACK_DET, 96) && near(BACK_AFTER - BACK_DET, 20) &&
      det(jMat(1)) === 2 && det(jMat(0)) === 0 && det(jMat(-1)) === -2 && working(FLIPM) === '1 × 1 − 2 × 2 = −3' &&
      det(FLAT) === 0 && det(NEAR) === 2 && det(UPSIDE) === -1 && det(MIRROR) === -1 && det(TURN) === 1 && working(TURN) === '0 × 0 − (−1) × 1 = 1';
  });
  K.check('Cut and slide keeps the area: on the shear and on the leaning parallelogram the cut triangle slides along by the base, and with the part left it fills a base by height box exactly; both screens end with the slide done', () =>
    [SHEAR, LEAN].every((Mx) => {
      const c = cutOf(colsOf(Mx), 1), inside = (p) => p[0] >= c.q - 1e-9 && p[0] <= c.q + c.base + 1e-9 && p[1] >= -1e-9 && p[1] <= c.h + 1e-9;
      return near(Math.abs(area(c.tri)) + Math.abs(area(c.rest)), c.base * c.h) && near(c.base * c.h, det(Mx)) && near(area(c.rect), det(Mx)) &&
        c.tri.concat(c.rest).every(inside) && near(c.tri[0][0], c.base) && near(Math.abs(area(cutOf(colsOf(Mx), 0).tri)), Math.abs(area(c.tri)));
    }) && ['shear', 'lean'].every((k) => { const i = idx(k), r = drawn(i, finishedSt(i)); return !!r.cut && near(r.cut.e, 1); }));
  K.check('Each puzzle\'s answer comes from the rule, and each wrong answer offered is the slip its hint names', () => {
    const g = (k) => STEPS[idx(k)], has = (d, o) => d.opts.indexOf(o) >= 0;
    const s2 = g('two'), s4 = g('lean'), s6 = g('work'), s8 = g('back'), s10 = g('mean'), s11 = g('flat'), s12 = g('turn');
    return s2.want === num(area(DOM) * det(STRETCH)) && has(s2, num(det(STRETCH))) && has(s2, num(area(DOM) + det(STRETCH))) &&
      s4.want === num(det(LEAN)) && has(s4, 'about ' + num1(2 * SLANT)) && has(s4, num(det(LEAN) / 2)) &&
      s6.want === num(det(MOVE)) && has(s6, num(MOVE[0][0] * MOVE[1][1] + MOVE[0][1] * MOVE[1][0])) && has(s6, num(-det(MOVE))) &&
      s8.want === num(BACK_AFTER / BACK_DET) && has(s8, num(BACK_AFTER * BACK_DET)) && has(s8, num(BACK_AFTER - BACK_DET)) &&
      det(FLIPM) < 0 && near(Math.abs(det(FLIPM)), 3) && /triples/.test(s10.want) && /flips/.test(s10.want) && /not flip/.test(s10.opts[1]) && /−3/.test(s10.opts[0]) &&
      s11.want === oneLine(FLAT) && near(det(parseGrid(s11.want)), 0) && s11.opts.filter((o) => o !== s11.want).every((o) => !near(det(parseGrid(o)), 0)) &&
      s12.want === num(det(TURN)) && has(s12, num(-det(TURN))) && has(s12, num(0));
  });
  K.check('Each puzzle offers three different answers, accepts only the right one, and draws every wrong one in the warning colour', () =>
    DO.every((i) => {
      const d = STEPS[i];
      if (d.opts.length !== 3 || new Set(d.opts).size !== 3 || d.opts.indexOf(d.want) < 0) return false;
      if (!d.opts.every((o) => isRight(i, Object.assign(blank(), { pick: o })) === (o === d.want))) return false;
      if (drawn(i, solvedSt(i)).bad !== 0) return false;
      return d.opts.filter((o) => o !== d.want).every((o) => drawn(i, wrongSt(i, o)).bad > 0 && !!d.hints[o] && !!d.slips[o]);
    }));
  K.check('Before Check, no puzzle shows its answer; after a right answer, it does', () =>
    DO.every((i) => drawn(i, blank()).reveal === 0 && drawn(i, solvedSt(i)).reveal > 0) &&
    drawn(idx('lean'), blank()).mat === null && drawn(idx('lean'), blank()).detText === null && drawn(idx('work'), blank()).detText === null &&
    drawn(idx('flat'), blank()).mat === null && drawn(idx('turn'), blank()).detText === null);
  K.check('Every demonstration has finished arriving within its 3 to 4.5 s, none starting before the 0.35 s screen fade ends; every answer\'s motion, right or wrong, within 2.5 s', () => {
    const keepT = T;
    const timed = (i, st, limit) => {
      const keepS = S[i];
      T = Infinity; latest = 0; earliest = Infinity;
      S[i] = st;
      try { paint(i); } finally { S[i] = keepS; }
      return latest <= limit + 1e-9;
    };
    const ok = STEPS.every((d, i) => {
      if (d.show) { const r = timed(i, blank(), d.dur); return r && d.dur <= 4.5 && d.dur >= 3 && earliest >= FADE; }
      return timed(i, solvedSt(i), d.fb[0]) && d.fb[0] <= 2.5 && d.opts.filter((o) => o !== d.want).every((o) => timed(i, wrongSt(i, o), d.fb[1]) && d.fb[1] <= 2.5);
    });
    T = keepT; paint();
    return ok;
  });

  K.ready();
</script>
