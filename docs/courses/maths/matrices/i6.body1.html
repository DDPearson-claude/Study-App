<p class="caption">The determinant is the box's volume. The top-row recipe finds it, and gives the cross product.</p>

<script>
  // ---------- numbers and words (pure, so the checks can test them) ----------
  const MINUS = '−', NB = ' ';
  function num(v) { let r = Math.round(v * 100) / 100; if (Math.abs(r) < 1e-9) r = 0; return (r < 0 ? MINUS : '') + String(Math.abs(r)); }
  const paren = (v) => (v < 0 ? '(' + num(v) + ')' : num(v));
  const pt = (v) => '(' + v.map(num).join(', ') + ')';
  const toNum = (t) => +String(t).trim().replace(MINUS, '-');
  const parsePt = (s) => String(s).replace(/[()]/g, '').split(',').map(toNum);
  const say = (s) => String(s == null ? '' : s).replace(/ /g, ' ').replace(/−/g, ' minus ').replace(/×/g, ' times ')
    .replace(/=/g, ' equals ').replace(/Ω/g, ' ohms').replace(/₁/g, ' 1').replace(/₂/g, ' 2').replace(/₃/g, ' 3').replace(/\s+/g, ' ').trim();

  // ---------- the rule ----------
  // A 3 by 3 matrix sends i, j and k to its three columns, and the unit cube to the box they span.
  // Its determinant is that box's signed volume. Going along the top row: each entry times its
  // cofactor (the 2 by 2 left when its row and column are covered, with the signs + − +), added up.
  const add = (p, q) => p.map((x, k) => x + q[k]);
  const sub = (p, q) => p.map((x, k) => x - q[k]);
  const scl = (p, s) => p.map((x) => x * s);
  const dot = (p, q) => p[0] * q[0] + p[1] * q[1] + p[2] * q[2];
  const crossP = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const triple = (a, b, c) => dot(a, crossP(b, c));
  const det2 = (m) => m[0][0] * m[1][1] - m[0][1] * m[1][0];
  const minorOf = (M, j) => [M[1].filter((x, c) => c !== j), M[2].filter((x, c) => c !== j)];
  const SIGN = [1, -1, 1];
  const cofs = (M) => [0, 1, 2].map((j) => SIGN[j] * det2(minorOf(M, j)));
  const expand = (M) => { const c = cofs(M); return M[0][0] * c[0] + M[0][1] * c[1] + M[0][2] * c[2]; };
  // The full six-term formula, to check the recipe against.
  const sixTerm = (M) => M[0][0] * M[1][1] * M[2][2] + M[0][1] * M[1][2] * M[2][0] + M[0][2] * M[1][0] * M[2][1] -
    M[0][2] * M[1][1] * M[2][0] - M[0][1] * M[1][0] * M[2][2] - M[0][0] * M[1][2] * M[2][1];
  const colsOf = (M) => [0, 1, 2].map((j) => [M[0][j], M[1][j], M[2][j]]);
  const fromCols = (c) => [0, 1, 2].map((r) => [c[0][r], c[1][r], c[2][r]]);
  const mulV = (M, p) => M.map((r) => dot(r, p));
  const lerpV = (p, q, e) => (e >= 1 ? q.slice() : e <= 0 ? p.slice() : p.map((x, k) => x + (q[k] - x) * e));
  const lerpM = (P, Q, e) => (e >= 1 ? Q.map((r) => r.slice()) : e <= 0 ? P.map((r) => r.slice()) : P.map((r, i) => r.map((x, j) => x + (Q[i][j] - x) * e)));
  const near = (a, b, t) => Math.abs(a - b) < (t || 1e-9);
  const samePt = (a, b) => !!a && !!b && a.length === b.length && a.every((x, k) => near(x, b[k]));
  const sameM = (P, Q) => !!P && !!Q && P.length === Q.length && P.every((r, i) => samePt(r, Q[i]));
  const floorArea = (a, b) => a[0] * b[1] - a[1] * b[0];
  // The working, as written: the total along the top row, and a cross product part by part.
  const totalLine = (M) => num(M[0][0]) + ' × ' + paren(det2(minorOf(M, 0))) + ' − ' + paren(M[0][1]) + ' × ' + paren(det2(minorOf(M, 1))) +
    ' + ' + paren(M[0][2]) + ' × ' + paren(det2(minorOf(M, 2))) + ' = ' + num(expand(M));
  const headsOf = (M) => ['+ ' + paren(M[0][0]) + ' ×', '− ' + paren(M[0][1]) + ' ×', '+ ' + paren(M[0][2]) + ' ×'];
  const XHEADS = ['+ i ×', '− j ×', '+ k ×'];
  function vk(c) {
    const parts = [];
    ['i', 'j', 'k'].forEach((n, k) => {
      const x = c[k];
      if (Math.abs(x) < 1e-9) return;
      const s = (near(Math.abs(x), 1) ? '' : num(Math.abs(x))) + n;
      parts.push(parts.length ? (x < 0 ? ' − ' : ' + ') + s : (x < 0 ? MINUS : '') + s);
    });
    return parts.length ? parts.join('') : '0';
  }
  function crossLine(name, a, b) {
    const G = [[0, 0, 0], a, b], m = [0, 1, 2].map((j) => det2(minorOf(G, j)));
    return name + ' = ' + paren(m[0]) + 'i − ' + paren(m[1]) + 'j + ' + paren(m[2]) + 'k = ' + vk(cofs(G));
  }

  // ---------- the lesson's values ----------
  const E1 = [1, 0, 0], E2 = [0, 1, 0], E3 = [0, 0, 1], O3 = [0, 0, 0];
  const I3 = [E1.slice(), E2.slice(), E3.slice()];
  const withK = (k) => fromCols([E1, E2, k]);
  const K1 = [1, 0.5, 2], K2 = [-1, 1, 2], KQ = [2, -1, 3], KDOWN = [1, 0.5, 0];
  const MJ = [[2, 1, 0], [0, 3, 1], [0, 0, 2]], MR = [[2, 1, 1], [1, 3, 0], [0, 0, 2]], M8 = [[3, 1, 0], [1, 2, 1], [0, 1, 2]], M13 = [[1, 2, 3], [4, 5, 6], [7, 8, 9]];
  const VA = [2, 1, 0], VB = [1, 3, 0];
  // The three-loop circuit (example figures): each loop's own resistance, and the one each pair of neighbours shares.
  const OWN = [3, 6, 3], SH = 3;
  const RG = [[OWN[0] + SH, -SH, 0], [-SH, OWN[1] + 2 * SH, -SH], [0, -SH, OWN[2] + SH]];
  // The spanner: r along the handle in metres, the push F in newtons; drawn at UR, UF and UM units a metre, newton and newton metre.
  const RR = [0.3, 0, 0], FF = [80, 150, 0], UR = 10, UF = 1 / 50, UM = 1 / 15;
  // Where k's tip may be dragged, across and up.
  const DX = [-1.5, 2], DZ = [-1, 2.5];
  const boxPts = (cols) => { const a = cols[0], b = cols[1], c = cols[2]; return [[0, 0, 0], a, b, c, add(a, b), add(a, c), add(b, c), add(add(a, b), c)]; };
  const CUBE = boxPts([E1, E2, E3]);
  const dragBoxes = (y) => { let out = []; DX.forEach((x) => DZ.forEach((z) => { out = out.concat(boxPts([E1, E2, [x, y, z]])); })); return out; };

  // ---------- the 3-D view: a true view (never mirrored), turned by al, tipped by BE ----------
  const RAD = Math.PI / 180, BE = 24, AL = 290, SWING = 30, UMAX = 60, PH = 250, AW = 284, AH = PH - 60;
  function viewOf(al) { const a = al * RAD, b = BE * RAD; return { sa: Math.sin(a), ca: Math.cos(a), sb: Math.sin(b), cb: Math.cos(b) }; }
  const prj = (V, w) => [-V.sa * w[0] + V.ca * w[1], V.sb * V.ca * w[0] + V.sb * V.sa * w[1] - V.cb * w[2]];
  const towards = (V) => [V.ca * V.cb, V.sa * V.cb, V.sb];
  // The scale and centre that keep every point given in view, however far the view is turned.
  function fitOf(pts, al0) {
    const lo = [Infinity, Infinity, Infinity], hi = [-Infinity, -Infinity, -Infinity];
    pts.forEach((p) => p.forEach((x, k) => { lo[k] = Math.min(lo[k], x); hi[k] = Math.max(hi[k], x); }));
    const C = lo.map((x, k) => (x + hi[k]) / 2);
    let u = UMAX;
    [-SWING, -SWING / 2, 0, SWING / 2, SWING].forEach((da) => {
      const V = viewOf(al0 + da);
      let mx = 1e-6, my = 1e-6;
      pts.forEach((p) => { const q = prj(V, sub(p, C)); mx = Math.max(mx, Math.abs(q[0])); my = Math.max(my, Math.abs(q[1])); });
      u = Math.min(u, AW / 2 / mx, AH / 2 / my);
    });
    return { C, u };
  }
  function gridOf3(pts) {
    const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
    return { x0: Math.min(0, Math.floor(Math.min.apply(null, xs))), x1: Math.max(1, Math.ceil(Math.max.apply(null, xs))),
      y0: Math.min(0, Math.floor(Math.min.apply(null, ys))), y1: Math.max(1, Math.ceil(Math.max.apply(null, ys))) };
  }
  function hull(pts) {
    const p = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    const cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lo = [], up = [];
    p.forEach((q) => { while (lo.length >= 2 && cr(lo[lo.length - 2], lo[lo.length - 1], q) <= 0) lo.pop(); lo.push(q); });
    for (let k = p.length - 1; k >= 0; k--) { const q = p[k]; while (up.length >= 2 && cr(up[up.length - 2], up[up.length - 1], q) <= 0) up.pop(); up.push(q); }
    up.pop(); lo.pop();
    return lo.concat(up);
  }

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // dur: a SHOW step's demonstration. act: what he can do with the picture, under it. rows: worked lines;
  // minors: the three 2 by 2 blocks above them. pts: what the 3-D view must keep in view. A puzzle: task,
  // opts, want, hints (one per wrong answer), slips (the red line drawn for each), why, fb (seconds of
  // motion after a right and a wrong answer).
  const PICK = 'Tap one of the answers.';
  const TURN = 'Drag the picture sideways to turn it.';
  const STEPS = [
    { show: true, key: 'box', name: 'The box', dur: 3.2, keyRow: true, act: TURN, pts: CUBE.concat(boxPts([E1, E2, K1])),
      text: 'A 3 by 3 matrix moves every point of space. Its columns are where i, j and k land. Here i and j stay on the floor, and k lands on `(1, 0.5, 2)`. The unit cube leans into a slanted box.' },
    { kind: 'pick', key: 'whereJ', name: 'Where j lands', rows: 1, keyRow: true, fb: [1.7, 0.6], pts: CUBE.concat(boxPts(colsOf(MJ)), [[0, 3, 1], [2, 0, 0]]),
      task: 'The matrix `[2 1 0; 0 3 1; 0 0 2]` moves space. Where does j land?',
      opts: ['(0, 3, 1)', '(1, 3, 0)', '(2, 0, 0)'], want: '(1, 3, 0)',
      hints: { '(0, 3, 1)': 'Not quite. That is row 2. Where j lands is read down column 2.', '(2, 0, 0)': 'Not quite. That is column 1, where i lands.' },
      slips: { '(0, 3, 1)': '(0, 3, 1) is row 2, read across', '(2, 0, 0)': '(2, 0, 0) is column 1, where i lands' },
      why: 'Each column is where one arrow lands. Column 1 is where i lands, column 2 is j and column 3 is k. So read down column 2 to get `(1, 3, 0)`.' },
    { show: true, key: 'volume', name: 'The volume', dur: 3.4, rows: 1, keyRow: true, drag: true, dragY: 1, act: 'Drag k\'s tip across or up. ' + TURN,
      pts: CUBE.concat(boxPts([E1, E2, K1]), dragBoxes(1)),
      text: 'The floor is still the unit square. So the box\'s volume is its height, k\'s up part, 2. That volume is the *determinant*. It is the factor the move scales every volume by. Sliding k\'s tip sideways leans the box but keeps its height. So the volume stays 2.' },
    { kind: 'pick', key: 'detK', name: 'Read the height', rows: 1, keyRow: true, fb: [1.7, 1.5], pts: CUBE.concat(boxPts([E1, E2, KQ])),
      task: 'i and j stay on the floor, and k lands on `(2, −1, 3)`. What is the determinant?',
      opts: ['6', '4', '3'], want: '3',
      hints: { 6: 'Not quite. Only the up part sets the height. The 2 across just leans the box.', 4: 'Not quite. The volume is not k\'s parts added up. It is the floor\'s area, 1, times the height, 3.' },
      slips: { 6: '2 × 3 = 6 counts the 2 across, which only leans it', 4: '2 − 1 + 3 = 4 adds up k\'s parts' },
      why: 'The floor is still the unit square, with area 1. The height is k\'s up part, 3. So the volume, which is the determinant, is 1 × 3 = 3.' },
    { show: true, key: 'flat', name: 'Flat', dur: 3.6, rows: 1, keyRow: true, drag: true, dragY: 0.5, act: 'Drag k\'s tip down through the floor. ' + TURN,
      pts: CUBE.concat(boxPts([E1, E2, K1]), dragBoxes(0.5)),
      text: 'As k\'s tip drops, the box gets lower and its volume falls. On the floor the box is flat, and the determinant is 0. All of space lands on that one flat plane. So the move cannot be undone.' },
    { kind: 'pick', key: 'squash', name: 'Squash it flat', rows: 1, keyRow: true, fb: [1.6, 1.6],
      pts: CUBE.concat(boxPts([E1, E2, [3, 2, 0]]), boxPts([E1, E2, [0, 0, 3]]), boxPts([E1, E2, [1, 1, 1]])),
      task: 'i and j stay on the floor. Which landing spot for k squashes space flat?',
      opts: ['(3, 2, 0)', '(0, 0, 3)', '(1, 1, 1)'], want: '(3, 2, 0)',

    const noMinus = (M) => M[0][0] * det2(minorOf(M, 0)) + M[0][1] * det2(minorOf(M, 1)) + M[0][2] * det2(minorOf(M, 2));
    const sq = g('squash');
    return g('whereJ').want === pt(colsOf(MJ)[1]) && has(g('whereJ'), pt(MJ[1])) && has(g('whereJ'), pt(colsOf(MJ)[0])) &&
      toNum(g('detK').want) === triple(E1, E2, KQ) && has(g('detK'), num(KQ[0] * KQ[2])) && has(g('detK'), num(KQ[0] + KQ[1] + KQ[2])) &&
      near(triple(E1, E2, parsePt(sq.want)), 0) && sq.opts.filter((o) => o !== sq.want).every((o) => !near(triple(E1, E2, parsePt(o)), 0)) &&
      toNum(g('det7').want) === expand(M8) && has(g('det7'), num(noMinus(M8))) && has(g('det7'), num(M8[0][0] * M8[1][1] * M8[2][2])) &&
      g('ji').want === vk(crossP(E2, E1)) && has(g('ji'), vk(crossP(E1, E2))) && has(g('ji'), '0') &&
      g('spanner').want === num(crossP(RR, FF)[2]) + ' N m along k' && has(g('spanner'), num(RR[0] * Math.hypot(FF[0], FF[1])) + ' N m along k') &&
      has(g('spanner'), num(-crossP(FF, RR)[2]) + ' N m along −k') &&
      toNum(g('det0').want) === expand(M13) && has(g('det0'), num(noMinus(M13))) && has(g('det0'), num(M13[0][0] * M13[1][1] * M13[2][2]));
  });
  K.check('Each puzzle offers three different answers, accepts only the right one, and draws every wrong one in the warning colour', () =>
    DO.every((i) => {
      const d = STEPS[i];
      if (d.opts.length !== 3 || new Set(d.opts).size !== 3 || d.opts.indexOf(d.want) < 0) return false;
      if (!d.opts.every((o) => isRight(i, Object.assign(blank(), { pick: o })) === (o === d.want))) return false;
      if (drawn(i, solvedSt(i)).bad !== 0) return false;
      return d.opts.filter((o) => o !== d.want).every((o) => drawn(i, wrongSt(i, o)).bad > 0 && !!d.hints[o] && !!d.slips[o]);
    }));
  K.check('Before Check, no puzzle shows its answer; after a right answer, it does', () =>
    DO.every((i) => {
      const b = drawn(i, blank()), s = drawn(i, solvedSt(i));
      return b.reveal === 0 && s.reveal > 0 && b.lines.length === 0 && b.blocks.length === 0 && b.vol === null;
    }));
  K.check('Each demonstration ends where the lesson says: k on (1, 0.5, 2) with volume 2, then slid to (−1, 1, 2) keeping volume 2 all the way, then dropped to the floor with volume 0; the recipe\'s box on [2 1 1; 1 3 0; 0 0 2] with volume 10; a × b standing at 5k', () => {
    const b = drawn(idx('box'), blank()), v2 = drawn(idx('volume'), blank()), mid = drawn(idx('volume'), blank(), 1.7);
    const f = drawn(idx('flat'), blank()), f1 = drawn(idx('flat'), blank(), 1.7), rc = drawn(idx('recipe'), blank()), cr = drawn(idx('cross'), blank());
    return samePt(b.cols[2], K1) && near(b.vol, 2) && samePt(v2.cols[2], K2) && near(v2.vol, 2) && near(mid.vol, 2) && !samePt(mid.cols[2], K2) &&
      samePt(f.cols[2], KDOWN) && f.vol === 0 && near(f1.vol, 1) && sameM(fromCols(rc.cols), MR) && near(rc.vol, 10) && samePt(cr.arrow, crossP(VA, VB));
  });
  K.check('Every demonstration has finished arriving within its 3 to 4.5 s, none starting before the 0.35 s screen fade ends; every answer\'s motion, right or wrong, within 2.5 s', () => {
    const keepT = T;
    const timed = (i, st, limit) => {
      const keepS = S[i];
      T = Infinity; latest = 0; earliest = Infinity;
      S[i] = st;
      try { paint(i); } finally { S[i] = keepS; }
      return latest <= limit + 1e-9;
    };
    const ok = STEPS.every((d, i) => {
      if (d.show) { const r = timed(i, blank(), d.dur); return r && d.dur <= 4.5 && d.dur >= 3 && earliest >= FADE; }
      return timed(i, solvedSt(i), d.fb[0]) && d.fb[0] <= 2.5 && d.opts.filter((o) => o !== d.want).every((o) => timed(i, wrongSt(i, o), d.fb[1]) && d.fb[1] <= 2.5);
    });
    T = keepT; paint();
    return ok;
  });

  K.ready();
</script>
