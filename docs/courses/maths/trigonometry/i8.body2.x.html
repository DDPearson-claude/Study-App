<script>
  const el = (id) => document.getElementById(id);
  // ---------- numbers (pure, so the checks can test them) ----------
  const PI = Math.PI, TAU = 2 * Math.PI, DEG = 180 / Math.PI, RAD = Math.PI / 180;
  const sinD = (a) => Math.sin(a * RAD), cosD = (a) => Math.cos(a * RAD);
  const acosD = (x) => Math.acos(x) * DEG, asinD = (x) => Math.asin(x) * DEG;
  const neg = (s) => String(s).replace(/^-/, '−');
  // v rounded to dp places with trailing zeros dropped: 8.66, 5, 0.5.
  function trim(v, dp) {
    const f = Math.pow(10, dp);
    let s = (Math.round(v * f) / f).toFixed(dp);
    if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
    if (s === '-0') s = '0';
    return neg(s);
  }
  // Three significant figures, as the lesson writes currents and kVA: 43.5, 72.5, 145, 16.7.
  const sig3 = (v) => trim(v, Math.abs(v) >= 99.95 ? 0 : Math.abs(v) >= 9.995 ? 1 : 2);
  const deg = (v) => trim(v, 1) + '°';
  const pfS = (v) => trim(v, 3);
  const hA = (v) => trim(v, 2) + ' A';
  const W0 = (v) => trim(v, 0);
  const p12 = (v) => +v.toPrecision(12);   // an angle kept as the slider keeps its snap values
  const lenOf = (p, q) => Math.hypot(p[0] - q[0], p[1] - q[1]);

  // The lesson's values. Every other number is worked out from these by the rule.
  const V0 = 230, I0 = 10, S0 = V0 * I0;                  // 230 V, 10 A: 2300 VA
  const P_HOLD = 10000;                                    // the held load: 10 kW
  const PH = { a8: p12(acosD(0.8)), a6: p12(acosD(0.6)), a3: p12(acosD(0.3)), m: p12(acosD(450 / 621)) };
  const SNAPS = [PH.a8, PH.m, PH.a6, 60, PH.a3];
  const HMAX = PH.a3;                                      // Hold true power stops at a power factor of 0.3
  const curOf = (phi) => P_HOLD / (V0 * cosD(phi));        // the current a held 10 kW needs on 230 V
  const IM = 2.7, PM = 450, SM = V0 * IM;                  // the motor: 2.7 A, 450 W, 621 VA
  const PFM = PM / SM, PHM = acosD(PFM), QM = Math.sqrt(SM * SM - PM * PM), PHS = asinD(PFM), PS = SM * cosD(PHS);

  // The answers each puzzle offers (worked out here, never typed in).
  const o1 = [hA(I0 * sinD(60)), hA(I0), hA(I0 * cosD(60))];                                     // 8.66 A, 10 A, 5 A
  const o3 = [trim(PFM, 3), trim(SM / PM, 2), trim(SM, 0)];                                        // 0.725, 1.38, 621
  const o5 = [deg(asinD(0.5)), deg(acosD(0.5)), trim(Math.acos(0.5), 2)];                          // 30°, 60°, 1.05
  const o7 = [sig3(curOf(PH.a8)) + ' A', sig3(curOf(0) * 0.8) + ' A', sig3(curOf(0)) + ' A'];       // 54.3 A, 34.8 A, 43.5 A
  const o9 = [trim(S0 * 0.6, 0) + ' W', trim(S0 * 0.8, 0) + ' W', trim(S0 / 0.8, 0) + ' W'];        // 1380 W, 1840 W, 2875 W
  const D11 = Math.sqrt(25 + 64 - 80 * cosD(60));
  const o10 = [trim(Math.sqrt(89), 2) + ' m', trim(Math.sqrt(129), 2) + ' m', trim(D11, 2) + ' m']; // 9.43 m, 11.36 m, 7 m
  const o11 = [trim(60, 0), trim(TAU * 60, 0), trim(PI * 60, 1)];                                 // 60, 377, 188.5
  const I13 = Math.hypot(4, 3);
  const o12 = [trim(I13, 0) + ' A at ' + trim(4 / I13, 2), trim(4 + 3, 0) + ' A at ' + trim(4 / 7, 2), trim(I13, 0) + ' A at ' + trim(3 / I13, 2)];
  const TOOLS = ['Right-angled triangle', 'Sine or cosine rule', 'Radians', 'Phasor arrows'];

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  const PICK = 'Tap one of the answers.', PICKT = 'Tap one of the tools.';
  const STEPS = [
    { show: true, name: 'In step, then behind', pic: 'split', dur: 3.7, rows: 3, live: true, sliders: ['phi'],
      text: "These are the turning arrows from Adding waves, drawn at rms. The voltage arrow *V*, 230 V, points right. The current arrow *I*, 10 A, starts along it, in step as in a heater, so the power is `230 V × 10 A = 2300 W`. Then I swings 60° behind V, as a motor's current lags. That angle is *φ* (phi). Drag I's tip to set it.",
      after: "A dashed line drops from I's tip to V and splits I, as in Finding angles. Its *floor shadow*, `I cos φ = 10 cos 60° = 5 A`, lies along V. That part rises and falls in step with the voltage. Its *wall shadow*, `I sin φ = 8.66 A`, is a quarter turn behind." },
    { kind: 'pick', name: 'The in-step part', pic: 'q5', opts: o1, want: o1[2], secret: ['floor ' + o1[2]],
      task: 'The current is 10 A, 60° behind the voltage. How much of it is in step with the voltage?',
      why: "The in-step part is the floor shadow, the part lying along the voltage arrow: `10 cos 60° = 10 × 0.5 = 5 A`. 8.66 A is the wall shadow, `10 sin 60°`, a quarter turn behind the voltage. 10 A is the whole current, and only part of it is in step.",
      hint: 'Not quite. The in-step part lies along the voltage arrow.',
      hints: { [o1[0]]: 'Not quite. 8.66 A is the wall shadow, a quarter turn behind. Look along V.',
        [o1[1]]: 'Not quite. 10 A is the whole current. Only its floor shadow is in step.' },
      right: ['in step = floor shadow = 10 cos 60°', '= 10 × 0.5 = ' + o1[2]],
      wrong: { [o1[0]]: ['10 sin 60° = ' + o1[0] + ' is the wall shadow'], [o1[1]]: [o1[1] + ' is the whole current arrow'] } },
    { show: true, name: 'Times 230 V', pic: 'scale', dur: 4.2, rows: 4, live: true, sliders: ['phi'],
      text: "Now multiply every side of that current triangle by the voltage, 230 V. The long side becomes `230 × 10 = 2300` volt-amps (VA), the *apparent power*. The flat side becomes `230 × 5 = 1150` watts (W), the *true power*, which a wattmeter reads. The upright side becomes 1992 VAr (volt-amps reactive), the energy that goes back and forth.",
      after: "Scaling keeps the angle, so φ is still 60°. The *power factor* is true power ÷ apparent power, `1150 ÷ 2300 = 0.5`. That is the flat side over the long side, so it is `cos 60°`. Drag I's tip and the long side keeps its 2300 VA while the flat side shrinks as `2300 × cos φ`." },
    { kind: 'pick', name: "A motor's power factor", pic: 'qmotor', opts: o3, want: o3[0], secret: ['power factor ' + o3[0]],
      task: 'A motor on 230 V draws 2.7 A, and a wattmeter reads 450 W. What is its power factor?',
      why: "Apparent power is volts × amps, `230 × 2.7 = 621 VA`. Power factor is true power ÷ apparent power, `450 ÷ 621 = 0.725`. 1.38 divides the wrong way round, and a power factor is never above 1. 621 is the volt-amps themselves, not the ratio.",
      hint: 'Not quite. Power factor = true power ÷ apparent power.',
      hints: { [o3[1]]: 'Not quite. That is upside down. A power factor is never above 1.',
        [o3[2]]: 'Not quite. 621 VA is the apparent power. Divide the watts by it.' },
      right: ['apparent = 230 × 2.7 = 621 VA', 'power factor = 450 ÷ 621 = ' + o3[0]],
      wrong: { [o3[1]]: ['621 ÷ 450 = ' + o3[1] + ' is upside down'], [o3[2]]: ['621 VA is the apparent power'] } },
    { show: true, name: "The motor's triangle", pic: 'motor', dur: 4.2, rows: 5,
      text: "Here is that motor's power triangle, 621 VA along the long side and 450 W flat. The inverse key gives the angle, `φ = cos⁻¹(450 ÷ 621) = 43.6°`, and Pythagoras gives the upright side, `√(621² − 450²) = 428 VAr`. Put it back to check, `621 × cos 43.6° = 450 W`.",
      after: "On the right is the slip. Taking power factor as sin φ gives `sin⁻¹(450 ÷ 621) = 46.4°`, and then the flat side is `621 × cos 46.4° = 428 W`, not the 450 W the meter reads." },
    { kind: 'pick', name: 'From power factor to angle', pic: 'qangle', opts: o5, want: o5[1], secret: ['φ ' + o5[1]],
      task: 'A load has a power factor of 0.5. What is the angle φ between its voltage and current?',
      why: "Power factor is cos φ, so `φ = cos⁻¹ 0.5 = 60°`, with the calculator in degrees. 30° is `sin⁻¹ 0.5`, which takes power factor as sin φ. 1.05 is `cos⁻¹ 0.5` with the calculator in radians mode, the same angle in radians.",
      hint: 'Not quite. Power factor is cos φ, so use cos⁻¹.',
      hints: { [o5[0]]: 'Not quite. That is sin⁻¹ 0.5. Power factor is the cosine.',
        [o5[2]]: 'Not quite. That answer is in radians. Set the calculator to degrees.' },
      right: ['flat ÷ long side = cos φ = 0.5', 'φ = cos⁻¹ 0.5 = ' + o5[1]],
      wrong: { [o5[0]]: ['sin⁻¹ 0.5 = ' + o5[0] + ' uses sin, not cos'], [o5[2]]: ['cos⁻¹ 0.5 = ' + o5[2] + ' in radians mode'] } },
    { show: true, name: 'Hold the true power', pic: 'hold', dur: 4.0, rows: 3, live: true, sliders: ['phi', 'hold'],
      text: "Now *Hold true power* is on, for a 10 kW load on 230 V. In step it needs `10 000 ÷ 230 = 43.5 A`. As φ grows the flat side must stay 10 kW, so the long side stretches to `10 kW ÷ cos φ` and the current bar grows with it. Below, the current is plotted against the power factor.",
      after: "At a power factor of 0.6, φ is 53.1°. The long side is `10 ÷ 0.6 = 16.7 kVA` and the current is `10 000 ÷ (230 × 0.6) = 72.5 A`. The cables, fuses and supply carry the whole current, so a poor power factor means more current for the same work." },
    { kind: 'pick', name: 'The current at 0.8', pic: 'q543', opts: o7, want: o7[0], secret: ['current ' + o7[0]],
      task: 'The same 10 kW load on 230 V runs at a power factor of 0.8 (φ = 36.9°). What current does it draw?',
      why: "The flat side stays 10 kW, so the current is `10 000 ÷ (230 × 0.8) = 54.3 A`, which Electrical A2Z's worked example prints as 54.5 A. A lower power factor needs more current, never less, so `43.5 × 0.8 = 34.8 A` goes the wrong way. 43.5 A is the current at a power factor of 1, so it leaves the power factor out.",
      hint: 'Not quite. Current = true power ÷ (volts × power factor).',
      hints: { [o7[1]]: 'Not quite. That multiplies by 0.8. A lower power factor needs more current.',
        [o7[2]]: 'Not quite. 43.5 A is the current at a power factor of 1.' },
      right: ['current = 10 000 ÷ (230 × 0.8)', '= ' + o7[0]],
      wrong: { [o7[1]]: ['43.5 × 0.8 = ' + o7[1] + ' goes the wrong way'], [o7[2]]: [o7[2] + ' leaves the power factor out'] } },
    { show: true, name: 'Where the power goes', pic: 'wave', dur: 4.4, rows: 3, live: true, sliders: ['phi', 'hold'],
      text: "Holding 10 kW, φ goes on to a power factor of 0.3 (72.5°). The current climbs to 145 A and the curve bends up steeply, because towards 90° the current needed grows without limit. Then Hold true power goes off and the current is back at 10 A. Under the triangle is the *power wave*, volts × amps at each moment, made from the voltage and current waves.",
      after: "At 0° the power wave never dips below the line. As φ grows, part of each cycle dips below it, as energy goes back to the supply. At 90° its humps above and below are equal, so its average, the true power, is 0 though 10 A flows. At every φ its average height is the flat side." },
    { kind: 'pick', name: 'True power at 0.8', pic: 'q1840', opts: o9, want: o9[1], secret: ['true ' + o9[1]],
      task: 'A load on 230 V draws 10 A at a power factor of 0.8. What is its true power?',
      why: "Apparent power is `230 × 10 = 2300 VA`, and true power is apparent power × power factor, `2300 × 0.8 = 1840 W`, the flat side. 1380 W is `2300 × 0.6`, the upright side. 2875 W divides by 0.8, which would make the flat side longer than the long side.",
      hint: 'Not quite. True power = apparent power × power factor.',
      hints: { [o9[0]]: 'Not quite. 2300 × 0.6 is the upright side. Take the flat side.',
        [o9[2]]: 'Not quite. Dividing makes it more than 2300 VA. Multiply.' },
      right: ['apparent = 230 × 10 = 2300 VA', 'true = 2300 × 0.8 = ' + o9[1]],
      wrong: { [o9[0]]: ['2300 × 0.6 = ' + o9[0] + ' is the upright side'], [o9[2]]: ['2300 ÷ 0.8 = ' + o9[2] + ' is over 2300'] } },
    { kind: 'pick', mixed: true, name: 'Mixed: two cable runs', pic: 'cable', tool: TOOLS[1], toolSay: 'The cosine rule it is. Now pick the answer.',
      opts: o10, want: o10[2], secret: ['apart ' + o10[2]],
      task: 'Two cable runs leave a junction box 60° apart, one 5 m long and one 8 m. How far apart are their ends?',
      toolHints: { [TOOLS[0]]: 'Not quite. The runs are 60° apart, not 90°, so there is no right angle. Two sides and the angle between point to the cosine rule.',
        [TOOLS[2]]: 'Not quite. Nothing turns here. Two sides and the angle between them point to the cosine rule.',
        [TOOLS[3]]: 'Not quite. These are lengths of cable, not waves. Two sides and the angle between point to the cosine rule.' },
      why: "Two sides and the angle between them, with no right angle, call for the cosine rule from Triangles without a right angle. `5² + 8² − 2 × 5 × 8 × cos 60° = 25 + 64 − 40 = 49`, so the ends are `√49 = 7 m` apart. 9.43 m is `√89`, Pythagoras, as if the runs were 90° apart. 11.36 m is `√129`, with the minus sign dropped.",
      hint: 'Not quite. Use the cosine rule with the 60° between the runs.',
      hints: { [o10[0]]: 'Not quite. That is Pythagoras, as if the runs were 90° apart.',
        [o10[1]]: 'Not quite. The cosine rule takes 2 × 5 × 8 × cos 60° away.' },
      right: ['5² + 8² − 2 × 5 × 8 × cos 60°', '= 25 + 64 − 80 × 0.5 = 49', 'apart = √49 = ' + o10[2]],
      wrong: { [o10[0]]: ['√(5² + 8²) = √89 = ' + o10[0], 'that needs the runs 90° apart'], [o10[1]]: ['25 + 64 + 40 = 129, √129 = ' + o10[1], 'the minus sign was dropped'] } },
    { kind: 'pick', mixed: true, name: "Mixed: a ship's supply", pic: 'rad', tool: TOOLS[2], toolSay: 'Radians it is. Now pick the answer.',
      opts: o11, want: o11[1], secret: [o11[1] + ' radians'],
      task: "A college's marine notes say 60 Hz is the most common frequency on board ship. How many radians a second does its turning arm sweep?",
      toolHints: { [TOOLS[0]]: 'Not quite. No sides are asked for. "Radians a second" points to radians.',
        [TOOLS[1]]: 'Not quite. There is no triangle here. "Radians a second" points to radians.',
        [TOOLS[3]]: 'Not quite. There is only one arm, and the question asks for radians a second.' },
      why: "One whole turn is 2π radians, and the arm turns 60 times a second, so it sweeps `2π × 60 = 377` radians a second, the ω of From circle to wave. 60 counts turns, not radians, and 188.5 is `π × 60`, only half a turn each time.",
      hint: 'Not quite. One turn is 2π radians.',

        if (ix > 1 && iy > 1) bad.push('"' + a.s + '" on "' + b.s + '"');
      });
      REC.handles.forEach((h) => { const nx = K.clamp(h.x, a.x, a.x + a.w), ny = K.clamp(h.y, a.y, a.y + a.h); if (Math.hypot(nx - h.x, ny - h.y) < 11) bad.push('"' + a.s + '" on a handle'); });
    });
    return bad;
  }

  K.check('Find the cosine as the ratio of the adjacent side to the hypotenuse, and the sine as the opposite side over the hypotenuse: on the first screen, at every angle φ from 0° to 90°, the 10 A arrow\'s floor shadow is drawn 10 × cos φ and its wall shadow 10 × sin φ, and at 60° the rows give 10 cos 60° = 5 A and 10 sin 60° = 8.66 A', () => {
    const i = idx('split');
    for (let phi = 0; phi <= 90; phi += 5) {
      const w = drawn(i, stOf({ phi }), 'demo').rec.w;
      if (!K.near((w.F[0] - w.C[0]) / w.k, 10 * cosD(phi), 1e-9) || !K.near((w.T[1] - w.F[1]) / w.k, 10 * sinD(phi), 1e-9) || !K.near(w.F[1], w.C[1], 1e-12)) fail('shadows off at ' + phi + '°');
    }
    const r = drawn(i, blank(), 'demo').rec.rows.map((x) => x.s);
    return r[0] === 'at 0°: 230 V × 10 A = 2300 W' && r[1] === 'floor shadow 10 cos 60° = 5 A' && r[2] === 'wall shadow 10 sin 60° = 8.66 A';
  }, { source: SRC.ox });
  K.check('Because true power and apparent power form the adjacent and hypotenuse sides of a right triangle, the power factor ratio is also equal to the cosine of that phase angle: at every φ the power triangle has a right angle where its flat and upright sides meet, flat ÷ long side = cos φ, and at 60° the rows give 1150 ÷ 2300 = 0.5 = cos 60°', () => {
    const i = idx('scale');
    for (let phi = 1; phi < 90; phi += 4) {
      const t = drawn(i, stOf({ phi }), 'demo').rec.w.t;
      const dotp = (t.C[0] - t.F[0]) * (t.T[0] - t.F[0]) + (t.C[1] - t.F[1]) * (t.T[1] - t.F[1]);
      if (!K.near(dotp, 0, 1e-9) || !K.near((t.F[0] - t.C[0]) / lenOf(t.C, t.T), cosD(phi), 1e-9)) fail('not cos φ at ' + phi + '°');
    }
    const r = drawn(i, blank(), 'demo').rec.rows.map((x) => x.s);
    return r[0] === '230 × 10 A = 2300 VA, apparent' && r[1] === '230 × 5 A = 1150 W, true' && r[2] === 'power factor = 1150 ÷ 2300' && r[3] === '= 0.5 = cos 60°';
  }, { source: SRC.aac });
  K.check('With the current held at 10 A, dragging the current arrow further behind keeps the long side at 2300 VA while the flat side, the true power, shrinks as 2300 × cos φ at every degree: its label reads 2300 W at 0°, 1150 W at 60° and 0 W at 90°', () => {
    const i = idx('scale');
    let last = Infinity;
    for (let phi = 0; phi <= 90; phi += 1) {
      const w = drawn(i, stOf({ phi }), 'demo').rec.w, t = w.t, flat = (t.F[0] - t.C[0]) / w.k;
      if (!K.near(lenOf(t.C, t.T) / w.k, 2300, 1e-6) || !K.near(flat, 2300 * cosD(phi), 1e-6) || !(flat < last)) fail('at ' + phi + '°');
      last = flat;
    }
    const lab = (phi) => drawn(i, stOf({ phi }), 'demo').texts;
    return lab(0).indexOf('true 2300 W') >= 0 && lab(60).indexOf('true 1150 W') >= 0 && lab(90).indexOf('true 0 W') >= 0;
  });
  K.check('Power Factor is the cosine of the angle between the Real Power and the Apparent Power, pf = kW/kVA = cos(φ): with Hold true power on, at every φ up to 72.5° the drawn flat side stays 10 kW, the long side is 10 ÷ cos φ kVA at the angle φ to it, so kW ÷ kVA = cos φ', () => {
    const i = idx('hold');
    for (let phi = 0; phi <= 72; phi += 3) {
      const w = drawn(i, stOf({ phi, hold: true }), 'demo').rec.w, t = w.t;
      const kW = (t.F[0] - t.C[0]) / w.k / 1000, kVA = lenOf(t.C, t.T) / w.k / 1000, ang = Math.atan2(t.T[1] - t.C[1], t.T[0] - t.C[0]) * DEG;
      if (!K.near(kW, 10, 1e-9) || !K.near(kW / kVA, cosD(phi), 1e-9) || !K.near(ang, phi, 1e-9)) fail('at ' + phi + '°');
    }
    return true;
  }, { source: SRC.ornl });
  K.check('If the power factor of the load is 0.6 (cos 53°), the total current in the line will be 72.5 A, and correcting the PF to 0.8 (cos 37°) would reduce the current to 54.5 A: holding 10 kW on 230 V, the current bar is drawn 72.5 A long at 0.6 and 54.3 A at 0.8, within 0.2 A of the printed 54.5 A', () => {
    const i = idx('hold'), at6 = drawn(i, stOf({ phi: PH.a6, hold: true }), 'demo'), at8 = drawn(i, stOf({ phi: PH.a8, hold: true }), 'demo');
    const bar = (x) => (x.rec.w.bar.base - x.rec.w.bar.top) / HL.kA;
    return sig3(bar(at6)) === '72.5' && sig3(bar(at8)) === '54.3' && Math.abs(bar(at8) - 54.5) < 0.2 && at6.texts.indexOf('current 72.5 A') >= 0 && at8.texts.indexOf('current 54.3 A') >= 0;
  }, { source: SRC.a2z });
  K.check('With Hold true power on, φ stops at a power factor of 0.3 (72.5°), where the current is 145 A; up to there the current rises at every step up in φ, and the plot traces it from a power factor of 1 down to the setting', () => {
    const i = idx('hold'), w90 = drawn(i, stOf({ phi: 90, hold: true }), 'demo').rec.w;
    if (!K.near(w90.phi, HMAX, 1e-9) || sig3(w90.I) !== '145') fail('no stop at 0.3');
    let last = 0;
    for (let phi = 0; phi <= 72; phi += 4) {
      const w = drawn(i, stOf({ phi, hold: true }), 'demo').rec.w;
      if (!(w.I > last)) fail('current falls at ' + phi + '°');
      last = w.I;
      if (!K.near(w.trace[0][0], HL.PX0 + (HL.PX1 - HL.PX0) * cosD(phi), 1e-6) || !K.near(w.trace[w.trace.length - 1][0], HL.PX1, 1e-6)) fail('trace at ' + phi + '°');
    }
    return true;
  });
  K.check('The mains voltage in the UK can vary between 216 and 253 volts, and these are r.m.s. values: the power wave multiplies a voltage wave peaking at 230 × √2 by a current wave peaking at 10 × √2, so at every φ its average over whole cycles is 230 × 10 × cos φ, the flat side; at 0° it never dips below the line and touches it twice a cycle, and at 90° its humps above and below are equal', () => {
    const i = idx('wave'), Wof = (w, q) => (w.Z - q[1]) / w.KW;
    [0, 20, 45, 60, HMAX, 80, 90].forEach((phi) => {
      const w = drawn(i, stOf({ phi, hold: false }), 'demo').rec.w, pw = w.wave.ps.slice(0, -1).map((q) => Wof(w.wave, q));
      const avg = pw.reduce((s, v) => s + v, 0) / pw.length, flat = (w.t.F[0] - w.t.C[0]) / w.k;
      if (!K.near(avg, 230 * 10 * cosD(phi), 1e-6) || !K.near(avg, flat, 1e-6)) fail('average off at ' + phi + '°');
    });
    const w0 = drawn(i, stOf({ phi: 0, hold: false }), 'demo').rec.w.wave, p0 = w0.ps.map((q) => Wof(w0, q));
    const touches = p0.filter((v, j) => j < p0.length - 1 && Math.abs(v) < 1e-6).length;
    const w9 = drawn(i, stOf({ phi: 90, hold: false }), 'demo').rec.w.wave, p9 = w9.ps.map((q) => Wof(w9, q));
    return Math.min.apply(null, p0) > -1e-6 && touches === 4 && K.near(Math.max.apply(null, p9), -Math.min.apply(null, p9), 1e-6);
  }, { source: SRC.bbc });
  K.check('The voltage declared in respect of a low voltage supply shall be 230 volts between the phase and neutral conductors: the voltage arrow is labelled 230 V, and the working multiplies by 230', () => {
    const a = drawn(idx('split'), blank(), 'demo'), b = drawn(idx('scale'), blank(), 'demo'), h = drawn(idx('hold'), blank(), 'demo').rec.rows;
    return a.texts.indexOf('V 230 V') >= 0 && b.texts.indexOf('V 230 V') >= 0 && b.rec.rows[0].s === '230 × 10 A = 2300 VA, apparent' && h[0].s === 'current = 10 000 ÷ (230 × 0.6)';
  }, { source: SRC.leg });
  K.check('60 Hz is the most common frequency adopted for use on board ship: the mixed puzzle on a ship\'s supply works from 60 turns a second, and its answer is 2π × 60 = 377 radians a second', () =>
    drawn(idx('rad'), blank(), 'answer').texts.indexOf('60 turns a second') >= 0 && o11[1] === '377' && K.near(TAU * 60, 376.99, 0.01), { source: SRC.ship });
  K.check("The motor's triangle is drawn 621 VA long and 450 W flat at 43.6°, its upright side √(621² − 450²) = 428 VAr; the slip triangle, with power factor taken as sin φ, is drawn at 46.4° with a flat side of only 428 W", () => {
    const w = drawn(idx('motor'), blank(), 'demo').rec.w, L = w.l, Rt = w.r, k = w.k;
    return K.near(lenOf(L.C, L.T) / k, 621, 1e-9) && K.near((L.F[0] - L.C[0]) / k, 450, 1e-9) && K.near((L.T[1] - L.F[1]) / k, QM, 1e-9) && deg(PHM) === '43.6°' && W0(QM) === '428' &&
      K.near(lenOf(Rt.C, Rt.T) / k, 621, 1e-9) && W0((Rt.F[0] - Rt.C[0]) / k) === '428' && deg(PHS) === '46.4°';
  });
  K.check('Every worked number matches the lesson: 2300 W; 5 A and 8.66 A; 1150 W, 1992 VAr, 0.5; 621 VA, 0.725, 1.38, 43.6°, 428 VAr, 46.4°, 428 W; 60°, 30°, 1.05; 43.5 A, 53.1°, 16.7 kVA, 72.5 A; 36.9°, 54.3 A, 34.8 A; 72.5°, 145 A; 1840 W, 1380 W, 2875 W; 49, 7 m, 9.43 m, 11.36 m; 377, 188.5; 5 A at 0.8, 7 A at 0.57, 5 A at 0.6', () => {
    const same = (a, b) => a.length === b.length && a.every((v, k) => v === b[k]);
    return W0(V0 * I0) === '2300' && same(o1, ['8.66 A', '10 A', '5 A']) && W0(S0 * cosD(60)) === '1150' && W0(S0 * sinD(60)) === '1992' && pfS(cosD(60)) === '0.5' &&
      W0(SM) === '621' && same(o3, ['0.725', '1.38', '621']) && deg(PHM) === '43.6°' && W0(QM) === '428' && deg(PHS) === '46.4°' && W0(PS) === '428' &&
      same(o5, ['30°', '60°', '1.05']) && sig3(curOf(0)) === '43.5' && deg(PH.a6) === '53.1°' && sig3(P_HOLD / cosD(PH.a6) / 1000) === '16.7' && sig3(curOf(PH.a6)) === '72.5' &&
      deg(PH.a8) === '36.9°' && same(o7, ['54.3 A', '34.8 A', '43.5 A']) && deg(HMAX) === '72.5°' && sig3(curOf(HMAX)) === '145' &&
      same(o9, ['1380 W', '1840 W', '2875 W']) && W0(25 + 64 - 80 * cosD(60)) === '49' && same(o10, ['9.43 m', '11.36 m', '7 m']) &&
      same(o11, ['60', '377', '188.5']) && same(o12, ['5 A at 0.8', '7 A at 0.57', '5 A at 0.6']);
  });
  K.check('Each puzzle accepts only its right answer, and each mixed puzzle first only its right tool; every wrong answer and wrong tool has its own hint, every wrong answer its own red row of working, the answer appears once given, and before it nothing in the picture gives it away', () =>
    DO.every((i) => {
      const d = STEPS[i];
      if (d.opts.length !== 3 || new Set(d.opts).size !== 3 || d.opts.indexOf(d.want) < 0 || !d.opts.every((o) => isRight(i, stOf({ pick: o })) === (o === d.want))) fail('options wrong on step ' + (i + 1));
      if (d.mixed) {
        const wt = TOOLS.filter((t) => t !== d.tool);
        if (TOOLS.indexOf(d.tool) < 0 || !wt.every((t) => d.toolHints[t]) || new Set(wt.map((t) => d.toolHints[t])).size !== wt.length) fail('tool hints on step ' + (i + 1));
        const pre = drawn(i, stOf({ tool: d.tool, tres: 'right' }), 'answer');
        if (pre.rec.rows.length || d.secret.some((x) => pre.texts.some((t) => t.indexOf(x) >= 0))) fail('answer shown with the tool on step ' + (i + 1));
      }
      const wrongs = d.opts.filter((o) => o !== d.want);
      if (!wrongs.every((o) => d.hints[o] && d.wrong[o]) || d.hints[wrongs[0]] === d.hints[wrongs[1]]) fail('hints missing on step ' + (i + 1));
      const b = drawn(i, blank(), 'answer'), s = drawn(i, solvedSt(i), 'answer');
      if (b.rec.rows.length || d.secret.some((x) => b.texts.some((t) => t.indexOf(x) >= 0))) fail('answer shown early on step ' + (i + 1));
      if (!(s.rec.rows.length === d.right.length && s.rec.rows.every((r) => !r.bad)) || !d.secret.every((x) => s.texts.some((t) => t.indexOf(x) >= 0))) fail('answer not drawn on step ' + (i + 1));
      return wrongs.every((o) => { const r = drawn(i, wrongSt(i, o), 'answer').rec.rows, w = [].concat(d.wrong[o]); return r.length === w.length && r.every((x, k) => x.bad && x.s === w[k]); });
    }));
  K.check('On the two-currents puzzle both branch arrows keep their labels at every stage: before a tool is picked, with each tool picked, once the arrows lie tip to tail, and once answered right, wrong or with Why? open', () =>
    statesOf(idx('twoI')).every((s) => {
      const tx = drawn(idx('twoI'), s[0], s[1]).texts;
      if (tx.indexOf('4 A in step') < 0 || tx.indexOf('3 A, ¼ turn behind') < 0) fail('a branch label is missing: ' + JSON.stringify({ tool: s[0].tool, tres: s[0].tres, pick: s[0].pick, why: s[0].why }));
      return true;
    }));
  K.check('No label sits on another label or a handle, or runs off the picture, on any screen in any state: puzzles answered right, wrong or with Why? open, every tool picked, φ dragged from 0° to 90°, with Hold true power on and off', () =>
    STEPS.every((d, i) => statesOf(i).every((s) => withState(i, s[0], s[1], () => {
      const bad = crowding();
      if (bad.length) fail('step ' + (i + 1) + ' ' + JSON.stringify({ phi: s[0].phi, hold: s[0].hold, pick: s[0].pick, tool: s[0].tool, why: s[0].why }) + ': ' + bad[0]);
      return true;
    }))));
  K.check('Every demonstration has finished within 4.5 s of its screen opening, none starting before the 0.35 s screen fade ends; each answer, tool and Why? has settled within 1.8 s', () =>
    STEPS.every((d, i) => {
      const timed = (st, m) => withState(i, st, m, () => [latest, earliest]);
      if (d.show) {
        const t = timed(blank(), 'demo');
        if (!(t[0] <= d.dur + 1e-9 && d.dur <= 4.5 && d.dur >= 3 && t[1] >= FADE)) fail('step ' + (i + 1) + ' runs ' + t[0] + ' s from ' + t[1]);
        return true;
      }
      const extra = d.mixed ? [[stOf({ tool: d.tool, tres: 'right' }), 'tool']] : [];
      return statesOf(i).concat(extra).every((s) => timed(s[0], s[1])[0] <= ANS + 1e-9);
    }));

  K.ready();
</script>
