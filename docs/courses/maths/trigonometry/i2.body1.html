<p class="caption">The floor shadow is the arrow's length times cos θ, and the wall shadow its length times sin θ.</p>

<script>
  const el = (id) => document.getElementById(id);
  // ---------- numbers (pure, so the checks can test them) ----------
  const RAD = Math.PI / 180;
  const sinD = (a) => Math.sin(a * RAD), cosD = (a) => Math.cos(a * RAD), tanD = (a) => Math.tan(a * RAD);
  const asinD = (v) => Math.asin(v) / RAD, acosD = (v) => Math.acos(v) / RAD, atanD = (v) => Math.atan(v) / RAD;
  const neg = (s) => String(s).replace(/^-/, '−');
  // v rounded to dp places with trailing zeros dropped: 0.5, 1.67, 30.
  function trim(v, dp) {
    const f = Math.pow(10, dp);
    let s = (Math.round(v * f) / f).toFixed(dp);
    if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
    if (s === '-0') s = '0';
    return neg(s);
  }
  // v rounded to exactly dp places: 86.6, 50.0, 13.4957.
  function fix(v, dp) {
    const f = Math.pow(10, dp);
    let s = (Math.round(v * f) / f).toFixed(dp);
    if (/^-0(\.0+)?$/.test(s)) s = s.slice(1);
    return neg(s);
  }
  const deg1 = (v) => fix(v, 1) + '°', deg0 = (v) => trim(v, 0) + '°', newt = (v) => fix(v, 1) + ' N';
  const cm = (v) => trim(v, 1) + ' cm', mm = (v) => trim(v, 0) + ' mm', mtr = (v) => trim(v, 2) + ' m';
  const mult = (v) => { const s = trim(v, 3); return s.indexOf('.') < 0 ? s + '.0' : s; };   // 2.0, 1.414

  // The lesson's example values.
  const D1 = 150, B1 = 300;                      // lesson 1's offset: depth and distance between bends, mm
  const P2 = { opp: 6, hyp: 10 };                // puzzle, cm
  const M3 = 0.5;                                // the line y = 0.5x
  const P4 = { rise: 1, run: 2.5 };              // the tray, m
  const F9 = 100, TH9 = 30;                      // the arrow: N, degrees above the floor
  const F10 = 200, TH10 = 40;                    // the rope
  const W11 = 500, AL11 = 20, AMAX = 40;         // the block on the slope; the tilt handle's range
  const W12 = 600, AL12 = 25;
  const S13 = { floor: 90, wall: 40 };           // two shadows, N
  const P14 = { rise: 1.2, run: 5, W: 600 };     // the crate's slope, m; its weight, N
  const AL14 = atanD(P14.rise / P14.run), AL14S = fix(AL14, 4) + '…';
  const SMIN = 5, SMAX = 100;                    // run backwards, each shadow stays within these, N

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // pic: the picture; vh: its height; dur: a demonstration's length; live: what Dan can drag.
  // A puzzle has opts, want, a hint for each wrong answer, why, and rows of working: right (after a
  // right answer or Why?) and wrong[answer] (in red).
  const PICK = 'Tap one of the answers.';
  const s2 = P2.opp / P2.hyp, r4 = P4.rise / P4.run, s45 = sinD(45), r14 = P14.rise / P14.run;
  const o1 = [trim(1 / s2, 2), deg1(asinD(s2)), deg1(acosD(s2))];
  const o3 = [deg1(asinD(r4)), deg1(acosD(r4)), deg1(atanD(r4))];
  const o5 = [trim(cosD(60), 3), trim(sinD(60), 3), trim(cosD(45), 4)];
  const o7 = [trim(asinD(+trim(s45, 4)), 0) + '°', trim(1 / s45, 3), 'Error'];
  const o9 = [newt(F10 * sinD(TH10)), newt(F10 / cosD(TH10)), newt(F10 * cosD(TH10))];
  const o11 = [newt(W12 * sinD(AL12)), newt(W12 * cosD(AL12)), newt(W12 * tanD(AL12))];
  const o12 = [deg1(atanD(S13.floor / S13.wall)), deg1(atanD(S13.wall / S13.floor)), deg1(asinD(S13.wall / S13.floor))];
  const o13 = [newt(P14.W * sinD(13)), newt(P14.W * r14), newt(P14.W * sinD(AL14))];
  const STEPS = [
    { show: true, name: 'Back to the angle', pic: 'inv', vh: 244, dur: 4.4,
      text: 'Lesson 1 went from an angle to a side. Now run it backwards, from two sides to the angle. The 150 mm offset had 300 mm between its bends. The depth is the opposite side and the distance between bends is the hypotenuse, so `sin θ = 150 ÷ 300 = 0.5`. Which angle has a sine of 0.5? The calculator\'s `sin⁻¹` key, read *inverse sine*, answers that. `sin⁻¹ 0.5 = 30°`. An inverse takes the output and does the opposite to get back to the input. sin turns 30° into 0.5, and `sin⁻¹` turns 0.5 back into 30°.' },
    { kind: 'pick', name: 'Opposite and hypotenuse', pic: 'inv6', vh: 216, rowY: 152,
      opts: o1, want: o1[1],
      task: 'A right-angled triangle has 6 cm opposite `θ` and a 10 cm hypotenuse. What is `θ`?',
      why: 'Opposite and hypotenuse make the sine, so `sin θ = 6 ÷ 10 = 0.6`. The inverse sine undoes it, `sin⁻¹ 0.6 = 36.9°`. In degrees mode the calculator gives this from `sin⁻¹(6 ÷ 10)`.',
      hint: 'Not quite. Opposite ÷ hypotenuse is `sin θ`, and `sin⁻¹` turns it back into the angle.',
      hints: { [o1[0]]: 'Not quite. `1 ÷ 0.6 = 1.67` is one over the ratio, a number. `sin⁻¹` undoes sin and gives an angle.',
        [o1[2]]: 'Not quite. `cos⁻¹ 0.6` treats 6 ÷ 10 as adjacent ÷ hypotenuse. That gives the top corner\'s angle, not `θ`.' },
      right: ['sin θ = ' + P2.opp + ' ÷ ' + P2.hyp + ' = ' + trim(s2, 3), 'θ = sin⁻¹ ' + trim(s2, 3) + ' = ' + o1[1]],
      wrong: { [o1[0]]: '1 ÷ ' + trim(s2, 3) + ' = ' + o1[0] + ', a number, not an angle', [o1[2]]: 'cos⁻¹ ' + trim(s2, 3) + ' = ' + o1[2] + ', the top corner' } },
    { show: true, name: 'Which key, and a slope', pic: 'keys', vh: 250, dur: 4.4,
      text: 'Choose the key from the two sides you have, as you chose the ratio in lesson 1. Opposite and hypotenuse take `sin⁻¹`. Adjacent and hypotenuse take `cos⁻¹`. Opposite and adjacent take `tan⁻¹`. A slope is the last kind. Its gradient is rise ÷ run, as in Straight-line graphs. The rise is opposite the slope\'s angle and the run is next to it, so the gradient is `tan θ`. The line `y = 0.5x`, drawn with the same scale on both axes, climbs at `tan⁻¹ 0.5 = 26.6°`.' },
    { kind: 'pick', name: 'A tray\'s slope', pic: 'tray', vh: 238, rowY: 172,
      opts: o3, want: o3[2],
      task: 'A cable tray rises 1 m over a 2.5 m run. At what angle does it climb?',
      why: 'The rise is opposite the angle and the run is next to it, so they make the tangent. `tan θ = 1 ÷ 2.5 = 0.4`, and `tan⁻¹ 0.4 = 21.8°`.',
      hint: 'Not quite. The rise is opposite the angle and the run is next to it.',
      hints: { [o3[0]]: 'Not quite. `sin⁻¹ 0.4` needs the hypotenuse, and 2.5 m is the run along the bottom. Opposite and adjacent take `tan⁻¹`.',
        [o3[1]]: 'Not quite. `cos⁻¹ 0.4` treats the run as the hypotenuse. Rise ÷ run is opposite ÷ adjacent, so use `tan⁻¹`.' },
      right: ['tan θ = ' + P4.rise + ' ÷ ' + P4.run + ' = ' + trim(r4, 3), 'θ = tan⁻¹ ' + trim(r4, 3) + ' = ' + o3[2]],
      wrong: { [o3[0]]: 'sin⁻¹ ' + trim(r4, 3) + ' = ' + o3[0] + ', but 2.5 m is the run', [o3[1]]: 'cos⁻¹ ' + trim(r4, 3) + ' = ' + o3[1] + ', but 2.5 m is the run' } },
    { show: true, name: 'Two exact triangles', pic: 'exact', vh: 284, dur: 4.4,
      text: 'Two triangles give exact ratios with no calculator. Cut a square with sides of 1 from corner to corner. Each half has two sides of 1, a 45° angle and, by Pythagoras, a hypotenuse of `√2`. So `sin 45° = 1/√2`, which is 0.7071. Now cut an equilateral triangle with sides of 2 down the middle. Its 60° top angle splits into two of 30°, and its base into two of 1, so the height is `√(4 − 1) = √3`. So `sin 30° = 1/2` and `cos 30° = √3/2`, which is 0.866.' },
    { kind: 'pick', name: 'cos 60°', pic: 'eq60', vh: 258, rowY: 222,
      opts: o5, want: o5[0],
      task: 'Use the half equilateral triangle. What is `cos 60°`?',
      why: 'At the 60° corner the side next to it is the base, 1, and the hypotenuse is 2. So `cos 60° = 1/2 = 0.5`. It is the same as `sin 30°`, as sin and cos swap between 30° and 60°.',
      hint: 'Not quite. Cosine is adjacent ÷ hypotenuse.',
      hints: { [o5[1]]: 'Not quite. `√3` is opposite the 60° corner, so `√3/2 = 0.866` is `sin 60°`. Cosine takes the side next to the angle.',
        [o5[2]]: 'Not quite. 0.7071 is `cos 45°`, from the half square. This triangle\'s sides are 1, `√3` and 2.' },
      right: ['cos 60° = 1 ÷ 2 = ' + o5[0]],
      wrong: { [o5[1]]: '√3 ÷ 2 = ' + o5[1] + ' is sin 60°', [o5[2]]: '1 ÷ √2 = ' + o5[2] + ' is cos 45°' } },
    { show: true, name: 'An angle or a number', pic: 'cosec', vh: 286, dur: 4.4,
      text: 'On sin, cos and tan, ⁻¹ means undo. In Powers and roots `2⁻¹` meant `1 ÷ 2`, so it is worth saying twice. `sin⁻¹ 0.5` is an angle, 30°. `1 ÷ sin 30°` is a number, 2.0. One over a ratio has a name of its own. `1 ÷ sin θ` is the *cosecant*, written `cosec θ`, and it is lesson 1\'s conduit multiplier. Textbooks add the secant, `sec θ = 1 ÷ cos θ`, and the cotangent, `cot θ = 1 ÷ tan θ`.' },
    { kind: 'pick', name: 'The 45° multiplier', pic: 'mult45', vh: 222, rowY: 184,
      opts: o7, want: o7[1],
      task: 'The conduit multiplier for 45° bends is `1 ÷ sin 45°`, and `sin 45° = 0.7071`. What does it come to?',
      why: 'One over a ratio is a plain division, not an inverse key. `1 ÷ 0.7071 = 1.414`, the cosecant of 45°. The half square shows it too, hypotenuse ÷ opposite `= √2 ÷ 1`.',
      hint: 'Not quite. One over `sin 45°` is a division, not the `sin⁻¹` key.',
      hints: { [o7[0]]: 'Not quite. `sin⁻¹ 0.7071` undoes sin and gives the angle back, 45°. The multiplier is one over the ratio, a number.',
        [o7[2]]: 'Not quite. That keys `sin⁻¹ 45`. No sine is more than 1, so the calculator shows an error.' },
      right: ['1 ÷ sin 45° = 1 ÷ ' + trim(s45, 4) + ' = ' + o7[1]],
      wrong: { [o7[0]]: 'sin⁻¹ ' + trim(s45, 4) + ' = ' + o7[0] + ', an angle', [o7[2]]: 'sin⁻¹ 45 gives an error' } },
    { show: true, name: 'The arrow and its shadows', pic: 'arrow', vh: 286, dur: 4.4, live: ['tip', 'floor', 'wall'],
      text: 'A force has a size and a direction, so it is drawn as an arrow. Its length is the size and its tilt the direction. This 100 N arrow stands at 30° above the floor. Its shadows on the floor and on the wall are the short sides of a right-angled triangle, with the arrow as the hypotenuse. The floor shadow is next to `θ`, so it is `F cos θ`, 86.6 N. The wall shadow is opposite `θ`, so it is `F sin θ`, 50.0 N. These two parts are the force\'s *components*. Drag the tip to turn the arrow, or run it backwards.' },
    { kind: 'pick', name: 'A rope pull', pic: 'rope', vh: 262, rowY: 224,

      right: [F10 + ' × cos 40° = ' + F10 + ' × ' + trim(cosD(TH10), 3) + ' = ' + o9[2]],
      wrong: { [o9[0]]: F10 + ' × sin 40° = ' + o9[0] + ', the wall shadow', [o9[1]]: F10 + ' ÷ cos 40° = ' + o9[1] + ', longer than F' } },
    { show: true, name: 'On a slope', pic: 'slope', vh: 252, dur: 4.4, live: ['tilt'],
      text: 'Tilt the floor into a slope at angle `α` (alpha), and the same split works along the slope and square to it. A block\'s weight `W` still points straight down. Tilting the floor by `α` tilts the line square to it by `α` as well, so the weight is `α` away from that line. Its part into the slope is next to `α`, so it is `W cos α`. Its part down the slope is opposite, `W sin α`. For 500 N on 20°, that is 469.8 N and 171.0 N. Drag the top of the slope to tilt it.' },
    { kind: 'pick', name: 'Down the slope', pic: 'slope25', vh: 254, rowY: 216,
      opts: o11, want: o11[0],
      task: 'A 600 N weight rests on a 25° slope. How hard does it pull down the slope?',
      why: 'Down the slope is the side opposite `α`, so it is `W sin α`, `600 × sin 25° = 600 × 0.4226 = 253.6 N`. Into the slope is the side next to `α`, `W cos α`.',

    const A = P.A, B = P.B, C = P.C, th = P.th * RAD;
    ['base', 'up', 'hyp'].forEach((k) => {
      const L = lab[k];

      const w = Math.max.apply(null, lines.map((l) => tw(l.s, l.cls))), h = lines.length * LH;
      let cx, cy;
      if (k === 'base') { cx = K.clamp((A[0] + B[0]) / 2, w / 2 + 4, 336 - w / 2); cy = A[1] + 12 + h / 2; }
      else if (k === 'up') { cx = B[0] + 16 + w / 2; cy = B[1] + (C[1] - B[1]) * (L.at == null ? 0.5 : L.at); }
      else {
        const nx = -Math.sin(th), ny = -Math.cos(th), dd = 10 + Math.abs(nx) * w / 2 + Math.abs(ny) * h / 2;

  }
  // o: face (its arrival), glow {side: {a, c}}, wedge {A | C: {s, a, bad}}, ra, lab {side: {name, val, a, bad, at}}.
  function tri(f, o) {
    const P = triPts(f), A = P.A, B = P.B, C = P.C, c = Math.cos(f.th * RAD), s = Math.sin(f.th * RAD);
    REC.tri = P;
    const mk = Math.min(12, P.base / 3, P.up / 3);
    part(o.face == null ? 1 : o.face, 0, () => {
      add(K.svg('path', { class: 'face', d: poly([A, B, C], true) }));
      ['base', 'up', 'hyp'].forEach((k) => lineP('side', P.seg[k][0], P.seg[k][1], 1.5));
      pathP('mk', [[B[0] - mk, B[1]], [B[0] - mk, B[1] - mk], [B[0], B[1] - mk]], 1);
    });
    const glow = o.glow || {};
    ['base', 'up', 'hyp'].forEach((k) => {
      const gl = glow[k];
      if (!gl || !(gl.a > 0.001)) return;
      if (gl.a >= 0.5) REC.glowOn.push(k);
      part(gl.a, 0, () => add(K.svg('line', { class: 'side ' + gl.c, x1: R(P.seg[k][0][0]), y1: R(P.seg[k][0][1]), x2: R(P.seg[k][1][0]), y2: R(P.seg[k][1][1]) })));

    if (W.C) corner(C, [0, 1], [-c, s], Math.min(o.ra || 24, P.up * 0.35, P.base * 0.6), W.C, inside, []);

  }

  // ---------- the calculator: a display (what was keyed, DEG, the answer) and four keys ----------
  const INVKEYS = [['sin⁻¹', 'cos⁻¹'], ['tan⁻¹', '=']];
  function calcBox(x, y, w, o) {
    const a = o.a == null ? 1 : o.a, kw = (w - 28) / 2, kh = 26, rec = { tag: 'DEG', entry: '', result: null };
    part(a, 0, () => {

      text(x + 18, y + 52, 'DEG', 'ctag', 'start');
      o.keys.forEach((row, r) => row.forEach((k, c) => {
        const kx = x + 10 + c * (kw + 8), ky = y + 70 + r * 34, pa = (o.press || {})[r + ':' + c] || 0;
        rect('ckey', kx, ky, kw, kh, 6);
        if (pa > 0.001) part(pa, 0, () => rect('cpress', kx, ky, kw, kh, 6));
        text(kx + kw / 2, ky + 18, k, 'ckl');

    // What was keyed, as one label: each key's characters fade in as it is pressed.
    const ent = o.entry || [];
    if (ent.some((e) => e.a > 0)) part(a, 0, () => {
      const t = add(K.svg('text', { class: 'cin', x: R(x + 18), y: R(y + 30), 'text-anchor': 'start' }));
      ent.forEach((e) => t.appendChild(K.svg('tspan', { 'fill-opacity': K.clamp(e.a, 0, 1) }, e.s.replace(/ /g, ' '))));
    });
    ent.forEach((e) => { if (e.a >= 0.5) rec.entry += e.s; });
    if (o.result && o.result.a > 0) {
      part(o.result.a * a, 0, () => text(x + w - 18, y + 52, o.result.s, 'cout' + (o.result.bad ? ' bad' : ''), 'end'));
      if (o.result.a >= 0.5) rec.result = o.result.s;
    }
    REC.calcs.push(rec);
  }

  // ---------- an angle and a ratio, with sin one way and sin⁻¹ back ----------
  function swapPic(y0, ang, ratio, a, ka, kb) {
    part(a, 0, () => { rect('sbox', 24, y0, 80, 30, 8); rect('sbox', 236, y0, 80, 30, 8); });
    tagAt(64, y0 + 21, ang, 'middle', a); tagAt(276, y0 + 21, ratio, 'middle', a);
    tagAt(64, y0 + 50, 'an angle', 'middle', a, 'key'); tagAt(276, y0 + 50, 'a ratio', 'middle', a, 'key');

  }

  // ---------- rows of working under a picture ----------
  function drawRows(y0, rows) {
    rows.forEach((r, m) => {
      REC.boxes.push(boxOf(12, y0 + 26 * m, r.s, 'te', 'start'));

  // ---------- the arrow and its shadows: a floor, a wall, and a force arrow from the corner ----------
  // f: {O (the corner), k (units per newton), top (the wall's top), end (the floor's end)}.
  // s: {F, th} turned by its tip, or {fl, wa} run backwards from the two shadows.
  const ARR8 = { O: [74, 230], k: 2, top: 28, end: 330 };

    keyDash(96, 16, 'light, straight down and across', A1(o.room));
    part(A1(o.room), 0, () => {
      rect('band', O[0] - 8, f.top, 8, O[1] + 8 - f.top);
      rect('band', O[0], O[1], f.end - O[0], 8);
      lineP('wallf', [O[0], f.top], O, 1);
      lineP('wallf', O, [f.end, O[1]], 1);
    });
    part(A1(o.face), 0, () => {
      if (fl * k > 1 && wa * k > 1) add(K.svg('path', { class: 'face', d: poly([O, foot, T], true) }));
      if (wa * k > 0.5) lineP('ghost', T, foot, 1);
      if (fl * k > 0.5) lineP('ghost', T, side, 1);
      const mk = Math.min(10, fl * k / 3, wa * k / 3);
      if (mk > 4) pathP('mk', [[foot[0] - mk, foot[1]], [foot[0] - mk, foot[1] - mk], [foot[0], foot[1] - mk]], 1);
      lineP('shad', [O[0], O[1] - 3.5], [T[0], O[1] - 3.5], 4);
      lineP('shad', [O[0] + 3.5, O[1]], [O[0] + 3.5, T[1]], 4);
    });
    const glow = o.glow || {};
    if (glow.floor && glow.floor.a > 0.001) part(glow.floor.a, 0, () => add(K.svg('line', { class: 'shad ' + glow.floor.c, x1: R(O[0]), y1: R(O[1] - 3.5), x2: R(T[0]), y2: R(O[1] - 3.5) })));
    if (glow.wall && glow.wall.a > 0.001) part(glow.wall.a, 0, () => add(K.svg('line', { class: 'shad ' + glow.wall.c, x1: R(O[0] + 3.5), y1: R(O[1]), x2: R(O[0] + 3.5), y2: R(T[1]) })));
    REC.arrGlow = Object.keys(glow).filter((g) => glow[g] && glow[g].a >= 0.5).map((g) => g + ':' + glow[g].c).sort();
    part(A1(o.arrow), 0, () => arrowLine(O, T, 'force'));
    const v = [cosD(th), -sinD(th)];
    if (o.wedge) corner(O, [1, 0], v, Math.min(26, fl * k * 0.45, F * k * 0.4), o.wedge, insideTriFn(O, foot, T, 8), []);
    if (o.wedgeWall) corner(O, [0, -1], v, Math.min(26, wa * k * 0.45, F * k * 0.4), o.wedgeWall, insideTriFn(O, side, T, 8), []);

    });
    if (lab.wall) placeLines('wall', lab.wall, (w, h) => {

  // ---------- the block on a slope: its weight straight down, split along the slope and square to it ----------
  // f: {C (where the block touches), al (degrees), W (newtons), kw (units per newton), a, b (slope
  // either side of C), bw, bh (the block)}.
  function slopeScene(f, o) {
    const al = f.al, ca = cosD(al), sa = sinD(al), C = f.C, A1 = (v) => (v == null ? 1 : v);
    const u = [ca, -sa], nOut = [-sa, -ca], nIn = [sa, ca], dn = [-ca, sa];

    const M = mv(G, nIn, Wc * f.kw), E = mv(G, dn, Ws * f.kw), T = [G[0], G[1] + f.W * f.kw];
    REC.slope = { C, al, P0, P1, Q, G, M, E, T, kw: f.kw, W: f.W };
    part(A1(o.room), 0, () => {
      if (P0[1] - P1[1] > 0.5) add(K.svg('path', { class: 'ground', d: poly([P0, P1, Q], true) }));

      lineP('surf', P0, P1, 1.5);
      const K0 = mv(C, u, -f.bw / 2), K1 = mv(C, u, f.bw / 2);

    });

      if (Ws * f.kw > 0.5) lineP('ghost', T, M, 1);
      if (Ws * f.kw > 0.5 && Wc * f.kw > 0.5) lineP('ghost', T, E, 1);

      lineP('shad', G, E, 4);
    });

    if (glow.into && glow.into.a > 0.001) part(glow.into.a, 0, () => add(K.svg('line', { class: 'shad ' + glow.into.c, x1: R(G[0]), y1: R(G[1]), x2: R(M[0]), y2: R(M[1]) })));

      REC.handles.push({ id, x: P1[0], y: P1[1] });
    });
    const lab = o.lab || {};
    if (lab.run) placeLines('run', lab.run, (w, h) => [[(P0[0] + Q[0]) / 2, P0[1] + 12 + h / 2], [(P0[0] + Q[0]) / 2 - 40, P0[1] + 12 + h / 2]]);
    if (lab.rise) placeLines('rise', lab.rise, (w, h) => [[Q[0] + 14 + w / 2, (Q[1] + P1[1]) / 2]]);
    if (lab.W) placeLines('W', lab.W, (w, h) => [[T[0], T[1] + 8 + h / 2], [T[0] + w / 2 + 14, T[1]], [T[0] - w / 2 - 14, T[1]],
      [T[0] + w / 2 + 14, T[1] - 20], [T[0] - w / 2 - 14, T[1] - 20], [T[0], T[1] + 24 + h / 2]]);

  // The arrow's angle now: Dan's, else the demonstration's (lying on the floor, then turning up to 30°).
  const arrowTh = (st) => (st.th != null ? st.th : TH9 * when('demo', 1.8, 1.6));
  const slopeAl = (st) => (st.al != null ? st.al : AL11 * when('demo', 1.6, 1.6));

  // ---------- each step's picture; each returns it in words ----------
  const PIC = {
    inv(d, st) {
      const dm = (t, u) => when('demo', t, u), kp = (t) => dm(t, 0.2) - dm(t + 0.3, 0.25), th = asinD(D1 / B1);
      tri({ th, hyp: B1, k: 0.4, ax: 16, ay: 118 }, { face: dm(0.4), ra: 22,
        wedge: { A: { s: 'θ', a: dm(0.4) } },
        lab: { up: { name: 'opposite', val: mm(D1), a: dm(0.8) }, hyp: { name: 'hypotenuse', val: mm(B1), a: dm(1.1) }, base: { name: 'adjacent', a: dm(1.3) } } });
      drawRows(166, [{ s: 'sin θ = ' + D1 + ' ÷ ' + B1 + ' = ' + trim(D1 / B1, 3), a: dm(1.6) }]);

    },
    inv6(d, st) {
      const ok = ansOf(st), w = wrongOf(st) && !ok, an = (t) => when('answer', t), th = asinD(s2);
      const wc = w && st.pick === d.opts[2], wn = w && st.pick === d.opts[0];
      tri({ th, hyp: P2.hyp, k: 12, ax: 16, ay: 110 }, { ra: 22,
        wedge: { A: { s: ok ? deg1(th) : 'θ', a: ok ? an(0.3) : 1 }, C: wc ? { s: deg1(acosD(s2)), bad: true, a: an(0.1), arcA: an(0.1) } : null },
        glow: ok ? { up: { a: an(0.3), c: 'hl' }, hyp: { a: an(0.3), c: 'hl' } } : {},
        lab: { up: { name: 'opposite', val: cm(P2.opp) }, hyp: { name: 'hypotenuse', val: cm(P2.hyp) }, base: { name: 'adjacent' } } });
      const ent = ok ? 'sin⁻¹(6 ÷ 10)' : wc ? 'cos⁻¹(6 ÷ 10)' : wn ? '1 ÷ ' + trim(s2, 3) : '';
      const res = ok ? fix(th, 1) : wc ? fix(acosD(s2), 1) : wn ? trim(1 / s2, 2) : '?';

    },
    keys(d, st) {

      const ps = pulse(0.9), pc = pulse(1.7), pt3 = dm(2.5, 0.35), O = [40, 196], sc = 80, th = atanD(M3), ga = dm(0.4);
      part(ga, 0, () => {

        for (let k = 1; k <= 6; k++) add(K.svg('line', { class: 'tick', x1: 40 + 40 * k, y1: 196, x2: 40 + 40 * k, y2: 201 }));
        for (let k = 1; k <= 3; k++) add(K.svg('line', { class: 'tick', x1: 35, y1: 196 - 40 * k, x2: 40, y2: 196 - 40 * k }));

        glow: { up: { a: Math.max(ps, pt3), c: 'hl' }, hyp: { a: Math.max(ps, pc), c: 'hl' }, base: { a: Math.max(pc, pt3), c: 'hl' } },
        lab: { base: { name: 'adjacent', val: 'run', a: dm(0.6) }, up: { name: 'opposite', val: 'rise', a: dm(0.6) }, hyp: { name: 'hypotenuse', a: dm(0.6) } } });
      tagAt(12, 22, 'rise ÷ run = ' + trim(M3, 3), 'start', dm(3.0));
      tagAt(12, 46, 'θ = tan⁻¹ ' + trim(M3, 3) + ' = ' + deg1(th), 'start', dm(3.4));
      TILES = [
        { rn: 'sin⁻¹', rs: 'opposite and hypotenuse', a: dm(0.9), hl: ps > 0.5 },

      if (k >= opts.length) return;

    fb.className = 'fb' + (right ? ' right' : st.res === 'wrong' ? ' wrong' : '');

    why.hidden = d.show || !st.why;
    write(why, d.show ? '' : d.why);
    whyBtn.setLabel(st.why ? 'Hide why' : 'Why?');

    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !right);
    nextBtn.setLabel(i === STEPS.length - 1 ? 'Finish' : 'Continue');
    nav.hidden = backBtn.el.hidden && nextBtn.el.hidden;
  });

  // ---------- known answers, worked out by hand ----------
  const DO = STEPS.map((d, i) => i).filter((i) => !STEPS[i].show);
  const idx = (pic) => STEPS.findIndex((d) => d.pic === pic);
  // Step i painted in state st (motion m, at time tAt, finished if none), fn reading what it drew
  // before the page is put back.
  function withState(i, st, m, fn, tAt) {
    const keepS = S[i], keepT = T, keepM = MODE;
    S[i] = st; T = tAt == null ? Infinity : tAt; MODE = m || (STEPS[i].show ? 'demo' : 'answer');
    latest = 0; earliest = Infinity;
    try { paint(i); return fn(); } finally { S[i] = keepS; T = keepT; MODE = keepM; paint(); }
  }
  const drawn = (i, st, m) => withState(i, st, m, () => ({ texts: Array.from(art.querySelectorAll('text')).map((n) => n.textContent), rec: REC }));
  const solvedSt = (i) => stOf({ pick: STEPS[i].want, res: 'right' });
  const wrongSt = (i, o) => stOf({ pick: o, res: 'wrong' });
  const BACKS = [];
  [SMIN, 30, 60, F9 * cosD(TH9), SMAX].forEach((fl) => [SMIN, 30, F9 * sinD(TH9), SMAX].forEach((wa) => BACKS.push([fl, wa])));
  // Every state a step can be seen in.
  function statesOf(i) {
    const d = STEPS[i], out = [];
    if (d.show) {
      out.push([blank(), 'demo']);
      if (d.pic === 'arrow') {
        [0, 1, 5, 10, 30, 45, 60, 75, 85, 89, 90].forEach((th) => out.push([stOf({ th }), 'demo']));
        BACKS.forEach((b) => out.push([stOf({ back: true, fl: b[0], wa: b[1] }), 'flip']));
      }
      if (d.pic === 'slope') [0, 1, 5, 10, 15, 20, 25, 30, 35, 39, 40].forEach((al) => out.push([stOf({ al }), 'demo']));
    } else {
      out.push([blank(), 'answer'], [solvedSt(i), 'answer'], [stOf({ why: true }), 'answer']);
      d.opts.filter((o) => o !== d.want).forEach((o) => out.push([wrongSt(i, o), 'answer'], [stOf({ pick: o, res: 'wrong', why: true }), 'answer']));
    }
    return out;
  }
  // What crowds the labels in the picture now: labels over labels, lines or handles, or off the edge.
  function crowding(i) {
    const bad = [], boxes = [];
    art.querySelectorAll('text').forEach((t) => {
      let b = null;
      try { b = t.getBBox(); } catch (e) { b = null; }
      if (!b || !(b.width > 0) || !(b.height > 0)) return;
      const sh = b.height * 0.2;
      boxes.push({ s: t.textContent, x: b.x, y: b.y + sh, w: b.width, h: b.height - 2 * sh, calc: /^c/.test(t.getAttribute('class') || '') });
    });
    boxes.forEach((a, m) => {
      if (a.x < 1 || a.x + a.w > 339 || a.y < 0 || a.y + a.h > STEPS[i].vh) bad.push('"' + a.s + '" off the edge');
      boxes.slice(m + 1).forEach((b) => {
        const ix = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x), iy = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y);
        if (ix > 1 && iy > 1) bad.push('"' + a.s + '" on "' + b.s + '"');
      });
      if (a.calc) return;
      REC.handles.forEach((h) => { const nx = K.clamp(h.x, a.x, a.x + a.w), ny = K.clamp(h.y, a.y, a.y + a.h); if (Math.hypot(nx - h.x, ny - h.y) < 12) bad.push('"' + a.s + '" on a handle'); });
      REC.segs.forEach((g) => { if (segHits(g.p, g.q, { x: a.x - g.pad, y: a.y - g.pad, w: a.w + 2 * g.pad, h: a.h + 2 * g.pad })) bad.push('"' + a.s + '" crossed by a line'); });
    });
    return bad;
  }

  K.check('An inverse function takes the output and does the opposite to get back to the input: on the first screen sin takes 30° to 0.5, the calculator keys sin⁻¹ of the drawn 150 ÷ 300 = 0.5 and gives back 30, the angle the triangle is drawn at, and sin⁻¹ undoes sin at every whole angle from 0° to 90°', () => {
    for (let a = 0; a <= 90; a++) if (!K.near(asinD(sinD(a)), a, 1e-6)) return false;
    const g = drawn(0, blank(), 'demo'), c = g.rec.calcs[0], P = g.rec.tri, sw = g.rec.swap;
    return c.entry === 'sin⁻¹ 0.5' && c.result === '30' && K.near(P.up / P.H, D1 / B1, 1e-9) && K.near(asinD(P.up / P.H), +c.result, 1e-9) && K.near(P.th, +c.result, 1e-9) &&
      sw.fwd.from === '30°' && sw.fwd.to === '0.5' && sw.fwd.key === 'sin' && sw.back.from === '0.5' && sw.back.to === '30°' && sw.back.key === 'sin⁻¹' &&
      g.texts.indexOf('sin θ = 150 ÷ 300 = 0.5') >= 0;
  }, { source: INVERSE });
  K.check('When you bend an offset the conduit forms a right triangle, the offset depth the vertical (opposite) side and the distance between bends the diagonal (hypotenuse): the first screen marks 150 mm on the upright opposite side and 300 mm on the diagonal hypotenuse, drawn to one scale with a square corner', () => {
    const g = drawn(0, blank(), 'demo'), P = g.rec.tri, L = g.rec.lab;
    return L.up === 'opposite 150 mm' && L.hyp === 'hypotenuse 300 mm' && K.near(P.up / P.k, D1, 1e-6) && K.near(P.H / P.k, B1, 1e-6) &&
      K.near(P.B[0], P.C[0], 1e-9) && K.near(P.A[1], P.B[1], 1e-9);
  }, { source: CONDUIT });
  K.check('Sine is the ratio of the opposite side to the hypotenuse, cosine the adjacent side to the hypotenuse, and tangent the opposite side to the adjacent side: on the keys screen sin⁻¹, cos⁻¹ and tan⁻¹ each light exactly that pair of sides, and every angle puzzle\'s answer is the inverse of that ratio of its drawn sides', () => {
    const i = idx('keys');
    const lit = (t) => withState(i, blank(), 'demo', () => REC.glowOn.slice().sort().join() + '|' + REC.tiles.filter((x) => x.hl).map((x) => x.rn).join(), t);
    if (lit(1.25) !== 'hyp,up|sin⁻¹' || lit(2.05) !== 'base,hyp|cos⁻¹' || lit(Infinity) !== 'base,up|tan⁻¹') return false;
    const p1 = drawn(idx('inv6'), solvedSt(idx('inv6')), 'answer').rec.tri, p3 = drawn(idx('tray'), solvedSt(idx('tray')), 'answer').rec.tri;
    const p5 = drawn(idx('eq60'), solvedSt(idx('eq60')), 'answer').rec.tri, a12 = drawn(idx('back40'), solvedSt(idx('back40')), 'answer').rec.arr;
    return STEPS[idx('inv6')].want === deg1(asinD(p1.up / p1.H)) && STEPS[idx('tray')].want === deg1(atanD(p3.up / p3.base)) &&
      STEPS[idx('eq60')].want === trim(p5.base / p5.H, 3) && STEPS[idx('back40')].want === deg1(atanD(a12.wallPx / a12.floorPx));
  }, { source: OPENSTAX });
  K.check('Scientific calculators should be in degrees mode for trigonometry: every calculator drawn, on every screen and in every answer state, is marked DEG, and its inverse key gives degrees, sin⁻¹ 0.5 = 30 where radians would give 0.524', () => {
    const all = [];
    ['inv', 'inv6', 'cosec', 'mult45'].forEach((pic) => { const i = idx(pic); statesOf(i).forEach((s) => withState(i, s[0], s[1], () => REC.calcs.forEach((c) => all.push(c)))); });
    const c0 = drawn(0, blank(), 'demo').rec.calcs[0], c1 = drawn(idx('inv6'), solvedSt(idx('inv6')), 'answer').rec.calcs[0];
    return all.length >= 10 && all.every((c) => c.tag === 'DEG') && c0.result === trim(asinD(0.5), 0) && trim(Math.asin(0.5), 3) === '0.524' && c0.result !== '0.524' &&
      c1.result === fix(asinD(s2), 1);
  }, { source: DEGREES });
  K.check('For 30 degrees sin(30) = 0.5, so the cosecant is 1/0.5 = 2.0; for 45 degrees sin(45) = 0.7071, so the cosecant is 1/0.7071 = 1.414: the calculators show 1 ÷ sin 30 = 2 and 1 ÷ sin 45 = 1.414, worked out as one over sin, beside sin⁻¹ 0.5 = 30, an angle', () => {
    const g = drawn(idx('cosec'), blank(), 'demo'), c = g.rec.calcs, m = drawn(idx('mult45'), solvedSt(idx('mult45')), 'answer').rec.calcs[0];
    return c[0].entry === 'sin⁻¹ 0.5' && c[0].result === '30' && c[1].entry === '1 ÷ sin 30' && c[1].result === trim(1 / sinD(30), 3) && c[1].result === '2' &&
      g.texts.indexOf('1 ÷ sin 30° = 2.0') >= 0 && g.texts.indexOf('sin⁻¹ 0.5 = 30°') >= 0 && trim(sinD(30), 3) === '0.5' && trim(s45, 4) === '0.7071' &&
      m.entry === '1 ÷ sin 45' && m.result === '1.414' && m.result === trim(1 / s45, 3);
  }, { source: CONDUIT });
  K.check('A 100 N force at 30 degrees has Fx = 100 N • cos 30° = 86.6 N and Fy = 100 N • sin 30° = 50.0 N: the arrow screen opens at 100 N and 30° with exactly these on its floor and wall shadows, each measured off the drawn arrow', () => {
    const r = drawn(idx('arrow'), blank(), 'demo').rec, A = r.arr;
    return A.F === F9 && K.near(A.th, TH9, 1e-9) && r.lab.floor === 'F cos θ 86.6 N' && r.lab.wall === 'F sin θ 50.0 N' &&
      K.near((A.T[0] - A.O[0]) / A.k, 86.6025, 1e-3) && K.near((A.O[1] - A.T[1]) / A.k, 50, 1e-9) && r.tags.indexOf('θ = 30°') >= 0 && r.tags.indexOf('F = 100 N') >= 0;
  }, { source: PHYS });
  K.check('To find the vertical component of a force the sine function can be used, and for the horizontal component the cosine: at every whole angle from 0° to 90° the wall shadow is the drawn arrow\'s height and reads F sin θ, the floor shadow its width and reads F cos θ, and turning the arrow up shortens the floor shadow and lengthens the wall shadow while the arrow keeps its length', () => {
    const i = idx('arrow');
    let prev = null;
    for (let th = 0; th <= 90; th++) {
      const r = drawn(i, stOf({ th }), 'demo').rec, A = r.arr;
      if (!K.near(A.floorPx, A.T[0] - A.O[0], 1e-9) || !K.near(A.wallPx, A.O[1] - A.T[1], 1e-9)) return false;
      if (!K.near(Math.hypot(A.floorPx, A.wallPx), F9 * A.k, 1e-6)) return false;
      if (r.lab.floor !== 'F cos θ ' + newt(F9 * cosD(th)) || r.lab.wall !== 'F sin θ ' + newt(F9 * sinD(th))) return false;
      if (prev && !(A.floorPx < prev.floorPx && A.wallPx > prev.wallPx)) return false;
      prev = A;
    }
    return true;
  }, { source: PHYS });
  K.check('Resolve forces in horizontal and vertical components restricted to the first quadrant: dragging the arrow\'s tip anywhere turns it no further than 0° or 90°, so neither shadow is ever negative, and run backwards each shadow stays between 5 N and 100 N', () => {
    const O = ARR8.O, angs = [];
    for (let x = -100; x <= 400; x += 25) for (let y = -60; y <= 330; y += 25) angs.push(tipAngle(O, { x, y }));
    const sh = [-50, 0, 3, 50, 99.6, 140].map(shadowOf);
    return angs.every((a) => a >= 0 && a <= 90 && F9 * cosD(a) >= -1e-9 && F9 * sinD(a) >= 0) && angs.indexOf(0) >= 0 && angs.indexOf(90) >= 0 &&
      sh.every((v) => v >= SMIN && v <= SMAX);
  }, { source: SYLLABUS });
  K.check('Run backwards, the shadows give the arrow back: for every pair of shadows, the arrow is drawn from the corner to the point they mark, with the handles on the shadows\' ends, θ reads tan⁻¹(wall ÷ floor) and F reads √(floor² + wall²); switching from 100 N at 30° gives back 30.0° and 100.0 N', () => {
    const i = idx('arrow');
    const ok = BACKS.every((b) => {
      const r = drawn(i, stOf({ back: true, fl: b[0], wa: b[1] }), 'flip').rec, A = r.arr, tl = r.tiles, hs = r.handles;
      return K.near(A.T[0] - A.O[0], b[0] * A.k, 1e-9) && K.near(A.O[1] - A.T[1], b[1] * A.k, 1e-9) &&
        tl[0].rv === deg1(atanD(b[1] / b[0])) && tl[1].rv === newt(Math.hypot(b[0], b[1])) &&
        r.lab.floor === 'F cos θ ' + newt(b[0]) && r.lab.wall === 'F sin θ ' + newt(b[1]) &&
        hs.some((h) => h.id === 'floor' && h.x === A.T[0] && h.y === A.O[1]) && hs.some((h) => h.id === 'wall' && h.x === A.O[0] && h.y === A.T[1]);
    });
    const r = drawn(i, stOf({ back: true, fl: F9 * cosD(TH9), wa: F9 * sinD(TH9) }), 'flip').rec;
    return ok && r.tiles[0].rv === '30.0°' && r.tiles[1].rv === '100.0 N' && r.tiles[0].rs === 'tan⁻¹(50.0 ÷ 86.6)';
  });
  K.check('On the slope the weight W points straight down and its parts lie along the slope and square to it: at every whole tilt from 0° to 40° the part down the slope is W sin α and the part into it W cos α, both measured off the drawing, the weight is α away from the line square to the slope, and 500 N on 20° gives 171.0 N and 469.8 N', () => {
    const i = idx('slope');
    for (let al = 0; al <= AMAX; al++) {
      const r = drawn(i, stOf({ al }), 'demo').rec, s = r.slope;
      const down = Math.hypot(s.E[0] - s.G[0], s.E[1] - s.G[1]) / s.kw, iv = [s.M[0] - s.G[0], s.M[1] - s.G[1]], into = Math.hypot(iv[0], iv[1]) / s.kw;
      const sv = [s.P1[0] - s.P0[0], s.P1[1] - s.P0[1]], ev = [s.E[0] - s.G[0], s.E[1] - s.G[1]];
      if (!K.near(down, W11 * sinD(al), 1e-6) || !K.near(into, W11 * cosD(al), 1e-6)) return false;
      if (!K.near(sv[0] * iv[0] + sv[1] * iv[1], 0, 1e-6) || !K.near(sv[0] * ev[1] - sv[1] * ev[0], 0, 1e-6)) return false;
      if (!K.near(s.T[0], s.G[0], 1e-9) || !K.near(Math.acos(K.clamp(iv[1] / Math.hypot(iv[0], iv[1]), -1, 1)) / RAD, al, 1e-6)) return false;
      if (!K.near(Math.atan2(s.P0[1] - s.P1[1], s.P1[0] - s.P0[0]) / RAD, al, 1e-6)) return false;
      if (r.lab.down !== 'W sin α ' + newt(W11 * sinD(al)) || r.lab.into !== 'W cos α ' + newt(W11 * cosD(al))) return false;
    }
    const r = drawn(i, blank(), 'demo').rec;
    return r.lab.down === 'W sin α 171.0 N' && r.lab.into === 'W cos α 469.8 N' && r.tags.indexOf('α = 20°') >= 0;
  });
  K.check('The line y = 0.5x is drawn with the same scale on both axes: the ticks on both axes are the same distance apart, the line climbs 0.5 for each 1 across, the triangle under it has rise ÷ run = 0.5 measured off the drawing, and its angle is tan⁻¹ 0.5 = 26.6°', () => {
    const g = drawn(idx('keys'), blank(), 'demo'), G = g.rec.graph, P = g.rec.tri;
    return G.xTick === G.yTick && K.near((G.O[1] - G.end[1]) / (G.end[0] - G.O[0]), M3, 1e-9) && K.near(P.up / P.base, M3, 1e-9) &&
      K.near(P.A[0], G.O[0], 1e-9) && K.near(P.A[1], G.O[1], 1e-9) && g.texts.indexOf('θ = tan⁻¹ 0.5 = 26.6°') >= 0 && deg1(atanD(P.up / P.base)) === '26.6°';
  });
  K.check('Every worked number matches the lesson: 0.5 and 30°; 36.9°, 1.67 and 53.1°; 26.6°; 21.8°, 23.6° and 66.4°; 0.7071, 1.732, 0.5 and 0.866; 0.5, 0.866 and 0.7071; 2.0; 1.414 and 45°; 86.6 N and 50.0 N; 153.2, 128.6 and 261.1 N; 171.0 and 469.8 N; 253.6, 543.8 and 279.8 N; 24.0°, 66.0° and 26.4°; 13.4957…°, 140.0, 135.0 and 144.0 N', () => {
    const same = (a, b) => a.length === b.length && a.every((v, k) => v === b[k]);
    const t0 = drawn(0, blank(), 'demo'), t4 = drawn(idx('exact'), blank(), 'demo').texts, t6 = drawn(idx('cosec'), blank(), 'demo').texts;
    const t8 = drawn(idx('arrow'), blank(), 'demo').rec, t10 = drawn(idx('slope'), blank(), 'demo').rec;
    return t0.texts.indexOf('sin θ = 150 ÷ 300 = 0.5') >= 0 && t0.rec.calcs[0].result === '30' &&
      same(o1, ['1.67', '36.9°', '53.1°']) && same(o3, ['23.6°', '66.4°', '21.8°']) &&
      ['sin 45° = 1/√2 = 0.7071', 'height = √(4 − 1) = √3 = 1.732', 'sin 30° = 1/2 = 0.5', 'cos 30° = √3/2 = 0.866'].every((s) => t4.indexOf(s) >= 0) &&
      same(o5, ['0.5', '0.866', '0.7071']) && t6.indexOf('1 ÷ sin 30° = 2.0') >= 0 && same(o7, ['45°', '1.414', 'Error']) &&
      t8.lab.floor === 'F cos θ 86.6 N' && t8.lab.wall === 'F sin θ 50.0 N' && same(o9, ['128.6 N', '261.1 N', '153.2 N']) &&
      t10.lab.down === 'W sin α 171.0 N' && t10.lab.into === 'W cos α 469.8 N' && same(o11, ['253.6 N', '543.8 N', '279.8 N']) &&
      same(o12, ['66.0°', '24.0°', '26.4°']) && same(o13, ['135.0 N', '144.0 N', '140.0 N']) && AL14S === '13.4957…' && trim(cosD(TH10), 3) === '0.766' && trim(sinD(AL12), 4) === '0.4226';
  });
  K.check('Each puzzle accepts only its right answer, every wrong answer has its own hint and its own red row of working, and before an answer nothing in the picture shows the answer', () =>
    DO.every((i) => {
      const d = STEPS[i];
      if (d.opts.length !== 3 || d.opts.indexOf(d.want) < 0 || !d.opts.every((o) => isRight(i, stOf({ pick: o })) === (o === d.want))) return false;
      const wrongs = d.opts.filter((o) => o !== d.want);
      if (!wrongs.every((o) => d.hints[o] && d.wrong[o] && wrongs.every((p) => p === o || d.hints[p] !== d.hints[o]))) return false;
      const b = drawn(i, blank(), 'answer'), s = drawn(i, solvedSt(i), 'answer');
      if (b.rec.rows.length || b.texts.some((t) => t.indexOf(d.want) >= 0) || b.rec.calcs.some((c) => d.want.indexOf(c.result) === 0 && c.result !== '?')) return false;
      if (!(s.rec.rows.length === d.right.length && s.rec.rows.every((r) => !r.bad) && s.texts.join(' ').indexOf(d.want) >= 0)) return false;
      return wrongs.every((o) => { const r = drawn(i, wrongSt(i, o), 'answer').rec.rows; return r.length === 1 && r[0].bad && r[0].s === d.wrong[o]; });
    }));
  K.check('No label sits on another label, a line or a handle, or runs off the picture, on any screen in any state: puzzles answered right, wrong or with Why? open, the arrow at every angle and run backwards at its smallest and largest shadows, the slope at every tilt', () =>
    STEPS.every((d, i) => statesOf(i).every((s) => withState(i, s[0], s[1], () => crowding(i).length === 0))));
  K.check('Every demonstration has finished within 4.5 s of its screen opening, none starting before the 0.35 s screen fade ends; each answer, Why? and switch has settled within 1.8 s', () =>
    STEPS.every((d, i) => {
      const timed = (st, m) => withState(i, st, m, () => [latest, earliest]);
      if (d.show) {
        const t = timed(blank(), 'demo');
        if (!(t[0] <= d.dur + 1e-9 && d.dur <= 4.5 && d.dur >= 3 && t[1] >= FADE)) return false;
        if (d.pic === 'arrow' && timed(stOf({ back: true, fl: 86.6, wa: 50 }), 'flip')[0] > FLIP + 1e-9) return false;
        return true;
      }
      return statesOf(i).every((s) => timed(s[0], s[1])[0] <= ANS + 1e-9);
    }));

  K.ready();
</script>
