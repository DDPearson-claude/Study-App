<p class="lead">Lesson 3's turning arm on a circle, its tip's height carried across and drawn against time as a wave, then the slope's graph and mixed puzzles.</p>

<script>
  const el = (id) => document.getElementById(id);
  // ---------- numbers (pure, so the checks can test them) ----------
  const PI = Math.PI, TAU = 2 * Math.PI, DEG = 180 / Math.PI, RAD = Math.PI / 180;
  const sinD = (a) => Math.sin(a * RAD), cosD = (a) => Math.cos(a * RAD);
  const neg = (s) => String(s).replace(/^-/, '−');
  // v rounded to dp places with trailing zeros dropped: 0.5, 2.618, 20.
  function trim(v, dp) {
    const f = Math.pow(10, dp);
    let s = (Math.round(v * f) / f).toFixed(dp);
    if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
    if (s === '-0') s = '0';
    return neg(s);
  }
  // v to exactly dp places: 314.16, 3.46.
  function fix(v, dp) {
    const f = Math.pow(10, dp);
    let s = (Math.round(v * f) / f).toFixed(dp);
    if (/^-0(\.0*)?$/.test(s)) s = s.slice(1);
    return neg(s);
  }
  // Three significant figures, as the lesson writes its times: 1.67, 8.33, 13.1, 20.
  function sig3(v) {
    const a = Math.abs(v);
    if (!(a > 1e-12)) return '0';
    return trim(v, K.clamp(2 - Math.floor(Math.log10(a) + 1e-12), 0, 3));
  }
  const msS = (sec) => sig3(sec * 1000) + ' ms';
  const timeS = (sec) => (sec < 0.1 - 1e-12 ? msS(sec) : trim(sec, 2) + ' s');
  const hS = (v) => trim(v, 2);
  const PIN = { 45: 'π/4', 90: 'π/2', 135: '3π/4', 180: 'π', 225: '5π/4', 270: '3π/2', 315: '7π/4', 360: '2π' };
  const QN = ['', '¼', '½', '¾', '1'];
  const pE = (C, r, a) => [C[0] + r * Math.cos(a), C[1] - r * Math.sin(a)];
  const lenOf = (p, q) => Math.hypot(p[0] - q[0], p[1] - q[1]);
  const periodRow = (f) => 'period = 1 ÷ ' + f + ' = ' + (1 / f < 0.1 - 1e-12 ? trim(1 / f, 4) + ' s = ' + msS(1 / f) : trim(1 / f, 2) + ' s');

  // The lesson's example values, and the answers each puzzle offers (worked out here, never typed in).
  const o1 = [trim(sinD(180), 3), trim(cosD(180), 3), trim(sinD(90), 3)];        // height, across shadow, quarter-turn height
  const L4 = 4, A4 = 30;
  const o3 = [fix(L4 * cosD(A4), 2), trim(L4 * sinD(A4), 2), trim(sinD(A4), 2)];
  const P6 = 10, P6s = P6 / 1000, F6 = 1 / P6s;                                    // a wave that repeats every 10 ms
  const o5 = [trim(P6, 0) + ' Hz', trim(P6s, 2) + ' Hz', trim(F6, 0) + ' Hz'];
  const E8 = 10, W8 = 100 * PI, F8 = W8 / TAU;                                     // v = 10 sin(100πt)
  const o7 = [trim(F8, 0) + ' Hz', fix(W8, 1) + ' Hz', trim(W8 / PI, 0) + ' Hz'];
  const o9 = ['A slid right ¼ period', 'A slid left ¼ period', 'A, twice as tall'];        // arm B started π/2 behind
  const E11 = 10, F11 = 50, W11 = TAU * F11, H11 = 5, H12 = -8.3;                  // 10 sin(100πt) and its level lines
  const s12 = Math.asin(H12 / E11);                                                 // −0.979
  const o11 = [fix(-s12 / W11 * 1000, 1) + ' ms', msS((PI - s12) / W11), msS((TAU + s12) / W11)];   // sign dropped, first, second
  const A16 = 135, o15 = ['positive', 'negative', 'no value'];                      // is tan 135° positive or negative?
  const s16 = fix(sinD(A16), 3), c16 = fix(cosD(A16), 3), t16 = trim(Math.tan(A16 * RAD), 3);
  const V14 = 325, F14 = 50, W14 = TAU * F14;                                      // a 325 V peak at 50 Hz
  const o13 = [V14 + ' sin(' + F14 + 't)', V14 + ' sin(' + fix(W14, 1) + 't)', V14 + ' sin(' + trim(W14 / PI, 0) + 't)'];
  const A15 = 20;                                                                   // v = 20 sin(ωt + π/2)
  const o14 = [trim(A15 * Math.sin(PI / 2), 3), trim(A15 * Math.sin(0), 3), trim(Math.sin(PI / 2), 3)];

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // pic: the picture; vh: its height; dur: a demonstration's length; live: what Dan can drag;
  // sliders: the controls shown under the picture. A puzzle has opts, want, a hint for each wrong
  // answer, why, rows of working (right, and wrong[answer] in red) and secret: what the picture must
  // not show before an answer.
  const PICK = 'Tap one of the answers.';
  const STEPS = [
    { show: true, name: 'The arm draws a wave', pic: 'turn1', vh: 210, dur: 4.0, live: ['tip'],
      text: 'Here is lesson 3\'s arm again, length 1, pointing right. Set it turning anticlockwise at a steady speed. A dashed line carries its tip\'s height across to a graph, and a pen there draws that height as time goes on. The arm turns steadily, so its angle grows in step with time, and the graph is `sin θ` drawn against time. It rises to 1 at a quarter turn, is back at 0 at a half turn, falls to −1 at three quarters and is 0 again at a full turn. Drag the tip, or pause it to read the height.',
      after: 'One turn draws one whole wave, and then the shape starts over. This is the *sine wave*.' },
    { kind: 'pick', name: 'A half turn', pic: 'half',
      opts: o1, want: o1[0], secret: ['sin 180° = ' + o1[0]],
      task: 'The arm is frozen at a half turn, pointing left. Where is the trace?',
      why: 'The trace follows the tip\'s height, the sine. At a half turn the tip sits on the across axis, so its height is `sin 180° = 0`. The −1 is its across shadow, `cos 180°`, which this trace does not draw.',
      hint: 'Not quite. The trace draws the tip\'s height.',
      hints: { [o1[1]]: 'Not quite. −1 is the across shadow. The trace draws the height.',
        [o1[2]]: 'Not quite. 1 is the height at a quarter turn, with the arm straight up.' },
      right: ['height = sin 180° = ' + o1[0], 'the tip sits on the across axis'],
      wrong: { [o1[1]]: 'cos 180° = ' + o1[1] + ' is the across shadow', [o1[2]]: 'height ' + o1[2] + ' is at a quarter turn, 90°' } },
    { show: true, name: 'A longer arm', pic: 'amp', vh: 234, dur: 4.2, live: ['tip'], sliders: ['E'],
      text: 'Now make the arm 10 long. An arm of length E is lesson 3\'s picture drawn E times bigger, so its tip\'s height is `E sin θ`. Turning once, it draws the same wave ten times as tall, up to 10 at a quarter turn and down to −10 at three quarters. The wave\'s highest point is the arm\'s length, its *amplitude*. Slide the arm\'s length and watch the wave grow and shrink with it.',
      after: 'The length sets how tall the wave is, and nothing else: it stretches the wave upwards, the stretch from Functions and their graphs. One turn still draws one wave.' },
    { kind: 'pick', name: 'An arm of 4 at 30°', pic: 'arm4',
      opts: o3, want: o3[1], secret: [L4 + ' × ' + o3[2] + ' = ' + o3[1]],
      task: 'An arm of length 4 is frozen at 30°. How high is its tip?',
      why: 'The height is the length times the sine: `4 × sin 30° = 4 × 0.5 = 2`. The 3.46 is `4 × cos 30°`, the across shadow, and 0.5 is `sin 30°` alone, the height of an arm of length 1.',
      hint: 'Not quite. Multiply the length by the sine.',
      hints: { [o3[0]]: 'Not quite. That uses cos, the across shadow. The height uses sin.',
        [o3[2]]: 'Not quite. That is sin 30° alone. Multiply by the arm\'s length.' },
      right: ['height = ' + L4 + ' × sin ' + A4 + '°', '= ' + L4 + ' × ' + o3[2] + ' = ' + o3[1]],
      wrong: { [o3[0]]: L4 + ' × cos ' + A4 + '° = ' + o3[0] + ' is the across shadow', [o3[2]]: 'sin ' + A4 + '° = ' + o3[2] + ' leaves out the length ' + L4 } },
    { show: true, name: 'Turns a second', pic: 'freq', vh: 258, dur: 4.0, live: ['tip'], sliders: ['fq'],
      text: 'Now turn the arm 2 times a second, on a graph one second wide. Each turn draws one whole wave, so two waves fill the second. The turns a second are the waves a second, the *frequency*, counted in hertz (Hz), and the time one wave takes is the *period*, here half a second. Slide the turns a second and watch more waves squeeze into the same second, each one shorter.',
      after: 'Period and frequency are each other\'s flip: period = 1 ÷ frequency, and frequency = 1 ÷ period. A UK supply, declared at 50 Hz, fits 50 waves into a second, each taking `1 ÷ 50 = 0.02 s`, 20 ms.' },
    { kind: 'pick', name: 'Every 10 ms', pic: 'p10',
      opts: o5, want: o5[2], secret: ['1 ÷ ' + trim(P6s, 2) + ' = ' + trim(F6, 0)],
      task: 'A wave repeats every 10 ms. What is its frequency?',
      why: '10 ms is 0.01 s, so `1 ÷ 0.01 = 100` waves fit in a second: 100 Hz. The 0.01 is the period itself, the time one wave takes, and 10 counts milliseconds, not waves.',
      hint: 'Not quite. Frequency = 1 ÷ period, with the period in seconds.',
      hints: { [o5[1]]: 'Not quite. 0.01 s is the period. The frequency is 1 ÷ period.',
        [o5[0]]: 'Not quite. 10 is milliseconds. Count the waves in a whole second.' },
      right: [P6 + ' ms = ' + trim(P6s, 2) + ' s', 'f = 1 ÷ ' + trim(P6s, 2) + ' = ' + o5[2]],
      wrong: { [o5[1]]: trim(P6s, 2) + ' s is the period, not the frequency', [o5[0]]: P6 + ' counts milliseconds, not waves' } },
    { show: true, name: 'Radians a second', pic: 'omega', vh: 282, dur: 4.2, live: ['tip'], sliders: ['f'],
      text: 'Radians count the same turning in radius-lengths, as in lesson 5: one turn, 360°, is 2π radians. So f turns a second is 2πf radians a second, the arm\'s *angular speed*, ω. After t seconds the arm has turned ωt radians from pointing right, so its height is `E sin(ωt) = E sin(2πft)`. At 50 Hz, `ω = 2π × 50 = 314.16` rad/s; at 60 Hz, common on ships, `ω = 2π × 60 = 376.99` rad/s, a wave every 16.7 ms. Because ωt is in radians, the calculator goes in radian mode. Slide the turns a second and watch ω follow.',
      after: 'From ω back to f, divide by 2π. Written with 2πft, f reads straight off: `4 sin(2π × 5t)` peaks at 4 and turns 5 times a second, 5 Hz.' },
    { kind: 'pick', name: 'Read the frequency', pic: 'f100pi',
      opts: o7, want: o7[0], secret: ['100π ÷ 2π = ' + trim(F8, 0)],
      task: 'A wave is v = 10 sin(100πt). What is its frequency?',
      why: 'The number in front of t is ω, here 100π radians a second. Each turn is 2π radians, so `f = 100π ÷ 2π = 50` turns a second, 50 Hz. 314.2 is ω itself, and 100 forgets the 2 in 2π.',
      hint: 'Not quite. The number in front of t is ω. Divide it by 2π.',
      hints: { [o7[1]]: 'Not quite. 100π = 314.2 is ω, in radians a second. Divide by 2π.',
        [o7[2]]: 'Not quite. 100π is 2π × 50. The 2 belongs to the 2π.' },
      right: ['ω = 100π rad/s, and ω = 2πf', 'f = 100π ÷ 2π = ' + o7[0]],
      wrong: { [o7[1]]: '100π = ' + fix(W8, 1) + ' is ω, radians a second', [o7[2]]: trim(W8 / PI, 0) + ' forgets the 2 in 2π' } },
    { show: true, name: 'A head start', pic: 'phase', vh: 282, dur: 4.3, live: ['tip'], sliders: ['phi', 'across'],
      text: 'Now add a second arm. Arm A starts pointing right, as before. Arm B starts a quarter turn on, at π/2 or 90°, and both turn together. B is already at the top at t = 0, so it reaches every height a quarter of a turn\'s time sooner. Its wave is A\'s slid left by a quarter period, 5 ms at 50 Hz. The start angle is the wave\'s *phase*, φ, and B\'s wave is `E sin(ωt + φ)`. Slide φ below 0 and B starts behind: its wave slides right, later. Flip the switch to trace A\'s across shadow: at 90° it draws exactly B\'s wave, the *cosine* wave.',
      after: 'So `E sin(ωt + π/2) = E cos ωt`. The cosine wave is the sine wave started a quarter turn early.' },
    { kind: 'pick', name: 'Wave B', pic: 'ab',
      opts: o9, want: o9[0], secret: ['slid right'],
      task: 'Wave A comes from an arm started pointing right. Arm B starts π/2 behind it. What is wave B?',
      why: 'B is always a quarter turn behind A, so it reaches every height a quarter period later: its wave is A\'s slid right. It starts at the bottom, where A only gets after three quarters of a turn. Both arms are the same length, so the waves are just as tall.',
      hint: 'Not quite. B is a quarter turn behind A.',
      hints: { [o9[1]]: 'Not quite. B is behind, so it gets to each height later in time.',
        [o9[2]]: 'Not quite. B\'s arm is as long as A\'s, so its wave is just as tall.' },
      right: ['B starts at the bottom, ¼ turn behind', 'so B is A slid right ¼ period'],
      wrong: { [o9[1]]: 'slid left, B would start at the top', [o9[2]]: 'both arms are the same length' } },
    { show: true, name: 'A level line', pic: 'level', vh: 330, dur: 4.5, live: ['level'],
      text: 'Take the wave `10 sin(100πt)` and draw a level line at 5. It lies between the peaks, so it meets each wave twice, as lesson 3\'s level line met the circle twice. To find when, divide the height by 10, take sin⁻¹ in radian mode, find the other angle with the same sine, π minus the first, and divide each angle by ω, since the arm\'s angle is ωt. The rows under the picture work it through. Drag the level line up and down.',
      after: 'Each later wave adds one period, 20 ms, to both times.' },
    { kind: 'pick', name: 'A line at −8.3', pic: 'low',
      opts: o11, want: o11[1], secret: [o11[1]],
      task: 'The line is now at −8.3. When does the wave 10 sin(100πt) first reach it?',
      why: '`sin⁻¹(−0.83) = −0.979`. Below the axis the arm is past the half turn, so it first gets there at `π + 0.979 = 4.121` radians, and `4.121 ÷ 314.16 = 13.1` ms. Dropping the minus gives 3.1 ms, when the wave is at +8.3, and the other angle, `2π − 0.979 = 5.304`, gives 16.9 ms, the second crossing.',
      hint: 'Not quite. Find the first angle between 0 and 2π, in radians.',
      hints: { [o11[0]]: 'Not quite. At 3.1 ms the wave is at +8.3. Keep the minus: −8.3 is below the axis.',
        [o11[2]]: 'Not quite. 16.9 ms is the second crossing. The wave gets there sooner.' },
      right: ['sin(100πt) = ' + trim(H12, 1) + ' ÷ ' + E11 + ' = ' + trim(H12 / E11, 3), 'sin⁻¹(' + trim(H12 / E11, 3) + ') = ' + trim(s12, 3),
        'π + ' + trim(-s12, 3) + ' = ' + trim(PI - s12, 3), trim(PI - s12, 3) + ' ÷ ' + fix(W11, 2) + ' = ' + o11[1]],
      wrong: { [o11[0]]: [trim(-s12, 3) + ' ÷ ' + fix(W11, 2) + ' = ' + o11[0], 'there the wave is at +8.3, not −8.3'],
        [o11[2]]: ['2π − ' + trim(-s12, 3) + ' = ' + trim(TAU + s12, 3) + ', ÷ ' + fix(W11, 2) + ' = ' + o11[2], 'that is the second crossing'] } },
    { show: true, name: 'The slope\'s graph', pic: 'tan', vh: 282, dur: 4.5, live: ['tip'],
      text: 'Now trace the arm\'s slope instead of its height, `tan θ = sin θ ÷ cos θ` from Round the circle, against the angle. It is 0 at 0° and 1 at 45°, then climbs without limit as the arm nears straight up, so the graph is cut off at 4 and −4. At 90° and 270° the across shadow is 0, so the slope has no value there. Half a turn on, the arm points the opposite way: both shadows change sign, and their ratio stays the same. So tan repeats every half turn. Drag the tip.',
      after: 'So the tan graph is the same climbing curve again and again, one for each half turn, with a gap at 90° and 270°.' },
    { kind: 'pick', name: 'tan 135°', pic: 'tq',

    checkBtn.el.hidden = right;
    const fb = el('fb');
    fb.hidden = !!d.show;
    fb.className = 'fb' + (right ? ' right' : st.res === 'wrong' ? ' wrong' : '');
    write(fb, d.show ? '' : right ? 'That\'s it.' : st.res === 'wrong' ? hintFor(i, st) : st.res === 'empty' ? PICK : '');

    const why = el('why');
    why.hidden = d.show || !st.why;
    write(why, d.show ? '' : d.why);
    whyBtn.setLabel(st.why ? 'Hide why' : 'Why?');

    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !right);
    nextBtn.setLabel(i === STEPS.length - 1 ? 'Finish' : 'Continue');
    nav.hidden = backBtn.el.hidden && nextBtn.el.hidden;
  });

  // ---------- known answers, worked out by hand ----------
  const DO = STEPS.map((d, i) => i).filter((i) => !STEPS[i].show);
  const idx = (pic) => STEPS.findIndex((d) => d.pic === pic);
  // Step i painted in state st (motion m, at time tAt, finished if none), fn reading what it drew
  // before the page is put back.
  function withState(i, st, m, fn, tAt) {
    const keepS = S[i], keepT = T, keepM = MODE;
    S[i] = st; T = tAt == null ? Infinity : tAt; MODE = m || (STEPS[i].show ? 'demo' : 'answer');
    latest = 0; earliest = Infinity;
    try { paint(i); return fn(); } finally { S[i] = keepS; T = keepT; MODE = keepM; paint(); }
  }
  const drawn = (i, st, m) => withState(i, st, m, () => ({ texts: Array.from(art.querySelectorAll('text')).map((n) => n.textContent), rec: REC }));
  const solvedSt = (i) => stOf({ pick: STEPS[i].want, res: 'right' });
  const wrongSt = (i, o) => stOf({ pick: o, res: 'wrong' });
  const fail = (msg) => { throw new Error(msg); };
  const TT = (n, mx) => { const a = []; for (let j = 0; j <= n; j++) a.push(mx * j / n); return a; };
  // Every state a step can be seen in.
  function statesOf(i) {
    const d = STEPS[i], out = [];
    const push = (o) => out.push([stOf(o), 'demo']);
    if (d.show) {
      out.push([blank(), 'demo']);
      if (d.pic === 'turn1') TT(48, 1).forEach((tau) => push({ tau }));
      else if (d.pic === 'amp') for (let E = 1; E <= 10; E++) [null, 0.1, 0.3, 0.5, 0.75, 0.9].forEach((tau) => push({ E, tau }));
      else if (d.pic === 'freq') { for (let fq = 1; fq <= 10; fq++) [null, 0.6, 1.3].forEach((tau) => push({ fq, tau })); TT(16, 2).forEach((tau) => push({ tau })); }
      else if (d.pic === 'omega') { [1, 2, 3, 4, 5, 7, 9, 10, 11, 13, 20, 33, 50].forEach((f) => [null, 0.6, 1.3].forEach((tau) => push({ f, tau }))); TT(16, 2).forEach((tau) => push({ tau })); }
      else if (d.pic === 'phase') for (let deg = -180; deg <= 180; deg += 15) [false, true].forEach((across) => [null, 0.6].forEach((tau) => push({ phi: deg, across, tau })));
      else if (d.pic === 'level') { for (let k = -100; k <= 100; k += 5) push({ h: k / 10 }); [H12, 0.1, -0.1, 9.9, -9.9].forEach((h) => push({ h })); }
      else if (d.pic === 'tan') TT(72, 1).forEach((tau) => push({ tau }));
    } else {
      out.push([blank(), 'answer'], [solvedSt(i), 'answer'], [stOf({ why: true }), 'answer']);
      d.opts.filter((o) => o !== d.want).forEach((o) => out.push([wrongSt(i, o), 'answer'], [stOf({ pick: o, res: 'wrong', why: true }), 'answer']));
    }
    return out;
  }
  // What crowds the labels in the picture now: labels over labels or handles, or off the edge.
  function crowding() {
    const bad = [], boxes = [];
    art.querySelectorAll('text').forEach((t) => {
      let b = null;
      try { b = t.getBBox(); } catch (e) { b = null; }
      if (!b || !(b.width > 0) || !(b.height > 0)) return;
      const sh = b.height * 0.2;
      boxes.push({ s: t.textContent, x: b.x, y: b.y + sh, w: b.width, h: b.height - 2 * sh });
    });
    boxes.forEach((a, m) => {
      if (a.x < 1 || a.x + a.w > 339 || a.y < 0 || a.y + a.h > VH) bad.push('"' + a.s + '" off the edge');
      boxes.slice(m + 1).forEach((b) => {
        const ix = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x), iy = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y);
        if (ix > 1 && iy > 1) bad.push('"' + a.s + '" on "' + b.s + '"');
      });
      REC.handles.forEach((h) => { const nx = K.clamp(h.x, a.x, a.x + a.w), ny = K.clamp(h.y, a.y, a.y + a.h); if (Math.hypot(nx - h.x, ny - h.y) < 11) bad.push('"' + a.s + '" on a handle'); });
    });
    return bad;
  }

  K.check('Because we have sinusoidal variation in time, the vertical component (magnitude times the sine of the angle it makes with the x axis) gives v(t): at every moment of the first screen\'s turn, and at every arm length on the third, the pen sits level with the arm\'s tip at the arm\'s length times the sine of its angle, and every drawn point of the wave is that height at its time', () => {
    const i1 = idx('turn1'), i3 = idx('amp');
    TT(48, 1).forEach((tau) => {
      const rec = drawn(i1, stOf({ tau }), 'demo').rec, w = rec.w;
      if (Math.abs(w.pen[1] - w.tip[1]) > 1e-9 || !K.near(rec.map.vOf(w.pen[1]), Math.sin(TAU * tau), 1e-9)) fail('pen not level with the tip at ' + tau + ' turns');
    });
    for (let E = 1; E <= 10; E++) {
      const rec = drawn(i3, stOf({ E, tau: 0.6 }), 'demo').rec, w = rec.w;
      if (Math.abs(w.pen[1] - w.tip[1]) > 1e-9 || !K.near(rec.map.vOf(w.pen[1]), E * Math.sin(TAU * 0.6), 1e-9)) fail('pen not level at length ' + E);
      if (!w.pts.every((q) => K.near(rec.map.vOf(q[1]), E * Math.sin(TAU * rec.map.tOf(q[0])), 1e-9))) fail('trace off the rule at length ' + E);
    }
    return true;
  }, { source: SRC.unsw });
  K.check('The length of the second hand represents the height or amplitude of the sine wave: at every arm length from 1 to 10 the arm is drawn that long on the circle, the wave over one turn reaches exactly that height and sinks to minus it, and the label on its peak reads amplitude and that length', () => {
    const i = idx('amp');
    for (let E = 1; E <= 10; E++) {
      const rec = drawn(i, stOf({ E }), 'demo').rec, w = rec.w, vs = w.pts.map((q) => rec.map.vOf(q[1]));
      if (!K.near(lenOf(w.tip, rec.map.C) / rec.map.kc, E, 1e-9) || !K.near(Math.max.apply(null, vs), E, 1e-9) || !K.near(Math.min.apply(null, vs), -E, 1e-9)) fail('wave height wrong at length ' + E);
      if (rec.ampLab !== 'amplitude ' + E) fail('amplitude label at length ' + E + ': ' + rec.ampLab);
    }
    return true;
  }, { source: SRC.second });
  K.check('The frequency indicates how many cycles exist in one second: on a graph always one second wide, at every setting from 1 to 10 turns a second each drawn wave is one turn of the arm, so exactly that many waves fill the second, the axis marks 0.5 s and 1 s at every setting, and the period bracket over the first wave reads 1 ÷ f', () => {
    const i = idx('freq');
    for (let f = 1; f <= 10; f++) {
      const rec = drawn(i, stOf({ fq: f }), 'demo').rec, w = rec.w;
      let ups = 0;
      for (let k = 1; k < w.pts.length; k++) if (rec.map.vOf(w.pts[k - 1][1]) < -1e-9 && rec.map.vOf(w.pts[k][1]) >= -1e-9) ups++;
      if (ups !== f || !K.near(rec.map.tOf(GX1) / f, 1, 1e-9) || rec.tlabs.join() !== '0.5 s,1 s' || rec.period !== 'period ' + timeS(1 / f)) fail('at ' + f + ' turns a second: ' + ups + ' waves, ' + rec.tlabs.join() + ', ' + rec.period);
    }
    const two = drawn(i, blank(), 'demo').rec;
    return two.period === 'period 0.5 s' && two.rows[0].s === 'period = 1 ÷ 2 = 0.5 s';
  }, { source: SRC.cycles });
  K.check('Low voltage supplies shall be 50 hertz: the row under the one-second graph works out a UK supply\'s period, 1 ÷ 50 = 0.02 s = 20 ms', () => {
    const rec = drawn(idx('freq'), blank(), 'demo').rec;
    return rec.rows.length === 2 && rec.rows[1].s === 'at 50 Hz: period = 1 ÷ 50 = 0.02 s = 20 ms';
  }, { source: SRC.leg });
  K.check('360° = 2π radians: one turn is marked 2π, so f turns a second is 2πf radians a second, and the ω pill reads 2π × 50 = 314.16 rad/s at 50 Hz and 2π times the turns a second at every other setting', () => {
    const i = idx('omega');
    [1, 2, 7, 13, 50].forEach((f) => { const rec = drawn(i, stOf({ f }), 'demo').rec; if (rec.pills.w !== 'ω = 2πf = ' + fix(TAU * f, 2) + ' rad/s') fail('ω at ' + f + ': ' + rec.pills.w); });
    const rec = drawn(i, blank(), 'demo').rec;
    return rec.pills.w === 'ω = 2πf = 314.16 rad/s' && rec.ringLab === '1 turn = 2π' && K.near(TAU * 50, 314.159265, 1e-6);
  }, { source: SRC.radians });
  K.check('A(t) = Amax sin(ωt) = Amax sin(2πft): at 50 Hz every drawn point of the wave, read off the graph at its time t in seconds, equals sin(2π × 50 × t), and the arm points right again at the end of each turn, 20 ms and 40 ms', () => {
    const i = idx('omega'), rec = drawn(i, blank(), 'demo').rec, w = rec.w;
    if (!w.pts.length || !w.pts.every((q) => K.near(rec.map.vOf(q[1]), Math.sin(TAU * 50 * (rec.map.tOf(q[0]) / 50)), 1e-9))) fail('trace off the rule');
    return [1, 2].every((tau) => { const r = drawn(i, stOf({ tau }), 'demo').rec.w; return K.near(r.tip[1], CY, 1e-9) && r.tip[0] > CX; }) && rec.tlabs.join() === '20 ms,40 ms';
  }, { source: SRC.wave });
  K.check('The terminal side of the angle intersects the circle at the point (x, y), which is equivalent to (cos t, sin t): at every start angle and time, arm B\'s tip is drawn at (cos θ, sin θ) times its length, its pen draws the sine, the switch traces arm A\'s across shadow, the cosine, and at a start angle of 90° that trace lies exactly on wave B', () => {
    const i = idx('phase');
    for (let deg = -180; deg <= 180; deg += 45) [0, 0.3, 0.8, 1.55].forEach((tau) => {
      const rec = drawn(i, stOf({ phi: deg, tau, across: true }), 'demo').rec, m = rec.map, A = rec.ab.A, B = rec.ab.B, th = TAU * tau + deg * RAD;
      if (!K.near((B.tip[0] - CX) / m.kc, Math.cos(th), 1e-9) || !K.near((CY - B.tip[1]) / m.kc, Math.sin(th), 1e-9)) fail('tip B at ' + deg + '°, ' + tau);
      if (!K.near(m.vOf(A.pen[1]), Math.cos(TAU * tau), 1e-9) || !K.near(m.vOf(B.pen[1]), Math.sin(th), 1e-9)) fail('pens at ' + deg + '°, ' + tau);
    });
    const x = drawn(i, stOf({ across: true }), 'demo').rec.ab;
    return x.A.pts.length > 200 && x.A.pts.length === x.B.pts.length && x.A.pts.every((q, j) => K.near(q[1], x.B.pts[j][1], 1e-9));
  }, { source: SRC.openstax });
  K.check('A start angle φ slides the whole wave left by φ ÷ ω, and a negative one slides it right: at every start angle from −180° to 180°, wave B at each drawn time is wave A a time φ ÷ ω later, the bracket between their peaks reads that slide, left or right, and at 90° it is a quarter period left, 5 ms at 50 Hz', () => {
    const i = idx('phase'), W = TAU * 50;
    for (let deg = -180; deg <= 180; deg += 15) {
      const rec = drawn(i, stOf({ phi: deg }), 'demo').rec, m = rec.map, A = rec.ab.A, B = rec.ab.B, sh = deg / 360;
      if (!B.pts.every((q) => K.near(m.vOf(q[1]), A.val(m.tOf(q[0]) + sh), 1e-9))) fail('wave B is not A slid at ' + deg + '°');
      if (deg !== 0 && rec.shift !== (deg > 0 ? 'slid left ' : 'slid right ') + timeS(Math.abs(deg) * RAD / W)) fail('slide label at ' + deg + '°: ' + rec.shift);
    }
    return drawn(i, blank(), 'demo').rec.shift === 'slid left 5 ms' && drawn(i, stOf({ phi: -90 }), 'demo').rec.shift === 'slid right 5 ms' && timeS(PI / 2 / W) === '5 ms';
  });
  K.check('A level line between the peaks meets each wave twice: at every height from −10 to 10 each dot lies on the drawn wave and the line; at 5 the first two are at 1.67 ms and 8.33 ms (0.524 and 2.618 radians ÷ 314.16), and the wave first reaches −8.3 at 13.1 ms (π + 0.979 = 4.121 radians), with 16.9 ms next', () => {
    const i = idx('level');
    for (let k = -100; k <= 100; k += 5) {
      const h = k / 10, L = drawn(i, stOf({ h }), 'demo').rec.lvl;
      if (!L.ts.every((t) => K.near(E11 * Math.sin(TAU * t), h, 1e-9))) fail('a dot off the wave at ' + h);
      if (Math.abs(h) < 10 && L.ts.filter((t) => t < 1 - 1e-9).length !== 2) fail('not twice in the first wave at ' + h);
      if (L.labs.length !== L.first.length) fail('crossing times not all labelled at ' + h + ': ' + L.labs.join());
    }
    const L5 = drawn(i, blank(), 'demo').rec.lvl, lo = drawn(idx('low'), solvedSt(idx('low')), 'answer').rec.lvl;
    return L5.labs.join() === '1.67 ms,8.33 ms' && lo.first1 === '13.1 ms' && msS(lo.ts[1] / F11) === '16.9 ms';
  });
  K.check('tan 135° = sin 135° ÷ cos 135° = 0.707 ÷ −0.707 = −1: once answered, the graph carries on past the gap at 90° and its pen sits at −1 at 135°, every drawn point of that piece is sin θ ÷ cos θ, and before the answer only the piece up to 90° is drawn', () => {
    const i = idx('tq'), rec = drawn(i, solvedSt(i), 'answer').rec, m = rec.map, b = drawn(i, blank(), 'answer').rec;
    if (!rec.tq.p2.length || !rec.tq.p2.every((q) => { const t = m.tOf(q[0]) * TAU; return K.near(m.vOf(q[1]), Math.tan(t), 1e-6); })) fail('second piece off the rule');
    return K.near(rec.tq.tv, -1, 1e-9) && b.tq.p2.length === 0 && rec.pills.h === 'tan 135° = −1' && b.pills.h === 'tan 135° = ?';
  });
  K.check('The slope tan θ = sin θ ÷ cos θ: the trace is sin θ ÷ cos θ at every drawn angle, cut off at 4 and −4; it is 0 at 0° and 1 at 45°, has no value at 90° and 270°, where the across shadow is 0, and repeats every half turn', () => {
    const i = idx('tan'), rec = drawn(i, blank(), 'demo').rec, m = rec.map;
    rec.tanw.pts.forEach((ps) => ps.forEach((q) => {
      const t = m.tOf(q[0]) * TAU, v = m.vOf(q[1]);
      if (Math.abs(v) > 4 + 1e-9 || !K.near(v, Math.sin(t) / Math.cos(t), 1e-6) || Math.abs(Math.cos(t)) < 1e-6) fail('trace wrong at ' + t * DEG + '°');
    }));
    if (rec.tanw.pts.length !== 3 || rec.tanw.nv !== 2) fail('three pieces and two gaps expected');
    for (let a = 5; a < 180; a += 10) if (a !== 90 && !K.near(Math.tan((a + 180) * RAD), Math.tan(a * RAD), 1e-9)) fail('no repeat at ' + a);
    const p0 = drawn(i, stOf({ tau: 0 }), 'demo').rec.pills.h, p45 = drawn(i, stOf({ tau: 0.125 }), 'demo').rec.pills.h, p90 = drawn(i, stOf({ tau: 0.25 }), 'demo').rec.pills.h;
    return p0 === 'tan 0° = 0' && p45 === 'tan 45° = 1' && p90 === 'tan 90°: no value';
  });
  K.check('Every worked number matches the lesson: sin 180° = 0 with slips −1 and 1; 4 × sin 30° = 2 with slips 3.46 and 0.5; 1 ÷ 0.01 = 100 Hz with slips 0.01 and 10; 1 ÷ 50 = 0.02 s, 20 ms; ω = 2π × 50 = 314.16; π = 3.14159; 100π ÷ 2π = 50 Hz with slips 314.2 and 100; π/2 = 1.571 and 5 ms; 0.5, 0.524, 2.618, 1.67 ms and 8.33 ms; −0.979, 4.121, 13.1 ms with slips 3.1 ms (0.979 ÷ 314.16) and 16.9 ms (5.304, the second crossing); tan 45° = 1; tan 135° = 0.707 ÷ −0.707 = −1; 325 sin(314.2t) with slips 50t and 100t, and 7.96; 20 sin(π/2) = 20 with slips 0 and 1', () => {
    const same = (a, b) => a.length === b.length && a.every((v, k) => v === b[k]);
    const s11 = Math.asin(H11 / E11);
    return same(o1, ['0', '−1', '1']) && same(o3, ['3.46', '2', '0.5']) && same(o5, ['10 Hz', '0.01 Hz', '100 Hz']) &&
      same(o7, ['50 Hz', '314.2 Hz', '100 Hz']) && same(o11, ['3.1 ms', '13.1 ms', '16.9 ms']) && same(o15, ['positive', 'negative', 'no value']) && s16 === '0.707' && c16 === '−0.707' && t16 === '−1' &&
      same(o13, ['325 sin(50t)', '325 sin(314.2t)', '325 sin(100t)']) && same(o14, ['20', '0', '1']) &&
      timeS(1 / 50) === '20 ms' && trim(1 / 50, 2) === '0.02' && fix(W11, 2) === '314.16' && fix(PI, 5) === '3.14159' &&
      trim(PI / 2, 3) === '1.571' && timeS(PI / 2 / W11) === '5 ms' && trim(H11 / E11, 3) === '0.5' &&
      trim(s11, 3) === '0.524' && trim(PI - s11, 3) === '2.618' && msS(s11 / W11) === '1.67 ms' && msS((PI - s11) / W11) === '8.33 ms' &&
      trim(s12, 3) === '−0.979' && trim(PI - s12, 3) === '4.121' && trim(TAU + s12, 3) === '5.304' && msS((TAU + s12) / W11) === '16.9 ms' &&
      trim(Math.tan(PI / 4), 3) === '1' && fix(F14 / TAU, 2) === '7.96';
  });
  K.check('Each puzzle accepts only its right answer, every wrong answer has its own hint and its own red row of working, the answer appears once it is given, and before an answer nothing in the picture gives it away', () =>
    DO.every((i) => {
      const d = STEPS[i];
      if (d.opts.length !== 3 || new Set(d.opts).size !== 3 || d.opts.indexOf(d.want) < 0 || !d.opts.every((o) => isRight(i, stOf({ pick: o })) === (o === d.want))) fail('options wrong on step ' + (i + 1));
      const wrongs = d.opts.filter((o) => o !== d.want);
      if (!wrongs.every((o) => d.hints[o] && d.wrong[o] && wrongs.every((p) => p === o || d.hints[p] !== d.hints[o]))) fail('hints missing on step ' + (i + 1));
      const b = drawn(i, blank(), 'answer'), s = drawn(i, solvedSt(i), 'answer');
      if (b.rec.rows.length || d.secret.some((x) => b.texts.some((t) => t.indexOf(x) >= 0))) fail('answer shown early on step ' + (i + 1));
      if (!(s.rec.rows.length === d.right.length && s.rec.rows.every((r) => !r.bad)) || !d.secret.every((x) => s.texts.some((t) => t.indexOf(x) >= 0))) fail('answer not drawn on step ' + (i + 1));
      return wrongs.every((o) => { const r = drawn(i, wrongSt(i, o), 'answer').rec.rows, w = [].concat(d.wrong[o]); return r.length === w.length && r.every((x, k) => x.bad && x.s === w[k]); });
    }));
  K.check('No label sits on another label or a handle, or runs off the picture, on any screen in any state: puzzles answered right, wrong or with Why? open, the arm dragged to every time, every arm length, turns a second, start angle and switch setting, and the level line at every height', () =>
    STEPS.every((d, i) => statesOf(i).every((s) => withState(i, s[0], s[1], () => { const bad = crowding(); if (bad.length) fail('step ' + (i + 1) + ' ' + JSON.stringify({ tau: s[0].tau, E: s[0].E, f: s[0].f, fq: s[0].fq, phi: s[0].phi, across: s[0].across, h: s[0].h, pick: s[0].pick, why: s[0].why }) + ': ' + bad[0]); return true; }))));
  K.check('Every demonstration has finished within 4.5 s of its screen opening, none starting before the 0.35 s screen fade ends; each answer and Why? has settled within 1.8 s', () =>
    STEPS.every((d, i) => {
      const timed = (st, m) => withState(i, st, m, () => [latest, earliest]);
      if (d.show) {
        const t = timed(blank(), 'demo');
        if (!(t[0] <= d.dur + 1e-9 && d.dur <= 4.5 && d.dur >= 3 && t[1] >= FADE)) fail('step ' + (i + 1) + ' runs ' + t[0] + ' s from ' + t[1]);
        return true;
      }
      return statesOf(i).every((s) => timed(s[0], s[1])[0] <= ANS + 1e-9);
    }));

  K.ready();
</script>
