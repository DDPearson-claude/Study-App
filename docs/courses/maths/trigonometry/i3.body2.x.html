<script>
  const el = (id) => document.getElementById(id);
  // ---------- numbers (pure, so the checks can test them) ----------
  const RAD = Math.PI / 180;
  const sinD = (a) => Math.sin(a * RAD), cosD = (a) => Math.cos(a * RAD), tanD = (a) => Math.tan(a * RAD), asinD = (v) => Math.asin(v) / RAD;
  const neg = (s) => String(s).replace(/^-/, '−');
  // v rounded to dp places with trailing zeros dropped: 0.5, 0.866, 30.
  function trim(v, dp) {
    const f = Math.pow(10, dp);
    let s = (Math.round(v * f) / f).toFixed(dp);
    if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
    if (s === '-0') s = '0';
    return neg(s);
  }
  const v3 = (v) => trim(v, 3), angS = (v) => trim(v, 1) + '°', hS = (v) => trim(v, 2);
  const ang2 = (x, y) => { const a = Math.atan2(y, x) / RAD; return a < 0 ? a + 360 : a; };
  const pair = (x, y) => '(' + v3(x) + ', ' + v3(y) + ')';

  // The picture: the centre, the circle of radius 1 drawn 96 units long, and the axes.
  const O = [170, 124], RU = 96, AX = 108, XL = 22, XR = 336;
  const FLOOR = 252;   // labels in the picture stay above the rows of working and the calculator
  const tipOf = (th) => [O[0] + RU * cosD(th), O[1] - RU * sinD(th)];

  // The rows of working the picture writes, worked out from the rule.
  const tipRow = (th) => 'tip = (cos θ, sin θ) = ' + pair(cosD(th), sinD(th));
  const sqRow = (th) => { const c = cosD(th), s = sinD(th); return 'cos² θ + sin² θ = ' + v3(c * c) + ' + ' + v3(s * s) + ' = ' + v3(c * c + s * s); };
  const tanRow = (th) => { const c = cosD(th), s = sinD(th); return Math.abs(c) < 1e-9 ? 'tan ' + angS(th) + ' has no value: the run is 0' : 'tan ' + angS(th) + ' = ' + v3(s) + ' ÷ ' + v3(c) + ' = ' + v3(s / c); };
  // A level line at height h: the calculator's angle a1 (−90° to 90°), its arm n1 from 0° to 360°, and the mirror arm n2 = 180° − a1.
  function levelAngles(h) { const a1 = asinD(K.clamp(h, -1, 1)), n1 = a1 < 0 ? a1 + 360 : a1, n2 = 180 - a1; return { a1, n1, n2, one: Math.abs(n1 - n2) < 1e-6 }; }
  const hArg = (h) => (h < 0 ? '(' + hS(h) + ')' : ' ' + hS(h));
  const mirrorRow = (h) => { const a1 = asinD(K.clamp(h, -1, 1)); return (a1 < 0 ? '180° + ' + angS(-a1) : '180° − ' + angS(a1)) + ' = ' + angS(180 - a1); };

  // The lesson's example values.
  const P1 = 40, P3 = 120, P5 = 300, S7 = 0.6, S9 = 0.8, S10 = -0.5, P11 = 110;
  const TH7 = 180 - asinD(S7), A9 = asinD(S9), A10 = asinD(S10);
  const o1 = [v3(cosD(P1)), v3(sinD(P1)), v3(cosD(P1) + sinD(P1))];
  const o3 = [v3(-cosD(P3)), v3(sinD(P3)), v3(cosD(P3))];
  const o5 = [pair(cosD(P5), sinD(P5)), pair(sinD(P5), cosD(P5)), pair(cosD(P5), -sinD(P5))];
  const BAD5 = { [o5[1]]: ang2(sinD(P5), cosD(P5)), [o5[2]]: ang2(cosD(P5), -sinD(P5)) };
  const o7 = [v3(-cosD(TH7)), v3(cosD(TH7)), v3(1 - S7)];
  const o9 = [angS(A9) + ' only', angS(A9) + ' and ' + angS(360 - A9), angS(A9) + ' and ' + angS(180 - A9)];
  const o10 = [angS(180 - A10) + ' and ' + angS(360 + A10), angS(-A10) + ' and ' + angS(180 + A10), angS(180 + A10) + ' and ' + angS(360 + A10)];
  const o11 = [v3(-cosD(P11)), v3(cosD(P11)), v3(sinD(P11))];

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // pic: the picture; vh: its height; dur: a demonstration's length; live: what Dan can drag.
  // A puzzle has opts, want, a hint for each wrong answer, why, rows of working (right, and wrong[answer]
  // in red) and secret: what the picture must not show before an answer.
  const PICK = 'Tap one of the answers.';
  const STEPS = [
    { show: true, name: 'The arm and its tip', pic: 'tip30', vh: 280, dur: 4.2, live: ['tip'],
      text: 'Here is lesson 1\'s triangle on a turning arm. The arm is 1 long and starts out pointing right, and `θ` is how far it has turned anticlockwise, 30° here. The arm is the hypotenuse, and dividing by 1 changes nothing. So `sin θ`, opposite ÷ hypotenuse, is simply the tip\'s height, and `cos θ` is how far across it is. The tip sits at `(cos θ, sin θ)`, here (0.866, 0.5). A circle of radius 1 used like this is called the *unit circle*. Drag the tip.' },
    { kind: 'pick', name: 'How high at 40°', pic: 'p40', vh: 326,
      opts: o1, want: o1[1], secret: [o1[1]],
      task: 'The arm turns to 40°. How far up is its tip?',
      why: 'Sine is opposite ÷ hypotenuse. The side opposite 40° is the tip\'s height, and the hypotenuse is the arm, 1 long. So the height is `sin 40° = 0.643`. How far across is `cos 40° = 0.766`.',
      hint: 'Not quite. The height is the side opposite θ.',
      hints: { [o1[0]]: 'Not quite. 0.766 is how far across the tip is, `cos 40°`. The height is the sine.',
        [o1[2]]: 'Not quite. `0.766 + 0.643` adds across and up. The tip is never higher than the arm is long, 1.' },
      right: ['up = sin 40° = ' + o1[1], 'across = cos 40° = ' + o1[0]],
      wrong: { [o1[0]]: 'cos 40° = ' + o1[0] + ' is across, not up', [o1[2]]: o1[0] + ' + ' + o1[1] + ' = ' + o1[2] + ', longer than the arm' } },
    { show: true, name: 'Past 90°', pic: 'past90', vh: 280, dur: 3.4, live: ['tip'],
      text: 'Turn the arm past 90° and keep the same rule: `cos θ` is the tip\'s across and `sin θ` its up, signs and all. At 150° the tip is 0.866 left of the centre and 0.5 up, so `cos 150° = −0.866` and `sin 150° = 0.5`. The triangle flips over with the arm. Its side along the across axis now lies left of the centre, so it is drawn dashed: that coordinate is negative. Past 90° no triangle is needed. This is how sine and cosine are defined, and it is what the calculator works out.' },
    { kind: 'pick', name: 'cos 120°', pic: 'p120', vh: 326,
      opts: o3, want: o3[2], secret: [o3[2]],
      task: 'The arm turns to 120°. What is `cos 120°`?',
      why: 'At 120° the tip is in the top left quarter, 0.5 left of the centre and 0.866 up. Cosine is the across coordinate, sign and all, so `cos 120° = −0.5`.',
      hint: 'Not quite. Cosine is how far across the tip is, with its sign.',
      hints: { [o3[0]]: 'Not quite. At 120° the arm points left of the centre, so its across is negative.',
        [o3[1]]: 'Not quite. 0.866 is the tip\'s height, `sin 120°`. Cosine is across.' },
      right: ['cos 120° = ' + o3[2] + ', left of the centre', 'sin 120° = ' + o3[1] + ', up'],
      wrong: { [o3[0]]: o3[0] + ' is right of the centre', [o3[1]]: 'sin 120° = ' + o3[1] + ' is the height' } },
    { show: true, name: 'Four quadrants', pic: 'sweep', vh: 304, dur: 4.4, live: ['tip'],
      text: 'The axes cut the circle into four quarters, called *quadrants*, numbered anticlockwise from the top right. Where the tip sits decides the signs. Left of the centre the cosine is negative, and below it the sine is negative. So at 210°, in the third quadrant, both are negative, (−0.866, −0.5). At 330°, in the fourth, only the sine is, (0.866, −0.5). That is why sine and cosine are positive or negative depending on the quadrant.' },
    { kind: 'pick', name: 'The tip at 300°', pic: 'p300', vh: 326,
      opts: o5, want: o5[0], secret: [v3(sinD(P5))],
      task: 'The arm turns to 300°. Where is its tip, `(cos θ, sin θ)`?',
      why: '300° is in the fourth quadrant, right of the centre and below it. So the cosine is positive and the sine negative: `cos 300° = 0.5` and `sin 300° = −0.866`. The tip is at (0.5, −0.866).',
      hint: 'Not quite. Cosine is across, sine is up, and the quadrant gives the signs.',
      hints: { [o5[1]]: 'Not quite. That puts the sine first. Cosine is across, sine is up.',
        [o5[2]]: 'Not quite. At 300° the arm points down into the fourth quadrant, so the tip is below the centre.' },
      right: ['cos 300° = ' + v3(cosD(P5)) + ', right of the centre', 'sin 300° = ' + v3(sinD(P5)) + ', below it'],
      wrong: { [o5[1]]: o5[1] + ' is the point at ' + angS(BAD5[o5[1]]), [o5[2]]: o5[2] + ' is above the centre' } },
    { show: true, name: 'Squares and slope', pic: 'squares', vh: 328, dur: 3.6, live: ['tip'],
      text: 'Off the axes the arm is the hypotenuse of a right-angled triangle whose other sides are `cos θ` and `sin θ`. So Pythagoras gives `cos² θ + sin² θ = 1`, where `sin² θ` means `(sin θ)²`. Squaring takes the signs away, so it holds in every quadrant: at 150°, 0.75 + 0.25 = 1. The arm\'s slope, rise over run, is `sin θ ÷ cos θ`, which is `tan θ`. At 90° the run is 0, so `tan 90°` has no value.' },
    { kind: 'pick', name: 'cos from sin', pic: 'p06', vh: 326,
      opts: o7, want: o7[1], secret: [o7[1]],
      task: 'The tip is 0.6 up, in the second quadrant. What is `cos θ`?',
      why: 'From `cos² θ + sin² θ = 1`, `cos² θ = 1 − 0.6² = 1 − 0.36 = 0.64`. That has two roots, 0.8 and −0.8, and the quadrant decides. In the second quadrant the tip is left of the centre, so `cos θ = −0.8`.',
      hint: 'Not quite. Use `cos² θ + sin² θ = 1`, then the quadrant for the sign.',
      hints: { [o7[0]]: 'Not quite. 0.8 is a root of 0.64, but in the second quadrant the tip is left of the centre.',
        [o7[2]]: 'Not quite. `1 − 0.6` takes away the sine, not its square. Square it first, `0.6² = 0.36`.' },
      right: ['cos² θ = 1 − ' + hS(S7) + '² = 1 − ' + v3(S7 * S7) + ' = ' + v3(1 - S7 * S7), 'left of the centre, so cos θ = ' + o7[1]],
      wrong: { [o7[0]]: '√' + v3(1 - S7 * S7) + ' = ' + o7[0] + ', but the tip is left', [o7[2]]: '1 − ' + hS(S7) + ' = ' + o7[2] + ' forgets to square' } },
    { show: true, name: 'Two angles, one sine', pic: 'level', vh: 338, dur: 4.4, live: ['level'],
      text: 'A level line at height 0.5 crosses the circle twice, at 30° and at 150°. The circle is the same on both sides of the up axis, so each arm is the other\'s mirror image, and the two angles add up to 180°. Two angles like that are called *supplementary*. So `sin (180° − θ) = sin θ`. The calculator\'s `sin⁻¹` gives only one angle, between −90° and 90°, so the second comes from the picture. At the very top or bottom the two arms become one. Drag the line.' },
    { kind: 'pick', name: 'sin θ = 0.8', pic: 'p08', vh: 326,
      opts: o9, want: o9[2], secret: [angS(180 - A9)],
      task: '`sin θ = 0.8`. Which angles from 0° to 360° have it?',
      why: '`sin⁻¹ 0.8 = 53.1°`, in the first quadrant. The level line at 0.8 crosses the circle again at its mirror image, `180° − 53.1° = 126.9°`. Both tips are 0.8 up.',
      hint: 'Not quite. The level line at 0.8 crosses the circle twice.',
      hints: { [o9[0]]: 'Not quite. The calculator gives one angle, but the level line at 0.8 crosses the circle twice.',
        [o9[1]]: 'Not quite. `360° − 53.1°` keeps the cosine and flips the sine: `sin 306.9° = −0.8`.' },
      right: ['sin⁻¹ ' + hS(S9) + ' = ' + angS(A9), '180° − ' + angS(A9) + ' = ' + angS(180 - A9)],
      wrong: { [o9[0]]: 'the line at ' + hS(S9) + ' crosses twice', [o9[1]]: 'sin ' + angS(360 - A9) + ' = ' + v3(sinD(360 - A9)) + ', below the centre' } },
    { kind: 'pick', name: 'sin θ = −0.5', pic: 'pm05', vh: 326,
      opts: o10, want: o10[0], secret: [angS(180 - A10), angS(360 + A10)],
      task: '`sin θ = −0.5`. Which angles from 0° to 360° have it?',
      why: '`sin⁻¹(−0.5) = −30°`, turned clockwise, which is the same arm as `360° − 30° = 330°`. The level line at −0.5 crosses again at its mirror image, `180° + 30° = 210°`. Both tips are below the centre.',
      hint: 'Not quite. A negative sine puts the tip below the centre.',
      hints: { [o10[1]]: 'Not quite. Those have a sine of 0.5, above the centre. A negative sine is below it.',
        [o10[2]]: 'Not quite. 150° is above the centre. The mirror of −30° is `180° − (−30°) = 210°`.' },
      right: ['sin⁻¹(' + hS(S10) + ') = ' + angS(A10) + ', the arm at ' + angS(360 + A10), '180° + ' + angS(-A10) + ' = ' + angS(180 - A10)],
      wrong: { [o10[1]]: 'sin 30° and sin 150° are 0.5, above', [o10[2]]: 'sin 150° = 0.5, above the centre' } },
    { kind: 'pick', name: 'cos 110°', pic: 'p110', vh: 326,
      opts: o11, want: o11[1], secret: [o11[1]],
      task: 'The arm turns to 110°. What is `cos 110°`?',
      why: '110° is in the second quadrant, so the tip is left of the centre. Its mirror arm, at `180° − 110° = 70°`, is at the same height but 0.342 to the right. So `cos 110° = −0.342`. The next lesson\'s cosine rule needs that minus sign.',
      hint: 'Not quite. Cosine is across, with its sign.',
      hints: { [o11[0]]: 'Not quite. At 110° the arm points left of the centre, so the cosine is negative.',
        [o11[2]]: 'Not quite. 0.94 is the height, `sin 110°`. Cosine is across.' },
      right: ['cos 110° = ' + o11[1] + ', left of the centre', 'its mirror, ' + angS(180 - P11) + ', is ' + o11[0] + ' across'],
      wrong: { [o11[0]]: 'cos ' + angS(180 - P11) + ' = ' + o11[0] + ', the arm on the right', [o11[2]]: 'sin 110° = ' + o11[2] + ' is the height' } },
  ];
  const FINISH = 'On a turning arm of length 1 the tip is at `(cos θ, sin θ)`, so sine and cosine have a value at every angle, positive or negative by quadrant. Two angles share each sine, `θ` and `180° − θ`.';
  const CAP_ARM = 'The arm is 1 long, so the tip\'s across is cos θ and its up is sin θ.';
  const CAP_LEVEL = 'Every point on the level line is the same height, so both arms there share one sine.';
  const CAPS = { tip30: CAP_ARM, past90: CAP_ARM, sweep: CAP_ARM, squares: CAP_ARM, p40: CAP_ARM, p120: CAP_ARM, p300: CAP_ARM, p06: CAP_ARM, p110: CAP_ARM, level: CAP_LEVEL, p08: CAP_LEVEL, pm05: CAP_LEVEL };
  // Sources the checks restate (the lesson's own).
  const SRC = {
    turn: 'https://www.bbc.co.uk/bitesize/articles/z4dw239',
    ratios: 'https://openstax.org/books/algebra-and-trigonometry/pages/7-2-right-triangle-trigonometry',
    circle: 'https://openstax.org/books/precalculus-2e/pages/5-2-unit-circle-sine-and-cosine-functions',
    signs: 'https://www.bbc.co.uk/bitesize/topics/zt7wb82',
    degrees: 'https://www.bbc.co.uk/bitesize/articles/zck7rmn',
    slip: 'https://www.gcsu.edu/sites/files/page-assets/node-808/attachments/williams.pdf',
  };
  const FADE = 0.35, ANS = 1.8, LH = 17;
  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const testing = () => document.documentElement.classList.contains('k-testing');

  // ---------- text with amber key terms (built with K.el, never innerHTML) ----------
  function write(node, s) {
    node.textContent = '';
    String(s).split('`').forEach((seg, k) => {
      if (!seg) return;
      if (k % 2) { node.appendChild(K.el('span', { class: 'nw' }, seg)); return; }
      const re = /\*([^*]+)\*/g;

    const letGo = (e) => { if (held === e.pointerId) held = null; };
    g.addEventListener('pointerup', letGo);
    g.addEventListener('pointercancel', letGo);
    g.addEventListener('lostpointercapture', () => { held = null; });
    g.addEventListener('keydown', (e) => {
      if (!liveOn(id)) return;
      const by = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1 }[e.key];
      if (by == null) return;
      e.preventDefault();
      setGrip(id, gripVal(id) + by * (id === 'tip' ? 1 : 0.05));
    });
  });

  // The scene for a step (the animation calls this every frame).
  function paint(i) {
    if (i == null) i = at();
    const d = STEPS[i], st = S[i];
    art.textContent = '';
    into = null;
    REC = { segs: [], soft: [], handles: [], boxes: [], labs: [], tags: [], wedges: [], calcs: [], glowOn: [], arms: [], rows: [], pills: {}, pillAt: {}, quads: {}, key: false, tri: null, level: null };
    VH = d.vh;
    svg.setAttribute('viewBox', '0 0 340 ' + d.vh);
    svg.setAttribute('aria-label', PIC[d.pic](d, st) || '');
    if (!d.show && !ansOf(st) && st.res !== 'wrong') {
      let b = null;
      try { b = art.getBBox(); } catch (e) { b = null; }
      if (b && b.height > 0) svg.setAttribute('viewBox', '0 0 340 ' + Math.min(d.vh, Math.ceil(b.y + b.height + 10)));
    }
    placeGrips(d);
  }

  write(el('finish'), FINISH);
  K.update((p) => {
    const i = Math.round(p.step), d = STEPS[i], st = S[i];
    if (!anim.playing() && !waiting) T = Infinity;   // motion that was stopped (the page hidden, a test) shows finished
    if (i !== lastStep) {
      lastStep = i; enter('stepbox');
      if (d.show) { resetLive(st); play('demo', d.dur); }
      else { waiting = false; anim.pause(); T = Infinity; MODE = 'answer'; }
    }
    if (finished !== lastDone) { lastDone = finished; enter(finished ? 'done' : 'stepbox'); }
    const right = st.res === 'right';
    el('stepbox').hidden = finished;
    el('done').hidden = !finished;
    el('count').textContent = 'Step ' + (i + 1) + ' of ' + STEPS.length;
    const task = el('task');
    task.className = 'task' + (d.show ? ' show' : '');
    write(task, d.show ? d.text : d.task);
    const cap = el('cap'), cs = CAPS[d.pic] || '';
    cap.textContent = cs; cap.hidden = finished || !cs;
    paint(i);

    replayBtn.el.hidden = !d.show || REDUCE;
    el('replay').hidden = replayBtn.el.hidden;
    const opts = d.show ? [] : d.opts || [];
    el('picks').hidden = !opts.length;
    el('picks').classList.toggle('long', opts.some((o) => o.length > 6));
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      b.setLabel(opts[k]);
      b.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });

    el('acts').hidden = !!d.show;
    checkBtn.el.hidden = right;
    const fb = el('fb');
    fb.hidden = !!d.show;
    fb.className = 'fb' + (right ? ' right' : st.res === 'wrong' ? ' wrong' : '');
    write(fb, d.show ? '' : right ? 'That\'s it.' : st.res === 'wrong' ? hintFor(i, st) : st.res === 'empty' ? PICK : '');

    const why = el('why');
    why.hidden = d.show || !st.why;
    write(why, d.show ? '' : d.why);
    whyBtn.setLabel(st.why ? 'Hide why' : 'Why?');

    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !right);
    nextBtn.setLabel(i === STEPS.length - 1 ? 'Finish' : 'Continue');
    nav.hidden = backBtn.el.hidden && nextBtn.el.hidden;
  });

  // ---------- known answers, worked out by hand ----------
  const DO = STEPS.map((d, i) => i).filter((i) => !STEPS[i].show);
  const idx = (pic) => STEPS.findIndex((d) => d.pic === pic);
  // Step i painted in state st (motion m, at time tAt, finished if none), fn reading what it drew
  // before the page is put back.
  function withState(i, st, m, fn, tAt) {
    const keepS = S[i], keepT = T, keepM = MODE;
    S[i] = st; T = tAt == null ? Infinity : tAt; MODE = m || (STEPS[i].show ? 'demo' : 'answer');
    latest = 0; earliest = Infinity;
    try { paint(i); return fn(); } finally { S[i] = keepS; T = keepT; MODE = keepM; paint(); }
  }
  const drawn = (i, st, m) => withState(i, st, m, () => ({ texts: Array.from(art.querySelectorAll('text')).map((n) => n.textContent), rec: REC }));
  const solvedSt = (i) => stOf({ pick: STEPS[i].want, res: 'right' });
  const wrongSt = (i, o) => stOf({ pick: o, res: 'wrong' });
  const fail = (msg) => { throw new Error(msg); };
  const ANGS = [];
  for (let a = 0; a < 360; a += 10) ANGS.push(a);
  [1, 5, 85, 89, 91, 95, 175, 179, 181, 185, 265, 269, 271, 275, 355, 359, 30, 40, 120, 150, 210, 300, 330].forEach((a) => ANGS.push(a));
  const HS = [];
  for (let k = -20; k <= 20; k++) HS.push(k / 20);
  // Every state a step can be seen in.
  function statesOf(i) {
    const d = STEPS[i], out = [];
    if (d.show) {
      out.push([blank(), 'demo']);
      if ((d.live || []).indexOf('tip') >= 0) ANGS.forEach((th) => out.push([stOf({ th }), 'demo']));
      if ((d.live || []).indexOf('level') >= 0) HS.forEach((h) => out.push([stOf({ h }), 'demo']));
    } else {
      out.push([blank(), 'answer'], [solvedSt(i), 'answer'], [stOf({ why: true }), 'answer']);
      d.opts.filter((o) => o !== d.want).forEach((o) => out.push([wrongSt(i, o), 'answer'], [stOf({ pick: o, res: 'wrong', why: true }), 'answer']));
    }
    return out;
  }
  // What crowds the labels in the picture now: labels over labels or handles, or off the edge.
  function crowding() {
    const bad = [], boxes = [];
    art.querySelectorAll('text').forEach((t) => {
      let b = null;
      try { b = t.getBBox(); } catch (e) { b = null; }
      if (!b || !(b.width > 0) || !(b.height > 0)) return;
      const sh = b.height * 0.2;
      boxes.push({ s: t.textContent, x: b.x, y: b.y + sh, w: b.width, h: b.height - 2 * sh, calc: /^c/.test(t.getAttribute('class') || '') });
    });
    boxes.forEach((a, m) => {
      if (a.x < 1 || a.x + a.w > 339 || a.y < 0 || a.y + a.h > VH) bad.push('"' + a.s + '" off the edge');
      boxes.slice(m + 1).forEach((b) => {
        const ix = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x), iy = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y);
        if (ix > 1 && iy > 1) bad.push('"' + a.s + '" on "' + b.s + '"');
      });
      if (a.calc) return;
      REC.handles.forEach((h) => { const nx = K.clamp(h.x, a.x, a.x + a.w), ny = K.clamp(h.y, a.y, a.y + a.h); if (Math.hypot(nx - h.x, ny - h.y) < 11) bad.push('"' + a.s + '" on a handle'); });
    });
    return bad;
  }

  K.check('Angles are based on parts of a full turn, which is 360°: dragging the tip anywhere round the centre gives an angle from 0° up to but not including 360°, every quarter of the turn is reachable, and turning the arm on by a full 360° puts its tip back in the same place, so 30° and 390° are the same arm', () => {
    const angs = [];
    for (let x = 0; x <= 340; x += 20) for (let y = 0; y <= 260; y += 20) if (Math.hypot(x - O[0], y - O[1]) > 4) angs.push(tipAngle({ x, y }));
    const same = (a, b) => { const p = tipOf(a), q = tipOf(b); return K.near(p[0], q[0], 1e-9) && K.near(p[1], q[1], 1e-9); };
    for (let th = 0; th < 360; th++) if (!same(th, th + 360)) return false;
    return angs.every((a) => a >= 0 && a < 360 && a === Math.round(a)) && [0, 1, 2, 3].every((q) => angs.some((a) => a >= 90 * q && a < 90 * q + 90)) && same(30, 390) &&
      tipAngle({ x: O[0] + 50, y: O[1] }) === 0 && tipAngle({ x: O[0], y: O[1] - 50 }) === 90 && tipAngle({ x: O[0] - 50, y: O[1] }) === 180 && tipAngle({ x: O[0], y: O[1] + 50 }) === 270;
  }, { source: SRC.turn });
  K.check('The terminal side of the angle intersects the circle at the point (x, y), which is equivalent to (cos t, sin t): at whole angles all the way round, the arm\'s tip, measured off the drawing, lies on the circle, as far across as cos θ and as far up as sin θ, and the readout on each axis and the row under the picture give those same values', () => {
    const i = idx('tip30');
    for (let th = 0; th < 360; th += 6) {
      const r = drawn(i, stOf({ th }), 'demo').rec, t = r.tri;
      if (!K.near(Math.hypot(t.T[0] - O[0], t.T[1] - O[1]), RU, 1e-9)) fail('tip off the circle at ' + th);
      if (!K.near((t.T[0] - O[0]) / RU, cosD(th), 1e-9) || !K.near((O[1] - t.T[1]) / RU, sinD(th), 1e-9)) fail('tip not at (cos, sin) at ' + th);
      if (r.pills.c !== 'cos θ = ' + v3(cosD(th)) || r.pills.s !== 'sin θ = ' + v3(sinD(th))) fail('readouts wrong at ' + th + ': ' + r.pills.c + ' / ' + r.pills.s);
      if (!r.rows[0] || r.rows[0].s !== tipRow(th)) fail('tip row wrong at ' + th);
    }
    return true;
  }, { source: SRC.circle });
  K.check('Sine is the ratio of the opposite side to the hypotenuse and cosine the ratio of the adjacent side to the hypotenuse: on the first screen the upright side opposite θ divided by the arm, the hypotenuse, both measured off the drawing, is what the up axis reads, the side along the across axis divided by the arm is what the across axis reads, and the arm is exactly as long as the circle\'s radius', () => {
    const r = drawn(0, blank(), 'demo').rec, t = r.tri, hyp = Math.hypot(t.T[0] - O[0], t.T[1] - O[1]);
    const opp = t.F[1] - t.T[1], adj = t.F[0] - O[0];
    return K.near(hyp, RU, 1e-9) && r.pills.s === 'sin θ = ' + v3(opp / hyp) && r.pills.c === 'cos θ = ' + v3(adj / hyp) &&
      r.pills.s === 'sin θ = 0.5' && r.pills.c === 'cos θ = 0.866' && K.near(t.th, 30, 1e-9) && r.wedges.indexOf('30°') >= 0 && r.labs.indexOf('1') >= 0;
  }, { source: SRC.ratios });
  K.check('Sine, cosine and tangent all have different positive or negative values depending on what quadrant they are in: at whole angles all the way round, a side of the triangle is drawn dashed exactly when the coordinate it stands for is negative, the readouts carry the same signs, the slope row\'s tangent is negative exactly where sine and cosine have different signs, and the signs written in each quadrant on the four-quadrant screen match the tip\'s signs there', () => {
    const i4 = idx('sweep');
    for (let th = 1; th < 360; th += 4) {
      const r = drawn(i4, stOf({ th }), 'demo').rec, c = cosD(th), s = sinD(th);
      if (r.tri.base !== (c < 0 ? 'dashed' : 'solid') || r.tri.up !== (s < 0 ? 'dashed' : 'solid')) fail('dashed sides wrong at ' + th);
      if ((r.pills.c.indexOf('−') >= 0) !== (c < 0) || (r.pills.s.indexOf('−') >= 0) !== (s < 0)) fail('readout signs wrong at ' + th);
      if (r.key !== (c < 0 || s < 0)) fail('key wrong at ' + th);
      const q = th < 90 ? 1 : th < 180 ? 2 : th < 270 ? 3 : 4;
      if (r.quads[q] !== QN[q] + ' cos ' + (c < 0 ? '−' : '+') + ' sin ' + (s < 0 ? '−' : '+')) fail('quadrant ' + q + ' reads ' + r.quads[q]);
      const tr = tanRow(th);
      if ((tr.slice(tr.lastIndexOf('=')).indexOf('−') >= 0) !== (c * s < 0)) fail('tan sign wrong at ' + th);
    }
    return true;
  }, { source: SRC.signs });
  K.check('Scientific calculators need to be used for trigonometry and should be in degrees mode: the calculator on the level-line screen is marked DEG at every height of the line, and its inverse sine gives the angle in degrees, the one an arm is drawn at, where radians would give a far smaller number', () => {
    const i = idx('level');
    HS.forEach((h) => {
      const r = drawn(i, stOf({ h }), 'demo').rec, cc = r.calcs[0], a1 = asinD(h);
      if (!cc || cc.tag !== 'DEG' || cc.result !== trim(a1, 1)) fail('calculator wrong at ' + h);
      if (!r.arms.some((a) => K.near(a.th, a1 < 0 ? a1 + 360 : a1, 1e-9))) fail('no arm at the calculator angle at ' + h);
    });
    const r5 = drawn(i, blank(), 'demo').rec.calcs[0];
    return r5.entry === 'sin⁻¹ 0.5' && r5.result === '30' && trim(Math.asin(0.5), 1) !== r5.result;
  }, { source: SRC.degrees });
  K.check('Other students incorrectly identified the x-coordinate as the sine ratio: the first puzzle offers the tip\'s across coordinate as a wrong answer, with its own hint and its own red working, and on every screen with readouts the sine sits on the up axis and the cosine on the across axis', () => {
    const i = idx('p40'), d = STEPS[i], across = v3(cosD(P1));
    if (d.want === across || d.opts.indexOf(across) < 0 || !/across/.test(d.hints[across]) || !/across/.test(d.wrong[across])) return false;
    if (drawn(i, wrongSt(i, across), 'answer').rec.pills.c !== 'cos θ = ' + across) return false;
    return ['tip30', 'past90', 'sweep', 'squares'].every((pic) => [0, 40, 100, 150, 200, 250, 300, 350].every((th) => {
      const r = drawn(idx(pic), stOf({ th }), 'demo').rec, pc = r.pillAt.c, ps = r.pillAt.s;
      return !!pc && !!ps && Math.abs(pc.y - O[1]) <= 64 && Math.abs(ps.x - O[0]) <= ps.w / 2 + 77;
    }));
  }, { source: SRC.slip });
  K.check('cos² θ + sin² θ = 1 at every whole angle: the squares row always comes to 1, at 150° it reads 0.75 + 0.25 = 1, and on an axis one square is 0 and the other 1', () => {
    for (let th = 0; th < 360; th++) if (!/= 1$/.test(sqRow(th)) || !K.near(Math.pow(cosD(th), 2) + Math.pow(sinD(th), 2), 1, 1e-12)) return false;
    const r = drawn(idx('squares'), blank(), 'demo').rec;
    return r.rows[0].s === 'cos² θ + sin² θ = 0.75 + 0.25 = 1' && sqRow(90) === 'cos² θ + sin² θ = 0 + 1 = 1' && sqRow(180) === 'cos² θ + sin² θ = 1 + 0 = 1';
  });
  K.check('tan θ = sin θ ÷ cos θ is the arm\'s slope, rise over run: at 150° the slope row reads 0.5 ÷ −0.866 = −0.577, at whole angles off the up axis it equals the drawn rise over run, and at 90° and 270°, where the run is 0, it says tan has no value', () => {
    const i = idx('squares');
    for (let th = 0; th < 360; th += 10) {
      if (th % 180 === 90) continue;
      const r = drawn(i, stOf({ th }), 'demo').rec, t = r.tri;
      if (!K.near(tanD(th), (O[1] - t.T[1]) / (t.T[0] - O[0]), 1e-9) || r.rows[2].s !== tanRow(th)) fail('slope wrong at ' + th);
    }
    return drawn(i, blank(), 'demo').rec.rows[2].s === 'tan 150° = 0.5 ÷ −0.866 = −0.577' && /no value/.test(drawn(i, stOf({ th: 90 }), 'demo').rec.rows[2].s) && /no value/.test(tanRow(270));
  });
  K.check('Two angles share each sine, mirror images across the up axis that add up to 180°: at every height of the level line from −1 to 1 each arm\'s tip lies on the circle and on the line, the calculator\'s angle lies between −90° and 90°, the row gives the second angle from it, at 0.5 the arms are at 30° and 150°, and at the very top and bottom the two arms are one', () => {
    const i = idx('level');
    HS.forEach((h) => {
      const r = drawn(i, stOf({ h }), 'demo').rec, a1 = asinD(h), arms = r.arms.filter((a) => a.cls === 'arm2');
      if (!(a1 >= -90 && a1 <= 90)) fail('calculator angle out of range at ' + h);
      if (arms.length !== (Math.abs(h) === 1 ? 1 : 2)) fail(arms.length + ' arms at ' + h);
      if (!arms.every((a) => { const p = tipOf(a.th); return K.near(p[1], r.level.y, 1e-9) && K.near(Math.hypot(p[0] - O[0], p[1] - O[1]), RU, 1e-9); })) fail('arm off the line at ' + h);
      if (arms.length === 2 && (!K.near(tipOf(arms[0].th)[0] - O[0], O[0] - tipOf(arms[1].th)[0], 1e-9) || !K.near(a1 + (180 - a1), 180, 1e-9))) fail('arms not mirrored at ' + h);
      if (!r.rows[0] || r.rows[0].s !== mirrorRow(h)) fail('mirror row wrong at ' + h);
      if (arms.some((a) => r.labs.indexOf(angS(a.th)) < 0)) fail('an arm without its angle at ' + h);
    });
    const r = drawn(i, blank(), 'demo').rec;
    return r.labs.indexOf('30°') >= 0 && r.labs.indexOf('150°') >= 0 && r.rows[0].s === '180° − 30° = 150°' && r.pills.h === 'sin θ = 0.5';
  });
  K.check('Each puzzle accepts only its right answer, every wrong answer has its own hint and its own red row of working, the answer appears once it is given, and before an answer nothing in the picture gives it away', () =>
    DO.every((i) => {
      const d = STEPS[i];
      if (d.opts.length !== 3 || new Set(d.opts).size !== 3 || d.opts.indexOf(d.want) < 0 || !d.opts.every((o) => isRight(i, stOf({ pick: o })) === (o === d.want))) fail('options wrong on step ' + (i + 1));
      const wrongs = d.opts.filter((o) => o !== d.want);
      if (!wrongs.every((o) => d.hints[o] && d.wrong[o] && wrongs.every((p) => p === o || d.hints[p] !== d.hints[o]))) fail('hints missing on step ' + (i + 1));
      const b = drawn(i, blank(), 'answer'), s = drawn(i, solvedSt(i), 'answer');
      if (b.rec.rows.length || d.secret.some((x) => b.texts.some((t) => t.indexOf(x) >= 0))) fail('answer shown early on step ' + (i + 1));
      if (!(s.rec.rows.length === d.right.length && s.rec.rows.every((r) => !r.bad)) || !d.secret.every((x) => s.texts.some((t) => t.indexOf(x) >= 0))) fail('answer not drawn on step ' + (i + 1));
      return wrongs.every((o) => { const r = drawn(i, wrongSt(i, o), 'answer').rec.rows; return r.length === 1 && r[0].bad && r[0].s === d.wrong[o]; });
    }));
  K.check('Every worked number matches the lesson: 0.866 and 0.5 at 30°; 0.766, 0.643 and 1.409 at 40°; −0.866 and 0.5 at 150°; −0.5, 0.5 and 0.866 at 120°; −0.866 and −0.5 at 210°; 0.866 and −0.5 at 330°; 0.5 and −0.866 at 300°; 0.75 + 0.25 = 1 and −0.577 at 150°; 0.36, 0.64, −0.8, 0.8 and 0.4; 30° and 150° at 0.5; 53.1°, 126.9° and 306.9° with −0.8; −30°, 210° and 330°; −0.342, 0.342, 0.94 and 70° at 110°', () => {
    const same = (a, b) => a.length === b.length && a.every((v, k) => v === b[k]);
    return same(o1, ['0.766', '0.643', '1.409']) && same(o3, ['0.5', '0.866', '−0.5']) && same(o5, ['(0.5, −0.866)', '(−0.866, 0.5)', '(0.5, 0.866)']) &&
      same(o7, ['0.8', '−0.8', '0.4']) && same(o9, ['53.1° only', '53.1° and 306.9°', '53.1° and 126.9°']) && same(o10, ['210° and 330°', '30° and 150°', '150° and 330°']) &&
      same(o11, ['0.342', '−0.342', '0.94']) && tipRow(30) === 'tip = (cos θ, sin θ) = (0.866, 0.5)' && tipRow(150) === 'tip = (cos θ, sin θ) = (−0.866, 0.5)' &&
      pair(cosD(210), sinD(210)) === '(−0.866, −0.5)' && pair(cosD(330), sinD(330)) === '(0.866, −0.5)' && angS(BAD5[o5[1]]) === '150°' &&
      sqRow(150) === 'cos² θ + sin² θ = 0.75 + 0.25 = 1' && tanRow(150) === 'tan 150° = 0.5 ÷ −0.866 = −0.577' &&
      v3(S7 * S7) === '0.36' && v3(1 - S7 * S7) === '0.64' && mirrorRow(0.5) === '180° − 30° = 150°' && v3(sinD(360 - A9)) === '−0.8' &&
      angS(A10) === '−30°' && mirrorRow(-0.5) === '180° + 30° = 210°' && angS(360 + A10) === '330°' && angS(180 - P11) === '70°' && v3(cosD(180 - P11)) === '0.342';
  });
  K.check('No label sits on another label or a handle, or runs off the picture, on any screen in any state: puzzles answered right, wrong or with Why? open, the arm dragged all the way round, the level line at every height', () =>
    STEPS.every((d, i) => statesOf(i).every((s) => withState(i, s[0], s[1], () => { const bad = crowding(); if (bad.length) fail('step ' + (i + 1) + ' ' + JSON.stringify({ th: s[0].th, h: s[0].h, pick: s[0].pick, why: s[0].why }) + ': ' + bad[0]); return true; }))));
  K.check('Every demonstration has finished within 4.5 s of its screen opening, none starting before the 0.35 s screen fade ends; each answer and Why? has settled within 1.8 s', () =>
    STEPS.every((d, i) => {
      const timed = (st, m) => withState(i, st, m, () => [latest, earliest]);
      if (d.show) {
        const t = timed(blank(), 'demo');
        if (!(t[0] <= d.dur + 1e-9 && d.dur <= 4.5 && d.dur >= 3 && t[1] >= FADE)) fail('step ' + (i + 1) + ' runs ' + t[0] + ' s from ' + t[1]);
        return true;
      }
      return statesOf(i).every((s) => timed(s[0], s[1])[0] <= ANS + 1e-9);
    }));

  K.ready();
</script>
