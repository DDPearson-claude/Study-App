<p class="lead">A hinge of two straight arms, 3 and 4 long, with three bars under it for the square of the third side.</p>

<div class="pz" id="pz">
  <div id="prog"></div>
  <div id="stepbox">
    <p class="k-label count" id="count"></p>
    <p class="task" id="task"></p>
    <svg class="scene" id="scene" viewBox="0 0 340 300" width="100%" role="img" aria-label=""><g id="art"></g><g id="ui"></g></svg>
    <div class="replay" id="replay"></div>
    <p class="after" id="after" hidden></p>
    <div class="row picks" id="picks"></div>
    <div class="row acts" id="acts"></div>

</div>

<p class="caption" id="cap" hidden></p>

<script>
  const el = (id) => document.getElementById(id);
  // ---------- numbers (pure, so the checks can test them) ----------
  const RAD = Math.PI / 180;
  const sinD = (a) => Math.sin(a * RAD), cosD = (a) => Math.cos(a * RAD);
  const asinD = (v) => Math.asin(Math.max(-1, Math.min(1, v))) / RAD, acosD = (v) => Math.acos(Math.max(-1, Math.min(1, v))) / RAD;
  const neg = (s) => String(s).replace(/^-/, '−');
  // v rounded to dp places with trailing zeros dropped: 0.5, 0.342, 30.
  function trim(v, dp) {
    const f = Math.pow(10, dp);
    let s = (Math.round(v * f) / f).toFixed(dp);
    if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
    if (s === '-0') s = '0';
    return neg(s);
  }
  // v to exactly dp places, so it sits beside answers of the same length: 4.10, 0.940, 49.0.
  function fix(v, dp) {
    const f = Math.pow(10, dp);
    let s = (Math.round(v * f) / f).toFixed(dp);
    if (/^-0(\.0*)?$/.test(s)) s = s.slice(1);
    return neg(s);
  }
  const v3 = (v) => trim(v, 3), hS = (v) => trim(v, 2), angS = (v) => trim(v, 1) + '°';
  const f1 = (v) => fix(v, 1), f2 = (v) => fix(v, 2), f3 = (v) => fix(v, 3);
  const dirAng = (P, Q) => Math.atan2(P[1] - Q[1], Q[0] - P[0]) / RAD;   // the direction of Q seen from P, anticlockwise from pointing right

  // The hinge's rule: arms a = 3 and b = 4, c² = a² + b² − 2ab cos C.
  const HA = 3, HB = 4, SUM = HA * HA + HB * HB, TWO = 2 * HA * HB;
  const corr = (th) => -TWO * cosD(th);
  const csq = (th) => SUM + corr(th);
  const cLen = (th) => Math.sqrt(Math.max(0, csq(th)));
  const corrS = (th) => { const v = corr(th); return Math.abs(v) < 0.005 ? '0' : (v > 0 ? '+' : '−') + hS(Math.abs(v)); };

  // The lesson's example values.
  const P1 = 120, P3 = 60, P5 = 110, S3 = 6;
  const CB = acosD((HA * HA + HB * HB - S3 * S3) / TWO);
  const cosRow = 'cos C = (' + HA * HA + ' + ' + HB * HB + ' − ' + S3 * S3 + ') ÷ ' + TWO + ' = ' + v3(cosD(CB));
  const angRow = 'C = cos⁻¹(' + v3(cosD(CB)) + ') = ' + angS(CB);
  // A triangle with a = 5, b = 8 and c = 7: C is opposite the 7, A opposite the 5.
  const Ta = 5, Tb = 8, Tc = 7;
  const C7 = acosD((Ta * Ta + Tb * Tb - Tc * Tc) / (2 * Ta * Tb)), C7bad = acosD((Tc * Tc - Ta * Ta - Tb * Tb) / (2 * Ta * Tb)), A7 = acosD((Tb * Tb + Tc * Tc - Ta * Ta) / (2 * Tb * Tc));
  const sq7 = Ta * Ta + ' + ' + Tb * Tb + ' − ' + Tc * Tc, den7 = 2 * Ta * Tb;
  // The sine rule: A = 40°, B = 60°, a = 5.
  const SA = 40, SB = 60, Sa = 5, Sb = Sa * sinD(SB) / sinD(SA), Sc = Sa * sinD(180 - SA - SB) / sinD(SA);
  // The swing arm: b = 8 at A = 30° puts C a height 8 sin 30° = 4 above the base line.
  const WA = 30, WB = 8, WH = WB * sinD(WA), W5 = 5, W6 = 6;
  // Two ships, and the engine.
  const Sh1 = 48, Sh2 = 40, ShA = 113, shSq = Sh1 * Sh1 + Sh2 * Sh2, shK = 2 * Sh1 * Sh2 * cosD(ShA), shipD = Math.sqrt(shSq - shK);
  const Kc = 50, Kr = 200, KA = 40, Ksin = Kc * sinD(KA) / Kr, Kth = asinD(Ksin), KthR = Math.round(Kth * 10) / 10;

  // Where the swinging arm lands on the base line, in units from A, and the angles B there.
  function landings(al) {
    if (al < WH - 1e-9) return { short: true };
    const touch = Math.abs(al - WH) < 1e-9, dx = touch ? 0 : Math.sqrt(al * al - WH * WH), second = WB * cosD(WA) - dx, b1 = asinD(WH / al);
    return { short: false, touch, dx, second, two: !touch && second > 1e-9, atA: !touch && Math.abs(second) <= 1e-9, behind: !touch && second < -1e-9,
      B1: b1, B2: 180 - Math.round(b1 * 10) / 10 };
  }
  const B6 = asinD(WH / W6), B6r = Math.round(B6 * 10) / 10;

  // The answers each puzzle offers.
  const o1 = [hS(cLen(P3)), hS(cLen(P1)), hS(cLen(90))];
  const o3 = [hS(csq(P3)), hS(SUM - (TWO / 2) * cosD(P3)), hS((SUM - TWO) * cosD(P3))];
  const o5 = [f2(Math.sqrt(SUM + TWO * cosD(P5))), f2(Math.sqrt(SUM - TWO * sinD(P5))), f2(cLen(P5))];
  const o7 = [angS(C7bad), angS(C7), angS(A7)];
  const o9 = [hS(Sb), hS(Sa * sinD(SA) / sinD(SB)), hS(Sa * SB / SA)];
  const o11 = [angS(B6) + ' only', angS(B6) + ' and ' + angS(180 - B6r), angS(B6) + ' and ' + angS(360 - B6r)];
  const o12 = [f1(Math.sqrt(shSq)), f1(Math.sqrt(shSq + shK)), f1(shipD)];
  const o13 = [angS(Kth) + ' only', angS(Kth) + ' or ' + angS(180 - KthR), 'no such triangle'];

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // pic: the picture; vh: its height; dur: a demonstration's length; live: what Dan can drag.
  // A puzzle has opts, want, a hint for each wrong answer, why, rows of working (right, and wrong[answer]
  // in red) and secret: what the picture must not show before an answer.
  const PICK = 'Tap one of the answers.';
  const STEPS = [
    { show: true, name: 'The hinge', pic: 'hinge90', vh: 300, dur: 3.6, live: ['hinge'],
      text: 'Two straight arms are joined at a hinge. Arm `a` is 3 long, arm `b` is 4 long, and `C` is the angle between them. The third side, `c`, joins their free ends. Each side takes the small letter of the corner opposite it. At 90° Pythagoras gives `c² = 9 + 16 = 25`, so `c = 5`. Close the hinge and the free ends come together, so `c` is shorter. Open it and they move apart, so `c` is longer. Drag the end of arm `a`.',
      after: 'The bars share one scale. The first, `a² + b²`, is 25 at every angle. The second is the correction, which takes away below 90°, is empty at 90° and adds past it. The third, `c²`, is the first two together.' },
    { kind: 'pick', name: 'c at 120°', pic: 'p120', vh: 372,
      opts: o1, want: o1[1], secret: [o1[1], hS(csq(P1))],
      task: 'The hinge opens to 120°. How long is `c` now?',
      why: 'Past 90° the free ends are further apart than at a right angle, so `c` is longer than Pythagoras\' 5. The bars show by how much. The correction adds 12, so `c² = 25 + 12 = 37` and `c = 6.08`.',
      hint: 'Not quite. Opening the hinge moves the free ends apart.',
      hints: { [o1[0]]: 'Not quite. 3.61 is `c` at 60°, with the hinge closed in. At 120° it is opened out.',
        [o1[2]]: 'Not quite. 5 is `c` at 90°, where Pythagoras holds. At 120° the hinge is wider.' },
      right: ['c² = 25 + ' + hS(corr(P1)) + ' = ' + hS(csq(P1)), 'c = √' + hS(csq(P1)) + ' = ' + o1[1]],
      wrong: { [o1[0]]: o1[0] + ' is c at 60°, closed in', [o1[2]]: o1[2] + ' is c at 90° only' } },
    { show: true, name: 'Building the rule', pic: 'derive', vh: 298, dur: 4.4, live: ['hinge'],
      text: 'Where does the correction come from? Lay arm `b` along the across axis from the hinge, so its free end is at `(b, 0)`. Arm `a` is lesson 3\'s turning arm made `a` times longer, so its tip is at `(a cos C, a sin C)`. The gap between the free ends is `b − a cos C` across and `a sin C` up, so Pythagoras on that gap gives `c²`. Multiply it out, and lesson 3\'s `cos² C + sin² C = 1` turns the last two terms into `a²`. Drag the end of arm `a`.',
      after: 'That leaves the *cosine rule*, `c² = a² + b² − 2ab cos C`. It is Pythagoras with a correction, `−2ab cos C`, so it works for every triangle.' },
    { kind: 'pick', name: 'c² at 60°', pic: 'p60', vh: 372,
      opts: o3, want: o3[0], secret: [o3[0], o1[0]],
      task: 'The hinge closes to 60°, where `cos 60° = 0.5`. What is `c²`?',
      why: 'Here `a² + b² = 25` and `2ab = 2 × 3 × 4 = 24`. So `c² = 25 − 24 × 0.5 = 25 − 12 = 13`, multiplying before taking away. That makes `c = 3.61`, shorter than Pythagoras\' 5.',
      hint: 'Not quite. Use `c² = a² + b² − 2ab cos C`.',
      hints: { [o3[1]]: 'Not quite. `2ab` is 2 × 3 × 4 = 24. The 2 has gone missing.',
        [o3[2]]: 'Not quite. Multiply first, `24 × 0.5 = 12`, then take it from 25.' },
      right: ['c² = 25 − 24 × 0.5 = 25 − 12 = ' + o3[0], 'c = √' + o3[0] + ' = ' + o1[0]],
      wrong: { [o3[1]]: '25 − 12 × 0.5 = ' + o3[1] + ' drops the 2', [o3[2]]: '(25 − 24) × 0.5 = ' + o3[2] + ' takes away first' } },
    { show: true, name: 'Flat and folded', pic: 'flat', vh: 350, dur: 4.4, live: ['hinge'],
      text: 'Past 90° the tip of arm `a` swings left of the hinge, so `cos C` turns negative. At 110°, `cos 110° = −0.342`. The correction takes away `24 × cos C`, and taking away a negative adds, so its bar stands above the line and `c` is longer than Pythagoras gives. Laid flat at 180°, the arms make one straight line and `c = 3 + 4 = 7`. Folded shut at 0°, they lie together and `c = 4 − 3 = 1`. Drag the end of arm `a`.',
      after: 'At 0° and 180° there is no triangle left, but the rule still gives the gap between the free ends.' },
    { kind: 'pick', name: 'c at 110°', pic: 'p110', vh: 372,
      opts: o5, want: o5[2], secret: [o5[2], hS(csq(P5)), hS(corr(P5))],
      task: 'The hinge opens to 110°, where `cos 110° = −0.342`. How long is `c`?',
      why: '`c² = 25 − 24 × (−0.342)`. Taking away a negative adds, so `c² = 25 + 8.21 = 33.21` and `c = 5.76`. That is longer than Pythagoras\' 5, because the hinge is past 90°.',
      hint: 'Not quite. Keep the cosine\'s sign.',
      hints: { [o5[0]]: 'Not quite. `cos 110°` is negative, so the correction adds. The minus sign got lost.',
        [o5[1]]: 'Not quite. That uses `sin 110° = 0.940`. The cosine rule needs the cosine.' },
      right: ['c² = 25 − 24 × (' + v3(cosD(P5)) + ') = 25 + ' + hS(corr(P5)), '= ' + hS(csq(P5)) + ', so c = ' + o5[2]],
      wrong: { [o5[0]]: '25 − ' + hS(corr(P5)) + ' = ' + hS(SUM - corr(P5)) + ' lost the minus sign',
        [o5[1]]: '25 − 24 × ' + f3(sinD(P5)) + ' = ' + hS(SUM - TWO * sinD(P5)) + ' used sin 110°' } },
    { show: true, name: 'Back to the angle', pic: 'back', vh: 350, dur: 3.4,
      text: 'The rule also runs backwards, from three sides to an angle. Rearrange it to `cos C = (a² + b² − c²) ÷ 2ab`, with `c` the side opposite the angle you want, and press `cos⁻¹`. With arms 3 and 4 and a third side of 6, `cos C = (9 + 16 − 36) ÷ 24 = −0.458`, so `C = 117.3°`. Each angle from 0° to 180° has a cosine of its own, so `cos⁻¹` gives the one angle that fits, acute or obtuse.' },
    { kind: 'pick', name: 'Sides 5, 8 and 7', pic: 'p578', vh: 294,
      opts: o7, want: o7[1], secret: [o7[1]],
      task: 'A triangle has sides 5, 8 and 7. What is the angle `C`, opposite the side of 7?',
      why: '`C` sits between the sides of 5 and 8, so `cos C = (5² + 8² − 7²) ÷ (2 × 5 × 8) = (25 + 64 − 49) ÷ 80 = 0.5`, and `cos⁻¹ 0.5 = 60°`. The side opposite the angle you want is the one taken away.',
      hint: 'Not quite. Take away the square of the side opposite `C`.',
      hints: { [o7[0]]: 'Not quite. The subtraction is the wrong way round. It is `25 + 64 − 49`, not `49 − 25 − 64`.',
        [o7[2]]: 'Not quite. 38.2° is the angle opposite the 5. Take away the square of the side opposite `C`, the 7.' },
      right: ['cos C = (' + sq7 + ') ÷ ' + den7 + ' = ' + v3((Ta * Ta + Tb * Tb - Tc * Tc) / den7), 'C = cos⁻¹ ' + v3((Ta * Ta + Tb * Tb - Tc * Tc) / den7) + ' = ' + o7[1]],
      wrong: { [o7[0]]: '(' + Tc * Tc + ' − ' + Ta * Ta + ' − ' + Tb * Tb + ') ÷ ' + den7 + ' = ' + v3((Tc * Tc - Ta * Ta - Tb * Tb) / den7) + ' gives ' + o7[0],
        [o7[2]]: o7[2] + ' is the angle A, opposite the 5' } },
    { show: true, name: 'A height, twice', pic: 'height', vh: 316, dur: 4.2,
      text: 'Now a second rule. In a triangle `ABC`, drop a line from `B` square onto side `AC`. It makes two right-angled triangles, and lesson 1\'s sine gives the height, `h`, twice. In the left one `h = c sin A`, and in the right one `h = a sin C`. So `c sin A = a sin C`, and dividing both sides by `sin A sin C` gives `a ÷ sin A = c ÷ sin C`. A height from another corner brings in `b` the same way.',
      after: 'This is the *sine rule*, `a ÷ sin A = b ÷ sin B = c ÷ sin C`. Each side over the sine of the angle opposite it gives the same number all round the triangle.' },
    { kind: 'pick', name: 'Side b', pic: 'p4060', vh: 310,
      opts: o9, want: o9[0], secret: [o9[0]],
      task: 'In triangle `ABC`, `A = 40°`, `B = 60°` and `a = 5`. How long is `b`?',
      why: 'Pair each side with the angle opposite it, `b ÷ sin 60° = 5 ÷ sin 40°`. So `b = 5 × sin 60° ÷ sin 40° = 6.74`. Side `b` faces the bigger angle, so it is the longer of the two.',
      hint: 'Not quite. Each side goes over the sine of the angle opposite it.',
      hints: { [o9[1]]: 'Not quite. The sines are upside down. `b` goes with `sin 60°`, so `sin 60°` goes on top.',
        [o9[2]]: 'Not quite. Divide the sines of the angles, not the angles themselves.' },
      right: ['b ÷ sin 60° = 5 ÷ sin 40°', 'b = 5 × sin 60° ÷ sin 40° = ' + o9[0]],
      wrong: { [o9[1]]: '5 × sin 40° ÷ sin 60° = ' + o9[1] + ', upside down', [o9[2]]: '5 × 60 ÷ 40 = ' + o9[2] + ' uses the angles' } },
    { show: true, name: 'The swing arm', pic: 'swing', vh: 322, dur: 4.0, live: ['arm'],
      text: 'Finding an angle with the sine rule has a catch. Here side `b = 8` rises at 30° from corner `A` to corner `C`, 4 above the base line. From `C` an arm `a` swings round, and wherever its end meets the base line is a corner `B`. An arm of 3 falls short. At 5 it lands twice, since `sin B = 8 × 0.5 ÷ 5 = 0.8` gives `B = 53.1°`, and `180° − 53.1° = 126.9°` shares that sine. At 8 or longer the second landing is at `A` or behind it, so one triangle is left. Drag the knob along the scale for arm `a`.',
      after: 'When the same facts fit two triangles, it is called the *ambiguous case*. The second angle fits only if the angles still come to less than 180°.' },
    { kind: 'pick', name: 'An arm of 6', pic: 'p6', vh: 286,
      opts: o11, want: o11[1], secret: [angS(180 - B6r)],
      task: 'Now the arm is 6, so `sin B = 4 ÷ 6 = 0.667`. Which angles `B` fit?',

    return K.near(lenOf(sw.B1, WCv) / WSU, 5, 1e-9) && angS(ang) === '53.1°' && sw.lab1 === '53.1°';
  }, { source: SRC.signs });
  K.check('The second answer is found by subtracting the first answer from 180°; if the angles in the triangle do not exceed the angle sum of a triangle, 180°, the second answer can exist: at every arm length from 2 to 9 on the swing-arm screen, a second triangle is drawn exactly when 30° plus 180° minus the first angle B is under 180°, its angle B is 180° minus the first, both landings lie on the base line exactly the arm\'s length from C, and an arm shorter than the height, 4, lands nowhere', () => {
    const i = idx('swing');
    ALS.forEach((al) => {
      if (Math.abs(al - 8) < 0.05 || Math.abs(al - 4) < 0.05) return;
      const sw = drawn(i, stOf({ al }), 'demo').rec.swing;
      if (al < 4) { if (!sw.L.short || sw.B1) fail('a landing at ' + al); return; }
      const b1 = 180 - dirAng(sw.B1, WCv), expect = WA + 180 - b1 < 180;
      if (sw.two !== expect) fail('second triangle wrong at ' + al);
      if (!K.near(lenOf(sw.B1, WCv), al * WSU, 1e-9) || !K.near(sw.B1[1], BY, 1e-9)) fail('first landing off at ' + al);
      if (sw.two && (!K.near(lenOf(sw.B2, WCv), al * WSU, 1e-9) || !K.near(180 - dirAng(sw.B2, WCv), 180 - b1, 1e-9) || !K.near(sw.B2[1], BY, 1e-9))) fail('second landing off at ' + al);
      if (!expect && !sw.behind) fail('the far landing not shown behind A at ' + al);
    });
    const s5 = drawn(i, stOf({ al: 5 }), 'demo').rec.swing;
    return s5.two && s5.lab2 === '126.9°';
  }, { source: SRC.second });
  K.check('A height dropped from B is found twice: on the height screen, the drawn height, measured off the drawing, equals c sin A and a sin C, with c, a and the angles A and C measured off the same drawing, so a ÷ sin A = c ÷ sin C there too', () => {
    const r = drawn(idx('height'), blank(), 'demo').rec, t = r.tri;
    const h = t.H[1] - t.B[1], c = lenOf(t.A, t.B), a = lenOf(t.B, t.C), A = dirAng(t.A, t.B), C = 180 - dirAng(t.C, t.B);
    return K.near(h, c * sinD(A), 1e-9) && K.near(h, a * sinD(C), 1e-9) && K.near(a / sinD(A), c / sinD(C), 1e-9) && r.rows.length === 4 && r.rows[3].s === 'a ÷ sin A = c ÷ sin C';
  });
  K.check('Every worked number matches the lesson: c = 5 at 90°; 6.08 and 37 at 120°; 3.61 and 13 at 60°, with slips 19 and 0.5; cos 110° = −0.342, a correction of 8.21, c² = 33.21 and c = 5.76, with slips 4.10 and 1.56; 7 laid flat and 1 folded; −0.458 and 117.3° from 3, 4 and 6; 60°, 120° and 38.2° from 5, 8 and 7; 6.74, 3.71 and 7.5; a height of 4, 0.8, 53.1° and 126.9°; 0.667, 41.8°, 138.2° and 318.2°; 73.5, 62.5 and 49.0 nautical miles; 0.161, 9.2° and 170.8°', () => {
    const same = (a, b) => a.length === b.length && a.every((v, k) => v === b[k]);
    const L5 = landings(W5);
    return hS(cLen(90)) === '5' && same(o1, ['3.61', '6.08', '5']) && hS(csq(P1)) === '37' && same(o3, ['13', '19', '0.5']) &&
      v3(cosD(P5)) === '−0.342' && hS(corr(P5)) === '8.21' && hS(csq(P5)) === '33.21' && same(o5, ['4.10', '1.56', '5.76']) && f3(sinD(P5)) === '0.940' &&
      hS(cLen(180)) === '7' && hS(cLen(0)) === '1' && cosRow === 'cos C = (9 + 16 − 36) ÷ 24 = −0.458' && angS(CB) === '117.3°' && hS(cLen(CB)) === '6' &&
      same(o7, ['120°', '60°', '38.2°']) && same(o9, ['6.74', '3.71', '7.5']) && hS(WH) === '4' && v3(WH / W5) === '0.8' && angS(L5.B1) === '53.1°' && angS(L5.B2) === '126.9°' && L5.two &&
      v3(WH / W6) === '0.667' && same(o11, ['41.8° only', '41.8° and 138.2°', '41.8° and 318.2°']) && landings(W6).two && landings(3).short && landings(8).atA && landings(8.5).behind &&
      same(o12, ['62.5', '49.0', '73.5']) && String(shSq) === '3904' && hS(-shK) === '1500.41' && hS(shSq - shK) === '5404.41' &&
      v3(Ksin) === '0.161' && same(o13, ['9.2° only', '9.2° or 170.8°', 'no such triangle']) && Kc * sinD(KA) / Kr < 1 && Kr * sinD(KA) / Kc > 1;
  });
  K.check('Each puzzle accepts only its right answer, every wrong answer has its own hint and its own red row of working, the answer appears once it is given, and before an answer nothing in the picture gives it away', () =>
    DO.every((i) => {
      const d = STEPS[i];
      if (d.opts.length !== 3 || new Set(d.opts).size !== 3 || d.opts.indexOf(d.want) < 0 || !d.opts.every((o) => isRight(i, stOf({ pick: o })) === (o === d.want))) fail('options wrong on step ' + (i + 1));
      const wrongs = d.opts.filter((o) => o !== d.want);
      if (!wrongs.every((o) => d.hints[o] && d.wrong[o] && wrongs.every((p) => p === o || d.hints[p] !== d.hints[o]))) fail('hints missing on step ' + (i + 1));
      const b = drawn(i, blank(), 'answer'), s = drawn(i, solvedSt(i), 'answer');
      if (b.rec.rows.length || d.secret.some((x) => b.texts.some((t) => t.indexOf(x) >= 0))) fail('answer shown early on step ' + (i + 1));
      if (!(s.rec.rows.length === d.right.length && s.rec.rows.every((r) => !r.bad)) || !d.secret.every((x) => s.texts.some((t) => t.indexOf(x) >= 0))) fail('answer not drawn on step ' + (i + 1));
      return wrongs.every((o) => { const r = drawn(i, wrongSt(i, o), 'answer').rec.rows; return r.length === 1 && r[0].bad && r[0].s === d.wrong[o]; });
    }));
  K.check('No label sits on another label or a handle, or runs off the picture, on any screen in any state: puzzles answered right, wrong or with Why? open, the hinge dragged to every angle, the arm set to every length', () =>
    STEPS.every((d, i) => statesOf(i).every((s) => withState(i, s[0], s[1], () => { const bad = crowding(); if (bad.length) fail('step ' + (i + 1) + ' ' + JSON.stringify({ th: s[0].th, al: s[0].al, pick: s[0].pick, why: s[0].why }) + ': ' + bad[0]); return true; }))));
  K.check('Every demonstration has finished within 4.5 s of its screen opening, none starting before the 0.35 s screen fade ends; each answer and Why? has settled within 1.8 s', () =>
    STEPS.every((d, i) => {
      const timed = (st, m) => withState(i, st, m, () => [latest, earliest]);

        if (!(t[0] <= d.dur + 1e-9 && d.dur <= 4.5 && d.dur >= 3 && t[1] >= FADE)) fail('step ' + (i + 1) + ' runs ' + t[0] + ' s from ' + t[1]);
        return true;
      }
      return statesOf(i).every((s) => timed(s[0], s[1])[0] <= ANS + 1e-9);
    }));

  K.ready();
