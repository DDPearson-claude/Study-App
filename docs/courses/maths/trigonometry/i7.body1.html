<p class="lead">Two turning arrows laid tip to tail with their bold sum arrow, the waves their heights draw against time, a three-phase card, then mixed puzzles.</p>

<script>
  const el = (id) => document.getElementById(id);
  // ---------- numbers (pure, so the checks can test them) ----------
  const PI = Math.PI, TAU = 2 * Math.PI, DEG = 180 / Math.PI, RAD = Math.PI / 180;
  const sinD = (a) => Math.sin(a * RAD), cosD = (a) => Math.cos(a * RAD);
  const SQ2 = Math.SQRT2, SQ3 = Math.sqrt(3);
  const neg = (s) => String(s).replace(/^-/, '−');
  // v rounded to dp places with trailing zeros dropped: 5.196, 14, 0.5.
  function trim(v, dp) {
    const f = Math.pow(10, dp);
    let s = (Math.round(v * f) / f).toFixed(dp);
    if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
    if (s === '-0') s = '0';
    return neg(s);
  }
  const hS = (v) => trim(v, 2);
  // "+ 3" or "− 3": a shadow added on, keeping its sign.
  const pm = (v, dp) => (v < 0 && trim(-v, dp) !== '0' ? '− ' + trim(-v, dp) : '+ ' + trim(Math.abs(v), dp));
  const norm = (x) => ((((x + 180) % 360) + 360) % 360) - 180;
  const lenOf = (p, q) => Math.hypot(p[0] - q[0], p[1] - q[1]);
  const vec = (L, deg) => [L * cosD(deg), L * sinD(deg)];
  // The scale's top value: the smallest of 5, 10, 15, 20 that holds every arrow and wave.
  const niceMax = (v) => Math.max(5, 5 * Math.ceil(v / 5 - 1e-9));
  // Two arrows (lengths a, b at start angles pa, pb in degrees): their floor and wall shadows and the sum's.
  function sumOf(a, pa, b, pb) {
    const fa = a * cosD(pa), wa = a * sinD(pa), fb = b * cosD(pb), wb = b * sinD(pb);
    const F = fa + fb, W = wa + wb, L = Math.hypot(F, W);
    return { fa, wa, fb, wb, F, W, L, phi: L > 1e-9 ? Math.atan2(W, F) * DEG : 0 };
  }
  // A demonstration turns the arrows on past one turn to the moment the sum arrow points straight up.
  const endTau = (s) => (s.L > 1e-9 ? 1 + ((((90 - s.phi) % 360) + 360) % 360) / 360 : 1);
  function angRow(s, dp) {
    const N = (v) => trim(v, dp);
    if (s.L < 1e-9) return 'the arrows cancel: no angle';
    if (Math.abs(s.F) < 1e-9) return 'angle = ' + trim(s.phi, 1) + '°, straight ' + (s.W > 0 ? 'up' : 'down');
    const base = 'tan⁻¹(' + N(s.W) + ' ÷ ' + N(s.F) + ')';
    if (s.F > 0) return 'angle = ' + base + ' = ' + trim(s.phi, 1) + '°';
    return 'angle = ' + base + (s.phi > 0 ? ' + 180°' : ' − 180°') + ' = ' + trim(s.phi, 1) + '°';
  }
  const lenRow = (s, dp, name) => (name || 'sum') + ' = √(' + trim(Math.abs(s.F), dp) + '² + ' + trim(Math.abs(s.W), dp) + '²) = ' + trim(s.L, 2);

  // The lesson's example values, and the answers each puzzle offers (worked out here, never typed in).
  const P1 = sumOf(3, 0, 4, 90);                                                    // 5 at 53.1°
  const o1 = [trim(3 + 4, 0), trim(P1.L, 2), trim(4 - 3, 0)];
  const S3 = sumOf(10, 0, 6, 60);                                                   // 14 at 21.8°
  const P3 = sumOf(4, 0, 4, 60);                                                    // 6.93 at 30°
  const o3 = [trim(4 + 4, 0), trim(Math.sqrt(4 * 4 + 4 * 4 - 2 * 4 * 4 * cosD(60)), 2), trim(P3.L, 2)];
  const o5 = [trim(P3.phi, 1) + '°', trim(60, 0) + '°', trim(P3.W / P3.F, 3)];
  const SUB = sumOf(10, 0, 6, 240);                                                 // A − B: 8.72 at −36.6°
  const VP = 230, LINE = sumOf(VP, 0, VP, -120 + 180);                              // L1 plus L2 turned half a turn
  const o8 = [trim(VP + VP, 0) + ' V', trim(VP, 0) + ' V', trim(LINE.L, 0) + ' V'];
  const LEN2 = [trim(Math.abs(4 - 3), 2), trim(3 + 4, 2)];                          // the sum's shortest and longest, B twice as fast
  const o10 = ['Same length, 1½ × as fast', 'Keeps changing length', 'Stays as it was'];
  const VL = 440, o11 = [trim(VL / SQ3, 0) + ' V', trim(VL / 2, 0) + ' V', trim(VL * SQ3, 0) + ' V'];
  const P12 = sumOf(8, 0, 8, 180), o12 = [trim(8 + 8, 0), trim(Math.hypot(8, 8), 1), trim(P12.L, 2)];
  const P13 = sumOf(12, 0, 5, -90), lag = trim(-P13.phi, 1) + '°';
  const o13 = [trim(P13.L, 0) + ' A lagging ' + lag, trim(12 + 5, 0) + ' A', trim(P13.L, 0) + ' A leading ' + lag];

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  const PICK = 'Tap one of the answers.';
  const STEPS = [
    { show: true, name: 'Two arrows, one sum', pic: 'sum1', dur: 4.2, rows: 2, live: true, sliders: ['lenA', 'lenB', 'angB'],
      text: "Here are two turning arrows, like lesson 6's arm. Arrow A is 3 long and points right; arrow B is 4 long and starts a quarter turn on. B's tail sits on A's tip, *tip to tail*, and a bold arrow runs from the centre to B's tip: the *sum arrow*. B's tip is B's height above A's tip, so the sum arrow's height is always A's height plus B's height, and the two bars beside the graph stack them. Both arrows turn at one speed, so the shape turns as one piece. Pause it, or drag A's tip.",
      after: "Here A and B make a right-angled triangle, so the sum arrow is `√(3² + 4²) = 5` long and its wave peaks at 5. A turning arrow like these is called a *phasor*." },
    { kind: 'pick', name: "The sum's peak", pic: 'peak5', opts: o1, want: o1[1], secret: ["sum's peak " + o1[1]],
      task: 'A is 3 long pointing right, and B is 4 long a quarter turn on. How high does the sum wave peak?',
      why: "A and B are at right angles, so the sum arrow is the long side of a right-angled triangle: `√(3² + 4²) = √25 = 5`. The sum wave's peak is the sum arrow's length. 7 adds the lengths, which works only when the arrows point the same way, and 1 takes one from the other, which works only when they point opposite ways.",
      hint: "Not quite. The peak is the sum arrow's length.",
      hints: { [o1[0]]: 'Not quite. 3 + 4 needs the arrows pointing the same way. These are a quarter turn apart.',
        [o1[2]]: 'Not quite. 4 − 3 needs the arrows pointing opposite ways.' },
      right: ['sum = √(3² + 4²) = √' + trim(3 * 3 + 4 * 4, 0) + ' = ' + o1[1], 'the sum wave peaks at its length, ' + o1[1]],
      wrong: { [o1[0]]: ['3 + 4 = ' + o1[0] + ' needs them pointing one way'], [o1[2]]: ['4 − 3 = ' + o1[2] + ' needs them opposite ways'] } },
    { show: true, name: 'Floor and wall shadows', pic: 'shadows', dur: 4.2, rows: 3, live: true, sliders: ['lenB', 'angB', 'parts'],
      text: "Now A is 10 long, pointing right, and B is 6 long at 60°. To measure the sum, split each arrow as in Finding angles: its *floor shadow* is its length × cos of its angle, and its *wall shadow* its length × sin. B's are `6 cos 60° = 3` and `6 sin 60° = 5.196`; A lies on the floor, so its wall shadow is 0. Floor shadows add along the floor, to 13, and wall shadows up the wall, to 5.196. Pythagoras then gives the sum, `√(13² + 5.196²) = 14`. Slide B and watch the shadows follow.",
      after: 'So the sum wave peaks at 14, not 16. A and B reach their peaks at different moments, so their heights never top out together.' },
    { kind: 'pick', name: '4 plus 4 at 60°', pic: 'q693', opts: o3, want: o3[2], secret: ['sum ' + o3[2]],
      task: 'A is 4 long pointing right, and B is 4 long at 60°, tip to tail. How long is the sum arrow?',
      why: "Split B: floor `4 cos 60° = 2`, wall `4 sin 60° = 3.464`. The floor shadows add to `4 + 2 = 6` and the wall shadows to 3.464, so the sum is `√(6² + 3.464²) = √48 = 6.93`. 8 adds the lengths as if the arrows lay in a line. 4 uses the cosine rule with 60°, but inside the tip-to-tail triangle the angle is `180° − 60° = 120°`.",
      hint: 'Not quite. Split B into its floor and wall shadows.',
      hints: { [o3[0]]: 'Not quite. 4 + 4 needs the arrows in a line. Split B into floor and wall shadows.',
        [o3[1]]: 'Not quite. Inside the tip-to-tail triangle the angle is 120°, not 60°.' },
      right: ['floor 4 ' + pm(P3.fb, 3) + ' = ' + trim(P3.F, 3), 'wall 0 ' + pm(P3.wb, 3) + ' = ' + trim(P3.W, 3),
        'sum = √(' + trim(P3.F, 3) + '² + ' + trim(P3.W, 3) + '²) = √' + trim(P3.L * P3.L, 1) + ' = ' + o3[2]],
      wrong: { [o3[0]]: ['4 + 4 = ' + o3[0] + ' only if A and B lie in a line'], [o3[1]]: ['the cosine rule with 60° gives ' + o3[1], 'inside the triangle the angle is 120°'] } },
    { show: true, name: "The sum's angle", pic: 'angle', dur: 4.2, rows: 4, live: true, sliders: ['angA', 'angB'],
      text: "The sum arrow points between A and B, at `tan⁻¹(5.196 ÷ 13) = 21.8°`, so the sum wave is `14 sin(ωt + 21.8°)`. An arrow further round anticlockwise *leads*, and one behind *lags*: the sum leads A by 21.8°. The cosine rule from Triangles without a right angle checks the length. Inside the tip-to-tail triangle the angle at B's tail is `180° − 60° = 120°`, and `10² + 6² − 2 × 10 × 6 × cos 120° = 196 = 14²`. Slide either start angle and watch the triangle change.",
      after: 'Use the angle inside the triangle, 180° minus the angle between the arrows, never the angle between them.' },
    { kind: 'pick', name: 'Its angle', pic: 'q30', opts: o5, want: o5[0], secret: ['angle ' + o5[0]],
      task: 'The same arrows: A 4 long pointing right, B 4 long at 60°. At what angle does the sum arrow point?',
      why: "The sum's floor shadow is 6 and its wall shadow 3.464, so its angle is `tan⁻¹(3.464 ÷ 6) = 30°`, halfway between A and B because they are the same length. 60° is B's own angle, and 0.577 is `3.464 ÷ 6`, the tan of the angle, before taking tan⁻¹.",
      hint: 'Not quite. Use tan⁻¹(wall ÷ floor) of the sum.',
      hints: { [o5[1]]: "Not quite. 60° is B's own angle. The sum lies between A and B.",
        [o5[2]]: 'Not quite. 0.577 is the ratio. Take tan⁻¹ of it to get the angle.' },
      right: ['wall ÷ floor = ' + trim(P3.W, 3) + ' ÷ ' + trim(P3.F, 3) + ' = ' + o5[2], 'angle = tan⁻¹(' + o5[2] + ') = ' + o5[0]],
      wrong: { [o5[1]]: [o5[1] + " is B's own angle, not the sum's"], [o5[2]]: [o5[2] + ' is the tan of the angle', 'the angle needs tan⁻¹'] } },
    { show: true, name: 'Taking a wave away', pic: 'minus', dur: 3.6, rows: 3, live: true, sliders: ['sub'],
      text: "To take B away from A, turn B's arrow half a turn and add it. An arrow half a turn on has every height with its sign changed, so its wave is B's wave upside down. Here B turns from 60° to 240°. The floor shadows give `10 − 3 = 7` and the wall shadows `0 − 5.196 = −5.196`, so A − B is `√(7² + 5.196²) = 8.72` long, at `tan⁻¹(−5.196 ÷ 7) = −36.6°`, below the floor. Switch it off to add B instead.",
      after: 'Taking a wave away is adding its arrow turned half a turn.' },
    { show: true, name: 'Three phases', pic: 'three', dur: 4.4, rows: 4, sliders: ['peak'],
      text: "A three-phase supply has three voltages, L1, L2 and L3, equal in size and 120° apart. In the UK each is 230 V rms between phase and neutral, so this card is drawn at rms. A meter across L1 and L2 reads L1 − L2, so turn L2 half a turn and add it to L1. The floor shadows give `230 + 115 = 345` and the wall shadows 199.2, so the *line voltage* is 398.4 V, 30° ahead of L1. A line down the middle halves the triangle into two right-angled triangles, with 60° each side of it at L1's tip, so the line voltage is `2 × 230 × sin 60° = 230 × √3`: screen 4's `6.93 = 4 × √3`, drawn bigger.",
      after: 'Drawn at peak, each phase is 325.3 V and the line 563.4 V: the same shape, √2 times bigger. Keep to one or the other on a diagram.' },
    { kind: 'pick', name: 'The meter', pic: 'meter', opts: o8, want: o8[2], secret: ['meter reads ' + o8[2]],
      task: 'A meter across L1 and L2 reads the arrow joining their tips. Each phase is 230 V, and they are 120° apart. What does it read?',
      why: "The meter reads L1 − L2. Turn L2 half a turn and add it to L1: floor `230 + 115 = 345`, wall 199.2, so `√(345² + 199.2²) = 398` V, which is `230 × √3`. 460 V adds the two sizes, which happens only when the phases are half a turn apart, and 230 V is one phase's own arrow, measured to neutral.",
      hint: 'Not quite. Turn L2 half a turn and add it to L1.',
      hints: { [o8[0]]: 'Not quite. The phases are 120° apart, so their sizes do not simply add.',
        [o8[1]]: 'Not quite. 230 V is one phase to neutral. The meter is across two lines.' },
      right: ['L1 − L2: floor ' + VP + ' ' + pm(LINE.fb, 1) + ' = ' + trim(LINE.F, 1), 'wall 0 ' + pm(LINE.wb, 1) + ' = ' + trim(LINE.W, 1),
        '√(' + trim(LINE.F, 1) + '² + ' + trim(LINE.W, 1) + '²) = ' + o8[2]],
      wrong: { [o8[0]]: [VP + ' + ' + VP + ' = ' + trim(VP + VP, 0) + ' adds the sizes', 'L1 and L2 are 120° apart, not 180°'], [o8[1]]: [VP + ' V is L1 to neutral, not L1 to L2'] } },
    { show: true, name: 'Twice as fast', pic: 'fast', dur: 4.4, rows: 2, live: true, sliders: ['fast'],
      text: "Phasors work only for waves of one frequency. Here B turns twice for each turn of A. Now the angle between them keeps changing, so the tip-to-tail triangle changes shape: the sum arrow stretches and shrinks as it turns, and its wave is no longer one clean sine wave. The heights still stack at every moment, but no single steady arrow stands for the sum. Switch B back to A's speed and the shape holds.",
      after: 'Waves of different frequencies cannot share one phasor diagram, because their arrows turn at different speeds.' },
    { kind: 'pick', name: 'B twice as fast', pic: 'q2x', opts: o10, want: o10[1], secret: ["sum's length " + LEN2[0] + ' to ' + LEN2[1]],
      task: 'B now turns twice for each turn of A. What does the sum arrow do?',
      why: 'B gains a whole turn on A every turn, so the angle between them keeps changing. The tip-to-tail triangle changes shape, and the sum arrow runs from `4 − 3 = 1` to `3 + 4 = 7` long. Its wave repeats, but it is not one sine wave, so no single phasor stands for it.',
      hint: 'Not quite. Watch the angle between A and B.',
      hints: { [o10[0]]: 'Not quite. The angle between A and B keeps changing, so the triangle does too.',
        [o10[2]]: 'Not quite. B now gains on A, so the triangle cannot keep its shape.' },
      right: ['the angle between A and B keeps changing', 'so the sum runs from ' + LEN2[0] + ' to ' + LEN2[1] + ' long'],
      wrong: { [o10[0]]: ['a steady length needs a steady angle'], [o10[2]]: ['B turning faster changes the angle'] } },
    { kind: 'pick', name: '440 V between lines', pic: 'q440', opts: o11, want: o11[0], secret: ['each phase ' + o11[0]],
      task: 'A three-phase supply has 440 V between lines. What is each phase-to-neutral voltage?',
      why: 'Line voltage is phase voltage × √3, so phase voltage is line voltage ÷ √3: `440 ÷ 1.732 = 254` V. Halving treats the phases as half a turn apart, and `440 × √3 = 762` goes the wrong way, from phase to line.',
      hint: 'Not quite. Line voltage = phase voltage × √3.',
      hints: { [o11[1]]: 'Not quite. The phases are 120° apart, not in a line. Divide by √3.',
        [o11[2]]: 'Not quite. × √3 takes a phase voltage up to a line voltage. Go back down.' },
      right: ['line = phase × √3', 'phase = ' + VL + ' ÷ √3 = ' + o11[0]],
      wrong: { [o11[1]]: [VL + ' ÷ 2 = ' + o11[1] + ' halves it', 'but the phases are 120° apart'], [o11[2]]: [VL + ' × √3 = ' + o11[2] + ' goes from phase to line'] } },
    { kind: 'pick', name: 'Opposite arrows', pic: 'cancel', opts: o12, want: o12[2], secret: ["sum's peak " + o12[2]],

    write(fb, d.show ? '' : right ? 'That\'s it.' : st.res === 'wrong' ? hintFor(i, st) : st.res === 'empty' ? PICK : '');

    const why = el('why');
    why.hidden = d.show || !st.why;
    write(why, d.show ? '' : d.why);
    whyBtn.setLabel(st.why ? 'Hide why' : 'Why?');

    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !right);
    nextBtn.setLabel(i === STEPS.length - 1 ? 'Finish' : 'Continue');
    nav.hidden = backBtn.el.hidden && nextBtn.el.hidden;
  });

  // ---------- known answers, worked out by hand ----------
  const DO = STEPS.map((d, i) => i).filter((i) => !STEPS[i].show);
  const idx = (pic) => STEPS.findIndex((d) => d.pic === pic);
  // Step i painted in state st (motion m, at time tAt, finished if none), fn reading what it drew
  // before the page is put back.
  function withState(i, st, m, fn, tAt) {
    const keepS = S[i], keepT = T, keepM = MODE;
    S[i] = st; T = tAt == null ? Infinity : tAt; MODE = m || (STEPS[i].show ? 'demo' : 'answer');
    latest = 0; earliest = Infinity;
    try { paint(i); return fn(); } finally { S[i] = keepS; T = keepT; MODE = keepM; paint(); }
  }
  const drawn = (i, st, m) => withState(i, st, m, () => ({ texts: Array.from(art.querySelectorAll('text')).map((n) => n.textContent), rec: REC }));
  const solvedSt = (i) => stOf({ pick: STEPS[i].want, res: 'right' });
  const wrongSt = (i, o) => stOf({ pick: o, res: 'wrong' });
  const fail = (msg) => { throw new Error(msg); };
  const TT = (n, mx) => { const a = []; for (let j = 0; j <= n; j++) a.push(mx * j / n); return a; };
  const angAt = (C, p) => Math.atan2(C[1] - p[1], p[0] - C[0]) * DEG;
  // Every state a step can be seen in.
  function statesOf(i) {
    const d = STEPS[i], out = [];
    const push = (o) => out.push([stOf(o), 'demo']);
    if (d.show) {
      out.push([blank(), 'demo']);
      if (d.pic === 'sum1') { [1, 3, 10].forEach((lenA) => [1, 10].forEach((lenB) => [-180, -45, 90, 165].forEach((angB) => [null, 0.6].forEach((tau) => push({ lenA, lenB, angB, tau }))))); TT(16, 2).forEach((tau) => push({ tau })); }
      else if (d.pic === 'shadows') [1, 6, 10].forEach((lenB) => [-180, -90, 0, 60, 135].forEach((angB) => [true, false].forEach((parts) => [null, 0.4].forEach((tau) => push({ lenB, angB, parts, tau })))));
      else if (d.pic === 'angle') [-180, -90, 0, 45, 135].forEach((angA) => [-180, -60, 60, 165].forEach((angB) => [null, 0.5].forEach((tau) => push({ angA, angB, tau }))));
      else if (d.pic === 'minus') [true, false].forEach((sub) => [null, 0.3, 0.8, 1.5].forEach((tau) => push({ sub, tau })));
      else if (d.pic === 'three') push({ peak: true });
      else if (d.pic === 'fast') [true, false].forEach((fast) => TT(12, 2).forEach((tau) => push({ fast, tau })));
    } else {
      out.push([blank(), 'answer'], [solvedSt(i), 'answer'], [stOf({ why: true }), 'answer']);
      d.opts.filter((o) => o !== d.want).forEach((o) => out.push([wrongSt(i, o), 'answer'], [stOf({ pick: o, res: 'wrong', why: true }), 'answer']));
    }
    return out;
  }
  // What crowds the labels in the picture now: labels over labels or handles, or off the edge.
  function crowding() {
    const bad = [], boxes = [];
    art.querySelectorAll('text').forEach((t) => {
      let b = null;
      try { b = t.getBBox(); } catch (e) { b = null; }
      if (!b || !(b.width > 0) || !(b.height > 0)) return;
      const sh = b.height * 0.2;
      boxes.push({ s: t.textContent, x: b.x, y: b.y + sh, w: b.width, h: b.height - 2 * sh });
    });
    boxes.forEach((a, m) => {
      if (a.x < 1 || a.x + a.w > 339 || a.y < 0 || a.y + a.h > VH) bad.push('"' + a.s + '" off the edge');
      boxes.slice(m + 1).forEach((b) => {
        const ix = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x), iy = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y);
        if (ix > 1 && iy > 1) bad.push('"' + a.s + '" on "' + b.s + '"');
      });
      REC.handles.forEach((h) => { const nx = K.clamp(h.x, a.x, a.x + a.w), ny = K.clamp(h.y, a.y, a.y + a.h); if (Math.hypot(nx - h.x, ny - h.y) < 11) bad.push('"' + a.s + '" on a handle'); });
    });
    return bad;
  }

  K.check('So v(t), the sum of the y projections of the component phasors, is just the y projection of the sum of the component phasors: on the first screen, at every length, start angle and moment, the sum arrow\'s tip is drawn at A\'s height plus B\'s height, the two stacked bars end level with the sum\'s pen, and every drawn point of the sum wave is A\'s wave plus B\'s wave', () => {
    const i = idx('sum1');
    [[3, 4, 90], [3, 4, -45], [1, 10, 180], [10, 1, 0], [7, 5, 135], [10, 10, -180]].forEach((c) => [null, 0, 0.3, 0.77, 1.4, 1.95].forEach((tau) => {
      const rec = drawn(i, stOf({ lenA: c[0], lenB: c[1], angB: c[2], tau }), 'demo').rec, w = rec.w, m = rec.map, t = w.tau;
      const hA = c[0] * Math.sin(TAU * t), hB = c[1] * Math.sin(TAU * t + c[2] * RAD);
      if (!K.near((m.C[1] - w.pA[1]) / m.kp, hA, 1e-9) || !K.near((m.C[1] - w.pS[1]) / m.kp, hA + hB, 1e-9)) fail('sum tip not at the two heights added: ' + c + ' at ' + t);
      if (!K.near(m.vOf(rec.stack.y1), hA, 1e-9) || !K.near(m.vOf(rec.stack.y2), hA + hB, 1e-9)) fail('bars do not stack: ' + c + ' at ' + t);
      const P = w.W.pts;
      if (!P.S.every((q, j) => K.near(m.vOf(q[1]), m.vOf(P.A[j][1]) + m.vOf(P.B[j][1]), 1e-9))) fail('sum wave is not A + B: ' + c);
    }));
    return true;
  }, { source: SRC.unsw });
  K.check('One good use of phasors is for the summing of sinusoids of the same frequency: turning at one speed, the sum arrow keeps one length at every moment, √(floor² + wall²) of the shadows added, and its wave is one sine wave of that length and the same frequency, started at the sum\'s angle', () => {
    const i = idx('sum1');
    [[3, 4, 90], [10, 6, 60], [5, 9, -135], [2, 2, 180]].forEach((c) => {
      const s = sumOf(c[0], 0, c[1], c[2]);
      [0.1, 0.45, 0.9, 1.3, 1.9].forEach((tau) => {
        const rec = drawn(i, stOf({ lenA: c[0], lenB: c[1], angB: c[2], tau }), 'demo').rec, w = rec.w, m = rec.map;
        if (!K.near(lenOf(w.pS, m.C) / m.kp, s.L, 1e-9)) fail('sum length changes: ' + c + ' at ' + tau);
        if (!w.W.pts.S.every((q) => K.near(m.vOf(q[1]), s.L * Math.sin(TAU * m.tOf(q[0]) + s.phi * RAD), 1e-9))) fail('sum wave not one sine wave: ' + c);
      });
    });
    return trim(sumOf(3, 0, 4, 90).L, 2) === '5';
  }, { source: SRC.tut });
  K.check('To determine the vertical component of force the sine function can be used, and the horizontal component the cosine: with the shadows switch on, at every length and start angle of B and every moment, each arrow\'s floor shadow is drawn its length × cos of its angle and its wall shadow its length × sin, B\'s starting at A\'s tip; at the start B\'s are 6 cos 60° = 3 and 6 sin 60° = 5.196, and the rows add them to 13 and 5.196', () => {
    const i = idx('shadows');
    [1, 6, 10].forEach((lenB) => [-180, -90, 0, 60, 135].forEach((angB) => [null, 0.2, 0.65].forEach((tau) => {
      const rec = drawn(i, stOf({ lenB, angB, tau, parts: true }), 'demo').rec, w = rec.w, m = rec.map, g = w.legs, t = w.tau;
      const thA = TAU * t, thB = TAU * t + angB * RAD;
      const ok = K.near((g.c1[0] - m.C[0]) / m.kp, 10 * Math.cos(thA), 1e-9) && K.near((g.c1[1] - w.pA[1]) / m.kp, 10 * Math.sin(thA), 1e-9) &&
        K.near((g.c2[0] - w.pA[0]) / m.kp, lenB * Math.cos(thB), 1e-9) && K.near((g.c2[1] - w.pS[1]) / m.kp, lenB * Math.sin(thB), 1e-9) && Math.abs(g.c2[1] - w.pA[1]) < 1e-9;
      if (!ok) fail('shadows off for B ' + lenB + ' at ' + angB + '°, ' + t);
    })));
    const r = drawn(i, blank(), 'demo').rec.rows.map((x) => x.s);
    return r[0] === 'floor 10 + 3 = 13' && r[1] === 'wall 0 + 5.196 = 5.196' && r[2] === 'sum = √(13² + 5.196²) = 14, not 16';
  }, { source: SRC.forces });
  K.check('The square of any side of a triangle is equal to the sum of the squares of the other two sides minus twice the product of the other two sides and the cosine of the included angle: at every pair of start angles the drawn sum arrow\'s length squared is 10² + 6² − 2 × 10 × 6 × cos of the angle inside the tip-to-tail triangle, 180° minus the angle between the arrows, and at the start the rows give 120° and 196 = 14²', () => {
    const i = idx('angle');
    for (let pa = -180; pa <= 180; pa += 90) for (let pb = -180; pb <= 180; pb += 30) {
      const rec = drawn(i, stOf({ angA: pa, angB: pb }), 'demo').rec, w = rec.w, m = rec.map;
      const inside = 180 - Math.abs(norm(pb - pa)), L = lenOf(w.pS, m.C) / m.kp;
      if (!K.near(L * L, 100 + 36 - 120 * cosD(inside), 1e-6)) fail('cosine rule fails at ' + pa + '°, ' + pb + '°');
    }
    const r = drawn(i, blank(), 'demo').rec.rows.map((x) => x.s);
    return r[0] === 'sum = 14 sin(ωt + 21.8°)' && r[1] === 'inside angle = 180° − 60° = 120°' && r[2] === '10² + 6² − 2 × 10 × 6 × cos 120°' && r[3] === '= 196 = 14²';
  }, { source: SRC.cos });
  K.check('Taking a wave away is adding its arrow turned half a turn: B turned to 240° has every height with its sign changed, and A − B is drawn 8.72 long at −36.6°, from floor 10 − 3 = 7 and wall 0 − 5.196 = −5.196; switched off, the sum is 14 long', () => {
    const i = idx('minus'), on = drawn(i, blank(), 'demo').rec, off = drawn(i, stOf({ sub: false }), 'demo').rec, m = on.map, w = on.w;
    if (!w.W.pts.B.length || !w.W.pts.B.every((q) => K.near(m.vOf(q[1]), -6 * Math.sin(TAU * m.tOf(q[0]) + 60 * RAD), 1e-9))) fail('B turned is not B upside down');
    const L = lenOf(w.pS, m.C) / m.kp;
    return K.near(L, Math.sqrt(76), 1e-9) && trim(L, 2) === '8.72' && trim(angAt(m.C, w.pS), 1) === '−36.6' && on.rows[0].s === 'floor 10 − 3 = 7, wall 0 − 5.196 = −5.196' &&
      K.near(lenOf(off.w.pS, off.map.C) / off.map.kp, 14, 1e-9);
  });
  K.check('3-phase systems consist of 3 equal in magnitude voltages and 120 degrees out of phase relative to each other: on the card, at rms and at peak, the three phase arrows are drawn the same length and a third of a turn, 120°, apart', () =>
    [false, true].every((peak) => {
      const w = drawn(idx('three'), stOf({ peak }), 'demo').rec.w, C = w.C, len = (p) => lenOf(p, C);
      return K.near(len(w.p1), len(w.p2), 1e-9) && K.near(len(w.p2), len(w.p3), 1e-9) && K.near(Math.abs(norm(angAt(C, w.p1) - angAt(C, w.p2))), 120, 1e-9) &&
        K.near(Math.abs(norm(angAt(C, w.p3) - angAt(C, w.p1))), 120, 1e-9);
    }), { source: SRC.mtu });
  K.check('The voltage declared in respect of a low voltage supply shall be 230 volts between the phase and neutral conductors: the card draws each phase arrow 230 V long, its label says so, and its rows start from 230', () => {
    const rec = drawn(idx('three'), blank(), 'demo').rec;
    return rec.pills.note === 'drawn at rms, 230 V' && rec.rows[0].s === 'floor 230 + 115 = 345' && K.near(lenOf(rec.w.p1, rec.w.C) / rec.map.kp, 230, 1e-9);
  }, { source: SRC.leg });
  K.check('The square root three is a magnitude multiplier that accompanies a 30 degree phase shift between line voltages and their respective phase voltages: L1 plus L2 turned half a turn is drawn √3 times a phase arrow long, 30° ahead of L1, and the rows give 2 × 230 × sin 60° = 230 × √3 = 398.4 V', () => {
    const rec = drawn(idx('three'), blank(), 'demo').rec, w = rec.w, C = w.C;
    return K.near(lenOf(w.pt, C) / rec.map.kp, 230 * SQ3, 1e-9) && K.near(angAt(C, w.pt), 30, 1e-9) && K.near(2 * 230 * sinD(60), 230 * SQ3, 1e-9) &&
      rec.rows[2].s === 'line = 2 × 230 × sin 60° = 230 × √3' && rec.rows[3].s.indexOf('= 398.4 V') === 0;
  }, { source: SRC.sqrt3 });
  K.check('Low voltage is a term used to describe 400 V three-phase and 230 V single-phase supplies: the card\'s line voltage, 230 × √3 = 398.4 V, is read as about 400 V', () =>
    drawn(idx('three'), blank(), 'demo').rec.rows[3].s === '= 398.4 V, about 400 V', { source: SRC.lv });
  K.check('Phasor diagrams in RMS have the same shape as those drawn using amplitudes, but everything is scaled by a factor of 0.71 = 1/√2: switched to peak, every arrow of the card is drawn √2 times longer in the same direction, a phase reads 325.3 V and the line 563.4 V, and 1 ÷ √2 = 0.71', () => {
    const a = drawn(idx('three'), blank(), 'demo').rec, b = drawn(idx('three'), stOf({ peak: true }), 'demo').rec, C = a.w.C;
    const same = ['p1', 'p2', 'p3', 'pt'].every((k) => K.near(b.w[k][0] - C[0], SQ2 * (a.w[k][0] - C[0]), 1e-9) && K.near(b.w[k][1] - C[1], SQ2 * (a.w[k][1] - C[1]), 1e-9));
    return same && b.pills.note === 'at peak: 230 × √2 = 325.3 V' && b.rows[3].s === '= 563.4 V, at peak' && trim(1 / SQ2, 2) === '0.71';
  }, { source: SRC.unsw });
  K.check('Sinusoids of different frequencies cannot be represented on the same phasor diagram due to the different speed of the vectors: with B turning twice as fast, the angle between the arrows keeps changing and the drawn sum arrow runs from 1 to 7 long over one turn of A; switched back, it stays 5 long', () => {
    const i = idx('fast'), Ls = [], L1s = [];
    TT(24, 1).forEach((tau) => {
      const r = drawn(i, stOf({ tau }), 'demo').rec; Ls.push(lenOf(r.w.pS, r.map.C) / r.map.kp);
      const v = drawn(i, stOf({ tau, fast: false }), 'demo').rec; L1s.push(lenOf(v.w.pS, v.map.C) / v.map.kp);
    });
    return K.near(Math.min.apply(null, Ls), 1, 1e-9) && K.near(Math.max.apply(null, Ls), 7, 1e-9) && L1s.every((L) => K.near(L, 5, 1e-9));
  }, { source: SRC.tut });
  K.check('Every worked number matches the lesson: 5 at 53.1° with slips 7 and 1; 6 cos 60° = 3, 6 sin 60° = 5.196, 13 and 14 at 21.8°; 4 + 2 = 6, 3.464, √48 = 6.93 with slips 8 and 4; 30° with slips 60° and 0.577; 120° and 196; 7, −5.196 and 8.72 at −36.6°; 115, 345, 199.2 and 398.4 V at 30°, 325.3 V and 563.4 V; 398 V with slips 460 V and 230 V; 1 to 7; 254 V with slips 220 V and 762 V; 0 with slips 16 and 11.3; 13 A at 22.6° with slip 17 A; √3 = 1.732, 1 ÷ √2 = 0.71, 4 × √3 = 6.93', () => {
    const same = (a, b) => a.length === b.length && a.every((v, k) => v === b[k]);
    return same(o1, ['7', '5', '1']) && trim(P1.phi, 1) === '53.1' && trim(S3.fb, 3) === '3' && trim(S3.wb, 3) === '5.196' && trim(S3.F, 3) === '13' && trim(S3.L, 2) === '14' && trim(S3.phi, 1) === '21.8' &&
      same(o3, ['8', '4', '6.93']) && trim(P3.F, 3) === '6' && trim(P3.W, 3) === '3.464' && trim(P3.L * P3.L, 1) === '48' && same(o5, ['30°', '60°', '0.577']) &&
      trim(180 - 60, 0) === '120' && trim(100 + 36 - 120 * cosD(120), 1) === '196' &&
      trim(SUB.F, 3) === '7' && trim(SUB.W, 3) === '−5.196' && trim(SUB.L, 2) === '8.72' && trim(SUB.phi, 1) === '−36.6' &&
      trim(LINE.fb, 1) === '115' && trim(LINE.F, 1) === '345' && trim(LINE.W, 1) === '199.2' && trim(LINE.L, 1) === '398.4' && trim(LINE.phi, 1) === '30' &&
      trim(VP * SQ2, 1) === '325.3' && trim(LINE.L * SQ2, 1) === '563.4' && same(o8, ['460 V', '230 V', '398 V']) && same(LEN2, ['1', '7']) &&
      same(o11, ['254 V', '220 V', '762 V']) && same(o12, ['16', '11.3', '0']) && same(o13, ['13 A lagging 22.6°', '17 A', '13 A leading 22.6°']) &&
      trim(SQ3, 3) === '1.732' && trim(1 / SQ2, 2) === '0.71' && trim(4 * SQ3, 2) === '6.93';
  });
  K.check('Each puzzle accepts only its right answer, every wrong answer has its own hint and its own red row of working, the answer appears once it is given, and before an answer nothing in the picture gives it away', () =>
    DO.every((i) => {
      const d = STEPS[i];
      if (d.opts.length !== 3 || new Set(d.opts).size !== 3 || d.opts.indexOf(d.want) < 0 || !d.opts.every((o) => isRight(i, stOf({ pick: o })) === (o === d.want))) fail('options wrong on step ' + (i + 1));
      const wrongs = d.opts.filter((o) => o !== d.want);
      if (!wrongs.every((o) => d.hints[o] && d.wrong[o] && wrongs.every((p) => p === o || d.hints[p] !== d.hints[o]))) fail('hints missing on step ' + (i + 1));
      const b = drawn(i, blank(), 'answer'), s = drawn(i, solvedSt(i), 'answer');
      if (b.rec.rows.length || d.secret.some((x) => b.texts.some((t) => t.indexOf(x) >= 0))) fail('answer shown early on step ' + (i + 1));
      if (!(s.rec.rows.length === d.right.length && s.rec.rows.every((r) => !r.bad)) || !d.secret.every((x) => s.texts.some((t) => t.indexOf(x) >= 0))) fail('answer not drawn on step ' + (i + 1));
      return wrongs.every((o) => { const r = drawn(i, wrongSt(i, o), 'answer').rec.rows, w = [].concat(d.wrong[o]); return r.length === w.length && r.every((x, k) => x.bad && x.s === w[k]); });
    }));
  K.check('No label sits on another label or a handle, or runs off the picture, on any screen in any state: puzzles answered right, wrong or with Why? open, A dragged to every moment, every length, start angle and switch setting', () =>
    STEPS.every((d, i) => statesOf(i).every((s) => withState(i, s[0], s[1], () => {
      const bad = crowding();
      if (bad.length) fail('step ' + (i + 1) + ' ' + JSON.stringify({ tau: s[0].tau, lenA: s[0].lenA, lenB: s[0].lenB, angA: s[0].angA, angB: s[0].angB, parts: s[0].parts, sub: s[0].sub, peak: s[0].peak, fast: s[0].fast, pick: s[0].pick, why: s[0].why }) + ': ' + bad[0]);
      return true;
    }))));
  K.check('Every demonstration has finished within 4.5 s of its screen opening, none starting before the 0.35 s screen fade ends; each answer and Why? has settled within 1.8 s', () =>
    STEPS.every((d, i) => {
      const timed = (st, m) => withState(i, st, m, () => [latest, earliest]);
      if (d.show) {
        const t = timed(blank(), 'demo');
        if (!(t[0] <= d.dur + 1e-9 && d.dur <= 4.5 && d.dur >= 3 && t[1] >= FADE)) fail('step ' + (i + 1) + ' runs ' + t[0] + ' s from ' + t[1]);
        return true;
      }
      return statesOf(i).every((s) => timed(s[0], s[1])[0] <= ANS + 1e-9);
    }));

  K.ready();
</script>
