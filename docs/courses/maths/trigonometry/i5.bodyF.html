<p class="lead">A circle with lesson 3's turning arm and a bendy rod one radius long, laid round its edge, then a winch drum, a ship's shaft and three mixed puzzles.</p>

<script>
  const el = (id) => document.getElementById(id);
  // ---------- numbers (pure, so the checks can test them) ----------
  const PI = Math.PI, TAU = 2 * Math.PI, DEG = 180 / Math.PI, RAD = Math.PI / 180;
  const sinD = (a) => Math.sin(a * RAD), cosD = (a) => Math.cos(a * RAD);
  const neg = (s) => String(s).replace(/^-/, '−');
  // v rounded to dp places with trailing zeros dropped: 0.5, 0.28, 30.
  function trim(v, dp) {
    const f = Math.pow(10, dp);
    let s = (Math.round(v * f) / f).toFixed(dp);
    if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
    if (s === '-0') s = '0';
    return neg(s);
  }
  // v to exactly dp places: 1.00, 360.0, 0.0087.
  function fix(v, dp) {
    const f = Math.pow(10, dp);
    let s = (Math.round(v * f) / f).toFixed(dp);
    if (/^-0(\.0*)?$/.test(s)) s = s.slice(1);
    return neg(s);
  }
  const commas = (s) => String(s).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  // The readout: radians to two places, degrees (radians × 180 ÷ π) to one.
  const radS = (v) => fix(v, 2), degS = (v) => fix(v, 1) + '°';
  const readS = (th) => radS(th) + ' radians = ' + degS(th * DEG);
  const rads = (v, dp) => trim(v, dp == null ? 3 : dp) + (Math.abs(v - 1) < 1e-12 ? ' radian' : ' radians');
  const radLab = (n) => n + (n === 1 ? ' radian' : ' radians');
  // A point at angle a (radians, anticlockwise from pointing right) on a circle of radius r round C.
  const pE = (C, r, a) => [C[0] + r * Math.cos(a), C[1] - r * Math.sin(a)];
  const lenOf = (p, q) => Math.hypot(p[0] - q[0], p[1] - q[1]);
  const polyLen = (ps) => { let s = 0; for (let k = 1; k < ps.length; k++) s += lenOf(ps[k - 1], ps[k]); return s; };

  // The lesson's example values, and the answers each puzzle offers (worked out here, never typed in).
  const A2 = 4, R2 = 2;                                           // an arc of 4 m on a circle of radius 2 m
  const o1 = [rads(A2), rads(A2 / R2), rads(R2 / A2)];            // metres counted; arc ÷ radius; radius ÷ arc
  const S1 = 1, S3 = 3;                                           // arcs one radius long on circles of 1 m and 3 m
  const o3 = ['The big circle\'s, ' + trim(S3 / S1, 0) + ' times as big', 'The small circle\'s', 'The same, ' + rads(S1 / S1) + ' each'];
  const QT = TAU / 4;                                             // a quarter turn
  const o5 = [fix(QT, 2), trim(1, 0), trim(1 / 4, 2)];
  const C60 = 60 * PI / 180, C2 = 2 * 180 / PI;                   // the two conversions
  const M10 = 10, turns10 = M10 / TAU, stop10 = M10 * DEG - 360;  // 10 radians against 10°
  const D8 = 45;
  const o7 = [fix(D8 * 180 / PI, 1), trim(D8 / 180, 2), fix(D8 * PI / 180, 3)];
  const WR = 0.2, WT = 2.5;                                       // the winch drum
  const R10 = 0.5, D10 = 60, T10 = D10 * PI / 180;                // the arc at 60°
  const o9 = [trim(R10 * D10, 3) + ' m', fix(R10 * T10, 3) + ' m', fix(T10 * R10 * R10, 3)];
  const N11 = 400, TQ = 400, W11 = N11 * TAU / 60, P11 = TQ * W11 / 1000;   // kN m × rad/s = kW; ÷ 1000 for MW
  const A12 = 0.5;
  const o11 = [fix(Math.sin(A12), 3), trim(A12, 2), fix(Math.sin(A12 * RAD), 4)];
  const N13 = 1500, N13S = commas(String(N13));
  const o12 = [trim(N13 / 60, 1), commas(fix(N13 * TAU, 0)), fix(N13 * TAU / 60, 1)];
  const R14 = 0.25, N14 = 3;
  const o13 = [trim(R14 * N14, 2) + ' m', fix(R14 * N14 * TAU, 2) + ' m', trim(R14 * N14 * 360, 1) + ' m'];

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // pic: the picture; vh: its height; dur: a demonstration's length; live: what Dan can drag.
  // A puzzle has opts, want, a hint for each wrong answer, why, rows of working (right, and wrong[answer]
  // in red) and secret: what the picture must not show before an answer.
  const PICK = 'Tap one of the answers.';
  const STEPS = [
    { show: true, name: 'Wrap the radius', pic: 'wrap1', vh: 296, dur: 4.2, live: ['tip', 'size'],
      text: 'Here is lesson 3\'s turning arm on a circle, pointing right to start. Lift a copy of it off as a bendy rod, exactly one radius long, and lay it round the edge from where the arm starts. Turn the arm anticlockwise until it meets the rod\'s far end. The angle it has opened at the centre is one *radian*, because its *arc*, the stretch of edge between the two arms, is one radius long. Two rods laid end to end make 2 radians. Drag the tip of the arm, or the size handle on the edge.',
      after: 'So an angle in radians is a count of radius-lengths round the edge. The readout gives that count, and beside it the same angle in degrees.' },
    { kind: 'pick', name: 'An arc of 4 m', pic: 'arc4', ry: 258,
      opts: o1, want: o1[1], secret: [o1[1]],
      task: 'An arc of 4 m sits on a circle of radius 2 m. What angle does it make at the centre?',
      why: 'Count the arc in radius-lengths. Each radius is 2 m, so the 4 m arc holds `4 ÷ 2 = 2` of them, and the angle is 2 radians. Arc ÷ radius gives the angle.',
      hint: 'Not quite. Count the arc in radius-lengths.',
      hints: { [o1[0]]: 'Not quite. That counts metres. Count radius-lengths of 2 m instead.',
        [o1[2]]: 'Not quite. That is radius ÷ arc, upside down. Divide the arc by the radius.' },
      right: [A2 + ' m ÷ ' + R2 + ' m = ' + trim(A2 / R2, 2) + ' radius-lengths', 'angle = ' + o1[1]],
      wrong: { [o1[0]]: A2 + ' counts metres, not radius-lengths', [o1[2]]: R2 + ' ÷ ' + A2 + ' = ' + trim(R2 / A2, 2) + ' is radius ÷ arc' } },
    { show: true, name: 'Any size of circle', pic: 'size', vh: 322, dur: 3.8, live: ['tip', 'size'],
      text: 'Hold the arm at 1 radian and make the circle bigger. The radius grows, so the rod grows with it. A bigger circle is the same shape drawn at a bigger scale, as lesson 1\'s triangles were, so the arc between the same two arms grows in step. Rod and arc grow together, so the count stays at 1.00 on every circle. That is why the angle in radians can be worked out as *arc ÷ radius*. Drag the size handle on the edge.',
      after: 'Arc and radius are both lengths, so their units cancel. The radian is a unit of angle, as the degree is, but its figure carries no metres.' },
    { kind: 'pick', name: 'Two circles', pic: 'two', ry: 272,
      opts: o3, want: o3[2], secret: [rads(1)],
      task: 'A circle of radius 1 m has an arc of 1 m. A circle of radius 3 m has an arc of 3 m. Which angle at the centre is bigger?',
      why: 'Each arc is exactly one radius long, `1 m ÷ 1 m = 1` and `3 m ÷ 3 m = 1`, so each angle is 1 radian. The big circle\'s arc is longer only because its radius is longer too.',
      hint: 'Not quite. Divide each arc by its radius.',
      hints: { [o3[0]]: 'Not quite. Its arc is 3 times longer, but so is its radius.',
        [o3[1]]: 'Not quite. Its arc is shorter, but so is its radius. Divide each arc by its radius.' },
      right: [S1 + ' m ÷ ' + S1 + ' m = ' + rads(S1 / S1), S3 + ' m ÷ ' + S3 + ' m = ' + rads(S3 / S3)],
      wrong: { [o3[0]]: S3 + ' m arc, but a ' + S3 + ' m radius too', [o3[1]]: 'a short arc, but a short radius too' } },
    { show: true, name: 'All the way round', pic: 'round', vh: 346, dur: 3.8, live: ['tip', 'size'],
      text: 'Now lay the rod all the way round. The edge is the circumference, `2πr`, so it holds `2πr ÷ r = 2π` rods, six whole rods and 0.28 of a seventh. A full turn is 360°, so `360° = 2π radians`. Halfway round the count is 3.14, which is π, so `180° = π radians`. One rod\'s slice is `180° ÷ π`, about 57.3°, a little under a sixth of the circle, not the whole circle. Drag the tip of the arm.',
      after: 'Since `180° = π` radians, 1° is `π ÷ 180` radians. So to turn degrees into radians, multiply by `π ÷ 180`, and to turn radians into degrees, multiply by `180 ÷ π`.' },
    { kind: 'pick', name: 'A quarter turn', pic: 'quarter', ry: 258,
      opts: o5, want: o5[0], secret: [o5[0]],
      task: 'How many radius-lengths fit round a quarter of the circle?',
      why: 'A full turn holds 2π rods, about 6.28, so a quarter holds `6.28 ÷ 4 = 1.57`. That is π ÷ 2, one whole rod and a little over half another. One radian is only 57.3°, short of the quarter\'s 90°.',
      hint: 'Not quite. A full turn holds 6.28 radius-lengths.',
      hints: { [o5[1]]: 'Not quite. That takes a quarter as one radian, but one radian is 57.3°, less than 90°.',
        [o5[2]]: 'Not quite. That takes the whole circle as one radian. A full turn is 6.28 radians.' },
      right: ['a full turn holds 2π = ' + fix(TAU, 2) + ' rods', 'a quarter holds ' + fix(TAU, 2) + ' ÷ 4 = ' + o5[0]],
      wrong: { [o5[1]]: '1 radian is ' + degS(DEG) + ', short of 90°', [o5[2]]: 'that takes the whole turn as 1 radian' } },
    { show: true, name: 'Degrees and radians', pic: 'modes', vh: 328, dur: 4.4,
      text: 'Here are the two conversions at work. `60° × π ÷ 180 = 1.047` radians, and 2 radians is `2 × 180 ÷ π = 114.6°`. Exam courses such as SQA Higher take an angle with no degree sign, as in `cos 10`, to be in radians, so the calculator must be in radian mode. The two can be far apart. 10° is a small turn, but 10 radians wraps 1.59 times round and stops at 213.0°, left of the centre and below it. The cosine is the arm\'s shadow across, as in lesson 3, so there it is negative: `cos 10 = −0.839`, against 0.985 for 10°.',
      after: 'So check the calculator\'s mode whenever an angle comes without a degree sign.' },
    { kind: 'pick', name: '45° in radians', pic: 'deg45', ry: 258,
      opts: o7, want: o7[2], secret: [o7[2]],
      task: 'What is 45° in radians?',
      why: 'To turn degrees into radians, multiply by `π ÷ 180`. So `45 × π ÷ 180 = 0.785`, which is π ÷ 4, half the quarter turn\'s 1.57. A check on size: a radian is about 57.3°, so the degree figure is about 57.3 times the radian figure.',
      hint: 'Not quite. Multiply by `π ÷ 180`.',
      hints: { [o7[0]]: 'Not quite. That multiplies by `180 ÷ π`, the wrong way. Into radians, the figure gets smaller.',
        [o7[1]]: 'Not quite. Dividing by 180 leaves out π. Multiply by `π ÷ 180`.' },
      right: [D8 + ' × π ÷ 180 = ' + o7[2] + ' radians'],
      wrong: { [o7[0]]: D8 + ' × 180 ÷ π = ' + o7[0] + ', the wrong way', [o7[1]]: D8 + ' ÷ 180 = ' + o7[1] + ' leaves out π' } },
    { show: true, name: 'Arc length', pic: 'winch', vh: 328, dur: 3.9, live: ['tip'],
      text: 'Each radian of angle holds one radius of edge, so θ radians on a circle of radius `r` hold an arc `s = rθ`, with θ in radians. Say a winch drum of radius 0.2 m turns through 2.5 radians. The wire it winds on lies round its edge, two whole radius-lengths and half of another, so `s = 0.2 × 2.5 = 0.5` m, and the hook rises 0.5 m. Drag the arm on the drum to turn it.',
      after: 'Check the unit. A radius in metres times an angle in radians gives metres.' },
    { kind: 'pick', name: 'The arc at 60°', pic: 'arc60', ry: 258,
      opts: o9, want: o9[1], secret: [fix(R10 * T10, 3)],
      task: 'A circle has a radius of 0.5 m. How long is the arc between two arms 60° apart?',
      why: '`s = rθ` needs θ in radians. First `60° × π ÷ 180 = 1.047` radians, then `s = 0.5 × 1.047 = 0.524` m. A check: the whole edge is `2π × 0.5 = 3.14` m, and 60° is a sixth of a turn, so the arc is a sixth of 3.14 m.',
      hint: 'Not quite. Turn 60° into radians first.',
      hints: { [o9[0]]: 'Not quite. 60 is in degrees. Turn it into radians first.',
        [o9[2]]: 'Not quite. That is `θr²`, whose unit is square metres, an area. The arc is `rθ`.' },
      right: ['60° × π ÷ 180 = ' + fix(T10, 3) + ' radians', 's = ' + R10 + ' × ' + fix(T10, 3) + ' = ' + o9[1]],
      wrong: { [o9[0]]: [R10 + ' × ' + D10 + ' = ' + o9[0] + ' uses degrees', 'the whole edge is only ' + fix(TAU * R10, 2) + ' m'],
        [o9[2]]: fix(T10, 3) + ' × ' + R10 + '² = ' + o9[2] + ' m², an area' } },
    { show: true, name: 'Turning speed', pic: 'shaft', vh: 282, dur: 4.2,
      text: 'Turning speed is counted the same way. Bird\'s engineering textbook works through a ship\'s drive shaft turning at 400 rev/min, 400 turns a minute. Each turn is 2π radians, so it turns through `400 × 2π` radians a minute, and a minute is 60 seconds. Its *angular speed*, ω, the Greek letter omega, is `400 × 2π ÷ 60 = 41.9` radians a second, written rad/s. A shaft\'s power is its torque times ω, so with Bird\'s torque of 400 kN m it delivers 16.76 MW.',
      after: 'To turn rev/min into rad/s, multiply by 2π, then divide by 60.' },
    { kind: 'pick', name: 'No degree sign', pic: 'sin05', ry: 258,
      opts: o11, want: o11[0], secret: [o11[0]],
      task: 'An angle is given as 0.5, with no degree sign. What is its sine?',
      why: 'No degree sign means radians, so the calculator goes in radian mode, and `sin 0.5 = 0.479`. On the picture the arm\'s tip has travelled 0.5 of a radius round the edge, and its height, the sine, is a little less than that arc.',
      hint: 'Not quite. No degree sign means radians.',
      hints: { [o11[2]]: 'Not quite. That is `sin 0.5°`, from degrees mode. No degree sign means radians.',
        [o11[1]]: 'Not quite. 0.5 is the arc the tip has travelled. Its height is a little less.' },
      right: ['no degree sign: radian mode', 'sin ' + trim(A12, 2) + ' = ' + o11[0]],
      wrong: { [o11[2]]: 'sin ' + trim(A12, 2) + '° = ' + o11[2] + ' is degrees mode', [o11[1]]: trim(A12, 2) + ' is the arc; the height is less' } },
    { kind: 'pick', name: 'A motor shaft', pic: 'motor', ry: 226,
      opts: o12, want: o12[2], secret: [o12[2]],
      task: 'A motor shaft turns at 1,500 rev/min. What is its angular speed, in rad/s?',
      why: 'Each turn is 2π radians, so 1,500 turns a minute is `1,500 × 2π = 9,425` radians a minute. A minute is 60 seconds, so `ω = 9,425 ÷ 60 = 157.1` rad/s.',
      hint: 'Not quite. Multiply by 2π, then divide by 60.',
      hints: { [o12[0]]: 'Not quite. 25 is turns a second. Each turn is 2π radians.',
        [o12[1]]: 'Not quite. That is radians a minute. Divide by 60 for each second.' },
      right: [N13S + ' × 2π = ' + o12[1] + ' radians a minute', '÷ 60: ω = ' + o12[2] + ' rad/s'],
      wrong: { [o12[0]]: [N13S + ' ÷ 60 = ' + o12[0] + ' turns a second', 'the 2π is left out'], [o12[1]]: [N13S + ' × 2π = ' + o12[1] + ' a minute', 'the ÷ 60 is left out'] } },
    { kind: 'pick', name: 'A sheave', pic: 'sheave', ry: 262,
      opts: o13, want: o13[1], secret: [fix(R14 * N14 * TAU, 2)],
      task: 'A sheave, a grooved wheel, of radius 0.25 m makes 3 full turns. How much rope passes over it?',
      why: 'Each full turn is 2π radians, so 3 turns are `3 × 2π = 6π` radians. With θ in radians, `s = rθ = 0.25 × 6π = 4.71` m, three times the sheave\'s edge.',
      hint: 'Not quite. Each turn is 2π radians.',
      hints: { [o13[0]]: 'Not quite. That takes 3 turns as 3 radians. Each turn is 2π radians.',

    if (f.pills.read !== '6.28 radians = 360.0°' || rod.joints.length !== 6 || f.rodLabs.join() !== '1,2,3,4,5,6,0.28') fail('full turn: ' + f.pills.read + ', ' + rod.joints.length + ' joints, labels ' + f.rodLabs.join());
    return lenOf(rod.ps[rod.ps.length - 1], rod.ps[0]) < 1e-9 && h.pills.read === '3.14 radians = 180.0°' && K.near(h.wrap.tip[1], h.wrap.C[1], 1e-9) && h.wrap.tip[0] < h.wrap.C[0];
  }, { source: SRC.turn });
  K.check('One radian is 180° ÷ π = 57.3°, a little under a sixth of the circle, not the whole circle: the shaded slice spans exactly the first rod and is labelled 57.3°, six such slices fall short of a full turn and seven pass it', () => {
    const f = drawn(idx('round'), blank(), 'demo').rec;
    return f.sliceLab === '57.3°' && degS(DEG) === '57.3°' && 6 * DEG < 360 && 7 * DEG > 360 && 6 < TAU && TAU < 7;
  });
  K.check('The bendy rod does not stretch: at every moment of the first screen\'s lift and bend it is one radius long, it starts lying on the arm and it ends lying round the edge from where the arm starts', () => {
    const i = idx('wrap1');
    for (let k = 0; k <= 40; k++) {
      const t = k * 0.05, rec = withState(i, blank(), 'demo', () => REC, t), ps = rec.lift ? rec.lift.ps : rec.rods[0].ps;
      if (!K.near(polyLen(ps) / rec.wrap.r, 1, 2e-4)) fail('rod ' + polyLen(ps) / rec.wrap.r + ' radius-lengths at ' + t + ' s');
    }
    const s0 = withState(i, blank(), 'demo', () => REC, 0), s1 = withState(i, blank(), 'demo', () => REC, 1.9), w = s0.wrap, p0 = s0.lift.ps, p1 = s1.rods[0].ps;
    return lenOf(p0[0], w.C) < 1e-9 && lenOf(p0[p0.length - 1], w.E0) < 1e-9 && lenOf(p1[0], w.E0) < 1e-9 && K.near(polyLen(p1) / w.r, 1, 2e-4) && p1.every((p) => K.near(lenOf(p, w.C), w.r, 1e-9));
  });
  K.check('An angle with no degree sign is in radians, and the two can be far apart: the dashed arm turned 10 radians, measured off the drawing, ends at 213.0°, left of the centre and below it, after 1.59 turns, its across distance over the radius is cos 10 = −0.839, and the solid arm at 10° gives cos 10° = 0.985', () => {
    const m = drawn(idx('modes'), blank(), 'demo').rec.modes;
    const across = (m.tip10r[0] - m.C[0]) / m.r, ang = (Math.atan2(m.C[1] - m.tip10r[1], m.tip10r[0] - m.C[0]) * DEG + 360) % 360;
    return K.near(across, Math.cos(10), 1e-9) && fix(across, 3) === '−0.839' && fix(ang, 1) === '213.0' && m.tip10r[0] < m.C[0] && m.tip10r[1] > m.C[1] &&
      fix(m.turns, 2) === '1.59' && fix((m.tip10d[0] - m.C[0]) / m.r, 3) === '0.985' && m.labs.every((s) => !!s);
  });
  K.check('Each radian of angle holds one radius of edge, so the arc is s = rθ: at every turn of the winch drum from 0.1 to 3 radians, the wire wound on, measured along the drawn edge, and the hook\'s rise measured off the drawing both equal the drawn radius times the angle, and at 2.5 radians on a 0.2 m drum the rise reads 0.5 m', () => {
    const i = idx('winch');
    for (let k = 1; k <= 30; k++) {
      const th = k / 10, w = drawn(i, stOf({ th }), 'demo').rec.winch;
      if (!K.near(polyLen(w.ps) / (w.r * th), 1, 2e-4) || !K.near(w.rise, w.r * th, 1e-9) || !K.near(HOOK0 - w.hy, w.r * th, 1e-9)) fail('wire wrong at ' + th);
    }
    const w = drawn(i, blank(), 'demo').rec.winch;
    return K.near(w.th, WT, 1e-12) && w.riseLab === '0.5 m' && w.rodLabs.join() === '1,2,0.5';
  });
  K.check('Every worked number matches the lesson: 4 m ÷ 2 m = 2 radians with slips 4 and 0.5; 1 radian on both circles; 2π = 6.28 with 0.28 over six rods, π = 3.14 and 57.3°; a quarter 1.57 with slips 1 and 0.25; 60° = 1.047 radians and 2 radians = 114.6°; 10 radians 1.59 turns to 213.0°, cos 10 = −0.839 and cos 10° = 0.985; 45° = 0.785 with slips 2578.3 and 0.25; 0.2 × 2.5 = 0.5 m; 0.524 m with slips 30 m and 0.262, and an edge of 3.14 m; 41.9 rad/s and 16.76 MW; sin 0.5 = 0.479 with slips 0.0087 and 0.5; 157.1 rad/s with slips 25 and 9,425; 4.71 m with slips 0.75 m and 270 m', () => {
    const same = (a, b) => a.length === b.length && a.every((v, k) => v === b[k]);
    return same(o1, ['4 radians', '2 radians', '0.5 radians']) && same(o3, ['The big circle\'s, 3 times as big', 'The small circle\'s', 'The same, 1 radian each']) &&
      fix(TAU, 2) === '6.28' && fix(TAU - 6, 2) === '0.28' && fix(PI, 2) === '3.14' && degS(DEG) === '57.3°' && same(o5, ['1.57', '1', '0.25']) &&
      fix(C60, 3) === '1.047' && degS(C2) === '114.6°' && fix(turns10, 2) === '1.59' && degS(stop10) === '213.0°' && fix(Math.cos(M10), 3) === '−0.839' && fix(cosD(M10), 3) === '0.985' &&
      same(o7, ['2578.3', '0.25', '0.785']) && trim(WR * WT, 3) === '0.5' && same(o9, ['30 m', '0.524 m', '0.262']) && fix(T10, 3) === '1.047' && fix(TAU * R10, 2) === '3.14' &&
      fix(W11, 1) === '41.9' && fix(P11, 2) === '16.76' && same(o11, ['0.479', '0.5', '0.0087']) && same(o12, ['25', '9,425', '157.1']) && N13S === '1,500' &&
      same(o13, ['0.75 m', '4.71 m', '270 m']) && N14 * 360 === 1080;
  });
  K.check('Each puzzle accepts only its right answer, every wrong answer has its own hint and its own red row of working, the answer appears once it is given, and before an answer nothing in the picture gives it away', () =>
    DO.every((i) => {
      const d = STEPS[i];
      if (d.opts.length !== 3 || new Set(d.opts).size !== 3 || d.opts.indexOf(d.want) < 0 || !d.opts.every((o) => isRight(i, stOf({ pick: o })) === (o === d.want))) fail('options wrong on step ' + (i + 1));
      const wrongs = d.opts.filter((o) => o !== d.want);
      if (!wrongs.every((o) => d.hints[o] && d.wrong[o] && wrongs.every((p) => p === o || d.hints[p] !== d.hints[o]))) fail('hints missing on step ' + (i + 1));
      const b = drawn(i, blank(), 'answer'), s = drawn(i, solvedSt(i), 'answer');
      if (b.rec.rows.length || d.secret.some((x) => b.texts.some((t) => t.indexOf(x) >= 0))) fail('answer shown early on step ' + (i + 1));
      if (!(s.rec.rows.length === d.right.length && s.rec.rows.every((r) => !r.bad)) || !d.secret.every((x) => s.texts.some((t) => t.indexOf(x) >= 0))) fail('answer not drawn on step ' + (i + 1));
      return wrongs.every((o) => { const r = drawn(i, wrongSt(i, o), 'answer').rec.rows, w = [].concat(d.wrong[o]); return r.length === w.length && r.every((x, k) => x.bad && x.s === w[k]); });
    }));
  K.check('No label sits on another label or a handle, or runs off the picture, on any screen in any state: puzzles answered right, wrong or with Why? open, the arm dragged to every angle on circles of every size, the drum turned to every angle', () =>
    STEPS.every((d, i) => statesOf(i).every((s) => withState(i, s[0], s[1], () => { const bad = crowding(); if (bad.length) fail('step ' + (i + 1) + ' ' + JSON.stringify({ th: s[0].th, r: s[0].r, pick: s[0].pick, why: s[0].why }) + ': ' + bad[0]); return true; }))));
  K.check('Every demonstration has finished within 4.5 s of its screen opening, none starting before the 0.35 s screen fade ends; each answer and Why? has settled within 1.8 s', () =>
    STEPS.every((d, i) => {
      const timed = (st, m) => withState(i, st, m, () => [latest, earliest]);
      if (d.show) {
        const t = timed(blank(), 'demo');
        if (!(t[0] <= d.dur + 1e-9 && d.dur <= 4.5 && d.dur >= 3 && t[1] >= FADE)) fail('step ' + (i + 1) + ' runs ' + t[0] + ' s from ' + t[1]);
        return true;
      }
      return statesOf(i).every((s) => timed(s[0], s[1])[0] <= ANS + 1e-9);
    }));

  K.ready();
</script>
