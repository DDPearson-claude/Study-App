<style>

<p class="caption">Every equation is an example. On screens that show an idea, try the steppers and the switch yourself.</p>

<script>
  // ---------- numbers, written as the lesson writes them ----------
  const r6 = (v) => Math.round(v * 1e6) / 1e6;
  const r2 = (v) => Math.round(v * 100) / 100;
  const near = (a, b, t) => Math.abs(a - b) <= (t == null ? 1e-9 : t);
  const num = (v) => { v = r6(v); return v < 0 ? '−' + String(-v) : String(v); };
  // 2x, −y, + 3z, − 2I₃
  function termT(k, L, first) {
    const mag = Math.abs(k), body = mag === 1 ? L : num(mag) + L;
    return first ? (k < 0 ? '−' : '') + body : (k < 0 ? ' − ' : ' + ') + body;
  }
  // 1 + 4 − 3
  const valsT = (list) => list.map((v, n) => (n === 0 ? num(v) : v < 0 ? ' − ' + num(-v) : ' + ' + num(v))).join('');
  const ALL3 = [0, 1, 2];
  const LX = ['x', 'y', 'z'], LI = ['I₁', 'I₂', 'I₃'];
  // A row is [x, y, z, right side]. Its equation leaves out the letters it has no term in.
  function eqT(row, L, idx) {
    const t = (idx || ALL3).filter((n) => row[n] !== 0);
    return (t.length ? t.map((n, j) => termT(row[n], L[n], j === 0)).join('') : '0') + ' = ' + num(row[3]);
  }
  // A row's cells: one per letter, a 0 where it has no term in that letter, then its right side.
  const cellsOf = (row, L, idx) => (idx || ALL3).map((n, j) => (row[n] === 0 ? (j ? '+ 0' : '0') : termT(row[n], L[n], j === 0).trim())).concat([num(row[3])]);
  const rowStr = (row, L, idx) => { const c = cellsOf(row, L, idx); return c.slice(0, -1).join(' ') + ' = ' + c[c.length - 1]; };
  const fits = (row, v) => near(ALL3.reduce((a, n) => a + (row[n] ? row[n] * v[n] : 0), 0), row[3], 1e-6);
  // Answers put into a row: 1 + 4 − 3 = 2 ✓, or what the row needs.
  // prod: a coefficient other than 1 is written as a product, 2 × 4.5, so two rows that come to the same sum still read as different rows.
  function checkT(row, v, prod) {
    const ns = ALL3.filter((n) => row[n] !== 0), vs = ns.map((n) => r6(row[n] * v[n])), tot = r6(vs.reduce((a, b) => a + b, 0));
    const lhs = prod ? ns.map((n, j) => { const k = Math.abs(row[n]), q = (k === 1 ? '' : num(k) + ' × ') + num(v[n]); return j === 0 ? (row[n] < 0 ? '−' : '') + q : (row[n] < 0 ? ' − ' : ' + ') + q; }).join('') : valsT(vs);
    return lhs + ' = ' + num(tot) + (near(tot, row[3], 1e-6) ? ' ✓' : ', not ' + num(row[3]));
  }

  // ---------- the rule: scale two rows, add or take away, and see which letter cancels ----------
  const scaleR = (row, k) => row.map((v) => v * k);
  const MV = (p, q, kp, kq, op) => ({ p, q, kp, kq, op });
  const sumRow = (A, B, op) => A.map((v, n) => v + (op === 'add' ? 1 : -1) * B[n]);
  // The two rows of a pair at their steppers; a row tried in a puzzle replaces row p as written.
  function partsOf(s, mv, tried) {
    return [tried && tried.n === mv.p ? tried.row : scaleR(s.R[mv.p - 1], mv.kp), scaleR(s.R[mv.q - 1], mv.kq)];
  }
  const resOf = (s, mv, tried) => { const P2 = partsOf(s, mv, tried); return sumRow(P2[0], P2[1], mv.op); };
  // For each letter: 'cancel' when its term is 0 in the sum. When no letter cancels (the slip), a letter
  // whose matching terms add up instead is marked 'double'; beside a cancelled letter that is no slip.
  function marksOf(A, B, U, idx) {
    const m = idx.map((n) => (U[n] === 0 && (A[n] !== 0 || B[n] !== 0) ? 'cancel' : null)), any = m.some(Boolean);
    return idx.map((n, j) => m[j] || (!any && A[n] !== 0 && Math.abs(A[n]) === Math.abs(B[n]) && Math.abs(U[n]) === 2 * Math.abs(A[n]) ? 'double' : null));
  }
  // A result row drops into the new stack when exactly one letter cancels.
  function dropsMv(s, mv) {
    if (!mv.op) return false;
    const P2 = partsOf(s, mv), U = sumRow(P2[0], P2[1], mv.op), mk = marksOf(P2[0], P2[1], U, ALL3);
    return mk.filter((m) => m === 'cancel').length === 1 && ALL3.some((n) => U[n] !== 0);
  }
  const mvLabel = (mv) => 'Row ' + mv.p + (mv.kp > 1 ? ' × ' + mv.kp : '') + (mv.op === 'add' ? ' + ' : ' − ') + 'row ' + mv.q + (mv.kq > 1 ? ' × ' + mv.kq : '');
  // The counter: the letters still in play, and how many of the rows say something new.
  function rankOf(rows) {
    const M = rows.map((r) => r.slice());
    let rk = 0;
    for (let c = 0; c < 4 && rk < M.length; c++) {
      let piv = -1;
      for (let r = rk; r < M.length; r++) if (Math.abs(M[r][c]) > 1e-9) { piv = r; break; }
      if (piv < 0) continue;
      const tmp = M[rk]; M[rk] = M[piv]; M[piv] = tmp;
      for (let r = 0; r < M.length; r++) if (r !== rk) { const f = M[r][c] / M[rk][c]; for (let k = 0; k < 4; k++) M[r][k] -= f * M[rk][k]; }
      rk++;
    }
    return rk;
  }
  function countOf(rows, L) {
    const used = ALL3.filter((n) => rows.some((r) => Math.abs(r[n]) > 1e-9));
    return { u: used.length, e: rankOf(rows), L: used.map((n) => L[n]) };
  }
  const det3 = (m) => m[0][0] * (m[1][1] * m[2][2] - m[1][2] * m[2][1]) - m[0][1] * (m[1][0] * m[2][2] - m[1][2] * m[2][0]) + m[0][2] * (m[1][0] * m[2][1] - m[1][1] * m[2][0]);
  function solve3(R) {
    const M = R.map((r) => r.slice(0, 3)), D = det3(M);
    return ALL3.map((c) => r6(det3(M.map((r, i) => r.map((v, j) => (j === c ? R[i][3] : v)))) / D));
  }

  // ---------- the circuit from lesson 5: the junction law and the loop law round each loop ----------
  const circRows = (C) => [[1, 1, -1, 0], [C.r1, 0, C.R, C.E1], [0, C.r2, C.R, C.E2]];
  const C1 = { E1: 12, r1: 1, E2: 12, r2: 2, R: 2 }, C2 = { E1: 14, r1: 1, E2: 10, r2: 1, R: 1 };
  // A loop's walk: the battery's voltage, less current × resistance across its own resistance and the load.
  // The working line for a loop's walk, tidied into its row: 12 − 1 × I₁ − 2 × I₃ = 0, so I₁ + 2I₃ = 12.
  const loopW = (s) => [1, 2].map((k) => ({ l: 'Loop ' + k, s: num(k === 1 ? s.C.E1 : s.C.E2) + ' − ' + num(k === 1 ? s.C.r1 : s.C.r2) + ' × I' + (k === 1 ? '₁' : '₂') + ' − ' + num(s.C.R) + ' × I₃ = 0, so ' + eqT(s.R[k], LI) }));
  const loopEnd = (C, k, I) => (k === 1 ? C.E1 - C.r1 * I[0] - C.R * I[2] : C.E2 - C.r2 * I[1] - C.R * I[2]);

  // ---------- the sets of three rows. m: the two removals (first, second); el: the elimination steppers;
  // back: which new row (0 top, 1 bottom) the found letter goes back into; third: the row for the last letter.
  const SYS = {
    ex: { L: LX, R: [[1, 1, 1, 6], [2, -1, 1, 3], [1, 2, -1, 2]], m: [MV(1, 3, 1, 1, 'add'), MV(2, 3, 1, 1, 'add')], el: { k1: 3, k2: 1, op: 'take' }, back: 0, third: 1 },
    ci: { L: LI, C: C1, R: circRows(C1), m: [MV(1, 3, 2, 1, 'add'), MV(1, 2, 2, 1, 'add')], el: { k1: 2, k2: 1, op: 'take' }, back: 0, third: 2 },
    s9: { L: LX, R: [[1, 1, 1, 9], [1, 2, -1, 4], [3, -1, 2, 11]], m: [MV(1, 2, 1, 1, 'add'), MV(2, 3, 2, 1, 'add')], el: { k1: 1, k2: 1, op: 'take' }, back: 1, third: 1 },
    pr: { L: LX, R: [[2, 1, 1, 7], [1, -1, 2, 5], [3, 1, -1, 2]], m: [MV(1, 2, 1, 1, 'add'), MV(2, 3, 1, 1, 'add')], el: { k1: 3, k2: 1, op: 'take' }, back: 0, third: 1 },
    c2: { gx: 8, L: LI, C: C2, R: circRows(C2), m: [MV(1, 3, 1, 1, 'add'), MV(1, 2, 1, 1, 'add')], el: { k1: 2, k2: 1, op: 'take' }, back: 0, third: 2 },
  };
  // Each new row drops on top of the new stack, so the second removal sits above the first.
  const stackOf = (s) => [resOf(s, s.m[1]), resOf(s, s.m[0])];
  const keepOf = (top, bot) => ALL3.filter((n) => top[n] !== 0 || bot[n] !== 0);
  function routeOf(s, set) {
    const st2 = stackOf(s), top = st2[0], bot = st2[1], keep = keepOf(top, bot);
    return { top, bot, keep, gone: ALL3.filter((n) => keep.indexOf(n) < 0)[0], U: sumRow(scaleR(top, set.k1), scaleR(bot, set.k2), set.op) };
  }
  function crossOf(top, bot, keep) {
    const u = keep[0], v = keep[1], D = top[u] * bot[v] - bot[u] * top[v], P = [];
    P[u] = r6((top[3] * bot[v] - bot[3] * top[v]) / D); P[v] = r6((top[u] * bot[3] - bot[u] * top[3]) / D);
    return P;
  }
  const pairT = (P, keep) => '(' + num(P[keep[0]]) + ', ' + num(P[keep[1]]) + ')';
  const unitOf = (s) => (s.C ? ' A' : '');
  // The values found, put back into a row for the letter it still needs: 3 + y = 5, so y = 5 − 3 = 2.
  function backT(row, L, vals, unk, unit) {
    let left = '', first = true;
    const known = [];
    ALL3.forEach((n) => {
      if (row[n] === 0) return;
      if (n === unk) left += termT(row[n], L[n], first);
      else { const v = r6(row[n] * vals[n]); known.push(v); left += first ? num(v) : v < 0 ? ' − ' + num(-v) : ' + ' + num(v); }
      first = false;
    });
    const k = row[unk], rest = r6(row[3] - known.reduce((a, b) => a + b, 0)), res = r6(rest / k);
    const diff = num(row[3]) + known.map((v) => (v < 0 ? ' + ' + num(-v) : ' − ' + num(v))).join('') + ' = ' + num(rest);
    return left + ' = ' + num(row[3]) + ', so ' + (k === 1 ? L[unk] + ' = ' + diff + unit
      : termT(k, L[unk], true) + ' = ' + diff + ' and ' + L[unk] + ' = ' + num(rest) + ' ÷ ' + (k < 0 ? '(' + num(k) + ')' : num(k)) + ' = ' + num(res) + unit);
  }
  const opWord = (op) => (op === 'add' ? 'Add' : 'Take away');
  // The answer the step down reaches with these elimination settings.
  function valsOf(s, set) {
    const R0 = routeOf(s, set), U = R0.U, left = R0.keep.filter((n) => U[n] !== 0);
    if (left.length !== 1) return null;
    const a = left[0], b = R0.keep.filter((n) => n !== a)[0], v = [];
    v[a] = r6(U[3] / U[a]);
    const bRow = s.back === 0 ? R0.top : R0.bot, tr = s.R[s.third - 1];
    v[b] = r6((bRow[3] - bRow[a] * v[a]) / bRow[b]);
    v[R0.gone] = r6((tr[3] - tr[a] * v[a] - tr[b] * v[b]) / tr[R0.gone]);
    return { v, a, b, bRow, tr, R0 };
  }
  // The working for the two new rows: the sum row, the letter left solved, then put back.
  function workB(s, set, full) {
    const R0 = routeOf(s, set), U = R0.U, L = s.L, unit = unitOf(s), out = [{ l: opWord(set.op), s: eqT(U, L, R0.keep) }], V = valsOf(s, set);
    if (!V) {
      const P = crossOf(R0.top, R0.bot, R0.keep);
      out.push({ l: 'At ' + pairT(P, R0.keep), s: checkT(U, P) });
      out.push({ l: 'So', s: 'both letters are still there', prose: true });
      return out;
    }
    const k = U[V.a];
    if (k !== 1) out.push({ l: 'Solve', s: L[V.a] + ' = ' + num(U[3]) + ' ÷ ' + (k < 0 ? '(' + num(k) + ')' : num(k)) + ' = ' + num(V.v[V.a]) + unit });
    if (full >= 1) out.push({ l: 'Put back', s: backT(V.bRow, L, V.v, V.b, unit) });
    if (full >= 2) out.push({ l: 'Row ' + s.third, s: backT(V.tr, L, V.v, R0.gone, unit) });
    return out;
