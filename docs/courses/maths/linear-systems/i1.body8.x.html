<script>
  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // view: the grid's window. l1, l2: line 1 (solid) and line 2 (dashed), each {m, c, f}, where f says

  // When a puzzle's parts arrive after an answer or Why? (seconds).

  const STEPS = [
    { show: true, name: 'One rule, many pairs', view: FULL, l1: L1, P: [3, 5], drag: 'p', dots1: [[0, 1], [1, 3], [2, 5]],

      vals: { 'Just one, (3, 4)': 1, 'Eight whole-number pairs': 8, 'Endless pairs': Infinity },
      task: 'How many pairs of numbers (x, y) fit the rule `x + y = 7`? Drag the test point to try some.',

    { show: true, name: 'A second rule', view: FULL, l1: L1, l2: SUM(7), P: [3, 7], drag: 'p', dots2: [[0, 7], [3, 4], [7, 0]], gx: [0, 1],
      pk: [{ p: [3, 7] }, { p: [2, 5], at: 3.0, tr: 0.8, on: L1 }], dur: 4.2, tl: { l2: 0.5, dots: [0.8, 1.1, 1.4], gaps: [1.8, 2.2], x: 2.6, lit: 3.8 },
      text: 'Line 2, dashed, holds every pair that fits `x + y = 7`, such as (0, 7), (3, 4) and (7, 0). At `x = 0` the lines are 6 apart, and each 1 along line 1 climbs 2 while line 2 drops 1, so the gap shuts by `2 − (−1) = 3` and they meet once, at the *crossing point* (2, 5). That pair fits both rules at once: it is the *solution* of these two *simultaneous equations*, which means true at the same time.' },
    { kind: 'both', name: 'Fits both?', view: FULL, l1: L1, l2: SUM(7), hide: { x: true },
      opts: ['(3, 7)', '(3, 4)', '(2, 5)'], want: '(2, 5)', vals: { '(3, 7)': [3, 7], '(3, 4)': [3, 4], '(2, 5)': [2, 5] },

      task: 'Where do `y = 2x + 1` and `y = 1.8x + 7` cross?',
      why: 'At `x = 0` line 2 is 6 above line 1, and line 1 climbs `2 − 1.8 = 0.2` more for each 1 along, so the gap shuts at `x = 6 ÷ 0.2 = 30`. There both rules give 61: `2 × 30 + 1 = 61` and `1.8 × 30 + 7 = 61`.',

      hints: { 'x = 6': 'Not quite. 6 is the gap at `x = 0`, and it shuts by only 0.2 each 1 along.', 'They never cross': 'Not quite. The m\'s differ, so the gap does shut, beyond the grid.' } },
    { show: true, name: 'Same tilt', view: FULL, l1: L1, l2: MC(1.5, 7), drag: 'cm', gx: [1, 2.5, 3.5],

    { kind: 'par', name: 'Same m', view: FULL, l1: MC(3, 2), l2: MC(3, -4), gx: [2, 4], hide: { gaps: true },
      opts: ['(3, 2)', 'No solution', 'Endless solutions'], want: 'No solution', vals: { '(3, 2)': [3, 2], 'No solution': 'none', 'Endless solutions': 'same' },
      task: 'Solve `y = 3x + 2` and `y = 3x − 4` together.',
      why: 'Both rules have `m = 3`, so the lines have the same tilt. At every x the first is `2 − (−4) = 6` above the second, so the gap never closes. The lines are parallel, and no pair fits both.',
      hint: 'Not quite. Compare the two m\'s first.',
      hints: { '(3, 2)': 'Not quite. 3 and 2 are the first rule\'s m and c, not a pair: `3 × 3 + 2 = 11`, not 2.', 'Endless solutions': 'Not quite. The m\'s match but the c\'s differ, so the lines run 6 apart and never meet.' } },

    { kind: 'same', name: 'Endless solutions', view: FULL, l1: L1,
      opts: ['y = 2x + 3', 'y = x + 2', 'y − 2x = 1'], want: 'y − 2x = 1', vals: { 'y = 2x + 3': MC(2, 3), 'y = x + 2': MC(1, 2), 'y − 2x = 1': { m: 2, c: 1, f: 'diff' } },

      hint: 'Not quite. Write each rule as `y = mx + c` and compare.',
      hints: { 'y = 2x + 3': 'Not quite. Same m but a different c, so that line runs parallel to line 1 and never meets it.', 'y = x + 2': 'Not quite. Its m is different, so it crosses line 1 just once, at (1, 3).' } },
    { show: true, name: 'A reading', view: FULL, l1: L1, l2: SUM(5), zoom: { to: ZOOM10, at: 0.8, tr: 1.8 }, P: [1.3, 3.6], drag: 'p',

      text: 'Here line 2 is `x + y = 5`, and the grid zooms in to tenths. The lines cross between the tenths, so the nearest the test point gets, (1.3, 3.7), fits line 2 but gives `2 × 1.3 + 1 = 3.6` on line 1. A reading from a graph is an *estimate*, so put it back into both rules to check; the readout\'s gap sum is exact, `x = 4/3`, and the next two lessons turn it into a method for any pair of equations.' },

  // Sources the checks restate (the lesson's own).
  const BITESIZE = 'https://www.bbc.co.uk/bitesize/articles/zhbnvj6';
  const BITESIZE2 = 'https://www.bbc.co.uk/bitesize/guides/z9y9jty/revision/1';
  const OPENSTAX = 'https://openstax.org/books/intermediate-algebra-2e/pages/4-1-solve-systems-of-linear-equations-with-two-variables';
  // The grid's frame in the drawing: 8 by 14 squares of 24 units, numbers left and below, the key on the right.

  // ---------- numbers and rules, written as the explanation writes them ----------
  const near = (a, b) => Math.abs(a - b) < 1e-9;
  const r2 = (v) => Math.round(v * 100) / 100;
  const round1 = (v) => Math.round(v * 10) / 10;
  const neg = (v) => { v = r2(v); if (Math.abs(v) < 1e-12) v = 0; return v < 0 ? '−' + String(-v) : String(v); };
  const br = (v) => (r2(v) < 0 ? '(' + neg(v) + ')' : neg(v));
  const coord = (p) => '(' + neg(p[0]) + ', ' + neg(p[1]) + ')';
  const exact = (v) => Math.abs(v * 100 - Math.round(v * 100)) < 1e-6;
  const tenth = (v) => Math.abs(v * 10 - Math.round(v * 10)) < 1e-6;
  const same = (a, b) => Array.isArray(a) && Array.isArray(b) && a.length === b.length && a.every((x, n) => Math.abs(x - b[n]) < 1e-9);
  const inView = (v, p) => p[0] >= v.x0 - 1e-9 && p[0] <= v.x1 + 1e-9 && p[1] >= v.y0 - 1e-9 && p[1] <= v.y1 + 1e-9;
  const plusC = (c) => (r2(c) < 0 ? ' − ' + neg(-c) : ' + ' + neg(c));
  function tidyRHS(m, c) {                                               // 2x + 1, −x + 7, 3x, x + 3
    const mx = Math.abs(m) < 1e-12 ? '' : near(m, 1) ? 'x' : near(m, -1) ? '−x' : neg(m) + 'x';
    if (!mx) return neg(c);
    return Math.abs(c) < 1e-12 ? mx : mx + plusC(c);
  }
  function ruleText(L) {
    if (L.f === 'sum') return 'x + y = ' + neg(L.c);
    if (L.f === 'k') return L.k + 'y = ' + tidyRHS(L.k * L.m, L.k * L.c);
    if (L.f === 'diff') return 'y − ' + (near(L.m, 1) ? '' : neg(L.m)) + 'x = ' + neg(L.c);
    return 'y = ' + tidyRHS(L.m, L.c);
  }
  // The rule as written, then as y = mx + c when it is written another way.
  function ruleSteps(L) { const a = ruleText(L), b = 'y = ' + tidyRHS(L.m, L.c); return a === b ? [a] : [a, 'so ' + b]; }
  const fits = (L, p) => Math.abs(L.m * p[0] + L.c - p[1]) < 1e-9;
