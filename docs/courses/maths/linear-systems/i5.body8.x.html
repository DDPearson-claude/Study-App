<p class="lead" id="lead">Two example batteries feed one load. Battery 1 is 12 V with 1 Ω inside it, battery 2 is 12 V with 2 Ω inside it, and the load is 2 Ω.</p>

      <div class="dial"><div class="dh"><span class="dn" id="dn2"></span><span class="dv" id="dv2"></span></div><span id="dm2"></span><input type="range" id="rg2" min="-2" max="6" step="0.5" value="1" aria-label="I₂, battery 2's current, in amps"><span id="dp2"></span></div>

<script>
  // ---------- numbers, written as the lesson writes them ----------
  const r6 = (v) => Math.round(v * 1e6) / 1e6;
  const r2 = (v) => Math.round(v * 100) / 100;
  const near = (a, b, t) => Math.abs(a - b) <= (t == null ? 1e-7 : t);
  const mn = (s) => String(s).replace(/-/g, '−');
  const fv = (v) => mn(String(r6(v)));
  const fa = (v) => fv(Math.abs(v));
  const par = (v) => (v < 0 ? '(' + fv(v) + ')' : fv(v));
  const IN = ['', 'I₁', 'I₂', 'I₃'];
  const LO = -2, HI = 6, STEP = 0.5;
  const half = (v) => r6(K.clamp(Math.round(v / STEP) * STEP, LO, HI));

  // ---------- the circuit's rule ----------
  // Two batteries (voltage E, resistance r inside) feed one load R. I₁ and I₂ flow up through the batteries.
  const CIR = (E1, r1, E2, r2, R) => ({ E1, r1, E2, r2, R });
  const BASE = CIR(12, 1, 12, 2, 2), LOW = CIR(12, 1, 4, 2, 2), NEW = CIR(10, 1, 8, 1, 1);
  const Eof = (C, k) => (k === 1 ? C.E1 : C.E2), rOf = (C, k) => (k === 1 ? C.r1 : C.r2);
  const i3 = (I) => r6(I[0] + I[1]);   // the junction law: in equals out
  // What each part adds as the walk passes it: the battery from − to +, then its own resistance and the
  // load, each crossed along its arrow (a drop, current × resistance; a minus current makes it a rise).
  const changes = (C, k, I) => [r6(Eof(C, k)), r6(-rOf(C, k) * I[k - 1]), r6(-C.R * i3(I))];
  const walk = (C, k, I) => r6(changes(C, k, I).reduce((a, b) => a + b, 0));
  const fits = (C, k, I) => near(walk(C, k, I), 0);
  // Each loop's walk set to 0 and tidied to a·I₁ + b·I₂ = c.
  const eqOf = (C, k) => (k === 1 ? { a: C.r1 + C.R, b: C.R, c: C.E1 } : { a: C.R, b: C.r2 + C.R, c: C.E2 });
  function solve(C) {
    const p = eqOf(C, 1), q = eqOf(C, 2), det = p.a * q.b - q.a * p.b;
    return [r6((p.c * q.b - q.c * p.b) / det), r6((p.a * q.c - q.a * p.c) / det)];
  }

  // ---------- the working, built from the rule ----------
  const co = (n, v) => (n === 1 ? '' : fv(n)) + v;
  const eqT = (e) => co(e.a, 'I₁') + ' + ' + co(e.b, 'I₂') + ' = ' + fv(e.c);
  const junT = (I) => 'I₃ = ' + fv(I[0]) + ' + ' + par(I[1]) + ' = ' + fv(i3(I)) + ' A';
  const pairT = (I) => 'I₁ = ' + fv(I[0]) + ' A, I₂ = ' + fv(I[1]) + ' A';
  // "12 − 1 × 3 − 2 × 4.5 = 12 − 3 − 9 = 0 ✓": a drop against a turned-round arrow is added.
  function walkT(C, k, I, short) {
    const ch = changes(C, k, I), cur = [I[k - 1], i3(I)], R = [rOf(C, k), C.R];
    const sg = (n) => (ch[n + 1] > 0 ? ' + ' : ' − ');
    const long = fv(ch[0]) + sg(0) + fv(R[0]) + ' × ' + fa(cur[0]) + sg(1) + fv(R[1]) + ' × ' + fa(cur[1]);
    const mid = fv(ch[0]) + sg(0) + fa(ch[1]) + sg(1) + fa(ch[2]), tot = walk(C, k, I);
    return (short ? mid : long + ' = ' + mid) + ' = ' + fv(tot) + (near(tot, 0) ? ' ✓' : ', not 0');
  }
  const openT = (C, k) => { const e = eqOf(C, k); return fv(e.c) + ' − ' + co(e.a, 'I₁') + ' − ' + co(e.b, 'I₂') + ' = 0'; };
  const symT = (C, k, swapped) => fv(Eof(C, k)) + ' − ' + fv(rOf(C, k)) + ' × ' + IN[k] + ' − ' + fv(C.R) + ' × ' + (swapped ? '(I₁ + I₂)' : 'I₃') + ' = 0';
  // Elimination: double loop 1 so both loops hold the same amount of I₂, take loop 2 away, put I₁ back.
  function solveRows(C, back) {
    const p = eqOf(C, 1), q = eqOf(C, 2), m = q.b / p.b, P2 = { a: p.a * m, b: p.b * m, c: p.c * m };
    const Ka = r6(P2.a - q.a), D = r6(P2.c - q.c), x = r6(D / Ka), y = solve(C)[1];
    const rows = [{ l: 'Loop 1 × ' + fv(m), s: eqT(P2) },
      { l: 'Take away', s: co(Ka, 'I₁') + ' = ' + fv(P2.c) + ' − ' + fv(q.c) + ' = ' + fv(D) + ', so I₁ = ' + fv(D) + ' ÷ ' + fv(Ka) + ' = ' + fv(x) + ' A' }];
    if (back === 1) rows.push({ l: 'Put back', s: 'I₂ = ' + fv(p.c) + ' − ' + fv(p.a) + ' × ' + fv(x) + ' = ' + fv(p.c) + ' − ' + fv(p.a * x) + ' = ' + fv(y) + ' A' });
    else {
      const rest = r6(q.c - q.a * x);
      rows.push({ l: 'Put back', s: fv(q.a) + ' × ' + fv(x) + ' + ' + co(q.b, 'I₂') + ' = ' + fv(q.c) + ', so ' + co(q.b, 'I₂') + ' = ' + fv(q.c) + ' − ' + fv(q.a * x) + ' = ' + fv(rest) + ' and I₂ = ' + fv(rest) + ' ÷ ' + fv(q.b) + ' = ' + fv(y) + ' A' });
    }
    return rows;
  }

  // ---------- where things go: three branches, two loops ----------
  const X1 = 76, XM = 170, X2 = 264, YT = 56, YB = 250, H = 306;
  const VB = YB - YT, HZ = XM - X1, LEN = 2 * VB + 2 * HZ;
  // How far round its loop the walk passes the battery, its own resistance and the load.
  const POS = [YB - 163, YB - 98, VB + HZ + (126 - YT)];
  const xsOf = (k) => (k === 1 ? X1 : X2);
  const loopD = (k) => 'M' + xsOf(k) + ' ' + YB + 'V' + YT + 'H' + XM + 'V' + YB + 'Z';
  function ptAt(k, s) {
    const x0 = xsOf(k);
    s = K.clamp(s, 0, LEN);
    if (s <= VB) return [x0, YB - s];
    if (s <= VB + HZ) return [x0 + (XM - x0) * (s - VB) / HZ, YT];
    if (s <= 2 * VB + HZ) return [XM, YT + (s - VB - HZ)];
    return [XM + (x0 - XM) * (s - 2 * VB - HZ) / HZ, YB];
  }
  // The point of loop k nearest p, as a distance round the loop; the walk never jumps across its start.
  function project(k, p, prev) {
    const x0 = xsOf(k), segs = [[x0, YB, x0, YT, 0], [x0, YT, XM, YT, VB], [XM, YT, XM, YB, VB + HZ], [XM, YB, x0, YB, 2 * VB + HZ]];
    let best = null;
    segs.forEach((g) => {
      const dx = g[2] - g[0], dy = g[3] - g[1], L2 = dx * dx + dy * dy;
      const q = K.clamp(((p[0] - g[0]) * dx + (p[1] - g[1]) * dy) / L2, 0, 1);
      const dd = Math.hypot(p[0] - (g[0] + q * dx), p[1] - (g[1] + q * dy));
      if (!best || dd < best.d - 1e-9) best = { d: dd, s: g[4] + q * Math.sqrt(L2) };
    });
    let s = best.s;
    if (s >= LEN - 1e-6 || s <= 1e-6) s = prev > LEN / 2 ? LEN : 0;
    if (Math.abs(s - prev) > LEN / 2) s = prev > LEN / 2 ? LEN : 0;
    return { s, d: best.d };
  }
  const runT = (C, k, I, s) => r6(changes(C, k, I).reduce((a, c, n) => a + (POS[n] <= s + 1e-9 ? c : 0), 0));

  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const testing = () => document.documentElement.classList.contains('k-testing');
  const el = (id) => document.getElementById(id);
  const say = (str) => String(str).replace(/I([₁₂₃])/g, (m, d) => 'I ' + ('₁₂₃'.indexOf(d) + 1)).replace(/−/g, 'minus ').replace(/×/g, 'times').replace(/÷/g, 'divided by').replace(/✓/g, 'fits').replace(/Ω/g, 'ohms');

  // ---------- timing: how far a part due at t0 has arrived, noting the timetable for the timing check ----------
  let T = Infinity, latest = 0, earliest = Infinity;
  function note(t0, dd) { if (t0 + dd > latest) latest = t0 + dd; if (t0 < earliest) earliest = t0; }
  function arr(t0, dd) { if (t0 < 0) return 1; note(t0, dd); return K.arrive(T, t0, dd); }
  function invEase(y) { let a = 0, b = 1; for (let n = 0; n < 30; n++) { const m = (a + b) / 2; if (K.ease(m) < y) a = m; else b = m; } return (a + b) / 2; }
  // A ring walking once round its loop from t0, and when it passes each part.
  function walker(t0, dur) {
    note(t0, dur);
    const q = T <= t0 ? 0 : T >= t0 + dur ? 1 : K.ease((T - t0) / dur);
    return { s: LEN * q, pass: POS.map((p) => t0 + dur * invEase(p / LEN)), end: t0 + dur };
  }
  const stay = (s) => ({ s, pass: [-10, -10, -10], end: -10 });
  const W2 = (st, a, b) => (st.s ? [stay(st.s[0]), stay(st.s[1])] : [a, b]);
  // The dials' pair at time T: from `start`, each move [t0, dur, to] turns the dials in 0.5 A clicks.
  function dialsAt(start, moves) {
    let P = start, stop = false;
    moves.forEach((m) => {
      note(m[0], m[1]);
      if (stop || T <= m[0]) { stop = true; return; }
      const q = T >= m[0] + m[1] ? 1 : K.ease((T - m[0]) / m[1]);
      P = [half(K.lerp(P[0], m[2][0], q)), half(K.lerp(P[1], m[2][1], q))];
      if (q < 1) stop = true;
    });
    return P;
  }

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  const row = (l, s, a, prose) => ({ l, s, a, prose: !!prose });
  const OPEN = (st) => st.res === 'right' || st.why;
  const WRONG = (st) => st.res === 'wrong' && !st.why;
  const triedRows = (st, d) => (WRONG(st) && d.tried && d.tried[st.pick] ? [row('Tried', d.tried[st.pick][0], arr(0.1, 0.3), d.tried[st.pick][1])] : []);
  // A walk row: kept in place (unseen) from the start of a ring's walk and faded in once it is back at the
  // start, so the working never jumps; a walk Dan drags all the way round adds its row there and then.
  const walkRows = (C, I, W) => [1, 2].filter((k) => W[k - 1].end >= 0 || W[k - 1].s >= LEN - 1e-6)
    .map((k) => row('Loop ' + k + ' walk', walkT(C, k, I), W[k - 1].end >= 0 ? arr(W[k - 1].end + 0.1, 0.3) : 1));
  function base(C, extra) {
    return Object.assign({ C, mode: 'num', I: [1, 1], labs: null, W: null, names: [1, 1], route: null, jr: 0, br: 0, grid: null, rows: [], drag: false, Eold: null, tot: true }, extra);
  }
  // Which pair fits both loops: the right pair is worked through and ringed on the grid; a wrong one is walked.
  function pairPlan(st, d) {
    const C = d.C, o = OPEN(st), w = WRONG(st), pre = [row('Loop 1', eqT(eqOf(C, 1)), 1), row('Loop 2', eqT(eqOf(C, 2)), 1)];
    if (!o && !w) return base(C, { mode: 'sym', W: [stay(0), stay(0)], rows: d.hold ? [] : pre });
    const I = o ? solve(C) : d.opts[st.pick], W = W2(st, walker(0.1, 1.2), walker(0.1, 1.2));
    const grid = { lines: [1, 1], dot: I, ring: o ? arr(1.35, 0.3) : 0, key: o ? 'the pair that fits' : 'the pair tried' };
    const checks = [row('Loop 1 walk', walkT(C, 1, I, true), arr(1.4, 0.3)), row('Loop 2 walk', walkT(C, 2, I, true), arr(1.55, 0.3))];
    if (o) return base(C, { I, W, drag: true, grid, rows: pre.concat(solveRows(C, d.back).map((r, n) => Object.assign(r, { a: arr(0.4 + n * 0.15, 0.3) })), [row('Junction', junT(I), arr(0.85, 0.3))], checks) });
    return base(C, { I, W, grid, rows: pre.concat([row('Tried', pairT(I), arr(0.15, 0.3))], checks) });
  }
  const FB = 2.5, FADE = 0.35;
  const STEPS = [
    { show: true, dials: true, name: 'Two batteries, one load', dur: 3.4,
      text: 'Each battery has a resistance of its own inside it, its *internal resistance*, drawn just above it. Battery 1 and the load make loop 1, and battery 2 and the load make loop 2.',
      plan: (st) => base(BASE, { I: st.I || [1, 1], route: [arr(0.5, 1.2), arr(1.9, 1.2)], names: [arr(1.5, 0.4), arr(3.0, 0.4)] }) },
    { show: true, dials: true, name: 'Where currents meet', dur: 3.9,
      text: 'The currents flowing into a junction add up to the currents flowing out. This is the *junction law*, so the load carries `I₃ = I₁ + I₂`. The bottom junction says the same again.',
      plan: (st) => {
        const I = st.I || dialsAt([1, 1], [[0.9, 1.0, [3, 1]], [2.1, 0.8, [3, 2]]]);
        return base(BASE, { I, jr: arr(0.4, 0.4), br: arr(3.2, 0.4),
          rows: [row('Junction', 'I₃ = I₁ + I₂', arr(0.5, 0.3)), row('Dials', junT(I), arr(0.65, 0.3)), row('Bottom', 'I₃ flows in and I₁ + I₂ flow out, the same equation again', arr(3.3, 0.3), true)] });
      } },
    { kind: 'cur', name: 'The load\'s current', opts: ['8.5 A', '1.5 A', '5 A'], want: 1,
      task: 'Say the load carries 5 A, and battery 1 sends 3.5 A of it. What current does battery 2 send?',
