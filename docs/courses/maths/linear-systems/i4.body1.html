<style>
  [hidden] { display: none !important; }
  .pz, .lead, .caption { max-width: 46rem; }
  .pz > * + *, #stepbox > * + * { margin-top: 14px; }
  /* The stepper is the page's step control: its dots are the progress bar; Back and Continue are below. */
  .pz .k-stepper { gap: 0; }
  .pz .k-stepper .k-label, .pz .k-stepper-nav { display: none; }
  .pz .count { margin-top: 10px; }
  .task { font-size: 1.2rem; font-weight: 700; line-height: 1.5; margin-top: 4px; max-width: 34rem; }
  .task.show { font-size: 1.12rem; font-weight: 400; line-height: 1.6; }
  .nw { white-space: nowrap; }
  .v { font-style: italic; }
  /* The grid of guesses, with the receipt cards beside it on a laptop and under it on a phone. */
  .board { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: flex-start; }
  .scene { display: block; flex: 1 1 19rem; max-width: 26rem; width: 100%; min-width: 0; }
  .scene:focus { outline: none; }
  .scene:focus-visible { outline: 2px solid var(--k-accent); outline-offset: 2px; border-radius: 6px; }
  .scene .gl { stroke: var(--k-line); stroke-width: 1; }
  .scene .gf { fill: none; stroke: var(--k-strong); stroke-width: 1.2; }
  .scene .tk { font: 400 13px var(--k-font); fill: var(--k-muted); }
  .scene .at { font: 600 13px var(--k-font); fill: var(--k-muted); }
  /* Fact 1's line solid, fact 2's dashed; their marks a filled dot and an open ring. */
  .scene .l1 { stroke: var(--k-accent2); stroke-width: 2.5; stroke-linecap: round; fill: none; }
  .scene .l2 { stroke: var(--k-accent); stroke-width: 2.5; stroke-dasharray: 8 6; fill: none; }
  .scene .m1 { fill: var(--k-accent2); }
  .scene .m2 { fill: none; stroke: var(--k-accent); stroke-width: 2; }
  .scene .gr { fill: var(--k-fill1); fill-opacity: .3; stroke: var(--k-accent2); stroke-width: 2.5; }
  .scene .xr { fill: none; stroke: var(--k-ink); stroke-width: 2; }
  .scene .key { font: 400 13px var(--k-font); fill: var(--k-muted); }
  .scene .kk { font: 600 13px var(--k-font); fill: var(--k-ink); }
  .scene #art * { pointer-events: none; }
  .scene .hit { fill: var(--k-bg); fill-opacity: 0; cursor: grab; touch-action: none; }
  /* Each fact is a card that checks the guess with its own rule. */
  .cards { flex: 1 1 13rem; min-width: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr)); gap: 10px; align-content: start; }
  .cards .guess { grid-column: 1 / -1; font-weight: 700; color: var(--k-accent2); line-height: 1.45; }
  .card { border: 1px solid var(--k-line); border-radius: var(--k-r); background: var(--k-panel); padding: 8px 10px; line-height: 1.45; min-width: 0; }
  .card .ch { display: flex; align-items: center; gap: 8px; font-weight: 700; }
  .card .ch svg { flex: 0 0 auto; }
  .card .ci { color: var(--k-muted); font-size: .92rem; }
  .card .ce { font-weight: 700; margin-top: 4px; }
  .card .ce.bad { color: var(--k-warn); }
  .card .cc { margin-top: 2px; }
  .card .cs { font-weight: 700; }
  .card .cs.ok { color: var(--k-accent2); }
  .card .cs.no { color: var(--k-warn); }
  .card .q { color: var(--k-muted); }
  /* The working under the picture: one line per move, its name on the left. */
  .work { position: relative; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 12px; padding: 4px 0 4px 15px; line-height: 1.45; max-width: 40rem; }
  .work .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; border-radius: 2px; background: var(--k-accent2); }
  .work .wl { color: var(--k-muted); font-size: .85rem; font-weight: 700; padding-top: .12rem; }
  .work .wm { font-weight: 600; }
  .work .pc, .card .pc { white-space: nowrap; }
  .work .pc.ok { color: var(--k-accent2); font-weight: 700; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  .row .k-btn { flex: 1 1 7rem; }
  .replay { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 10px; }
  .replay .k-btn { flex: 0 0 auto; min-height: 44px; padding-left: 16px; padding-right: 16px; font-size: .95rem; white-space: nowrap; }
  /* The answers stack one to a row, each label whole. */
  .row.picks { flex-direction: column; gap: 8px; }
  .picks .k-btn { flex: 0 0 auto; width: 100%; min-height: 48px; font-size: 1.05rem; padding-inline: 10px; }
  .picks .k-btn[aria-pressed="true"] { background: var(--k-accent2); color: var(--k-on-accent2); border-color: var(--k-accent2); }
  .fb { font-weight: 700; min-height: 1.5em; margin-top: 10px; }
  .pz.ask .fb:empty { min-height: 0; }
  .fb.right { color: var(--k-good); }
  .fb.wrong { color: var(--k-ink); }
  .why { line-height: 1.6; }
  .done { line-height: 1.6; }
  .done strong { color: var(--k-accent2); }
  .done .row { margin-top: 14px; }
  /* Each new screen settles in softly: its words and picture fade in and rise 4 px. */
  #stepbox.enter, #done.enter { animation: screen-in .35s ease-out both; }
  @keyframes screen-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  html.k-testing #stepbox.enter, html.k-testing #done.enter { animation: none; }
  @media (prefers-reduced-motion: reduce) { #stepbox.enter, #done.enter { animation: none; } }

<p class="lead" id="lead">A grid of guesses at two unknown prices, and receipts that each check a guess with their own rule. Every story here uses example figures.</p>

<div class="pz" id="pz">
  <div id="prog"></div>
  <div id="stepbox">
    <p class="k-label count" id="count"></p>
    <p class="task" id="task"></p>
    <div class="board">
      <svg class="scene" id="scene" viewBox="0 0 340 342" width="100%" role="img" tabindex="0" aria-label=""><g id="art"></g><g id="top"></g></svg>

    </div>
    <div class="replay" id="replay"></div>

<p class="caption">Drag the ring, or use the arrow keys, to try any guess on the grid.</p>

<script>
  // ---------- numbers, written as the lesson writes them ----------
  const r6 = (v) => Math.round(v * 1e6) / 1e6;
  const near = (a, b, t) => Math.abs(a - b) <= (t == null ? 1e-7 : t);
  const mn = (s) => String(s).replace(/-/g, '−');
  // Money with pence shows two decimals (3.50); everything else as short as it is (0.08).
  function fv(v, money) { v = r6(v); return mn(money && !Number.isInteger(v) ? v.toFixed(2) : String(v)); }
  const pounds = (v) => (v > 0 && v < 1 ? Math.round(v * 100) + 'p' : '£' + fv(v, true));
  // 2d, −x, + 2p, − 4d
  function termT(k, v, first) { const m = Math.abs(k), body = (m === 1 ? '' : m) + v; return first ? (k < 0 ? '−' : '') + body : (k < 0 ? ' − ' : ' + ') + body; }

  // ---------- the stories: two unknowns (the grid's axes) and the facts that check a guess ----------
  const A = (v, title, max, step, tick, money) => ({ v, title, max, step, tick, money: !!money });
  // A fact: a·(across) + b·(up) = c, in its unit. items says it in the story's words.
  const F = (name, items, a, b, c, unit) => ({ name, items, a, b, c, unit: unit || '£' });
  const money = (f) => f.unit === '£';
  const tt = (f, c) => { c = c == null ? f.c : c; return money(f) ? '£' + fv(c, true) : fv(c) + ' ' + f.unit; };
  const RA = F('Receipt 1', '2 drinks and 1 bag of popcorn', 2, 1, 8);
  const RB = F('Receipt 2', '1 drink and 2 bags of popcorn', 1, 2, 7);
  const RC = (c) => F('Receipt 3', '4 drinks and 2 bags of popcorn', 4, 2, c);
  const POPX = A('d', "d, a drink's price (£)", 5, 0.5, 1, true), POPY = A('p', "p, a bag of popcorn's price (£)", 8, 0.5, 2, true);
  const POP = { X: POPX, Y: POPY, letters: "d = a drink's price and p = a bag of popcorn's, both in £",
    means: (P) => 'a drink costs ' + pounds(P[0]) + ' and a bag of popcorn ' + pounds(P[1]) };
  const story = (base, facts, g0, extra) => Object.assign({}, base, { F: facts, g0 }, extra || {});
  const MACH = { X: A('a', 'a, effort added per N of load', 0.2, 0.01, 0.05), Y: A('b', 'b, effort with no load (N)', 20, 1, 5),
    letters: 'In the law P = aW + b, P is the effort and W the load, both in N. The unknowns are a and b',
    means: (P) => 'P = ' + fv(P[0]) + 'W + ' + fv(P[1]) + ': each extra newton of load needs ' + fv(P[0]) + ' N more effort, and ' + fv(P[1]) + ' N is the effort with no load' };
  const RD = (n, W, P) => F('Reading ' + n, 'load ' + W + ' N, effort ' + P + ' N', W, 1, P, 'N');
  const S_A = story(POP, [RA], [2, 4]);
  const S_AB = story(POP, [RA, RB], [2, 4]);
  const S_C = (c) => story(POP, [RA, RC(c)], [1, 6]);
  const S_CAB = story({ X: A('x', 'x, 2.5 mm² cable (£ a metre)', 3, 0.1, 0.5, true), Y: A('y', 'y, 1.5 mm² cable (£ a metre)', 3, 0.1, 0.5, true),
    letters: "x = the 2.5 mm² cable's price and y = the 1.5 mm²'s, both in £ a metre",
    means: (P) => 'the 2.5 mm² costs ' + pounds(P[0]) + ' a metre and the 1.5 mm² ' + pounds(P[1]) + ' a metre' },
    [F('Order 1', '10 m of each size', 10, 10, 20), F('Order 2', '10 m of 2.5 mm² and 20 m of 1.5 mm²', 10, 20, 28)], [1, 1]);
  const S_SOCK = story({ X: A('s', 's, a socket (£)', 6, 0.5, 1, true), Y: A('w', 'w, a switch (£)', 8, 0.5, 2, true),
    letters: "s = a socket's price and w = a switch's, both in £", means: (P) => 'a socket costs ' + pounds(P[0]) + ' and a switch ' + pounds(P[1]) },
    [F('Order 1', '4 sockets and 2 switches', 4, 2, 22), F('Order 2', '2 sockets and 3 switches', 2, 3, 19)], [2, 2]);
  const S_M1 = story(MACH, [RD(1, 100, 15), RD(2, 300, 35)], [0.05, 10]);
  const S_M2 = story(MACH, [RD(1, 200, 26), RD(2, 500, 50)], [0.05, 15]);
  const S_DRUM = story({ X: A('x', 'x, the shorter length (m)', 30, 1, 5), Y: A('y', 'y, the longer length (m)', 30, 1, 5),
    letters: 'x = the shorter length and y = the longer, both in m', means: (P) => 'the two lengths are ' + fv(P[0]) + ' m and ' + fv(P[1]) + ' m' },
    [F('Fact 1', 'the two lengths make 30 m', 1, 1, 30, 'm'), F('Fact 2', 'one is 6 m longer than the other', -1, 1, 6, 'm')], [10, 10]);
  const S_TEA = story({ X: A('c', 'c, a coffee (£)', 5, 0.25, 1, true), Y: A('t', 't, a tea (£)', 5, 0.25, 1, true),
    letters: "c = a coffee's price and t = a tea's, both in £", means: (P) => 'a coffee costs ' + pounds(P[0]) + ' and a tea ' + pounds(P[1]) },
    [F('Order 1', '3 coffees and 2 teas', 3, 2, 12.5), F('Order 2', '1 coffee and 2 teas', 1, 2, 6.5)], [2, 2]);
  const LOAD = 250;   // the load asked about on the last screen, in N
  const S_M3 = story(MACH, [RD(1, 100, 20), RD(2, 400, 50)], [0.05, 15], { load: LOAD });

  // ---------- each fact's rule, and a guess put into it ----------
  // A fact whose first term is negative (y − x = 6) is written with its positive term first.
  const flip = (f) => f.a < 0 && f.b > 0;
  function eqT(f, s) {
    return (flip(f) ? termT(f.b, s.Y.v, true) + termT(f.a, s.X.v, false) : termT(f.a, s.X.v, true) + termT(f.b, s.Y.v, false)) + ' = ' + fv(f.c, money(f));
  }
  function calcT(f, s, g) {
    const tm = (k, v, ax, first) => { const m = Math.abs(k), val = fv(v, ax.money), body = m === 1 ? val : m + ' × ' + val; return first ? (k < 0 ? '−' : '') + body : (k < 0 ? ' − ' : ' + ') + body; };
    const e = flip(f) ? tm(f.b, g[1], s.Y, true) + tm(f.a, g[0], s.X, false) : tm(f.a, g[0], s.X, true) + tm(f.b, g[1], s.Y, false);
    const tot = r6(f.a * g[0] + f.b * g[1]);
    return { e, tot, s: e + ' = ' + fv(tot, money(f)), ok: near(tot, f.c), more: tot > f.c };
  }
  const passes = (f, g) => near(f.a * g[0] + f.b * g[1], f.c);
  function cross(f1, f2) {
    const det = f1.a * f2.b - f2.a * f1.b;
    if (Math.abs(det) < 1e-12) return null;
    return [r6((f1.c * f2.b - f2.c * f1.b) / det), r6((f1.a * f2.c - f2.a * f1.c) / det)];
  }
  const snapA = (v, ax) => r6(K.clamp(Math.round(v / ax.step) * ax.step, 0, ax.max));
  const onGrid = (s, g) => g[0] >= -1e-9 && g[0] <= s.X.max + 1e-9 && g[1] >= -1e-9 && g[1] <= s.Y.max + 1e-9;
  function pairT(s, g) { const m = (ax, v) => (ax.money ? '£' : '') + fv(v, ax.money); return '(' + m(s.X, g[0]) + ', ' + m(s.Y, g[1]) + ')'; }
  function guessT(s, g) { const m = (ax, v) => { const u = (ax.title.match(/\((N|m)\)$/) || [])[1]; return ax.v + ' = ' + (ax.money ? '£' : '') + fv(v, ax.money) + (u ? ' ' + u : ''); }; return m(s.X, g[0]) + ', ' + m(s.Y, g[1]); }
  // Every guess on the grid.
  function gridPts(s) {
    const out = [], nx = Math.round(s.X.max / s.X.step), ny = Math.round(s.Y.max / s.Y.step);
    for (let i = 0; i <= nx; i++) for (let j = 0; j <= ny; j++) out.push([r6(i * s.X.step), r6(j * s.Y.step)]);
    return out;
  }

  // ---------- the working, built from the facts ----------
  const okT = (f, s, g) => { const c = calcT(f, s, g); return c.s + (c.ok ? ' ✓' : ', not ' + fv(f.c, money(f))); };
  const chkRows = (s, g) => s.F.map((f) => ({ l: f.name, s: okT(f, s, g) }));
  const eqRows = (s) => s.F.map((f) => ({ l: f.name, s: eqT(f, s) }));
  const letRow = (s) => ({ l: 'Letters', s: s.letters, prose: true });
  // The value found put back into one fact for the other letter.
  function putBack(s, f, uX, v) {
    const ku = uX ? f.a : f.b, kw = uX ? f.b : f.a, axU = uX ? s.X : s.Y, axW = uX ? s.Y : s.X, mo = money(f);
    const known = r6(ku * v), rest = r6(f.c - known), w = r6(rest / kw);
    const kv = (Math.abs(ku) === 1 ? '' : Math.abs(ku) + ' × ') + fv(v, axU.money);
    if (kw === 1 && ku > 0) return { l: 'Put back', s: axW.v + ' = ' + fv(f.c, mo) + ' − ' + kv + ' = ' + fv(f.c, mo) + ' − ' + fv(known, mo) + ' = ' + fv(w, axW.money), w };
    const left = uX ? kv + termT(kw, axW.v, false) : termT(kw, axW.v, true) + ' + ' + kv;
    return { l: 'Put back', s: left + ' = ' + fv(f.c, mo) + ', so ' + termT(kw, axW.v, true) + ' = ' + fv(f.c, mo) + ' − ' + fv(known, mo) + ' = ' + fv(rest, mo) + ' and ' + axW.v + ' = ' + fv(rest, mo) + ' ÷ ' + kw + ' = ' + fv(w, axW.money), w };
  }
  // Elimination: scale the facts by k, take one away from the other (top minus the other), put back.
  function elimRows(s, k, top, back) {
    const G = s.F.map((f, n) => Object.assign({}, f, { a: f.a * k[n], b: f.b * k[n], c: r6(f.c * k[n]) }));
    const out = [], mo = money(s.F[0]);
    s.F.forEach((f, n) => { if (k[n] !== 1) out.push({ l: f.name + ' × ' + k[n], s: eqT(G[n], s) }); });
    const T0 = G[top], O = G[1 - top], D = { a: r6(T0.a - O.a), b: r6(T0.b - O.b), c: r6(T0.c - O.c) };
    const uX = D.b === 0, Kc = uX ? D.a : D.b, ax = uX ? s.X : s.Y, v = r6(D.c / Kc);
    out.push({ l: 'Take away', s: (Kc === 1 ? '' : Kc) + ax.v + ' = ' + fv(T0.c, mo) + ' − ' + fv(O.c, mo) + ' = ' + fv(D.c, mo) +
      (Kc === 1 ? '' : ', so ' + ax.v + ' = ' + fv(D.c, mo) + ' ÷ ' + Kc + ' = ' + fv(v, ax.money)) });
    const pb = putBack(s, s.F[back], uX, v);
    out.push({ l: pb.l, s: pb.s });
    return { rows: out, P: uX ? [v, pb.w] : [pb.w, v] };
  }
  // Substitution: fact fi says what the up letter is; swap that into the other fact.
  function subRows(s, fi) {
    const f = s.F[fi], g = s.F[1 - fi], X = s.X.v, Y = s.Y.v, mo = money(f);
    const expr = f.a > 0 ? fv(f.c, mo) + termT(-f.a, X, false) : termT(-f.a, X, true) + ' + ' + fv(f.c, mo);
    const out = [{ l: 'From ' + f.name.toLowerCase(), s: Y + ' = ' + expr }];
    out.push({ l: 'Swap in', s: termT(g.a, X, true) + ' + ' + (g.b === 1 ? '' : g.b) + '(' + expr + ') = ' + fv(g.c, mo) });
    const k0 = r6(g.b * f.c), kx = -g.b * f.a, Kc = g.a + kx, R = r6(g.c - k0), x = r6(R / Kc);
    out.push({ l: 'Open up', s: termT(g.a, X, true) + ' + ' + fv(k0, mo) + termT(kx, X, false) + ' = ' + fv(g.c, mo) });
    out.push({ l: 'Solve', s: termT(Kc, X, true) + ' = ' + fv(g.c, mo) + ' − ' + fv(k0, mo) + ' = ' + fv(R, mo) + ', so ' + X + ' = ' + (Kc > 1 ? fv(R, mo) + ' ÷ ' + Kc + ' = ' : '') + fv(x, s.X.money) });
    const y = r6(f.c - f.a * x);
    out.push({ l: 'Put back', s: Y + ' = ' + (f.a > 0 ? fv(f.c, mo) + ' − ' + (f.a === 1 ? '' : f.a + ' × ') + fv(x, s.X.money) + ' = ' + fv(f.c, mo) + ' − ' + fv(f.a * x, mo) : fv(x, s.X.money) + ' + ' + fv(f.c, mo)) + ' = ' + fv(y, s.Y.money) });
    return { rows: out, P: [x, y] };
  }
  // The full working for a pair of facts: the letters, one equation per fact, the solve, the check, the meaning.
  function solveRows(s, how) {
    const sol = how.sub != null ? subRows(s, how.sub) : elimRows(s, how.k || [1, 1], how.top, how.back);
    const rows = [letRow(s)].concat(eqRows(s), sol.rows, chkRows(s, sol.P), [{ l: 'Means', s: s.means(sol.P), prose: true }]);
    if (s.load) rows.push({ l: 'At ' + s.load + ' N', s: 'P = ' + fv(sol.P[0]) + ' × ' + s.load + ' + ' + fv(sol.P[1]) + ' = ' + fv(sol.P[0] * s.load) + ' + ' + fv(sol.P[1]) + ' = ' + fv(sol.P[0] * s.load + sol.P[1]) + ' N' });
    return { rows, P: sol.P };
  }
  // Receipt 3 halved, set beside receipt 1.
  function halfRows(c) {
    const C = RC(c), H = Object.assign({}, C, { a: C.a / 2, b: C.b / 2, c: r6(C.c / 2) }), same = near(H.c, RA.c);
    return [{ l: C.name, s: eqT(C, POP) }, { l: 'Halved', s: eqT(H, POP) + (same ? ', which is receipt 1 again' : ', but receipt 1 says ' + fv(RA.c, true)) },
      { l: 'So', s: same ? 'the lines lie on top of each other: endless answers' : 'the lines run side by side: no pair fits both', prose: true }];
  }

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // A SHOW step: stops (where the guess goes, and when it sets off), pre (lines and marks already known),
  // lines (when each fact's line arrives), ring, rows (the working: one time per row), dur.
  // A DO step: kind ('eq', 'pair' or 'which'), opts, want, a hint and each wrong answer's own hint, why.
  const PICK = 'Tap one of the answers.';
  const FB = 2.5, FADE = 0.35, TRAVEL = 0.6, FIRST = 0.45;
  const A_MARKS = [[2, 4], [3, 2], [1, 6]];
  const STEPS = [
    { show: true, name: 'One receipt', sys: S_A, stops: [[0, [2, 4]], [1.2, [3, 2]], [2.2, [1, 6]]], lines: [[0, 3.1]], ring: null, dur: 4.4,
      rows: (s) => [letRow(s), eqRows(s)[0], { l: 'Accepts', s: A_MARKS.map((g) => pairT(s, g)).join(', ') }, { l: 'So', s: 'one fact allows a whole line of answers', prose: true }], rowAt: [0.5, 0.8, 3.4, 3.8],
      text: 'A cinema receipt says 2 drinks and 1 bag of popcorn cost £8. Each point on the grid is a guess at the two prices, and the receipt checks it with `2d + p = 8`. Every guess it accepts lands on one straight line.' },
    { kind: 'eq', name: 'Write the second receipt', sys: S_AB, pre: { lines: [0], marks: [[0, A_MARKS]] },
      opts: ['d + p + 2 = 7', 'd + 2p = 7', '2d + p = 7'], want: 1,

      calcT(S_DRUM.F[0], S_DRUM, [18, 24]).s === '18 + 24 = 42' && calcT(S_DRUM.F[1], S_DRUM, [15, 15]).s === '15 − 15 = 0' && calcT(S_TEA.F[0], S_TEA, [1.75, 3]).s === '3 × 1.75 + 2 × 3 = 11.25' &&
      calcT(S_TEA.F[1], S_TEA, [2.5, 2.5]).s === '2.50 + 2 × 2.50 = 7.50' && calcT(S_M3.F[1], S_M3, [0.2, 0]).s === '400 × 0.2 + 0 = 80' && calcT(RC(16), POP, [1, 6]).s === '4 × 1 + 2 × 6 = 16';
  });
  K.check('Every puzzle has three answers, one of them right, and a hint of its own for each wrong one; the right pair passes both facts, each wrong pair fails at least one, and only the right second receipt crosses receipt 1', () =>
    DO.every((i) => {
      const d = STEPS[i], s = d.sys;
      const hintsOk = d.opts.length === 3 && d.want >= 0 && d.want < 3 && d.opts.every((o, k) => k === d.want || (!!d.hints[k] && d.hints[k] !== d.hint));
      if (d.kind === 'eq') return hintsOk && labelOf(d, d.want) === eqT(s.F[1], s) && d.opts.every((o, k) => k === d.want || o !== eqT(s.F[1], s));
      if (d.kind === 'which') return hintsOk && d.opts.every((f, k) => (k === d.want) === !!cross(RA, f));
      const P = solveRows(s, d.how).P;
      return hintsOk && sameG(P, cross(s.F[0], s.F[1])) && d.opts.every((g, k) => { const both = passes(s.F[0], g) && passes(s.F[1], g); return k === d.want ? both && sameG(g, P) : !both; });
    }));
  K.check('Before an answer a puzzle keeps back the crossing ring and the working; a right answer or Why? draws both lines, rings the crossing, moves the guess there so both cards match, and works it through; a wrong pair is tried in every card and fails one', () =>
    DO.filter((i) => STEPS[i].kind === 'pair').every((i) => {
      const d = STEPS[i], P = cross(d.sys.F[0], d.sys.F[1]), b = drawn(i, blank());
      if (b.ring || b.rows.length || b.lines.length) return false;
      const good = [drawn(i, solvedSt(i)), drawn(i, whySt())].every((g) => g.ring && g.lines.join() === '0,1' && sameG(g.guess, P) && g.rows.length >= 8 && g.cards.every((c) => c.status === '✓ matches'));
      return good && d.opts.every((o, k) => { if (k === d.want) return true; const w = drawn(i, wrongSt(k)); return !w.ring && sameG(w.guess, o) && w.rows[0].l === 'Tried' && w.cards.some((c) => c.status !== '✓ matches'); });
    }) && (() => {
      const e = STEPS.findIndex((d) => d.kind === 'eq'), b = drawn(e, blank()), r = drawn(e, solvedSt(e)), w = drawn(e, wrongSt(0));
      return b.cards[1].eq == null && r.cards[1].eq === eqT(RB, S_AB) && w.cards[1].eq === STEPS[e].opts[0] && w.cards[1].calc == null;
    })() && (() => {
      const h = STEPS.findIndex((d) => d.kind === 'which'), b = drawn(h, blank()), r = drawn(h, solvedSt(h)), on = drawn(h, wrongSt(0)), off = drawn(h, wrongSt(2));
      return b.cards.length === 1 && !b.ring && r.ring && sameG(r.guess, [3, 2]) && on.lines.join() === '0,1' && sameSeg(on.line2, clipFact(POP, RA)) && !on.ring &&
        off.lines.join() === '0,1' && !sameSeg(off.line2, clipFact(POP, RA)) && !off.ring;
    })());
  K.check('The first screen opens with a £2 drink and £4 popcorn on receipt 1, where 2 × 2 + 4 = 8 matches; its demonstration leaves marks at (£2, £4), (£3, £2) and (£1, £6) and only then draws the line through them', () => {
    const o = drawn(0, blank(), 0.3), e = drawn(0, blank(), 3.15), f = drawn(0, blank());
    return o.cards[0].calc === '2 × 2 + 4 = 8' && o.cards[0].status === '✓ matches' && o.marks.length === 0 && o.lines.length === 0 &&
      e.lines.length === 0 && e.marks.length === 3 && f.lines.join() === '0' && A_MARKS.every((g) => f.marks.indexOf('0:' + g.join(',')) >= 0);
  });
  K.check('On the doubled-receipt screen receipt 3 at £16 accepts a £1 drink and £6 popcorn and its line lies on receipt 1\'s; at £15 the same guess comes to too much, its line moves off to run alongside, and no ring appears', () => {
    const i = STEPS.findIndex((d) => !!d.slide), a = drawn(i, blank(), 2.0), b = drawn(i, blank());
    return a.cards[1].calc === '4 × 1 + 2 × 6 = 16' && a.cards[1].status === '✓ matches' && a.lines.join() === '0,1' && sameSeg(a.line2, clipFact(POP, RA)) &&
      b.cards[1].calc === '4 × 1 + 2 × 6 = 16' && b.cards[1].status === 'too much' && b.lines.join() === '0,1' && !sameSeg(b.line2, clipFact(POP, RA)) && !b.ring && !a.ring;
  });
  K.check('Every demonstration settles within its 3 to 5 s, none starting before the 0.35 s screen fade ends, and a puzzle\'s answer, Why? or wrong pick settles within 2.5 s', () => {
    const keepT = T;
    const timed = (i, st, limit) => {
      const keepS = S[i];
      T = Infinity; latest = 0; earliest = Infinity; S[i] = st;
      try { paint(i); } finally { S[i] = keepS; }
      return latest <= limit + 1e-9;
    };
    const ok = STEPS.every((d, i) => (d.show ? timed(i, blank(), d.dur) && d.dur >= 3 && d.dur <= 5 && earliest >= FADE
      : timed(i, solvedSt(i), FB) && timed(i, whySt(), FB) && d.opts.every((o, k) => k === d.want || timed(i, wrongSt(k), FB))));
    T = keepT; paint();
    return ok;
  });

  K.ready();
