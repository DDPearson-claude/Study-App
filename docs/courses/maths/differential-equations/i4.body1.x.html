<p class="caption">Every step, drift and reading is worked out from the rule on its screen.</p>

<script>
  // ---------- the rules ----------
  // A 100 µF capacitor discharging through 10 kΩ: τ = RC = 1 s, and dV/dt = −V ÷ τ. Exact: V = 12 e^(−t).
  const C_F = 100e-6, R_OHM = 10e3, TAU = Math.round(C_F * R_OHM * 1e6) / 1e6, V0 = 12;
  const capRate = (t, v) => -v / TAU;
  const capExact = (t) => V0 * Math.exp(-t / TAU);
  // A tank filled at 0.3 m a minute that drains as 0.2 √h: dh/dt = 0.3 − 0.2 √h. It has no tidy formula.
  const QIN = 0.3, QK = 0.2, H_SS = Math.pow(QIN / QK, 2);   // 2.25 m, where inflow and outflow balance
  const tankRate = (t, h) => QIN - QK * Math.sqrt(Math.max(0, h));
  // The coil from before: 24 V, 10 Ω, 0.5 H, so di/dt = (24 − 10 i) ÷ 0.5, τ = 0.05 s, steady 2.4 A.
  const CE = 24, CR = 10, CL = 0.5, CTAU = CL / CR, CSS = CE / CR;
  const coilRate = (t, i) => (CE - CR * i) / CL;
  const coilExact = (t) => CSS * (1 - Math.exp(-t / CTAU));
  // Euler's method: new value = old value + h × slope at the old value; new time = old time + h.
  function euler(rate, y0, h, tEnd) {
    const n = Math.round(tEnd / h), pts = [[0, y0]];
    let y = y0;
    for (let k = 0; k < n; k++) { y = y + h * rate(k * h, y); pts.push([(k + 1) * h, y]); }
    return pts;
  }
  const valAt = (pts, t) => pts[Math.round(t / (pts[1][0] - pts[0][0]))][1];
  const CAP_HS = [1, 0.5, 0.25, 0.1, 0.05], BIG_HS = [1, 1.5, 2], TANK_HS = [2, 1, 0.5, 0.25];
  const capWalk = (h, tEnd) => euler(capRate, V0, h, tEnd == null ? 3 : tEnd);
  const capAt1 = (h) => valAt(capWalk(h, 1), 1);
  const driftAt1 = (h) => capExact(1) - capAt1(h);
  const tankWalk = (h, tEnd) => euler(tankRate, 0, h, tEnd == null ? 20 : tEnd);
  const tankAt4 = (h) => valAt(tankWalk(h, 4), 4);
  const coilWalk = (h, tEnd) => euler(coilRate, 0, h, tEnd);

  // The source the checks restate (the lesson's own).
  const SWAR = 'https://lpsa.swarthmore.edu/NumInt/NumIntFirst.html';

  // ---------- numbers, written the lesson's way ----------
  const strip = (s) => (s.indexOf('.') >= 0 ? s.replace(/0+$/, '').replace(/\.$/, '') : s);
  function fmtD(v, dp) {
    const m = Math.pow(10, dp), r = Math.round(v * m) / m;
    if (r === 0) return '0';
    return (r < 0 ? '−' : '') + strip(Math.abs(r).toFixed(dp));
  }
  const f2 = (v) => fmtD(v, 2), f3 = (v) => fmtD(v, 3);
  // The log's way: two places kept ("3.00 V"), and a plain 0.
  function f2z(v) { const r = Math.round(v * 100) / 100; return r === 0 ? '0' : (r < 0 ? '−' : '') + Math.abs(r).toFixed(2); }
  const plain = (s) => String(s == null ? '' : s).replace(/`/g, '').replace(/\*/g, '');
  // As a screen reader says it.
  const say = (s) => plain(s).replace(/d([A-Za-z])\/d([A-Za-z])/g, 'd $1 by d $2').replace(/e\^\(([^)]*)\)/g, 'e to the power $1')
    .replace(/µF/g, ' microfarads').replace(/kΩ/g, ' kilohms').replace(/Ω/g, ' ohms').replace(/τ/g, ' tau ').replace(/√/g, ' root ')
    .replace(/÷/g, ' divided by ').replace(/×/g, ' times ').replace(/=/g, ' equals ').replace(/\+/g, ' plus ').replace(/−/g, ' minus ')
    .replace(/%/g, ' per cent').replace(/\s+/g, ' ').trim();

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // grid: which plot (GRIDS below); info: the step size, above the plot on the right; switch: the
  // named step sizes under the drawing; reads: the log of values under it; work: lines of working
  // under the plot; key: the key's items; draw(st, d): the picture in that step's state. A SHOW
  // step's timetable is in its draw, in seconds from when the screen opens.
  const PICK = 'Tap one of the answers.';
  const FB = 2.0;   // how long the motion after an answer plays
  const SOFT = 0.6;
  const H1 = 0.5;   // the first step size
  const STEPS = [
    { show: true, name: 'One step', grid: 'cap', work: 1, key: ['walk', 'read', 'exact', 'field'], dur: 3.6, info: '`h` = 0.5 s',
      text: 'A 100 µF capacitor discharges from 12 V through 10 kΩ. So `τ = RC` = 1 s, and its rule is `dV/dt = −V ÷ 1`. The faint marks are the *slope field*: the slope the rule gives at each point. The faint curve is the exact answer. *Euler\'s method* walks instead. At 12 V the slope is −12 V a second. Walk 0.5 s straight along it. You fall 6 V and land on 6 V.',
      draw() {
        const w = capWalk(H1, H1);
        exactCurve(capExact, 0, 3);
        dot(0, V0);
        arrowFrom(0, V0, capRate(0, V0), 'rd', arr(0.5, 0.8), 40, 5);
        part(vis(0.9), 4, () => label(G.x(0) + 14, G.y(V0) + 4, 'slope −12 V a second', 'lab acc', 'start', [[G.x(0) + 18, G.y(V0) + 22, 'start']]));
        const tip = drawWalk(w, 'walk', arr(1.6, 1.4), { rate: capRate, dots: false });
        if (tip && TM < 3.0) rider(tip);
        part(vis(3.0), 4, () => { dot(H1, w[1][1]); label(G.x(H1) + 10, G.y(w[1][1]) + 5, f2(w[1][1]) + ' V', 'lab main', 'start'); });
        workLines([{ s: '12 + 0.5 × (−12) = 6 V', a: vis(3.0) }]);
        said.push('A dot at 12 volts reads the slope arrow there and walks half a second straight along it, down to 6 volts.');
      } },
    { kind: 'pick', name: 'The next step', grid: 'cap', work: 1, key: ['walk', 'exact', 'field'], info: '`h` = 0.5 s',
      task: 'Now you stand at 6 V, at 0.5 s. Where does the next 0.5 s step land?',
      opts: ['3 V', '0 V', '4.41 V'], want: '3 V',
      why: 'At 6 V the rule gives a slope of −6 V a second. Walk 0.5 s along it and you fall 0.5 × 6 = 3 V. So you land on 6 − 3 = 3 V. Each step is new value = old value + `h` × slope.',
      hint: 'Not quite. Read the slope again at 6 V first.',
      hints: { '0 V': 'Not quite. That keeps the old slope of −12 V a second. At 6 V the slope is −6 V a second.', '4.41 V': 'Not quite. 4.41 V is the exact curve at 1 s. The walk only follows its arrows.' },
      draw(st) {
        const r = RW(st), w = capWalk(H1, 1);
        exactCurve(capExact, 0, 3);
        marker(1, 'after 1 s');
        drawWalk(w.slice(0, 2), 'walk', 1, { rate: capRate });
        dot(H1, w[1][1]);
        label(G.x(H1) + 10, G.y(w[1][1]) - 8, '6 V', 'lab main', 'start');
        if (r.ok) {
          REC.answer = true;
          arrowFrom(H1, w[1][1], capRate(H1, w[1][1]), 'rd', arr(0.1, 0.5), 30, 5);
          const tip = drawWalk(w.slice(1), 'walk', arr(0.5, 0.9), { rate: capRate, dots: false });
          if (tip && TM < 1.4) rider(tip);
          part(vis(1.3), 0, () => { dot(1, w[2][1]); label(G.x(1) + 10, G.y(w[2][1]) + 16, f2(w[2][1]) + ' V', 'lab main', 'start'); });
          workLines([{ s: '6 + 0.5 × (−6) = 3 V', a: vis(0.6) }]);
        } else if (r.w === '0 V') {
          REC.bad++;
          badLine(H1, w[1][1], 1, w[1][1] + H1 * capRate(0, V0), arr(0.1, 0.8));
          part(vis(0.8), 0, () => ring(1, 0));
          part(vis(0.8), 4, () => label(G.x(1) + 14, G.y(1.2), 'the old slope, −12 V a second', 'lab bad', 'start'));
          workLines([{ s: 'the slope at 6 V is −6 V a second', bad: true, a: vis(0.4) }]);
        } else if (r.w) {
          REC.bad++;
          part(vis(0.1), 0, () => ring(1, capExact(1)));
          part(vis(0.5), 4, () => label(G.x(1) + 14, G.y(capExact(1)) - 10, '4.41 V is the exact curve', 'lab bad', 'start'));
          workLines([{ s: 'the walk follows its arrows, not the curve', bad: true, a: vis(0.5) }]);
        }
      } },
    { show: true, name: 'The drift', grid: 'cap', work: 0, key: ['walk', 'drift', 'exact', 'field'], dur: 3.6, info: '`h` = 0.5 s',
      text: 'Here are both 0.5 s steps beside the exact curve. At 1 s the walk reads 3 V. The curve reads 4.41 V. The hatched gap between them is the *drift*, 1.41 V. The short ticks along the first step show the true slope as the voltage falls. It eases off. The step keeps the slope it read at its start. So it falls too far, and the walk drifts below the curve.',
      draw() {
        const w = capWalk(H1, 1), v1 = capAt1(H1), e1 = capExact(1);
        exactCurve(capExact, 0, 3);
        driftFill(w, capExact, 0, 1, vis(0.5));
        drawWalk(w, 'walk', 1, { rate: capRate });
        part(vis(0.5), 4, () => {
          label(G.x(1) + 8, G.y(e1) - 8, 'curve ' + f2(e1) + ' V', 'lab', 'start');
          label(G.x(1) + 8, G.y(v1) + 18, 'walk ' + f2(v1) + ' V', 'lab main', 'start');
        });
        part(vis(1.1), 0, () => bracket(1, v1, e1, 'drift ' + f2(e1 - v1) + ' V', [G.x(1) - 8, G.y(v1) + 20, 'end', [[G.x(1) - 8, G.y(v1) + 38, 'end']]]));
        [0.1, 0.2, 0.3, 0.4].forEach((t, k) => part(vis(1.8 + 0.35 * k), 0, () => tick(t, w[0][1] + t * capRate(0, w[0][1]), capRate)));
        part(vis(3.0), 4, () => label(G.x(0) + 22, G.PT + 14, 'ticks: the true slope eases off', 'lab', 'start'));
        said.push('Two half-second steps reach 3 volts at 1 second, below the curve\'s 4.41 volts. The 1.41 volt drift between them is hatched. Ticks along the first step show the true slope flattening while the step stays straight.');
      } },
    { kind: 'pick', name: 'Smaller steps', grid: 'cap', work: 2, key: ['walk', 'exact', 'field'], info: '`h` = 0.25 s',
      task: 'Start again at 12 V, with 0.25 s steps. Where is the walk at 0.5 s?',
      opts: ['6.75 V', '7.28 V', '6 V'], want: '6.75 V',
      why: 'The first step falls 0.25 × 12 = 3 V, to 9 V. At 9 V the slope is −9 V a second. So the second step falls 0.25 × 9 = 2.25 V, to 6.75 V. The exact curve reads 7.28 V there. One 0.5 s step reached only 6 V. So the smaller steps sit closer to the curve.',
      hint: 'Not quite. Take two steps of 0.25 s, re-reading the slope after the first.',
      hints: { '7.28 V': 'Not quite. 7.28 V is the exact curve at 0.5 s. The walk drifts below it.', '6 V': 'Not quite. 6 V is where one 0.5 s step lands. Take two steps of 0.25 s.' },
      draw(st) {
        const r = RW(st), w = capWalk(0.25, H1);
        exactCurve(capExact, 0, 3);
        marker(H1, 'after 0.5 s');
        dot(0, V0);
        if (r.ok) {
          REC.answer = true;
          arrowFrom(0, V0, capRate(0, V0), 'rd', arr(0.1, 0.4), 30, 5);
          arrowFrom(0.25, w[1][1], capRate(0.25, w[1][1]), 'rd', arr(0.8, 0.4), 30, 5);
          const tip = drawWalk(w, 'walk', (arr(0.2, 0.6) + arr(0.9, 0.6)) / 2, { rate: capRate });
          if (tip && TM < 1.5) rider(tip);
          part(vis(0.8), 4, () => label(G.x(0.25) + 10, G.y(w[1][1]) + 4, f2(w[1][1]) + ' V', 'lab main', 'start'));
          part(vis(1.4), 4, () => {
            dot(H1, w[2][1]);
            label(G.x(H1) - 8, G.y(w[2][1]) + 16, f2(w[2][1]) + ' V', 'lab main', 'end');
            dot(H1, capExact(H1), 'cv');
            label(G.x(H1) + 8, G.y(capExact(H1)) - 6, 'curve ' + f2(capExact(H1)) + ' V', 'lab', 'start');
          });
          workLines([{ s: '12 + 0.25 × (−12) = 9 V', a: vis(0.4) }, { s: '9 + 0.25 × (−9) = 6.75 V', a: vis(1.0) }]);
        } else if (r.w === '7.28 V') {
          REC.bad++;
          part(vis(0.1), 0, () => ring(H1, capExact(H1)));
          part(vis(0.5), 4, () => label(G.x(H1) + 14, G.y(capExact(H1)) - 8, '7.28 V is the exact curve', 'lab bad', 'start'));
          workLines([{ s: 'the walk drifts below the curve', bad: true, a: vis(0.5) }]);
        } else if (r.w) {
          REC.bad++;
          badLine(0, V0, H1, V0 + H1 * capRate(0, V0), arr(0.1, 0.8));
          part(vis(0.8), 0, () => ring(H1, 6));
          part(vis(0.8), 4, () => label(G.x(H1) + 14, G.y(6) + 18, '6 V is one 0.5 s step', 'lab bad', 'start'));
          workLines([{ s: 'two steps re-read the slope at 9 V', bad: true, a: vis(0.5) }]);
        }
      } },
    { show: true, name: 'Step size', grid: 'cap', work: 0, key: ['walk', 'read', 'drift', 'exact', 'field'], dur: 3.6,
      switch: CAP_HS.map((h) => [String(h), h + ' s']), mode0: '0.5', reads: readsCap,
      info: (st, d) => '`h` = ' + modeOf(d, st) + ' s',
      text: 'Each step reads the arrow at its start and walks straight along it. Choose a *step size*, `h`, and the walk is drawn again. The log keeps the value at 1 s for each size you try. Shorter steps re-read the slope more often. So the drift shrinks, and the value at 1 s climbs towards the curve\'s 4.41 V.',
      read: 'Each step reads the arrow at its start and walks straight along it. The log keeps the value at 1 s for each *step size*, `h`, from 1 s down to 0.05 s. Shorter steps re-read the slope more often. So the drift shrinks, and the value at 1 s climbs towards the curve\'s 4.41 V.',
      still() { stillLog('Step size', '0.05'); },

  // ---------- each step's state ----------

  // ---------- words with amber key terms, italic letters and raised powers (K.el, never innerHTML) ----------

  function svgWords(t, s) {

  }

  // ---------- controls ----------
  const stepper = K.stepper({ id: 'step', label: 'Step', steps: STEPS.map((d) => d.name), value: 0, compact: true, into: '#prog' });

  // Up to three answer buttons; each step fills in its own options. A new choice after a wrong

  const pickBtns = [0, 1, 2].map((k) => K.button({ label: 'Answer ' + (k + 1), secondary: true, into: '#picks', press: () => {

  } });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !anim.playing() && TM !== Infinity) { TM = Infinity; paint(); } });
  function play(dur) {

  }
  // The finished pictures the read-through shows: every step size tried, or one chosen.
  function stillLog(name, mode) {

  function stillMode(name, mode) {

  // ---------- drawing ----------
  const svg = document.getElementById('scene'), art = document.getElementById('art'), topG = document.getElementById('top'), fieldG = document.getElementById('field');
  let into = null, curA = 1;
  const add = (node) => (into || art).appendChild(node);
  // How far a part due at t0 has arrived (K.arrive), noting the timetable for the timing check.

  // An arrow along slope s (in the plot's units) from a point, grown to a fraction of its length;

  // A mistake drawn as a straight red line, grown to a fraction.

    if (grow <= 0) return;

  // An amber bracket across the drift at time t, with its label (above it on the right, unless placed).
  function bracket(t, a, b, s, place) {
    const x = G.x(t), y1 = G.y(a), y2 = G.y(b);
    REC.bars.push({ t, size: Math.abs(a - b), text: s });
    add(K.svg('path', { class: 'brk', d: 'M' + r2(x - 4) + ' ' + r2(y1) + ' H' + r2(x + 4) + ' M' + r2(x) + ' ' + r2(y1) + ' V' + r2(y2) + ' M' + r2(x - 4) + ' ' + r2(y2) + ' H' + r2(x + 4) }));
    addObst(x, y1, x, y2);
    const top = Math.min(y1, y2);
    if (place) label(place[0], place[1], s, 'lab', place[2], place[3]);
    else label(x + 8, top - 8, s, 'lab', 'start', [[x + 8, top - 25, 'start']]);
  }
  // A short tick along the rule's true slope at a point on a step.
  function tick(t, v, rate) {
    const s = rate(t, v), u = dirOf(s), cx = G.x(t), cy = G.y(v), L = 11;
    line('tick', cx - u[0] * L, cy - u[1] * L, cx + u[0] * L, cy + u[1] * L);
    addObst(cx - u[0] * L, cy - u[1] * L, cx + u[0] * L, cy + u[1] * L);
    REC.ticks.push({ t, v, s });
  }
  function steadyLine(v) {
    const y = G.y(v);
    line('ss', PL, y, PR, y); addObst(PL, y, PR, y);
    REC.ss.push(v);
  }
  function marker(t, s) {
    const x = G.x(t);
    line('mk', x, G.PB, x, G.PT); addObst(x, G.PB, x, G.PT);
    label(x + 6, G.PT + 14, s, 'lab', 'start', [[x - 6, G.PT + 14, 'end']]);
  }
  // The tank, small in the bottom corner: its water at the level the walk has reached.
  function tankIcon(level) {
    const x0 = 262, y0 = G.PB - 88, w = 50, h = 72, top = y0 + 6, full = y0 + h;
    const lv = (v) => full - K.clamp(v / G.g.v1, 0, 1) * (full - top);
    add(K.svg('rect', { class: 'inset', x: x0 - 40, y: y0 - 4, width: w + 46, height: h + 8, rx: 6 }));
    placed.push({ x: x0 - 40, y: y0 - 4, w: w + 46, h: h + 8 });
    add(K.svg('rect', { class: 'water', x: x0, y: r2(lv(level)), width: w, height: r2(full - lv(level)) }));
    add(K.svg('rect', { class: 'tankbox', x: x0, y: y0, width: w, height: h }));
    line('ss', x0, lv(H_SS), x0 + w, lv(H_SS));
    text(x0 - 6, full - 6, 'tank', 'lab', 'end');
    REC.tank = level;
  }
  // Lines of working under the plot.
  function workLines(lines) {
    lines.forEach((w, k) => {
      const a = w.a == null ? 1 : w.a;
      part(a, 6, () => text(12, G.workY + 26 * k, w.s, 'te' + (w.bad ? ' bad' : ''), 'start'));
      if (a >= 0.5) { REC.texts.push(plain(w.s)); said.push(say(w.s) + '.'); }
    });
  }
  // The rule's slope field: a short faint mark at each point of a grid, drawn once per plot.
  let fieldKey = '';
  function drawField() {
    if (fieldKey === G.name) return;
    fieldKey = G.name;
    fieldG.textContent = '';
    const g = G.g, nx = g.nf[0], ny = g.nf[1], dt = (g.t1 - g.t0) / nx, dv = (g.v1 - g.v0) / ny;
    let d = '';
    for (let a = 0; a < nx; a++) for (let b = 0; b < ny; b++) {
      const t = g.t0 + (a + 0.5) * dt, v = g.v0 + (b + 0.5) * dv, u = dirOf(g.rate(t, v)), cx = G.x(t), cy = G.y(v);
      d += 'M' + r2(cx - u[0] * 6) + ' ' + r2(cy - u[1] * 6) + ' L' + r2(cx + u[0] * 6) + ' ' + r2(cy + u[1] * 6) + ' ';
    }
    fieldG.appendChild(K.svg('path', { class: 'sf', d: d.trim() }));
  }
  // The axes, their numbers, and the words above them.
  function axes() {
    const g = G.g;
    g.yt.forEach((v) => { line('gl', PL, G.y(v), PR, G.y(v)); text(PL - 6, G.y(v) + 4.5, fmtD(v, 3), 'tk', 'end'); });
    g.xt.forEach((t) => { line('xt', G.x(t), G.PB, G.x(t), G.PB + 4); text(G.x(t), G.PB + 17, fmtD(t, 3), 'tk', 'middle'); });
    line('ax', PL, G.PB, PR, G.PB);
    line('ax', PL, G.PT, PL, G.PB);
    fixed(4, G.PT - 9, g.ytitle, 'ttl', 'start');
    placed.push({ x: 0, y: G.PT - 6, w: PL - 3, h: PH + 12 }, { x: PL - 24, y: G.PB + 3, w: PR - PL + 40, h: 18 });
  }
  function tags(d, st) {
    const g = G.g;
    if (g.tag) { fixed(4, 20, g.tag, 'tag', 'start'); said.push(say(g.tag) + '.'); }
    if (g.tag2) { fixed(336, 20, g.tag2, 'tag2', 'end'); said.push(say(g.tag2) + '.'); }
    const info = typeof d.info === 'function' ? d.info(st, d) : d.info;
    if (info) { fixed(336, G.PT - 9, info, 'ttl', 'end'); said.push(say(info) + '.'); }
  }
  // The key, inside the drawing, beside the time axis's name; it wraps to a second row if it must.
  const KEYS = {
    walk: ['Euler walk', (x, y) => { line('walk', x, y, x + 18, y); add(K.svg('circle', { class: 'knot', cx: x + 18, cy: y, r: 3 })); }],
    older: ['earlier walks', (x, y) => line('old', x, y, x + 18, y)],
    exact: ['exact curve', (x, y) => line('ex', x, y, x + 18, y)],
    drift: ['drift', (x, y) => add(K.svg('rect', { class: 'hatch sw', x, y: y - 6, width: 18, height: 12, rx: 2 }))],
    field: ['slope field', (x, y) => line('sf', x + 3, y + 5, x + 15, y - 5)],
    read: ['slope read', (x, y) => add(K.svg('path', { class: 'rd', d: arrowD(x + 2, y + 5, [0.6, -0.8], 0, 15, 6) }))],
  };
  function keyLayout(items) {
    const out = [];
    let x = PL + tw(G.g.xtitle, 'ttl') + 18, row = 0;
    items.forEach((k) => {
      const w = 24 + tw(KEYS[k][0], 'key');
      if (x + w > 336) { row++; x = PL; }
      out.push({ k, x, row });
      x += w + 14;
    });
    return { out, rows: row + 1 };
  }
  function keyRow(lay) {
    const y = G.PB + 38;
    text(PL, y, G.g.xtitle, 'ttl', 'start');
    lay.out.forEach((o) => { const yy = y + 20 * o.row; KEYS[o.k][1](o.x, yy - 5); text(o.x + 24, yy, KEYS[o.k][0], 'key', 'start'); });
  }

  // ---------- the log under the drawing ----------
  function readsCap(st, d) {
    return [['Exact curve', f2(capExact(1)) + ' V', 'at 1 s']].concat(logged(st, d).map((x) => {
      const h = Number(x);
      return [x + ' s steps', f2z(capAt1(h)) + ' V', 'drift ' + f2z(driftAt1(h)) + ' V'];
    }));
  }
  function readsHalve(st) {
    const list = st.res === 'right' ? CAP_HS : CAP_HS.filter((h) => h !== 0.05);
    return [['Exact curve', f2(capExact(1)) + ' V', 'at 1 s']].concat(list.map((h) => [h + ' s steps', f2z(capAt1(h)) + ' V', 'drift ' + f2z(driftAt1(h)) + ' V']));
  }
  function readsTank(st, d) {
    return logged(st, d).map((x) => [x + ' min steps', f2(tankAt4(Number(x))) + ' m', 'at 4 min']);
  }
  function setReads(d, st) {
    const box = document.getElementById('reads');
    const rows = d.reads ? d.reads(st, d) : null;
    REC.log = rows;
    if (!rows) { box.hidden = true; box.textContent = ''; box.dataset.key = ''; return; }
    box.hidden = false;
    const key = rows.map((r) => r[0]).join('|');
    if (box.dataset.key !== key) {
      box.textContent = '';
      rows.forEach(([lab]) => {
        const t = box.appendChild(K.el('div', { class: 'rd' }));
        write(t.appendChild(K.el('span', { class: 'k-label' })), lab);
        t.appendChild(K.el('b'));
        t.appendChild(K.el('small'));
      });
      box.dataset.key = key;
    }
    rows.forEach(([, v, sub], k) => { box.children[k].querySelector('b').textContent = nb(v); box.children[k].querySelector('small').textContent = nb(sub || ''); });
  }

  // The scene for a step (the animation calls this every frame).
  function paint(i) {
    if (i == null) i = at();
    const d = STEPS[i], st = S[i];
    G = geoOf(d, st);
    art.textContent = ''; topG.textContent = '';
    into = null; curA = 1; placed = []; obst = []; queue = []; said = [];
    REC = { walks: [], arrows: [], curves: [], texts: [], ss: [], bars: [], drift: [], ticks: [], bad: 0, answer: false, log: null, tank: null, tau: null };
    const lay = keyLayout((typeof d.key === 'function' ? d.key(st) : d.key) || []);
    G.workY += (lay.rows - 1) * 20; G.H += (lay.rows - 1) * 20;
    drawField();
    tags(d, st);
    axes();
    d.draw(st, d);
    keyRow(lay);
    queue.forEach(placeLabel);
    svg.setAttribute('viewBox', '0 0 340 ' + G.H);
    setReads(d, st);
    svg.setAttribute('aria-label', said.join(' '));
  }

  const el = (id) => document.getElementById(id);
  write(el('finish'), FINISH);
  K.update((p) => {
    const i = Math.round(p.step), d = STEPS[i], st = S[i];
    if (!anim.playing()) TM = Infinity;   // motion that was stopped (the page hidden, a test) shows finished
    if (i !== lastStep) {
      lastStep = i; enter('stepbox');
      if (d.show) play(d.dur); else { anim.pause(); TM = Infinity; }
    }
    if (finished !== lastDone) { lastDone = finished; enter(finished ? 'done' : 'stepbox'); }
    const right = st.res === 'right';
    el('stepbox').hidden = finished;
    el('done').hidden = !finished;
    el('count').textContent = 'Step ' + (i + 1) + ' of ' + STEPS.length;
    const task = el('task');
    task.className = 'task' + (d.show ? ' show' : '');
    write(task, d.show ? d.text : d.task);
    el('lead').textContent = nb(GRIDS[d.grid].lead);
    paint(i);

    replayBtn.el.hidden = !d.show || REDUCE;
    el('replay').hidden = replayBtn.el.hidden;
    const sw = d.switch || [];
    el('switch').hidden = !sw.length;
    swBtns.forEach((b, k) => {
      b.el.hidden = k >= sw.length;
      if (k >= sw.length) return;
      b.setLabel(nb(sw[k][1]));
      b.el.setAttribute('aria-pressed', modeOf(d, st) === sw[k][0] ? 'true' : 'false');
    });
    const opts = d.show ? [] : d.opts || [];
    el('picks').hidden = !opts.length;
    el('picks').classList.toggle('long', opts.some((o) => o.length > 8));
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      b.setLabel(nb(opts[k]));
      b.el.setAttribute('aria-label', say(opts[k]));
      b.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });

    el('acts').hidden = !!d.show;
    checkBtn.el.hidden = right;
    const fb = el('fb');
    fb.hidden = !!d.show;
    fb.className = 'fb' + (right ? ' right' : st.res === 'wrong' ? ' wrong' : '');
    write(fb, d.show ? '' : right ? 'That\'s it.' : st.res === 'wrong' ? hintFor(i, st) : st.res === 'empty' ? PICK : '');

    const why = el('why');
    why.hidden = d.show || !st.why;
    write(why, d.show ? '' : d.why);
    whyBtn.setLabel(st.why ? 'Hide why' : 'Why?');

    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !right);
    nextBtn.setLabel(i === STEPS.length - 1 ? 'Finish' : 'Continue');
    nav.hidden = backBtn.el.hidden && nextBtn.el.hidden;
  });

  // ---------- known answers, worked out by hand ----------
  const DO = STEPS.map((d, i) => i).filter((i) => !STEPS[i].show);
  const pickRight = (i, v) => isRight(i, Object.assign(blank(), { pick: v }));
  const solvedSt = (i) => ({ pick: STEPS[i].want, res: 'right' });
  const wrongSt = (i, o) => ({ pick: o, res: 'wrong' });
  const close = (a, b, tol) => Math.abs(a - b) <= (tol == null ? 1e-9 * Math.max(1, Math.abs(a), Math.abs(b)) : tol);
  const idx = (name) => STEPS.findIndex((d) => d.name === name);
  // A step painted in the state given (finished, or at t seconds into its motion): what it drew.
  function drawn(i, st, t) {
    const keepS = S[i], keepT = TM;
    S[i] = Object.assign(blank(), st); TM = t == null ? Infinity : t;
    try { paint(i); return REC; } finally { S[i] = keepS; TM = keepT; paint(); }
  }
  const SWITCHED = [['Step size', CAP_HS], ['Too big a step', BIG_HS], ['A tank', TANK_HS]];

  K.check('Every step of every walk drawn heads along the rule\'s slope at its start, each step of a walk is the same length in time, and every slope arrow matches the rule where it is drawn', () => {
    let n = 0;
    for (const [name, list] of SWITCHED) {
      const i = idx(name);
      for (const h of list) {
        const r = drawn(i, { mode: String(h) }), w = r.walks.find((x) => x.cls === 'walk');
        if (!w || !close(w.h, h, 1e-12)) return false;
        for (let k = 1; k < w.pts.length; k++) {
          const a = w.pts[k - 1], b = w.pts[k];
          if (!close(b[0] - a[0], h, 1e-9) || !close((b[1] - a[1]) / (b[0] - a[0]), w.rate(a[0], a[1]), 1e-9)) return false;
          n++;
        }
        const rate = GRIDS[STEPS[i].grid].rate;
        if (!r.arrows.every((x) => close(x.s, rate(x.t, x.v), 1e-9))) return false;
      }
    }
    const t3 = drawn(idx('The drift'), {}).ticks;
    return n > 150 && t3.length === 4 && t3.every((x, k) => close(x.s, capRate(0, x.v)) && (k === 0 || Math.abs(x.s) < Math.abs(t3[k - 1].s)));
  });
  K.check('A smaller h would result in a better approximation, and a larger h in a worse one: the drift at one second shrinks with every smaller step size, and each halving of the tank\'s step moves its level at four minutes less than the halving before', () => {
    const d = CAP_HS.map(driftAt1);
    const capOk = d.every((x, k) => x > 0 && (k === 0 || x < d[k - 1]));
    const t = TANK_HS.map(tankAt4), moves = t.slice(1).map((x, k) => Math.abs(x - t[k]));
    const tankOk = moves.every((m, k) => k === 0 || m < moves[k - 1]);
    const i5 = idx('Step size');
    const br = CAP_HS.map((h) => drawn(i5, { mode: String(h) }).bars[0]);
    return capOk && tankOk && br.every((b, k) => !!b && close(b.size, d[k], 1e-12));
  }, { source: SWAR });
  K.check('Every worked number is right: 6 and 3 V after 0.5 s steps, 4.41 V exact and 1.41 V of drift at 1 s; 9 and 6.75 V after 0.25 s steps against 7.28 V; the log 0, 3.00, 3.80, 4.18 and 4.30 V with drifts 4.41, 1.41, 0.62, 0.23 and 0.11 V, 0.06 V for the quartered slip and 5% low at 0.1 s; 12, −6, 3, −1.5 and 0.75 V with 1.5 s steps, 12, −12, 12 and −12 V with 2 s steps, 0 V after one 1 s step, 2.68 V exact at 1.5 s and an 18 V fall; the tank steady at 2.25 m, 0.89, 0.79, 0.75 and 0.73 m at 4 min, 1.1 m after one step from 1 m, 1.3 m for the slip and 0.77 m for the average; the coil 48 and 38.4 A a second, 0.48 and 0.864 A, 0.96 A for the slip, 0.791 A exact, τ 0.05 s, steady 2.4 A, and 3.6, 1.8 and 2.7 A with 0.075 s steps', () => {
    const w05 = capWalk(0.5, 1), w025 = capWalk(0.25, 0.5);
    const cap = close(TAU, 1) && close(capRate(0, V0), -12) && close(w05[1][1], 6) && close(w05[2][1], 3) && close(capRate(0, 6), -6) && close(w05[1][1] + H1 * capRate(0, V0), 0) &&
      f2(capExact(1)) === '4.41' && f2(driftAt1(0.5)) === '1.41' && close(w025[1][1], 9) && close(w025[2][1], 6.75) && f2(capExact(0.5)) === '7.28';
    const rows = CAP_HS.map((h) => f2z(capAt1(h))).join(' ') === '0 3.00 3.80 4.18 4.30' && CAP_HS.map((h) => f2z(driftAt1(h))).join(' ') === '4.41 1.41 0.62 0.23 0.11' &&
      f2(driftAt1(0.1) / 4) === '0.06' && Math.round(100 * driftAt1(0.1) / capExact(1)) === 5;
    const big = capWalk(1.5, 6).map((p) => f2(p[1])).join(' ') === '12 −6 3 −1.5 0.75' && capWalk(2, 6).map((p) => f2(p[1])).join(' ') === '12 −12 12 −12' &&
      capWalk(1, 6).slice(1).every((p) => p[1] === 0) && close(1 - 1.5 / TAU, -0.5) && close(1 - 2 / TAU, -1) && f2(capExact(1.5)) === '2.68' && close(-1.5 * capRate(0, V0), 18);
    const tank = close(H_SS, 2.25) && TANK_HS.map((h) => f2(tankAt4(h))).join(' ') === '0.89 0.79 0.75 0.73' && close(euler(tankRate, 1, 1, 1)[1][1], 1.1) &&
      close(tankRate(0, 1), 0.1) && close(1 + QIN, 1.3) && f2((Number(f2(tankAt4(1))) + Number(f2(tankAt4(0.5)))) / 2) === '0.77';
    const cw = coilWalk(0.01, 0.02), cb = coilWalk(0.075, 0.225);
    const coil = close(CTAU, 0.05) && close(CSS, 2.4) && close(coilRate(0, 0), 48) && close(cw[1][1], 0.48) && close(coilRate(0, 0.48), 38.4) && close(CR * 0.48, 4.8) &&
      close(0.01 * 38.4, 0.384) && close(cw[2][1], 0.864) && close(0.02 * coilRate(0, 0), 0.96) && f3(coilExact(0.02)) === '0.791' && cb.map((p) => f2(p[1])).join(' ') === '0 3.6 1.8 2.7' &&
      close(1 - 0.075 / CTAU, -0.5);
    const t2 = drawn(idx('The next step'), solvedSt(idx('The next step'))).texts, t11 = drawn(idx('The coil, stepped'), solvedSt(idx('The coil, stepped'))).texts;
    return cap && rows && big && tank && coil && t2.indexOf('6 + 0.5 × (−6) = 3 V') >= 0 && t11.indexOf('0.48 + 0.01 × 38.4 = 0.864 A') >= 0;
  });
  K.check('The capacitor\'s walks never rise above the exact curve, the coil\'s two small steps run above its curve, the exact curves never cross their steady lines, and only the 1.5 s and 2 s walks swing below 0 V', () => {
    const below = CAP_HS.every((h) => capWalk(h).every(([t, v]) => v <= capExact(t) + 1e-12 && v >= 0));
    const above = coilWalk(0.01, 0.02).slice(1).every(([t, i]) => i > coilExact(t));
    const never = K.linspace(0, 6, 61).every((t) => capExact(t) > 0) && K.linspace(0, 0.3, 61).every((t) => coilExact(t) < CSS);
    const swings = (h) => capWalk(h, 6).some((p) => p[1] < 0);
    return below && above && never && swings(1.5) && swings(2) && !swings(1);
  });
  K.check('The log lists the value at 1 s and its drift for each step size tried, beside the exact 4.41 V; the halving puzzle shows the 0.05 s row only once it is answered; the tank\'s log lists its level at 4 min for each step tried', () => {
    const i5 = idx('Step size'), i6 = idx('Halve the step'), i9 = idx('A tank');
    const r0 = drawn(i5, {}).log, rAll = drawn(i5, { log: ['1', '0.5', '0.25', '0.1', '0.05'], mode: '0.05' }).log;
    const a = drawn(i6, {}).log, b = drawn(i6, solvedSt(i6)).log;
    const tk = drawn(i9, { log: ['2', '1', '0.5', '0.25'], mode: '0.25' }).log;
    return r0.length === 2 && r0[1][1] === '3.00 V' && r0[1][2] === 'drift 1.41 V' && rAll.length === 6 && rAll.map((x) => x[1]).join('|') === '4.41 V|0 V|3.00 V|3.80 V|4.18 V|4.30 V' &&
      a.length === 5 && !a.some((x) => x[0].indexOf('0.05') === 0) && b.length === 6 && b[5][2] === 'drift 0.11 V' &&
      tk.map((x) => x[1]).join('|') === '0.89 m|0.79 m|0.75 m|0.73 m';
  });
  K.check('Each puzzle accepts only its answer, draws it when it is checked, and draws every wrong pick as a mistake', () =>
    DO.every((i) => {
      const d = STEPS[i];
      return d.opts.length === 3 && d.opts.indexOf(d.want) >= 0 && d.opts.every((o) => pickRight(i, o) === (o === d.want)) &&
        drawn(i, solvedSt(i)).answer && d.opts.filter((o) => o !== d.want).every((o) => drawn(i, wrongSt(i, o)).bad > 0);
    }));
  K.check('Before Check, no puzzle\'s picture shows its answer or a mistake', () => DO.every((i) => { const r = drawn(i, {}); return !r.answer && r.bad === 0; }));
  K.check('Every demonstration has finished arriving within 4.5 s of its screen opening, none starting before the 0.35 s screen fade ends; every answer\'s motion, right or wrong, finishes within 2 s', () => {
    const keepT = TM;
    const timed = (i, st, limit) => {
      const keepS = S[i];
      TM = Infinity; latest = 0; earliest = Infinity;
      S[i] = Object.assign(blank(), st);
      try { paint(i); } finally { S[i] = keepS; }
      return latest <= limit + 1e-9;
    };
    const ok = STEPS.every((d, i) => {
      if (d.show) {
        const modes = d.switch ? d.switch.map((o) => o[0]) : [null];
        return d.dur <= 4.5 && d.dur >= 3 && modes.every((m) => timed(i, { mode: m }, d.dur) && earliest >= FADE);
      }
      return timed(i, solvedSt(i), FB) && d.opts.filter((o) => o !== d.want).every((o) => timed(i, wrongSt(i, o), FB));
    });
    TM = keepT; paint();
    return ok;
  });

  K.ready();
</script>
