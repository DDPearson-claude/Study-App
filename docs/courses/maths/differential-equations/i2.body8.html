<p class="caption">Every curve, slope and reading is worked out from the rule on its screen.</p>

<script>
  // ---------- the rules ----------
  // A capacitor C discharging through R: C dv/dt = −v ÷ R, so dv/dt = −v ÷ RC, solved by
  // v = A e^(−t/RC). R in kΩ times C in µF, over 1000, gives RC in seconds.
  const V0 = 12, R0 = 20, C0 = 100;
  const RS = [10, 20, 30, 40], CS = [50, 75, 100, 125, 150];
  const tauOf = (R, C) => R * C / 1000;
  const decay = (A, tau) => (t) => A * Math.exp(-t / tau);
  const growth = (A, tau) => (t) => A * Math.exp(t / tau);
  const ruleDecay = (tau) => (v) => -v / tau;
  const ruleGrow = (tau) => (v) => v / tau;
  const TAU = tauOf(R0, C0);                       // 2 s
  const capV = decay(V0, TAU);                     // v = 12 e^(−t/2)
  const tAtV = (v) => TAU * Math.log(V0 / v);      // when that curve reaches v
  // The other examples: growth from 1 with τ = 2 s; 9 V with τ = 3 s; y = 5 e^(−2t);
  // a 0.5 H coil with 2.4 A through 10 Ω; growth from 100 with τ = 5 s.
  const GROW0 = 1, GROW_TAU = 2;
  const A9 = 9, TAU9 = 3;
  const Y5 = 5, K5 = -2;
  const L_COIL = 0.5, R_COIL = 10, I_COIL = 2.4;
  const Y13 = 100, TAU13 = 5;
  const E1 = Math.exp(-1);                         // the share kept in each time constant
  const W4 = 6;                                    // where the puzzle's window starts, a place screen 3 never shows
  const RLEN = 50, ROFF = 5;                       // the rate arrows on screens 1 and 3: long, and set just off the curve

  // Sources the checks restate (the lesson's own).
  const OPENSTAX = 'https://openstax.org/books/college-physics-2e/pages/23-10-rl-circuits';
  const LUMEN = 'https://courses.lumenlearning.com/suny-physics/chapter/23-10-rl-circuits';
  const NEWCASTLE = 'https://www.mas.ncl.ac.uk/ask/numeracy-maths-statistics/images/First_order_odes.pdf';

  // ---------- numbers, written the lesson's way ----------
  const strip = (s) => (s.indexOf('.') >= 0 ? s.replace(/0+$/, '').replace(/\.$/, '') : s);
  function fmtD(v, dp) {
    const m = Math.pow(10, dp), r = Math.round(v * m) / m;
    if (r === 0) return '0';
    return (r < 0 ? '−' : '') + strip(Math.abs(r).toFixed(dp));
  }
  const fmtV = (v) => fmtD(v, 2);
  const fmt3 = (v) => fmtD(v, 3);
  const sgn = (v) => (Math.round(v * 100) > 0 ? '+' : '') + fmtV(v);
  const rateText = (v, tau) => 'at ' + fmtV(v) + ' V: −' + fmtV(v) + ' ÷ ' + fmtV(tau) + ' = ' + fmtV(ruleDecay(tau)(v)) + ' V a second';
  const plain = (s) => String(s == null ? '' : s).replace(/`/g, '').replace(/\^\(([^)]*)\)/g, '^($1)');
  // As a screen reader says it.
  const say = (s) => plain(s).replace(/d([A-Za-z])\/d([A-Za-z])/g, 'd $1 by d $2').replace(/e\^\(([^)]*)\)/g, 'e to the power $1')
    .replace(/kΩ/g, ' kilohms').replace(/Ω/g, ' ohms').replace(/µF/g, ' microfarads').replace(/τ/g, ' tau ').replace(/λ/g, ' lambda ')
    .replace(/÷/g, ' divided by ').replace(/×/g, ' times ').replace(/=/g, ' equals ').replace(/\+/g, ' plus ').replace(/−/g, ' minus ')
    .replace(/\s+/g, ' ').trim();

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // grid: which plot ('cap' 0-10 s and 0-12 V, 'grow', 'five', 'coil', 'g13', or 'eq' for lines of
  // working with no plot); grip: what a drag on the plot moves ('win' the window, 'rider' the rider);
  // reads: the three readings under the drawing; work: lines of working under the plot; key: the
  // key's items; draw(st): the picture in that step's state. A SHOW step's timetable is in its
  // draw, in seconds from when the screen opens.
  const PICK = 'Tap one of the answers.';
  const FB = 2.0;   // how long the motion after an answer plays
  const STEPS = [
    { show: true, name: 'A rate in proportion', grid: 'cap', key: ['rate'], work: 2, dur: 3.2,
      text: 'A capacitor `C`, charged to 12 V, discharges through a resistor `R`. The current leaving it is `v ÷ R`. You know `i = C dv/dt`. That current drains it, so `C dv/dt = −v ÷ R`. The rule is `dv/dt = −v ÷ RC`. Here `RC` is 20 kΩ × 100 µF, which is 2 s. At 12 V the voltage falls 6 V a second. At 6 V it falls 3 V a second. The rate is *in proportion to what is left*.',
      draw(st) {
        circuit('rc', 1);
        curve(capV, 0, 10, 'sol', 1, 'main');
        part(vis(0.6), 0, () => dot(0, V0));
        arrowFrom(0, V0, ruleDecay(TAU)(V0), 'pa', arr(0.6), RLEN, ROFF);
        part(vis(1.8), 0, () => dot(tAtV(6), 6));
        arrowFrom(tAtV(6), 6, ruleDecay(TAU)(6), 'pa', arr(1.8), RLEN, ROFF);
        workLines([{ s: rateText(V0, TAU), a: vis(1.2) }, { s: rateText(6, TAU), a: vis(2.4) }]);
        said.push('Rate arrows at 12 volts and 6 volts. The arrow at 6 volts is half as steep in volts a second.');
      } },
    { kind: 'pick', name: 'The rate at 3 V', grid: 'cap', key: (st) => (st.res === 'right' || st.res === 'wrong' ? ['rate'] : []), work: 1,
      task: 'The voltage has fallen to 3 V. What is its rate there, in V a second?',
      opts: ['−6', '−1.5', '+1.5'], want: '−1.5',
      why: 'The rule takes the voltage over `RC`, with a minus sign. So the rate is −3 ÷ 2 = −1.5 V a second. The voltage still falls, but more gently than at 12 V.',
      hint: 'Not quite. Use the rule, `−v ÷ RC`.',
      hints: { '−6': 'Not quite. Divide by `RC`, do not multiply.', '+1.5': 'Not quite. The capacitor is losing charge, so keep the minus sign.' },
      draw(st) {
        const r = RW(st), t3 = tAtV(3);
        circuit('rc', 1);
        curve(capV, 0, 10, 'sol', 1, 'main');
        line('mk', PL, G.y(3), G.x(t3), G.y(3));
        dot(t3, 3);
        label(G.x(t3) + 10, G.y(3) - 10, '3 V', 'lab', 'start');
        if (r.ok) {
          REC.answer = true;
          arrowFrom(t3, 3, ruleDecay(TAU)(3), 'pa', arr(0.1));
          workLines([{ s: rateText(3, TAU), a: vis(0.5) }]);
        } else if (r.w === '−6') {
          arrowFrom(t3, 3, -3 * TAU, 'pa bad', arr(0.1)); REC.bad++;
          workLines([{ s: '−' + fmtV(3) + ' × ' + fmtV(TAU) + ' = ' + fmtV(-3 * TAU) + ', with `RC` turned upside down', bad: true, a: vis(0.4) }]);
        } else if (r.w) {
          arrowFrom(t3, 3, 3 / TAU, 'pa bad', arr(0.1)); REC.bad++;
          workLines([{ s: sgn(3 / TAU) + ' would make the voltage rise', bad: true, a: vis(0.4) }]);
        }
      } },
    { show: true, name: 'Equal times, equal fractions', switch: true, grip: 'win', reads: true, key: ['win', 'rate'], dur: 3.6,
      winW: () => 1,
      text: 'A window 1 s wide slides along the curve. Its start and end voltages both fall as it goes. Yet end ÷ start stays at 0.607. From 12 V it ends at 7.28 V. From 2.68 V it ends at 1.62 V. The rate is always the same share of the voltage. So each second keeps the same share. Switch to growth, `dy/dt = +y ÷ 2`, and each second multiplies by 1.649 instead. That is `e^(1/2)`, so every 2 s multiplies by e. Drag the window to try it.',
      read: 'A window 1 s wide slides along the curve. Its start and end voltages both fall as it goes. Yet end ÷ start stays at 0.607. From 12 V it ends at 7.28 V. From 2.68 V it ends at 1.62 V. The rate is always the same share of the voltage. So each second keeps the same share. Under growth, `dy/dt = +y ÷ 2`, each second multiplies by 1.649 instead. That is `e^(1/2)`, so every 2 s multiplies by e.',
      draw(st) {
        const grow = st.mode === 'grow';
        const f = grow ? growth(GROW0, GROW_TAU) : capV, rf = grow ? ruleGrow(GROW_TAU) : ruleDecay(TAU);
        if (!grow) circuit('rc', 1);
        curve(f, G.g.t0, G.g.t1, 'sol', 1, 'main');
        const last = grow ? 2 : 3;
        const t0 = st.win != null ? st.win : last * arr(1.2, 2.2);
        windowAt(f, rf, t0, 1, vis(0.5), { arrows: true });
      } },
    { kind: 'pick', name: 'A window at 3 s', grid: 'cap', reads: true, hideReads: true, key: ['win', 'rate'],
      task: 'The window now starts at 6 s, where the curve is lower and flatter. What does end ÷ start read?',
      opts: ['Smaller, nearer zero', 'The same, 0.607', 'Larger, flatter'], want: 'The same, 0.607',
      why: 'The rate is always the same share of the voltage. So any 1 s window keeps the same share, wherever it sits. From 0.597 V it ends at 0.362 V. That is 0.607 of its start, just as 7.28 V is of 12 V.',
      hint: 'Not quite. Think about the share each second keeps.',
      hints: { 'Smaller, nearer zero': 'Not quite. The drop is smaller here, but so is the start. Compare the share.',
        'Larger, flatter': 'Not quite. The curve is flatter because the voltage is lower. The share kept is the same.' },
      draw(st) {
        const r = RW(st), rf = ruleDecay(TAU);
        circuit('rc', 1);
        curve(capV, 0, 10, 'sol', 1, 'main');
        if (r.ok) {
          REC.answer = true;
          part(vis(0.1), 0, () => ghostWindow(capV, 0, 1));
        }
        const w = windowAt(capV, rf, W4, 1, 1, { arrows: true });
        const lx = G.x(W4), ly = G.y(w.v0) - 30;
        if (r.ok) part(vis(0.6), 4, () => label(lx, ly, 'the same share as the window at 0 s', 'lab main', 'start'));
        else if (r.w) {
          part(vis(0.1), 0, () => ring(W4 + 1, w.v1)); REC.bad++;
          part(vis(0.4), 4, () => label(lx, ly, r.w === 'Larger, flatter' ? 'flatter, but from a lower start' : 'a smaller drop, but from a smaller start', 'lab bad', 'start'));
        }
      } },
    { show: true, name: 'Separate the variables', grid: 'eq', H: 218, dur: 3.6,
      tag: 'Rule: `dv/dt = −v ÷ RC`',
      text: 'To find the curve, *separate the variables*. Divide both sides of the rule by `v`. That gives `(1 ÷ v) dv/dt = −1 ÷ RC`. Now integrate both sides over `t`. The short way to write this is `dv ÷ v = −dt ÷ RC`. Every `v` is on the left and every `t` on the right. It does not mean cancelling the d\'s. Not every rule splits like this, but this one does.',
      draw(st) {
        part(vis(0.4), 4, () => text(170, 46, 'divide by `v`:  `(1 ÷ v) dv/dt = −1 ÷ RC`', 'eq2', 'middle'));
        const F1 = sepLine(EQ_V, 108, arr(0.6, 1.8), 1);
        sideLabels(F1, 108, 'v', vis(2.4));
        part(vis(2.9), 4, () => {
          text(170, 182, 'shorthand for integrating both sides over time', 'nt', 'middle');
          text(170, 206, 'not a cancelling of the d\'s', 'nt', 'middle');
        });
        said.push('Dividing by v gives one over v times d v by d t equals minus one over R C. Written short, the rule d v by d t equals minus v divided by R C becomes d v divided by v equals minus d t divided by R C.');
      } },
    { kind: 'pick', name: 'Separate a decay rule', grid: 'eq', H: 206, mathOpts: true,
      tag: 'Rule: `dN/dt = −λN`',
      task: 'Radioactive atoms follow `dN/dt = −λN`. Here `N` is the number left and `λ` is the decay constant. Which line separates it?',
      opts: ['dN = −λN dt', 'N dN = −λ dt', 'dN ÷ N = −λ dt'], want: 'dN ÷ N = −λ dt',
      why: 'Divide both sides by `N`. Every `N` is then on the left, with `dN`. Only `dt` is on the right, with the constant `−λ`. That gives `dN ÷ N = −λ dt`.',
      hint: 'Not quite. Put every `N` on the left.',
      hints: { 'dN = −λN dt': 'Not quite. `N` is still on the right. Divide by `N` first.', 'N dN = −λ dt': 'Not quite. That multiplies by `N`. Divide by it instead.' },
      draw(st) {
        const r = RW(st);
        tokLine(EQ_N.S, 96, [], 1);
        if (r.ok) {
          REC.answer = true;
          const F1 = sepLine(EQ_N, 150, arr(0.1, 1.2), 1);
          sideLabels(F1, 150, 'N', vis(1.3));
        } else if (r.w) {
          const o = OPT_N[r.w];
          tokLine(o.seq, 150, o.bad, vis(0.1)); REC.bad++;
          part(vis(0.5), 4, () => label(170 - tw(o.say, 'lab') / 2, 190, o.say, 'lab bad', 'start'));
        }
      } },
    { show: true, name: 'Integrate both sides', grid: 'cap', eqs: 2, noCircuit: true, key: ['fam', 'sol12'], dur: 3.6,
      text: 'Now integrate both sides. For a positive `v`, the slope of `ln v` is `1 ÷ v`. So the left side gives `ln v`. The right side gives `−t ÷ RC`. Their two constants join into one `+ c`. Raise e to each side to undo the ln. That gives `v = e^(−t/RC + c)`, which splits into `e^(c) × e^(−t/RC)`. Call `e^(c)` by one letter, `A`. At `t = 0` the curve is at `A`, so `A` is the start. The start at 12 V picks `v = 12 e^(−t/2)`.',
      draw(st) {
        text(12, 50, '`ln v = −t ÷ RC + c`', 'eq2', 'start');
        part(vis(0.6), 4, () => text(12, 80, 'so `v = A e^(−t/RC)`', 'eq2', 'start'));
        [3, 6, 9].forEach((A, k) => {
          const a0 = 1.2 + 0.3 * k;
          dot(0, A, 'fam');
          curve(decay(A, TAU), 0, 10, 'fam', arr(a0, 1.0), 'f' + A);
        });
        dot(0, V0);
        curve(capV, 0, 10, 'sol', arr(2.1, 1.0), 'main');
        part(vis(2.9), 4, () => label(G.x(1.5) + 8, G.y(capV(1.5)) - 10, '`v = 12 e^(−t/2)`', 'lab main', 'start'));
        said.push('Curves for starts of 3, 6, 9 and 12 volts, all with the same time constant.');
      } },

      if (p.length === 2 && p[0] === 'd' && p !== 'RC') { put(parent, 'd', svg); itNode(parent, p[1], svg); }

      let at = 0, m;

  // An arrow along slope s (in the plot's units) from a point, grown to a fraction of its length.

  // A stretch of time as a thin band along the time axis.

  // The window: its band along the time axis, a bar up to the curve at each end, the rule's rate

  function windowAt(f, rf, t0, w, a, o) {

  // The same window drawn muted where it began, for comparison.

  // ---------- touching the plot ----------
  // A drag on the plot moves the window or the rider; a drag on a slider sets R or C.
  const mkGrip = () => { const g = ui.appendChild(K.svg('rect', { class: 'grip', x: 0, y: 0, width: 0, height: 0, tabindex: -1 })); g.style.display = 'none'; return g; };
  const GR = { plot: mkGrip(), R: mkGrip(), C: mkGrip() };
  function setGrip(g, mode, box, aria) {
    g.style.display = mode ? '' : 'none';
    g.setAttribute('tabindex', mode ? '0' : '-1');
    if (!mode) { delete g.dataset.mode; return; }
    g.dataset.mode = mode;
    ['x', 'y', 'width', 'height'].forEach((a, k) => g.setAttribute(a, r2(box[k])));
    g.setAttribute('role', 'slider');
    Object.keys(aria).forEach((k) => g.setAttribute(k, aria[k]));
  }
  function placeGrips(d, st) {
    const live = !finished;
    const pm = live && d.grip ? d.grip : null;
    let aria = {};
    if (pm === 'win') { const w = d.winW(st), t0 = REC.win ? REC.win.t0 : 0; aria = { 'aria-label': 'The window', 'aria-valuemin': 0, 'aria-valuemax': r2(G.g.t1 - w), 'aria-valuenow': r2(t0), 'aria-valuetext': 'starts at ' + fmtV(t0) + ' seconds' }; }
    if (pm === 'rider') { const t = REC.rider ? REC.rider.t : 0; aria = { 'aria-label': 'The rider', 'aria-valuemin': 0, 'aria-valuemax': 9.5, 'aria-valuenow': r2(t), 'aria-valuetext': 'at ' + fmtV(t) + ' seconds' }; }
    setGrip(GR.plot, pm, [PL - 12, G.PT - 10, PR - PL + 24, PH + 20], aria);
    const sl = live && d.sliders;
    setGrip(GR.R, sl ? 'R' : null, [SX0 - 22, ROW_R - 21, SX1 - SX0 + 40, 42],
      { 'aria-label': 'Resistance R', 'aria-valuemin': 10, 'aria-valuemax': 40, 'aria-valuenow': Rof(st), 'aria-valuetext': Rof(st) + ' kilohms' });
    setGrip(GR.C, sl ? 'C' : null, [SX0 - 22, ROW_C - 21, SX1 - SX0 + 40, 42],
      { 'aria-label': 'Capacitance C', 'aria-valuemin': 50, 'aria-valuemax': 150, 'aria-valuenow': Cof(st), 'aria-valuetext': Cof(st) + ' microfarads' });
  }
  function svgPoint(e) {
    const ctm = svg.getScreenCTM();
    if (!ctm) return null;
    return new DOMPoint(e.clientX, e.clientY).matrixTransform(ctm.inverse());
  }
  function setState(fn) {
    const st = S[at()], was = anim.playing();
    const before = JSON.stringify([st.win, st.rider, st.R, st.C]);
    fn(st);
    settle();
    if (JSON.stringify([st.win, st.rider, st.R, st.C]) === before) { if (was) paint(); return; }
    K.refresh();
  }
  const tenth = (v) => Math.round(v * 10) / 10;
  function gripTo(mode, q) {
    const i = at(), d = STEPS[i], geo = geoOf(d, S[i]);
    const frac = K.clamp((q.x - SX0) / (SX1 - SX0), 0, 1);
    setState((st) => {
      if (mode === 'win') { const w = d.winW(st); st.win = K.clamp(tenth(geo.t(q.x) - w / 2), 0, tenth(geo.g.t1 - w)); }
      else if (mode === 'rider') st.rider = K.clamp(tenth(geo.t(q.x)), 0, 9.5);
      else if (mode === 'R') st.R = RS[Math.round(frac * (RS.length - 1))];
      else if (mode === 'C') st.C = CS[Math.round(frac * (CS.length - 1))];
    });
  }
  function gripKey(mode, by) {
    const i = at(), d = STEPS[i], geo = geoOf(d, S[i]);
    setState((st) => {
      if (mode === 'win') { const w = d.winW(st), now = st.win == null ? (REC.win ? REC.win.t0 : 0) : st.win; st.win = K.clamp(tenth(now + 0.5 * by), 0, tenth(geo.g.t1 - w)); }
      else if (mode === 'rider') { const now = st.rider == null ? (REC.rider ? REC.rider.t : 0) : st.rider; st.rider = K.clamp(tenth(now + 0.5 * by), 0, 9.5); }
      else if (mode === 'R') st.R = RS[K.clamp(RS.indexOf(Rof(st)) + by, 0, RS.length - 1)];
      else if (mode === 'C') st.C = CS[K.clamp(CS.indexOf(Cof(st)) + by, 0, CS.length - 1)];
    });
  }
  let held = null;
  Object.keys(GR).forEach((key) => {
    const g = GR[key];
    g.addEventListener('pointerdown', (e) => {
      if (!g.dataset.mode) return;
      held = { id: e.pointerId, g };
      try { g.setPointerCapture(e.pointerId); } catch (err) { /* the drag still follows the pointer while it stays on the grip */ }
      e.preventDefault();
      const q = svgPoint(e);
      if (q) gripTo(g.dataset.mode, q);
    });
    g.addEventListener('pointermove', (e) => {
      if (!held || held.id !== e.pointerId || held.g !== g || !g.dataset.mode) return;
      const q = svgPoint(e);
      if (q) gripTo(g.dataset.mode, q);
    });
    const letGo = (e) => { if (held && held.id === e.pointerId) held = null; };
    g.addEventListener('pointerup', letGo);
    g.addEventListener('pointercancel', letGo);
    g.addEventListener('lostpointercapture', () => { held = null; });
    g.addEventListener('keydown', (e) => {
      const by = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1 }[e.key];
      if (by == null || !g.dataset.mode) return;
      e.preventDefault();
      gripKey(g.dataset.mode, by);
    });
  });

  // ---------- the readings under the drawing ----------
  const RV = [0, 1, 2].map((k) => document.getElementById('rv' + k));
  function setReads(d, st) {
    const box = document.getElementById('reads');
    if (!d.reads || !REC.win) { box.hidden = true; return; }
    box.hidden = false;
    const hide = d.hideReads && st.res !== 'right', u = G.kind === 'grow' ? '' : ' V', w = REC.win;
    const fr = (v) => (Math.abs(v) < 1 ? fmt3(v) : fmtV(v));
    RV[0].textContent = hide ? '?' : fr(w.v0) + u;
    RV[1].textContent = hide ? '?' : fr(w.v1) + u;
    RV[2].textContent = hide ? '?' : fmt3(w.ratio);
    K.fade(box, w.a);
  }

  // The scene for a step (the animation calls this every frame).
  function paint(i) {
    if (i == null) i = at();
    const d = STEPS[i], st = S[i];
    G = geoOf(d, st);
    art.textContent = ''; topG.textContent = '';
    into = null; curA = 1; placed = []; said = [];
    REC = { arrows: [], curves: [], texts: [], bad: 0, answer: false, win: null, tan: null, rider: null, sep: null };
    svg.setAttribute('viewBox', '0 0 340 ' + G.H);
    tags(d, st);
    if (G.g) axes(d, st);
    d.draw(st);
    if (G.g) keyRow((typeof d.key === 'function' ? d.key(st) : d.key) || []);
    placeGrips(d, st);
    setReads(d, st);
    svg.setAttribute('aria-label', said.join(' '));
  }

  const el = (id) => document.getElementById(id);
  write(el('finish'), FINISH);
  function labelButton(b, s, asMaths) {
    b.setLabel(s);
    b.el.textContent = '';
    const sp = b.el.appendChild(K.el('span'));   // one span, so the button's gap does not split "v = 9 e^(−t/3)"
    if (asMaths) maths(sp, s, false); else sp.textContent = s;
    b.el.setAttribute('aria-label', say(s));
  }
  K.update((p) => {
    const i = Math.round(p.step), d = STEPS[i], st = S[i];
    if (!anim.playing()) TM = Infinity;   // motion that was stopped (the page hidden, a test) shows finished
    if (i !== lastStep) {
      lastStep = i; enter('stepbox');
      if (d.show) play(d.dur); else { anim.pause(); TM = Infinity; }
    }
    if (finished !== lastDone) { lastDone = finished; enter(finished ? 'done' : 'stepbox'); }
    const right = st.res === 'right';
    el('stepbox').hidden = finished;
    el('done').hidden = !finished;
    el('count').textContent = 'Step ' + (i + 1) + ' of ' + STEPS.length;
    const task = el('task');
    task.className = 'task' + (d.show ? ' show' : '');
    write(task, d.show ? d.text : d.task);
    paint(i);

    replayBtn.el.hidden = !d.show || REDUCE;
    el('replay').hidden = replayBtn.el.hidden;
    el('switch').hidden = !d.switch;
    swBtns.forEach((o) => o.b.el.setAttribute('aria-pressed', d.switch && (st.mode || 'decay') === o.v ? 'true' : 'false'));
    const opts = d.show ? [] : d.opts || [];
    el('picks').hidden = !opts.length;
    el('picks').classList.toggle('long', opts.some((o) => o.length > 6));
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      labelButton(b, opts[k], !!d.mathOpts);
      b.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });

    el('acts').hidden = !!d.show;
    checkBtn.el.hidden = right;
    const fb = el('fb');
    fb.hidden = !!d.show;
    fb.className = 'fb' + (right ? ' right' : st.res === 'wrong' ? ' wrong' : '');
    write(fb, d.show ? '' : right ? 'That\'s it.' : st.res === 'wrong' ? hintFor(i, st) : st.res === 'empty' ? PICK : '');

    const why = el('why');
    why.hidden = d.show || !st.why;
    write(why, d.show ? '' : d.why);
    whyBtn.setLabel(st.why ? 'Hide why' : 'Why?');

    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !right);
    nextBtn.setLabel(i === STEPS.length - 1 ? 'Finish' : 'Continue');
    nav.hidden = backBtn.el.hidden && nextBtn.el.hidden;
  });

  // ---------- known answers, worked out by hand ----------
  const DO = STEPS.map((d, i) => i).filter((i) => !STEPS[i].show);
  const pickRight = (i, v) => isRight(i, Object.assign(blank(), { pick: v }));
  const solvedSt = (i) => ({ pick: STEPS[i].want, res: 'right' });
  const wrongSt = (i, o) => ({ pick: o, res: 'wrong' });
  const close = (a, b, tol) => Math.abs(a - b) <= (tol == null ? 1e-9 * Math.max(1, Math.abs(a), Math.abs(b)) : tol);
  const idx = (name) => STEPS.findIndex((d) => d.name === name);
  // A step painted in the state given (finished, or at t seconds into its motion): what it drew.
  function drawn(i, st, t) {
    const keepS = S[i], keepT = TM;
    S[i] = Object.assign(blank(), st); TM = t == null ? Infinity : t;
    try { paint(i); return REC; } finally { S[i] = keepS; TM = keepT; paint(); }
  }

  K.check('In each successive time constant the value falls to 0.368 of the preceding value, so 0.632 of the remainder goes: a window one RC wide reads 0.368 for every R and C on the sliders, wherever it sits, and the line at its starting rate reaches zero exactly at its end', () => {
    const i = idx('The time constant');
    let n = 0;
    for (const R of RS) for (const C of CS) {
      const tau = tauOf(R, C);
      for (const s of [0, 0.5, 10 - tau]) {
        const r = drawn(i, { R, C, win: s });
        if (!r.win || !close(r.win.w, tau) || !close(r.win.ratio, E1) || fmt3(r.win.ratio) !== '0.368' || !close(1 - r.win.ratio, 0.632, 5e-4)) return false;
        if (!r.tan || !close(r.tan.zero, r.win.t0 + r.win.w) || !close(r.tan.slope, ruleDecay(tau)(r.win.v0))) return false;
        n++;
      }
    }
    return n === 60;
  }, { source: OPENSTAX });
  K.check('Separating puts every term in the dependent variable on one side and every term in the independent variable on the other: the rule becomes dv ÷ v = −dt ÷ RC, and of the three lines for the decay rule only dN ÷ N = −λ dt both separates and keeps the rule', () => {
    const r = drawn(idx('Separate the variables'), {});
    const okV = !!r.sep && r.sep.left.join(' ') === 'dv ÷ v' && r.sep.right.join(' ') === '− dt ÷ RC';
    const separated = (o) => o.left.every((s) => /N|÷/.test(s)) && o.right.every((s) => !/N/.test(s)) && o.right.indexOf('dt') >= 0;
    const keeps = (o) => [1, 50, 1000].every((N) => [0.1, 2].every((lam) => close(o.rate(N, lam), -lam * N)));
    const i = idx('Separate a decay rule'), d = STEPS[i];
    const only = d.opts.every((o) => (separated(OPT_N[o]) && keeps(OPT_N[o])) === (o === d.want));
    const rn = drawn(i, solvedSt(i));
    return okV && only && !!rn.sep && rn.sep.left.join(' ') === 'dN ÷ N' && rn.sep.right.join(' ') === '− λ dt';
  }, { source: NEWCASTLE });
  K.check('The time constant for an RL circuit is L ÷ R: the coil\'s curve is drawn with τ = L ÷ R, and its worked lines give that time and the current one τ later', () => {
    const i = idx('A coil lets go'), r = drawn(i, solvedSt(i)), c = r.curves.find((x) => x.id === 'ans'), tau = L_COIL / R_COIL;
    return close(tau, 0.05) && !!c && close(c.f(0), I_COIL) && close(c.f(tau), I_COIL * E1) &&
      r.texts.indexOf('τ = L ÷ R = 0.5 ÷ 10 = 0.05 s') >= 0 && r.texts.indexOf('one τ keeps 0.368: 2.4 × 0.368 = 0.883 A') >= 0;
  }, { source: LUMEN });
  K.check('Equal times, equal fractions: a 1 s window reads 0.607 wherever it sits on the decay curve while both its voltages fall, its end arrow is shallower than its start arrow by that same share, and on the growth curve it reads 1.649 wherever it sits', () => {
    const i = idx('Equal times, equal fractions');
    let prev = null;
    for (let s = 0; s <= 9 + 1e-9; s += 0.5) {
      const r = drawn(i, { win: s }), w = r.win, ar = r.arrows.filter((a) => a.cls === 'pa');
      if (!w || !close(w.ratio, Math.exp(-0.5)) || fmt3(w.ratio) !== '0.607') return false;
      if (ar.length !== 2 || !close(ar[1].s / ar[0].s, w.ratio)) return false;
      if (prev && !(w.v0 < prev.v0 && w.v1 < prev.v1)) return false;
      prev = w;
    }
    for (let s = 0; s <= 3 + 1e-9; s += 0.5) {
      const w = drawn(i, { mode: 'grow', win: s }).win;
      if (!w || !close(w.ratio, Math.exp(0.5)) || fmt3(w.ratio) !== '1.649') return false;
    }
    const w0 = drawn(i, { win: 0 }).win, w3 = drawn(i, {}).win;
    return fmtV(w0.v0) === '12' && fmtV(w0.v1) === '7.28' && close(w3.t0, 3) && fmtV(w3.v0) === '2.68' && fmtV(w3.v1) === '1.62';
  });
  K.check('Put back into the rule, v = 12 e^(−t/2) passes: the rider\'s two numbers, the curve\'s own slope and −v ÷ 2, agree at every time from 0 to 9.5 s, and both read −2.21 at 2 s', () => {
    const i = idx('Put it back');
    for (let t = 0; t <= 9.5 + 1e-9; t += 0.5) {
      const r = drawn(i, { rider: t }).rider;
      if (!r || r.a !== r.b || !close(r.slope, r.rule, 1e-6)) return false;
    }
    const r2s = drawn(i, {}).rider;
    return !!r2s && close(r2s.t, 2) && r2s.a === '−2.21' && r2s.b === '−2.21';
  });
  K.check('By this rule the voltage never quite reaches zero: for every RC from 0.5 s to 6 s the curve stays above 0 V all the way to 10 s, falling at every step', () =>
    RS.every((R) => CS.every((C) => {
      const f = decay(V0, tauOf(R, C)), ts = K.linspace(0, 10, 201);
      return ts.every((t, k) => f(t) > 0 && (k === 0 || f(t) < f(ts[k - 1])));
    })));
  K.check('Every worked number is right: RC is 2 s, and 0.5 to 6 s on the sliders; the rates are −6 at 12 V, −3 at 6 V and −1.5 at 3 V, with the slips −6 and +1.5; the curve is at 4.41 V at 2 s, where the tangent from 12 V reaches zero; y = 5 e^(−2t) starts at a slope of −10 with τ = 0.5 s; the coil keeps 0.883 A, the slip 1.52 A; growth from 100 reaches about 272, the slips 200 and 36.8', () => {
    const rcs = [];
    RS.forEach((R) => CS.forEach((C) => rcs.push(tauOf(R, C))));
    const nums = close(TAU, 2) && close(Math.min(...rcs), 0.5) && close(Math.max(...rcs), 6) &&
      fmtV(ruleDecay(TAU)(12)) === '−6' && fmtV(ruleDecay(TAU)(6)) === '−3' && fmtV(ruleDecay(TAU)(3)) === '−1.5' &&
      fmtV(-3 * TAU) === '−6' && sgn(3 / TAU) === '+1.5' && fmtV(capV(2)) === '4.41' &&
      fmtV(K5 * Y5) === '−10' && fmtV(-1 / K5) === '0.5' &&
      fmt3(I_COIL * E1) === '0.883' && fmtV(I_COIL * (1 - E1)) === '1.52' &&
      fmtD(growth(Y13, TAU13)(5), 0) === '272' && fmtD(Y13 + ruleGrow(TAU13)(Y13) * 5, 0) === '200' && fmtD(Y13 * E1, 1) === '36.8';
    const t0 = drawn(idx('A rate in proportion'), {}).texts, i1 = idx('The rate at 3 V'), t1 = drawn(i1, solvedSt(i1)).texts;
    const tc = drawn(idx('The time constant'), {});
    return nums && t0.indexOf('at 12 V: −12 ÷ 2 = −6 V a second') >= 0 && t0.indexOf('at 6 V: −6 ÷ 2 = −3 V a second') >= 0 &&
      t1.indexOf('at 3 V: −3 ÷ 2 = −1.5 V a second') >= 0 && !!tc.tan && close(tc.tan.zero, 2) && close(tc.tan.slope, -6) && fmtV(tc.win.v1) === '4.41';
  });
  K.check('Each puzzle accepts only its answer, draws it when it is checked, and draws every wrong pick as a mistake', () =>
    DO.every((i) => {
      const d = STEPS[i];
      return d.opts.length === 3 && d.opts.indexOf(d.want) >= 0 && d.opts.every((o) => pickRight(i, o) === (o === d.want)) &&
        drawn(i, solvedSt(i)).answer && d.opts.filter((o) => o !== d.want).every((o) => drawn(i, wrongSt(i, o)).bad > 0);
    }));
  K.check('Before Check, no puzzle\'s picture shows its answer or a mistake, and the window\'s readings at 6 s stay hidden', () => {
    const ok = DO.every((i) => { const r = drawn(i, {}); return !r.answer && r.bad === 0; });
    drawn(idx('A window at 3 s'), {});
    const hidden = RV.every((x) => x.textContent === '?');
    paint();
    return ok && hidden;
  });
  K.check('Every demonstration has finished arriving within 4.5 s of its screen opening, none starting before the 0.35 s screen fade ends; every answer\'s motion, right or wrong, finishes within 2 s', () => {
    const keepT = TM;
    const timed = (i, st, limit) => {
      const keepS = S[i];
      TM = Infinity; latest = 0; earliest = Infinity;
      S[i] = Object.assign(blank(), st);
      try { paint(i); } finally { S[i] = keepS; }
      return latest <= limit + 1e-9;
    };
    const ok = STEPS.every((d, i) => {
      if (d.show) {
        const r = timed(i, {}, d.dur) && d.dur <= 4.5 && d.dur >= 3 && earliest >= FADE;
        const sw = !d.switch || (timed(i, { mode: 'grow' }, d.dur) && earliest >= FADE);
        return r && sw;
      }
      return timed(i, solvedSt(i), FB) && d.opts.filter((o) => o !== d.want).every((o) => timed(i, wrongSt(i, o), FB));
    });
    TM = keepT; paint();
    return ok;
  });

  K.ready();
</script>
