<p class="caption">Every trace, arrow and bar is worked out from the rule on its screen.</p>

<script>
  // ---------- the rule ----------
  // A mass on a spring with a damper: m x″ + c x′ + k x = 0. A coil, resistor and capacitor in one
  // loop: L q″ + R q′ + q ÷ C = 0. Same equation, with L for m, R for c and 1 ÷ C for k.
  const M0 = 1, C0 = 0.5, K0 = 4, X0 = 0.5, PUSH = -1, I0 = 0.8, TEND = 10;
  const CAP0 = Math.round(1e6 / K0) / 1e6;   // 0.25 F, so 1 ÷ C = 4
  const Q0 = 0.5, VC0 = Q0 / CAP0;           // 0.5 C on 0.25 F is 2 V
  const YMIN = -0.6, YMAX = 0.6;
  const T5 = 0.5, T8 = 1, TLOW = 4.75, TQ = 1.4;   // the marked moment, the hidden bar's moment, the bottom of a swing, the 'which way' moment
  const S10 = { L: 2, R: 3, C: 0.5 };        // screen 11's loop
  const S11 = { m: 2, k: 8, c: 0.6 };        // screen 12's spring, from 2 x″ = −8 x − 0.6 x′
  const ILL = 'https://courses.physics.illinois.edu/phys401/fa2018/Files/RLC/E5_TransientsInRLC_20120125_v2.pdf';

  // The exact solution of m x″ + c x′ + k x = 0 from x(0) = x0, x′(0) = v0: its height, speed and acceleration.
  function solve(m, c, k, x0, v0) {
    const al = c / (2 * m), dd = k / m - al * al;
    if (dd > 1e-12) {
      const w = Math.sqrt(dd), A = x0, B = (v0 + al * A) / w, P = B * w - al * A, Q = -A * w - al * B;
      const E = (t) => Math.exp(-al * t);
      return { w, swings: true,
        x: (t) => E(t) * (A * Math.cos(w * t) + B * Math.sin(w * t)),
        v: (t) => E(t) * (P * Math.cos(w * t) + Q * Math.sin(w * t)),
        a: (t) => E(t) * ((Q * w - al * P) * Math.cos(w * t) + (-P * w - al * Q) * Math.sin(w * t)) };
    }
    // No setting here reaches these: heavy damping creeps back without a swing.
    const r = Math.sqrt(Math.max(0, -dd));
    if (r < 1e-9) {
      const B = v0 + al * x0, E = (t) => Math.exp(-al * t);
      return { w: 0, swings: false, x: (t) => (x0 + B * t) * E(t), v: (t) => (B - al * (x0 + B * t)) * E(t), a: (t) => (-2 * al * B + al * al * (x0 + B * t)) * E(t) };
    }
    const r1 = -al + r, r2 = -al - r, A = (v0 - r2 * x0) / (r1 - r2), B = x0 - A;
    return { w: 0, swings: false, x: (t) => A * Math.exp(r1 * t) + B * Math.exp(r2 * t), v: (t) => r1 * A * Math.exp(r1 * t) + r2 * B * Math.exp(r2 * t),
      a: (t) => r1 * r1 * A * Math.exp(r1 * t) + r2 * r2 * B * Math.exp(r2 * t) };
  }
  const memo = {};
  // The loop's own charge, stepped from its own rule (loopRK4 below) every 0.01 s and joined up.
  const qmemo = {};
  function loopQ(L, R, C) {
    const key = [L, R, C].join('|');
    if (qmemo[key]) return qmemo[key];
    const N = 1000, qs = loopRK4(L, R, C, X0, 0, K.linspace(0, TEND, N + 1), 1e-3);
    return (qmemo[key] = (t) => { const u = K.clamp(t / TEND * N, 0, N), j = Math.min(N - 1, Math.floor(u)); return qs[j] + (qs[j + 1] - qs[j]) * (u - j); });
  }
  function sol(m, c, k, x0, v0) { const key = [m, c, k, x0, v0].join('|'); return memo[key] || (memo[key] = solve(m, c, k, x0, v0)); }
  const SYS = { m: M0, c: C0, k: K0, x0: X0, v0: 0 };      // lifted 0.5 m and let go from rest (or 0.5 C on the capacitor)
  const SYSP = { m: M0, c: C0, k: K0, x0: X0, v0: PUSH };  // the same, with a 1 m/s push downward
  const SYSE = { m: M0, c: C0, k: K0, x0: 0, v0: I0 };     // the loop with an empty capacitor and 0.8 A in the coil
  const solOf = (y) => sol(y.m, y.c, y.k, y.x0, y.v0);
  // The three terms at time t: inertia m x″, loss c x′, store k x (newtons, or volts for the loop).
  const termsAt = (y, t) => { const s = solOf(y); return { I: y.m * s.a(t), Lo: y.c * s.v(t), S: y.k * s.x(t) }; };
  let P = { m: M0, c: C0, k: K0, t: T5 };
  const sysNow = () => ({ m: P.m, c: P.c, k: P.k, x0: X0, v0: 0 });

  // ---------- numbers, written the lesson's way ----------
  const strip = (s) => (s.indexOf('.') >= 0 ? s.replace(/0+$/, '').replace(/\.$/, '') : s);
  function fmtD(v, dp) {
    const m = Math.pow(10, dp), r = Math.round(v * m) / m;
    if (r === 0) return '0';
    return (r < 0 ? '−' : '') + strip(Math.abs(r).toFixed(dp));
  }
  const f2 = (v) => fmtD(v, 2), f3 = (v) => fmtD(v, 3);
  const plain = (s) => String(s == null ? '' : s).replace(/`/g, '').replace(/\*/g, '');
  // As a screen reader says it.
  const say = (s) => plain(s).replace(/″/g, ' double prime').replace(/′/g, ' prime').replace(/N·s\/m/g, ' newton seconds per metre')
    .replace(/N\/m/g, ' newtons per metre').replace(/m\/s²/g, ' metres per second squared').replace(/Ω/g, ' ohms').replace(/÷/g, ' divided by ')
    .replace(/×/g, ' times ').replace(/=/g, ' equals ').replace(/\+/g, ' plus ').replace(/−/g, ' minus ').replace(/·/g, ', ').replace(/\s+/g, ' ').trim();
  const vals = (m, c, k) => '`m` = ' + f2(m) + ' kg · `c` = ' + f2(c) + ' N·s/m · `k` = ' + f2(k) + ' N/m';

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // scene: 'spring' (the mass beside its trace), 'circ' (the loop under its trace), 'both' (the mass
  // beside the trace, the loop under it), 'bars' (the mass, its trace and the three terms), 'pair' (the
  // two side by side over a table matching their terms). rules: the equations under the picture;
  // key: the key's items; work: lines of working under it; draw(st, d): the picture in that state.
  // A SHOW step's timetable is in its draw, in seconds from when the screen opens.
  const PICK = 'Tap one of the answers.';
  const FB = 2.0;   // how long the motion after an answer plays
  const SOFT = 0.6;
  const LEAD_S = 'A 1 kg mass hangs on a 4 N/m spring beside a 0.5 N·s/m damper. Every value is an example.';
  const LEAD_C = 'A 1 H coil, a 0.5 Ω resistor and a 0.25 F capacitor sit in one loop. Every value is an example.';
  const LEAD_B = 'A mass, spring and damper beside a coil, resistor and capacitor in one loop. Every value is an example.';
  const STEPS = [
    { show: true, name: 'The spring', scene: 'spring', rules: ['spring'], key: ['trace', 'rest', 'level'], dur: 4.6, lead: LEAD_S, tag: () => vals(M0, C0, K0),
      text: 'A 1 kg mass hangs on a spring, beside a damper. Its weight is balanced at rest, so only the extra pull counts. It is lifted 0.5 m and let go. Ideally, that pull grows in step with its height `x`. The drag grows in step with its speed. Newton\'s second law gives `m x″ = −k x − c x′`, with *stiffness* `k` and *damping* `c`. All on one side: `m x″ + c x′ + k x = 0`. It is *second-order*, because `x″` is its highest derivative.',
      draw() {
        const s = solOf(SYS), tm = simT(0.9, 3.6), x = s.x(tm);
        restLine();
        if (tm > 0) trace(s.x, 0, tm);
        rider(tm, x);
        springCol(x);
        forces({ pull: -K0 * x, drag: -C0 * s.v(tm), a: vis(0.4) });
        level(tm, x);
        said.push('The mass rises and falls on its spring, level with the newest point of its trace. Each swing is smaller than the last.');
      } },
    { kind: 'pick', name: 'Let go', scene: 'spring', rules: ['spring'], key: ['trace', 'rest'], work: 3, lead: LEAD_S, tag: () => vals(M0, C0, K0),
      task: 'At the moment it is let go, the mass is still. What is its acceleration?',
      opts: ['2 m/s² down', 'none, it is still', '2 m/s² up'], want: '2 m/s² down',
      why: 'It is still, so the damper\'s drag is 0. The net pull of spring and weight is 4 × 0.5 = 2 N, back towards rest. So `m x″` = −2 N. With 1 kg, that makes `x″` = −2 m/s², downward. It speeds up even though its speed is zero.',
      hint: 'Not quite. Work out the net pull at 0.5 m first.',
      hints: { 'none, it is still': 'Not quite. It has no speed yet, but the spring already pulls on it.', '2 m/s² up': 'Not quite. The net pull is back towards rest, which is downward.' },
      draw(st) {
        const r = RW(st), x = X0, pull = -K0 * x, acc = pull / M0;
        restLine();
        rider(0, x);
        const cy = springCol(x);
        forces({ pull, drag: 0, a: 1 });
        if (r.ok) {
          REC.answer = true; REC.acc = acc;
          const g = arr(0.1, 0.5), y0 = cy + MH / 2, y1 = y0 - acc * NPX * g, XA = MX1 + 10;
          part(g, 0, () => { varrow(XA, y0, y1, 'accl'); label(XA + 8, y0 - acc * NPX - 2, '`x″`', 'lab main', 'start', [[XA, y0 - acc * NPX + 16, 'middle']]); });
          workLines([{ s: 'net pull: ' + f2(K0) + ' × ' + f2(x) + ' = ' + f2(-pull) + ' N, towards rest', a: vis(0.3) },
            { s: 'drag: 0, since it is still', a: vis(0.7) },
            { s: f2(M0) + ' × `x″` = ' + f2(pull) + ' N, so `x″` = ' + f2(acc) + ' m/s²', a: vis(1.1) }]);
        } else if (r.w === 'none, it is still') {
          REC.bad++;
          part(vis(0.1), 0, () => add(K.svg('rect', { class: 'ring', x: MX0 - 6, y: r2(cy - MH / 2 - 6), width: MX1 - MX0 + 12, height: MH + 12, rx: 8 })));
          workLines([{ s: 'no speed yet, but the spring still pulls', bad: true, a: vis(0.4) }]);
        } else if (r.w) {
          REC.bad++;
          const y0 = cy - MH / 2, g = arr(0.1, 0.5);
          part(g, 0, () => { varrow(48, y0, y0 - 2 * NPX * g, 'badl'); });
          workLines([{ s: 'the net pull points back towards rest', bad: true, a: vis(0.5) }]);
        }
      } },
    { show: true, name: 'The circuit', scene: 'circ', rules: ['circ'], key: ['trace', 'current'], dur: 4.6, lead: LEAD_C,
      text: 'Now a loop holds a 1 H coil, a 0.5 Ω resistor and a 0.25 F capacitor. The capacitor starts with 0.5 C on it, which is 2 V. The switch closes and current flows. With no supply, the volts round the loop add to zero. The coil drops `L q″`, the resistor `R q′` and the capacitor `q ÷ C`. Here `q′` is the current. So `L q″ + R q′ + q ÷ C = 0`, and the charge traces the same kind of curve.',
      draw() {
        const s = solOf(SYS), sw = arr(0.5, 0.4), tm = simT(0.9, 3.6), q = s.x(tm);
        if (tm > 0) trace(s.x, 0, tm);
        rider(tm, q);
        circuitBand({ q, closed: sw, dots: true, L: M0, R: C0, C: CAP0 });
        said.push('The switch closes. Current flows round the loop, back and forth, and the charge on the capacitor traces a swing that dies away.');
      } },
    { kind: 'pick', name: 'A stiffer spring', scene: 'pair', work: 2, lead: LEAD_B,
      task: 'Which capacitor matches a stiffer spring?',
      opts: ['a smaller C', 'a bigger C', 'the same C, more R'], want: 'a smaller C',
      why: 'In the two rules, `k` sits where `1 ÷ C` sits. A stiffer spring has a bigger `k`, so it needs a bigger `1 ÷ C`. That means a smaller `C`. A smaller capacitor gives more volts for the same charge, so it pushes back harder.',
      hint: 'Not quite. Find the term that sits where `k x` sits.',
      hints: { 'a bigger C': 'Not quite. `k` goes with `1 ÷ C`, not with `C`.', 'the same C, more R': 'Not quite. `R` plays the damper, not the spring.' },
      draw(st) {
        const r = RW(st), K2 = 8, g = r.ok ? arr(0.1, 0.8) : 0;
        if (r.ok) REC.answer = true;
        if (r.w) REC.bad++;
        pairScene({ sw: 2 + 1.4 * g, ph: 20 - 6 * g,
          sv: [{ s: f2(M0) + ' kg' }, { s: f2(C0) + ' N·s/m' }, { s: f2(K0) + ' N/m', s2: f2(K2) + ' N/m', g, hl: g > 0 }],
          cv: [{ s: f2(M0) + ' H' }, { s: f2(C0) + ' Ω', ring: r.w === 'the same C, more R' },
            { s: '`C` = ' + f3(1 / K0) + ' F', s2: '`C` = ' + f3(1 / K2) + ' F', g, hl: g > 0, ring: r.w === 'a bigger C' }] });

  }
  // No line break inside a quantity: a number keeps its unit, and ÷ or × keeps both its sides.

  function svgWords(t, s) {

  }

  // ---------- controls ----------
  const stepper = K.stepper({ id: 'step', label: 'Step', steps: STEPS.map((d) => d.name), value: 0, compact: true, into: '#prog' });
  const nav = document.getElementById('nav');
  const at = () => stepper.get();
  // The side-by-side screen's three sliders, each with two names; the time marker's slider.
  K.control({ id: 'm', label: 'Mass m, and coil L', min: 0.5, max: 2, step: 0.1, value: M0, fmt: (v) => nb(f2(v) + ' kg, ' + f2(v) + ' H'), into: '#sliders' });
  K.control({ id: 'c', label: 'Damping c, and resistor R', min: 0.25, max: 1.25, step: 0.05, value: C0, fmt: (v) => nb(f2(v) + ' N·s/m or Ω'), into: '#sliders' });
  K.control({ id: 'k', label: 'Stiffness k, and 1 ÷ C', min: 1, max: 8, step: 0.5, value: K0, fmt: (v) => nb(f2(v) + ' N/m, ' + f2(v) + ' per F'), into: '#sliders' });

  // Up to three answer buttons; each step fills in its own options. A new choice after a wrong

  const pickBtns = [0, 1, 2].map((k) => K.button({ label: 'Answer ' + (k + 1), secondary: true, into: '#picks', press: () => {
    const i = at(), d = STEPS[i], st = S[i];
    if (finished || d.show || !d.opts || k >= d.opts.length || st.res === 'right') return;
    const was = st.res === 'wrong';

    if (was) { anim.pause(); TM = Infinity; enter('scene'); }
  } }));
  // Check: marks the answer; a right one draws the answer, a wrong one draws the slip.
  const checkBtn = K.button({ label: 'Check', into: '#acts', press: () => {
    const i = at(), d = STEPS[i], st = S[i];
    if (d.show || finished) return;

    st.res = isRight(i, st) ? 'right' : 'wrong';

  } });
  const whyBtn = K.button({ label: 'Why?', secondary: true, into: '#acts', press: () => {
    if (STEPS[at()].show || finished) return;
    const st = S[at()]; st.why = !st.why;
  } });
  // Play again on a demonstration; on the side-by-side screen it is Let go, which releases both.
  const replayBtn = K.button({ label: 'Play again', secondary: true, into: '#replay', press: () => {
    const d = STEPS[at()];
    if (!d.show || finished) return;
    play(d.dur);
  } });
  const backBtn = K.button({ label: 'Back', secondary: true, into: '#nav', press: () => {
    if (finished) { finished = false; return; }

  } });
  const nextBtn = K.button({ label: 'Continue', into: '#nav', press: () => {
    const i = at();

    finished = true;
    if (typeof K.complete === 'function') K.complete();
  } });

  } });

  // One animation plays each demonstration and the motion after an answer; with reduced motion

  } });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !anim.playing() && TM !== Infinity) { TM = Infinity; paint(); } });
  function play(dur) {
    if (REDUCE || testing()) { TM = Infinity; anim.pause(); paint(); return; }
    motionEnd = dur; TM = 0; anim.play();

  function settle() { if (anim.playing()) anim.pause(); TM = Infinity; }
  function enter(id) {

  // ---------- drawing ----------
  const svg = document.getElementById('scene'), art = document.getElementById('art'), topG = document.getElementById('top');

  // The timetable: how far a part due at t0 has arrived, noting it for the timing check.

  function note(t0, d) { if (t0 + d > latest) latest = t0 + d; if (t0 < earliest) earliest = t0; }

  // An even pace from t0 for dur seconds, 0 to 1; and the model's time for a motion that runs then.
  function prog(t0, dur) { note(t0, dur); return K.clamp((TM - t0) / dur, 0, 1); }
  const simT = (t0, dur) => TEND * prog(t0, dur);
  function part(a, rise, draw) {
    if (a <= 0) return;
    const g = add(K.svg('g'));

    into = keep; curA = keepA;
  }
  const r2 = (v) => Math.round(v * 100) / 100;
  // Lines and curves the labels keep clear of, as points every 3 units.
  function addObst(x1, y1, x2, y2) {
    const n = Math.max(1, Math.ceil(Math.hypot(x2 - x1, y2 - y1) / 3));

  const line = (cls, x1, y1, x2, y2) => add(K.svg('line', { class: cls, x1: r2(x1), y1: r2(y1), x2: r2(x2), y2: r2(y2) }));
  function text(x, y, s, cls, anchor) {

  }
  const widths = {};
  function tw(s, cls) {
    const key = cls + '|' + s;

  // A label, painted above the drawing once everything else is down. It takes the first of its

  function placeLabel(q) {
    const w = tw(q.s, q.cls);

    const box = (lx, yv) => ({ x: lx - 2, y: yv - 12, w: w + 4, h: 15 });

  // A word that sits in a fixed place (a title, a part's name), kept clear of the labels.

    const w = tw(s, cls), left = anchor === 'end' ? x - w : anchor === 'middle' ? x - w / 2 : x;
    placed.push({ x: left - 3, y: y - 13, w: w + 6, h: 17 });
    return text(x, y, s, cls, anchor);
  }
  // Arrows: vertical and horizontal, with a head at the far end.
  function varrow(x, y0, y1, cls) {
    const L = y1 - y0;
    if (Math.abs(L) < 3) return;
    const hd = Math.min(7, Math.abs(L) * 0.6), s = Math.sign(L);
    add(K.svg('path', { class: cls, d: 'M' + r2(x) + ' ' + r2(y0) + ' V' + r2(y1) + ' M' + r2(x - hd * 0.7) + ' ' + r2(y1 - s * hd) + ' L' + r2(x) + ' ' + r2(y1) + ' L' + r2(x + hd * 0.7) + ' ' + r2(y1 - s * hd) }));
    addObst(x, y0, x, y1);
  }
  function harrow(y, x0, x1, cls) {
    const L = x1 - x0;

  }
  function dblArrow(x, y0, y1) {

      ' M' + (x - 4) + ' ' + r2(y1 - hd) + ' L' + x + ' ' + r2(y1) + ' L' + (x + 4) + ' ' + r2(y1 - hd) }));

  // The trace: v = f(t) from t0 to t1, as height (or charge) against time.
  function trace(f, t0, t1, cls) {
    if (t1 <= t0 + 1e-9) return null;

    let d = '';
    for (let j = 0; j <= n; j++) {

  }
  // The newest point of a trace.

    REC.heads.push({ t, v, y: G.y(v), cls: cls || '' });
  }
  function restLine() {
    const y = G.y(0);

  // The column: the ceiling, the spring and the damper hung from it, and the mass at height xm.

  function springCol(xm, o) {
    o = o || {};
    const cy = G.y(xm), top = cy - MH / 2;
    add(K.svg('rect', { class: 'ceil', x: 6, y: CEIL - 7, width: 78, height: 7 }));
    line('wall', 6, CEIL, 84, CEIL);
    placed.push({ x: 6, y: CEIL - 8, w: 78, h: 9 });
    // The spring: a zigzag that stretches with the height.

    let d = 'M' + SX + ' ' + CEIL + ' V' + r2(y0);

    addObst(SX - amp, CEIL, SX - amp, top); addObst(SX + amp, CEIL, SX + amp, top);
    // The damper: a cylinder hung from the ceiling, its piston on a rod from the mass.
    add(K.svg('rect', { class: 'dmp', x: DX - 7, y: CEIL, width: 14, height: 24, rx: 2 }));

    addObst(DX - 7, CEIL, DX - 7, CEIL + 24); addObst(DX + 7, CEIL, DX + 7, CEIL + 24); addObst(DX, py, DX, top);

  // The spring's pull and the damper's drag, in newtons (upward positive), as arrows from the mass.

  // The loop: the switch on the left side, the coil and the resistor along the top, the capacitor

  function sign(x, y, plus) {

    if (plus) line('sign', x, y - 3, x, y + 3);
  }
  function circuit(o) {

    const c0 = x0 + 0.13 * W, c1 = x0 + 0.40 * W, rr0 = x0 + 0.58 * W, rr1 = x0 + 0.80 * W;
    const s0 = top + 0.3 * h, s1 = top + 0.78 * h, ph = o.ph || 20;
    const wire = (d) => add(K.svg('path', { class: 'wire', d }));

    wire('M' + x0 + ' ' + r2(s0) + ' V' + top + ' H' + r2(c0));
    wire('M' + r2(c1) + ' ' + top + ' H' + r2(rr0));

    line('plate', xc - 5, bot - ph, xc - 5, bot + ph); line('plate', xc + 5, bot - ph, xc + 5, bot + ph);

    // The charge: + marks on one plate and − marks on the other, one pair for each 0.125 C.
    const nq = Math.min(4, Math.round(Math.abs(o.q) / 0.125)), offs = [-7, 7, -14, 14];
    for (let j = 0; j < nq; j++) { sign(xc - 12, bot + offs[j], o.q > 0); sign(xc + 12, bot + offs[j], o.q < 0); }

    if (o.dots) {

      let tot = 0;
      for (let j = 1; j < Pp.length; j++) { const L = Math.hypot(Pp[j][0] - Pp[j - 1][0], Pp[j][1] - Pp[j - 1][1]); seg.push([Pp[j - 1], Pp[j], tot, L]); tot += L; }
      const off = ((-o.q * DOTK) % SP + SP) % SP;

        const f = (s - sg[2]) / sg[3], x = sg[0][0] + (sg[1][0] - sg[0][0]) * f, y = sg[0][1] + (sg[1][1] - sg[0][1]) * f;
        if (Math.abs(y - top) < 0.5 && ((x > c0 - 5 && x < c1 + 5) || (x > rr0 - 5 && x < rr1 + 5))) continue;

        drawn(i, solvedSt(i)).answer && d.opts.filter((o) => o !== d.want).every((o) => drawn(i, wrongSt(i, o)).bad > 0);
    }));
  K.check('Before Check, no puzzle\'s picture shows its answer or a mistake: the hidden bars read ?, and the matching springs are blank', () =>
    DO.every((i) => { const r = drawn(i, {}); return !r.answer && r.bad === 0; }) &&
    drawn(idx('The hidden bar'), {}).bars.shown.I === null && drawn(idx('The bottom of a swing'), {}).bars.shown.Lo === null &&
    drawn(idx('Match the spring'), {}).cells.slice(0, 3).every((c) => c.s === '?'));
  K.check('Every demonstration has finished arriving within its 3 to 5 s, none starting before the 0.35 s screen fade ends; every answer\'s motion, right or wrong, finishes within 2 s', () => {
    const keepT = TM;
    const timed = (i, st, limit) => {
      const keepS = S[i];
      TM = Infinity; latest = 0; earliest = Infinity;
      S[i] = Object.assign(blank(), st);
      try { paint(i); } finally { S[i] = keepS; }
      return latest <= limit + 1e-9;
    };
    const ok = STEPS.every((d, i) => {
      if (d.show) return d.dur <= 5 && d.dur >= 3 && timed(i, {}, d.dur) && earliest >= FADE;
      return timed(i, solvedSt(i), FB) && d.opts.filter((o) => o !== d.want).every((o) => timed(i, wrongSt(i, o), FB));
    });
    TM = keepT; paint();
    return ok;
  });

  K.ready();
</script>
