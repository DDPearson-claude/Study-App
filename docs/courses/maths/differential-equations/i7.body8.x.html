  .scene .gl { stroke: var(--k-line); stroke-width: 1; }

  .scene .tk { font: 400 13px var(--k-font); fill: var(--k-muted); }
  .scene .ttl { font: 600 13px var(--k-font); fill: var(--k-muted); }
  .scene .tag2 { font: 600 14px var(--k-font); fill: var(--k-ink); }

  .scene .trace.bad { stroke: var(--k-warn); stroke-width: 2; stroke-dasharray: 6 4; }

  .scene .rest { stroke: var(--k-muted); stroke-width: 1.4; stroke-dasharray: 6 5; }
  .scene .lvl { stroke: var(--k-muted); stroke-width: 1.6; stroke-dasharray: 1.5 4; stroke-linecap: round; }

  .scene .hl { stroke: var(--k-ink); stroke-opacity: .5; stroke-width: 1.4; }
  .scene .ceil { fill: url(#hatch); }
  .scene .wall { stroke: var(--k-ink); stroke-width: 2; }
  .scene .spr { fill: none; stroke: var(--k-ink); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .scene .dmp { fill: var(--k-sunk); stroke: var(--k-ink); stroke-width: 1.6; }

  .scene text.mtxt { font: italic 700 13px var(--k-font); fill: var(--k-on-accent2); stroke: none; }
  .scene .parr { fill: none; stroke: var(--k-ink); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  /* The loop, the bars, the ship. */
  .scene .wire { fill: none; stroke: var(--k-ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .scene .res { fill: var(--k-bg); stroke: var(--k-ink); stroke-width: 2; }
  .scene .src { fill: var(--k-bg); stroke: var(--k-ink); stroke-width: 2; }
  .scene .plate { stroke: var(--k-ink); stroke-width: 3.2; stroke-linecap: round; }
  .scene .bar0 { fill: var(--k-fill1); }
  .scene .bar1 { fill: var(--k-accent2); }
  .scene .bar1.bad { fill: var(--k-warn); }
  .scene .barq { fill: none; stroke: var(--k-muted); stroke-width: 1.4; stroke-dasharray: 4 3; }

  /* The readouts: they wrap one to a row when the text is large. */
  .reads { display: flex; flex-wrap: wrap; gap: 8px; }
  .reads .rd { flex: 1 1 auto; min-width: 8rem; background: var(--k-sunk); border-radius: var(--k-r); padding: 8px 10px; }
  .reads .rd .k-label { display: block; text-transform: none; letter-spacing: 0; }
  .reads .rd b { display: block; font-size: 1.15rem; white-space: nowrap; margin-top: 2px; }

  .replay { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 10px; }

  /* The answers wrap to fewer columns when the text is large; longer ones stack one to a row. */
  .picks { display: grid; grid-template-columns: repeat(auto-fit, minmax(6rem, 1fr)); gap: 8px; }
  .picks .k-btn { font-size: 1.15rem; min-height: 56px; white-space: nowrap; padding-inline: 6px; }
  .picks.long { grid-template-columns: 1fr; }
  .picks.long .k-btn { min-height: 48px; font-size: 1.05rem; white-space: normal; }
  .picks .k-btn[aria-pressed="true"] { background: var(--k-accent2); color: var(--k-on-accent2); border-color: var(--k-accent2); }
  .fb { font-weight: 700; min-height: 1.5em; margin-top: 10px; }
  .fb.right { color: var(--k-good); }
  .fb.wrong { color: var(--k-ink); }
  .why { line-height: 1.6; }
  .done { line-height: 1.6; }
  .done strong { color: var(--k-accent2); }

  /* Each new screen settles in softly: its words and picture fade in and rise 4 px. */
  #stepbox.enter, #done.enter, #scene.enter { animation: screen-in .35s ease-out both; }
  @keyframes screen-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  html.k-testing #stepbox.enter, html.k-testing #done.enter, html.k-testing #scene.enter { animation: none; }
  @media (prefers-reduced-motion: reduce) {

<p class="lead" id="lead">A 1&nbsp;kg mass hangs on a 4&nbsp;N/m spring, with a 0.5&nbsp;N·s/m damper. A 1&nbsp;N push swings it. Every value is an example.</p>

<div class="pz" id="pz">

<p class="caption">Every trace, dot, arrow and bar is worked out from the rule on its screen.</p>

<script>
  // ---------- the rule ----------
  // A mass on a spring with a damper, pushed: m x″ + c x′ + k x = F cos ωt. From rest, the answer is
  // the steady swing X cos(ωt − φ), with X = F ÷ √((k − mω²)² + (cω)²), plus the free ringing (the
  // transient) that the start needs. The loop: L q″ + R q′ + q ÷ C = V cos ωt, the same rule.
  const M = 1, KS = 4, F0 = 1, C0 = 0.5, CMAX = 6, W0 = 1, WMIN = 0.25, WMAX = 4, T1 = 30, YL = 1.2;
  const WN = Math.sqrt(KS / M), TAU = 2 * M / C0, CC = 2 * Math.sqrt(M * KS), CH = Math.sqrt(2 * M * KS);
  const C6 = 6, W2 = 2, W4 = 4;
  const LH = 1, RL = 0.5, CL = 1 / KS, VS = 1;                       // the loop: coil, resistor, capacitor, supply
  const EV = 10, EW = 1000, EL = 100 / 1000, EC = 10 / 1e6, ER = 40;   // the worked example's loop
  const KEEL = 1;                                                     // the ship sketch: damping with keels, twice the bare 0.5
  const PUSHPX = 30;                                                  // the push arrow on the mass: 30 units a newton
  const ALLW = K.linspace(WMIN, WMAX, 16).map((v) => Math.round(v * 4) / 4);
  const SLIDEC = K.linspace(C0, CMAX, 12).map((v) => Math.round(v * 2) / 2);
  const SRC_USNA = 'https://usna.edu/NAOE/_files/documents/Courses/EN400/02.08%20Chapter%208.pdf';
  const SRC_OS = 'https://openstax.org/books/university-physics-volume-2/pages/15-5-resonance-in-an-ac-circuit';

  const amp = (w, c) => F0 / Math.hypot(KS - M * w * w, (c == null ? C0 : c) * w);
  const lag = (w, c) => Math.atan2((c == null ? C0 : c) * w, KS - M * w * w);
  // The top of the hill: it exists only while c² is below 2mk.
  function peak(c) {
    const d = KS / M - c * c / (2 * M * M);
    if (d <= 1e-12) return null;
    const w = Math.sqrt(d);
    return { w, X: amp(w, c) };
  }
  // The free motion from x0, v0 (no push): two real roots, one twice, or a ringing pair.
  function free(c, x0, v0) {
    const d = c * c - 4 * M * KS, E = Math.exp;
    if (d < -1e-12) {
      const a = -c / (2 * M), b = Math.sqrt(-d) / (2 * M), A = x0, B = (v0 - a * x0) / b, R = Math.hypot(A, B);
      return { a, b, x: (t) => E(a * t) * (A * Math.cos(b * t) + B * Math.sin(b * t)),
        v: (t) => E(a * t) * ((a * A + b * B) * Math.cos(b * t) + (a * B - b * A) * Math.sin(b * t)), env: (t) => R * E(a * t) };
    }
    if (d <= 1e-12) {
      const r = -c / (2 * M), B = v0 - r * x0;
      return { a: r, b: 0, x: (t) => (x0 + B * t) * E(r * t), v: (t) => (B + r * (x0 + B * t)) * E(r * t), env: (t) => (Math.abs(x0) + Math.abs(B) * t) * E(r * t) };
    }
    const s = Math.sqrt(d), r1 = (-c + s) / (2 * M), r2 = (-c - s) / (2 * M), A = (v0 - r2 * x0) / (r1 - r2), B = x0 - A;
    return { a: r1, b: 0, x: (t) => A * E(r1 * t) + B * E(r2 * t), v: (t) => r1 * A * E(r1 * t) + r2 * B * E(r2 * t), env: (t) => Math.abs(A) * E(r1 * t) + Math.abs(B) * E(r2 * t) };
  }
  // Pushed at ω from x0, v0: the steady swing plus the transient. Its envelope is X plus the transient's.
  const SOL = {};
  function forced(w, c, x0, v0) {
    c = c == null ? C0 : c; x0 = x0 || 0; v0 = v0 || 0;
    const key = w + '|' + c + '|' + x0 + '|' + v0;
    if (SOL[key]) return SOL[key];
    const X = amp(w, c), ph = lag(w, c);
    const xp = (t) => X * Math.cos(w * t - ph), vp = (t) => -X * w * Math.sin(w * t - ph);
    const h = free(c, x0 - xp(0), v0 - vp(0));
    return (SOL[key] = { w, c, X, ph, xp, h, x: (t) => xp(t) + h.x(t), v: (t) => vp(t) + h.v(t), env: (t) => X + h.env(t) });
  }
  const pushAt = (w, t) => F0 * Math.cos(w * t);
  // The last peak of the steady swing inside the trace's 30 s.
  function lastPeak(s) { const n = Math.floor((s.w * T1 - s.ph) / (2 * Math.PI)); return (s.ph + 2 * Math.PI * n) / s.w; }
  const peakT = (s, n) => (s.ph + 2 * Math.PI * n) / s.w;
  // The worked example's loop: current and capacitor voltage at its supply's rate.
  const exXL = EW * EL, exXC = 1 / (EW * EC), exI = (R) => EV / Math.hypot(R, exXL - exXC), exVC = (R) => exI(R) * exXC;

  let P = { w: W0, c: C0, view: 'spring' };

  // ---------- numbers, written the lesson's way ----------
  const strip = (s) => (s.indexOf('.') >= 0 ? s.replace(/0+$/, '').replace(/\.$/, '') : s);
  function fmtD(v, dp) {
    const m = Math.pow(10, dp), r = Math.round(v * m) / m;
    if (r === 0) return '0';
    return (r < 0 ? '−' : '') + strip(Math.abs(r).toFixed(dp));
  }
  const f1 = (v) => fmtD(v, 1), f2 = (v) => fmtD(v, 2), f3 = (v) => fmtD(v, 3), f4 = (v) => fmtD(v, 4);
  const plain = (s) => String(s == null ? '' : s).replace(/`/g, '').replace(/\*/g, '');
  // As a screen reader says it.
  const say = (s) => plain(s).replace(/e\^\(([^)]*)\)/g, 'e to the power $1').replace(/N·s\/m/g, ' newton seconds per metre').replace(/N\/m/g, ' newtons per metre')
    .replace(/rad\/s/g, ' radians a second').replace(/µF/g, ' microfarads').replace(/mH/g, ' millihenries').replace(/Ω/g, ' ohms').replace(/ω/g, ' omega ')
    .replace(/″/g, ' double prime').replace(/′/g, ' prime').replace(/²/g, ' squared').replace(/√/g, ' root ').replace(/÷/g, ' divided by ').replace(/×/g, ' times ')
    .replace(/=/g, ' equals ').replace(/\+/g, ' plus ').replace(/−/g, ' minus ').replace(/·/g, ', ').replace(/\s+/g, ' ').trim();

  // ---------- words with amber key terms, italic letters and raised powers (K.el, never innerHTML) ----------
  function put(parent, s, svg) {
    if (!s) return;
    if (svg && parent.__lift) { const b = K.svg('tspan', { dy: 6 }); b.textContent = s; parent.appendChild(b); parent.__lift = false; return; }
    parent.appendChild(document.createTextNode(s));
  }
  function itNode(parent, s, svg) {
    const sp = svg ? K.svg('tspan', { class: 'v', 'font-style': 'italic' }) : K.el('span', { class: 'v' });
    if (svg && parent.__lift) { sp.setAttribute('dy', 6); parent.__lift = false; }
    sp.textContent = s;
    parent.appendChild(sp);
  }
  // Inside maths every letter is italic, except the words cos and sin and the letters e and d.
  function ital(parent, s, svg) {
    const re = /cos|sin|[A-Za-zωφ]/g;
    let at = 0, m;
    s = String(s);
    while ((m = re.exec(s))) {
      if (m[0].length > 1 || m[0] === 'e' || m[0] === 'd') continue;
      put(parent, s.slice(at, m.index), svg);
      itNode(parent, m[0], svg);
      at = m.index + 1;
    }
    put(parent, s.slice(at), svg);
  }
  // Maths: italic letters, and e^(…) written as a raised power.
  function maths(parent, s, svg) {
    String(s).split(/\^\(([^)]*)\)/).forEach((p, k) => {
      if (!p) return;
      if (k % 2 === 0) { ital(parent, p, svg); return; }
      const sp = svg ? K.svg('tspan', { class: 'sup', dy: parent.__lift ? 0 : -6 }) : K.el('sup');
      if (svg) parent.__lift = false;
      ital(sp, p, svg);
      parent.appendChild(sp);
      if (svg) parent.__lift = true;
    });
  }
  // No line break inside a quantity: a number keeps its unit, and ÷, × or ± keeps both its sides.
  const UNITS = new RegExp('(\\d) (?=(?:N·s/m|N/m|rad/s|kg|Hz|mH|µF|ms|Ω|H|F|V|A|C|N|m|s)(?![A-Za-z]))', 'g');
  const nb = (s) => String(s == null ? '' : s).replace(UNITS, '$1\u00a0').replace(/(\S) ([÷×±]) (?=\S)/g, '$1\u00a0$2\u00a0');
  function write(el, s) {
    el.textContent = '';
    s = nb(s);
    String(s).split('`').forEach((seg, k) => {
      if (!seg) return;
      if (k % 2) { maths(el.appendChild(K.el('span', { class: 'nw' })), seg, false); return; }
      const re = /\*([^*]+)\*/g;
      let at = 0, m;
      while ((m = re.exec(seg))) {
        if (m.index > at) el.appendChild(document.createTextNode(seg.slice(at, m.index)));
        el.appendChild(K.el('span', { class: 'term' }, m[1]));
        at = m.index + m[0].length;
      }
      if (at < seg.length) el.appendChild(document.createTextNode(seg.slice(at)));
    });
  }
  function svgWords(t, s) {
    t.__lift = false;
    String(nb(s)).split('`').forEach((seg, k) => { if (seg) { if (k % 2) maths(t, seg, true); else put(t, seg, true); } });
  }

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // scene: 'tr' (the mass beside its trace), 'trg' (the trace above the swing-against-rate graph),
  // 'ph' (the forces as arrows end to end), 'hill' (the whole hill), 'loop9' (spring or loop over
  // the hill), 'rlc' (a loop and its voltages), 'alg' (lines of working), 'ship' (a rolling ship's
  // hills). draw(st) paints the step in that state; a SHOW step's timetable is in its draw, in
  // seconds from when the screen opens.
  const PICK = 'Tap one of the answers.';
  const FB = 2.0;      // how long the motion after an answer plays
  const SOFT = 0.6;
  const RUN = 2.6;     // a push-rate move on the main screen: the trace runs, then its dot drops
  const EDROP = 3.8, QDROP = 2.0;
  const LEAD_0 = 'A 1 kg mass hangs on a 4 N/m spring, with a 0.5 N·s/m damper. A 1 N push swings it. Every value is an example.';
  const LEAD_6 = 'The same 1 kg mass and 4 N/m spring, now with a 6 N·s/m damper.';
  const LEAD_C = 'A 10 V supply at 1000 rad/s feeds a 100 mH coil, a 10 µF capacitor and a 40 Ω resistor in series. Every value is an example.';
  const LEAD_U = 'A capacitor discharges through a resistor from 12 V.';
  const LEAD_R = 'Waves that come near a ship\'s own roll rate make it roll hardest. Those rolls can be big enough to capsize it. The sketch uses the same rule, not a real ship\'s numbers.';
  const O1 = ['About 2 rad/s', '1 rad/s', '1.5 rad/s'];
  const O3 = ['0.25 m', '1 m', 'It grows without limit'];
  const O5 = ['About 2 m', '1 m', 'About 0.08 m'];
  const O7 = ['At 2 rad/s, its natural frequency', 'At the slowest push', 'At 4 rad/s'];
  const O9 = ['10 V', '4 V', '25 V'];
  const O10 = ['The start: it does not give 12 V at `t` = 0', 'The units: `RC × t` is in s², but an exponent has no units', 'The end: it does not fall to 0 V'];
  const O11 = ['No resonance at all', 'A smaller peak, though resonance can still occur', 'The same peak, with only the start-up wobble dying sooner'];
  const swingTile = () => [{ l: 'Steady swing `X`', v: f3(amp(P.w)) + ' m' }];
  const STEPS = [

    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !right);
    nextBtn.setLabel(i === STEPS.length - 1 ? 'Finish' : 'Continue');
    nav.hidden = backBtn.el.hidden && nextBtn.el.hidden;
  });

  // ---------- known answers, worked out by hand ----------
  const DO = STEPS.map((d, i) => i).filter((i) => !STEPS[i].show);
  const pickRight = (i, v) => isRight(i, Object.assign(blank(), { pick: v }));
  const solvedSt = (i) => ({ pick: STEPS[i].want, res: 'right' });
  const wrongSt = (i, o) => ({ pick: o, res: 'wrong' });
  const close = (a, b, tol) => Math.abs(a - b) <= (tol == null ? 1e-9 * Math.max(1, Math.abs(a), Math.abs(b)) : tol);
  const idx = (name) => STEPS.findIndex((d) => d.name === name);
  // A step painted in the state given (finished, or t seconds into its motion, with the controls at p).
  function drawn(i, st, t, p, seen, mode) {
    const keepS = S[i], keepT = TM, keepP = P, keepV = VISITED, keepM = RUNMODE;
    S[i] = Object.assign(blank(), st); TM = t == null ? Infinity : t;
    if (p) P = Object.assign({}, P, p);
    if (seen) VISITED = seen;
    if (mode) RUNMODE = mode;
    try { paint(i); return REC; } finally { S[i] = keepS; TM = keepT; P = keepP; VISITED = keepV; RUNMODE = keepM; paint(); }
  }

  K.check('The motion is a steady swing set by the push plus a transient set by the start: from rest, from 0.3 m and from a 1 m/s kick at 1 rad/s the traces differ at first and agree within 0.01 m after 20 s; every trace obeys m x″ + c x′ + k x = F cos ωt; and once settled each swings at the push\'s rate', () => {
    const a = forced(1, C0, 0, 0), b = forced(1, C0, 0.3, 0), c2 = forced(1, C0, 0, 1);
    const differ = Math.abs(a.x(1) - b.x(1)) > 0.05 && Math.abs(a.x(1) - c2.x(1)) > 0.05;
    const agree = K.linspace(20, 30, 101).every((t) => Math.abs(a.x(t) - b.x(t)) < 0.01 && Math.abs(a.x(t) - c2.x(t)) < 0.01);
    const h = 1e-3;
    const obeys = ALLW.every((w) => [C0, 2, CC, C6].every((c) => {
      const s = forced(w, c);
      if (Math.abs(s.x(0)) > 1e-12 || Math.abs(s.v(0)) > 1e-12) return false;
      return K.linspace(0.1, 29.9, 25).every((t) => {
        const x = s.x(t), v = (s.x(t + h) - s.x(t - h)) / (2 * h), acc = (s.x(t + h) - 2 * x + s.x(t - h)) / (h * h);
        return Math.abs(M * acc + c * v + KS * x - F0 * Math.cos(w * t)) < 1e-4 && close(v, s.v(t), 1e-5);
      });
    }));
    const rate = [1, 2, 3, 4].every((w) => {
      const s = forced(w), ups = [];
      for (let t = 20; t < 50 && ups.length < 3; t += 0.002) if (s.x(t) < 0 && s.x(t + 0.002) >= 0) ups.push(t);
      return ups.length === 3 && Math.abs((ups[2] - ups[0]) / 2 - 2 * Math.PI / w) < 0.01 * 2 * Math.PI / w;
    });
    return differ && agree && obeys && rate;
  });
  K.check('A system swings with its largest amplitude when the push\'s frequency equals its natural frequency: with light damping the largest steady swing on the drive slider sits at the natural frequency, the square root of k ÷ m, and the true top of the hill lies within two percent of it', () => {
    const best = ALLW.reduce((a, w) => (amp(w) > amp(a) ? w : a), ALLW[0]), pk = peak(C0);
    return close(best, WN) && close(WN, 2) && Math.abs(pk.w - WN) / WN < 0.02;
  }, { source: SRC_USNA });
  K.check('Resonance can still occur with more damping, but the amplitude at resonance is reduced: each step up in damping, from the lightest to just below where the hill goes, lowers the swing at the natural frequency and the top of the hill, and every one of them still has a top', () => {
    const cs = SLIDEC.filter((c) => c * c < 2 * M * KS);
    return cs.length >= 5 && cs.every((c, k) => peak(c) && (k === 0 || (amp(WN, c) < amp(WN, cs[k - 1]) && peak(c).X < peak(cs[k - 1]).X)));
  }, { source: SRC_USNA });
  K.check('The driven series RLC circuit is the electrical analog of the driven damped spring: the loop, worked out in volts step by step through time from no charge, settles to the same charge swing as the spring\'s steady swing at four push rates', () => {
    const run = (w) => {
      let q = 0, i = 0, t = 0, big = 0;
      const dt = 0.002, T = 60, from = T - 2 * (2 * Math.PI / w);
      const f = (tt, qq, ii) => (VS * Math.cos(w * tt) - RL * ii - qq / CL) / LH;
      while (t < T) {
        const k1q = i, k1i = f(t, q, i);
        const k2q = i + dt / 2 * k1i, k2i = f(t + dt / 2, q + dt / 2 * k1q, i + dt / 2 * k1i);
        const k3q = i + dt / 2 * k2i, k3i = f(t + dt / 2, q + dt / 2 * k2q, i + dt / 2 * k2i);
        const k4q = i + dt * k3i, k4i = f(t + dt, q + dt * k3q, i + dt * k3i);
        q += dt / 6 * (k1q + 2 * k2q + 2 * k3q + k4q); i += dt / 6 * (k1i + 2 * k2i + 2 * k3i + k4i); t += dt;
        if (t >= from) big = Math.max(big, Math.abs(q));
      }
      return big;
    };
    return [0.5, 1, 2, 3].every((w) => Math.abs(run(w) - amp(w)) < 1e-3 * amp(w));
  }, { source: SRC_OS });
  K.check('Every number is right: 0.329 m at 1 rad/s from 9 and 0.25, with arrows 1.32, 0.33 and 0.16 N; 2 rad/s natural, 1 m there with 4, 4 and 1 N; 0.25 m slow, 16 and 0.08 m at 4 rad/s, 12.17; tops 1.01 at 1.97, 0.52 at 1.87, 0.29 at 1.41, the hill gone past 2.83, none at 3, critical 4, 0.24 m at damping 6 from 3.94 and 1.5; a 4 s time constant, 20 s, 0.0067 left; one swing 6.28 s, ringing 1.98; the loop 0.25 F, 1 C, 2 A; the example 1000 rad/s, 159 Hz, 100 Ω each, 1600 and 20000, 0.25 A, 25 V, 2.5, 4 V and 12.5 V', () => {
    const X1 = amp(1), X2 = amp(2), X4 = amp(4);
    const spring = f3(X1) === '0.329' && close(Math.pow(KS - M, 2), 9) && close(Math.pow(C0 * 1, 2), 0.25) &&
      f2(KS * X1) === '1.32' && f2(M * X1) === '0.33' && f2(C0 * X1) === '0.16' &&
      close(WN, 2) && close(X2, 1) && close(KS * X2, 4) && close(M * 4 * X2, 4) && close(C0 * 2 * X2, 1) && close(F0 / (C0 * WN), 1) &&
      f2(amp(WMIN)) === '0.25' && close(F0 / KS, 0.25) && close(M * 16, 16) && f2(X4) === '0.08' && f2(Math.hypot(12, 2)) === '12.17' &&
      f2(peak(0.5).X) === '1.01' && f2(peak(0.5).w) === '1.97' && f2(peak(1).X) === '0.52' && f2(peak(1).w) === '1.87' &&
      f2(peak(2).X) === '0.29' && f2(peak(2).w) === '1.41' && f2(CH) === '2.83' && peak(2.5) && !peak(3) && close(CC, 4) &&
      f2(amp(WMIN, C6)) === '0.24' && f2(KS - M * WMIN * WMIN) === '3.94' && close(C6 * WMIN, 1.5) && close(C6 * C6, 36) && close(2 * M * KS, 8) &&
      close(TAU, 4) && close(5 * TAU, 20) && f4(Math.exp(-5)) === '0.0067' && Math.exp(-5) < 0.01 &&
      f2(2 * Math.PI) === '6.28' && f2(free(C0, 0, 0).b) === '1.98' && close(peakT(forced(1), 4) - peakT(forced(1), 3), 2 * Math.PI);
    const loop = close(CL, 0.25) && close(amp(2), 1) && close(2 * amp(2), 2) && close(VS / RL, 2) &&
      K.linspace(0.01, WMAX, 3991).every((w) => w * amp(w) <= 2 + 1e-12);
    const ex = close(1 / Math.sqrt(EL * EC), 1000, 1e-6) && Math.round(1000 / (2 * Math.PI)) === 159 && close(exXL, 100, 1e-9) && close(exXC, 100, 1e-9) &&
      close(ER * ER, 1600) && close(2 * EL / EC, 20000, 1e-6) && close(exI(ER), 0.25, 1e-9) && close(exVC(ER), 25, 1e-9) && close(exVC(ER) / EV, 2.5, 1e-9) &&
      close(EV * ER / exXC, 4, 1e-9) && close(exVC(80), 12.5, 1e-9);
    return !!(spring && loop && ex);
  });
  K.check('The picture follows the rule: every dot on the main screen sits at the steady swing for its push rate; the mass stays level with the trace\'s newest point; the three force arrows, end to end, always reach the tip of the 1 N push; the hill\'s top mark sits at its largest swing, and from damping 3 up there is no top and the swing only falls', () => {
    const iH = idx('The hill'), iF = idx('Three forces'), iD = idx('Damping');
    const r4 = drawn(iH, {}, null, { w: 2 }, new Set(ALLW));
    const dots = r4.dots.length === ALLW.length && r4.dots.every((p) => close(p.X, amp(p.w)) && close(p.y, r4.G.qy(p.X), 1e-9) && close(p.x, r4.G.qx(p.w), 1e-9));
    const level = [WMIN, 1, 2, 4].every((w) => [0, 0.8, 1.5, 2.5, 3.5, null].every((t) => {
      const rr = drawn(iH, {}, t, { w }, new Set(), 'entry'), hd = rr.heads[rr.heads.length - 1];
      return hd && rr.mass && close(rr.mass.cy, hd.y, 1e-9) && close(rr.level, hd.y, 1e-9) && close(hd.v, forced(w).x(hd.t), 1e-12);
    }));
    const arrowsOk = ALLW.every((w) => {
      const A = drawn(iF, {}, null, { w }).arrows, X = amp(w);
      return A && A.pushEnd && close(Math.hypot(A.kx - A.mx, A.cx), F0, 1e-9) && close(A.pushEnd[0], A.damperEnd[0], 1e-9) && close(A.pushEnd[1], A.damperEnd[1], 1e-9) &&
        close(A.kx, KS * X) && close(A.mx, M * w * w * X) && close(A.cx, C0 * w * X);
    });
    const grid = K.linspace(0, WMAX, 4001);
    const tops = SLIDEC.every((c) => {
      const rr = drawn(iD, {}, null, { c }), mx = Math.max.apply(null, grid.map((w) => amp(w, c)));
      if (c * c < 2 * M * KS) return rr.topMark && rr.topMark.X >= mx - 1e-9 && close(rr.topMark.X, amp(rr.topMark.w, c));
      return !rr.topMark && grid.every((w, k) => k === 0 || amp(w, c) < amp(grid[k - 1], c));
    });
    return dots && level && arrowsOk && tops;
  });
  K.check('Each puzzle accepts only its answer, draws it when it is checked, and draws every wrong pick as a mistake', () =>
    DO.every((i) => {
      const d = STEPS[i];
      return d.opts.length === 3 && d.opts.indexOf(d.want) >= 0 && d.opts.every((o) => pickRight(i, o) === (o === d.want)) &&
        drawn(i, solvedSt(i)).answer && d.opts.filter((o) => o !== d.want).every((o) => drawn(i, wrongSt(i, o)).bad > 0);
    }));
  K.check('Before Check, no puzzle\'s picture shows its answer or a mistake, and no working is drawn', () =>
    DO.every((i) => { const r = drawn(i, {}); return !r.answer && r.bad === 0 && r.work.length === 0; }));
  K.check('Every demonstration has finished arriving within its 3 to 5 s, none starting before the 0.35 s screen fade ends; a push-rate move on the main screen drops its dot within 3 s; every answer\'s motion, right or wrong, finishes within 2 s', () => {
    const keepT = TM;
    const timed = (i, st, limit, mode) => {
      const keepS = S[i], keepM = RUNMODE, keepV = VISITED;
      TM = Infinity; latest = 0; earliest = Infinity;
      S[i] = Object.assign(blank(), st); RUNMODE = mode || 'entry'; VISITED = new Set();
      try { paint(i); } finally { S[i] = keepS; RUNMODE = keepM; VISITED = keepV; }
      return latest <= limit + 1e-9;
    };
    const ok = STEPS.every((d, i) => {
      if (d.show) return d.dur <= 5 && d.dur >= 3 && timed(i, {}, d.dur) && earliest >= FADE && (!d.run || timed(i, {}, 3, 'quick'));
      return timed(i, solvedSt(i), FB) && d.opts.filter((o) => o !== d.want).every((o) => timed(i, wrongSt(i, o), FB));
    });
    TM = keepT; paint();
    return ok;
  });

  K.ready();
</script>
