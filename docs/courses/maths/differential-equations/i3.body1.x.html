<p class="lead">A 24 V supply switches onto a 0.5 H coil and 10 Ω, and the current climbs to a steady line. Every value is an example.</p>

<p class="caption">Every curve, gap and reading is worked out from the rule on its screen.</p>

<script>
  // ---------- the rules ----------
  // A coil L and a resistor R switched onto a supply E: E = L di/dt + R i, so di/dt = (E − R i) ÷ L.
  // Taking R out of the top, di/dt = (E ÷ R − i) ÷ (L ÷ R): the rate is the gap to the steady
  // current E ÷ R, over τ = L ÷ R. So the gap decays, and i = E ÷ R + (i₀ − E ÷ R) e^(−t/τ).
  const E0 = 24, L0 = 0.5, R0 = 10;
  const ES = [6, 12, 18, 24, 30], RS = [10, 15, 20], IS = [0, 0.5, 1, 1.5, 2, 2.5, 3, 3.5, 4];
  const steadyOf = (E, R) => E / R;
  const tauOf = (L, R) => L / R;
  const rateOf = (E, R, L) => (i) => (E - R * i) / L;
  const runOf = (iss, i0, tau) => (t) => iss + (i0 - iss) * Math.exp(-t / tau);
  const ISS = steadyOf(E0, R0), TAU = tauOf(L0, R0), RULE = rateOf(E0, R0, L0), RATE0 = RULE(0);   // 2.4 A, 0.05 s, 48 A a second
  const coilI = runOf(ISS, 0, TAU);                  // i = 2.4 − 2.4 e^(−t/0.05)
  const gapOf = (t) => coilI(t) - ISS;               // the gap, −2.4 e^(−t/0.05)
  const E1 = Math.exp(-1);                           // the share of the gap kept in each τ
  const I_HALF = ISS / 2, T_HALF = TAU * Math.log(2);   // where the current reaches 1.2 A
  const TF = 0.15;                                   // the two-way switch flips halfway through the 0.3 s run
  // A run on the sliders' screen: the supply on throughout, or dropping out at TF, when the loop
  // closes through R and the current dies towards a steady line of 0.
  function runWith(E, R, i0, flip) {
    const tau = tauOf(L0, R), iss = steadyOf(E, R), a = runOf(iss, i0, tau);
    if (!flip) return { tau, iss, i0, f: a, lv: () => iss, tf: null };
    const at = a(TF), b = runOf(0, at, tau);
    return { tau, iss, i0, f: (t) => (t < TF ? a(t) : b(t - TF)), lv: (t) => (t < TF ? iss : 0), tf: TF };
  }
  const E_LOW = 12, ISS_LOW = steadyOf(E_LOW, R0);   // the supply drops to 12 V: a new line at 1.2 A
  const dropI = runOf(ISS_LOW, ISS, TAU);            // i = 1.2 + 1.2 e^(−t/0.05)
  const L_BIG = 1, TAU_BIG = tauOf(L_BIG, R0);       // a 1 H coil: τ = 0.1 s
  const share = (k) => 100 * (1 - Math.exp(-k));     // the share of the way, in %, after k τ
  const N_SS = 1500, N_TAU = 0.2, N_T = 0.4, motorN = runOf(N_SS, 0, N_TAU);   // dn/dt = (1500 − n) ÷ 0.2
  const H_SS = 2, H_TAU = 50, H0 = 3, H_T = 50, tankH = runOf(H_SS, H0, H_TAU);  // dh/dt = (2 − h) ÷ 50
  const SKINS = {
    coil: { name: 'Coil', tau: TAU, ss: ISS, start: 0, unit: 'A' },
    motor: { name: 'Motor', tau: N_TAU, ss: N_SS, start: 0, unit: 'rpm' },
    tank: { name: 'Tank', tau: H_TAU, ss: H_SS, start: H0, unit: 'm' },
  };
  const ROFF = 5;

  // Sources the checks restate (the lesson's own).
  const LUMEN = 'https://courses.lumenlearning.com/suny-physics/chapter/23-10-rl-circuits';
  const OPENSTAX = 'https://openstax.org/books/college-physics-2e/pages/23-10-rl-circuits';
  const LIBRE = 'https://phys.libretexts.org/Bookshelves/University_Physics/Physics_(Boundless)/15%3A_Waves_and_Vibrations/15.4%3A_Damped_and_Driven_Oscillations';

  // ---------- numbers, written the lesson's way ----------
  const strip = (s) => (s.indexOf('.') >= 0 ? s.replace(/0+$/, '').replace(/\.$/, '') : s);
  function fmtD(v, dp) {
    const m = Math.pow(10, dp), r = Math.round(v * m) / m;
    if (r === 0) return '0';
    return (r < 0 ? '−' : '') + strip(Math.abs(r).toFixed(dp));
  }
  const fmtV = (v) => fmtD(v, 2);
  const fmt3 = (v) => fmtD(v, 3);
  const fmtG = (v) => (Math.abs(v) < 1 ? fmt3(v) : fmtV(v));
  const pc = (v) => v.toFixed(1) + '%';
  const plain = (s) => String(s == null ? '' : s).replace(/`/g, '').replace(/\*/g, '');
  // As a screen reader says it.
  const say = (s) => plain(s).replace(/d([A-Za-z])\/d([A-Za-z])/g, 'd $1 by d $2').replace(/e\^\(([^)]*)\)/g, 'e to the power $1')
    .replace(/Ω/g, ' ohms').replace(/τ/g, ' tau ').replace(/÷/g, ' divided by ').replace(/×/g, ' times ').replace(/=/g, ' equals ')
    .replace(/\+/g, ' plus ').replace(/−/g, ' minus ').replace(/%/g, ' per cent').replace(/\s+/g, ' ').trim();

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // grid: which plot ('coil' 0-0.3 s and 0-4 A, 'split' down to −2.5 A, 'skin', 'motor', 'tank');
  // grip: what a drag on the plot moves ('mk' the time marker); sliders: E, R and the start above
  // the plot; switch: the named buttons under the drawing; reads: the readings under it; work: lines
  // of working under the plot; key: the key's items; draw(st): the picture in that step's state. A
  // SHOW step's timetable is in its draw, in seconds from when the screen opens.
  const PICK = 'Tap one of the answers.';
  const FB = 2.0;   // how long the motion after an answer plays
  const SOFT = 0.6;
  const STEPS = [
    { show: true, name: 'Switch on', grid: 'coil', work: 3, key: ['rate'], dur: 3.6,
      text: 'A 24 V supply, a 0.5 H coil and 10 Ω sit in one loop. The switch closes. Round the loop the voltages add up, so `24 = L di/dt + R i`. At first the current is 0, so the coil takes all 24 V. The current climbs at 24 ÷ 0.5 = 48 A a second. As it grows, the resistor takes `10 i` volts. That leaves the coil less, so the climb slows. The curve bends over.',
      draw(st) {
        inset(K.lerp(OPEN, ON, arr(0.4, 0.4)));
        curve(coilI, 0, 0.3, 'sol', 1, 'main');
        dot(0, 0);
        const t = 0.2 * arr(0.9, 2.4), i = coilI(t);
        rideRate(t, i, RULE(i));
        workLines([{ s: 'at 0 A: (24 − 10 × 0) ÷ 0.5 = 48 A a second', a: vis(0.5) }]);
        shareBar(i, vis(0.5));
        said.push('A rider climbs the curve from 0 amps. Its rate arrow starts steep and flattens.');
      } },
    { kind: 'pick', name: 'Where the climb stops', grid: 'coil', work: 1,
      task: 'The climb stops where the rate is zero. What current is that?',
      opts: ['2.4 A', '240 A', '48 A'], want: '2.4 A',
      why: 'The rate is zero when the coil\'s share of the 24 V is zero. Then the resistor takes all of it. So `10 i = 24`, and the current is 24 ÷ 10 = 2.4 A. That is the *steady current*, `E ÷ R`. `L` is not in it.',
      hint: 'Not quite. Give the resistor all 24 V, so `10 i = 24`.',
      hints: { '240 A': 'Not quite. Divide 24 by 10. Do not multiply.', '48 A': 'Not quite. 48 A a second is how fast it climbs at the start. Find where the climb stops.' },
      draw(st) {
        const r = RW(st);
        inset(ON);
        curve(coilI, 0, 0.3, 'sol', 1, 'main');
        dot(0, 0);
        if (r.ok) {
          REC.answer = true;
          part(vis(0.1), 0, () => { steadyLine(ISS); label(120, G.y(ISS) - 8, 'rate zero at 2.4 A', 'lab', 'start'); });
          workLines([{ s: 'rate zero: 24 = 10 `i`, so `i` = 24 ÷ 10 = 2.4 A', a: vis(0.5) }]);
        } else if (r.w === '240 A') {
          REC.bad++;
          part(vis(0.1), 0, () => { arrowUp(G.x(0.03), G.PT + 58, G.PT + 6, 'pa bad'); label(G.x(0.03) + 10, G.PT + 20, '240 A is far above', 'lab bad', 'start'); });
          workLines([{ s: '`10 i = 24` means divide 24 by 10, not multiply', bad: true, a: vis(0.4) }]);
        } else if (r.w) {
          REC.bad++;
          part(vis(0.1), 0, () => { arrowFrom(0, 0, RATE0, 'pa bad', 1, 34, ROFF); label(PL + 14, G.PB - 8, '48 A a second is the rate at the start', 'lab bad', 'start'); });
          workLines([{ s: '48 is a rate, in A a second, not a current', bad: true, a: vis(0.4) }]);
        }
      } },
    { show: true, name: 'The steady line and the gap', grid: 'coil', work: 2, key: ['gap', 'rate'], dur: 3.6,
      text: 'A dashed line marks the steady current, `E ÷ R` = 2.4 A. The shaded strip is the *gap*, the current minus 2.4 A. Below the line it is negative. Take 10 out of the top of the rule, and it reads `di/dt = (2.4 − i) ÷ 0.05`. So the rate is the gap\'s size ÷ 0.05 s. At 0 A the gap is −2.4 A and the rate is 48 A a second. At 1.2 A the gap has halved, and so has the rate.',
      draw(st) {
        inset(ON);
        steadyLine(ISS);
        curve(coilI, 0, 0.3, 'sol', 1, 'main');
        label(120, G.y(ISS) - 8, 'steady `E ÷ R` = 2.4 A', 'lab', 'start');
        gapFill(coilI, () => ISS, 0, 0.3, vis(0.6));
        part(vis(0.6), 0, () => { gapBar(0, 0, ISS); gapBar(T_HALF, I_HALF, ISS); });
        workLines([{ s: '`di/dt = (24 − 10 i) ÷ 0.5 = (2.4 − i) ÷ 0.05`', a: vis(1.2) }, { s: 'at 0 A: (2.4 − 0) ÷ 0.05 = 48 A a second', a: vis(1.8) }]);
        arrowFrom(0, 0, RULE(0), 'pa', arr(1.8, SOFT), 34, ROFF);
        part(vis(1.8), 4, () => label(PL + 14, G.PB - 8, 'gap −2.4 A, the full rate', 'lab', 'start'));
        part(vis(2.4), 0, () => dot(T_HALF, I_HALF));
        arrowFrom(T_HALF, I_HALF, RULE(I_HALF), 'pa', arr(2.4, SOFT), 34, ROFF);
        part(vis(2.4), 4, () => label(G.x(T_HALF) + 10, G.y(I_HALF) + 18, 'gap −1.2 A, half the rate', 'lab', 'start'));
        said.push('Rate arrows at 0 amps and at 1.2 amps. Where the gap has halved, the arrow is half as steep in amps a second.');
      } },
    { kind: 'pick', name: 'The rate at 1.2 A', grid: 'coil', work: 1, key: (st) => (st.res === 'right' || st.res === 'wrong' ? ['gap', 'rate'] : ['gap']),
      task: 'The current has reached 1.2 A. How fast is it climbing there?',
      opts: ['24 A a second', '48 A a second', '1.2 A a second'], want: '24 A a second',
      why: 'The rate is the gap\'s size ÷ 0.05 s. At 1.2 A the gap\'s size is 1.2 A. So the rate is 1.2 ÷ 0.05 = 24 A a second. That is half the starting 48, because the gap has halved.',
      hint: 'Not quite. Divide the gap\'s size by 0.05 s.',
      hints: { '48 A a second': 'Not quite. 48 A a second was the rate at 0 A, with the full gap. The gap is smaller now.', '1.2 A a second': 'Not quite. 1.2 A is the gap itself. Divide it by 0.05 s.' },
      draw(st) {
        const r = RW(st);
        inset(ON);
        steadyLine(ISS);
        curve(coilI, 0, 0.3, 'sol', 1, 'main');
        label(120, G.y(ISS) - 8, 'steady 2.4 A', 'lab', 'start');
        gapFill(coilI, () => ISS, 0, 0.3, 1);
        gapBar(T_HALF, I_HALF, ISS);
        dot(T_HALF, I_HALF);
        if (r.ok) {
          REC.answer = true;
          arrowFrom(T_HALF, I_HALF, RULE(I_HALF), 'pa', arr(0.1, 0.8), 34, ROFF);
          workLines([{ s: '(2.4 − 1.2) ÷ 0.05 = 24 A a second', a: vis(0.5) }]);
        } else if (r.w === '48 A a second') {
          REC.bad++;
          arrowFrom(T_HALF, I_HALF, RATE0, 'pa bad', arr(0.1, 0.8), 34, ROFF);
          workLines([{ s: '48 A a second goes with the full gap of 2.4 A', bad: true, a: vis(0.4) }]);
        } else if (r.w) {
          REC.bad++;
          arrowFrom(T_HALF, I_HALF, 1.2, 'pa bad', arr(0.1, 0.8), 34, ROFF);
          workLines([{ s: '1.2 A is the gap, not yet divided by 0.05 s', bad: true, a: vis(0.4) }]);
        }
        label(G.x(T_HALF) + 10, G.y(I_HALF) + 18, 'at 1.2 A, the gap is −1.2 A', 'lab', 'start');
      } },
    { show: true, name: 'The gap at each τ', grid: 'coil', grip: 'mk', reads: readsMk, key: ['gap', 'tan', 'tau'], dur: 3.6,
      text: 'The marks along the bottom sit one `τ = L ÷ R` = 0.05 s apart. A marker rides the curve with a rate arrow. The arrow flattens as the gap shrinks. At the marks the gap reads −2.4, −0.883, −0.325 and −0.119 A. Each is 0.368 of the one before, so the gap never quite closes. A straight line at the starting rate meets the dashed line at one `τ`. Drag the marker to try any time.',
      read: 'The marks along the bottom sit one `τ = L ÷ R` = 0.05 s apart. A marker rides the curve with a rate arrow. The arrow flattens as the gap shrinks. At the marks the gap reads −2.4, −0.883, −0.325 and −0.119 A. Each is 0.368 of the one before, so the gap never quite closes. A straight line at the starting rate meets the dashed line at one `τ`. Wherever the marker sits, the gap is 0.368 of the gap one `τ` before.',
      draw(st) {

          part(vis(0.5), 4, () => label(G.x(H_T) + 14, G.y(w) - 8, 'keeps 0.632 of the gap', 'lab bad', 'start'));

        }
        label(230, G.y(H_SS) - 8, 'steady 2 m', 'lab', 'start', [[230, G.y(H_SS) + 18, 'start']]);
        label(G.x(H_T) + 6, G.PT + 14, 'after 50 s', 'lab', 'start');
        label(PL + 12, G.y(2.25) + 5, '+1 m', 'lab', 'start', [[PL + 12, G.y(H0) - 10, 'start'], [PL + 12, G.y(2.6) + 5, 'start']]);

  ];
  const FINISH = 'Switched onto a supply, a coil\'s current is the steady value `E ÷ R` plus a gap that dies as `e^(−t/τ)`, with `τ = L ÷ R`. The supply and `R` set the steady value. The start sets the gap.';

  // ---------- the plots ----------
  const PL = 40, PR = 322, PH = 180;
  const SX0 = 104, SX1 = 212, ROWS = { E: 52, R: 94, I: 136 }, SLIDE_H = 118;

  const COIL_TAG = 'Rule: `L di/dt = E − R i`', COIL_VALS = '`E` = 24 V, `L` = 0.5 H, `R` = 10 Ω';
  const TT = [0, 0.05, 0.1, 0.15, 0.2, 0.25, 0.3];
  const GRIDS = {

    split: { t0: 0, t1: 0.3, v0: -2.5, v1: 4, xt: TT, yt: [-2, -1, 0, 1, 2, 3, 4], ytitle: '`i` (A)', xtitle: 'time `t` (s)', tag: COIL_TAG, vals: COIL_VALS, zero: true },
    skin: { t0: 0, t1: 6, v0: 0, v1: 100, xt: [0, 1, 2, 3, 4, 5, 6], yt: [0, 25, 50, 75, 100], ytitle: 'share of the way (%)', xtitle: 'time, in `τ`' },
    motor: { t0: 0, t1: 1, v0: 0, v1: 2000, xt: [0, 0.2, 0.4, 0.6, 0.8, 1], yt: [0, 500, 1000, 1500, 2000], ytitle: '`n` (rpm)', xtitle: 'time `t` (s)',

    tank: { t0: 0, t1: 300, v0: 0, v1: 4, xt: [0, 50, 100, 150, 200, 250, 300], yt: [0, 1, 2, 3, 4], ytitle: '`h` (m)', xtitle: 'time `t` (s)',
      tag: 'Rule: `dh/dt = (2 − h) ÷ 50`' },
  };
  const Eof = (st) => (st.E == null ? E0 : st.E);
  const Rof = (st) => (st.R == null ? R0 : st.R);
  const Iof = (st) => (st.I == null ? 0 : st.I);
  function geoOf(d, st) {
    const g = GRIDS[d.grid];

    const kx = (PR - PL) / (g.t1 - g.t0), ky = PH / (g.v1 - g.v0);

      x: (t) => PL + (t - g.t0) * kx, y: (v) => PB - (v - g.v0) * ky,
      t: (x) => g.t0 + (x - PL) / kx, v: (y) => g.v0 + (PB - y) / ky };
  }

  // ---------- each step's state ----------
  // pick: the answer chosen; res: 'right', 'wrong' or 'empty' once checked; why: the Why? note open;
  // mode: the named switch; mk: where Dan put the time marker; E, R, I: the sliders.
  function blank() { return { pick: null, res: null, why: false, mode: null, mk: null, E: null, R: null, I: null }; }
  const isRight = (i, st) => st.pick != null && st.pick === STEPS[i].want;
  const hintFor = (i, st) => { const d = STEPS[i]; return (d.hints && d.hints[st.pick]) || d.hint; };
  const RW = (st) => ({ ok: st.res === 'right', w: st.res === 'wrong' ? st.pick : null });
  let S = STEPS.map(() => blank());
  let finished = false, lastStep = -1, lastDone = false, TM = Infinity;   // TM: seconds into the current motion
  let motionEnd = 0;
  let REC = null, G = null, said = [], placed = [], obst = [], queue = [];

  // ---------- words with amber key terms, italic letters and raised powers (K.el, never innerHTML) ----------
  const ITAL = /(d[ithn](?![A-Za-z])|(?<![A-Za-z])[EtLRinh](?![A-Za-z]))/;
  function put(parent, s, svg) {
    if (!s) return;
    if (svg && parent.__lift) { const b = K.svg('tspan', { dy: 6 }); b.textContent = s; parent.appendChild(b); parent.__lift = false; return; }
    parent.appendChild(document.createTextNode(s));
  }
  function itNode(parent, s, svg) {
    const sp = svg ? K.svg('tspan', { class: 'v' }) : K.el('span', { class: 'v' });

    sp.textContent = s;
    parent.appendChild(sp);
  }
  function ital(parent, s, svg) {
    String(s).split(ITAL).forEach((p, k) => {
      if (!p) return;

      if (p.length === 2 && p[0] === 'd') { put(parent, 'd', svg); itNode(parent, p[1], svg); }
      else itNode(parent, p, svg);
    });
  }
  // Maths: italic letters, and e^(…) written as a raised power.
  function maths(parent, s, svg) {
    String(s).split(/\^\(([^)]*)\)/).forEach((p, k) => {
      if (!p) return;
      if (k % 2 === 0) { ital(parent, p, svg); return; }
      const sp = svg ? K.svg('tspan', { class: 'sup', dy: -6 }) : K.el('sup');

  }
  // `maths` stays on one line; *a key term* is highlighted.
  function write(el, s) {
    el.textContent = '';

      if (!seg) return;
      if (k % 2) { maths(el.appendChild(K.el('span', { class: 'nw' })), seg, false); return; }

      let at = 0, m;
      while ((m = re.exec(seg))) {
        if (m.index > at) el.appendChild(document.createTextNode(seg.slice(at, m.index)));
        el.appendChild(K.el('span', { class: 'term' }, m[1]));
        at = m.index + m[0].length;

    });
  }
  function svgWords(t, s) {
    t.__lift = false;
    String(s).split('`').forEach((seg, k) => { if (seg) { if (k % 2) maths(t, seg, true); else put(t, seg, true); } });
  }

  // ---------- controls ----------
  const stepper = K.stepper({ id: 'step', label: 'Step', steps: STEPS.map((d) => d.name), value: 0, compact: true, into: '#prog' });
  const nav = document.getElementById('nav');
  const at = () => stepper.get();

  // Up to three answer buttons; each step fills in its own options. A new choice after a wrong
  // answer settles the picture back to the question.
  const pickBtns = [0, 1, 2].map((k) => K.button({ label: 'Answer ' + (k + 1), secondary: true, into: '#picks', press: () => {
    const i = at(), d = STEPS[i], st = S[i];
    if (finished || d.show || !d.opts || k >= d.opts.length || st.res === 'right') return;
    const was = st.res === 'wrong';
    st.pick = d.opts[k]; st.res = null;
    if (was) { anim.pause(); TM = Infinity; enter('scene'); }
  } }));
  // Check: marks the answer; a right one draws the answer, a wrong one draws the slip.
  const checkBtn = K.button({ label: 'Check', into: '#acts', press: () => {
    const i = at(), d = STEPS[i], st = S[i];
    if (d.show || finished) return;
    if (st.pick == null) { st.res = 'empty'; return; }
    st.res = isRight(i, st) ? 'right' : 'wrong';

  } });
  const whyBtn = K.button({ label: 'Why?', secondary: true, into: '#acts', press: () => {
    if (STEPS[at()].show || finished) return;
    const st = S[at()]; st.why = !st.why;
  } });
  const replayBtn = K.button({ label: 'Play again', secondary: true, into: '#replay', press: () => {
    const i = at(), d = STEPS[i], st = S[i];

    st.mk = null;
    play(d.dur);
  } });
  // The named switch under the drawing: Together or Split; Supply on or Flip halfway; Coil, Motor or Tank.
  const modeOf = (d, st) => st.mode || d.mode0;
  const swBtns = [0, 1, 2].map((k) => K.button({ label: 'Option ' + (k + 1), secondary: true, into: '#switch', press: () => {
    const i = at(), d = STEPS[i], st = S[i];
    if (!d.switch || k >= d.switch.length || finished) return;
    const v = d.switch[k][0];
    if (modeOf(d, st) === v) return;
    st.mode = v;

  } }));
  const backBtn = K.button({ label: 'Back', secondary: true, into: '#nav', press: () => {
    if (finished) { finished = false; return; }

  } });
  const nextBtn = K.button({ label: 'Continue', into: '#nav', press: () => {
    const i = at();

  } });

  } });

  // One animation plays each demonstration and the motion after an answer; with reduced motion
  // (and while the self-test looks) everything opens finished.

  } });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !anim.playing() && TM !== Infinity) { TM = Infinity; paint(); } });

  function settle() { if (anim.playing()) anim.pause(); TM = Infinity; }

  }

  // ---------- drawing ----------
  const svg = document.getElementById('scene'), art = document.getElementById('art'), topG = document.getElementById('top'), ui = document.getElementById('ui');
  let into = null, curA = 1;
  const add = (node) => (into || art).appendChild(node);
  // How far a part due at t0 has arrived (K.arrive), noting the timetable for the timing check.
  let latest = 0, earliest = Infinity;
  function arr(t0, d) {

  }

  function part(a, rise, draw) {
    if (a <= 0) return;

    into = keep; curA = keepA;
  }
  const r2 = (v) => Math.round(v * 100) / 100;
  // Lines and curves the labels keep clear of, as points every 3 units.
  function addObst(x1, y1, x2, y2) {

  }
  const line = (cls, x1, y1, x2, y2) => add(K.svg('line', { class: cls, x1: r2(x1), y1: r2(y1), x2: r2(x2), y2: r2(y2) }));
  function text(x, y, s, cls, anchor) {
    const t = K.svg('text', { class: cls, x: r2(x), y: r2(y), 'text-anchor': anchor || 'start' });
    svgWords(t, s);
    return add(t);
  }
  const widths = {};
  function tw(s, cls) {
    const key = cls + '|' + s;
    if (widths[key]) return widths[key];
    const t = svg.appendChild(K.svg('text', { class: cls, x: 0, y: -50 }));
    svgWords(t, s);
    let w = 0;
    try { w = t.getComputedTextLength(); } catch (e) { w = 0; }
    svg.removeChild(t);

  }
  // A label, painted above the drawing once everything else is down. It takes the first of its
  // places that is clear of other words and of the lines and curves; failing that, it moves up or
  // down a line from the first.
  function label(x, y, s, cls, anchor, alts) { queue.push({ x, y, s, cls, anchor, alts: alts || [], a: curA }); }
  function placeLabel(q) {
    const w = tw(q.s, q.cls);
    const leftOf = (xx, an) => K.clamp(an === 'end' ? xx - w : an === 'middle' ? xx - w / 2 : xx, 4, 336 - w);
    const box = (lx, yv) => ({ x: lx - 2, y: yv - 12, w: w + 4, h: 15 });
    const hits = (b) => placed.some((p) => b.x < p.x + p.w && p.x < b.x + b.w && b.y < p.y + p.h && p.y < b.y + b.h) ||
      obst.some((o) => o[0] > b.x && o[0] < b.x + b.w && o[1] > b.y && o[1] < b.y + b.h);

    for (const c of cands) { const lx = leftOf(c[0], c[2] || q.anchor); if (!hits(box(lx, c[1]))) { pos = [lx, c[1]]; break; } }
    if (!pos) {

      pos = [lx, q.y];

    }

    const g = topG.appendChild(K.svg('g'));

  // A word that sits in a fixed place (a title), kept clear of the labels.

  }

  // An arrow along slope s (in the plot's units) from a point, grown to a fraction of its length.
  function dirOf(s) { const dx = G.kx, dy = -s * G.ky, n = Math.hypot(dx, dy); return [dx / n, dy / n]; }
  function arrowD(cx, cy, u, h0, h1, head) {
    const sx = cx + u[0] * h0, sy = cy + u[1] * h0, ex = cx + u[0] * h1, ey = cy + u[1] * h1;
    let d = 'M' + r2(sx) + ' ' + r2(sy) + ' L' + r2(ex) + ' ' + r2(ey);
    if (head > 0) {
      const bx = -u[0] * head, by = -u[1] * head, c = Math.cos(0.45), s = Math.sin(0.45);
      d += ' M' + r2(ex + bx * c - by * s) + ' ' + r2(ey + bx * s + by * c) + ' L' + r2(ex) + ' ' + r2(ey) + ' L' + r2(ex + bx * c + by * s) + ' ' + r2(ey - bx * s + by * c);
    }
    return d;
  }
  function arrowFrom(t, v, s, cls, grow, len, off) {
    if (grow <= 0) return;
    const u = dirOf(s);
    let cx = G.x(t), cy = G.y(v);
    if (off && cx - u[1] * off >= PL + 2 && cy + u[0] * off <= G.PB - 8) { cx -= u[1] * off; cy += u[0] * off; }
    // Kept inside the drawing near its right edge.
    const room = u[0] > 0.05 ? (336 - cx) / u[0] : 999;

  }

  }

  // A curve v = f(t) from ta, grown to a fraction of the way to tb; kept in REC for the checks.
  function curve(f, ta, tb, cls, grow, id) {
    if (grow <= 0) return;
    const te = ta + (tb - ta) * Math.min(1, grow), n = Math.max(2, Math.ceil((te - ta) / (G.g.t1 - G.g.t0) * 160));
    let d = '', pen = false;
    const pts = [];
    for (let k = 0; k <= n; k++) {
      const t = ta + (te - ta) * k / n, v = f(t);
      if (!isFinite(v) || v < G.g.v0 - 1e-9 || v > G.g.v1 + 1e-9) { pen = false; continue; }
      const x = G.x(t), y = G.y(v);
      d += (pen ? ' L' : (d ? ' M' : 'M')) + r2(x) + ' ' + r2(y);
      pen = true;
      pts.push([t, v]);

  }
  // The steady line: dashed, across the plot (or part of it).
  function steadyLine(v, cls, xa, xb) {
    cls = cls || 'ss';

    REC.ss.push({ v, cls });
  }
  // The gap at time t: an amber bar from the curve to the line.
  function gapBar(t, v, lv, cls) {
    const x = Math.max(G.x(t), PL + 3), y1 = G.y(v), y2 = G.y(lv);

  // The shaded strip between a curve and the line it is heading for.

  // A rider on the curve with the rule's rate arrow.
  function rideRate(t, v, s) {
    arrowFrom(t, v, s, 'pa', 1, 34, ROFF);

  }
  // The straight line at the starting rate: from 0 A it meets the steady line one τ later.
  function tangent(grow) {
    REC.tan = { slope: RATE0, meet: ISS / RATE0 };
    if (grow <= 0) return;
    const g = Math.min(1, grow), tm = ISS / RATE0;

  // The supply's 24 V, shared: the resistor's 10 i and the coil's rest.

      const y = G.workY + 14, w = PR - PL, rw = w * r;
      add(K.svg('rect', { class: 'vb r', x: PL, y, width: r2(rw), height: 14 }));
      add(K.svg('rect', { class: 'vb c', x: r2(PL + rw), y, width: r2(w - rw), height: 14 }));
