  /* The loop. */

  /* The readouts: c² − 4mk and the roots. They wrap one to a row when the text is large. */

  .reads .rd b { display: block; font-size: 1.15rem; white-space: nowrap; margin-top: 2px; }

  /* Each new screen settles in softly: its words and picture fade in and rise 4 px. */

<p class="lead" id="lead">A 1&nbsp;kg mass hangs on a 4&nbsp;N/m spring. It is lifted 0.5&nbsp;m and let go at rest. Every value is an example.</p>

<p class="caption">Every dot, trace and arrow is worked out from the rule on its screen.</p>

<script>
  // ---------- the rule ----------
  // A mass on a spring with a damper: m x″ + c x′ + k x = 0. The guess x = e^(rt) turns it into
  // m r² + c r + k = 0, whose two roots set the motion. The loop: L q″ + R q′ + q ÷ C = 0, the same
  // rule with L for m, R for c and 1 ÷ C for k.
  const M = 1, KS = 4, X0 = 0.5, CMAX = 6, TEND = 6;
  const C5 = 5, C6 = 6, CC = 2 * Math.sqrt(M * KS), C3 = 3, C2 = 2;
  const TNOW = 1.6;                          // where the turning arrow stops once its motion has played
  const LH = 100 / 1000, CF = 10 / 1e6, INVC = Math.round(1 / CF), R40 = 40, RC = 2 * Math.sqrt(LH * INVC);
  const TL = 0.025;                          // the loop's trace runs 25 ms
  const TS = 2.5;                            // the sketches: one swing every 2.5 s
  const SRC = 'https://ocw.mit.edu/courses/18-03sc-differential-equations-fall-2011/7e212064ad281d00e1dac893b1f722a7_MIT18_03SCF11_s13_2text.pdf';

  // The roots of m r² + c r + k = 0: two real ones (slow r1, fast r2), one twice, or a pair a ± jb.
  function roots(c, m, k) {
    m = m == null ? M : m; k = k == null ? KS : k;
    const d = c * c - 4 * m * k, tol = 1e-12 * Math.max(1, c * c, 4 * m * k);
    if (d > tol) { const s = Math.sqrt(d); return { d, kind: 'over', r1: (-c + s) / (2 * m), r2: (-c - s) / (2 * m) }; }
    if (d >= -tol) return { d: 0, kind: 'crit', r1: -c / (2 * m), r2: -c / (2 * m) };
    return { d, kind: 'under', a: -c / (2 * m), b: Math.sqrt(-d) / (2 * m) };
  }
  // The exact answer from x(0) = x0, x′(0) = v0, with its speed. For a pair, the turning arrow
  // z(t) = (A − jB) e^((a + jb)t) too: its real part is x, its length the envelope.
  function solve(c, m, k, x0, v0) {
    const R = roots(c, m, k), E = Math.exp;
    if (R.kind === 'over') {
      const r1 = R.r1, r2 = R.r2, A = (v0 - r2 * x0) / (r1 - r2), B = x0 - A;
      return { R, A, B, x: (t) => A * E(r1 * t) + B * E(r2 * t), v: (t) => r1 * A * E(r1 * t) + r2 * B * E(r2 * t),
        slow: (t) => A * E(r1 * t), fast: (t) => B * E(r2 * t) };
    }
    if (R.kind === 'crit') {
      const r = R.r1, B = v0 - r * x0;
      return { R, A: x0, B, x: (t) => (x0 + B * t) * E(r * t), v: (t) => (B + r * (x0 + B * t)) * E(r * t) };
    }
    const a = R.a, b = R.b, A = x0, B = (v0 - a * x0) / b, amp = Math.hypot(A, B);
    return { R, A, B, amp,
      x: (t) => E(a * t) * (A * Math.cos(b * t) + B * Math.sin(b * t)),
      v: (t) => E(a * t) * ((a * A + b * B) * Math.cos(b * t) + (a * B - b * A) * Math.sin(b * t)),
      env: (t) => amp * E(a * t),
      z: (t) => [E(a * t) * (A * Math.cos(b * t) + B * Math.sin(b * t)), E(a * t) * (A * Math.sin(b * t) - B * Math.cos(b * t))] };
  }
  const sol = (c) => solve(c, M, KS, X0, 0);
  const loopSol = (R) => solve(R, LH, INVC, 1, 0);   // the loop from a charged start, no current
  let P = { c: CMAX, arrow: false };

  // ---------- numbers, written the lesson's way ----------
  const strip = (s) => (s.indexOf('.') >= 0 ? s.replace(/0+$/, '').replace(/\.$/, '') : s);
  function fmtD(v, dp) {
    const m = Math.pow(10, dp), r = Math.round(v * m) / m;
    if (r === 0) return '0';
    return (r < 0 ? '−' : '') + strip(Math.abs(r).toFixed(dp));
  }
  const f2 = (v) => fmtD(v, 2), f3 = (v) => fmtD(v, 3);
  const ex = (r) => (Math.abs(r + 1) < 1e-12 ? '−t' : f2(r) + 't');
  function rootsText(R) {
    if (R.kind === 'over') return f2(R.r1) + ' and ' + f2(R.r2);
    if (R.kind === 'crit') return f2(R.r1) + ', twice';
    return Math.abs(R.a) < 1e-12 ? '±j' + f3(R.b) : f2(R.a) + ' ± j' + f3(R.b);
  }
  const cTag = (c) => '`c` = ' + f2(c) + ' N·s/m';
  const plain = (s) => String(s == null ? '' : s).replace(/`/g, '').replace(/\*/g, '');
  // As a screen reader says it.
  const say = (s) => plain(s).replace(/e\^\(([^)]*)\)/g, 'e to the power $1').replace(/kg²\/s²/g, ' kilograms squared per second squared')
    .replace(/N·s\/m/g, ' newton seconds per metre').replace(/N\/m/g, ' newtons per metre').replace(/rad\/s/g, ' radians a second')
    .replace(/µF/g, ' microfarads').replace(/mH/g, ' millihenries').replace(/Ω/g, ' ohms').replace(/″/g, ' double prime').replace(/′/g, ' prime')
    .replace(/²/g, ' squared').replace(/±/g, ' plus or minus ').replace(/√/g, ' root ').replace(/÷/g, ' divided by ').replace(/×/g, ' times ')
    .replace(/=/g, ' equals ').replace(/\+/g, ' plus ').replace(/−/g, ' minus ').replace(/·/g, ', ').replace(/\s+/g, ' ').trim();

  // ---------- words with amber key terms, italic letters and raised powers (K.el, never innerHTML) ----------
  function put(parent, s, svg) {
    if (!s) return;
    if (svg && parent.__lift) { const b = K.svg('tspan', { dy: 6 }); b.textContent = s; parent.appendChild(b); parent.__lift = false; return; }
    parent.appendChild(document.createTextNode(s));
  }
  function itNode(parent, s, svg) {
    const sp = svg ? K.svg('tspan', { class: 'v', 'font-style': 'italic' }) : K.el('span', { class: 'v' });
    if (svg && parent.__lift) { sp.setAttribute('dy', 6); parent.__lift = false; }
    sp.textContent = s;
    parent.appendChild(sp);
  }
  const VARS = /[xrtmckqABLRCαβ]/;
  function ital(parent, s, svg) {
    let buf = '';
    for (const ch of String(s)) {
      if (VARS.test(ch)) { put(parent, buf, svg); buf = ''; itNode(parent, ch, svg); } else buf += ch;
    }
    put(parent, buf, svg);
  }
  // Maths: italic letters, and e^(…) written as a raised power.
  function maths(parent, s, svg) {
    String(s).split(/\^\(([^)]*)\)/).forEach((p, k) => {
      if (!p) return;
      if (k % 2 === 0) { ital(parent, p, svg); return; }
      const sp = svg ? K.svg('tspan', { class: 'sup', dy: parent.__lift ? 0 : -6 }) : K.el('sup');
      if (svg) parent.__lift = false;
      ital(sp, p, svg);
      parent.appendChild(sp);
      if (svg) parent.__lift = true;
    });
  }
  // No line break inside a quantity: a number keeps its unit, and ÷, × or ± keeps both its sides.
  const UNITS = new RegExp('(\\d) (?=(?:kg²/s²|kg|N·s/m|N/m|rad/s|Hz|mH|µF|ms|Ω|H|F|m|s)(?![A-Za-z]))', 'g');
  const nb = (s) => String(s == null ? '' : s).replace(UNITS, '$1 ').replace(/(\S) ([÷×±]) (?=\S)/g, '$1 $2 ');
  function write(el, s) {
    el.textContent = '';
    s = nb(s);
    String(s).split('`').forEach((seg, k) => {
      if (!seg) return;
      if (k % 2) { maths(el.appendChild(K.el('span', { class: 'nw' })), seg, false); return; }
      const re = /\*([^*]+)\*/g;
      let at = 0, m;
      while ((m = re.exec(seg))) {
        if (m.index > at) el.appendChild(document.createTextNode(seg.slice(at, m.index)));
        el.appendChild(K.el('span', { class: 'term' }, m[1]));
        at = m.index + m[0].length;
      }
      if (at < seg.length) el.appendChild(document.createTextNode(seg.slice(at)));
    });
  }
  function svgWords(t, s) {
    t.__lift = false;
    String(nb(s)).split('`').forEach((seg, k) => { if (seg) { if (k % 2) maths(t, seg, true); else put(t, seg, true); } });
  }

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // scene: 'algebra' (lines of working), 'pt' (the roots' plane on the left, the position against
  // time on the right), 'sketch' (two sketched traces), 'loop' (the coil, resistor and capacitor over
  // its charge). draw(st, d) paints the step in that state; a SHOW step's timetable is in its draw,
  // in seconds from when the screen opens.
  const PICK = 'Tap one of the answers.';
  const FB = 2.0;   // how long the motion after an answer plays
  const SOFT = 0.6;
  const LEAD_S = 'A 1 kg mass hangs on a 4 N/m spring. It is lifted 0.5 m and let go at rest. Every value is an example.';
  const LEAD_K = 'Two sketches of a swing dying away, each starting from 0.5 m.';
  const LEAD_C = 'A 100 mH coil, a 10 µF capacitor and a 40 Ω resistor sit in one loop. Every value is an example.';
  const O9 = ['The envelope falls to 0.368 of itself each second, and it rings at 1.732 rad/s', 'The envelope falls to 0.368 each second, and it rings at 1 rad/s', 'It rings at 1.732 rad/s and never dies'];
  const O11 = ['It rings near 980 rad/s inside an `e^(−200t)` envelope', 'It creeps back, with roots −200 and −980', 'It rings at 980 rad/s for ever'];
  const O5 = ['Slower, because the slow root is nearer zero', 'Faster, because more damping stops it sooner', 'The same, because the start is the same'];
  const O7 = ['It has one constant, and the start needs two values', '`e^(−2t)` never reaches zero', 'A repeated root has no answer'];
  const STEPS = [
    { show: true, name: 'The guess', scene: 'algebra', dur: 4.6, lead: LEAD_S,
      text: 'The spring obeys `m x″ + c x′ + k x = 0`. Try the guess that solved decay, `x = e^(rt)`. Each derivative brings out one `r`. Then every term carries `e^(rt)`. That factor is never zero, so it drops out. What is left is `m r² + c r + k = 0`. This is the *characteristic equation*. Its two roots are rates, per second. They decide how the mass moves.',
      draw() { algebra(); } },
    { kind: 'pick', name: 'Find the roots', scene: 'pt', key: ['trace', 'rest'], work: 2, lead: LEAD_S, tag: () => cTag(C5),
      rule: () => '`r² + ' + f2(C5 / M) + 'r + ' + f2(KS / M) + ' = 0`',
      task: 'At damping 5, the characteristic equation is `r² + 5r + 4 = 0`. What are its two roots?',
      opts: ['−1 and −4', '1 and 4', '−2 twice'], want: '−1 and −4',
      why: 'It factorises as `(r + 1)(r + 4) = 0`. So `r` = −1 or `r` = −4. Check one: 1 − 5 + 4 = 0. Both roots are negative, so both parts die away.',
      hint: 'Not quite. Find two numbers that multiply to 4 and add to 5.',
      hints: { '1 and 4': 'Not quite. Put in `r` = 1: 1 + 5 + 4 is 10, not 0. Watch the signs.', '−2 twice': 'Not quite. −2 twice gives `r² + 4r + 4`, with 4r in the middle, not 5r.' },
      draw(st) {
        const r = RW(st), s = sol(C5), R = s.R;
        ptBase('plane');
        trace(s.x, 0, TEND);
        if (r.ok) {
          REC.answer = true;
          part(vis(0.2), 0, () => { dotAt(R.r1, 0); label(PX(R.r1), Y0 - 11, f2(R.r1), 'lab main', 'middle'); });
          part(vis(0.6), 0, () => { dotAt(R.r2, 0); label(PX(R.r2), Y0 - 11, f2(R.r2), 'lab main', 'middle'); });
          workLines([{ s: '`(r + ' + f2(-R.r1) + ')(r + ' + f2(-R.r2) + ') = 0`', a: vis(0.3) }, { s: 'so `r` = ' + f2(R.r1) + ' or `r` = ' + f2(R.r2), a: vis(0.9) }]);
        } else if (r.w === '1 and 4') {
          REC.bad++;
          part(vis(0.1), 0, () => { dotAt(1, 0, 'dot bad'); label(PX(1) - 6, Y0 - 11, '1', 'lab bad', 'end'); });
          workLines([{ s: 'put in 1: 1 + ' + f2(C5) + ' + ' + f2(KS) + ' = ' + f2(1 + C5 + KS) + ', not 0', bad: true, a: vis(0.4) }]);
