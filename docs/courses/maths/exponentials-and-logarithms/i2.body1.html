<script>
  // ---------- the rules ----------
  // A year's growth at rate r (as a decimal) paid in n equal parts: each part multiplies the pot by
  // 1 + r/n, so after j parts a start A is A × (1 + r/n)^j. At 100% (r = 1) the year's total is
  // (1 + 1/n)^n, which settles on e. Growth that never pauses at rate k gives A × e^(kt).
  const PARTS = [1, 2, 4, 12, 365, 8760];
  const PNAME = ['1 part', '2 parts', '4 parts', '12 parts', '365 parts', '8,760 parts'];
  const total = (n) => Math.pow(1 + 1 / n, n);
  const potAt = (A, r, n, j) => A * Math.pow(1 + r / n, j);
  const cont = (A, k, t) => A * Math.exp(k * t);
  // The slope of eˣ, measured as the slope of a tiny chord either side of x (not assumed).
  const slopeAt = (x) => (Math.exp(x + 1e-4) - Math.exp(x - 1e-4)) / 2e-4;
  // Sources the checks restate (the lesson's own).
  const SRC_E = 'https://www.mathwords.com/e/euler_number.htm';
  const SRC_LIM = 'https://www.math.toronto.edu/mathnet/plain/answers/answers_12.html';
  const SRC_RATE = 'https://openstax.org/books/calculus-volume-1/pages/6-8-exponential-growth-and-decay';

  // ---------- numbers ----------
  // fx: exactly dp decimals; fv: at most dp, trailing zeros dropped. Commas, a true minus sign.
  function fx(v, dp) {
    const f = Math.pow(10, dp);
    let r = Math.round(v * f) / f;
    if (r === 0) r = 0;
    const p = Math.abs(r).toFixed(dp).split('.');
    p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (r < 0 ? '−' : '') + p.join('.');
  }
  function fv(v, dp) {
    if (dp == null) dp = 2;
    const s = fx(v, dp);
    return dp > 0 ? s.replace(/(\.\d*?)0+$/, '$1').replace(/\.$/, '') : s;
  }
  // Pounds: whole pounds plain, otherwise pence shown (£261.30).
  const money = (v) => '£' + (Math.round(v * 100) % 100 === 0 ? fx(v, 0) : fx(v, 2));
  // A year's total or factor: as written in the lesson, 2, 2.25, then four decimals (2.6130).
  const ftot = (v) => (Math.abs(v * 100 - Math.round(v * 100)) < 1e-9 ? fv(v, 2) : fx(v, 4));
  const volts = (v) => fv(v, 0) + ' V';
  const p4 = (j) => potAt(100, 1, 4, j);

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // graph: time along the bottom (tmax, ticks tt) and the value up the side (ymin..ymax, ticks yt).
  // items: what the graph draws. k: 'stair' (n parts a year at rate r from A, by the rule), 'steps'
  // (a slip's own staircase), 'curve' (A × e^(kk t)), 'seg' (a straight line), 'mark' (a value
  // written at a point), 'rise' (a pill beside a rise), 'pill' (a factor between ticks), 'q' (the
  // time asked about). at: when it arrives (seconds after the screen opens, or after Check); dur: a
  // line drawn by a pen over that long. when: 'right' (after a right answer) or the wrong answer
  // whose slip it draws. parts: the parts slider and its table; rate: the rate slider and its bars;
  // tracker: the slope tracker. A puzzle: opts, the answers offered; val, the value each one gives;
  // ans, the words that would give the answer away before Check; fmt, how its answers are written.
  const PICK = 'Tap one of the answers.';
  const Y1 = (o) => Object.assign({ tmax: 1, tt: [[0, '0'], [0.5, '½'], [1, '1 year']], yname: 'pounds', pre: '£', h: 160 }, o);
  const STEPS = [
    { show: true, name: 'One part or two', dur: 4.0,
      graph: Y1({ ymax: 250, yt: [0, 100, 200] }),
      key: [['cmp', '1 part'], ['main', '2 parts']],
      items: [
        { k: 'stair', A: 100, r: 1, n: 1, to: 1, cls: 'cmp', at: 0.4, dur: 1.0 },
        { k: 'mark', t: 1, v: 200, text: money(100 * 2), cls: 'cmp', pos: 'r', dy: 6, at: 1.5 },
        { k: 'stair', A: 100, r: 1, n: 2, to: 1, cls: 'main', at: 1.8, dur: 1.2 },
        { k: 'rise', t: 0.5, v0: 100, v1: 150, text: '+' + money(100 * 0.5), at: 2.45 },
        { k: 'rise', t: 1, v0: 150, v1: 225, text: '+' + money(150 * 0.5) + ', 50% of ' + money(150), at: 3.05 },
        { k: 'mark', t: 1, v: 225, text: money(100 * 1.5 * 1.5), pos: 'r', dy: -3, at: 3.2 },
      ],
      text: 'Say £100 grows 100% over a year. Paid as one part at the year\'s end, it doubles to £200. Now pay it in two halves of 50%. The first half takes £100 to £150. The second half\'s 50% is taken of £150, not £100, so it adds £75 and ends at £225. Splitting helps because each part\'s growth starts earning straight away.' },
    { kind: 'pick', name: 'Four quarters',
      graph: Y1({ ymax: 250, yt: [0, 100, 200] }),
      key: [['main', '4 parts']],
      items: [
        { k: 'stair', A: 100, r: 1, n: 4, to: 0.25, cls: 'main' },
        { k: 'rise', t: 0.25, v0: p4(0), v1: p4(1), text: '+' + money(p4(1) - p4(0)) },
        { k: 'q', t: 1 },
        { k: 'stair', A: 100, r: 1, n: 4, from: 0.25, to: 1, cls: 'main', when: 'right', at: 0.1, dur: 1.0 },
        { k: 'rise', t: 1, v0: p4(3), v1: p4(4), text: '+' + money(p4(4) - p4(3)), when: 'right', at: 1.05 },
        { k: 'mark', t: 1, v: p4(4), text: money(p4(4)), pos: 'r', when: 'right', at: 1.2 },
        { k: 'steps', ts: [0.25, 0.5, 0.75, 1], vs: [125, 150, 175, 200], cls: 'slip', when: '£200', at: 0.3, dur: 0.6 },
        { k: 'mark', t: 1, v: 200, text: '£200', cls: 'slip', pos: 'r', when: '£200', at: 0.6 },
        { k: 'steps', ts: [0, 0.25, 0.5, 0.75, 1], vs: [100, 200, 400, 800, 1600], cls: 'slip', when: '£1,600', at: 0.4, dur: 0.6 },
        { k: 'mark', t: 1, v: 1600, text: '£1,600', cls: 'slip', pos: 'r', when: '£1,600', at: 0.6 },
      ],
      slipMax: { '£1,600': 1800 },
      opts: ['£200', '£244.14', '£1,600'], want: '£244.14', ans: '£244.14', fmt: money,
      val: { '£200': 100 + 4 * 25, '£244.14': 100 * Math.pow(1.25, 4), '£1,600': 100 * Math.pow(2, 4) },
      task: 'Now pay the year\'s 100% as four quarters of 25%. Each quarter\'s 25% is taken of the pot by then. What is the pot at the year\'s end?',
      why: 'Each quarter multiplies the pot by `1 + 1/4 = 1.25`, so the year gives `100 × 1.25⁴` ≈ £244.14. The rises grow, from £25 at first to £48.83 at the end, because each one is 25% of a bigger pot.',
      hint: 'Not quite. Each quarter multiplies the pot by 1.25.',
      hints: { '£200': 'Not quite. That adds 25% of the first £100 four times. Each quarter\'s 25% is taken of the pot by then.',
        '£1,600': 'Not quite. That doubles the pot each quarter. A quarter adds 25%, so it multiplies by 1.25.' } },
    { show: true, name: 'More and more parts', dur: 4.2, parts: { hi: 4, def: 4, demo: true },
      graph: Y1({ ymax: 320, yt: [0, 100, 200, 300] }),
      key: [['main', 'paid in parts'], ['faint', 'never pausing, 100 × eᵗ']],
      text: 'Split the year into `n` equal parts and each part multiplies the pot by `1 + 1/n`. There are `n` of them, so the year multiplies it by `(1 + 1/n)ⁿ`. More parts make smaller, more frequent steps, and the staircase hugs the smooth curve behind it. The year\'s total grows by less each time and settles near 2.718. That fixed number is called *e*. It is a constant like π, about 2.71828, a number to work with, not a letter you choose. Slide the number of parts.' },
    { kind: 'pick', name: 'Every hour', whyAfter: true, parts: { hi: 5, def: 4, lock: 5 },
      graph: Y1({ ymax: 320, yt: [0, 100, 200, 300] }),
      key: [['main', 'paid in parts'], ['faint', 'never pausing, 100 × eᵗ']],
      items: [
        { k: 'mark', t: 1, v: 300, text: '£300', cls: 'slip', pos: 'r', dy: -4, dot: 'dot', when: 'About £300', at: 0.3 },
      ],
      opts: ['Without limit', 'About £300', '£271.81'], want: '£271.81', ans: '£271.81', fmt: money,
      val: { '£271.81': 100 * total(8760), 'About £300': 300 },
      task: 'A year has 8,760 hours. Guess before you step there. What does £100 reach when its 100% is paid in 8,760 parts?',
      why: 'Going from 365 parts to 8,760 adds only about 36p, from £271.46 to £271.81. Each extra split adds interest on ever smaller slices of interest, so the total settles. The year\'s total, 2.7181, is now close to e, about 2.71828.',
      hint: 'Not quite. Look at how little each step along the table adds.',
      hints: { 'About £300': 'Not quite. Each split adds less than the one before, so the total creeps up rather than reaching £300.',
        'Without limit': 'Not quite. Each extra split adds interest on ever smaller slices of interest, so the total settles.' } },
    { show: true, name: 'Never pausing', dur: 3.6,
      graph: { tmax: 2, tt: [[0, '0'], [0.5, '½'], [1, '1'], [2, '2 years']], yname: 'times the start', ymax: 8, yt: [0, 2, 4, 6, 8], h: 170 },
      key: [['main', 'never pausing, eᵗ']],
      items: [
        { k: 'curve', A: 1, kk: 1, to: 2, cls: 'main', at: 0.4, dur: 1.9 },
        { k: 'mark', t: 0.5, v: Math.exp(0.5), text: 'e^0.5 ≈ ' + fx(Math.exp(0.5), 4), pos: 'br', dot: 'ring', at: 0.95 },
        { k: 'mark', t: 1, v: Math.E, text: 'e ≈ ' + fx(Math.E, 3), pos: 'br', dot: 'ring', at: 1.4 },
        { k: 'mark', t: 2, v: Math.exp(2), text: 'e² ≈ ' + fx(Math.exp(2), 3), pos: 'r', dot: 'ring', at: 2.35 },
      ],
      text: 'Growth that never pauses is the smooth curve the staircases hug. At 100% a year it makes the pot e times bigger each year, so after `t` years it is `eᵗ` times the start. You work it on the calculator\'s eˣ key. Half a year gives `e^0.5 ≈ 1.6487`, so £100 becomes about £164.87. Two years give `e² ≈ 7.389`.' },
    { kind: 'pick', name: 'Two years',
      graph: { tmax: 2, tt: [[0, '0'], [1, '1'], [2, '2 years']], yname: 'pounds', pre: '£', ymax: 800, yt: [0, 200, 400, 600, 800], h: 170 },
      key: [['main', 'never pausing, 100 × eᵗ']],
      items: [
        { k: 'curve', A: 100, kk: 1, to: 1, cls: 'main' },
        { k: 'mark', t: 0, v: 100, text: '£100', pos: 'br', dot: 'dot' },
        { k: 'q', t: 2 },
        { k: 'curve', A: 100, kk: 1, from: 1, to: 2, cls: 'main', when: 'right', at: 0.1, dur: 0.9 },
        { k: 'mark', t: 2, v: 100 * Math.exp(2), text: money(100 * Math.exp(2)), pos: 'r', dot: 'ring', when: 'right', at: 1.0 },
        { k: 'steps', ts: [0, 1, 2], vs: [100, 200, 400], cls: 'slip', when: '£400', at: 0.3, dur: 0.6 },
        { k: 'mark', t: 2, v: 400, text: '£400', cls: 'slip', pos: 'r', when: '£400', at: 0.6 },
        { k: 'mark', t: 2, v: 100 * 2 * Math.E, text: money(100 * 2 * Math.E), cls: 'slip', pos: 'r', dot: 'dot', when: '£543.66', at: 0.3 },
      ],
      opts: ['£400', '£738.91', '£543.66'], want: '£738.91', ans: '£738.91', fmt: money,
      val: { '£400': 100 * 2 * 2, '£738.91': 100 * Math.exp(2), '£543.66': 100 * 2 * Math.E },
      task: '£100 grows 100% a year, never pausing. What is it after 2 years?',
      why: 'Each year multiplies the pot by e, so 2 years multiply it by `e × e = e²` ≈ 7.389. That makes `100 × e²` ≈ £738.91.',
      hint: 'Not quite. Each year multiplies the pot by e.',
      hints: { '£400': 'Not quite. That doubles once a year, paid as one part. Never pausing makes it e times bigger each year.',
        '£543.66': 'Not quite. That is 100 × 2 × e. The 2 years go in the power, 100 × e².' } },
    { show: true, name: 'A smaller rate', dur: 3.4, rate: true,
      text: 'A smaller rate works the same way. Say 5% a year is split into 100 parts. Each part adds 0.05%, exactly what each part adds when 100% is split into 2,000 parts. And 100 of those 2,000 parts is a twentieth of that year. So a year at 5% is a twentieth of a year at 100%, and the pot grows `e^0.05 ≈ 1.0513` times. Slide the *growth rate*. Whatever it is, the splits settle on `eᵏ`, with the rate `k` written as a decimal.' },
    { kind: 'pick', name: 'The factor at 5%',
      graph: { tmax: 1, tt: [[0, '0'], [1, '1 year']], yname: 'times the start', ymax: 1.2, yt: [0, 0.5, 1], h: 150 },
      key: [['main', 'never pausing, e^(0.05t)', 'right']],
      items: [
        { k: 'mark', t: 0, v: 1, dot: 'dot' },
        { k: 'q', t: 1 },
        { k: 'curve', A: 1, kk: 0.05, to: 1, cls: 'main', when: 'right', at: 0.1, dur: 0.8 },
        { k: 'mark', t: 1, v: Math.exp(0.05), text: fx(Math.exp(0.05), 4), pos: 'r', dot: 'ring', when: 'right', at: 0.9 },
        { k: 'mark', t: 1, v: 0.05, text: '0.05', cls: 'slip', pos: 'r', dot: 'dot', when: '× 0.05', at: 0.3 },
        { k: 'steps', ts: [0, 1], vs: [1, 1.05], cls: 'slip', when: '× 1.05', at: 0.3, dur: 0.6 },
        { k: 'mark', t: 1, v: 1.05, text: '1.05', cls: 'slip', pos: 'r', when: '× 1.05', at: 0.6 },
      ],
      opts: ['× 1.0513', '× 0.05', '× 1.05'], want: '× 1.0513', ans: '1.0513', fmt: (v) => fv(v, 4),
      val: { '× 1.0513': Math.exp(0.05), '× 0.05': 0.05, '× 1.05': 1 + 0.05 },
      task: 'At 5% a year, never pausing, a pot is `e^(0.05t)` times the start after `t` years. What does each year multiply it by?',
      why: 'One year puts `t = 1` in the power, so each year multiplies the pot by `e^0.05 ≈ 1.0513`. The rate, 0.05, is not the factor. And 1.0513 is a little more than the 1.05 that paying once gives, because the growth earns as it goes.',
      hint: 'Not quite. Put t = 1 in the power.',
      hints: { '× 0.05': 'Not quite. 0.05 is the rate, not the factor. Multiplying by 0.05 would leave a twentieth of the pot.',
        '× 1.05': 'Not quite. That is 5% paid once. Never pausing earns as it goes, so it gives a little more.' } },
    { show: true, name: 'A minus in the power', dur: 3.8,
      graph: { tmax: 3, tt: [[0, '0'], [1, '1'], [2, '2'], [3, '3']], tname: 'units of time', yname: 'share left', ymax: 1.1, yt: [0, 0.5, 1], h: 160, pills: true },
      key: [['main', 'e^(−t)']],
      items: [
        { k: 'curve', A: 1, kk: -1, to: 3, cls: 'main', at: 0.4, dur: 2.4 },
        { k: 'mark', t: 1, v: Math.exp(-1), text: fx(Math.exp(-1), 3), pos: 'ar', dot: 'ring', at: 1.3 },

    svg.setAttribute('viewBox', '0 0 340 ' + G.H);
    const ps = d.parts ? partsState(d, st) : null;
    const said = [];
    if (d.rate) said.push(drawRate(d, st, G));
    if (d.graph) said.push(drawGraph(d, st, G, ps));
    if (ps) said.push(drawPartsTable(d, st, G, ps));
    if (G.keyY != null) drawKey(d, st, G);
    placeGrips(d, G, st);
    svg.setAttribute('aria-label', said.filter(Boolean).join(' '));
  }

  // The model the lesson reads: the year's total and the pot for the parts setting.
  K.model((p) => {
    const n = PARTS[K.clamp(Math.round(p.parts), 0, PARTS.length - 1)], f = total(n);
    return { yearTotal: f, potEnd: 100 * f };
  });

  const el = (id) => document.getElementById(id);
  write(el('finish'), FINISH);
  write(el('cap'), CAPTION);
  K.update((p) => {
    const i = Math.round(p.step), d = STEPS[i], st = S[i], pj = Math.round(p.parts);
    if (!anim.playing()) T = Infinity;   // motion that was stopped (the page hidden, a test) shows finished
    if (i !== lastStep) {
      lastStep = i; enter('stepbox');
      if (d.show) { st.n = null; st.rate = null; st.x = null; }
      if (d.parts) syncParts(i);
      if (d.show) play(d.dur); else { anim.pause(); T = Infinity; }
    } else if (d.parts && pj !== lastParts) {
      // the parts control moved from outside the picture: the slider follows it
      const j = K.clamp(pj, 0, pTop(d, st));
      st.n = j; st.from = null; lastParts = j;
      if (partsCtl.get() !== j) partsCtl.set(j, true);
      anim.pause(); T = Infinity;
    }
    if (!d.parts) lastParts = pj;
    if (finished !== lastDone) { lastDone = finished; enter(finished ? 'done' : 'stepbox'); }
    const right = st.res === 'right';
    el('lead').hidden = i !== 0 || finished;
    el('stepbox').hidden = finished;
    el('done').hidden = !finished;
    el('count').textContent = 'Step ' + (i + 1) + ' of ' + STEPS.length;
    const task = el('task');
    task.className = 'task' + (d.show ? ' show' : '');
    write(task, d.show ? d.text : d.task);
    paint(i);

    replayBtn.el.hidden = !d.show || REDUCE;
    el('replay').hidden = replayBtn.el.hidden;
    const opts = d.show ? [] : d.opts || [];
    el('picks').hidden = !opts.length;
    el('picks').classList.toggle('long', opts.some((o) => o.length > 6));
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      b.setLabel(opts[k]);
      b.el.textContent = '';
      italics(b.el.appendChild(K.el('span')), opts[k], false);   // one span, so the button's gap does not split "× 1.05"
      b.el.setAttribute('aria-label', say(opts[k]));
      b.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });

    el('acts').hidden = !!d.show;
    checkBtn.el.hidden = right;
    const fb = el('fb');
    fb.hidden = !!d.show;
    fb.className = 'fb' + (right ? ' right' : st.res === 'wrong' ? ' wrong' : '');
    write(fb, d.show ? '' : right ? 'That\'s it.' : st.res === 'wrong' ? hintFor(i, st) : st.res === 'empty' ? PICK : '');

    const why = el('why');
    const whyOk = !d.whyAfter || right || st.res === 'wrong';   // on the guess-first screen, Why? waits for Check
    whyBtn.el.hidden = !whyOk;
    why.hidden = d.show || !st.why || !whyOk;
    write(why, d.show ? '' : d.why);
    whyBtn.setLabel(st.why ? 'Hide why' : 'Why?');

    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !right);
    nextBtn.setLabel(i === STEPS.length - 1 ? 'Finish' : 'Continue');
    nav.hidden = backBtn.el.hidden && nextBtn.el.hidden;
  });

  // ---------- known answers, worked out by hand ----------
  const idx = (name) => STEPS.findIndex((d) => d.name === name);
  const PICKS = STEPS.map((d, i) => i).filter((i) => !STEPS[i].show);
  const solvedSt = (i) => {
    const d = STEPS[i], st = Object.assign(blank(), { pick: d.want, res: 'right' });
    if (d.parts && d.parts.lock != null) { st.from = d.parts.def; st.n = d.parts.lock; }
    return st;
  };
  const wrongSt = (i, o) => Object.assign(blank(), { pick: o, res: 'wrong' });
  const close = (a, b, tol) => Math.abs(a - b) <= (tol != null ? tol : 1e-9 * Math.max(1, Math.abs(a), Math.abs(b)));
  // Every finished picture the lesson can show: each screen opened, each puzzle solved and each
  // slip shown, the parts screens at every stop, the rate and the point at many settings.
  function states() {
    const out = [];
    STEPS.forEach((d, i) => {
      out.push([i, blank()]);
      if (d.parts) for (let j = 0; j <= d.parts.hi; j++) out.push([i, Object.assign(blank(), { n: j })]);
      if (d.rate) [1, 2, 5, 10, 25, 50, 75, 100].forEach((v) => out.push([i, Object.assign(blank(), { rate: v })]));
      if (d.tracker) [0, 0.25, 0.5, 1, 1.5, 2].forEach((v) => out.push([i, Object.assign(blank(), { x: v })]));
      if (!d.show) { out.push([i, solvedSt(i)]); d.opts.filter((o) => o !== d.want).forEach((o) => out.push([i, wrongSt(i, o)])); }
      if (d.parts && d.parts.lock != null) for (let j = 0; j <= d.parts.hi; j++) out.push([i, Object.assign(solvedSt(i), { n: j, from: null })]);
    });
    return out;
  }
  // A step painted in the state given (finished, or at t seconds into its motion): what it draws.
  function drawn(i, st, t) {
    const keepS = S[i], keepT = T;
    S[i] = st; T = t == null ? Infinity : t;
    try {
      paint(i);
      return { texts: Array.from(art.querySelectorAll('text')).map((q) => q.textContent), rec: REC };
    } finally { S[i] = keepS; T = keepT; paint(); }
  }
  let ALL = null;
  const all = () => ALL || (ALL = states().map((x) => ({ i: x[0], st: x[1], g: drawn(x[0], x[1]) })));
  // A staircase drawn by the rule: its treads are the pot after j parts, A × (1 + r/n)^j, in order,
  // and each rise is bigger than the one before.
  function stairOk(L) {
    if (L.k !== 'stair') return true;
    const vAt = (j) => potAt(L.A, L.r, L.n, j);
    if (L.sampled) return L.pts.every((q) => close(q[1], vAt(Math.floor(q[0] * L.n + 1e-9))));
    const vals = [];
    L.pts.forEach((q) => { if (!vals.length || !close(vals[vals.length - 1], q[1])) vals.push(q[1]); });
    const j0 = Math.floor(L.from * L.n + 1e-9);
    return vals.every((v, m) => close(v, vAt(j0 + m))) && vals.every((v, m) => m < 2 || v - vals[m - 1] > vals[m - 1] - vals[m - 2]);
  }

  K.check('e is a fixed constant like π and always equals approximately 2.71828: the e on this page is 2.71828 to five decimals, the number line marks it as e ≈ 2.718, and 8,760 parts come within 0.0002 of it', () =>
    fx(Math.E, 5) === '2.71828' && Math.abs(total(8760) - Math.E) < 2e-4 &&
      all().every(({ g }) => !g.rec.parts || g.texts.indexOf('e ≈ 2.718') >= 0), { source: SRC_E });
  K.check('Under simple interest alone the money doubles during the period, and under continually compounding interest it is multiplied by e: paid as one part the pot ends the year at twice its start, and every never-pausing curve at the full rate ends each year at e times where it began', () => {
    const one = drawn(idx('One part or two'), blank()).rec.stairs.find((L) => L.n === 1);
    return total(1) === 2 && !!one && close(one.pts[one.pts.length - 1][1], 2 * one.pts[0][1]) &&
      all().every(({ g }) => g.rec.curves.filter((c) => c.kk === 1 && c.t1 - c.t0 >= 1 - 1e-9).every((c) => close(c.fn(c.t0 + 1) / c.fn(c.t0), Math.E)));
  }, { source: SRC_LIM });
  K.check('The rate of growth is proportional to the current function value: on the slope tracker, at every point tried, the slope measured on eˣ equals its height, and both read the same', () => {
    const i = idx('Slope equals height');
    return [0, 0.35, 0.5, 1, 1.5, 1.95, 2].every((x) => {
      const r = drawn(i, Object.assign(blank(), { x })).rec.trk;
      return !!r && close(r.s, r.h, 1e-6 * r.h) && r.ht === r.sTxt;
    }) && fx(Math.exp(0), 3) === '1.000' && fx(Math.E, 3) === '2.718' && fx(Math.exp(2), 3) === '7.389';
  }, { source: SRC_RATE });
  K.check('Every staircase follows its rule: after j of the year\'s n parts the pot is 100 × (1 + 1/n)ʲ, each rise is bigger than the one before, and with more parts the year\'s end comes closer to the smooth curve', () => {
    const okAll = all().every(({ g }) => g.rec.stairs.every(stairOk));
    const i = idx('More and more parts');
    let gap = Infinity;
    for (let j = 0; j <= 4; j++) {
      const L = drawn(i, Object.assign(blank(), { n: j })).rec.stairs.find((x) => x.n === PARTS[j]);
      if (!L) return false;
      const gp = 100 * Math.E - L.pts[L.pts.length - 1][1];
      if (!(gp > 0 && gp < gap)) return false;
      gap = gp;
    }
    return okAll;
  });
  K.check('The year\'s total grows with every extra split, by less each time, and stays below e: the table writes it as 2, 2.25, 2.4414, 2.6130, 2.7146 and 2.7181, and the model returns it, with the pot, at every setting of the parts', () => {
    const v = PARTS.map(total);
    const grows = v.every((x, j) => j === 0 || x > v[j - 1]) && v.every((x, j) => j < 2 || x - v[j - 1] < v[j - 1] - v[j - 2]) && v.every((x) => x < Math.E);
    const model = PARTS.every((n, j) => { const o = K.at({ parts: j }); return close(o.yearTotal, total(n)) && close(o.potEnd, 100 * total(n)); });
    return grows && v.map(ftot).join(' ') === '2 2.25 2.4414 2.6130 2.7146 2.7181' && model;
  });
  K.check('Every number follows its rule: £200, £150, £75 and £225; £244.14 (slips £200 and £1,600); £261.30, £271.46 and £271.81, 36p more than 365 parts; 1.6487, £164.87 and 7.389; £738.91 (slips £400 and £543.66); 1.05, 1.0512 and 1.0513 at 5%, and 2,000 parts; 0.368, 0.135 and 0.050; 147 V (slips 0 V and 1,087 V); 1.35 (slips 1.331 and 1.3); £1,061.84 and £1,061.68 (slips £1,060 and £163.10); and each answer offered is the value its own working gives', () => {
    const ok = money(100 * 2) === '£200' && money(100 * 1.5) === '£150' && money(150 * 0.5) === '£75' && money(100 * 1.5 * 1.5) === '£225' &&
      money(p4(4)) === '£244.14' && money(p4(1) - p4(0)) === '£25' && money(p4(4) - p4(3)) === '£48.83' && money(100 + 4 * 25) === '£200' && money(100 * Math.pow(2, 4)) === '£1,600' &&
      money(100 * total(12)) === '£261.30' && money(100 * total(365)) === '£271.46' && money(100 * total(8760)) === '£271.81' &&
      Math.round((100 * total(8760) - 100 * total(365)) * 100) === 36 &&
      fx(Math.exp(0.5), 4) === '1.6487' && money(100 * Math.exp(0.5)) === '£164.87' && fx(Math.exp(2), 3) === '7.389' &&
      money(100 * Math.exp(2)) === '£738.91' && money(100 * 2 * Math.E) === '£543.66' && money(100 * 2 * 2) === '£400' &&
      ftot(1 + 0.05) === '1.05' && ftot(Math.pow(1 + 0.05 / 12, 12)) === '1.0512' && ftot(Math.pow(1 + 0.05 / 365, 365)) === '1.0513' && ftot(Math.exp(0.05)) === '1.0513' &&
      close(0.05 / 100, 1 / 2000) && fv(100 * 20, 0) === '2,000' &&
      fx(Math.exp(-1), 3) === '0.368' && fx(Math.exp(-2), 3) === '0.135' && fx(Math.exp(-3), 3) === '0.050' &&
      volts(400 * Math.exp(-1)) === '147 V' && volts(400 - 40 * 10) === '0 V' && volts(400 * Math.E) === '1,087 V' &&
      fv(Math.exp(0.3), 3) === '1.35' && fv(Math.pow(1.1, 3), 3) === '1.331' && fv(1 + 3 * 0.1, 3) === '1.3' &&
      money(1000 * Math.exp(0.06)) === '£1,061.84' && money(1000 * Math.pow(1.005, 12)) === '£1,061.68' && money(1000 * 1.06) === '£1,060' && money(1000 * Math.E * 0.06) === '£163.10';
    const labelled = PICKS.every((i) => { const d = STEPS[i]; return Object.keys(d.val).every((o) => d.opts.indexOf(o) >= 0 && d.fmt(d.val[o]) === o.replace(/^About /, '').replace(/^× /, '')); });
    return ok && labelled;
  });
  K.check('A smaller rate settles the same way: at every rate from 1% to 100%, 1, 12 and 365 parts give totals that rise towards eᵏ without passing it, and every bar is drawn to one scale', () => {
    const i = idx('A smaller rate');
    return [1, 2, 5, 10, 25, 50, 75, 100].every((v) => {
      const r = drawn(i, Object.assign(blank(), { rate: v })).rec.rate, k = v / 100;
      return r.rows.length === 4 && close(r.rows[3].f, Math.exp(k)) &&
        r.rows.every((row, m) => (m === 0 || row.f > r.rows[m - 1].f) && row.f <= Math.exp(k) + 1e-12 && close(row.w, (BARW * (row.f - 1)) / (Math.exp(k) - 1), 1e-6));
    });
  });
  K.check('With a minus in the power each equal step multiplies by the same 0.368: the marks at 1, 2 and 3 read 0.368, 0.135 and 0.050, each e^(−1) times the one before', () => {
    const g = drawn(idx('A minus in the power'), blank()), m = g.rec.marks;
    return m.length === 3 && m.every((x, j) => close(x.v, Math.exp(-(j + 1))) && (j === 0 || close(x.v / m[j - 1].v, Math.exp(-1)))) &&
      m.map((x) => x.text).join(' ') === '0.368 0.135 0.050' && g.texts.filter((s) => s === '× 0.368').length === 3;
  });
  K.check('Before an answer, nothing in a puzzle\'s picture gives it away, and a right answer shows it', () =>
    PICKS.every((i) => { const d = STEPS[i]; return drawn(i, blank()).texts.indexOf(d.ans) < 0 && drawn(i, solvedSt(i)).texts.indexOf(d.ans) >= 0; }));
  K.check('Each puzzle offers three answers and takes only its right one, and every wrong answer has a hint of its own', () =>
    PICKS.every((i) => {
      const d = STEPS[i];
      return d.opts.length === 3 && d.opts.indexOf(d.want) >= 0 && d.opts.every((o) => isRight(i, Object.assign(blank(), { pick: o })) === (o === d.want)) &&
        d.opts.every((o) => o === d.want || !!(d.hints && d.hints[o]));
    }));
  K.check('Every demonstration has finished arriving within its time (at most 4.5 s), none starting before the 0.35 s screen fade ends; every answer\'s motion, right or wrong, within 2.5 s', () => {
    const keepT = T;
    const timed = (i, st, limit) => {
      const keepS = S[i];
      T = Infinity; latest = 0; earliest = Infinity;
      S[i] = st;
      try { paint(i); } finally { S[i] = keepS; }
      return latest <= limit + 1e-9;
    };
    const ok = STEPS.every((d, i) => {
      if (d.show) { const r = timed(i, blank(), d.dur); return r && d.dur <= 4.5 && d.dur >= 3 && earliest >= FADE; }
      return timed(i, solvedSt(i), FB[0]) && FB[0] <= 2.5 && d.opts.filter((o) => o !== d.want).every((o) => timed(i, wrongSt(i, o), FB[1]) && FB[1] <= 2.5);
    });
    T = keepT; paint();
    return ok;
  });

  K.ready();
</script>
