<style>

  .scene .slide { fill: var(--k-fill1); }
  .scene .edge, .scene .tickb { stroke: var(--k-ink); stroke-width: 1.5; }
  .scene .ticks { stroke: var(--k-ink); stroke-width: 1.2; }
  .scene .nl { font-size: var(--lab); font-weight: 600; fill: var(--k-ink); }
  /* The decibel scale under the bottom ruler: small teal labels. */
  .scene .dbline, .scene .dbtick { stroke: var(--k-accent); stroke-width: 1.5; }
  .scene .dbl { font-size: var(--lab); font-weight: 600; fill: var(--k-accent); }
  /* The cursor: a navy line across both rulers, the number it sits on above and below. */

  .scene .tag { fill: var(--k-accent2); }
  .scene .tagt { font-size: var(--lab); font-weight: 700; fill: var(--k-on-accent2); }

  .scene .br { stroke: var(--k-accent2); stroke-width: 2; }
  .scene .brt { font-size: var(--lab); font-weight: 700; fill: var(--k-accent2); }
  .scene .cmp { stroke: var(--k-muted); stroke-width: 2; }
  .scene .cmpt { font-size: var(--lab); font-weight: 700; fill: var(--k-muted); }
  .scene .slip { stroke: var(--k-warn); stroke-width: 2; }

  .scene .ring { fill: none; stroke: var(--k-warn); stroke-width: 2.5; }

  /* The answers stay on one row, each label whole; longer ones stack one to a row. */
  .row.picks { flex-wrap: nowrap; }

<p class="caption" id="cap"></p>

<script>
  // ---------- the rule ----------
  // Both rulers are power rulers of base 10: a number n sits log n along, one × 10 space being U
  // units. The top ruler's 1 sits over the slide's number, so the top ruler starts log(slide)
  // along; the cursor sits at the cursor's number on the top ruler, a further log(cursor) along.
  // So the cursor is log(slide) + log(cursor) from the bottom ruler's 1, and the bottom ruler
  // reads 10 to that power there, which is slide × cursor. Decibels are ten times that log.
  const LG = (v) => Math.log10(v);
  const L2 = LG(2), L3 = LG(3), L4 = LG(4), L5 = LG(5), L6 = LG(6), L8 = LG(8), L9 = LG(9);
  const L20 = LG(20), L21 = LG(21), L36 = LG(36), L40 = LG(40);
  const SRC1 = 'https://www.khanacademy.org/math/algebra2/x2ec2f6f830c9fb89:logs/x2ec2f6f830c9fb89:log-prop/a/properties-of-logarithms';
  const SRC3 = 'https://www.britannica.com/science/decibel';
  const SRC2 = 'https://eng.libretexts.org/Bookshelves/Electrical_Engineering/Electronics/Operational_Amplifiers_and_Linear_Integrated_Circuits_-_Theory_and_Application_(Fiore)/01:_Introductory_Concepts_and_Fundamentals/1.02:_The_Decibel';

  // ---------- numbers ----------
  // fx: exactly dp decimals with a true minus sign; fv: at most dp, trailing zeros dropped.
  // A setting has one decimal (2.3), a reading on the bottom ruler two (10.81), a length three
  // (0.301), and decibels exactly one (3.0 dB), as the lesson writes them.
  function fx(v, dp) {
    const f = Math.pow(10, dp);
    let r = Math.round(v * f) / f;
    if (r === 0) r = 0;
    return (r < 0 ? '−' : '') + Math.abs(r).toFixed(dp);
  }
  function fv(v, dp) {
    const s = fx(v, dp);
    return dp > 0 ? s.replace(/(\.\d*?)0+$/, '$1').replace(/\.$/, '') : s;
  }
  const fs = (v) => fv(v, 1);
  const fP = (v) => fv(v, 2);
  const fp = (v) => fv(v, 3);
  const fd = (v) => fx(v, 1);
  const plain = (s) => Number(String(s).replace(/−/g, '-'));
  const thou = (v) => Math.round(v * 1000);
  const tenth = (v) => Math.round(v * 10);
  // The controls move in steps of 0.1 from 1 to 10.
  const grid = (v) => K.clamp(Math.round(v * 10) / 10, 1, 10);
  const eqs = (ok) => (ok ? ' = ' : ' ≈ ');
  // 10 to a shown power is the shown number exactly only for a whole power of 10.
  const endEq = (pw, n) => eqs(Number.isInteger(plain(pw)) && Math.pow(10, plain(pw)) === plain(n));
  // The fact under the picture, for a setting of the two controls, as the screen writes it.
  function liveForms(mode, s, c) {
    const ls = LG(s), lc = LG(c), lt = ls + lc, P = fP(Math.pow(10, lt)), S = fs(s), C = fs(c);
    if (mode === 'db') {
      return ['× ' + S + ' then × ' + C + ' is × ' + P,
        fd(10 * ls) + ' dB + ' + fd(10 * lc) + ' dB' + eqs(tenth(10 * ls) + tenth(10 * lc) === tenth(10 * lt)) + fd(10 * lt) + ' dB'];
    }
    const a = fp(ls), b = fp(lc), t = fp(lt);
    if (mode === 'div') {
      return ['log ' + P + ' − log ' + C + ' = log ' + S,
        '10^' + t + ' ÷ 10^' + b + eqs(thou(lt) - thou(lc) === thou(ls)) + '10^' + a + endEq(a, S) + S];
    }
    return ['log ' + S + ' + log ' + C + ' = log ' + P,
      '10^' + a + ' × 10^' + b + eqs(thou(ls) + thou(lc) === thou(lt)) + '10^' + t + endEq(t, P) + P];
  }

  // As a screen reader says it.
  const say = (s) => String(s == null ? '' : s)
    .replace(/log₂/g, 'log base 2').replace(/\^\(([^)]*)\)/g, ' to the power $1').replace(/\^([0-9.−]+)/g, ' to the power $1')
    .replace(/²/g, ' squared').replace(/³/g, ' cubed').replace(/√/g, 'root ')
    .replace(/≈/g, ' is about ').replace(/×/g, ' times ').replace(/÷/g, ' divided by ').replace(/−/g, ' minus ').replace(/\+/g, ' plus ')
    .replace(/=/g, ' equals ').replace(/\bdB\b/g, 'decibels').replace(/\s+/g, ' ').trim();

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // R: the picture (s, c: where the slide and the cursor start; cur: false hides the cursor;
  // bars: the two lengths as bars, true, or 'right' after a right answer; rowBars: room for bars
  // drawn by the step itself; sum: the row of the bracket over the whole length, sumWhen 'right'
  // after a right answer, sumFmt 'named' to write it as log N = L; botQ: the bottom reading is
  // asked, shown as ?; db: the decibel scale; ask: a length whose number is asked).
  // SHOW: live, Dan can drag it once the demonstration is over (mode: how the forms read it; end:
  // where it ends); moves, the slide and cursor's journey [to, when, how long], hold keeping the
  // bottom reading still; items arrive at their times. DO: items arrive after a right answer
  // (when: 'right') or after the wrong answer whose slip they draw; opts, the answers; work, each
  // answer by its own working; ans, the words that would give the answer away; forms before and
  // after a right answer.
  const STEPS = [
    { show: true, live: true, mode: 'mul', name: 'Two power rulers', R: { s: 1, c: 3, bars: true, sum: 1 }, end: { s: 2, c: 3 },
      moves: [{ s: 2, at: 0.8, dur: 1.6 }], sumAt: 0.4, formsAt: 2.6, dur: 3.4,
      text: 'Here are two *power rulers*, each number sitting at its log, as in the last lesson. The upright line across both is the *cursor*, on 3. Slide the top ruler until its 1 sits over 2: it starts ' + fp(L2) + ' along, and its 3 a further ' + fp(L3) + '. The lengths add end to end to ' + fp(L2 + L3) + ', and the bottom ruler reads 6 there, `2 × 3`. Drag the top ruler or the cursor to try others.' },
    { kind: 'pick', name: 'Four times five', R: { s: 4, c: 5, bars: true, sum: 1, sumWhen: 'right', sumAt: 0.4, botQ: true },
      items: [
        { k: 'bracket', a0: 0, a1: L4 + L5, row: 1, cls: 'slip', text: fp(L4 + L5) + ' is the length', when: '1.301' },
        { k: 'ring', n: 9, row: 1, text: '4 + 5 = 9 sits at ' + fp(L9), when: '9' },
      ],
      opts: ['20', '9', '1.301'], want: '20', ans: '20',
      work: { '20': [fP(Math.pow(10, L4 + L5)), '20'], '9': [String(4 + 5), '9'], '1.301': [fp(L4 + L5), '1.301'] },
      forms: { before: [], right: ['log 4 + log 5 = log 20', '10^' + fp(L4) + ' × 10^' + fp(L5) + ' = 10^' + fp(L20) + ' ≈ 20'] },
      task: 'The top ruler\'s 1 sits over 4, and the cursor is on 5. What does the bottom ruler read under the cursor?',
      why: 'On the rulers 4 is ' + fp(L4) + ' along and 5 a further ' + fp(L5) + ', so the lengths add to ' + fp(L4 + L5) + '. Adding lengths multiplies the numbers, so the bottom ruler reads `4 × 5 = 20` under the cursor. ' + fp(L4 + L5) + ' is the length itself, which is log 20, and 9 would be the numbers added.',
      hint: 'Not quite. Adding lengths on these rulers multiplies the numbers.',
      hints: { '9': 'Not quite. 9 is 4 + 5. The lengths add, so the numbers multiply.',
        '1.301': 'Not quite. 1.301 is the length to the cursor. Read the number on the bottom ruler there.' } },
    { show: true, name: 'The product law', R: { s: 2, c: 3, bars: false },
      items: [
        { k: 'bracket', a0: 0, a1: L2 + L3, row: 1, cls: 'br', text: 'log 2 + log 3 = ' + fp(L2 + L3), at: 0.5 },
        { k: 'bracket', a0: 0, a1: L5, row: 2, cls: 'cmp', text: 'log 5 = ' + fp(L5), at: 1.4 },
        { k: 'bracket', a0: 0, a1: 1, row: 3, cls: 'br', text: 'log 10 = 1', at: 2.3 },
      ], formsAt: 2.9, dur: 3.6,
      forms: ['log(2 × 3) = log 2 + log 3', 'log 1 = 0 and log 10 = 1'],
      text: 'So the log of a product is the sum of the logs of its factors, `log(ab) = log a + log b`. It comes from `10ᵐ × 10ⁿ = 10ᵐ⁺ⁿ`, so it needs one base throughout. It says nothing about a sum: 2 then 3 lands on 6, not 5, since `log 5 = ' + fp(L5) + '` while `log 2 + log 3 = ' + fp(L2 + L3) + '`. The ruler starts at `log 1 = 0`, and one whole space is `log 10 = 1`. In any base the log of the base is 1, as `log₂ 2 = 1` and `ln e = 1`.' },
    { kind: 'pick', name: 'A sum inside', R: { s: 1, c: 3, bars: true },
      items: [
        { k: 'move', c: 10, when: 'right', at: 0.1, dur: 0.9 },
        { k: 'bracket', a0: 0, a1: 1, row: 1, cls: 'br', text: 'log 10 = ' + fp(LG(3 + 7)), when: 'right', at: 1.0 },
        { k: 'move', s: 3, c: 7, when: '1.322', at: 0.1, dur: 0.9 },
        { k: 'bracket', a0: 0, a1: L21, row: 1, cls: 'slip', text: 'log 21 ≈ ' + fp(L21), when: '1.322', at: 1.0 },
        { k: 'ring', n: 10, row: 1, text: '3 + 7 = 10 goes inside the log', when: '10' },
      ],
      opts: ['1', '1.322', '10'], want: '1', ans: 'log 10 = 1',
      work: { '1': [fp(LG(3 + 7)), '1'], '1.322': [fp(L3 + LG(7)), '1.322'], '10': [String(3 + 7), '10'] },
      forms: { before: [], right: ['log(3 + 7) = log 10 = 1'] },
      task: 'What is `log(3 + 7)`?',
      why: 'No log law splits a sum, so add inside the brackets first. `3 + 7 = 10`, and `log 10 = 1`, one whole space. `log 3 + log 7` is `log(3 × 7)`, the log of 21, about ' + fp(L21) + ', a different number.',
      hint: 'Not quite. No log law splits a sum. Add inside the brackets first.',
      hints: { '1.322': 'Not quite. log 3 + log 7 is log(3 × 7), the log of 21. Add inside the brackets first.',
        '10': 'Not quite. 10 is 3 + 7, the number inside the log. Now take its log.' } },
    { show: true, live: true, mode: 'div', name: 'Slide back to divide', R: { s: 1, c: 6, bars: true, sum: 1 }, end: { s: 2, c: 3 },
      moves: [{ s: 2, hold: true, at: 1.1, dur: 1.5 }], items: [{ k: 'idx', at: 2.6 }], sumAt: 0.4, formsAt: 2.8, dur: 3.6,
      text: 'Slide the other way and you divide. Put the cursor on 6 on the bottom ruler, then slide the top ruler until its 3 sits under the cursor. Its 1 now sits over 2, so `6 ÷ 3 = 2`. The lengths take away, `' + fp(L6) + ' − ' + fp(L3) + ' = ' + fp(L2) + '`. So `log(a ÷ b) = log a − log b`, from `10ᵐ ÷ 10ⁿ = 10ᵐ⁻ⁿ`. Drag the top ruler, and the cursor keeps its place on the bottom ruler, or drag the cursor to try others.' },
    { kind: 'pick', name: 'Taking logs away', R: { s: 1, c: 8, bars: 'right', barsAt: 1.0, sum: 1, sumFmt: 'named' },
      items: [
        { k: 'move', s: 4, hold: true, when: 'right', at: 0.1, dur: 0.9 },
        { k: 'idx', when: 'right', at: 1.0 },
        { k: 'ring', n: 6, row: 2, text: '8 − 2 = 6 sits at ' + fp(L6), when: '6' },
        { k: 'ring', n: 16, row: 2, text: '8 × 2 = 16 sits at ' + fp(LG(16)), when: '16' },
      ],
      opts: ['4', '6', '16'], want: '4', ans: 'log 8 − log 2 = log 4',
      work: { '4': [fP(Math.pow(10, L8 - L2)), '4'], '6': [String(8 - 2), '6'], '16': [String(8 * 2), '16'] },
      forms: { before: [], right: ['log 8 − log 2 = log 4', '10^' + fp(L8) + ' ÷ 10^' + fp(L2) + ' = 10^' + fp(L4) + ' ≈ 4'] },
      task: '`log 8 − log 2` is the log of which number?',
      why: 'Taking lengths away divides the numbers. `log 8 = ' + fp(L8) + '` and `log 2 = ' + fp(L2) + '`, and `' + fp(L8) + ' − ' + fp(L2) + ' = ' + fp(L4) + '`, which is log 4. On the rulers, put the top ruler\'s 2 under 8 and its 1 sits over 4, since `8 ÷ 2 = 4`.',
      hint: 'Not quite. Taking logs away divides the numbers.',
      hints: { '6': 'Not quite. 6 is 8 − 2. Taking logs away divides the numbers.',
        '16': 'Not quite. 16 is 8 × 2, which adding the logs would give. Taking them away divides.' } },
    { show: true, name: 'Powers', R: { s: 1, c: 1, bars: false, rowBars: true },
      moves: [{ s: 2, at: 0.5, dur: 0.8 }, { c: 2, at: 1.4, dur: 0.8 }, { s: 4, at: 2.3, dur: 0.8 }],
      items: [
        { k: 'seg', a0: 0, a1: L2, cat: 1, text: fp(L2), at: 0.5, dur: 0.8 },
        { k: 'seg', a0: L2, a1: 2 * L2, cat: 2, text: fp(L2), at: 1.4, dur: 0.8 },
        { k: 'seg', a0: 2 * L2, a1: 3 * L2, cat: 1, text: fp(L2), at: 2.3, dur: 0.8 },
        { k: 'bracket', a0: 0, a1: 3 * L2, row: 1, cls: 'br', text: '3 × ' + fp(L2) + ' = ' + fp(3 * L2), at: 3.2 },
      ], formsAt: 3.4, dur: 4.1,
      forms: ['log(2³) = 3 × log 2', '(10^' + fp(L2) + ')³ = 10^' + fp(3 * L2) + ' ≈ 8'],
      text: 'A power multiplies equal numbers, so its log lays equal lengths end to end. `2³ = 2 × 2 × 2`, so three lengths of log 2 land on 8, and `log(2³) = 3 × log 2 = ' + fp(3 * L2) + '`. In general `log(aⁿ) = n log a`, here with `a = 2` and `n = 3`. It comes from `(10ᵐ)ⁿ = 10ᵐⁿ`, where a power of a power multiplies the powers.' },
    { kind: 'pick', name: 'A square', R: { s: 1, c: 5, bars: true },
      items: [
        { k: 'move', s: 5, when: 'right', at: 0.1, dur: 0.9 },
        { k: 'bracket', a0: 0, a1: 2 * L5, row: 1, cls: 'br', text: '2 × ' + fp(L5) + ' = ' + fp(2 * L5), when: 'right', at: 1.0 },
        { k: 'ring', n: Math.pow(10, L5 * L5), row: 1, text: '(log 5)² ≈ ' + fp(L5 * L5) + ', at ' + fP(Math.pow(10, L5 * L5)), when: '(log 5)²' },
        { k: 'ring', n: 10, row: 1, text: 'log 10 is log(5 × 2)', when: 'log 10' },
      ],
      opts: ['2 log 5', '(log 5)²', 'log 10'], want: '2 log 5', ans: '2 × ' + fp(L5) + ' = ' + fp(2 * L5),
      work: { '2 log 5': [fp(2 * L5), fp(LG(25))], '(log 5)²': [fp(L5 * L5), '0.489'], 'log 10': [fp(LG(5 * 2)), '1'] },
      forms: { before: [], right: ['log(5²) = 2 log 5', '(10^' + fp(L5) + ')² = 10^' + fp(2 * L5) + ' ≈ 25'] },
      task: 'Which is `log(5²)`?',
      why: '`5² = 5 × 5`, so its log is two lengths of log 5 end to end, `2 × ' + fp(L5) + ' = ' + fp(2 * L5) + '`, which is log 25. Squaring the length instead gives `(log 5)² ≈ ' + fp(L5 * L5) + '`, the log of only ' + fP(Math.pow(10, L5 * L5)) + '. And log 10 is the log of `5 × 2`.',
      hint: 'Not quite. 5² is 5 × 5, two lengths of log 5 end to end.',
      hints: { '(log 5)²': 'Not quite. That squares the length. 5² is 5 × 5, so its log is two lengths of log 5 added.',
        'log 10': 'Not quite. 10 is 5 × 2, but 5² is 5 × 5 = 25.' } },
    { show: true, name: 'Counting lengths', R: { s: 1, c: 5, bars: false, rowBars: true },
      items: [
        { k: 'bracket', a0: 0, a1: L5, row: 1, cls: 'br', text: 'log 5 = ' + fp(L5), at: 0.5 },
        { k: 'seg', a0: 0, a1: L2, cat: 1, text: fp(L2), at: 1.2, dur: 0.6 },
        { k: 'seg', a0: L2, a1: 2 * L2, cat: 2, text: fp(L2), at: 1.9, dur: 0.6 },
        { k: 'seg', a0: 2 * L2, a1: L5, cat: 1, text: '', at: 2.6, dur: 0.4 },
        { k: 'note', p: 0, anchor: 'start', row: 2, cls: 'brt', text: fp(L5) + ' ÷ ' + fp(L2) + ' ≈ ' + fp(L5 / L2) + ' lengths of log 2', at: 3.0 },

    part(a, 0, () => {
      line(lc, x0 + 1, y, x1 - 1, y);
      line(lc, x0 + 1, up ? y - 5 : y, x0 + 1, y + 5); line(lc, x1 - 1, up ? y - 5 : y, x1 - 1, y + 5);
      text(lx, ly, s, tc, 'start');
    });
    REC.brackets.push({ a0, a1, text: s, kind });
    REC.texts2.push(s);
    if (kind === 'slip') REC.notes.push(s);
  }
  // A row of bars end to end, each labelled underneath; a label that would touch the one before
  // it drops to a second line.
  function barRow(bars, y0) {
    const placed = [[], []];
    bars.forEach((g) => {
      const x0 = X(g.a0), x1 = X(g.a1), wd = x1 - x0;
      if (wd > 0.05) part(g.a, 0, () => rect(g.cls, x0, y0, wd, 10, 0));
      const rec = { a0: g.a0, a1: g.a1, text: g.text || '', shown: false };
      REC.bars.push(rec);
      if (!g.text || wd < 0.5) return;
      const w = tw(g.text, 'bl'), lx = K.clamp((x0 + x1) / 2 - w / 2, 4, 336 - w);
      let ln = -1;
      for (let k = 0; k < 2; k++) if (!placed[k].some((q) => lx < q[1] + 4 && q[0] < lx + w + 4)) { ln = k; break; }
      if (ln < 0) return;
      const la = g.ta * settle(K.clamp(wd / 8, 0, 1), 0.5);
      if (!(la > 0)) return;
      placed[ln].push([lx, lx + w]);
      part(la, 0, () => text(lx, y0 + 25 + 15 * ln, g.text, 'bl', 'start'));
      rec.shown = true;
    });
  }
  function slipText(x, y, s, a) {
    const w = tw(s, 'slipt'), x0 = K.clamp(x - w / 2, 4, 336 - w);
    part(a, 0, () => text(x0, y + 4.5, s, 'slipt', 'start'));
    REC.notes.push(s);
  }

  // ---------- where the slide and the cursor are ----------
  // Live: Dan's settings. Otherwise from the start, each move in turn by how far it has arrived;
  // a move that holds keeps the cursor still on the bottom ruler while the top ruler slides.
  function itemA(d, st, it) {
    if (d.show) return it.at != null ? A(st, it.at, it.dur) : 1;
    if (!it.when) return 1;
    const t0 = it.at != null ? it.at : (it.when === 'right' ? 0.1 : 0.3);
    if (it.when === 'right') return st.res === 'right' ? arr(t0, it.dur || K.SOFT) : 0;
    return st.res === 'wrong' && st.pick === it.when ? arr(t0, it.dur || K.SOFT) : 0;
  }
  function stateOf(d, st, P) {
    if (d.show && d.live && st.live) return { s: P.slide, c: P.cursor, ls: LG(P.slide), lc: LG(P.cursor) };
    let ls = LG(d.R.s), lc = LG(d.R.c);
    const moves = d.show ? (d.moves || []) : (d.items || []).filter((it) => it.k === 'move');
    moves.forEach((m) => {
      const a = d.show ? A(st, m.at, m.dur) : itemA(d, st, m);
      if (!(a > 0)) return;
      if (m.hold) { const tot = ls + lc, n = ls + (LG(m.s) - ls) * a; lc = tot - n; ls = n; }
      else { if (m.s != null) ls += (LG(m.s) - ls) * a; if (m.c != null) lc += (LG(m.c) - lc) * a; }
    });
    return { s: Math.pow(10, ls), c: Math.pow(10, lc), ls, lc };
  }

  // ---------- the slide rule ----------
  function drawRule(d, st, P) {
    const R = d.R, show = !!d.show, right = st.res === 'right', said = [];
    const Z = stateOf(d, st, P), ls = Z.ls, lc = Z.lc, lt = ls + lc;
    REC.s = Z.s; REC.c = Z.c; REC.ls = ls; REC.lc = lc;
    const y0 = R.db ? Y.db0 : Y.b0, base = R.bars || R.rowBars ? y0 + 34 : y0;
    const rowY = (k) => base + 28 * k;
    const curOn = R.cur !== false, xc = X(lt);
    const prodTxt = fP(Math.pow(10, lt)), topTxt = fs(Z.c);

    // the tags first, so the numbers beside them make room
    const qA = R.botQ && !show ? (right ? arr(0.2, 0.5) : 0) : 1;
    const tTop = curOn ? tagBox(tagW([topTxt]), xc) : null;
    const tBot = curOn ? tagBox(tagW(R.botQ && !show ? ['?', prodTxt] : [prodTxt]), xc) : null;
    const askTxt = R.ask != null ? fP(Math.pow(10, R.ask)) : '';
    const askA = R.ask != null ? (right ? arr(0.2, 0.5) : 0) : 0;
    const tAsk = R.ask != null ? tagBox(tagW(['?', askTxt]), X(R.ask)) : null;
    const idxIt = (d.items || []).find((it) => it.k === 'idx');
    const idxA = idxIt ? itemA(d, st, idxIt) : 0;
    const idxTxt = fP(Z.s);
    let tIdx = idxA > 0 ? tagBox(tagW([idxTxt]), X(ls)) : null;
    if (tIdx && tBot && tIdx[0] < tBot[1] + 2 && tBot[0] < tIdx[1] + 2) tIdx = null;

    // the bottom ruler, fixed: 1 to 100, two × 10 spaces; its ticks rise from its lower edge
    rect('stock', X(0), Y.mid, 2 * U, Y.bb1 - Y.mid, 0);
    line('edge', X(0), Y.mid, X(2), Y.mid); line('edge', X(0), Y.bb1, X(2), Y.bb1);
    [0, 1, 2].forEach((k) => line('tickb', X(k), Y.mid, X(k), Y.bb1));
    BOT_T.forEach((n) => { const x = X(LG(n)), len = BOT_N.indexOf(n) >= 0 ? 12 : 7; line('ticks', x, Y.bb1 - len, x, Y.bb1); });
    // the top ruler, 1 to 10, slid so its 1 sits log(slide) along; its ticks hang from its upper edge
    rect('slide', X(ls), Y.tb0, U, Y.mid - Y.tb0, 0);
    line('edge', X(ls), Y.tb0, X(ls + 1), Y.tb0); line('edge', X(ls), Y.mid, X(ls + 1), Y.mid);
    line('tickb', X(ls), Y.tb0, X(ls), Y.mid); line('tickb', X(ls + 1), Y.tb0, X(ls + 1), Y.mid);
    TOP_T.forEach((n) => { const x = X(ls + LG(n)), len = TOP_N.indexOf(n) >= 0 ? 12 : 7; line('ticks', x, Y.tb0, x, Y.tb0 + len); });
    rowLabels(TOP_N.map((n) => ({ x: X(ls + LG(n)), s: String(n), n })), Y.tl, tTop ? [tTop] : [], null, 0, REC.top);
    rowLabels(BOT_N.map((n) => ({ x: X(LG(n)), s: String(n), n })), Y.bl, [tBot, tAsk].filter(Boolean), tIdx, idxA, REC.bot);
    said.push('Two power rulers. The top ruler\'s 1 sits over ' + say(fs(Z.s)) + ' on the bottom ruler, which runs from 1 to 100.');

    // the decibel scale: ten decibels to each × 10 space, a tick for every decibel
    if (R.db) {
      const da = show ? A(st, d.dbAt != null ? d.dbAt : 0.4, K.SOFT) : 1;
      const marks = [[0, '0 dB'], [10, '10 dB'], [20, '20 dB']];
      part(da, 0, () => {
        line('dbline', X(0), Y.db, X(2), Y.db);
        for (let k = 0; k <= 20; k++) line('dbtick', X(k / 10), Y.db, X(k / 10), Y.db + (k % 10 ? 4 : 6));
        marks.forEach((q) => text(X(q[0] / 10), Y.dbl, q[1], 'dbl', 'middle'));
      });
      REC.db = marks.map((q) => ({ v: q[0], x: X(q[0] / 10), text: q[1] }));
      said.push('Under the bottom ruler a decibel scale, 0 decibels at 1, 10 at 10 and 20 at 100.');
    }
    // the length asked about, as decibels
    if (R.ask != null) {
      const x = X(R.ask);
      line('ask', x, Y.mid, x, Y.curB);
      line('ask', x, Y.db, x, Y.db + 9);
      text(x, Y.dbl, fv(10 * R.ask, 1) + ' dB', 'askt', 'middle');
      tagRect(tAsk, Y.bl);
      if (askA < 1) tagText(tAsk, Y.bl, '?', 1 - askA);
      if (askA > 0) tagText(tAsk, Y.bl, askTxt, askA);
      REC.ask = askA >= 1 ? askTxt : '?';
      REC.boxes.push(tAsk);
      said.push('A mark at ' + fv(10 * R.ask, 1) + ' decibels asks which number sits there: ' + (askA >= 1 ? say(askTxt) : 'unknown') + '.');
    }

    // the lengths: the slide's then the cursor's, end to end, or the step's own bars
    const bars = [];
    if (R.bars) {
      const ba = R.bars === 'right' ? (right ? arr(R.barsAt != null ? R.barsAt : 0.9, K.SOFT) : 0) : 1;
      const lab = (v) => (R.db ? fd(10 * v) + ' dB' : fp(v));
      if (ba > 0) bars.push({ a0: 0, a1: ls, cls: 'b1', text: lab(ls), a: ba, ta: ba }, { a0: ls, a1: lt, cls: 'b2', text: lab(lc), a: ba, ta: ba });
    }
    (d.items || []).forEach((it) => {
      if (it.k !== 'seg') return;
      const p = itemA(d, st, it);
      if (!(p > 0)) return;
      bars.push({ a0: it.a0, a1: it.a0 + (it.a1 - it.a0) * p, cls: it.cat === 2 ? 'b2' : 'b1', text: it.text, a: 1, ta: p });
    });
    barRow(bars, y0);
    const shownBars = REC.bars.filter((b) => b.shown).map((b) => b.text);
    if (shownBars.length) said.push('Under the rulers, lengths end to end: ' + shownBars.map(say).join(', then ') + '.');

    // the whole length, from the bottom ruler's 1 to the cursor
    if (R.sum) {
      const sa = show ? A(st, d.sumAt != null ? d.sumAt : 0, K.SOFT) : (R.sumWhen === 'right' ? (right ? arr(R.sumAt != null ? R.sumAt : 0.9, K.SOFT) : 0) : 1);
      const s = R.sumFmt === 'named' ? 'log ' + prodTxt + ' = ' + fp(lt) : R.db ? fd(10 * lt) + ' dB' : fp(lt);
      if (sa > 0 && X(lt) - X(0) >= 2) { bracket(0, lt, rowY(R.sum), s, 'br', sa); REC.sum = s; said.push('A bracket over the whole length: ' + say(s) + '.'); }
    }
    // the step's own parts
    (d.items || []).forEach((it) => {
      if (it.k === 'move' || it.k === 'seg' || it.k === 'idx') return;
      const a = itemA(d, st, it);
      if (!(a > 0)) return;
      if (it.k === 'bracket') {
        bracket(it.a0, it.a1, rowY(it.row), it.text, it.cls, a);
        said.push((it.cls === 'slip' ? 'In red, a bracket: ' : 'A bracket: ') + say(it.text) + '.');
      } else if (it.k === 'ring') {
        const x = X(LG(it.n));
        part(a, 0, () => dot('ring', x, Y.ring, 8));
        slipText(x, rowY(it.row), it.text, a);
        REC.rings.push({ n: it.n, text: it.text });
        said.push('In red, a ring on the bottom ruler: ' + say(it.text) + '.');
      } else if (it.k === 'note') {
        const cls = it.cls === 'brt' ? 'brt' : 'slipt', w = tw(it.text, cls);
        const x0 = K.clamp(it.anchor === 'start' ? X(it.p) : X(it.p) - w / 2, 4, 336 - w);
        part(a, 0, () => text(x0, rowY(it.row) + 4.5, it.text, cls, 'start'));
        if (cls === 'slipt') REC.notes.push(it.text); else REC.texts2.push(it.text);
        said.push((cls === 'slipt' ? 'In red: ' : '') + say(it.text) + '.');
      }
    });

    // the top ruler's 1, read on the bottom ruler
    if (tIdx) {
      part(idxA, 0, () => { line('idx', X(ls), Y.tb0, X(ls), Y.curB); tagRect(tIdx, Y.bl); text((tIdx[0] + tIdx[1]) / 2, Y.bl, idxTxt, 'tagt', 'middle'); });
      REC.idx = idxTxt; REC.boxes.push(tIdx);
      said.push('The top ruler\'s 1 sits over ' + say(idxTxt) + '.');
    }
    // the cursor, the number it sits on above and the bottom ruler's reading below
    if (curOn) {
      line('cur', xc, Y.curT, xc, Y.curB);
      tagRect(tTop, Y.tl); tagText(tTop, Y.tl, topTxt, 1);
      tagRect(tBot, Y.bl);
      if (qA < 1) tagText(tBot, Y.bl, '?', 1 - qA);
      if (qA > 0) tagText(tBot, Y.bl, prodTxt, qA);
      REC.tagTop = topTxt; REC.tagBot = qA >= 1 ? prodTxt : '?'; REC.curX = xc;
      REC.boxes.push(tTop, tBot);
      said.push('The cursor sits on ' + say(topTxt) + ' on the top ruler, and the bottom ruler reads ' + (qA >= 1 ? say(prodTxt) : 'an unknown number') + ' under it.');
    }
    return said.join(' ');
  }

  // ---------- the drag: the top ruler slides, the cursor moves ----------
  const grip = ui.appendChild(K.svg('rect', { class: 'grip', x: 0, y: 12, width: 340, height: 96, 'aria-hidden': 'true' }));
  grip.style.display = 'none';
  const gripLive = () => !finished && STEPS[at()].show && !!STEPS[at()].live;
  function svgPt(e) {
    const ctm = svg.getScreenCTM();
    if (!ctm) return null;
    return new DOMPoint(e.clientX, e.clientY).matrixTransform(ctm.inverse());
  }
  // A finger at x puts the cursor on the top ruler's number there; a slide by dx moves the top
  // ruler's 1 by dx along, both landing on the controls' steps of 0.1.
  const cursorFrom = (x, ls) => grid(Math.pow(10, fromX(x) - ls));
  const slideFrom = (ls0, x0, x) => grid(Math.pow(10, ls0 + (x - x0) / U));
  function setVals(s, c) {
    const st = S[at()];
    if (st.live && T === Infinity && (s == null || s === slideCtl.get()) && (c == null || c === cursorCtl.get())) return;
    if (anim.playing()) anim.pause();
    T = Infinity; st.live = true;
    if (s != null) slideCtl.set(s, true);
    if (c != null) cursorCtl.set(c, true);
    K.reveal();
  }
  function dragTo(p) {
    if (!held || !p) return;
    if (held.mode === 'cursor') setVals(null, cursorFrom(p.x, LG(slideCtl.get())));
    else setVals(slideFrom(held.ls0, held.x0, p.x), null);
  }
  grip.addEventListener('pointerdown', (e) => {
    if (!gripLive()) return;
    const p = svgPt(e);
    if (!p) return;
    const ls = REC && REC.s != null ? REC.ls : LG(slideCtl.get()), xc = X(ls + (REC && REC.s != null ? REC.lc : LG(cursorCtl.get())));
    held = { id: e.pointerId, mode: Math.abs(p.x - xc) <= 22 || p.y > Y.mid ? 'cursor' : 'slide', x0: p.x, ls0: LG(grid(Math.pow(10, ls))) };
    try { grip.setPointerCapture(e.pointerId); } catch (err) { /* the drag still follows the finger while it stays on the rulers */ }
    if (held.mode === 'cursor') dragTo(p);
    else setVals(grid(Math.pow(10, held.ls0)), null);
  });
  grip.addEventListener('pointermove', (e) => { if (held && held.id === e.pointerId && gripLive()) dragTo(svgPt(e)); });
  const letGo = (e) => { if (held && held.id === e.pointerId) { held = null; K.refresh(); } };
  grip.addEventListener('pointerup', letGo);
  grip.addEventListener('pointercancel', letGo);
  grip.addEventListener('lostpointercapture', () => { if (held) { held = null; K.refresh(); } });
  function placeGrip(d) { grip.style.display = d.show && d.live && !finished ? '' : 'none'; }

  // ---------- one paint: the scene and the forms under it ----------
  const el = (id) => document.getElementById(id);
  function writeForms(lines, a) {
    const f = el('forms');
    f.textContent = '';
    (lines || []).forEach((s) => { if (s) formula(f.appendChild(K.el('span', { class: 'fl' })), s); });
    K.fade(f, a, 0);
    REC.forms = a > 0 ? (lines || []).slice() : [];
  }
  function paint(i, P) {
    if (i == null) i = at();
    if (!P) P = cur();
    const d = STEPS[i], st = S[i];
    art.textContent = '';
    into = null;
    REC = { s: null, c: null, ls: 0, lc: 0, top: [], bot: [], tagTop: null, tagBot: null, curX: null, idx: null, ask: null, db: null, sum: null,
      bars: [], brackets: [], rings: [], notes: [], texts2: [], boxes: [], forms: [] };
    svg.setAttribute('viewBox', '0 0 340 ' + d.H);
    const said = drawRule(d, st, P);
    let lines, fa = 1;
    if (d.show && d.live && st.live) lines = liveForms(d.mode, P.slide, P.cursor);
    else if (d.show && d.live) { lines = liveForms(d.mode, d.end.s, d.end.c); fa = A(st, d.formsAt, K.SOFT); }
    else if (d.show) { lines = d.forms; fa = A(st, d.formsAt, K.SOFT); }
    else if (st.res === 'right') { lines = d.forms.right; fa = arr(0.9, K.SOFT); }
    else lines = d.forms.before;
    writeForms(lines, fa);
    placeGrip(d);
    svg.setAttribute('aria-label', said);
  }

  // The model the lesson reads: the bottom ruler under the cursor, the two lengths added, and
  // the same reading in decibels.
  K.model((p) => {
    const len = LG(p.slide) + LG(p.cursor);
    return { product: Math.pow(10, len), lengths: len, decibels: 10 * len };
  });

  write(el('finish'), FINISH);
  write(el('cap'), CAPTION);
  K.update(() => {
    const i = at(), d = STEPS[i], st = S[i];
    if (!anim.playing()) T = Infinity;   // motion that was stopped (the page hidden, a test) shows finished
    if (i !== lastStep) {
      lastStep = i; enter('stepbox');
      openStep(i);
      if (d.show) play(d.dur); else { anim.pause(); T = Infinity; }
    } else if (d.show && d.live) {
      const P = cur();
      if (P.slide !== lastS || P.cursor !== lastC) {
        // a drag, a slider or a test moved: the demonstration gives way to Dan's setting
        // (on the dividing screen a moved top ruler keeps the cursor on its bottom-ruler number)
        if (d.mode === 'div') {
          if (P.cursor !== lastC) st.pin = P.slide * P.cursor;
          else { if (st.pin == null) st.pin = lastS * lastC; cursorCtl.set(grid(st.pin / P.slide), true); }
        }
        st.live = true;
        if (anim.playing()) anim.pause();
        T = Infinity;
      }
    }
    if (finished !== lastDone) { lastDone = finished; enter(finished ? 'done' : 'stepbox'); }
    const right = st.res === 'right';
    el('stepbox').hidden = finished;
    el('done').hidden = !finished;
    el('count').textContent = 'Step ' + (i + 1) + ' of ' + STEPS.length;
    const task = el('task');
    task.className = 'task' + (d.show ? ' show' : '');
    write(task, d.show ? d.text : d.task);
    const ctl = el('ctl'), ctlWas = ctl.hidden;
    ctl.hidden = finished || !(d.show && d.live);
    if (ctlWas && !ctl.hidden) [slideCtl, cursorCtl].forEach((c) => { if (typeof c.fit === 'function') c.fit(); });
    paint(i);
    syncCtl(i);
    remember();

    replayBtn.el.hidden = !d.show || REDUCE;
    el('replay').hidden = replayBtn.el.hidden;
    const opts = d.show ? [] : d.opts || [];
    el('picks').hidden = !opts.length;
    el('picks').classList.toggle('long', opts.some((o) => o.length > 6));
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      b.setLabel(opts[k]);
      b.el.textContent = '';
      b.el.appendChild(K.el('span', null, opts[k]));   // one span, so the button's gap does not split an answer
      b.el.setAttribute('aria-label', say(opts[k]));
      b.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });

    el('acts').hidden = !!d.show;
    checkBtn.el.hidden = right;
    const fb = el('fb');
    fb.hidden = !!d.show;
    fb.className = 'fb' + (right ? ' right' : st.res === 'wrong' ? ' wrong' : '');
    write(fb, d.show ? '' : right ? 'That\'s it.' : st.res === 'wrong' ? hintFor(i, st) : st.res === 'empty' ? 'Tap one of the answers.' : '');

    const why = el('why');
    why.hidden = d.show || !st.why;
    write(why, d.show ? '' : d.why);
    whyBtn.setLabel(st.why ? 'Hide why' : 'Why?');

    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !right);
    nextBtn.setLabel(i === STEPS.length - 1 ? 'Finish' : 'Continue');
    nav.hidden = backBtn.el.hidden && nextBtn.el.hidden;
  });

  // ---------- known answers, worked out by hand ----------
  const idx = (name) => STEPS.findIndex((d) => d.name === name);
  const PICKS = STEPS.map((d, i) => i).filter((i) => !STEPS[i].show);
  const solvedSt = (i) => Object.assign(blank(), { pick: STEPS[i].want, res: 'right' });
  const wrongSt = (i, o) => Object.assign(blank(), { pick: o, res: 'wrong' });
  const liveSt = () => Object.assign(blank(), { live: true });
  const close = (a, b, tol) => Math.abs(a - b) <= (tol != null ? tol : 1e-9 * Math.max(1, Math.abs(a), Math.abs(b)));
  // A step painted in the state and settings given (finished, or t seconds into its motion): what it draws.
  function drawn(i, st, P, t) {
    const keepS = S[i], keepT = T;
    S[i] = st; T = t == null ? Infinity : t;
    try {
      paint(i, P || openP(i));
      return { texts: Array.from(art.querySelectorAll('text')).map((q) => q.textContent), rec: REC };
    } finally { S[i] = keepS; T = keepT; }
  }
  // Every check repaints the screen Dan is on when it is done.
  const chk = (label, fn, opt) => K.check(label, () => { try { return fn(); } finally { paint(); } }, opt);
  const TRY_S = [1, 1.5, 2, 2.3, 4, 7.7, 10], TRY_C = [1, 3, 4.7, 9.9, 10];

  chk('The logarithm of a product is the sum of the logs of its factors: at every setting tried, the two lengths add to the log of the bottom ruler\'s reading, which is the slide\'s number times the cursor\'s, and the tags and the forms on the multiplying screen say so', () => {
    const i = idx('Two power rulers');
    return TRY_S.every((s) => TRY_C.every((c) => {
      const o = K.at({ slide: s, cursor: c }), g = drawn(i, liveSt(), { slide: s, cursor: c }).rec;
      return close(o.lengths, LG(s) + LG(c), 1e-12) && close(o.product, s * c, 1e-9 * s * c) && close(o.decibels, 10 * LG(s * c), 1e-9) &&
        g.tagBot === fP(s * c) && g.tagTop === fs(c) && g.forms[0] === 'log ' + fs(s) + ' + log ' + fs(c) + ' = log ' + fP(s * c);
    }));
  }, { source: SRC1 });
  chk('Normal multiplication becomes addition in the log system, and division becomes subtraction: on the dividing screen the whole length less the cursor\'s length leaves the slide\'s, and the forms read the quotient where the top ruler starts, at every setting tried', () => {
    const i = idx('Slide back to divide');
    return TRY_S.every((s) => TRY_C.every((c) => {
      const g = drawn(i, liveSt(), { slide: s, cursor: c }).rec, P = s * c;
      return g.forms[0] === 'log ' + fP(P) + ' − log ' + fs(c) + ' = log ' + fs(s) && close(LG(P) - LG(c), LG(s), 1e-12) && close(P / c, s, 1e-12) &&
        close(X(g.ls), X(LG(P)) - (X(LG(c)) - X(0)), 1e-9);
    }));
  }, { source: SRC2 });
  chk('Powers and roots become multiplication and division: three lengths of log two laid end to end land on eight, and log five divided by log two is the power of two that makes five', () => {
    const g = drawn(idx('Powers'), blank()).rec, end = Math.max.apply(null, g.bars.map((b) => b.a1));
    return close(3 * L2, L8, 1e-12) && close(end, L8, 1e-9) && g.tagBot === '8' && close(Math.pow(2, L5 / L2), 5, 1e-12) && fp(L5 / L2) === '2.322' &&
      drawn(idx('Counting lengths'), blank()).rec.texts2.indexOf('0.699 ÷ 0.301 ≈ 2.322 lengths of log 2') >= 0;
  }, { source: SRC2 });
  chk('The opening demonstration ends with the top ruler\'s 1 over 2 and the cursor on 3, reading 6 below, with lengths 0.301 and 0.477 end to end adding to 0.778, while log 5 is only 0.699', () => {
    const g = drawn(0, blank()).rec, labels = g.bars.filter((b) => b.shown).map((b) => b.text);
    return close(g.s, 2, 1e-9) && close(g.c, 3, 1e-9) && g.tagTop === '3' && g.tagBot === '6' && labels.join('|') === '0.301|0.477' &&
      g.sum === '0.778' && fp(L5) === '0.699' && close(g.curX, X(L2 + L3), 1e-9);
  });
  chk('Each ruler\'s numbers sit where the rule puts them: the top ruler\'s 1, 2, 3, 4, 5 and 10 move with the slide, the bottom ruler\'s 1 to 5, 10, 20, 30 and 100 stay put with 100 two × 10 spaces along, and the decibel scale puts 0, 10 and 20 dB at 1, 10 and 100', () => {
    const ok = [[1, 1], [2.3, 4.7], [10, 1]].every((q) => {
      const g = drawn(0, liveSt(), { slide: q[0], cursor: q[1] }).rec;
      return g.top.length === 6 && g.bot.length === 9 && g.top.every((t) => close(t.x, X(LG(q[0]) + LG(t.n)), 1e-6)) && g.bot.every((b) => close(b.x, X(LG(b.n)), 1e-6));
    });
    const gd = drawn(idx('Decibels'), blank()).rec;
    return ok && X(LG(100)) === X(2) && !!gd.db && gd.db.map((q) => q.text).join('|') === '0 dB|10 dB|20 dB' && gd.db.every((q) => close(q.x, X(LG(Math.pow(10, q.v / 10))), 1e-9));
  });
  chk('Ten times the log gives decibels: × 2 is 3.0 dB, × 10 is 10.0 dB and × 20 is 13.0 dB, so stages of × 2 and × 10 add to 13.0 dB as the demonstration ends; half the power is −3.0 dB, and 5 dB sits at √10 ≈ 3.16', () => {
    const g = drawn(idx('Decibels'), blank()).rec;
    return fd(10 * L2) === '3.0' && fd(10 * LG(10)) === '10.0' && fd(10 * L20) === '13.0' && close(10 * L2 + 10 * LG(10), 10 * L20, 1e-9) &&
      fd(10 * LG(0.5)) === '−3.0' && fP(Math.sqrt(10)) === '3.16' && close(K.at({ slide: 2, cursor: 10 }).decibels, 10 * L20, 1e-9) &&
      g.sum === '13.0 dB' && g.tagBot === '20' && g.bars.filter((b) => b.shown).map((b) => b.text).join('|') === '3.0 dB|10.0 dB';
  }, { source: SRC3 });
  chk('Every number follows its rule: 4 × 5 = 20 at 1.301 and 9 at 0.954; log 21 ≈ 1.322; 0.903 − 0.301 = 0.602 for 4; 6 at 0.778 and 16 at 1.204; 2 × 0.699 = 1.398, and (log 5)² ≈ 0.489 at 3.08; log 2.5 ≈ 0.398; 0.699 ÷ 0.301 ≈ 2.322 and 2^2.322 ≈ 5; 5.5 at 7.4 dB and 5 at 7.0 dB; 6.0 + 7.0 = 13.0 dB and × 9 at 9.5 dB; 36 at 1.556 and 1.602 ÷ 0.602 ≈ 2.661; and each answer offered is the value its own working gives', () => {
    const ok = fp(L4 + L5) === '1.301' && fp(L9) === '0.954' && fp(L21) === '1.322' && fp(L8) === '0.903' && fp(L8 - L2) === '0.602' && thou(L8) - thou(L2) === thou(L4) &&
      fp(L6) === '0.778' && fp(LG(16)) === '1.204' && fp(2 * L5) === '1.398' && 2 * thou(L5) === thou(LG(25)) && fp(L5 * L5) === '0.489' && fP(Math.pow(10, L5 * L5)) === '3.08' &&
      fp(LG(2.5)) === '0.398' && fp(L5 / L2) === '2.322' && fp(0.699 / 0.301) === '2.322' && close(Math.pow(2, 2.322), 5, 0.001) &&
      fd(10 * LG(5.5)) === '7.4' && fd(10 * L5) === '7.0' && fd(10 * L4) === '6.0' && fd(10 * L4 + 10 * L5) === '13.0' && fd(10 * L9) === '9.5' &&
      fp(L36) === '1.556' && fp(L40) === '1.602' && fp(L40 / L4) === '2.661' && fd(10 * LG(3.16)) === '5.0' &&
      thou(L4) + thou(L5) === thou(L20) && thou(L2) + thou(L3) === thou(L6) && thou(L6) - thou(L3) === thou(L2) && 3 * thou(L2) === thou(L8);
    const answers = PICKS.every((i) => { const d = STEPS[i]; return d.opts.every((o) => !!d.work[o] && d.work[o][0] === d.work[o][1]); });
    return ok && answers;
  });
  const shows = (texts, ans) => texts.some((x) => x === ans || (x.indexOf(ans) === 0 && /\s/.test(x.charAt(ans.length))));
  chk('Before an answer, nothing in a puzzle\'s picture or forms gives it away, and a right answer shows it', () =>
    PICKS.every((i) => {
      const d = STEPS[i], b = drawn(i, blank()), r = drawn(i, solvedSt(i));
      return !shows(b.texts, d.ans) && !shows(b.rec.forms, d.ans) && (shows(r.texts, d.ans) || shows(r.rec.forms, d.ans));
    }));
  chk('Each puzzle offers three answers and takes only its right one, and every wrong answer has a hint of its own and draws its slip in red', () =>
    PICKS.every((i) => {
      const d = STEPS[i];
      return d.opts.length === 3 && d.opts.indexOf(d.want) >= 0 && d.opts.every((o) => isRight(i, Object.assign(blank(), { pick: o })) === (o === d.want)) &&
        d.opts.every((o) => o === d.want || (!!(d.hints && d.hints[o]) && drawn(i, wrongSt(i, o)).rec.notes.length > 0));
    }));
  chk('The drag maps the finger back to the same setting: the cursor\'s own place reads back its setting, a slide by a length moves the top ruler\'s 1 by that length, and every tag stays inside the drawing', () =>
    TRY_S.every((s) => TRY_C.every((c) => {
      const g = drawn(0, liveSt(), { slide: s, cursor: c }).rec;
      return cursorFrom(X(LG(s) + LG(c)), LG(s)) === c && slideFrom(0, X(0), X(LG(s))) === s && close(g.curX, X(LG(s) + LG(c)), 1e-9) &&
        g.boxes.every((b) => b[0] >= 2 && b[1] <= 338);
    })));
  chk('With the top ruler\'s 1 over the bottom ruler\'s 1 both rulers read alike, so the bottom number is the cursor\'s own; with both at 10 the cursor reaches 100, the bottom ruler\'s right-hand end', () => {
    const g = drawn(0, liveSt(), { slide: 10, cursor: 10 }).rec;
    return [1, 2.5, 7.3, 10].every((c) => close(K.at({ slide: 1, cursor: c }).product, c, 1e-9 * c)) &&
      close(K.at({ slide: 10, cursor: 10 }).product, 100, 1e-9) && close(K.at({ slide: 10, cursor: 10 }).lengths, 2, 1e-12) &&
      g.tagBot === '100' && close(g.curX, X(2), 1e-9) && K.at({ slide: 1, cursor: 1 }).lengths === 0;
  });
  chk('Every demonstration has finished arriving within its time (3 to 4.5 s), none starting before the 0.35 s screen fade ends; every answer\'s motion, right or wrong, within 2.5 s', () => {
    const keepT = T;
    const timed = (i, st, limit) => {
      const keepS = S[i];
      T = Infinity; latest = 0; earliest = Infinity;
      S[i] = st;
      try { paint(i, openP(i)); } finally { S[i] = keepS; }
      return latest <= limit + 1e-9;
    };
    const ok = STEPS.every((d, i) => {
      if (d.show) { const r = timed(i, blank(), d.dur); return r && d.dur <= 4.5 && d.dur >= 3 && earliest >= FADE; }
      return timed(i, solvedSt(i), FB[0]) && FB[0] <= 2.5 && d.opts.filter((o) => o !== d.want).every((o) => timed(i, wrongSt(i, o), FB[1]) && FB[1] <= 2.5);
    });
    T = keepT;
    return ok;
  });

  K.ready();
</script>
