<script>
  // ---------- the rule ----------
  // Every curve here is a gap shrinking towards a line. With n the time counted in time constants
  // (t ÷ RC), the value is line + (start − line) × e^(−n), so in each τ the gap keeps e^(−1) ≈ 0.368
  // of itself. Discharging: the line is 0 V and the start the charged voltage. Charging: the line is
  // the supply and the start 0 V, so v = V(1 − e^(−t/RC)). Cooling: the line is the room.
  const E1 = Math.exp(-1);
  const val = (s, n) => s.line + (s.start - s.line) * Math.exp(-n);
  const gapOf = (s, n) => Math.abs(s.start - s.line) * Math.exp(-n);
  const rcOf = (R, C) => (Math.round(R) * Math.round(C)) / 1000;   // kΩ × µF: 1,000 Ω × 0.000001 F, so ÷ 1,000 for seconds
  // Sources the checks restate (the lesson's own).
  const SRC1 = 'https://courses.lumenlearning.com/atd-austincc-physics2/chapter/21-6-dc-circuits-containing-resistors-and-capacitors/';
  const SRC2 = 'https://openstax.org/books/calculus-volume-1/pages/6-8-exponential-growth-and-decay';
  const SRC3 = 'https://physics.iitd.ac.in/uploads/manual_leiBQt035s.pdf';
  const SRC4 = 'https://www.math.uwaterloo.ca/~baforres/UCM138/Lectures/Chapter4/SLIDESNewtonsLaw.pdf';

  // ---------- numbers ----------
  // fx: exactly dp decimals; fv: at most dp, trailing zeros dropped. Commas, a true minus sign.
  function fx(v, dp) {
    const f = Math.pow(10, dp);
    let r = Math.round(v * f) / f;
    if (r === 0) r = 0;
    const p = Math.abs(r).toFixed(dp).split('.');
    p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (r < 0 ? '−' : '') + p.join('.');
  }
  function fv(v, dp) {
    if (dp == null) dp = 2;
    const s = fx(v, dp);
    return dp > 0 ? s.replace(/(\.\d*?)0+$/, '$1').replace(/\.$/, '') : s;
  }
  // Each written the way the lesson writes it: volts to the hundredth on a 10 V or 5 V scale,
  // whole volts from 400 V (tenths below 10 V), temperatures to a tenth.
  const V2 = (v) => (Math.abs(v) < 0.005 ? '0' : fx(v, 2)) + ' V';
  const V400 = (v) => (v >= 10 ? fx(v, 0) : fv(v, 1)) + ' V';
  const C1 = (v) => fx(v, 1) + ' °C';
  const pct = (v) => fx(v, 1) + '%';
  const secT = (v) => fv(v, v < 1 ? 2 : 1) + ' s';
  const mins = (v) => fv(v, 1) + ' min';
  const f3 = (v) => fx(v, 3);

  // ---------- the three cases ----------
  const BASE = {
    dis: { k: 'dis', start: 10, line: 0, ymax: 11, yt: [0, 5, 10], unit: 'V', yname: 'volts', curve: 'voltage', fmt: V2 },
    chg: { k: 'chg', start: 0, line: 10, ymax: 11, yt: [0, 5, 10], unit: 'V', yname: 'volts', curve: 'voltage', fmt: V2 },
    cool: { k: 'cool', start: 90, line: 20, rc: 600, ymax: 100, yt: [0, 50, 100], unit: '°C', yname: '°C', curve: 'temperature', fmt: C1 },
  };
  const mk = (k, o) => Object.assign({}, BASE[k], o || {});
  const OPT = ['Discharging', 'Charging', 'Cooling'];
  const KIND = { Discharging: 'dis', Charging: 'chg', Cooling: 'cool' };
  // A demonstration screen follows the switch and the R and C sliders; a puzzle keeps its own case.
  function scenOf(d, mode, R, C) {
    if (!d.show) return d.sc;
    const k = KIND[mode] || 'dis';
    const s = Object.assign({}, BASE[k], (d.over && d.over[k]) || {});
    if (s.rc == null) s.rc = rcOf(R, C);
    s.pct = !!(d.pct && k === 'chg');
    return s;
  }
  const secText = (s, k) => (s.k === 'cool' ? mins((k * s.rc) / 60) : secT(k * s.rc));
  const SC = {
    d10: mk('dis', { rc: 47 }),
    d400: mk('dis', { start: 400, rc: 20, ymax: 440, yt: [0, 200, 400], fmt: V400 }),
    c10: mk('chg', { rc: 47 }),
    d400b: mk('dis', { start: 400, rc: 47, ymax: 440, yt: [0, 200, 400], fmt: V400 }),
    cool: mk('cool'),
    c5: mk('chg', { line: 5, rc: 47, ymax: 5.5, yt: [0, 1, 2, 3, 4, 5] }),
    share: mk('dis', { start: 1, rc: 10, ymax: 1.1, yt: [0, 0.5, 1], fmt: f3, yname: 'share of the start', curve: 'share left' }),
    oil: mk('cool', { start: 80, line: 30, rc: 1200 }),
  };
  const T100 = 100 / 47;   // 100 s counted in time constants of 47 s
  const R632 = Number(f3(1 - E1));   // 0.632, as the lesson rounds it

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // SHOW: mode0, the switch's setting on arrival; time0, where the handle ends its demonstration;
  // glide, the handle's demonstration (from, the stops, when it starts, the gap between stops, how
  // long each move takes); pen, the curve drawn by a pen; refAt, startAt, gapAt, when the line, the
  // starting gap and its label arrive; morph, the discharge curve flipped and lifted into the charge;
  // switch, sliders, the controls shown; sym, the rule's letters labelled on the picture.
  // DO: sc, the puzzle's case; graph, its time axis (tmax, ticks [time, τ row, seconds row]) and
  // header; items, what it draws (when: 'right' after a right answer, or the wrong answer whose slip
  // it draws; at, when it arrives; dur, a pen's time). opts, the answers offered; val, the value each
  // gives by its own working; ans, the words that would give the answer away; fmt, how they are written.
  const PICK = 'Tap one of the answers.';
  const G3 = (sec) => [[0, '0', ''], [1, '1τ', sec[0]], [2, '2τ', sec[1]], [3, '3τ', sec[2]]];
  const STEPS = [
    { show: true, name: 'One time constant', mode0: 'Discharging', time0: 3, dur: 4.3,
      pen: { at: 0.4, dur: 1.0 }, startAt: 0.4, slope: 'handle', slopeAt: 1.4, glide: { from: 0, stops: [1, 2, 3], t0: 1.6, gap: 0.8, dur: 0.55 },
      text: 'A capacitor charged to 10 V empties through a resistor. The current is the voltage left ÷ R, so the fall slows as the voltage does; the dashed line is its pace now. The bar is the gap still to close. In one *time constant*, written τ, it keeps 0.368 of itself. Here `τ = R × C = 47 s`, so 10 V becomes 3.68 V at 1τ, 1.35 V at 2τ and 0.50 V at 3τ. Drag the time handle.' },
    { kind: 'pick', name: 'Two time constants', sc: SC.d10,
      graph: { tmax: 3, ticks: G3(['47 s', '94 s', '141 s']), header: 'RC = 47 s' },
      items: [
        { k: 'bar', t: 0 },
        { k: 'curve', from: 0, to: 1 },
        { k: 'bar', t: 1 },
        { k: 'mark', t: 1, text: V2(10 * E1), dot: 'dot' },
        { k: 'pill', t0: 0, t1: 1 },
        { k: 'q', t: 2 },
        { k: 'curve', from: 1, to: 2, when: 'right', at: 0.1, dur: 0.8 },
        { k: 'bar', t: 2, cur: true, when: 'right', at: 0.9 },
        { k: 'mark', t: 2, text: V2(10 * Math.exp(-2)), dot: 'ring', when: 'right', at: 1.0 },
        { k: 'pill', t0: 1, t1: 2, when: 'right', at: 1.1 },
        { k: 'seg', pts: [[1, 10 * E1], [1 + (10 * E1) / (10 - 10 * E1), 0], [2, 0]], cls: 'slip', when: '0 V', at: 0.3, dur: 0.6 },
        { k: 'mark', t: 2, v: 0, text: '0 V', cls: 'slip', dot: 'ring', when: '0 V', at: 0.6 },
        { k: 'seg', pts: [[1, 10 * E1], [2, 5 * E1]], cls: 'slip', when: '1.84 V', at: 0.3, dur: 0.6 },
        { k: 'mark', t: 2, v: 5 * E1, text: '1.84 V', cls: 'slip', dot: 'ring', when: '1.84 V', at: 0.6 },
      ],
      opts: ['0 V', '1.35 V', '1.84 V'], want: '1.35 V', ans: '1.35 V', fmt: V2,
      val: { '0 V': Math.max(0, 10 * E1 - (10 - 10 * E1)), '1.35 V': 10 * Math.exp(-2), '1.84 V': (10 * E1) / 2 },
      task: 'After one time constant the capacitor is at 3.68 V. What is it after two?',
      why: 'The second time constant takes the same share as the first, so the bar keeps 0.368 of what is left, `3.68 × 0.368 ≈ 1.35 V`. That is `10 × e^(−2)`. Equal stretches of time take the same share, not the same number of volts.',
      hint: 'Not quite. Each τ keeps 0.368 of what is left.',
      hints: { '0 V': 'Not quite. That takes the same 6.32 V off again, which would empty it. Each τ keeps 0.368 of what is left.',
        '1.84 V': 'Not quite. That halves 3.68 V. Each τ keeps 0.368 of what is left, not half.' } },
    { show: true, name: 'R and C set the pace', mode0: 'Discharging', time0: 3, dur: 3.0, sliders: true, rcForm: true, sym: true,
      extras: { start: 0.4, p30: 1.0 }, slope: 0, slopeAt: 0.6,
      text: 'A bigger R lets less current through, and a bigger C must lose more charge for each volt. Together the voltage falls at `v ÷ RC` volts a second. The dashed line is the starting pace, `10 V ÷ 47 s`: kept up, it would empty the capacitor in exactly one RC. It slows as it falls, so it only gets to 0.368. That is why RC is the unit of time. As a rule, `v = V e^(−t/RC)`. After 30 s, `e^(−30/47) ≈ 0.528`, so 5.28 V. Slide R and C.' },
    { kind: 'pick', name: '400 V after 10 s', sc: SC.d400,
      graph: { tmax: 2, ticks: [[0, '0', ''], [0.5, '', '10 s'], [1, '1τ', '20 s'], [2, '2τ', '40 s']], header: 'RC = 20 s' },
      items: [
        { k: 'bar', t: 0 },

        { k: 'q', t: 0.5 },
        { k: 'curve', from: 0, to: 2, when: 'right', at: 0.1, dur: 1.0 },
        { k: 'bar', t: 0.5, cur: true, when: 'right', at: 0.7 },
        { k: 'mark', t: 0.5, text: V400(400 * Math.exp(-0.5)), dot: 'ring', when: 'right', at: 0.8 },
        { k: 'fn', fn: (t) => 400 * Math.exp(t), from: 0, to: 0.5, cls: 'slip', when: '659 V', at: 0.3, dur: 0.6 },
        { k: 'mark', t: 0.5, v: 400 * Math.exp(0.5), text: '659 V', cls: 'slip', dot: 'ring', prefs: ['r', 'ar'], when: '659 V', at: 0.6 },
        { k: 'fn', fn: (t) => 400 * Math.exp(-400 * t), from: 0, to: 0.5, cls: 'slip', when: '0 V', at: 0.3, dur: 0.6 },
        { k: 'mark', t: 0.5, v: 0, text: '0 V', cls: 'slip', dot: 'ring', when: '0 V', at: 0.6 },
      ],
      slipMax: { '659 V': 700 },
      opts: ['243 V', '659 V', '0 V'], want: '243 V', ans: '243 V', fmt: V400,
      val: { '243 V': 400 * Math.exp(-10 / 20), '659 V': 400 * Math.exp(10 / 20), '0 V': 400 * Math.exp(-10 * 20) },
      task: 'A 400 V capacitor empties through a resistor, with RC = 20 s. What is its voltage after 10 s?',
      why: 'Count the time in time constants first, `10 ÷ 20 = 0.5`. Then `400 × e^(−0.5)` ≈ 243 V on the eˣ key. Half a time constant has not yet brought it down to 0.368 of the start.',
      hint: 'Not quite. Divide the time by RC, then use the eˣ key.',
      hints: { '659 V': 'Not quite. That drops the minus, so the power grows and the voltage rises. The power is −10 ÷ 20.',
        '0 V': 'Not quite. That puts 10 × 20 = 200 in the power. Divide the time by RC instead, 10 ÷ 20.' } },
    { show: true, name: 'Charging', mode0: 'Charging', time0: 3, dur: 4.4, switch: true, sliders: true, rcForm: true, sym: true,
      refAt: 0.4, morph: { from: 'Discharging', at: 0.9, dur: 1.1 }, slope: 'handle', slopeAt: 2.0, glide: { from: 0, stops: [1, 2, 3], t0: 2.1, gap: 0.7, dur: 0.5 },
      text: 'Now charge it from a 10 V supply. The charging current is the gap up to the supply ÷ R, so that gap shrinks just as the discharge voltage did, keeping 0.368 of itself each τ. So each τ closes 0.632 of the gap left: 6.32 V at 1τ, 8.65 V at 2τ and 9.50 V at 3τ. The curve is the discharge flipped and lifted, `v = V(1 − e^(−t/RC))`. Flip the switch: the bars stay the same.' },
    { kind: 'pick', name: 'Charging, two time constants', sc: SC.c10,
      graph: { tmax: 3, ticks: G3(['47 s', '94 s', '141 s']), header: 'RC = 47 s' },
      items: [
        { k: 'ref' },
        { k: 'bar', t: 0 },
        { k: 'curve', from: 0, to: 1 },
        { k: 'bar', t: 1 },
        { k: 'mark', t: 1, text: V2(10 * (1 - E1)), dot: 'dot' },
        { k: 'pill', t0: 0, t1: 1 },

        { k: 'bar', t: 2, cur: true, when: 'right', at: 0.9 },
        { k: 'mark', t: 2, text: V2(10 * (1 - Math.exp(-2))), dot: 'ring', when: 'right', at: 1.0 },

      ],
      slipMax: { '12.64 V': 14 },
      opts: ['12.64 V', '8.65 V', '3.99 V'], want: '8.65 V', ans: '8.65 V', fmt: V2,
      val: { '12.64 V': 2 * 10 * (1 - E1), '8.65 V': 10 * (1 - Math.exp(-2)), '3.99 V': 10 * R632 * R632 },
      task: 'Charging from a 10 V supply, the capacitor is at 6.32 V after one time constant. What is it after two?',
      why: 'The gap to the supply keeps 0.368 of itself each τ, so it goes 10 V, then 3.68 V, then 1.35 V. The capacitor is at `10 − 1.35 = 8.65 V`, 86.5% charged. The second τ closes 0.632 of a smaller gap.',

      hints: { '12.64 V': 'Not quite. Twice 63.2% is 126.4%, more than full. The second τ closes 0.632 of the smaller gap that is left.',

    { show: true, name: 'Never quite full', mode0: 'Charging', time0: 5, dur: 3.4, switch: true, sliders: true, rcForm: true, pct: true, top: 50,

      over: { dis: { start: 400, ymax: 440, yt: [0, 200, 400], fmt: V400 } },
      text: 'At 4τ the gap left is `0.368^4 ≈ 0.018` of the start, so it is 98.2% charged. At 5τ it is `0.368^5 ≈ 0.007`, so 99.3%. By the rule the gap only ever shrinks, so it is never quite full. A trade tutorial counts 5τ as fully charged: a line people draw, not a point the curve reaches. The magnifier shows the 0.07 V still to go. Switch to discharging to see it from 400 V.' },

  chk('Each puzzle offers three answers and takes only its right one, and every wrong answer has a hint of its own', () =>
    PICKS.every((i) => {
      const d = STEPS[i];
      return d.opts.length === 3 && d.opts.indexOf(d.want) >= 0 && d.opts.every((o) => isRight(i, Object.assign(blank(), { pick: o })) === (o === d.want)) &&
        d.opts.every((o) => o === d.want || !!(d.hints && d.hints[o]));
    }));
  chk('Every demonstration has finished arriving within its time (at most 4.5 s), none starting before the 0.35 s screen fade ends; every answer\'s motion, right or wrong, within 2.5 s', () => {
    const keepT = T;
    const timed = (i, st, limit) => {
      const keepS = S[i];
      T = Infinity; latest = 0; earliest = Infinity;
      S[i] = st;
      try { paint(i, openP(i)); } finally { S[i] = keepS; }
      return latest <= limit + 1e-9;
    };
    const ok = STEPS.every((d, i) => {
      if (d.show) { const r = timed(i, blank(), d.dur); return r && d.dur <= 4.5 && d.dur >= 3 && earliest >= FADE; }
      return timed(i, solvedSt(i), FB[0]) && FB[0] <= 2.5 && d.opts.filter((o) => o !== d.want).every((o) => timed(i, wrongSt(i, o), FB[1]) && FB[1] <= 2.5);
    });
    T = keepT;
    return ok;
  });

  K.ready();
</script>
