<script>
  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // bars: columns over the same equal steps (cols), each starting at A; 'add' adds d a step, 'mul'
  // multiplies by b. n: the last bar there at first; N: the last slot; run: how far a right answer
  // runs on; ask: the column whose bar at run is asked for; at: a demonstration's timetable (seconds
  // from the screen opening) for each bar, which grows from the bar before. vlab / rlab: which bars
  // carry their value and their rise (vlabRun / rlabRun once the answer has run on); else all that fit.
  // graph: dots at whole steps 0 to n, the step along the bottom and the value up the side; drop: the
  // dots fall from the bars above. A puzzle: opts, the answers offered; val, the value each one gives;
  // ans, the words that would give the answer away before Check.
  const PICK = 'Tap one of the answers.';
  const KEY_RISE = ['rise', 'rise since the bar before'];
  const KEY_LOST = ['lost', 'lost since the bar before'];
  const STEPS = [
    { show: true, name: 'Add or double', dur: 4.0, key: [KEY_RISE],
      bars: { cols: ['add', 'mul'], A: 1, d: 2, b: 2, n: 4, N: 4, h: 120, at: [null, 0.5, 1.3, 2.1, 2.9] },
      text: 'Both columns start at 1. The left adds 2 each step: 1, 3, 5, 7, 9. The right multiplies by 2: 1, 2, 4, 8, 16. That is *exponential* change, the same *growth factor* each equal step. The highlighted tops are the rises: 2 every time on the left, growing on the right, because each doubling adds as much as is there. So it starts behind, then passes at step 3.' },
    { kind: 'pick', name: 'Guess step 10', key: [KEY_RISE], whyAfter: true,
      bars: { cols: ['add', 'mul'], A: 1, d: 2, b: 2, n: 4, N: 10, run: 10, ask: 'mul', gap: 0.15, h: 120, slip: false,
        xl: (k) => (k % 2 ? '' : String(k)), vlab: [0, 4], rlab: [4], vlabRun: [0, 4, 10], rlabRun: [4, 10] },
      opts: ['64', '1,024', '21'], want: '1,024', ans: '1,024',
      task: 'Keep both columns going to step 10. The left one will read `1 + 10 × 2 = 21`. Guess first: what will the doubling column read?',
      why: 'Ten steps make ten doublings, so the right column reads 1 doubled 10 times, 1,024. Its last rise alone is 512, while the left column still rises by 2 a step.',
      hint: 'Not quite. Keep doubling 16 until step 10.',
      hints: { '21': 'Not quite. That is the adding column. Each doubling adds as much as is there, so the rises keep growing.',
        '64': 'Not quite. That keeps adding the last rise, 8. The rises keep doubling: 16, 32 and on.' } },
    { show: true, name: 'Dots on a graph', dur: 3.6, sliders: true,
      key: [['rise', 'rise'], ['lost', 'lost'], ['add', 'adding'], ['mul', 'multiplying']],
      bars: { cols: ['add', 'mul'], A: 1, d: 2, b: 2, n: 5, N: 5, h: 76 },
      graph: { n: 5, ticks: [0, 1, 2, 3, 4, 5], xname: 'steps', yname: 'value', h: 116, series: 'bars', drop: { t0: 0.5, gap: 0.45 } },
      text: 'Each bar drops a dot onto the graph, its step along the bottom and its value up the side. The adding dots lie on a straight line, and the multiplying dots curve upwards. Write the start as `A` and the factor as `b`. After one step you have `A × b`, after two `A × b × b`, and after `x` steps `A × bˣ`. Slide the amount and the factor.' },
    { kind: 'pick', name: 'One step on', key: [KEY_RISE],
      bars: { cols: ['mul'], A: 48, b: 1.5, n: 0, N: 1, run: 1, ask: 'mul', h: 120, xl: ['now', 'one step on'] },
      opts: ['49.5', '96', '72'], want: '72', val: { '49.5': 48 + 1.5, '96': 48 * 2, '72': 48 * 1.5 }, ans: '72',
      task: 'A bar is 48, and each step multiplies it by 1.5. What is the bar one step on?',
      why: '× 1.5 keeps the whole 48 and adds half of it, 24. So the next bar is `48 × 1.5 = 72`. The rise is a share of the bar, so a bigger bar would rise by more.',
      hint: 'Not quite. Multiply the whole bar by 1.5.',
      hints: { '49.5': 'Not quite. That adds 1.5. A factor multiplies the whole bar.',
        '96': 'Not quite. That doubles it. × 1.5 keeps the whole and adds half.' } },
    { show: true, name: '5% a year', dur: 4.2, key: [['add', 'adding £50 a year'], ['mul', 'growing 5% a year']],
      bars: { cols: ['add', 'mul'], A: 1000, d: 50, b: 1.05, n: 10, N: 10, h: 80, prefix: '£', rises: false, vlab: [0, 10],
        xl: (k) => (k % 5 ? '' : String(k)), head: { add: '+ £50 each year', mul: '× 1.05 each year' } },
      graph: { n: 15, ticks: [0, 5, 10, 15], tl: ['0', '5', '10', '15 years'], yname: 'pounds', yprefix: '£', h: 130, ymax: 2800,
        yticks: [0, 500, 1000, 1500, 2000, 2500], series: 'bars', upto: 15, drop: { t0: 0.5, gap: 0.13 },
        line: { y: 2000, label: 'double, £2,000', pos: 'below', t: 2.9 },
        band: { x0: 14, x1: 15, label: 'doubles between years 14 and 15', t: 3.6 } },
      text: 'A percentage gives the factor. Growing 5% keeps the whole and adds 5%, so each year is × 1.05. Say a £1,000 pot grows 5% a year, beside one with £50 added each year. After 10 years it is `1,000 × 1.05¹⁰ ≈ £1,628.89` against £1,500, because each 5% is taken of a bigger amount. Run on, it doubles between years 14 and 15.' },
    { kind: 'pick', name: 'The factor for 5%', key: [KEY_RISE],
      bars: { cols: ['mul'], A: 1000, b: 1.05, n: 0, N: 1, run: 1, ask: 'mul', h: 120, prefix: '£', xl: ['year 0', 'year 1'], head: { mul: 'A year of 5% growth' } },
      opts: ['× 0.05', '× 1.05', '× 5'], want: '× 1.05', val: { '× 0.05': 1000 * 0.05, '× 1.05': 1000 * 1.05, '× 5': 1000 * 5 }, ans: '£1,050',
      task: 'A £1,000 pot grows 5% a year. What does each year multiply it by?',
      why: 'You keep the whole pot, 1, and add 5%, 0.05, so each year is `× 1.05`. £1,000 becomes £1,050 after one year.',
      hint: 'Not quite. Keep the whole, 1, and add 5%.',
      hints: { '× 0.05': 'Not quite. × 0.05 keeps only 5% of the pot. Keep the whole and add 5%.',
        '× 5': 'Not quite. × 5 makes it five times as big. 5% is 0.05 of the pot.' } },
    { show: true, name: 'Halving', dur: 4.0, key: [KEY_LOST],
      bars: { cols: ['mul'], A: 400, b: 0.5, n: 5, N: 5, h: 130, zero: '0 V', xl: (k) => 10 * k + ' s', head: { mul: 'Volts, × 0.5 every 10 s' },
        at: [null, 0.5, 1.1, 1.7, 2.3, 2.9] },
      text: 'A factor below 1 shrinks the bar each step, which is called *decay*. Say a capacitor starts at 400 V and halves every 10 seconds, × 0.5 a step: 400, 200, 100, 50, 25. Halving `x` times is `(1/2)ˣ`, which is `2⁻ˣ`, since `b⁻ˣ = (1/b)ˣ` as in Powers and roots. The drops shrink too, because each is half of what is left. Half of a positive amount is still positive, so the rule gets ever closer to 0 V but never reaches it.' },
    { kind: 'pick', name: 'Losing value', key: [KEY_LOST],
      bars: { cols: ['mul'], A: 8000, b: 0.75, n: 0, N: 2, run: 2, ask: 'mul', gap: 0.6, h: 120, prefix: '£', xl: ['year 0', 'year 1', 'year 2'], head: { mul: 'Losing 25% each year' } },
      opts: ['£4,000', '£4,500', '£500'], want: '£4,500', val: { '£4,000': 8000 - 2 * 2000, '£4,500': 8000 * 0.75 * 0.75, '£500': 8000 * 0.25 * 0.25 }, ans: '£4,500',
      task: 'An £8,000 machine loses 25% of its value each year. What is it worth after 2 years?',
      why: 'Losing 25% keeps 75%, so each year is × 0.75. `8,000 × 0.75 = 6,000`, then `6,000 × 0.75 = 4,500`. The second loss, £1,500, is smaller than the first, £2,000, because it is a share of less.',
      hint: 'Not quite. Losing 25% keeps 75% each year.',
      hints: { '£4,000': 'Not quite. That takes £2,000 off twice. The second year\'s 25% is of £6,000, so it takes less.',
        '£500': 'Not quite. × 0.25 keeps only 25%. Losing 25% keeps 75%, × 0.75.' } },
    { show: true, name: 'Between the steps', dur: 4.0, fill: true,
      key: [['mul', 'whole steps'], ['curve', 'the rule, 1 × 2ˣ'], ['chord', 'straight from dot to dot']],
      graph: { n: 3, ticks: [0, 1, 2, 3], xname: 'steps', yname: 'value', h: 170, ymax: 9, yticks: [0, 2, 4, 6, 8],
        series: [{ kind: 'mul', A: 1, b: 2, upto: 3 }], dotsAt: [0.5, 0.8, 1.1, 1.4], curve: true },
      text: 'The rule works between the steps too. Half a step multiplies by `√b`, because two half steps must make one whole step, so `b^(1/2) = √b`, as in Powers and roots. At × 2 that is `√2 ≈ 1.414`, and `1.414 × 1.414 ≈ 2`. So the curve bends, rather than running straight from dot to dot, and like every `bˣ` it passes through (0, 1) and (1, `b`). This is why `b` must be positive: half a step at × −2 would need `√−2`, and no ordinary number times itself gives −2.' },
    { kind: 'pick', name: 'Half a step', key: [['mul', 'whole steps'], ['curve', 'the rule, 100 × 9ˣ']],
      graph: { n: 1, ticks: [0, 0.5, 1], tl: ['0', '½', '1'], xname: 'steps', yname: 'value', h: 150, ymax: 1000, yticks: [0, 200, 400, 600, 800, 1000],
        series: [{ kind: 'mul', A: 100, b: 9, upto: 1 }], ask: 0.5, curve: true,
        dlab: [{ s: 0, k: 0, dx: 9, dy: 5, anchor: 'start' }, { s: 0, k: 1, dx: -9, dy: 5, anchor: 'end' }] },
      opts: ['500', '300', '450'], want: '300', val: { '500': (100 + 900) / 2, '300': 100 * Math.sqrt(9), '450': 100 * (9 / 2) }, ans: '300',
      task: 'A value of 100 grows × 9 each whole step, so it is 900 one step on. What is it half a step on?',
      why: 'Half a step multiplies by `√9 = 3`, because two half steps, × 3 and then × 3, make the whole × 9. So 100 becomes 300 halfway, and 900 after the whole step.',
      hint: 'Not quite. Two half steps must make the whole × 9.',
      hints: { '450': 'Not quite. That multiplies by half the factor, 4.5. Two half steps of × 4.5 make × 20.25, not × 9.',
        '500': 'Not quite. That is halfway along a straight line from 100 to 900. The rule\'s curve bends below it.' } },
    { kind: 'pick', name: 'Which is exponential?', table: true,
      opts: ['x²', '10x', '2ˣ'], want: '2ˣ', ans: '× 2',
      task: 'Three rules, worked out at `x` = 1, 2, 3 and 4. Which one is exponential?',
      why: 'Exponential means the same factor on each equal step, not fast growth: at `x` = 3, `x²` is ahead, 9 against 8, and at 4 they are level. Divide each value by the one before: `2ˣ` gives 2 every time. `x²` gives 4, 2.25, then 1.78, and `10x` adds 10 each step.',
      hint: 'Not quite. Look for the same factor on every step.',
      hints: { 'x²': 'Not quite. Divide each value of `x²` by the one before: 4, 2.25, then 1.78. The factor keeps changing.',
        '10x': 'Not quite. `10x` adds 10 each step, the same rise every time.' } },
    { kind: 'pick', name: '9% a day', key: [['add', 'adding 9 a day'], ['mul', 'growing 9% a day']],
      graph: { n: 30, ticks: [0, 10, 20, 30], tl: ['0', '10', '20', '30 days'], yname: 'count', h: 150, dp: 0, gap: 0.035,
        series: [{ kind: 'add', A: 100, d: 9, upto: 7, run: 30 }, { kind: 'mul', A: 100, b: 1.09, upto: 7, run: 30 }], ask: 30,
        dlab: [{ s: 1, k: 7, dx: -7, dy: -8, anchor: 'end', when: 'before' }, { s: 0, k: 7, dx: 7, dy: 17, anchor: 'start', when: 'before' },
          { s: 1, k: 30, dx: -8, dy: -9, anchor: 'end', when: 'after', t: 1.3 }, { s: 0, k: 30, dx: 4, dy: -10, anchor: 'end', when: 'after', t: 1.3 }] },
      opts: ['370', '1,327', '455'], want: '1,327', ans: '1,327',
      val: { '370': 100 + 30 * 9, '1,327': 100 * Math.pow(1.09, 30), '455': 100 + (100 * Math.pow(1.09, 7) - 100) * 30 / 7 },
      task: 'A count of 100 grows 9% a day. After a week it is about 183, close to the 163 that adding 9 a day gives. About how big is it after 30 days?',
      why: 'Each day multiplies by 1.09, so after 30 days it is `100 × 1.09³⁰ ≈ 1,327`. A week in, it is close to adding, 183 against 163, but by day 30 it is far ahead, 1,327 against 370.',
      hint: 'Not quite. Each day multiplies by 1.09.',
      hints: { '370': 'Not quite. That adds 9 a day. Each day\'s 9% is of a bigger count.',
        '455': 'Not quite. That keeps the first week\'s rise of 83 going. The rises keep growing.' } },
    { kind: 'pick', name: 'Passing 30 V', key: [['mul', 'halving every 10 s']],
      graph: { n: 6, ticks: [0, 1, 2, 3, 4, 5, 6], tl: (v) => 10 * v + ' s', yname: 'volts', yunit: ' V', h: 170, ymax: 440, yticks: [0, 100, 200, 300, 400], gap: 0.15,
        series: [{ kind: 'mul', A: 400, b: 0.5, upto: 0, run: 6 }], line: { y: 30, label: '30 V', pos: 'above' },
        band: { x0: 3, x1: 4, label: 'passes 30 V between 30 s and 40 s', after: true, t: 1.5 },
        dlab: [{ s: 0, k: 0, dx: 9, dy: 5, anchor: 'start' }, { s: 0, k: 3, dx: 7, dy: -9, anchor: 'start', when: 'after', t: 1.2 },
          { s: 0, k: 4, dx: 7, dy: -9, anchor: 'start', when: 'after', t: 1.2 }] },
      opts: ['At 18.5 s', 'Between 30 s and 40 s', 'Never'], want: 'Between 30 s and 40 s', ans: 'passes 30 V between 30 s and 40 s',
      task: 'The capacitor starts at 400 V and halves every 10 seconds. When does it pass 30 V?',
      why: '`400 × 0.5ˣ`, with `x` counting 10-second steps, gives 50 V after 30 s and 25 V after 40 s. 30 V lies between, so it passes 30 V between 30 s and 40 s. Finding exactly when needs a way to undo a power, which comes in Logarithms (lesson 4) and Solving exponential equations (lesson 6).',
      hint: 'Not quite. Halve 400 a step at a time.',
      hints: { 'At 18.5 s': 'Not quite. That falls 200 V every 10 s, as adding would. Halving takes less off each time.',
        'Never': 'Not quite. The rule never reaches 0 V, but it does pass 30 V. Halve 400 a few times.' } },
  ];
  const FINISH = 'Exponential change multiplies by the same growth factor on every equal step, so a start `A` becomes `A × bˣ` after `x` steps. It grows when `b` is larger than 1, as × 1.05 does for 5%, and shrinks when `b` is less than 1, ever closer to zero but never reaching it.';
  const CAPTION = 'Multiplying by the same factor `b` each equal step gives `A × bˣ`, growth above 1 and decay below.';
  // Sources the checks restate (the lesson's own).

  }
  // What one screen's graph adds of its own.
  const EXTRA = {

  // ---------- the sliders and the rule beside them ----------

  });

  // ---------- known answers, worked out by hand ----------
  const idx = (name) => STEPS.findIndex((d) => d.name === name);
  const PICKS = STEPS.map((d, i) => i).filter((i) => !STEPS[i].show);
  const solvedSt = (i) => Object.assign(blank(), { pick: STEPS[i].want, res: 'right' });
  const wrongSt = (i, o) => Object.assign(blank(), { pick: o, res: 'wrong' });
  const close = (a, b, tol) => Math.abs(a - b) <= (tol != null ? tol : 1e-9 * Math.max(1, Math.abs(a), Math.abs(b)));
  // Slider settings the checks try: no amount, small and large; factors below 1, at 1 and above.
  const SLIDES = [];
  [0, 1, 2, 5].forEach((amt) => [0.5, 0.75, 1, 1.05, 1.5, 2, 3].forEach((fac) => SLIDES.push({ amt, fac })));
  // Every finished picture the lesson can show: each screen opened, each puzzle solved and each
  // slip shown, the graph screen at many settings and the in-between screen with its curve off.
  function states() {
    const out = [];
    STEPS.forEach((d, i) => {
      out.push([i, blank()]);
      if (d.sliders) SLIDES.forEach((v) => out.push([i, Object.assign(blank(), v)]));
      if (!d.show) { out.push([i, solvedSt(i)]); d.opts.filter((o) => o !== d.want).forEach((o) => out.push([i, wrongSt(i, o)])); }
      if (d.fill) out.push([i, Object.assign(blank(), { fill: false })]);
    });
    return out;
  }
  // A step painted in the state given (finished, or at t seconds into its motion): what it draws.
  function drawn(i, st, t) {
    const keepS = S[i], keepT = T;
    S[i] = st; T = t == null ? Infinity : t;
    try {
      paint(i);
      return { texts: Array.from(art.querySelectorAll('text')).map((q) => q.textContent), bars: REC.bars, graph: REC.graph, table: REC.table, b: eff(STEPS[i], st) };
    } finally { S[i] = keepS; T = keepT; paint(); }
  }
  let ALL = null;
  const all = () => ALL || (ALL = states().map((x) => ({ i: x[0], st: x[1], g: drawn(x[0], x[1]) })));
  const muls = (g) => (g.bars && g.bars.cols.mul ? g.bars.cols.mul : []);
  const steps1 = (list, f) => list.every((r, j) => j === 0 || list[j - 1].k !== r.k - 1 || f(list[j - 1], r));

  K.check('In an exponential function the output is multiplied by the same factor every time the input increases by one: every multiplying bar and dot drawn, on every screen and at every slider setting, is the one before times its growth factor', () =>
    all().every(({ g }) => steps1(muls(g), (a, r) => close(r.v, a.v * g.bars.b)) &&
      (!g.graph || steps1(g.graph.dots.filter((q) => q.kind === 'mul'), (a, r) => close(r.v, a.v * r.s.b)))), { source: SRC_GF });
  K.check('The rate of growth is proportional to the current value: each rise or drop of the multiplying column is the same share of the bar before it, while the adding column rises by the same amount every step', () =>
    all().every(({ g }) => !g.bars || (steps1(muls(g), (a, r) => close(r.v - a.v, (g.bars.b - 1) * a.v)) &&
      steps1(g.bars.cols.add || [], (a, r) => close(r.v - a.v, g.bars.d)))), { source: SRC_CALC });
  K.check('The growth factor is larger than one when the growth rate is positive and less than one when it is negative: growing by a percentage gives a factor above one and a rising column, losing a percentage or halving gives one below and a falling column', () => {
    const fac = (pct) => 1 + pct / 100;
    const series = (name) => { const i = idx(name), g = drawn(i, STEPS[i].show ? blank() : solvedSt(i)); return g.bars ? muls(g) : g.graph.dots.filter((q) => q.kind === 'mul'); };
    const rises = (name) => { const m = series(name); return m.length > 1 && m.every((r, j) => j === 0 || r.v > m[j - 1].v); };
    const falls = (name) => { const m = series(name); return m.length > 1 && m.every((r, j) => j === 0 || r.v < m[j - 1].v); };
    return close(STEPS[idx('5% a year')].bars.b, fac(5)) && fac(5) > 1 && rises('5% a year') &&
      close(STEPS[idx('9% a day')].graph.series[1].b, fac(9)) && fac(9) > 1 && rises('9% a day') &&
      close(STEPS[idx('Losing value')].bars.b, fac(-25)) && fac(-25) < 1 && falls('Losing value') &&
      close(STEPS[idx('Halving')].bars.b, fac(-50)) && fac(-50) < 1 && falls('Halving') && falls('Passing 30 V');
  }, { source: SRC_LIBRE });
  K.check('Every number follows its rule: 21 and 1,024 at step 10 (slip 64); 72 from 48 (slips 49.5 and 96); £1,628.89 against £1,500, with 1.98 and 2.08 either side of double; £4,500 (slips £4,000 and £500); 50 V and 25 V; √2 ≈ 1.414; 300 (slips 450 and 500); 4, 2.25 and 1.78; 183 against 163, then 1,327, 370 and 455; 18.5 s; and each answer offered is the value its own working gives', () => {
    const f = fv;
    const ok = f(1 + 10 * 2) === '21' && f(Math.pow(2, 10)) === '1,024' && f(Math.pow(2, 10) - Math.pow(2, 9)) === '512' && f(16 + 6 * 8) === '64' && f(48 * 1.5) === '72' && f(48 + 1.5) === '49.5' && f(48 * 2) === '96' &&
      f(1000 * Math.pow(1.05, 10)) === '1,628.89' && f(1000 + 10 * 50) === '1,500' && f(Math.pow(1.05, 14)) === '1.98' && f(Math.pow(1.05, 15)) === '2.08' &&
      f(1 + 0.05) === '1.05' && f(8000 * 0.75 * 0.75) === '4,500' && f(8000 - 2 * 2000) === '4,000' && f(8000 * 0.25 * 0.25) === '500' &&
      f(400 * Math.pow(0.5, 3)) === '50' && f(400 * Math.pow(0.5, 4)) === '25' && f(Math.SQRT2, 3) === '1.414' && f(1.414 * 1.414) === '2' &&
      f(100 * Math.sqrt(9)) === '300' && f(100 * 4.5) === '450' && f(100 + (900 - 100) / 2) === '500' && f(4.5 * 4.5) === '20.25' &&
      f(4 / 1) === '4' && f(9 / 4) === '2.25' && f(16 / 9) === '1.78' &&
      f(100 * Math.pow(1.09, 7), 0) === '183' && f(100 + 7 * 9, 0) === '163' && f(100 * Math.pow(1.09, 30), 0) === '1,327' && f(100 + 30 * 9, 0) === '370' &&
      f(100 + (100 * Math.pow(1.09, 7) - 100) * 30 / 7, 0) === '455' && f(((400 - 30) / 200) * 10, 1) === '18.5';
    const labelled = STEPS.filter((d) => d.val && d.name !== 'The factor for 5%').every((d) => d.opts.every((o) => o === (d.bars ? preOf(d.bars) : '') + fv(d.val[o], d.graph && d.graph.dp != null ? d.graph.dp : 2)));
    const f5 = STEPS[idx('The factor for 5%')].val;
    return ok && labelled && close(f5['× 1.05'], 1000 * 1.05) && close(f5['× 0.05'], 1000 * 0.05) && close(f5['× 5'], 5000) &&
      patText(TROWS[0], 2) === '× 1.78' && patText(TROWS[1], 0) === '× 2' && patText(TROWS[2], 1) === '+ 10';
  });
  K.check('Decay never reaches zero: halving from 400 V, every bar drawn stays above the bottom line and each drop is half the one before, and twelve halvings still leave more than nothing', () => {
    const g = drawn(idx('Halving'), blank()), m = muls(g), drops = m.slice(1).map((r, j) => m[j].v - r.v);
    return m.length === 6 && m.every((r) => r.v > 0 && r.px > 0) && drops.every((x, j) => j === 0 || close(x, drops[j - 1] / 2)) && 400 * Math.pow(0.5, 12) > 0;
  });
  K.check('Before an answer, nothing in a puzzle\'s picture gives it away, and a right answer shows it', () =>
    PICKS.every((i) => { const d = STEPS[i]; return drawn(i, blank()).texts.indexOf(d.ans) < 0 && drawn(i, solvedSt(i)).texts.indexOf(d.ans) >= 0; }));
  K.check('Each puzzle offers three answers and takes only its right one, and every wrong answer has a hint of its own', () =>
    PICKS.every((i) => {
      const d = STEPS[i];
      return d.opts.length === 3 && d.opts.indexOf(d.want) >= 0 && d.opts.every((o) => isRight(i, Object.assign(blank(), { pick: o })) === (o === d.want)) &&
        d.opts.every((o) => o === d.want || !!(d.hints && d.hints[o]));
    }));
  K.check('Bars and dots are drawn to scale: each bar\'s height is its value on its screen\'s one scale, the tallest filling the frame, and each dot sits at its step and value', () =>
    all().every(({ g }) => {
      const B = g.bars;
      const okB = !B || (['add', 'mul'].every((k) => !B.cols[k] || B.cols[k].every((r) => close(r.px, (r.v / B.scale) * B.h, 1e-6))) &&
        close(Math.max.apply(null, (B.cols.add || []).concat(B.cols.mul || []).map((r) => r.px).concat(B.slip ? [B.slip.px] : [])), B.h, 1e-6));
      const okG = !g.graph || g.graph.dots.every((q) => close(q.y, g.graph.bot - (q.v / g.graph.ymax) * g.graph.h, 1e-6) && close(q.x, PX0 + (q.k / g.graph.n) * (PX1 - PX0), 1e-6));
      return okB && okG;
    }));
  K.check('Half a step multiplies by the square root of the factor, because two half steps make one whole step: at × 2 the mark sits at √2, and at × 9 the right answer is 300, three times 100', () => {
    const g9 = drawn(idx('Between the steps'), blank()), i10 = idx('Half a step'), g10 = drawn(i10, solvedSt(i10));
    return close(Math.pow(2, 0.5) * Math.pow(2, 0.5), 2) && close(Math.sqrt(9) * Math.sqrt(9), 9) && !!g9.graph.half && close(g9.graph.half.v, Math.SQRT2) &&
      g10.graph.marks.some((m) => m.x === 0.5 && close(m.v, 300)) && !!g10.graph.curve && close(g10.graph.curve.fn(0.5), 300) && close(g10.graph.curve.fn(1), 900);
  });
  K.check('Every demonstration has finished arriving within 4.5 s of its screen opening, none starting before the 0.35 s screen fade ends; every answer\'s motion, right or wrong, within 2.5 s', () => {
    const keepT = T;
    const timed = (i, st, limit) => {
      const keepS = S[i];
      T = Infinity; latest = 0; earliest = Infinity;
      S[i] = st;
      try { paint(i); } finally { S[i] = keepS; }
      return latest <= limit + 1e-9;
    };
    const ok = STEPS.every((d, i) => {
      if (d.show) { const r = timed(i, blank(), d.dur); return r && d.dur <= 4.5 && d.dur >= 3 && earliest >= FADE; }
      return timed(i, solvedSt(i), FB[0]) && FB[0] <= 2.5 && d.opts.filter((o) => o !== d.want).every((o) => timed(i, wrongSt(i, o), FB[1]) && FB[1] <= 2.5);
    });
    T = keepT; paint();
    return ok;
  });

  K.ready();
</script>
