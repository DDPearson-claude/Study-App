  .pz .count { margin-top: 10px; }

  .task.show { font-size: 1.05rem; font-weight: 400; line-height: 1.6; }
  .nw { white-space: nowrap; }

  /* the graph */
  .scene .ax { stroke: var(--k-ink); stroke-width: 1.2; }
  .scene .tk { fill: var(--k-ink); font-weight: 600; }
  .scene .axt { fill: var(--k-muted); font-weight: 600; }
  .scene .mint { fill: var(--k-muted); font-weight: 600; }
  .scene .curve { fill: none; stroke: var(--k-accent2); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
  .scene .room { stroke: var(--k-muted); stroke-width: 1.5; stroke-dasharray: 5 4; }
  .scene .roomt { fill: var(--k-muted); font-weight: 600; }

  .scene .tagt { fill: var(--k-on-accent2); font-weight: 700; }

  /* slips: red, for mistakes only */

  .scene .slipd { fill: none; stroke: var(--k-warn); stroke-width: 2; stroke-dasharray: 6 4; }
  .scene .slipdot { fill: var(--k-warn); }

  .scene .nodet { fill: var(--k-ink); font-weight: 700; }
  .scene .name { fill: var(--k-accent); font-weight: 700; font-style: italic; }

  .scene .fchipt { fill: var(--k-ink); font-weight: 700; }
  .scene .uchip { fill: var(--k-bg); stroke: var(--k-accent2); stroke-width: 2; }
  .scene .uchipt { fill: var(--k-accent2); font-weight: 700; }
  .scene .wchip { fill: var(--k-bg); stroke: var(--k-warn); stroke-width: 2; }
  .scene .wchipt { fill: var(--k-warn); font-weight: 700; }
  .scene .farr { stroke: var(--k-muted); stroke-width: 1.5; }

  .scene .b2 { fill: var(--k-cat2); }

  .mkey { justify-content: center; font-size: .9rem; }
  /* The same steps written out under the picture. */
  .forms { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 1.05rem; font-weight: 700; line-height: 1.5; min-height: 1.6em; margin-top: 8px; text-align: center; }

  .forms .fn { font-weight: 400; font-size: .88rem; color: var(--k-muted); margin-left: .6em; white-space: normal; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  .row .k-btn { flex: 1 1 7rem; }
  .replay { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 10px; }
  .replay .k-btn { flex: 0 0 auto; min-height: 44px; padding-left: 16px; padding-right: 16px; font-size: .95rem; white-space: nowrap; }
  /* The answers stay on one row, each label whole; longer ones stack one to a row. */
  .row.picks { flex-wrap: nowrap; }
  .picks .k-btn { font-size: 1.15rem; min-height: 56px; flex: 1 1 0; min-width: 0; white-space: nowrap; padding-inline: 6px; }
  .row.picks.long { flex-direction: column; gap: 8px; }
  .picks.long .k-btn { flex: 0 0 auto; width: 100%; min-height: 48px; }
  .picks .k-btn[aria-pressed="true"] { background: var(--k-accent2); color: var(--k-on-accent2); border-color: var(--k-accent2); }
  .fb { font-weight: 700; min-height: 1.5em; margin-top: 10px; }
  .fb.right { color: var(--k-good); }
  .fb.wrong { color: var(--k-ink); }
  .why { line-height: 1.6; }
  .done { line-height: 1.6; }
  .done strong { color: var(--k-accent2); }
  .done .row { margin-top: 14px; }
  /* Each new screen settles in softly: its words and pictures fade in and rise 4 px. */
  #stepbox.enter, #done.enter { animation: screen-in .35s ease-out both; }
  @keyframes screen-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  html.k-testing #stepbox.enter, html.k-testing #done.enter { animation: none; }
  @media (prefers-reduced-motion: reduce) {
    #stepbox.enter, #done.enter { animation: none; }

<p class="caption" id="cap"></p>

<script>
  // ---------- the rules ----------
  // Lesson 3's ideal capacitor: 470 µF through 100 kΩ, so RC = 47 s, charged to 400 V, falls as
  // v = 400 e^(−t/47). Its undoing machine runs the steps backwards, last first: ÷ 400, ln, × (−47).
  // ln undoes eˣ because ln(eᵏ) = k × ln e and ln e = 1.
  const V0 = 400, C_UF = 470, R_K = 100;
  const RC = Math.round(C_UF * 1e-6 * R_K * 1e3 * 1e6) / 1e6;          // 47 s
  const LN = Math.log, LG = Math.log10;
  const vCap = (t) => V0 * Math.exp(-t / RC);
  const tCap = (v) => -RC * LN(v / V0);
  // Lesson 3's cooling part: 90 °C in a 20 °C room, τ = 10 minutes, T = 20 + 70 e^(−t/10).
  const TROOM = 20, TSTART = 90, TAU = 10, GAP0 = TSTART - TROOM;
  const tempAt = (t) => TROOM + GAP0 * Math.exp(-t / TAU);
  const tCool = (T) => -TAU * LN((T - TROOM) / GAP0);
  // Lesson 1's capacitor: 400 V halving every 10 s, v = 400 × 0.5^(t/10).
  const HALF = 10, HF = 0.5;
  const vHalf = (t) => V0 * Math.pow(HF, t / HALF);
  const tHalf = (v) => HALF * LG(v / V0) / LG(HF);
  // Growth by 5% a year multiplies by 1.05 each year.
  const PCT = 5, GROW = 1 + PCT / 100;
  const SRC1 = 'https://voltage-disturbance.com/power-quality/capacitor-bank-discharge-methods';
  const SRC2 = 'https://math.libretexts.org/Bookshelves/Algebra/Intermediate_Algebra_1e_(OpenStax)/10%3A_Exponential_and_Logarithmic_Functions/10.06%3A_Solve_Exponential_and_Logarithmic_Equations';
  const SRC3 = 'https://openstax.org/books/college-algebra/pages/6-6-exponential-and-logarithmic-equations';
  const SRC4 = 'https://pmc.ncbi.nlm.nih.gov/articles/PMC8386158/';
  const RULE72 = 72;                        // the rule of 72: doubling time ≈ 72 ÷ the % a year
  const IEC_V = 75, IEC_MIN = 3;            // as the trade page reports IEC 60831
  const LMIN = 5, LMAX = 395, LSTEP = 5, LOPEN = 75;

  // ---------- numbers ----------
  // fx: exactly dp decimals with a true minus sign; fv: at most dp, trailing zeros dropped.
  function fx(v, dp) {
    const f = Math.pow(10, dp);
    let r = Math.round(v * f) / f;
    if (r === 0) r = 0;
    return (r < 0 ? '−' : '') + Math.abs(r).toFixed(dp);
  }
  function fv(v, dp) {
    const s = fx(v, dp);
    return dp > 0 ? s.replace(/(\.\d*?)0+$/, '$1').replace(/\.$/, '') : s;
  }
  const plain = (s) => Number(String(s).replace(/−/g, '-'));
  const sec = (t) => fx(t, 1) + ' s';
  const grid5 = (v) => K.clamp(Math.round(v / LSTEP) * LSTEP, LMIN, LMAX);
  const shS = (v) => fv(v / V0, 4);                 // e^(−t/47) = target ÷ 400, 4 decimals
  const lnS = (v) => fx(LN(v / V0), 3);             // its ln, 3 decimals
  const RCs = fv(RC, 0);
  const E_RC = 'e^(−t/' + RCs + ')', E_TAU = 'e^(−t/' + TAU + ')';
  const RULE = 'v = ' + V0 + ' ' + E_RC;
  const COOL = 'T = ' + TROOM + ' + ' + GAP0 + ' ' + E_TAU;
  const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');

  // The worked numbers each screen uses, all from the rules above.
  const T75 = tCap(LOPEN), EYE75 = Math.round(T75 / 10) * 10;
  const L200 = 200, T200 = tCap(L200), PACE200 = (V0 - L200) / (V0 / RC);   // the starting pace, V0 ÷ RC volts a second, kept up
  const B2 = 2, Y20 = 20, X20 = LG(Y20) / LG(B2);
  const X2 = LG(2) / LG(GROW), SLIP_Q = LG(2 / GROW), SLIP_ADD = (2 - 1) / (PCT / 100);
  const C30 = 30, TC30 = tCool(C30);
  const P15 = 1.5;
  const root = (b, c) => (-b + Math.sqrt(b * b - 4 * c)) / 2, root2 = (b, c) => (-b - Math.sqrt(b * b - 4 * c)) / 2;
  const SH11 = 3, SH12 = 3, RHS = 1, TEN = Math.pow(10, RHS);
  const K11 = root(SH11, -TEN), D11 = root2(SH11, -TEN);           // x(x + 3) = 10: 2 and −5
  const K12 = root(-SH12, -TEN), D12 = root2(-SH12, -TEN);         // x(x − 3) = 10: 5 and −2
  const S12 = root(-SH12, -1);                                     // x(x − 3) = 1: 3.30
  const L30 = 30, TH30 = tHalf(L30), NH30 = TH30 / HALF, SLIP_TIMES = V0 / L30;
  const T30 = tCap(L30), V120 = vCap(2 * 60), LOGSLIP = -RC * LG(L30 / V0);
  const MIN_OK = Math.ceil(T30 / 60), MIN_EARLY = Math.floor(T30 / 60), MIN_LOG = Math.ceil(LOGSLIP / 60);

  // As a screen reader says it.
  const say = (s) => String(s == null ? '' : s)
    .replace(/eˣ/g, 'e to the power x').replace(/ˣ/g, ' to the power x').replace(/\^\(([^)]*)\)/g, ' to the power $1').replace(/\^([0-9.−]+|[a-z])/g, ' to the power $1')
    .replace(/²/g, ' squared').replace(/≈/g, ' is about ').replace(/×/g, ' times ').replace(/÷/g, ' divided by ').replace(/−/g, ' minus ').replace(/\+/g, ' plus ')
    .replace(/=/g, ' equals ').replace(/°C/g, ' degrees').replace(/\s+/g, ' ').trim();

  // ---------- the pictures ----------
  // A graph card: axes, ticks, the curve and its inverse (the time where the curve reaches a level).
  const CARDS = {
    cap: { x: [0, 240], xt: [0, 60, 120, 180, 240], xu: ' s', y: [0, V0], yt: [0, 100, 200, 300, 400], ytitle: 'voltage (V)',
      f: vCap, inv: tCap, tfmt: sec, lv: (L) => fv(L, 0) + ' V', what: 'voltage against time in seconds; the curve falls from ' + V0 + ' V, fast at first, then slower' },
    cool: { x: [0, 50], xt: [0, 10, 20, 30, 40, 50], xu: ' min', y: [0, 100], yt: [0, 50, 100], ytitle: 'temperature (°C)', room: TROOM,
      f: tempAt, inv: tCool, tfmt: (t) => fx(t, 1) + ' min', lv: (L) => fv(L, 0) + ' °C', what: 'temperature against time in minutes; the curve cools from ' + TSTART + ' °C towards the room\'s ' + TROOM + ' °C' },
    pow2: { x: [0, 5], xt: [0, 1, 2, 3, 4, 5], xu: '', y: [0, 32], yt: [0, 10, 20, 30], ytitle: '2ˣ, with x along the bottom',
      f: (x) => Math.pow(B2, x), inv: (y) => LG(y) / LG(B2), tfmt: (x) => fx(x, 2), lv: (L) => fv(L, 0), lab: 'left', what: '2 to the power x against x, rising faster and faster' },
    grow: { x: [0, 25], xt: [0, 5, 10, 15, 20, 25], xu: ' years', y: [0, 3.5], yt: [0, 1, 2, 3], ytitle: 'times the start, 1.05ˣ',
      f: (x) => Math.pow(GROW, x), inv: (y) => LG(y) / LG(GROW), tfmt: (x) => fx(x, 1) + ' years', lab: 'left', lv: (L) => fv(L, 0) + ' times the start', what: 'how many times the start after x years at ' + PCT + '% a year' },
    halve: { x: [0, 60], xt: [0, 10, 20, 30, 40, 50, 60], xu: ' s', y: [0, V0], yt: [0, 100, 200, 300, 400], ytitle: 'voltage (V)', dots: [10, 20, 30, 40],
      f: vHalf, inv: tHalf, tfmt: sec, lv: (L) => fv(L, 0) + ' V', what: 'lesson 1\'s capacitor, halving every ' + HALF + ' s, with a dot at each halving' },
  };
  CARDS.capMin = Object.assign({}, CARDS.cap, { minutes: [60, 120, 180, 240] });

  // A machine: its nodes hold the numbers handed on; forward steps sit above, their undoing below,
  // each undo under the step it reverses.
  const F_DIV = '÷ (−' + RCs + ')', U_MUL = '× (−' + RCs + ')', F_MUL = '× ' + V0, U_DIV = '÷ ' + V0;
  const MACH = {
    cap: { names: ['t', 'v'], f: [F_DIV, 'eˣ', F_MUL], u: [U_MUL, 'ln', U_DIV], cand: [LMIN, LMAX, LOPEN, L30, L200],
      vals: (L) => [sec(tCap(L)), fx(LN(L / V0), 3), shS(L), fv(L, 0) + ' V'] },
    cool: { names: ['t', 'T'], f: ['÷ (−' + TAU + ')', 'eˣ', '× ' + GAP0, '+ ' + TROOM], u: ['× (−' + TAU + ')', 'ln', '÷ ' + GAP0, '− ' + TROOM], cand: [C30],
      vals: (L) => [fx(tCool(L), 1) + ' min', fx(LN((L - TROOM) / GAP0), 3), fv((L - TROOM) / GAP0, 3), fv(L - TROOM, 0), fv(L, 0) + ' °C'] },
  };

  // The four lines of the symbols screen, at a level L: each step done to both sides.
  function capForms(L) {
    return [
      [fv(L, 0) + ' = ' + V0 + ' ' + E_RC, ''],
      [shS(L) + ' = ' + E_RC, U_DIV + ' on both sides'],
      ['ln ' + shS(L) + ' = −t/' + RCs, 'ln of both sides'],
      ['t = −' + RCs + ' × ln ' + shS(L) + ' ≈ ' + sec(tCap(L)), U_MUL + ' on both sides'],
    ];
  }

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // A part's arrival is 1 (there), 0 (not there), a time (a demonstration's part arriving then), or
  // R(t) / W(answer, t): arriving t seconds after a right answer, or after that wrong answer.
  const R = (t) => ({ when: 'right', at: t });
  const W = (o, t) => ({ when: o, at: t == null ? 0.3 : t });
  const O1 = [U_DIV, 'ln', U_MUL];
  const O3 = [sec(T200), sec(PACE200), sec(-T200)];
  const O5 = ['ln ' + shS(LOPEN) + ' = −t/' + RCs, shS(LOPEN) + ' = −t/' + RCs, 'log ' + shS(LOPEN) + ' = −t/' + RCs];
  const O7 = [fx(X2, 1) + ' years', fx(SLIP_Q, 3), fv(SLIP_ADD, 0) + ' years'];
  const O9 = ['Take ' + TROOM + ' from both sides', 'Take ln of both sides', 'Divide both sides by ' + GAP0];
  const O11 = [fv(K12, 0), fv(K12, 0) + ' and ' + fv(D12, 0), fx(S12, 2)];
  const O12 = [sec(TH30), fx(NH30, 1) + ' s', sec(SLIP_TIMES * HALF)];
  const O13 = [plural(MIN_OK, 'minute'), plural(MIN_EARLY, 'minute'), plural(MIN_LOG, 'minute')];
  const cap4 = capForms(LOPEN);

  const STEPS = [
    { show: true, live: true, card: 'cap', mach: 'cap', level: LOPEN, name: 'A known voltage',
      g: { curve: { at: 0.4, dur: 1.2, draw: true }, level: 1.0, glide: { from: LMAX, at: 1.6, dur: 1.0 }, dot: 2.6, drop: { at: 2.8, dur: 0.6, grow: true }, tagShow: 3.4, eye: 3.4, tag: 0 },
      m: { chips: 0.4, u: [0, 0, 0], n: [0, 0, 0, 1.0] }, forms: [[RULE, '', 0.4]], dur: 4.1,
      text: 'Here is lesson 3\'s capacitor, ' + C_UF + ' µF through ' + R_K + ' kΩ, so `RC = ' + RCs + ' s`, this time charged to ' + V0 + ' V. Its rule, `' + RULE + '`, is a machine. Take the time t, divide by −' + RCs + ', put it through eˣ, then multiply by ' + V0 + '. Lesson 3 ran it forwards, from a time to a voltage. Now the voltage is known and the time is not. Watch the level line come down to ' + LOPEN + ' V. By eye it crosses the curve near ' + EYE75 + ' s. Drag it to set another target.' },
    { kind: 'pick', card: 'cap', mach: 'cap', level: LOPEN, name: 'Which comes off first?',
      g: { tag: 0 }, m: { u: [0, 0, R(0.1)], n: [0, 0, R(0.5), 1], rings: [{ row: 'f', i: 1, when: O1[1] }, { row: 'f', i: 0, when: O1[2] }] },
      notes: [{ text: 'ln first needs the product law, as ' + F_MUL + ' still sits outside eˣ', when: O1[1] }, { text: F_DIV + ' went in first, so its undo comes last', when: O1[2] }],
      opts: O1, want: O1[0], ans: U_DIV,
      forms: { before: [], right: [[shS(LOPEN) + ' = ' + E_RC, U_DIV + ' on both sides', 0.9]] },
      task: 'The undoing machine runs the rule backwards, starting from the ' + LOPEN + ' V. Which step does it do first?',
      why: 'Each step worked on what the step before handed it, so the ' + F_MUL + ', done last, sits outside everything, and the undoing machine takes it off first. `' + LOPEN + ' ÷ ' + V0 + ' = ' + shS(LOPEN) + '`, so `' + E_RC + ' = ' + shS(LOPEN) + '`, and the power stands alone. Then ln can undo eˣ, and ' + U_MUL + ' undoes the very first step, so it comes last. Taking ln first also works for a product, by lesson 5\'s product law, `ln ' + LOPEN + ' = ln ' + V0 + ' − t/' + RCs + '`, and gives the same time. It is a sum, like the cooling part\'s + ' + TROOM + ' later on, that forces the order.',
      hint: 'Not quite. Undo the step that was done last.',
      hints: { [O1[1]]: 'Not quite. The undoing machine starts with the step done last, ' + F_MUL + '. ln first can work, by lesson 5\'s product law, but it is a detour, not the machine\'s step.',
        [O1[2]]: 'Not quite. ' + U_MUL + ' undoes the first forward step, so it comes last.' } },

  const whyBtn = K.button({ label: 'Why?', secondary: true, into: '#acts', press: () => {

  // One animation plays each demonstration and the motion after an answer; with reduced motion

  document.addEventListener('visibilitychange', () => { if (!document.hidden && !anim.playing() && T !== Infinity) { T = Infinity; paint(); syncCtl(at()); remember(); } });
  function play(dur) {

  }
  function enter(id) {
    if (REDUCE) return;

  }

  // ---------- drawing helpers ----------
  const el = (id) => document.getElementById(id);
  const scene = el('scene'), mach = el('mach'), art = el('art'), ui = el('ui'), mart = el('mart');
  let into = null, base = art;
  const add = (node) => (into || base).appendChild(node);
  // How far a part due at t0 has arrived (K.arrive), noting the timetable for the timing check.

  function part(a, rise, draw) {

  // ---------- the machines ----------
  function machLayout(M) {

      return d.opts.length === 3 && d.opts.indexOf(d.want) === 0 && d.opts.every((o) => isRight(i, Object.assign(blank(), { pick: o })) === (o === d.want)) &&
        d.opts.every((o) => o === d.want || (!!(d.hints && d.hints[o]) && (() => { const g = drawn(i, wrongSt(i, o)).rec; return g.slips + g.notes.length > 0; })()));
    }));
  chk('The drag maps the finger back to the same setting: a finger at a level\'s height sets that level, and the top and bottom of the graph give 395 V and 5 V', () =>
    LEVELS.every((L) => levelFromY(capY(L)) === L) && levelFromY(0) === LMAX && levelFromY(400) === LMIN && levelFromY(capY(77)) === 75 && levelFromY(capY(78)) === 80);
  chk('The power ruler puts each number at its log: 10 one space along, 100 two, and 31.6 at 1.5 spaces; log 2 and log 5 end to end land on 10', () => {
    const g = drawn(idx('An unknown inside a log'), blank()).rec;
    return g.nums.every((q) => close(q.x, RX(LG(q.n)), 1e-9)) && RX(LG(10)) === RX(1) && RX(LG(100)) === RX(2) && close(RX(LG(0.1)), RX(-1), 1e-9) && g.nums.every((q) => q.n > 0) && g.cursor === '31.6' &&
      close(LG(2) + LG(5), 1, 1e-12) && g.texts2.indexOf('log 2 + log 5 = 1') >= 0;
  });
  chk('Every demonstration has finished arriving within its time (3 to 4.5 s), none starting before the 0.35 s screen fade ends; every answer\'s motion, right or wrong, within 2.5 s', () => {
    const keepT = T;
    const timed = (i, st, limit) => {
      const keepS = S[i];
      T = Infinity; latest = 0; earliest = Infinity;
      S[i] = st;
      try { paint(i, openP(i)); } finally { S[i] = keepS; }
      return latest <= limit + 1e-9;
    };
    const ok = STEPS.every((d, i) => {
      if (d.show) { const r = timed(i, blank(), d.dur); return r && d.dur <= 4.5 && d.dur >= 3 && earliest >= FADE; }
      return timed(i, solvedSt(i), FB[0]) && FB[0] <= 2.5 && d.opts.filter((o) => o !== d.want).every((o) => timed(i, wrongSt(i, o), FB[1]) && FB[1] <= 2.5);
    });
    T = keepT;
    return ok;
  });

  K.ready();
</script>
