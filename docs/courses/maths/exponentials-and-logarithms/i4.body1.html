<p class="lead" id="lead">A ruler with numbers along its top edge, their powers along its bottom edge, and a pointer that reads both.</p>

<script>
  // ---------- the rule ----------
  // On the ruler of base b the number above the power p is b^p, so the power below a number is
  // that number's logarithm in base b. The pointer's power is the lesson's control; the number is
  // worked out from it. A space is one power, so one space right multiplies by b.
  const R10 = 'Ruler of 10s', R2 = 'Ruler of 2s', RE = 'Ruler of e';
  const OPT = [R10, R2, RE];
  const BASE = { 'Ruler of 10s': 10, 'Ruler of 2s': 2, 'Ruler of e': Math.E };
  const SYM = { 'Ruler of 10s': '10', 'Ruler of 2s': '2', 'Ruler of e': 'e' };
  const LOGW = { 'Ruler of 10s': 'log₁₀', 'Ruler of 2s': 'log₂', 'Ruler of e': 'ln' };
  const numAt = (name, p) => Math.pow(BASE[name] || 10, p);
  const PMIN = -3, PMAX = 5;
  const keep12 = (v) => +v.toPrecision(12);
  const L2 = keep12(Math.log10(2)), L3 = keep12(Math.log10(3)), L5 = keep12(Math.log10(5)), L4 = Math.log10(4);
  const L45 = keep12(Math.log10(45)), LN10 = keep12(Math.log(10)), E2 = Math.exp(2);
  const SMALL = [[2, L2], [3, L3], [5, L5]];
  // Sources the checks restate (the lesson's own).
  const SRC1 = 'https://openstax.org/books/algebra-and-trigonometry-2e/pages/6-3-logarithmic-functions';
  const SRC2 = 'https://www.mathwords.com/e/euler_number.htm';
  const SRC3 = 'https://openstax.org/books/intermediate-algebra-2e/pages/10-3-evaluate-and-graph-logarithmic-functions';

  // ---------- numbers ----------
  // fx: exactly dp decimals (a true minus sign; 10 000 and up grouped with a space, as the lesson
  // writes them); fv: at most dp, trailing zeros dropped. A number on the ruler has four significant
  // figures and at most three decimals (2.718, 20.09, 316.2, 0.001); a power has three decimals.
  const NB = ' ';
  function fx(v, dp) {
    const f = Math.pow(10, dp);
    let r = Math.round(v * f) / f;
    if (r === 0) r = 0;
    const p = Math.abs(r).toFixed(dp).split('.');
    if (p[0].length > 4) p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, NB);
    return (r < 0 ? '−' : '') + p.join('.');
  }
  function fv(v, dp) {
    const s = fx(v, dp);
    return dp > 0 ? s.replace(/(\.\d*?)0+$/, '$1').replace(/\.$/, '') : s;
  }
  function dpOf(v) { const a = Math.abs(v); if (!(a > 0)) return 0; return K.clamp(3 - Math.floor(Math.log10(a) + 1e-9), 0, 3); }
  const fn4 = (v) => fv(v, dpOf(v));
  const fp = (p) => fv(p, 3);
  const plain = (s) => Number(String(s).replace(/−/g, '-').replace(/ /g, ''));
  const exact = (v, s) => Math.abs(v - plain(s)) <= 1e-9 * Math.max(1, Math.abs(v));
  // The pointer's fact in its two forms: 10^3 = 1000 and log₁₀ 1000 = 3 (≈ when either is rounded).
  function formsOf(name, p) {
    const N = fn4(numAt(name, p)), P = fp(p), eq = exact(numAt(name, p), N) && exact(p, P) ? ' = ' : ' ≈ ';
    return [SYM[name] + '^' + P + eq + N, LOGW[name] + ' ' + N + eq + P];
  }
  const sits = (n, p, dp) => fn4(n) + ' sits at ' + (dp != null ? fv(p, dp) : fp(p));
  const pair = (x, y) => '(' + fn4(x) + ', ' + fn4(y) + ')';

  // A drag lands exactly on a big mark when it comes within 0.05 of one, and on a named number
  // (2, 3, 5, 45 or half way on the ruler of 10s; 10 on the ruler of e) within 0.025.
  function snapPtr(p, name) {
    p = K.clamp(p, PMIN, PMAX);
    const r = Math.round(p);
    if (Math.abs(p - r) < 0.05) return r;
    const named = name === R10 ? [L2, L3, L5, L45, 2.5] : name === RE ? [LN10] : [];
    const hit = named.find((s) => Math.abs(p - s) < 0.025);
    return hit != null ? hit : Math.round(p * 1000) / 1000;
  }

  // As a screen reader says it.
  const say = (s) => String(s == null ? '' : s)
    .replace(/log₁₀/g, 'log base 10').replace(/log₂/g, 'log base 2').replace(/log₄/g, 'log base 4')
    .replace(/\^([0-9.−]+)/g, ' to the power $1').replace(/¹⁰/g, ' to the power 10').replace(/⁻³/g, ' to the power minus 3').replace(/⁻¹/g, ' to the power minus 1')
    .replace(/²/g, ' squared').replace(/³/g, ' cubed').replace(/⁴/g, ' to the power 4').replace(/ˣ/g, ' to the x')
    .replace(/≈/g, ' is about ').replace(/×/g, ' times ').replace(/÷/g, ' divided by ').replace(/−/g, 'minus ')
    .replace(/=/g, ' equals ').replace(/\s+/g, ' ').trim();

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // R: the ruler (its base; u, units per space; the window's travel: it pans from lo to hi as the
  // pointer moves, or stays at lo when fixed; small, the small marks 2, 3 and 5; inset, the first
  // space magnified; open, the label at the open left end; pills: false hides the × marks; hidePow,
  // powers shown as ?; ptr, a pointer drawn still; ask, the number asked about; askNum, its mark).
  // SHOW: p0, where the pointer ends its demonstration; glide, the pointer's journey [to, when,
  // how long]; morph, the ruler it changes from; sw, the switch shown; and when parts arrive.
  // DO: items, what it draws (when: 'right' after a right answer, or the wrong answer whose slip it
  // draws; at, when it arrives); opts, the answers; vals, each answer by its own working; ans, the
  // words that would give the answer away; forms, the two forms under the picture.
  const T4 = fn4(1e4);
  const O2 = ['log₁₀ 4 = ' + T4, 'log₁₀ ' + T4 + ' = 4', 'log₄ ' + T4 + ' = 10'];
  const O6 = ['Yes: 6 and 6', 'No: 3 and 6', 'No: 8 and 6'];
  const O13 = ['(2, 0.693)', '(7.389, 2)', '(7.389, 0.869)'];
  const STEPS = [
    { show: true, name: 'Powers of ten', H: 130, R: { base: R10, u: 68, lo: -3.9, hi: 5.5 }, p0: 3, dur: 3.0,
      glide: { from: 0, stops: [[1, 0.6, 0.55], [2, 1.4, 0.55], [3, 2.2, 0.55]] },
      text: 'This is the *power ruler*. Its big marks on top are 1, 10, 100 and 1000, each ten times the one before, at equal spaces, with their powers of 10 underneath. One space right multiplies the number by 10 and adds 1 to the power. So `10³ = 1000`, and asked the other way round, the power 10 needs to make 1000 is 3. That power is the *logarithm*, `log₁₀ 1000 = 3`, the 3 in kilo\'s 10³. Drag the pointer.' },
    { kind: 'pick', name: 'Which log?', H: 156, R: { base: R10, u: 60, lo: -0.5, fixed: true, ptr: 4 },
      items: [
        { k: 'bracket', p0: 0, p1: 4, row: 'r1', text: O2[1], when: 'right', at: 0.2 },
        { k: 'ring', p: L4, text: sits(4, L4), when: O2[0], at: 0.3 },
        { k: 'note', p: 2, row: 'r1', text: '4¹⁰ is ' + fn4(Math.pow(4, 10)) + ', not ' + T4, when: O2[2], at: 0.3 },
      ],
      opts: O2, want: O2[1], ans: O2[1],
      vals: { [O2[0]]: 'log₁₀ ' + fn4(4) + ' = ' + fn4(Math.pow(10, 4)), [O2[1]]: 'log₁₀ ' + fn4(1e4) + ' = ' + fp(Math.log10(1e4)), [O2[2]]: 'log₄ ' + fn4(1e4) + ' = ' + fn4(10) },
      forms: { before: ['10^4 = ' + T4], right: ['10^4 = ' + T4, O2[1]] },
      task: '`10⁴ = ' + T4 + '`. Which says the same thing as a logarithm?',
      why: 'A logarithm is the power the base needs to make the number. The base is 10, the number ' + T4 + ' and the power 4, so `' + O2[1] + '`. The number goes inside the log, and the power comes out.',
      hint: 'Not quite. The number goes inside the log, and the power comes out.',
      hints: { [O2[0]]: 'Not quite. That asks what power of 10 makes 4. The number, ' + T4 + ', goes inside the log, and the power, 4, comes out.',
        [O2[2]]: 'Not quite. That makes 4 the base. Here the base is 10, raised to the power 4.' } },
    { show: true, name: 'Between the marks', H: 218, R: { base: R10, u: 68, lo: -3.9, hi: 5.5, small: true, inset: true }, p0: L45, dur: 3.9,
      glide: { from: 2, stops: [[2.5, 0.4, 0.7], [L45, 2.9, 0.8]] }, insetAt: 1.3, smallAt: [1.8, 2.1, 2.4],
      text: 'Between the marks the same rule holds. Half a space multiplies by `√10 ≈ 3.162`, the number that times itself makes 10, so 316 sits half way from 100 to 1000, at 2.5. Equal lengths multiply by equal factors, so the numbers bunch up towards the right of each space. Ten 2s multiplied make 1024, just over 10³, so ten steps of × 2 are about three spaces, and 2 sits near 0.3. The magnified space shows 2, 3 and 5 at 0.301, 0.477 and 0.699. The pointer stops at 45, at 1.653.' },
    { kind: 'pick', name: 'Where 5 sits', H: 238, R: { base: R10, u: 68, lo: -0.6, fixed: true, small: true, inset: true, hideInset: 5 },
      items: [
        { k: 'insetrv', f: L5, text: fp(L5), when: 'right', at: 0.2 },
        { k: 'insetring', f: 0.5, text: sits(Math.sqrt(10), 0.5), when: '0.5', at: 0.3 },
        { k: 'insetring', f: 4 / 9, text: sits(Math.pow(10, 4 / 9), 4 / 9), when: '0.444', at: 0.3 },
      ],
      opts: ['0.5', '0.699', '0.444'], want: '0.699', ans: '0.699',
      vals: { '0.5': fp(0.5), '0.699': fp(L5), '0.444': fp(4 / 9) },
      forms: { before: [], right: ['10^0.699 ≈ 5', 'log₁₀ 5 ≈ 0.699'] },
      task: 'On the ruler of 10s, where does 5 sit between 1 and 10? Give its power.',
      why: 'Equal lengths multiply by equal factors, so the numbers bunch up towards the right of each space. Half way is only `√10 ≈ 3.162`, so 5 sits further on, at 0.699. Check by turning it round: `10^0.699 ≈ 5`.',
      hint: 'Not quite. Equal lengths multiply, so the space is not evenly spaced.',
      hints: { '0.5': 'Not quite. Half way through a space multiplies by `√10 ≈ 3.162`, not 5.',
        '0.444': 'Not quite. That reads the space as evenly spaced, with 5 four of the nine steps from 1 to 10. Equal lengths multiply, so 5 sits further right.' } },
    { show: true, name: 'The ruler of 2s', H: 180, R: { base: R2, u: 44, lo: -3.8, hi: 6.4 }, p0: 5, dur: 3.9, sw: true,
      morph: { from: R10, at: 0.4, dur: 0.7 }, glide: { from: 0, stops: [[3, 1.1, 0.6], [5, 1.9, 0.6]] }, brk: true,
      text: 'Any positive base other than 1 makes its own ruler. On the ruler of 2s each space multiplies by 2, so 1, 2, 4, 8, 16 and 32 sit at 0 to 5: `log₂ 8 = 3` and `log₂ 32 = 5`. A log is a length along the ruler, and a number like any other, so two of them simply add: `log₂ 8 + log₂ 8 = 3 + 3 = 6`. Flip the switch to compare rulers.' },
    { kind: 'pick', name: 'A log is a number', H: 180, R: { base: R2, u: 50, lo: -0.6, fixed: true },
      items: [
        { k: 'bracket', p0: 0, p1: 1, row: 'r1', text: 'log₂ 2' },
        { k: 'slide', p0: 0, p1: 1, by: 1, row: 'r1', text: 'log₂ 2', when: 'right', at: 0.1, dur: 0.7 },
        { k: 'slide', p0: 0, p1: 1, by: 2, row: 'r1', text: 'log₂ 2', when: 'right', at: 0.5, dur: 0.7 },
        { k: 'bracket', p0: 0, p1: 3, row: 'r2', text: '1 + 1 + 1 = 3', when: 'right', at: 1.3 },
        { k: 'note', p: 1.5, row: 'r2', text: 'log₂ 2 is 1, not 2', when: O6[0], at: 0.3 },
        { k: 'ring', p: 3, row: 'r2', text: sits(8, 3), when: O6[2], at: 0.3 },
      ],
      opts: O6, want: O6[1], ans: '1 + 1 + 1 = 3',
      vals: { [O6[0]]: 'Yes: ' + (2 + 2 + 2) + ' and ' + (2 + 2 + 2), [O6[1]]: 'No: ' + fp(3 * Math.log2(2)) + ' and ' + (2 + 2 + 2), [O6[2]]: 'No: ' + (2 * 2 * 2) + ' and ' + (2 + 2 + 2) },
      forms: { before: [], right: ['log₂ 2 + log₂ 2 + log₂ 2 = 3', '2 + 2 + 2 = 6'] },
      task: 'Say x = 2. Is `log₂ x + log₂ x + log₂ x` the same as `x + x + x`?',
      why: 'A log is a length along the ruler, and a number like any other. `log₂ 2 = 1`, so three of them make `1 + 1 + 1 = 3`, while `2 + 2 + 2 = 6`. The log cannot be dropped as if it were not there.',
      hint: 'Not quite. A log is a length: log₂ 2 is one space.',
      hints: { [O6[0]]: 'Not quite. That treats log₂ 2 as 2. It is 1, the power 2 needs to make 2, so the logs make 3.',
        [O6[2]]: 'Not quite. 8 is three 2s multiplied, the number at power 3. The logs are lengths, and 1 + 1 + 1 = 3.' } },
    { show: true, name: 'The ruler of e', H: 130, R: { base: RE, u: 60, lo: -3.9, hi: 5.6 }, p0: 3, dur: 3.2, sw: true,
      morph: { from: R2, at: 0.4, dur: 0.7 }, glide: { from: 0, stops: [[1, 1.2, 0.5], [2, 1.9, 0.5], [3, 2.6, 0.5]] },
      text: 'The number e, about 2.71828, makes a ruler too. Each space multiplies by e, so its marks are 1, 2.718, 7.389 and 20.09. Its log is the *natural logarithm*, written ln, so `ln 7.389 ≈ 2`. On a calculator, and in this course, the log key means base 10 and the ln key base e. Any other base is written, as in log₂ 8. Flip the switch: the same number sits at a different power on each ruler.' },
    { kind: 'pick', name: 'Natural log of 10', H: 150, R: { base: RE, u: 84, lo: 0.7, fixed: true, pills: false, ask: { p: LN10, text: '10' } },
      items: [
        { k: 'askrv', text: fp(LN10), when: 'right', at: 0.2 },
        { k: 'ring', p: 1, text: sits(Math.E, 1), when: '1', at: 0.3 },
        { k: 'ring', p: 10 / Math.E, text: sits(Math.exp(10 / Math.E), 10 / Math.E, 2), when: '3.68', at: 0.3 },
      ],
      opts: ['1', '3.68', '2.303'], want: '2.303', ans: '2.303',
      vals: { '1': fp(Math.log10(10)), '3.68': fv(10 / Math.E, 2), '2.303': fp(Math.log(10)) },
      forms: { before: [], right: ['e^2.303 ≈ 10', 'ln 10 ≈ 2.303'] },
      task: 'On the ruler of e, 10 sits between 7.389 and 20.09. What is ln 10?',
      why: 'ln 10 asks what power of e makes 10. 10 is between `e² ≈ 7.389` and `e³ ≈ 20.09`, so the answer is between 2 and 3, and the ln key gives 2.303. On the ruler of 10s, 10 sits at 1: ln and log give different answers for every number except 1.',
      hint: 'Not quite. Find the powers of e either side of 10.',
      hints: { '1': 'Not quite. 1 is log₁₀ 10, on the ruler of 10s. On the ruler of e, 1 is where 2.718 sits.',
        '3.68': 'Not quite. That is 10 ÷ 2.718. A log asks for a power: 10 sits between e² and e³.' } },
    { show: true, name: 'Left of 1', H: 164, R: { base: R10, u: 68, lo: -3.9, hi: 5.5, small: true, open: true }, p0: -3, dur: 3.3, sw: true,

  K.model((p) => ({ number: numAt(p.base, p.pointer), power: p.pointer }));

  write(el('finish'), FINISH);
  write(el('cap'), CAPTION);
  function switched(d, st, from) {
    st.live = true;
    st.trans = { from };
    play(0.9);
  }
  K.update(() => {
    const i = at(), d = STEPS[i], st = S[i];
    if (!anim.playing()) T = Infinity;   // motion that was stopped (the page hidden, a test) shows finished
    if (i !== lastStep) {
      lastStep = i; enter('stepbox');
      openStep(i);
      if (d.show) play(d.dur); else { anim.pause(); T = Infinity; }
    } else if (d.show && !d.graph) {
      const P = cur();
      if (P.base !== lastBase) switched(d, st, lastBase);
      else if (P.pointer !== lastPtr) {
        // the drag, the slider or a test moved: the demonstration gives way to Dan's setting
        st.live = true; st.trans = null;
        if (anim.playing()) anim.pause();
        T = Infinity;
      }
    }
    remember();
    if (finished !== lastDone) { lastDone = finished; enter(finished ? 'done' : 'stepbox'); }
    const right = st.res === 'right';
    el('lead').hidden = i !== 0 || finished;
    el('stepbox').hidden = finished;
    el('done').hidden = !finished;
    el('count').textContent = 'Step ' + (i + 1) + ' of ' + STEPS.length;
    const task = el('task');
    task.className = 'task' + (d.show ? ' show' : '');
    write(task, d.show ? d.text : d.task);
    el('basek').hidden = finished || !d.show || !d.sw;
    paint(i);

    replayBtn.el.hidden = !d.show || REDUCE;
    el('replay').hidden = replayBtn.el.hidden;
    const opts = d.show ? [] : d.opts || [];
    el('picks').hidden = !opts.length;
    el('picks').classList.toggle('long', opts.some((o) => o.length > 6));
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      b.setLabel(opts[k]);
      b.el.textContent = '';
      b.el.appendChild(K.el('span', null, opts[k]));   // one span, so the button's gap does not split an answer
      b.el.setAttribute('aria-label', say(opts[k]));
      b.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });

    el('acts').hidden = !!d.show;
    checkBtn.el.hidden = right;
    const fb = el('fb');
    fb.hidden = !!d.show;
    fb.className = 'fb' + (right ? ' right' : st.res === 'wrong' ? ' wrong' : '');
    write(fb, d.show ? '' : right ? 'That\'s it.' : st.res === 'wrong' ? hintFor(i, st) : st.res === 'empty' ? 'Tap one of the answers.' : '');

    const why = el('why');
    why.hidden = d.show || !st.why;
    write(why, d.show ? '' : d.why);
    whyBtn.setLabel(st.why ? 'Hide why' : 'Why?');

    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !right);
    nextBtn.setLabel(i === STEPS.length - 1 ? 'Finish' : 'Continue');
    nav.hidden = backBtn.el.hidden && nextBtn.el.hidden;
  });

  // ---------- known answers, worked out by hand ----------
  const idx = (name) => STEPS.findIndex((d) => d.name === name);
  const SHOWS = STEPS.map((d, i) => i).filter((i) => STEPS[i].show);
  const RSHOWS = SHOWS.filter((i) => !STEPS[i].graph);
  const PICKS = STEPS.map((d, i) => i).filter((i) => !STEPS[i].show);
  const solvedSt = (i) => Object.assign(blank(), { pick: STEPS[i].want, res: 'right' });
  const wrongSt = (i, o) => Object.assign(blank(), { pick: o, res: 'wrong' });
  const liveSt = () => Object.assign(blank(), { live: true });
  const close = (a, b, tol) => Math.abs(a - b) <= (tol != null ? tol : 1e-9 * Math.max(1, Math.abs(a), Math.abs(b)));
  // A step painted in the state and settings given (finished, or t seconds into its motion): what it draws.
  function drawn(i, st, P, t) {
    const keepS = S[i], keepT = T;
    S[i] = st; T = t == null ? Infinity : t;
    try {
      paint(i, P || openP(i));
      return { texts: Array.from(art.querySelectorAll('text')).map((q) => q.textContent), rec: REC };
    } finally { S[i] = keepS; T = keepT; }
  }
  // Every check repaints the screen Dan is on when it is done.
  const chk = (label, fn, opt) => K.check(label, () => { try { return fn(); } finally { paint(); } }, opt);
  const TRY = [-3, -2.5, -1, 0, L2, 0.5, 1, L45, 2.5, 3, 4.2, 5];
  function states() {
    const out = [];
    STEPS.forEach((d, i) => {
      out.push([i, blank(), openP(i)]);
      if (d.show && !d.graph) OPT.forEach((base) => TRY.forEach((p) => out.push([i, liveSt(), { base, pointer: p }])));
      else if (!d.show) { out.push([i, solvedSt(i), openP(i)]); d.opts.filter((o) => o !== d.want).forEach((o) => out.push([i, wrongSt(i, o), openP(i)])); }
    });
    return out;
  }
  let ALL = null;
  const all = () => ALL || (ALL = states().map((x) => ({ i: x[0], g: drawn(x[0], x[1], x[2]) })));

  chk('The base 2 logarithm of 32 is 5, because 5 is the exponent we must apply to 2 to get 32: on the ruler of 2s the model puts 32 above the power 5, and the ruler and the pointer read 32 and 5 there', () => {
    const o = K.at({ base: R2, pointer: 5 }), g = drawn(idx('The ruler of 2s'), liveSt(), { base: R2, pointer: 5 });
    const m = g.rec.marks.find((q) => q.k === 5);
    return o.number === 32 && o.power === 5 && !!m && m.text === '32' && !!g.rec.tag && g.rec.tag.num === '32' && g.rec.tag.pow === '5' && g.rec.forms[1] === 'log₂ 32 = 5';
  }, { source: SRC1 });
  chk('e is a fixed constant of approximately 2.71828: every space on the ruler of e multiplies by 2.71828, and its first big mark reads 2.718', () =>
    close(BASE[RE], 2.71828, 1e-5) && fn4(Math.E) === '2.718' &&
    [-3, -2, -1, 0, 1, 2, 3, 4].every((k) => close(numAt(RE, k + 1) / numAt(RE, k), 2.71828, 1e-5)), { source: SRC2 });
  chk('The logarithmic function with base e is called the natural logarithmic function: on the ruler of e the power below the pointer is the natural log of the number above it at every setting tried, and it is written ln', () =>
    [-3, -1.25, 0, 0.5, 1, LN10, 3.807, 5].every((p) => close(Math.log(K.at({ base: RE, pointer: p }).number), p, 1e-9)) &&
    formsOf(RE, 2)[1].indexOf('ln ') === 0, { source: SRC3 });
  chk('On every ruler each big mark is the base to the power beneath it: one space right multiplies the number by the base and adds 1 to the power, every space is marked × the base, and every number drawn is above 0', () => {
    const steps = OPT.every((nm) => { for (let k = PMIN; k < PMAX; k++) { if (!close(numAt(nm, k + 1) / numAt(nm, k), BASE[nm], 1e-12 * BASE[nm])) return false; } return true; });
    const labels = [-3, -2, -1, 0, 1, 2, 3, 4, 5].map((k) => fn4(numAt(R10, k))).join('|') === ['0.001', '0.01', '0.1', '1', '10', '100', '1000', '10' + NB + '000', '100' + NB + '000'].join('|') &&
      [-3, -2, -1, 0, 1, 2, 3, 4, 5].map((k) => fn4(numAt(R2, k))).join(' ') === '0.125 0.25 0.5 1 2 4 8 16 32' &&
      [0, 1, 2, 3].map((k) => fn4(numAt(RE, k))).join(' ') === '1 2.718 7.389 20.09';
    const pics = all().every(({ g }) => g.rec.marks.every((q) => q.v > 0 && q.text === fn4(numAt(g.rec.name, q.k))) &&
      g.rec.pows.every((q) => q.text === '?' || q.text === fp(q.k)) && g.rec.pills.every((q) => q.text === '× ' + SYM[g.rec.name]));
    return steps && labels && pics;
  });
  chk('The pointer reads the number and power the model gives, and the two forms say the same fact, at every setting tried on every ruler screen; it stays in the window, and the drag maps the finger back to the same setting', () =>
    RSHOWS.every((i) => OPT.every((base) => TRY.every((p) => {
      const g = drawn(i, liveSt(), { base, pointer: p }), o = K.at({ base, pointer: p }), x = xAt(g.rec.view, p);
      return !!g.rec.tag && g.rec.tag.num === fn4(o.number) && g.rec.tag.pow === fp(o.power) && close(o.number, Math.pow(BASE[base], p), 1e-9 * Math.max(1, o.number)) &&
        g.rec.forms.join('|') === formsOf(base, p).join('|') && x >= WL + 4 && x <= WR - 4 && close(posFromX(STEPS[i].R, x), p, 1e-9);
    }))));
  chk('Half a space multiplies by √10 ≈ 3.162, so 316.2 sits at 2.5, and equal lengths multiply by equal factors anywhere on every ruler: the stretch from the mark before the pointer reads × 3.162 at 2.5 and at 0.5 alike', () => {
    const half = close(K.at({ pointer: 2.5 }).number / K.at({ pointer: 2 }).number, Math.sqrt(10), 1e-12) && fn4(Math.sqrt(10)) === '3.162' && fn4(K.at({ pointer: 2.5 }).number) === '316.2';
    const equal = OPT.every((base) => [-2.7, -0.4, 0.3, 1.9, 3.3].every((a) => close(K.at({ base, pointer: a + 0.37 }).number / K.at({ base, pointer: a }).number, Math.pow(BASE[base], 0.37), 1e-9)));
    const i = idx('Between the marks'), a = drawn(i, liveSt(), { base: R10, pointer: 2.5 }).rec.part, b = drawn(i, liveSt(), { base: R10, pointer: 0.5 }).rec.part;
    return half && equal && !!a && !!b && a.text === '× 3.162' && b.text === '× 3.162' && a.from === 2 && b.from === 0;
  });
  chk('Ten 2s multiplied make 1024, just over 10³, so 2 sits just past 0.3 of a space: the small marks 2, 3 and 5 sit at 0.301, 0.477 and 0.699 inside the first space, as the magnified space shows, and 45 sits at 1.653', () => {
    const nums = Math.pow(2, 10) === 1024 && 10 * L2 > 3 && 10 * L2 < 3.02 && fp(L2) === '0.301' && fp(L3) === '0.477' && fp(L5) === '0.699' && fp(L45) === '1.653' && close(Math.pow(10, L45), 45, 1e-9) && fn4(Math.pow(10, L45)) === '45';
    const g = drawn(idx('Between the marks'), blank());
    const inset = ['0.301', '0.477', '0.699', '2', '3', '5', 'The space from 1 to 10, magnified'].every((s) => g.texts.indexOf(s) >= 0);
    const order = SMALL.every((q, j) => q[1] > 0 && q[1] < 1 && (j === 0 || q[1] > SMALL[j - 1][1]));
    return nums && inset && order && !!g.rec.tag && g.rec.tag.num === '45' && g.rec.tag.pow === '1.653';
  });
  chk('Left of 1 each space divides by the base again: 0.1, 0.01 and 0.001 sit at −1, −2 and −3, there is no mark at 0 or below, and the open left end says no power gets there', () => {
    const nums = fn4(numAt(R10, -1)) === '0.1' && fn4(numAt(R10, -2)) === '0.01' && fn4(numAt(R10, -3)) === '0.001' && K.at({ pointer: PMIN }).number > 0;
    const g = drawn(idx('Left of 1'), blank());
    return nums && g.rec.open && g.texts.indexOf('no power') >= 0 && g.texts.indexOf('gets here') >= 0 && !!g.rec.tag && g.rec.tag.num === '0.001' && g.rec.tag.pow === '−3' &&
      all().every(({ g: h }) => h.rec.marks.every((q) => q.v > 0 && plain(q.text) > 0));
  });
  chk('Every number follows its rule: 1000, 10 000 and 100 000 above 3, 4 and 5; 316.2 at 2.5; 1024 for ten 2s; 45 at 1.653; 2.783 at 0.444; 32 at 5 and 3 + 3 = 6 on the ruler of 2s; 2.718, 7.389 and 20.09 on the ruler of e; 2.303 for ln 10, and 3.68 for 10 ÷ 2.718, where 39.6 sits; 0.602 for 4; 1 048 576 for 4¹⁰; 0.693 for ln 2 and 0.869 for log₁₀ 7.389; and each answer offered is the value its own working gives', () => {
    const ok = fn4(1e3) === '1000' && fn4(1e4) === '10' + NB + '000' && fn4(1e5) === '100' + NB + '000' && fn4(Math.pow(10, 2.5)) === '316.2' &&
      fn4(Math.pow(10, 4 / 9)) === '2.783' && fp(4 / 9) === '0.444' && fp(L4) === '0.602' && fn4(Math.pow(4, 10)) === '1' + NB + '048' + NB + '576' &&
      fp(LN10) === '2.303' && fv(10 / Math.E, 2) === '3.68' && fn4(Math.exp(10 / Math.E)) === '39.6' && fn4(E2) === '7.389' && fn4(Math.exp(3)) === '20.09' &&
      fp(Math.log(2)) === '0.693' && fp(Math.log10(E2)) === '0.869' && 3 + 3 === 6 && numAt(R2, 3) === 8;
    const answers = PICKS.every((i) => { const d = STEPS[i]; return d.opts.every((o) => d.vals[o] === o); });
    return ok && answers;
  });
  const shows = (texts, ans) => texts.some((x) => x === ans || (x.indexOf(ans) === 0 && /\s/.test(x.charAt(ans.length))));
  chk('Before an answer, nothing in a puzzle\'s picture or forms gives it away, and a right answer shows it', () =>
    PICKS.every((i) => {
      const d = STEPS[i], b = drawn(i, blank()), r = drawn(i, solvedSt(i));
      return !shows(b.texts, d.ans) && !shows(b.rec.forms, d.ans) && shows(r.texts, d.ans);
    }));
  chk('Each puzzle offers three answers and takes only its right one, and every wrong answer has a hint of its own and draws its slip', () =>
    PICKS.every((i) => {
      const d = STEPS[i];
      return d.opts.length === 3 && d.opts.indexOf(d.want) >= 0 && d.opts.every((o) => isRight(i, Object.assign(blank(), { pick: o })) === (o === d.want)) &&
        d.opts.every((o) => o === d.want || (!!(d.hints && d.hints[o]) && (o === 'There is none' || drawn(i, wrongSt(i, o)).rec.notes.length > 0)));
    }));
  chk('The fold swaps each point\'s two numbers: every point of the folded curve is a point of y = eˣ with x and y swapped and lies on y = ln x, half way through the fold every point sits on y = x, (2, 7.389) lands on (7.389, 2), and every label on the graphs is clear of the lines and of one another', () => {
    const g = drawn(idx('The fold'), blank()), r = g.rec.graph;
    const want = ['(0, 1)', '(1, 2.718)', '(2, 7.389)', '(1, 0)', '(2.718, 1)', '(7.389, 2)'];
    const folded = !!r && r.folded.length === EXP.length && r.folded.every((q, j) => close(q[0], EXP[j][1], 1e-8) && close(q[1], EXP[j][0], 1e-8) && close(q[1], Math.log(q[0]), 1e-8));
    const mid = EXP.every((q) => { const f = foldPt(q[0], q[1], 0.5); return close(f[0], f[1], 1e-8); });
    const i13 = idx('Fold a point'), s13 = drawn(i13, solvedSt(i13)).rec.graph;
    const clear = [drawn(i13, blank()), drawn(i13, solvedSt(i13))].concat(STEPS[i13].opts.filter((o) => o !== STEPS[i13].want).map((o) => drawn(i13, wrongSt(i13, o)))).every((x) => x.rec.graph.labelsOk);
    return folded && mid && r.labelsOk && want.every((s) => g.texts.indexOf(s) >= 0) && !!s13.move && close(s13.move[0], E2, 1e-8) && close(s13.move[1], 2, 1e-8) && clear;
  });
  chk('Every demonstration has finished arriving within its time (at most 4.5 s), none starting before the 0.35 s screen fade ends; every answer\'s motion, right or wrong, within 2.5 s', () => {
    const keepT = T;
    const timed = (i, st, limit) => {
      const keepS = S[i];
      T = Infinity; latest = 0; earliest = Infinity;
      S[i] = st;
      try { paint(i, openP(i)); } finally { S[i] = keepS; }
      return latest <= limit + 1e-9;
    };
    const ok = STEPS.every((d, i) => {
      if (d.show) { const r = timed(i, blank(), d.dur); return r && d.dur <= 4.5 && d.dur >= 3 && earliest >= FADE; }
      return timed(i, solvedSt(i), FB[0]) && FB[0] <= 2.5 && d.opts.filter((o) => o !== d.want).every((o) => timed(i, wrongSt(i, o), FB[1]) && FB[1] <= 2.5);
    });
    T = keepT;
    return ok;
  });

  K.ready();
</script>
