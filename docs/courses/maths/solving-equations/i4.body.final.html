<style>

  .pz { max-width: 30rem; }

  .pz .k-stepper { gap: 0; }
  .pz .k-stepper .k-label, .pz .k-stepper-nav { display: none; }

  .nw { white-space: nowrap; }

  .vx { font-style: italic; }
  .scene { display: block; width: 100%; }

  .scene .card { fill: var(--k-panel); stroke: var(--k-strong); stroke-width: 1.5; }
  .scene .lt { font: italic 700 26px var(--k-font); fill: var(--k-ink); }
  .scene .eqs { font: 700 24px var(--k-font); fill: var(--k-ink); }
  .scene .tag { font: 700 14px var(--k-font); fill: var(--k-accent); letter-spacing: .02em; }
  .scene .chip { fill: var(--k-bg); stroke: var(--k-line); stroke-width: 1.5; }
  .scene .cht { font: 700 13px var(--k-font); fill: var(--k-ink); }
  .scene .term { font: 700 21px var(--k-font); fill: var(--k-ink); }
  .scene .hl { fill: var(--k-hl); }

     step being undone lights up solid. A box still to fill in is dashed with a '?'. A slip is in the
     warning colour. */
  .scene .vb { fill: var(--k-panel); stroke: var(--k-strong); stroke-width: 1.5; }
  .scene .ob { fill: var(--k-bg); stroke: var(--k-accent2); stroke-width: 2; }
  .scene .ob.lit { fill: var(--k-accent2); }
  .scene .gap { fill: var(--k-bg); stroke: var(--k-accent2); stroke-width: 1.5; stroke-dasharray: 4 3; }
  .scene .warnb { stroke: var(--k-warn); stroke-width: 2.5; }
  .scene .val { font: 700 17px var(--k-font); fill: var(--k-ink); }
  .scene .opl { font: 700 16px var(--k-font); fill: var(--k-accent2); }
  .scene .opl.lit { fill: var(--k-on-accent2); }
  .scene .qm { font: 700 15px var(--k-font); fill: var(--k-muted); }
  .scene .rl { font: 700 14px var(--k-font); fill: var(--k-accent); letter-spacing: .03em; }
  .scene .ar { stroke: var(--k-muted); stroke-width: 1.5; }
  .scene .arh { fill: var(--k-muted); }
  .scene .wk { font: 700 18px var(--k-font); fill: var(--k-ink); }
  .scene .wk2 { font: 700 20px var(--k-font); fill: var(--k-ink); }

  .row { display: flex; flex-wrap: wrap; gap: 10px; }

  .replay { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 10px; }
  .replay .k-btn { flex: 0 0 auto; min-height: 44px; padding-left: 16px; padding-right: 16px; font-size: .95rem; white-space: nowrap; }
  /* The answers stay on one row, each label whole, at every text size; longer ones stack one to a row. */
  .row.picks { flex-wrap: nowrap; }

<p class="caption">Substitute in each letter's own unit, undo the steps, then check. The amounts are example values.</p>

<script>
  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // pic: the picture a step draws. 'formula': a formula card `f` (FORM below) with the amounts `giv`
  // put in, each [number, unit], and `find` the letter still unknown; under it the flow diagram of the
  // steps done to that letter, undone in reverse (or, when the unknown is the formula's subject, its
  // steps worked forwards), and the check. 'derive': P = VI turned into P = I²R by putting IR in for V.
  // 'job': a job card, the job's amounts `job.chips` over the equation made from them (a × v + b = c),
  // then the flow diagram and the check. ask: what a job puzzle asks for ('eq' the equation, 'val' the
  // answer). dur: how long a demonstration plays; fb: how long the motion after a right answer plays
  // (seconds); at: when each part of that motion arrives, in seconds after Check. slips: which slip gives
  // each wrong answer (SLIP below).
  const PICK = 'Tap one of the answers.';
  // Each letter's unit, as a symbol and as the card names it.
  const UNIT = { V: 'V', I: 'A', R: 'Ω', P: 'W' };
  const WORD = { V: 'volts', I: 'amps', R: 'ohms', P: 'watts' };
  // A formula: lhs = a × b, with a squared in P = I²R.
  const FORM = {
    VIR: { lhs: 'V', a: 'I', b: 'R', sq: false, name: 'V = IR' },
    PVI: { lhs: 'P', a: 'V', b: 'I', sq: false, name: 'P = VI' },
    PIR: { lhs: 'P', a: 'I', b: 'R', sq: true, name: 'P = I²R' },
  };
  // An amount in a unit that is not its letter's own goes in multiplied by this: kW to W, mA to A.
  const SCALE = { kW: 1000, mA: 0.001 };
  const J = (v, a, b, c, u, chips) => ({ v: v, a: a, b: b, c: c, u: u, chips: chips });
  // After a right answer. SOLVE: the undo box lights under the step it undoes, with the amount it
  // starts from; the answer; the check. SOLVE_C: first the amount in milliamps turns into amps. FWD: the
  // current; times itself; times R, giving the power; the check by V = IR and P = VI. FWD_C: the
  // milliamps turn into amps first. JOB: the equation; the steps done to the unknown; each undo; the check.
  const SOLVE = { undo: 0.1, ans: 0.55, check: 1.0 };
  const SOLVE_C = { conv: 0.1, undo: 1.0, ans: 1.45, check: 1.9 };
  const FWD = { a1: 0.1, sq: 0.55, mul: 1.0, check: 1.45 };
  const FWD_C = { conv: 0.1, a1: 0.95, sq: 1.4, mul: 1.85 };
  const JOB = { eq: 0.1, rowA: 0.55, u1: 1.0, u2: 1.45, check: 1.9 };
  // After a wrong answer: the slip, in the warning colour (a check that fails, a wrong order of steps,
  // or a wrong equation).
  const WRONG = { slip: 0.1 }, WRONG_DUR = 0.7;
  const STEPS = [
    { show: true, pic: 'formula', demo: 'solve', dur: 3.3, f: 'VIR', giv: { V: [230, 'V'], R: [46, 'Ω'] }, find: 'I', name: 'Put the numbers in',
      text: '*Substitute* what you know into V = IR, 230 V for V and 46 Ω for R. That leaves 230 = I × 46. Undo the × 46 with ÷ 46, so I = 5 A.' },
    { kind: 'pick', pic: 'formula', f: 'VIR', giv: { V: [12, 'V'], I: [3, 'A'] }, find: 'R', name: 'Find the resistance',
      opts: ['4 Ω', '36 Ω', '0.25 Ω'], want: '4 Ω', slips: { '36 Ω': 'again', '0.25 Ω': 'flip' }, fb: 1.7, at: SOLVE,
      task: 'A 12 V supply drives 3 A through a resistor. Using V = IR, what is its resistance?',
      why: 'Substituting gives 12 = 3 × R, so R has been multiplied by 3. Undo that with ÷ 3, and 12 ÷ 3 = 4 Ω. As a check, 3 × 4 = 12.',
      hint: 'Not quite. Run your answer back through V = IR to check it.',
      hints: { '36 Ω': 'Not quite. That multiplies by 3 again instead of undoing it, so the check fails. Undo × 3 with ÷ 3.',
        '0.25 Ω': 'Not quite. That divides 3 by 12, the wrong way round. It is the 12 that gets ÷ 3.' } },
    { show: true, pic: 'formula', demo: 'units', dur: 4.2, f: 'PVI', giv: { P: [2.3, 'kW'], V: [230, 'V'] }, find: 'I', name: 'In its own unit',
      text: 'Put each amount in using its letter\'s unit. P is in watts, so a 2.3 kW heater counts as 2300 W. On 230 V, 2300 = 230 × I, so I = 10 A.' },
    { kind: 'pick', pic: 'formula', f: 'VIR', giv: { V: [24, 'V'], I: [50, 'mA'] }, find: 'R', name: 'Milliamps',
      opts: ['480 Ω', '0.48 Ω', '1.2 Ω'], want: '480 Ω', slips: { '0.48 Ω': 'milli', '1.2 Ω': 'again' }, fb: 2.5, at: SOLVE_C,
      task: 'A 24 V DC relay coil draws 50 mA. Using V = IR, what is the coil\'s resistance?',
      why: 'I is in amps, and 50 mA is 0.05 A. So 24 = 0.05 × R, and R = 24 ÷ 0.05 = 480 Ω. As a check, 0.05 × 480 = 24.',
      hint: 'Not quite. Put the current in in amps, then undo.',
      hints: { '0.48 Ω': 'Not quite. That puts the 50 in as amps. 50 mA is 0.05 A.',
        '1.2 Ω': 'Not quite. That multiplies by the current again instead of undoing it. Undo × I with ÷ I.' } },
    { kind: 'pick', pic: 'formula', f: 'PVI', giv: { P: [12, 'W'], V: [24, 'V'] }, find: 'I', name: 'Find the current',
      opts: ['0.5 A', '2 A', '288 A'], want: '0.5 A', slips: { '2 A': 'flip', '288 A': 'again' }, fb: 1.7, at: SOLVE,
      task: 'A 12 W lamp runs on a 24 V supply. Using P = VI, what current does it draw?',
      why: 'Substituting gives 12 = 24 × I. Undo × 24 with ÷ 24, and 12 ÷ 24 = 0.5 A. As a check, 24 × 0.5 = 12.',
      hint: 'Not quite. Run your answer back through P = VI to check it.',
      hints: { '2 A': 'Not quite. That divides 24 by 12, the wrong way round. It is the 12 that gets ÷ 24.',
        '288 A': 'Not quite. That multiplies by 24 again instead of undoing it. Undo × 24 with ÷ 24.' } },
    { show: true, pic: 'derive', demo: 'derive', dur: 3.8, f: 'PIR', giv: { I: [10, 'A'], R: [23, 'Ω'] }, find: 'P', name: 'Where I²R comes from',
      text: 'Put IR in for V and P = VI becomes P = IR × I. That is I × I × R, or I²R, so 10 A through 23 Ω gives 10 × 10 × 23 = 2300 W.' },
    { kind: 'pick', pic: 'formula', f: 'PIR', giv: { I: [3, 'A'], R: [10, 'Ω'] }, find: 'P', name: 'Square first',
      opts: ['90 W', '60 W', '900 W'], want: '90 W', slips: { '60 W': 'double', '900 W': 'irsq' }, fb: 2.1, at: FWD,
      task: 'A 10 Ω resistor carries 3 A. Using P = I²R, what power does it give out?',
      why: 'I² means 3 × 3 = 9, worked out before the × R. So P = 9 × 10 = 90 W. As a check, V = IR gives 3 × 10 = 30 V, and P = VI gives 30 × 3 = 90 W.',
      hint: 'Not quite. Square the current first, then multiply by R.',
      hints: { '60 W': 'Not quite. That doubles the 3. I² means 3 × 3, not 3 × 2.',
        '900 W': 'Not quite. That squares 3 × 10. Only the I is squared, so square the 3 first.' } },
    { kind: 'pick', pic: 'formula', f: 'PIR', giv: { P: [1000, 'W'], I: [5, 'A'] }, find: 'R', name: 'Resistance from power',
      opts: ['40 Ω', '100 Ω', '200 Ω'], want: '40 Ω', slips: { '100 Ω': 'double', '200 Ω': 'nosq' }, fb: 1.7, at: SOLVE,
      task: 'A heater element gives out 1000 W when it carries 5 A. Using P = I²R, what is its resistance?',
      why: 'Substituting gives 1000 = 5² × R, and 5² = 25. Undo × 25 with ÷ 25, so R = 1000 ÷ 25 = 40 Ω. As a check, 5² × 40 = 1000.',
      hint: 'Not quite. Run your answer back through P = I²R to check it.',
      hints: { '100 Ω': 'Not quite. That divides by 10, from doubling the 5. 5² is 5 × 5 = 25.',
        '200 Ω': 'Not quite. That divides by 5 and leaves out the square. 5² is 25.' } },
    { show: true, pic: 'job', demo: 'job', dur: 4.3, job: J('t', 15, 50, 200, 'min', ['15 L a minute', '50 L at start', '200 L in all']), name: 'From a job to an equation',
      text: 'A tank has 50 L and a pump adds 15 L a minute. After t minutes it holds 15t + 50 litres. It holds 200 L when 15t + 50 = 200, at t = 10 minutes.' },
    { kind: 'pick', pic: 'job', ask: 'eq', job: J('n', 5, 15, 50, '', ['5 m a length', '15 m left', '50 m on drum']), name: 'Which equation?',
      opts: ['5n + 15 = 50', '15n + 5 = 50', '5n − 15 = 50'], want: '5n + 15 = 50', slips: { '15n + 5 = 50': 'swapEq', '5n − 15 = 50': 'takeEq' }, fb: 2.5, at: JOB,
      task: 'A drum had 50 m of cable. After n lengths of 5 m were cut, 15 m was left. Which equation fits?',
      why: 'The n lengths of 5 m make 5n metres. Add the 15 m left and you have the drum\'s 50 m, so 5n + 15 = 50. That gives n = 7, and 5 × 7 + 15 = 50.',
      hint: 'Not quite. Match each number to what it measures.',
      hints: { '15n + 5 = 50': 'Not quite. That cuts lengths of 15 m and leaves 5 m. Each length is 5 m, and 15 m is left.',
        '5n − 15 = 50': 'Not quite. That takes the 15 m off. What was cut and what is left add up to the 50 m.' } },
    { kind: 'pick', pic: 'job', ask: 'val', job: J('h', 30, 60, 180, 'h', ['£30 an hour', '£60 callout', '£180 bill']), name: 'The callout',
      opts: ['4 h', '8 h', '2.5 h'], want: '4 h', slips: { '8 h': 'jobAgain', '2.5 h': 'jobSwap' }, fb: 2.5, at: JOB,
      task: 'A callout costs £60, then £30 for each hour. The bill is £180. How many hours was the job?',
      why: 'The bill is 30h + 60 = 180. Take the £60 off first, 180 − 60 = 120, then 120 ÷ 30 = 4 hours. As a check, 30 × 4 + 60 = 180.',
      hint: 'Not quite. Write the bill as an equation, then undo it.',
      hints: { '8 h': 'Not quite. That adds the £60 instead of taking it off, so the check fails. Take it off first.',
        '2.5 h': 'Not quite. That charges £60 an hour and £30 once. The £30 goes with each hour.' } },
    { kind: 'pick', pic: 'formula', f: 'PIR', giv: { I: [200, 'mA'], R: [100, 'Ω'] }, find: 'P', name: 'Milliamps squared',
      opts: ['0.04 W', '4 W', '40 W'], want: '4 W', slips: { '0.04 W': 'tenth', '40 W': 'double' }, fb: 2.5, at: FWD_C,
      task: 'A 100 Ω resistor carries 200 mA. Using P = I²R, what power does it give out?',
      why: '200 mA is 0.2 A, and 0.2² = 0.2 × 0.2 = 0.04. So P = 0.04 × 100 = 4 W. As a check, V = IR gives 0.2 × 100 = 20 V, and P = VI gives 20 × 0.2 = 4 W.',
      hint: 'Not quite. Put the current in in amps, then square it first.',
      hints: { '0.04 W': 'Not quite. 200 mA is 0.2 A, not 0.02 A.',
        '40 W': 'Not quite. That doubles the 0.2. Squaring means 0.2 × 0.2.' } },
  ];
  const FINISH = 'A formula is an equation with a letter for each amount, each in its own unit. Put in what you know in those units, undo the steps to find the one you don\'t, and check it. A job\'s amounts make an equation the same way.';
  // When each demonstration's parts arrive, in seconds after the screen opens (the screen itself
  // takes FADE to fade in, so nothing starts before it has settled). solve: the amounts under their
  // letters; the steps done to the unknown; the undo box lights; the answer, in the flow diagram and on
  // the card; the check. units: as solve, the kilowatts turning into watts before the flow diagram.
  // derive: IR put in for V; I × I × R; the card for P = I²R with the amounts; the working; the power
  // on the card; the check by P = VI. job: each term of the equation under its amount; the steps done
  // to the unknown; the last step undone; the first step undone and the answer; the check.
  const FADE = 0.35;
  const AT = {
    solve: { vals: 0.6, rowA: 1.1, undo: 1.6, ans: 2.1, check: 2.6 },
    units: { vals: 0.6, conv: 1.1, rowA: 2.0, undo: 2.5, ans: 3.0, check: 3.5 },
    derive: { l2: 0.6, l3: 1.1, card: 1.6, work: 2.1, pval: 2.6, check: 3.1 },
    job: { t1: 0.6, t2: 1.1, t3: 1.6, rowA: 2.1, u1: 2.6, u2: 3.1, check: 3.6 },
  };
  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  // While the kit's self-test looks at every screen it switches fades off (the k-testing class):
  // demonstrations then open finished, as they do with reduced motion.
  const testing = () => document.documentElement.classList.contains('k-testing');

  // ---------- numbers (pure, so the checks can test them) ----------
  const r3 = (v) => Math.round(v * 1000) / 1000;
  const same = (a, b) => K.near(a, b, 1e-9);
  // A number as the page writes it: 0.25, 2300, 10,000, with a true minus sign.
  function num(v) {
    const a = Math.round(v * 1e6) / 1e6;
    let s = String(Math.abs(a));
    if (Math.abs(a) >= 10000) s = s.replace(/^(\d+)(\d{3})/, '$1,$2');
    return (a < 0 ? '−' : '') + s;
  }
  const amt = (v, u) => (u ? num(v) + ' ' + u : num(v));
  // An amount in its letter's own unit; as the job gives it (2.3 kW, 50 mA); whether a step has one to turn.
  const base = (q) => r3(q[0] * (SCALE[q[1]] || 1));
  const given = (q) => amt(q[0], q[1]);
  const converts = (d) => !!d.giv && Object.keys(d.giv).some((L) => !!SCALE[d.giv[L][1]]);
  // The letter the unknown is multiplied by, and that amount (squared when it is the I of I²R).
  const other = (d) => { const f = FORM[d.f]; return d.find === f.a ? f.b : f.a; };
  function kOf(d) { const f = FORM[d.f], o = other(d), v = base(d.giv[o]); return f.sq && o === f.a ? r3(v * v) : v; }
  // The unknown: the subject worked forwards, or the subject undone by ÷ k.
  function solveF(d) {
    const f = FORM[d.f];
    if (d.find === f.lhs) { const a = base(d.giv[f.a]); return r3((f.sq ? a * a : a) * base(d.giv[f.b])); }
    return r3(base(d.giv[f.lhs]) / kOf(d));
  }
  // The formula worked forwards with x for the unknown: 5 × 46 = 230, 5² × 40 = 1000 (", not 12" when it fails).
  function checkF(d, x) {
    const f = FORM[d.f], va = d.find === f.a ? x : base(d.giv[f.a]), vb = d.find === f.b ? x : base(d.giv[f.b]);
    const got = r3((f.sq ? va * va : va) * vb), want = base(d.giv[f.lhs]);
    return (f.sq ? num(va) + '²' : num(va)) + ' × ' + num(vb) + ' = ' + num(got) + (same(got, want) ? '' : ', not ' + num(want));
  }
  // P = I²R worked forwards, checked by the other route on two lines, V from V = IR and then P = VI:
  // "V = IR = 3 × 10 = 30" over "P = VI = 30 × 3 = 90".
  function checkVI(d) {
    const I = base(d.giv.I), R = base(d.giv.R), V = r3(I * R);
    return ['V = IR = ' + num(I) + ' × ' + num(R) + ' = ' + num(V), 'P = VI = ' + num(V) + ' × ' + num(I) + ' = ' + num(V * I)];
  }
  // The flow diagram of a formula with one unknown: the unknown, × k, the subject (the step in the
  // job's own unit until it is turned: × 50 mA, then × 0.05; in I²R, × 5²); and its undo, ÷ k.
  function kLabel(d, turned) {
    const f = FORM[d.f], o = other(d), q = d.giv[o];
    if (f.sq && o === f.a) return '× ' + num(q[0]) + '²';
    return '× ' + (SCALE[q[1]] && !turned ? given(q) : num(base(q)));
  }
  const lhsLabel = (d, turned) => { const q = d.giv[FORM[d.f].lhs]; return SCALE[q[1]] && !turned ? given(q) : num(base(q)); };
  const solveA = (d, turned) => [d.find, kLabel(d, turned), lhsLabel(d, turned)];
  const solveB = (d) => [num(solveF(d)), '÷ ' + num(kOf(d)), num(base(d.giv[FORM[d.f].lhs]))];
  // P = I²R worked forwards: the current, times itself, times R. A slip's order: doubled instead of
  // squared, I × R squared, or the current turned into amps a place too far.
  function fwdRow(d, slip) {
    const I = base(d.giv.I), R = base(d.giv.R);
    if (slip === 'tenth') { const i = I / 10; return [num(i), '× ' + num(i), num(i * i), '× ' + num(R), num(i * i * R)]; }
    if (slip === 'double') return [num(I), '× 2', num(2 * I), '× ' + num(R), num(2 * I * R)];
    if (slip === 'irsq') return [num(I), '× ' + num(R), num(I * R), '× ' + num(I * R), num(I * R * I * R)];
    return [num(I), '× ' + num(I), num(I * I), '× ' + num(R), num(I * I * R)];
  }
  // A job: a × v + b = c, so v = (c − b) ÷ a. Its terms, its flow diagram and undo, and its check.
  const jobAns = (j) => r3((j.c - j.b) / j.a);
  const termsOf = (j) => [num(j.a) + j.v, '+ ' + num(j.b), '= ' + num(j.c)];
  const jobEq = (j) => termsOf(j).join(' ');
  const jobA = (j) => [j.v, '× ' + num(j.a), num(j.a) + j.v, '+ ' + num(j.b), num(j.c)];
  const jobB = (j) => [num(jobAns(j)), '÷ ' + num(j.a), num(j.c - j.b), '− ' + num(j.b), num(j.c)];
  function checkJ(j, x) { const got = r3(j.a * x + j.b); return num(j.a) + ' × ' + num(x) + ' + ' + num(j.b) + ' = ' + num(got) + (same(got, j.c) ? '' : ', not ' + num(j.c)); }
  // A wrong equation's terms: the rate and the fixed amount swapped; or what is left taken off instead
  // of added. EQROOT: the amount each wrong equation gives, which the job's check then fails.
  const swapTerms = (j) => [num(j.b) + j.v, '+ ' + num(j.a), '= ' + num(j.c)];
  const takeTerms = (j) => [num(j.a) + j.v, '− ' + num(j.b), '= ' + num(j.c)];
  const EQROOT = { swapEq: (j) => r3((j.c - j.a) / j.b), takeEq: (j) => r3((j.c + j.b) / j.a) };
  // The answer a puzzle wants, worked out by its rule, as its button reads.
  function answerOf(d) {
    if (d.pic === 'job') return d.ask === 'eq' ? jobEq(d.job) : amt(jobAns(d.job), d.job.u);
    return amt(solveF(d), UNIT[d.find]);
  }
  // What each slip makes of the answer. again: the step done again instead of undone (× k). flip: the
  // division the wrong way round (k ÷ the subject). milli: milliamps put in as amps. double: the current
  // doubled instead of squared. irsq: I × R squared. nosq: the square left out. jobAgain: the fixed
  // amount added instead of taken off. jobSwap: the rate and the fixed amount swapped. swapEq, takeEq:
  // the equation with the rate and the fixed amount swapped, or with what is left taken off instead of
  // added. tenth: milliamps turned into amps one place too far (200 mA as 0.02 A).
  const lhsOf = (d) => base(d.giv[FORM[d.f].lhs]);
  const SLIP = {
    again: (d) => amt(lhsOf(d) * kOf(d), UNIT[d.find]),
    flip: (d) => amt(kOf(d) / lhsOf(d), UNIT[d.find]),
    milli: (d) => amt(lhsOf(d) / d.giv[other(d)][0], UNIT[d.find]),
    double: (d) => (d.find === 'P' ? amt(2 * base(d.giv.I) * base(d.giv.R), 'W') : amt(lhsOf(d) / (2 * base(d.giv.I)), UNIT[d.find])),
    irsq: (d) => { const v = base(d.giv.I) * base(d.giv.R); return amt(v * v, 'W'); },
    nosq: (d) => amt(lhsOf(d) / base(d.giv.I), UNIT[d.find]),
    jobAgain: (d) => amt((d.job.c + d.job.b) / d.job.a, d.job.u),
    jobSwap: (d) => amt((d.job.c - d.job.a) / d.job.b, d.job.u),
    swapEq: (d) => swapTerms(d.job).join(' '),
    takeEq: (d) => takeTerms(d.job).join(' '),
    tenth: (d) => { const I = base(d.giv.I) / 10; return amt(I * I * base(d.giv.R), 'W'); },
  };
  // An option's worth: "0.25 Ω" is 0.25, "10,000 W" is 10000; an equation has none.
  const valueOf = (s) => { const m = /^£?(−?)(\d[\d,]*(?:\.\d+)?)(?:\s|$)/.exec(s); return m ? (m[1] ? -1 : 1) * +m[2].replace(/,/g, '') : NaN; };
  // As a screen reader says it.
  const say = (s) => String(s).replace(/ /g, ' ').replace(/£(\d[\d,.]*)/g, '$1 pounds')
    .replace(/(\d) kW\b/g, '$1 kilowatts').replace(/(\d) mA\b/g, '$1 milliamps').replace(/(\d) min\b/g, '$1 minutes')
    .replace(/(\d) V\b/g, '$1 volts').replace(/(\d) A\b/g, '$1 amps').replace(/(\d) W\b/g, '$1 watts').replace(/(\d) Ω/g, '$1 ohms')
    .replace(/(\d) L\b/g, '$1 litres').replace(/(\d) m\b/g, '$1 metres').replace(/(\d) h\b/g, '$1 hours').replace(/Ω/g, ' ohms ')
    .replace(/²/g, ' squared ').replace(/\bIR\b/g, 'I R').replace(/\bVI\b/g, 'V I').replace(/(\d)([tnh])\b/g, '$1 $2')
    .replace(/×/g, ' times ').replace(/÷/g, ' divided by ').replace(/=/g, ' equals ').replace(/\+/g, ' plus ').replace(/−/g, ' minus ').replace(/\s+/g, ' ').trim();

  function blank(i) { return { pick: null, res: null, why: false }; }
  const emptyFor = (i, st) => (st.pick != null ? '' : PICK);
  const isEmpty = (i, st) => !!emptyFor(i, st);
  const isRight = (i, st) => !isEmpty(i, st) && st.pick === STEPS[i].want;
  // A wrong answer's hint names its slip.
  const hintFor = (i, st) => { const d = STEPS[i]; return (d.hints && d.hints[st.pick]) || d.hint; };
  // A step answered right (the timing check draws each one this way), or with a slip.
  function solved(i) { const st = blank(i); st.pick = STEPS[i].want; st.res = 'right'; return st; }
  function slipped(i, o) { const st = blank(i); st.pick = o; st.res = 'wrong'; return st; }

  let S = STEPS.map((d, i) => blank(i));
  let finished = false, lastStep = -1, lastDone = false, T = Infinity;   // T: seconds into the current motion
  let motion = null, motionEnd = 0;                                      // what is moving: 'demo' or 'fb'

  // ---------- text with amber key terms and italic letters (built with K.el, never innerHTML) ----------
  // A letter that stands for an amount (V, I, R, P, t, n, h), alone or in one of the formulas' runs IR,
  // VI and I²R (so "It" and "In" stay words), but not a unit after its number ("230 V", "4 h").
  const VRE = /(?<![A-Za-z'])(?:I²R|IR|VI|[VIRPtnh]²?)(?![A-Za-z])/g;
  function spans(s) {
    const out = [];
    let at = 0, m;
    VRE.lastIndex = 0;
    while ((m = VRE.exec(s))) {
      if (/\d $/.test(s.slice(0, m.index))) continue;
      if (m.index > at) out.push([s.slice(at, m.index), false]);
      out.push([m[0], true]);
      at = m.index + m[0].length;
    }
    if (at < s.length) out.push([s.slice(at), false]);
    return out;
  }
  function math(el, s) { spans(s).forEach((p) => el.appendChild(p[1] ? K.el('i', { class: 'vx' }, p[0]) : document.createTextNode(p[0]))); }
  function pieces(el, text) {
    const re = /\*([^*]+)\*/g;
    let at = 0, m;
    while ((m = re.exec(text))) {
      if (m.index > at) math(el, text.slice(at, m.index));
      el.appendChild(K.el('span', { class: 'term' }, m[1]));
      at = m.index + m[0].length;
    }
    if (at < text.length) math(el, text.slice(at));
  }
  // A sum, an amount or a step stays together on one line ("230 = I × 46", "2.3 kW", "÷ 46", "£60"),
  // with the stop after it; a long one may break only before an equals sign.
  const NUMT = '£?\\d[\\d,]*(?:\\.\\d+)?²?(?:[tnh](?![A-Za-z]))?(?: (?:kW|mA|minutes|min|[VAWΩLmh])(?![A-Za-z]))?';
  const TOK = '(?<![A-Za-z0-9.,\'£])(?:' + NUMT + '|(?:I²R|IR|VI|[VIRPtn]²?)(?![A-Za-z]))';
  const GLUE = new RegExp('(?:[×÷+−] )?' + TOK + '(?: [+−=×÷] ' + TOK + ')*[.,?!;]?', 'g');
  function write(el, text) {
    el.textContent = '';
    let at = 0, m;
    GLUE.lastIndex = 0;
    while ((m = GLUE.exec(text))) {
      if (m.index > at) pieces(el, text.slice(at, m.index));
      const bits = m[0].length > 18 ? m[0].split(/ (?==)/) : [m[0]];
      bits.forEach((b, k) => {
        if (k) el.appendChild(document.createTextNode(' '));
        if (/ /.test(b)) { const sp = K.el('span', { class: 'nw' }); math(sp, b); el.appendChild(sp); } else math(el, b);
      });
      at = m.index + m[0].length;
    }
    if (at < text.length) pieces(el, text.slice(at));
  }

  // ---------- controls ----------
  const stepper = K.stepper({ id: 'step', label: 'Step', steps: STEPS.map((d) => d.name), value: 0, compact: true, into: '#prog' });
  const nav = document.getElementById('nav');
  const at = () => stepper.get();

  // Up to three answer buttons; each step fills in its own options.
  const pickBtns = [0, 1, 2].map((k) => K.button({ label: 'Answer ' + (k + 1), secondary: true, into: '#picks', press: () => {
    const i = at(), d = STEPS[i], st = S[i];
    if (finished || d.show || !d.opts || k >= d.opts.length || st.res === 'right') return;
    st.pick = d.opts[k]; st.res = null;
  } }));

  // Check: marks the answer; a right one plays its picture's motion, a wrong one shows its slip.
  const checkBtn = K.button({ label: 'Check', into: '#acts', press: () => {
    const i = at(), d = STEPS[i], st = S[i];
    if (d.show || finished) return;
    if (isEmpty(i, st)) { st.res = 'empty'; return; }
    st.res = isRight(i, st) ? 'right' : 'wrong';
    if (st.res === 'right') play(d.fb, 'fb'); else play(WRONG_DUR, 'fb');
  } });
  const whyBtn = K.button({ label: 'Why?', secondary: true, into: '#acts', press: () => {
    if (STEPS[at()].show || finished) return;
    const st = S[at()]; st.why = !st.why;
  } });
  const replayBtn = K.button({ label: 'Play again', secondary: true, into: '#replay', press: () => {
    const i = at(), d = STEPS[i];
    if (!d.show || finished) return;
    play(d.dur, 'demo');
  } });
  const backBtn = K.button({ label: 'Back', secondary: true, into: '#nav', press: () => {
    if (finished) { finished = false; return; }
    stepper.set(Math.max(0, at() - 1), true);
  } });
  const nextBtn = K.button({ label: 'Continue', into: '#nav', press: () => {
    const i = at();
    if (finished || (!STEPS[i].show && S[i].res !== 'right')) return;
    if (i < STEPS.length - 1) { stepper.set(i + 1, true); return; }
    finished = true;
    if (typeof K.complete === 'function') K.complete();
  } });
  const againBtn = K.button({ label: 'Start again', secondary: true, into: '#again', press: () => {
    S = STEPS.map((d, i) => blank(i)); finished = false; lastStep = -1; stepper.set(0, true);
  } });

  // One animation plays each demonstration and the motion after an answer, from its start; with
  // reduced motion (and while the self-test looks) it opens finished.
  const anim = K.anim({ button: false, label: 'Demonstration', step: (dt) => {
    if (finished) return false;
    T += dt;
    paint();
    return T < motionEnd;
  } });
  // The kit pauses the motion while the page is hidden (Dan switches app or locks the phone) and
  // resumes it when he comes back; this only settles a motion that had already stopped.
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !anim.playing() && T !== Infinity) { T = Infinity; paint(); } });
  function play(dur, kind) {
    motion = kind;
    if (REDUCE || testing()) { T = Infinity; anim.pause(); paint(); return; }
    motionEnd = dur; T = 0; anim.play();
  }
  // A new screen (or the finish panel) fades in softly: the CSS animation restarts on it.
  function enter(id) {
    if (REDUCE) return;
    const box = document.getElementById(id);
    box.classList.remove('enter');
    void box.offsetWidth;
    box.classList.add('enter');
  }

  // ---------- drawing ----------
  const svg = document.getElementById('scene'), art = document.getElementById('art');
  let H = 256;
  let into = null;                                   // where shapes go: the picture, or a part that is arriving
  const add = (node) => (into || art).appendChild(node);
  // How far a part due at t0 has arrived (K.arrive), noting the timetable for the timing check.
  let latest = 0, earliest = Infinity;
  function arr(t0, d) {
    d = d == null ? K.SOFT : d;
    if (t0 + d > latest) latest = t0 + d;
    if (t0 < earliest) earliest = t0;
    return K.arrive(T, t0, d);
  }
  // A part arriving: drawn into a group faded in to a and risen `rise` units into place; nothing before it starts.
  function part(a, rise, draw) {
    if (a <= 0) return;
    const g = add(K.svg('g'));
    K.fade(g, a, rise);
    const keep = into; into = g; draw(); into = keep;
  }
  // A part leaving: faded out as a goes 0 -> 1.
  function leave(a, draw) {
    if (a >= 1) return;
    const g = add(K.svg('g'));
    K.fade(g, 1 - a, 0);
    const keep = into; into = g; draw(); into = keep;
  }
  // One thing giving way to another at arrival a: the first fades out, the second in.
  function swap(a, from, to, rise) { leave(a, from); part(a, rise == null ? 4 : rise, to); }
  const rect = (cls, x, y, w, h, rx) => add(K.svg('rect', { class: cls, x: r3(x), y: r3(y), width: Math.max(0, r3(w)), height: Math.max(0, h), rx: rx || 0 }));
  const line = (cls, x1, y1, x2, y2) => add(K.svg('line', { class: cls, x1: r3(x1), y1: r3(y1), x2: r3(x2), y2: r3(y2) }));
  // Text whose letters for amounts are set in italics (each as its own span).
  function mtext(x, y, s, cls, anchor, parent) {
    const t = K.svg('text', { class: cls, x: r3(x), y: y, 'text-anchor': anchor || 'middle' });
    spans(String(s)).forEach((p) => t.appendChild(p[1] ? K.svg('tspan', { class: 'vx' }, p[0]) : document.createTextNode(p[0])));
    return parent ? parent.appendChild(t) : add(t);
  }
  const text = (x, y, s, cls, anchor) => mtext(x, y, s, cls, anchor);
  // The width of a line of text (measured once it can be; estimated while the scene is hidden).
  const widths = {};
  function tw(s, cls) {
    const key = cls + '|' + s;
    if (widths[key]) return widths[key];
    const t = mtext(0, -50, s, cls, 'start', svg);
    let w = 0;
    try { w = t.getComputedTextLength(); } catch (e) { w = 0; }
    svg.removeChild(t);
    if (w > 0) { widths[key] = w; return w; }
    const size = { lt: 26, eqs: 24, term: 21, wk2: 20, wk: 18, val: 17, opl: 16, qm: 15, cht: 13, tag: 14, rl: 14 }[cls.split(' ')[0]] || 14;
    return String(s).length * size * 0.6;
  }
  // An arrowhead at (x, y) pointing along (dx, dy).
  function head(x, y, dx, dy, cls) {
    const L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L, px = -uy, py = ux;
    add(K.svg('path', { class: cls, d: 'M' + r3(x) + ' ' + r3(y) + ' L' + r3(x - 7 * ux + 4 * px) + ' ' + r3(y - 7 * uy + 4 * py) + ' L' + r3(x - 7 * ux - 4 * px) + ' ' + r3(y - 7 * uy - 4 * py) + ' Z' }));
  }
  // A line of text with part of it highlighted (the part that is new), starting at x.
  // (Spaces are measured as fixed spaces, which SVG keeps at the end of a piece it measures.)
  const nb = (s) => String(s).replace(/ /g, '\u00a0');
  function hlText(x, y, s, cls, hl, anchor) {
    const w = tw(s, cls), x0 = anchor === 'middle' ? x - w / 2 : anchor === 'end' ? x - w : x;
    if (hl != null) {
      const i = s.indexOf(hl);
      if (i >= 0) rect('hl', x0 + (i > 0 ? tw(nb(s.slice(0, i)), cls) : 0) - 4, y - 19, tw(hl, cls) + 8, 25, 5);
    }
    text(x0, y, s, cls, 'start');
  }

  // --- the cards ---
  // A card is CW wide from CXL; its three columns at CX, the signs between them at OX. On a formula
  // card the letters sit LY below its top, their units' names TY and the amounts VY.
  const CXL = 8, CW = 324, CH = 90, CX = [62, 170, 278], OX = [116, 224], LY = 34, TY = 54, VY = 80;
  const cardRect = (y0) => rect('card', CXL, y0, CW, CH, 10);
  const lettersOf = (f) => [f.lhs, f.a + (f.sq ? '²' : ''), f.b];
  function formulaHead(f, y0) {
    lettersOf(f).forEach((s, k) => text(CX[k], y0 + LY, s, 'lt'));
    text(OX[0], y0 + LY - 2, '=', 'eqs');
    text(OX[1], y0 + LY - 2, '×', 'eqs');
    [f.lhs, f.a, f.b].forEach((L, k) => text(CX[k], y0 + TY, WORD[L], 'tag'));
  }
  // The amount under a letter, or a '?' still to find.
  const cell = (k, y0, s, hl) => (hl ? hlText(CX[k], y0 + VY, s, 'val', s, 'middle') : text(CX[k], y0 + VY, s, 'val'));
  function cellGap(k, y0) { rect('gap', CX[k] - 28, y0 + VY - 19, 56, 26, 6); text(CX[k], y0 + VY, '?', 'qm'); }
  // A job card: the job's amounts in chips, and the equation's terms each under the amount it comes from
  // (two terms when one side holds two amounts).
  const CHY = 12, CHH = 26, EQY = 76;
  function chips(j) {
    j.chips.forEach((s, k) => { const w = tw(s, 'cht') + 16; rect('chip', CX[k] - w / 2, CHY, w, CHH, 13); text(CX[k], CHY + 18, s, 'cht'); });
  }
  function terms(list, warn) {
    const xs = list.length === 3 ? CX : [CX[0], (CX[1] + CX[2]) / 2];
    list.forEach((s, k) => text(xs[k], EQY, s, 'term' + (warn ? ' warnt' : '')));
  }
  function eqGap() { rect('gap', 34, EQY - 22, 272, 30, 8); text(170, EQY - 1, '?', 'qm'); }

  // --- the flow diagram ---
  // Three places across (the unknown, a step, an amount) or five (amount, step, amount, step, amount).
  // Row A (the steps) and row B (the undo) are BH tall from their tops; each row's name sits above it.
  const SX5 = [30, 100, 170, 240, 310], SX3 = [62, 170, 278], BH = 34, VW = 46, OW = 54;
  const ROWS = { A: { top: 118, name: 110 }, B: { top: 180, name: 172 } };
  const placesOf = (n) => (n === 3 ? SX3 : SX5);
  // Each place's box is as wide as its words need (at least VW for an amount, OW for a step).
  const widthsOf = (labels) => labels.map((s, k) => Math.max(k % 2 ? OW : VW, tw(s, k % 2 ? 'opl' : 'val') + 16));
  // A box at place k of row r: kind 'v' (an amount), 'o' (a step), 'lit' (a step being undone), 'gap'
  // (still to fill in), with warn for a slip.
  function box(r, sx, k, w, s, kind, warn) {
    const x = sx[k] - w / 2, y = ROWS[r].top;
    const cls = kind === 'gap' ? 'gap' : kind === 'v' ? 'vb' : kind === 'lit' ? 'ob lit' : 'ob';
    rect(cls + (warn ? ' warnb' : ''), x, y, w, BH, 8);
    if (kind === 'gap') { text(sx[k], y + 22, '?', 'qm'); return; }
    text(sx[k], y + 23, s, (kind === 'v' ? 'val' : 'opl') + (kind === 'lit' ? ' lit' : '') + (warn ? ' warnt' : ''));
  }
  // The arrow between place k and k + 1 of row r, pointing right (dir 1) or left (dir -1).
  function arrow(r, sx, k, w, dir) {
    const y = ROWS[r].top + BH / 2, a = sx[k] + w[k] / 2 + 3, b = sx[k + 1] - w[k + 1] / 2 - 3;
    if (dir > 0) { line('ar', a, y, b - 6, y); head(b, y, 1, 0, 'arh'); } else { line('ar', b, y, a + 6, y); head(a, y, -1, 0, 'arh'); }
  }
  const rowName = (r, s) => text(4, ROWS[r].name, s, 'rl', 'start');
  // A whole row, its arrows pointing dir; `lit` the step places lit; `kinds` overrides a place's kind.
  // A place of kind 'none' is left empty, with no arrow to it (its box arrives later).
  // A row whose boxes would come closer than 12 at the usual places (200 mA slipped to 0.02 A, squared
  // to 0.0004) has slimmer margins in its boxes, spread evenly across the picture.
  function layout(labels, w0) {
    const w = w0 || widthsOf(labels), sx = placesOf(labels.length);
    if (sx.every((x, k) => k === 0 || (x - w[k] / 2) - (sx[k - 1] + w[k - 1] / 2) >= 12)) return { w: w, sx: sx };
    const ws = labels.map((s, k) => Math.max(k % 2 ? OW : VW, tw(s, k % 2 ? 'opl' : 'val') + 8));
    const g = (332 - ws.reduce((a, b) => a + b, 0)) / (labels.length - 1);
    let x = 4;
    return { w: ws, sx: ws.map((ww) => { const c = x + ww / 2; x += ww + g; return r3(c); }) };
  }
  function row(r, labels, opt) {
    opt = opt || {};
    const L = layout(labels, opt.w), sx = L.sx, w = L.w;
    const kind = (k) => (opt.kinds && opt.kinds[k]) || (k % 2 ? ((opt.lit || []).indexOf(k) >= 0 ? 'lit' : 'o') : 'v');
    for (let k = 0; k + 1 < labels.length; k++) if (kind(k) !== 'none' && kind(k + 1) !== 'none') arrow(r, sx, k, w, opt.dir || 1);
    labels.forEach((s, k) => { if (kind(k) !== 'none') box(r, sx, k, w[k], s, kind(k), opt.warn); });
  }
  // A row that fills in: place k shows was[k] (a '?' when empty) until its arrival when[k], then gives
  // way to labels[k]; a place with no `when` shows labels[k] throughout.
  function growRow(r, labels, was, when, opt) {
    opt = opt || {};
    const sx = placesOf(labels.length), w = widthsOf(labels);
    for (let k = 0; k + 1 < labels.length; k++) arrow(r, sx, k, w, opt.dir || 1);
    labels.forEach((s, k) => {
      const kind = k % 2 ? ((opt.lit || []).indexOf(k) >= 0 ? 'lit' : 'o') : 'v';
      if (when[k] == null) { box(r, sx, k, w[k], s, kind, opt.warn); return; }
      swap(when[k], () => box(r, sx, k, w[k], was[k] || '', was[k] ? 'v' : 'gap'), () => box(r, sx, k, w[k], s, kind, opt.warn));
    });
  }
  // The check written along the foot of the picture (in the warning colour when it fails), with its name.
  let FY = 244;
  function foot(s, warn) {
    text(4, FY, 'check', 'rl', 'start');
    text(336 - tw(s, 'wk'), FY, s, 'wk' + (warn ? ' warnt' : ''), 'start');
  }
  // A check on two lines, FL apart, the second under the first, both starting where the wider one must.
  const FL = 25;
  function foot2(ls, y) {
