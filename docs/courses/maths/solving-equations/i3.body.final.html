<style>
  [hidden] { display: none !important; }
  .pz { max-width: 30rem; }

  .pz .k-stepper { gap: 0; }

  .vx { font-style: italic; }
  .scene { display: block; width: 100%; touch-action: pan-y; }
  /* The balance, as in lesson 1: a post and its foot, the beam on its pivot, a tray on a short stem at each end. */

  .scene .beam { stroke: var(--k-ink); stroke-width: 6; stroke-linecap: round; }

  .scene .beam.bad { stroke: var(--k-warn); }
  .scene .pivot { fill: var(--k-bg); stroke: var(--k-ink); stroke-width: 2; }
  .scene .stem { stroke: var(--k-strong); stroke-width: 3; stroke-linecap: round; }
  .scene .tray { fill: var(--k-strong); }
  /* What sits on the trays: blocks worth 1 each, in solid ink, and boxes, each the same unknown x. */
  .scene .b1 { fill: var(--k-accent2); }
  .scene .box { fill: var(--k-fill1); stroke: var(--k-accent2); stroke-width: 2; }
  .scene .bl { font: 700 15px var(--k-font); fill: var(--k-ink); }
  .scene .opl { font: 700 15px var(--k-font); fill: var(--k-accent2); }
  /* The equation under the balance, each side under its pan, and each side's worth under that. */

  .scene .vb { fill: var(--k-panel); stroke: var(--k-strong); stroke-width: 1.5; }
  .scene .ob { fill: var(--k-bg); stroke: var(--k-accent2); stroke-width: 2; }
  .scene .ob.lit { fill: var(--k-accent2); }
  .scene .gap { fill: var(--k-bg); stroke: var(--k-accent2); stroke-width: 1.5; stroke-dasharray: 4 3; }
  .scene .val { font: 700 17px var(--k-font); fill: var(--k-ink); }
  .scene .fop { font: 700 16px var(--k-font); fill: var(--k-accent2); }
  .scene .fop.lit { fill: var(--k-on-accent2); }
  .scene .qm { font: 700 15px var(--k-font); fill: var(--k-muted); }
  .scene .rl { font: 700 13px var(--k-font); fill: var(--k-accent); letter-spacing: .03em; }
  .scene .ar { stroke: var(--k-muted); stroke-width: 1.5; }
  .scene .arh { fill: var(--k-muted); }
  /* A slip's words (a check that fails) in the warning colour, over any text style above. */

  .scene #art * { pointer-events: none; }
  /* What Dan drags: a pan-sized hit area over each tray. */

  .scene .grip:active { cursor: grabbing; }
  .scene .grip:focus { outline: none; }
  .scene .grip:focus-visible { stroke: var(--k-accent); stroke-width: 3; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  .row .k-btn { flex: 1 1 7rem; }
  .replay { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 10px; }
  .replay .k-btn { flex: 0 0 auto; min-height: 44px; padding-left: 16px; padding-right: 16px; font-size: .95rem; white-space: nowrap; }
  /* The answers stay on one row, each label whole, at every text size; longer ones stack one to a row. */

  .fb { font-weight: 700; min-height: 1.5em; margin-top: 10px; }
  .fb.right { color: var(--k-good); }
  .fb.wrong { color: var(--k-ink); }
  .why { line-height: 1.6; }

  @keyframes screen-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

<p class="caption">Take the same number of x's off both sides, then finish as before. The equations are example values.</p>

<script>
  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // Every equation `eq` is a·x + b = c·x + d, kept as its two sides L = [a, b] and R = [c, d].
  // pic: the picture a step draws. 'bal': a balance, each side's x's as boxes on its pan and its number
  // as blocks worth 1 each. 'flow': the equation, the same with the x's off both sides, and the flow
  // diagram of what is left (its steps left to right, the undo right to left), then the check.
  // demo: what a SHOW screen plays ('both', the same boxes off both pans; 'check', a guess in every box;
  // 'fewer', the smaller number of x's and then the ones off; 'finish', 'minus', a flow diagram).
  // ask: what a puzzle asks for ('left', the equation left once the boxes are off; 'x', the answer).
  // A 'drag' puzzle has Dan take the boxes off himself. dur: how long a demonstration plays; fb and fbw:
  // how long the motion after a right and a wrong answer plays (seconds); at: when its parts arrive.
  // slips: which slip gives each wrong answer (SLIP below).
  const PICK = 'Tap one of the answers.';
  const Q = (a, b, c, d) => ({ L: [a, b], R: [c, d] });
  // After an answer, in seconds after Check. TAKE: the step written over the pans, the boxes lifting off
  // both, a pair at a time, then the equation rewritten. ONE: the same off one pan only, which tips.
  // ACROSS: the boxes lifted off one pan and set on the other, which tips. TRY: the answer put in every
  // box (the equation written with it), then each side's worth, the beam swinging if they differ.
  // SOLVE (flow): the x's off both sides and the steps left; the last step undone; what it leaves; the
  // first step undone and x; the check. SLIPF: a wrong answer's check, in the warning colour. DRAGW: the
  // working that finishes the equation Dan left, then its check, x put back into both sides.
  const TAKE = { op: 0.1, lift: [0.1, 0.25], eq: 0.95 };
  const ONE = { op: 0.1, lift: [0.1, 0.25], eq: 0.95, swing: 0.95 };
  const ACROSS = { op: 0.1, lift: [0.1, 0.25], put: [0.6, 0.25], eq: 1.45, swing: 1.45 };
  const TRY = { guess: 0.1, tot: 0.85 };
  const SOLVE = { h2: 0.1, op2: 0.55, mid: 1.0, op1: 1.45, chk: 1.9 };
  const SLIPF = { chk: 0.1 };
  const DRAGW = { work: 0.1, chk: 0.7 };
  const STEPS = [
    { show: true, pic: 'bal', demo: 'both', dur: 3.4, eq: Q(5, 2, 3, 10), name: 'x on both sides',
      text: 'Here x is on both sides. Each box is the same x, so take 3 boxes off each pan. It stays level, and 5x + 2 = 3x + 10 becomes 2x + 2 = 10.' },
    { kind: 'pick', pic: 'bal', ask: 'left', eq: Q(4, 1, 2, 7), name: 'What is left?',
      opts: ['2x + 1 = 7', '2x + 1 = 2x + 7', '6x + 1 = 7'], want: '2x + 1 = 7', slips: { '2x + 1 = 2x + 7': 'oneSide', '6x + 1 = 7': 'across' },
      fb: 1.6, fbw: 2.1, at: TAKE,
      task: '4x + 1 = 2x + 7. Take x\'s off both pans until x is on one side only. Which equation is left?',
      why: 'Every box is the same x, so 2 off each pan keeps it level. 4x − 2x = 2x on the left, and the right keeps just its 7.',
      hint: 'Not quite. Take 2 boxes off each pan.',
      hints: { '2x + 1 = 2x + 7': 'Not quite. That takes 2 boxes off the left pan only, so it tips. Take 2 off the right pan too.',
        '6x + 1 = 7': 'Not quite. That moves the 2 boxes onto the left pan, so it tips. Take 2 off each pan instead.' } },
    { show: true, pic: 'flow', demo: 'finish', dur: 4.3, eq: Q(5, 2, 3, 10), name: 'Finish as before',
      text: 'Then finish 2x + 2 = 10 as in lesson 2, last step first, so x = 4. Put 4 back in, and both sides of 5x + 2 = 3x + 10 make 22.' },
    { kind: 'pick', pic: 'bal', ask: 'x', eq: Q(4, 6, 2, 16), name: 'Solve it',
      opts: ['5', '11', '2'], want: '5', slips: { '11': 'again', '2': 'oneTerm' }, fb: 1.5, fbw: 1.5, at: TRY,
      task: 'Solve 4x + 6 = 2x + 16.',
      why: 'Take 2x off both sides, leaving 2x + 6 = 16. Then 16 − 6 = 10 and 10 ÷ 2 = 5. As a check, both sides make 26.',
      hint: 'Not quite. Take 2x off both sides first.',
      hints: { '11': 'Not quite. That adds the 6 instead of taking it off. In 2x + 6 = 16, do 16 − 6 first.',
        '2': 'Not quite. That halves the 16 but not the 6, so it tips. Take the 6 off first, then halve.' } },
    { show: true, pic: 'bal', demo: 'check', dur: 4.1, eq: Q(5, 2, 3, 10), tries: [3, 4], name: 'Only one x balances',
      text: 'Adding 1 to x adds 5 on the left but only 3 on the right, so only one value keeps it level. With 3 the sides make 17 and 19. With 4, both make 22.' },
    { kind: 'drag', pic: 'bal', eq: Q(4, 1, 1, 13), name: 'Drag them off',
      want: '3x + 1 = 13', fb: 1.4, at: DRAGW,
      task: '4x + 1 = x + 13. Drag boxes off the pans until x is on one side only, keeping it level.',
      why: 'Each box is the same x, so one off each pan keeps it level. The right pan had only one, leaving 3x + 1 = 13. Then 13 − 1 = 12 and 12 ÷ 3 = 4, and both sides make 17.',
      empty: 'Drag a box off a pan first.',
      hints: { tipped: 'Not quite. It has tipped, so the sides no longer match. Take the same number off each pan, or put them back.' } },
    { show: true, pic: 'bal', demo: 'fewer', dur: 4.2, eq: Q(1, 7, 3, 1), name: 'x on the right',
      text: 'In x + 7 = 3x + 1 the left pan has only one x, so take one x off each pan. Then take 1 off each, leaving 6 = 2x, so x = 3.' },
    { kind: 'pick', pic: 'bal', ask: 'x', eq: Q(2, 12, 6, 0), name: 'Fewer on the left',
      opts: ['3', '2', '12'], want: '3', slips: { '2': 'oneSide', '12': 'stop' }, fb: 1.5, fbw: 1.5, at: TRY,
      task: 'Solve 2x + 12 = 6x.',
      why: 'The left has fewer x\'s, so take 2x off both sides, leaving 12 = 4x. So x = 12 ÷ 4 = 3, and both sides make 18.',
      hint: 'Not quite. Take 2x off both sides first.',
      hints: { '2': 'Not quite. That takes 2x off the left pan only, leaving 12 = 6x, so it tips. Take 2x off the right pan too.',
        '12': 'Not quite. 12 = 4x says four x\'s make 12, so one x is 12 ÷ 4.' } },
    { show: true, pic: 'flow', demo: 'minus', dur: 4.3, eq: Q(7, -5, 4, 10), name: 'A take-away',
      text: 'A take-away cannot sit on a pan, so use the flow diagram. In 7x − 5 = 4x + 10, take 4x off both sides, leaving 3x − 5 = 10. Undo it last step first, so x = 5.' },
    { kind: 'pick', pic: 'flow', ask: 'x', eq: Q(4, -6, 1, 12), name: 'Take-away',
      opts: ['6', '2', '10'], want: '6', slips: { '2': 'again', '10': 'oneTerm' }, fb: 2.5, fbw: 0.7, at: SOLVE,
      task: 'Solve 4x − 6 = x + 12.',
      why: 'Take x off both sides, leaving 3x − 6 = 12. Undo the − 6 first, 12 + 6 = 18, then 18 ÷ 3 = 6. As a check, both sides make 18.',
      hint: 'Not quite. Take x off both sides first.',
      hints: { '2': 'Not quite. That takes the 6 off again. Undo − 6 with + 6, so 12 + 6 = 18.',
        '10': 'Not quite. That divides the 12 by 3 but not the 6, so the check fails. Undo the − 6 first.' } },
    { kind: 'pick', pic: 'bal', ask: 'x', eq: Q(2, 11, 4, 3), name: 'Which pan?',
      opts: ['4', '2', '7'], want: '4', slips: { '2': 'oneSide', '7': 'again' }, fb: 1.5, fbw: 1.5, at: TRY,
      task: 'Solve 2x + 11 = 4x + 3.',
      why: 'Take 2x off both sides, leaving 11 = 2x + 3. Then 11 − 3 = 8 and 8 ÷ 2 = 4. As a check, both sides make 19.',
      hint: 'Not quite. Take 2x off both sides first.',
      hints: { '2': 'Not quite. That takes 2x off the left pan only, leaving 11 = 4x + 3, so it tips. Take 2x off the right pan too.',
        '7': 'Not quite. That adds the 3 instead of taking it off. In 11 = 2x + 3, do 11 − 3 first.' } },
    { kind: 'pick', pic: 'flow', ask: 'x', eq: Q(3, -4, 1, 6), name: 'Put it together',
      opts: ['1', '5', '7'], want: '5', slips: { '1': 'again', '7': 'oneTerm' }, fb: 2.5, fbw: 0.7, at: SOLVE,
      task: 'Put it together. Solve 3x − 4 = x + 6.',
      why: 'Take x off both sides, leaving 2x − 4 = 6. Undo the − 4 first, 6 + 4 = 10, then 10 ÷ 2 = 5. As a check, both sides make 11.',
      hint: 'Not quite. Take x off both sides first.',
      hints: { '1': 'Not quite. That takes the 4 off again. Undo − 4 with + 4, so 6 + 4 = 10.',
        '7': 'Not quite. That halves the 6 but not the 4, so the check fails. Undo the − 4 first.' } },
  ];
  const FINISH = 'When x is on both sides, take the same number of x\'s off both, so x is on one side only. Then finish last step first, and put the answer back in to check that both sides match.';
  // When each demonstration's parts arrive, in seconds after the screen opens (the screen itself takes
  // FADE to fade in, so nothing starts before it has settled). both: the step over the pans; the boxes
  // lifting off, a pair at a time (counted, LIFT_GAP apart); the equation rewritten; the working.
  // check: the first guess in every box; each side's worth, the beam tipping; the second guess; each
  // side's worth, the beam swinging back. fewer: one box off each pan; the equation rewritten; one block
  // off each; the equation rewritten; the working; the check in its place. finish, minus: the x's off both sides and the steps
  // left; the last step undone; what it leaves; the first step undone; x; the check, a side at a time.
  const FADE = 0.35;
  const AT = {
    both: { op: 0.6, lift: [1.1, 0.25], eq: 2.2, work: 2.8 },
    check: { g1: 0.6, t1: 1.45, g2: 2.6, t2: 3.45 },
    fewer: { op1: 0.6, eq1: 1.2, op2: 1.75, eq2: 2.35, work: 2.95, chk: 3.55 },
    finish: { h2: 0.6, op2: 1.15, mid: 1.65, op1: 2.15, x: 2.65, c1: 3.15, c2: 3.65 },
    minus: { h2: 0.6, op2: 1.15, mid: 1.65, op1: 2.15, x: 2.65, c1: 3.15, c2: 3.65 },
  };
  // The balance tips this far (degrees) to whichever side is heavier: it shows which side, not by how much.
  // A box or block lifting off or set on takes LIFT; the beam swings over SWING. On the drag puzzle a side
  // of the equation is rewritten over SWAP (the old side out in 0.25 s, the new in over K.SOFT).
  const TILT = 7, LIFT = 0.5, SWING = 0.6, SWAP = 0.25 + 0.6;
  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  // While the kit's self-test looks at every screen it switches fades off (the k-testing class):
  // demonstrations then open finished, as they do with reduced motion.
  const testing = () => document.documentElement.classList.contains('k-testing');

  // ---------- numbers (pure, so the checks can test them) ----------
  const r3 = (v) => Math.round(v * 1000) / 1000;
  const same = (a, b) => K.near(a, b, 1e-9);
  // A number as the page writes it, with a true minus sign: −1, 30.
  const num = (v) => { const a = r3(v); return (a < 0 ? '−' : '') + String(Math.abs(a)); };
  const xTerm = (k) => (k === 1 ? 'x' : num(k) + 'x');
  // A side a·x + b written out: 5x + 2, x + 13, 6x, 12, 3x − 5.
  function sideText(s) {
    const xs = s[0] === 0 ? '' : xTerm(s[0]);
    if (!xs) return num(s[1]);
    return xs + (s[1] > 0 ? ' + ' + num(s[1]) : s[1] < 0 ? ' − ' + num(-s[1]) : '');
  }
  const eqText = (q) => sideText(q.L) + ' = ' + sideText(q.R);
  // A side with v in place of x: 5 × 4 + 2, 6 + 12, 6 × 3; and its worth.
  function filled(s, v) {
    const xs = s[0] === 0 ? '' : s[0] === 1 ? num(v) : num(s[0]) + ' × ' + num(v);
    if (!xs) return num(s[1]);
    return xs + (s[1] > 0 ? ' + ' + num(s[1]) : s[1] < 0 ? ' − ' + num(-s[1]) : '');
  }
  const worth = (s, v) => r3(s[0] * v + s[1]);
  const checkRow = (s, v) => filled(s, v) + ' = ' + num(worth(s, v));
  // Both sides with v put back, on one line: 3 + 7 = 10 and 3 × 3 + 1 = 10.
  const checkLine = (q, v) => checkRow(q.L, v) + ' and ' + checkRow(q.R, v);
  // x is the value that makes both sides worth the same.
  const xOf = (q) => r3((q.R[1] - q.L[1]) / (q.L[0] - q.R[0]));
  // The smaller number of x's, taken off both sides; what is left.
  const fewer = (q) => Math.min(q.L[0], q.R[0]);
  const reduce = (q) => { const k = fewer(q); return Q(q.L[0] - k, q.L[1], q.R[0] - k, q.R[1]); };
  // The equation left as A·x + b = n, with the x's on whichever side had more.
  function partsOf(q) { const r = reduce(q), s = q.L[0] > q.R[0] ? 'L' : 'R', o = s === 'L' ? 'R' : 'L'; return { A: r[s][0], b: r[s][1], n: r[o][1] }; }
  // The slips as equations: the x's taken off the left side only; or taken off the right and put on the left.
  const oneSideEq = (q) => { const k = fewer(q); return Q(q.L[0] - k, q.L[1], q.R[0], q.R[1]); };
  const acrossEq = (q) => { const k = fewer(q); return Q(q.L[0] + k, q.L[1], q.R[0] - k, q.R[1]); };
  // The answer a puzzle wants, worked out by its rule, as its button reads.
  function answerOf(d) {
    if (d.kind === 'drag' || d.ask === 'left') return eqText(reduce(d.eq));
    return num(xOf(d.eq));
  }
  // What each slip makes of the answer. oneSide: the x's taken off the left side only. across: the x's
  // taken off the right side and added to the left. again: once x is on one side, the number with it
  // added to the other side instead of taken off. oneTerm: the other side divided, the number with x
  // left as it was. stop: A·x = n read as x = n.
  const SLIP = {
    oneSide: (d) => (d.ask === 'left' ? eqText(oneSideEq(d.eq)) : num(xOf(oneSideEq(d.eq)))),
    across: (d) => (d.ask === 'left' ? eqText(acrossEq(d.eq)) : num(xOf(acrossEq(d.eq)))),
    again: (d) => { const p = partsOf(d.eq); return num((p.n + p.b) / p.A); },
    oneTerm: (d) => { const p = partsOf(d.eq); return num(p.n / p.A - p.b); },
    stop: (d) => { const p = partsOf(d.eq); return num(p.n - p.b); },
  };
  // An option's worth: "−8" is -8; an equation has none.
  const valueOf = (s) => { const m = /^(−?)(\d+(?:\.\d+)?)$/.exec(s); return m ? (m[1] ? -1 : 1) * +m[2] : NaN; };
  // As a screen reader says it.
  const say = (s) => String(s).replace(/ /g, ' ').replace(/(\d)x\b/g, '$1 x').replace(/×/g, ' times ').replace(/÷/g, ' divided by ')
    .replace(/=/g, ' equals ').replace(/\+/g, ' plus ').replace(/−/g, ' minus ').replace(/\s+/g, ' ').trim();

  // ---------- each step's state ----------
  // pick: the answer chosen; res: 'right', 'wrong' or 'empty' once checked; off: on the drag puzzle, the
  // boxes taken off each pan; held: a box in Dan's hand; gone: one just let go, fading; sw: the beam's
  // swing after a box came off (from, to, when); eqsw: each side of the equation just rewritten (what it
  // said, when), so it changes softly.
  function blank(i) { return { pick: null, res: null, why: false, off: { L: 0, R: 0 }, held: null, gone: null, sw: null, eqsw: null }; }
  function emptyFor(i, st) {
    const d = STEPS[i];
    if (d.kind === 'drag') return st.off.L + st.off.R === 0 ? d.empty : '';
    return st.pick != null ? '' : PICK;
  }
  const isEmpty = (i, st) => !!emptyFor(i, st);
  function isRight(i, st) {
    const d = STEPS[i];
    if (isEmpty(i, st)) return false;
    if (d.kind === 'drag') return st.off.L === st.off.R && st.off.L === fewer(d.eq);
    return st.pick === d.want;
  }
  // A wrong answer's hint names its slip.
  function hintFor(i, st) {
    const d = STEPS[i];
    if (d.kind === 'drag') return d.hints.tipped;
    return (d.hints && d.hints[st.pick]) || d.hint;
  }
  // A step answered right (the timing check draws each one this way), or with a slip.
  function solved(i) {
    const d = STEPS[i], st = blank(i);
    if (d.kind === 'drag') { const k = fewer(d.eq); st.off = { L: k, R: k }; } else st.pick = d.want;

  // --- the flow diagram ---
