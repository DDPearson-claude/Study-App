<style>

  .pz { max-width: 30rem; }
  .pz > * + *, #stepbox > * + * { margin-top: 14px; }
  /* The stepper is the page's step control: its dots are the progress bar; Back and Continue are below. */
  .pz .k-stepper { gap: 0; }
  .pz .k-stepper .k-label, .pz .k-stepper-nav { display: none; }
  .pz .count { margin-top: 10px; }
  .task { font-size: 1.2rem; font-weight: 700; line-height: 1.5; margin-top: 4px; }
  .task.show { font-size: 1.12rem; font-weight: 400; line-height: 1.6; }
  .nw { white-space: nowrap; }
  .v { font-style: italic; }
  .scene { display: block; width: 100%; touch-action: pan-y; }
  /* The balance: a post and its foot, the beam on its pivot, a tray on a short stem at each end. */
  .scene .post { fill: var(--k-sunk); stroke: var(--k-strong); stroke-width: 1.5; stroke-linejoin: round; }
  .scene .beam { stroke: var(--k-ink); stroke-width: 6; stroke-linecap: round; }
  /* A tipped balance is the slip showing itself: the beam in the warning colour. */
  .scene .beam.bad { stroke: var(--k-warn); }
  .scene .pivot { fill: var(--k-bg); stroke: var(--k-ink); stroke-width: 2; }
  .scene .stem { stroke: var(--k-strong); stroke-width: 3; stroke-linecap: round; }
  .scene .tray { fill: var(--k-strong); }
  /* What sits on the trays: blocks worth 1 each, in solid ink, and boxes, each an unknown x. */
  .scene .b1 { fill: var(--k-accent2); }
  .scene .box { fill: var(--k-fill1); stroke: var(--k-accent2); stroke-width: 2; }
  .scene .box.gap { stroke-dasharray: 4 3; }
  .scene .bl { font: 700 16px var(--k-font); fill: var(--k-ink); }
  .scene .opl { font: 700 15px var(--k-font); fill: var(--k-accent2); }
  /* The equation under the balance, and the working (the check) under that. */
  .scene .eq { font: 700 20px var(--k-font); fill: var(--k-ink); }
  .scene .wk { font: 700 20px var(--k-font); fill: var(--k-ink); }

  .scene .hl { fill: var(--k-hl); }
  .scene .v { font-style: italic; }
  .scene #art * { pointer-events: none; }

  .scene .grip:active { cursor: grabbing; }
  .scene .grip:focus { outline: none; }
  .scene .grip:focus-visible { stroke: var(--k-accent); stroke-width: 3; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }

  .replay { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 10px; }

<p class="lead">A balance whose pans hold boxes, each standing for <span class="v">x</span>, and small blocks worth 1 each.</p>

<div class="pz" id="pz">

<p class="caption">Do the same to both sides and the balance stays level. The numbers are example values.</p>

<script>
  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // Every picture is a balance. bal: x, the box's true worth in blocks (every box on a screen is the
  // same x); P, the spacing of the blocks; L and R, the two pans, each with n boxes (lab: 'x', or '?'
  // for a gap to fill) and g, its groups of blocks, [how many, how many across].
  // eq: the equation the balance stands for, a·x + b = c (written c = a·x + b when flip), so x is
  // (c − b) ÷ a and the boxes sit on the left pan, or on the right when flip.
  // moves: what happens over time, in seconds (on a SHOW screen from when it opens; on a puzzle
  // `right` from Check): op, a step written over a pan ('L', 'R' or 'both'); lift, n blocks lifted
  // off the top; put, n blocks set on; guess, a value put in every box (its weight follows); open, the
  // box opened into its blocks; regroup, a pan's blocks sliding into rows `cols` across over d
  // seconds; share, both pans cut into that many equal shares and all but one lifted off; eq, the
  // equation under the balance rewritten; work, a line of working (true: the check for the answer).
  // dur: how long a demonstration plays; fb and fbw: how long the motion after a right and a wrong
  // answer plays. slips: which mistake gives each wrong answer (SLIP below).
  const PICK = 'Tap one of the answers.';
  const STEPS = [
    { show: true, demo: 'level', dur: 3.0, name: 'Equals means level',
      bal: { x: 0, P: 14, L: { g: [[8, 4], [4, 2]] }, R: { g: [[7, 4], [5, 3]] } },
      eqAt: [0.6, 1.2, 1.8], moves: [{ t: 2.4, work: '12 = 12' }],
      text: 'An *equation* says both sides are the same amount, like a balance sitting level. 8 + 4 = 7 + 5 is true, because both sides make 12.' },
    { kind: 'pick', name: 'Fill the gap', eq: { a: 1, b: 5, c: 12, flip: true },
      bal: { P: 14, L: { g: [[8, 4], [4, 2]] }, R: { n: 1, lab: '?', g: [[5, 3]] } },
      opts: ['7', '12', '17'], want: '7', slips: { '12': 'next', '17': 'all' }, fb: 2.2, fbw: 2.2,
      right: [{ t: 0.1, guess: 7 }, { t: 1.1, eq: 1 }, { t: 1.6, work: true }],
      task: '8 + 4 = ? + 5. What number goes in the box, so both sides make the same amount?',
      why: 'The left side makes 8 + 4 = 12. The right side already has 5, so the box needs 7, because 7 + 5 = 12.',
      hint: 'Not quite. Both sides have to make the same amount.',
      hints: { '12': 'Not quite. That reads = as "the answer comes next". With 12 in the box, the right side makes 12 + 5 = 17.',
        '17': 'Not quite. That adds all three numbers. With 17 in the box, the right side makes 17 + 5 = 22.' } },
    { show: true, demo: 'off', dur: 4.0, name: 'Same off both sides', eq: { a: 1, b: 7, c: 12 },
      bal: { P: 14, L: { n: 1, g: [[7, 4]] }, R: { g: [[12, 6]] } },
      moves: [{ t: 0.6, op: '− 1', side: 'L' }, { t: 0.6, lift: 'L', n: 1 }, { t: 1.2, eq: 1 },
        { t: 1.7, op: '+ 1', side: 'L' }, { t: 1.7, put: 'L', n: 1 }, { t: 2.3, eq: 1 },
        { t: 2.8, op: '− 7', side: 'both' }, { t: 2.8, lift: 'both', n: 7 }, { t: 3.4, eq: 1 }],
      text: 'The box is the *unknown*, x. Take 1 off one side only and it tips. Put it back, then take 7 off both sides and it stays level, leaving x = 5.' },
    { kind: 'drag', name: 'Get x alone', eq: { a: 1, b: 3, c: 10 },
      bal: { P: 14, L: { n: 1, g: [[3, 3]] }, R: { g: [[10, 5]] } },
      want: 'x = 7', fb: 0.7, right: [{ t: 0.1, work: true }],
      task: 'x + 3 = 10. Drag blocks off the pans until the box is alone, keeping the balance level.',
      why: 'Each block off one pan needs one off the other to keep it level. With 3 off each, the box is alone and x = 7, and 7 + 3 = 10 checks it.',
      empty: 'Drag a block off a pan first.',
      hints: { tipped: 'Not quite. It has tipped, so the sides are no longer equal. Take blocks off the lower pan until it is level, or put them back.',
        stuck: 'Not quite. It has tipped, and the box cannot come off. Put them back and take the same off both pans.',
        more: 'Not quite. It is level, but the box is not alone yet. Take another block off each pan.' } },
    { show: true, demo: 'check', dur: 4.2, name: 'Check it', eq: { a: 1, b: 7, c: 12 },
      bal: { P: 14, L: { n: 1, g: [[7, 4]] }, R: { g: [[12, 6]] } },
      moves: [{ t: 0.6, guess: 5 }, { t: 1.55, open: 1 }, { t: 2.25, regroup: 'L', cols: 6, d: 0.7 }, { t: 3.05, eq: 1 }, { t: 3.55, work: '12 = 12' }],
      text: 'To *check* an answer, put it back in place of x. With 5 in the box, the left side makes 5 + 7 = 12, the same as the right.' },
    { kind: 'pick', ask: 'claim', claim: 21, name: 'Check an answer', eq: { a: 1, b: 6, c: 15 },
      bal: { P: 14, L: { n: 1, g: [[6, 3]] }, R: { g: [[15, 5]] } },
      opts: ['15', '27', '21'], want: '27', slips: { '15': 'trust', '21': 'drop' }, fb: 1.7,
      right: [{ t: 0.1, guess: 21 }, { t: 1.1, work: true }],
      task: 'Someone solves x + 6 = 15 and gets x = 21. Put 21 in place of x. What does the left side make?',
      why: '21 + 6 = 27, which is not 15, so x = 21 fails the check. Taking 6 off both sides gives x = 9, and 9 + 6 = 15.',
      hint: 'Not quite. Work out 21 + 6.',
      hints: { '15': 'Not quite. That takes the answer on trust. Work out 21 + 6 and compare it with 15.',
        '21': 'Not quite. That leaves out the 6 on the left side. Add it on.' } },
    { show: true, demo: 'share', dur: 4.2, name: 'Share both sides', eq: { a: 4, b: 0, c: 36 },
      bal: { P: 12, L: { n: 4 }, R: { g: [[36, 6]] } },
      moves: [{ t: 0.6, regroup: 'R', cols: 9, d: 0.8 }, { t: 1.5, op: '÷ 4', side: 'both' }, { t: 2.0, share: 4 }, { t: 2.6, eq: 1 },
        { t: 3.1, work: '36 ÷ 4 = 9', hl: '÷ 4' }, { t: 3.6, work: '4 × 9 = 36' }],
      text: '4x means 4 lots of x. Share both sides into 4 equal parts and keep one, so divide both by 4. 36 ÷ 4 = 9, so x = 9.' },
    { kind: 'pick', name: 'Divide both sides', eq: { a: 3, b: 0, c: 24 },
      bal: { P: 12, L: { n: 3 }, R: { g: [[24, 6]] } },
      opts: ['21', '72', '8'], want: '8', slips: { '21': 'minus', '72': 'times' }, fb: 2.5, fbw: 1.7,
      right: [{ t: 0.1, regroup: 'R', cols: 8, d: 0.6 }, { t: 0.1, op: '÷ 3', side: 'both' }, { t: 0.8, share: 3 }, { t: 1.4, eq: 1 }, { t: 1.9, work: true }],
      task: 'Solve 3x = 24. What is x?',
      why: '3x is 3 lots of x, so divide both sides by 3. 24 ÷ 3 = 8, so x = 8, and 3 × 8 = 24 checks it.',
      hint: 'Not quite. 3x is 3 lots of x, so share both sides into 3.',
      hints: { '21': 'Not quite. That takes 3 off. 3x means 3 times x, so divide both sides by 3.',
        '72': 'Not quite. That multiplies by 3 again. Divide both sides by 3 to undo times 3.' } },
    { show: true, demo: 'flip', dur: 3.3, name: 'Either way round', eq: { a: 1, b: 9, c: 15, flip: true },
      bal: { P: 14, L: { g: [[15, 5]] }, R: { n: 1, g: [[9, 3]] } },
      moves: [{ t: 0.6, op: '− 9', side: 'both' }, { t: 1.1, lift: 'both', n: 9 }, { t: 1.7, eq: 1 }, { t: 2.2, work: 'x = 6' }, { t: 2.7, work: true }],
      text: 'The = sign works both ways, so 15 = x + 9 says the same as x + 9 = 15. Take 9 off both sides and 6 = x, so x = 6.' },
    { kind: 'pick', ask: 'move', name: 'Which move?', eq: { a: 1, b: 4, c: 11 },
      bal: { P: 14, L: { n: 1, g: [[4, 2]] }, R: { g: [[11, 6]] } },
      opts: ['Take 4 off both', 'Take 4 off the left', 'Add 4 to both'], want: 'Take 4 off both',
      slips: { 'Take 4 off the left': 'oneMove', 'Add 4 to both': 'addMove' }, fb: 2.3, fbw: 1.8,
      right: [{ t: 0.1, op: '− 4', side: 'both' }, { t: 0.6, lift: 'both', n: 4 }, { t: 1.2, eq: 1 }, { t: 1.7, work: true }],
      wrongs: { 'Take 4 off the left': [{ t: 0.1, op: '− 4', side: 'L' }, { t: 0.6, lift: 'L', n: 4 }, { t: 1.2, eq: 1 }],
        'Add 4 to both': [{ t: 0.1, op: '+ 4', side: 'both' }, { t: 0.6, put: 'both', n: 4 }, { t: 1.2, eq: 1 }] },
      task: 'x + 4 = 11. Which move gets x alone and keeps the balance level?',
      why: 'Taking 4 off both sides keeps it level and leaves x alone, so x = 7. As a check, 7 + 4 = 11.',
      hint: 'Not quite. Do the same to both sides, and undo the + 4.',
      hints: { 'Take 4 off the left': 'Not quite. Off the left side only, the balance tips. Take 4 off the right side too.',
        'Add 4 to both': 'Not quite. That stays level, but x + 8 = 15 still has a number added to x. Take the 4 away instead.' } },
    { kind: 'pick', name: 'x on the right', eq: { a: 4, b: 0, c: 28, flip: true },
      bal: { P: 12, L: { g: [[28, 6]] }, R: { n: 4 } },
      opts: ['24', '28', '7'], want: '7', slips: { '24': 'minus', '28': 'one' }, fb: 2.5, fbw: 1.7,
      right: [{ t: 0.1, regroup: 'L', cols: 7, d: 0.6 }, { t: 0.1, op: '÷ 4', side: 'both' }, { t: 0.8, share: 4 }, { t: 1.4, eq: 1 }, { t: 1.9, work: true }],
      task: 'Solve 28 = 4x. What is x?',
      why: '4x is 4 lots of x, so divide both sides by 4. 28 ÷ 4 = 7, so 7 = x, which says x = 7. As a check, 4 × 7 = 28.',
      hint: 'Not quite. 4x is 4 lots of x, so divide both sides by 4.',
      hints: { '24': 'Not quite. That takes 4 off. 4x means 4 times x, so divide both sides by 4.',
        '28': 'Not quite. That drops the 4 from the right side only, so the balance tips. Divide the 28 by 4 as well.' } },
    { kind: 'pick', name: 'Put it together', eq: { a: 1, b: 13, c: 21, flip: true },
      bal: { P: 12, L: { g: [[21, 7]] }, R: { n: 1, g: [[13, 6]] } },
      opts: ['34', '8', '21'], want: '8', slips: { '34': 'add', '21': 'one' }, fb: 2.3, fbw: 1.7,
      right: [{ t: 0.1, op: '− 13', side: 'both' }, { t: 0.6, lift: 'both', n: 13 }, { t: 1.2, eq: 1 }, { t: 1.7, work: true }],
      task: 'Put it together. Solve 21 = x + 13. What is x?',
      why: 'Take 13 off both sides to leave x alone. 21 − 13 = 8, so 8 = x, which says x = 8. As a check, 21 = 8 + 13.',
      hint: 'Not quite. Take 13 off both sides.',
      hints: { '34': 'Not quite. That adds 13. Take 13 off both sides to undo the + 13.',
        '21': 'Not quite. That takes the 13 off the right side only. Take 13 off the left side too.' } },
  ];
  const FINISH = 'An equation says both sides are the same amount, like a level balance. Do the same to both sides, such as taking 7 off or dividing by 4, until x is alone. Then put the answer back in to check it.';
  // The balance tips this far (degrees) to whichever side is heavier: it shows which side, not by how much.
  const TILT = 7;
  // The beam's half-length and pivot; each tray's width; a box's size and the gap between boxes.
  const BL = 106, PX = 170, PW = 120, BX = 26, BG = 4;
  // A block lifting off or set on takes LIFT; the beam starts to answer LAG after a change and swings over SWING.
  const LIFT = 0.5, LAG = 0.15, SWING = 0.6;
  // A screen takes FADE to fade in, so no demonstration starts before it has settled.
  const FADE = 0.35;
  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  // While the kit's self-test looks at every screen it switches fades off (the k-testing class):
  // demonstrations then open finished, as they do with reduced motion.
  const testing = () => document.documentElement.classList.contains('k-testing');

  // ---------- numbers (pure, so the checks can test them) ----------
  // a·x + b = c: x is what makes both sides the same; the boxes' side with v in place of x.
  const xOf = (e) => (e.c - e.b) / e.a;
  const lhs = (e, v) => e.a * v + e.b;
  // a·x + b written out with v in place of x: '5 + 7', '3 × 8'.
  const filled = (e, v) => (e.a === 1 ? String(v) : e.a + ' × ' + v) + (e.b ? ' + ' + e.b : '');
  // The check: v put back in place of x. Right, both sides match (written the equation's way round);
  // wrong, the two sides differ.
  function checkRow(e, v) {
    const l = lhs(e, v);
    if (l === e.c) return e.flip ? e.c + ' = ' + filled(e, v) : filled(e, v) + ' = ' + e.c;
    return filled(e, v) + ' = ' + l + ', not ' + e.c;
  }
  const boxSide = (d) => (d.eq && d.eq.flip ? 'R' : 'L');
  const trueX = (d) => (d.eq ? xOf(d.eq) : 0);
  // The answer a puzzle wants, worked out by its rule, as its button reads.
  function answerOf(d) {
    if (d.kind === 'drag') return 'x = ' + xOf(d.eq);
    if (d.ask === 'claim') return String(lhs(d.eq, d.claim));
    if (d.ask === 'move') return 'Take ' + d.eq.b + ' off both';
    return String(xOf(d.eq));
  }
  // What each slip makes of the answer: = read as "the answer comes next" (the left side's sum, the
  // right side ignored); every number added; the + b added to the other side instead of taken off;
  // a step done to x's side only (the other side left as it was); a taken off, or multiplied by,
  // instead of divided by; a claimed answer taken on trust, or its + b left out; a move done to one
  // side only, or the + b added to both sides.
  const SLIP = {
    next: (d) => String(d.eq.c),
    all: (d) => String(d.eq.c + d.eq.b),
    add: (d) => String(d.eq.c + d.eq.b),
    one: (d) => String(d.eq.c),
    minus: (d) => String(d.eq.c - d.eq.a),
    times: (d) => String(d.eq.c * d.eq.a),
    trust: (d) => String(d.eq.c),
    drop: (d) => String(d.claim),
    oneMove: (d) => 'Take ' + d.eq.b + ' off the left',
    addMove: (d) => 'Add ' + d.eq.b + ' to both',
  };
  // As a screen reader says it.
  const say = (s) => String(s).replace(/\u00a0/g, ' ').replace(/\?/g, ' a gap ').replace(/\+/g, ' plus ').replace(/×/g, ' times ').replace(/÷/g, ' divided by ')
    .replace(/=/g, ' equals ').replace(/−/g, ' minus ').replace(/\s+/g, ' ').trim();

  // ---------- each step's state ----------
  // pick: the answer chosen; res: 'right', 'wrong' or 'empty' once checked; off: on the drag puzzle,
  // the blocks taken off each pan; held: a block in Dan's hand; gone: one just let go, fading; sw: the
  // beam's swing after a block came off (from, to, when).
  function blank(i) { return { pick: null, res: null, why: false, off: { L: 0, R: 0 }, held: null, gone: null, sw: null }; }
  // Blocks on a pan of the drag puzzle now; whether it is level; whether the box is alone.
  const blocksAt = (d, s, st) => (d.bal[s].g || []).reduce((a, g) => a + g[0], 0) - (st ? st.off[s] : 0);
  const weightOf = (d, s, st) => (d.bal[s].n || 0) * trueX(d) + blocksAt(d, s, st);
  const levelNow = (d, st) => weightOf(d, 'L', st) === weightOf(d, 'R', st);
  const aloneNow = (d, st) => blocksAt(d, boxSide(d), st) === 0;
  function emptyFor(i, st) {
    const d = STEPS[i];
    if (d.kind === 'drag') return st.off.L + st.off.R === 0 ? d.empty : '';
    return st.pick != null ? '' : PICK;
  }
  const isEmpty = (i, st) => !!emptyFor(i, st);
  function isRight(i, st) {
    const d = STEPS[i];
    if (isEmpty(i, st)) return false;
    if (d.kind === 'drag') return levelNow(d, st) && aloneNow(d, st);
    return st.pick === d.want;
  }
  // A wrong answer's hint names its slip; on the drag puzzle it says what the balance shows.
  function hintFor(i, st) {
    const d = STEPS[i];
    if (d.kind === 'drag') {
      if (levelNow(d, st)) return d.hints.more;
      const lower = weightOf(d, 'L', st) > weightOf(d, 'R', st) ? 'L' : 'R';
      return blocksAt(d, lower, st) > 0 ? d.hints.tipped : d.hints.stuck;
    }
    return (d.hints && d.hints[st.pick]) || d.hint;
  }
  // A step answered right (the timing check draws each one this way).
  function solved(i) {
    const d = STEPS[i], st = blank(i);
    if (d.kind === 'drag') { const n = blocksAt(d, boxSide(d)); st.off = { L: n, R: n }; }
    else st.pick = d.want;
    st.res = 'right';
    return st;
  }
  // The motion a wrong answer plays: on a move puzzle the move itself; otherwise the value put in the
  // box, the balance tipping, and the check that fails.
  function wrongMoves(d, v) {
    if (d.wrongs) return d.wrongs[v] || [];
    if (!d.eq || d.ask === 'claim' || d.kind === 'drag' || v == null) return [];
    const n = +v, gap = d.bal[boxSide(d)].lab === '?';
    return [{ t: 0.1, guess: n }].concat(gap ? [{ t: 1.1, eq: 1 }, { t: 1.6, work: checkRow(d.eq, n), bad: true }] : [{ t: 1.1, work: checkRow(d.eq, n), bad: true }]);
  }
  function movesFor(d, st) {
    if (d.show) return d.moves;

      const ps = ms.map((m) => [m.t, m.t + long(m)]).concat([]).sort((a, b) => a[0] - b[0]);
      let end = -Infinity;
      return ps.every((q, k) => {
        const good = k === 0 || q[0] === ps[k - 1][0] || (q[0] - ps[k - 1][0] >= 0.45 - 1e-9 && q[0] >= end + 0.1 - 1e-9);
        end = Math.max(end, q[1]);
        return good;
      });
    };
    const lines = STEPS.map((d) => (d.show ? [d.moves.concat(d.eqAt ? d.eqAt.map((t) => ({ t })) : [])] : [d.right].concat((d.opts || []).map((o) => wrongMoves(d, o)))));
    return ok && lines.every((ls) => ls.every(spaced));
  });

  K.ready();
</script>
