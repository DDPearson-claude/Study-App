<p class="caption">Each step down the stairs divides by the base, so the amount shrinks but never drops below nothing.</p>

  const SUPC = '⁰¹²³⁴⁵⁶⁷⁸⁹';
  const sup = (n) => String(n).split('').map((c) => (c === '-' ? '⁻' : SUPC[+c])).join('');
  const P = (b, n) => String(b) + sup(n);
  const isNum = (b) => /^[0-9]+$/.test(String(b));
  const valOf = (b, n) => Math.pow(+b, n);
  // A stair's amount as the lesson writes it: whole numbers, and one over a whole number below zero.
  const valText = (b, n) => (n >= 0 ? String(valOf(b, n)) : '1/' + valOf(b, -n));
  const amtText = (b, n) => { const v = valOf(b, Math.abs(n)); return n >= 0 ? v + (v === 1 ? ' square' : ' squares') : '1/' + v + ' of a square'; };
  const fmtV = (v) => (v < 0 ? '−' + (-v) : String(v));
  // How a power of b is laid out as unit squares. Base 4 doubles both sides at each stair up; any
  // other base multiplies across, then up, in turn. So a step down keeps one of b equal groups, and
  // below zero one square is cut the same way into parts.
  const grp = (b, m) => (+b === 4 ? { gx: 2, gy: 2 } : m % 2 ? { gx: +b, gy: 1 } : { gx: 1, gy: +b });
  function lay(b, n) { let c = 1, r = 1; for (let m = 1; m <= n; m++) { const g = grp(b, m); c *= g.gx; r *= g.gy; } return { c, r }; }

  const FINISH = 'Each step down the stairs divides by the base. So a power of zero is 1, and a negative power is one over the positive power. The minus in the power never makes the answer negative, and for a base above 1 it is a small amount.';
  // Sources the checks restate (the lesson's own).
  const SRC1 = 'https://en.wikipedia.org/wiki/Milli-';
  const SRC2 = 'https://www.khanacademy.org/v/negative-exponent-intuition';
  const SRC3 = 'https://www.bbc.co.uk/bitesize/articles/zrqr7v4';
  const SRC4 = 'https://maritime.solent.ac.uk/documents/training-at-warsash/engineer-cadets-maths-refresher.pdf';
  const XL = 12, XR = 328, LH = 26, FADE = 0.35, LIVE_D = 1.1, BX = 224, BW = 104;
  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const testing = () => document.documentElement.classList.contains('k-testing');
  // A puzzle's move: one step at a time, quick enough that the whole jump ends within about 2 s.
  const moveD = (p) => Math.min(0.8, 1.9 / Math.max(1, Math.abs(p.go - p.n0)));
  STEPS.forEach((d) => { if (!d.show) d.rt = 0.2 + Math.abs(d.panels[0].go - d.panels[0].n0) * moveD(d.panels[0]); });

  // ---------- reading an expression (pure, so the checks can test it) ----------
  // +, −, ×, ÷, brackets, a minus in front, fractions (a/b binds tighter than ÷), powers written
  // small (negative ones too), commas in thousands and letters standing for numbers.
  function val(s, vars) {
    vars = vars || {};
    const src = String(s).replace(/\s+/g, '');
    let i = 0;
    const peek = () => src[i];
    function sum() {
      let v = prod();
      while (peek() === '+' || peek() === '−') { const op = src[i++]; const w = prod(); v = op === '+' ? v + w : v - w; }
      return v;
    }
    function prod() {
      let v = unary();
      for (;;) {
        const c = peek();
        if (c === '×') { i++; v *= unary(); } else if (c === '÷') { i++; v /= unary(); } else if (c != null && /[0-9(a-z]/.test(c)) v *= frac(); else return v;

      if (!p.hops && g.texts.some((t) => t === d.want || t === '= ' + d.want)) return false;
      return Object.keys(d.wrong).every((o) => {
        const b = d.wrong[o].bad, h = drawn(i, wrongSt(i, o));
        if (!b) return h.slips.length === 0;
        const v = b.v != null ? b.v : valOf(b.b, b.n);
        return h.slips.length === 1 && close(v, d.op ? opRun(p, o)[2] : val(o, d.at || {}));

    }));
  K.check('Every demonstration has arrived within 5 s of its screen opening, nothing starting before the 0.35 s screen fade ends; every answer\'s motion, right or wrong, and every step on the first screen within 3 s', () => {
    const ok = STEPS.every((d, i) => {
      if (d.show) { const m = motionLen(i, blank()); return m.latest <= 5 && m.earliest >= FADE; }
      return motionLen(i, solvedSt(i)).latest <= 3 && d.opts.filter((o) => o !== d.want).every((o) => motionLen(i, wrongSt(i, o)).latest <= 3);
    }) && motionLen(0, Object.assign(liveSt(2), { prev: 3, lowBefore: 3 })).latest <= 3 && motionLen(0, Object.assign(liveSt(-1), { prev: 0, lowBefore: 0 })).latest <= 3;
    paint();
    return ok;
