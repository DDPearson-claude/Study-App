  .pz > * + *, #stepbox > * + * { margin-top: 14px; }
  /* The stepper is the page's step control: its dots are the progress bar; Back and Continue are below. */

  .scene .arr { fill: none; stroke: var(--k-accent2); stroke-width: 1.8; }
  .scene .arrh { fill: var(--k-accent2); }
  .scene .arr.bad { stroke: var(--k-warn); }

  .scene .note { font: 400 13px var(--k-font); fill: var(--k-muted); }

  .row { display: flex; flex-wrap: wrap; gap: 10px; }

  .replay { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 10px; }

<p class="lead">A power ladder: each rung is a power of one base, drawn equally spaced up the page with its value beside it. The bases and numbers tried are examples.</p>

<p class="caption">Each small step adds the same fraction to the power, so every small step multiplies by the same number.</p>

<script>
  // ---------- numbers and powers written out ----------
  const SUPC = '⁰¹²³⁴⁵⁶⁷⁸⁹';
  const sup = (n) => String(n).split('').map((ch) => (ch === '-' ? '⁻' : SUPC[+ch])).join('');
  const close = (a, b, tol) => Math.abs(a - b) <= (tol || 1e-9) * Math.max(1, Math.abs(a), Math.abs(b));
  const isInt = (v) => close(v, Math.round(v));
  const grp = (n) => { const s = String(n); return s.length > 4 ? s.replace(/\B(?=(\d{3})+(?!\d))/g, ',') : s; };
  // A value as the lesson writes it: whole numbers (commas from 10,000), one over a whole number
  // below 1 on a ladder whose base is above 1, two places above 1, and three figures below 1
  // unless the decimal is short and exact (0.125).
  function fmtV(v, frac) {
    if (v < 0) return '−' + fmtV(-v, frac);
    if (isInt(v)) return grp(Math.round(v));
    if (frac && v < 1 && isInt(1 / v)) return '1/' + grp(Math.round(1 / v));
    if (v >= 1000) return grp(Math.round(v));
    if (v >= 1) return String(Number(v.toFixed(2)));
    const six = Number(v.toFixed(6));
    return String(close(six, v) ? six : Number(v.toPrecision(3)));
  }
  // b to the power j/c: a whole power raised small, a fraction written ^(j/c) (drawn raised small).
  function pw(b, j, c) {
    if (j % c === 0) return b + sup(j / c);
    return b + '^(' + (j < 0 ? '−' : '') + Math.abs(j) + '/' + c + ')';
  }
  // In the drawing a fractional power is written with small raised figures and a plain slash, 8¹/³
  // (a plain slash keeps clear of the raised figures, where the fraction slash runs into them).
  const svgStr = (s) => String(s).replace(/\^\(([^)]*)\)/g, (m, e) => e.split('').map((ch) => (ch === '/' ? '/' : ch === '−' ? '⁻' : SUPC[+ch])).join(''));
  const THIRD = { 2: '½', 3: '⅓', 4: '¼' };

  // ---------- reading an expression (pure, so the checks can test it) ----------
  // + − × ÷, brackets, a minus in front, a/b, small raised whole powers, ^(fraction) powers,
  // √ ∛ ∜ in front of a number or bracket, ½ ⅓ ⅔ ¼ ¾, commas in thousands, and a unit "m".
  const VULG = { '½': 1 / 2, '⅓': 1 / 3, '⅔': 2 / 3, '¼': 1 / 4, '¾': 3 / 4 };
  const ROOTS = { '√': 2, '∛': 3, '∜': 4 };
  function val(s) {
    const src = String(s).replace(/\s+/g, '').replace(/m$/, '');
    let i = 0;
    const peek = () => src[i];
    function sum() {
      let v = prod();
      while (peek() === '+' || peek() === '−') { const op = src[i++]; const w = prod(); v = op === '+' ? v + w : v - w; }
      return v;
    }
    function prod() {
      let v = unary();
      for (;;) {
        const ch = peek();
        if (ch === '×') { i++; v *= unary(); } else if (ch === '÷') { i++; v /= unary(); } else return v;
      }
    }
    function unary() { if (peek() === '−') { i++; return -unary(); } return frac(); }
    function frac() { let v = powr(); while (peek() === '/') { i++; v /= powr(); } return v; }
    function powr() {
      let v = atom();
      for (;;) {
        if (src[i] === '^' && src[i + 1] === '(') {
          i += 2;
          const e = sum();
          if (src[i] !== ')') throw new Error('no closing bracket in ' + s);
          i++; v = Math.pow(v, e); continue;
        }
        const save = i;
        let neg = false, m = '';
        if (src[i] === '⁻') { neg = true; i++; }
        while (i < src.length && SUPC.indexOf(src[i]) >= 0) m += SUPC.indexOf(src[i++]);
        if (!m) { i = save; return v; }
        v = Math.pow(v, neg ? -m : +m);
      }
    }
    function atom() {
      const ch = peek();
      if (ch === '(') { i++; const v = sum(); if (src[i] !== ')') throw new Error('no closing bracket in ' + s); i++; return v; }
      if (ch != null && ROOTS[ch]) { i++; return Math.pow(atom(), 1 / ROOTS[ch]); }
      if (ch != null && VULG[ch] != null) { i++; return VULG[ch]; }
      const m = /^[0-9][0-9,]*(\.[0-9]+)?/.exec(src.slice(i));
      if (m) { i += m[0].length; return +m[0].replace(/,/g, ''); }
      throw new Error('cannot read ' + src.slice(i) + ' in ' + s);
    }
    const v = sum();
    if (i !== src.length) throw new Error('left over in ' + s);
    return v;
  }
  // As a screen reader says it.
  const SAYF = { '½': ' one half ', '⅓': ' one third ', '⅔': ' two thirds ', '¼': ' one quarter ', '¾': ' three quarters ' };
  const say = (s) => String(s == null ? '' : s)
    .replace(/\^\(([^)]*)\)/g, (m, e) => ' to the power ' + e + ' ')
    .replace(/⁻?[⁰¹²³⁴⁵⁶⁷⁸⁹]+/g, (m) => ' to the power ' + m.split('').map((ch) => (ch === '⁻' ? ' minus ' : SUPC.indexOf(ch))).join('') + ' ')
    .replace(/√/g, ' the square root of ').replace(/∛/g, ' the cube root of ').replace(/∜/g, ' the fourth root of ')
    .replace(/[½⅓⅔¼¾]/g, (ch) => SAYF[ch])
    .replace(/×/g, ' times ').replace(/÷/g, ' divided by ').replace(/≈/g, ' about ').replace(/=/g, ' equals ')
    .replace(/−/g, ' minus ').replace(/\+/g, ' plus ').replace(/\//g, ' over ')
    .replace(/\s+/g, ' ').trim();

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // A ladder p: base b, whole powers lo to hi, each step cut into c small steps. Heights are counted
  // in small steps j (power j/c). The marker climbs from 'from' to 'go'; br are brackets [j0, j1]
  // that say what a run of small steps multiplies by. Every rung value, arrow, bracket and landing
  // is worked out from b, c and j. A SHOW step's tl is its timetable in seconds from when it opens.
  // A puzzle: opts, the answers offered; right, the lines a right answer adds; wrong, each wrong
  // answer's own slip (climb: r small steps n times; mark: where its number sits; neg: below 0) and lines.
  const PICK = 'Tap one of the answers.';
  const STEPS = [
    { show: true, name: 'The power ladder', replay: 'Play again',
      p: { b: '8', lo: 0, hi: 3, c: 3, H: 84, live: true, tl: { act: 0.6, work: [3.2, 3.5] } },
      text: 'Each rung is a power of 8, and each step up multiplies by 8. Cut every step into equal small steps: each adds the same fraction to the power, and adding to a power multiplies, so each small step multiplies by the same number. Three small steps of × 2 make × 8, so `8^(1/3)` = 2.' },
    { name: 'A cube root', q: '27^(1/3)',
      p: { b: '27', lo: 0, hi: 2, c: 3, from: 0, go: 1, br: [[0, 3]] },
      opts: ['9', '3', '27.33'], want: '3',
      right: [{ e: '27^(1/3)', w: '∛27 = 3' }, { e: '3 × 3 × 3', w: '27' }],
      wrong: { '9': { slip: { r: '27 × ⅓', n: 3 }, lines: [{ e: '27 × ⅓', w: '9', bad: true }, { e: '9 × 9 × 9', w: '729', bad: true }] },
        '27.33': { slip: { mark: '27 + ⅓', note: 'just above 27' }, lines: [{ e: '27 + ⅓', w: '≈ 27.33', bad: true }] } },
      task: 'What is `27^(1/3)`?',
      why: 'Cut one step of the 27 ladder into three equal small steps. Each one is × 3, because 3 × 3 × 3 = 27, so `27^(1/3)` = `∛27` = 3.',
      hint: 'Not quite. Find the number that makes 27 when it is used three times in a multiplication.',
      hints: { '9': 'Not quite. That is 27 × ⅓. Three small steps of × 9 climb to 729, not 27.',
        '27.33': 'Not quite. That is 27 + ⅓, already past 27. Find the number that makes 27 when it is used three times.' } },
    { show: true, name: 'Halves', replay: 'Play again',
      p: { b: '4', lo: 0, hi: 2, c: 2, from: 0, go: 2, br: [[0, 2]], tl: { in: 0.4, act: 1.4, step: 0.9, work: [3.6, 3.9] } },
      work: [{ e: '2 × 2', w: '4' }, { e: '4^(1/2)', w: '√4 = 2' }],
      text: 'Cut each step of the 4 ladder in two. Two small steps of × 2 make × 4, so `4^(1/2)` = `√4` = 2. A power of one half is a square root.' },
    { name: 'A fourth root', q: '81^(1/4)',
      p: { b: '81', lo: 0, hi: 2, c: 4, from: 0, go: 1, br: [[0, 4]] },
      opts: ['20.25', '9', '3'], want: '3',
      right: [{ e: '81^(1/4)', w: '∜81 = 3' }, { e: '3 × 3 × 3 × 3', w: '81' }],
      wrong: { '9': { slip: { r: '√81', n: 4 }, lines: [{ e: '√81', w: '9', mu: true }, { e: '9 × 9 × 9 × 9', w: '6561', bad: true }] },
        '20.25': { slip: { mark: '81 × ¼' }, lines: [{ e: '81 × ¼', w: '20.25', bad: true }] } },
      task: 'What is `81^(1/4)`?',
      why: 'The bottom number, 4, cuts each step into four equal small steps. Each one is × 3, because 3 × 3 × 3 × 3 = 81, so `81^(1/4)` is 3, the *fourth root* of 81.',
      hint: 'Not quite. Find the number that makes 81 when it is used four times in a multiplication.',
      hints: { '9': 'Not quite. 9 is `√81`, two small steps to a step. Four small steps of × 9 climb to 6561.',
        '20.25': 'Not quite. That is 81 × ¼. The power is not a times sign.' } },
    { show: true, name: 'The top number', replay: 'Play again',
      p: { b: '8', lo: 0, hi: 2, c: 3, from: 0, go: 2, br: [[0, 2]], tl: { in: 0.4, act: 1.3, step: 0.9, work: [3.4, 3.7] } },
      work: [{ e: '8^(2/3)', w: '2 × 2 = 4' }, { e: '(∛8)²', w: '2² = 4' }],
      text: 'The top number counts the small steps you climb. `8^(2/3)` is two small steps of × 2, so it is 2 × 2 = 4. In a *fractional power* the bottom number is the root and the top number is the power.' },
    { name: 'Two small steps', q: '64^(2/3)',
      p: { b: '64', lo: 0, hi: 2, c: 3, from: 0, go: 2, br: [[0, 3]] },
      opts: ['16', '512', '42.67'], want: '16',
      right: [{ e: '64^(2/3)', w: '4 × 4 = 16' }, { e: '4 × 4 × 4', w: '64' }],
      wrong: { '512': { slip: { r: '√64', n: 3 }, lines: [{ e: '(√64)³', w: '8 × 8 × 8 = 512', bad: true }, { e: '64^(3/2)', w: '512', mu: true }] },
        '42.67': { slip: { mark: '64 × ⅔' }, lines: [{ e: '64 × ⅔', w: '≈ 42.67', bad: true }] } },
      task: 'What is `64^(2/3)`?',
      why: 'The bottom number, 3, cuts each step into three small steps of × 4, because 4 × 4 × 4 = 64. The top number, 2, climbs two of them, so `64^(2/3)` = 4 × 4 = 16.',
      hint: 'Not quite. Take the cube root of 64 first, then climb two small steps.',
      hints: { '512': 'Not quite. That puts the root on top. `(√64)³` = 512 is `64^(3/2)`, three half steps.',
        '42.67': 'Not quite. That is 64 × ⅔. Take the cube root first, then climb two small steps.' } },
    { show: true, sw: true, name: 'Root first or power first', replay: 'Play again',
      p: { b: '27', lo: 0, hi: 5, c: 3, from: 0, go: 5, tl: { in: 0.4, act: 1.3 } },
      text: 'Root first climbs five small steps of × 3, to 243. Power first climbs five whole steps, to 14,348,907, and the cube root keeps a third of that height. Both land on `27^(5/3)` = 243, because ⅓ × 5 = 5 × ⅓.' },
    { name: 'A thousand', q: '1000^(2/3)',
      p: { b: '1000', lo: 0, hi: 2, c: 3, from: 0, go: 2, br: [] },
      opts: ['666.67', '100', '31,623'], want: '100',
      right: [{ e: '1000^(2/3)', w: '10 × 10 = 100' }, { e: '10 × 10 × 10', w: '1000' }],
      wrong: { '666.67': { slip: { mark: '1000 × ⅔' }, lines: [{ e: '1000 × ⅔', w: '≈ 666.67', bad: true }] },
        '31,623': { slip: { r: '√1000', n: 3 }, lines: [{ e: '(√1000)³', w: '≈ 31,623', bad: true }, { e: '1000^(3/2)', w: '≈ 31,623', mu: true }] } },
      task: 'What is `1000^(2/3)`?',
      why: 'Each small step of the 1000 ladder is × 10, because 10 × 10 × 10 = 1000. Two of them make 10 × 10 = 100, so `1000^(2/3)` = 100.',
      hint: 'Not quite. Take the cube root of 1000, then climb two small steps.',
      hints: { '666.67': 'Not quite. That is 1000 × ⅔. The power is not a times sign.',
        '31,623': 'Not quite. That puts the root on top. `(√1000)³` is `1000^(3/2)`, three half steps.' } },
    { show: true, name: 'Below 1', replay: 'Play again',
      p: { b: '8', lo: -1, hi: 1, c: 3, from: 0, go: -2, below: true, br: [[0, -2]], tl: { in: 0.4, act: 1.4, step: 0.9, work: [3.6, 3.9] } },
      work: [{ e: '8^(−1/3)', w: '1 ÷ 2 = 1/2' }, { e: '8^(−2/3)', w: '1 ÷ 2 ÷ 2 = 1/4' }],
      text: 'Carry the 8 ladder on down past 1. Each small step down divides by 2, so two small steps down land on 1/4, which is `8^(−2/3)`. The values get smaller but never reach 0.' },
    { name: 'A minus in the power', q: '27^(−1/3)',
      p: { b: '27', lo: -1, hi: 1, c: 3, from: 0, go: -1, below: true, br: [[0, -3]] },
      opts: ['1/3', '−3', '−9'], want: '1/3',
      right: [{ e: '27^(−1/3)', w: '1 ÷ 3 = 1/3' }, { e: '1 ÷ ∛27', w: '1/3' }],
      wrong: { '−3': { slip: { neg: '−∛27' }, lines: [{ e: '−∛27', w: '−3', bad: true }] },
        '−9': { slip: { neg: '−27 × ⅓' }, lines: [{ e: '−27 × ⅓', w: '−9', bad: true }] } },
      task: 'What is `27^(−1/3)`?',
      why: 'One small step down the 27 ladder divides by 3, so `27^(−1/3)` = 1 ÷ 3 = 1/3. The minus means one over `∛27`, a small amount, not a negative one.',
      hint: 'Not quite. Take one small step down from 1.',
      hints: { '−3': 'Not quite. The minus in the power does not make the answer negative. It means one over `∛27`.',
        '−9': 'Not quite. That is −27 × ⅓. A minus in the power means one over, and every rung is above 0.' } },
    { show: true, name: 'Multiplying adds small steps', replay: 'Play again',
      p: { b: '4', lo: 0, hi: 2, c: 2, from: 0, go: 4, br: [[0, 1], [1, 4]], tl: { in: 0.4, act: 1.3, step: 0.65, work: [4.0, 4.3] } },
      work: [{ e: '4^(1/2) × 4^(3/2)', w: '2 × 8 = 16' }, { e: '½ + 3/2', w: '2' }],
      text: 'Multiplying still adds the powers. Half a step of × 2 and then three half steps of × 8 make four half steps, which is two whole steps. So `4^(1/2) × 4^(3/2)` = 2 × 8 = 16, which is `4²`.' },
    { name: 'Add the halves', q: '9^(1/2) × 9^(3/2)',
      p: { b: '9', lo: 0, hi: 2, c: 2, from: 0, go: 4, br: [[0, 1], [1, 4]] },
      opts: ['18', '81', '5.2'], want: '81',
      right: [{ e: '9^(1/2) × 9^(3/2)', w: '3 × 27 = 81' }, { e: '½ + 3/2', w: '2' }],
      wrong: { '18': { slip: { mark: '9 × 2' }, lines: [{ e: '9 × 2', w: '18', bad: true }] },
        '5.2': { slip: { mark: '9^(3/4)' }, lines: [{ e: '½ × 3/2', w: '¾', bad: true }, { e: '9^(3/4)', w: '≈ 5.2', bad: true }] } },
      task: 'What is `9^(1/2) × 9^(3/2)`?',
      why: 'Half a step of × 3 and then three half steps of × 27 make four half steps, which is two whole steps. The powers add, ½ + 3/2 = 2, so it is `9²` = 81.',
      hint: 'Not quite. Count the half steps the two powers climb together.',
      hints: { '18': 'Not quite. That is 9 × 2. Count the half steps instead.',
        '5.2': 'Not quite. That multiplies the powers, ½ × 3/2 = ¾. Multiplying numbers adds the powers.' } },
    { name: 'A cube tank', mixed: true, q: '0.125^(1/3)',
      p: { b: '8', lo: -2, hi: 1, c: 3, from: 0, go: -1, below: true, dec: true, br: [[0, -3]] },
      opts: ['0.0417 m', '0.354 m', '0.5 m'], want: '0.5 m',
      right: [{ e: '0.125', w: '8⁻¹' }, { e: '(8⁻¹)^(1/3)', w: '8^(−1/3) = 0.5' }, { e: '0.5 × 0.5 × 0.5', w: '0.125' }],
      wrong: { '0.0417 m': { slip: { mark: '0.125 × ⅓' }, lines: [{ e: '0.125 × ⅓', w: '≈ 0.0417', bad: true }] },

      task: 'A cube-shaped tank holds 0.125 m³. Its edge is `0.125^(1/3)` m. How long is that?',

  // The first screen: cut every step into 2, 3 or 4 small steps, and climb one small step at a time.

  // One animation plays each demonstration and the motion after an answer; with reduced motion

  document.addEventListener('visibilitychange', () => { if (!document.hidden && !anim.playing() && T !== Infinity) { T = Infinity; paint(); } });
