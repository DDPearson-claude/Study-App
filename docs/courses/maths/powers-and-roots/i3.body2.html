<p class="caption">A square's side times itself gives its area, so the side is the square root of the area.</p>

<script>
  // ---------- numbers, roots and how they are written ----------
  const SQ = (n) => Number.isInteger(n) && n >= 0 && Math.pow(Math.round(Math.sqrt(n)), 2) === n;
  const CU = (n) => Number.isInteger(n) && n >= 0 && Math.pow(Math.round(Math.cbrt(n)), 3) === n;
  const isPow = (n, k) => (k === 3 ? CU(n) : SQ(n));
  const rootOf = (n, k) => (k === 3 ? Math.cbrt(n) : Math.sqrt(n));
  // A fixed number of places (1.73, 4.80), and a number with its trailing zeros dropped (7.0225, 23.04).
  const fix = (v, d) => (v < 0 ? '−' : '') + Math.abs(v).toFixed(d);
  const trim = (v, d) => (v < 0 ? '−' : '') + String(Number(Math.abs(v).toFixed(d)));
  const fmtInt = (v) => (v < 0 ? '−' + (-v) : String(v));
  // A side or edge as the lesson writes it: whole where the root is whole, otherwise a surd.
  const rootText = (n, k) => (isPow(n, k) ? String(Math.round(rootOf(n, k))) : (k === 3 ? '∛' : '√') + n);
  // The first screens' lines of working, worked out from the area (k = 2) or the volume (k = 3).
  function liveWork(n, k) {
    const r = rootOf(n, k), sym = k === 3 ? '∛' : '√', times = (x) => Array(k).fill(x).join(' × ');
    if (isPow(n, k)) return [{ e: times(String(Math.round(r))), w: String(n) }, { e: sym + n, w: String(Math.round(r)) }];
    const d = fix(r, 2), back = trim(Math.pow(+d, k), 2 * k);
    return [{ e: times(sym + n), w: String(n) }, { e: k === 3 ? d + '³' : d + ' × ' + d, w: back, not: String(n), mu: true }];
  }
  // What fills the square (k = 2) or cube (k = 3): whole unit squares or cubes, and the rest in pieces.
  function fillOf(n, k) { const w = Math.floor(rootOf(n, k) + 1e-9), whole = Math.pow(w, k); return { w, whole, pieces: n - whole }; }
  function areaLine(n, k) {
    const f = fillOf(n, k), thing = k === 3 ? 'cube' : 'square', W = k === 3 ? 'Volume ' : 'Area ';
    if (!f.pieces) return W + n + ': ' + (n === 1 ? 'one unit ' + thing + ' fills' : n + ' unit ' + thing + 's fill') + ' it exactly';
    return W + n + ': ' + f.whole + ' whole ' + thing + (f.whole === 1 ? '' : 's') + ', ' + f.pieces + ' in pieces';
  }

  // ---------- reading an expression (pure, so the checks can test it) ----------
  // +, −, ×, ÷, brackets, a minus in front, ½, ² and ³, √ and ∛ (each taking what follows it),
  // a number written before a root (4√3), commas in thousands and a unit of length at the end.
  function val(s) {
    const src = String(s).replace(/\s+/g, '').replace(/(cm|m)²?$/, '');
    let i = 0;
    const peek = () => src[i];
    function sum() {
      let v = prod();
      while (peek() === '+' || peek() === '−') { const op = src[i++]; const w = prod(); v = op === '+' ? v + w : v - w; }
      return v;
    }
    function prod() {
      let v = unary();
      for (;;) {
        const c = peek();
        if (c === '×') { i++; v *= unary(); } else if (c === '÷') { i++; v /= unary(); } else if (c != null && /[0-9(√∛½]/.test(c)) v *= root(); else return v;
      }
    }
    function unary() { if (peek() === '−') { i++; return -unary(); } return root(); }
    function root() {
      if (peek() === '√') { i++; return Math.sqrt(root()); }
      if (peek() === '∛') { i++; return Math.cbrt(root()); }
      return powr();
    }
    function powr() { const v = atom(); if (src[i] === '²') { i++; return v * v; } if (src[i] === '³') { i++; return v * v * v; } return v; }
    function atom() {
      const c = peek();
      if (c === '(') { i++; const v = sum(); if (src[i] !== ')') throw new Error('no closing bracket in ' + s); i++; return v; }
      if (c === '½') { i++; return 0.5; }
      const m = /^[0-9][0-9,]*(\.[0-9]+)?/.exec(src.slice(i));
      if (m) { i += m[0].length; return +m[0].replace(/,/g, ''); }
      throw new Error('cannot read ' + src.slice(i));
    }
    const v = sum();
    if (i !== src.length) throw new Error('left over in ' + s);
    return v;
  }
  // As a screen reader says it.
  const say = (s) => String(s == null ? '' : s)
    .replace(/√/g, ' root ').replace(/∛/g, ' cube root of ').replace(/²/g, ' squared').replace(/³/g, ' cubed').replace(/½/g, ' a half')
    .replace(/×/g, ' times ').replace(/÷/g, ' divided by ').replace(/≈/g, ' about ').replace(/=/g, ' equals ').replace(/−/g, ' minus ').replace(/\+/g, ' plus ')
    .replace(/\s+/g, ' ').trim();

  // ---------- text with amber key terms and italic letters (built with K.el, never innerHTML) ----------
  const ITAL = /((?<![A-Za-z])x(?![A-Za-z]))/;
  function italics(parent, s, inSvg) {
    String(s).split(ITAL).forEach((p, k) => {
      if (!p) return;
      parent.appendChild(k % 2 ? (inSvg ? K.svg('tspan', { class: 'v' }, p) : K.el('span', { class: 'v' }, p)) : document.createTextNode(p));
    });
  }
  // `maths` stays on one line with its letters italic; *a key term* is highlighted.
  function write(el, s) {
    el.textContent = '';
    String(s).split('`').forEach((seg, k) => {
      if (!seg) return;
      if (k % 2) { italics(el.appendChild(K.el('span', { class: 'nw' })), seg, false); return; }
      const re = /\*([^*]+)\*/g;
      let at = 0, m;
      while ((m = re.exec(seg))) {
        if (m.index > at) el.appendChild(document.createTextNode(seg.slice(at, m.index)));
        el.appendChild(K.el('span', { class: 'term' }, m[1]));
        at = m.index + m[0].length;
      }
      if (at < seg.length) el.appendChild(document.createTextNode(seg.slice(at)));
    });
  }

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // p: the picture. A puzzle: opts, the answers offered; want, the right one; target and pow, what
  // the right answer gives when squared (pow 2) or cubed (pow 3) back; right, the lines a right
  // answer adds; wrong, each wrong answer's own lines (and slip, a square drawn at its size).
  const PICK = 'Tap one of the answers.';
  const STEPS = [
    { show: true, name: 'A square and its side', p: { kind: 'grow' }, key: ['unit', 'piece'],
      text: 'A square of area 9 has sides of 3, because 3 × 3 = 9, so its *square root*, `√9`, is 3. Drag the corner. Between 1, 4, 9, 16 and 25 the side is still a real length, written exactly as a *surd* such as `√7`.' },
    { name: 'The side of 36', q: '√36', p: { kind: 'sq', A: 36, u: 30, gridAfter: true, side: '6' }, key: ['unit'],
      opts: ['18', '6', '1296'], want: '6', target: 36, pow: 2,
      right: [{ e: '6 × 6', w: '36' }, { e: '√36', w: '6' }],
      wrong: { '18': { lines: [{ e: '18 × 18', w: '324', not: '36', bad: true }] }, '1296': { lines: [{ e: '36 × 36', w: '1296', bad: true }] } },
      task: 'A square has an area of 36. How long is its side, `√36`?',
      why: 'The side times itself gives the area, and 6 × 6 = 36, so `√36 = 6`. Squaring 6 back gives 36, which checks it.',
      hint: 'Not quite. Which number times itself makes 36?',
      hints: { '18': 'Not quite. That halves 36, but 18 × 18 = 324. Which number times itself makes 36?',
        '1296': 'Not quite. That is 36 × 36, squaring 36 instead of finding its root.' } },
    { show: true, name: 'A square on the diagonal', p: { kind: 'diag', tl: [3.6, 3.9, 4.2] }, key: ['kept', 'cut'],
      work: [{ e: '4 × ½', w: '2' }, { e: '√2 × √2', w: '2' }, { e: '1.41 × 1.41', w: '1.9881', not: '2', mu: true }],
      text: "Cut four unit squares along their diagonals, and the cuts make a tilted square. It keeps half of each one, half of 4, so its area is 2. Its side, one square's diagonal, is `√2`." },
    { name: 'An exact side', q: 'A square of 7 m²', p: { kind: 'sq', A: 7, unit: ' m', n: 4, u: 44, grid: true, pieces: true, side: '√7 m' }, key: ['unit', 'piece'],
      opts: ['2.65 m', '3.5 m', '√7 m'], want: '√7 m', target: 7, pow: 2,
      right: [{ e: '√7 × √7', w: '7' }, { e: '2.65 × 2.65', w: '7.0225', not: '7', mu: true }],
      wrong: { '2.65 m': { slip: 2.65, lines: [{ e: '2.65 × 2.65', w: '7.0225', not: '7', bad: true }] },
        '3.5 m': { slip: 3.5, lines: [{ e: '7 ÷ 2', w: '3.5', bad: true }, { e: '3.5 × 3.5', w: '12.25', not: '7', bad: true }] } },
      task: 'A square has an area of 7 m². Which writes its side exactly?',
      why: '`√7` m times itself is exactly 7 m². 2.65 m is `√7` rounded to two places, close but not exact, since 2.65 × 2.65 = 7.0225.',
      hint: 'Not quite. Which one, times itself, gives exactly 7?',
      hints: { '2.65 m': 'Close, but rounded. 2.65 × 2.65 = 7.0225, not 7, so it is not exact.',
        '3.5 m': 'Not quite. That halves 7, and 3.5 × 3.5 = 12.25.' } },
    { show: true, name: 'A cube and its edge', p: { kind: 'cube', live: true }, key: ['cube', { k: 'piece', text: 'part of a unit cube' }],
      text: "A cube's volume is its edge used three times, so a cube of volume 8 has edges of 2, as 2 × 2 × 2 = 8. The edge is the *cube root*, `∛8 = 2`. Drag the corner from 1 up to 125." },
    { name: 'The edge of 64', q: '∛64', p: { kind: 'cube', V: 64, side: '4' }, key: ['cube'],
      opts: ['4', '8', '21.3'], want: '4', target: 64, pow: 3,
      right: [{ e: '4 × 4 × 4', w: '64' }, { e: '∛64', w: '4' }],
      wrong: { '8': { lines: [{ e: '8 × 8', w: '64', mu: true }, { e: '8 × 8 × 8', w: '512', not: '64', bad: true }] },
        '21.3': { lines: [{ e: '64 ÷ 3', w: '21.3', approx: 1, bad: true }] } },
      task: 'A cube has a volume of 64. How long is its edge, `∛64`?',
      why: '4 × 4 × 4 = 64, so `∛64 = 4`. A cube root uses the edge three times, not twice.',
      hint: 'Not quite. Which number, used three times, multiplies to 64?',
      hints: { '8': 'Not quite. 8 × 8 = 64, so 8 is the square root. A cube uses its edge three times, and 8 × 8 × 8 = 512.',
        '21.3': 'Not quite. That is 64 ÷ 3, a third of 64. Which number used three times makes 64?' } },
    { show: true, name: 'Splitting a square', p: { kind: 'split' }, key: ['tile'],
      text: 'A square of area 48 splits into 16 small squares of area 3, 4 along each side. Each small side is `√3`, so the whole side is `4√3`. Try 8 × 6, and the 8 squares will not make a square.' },
    { name: 'A square factor comes out', q: '√12', p: { kind: 'sq', A: 12, u: 46, tile: 3, per: 2, side: '2√3', tside: '√3' }, key: ['tile'],
      opts: ['4√3', '2√3', '6√2'], want: '2√3', target: 12, pow: 2,
      right: [{ e: '4 × 3', w: '12' }, { e: '√12', w: '√4 × √3 = 2√3' }],
      wrong: { '4√3': { lines: [{ e: '4√3 × 4√3', w: '16 × 3 = 48', not: '12', bad: true }] },
        '6√2': { lines: [{ e: '6√2 × 6√2', w: '36 × 2 = 72', not: '12', bad: true }] } },
      task: 'Write `√12` as simply as possible.',
      why: '12 is 4 × 3, and 4 is a square number, so the square splits into 4 squares of area 3, 2 along each side. So `√12 = √4 × √3 = 2√3`.',

      hints: { '4√3': 'Not quite. The 4 comes out as its root, 2. `4√3` squares to 16 × 3 = 48.',

    { show: true, name: 'A root of a sum', p: { kind: 'sum', a: 3, b: 4, c: 5, u: 23, ext: 7, w: 13, tl: [4.0, 4.3] }, key: ['unit', 'strip'],
      work: [{ e: '√(9 + 16)', w: '√25 = 5' }, { e: '7 × 7', w: '9 + 16 + 12 + 12 = 49' }],

      right: [{ e: '36 + 64', w: '100' }, { e: '10 × 10', w: '100' }],
      wrong: { '14': { split: true, lines: [{ e: '6 + 8', w: '14', bad: true }, { e: '14 × 14', w: '196', not: '100', bad: true }] },

      task: 'What is `√(36 + 64)`?',
      why: 'Add first, 36 + 64 = 100, then take the root, `√100 = 10`, as 10 × 10 = 100. Splitting it as 6 + 8 = 14 would give a square of 196.',

    { show: true, name: 'Two answers', p: { kind: 'pm', n: 36, u: 20, lo: -7, hi: 7, tl: [3.9, 4.2] }, key: ['unit', { k: 'dot', text: 'a number whose square is 36' }],
      work: [{ e: '√36', w: '6' }, { t: 'x² = 36 has two answers, 6 and −6' }],
      text: 'A side is never negative, so `√36` means 6. But −6 × −6 is also 36, so `x² = 36` has two answers, `x = 6` or `x = −6`.' },
    { name: 'Both answers', mixed: true, q: 'x² = 48', p: { kind: 'pm', n: 48, u: 17, lo: -8, hi: 8, side: '4√3' }, key: [{ k: 'dot', text: 'a number whose square is 48' }],
      opts: ['4√3 or −4√3', '24', '4√3'], want: '4√3 or −4√3', target: 48, pow: 2, both: true,
      right: [{ e: '48', w: '16 × 3' }, { e: '√48', w: '√16 × √3 = 4√3' }],
      wrong: { '24': { lines: [{ e: '48 ÷ 2', w: '24', bad: true }, { e: '24 × 24', w: '576', not: '48', bad: true }] },
        '4√3': { lines: [{ e: '−4√3 × −4√3', w: '16 × 3 = 48', mu: true }] } },
      task: 'Solve `x² = 48`.',
      why: '48 = 16 × 3, so `√48 = 4√3`. A negative times a negative is positive, so `−4√3` squared is 48 as well, and both answers count.',
      hint: 'Not quite. Find `√48`, then think about negatives.',
      hints: { '24': 'Not quite. That halves 48, and 24 × 24 = 576.',
        '4√3': 'Nearly. `4√3` works, but so does `−4√3`, since a negative times a negative is positive.' } },
    { name: 'A square plate', mixed: true, q: 'A plate of 50 cm²', p: { kind: 'sq', A: 50, unit: ' cm', u: 26, tile: 2, per: 5, side: '5√2 cm', tside: '√2' }, key: ['tile'],
      opts: ['10 cm', '5√2 cm', '25 cm'], want: '5√2 cm', target: 50, pow: 2,
      right: [{ e: '25 × 2', w: '50' }, { e: '√50', w: '√25 × √2 = 5√2' }],
      wrong: { '10 cm': { lines: [{ e: '√25 + √25', w: '10', bad: true }, { e: '10 × 10', w: '100', not: '50', bad: true }] },

    }

  }
  // The lines of working a step shows in a state, each with when it arrives (null: there already).
  function workOf(d, st, C) {
    const p = d.p, timed = (ts, rs) => rs.map((r, m) => ({ r, t: ts[m] }));
    if (d.show) {
      if (isLive(d)) {
        const k = p.kind === 'grow' ? 2 : 3, n = k === 2 ? st.a : st.v, rs = liveWork(n, k);
        if (C.act != null) return rs.map((r) => ({ r, t: 0.45 }));
        const te = k === 2 ? growEnd(n) + 0.8 : 3.3;
        return timed([te, te + 0.3], rs);
      }
      if (p.kind === 'split') return st.mode === 8 ? timed([2.7, 3.0], SPLIT8) : timed([3.6, 3.9], SPLIT16);
      return timed(p.tl, d.work);
    }
    const rt = rtOf(p);
    if (C.right) return d.right.map((r, m) => ({ r, t: rt + 0.3 * m }));
    if (C.wrong) return d.wrong[C.wrong].lines.map((r, m) => ({ r, t: 0.25 + 0.3 * m }));
    return [];
  }
  // The whole picture for a step now; returns it in words.
  function drawScene(i, d, st, G) {
    REC = { tag: null, side: null, approx: null, sideLen: null, whole: null, pieces: null, cells: 0, tiles: 0, per: 0, cols: 0, rows: 0, halves: 0, parts: [], dots: [], slips: [], work: [] };
    const C = ctxOf(d, st), said = [];
    said.push(PAN[d.p.kind].draw(d.p, G.py, C, d));
    drawKey(d, G);
    workOf(d, st, C).forEach((l, m) => said.push(drawWork(l.r, G.workY + 20 + LH * m, vis(l.t, 0.4))));
    return said.filter(Boolean).join(' ');
  }
  // The scene for a step (the animation calls this every frame).
  function paint(i) {
    if (i == null) i = at();
    const d = STEPS[i], st = S[i], G = geo(i);
    art.textContent = '';
    into = null;
    svg.setAttribute('viewBox', '0 0 340 ' + G.H);
    svg.setAttribute('aria-label', drawScene(i, d, st, G));
  }
  // How long a step's motion takes in a state: the latest arrival, and the earliest start.
  function motionLen(i, st) {
    const keepS = S[i], keepT = T;
    S[i] = st; T = Infinity; latest = 0; earliest = Infinity;
    try { paint(i); } finally { S[i] = keepS; T = keepT; }
    return { latest, earliest };
  }

  // ---------- dragging the square's or the cube's corner ----------
  const ui = svg.appendChild(K.svg('g'));
  const grip = ui.appendChild(K.svg('rect', { class: 'grip', x: 0, y: 0, width: 0, height: 0, tabindex: -1, role: 'slider', 'aria-orientation': 'horizontal' }));
  grip.style.display = 'none';
  function placeGrip(i) {
    const d = STEPS[i], on = !finished && isLive(d), g = GRIP[d.p.kind];
    grip.style.display = on && g ? '' : 'none';
    grip.setAttribute('tabindex', on && g ? '0' : '-1');
    if (!on || !g) return;
    const b = g.box, k = liveKey(d), v = S[i][k];
    grip.setAttribute('x', b[0]); grip.setAttribute('y', b[1]); grip.setAttribute('width', b[2]); grip.setAttribute('height', b[3]);
    grip.setAttribute('aria-label', k === 'a' ? 'Area of the square' : 'Volume of the cube');
    grip.setAttribute('aria-valuemin', 1); grip.setAttribute('aria-valuemax', liveMax(d)); grip.setAttribute('aria-valuenow', v);
    grip.setAttribute('aria-valuetext', (k === 'a' ? 'area ' : 'volume ') + v);
  }
  // The pointer sets the corner: the side (or edge) is how far it is from the fixed corner, and the
  // value lands on whole units, snapping to a whole side near one.
  function dragTo(e) {
    const i = at(), d = STEPS[i], g = GRIP[d.p.kind], ctm = svg.getScreenCTM();
    if (!g || !ctm || !isLive(d)) return;
    const q = new DOMPoint(e.clientX, e.clientY).matrixTransform(ctm.inverse());
    const s = K.clamp(Math.max(q.x - g.x0, g.y0 - q.y) / g.u, 1, 5), r = Math.round(s);
    if (d.p.kind === 'grow') setLive(Math.abs(s - r) < 0.15 ? r * r : Math.round(s * s), 'drag');
    else setLive(Math.abs(s - r) < 0.08 ? r * r * r : Math.round(s * s * s), 'drag');
  }
  let held = null;
  grip.addEventListener('pointerdown', (e) => {
    if (!isLive(STEPS[at()]) || finished) return;
    held = e.pointerId;
    try { grip.setPointerCapture(e.pointerId); } catch (err) { /* the drag still follows the pointer while it stays on the picture */ }
    e.preventDefault();
    dragTo(e);
  });
  grip.addEventListener('pointermove', (e) => { if (held === e.pointerId) dragTo(e); });
  const letGo = (e) => { if (held === e.pointerId) held = null; };
  grip.addEventListener('pointerup', letGo);
  grip.addEventListener('pointercancel', letGo);
  grip.addEventListener('lostpointercapture', () => { held = null; });
  grip.addEventListener('keydown', (e) => {
    const d = STEPS[at()];
    if (!isLive(d) || finished) return;
    const now = S[at()][liveKey(d)], by = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1 }[e.key];
    if (by == null && e.key !== 'Home' && e.key !== 'End') return;
    e.preventDefault();
    setLive(e.key === 'Home' ? 1 : e.key === 'End' ? liveMax(d) : now + by, 'drag');
  });

  const el = (id) => document.getElementById(id);
  write(el('finish'), FINISH);
  K.update((pp) => {
    const i = Math.round(pp.step), d = STEPS[i], st = S[i];
    if (!anim.playing()) T = Infinity;   // motion that was stopped (the page hidden, a test) shows finished
    if (i !== lastStep) {
      lastStep = i; enter('stepbox');
      if (d.show) { st.prev = null; if (d.p.kind === 'split') st.mode = 16; play(motionLen(i, st).latest); } else { anim.pause(); T = Infinity; }
    }
    if (finished !== lastDone) { lastDone = finished; enter(finished ? 'done' : 'stepbox'); }
    const right = st.res === 'right';
    el('stepbox').hidden = finished;
    el('done').hidden = !finished;
    el('count').textContent = 'Step ' + (i + 1) + ' of ' + STEPS.length + (d.mixed ? ' · mixed' : '');
    const task = el('task');
    task.className = 'task' + (d.show ? ' show' : '');
    write(task, d.show ? d.text : d.task);
    paint(i);
    placeGrip(i);

    const live = isLive(d);
    el('tune').hidden = finished || !live;
    if (live) { const k = liveKey(d); downBtn.el.disabled = st[k] <= 1; upBtn.el.disabled = st[k] >= liveMax(d); }
    const split = d.p.kind === 'split';
    replayBtn.el.hidden = !d.show || split || REDUCE;
    m16Btn.el.hidden = !split; m8Btn.el.hidden = !split;
    m16Btn.el.setAttribute('aria-pressed', split && st.mode === 16 ? 'true' : 'false');
    m8Btn.el.setAttribute('aria-pressed', split && st.mode === 8 ? 'true' : 'false');
    el('replay').hidden = replayBtn.el.hidden && !split;
    const opts = d.show ? [] : d.opts || [];
    el('picks').hidden = !opts.length;
    el('picks').classList.toggle('long', opts.some((o) => o.length > 7));
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      b.setLabel(opts[k]);
      b.el.textContent = '';
      italics(b.el.appendChild(K.el('span')), opts[k], false);
      b.el.setAttribute('aria-label', say(opts[k]));
      b.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });

    el('acts').hidden = !!d.show;
    checkBtn.el.hidden = right;
    const fb = el('fb');
    fb.hidden = !!d.show;
    fb.className = 'fb' + (right ? ' right' : st.res === 'wrong' ? ' wrong' : '');
    write(fb, d.show ? '' : right ? "That's it." : st.res === 'wrong' ? hintFor(i, st) : st.res === 'empty' ? PICK : '');

    const why = el('why');
    why.hidden = d.show || !st.why;
    write(why, d.show ? '' : d.why);
    whyBtn.setLabel(st.why ? 'Hide why' : 'Why?');

    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !right);
    nextBtn.setLabel(i === STEPS.length - 1 ? 'Finish' : 'Continue');
    nav.hidden = backBtn.el.hidden && nextBtn.el.hidden;
  });

  // ---------- known answers, worked out by hand ----------
  const DO = STEPS.map((d, i) => i).filter((i) => !STEPS[i].show);
  const close = (a, b) => Math.abs(a - b) < 1e-9 * Math.max(1, Math.abs(a), Math.abs(b));
  const idx = (name) => STEPS.findIndex((d) => d.name === name);
  const I_CUBE = idx('A cube and its edge'), I_DIAG = idx('A square on the diagonal'), I_SPLIT = idx('Splitting a square'), I_SUM = idx('A root of a sum');
  const I_PM = idx('Two answers'), I_X48 = idx('Both answers'), I_7 = idx('An exact side');
  const liveSt = (a) => Object.assign(blank(), { a });
  const cubeSt = (v) => Object.assign(blank(), { v });
  const splitSt = (m) => Object.assign(blank(), { mode: m });
  const solvedSt = (i) => Object.assign(blank(), { pick: STEPS[i].want, res: 'right' });
  const wrongSt = (i, o) => Object.assign(blank(), { pick: o, res: 'wrong' });
  const pickRight = (i, v) => isRight(i, Object.assign(blank(), { pick: v }));
  // A step painted in the state given (finished, or at t seconds into its motion): what it draws.
  function drawn(i, st, t) {
    const keepS = S[i], keepT = T;
    S[i] = st; T = t == null ? Infinity : t;
    try {
      paint(i);
      return Object.assign({ texts: Array.from(art.querySelectorAll('text')).map((n) => n.textContent) }, REC);
    } finally { S[i] = keepS; T = keepT; paint(); }
  }
  // A line of working adds up: each part after = equals the expression (to the places shown when
  // it is rounded), and a "not" value differs from it.
  const adds = (r) => {
    if (r.t) return true;
    const v = val(r.e);
    const ok = r.w.split('=').every((q) => (r.approx != null ? Math.abs(val(q) - v) <= 0.5 * Math.pow(10, -r.approx) + 1e-12 : close(val(q), v)));
    return ok && (r.not == null || !close(val(r.not), v));
  };
  const optVals = (o) => o.split(' or ').map((x) => val(x));

  K.check('A decimal answer, such as 1.73 (2 decimal places), is not exact: at area 3 the side is written √3 with ≈ 1.73 beside it, and squaring 1.73 back gives 2.9929, not 3', () => {
    const g = drawn(0, liveSt(3));
    return g.side === '√3' && g.approx === '1.73' && close(val('1.73 × 1.73'), 2.9929) && !close(2.9929, 3) &&
      g.work.some((r) => r.e === '1.73 × 1.73' && r.w === '2.9929' && r.not === '3');
  }, { source: SRC1 });
  K.check('To write the side length of a square whose area is not a whole number times itself, we use the square root symbol: at every area from 1 to 25 the side is drawn √area long and written √area, or as the whole number at 1, 4, 9, 16 and 25', () => {
    for (let a = 1; a <= 25; a++) {
      const g = drawn(0, liveSt(a));
      if (!close(g.sideLen, Math.sqrt(a)) || g.side !== (SQ(a) ? String(Math.sqrt(a)) : '√' + a)) return false;
    }
    return [1, 4, 9, 16, 25].every(SQ) && [2, 3, 5, 24].every((a) => !SQ(a));
  }, { source: SRC2 });
  K.check('A surd is an expression that includes a square root, cube root or other root symbol: on every screen, each side or edge that is not a whole number is written with √ or ∛, and each whole one without', () => {
    const ok = (lab, len) => (Math.abs(len - Math.round(len)) < 1e-9 ? /^[0-9]+( c?m)?$/.test(lab) : /[√∛]/.test(lab));
    for (let a = 1; a <= 25; a++) { const g = drawn(0, liveSt(a)); if (!ok(g.side, Math.sqrt(a))) return false; }
    for (let v = 1; v <= 125; v++) { const g = drawn(I_CUBE, cubeSt(v)); if (!ok(g.side, Math.cbrt(v))) return false; }
    const sp = drawn(I_SPLIT, splitSt(16)), dg = drawn(I_DIAG, blank());
    return ok(sp.side, Math.sqrt(48)) && ok(dg.side, Math.SQRT2) && DO.every((i) => { const g = drawn(i, solvedSt(i)); return ok(g.side, val(g.side)); });
  }, { source: SRC1 });
  K.check('At areas 1, 4, 9, 16 and 25 the unit squares fill the square exactly; at every other area some of it is in pieces, and the whole squares and the pieces add up to the area', () => {
    for (let a = 1; a <= 25; a++) {
      const g = drawn(0, liveSt(a)), w = Math.floor(Math.sqrt(a) + 1e-9);
      if (g.whole + g.pieces !== a || g.whole !== w * w || (g.pieces === 0) !== SQ(a)) return false;
    }
    return true;
  });
  K.check("A cube's edge is the cube root of its volume: at every volume from 1 to 125 the edge drawn, used three times, gives the volume, and the unit cubes fill it exactly only at 1, 8, 27, 64 and 125", () => {
    const full = [];
    for (let v = 1; v <= 125; v++) {
      const g = drawn(I_CUBE, cubeSt(v));
      if (!close(Math.pow(g.sideLen, 3), v) || g.whole + g.pieces !== v) return false;
      if (g.pieces === 0) full.push(v);
    }
    return full.join() === '1,8,27,64,125';
  });
  K.check("The tilted square keeps half of each of the 4 unit squares, so its area is 4 × ½ = 2, and its side, one unit square's diagonal, is √2", () => {
    const g = drawn(I_DIAG, blank());
    return g.halves === 4 && g.cuts === 4 && close(g.kept, 2) && close(g.tiltArea, 2) && close(g.tiltSide, Math.SQRT2) && g.side === '√2';
  });
  K.check('The square of area 48 splits into 16 squares of area 3, 4 along each side, so its side √48 is 4√3; 8 squares of area 6 make the same area but lie as 2 rows of 4, not a square', () => {
    const a = drawn(I_SPLIT, splitSt(16)), b = drawn(I_SPLIT, splitSt(8));
    return a.tiles === 16 && a.per === 4 && a.rows === 4 && close(a.tiles * a.tileArea, 48) && a.side === '4√3' && close(val('4√3'), Math.sqrt(48)) && close(a.per * a.tileSide, a.sideLen) &&
      b.tiles === 8 && b.cols === 4 && b.rows === 2 && close(b.cols * b.tileSide * b.rows * b.tileSide, 48) && b.cols !== b.rows;
  });
  K.check('Squares of 9 and 16 make 25, whose side is 5, while their sides end to end make 3 + 4 = 7; the square of side 7 holds 9 + 16 + 12 + 12 = 49', () => {
    const g = drawn(I_SUM, blank()), p = STEPS[I_SUM].p;
    return g.parts.join() === '9,16,12,12' && g.parts.reduce((x, y) => x + y, 0) === g.big * g.big && g.big === 7 && close(Math.sqrt(p.a * p.a + p.b * p.b), p.c) && p.a + p.b !== p.c;
  });
  K.check('x² = 36 has two answers, 6 and −6, both on the number line, while the side √36 is 6; x² = 48 is solved by 4√3 and −4√3, and the pick 4√3 alone shows only one', () => {
    const g = drawn(I_PM, blank()), h = drawn(I_X48, solvedSt(I_X48)), w = drawn(I_X48, wrongSt(I_X48, '4√3'));
    return g.dots.length === 2 && g.dots.every((v) => close(v * v, 36)) && g.dots[0] === -g.dots[1] && g.side === '6' &&
      h.dots.length === 2 && h.dots.every((v) => close(v * v, 48)) && close(h.dots[0], val('4√3')) && w.dots.length === 1;
  });
  K.check('Every line of working on every screen adds up, at every area from 1 to 25 and every volume from 1 to 125 too, and each "not" value differs', () => {
    const all = [];
    STEPS.forEach((d) => { if (d.work) all.push(...d.work); if (!d.show) { all.push(...d.right); Object.keys(d.wrong).forEach((o) => all.push(...d.wrong[o].lines)); } });
    all.push(...SPLIT16, ...SPLIT8);
    for (let a = 1; a <= 25; a++) all.push(...liveWork(a, 2));
    for (let v = 1; v <= 125; v++) all.push(...liveWork(v, 3));
    return all.length > 300 && all.every(adds);
  });
  K.check('Each puzzle accepts only its right answer: squared or cubed back, the right answer gives the area or volume and every wrong one does not; before an answer the side reads ?, after it the right side, and a slip of a length is drawn at that length', () =>
    DO.every((i) => {
      const d = STEPS[i];
      if (d.opts.length !== 3 || d.opts.indexOf(d.want) < 0 || !d.opts.every((o) => pickRight(i, o) === (o === d.want))) return false;
      if (Object.keys(d.wrong).length !== 2 || !Object.keys(d.wrong).every((o) => d.opts.indexOf(o) >= 0 && o !== d.want)) return false;
      const good = (o) => { const vs = optVals(o); return vs.length === (d.both ? 2 : 1) && vs.every((v) => close(Math.pow(v, d.pow), d.target)) && new Set(vs.map((v) => v.toFixed(9))).size === vs.length; };
      if (!d.opts.every((o) => good(o) === (o === d.want))) return false;
      const g = drawn(i, solvedSt(i)), b = drawn(i, blank());
      if (g.side !== d.p.side || b.side !== '?' || g.tag !== d.q || b.slips.length) return false;
      return Object.keys(d.wrong).every((o) => { const w = d.wrong[o], h = drawn(i, wrongSt(i, o)); return !w.slip || (h.slips.length === 1 && close(h.slips[0], val(o))); });
    }) && drawn(I_7, wrongSt(I_7, '3.5 m')).slips[0] === 3.5);
  K.check('Every demonstration has arrived within 5 s of its screen opening, nothing starting before the 0.35 s screen fade ends; every answer and press within 3 s, and the 8 × 6 try within 3.5 s', () => {
    const ok = STEPS.every((d, i) => {
      if (d.show) { const m = motionLen(i, blank()); return m.latest <= 5 && m.earliest >= FADE; }
      return motionLen(i, solvedSt(i)).latest <= 3 && d.opts.filter((o) => o !== d.want).every((o) => motionLen(i, wrongSt(i, o)).latest <= 3);
    }) && motionLen(0, Object.assign(liveSt(10), { prev: 9 })).latest <= 3 && motionLen(I_CUBE, Object.assign(cubeSt(9), { prev: 8 })).latest <= 3 &&
      motionLen(I_SPLIT, splitSt(8)).latest <= 3.5;
    paint();
    return ok;
  });

  K.ready();
</script>
