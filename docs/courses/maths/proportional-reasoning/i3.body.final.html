<style>

  .pz { max-width: 30rem; }

  .scene { display: block; width: 100%; touch-action: pan-y; }

  .scene .track { fill: var(--k-panel); stroke: var(--k-strong); stroke-width: 2; }

  .scene .cutw { stroke: var(--k-warn); stroke-width: 2.5; }
  .scene .overt { font: 700 14px var(--k-font); fill: var(--k-warn); }
  .scene .brk { stroke: var(--k-muted); stroke-width: 2; stroke-linecap: round; }
  .scene .nm { font: 700 14px var(--k-font); fill: var(--k-accent); }
  .scene .tot { font: 700 15px var(--k-font); fill: var(--k-ink); }
  .scene .onb { font: 700 14px var(--k-font); fill: var(--k-on-accent2); }
  .scene .offb { font: 700 14px var(--k-font); fill: var(--k-ink); }
  .scene .tag { fill: var(--k-accent2); }
  .scene .tagt { font: 700 15px var(--k-font); fill: var(--k-on-accent2); }

  .scene .qm { font: 700 15px var(--k-font); fill: var(--k-muted); }
  .scene .wk { font: 700 19px var(--k-font); fill: var(--k-ink); }
  .scene .hl { fill: var(--k-hl); }
  .scene .thumb { fill: var(--k-bg); stroke: var(--k-accent2); stroke-width: 3; }
  .scene #art * { pointer-events: none; }
  /* The end or the cut Dan drags: a thumb's-width hit circle over the drawn handle. */
  .scene .grip { fill: var(--k-bg); fill-opacity: 0; stroke: none; cursor: grab; touch-action: none; }
  .scene .grip:active { cursor: grabbing; }
  .scene .grip:focus { outline: none; }

  .row { display: flex; flex-wrap: wrap; gap: 10px; }

  .replay { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 10px; }
  .replay .k-btn { flex: 0 0 auto; min-height: 44px; padding-left: 16px; padding-right: 16px; font-size: .95rem; white-space: nowrap; }
  /* The answers stay on one row, each label whole, at every text size; longer ones (sums) stack one to a row. */
  .row.picks { flex-wrap: nowrap; }

<p class="caption">Add the parts, find one block, then each share. The amounts are example values.</p>

<script>
  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // dur: how long a demonstration plays; fb: how long the motion after a right answer plays (seconds).
  // ratio: the two parts, in the order the words name them, and names: the two shares, in that order.
  // total: the whole, when it is known; otherwise have: the amount of the share `known` (0 the first, 1
  // the second). unit: '£' (before the number), 'L' or 'm'. ask: what a puzzle wants, 'share' (the
  // share `who`), 'sum' (the sum that gives the share `who`), 'cut' (where the cut goes, dragged), 'total'
  // (the whole) or 'other' (the other share). slips: which mistake gives each wrong answer (SLIP below).
  // at: when each part of the motion after a right answer arrives, in seconds after Check.
  const PICK = 'Tap one of the answers.';
  const MIX = ['squash', 'water'], PAY = ['Jo', 'Sam'];
  // After a right answer, with the whole known: the bar is cut into equal blocks; it takes its two shares
  // (the key gives way to the names beneath them); each block's worth is written in it; the working; the shares.
  const SHARE2 = { cuts: 0.1, kinds: 0.55, vals: 1.0, work: 1.45, tags: 1.9, work2: 1.9 };
  const SHARE1 = { cuts: 0.1, kinds: 0.55, vals: 1.0, tags: 1.45, work: 1.9 };
  // With one share known: the bar is cut into blocks; that share's blocks get their worth; the working;
  // the other share's blocks, its amount and the whole; the second row of working.
  const BACK2 = { cuts: 0.1, vals: 0.55, work: 1.0, rest: 1.45, work2: 1.9 };
  const STEPS = [
    { show: true, demo: 'share', dur: 3.6, total: 40, unit: 'L', ratio: [3, 2], names: MIX, name: 'Cut into blocks',
      text: 'To *share* 40 litres in 3 : 2, cut a bar into 3 + 2 = 5 equal blocks. One block is 40 ÷ 5 = 8 litres. Squash gets 3 blocks and water 2.' },
    { kind: 'pick', ask: 'share', who: 0, total: 300, unit: '£', ratio: [3, 2], names: PAY, name: 'Share the pay',
      opts: ['£180', '£100', '£120'], want: '£180', slips: { '£100': 'onePart', '£120': 'other' }, fb: 2.5, at: SHARE2,
      task: 'Jo and Sam share £300 in the ratio 3 : 2. How much does Jo get?',
      why: '3 + 2 = 5 blocks, so one block is 300 ÷ 5 = £60. Jo gets 3 blocks, 3 × 60 = £180, and Sam gets £120. £180 + £120 = £300 checks it.',
      hint: 'Not quite. Count all the blocks first.',
      hints: { '£100': 'Not quite. That divides by Jo\'s 3 alone. The bar has 3 + 2 = 5 blocks.',
        '£120': 'Not quite. That is Sam\'s 2 blocks. Jo is named first, so Jo gets the 3.' } },
    { show: true, demo: 'whole', dur: 4.4, total: 35, unit: 'L', ratio: [1, 4], wrongN: 4, names: MIX, name: 'Count every block',
      text: '1 : 4 is 1 block of squash to 4 of water, 5 blocks in all. Four blocks would make it 1 : 3. So 35 litres is 7 of squash and 28 of water.' },
    { kind: 'pick', ask: 'share', who: 0, total: 24, unit: 'L', ratio: [1, 3], names: MIX, name: 'How much squash?',
      opts: ['6 L', '8 L', '18 L'], want: '6 L', slips: { '8 L': 'asWhole', '18 L': 'other' }, fb: 2.5, at: SHARE2,
      task: 'A 24-litre mix is 1 : 3, squash to water. How much squash is in it?',
      why: '1 + 3 = 4 blocks, so one block is 24 ÷ 4 = 6 litres. The squash is 1 block, 6 litres, and the water 3 blocks, 18 litres.',
      hint: 'Not quite. Count both parts of 1 : 3.',
      hints: { '8 L': 'Not quite. That cuts the bar into 3 blocks. 1 : 3 is 1 block of squash and 3 of water, 4 in all.',
        '18 L': 'Not quite. That is the water\'s 3 blocks. The squash is the 1.' } },
    { show: true, demo: 'stretch', dur: 3.4, total: 40, to: 80, max: 80, unit: 'L', ratio: [3, 2], names: MIX, by: 10, drag: true, range: [40, 80], snap: 5, name: 'A bigger whole',
      text: 'Make it 80 litres and there are still 5 blocks, each 80 ÷ 5 = 16 litres. Both shares double, to 48 and 32. Drag the end to try others.' },
    { kind: 'drag', ask: 'cut', total: 30, unit: 'm', ratio: [2, 1], names: ['kitchen', 'garage'], start: 6, target: 20, range: [1, 29], snap: 1, name: 'Cut the cable',
      want: '20 m', fb: 1.6, at: { cuts: 0.1, vals: 0.55, work: 1.0 },
      task: 'A 30 m drum of cable is cut 2 : 1, kitchen to garage. Drag the cut to where it goes, then Check.',
      why: '2 + 1 = 3 blocks, so one block is 30 ÷ 3 = 10 m. The kitchen gets 2 blocks, 20 m, and the garage 1 block, 10 m.',
      // a cut not on 20 m: at a slip's place its own hint, anywhere else which way to drag
      markHint: { 15: 'Not quite. That cuts it in half. 2 : 1 gives the kitchen 2 blocks for every 1 of the garage\'s.',
        10: 'Not quite. That gives the kitchen the short piece. The kitchen is named first, so it gets the 2.',
        left: 'Not quite. The kitchen\'s piece is too long. It should be twice the garage\'s, so drag the cut left.',
        right: 'Not quite. The kitchen\'s piece is too short. It should be twice the garage\'s, so drag the cut right.' },
      empty: 'Drag the cut along the bar first, then Check.' },
    { show: true, demo: 'back', dur: 3.6, known: 0, have: 12, unit: 'L', ratio: [3, 2], names: MIX, name: 'Back from a share',
      text: 'Work back from a share. 12 litres of squash in a 3 : 2 mix, squash to water, is 3 blocks of 4 litres. The whole is 5 × 4 = 20 litres.' },
    { kind: 'pick', ask: 'total', known: 0, have: 10, unit: 'L', ratio: [2, 5], names: MIX, name: 'The whole mix',
      opts: ['35 L', '25 L', '70 L'], want: '35 L', slips: { '25 L': 'otherOf', '70 L': 'asBlock' }, fb: 2.5, at: BACK2,
      task: 'A mix is 2 : 5, squash to water. It has 10 litres of squash. How much mix is there in all?',
      why: 'The squash is 2 blocks, so one block is 10 ÷ 2 = 5 litres. The whole is 2 + 5 = 7 blocks, 7 × 5 = 35 litres, and 25 of it is water.',
      hint: 'Not quite. Find one block from the squash first.',
      hints: { '25 L': 'Not quite. That is the water alone. The whole mix is all 7 blocks.',
        '70 L': 'Not quite. That takes 10 litres as one block. The squash is 2 blocks.' } },
    { kind: 'pick', ask: 'other', known: 0, have: 120, unit: '£', ratio: [4, 3], names: PAY, name: 'The other share',
      opts: ['£90', '£119', '£160'], want: '£90', slips: { '£119': 'gap', '£160': 'flip' }, fb: 2.5, at: BACK2,
      task: 'Jo and Sam share some pay 4 : 3. Jo gets £120. How much does Sam get?',
      why: 'Jo\'s £120 is 4 blocks, so one block is 120 ÷ 4 = £30. Sam gets 3 blocks, 3 × 30 = £90. Sam has one block less than Jo, not £1 less.',
      hint: 'Not quite. Find one block from Jo\'s share first.',
      hints: { '£119': 'Not quite. That keeps a gap of £1, as if adding. Sam has one block less, so find one block first.',
        '£160': 'Not quite. That gives Sam the 4. Jo is named first, so Jo\'s £120 is the 4 blocks.' } },
    { kind: 'pick', ask: 'sum', who: 1, total: 56, unit: 'L', ratio: [3, 4], names: MIX, name: 'Which sum?',
      opts: ['56 ÷ 7 × 4', '56 ÷ 4', '56 ÷ 7 × 3'], want: '56 ÷ 7 × 4', slips: { '56 ÷ 4': 'onePart', '56 ÷ 7 × 3': 'other' }, fb: 2.5, at: SHARE1,
      task: '56 litres is shared 3 : 4, squash to water. Which sum gives the water?',
      why: '3 + 4 = 7 blocks, so one block is 56 ÷ 7 = 8 litres. The water is 4 blocks, 4 × 8 = 32 litres, and the squash 24.',
      hint: 'Not quite. Count the blocks, then take the water\'s.',
      hints: { '56 ÷ 4': 'Not quite. That cuts the bar into 4 blocks. 3 : 4 has 3 + 4 = 7.',
        '56 ÷ 7 × 3': 'Not quite. That is the squash\'s 3 blocks. The water is the 4.' } },
    { kind: 'pick', ask: 'share', who: 1, total: 1.2, unit: 'm', ratio: [1, 2], names: ['cupboard', 'hall'], name: 'A length of trunking',
      opts: ['0.8 m', '0.6 m', '0.4 m'], want: '0.8 m', slips: { '0.6 m': 'half', '0.4 m': 'other' }, fb: 2.5, at: SHARE2,
      task: 'A 1.2 m length of trunking is cut 1 : 2, cupboard to hall. How long is the hall\'s piece?',
      why: '1 + 2 = 3 blocks, so one block is 1.2 ÷ 3 = 0.4 m. The hall gets 2 blocks, 0.8 m, and the cupboard 0.4 m. 0.8 + 0.4 = 1.2 checks it.',
      hint: 'Not quite. Count the blocks in 1 : 2 first.',
      hints: { '0.6 m': 'Not quite. That cuts it in half. 1 : 2 is 1 + 2 = 3 blocks, and the hall gets 2.',
        '0.4 m': 'Not quite. That is the cupboard\'s 1 block. The hall is named second, so it gets the 2.' } },
    { kind: 'pick', ask: 'total', known: 1, have: 6, unit: 'L', ratio: [5, 3], names: MIX, name: 'Put it together',
      opts: ['16 L', '10 L', '48 L'], want: '16 L', slips: { '10 L': 'otherOf', '48 L': 'asBlock' }, fb: 2.5, at: BACK2,
      task: 'Put it together. A mix is 5 : 3, squash to water, with 6 litres of water. How much mix is there in all?',
      why: 'The water is 3 blocks, so one block is 6 ÷ 3 = 2 litres. The whole is 5 + 3 = 8 blocks, 8 × 2 = 16 litres, and 10 of it is squash.',
      hint: 'Not quite. Find one block from the water first.',
      hints: { '10 L': 'Not quite. That is the squash alone. The whole mix is all 8 blocks.',
        '48 L': 'Not quite. That takes 6 litres as one block. The water is 3 blocks.' } },
  ];
  const FINISH = 'To share in a ratio, add the parts to count the blocks, so 1 : 4 is 5 blocks, not 4. Find one block\'s worth, then build each share from it. From one share, divide by its own part to find one block.';
  // When each demonstration's parts arrive, in seconds after the screen opens (the screen itself takes
  // FADE to fade in, so nothing starts before it has settled). cuts: the bar cut into blocks; kinds: the
  // two shares on the bar (the key giving way to their names); vals: each block's worth; work: the
  // working; tags: each share's amount; wrong: four blocks cut, in the warning colour; go: the bar's
  // cuts or its end travelling [start, how long]; rest: the other share and the whole; grip: the handle.
  const FADE = 0.35;
  const AT = {
    share: { cuts: 0.6, kinds: 1.2, vals: 1.8, work: 2.4, tags: 3.0 },
    whole: { wrong: 0.6, go: [1.9, 0.8], vals: 2.8, tags: 3.3, work: 3.8 },
    stretch: { go: [0.6, 1.6], grip: 2.8 },
    back: { cuts: 0.6, vals: 1.2, work: 1.8, rest: 2.4, work2: 3.0 },
  };
  // Drawing sizes, in viewBox units (340 wide). The bar runs from BX0, BW long (at the step's `max`, or
  // its whole), from BY down BH. The whole's bracket is at TBY with its amount at TOTY; each share's
  // bracket at LBY, its name at NMY and its amount's tag from TAGY. The working sits at the foot, one row
  // (H1 tall) or two (H2).
  const BX0 = 22, BW = 296, TOTY = 20, TBY = 30, BY = 40, BH = 40, VALY = 65, LBY = 90, NMY = 110, TAGY = 118, ROW = 30, H1 = 184, H2 = 214;
  let H = H1;
  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  // While the kit's self-test looks at every screen it switches fades off (the k-testing class):
  // demonstrations then open finished, as they do with reduced motion.
  const testing = () => document.documentElement.classList.contains('k-testing');

  // ---------- numbers (pure, so the checks can test them) ----------
  const r3 = (v) => Math.round(v * 1000) / 1000;
  const same = (a, b) => K.near(a, b, 1e-9);
  // A number as Dan reads it: at most three decimal places, thousands with a comma.
  const num = (v) => { const p = String(r3(v)).split('.'); return p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (p[1] ? '.' + p[1] : ''); };
  const amt = (v, u) => (u === '£' ? '£' + num(v) : num(v) + ' ' + u);
  const rat = (a, b) => a + ' : ' + b;
  // The number of blocks: the parts added. The whole: given, or the known share's blocks worked back.
  const parts = (d) => d.ratio[0] + d.ratio[1];
  const wholeOf = (d) => (d.total != null ? d.total : r3(d.have / d.ratio[d.known] * parts(d)));
  const blockOf = (d) => r3(wholeOf(d) / parts(d));
  const shareOf = (d, k) => r3(blockOf(d) * d.ratio[k]);
  // The answer a puzzle wants, by the rule: a share, where the cut goes (the first share), the whole, or
  // the other share.
  function answerOf(d) {
    if (d.ask === 'total') return wholeOf(d);
    if (d.ask === 'other') return shareOf(d, 1 - d.known);
    return shareOf(d, d.ask === 'cut' ? 0 : d.who);
  }
  // What each slip makes of the answer: the whole divided by the share's own part alone; the other part
  // taken as the number of blocks in all (1 : 3 as 3 blocks); the other share; the whole halved; with a
  // share known, the other share given for the whole, the known share taken as one block, the gap
  // between the parts kept (as if adding), or the ratio read backwards.
  const SLIP = {
    onePart: (d) => r3(d.total / d.ratio[d.who]),
    asWhole: (d) => r3(d.total / d.ratio[1 - d.who] * d.ratio[d.who]),
    other: (d) => shareOf(d, 1 - d.who),
    half: (d) => r3(d.total / 2),
    otherOf: (d) => shareOf(d, 1 - d.known),
    asBlock: (d) => r3(d.have * parts(d)),
    gap: (d) => r3(d.have - (d.ratio[d.known] - d.ratio[1 - d.known])),
    flip: (d) => r3(d.have / d.ratio[1 - d.known] * d.ratio[d.known]),
  };
  // An option's worth: "£180" is 180, "0.8 m" is 0.8, "56 ÷ 7 × 4" is 32 (worked left to right).
  function valueOf(s) {
    const t = String(s).replace(/,/g, '').split(' ');
    if (t.length >= 3 && t.length % 2 === 1 && t.every((x, k) => (k % 2 ? /^[×÷]$/.test(x) : /^\d+(?:\.\d+)?$/.test(x)))) {
      let v = +t[0];
      for (let k = 1; k < t.length; k += 2) v = t[k] === '×' ? v * +t[k + 1] : v / +t[k + 1];
      return r3(v);
    }
    const n = /^£?(\d+(?:\.\d+)?)(?: (?:L|m))?$/.exec(String(s).replace(/,/g, ''));
    return n ? +n[1] : NaN;
  }
  const unitOf = (s) => (/^£/.test(s) ? '£' : (/ (L|m)$/.exec(s) || [])[1] || '');
  // As a screen reader says it.
  const say = (s) => String(s).replace(/£(\d[\d,.]*)/g, '$1 pounds').replace(/(\d) L\b/g, '$1 litres').replace(/(\d) m\b/g, '$1 metres')
    .replace(/(\d) : (\d)/g, '$1 to $2').replace(/×/g, ' times ').replace(/÷/g, ' divided by ').replace(/=/g, ' equals ').replace(/\+/g, ' plus ')
    .replace(/−/g, ' minus ').replace(/ /g, ' ').replace(/\s+/g, ' ').trim();
  const slipOf = (d, o) => SLIP[d.slips[o]](d);

  function blank(i) {
    return { pick: null, res: null, why: false, mark: STEPS[i].kind === 'drag' ? STEPS[i].start : null, moved: false };
  }
  // Nothing to check yet: says what to do first ('' when there is something to check).
  function emptyFor(i, st) {
    const d = STEPS[i];
    if (d.kind === 'drag') return st.moved ? '' : d.empty;
    return st.pick != null ? '' : PICK;
  }
  const isEmpty = (i, st) => !!emptyFor(i, st);
  const isRight = (i, st) => !isEmpty(i, st) && (STEPS[i].kind === 'drag' ? st.mark === STEPS[i].target : st.pick === STEPS[i].want);
  // A wrong answer's hint names its slip; on the drag puzzle a cut at a slip's place names that slip,
  // and anywhere else the hint says which way to drag.
  function hintFor(i, st) {
    const d = STEPS[i];
    if (d.kind === 'drag') return d.markHint[st.mark] || d.markHint[st.mark > d.target ? 'left' : 'right'];
    return (d.hints && d.hints[st.pick]) || d.hint;
  }
  // A step answered right (the timing check draws each one this way).
  function solved(i) {
    const d = STEPS[i], st = blank(i);
    if (d.kind === 'drag') { st.mark = d.target; st.moved = true; }
    st.pick = d.want; st.res = 'right';
    return st;
  }

  let S = STEPS.map((d, i) => blank(i));
  let finished = false, lastStep = -1, lastDone = false, T = Infinity;   // T: seconds into the current motion
  let motion = null, motionEnd = 0;                                      // what is moving: 'demo' or 'fb'

  // ---------- text with amber key terms (built with K.el, never innerHTML) ----------
  function pieces(el, text) {
    const re = /\*([^*]+)\*/g;
    let at = 0, m;
    while ((m = re.exec(text))) {
      if (m.index > at) el.appendChild(document.createTextNode(text.slice(at, m.index)));
      el.appendChild(K.el('span', { class: 'term' }, m[1]));
      at = m.index + m[0].length;
    }
    if (at < text.length) el.appendChild(document.createTextNode(text.slice(at)));
  }
  // A ratio, a sum or an amount stays together on one line ("3 : 2", "3 + 2 = 5", "£300", "1.2 m"), with
  // the stop after it; a long one may break only before an equals sign.
  const TOK = '[−+]?£?(?:\\d{1,3}(?:,\\d{3})+|\\d+)(?:\\.\\d+)?(?: (?:L|m)(?![A-Za-z]))?';
  const GLUE = new RegExp('(?:[×÷+] )?' + TOK + '(?: [+−=×÷:] ' + TOK + ')*[.,?!;]?', 'g');
  function write(el, text) {
    el.textContent = '';
    let at = 0, m;
    GLUE.lastIndex = 0;
    while ((m = GLUE.exec(text))) {
      if (m.index > at) pieces(el, text.slice(at, m.index));
      const bits = m[0].length > 18 ? m[0].split(/ (?==)/) : [m[0]];
      bits.forEach((b, k) => {

    const sh = [amt(shown * d.ratio[0] / n, u), amt(shown * d.ratio[1] / n, u)], tc = tagCentres(sc, w, split, [[sh[0]], [sh[1]]]);
    totalTop(sc, w, amt(shown, u), 1, 1);
    kinds(sc, w, split);
    cutLines(sc, w, n, split);
    values(sc, w, n, split, num(b), 0, n);
    names(sc, w, split, d.names, 1);
    [0, 1].forEach((k) => tagAt(tc[k], sh[k]));
    working(rows, [1]);
    handle(sc.x(w), gA);
    placeGrip(gA >= 0.5 ? sc : null, w, d, 'The end of the bar', amt(w, u) + ' in all');
    const moving = !mine && go > 0 && go < 1;
    return 'A bar model. Above the bar, a bracket marks the whole, ' + say(amt(shown, u)) + (moving ? ', the bar stretching.' : '.') + ' The bar is shared between ' + sharesSaid(d) +
      ', cut into ' + n + ' equal blocks of ' + say(amt(b, u)) + ' each. Beneath, ' + d.names[0] + ' is ' + say(sh[0]) + ' and ' + d.names[1] + ' ' + say(sh[1]) + '.' + workSaid(rows, [1]) +
      (gA >= 0.5 ? ' The end of the bar can be dragged.' : '');
  }

  // --- the cable puzzle ---
  // The drum as a bar, the cut where Dan has put it (each piece's length beneath it); after a right
  // answer, the bar cut into 3 blocks of 10 m, their worth, the working; the handle leaves.
  function drawCut(d, st, right) {
    const F = d.at, ar = (t, dur) => (right && t != null ? arr(t, dur) : 0), sc = scaleOf(d), w = d.total, n = parts(d), u = d.unit, rows = rowsOf(d);
    const mark = right ? d.target : st.mark, b = blockOf(d), cA = ar(F.cuts), vA = ar(F.vals), wA = ar(F.work);
    const sh = [amt(mark, u), amt(w - mark, u)], tc = tagCentres(sc, w, mark, [[sh[0]], [sh[1]]]);
    totalTop(sc, w, amt(w, u), 1, 1);
    kinds(sc, w, mark);
    part(cA, 0, () => cutLines(sc, w, n, mark));
    part(vA, 4, () => values(sc, w, n, mark, num(b), 0, n));
    names(sc, w, mark, d.names, 1);
    [0, 1].forEach((k) => tagAt(tc[k], sh[k]));
    working(rows, [wA]);
    leave(right ? arr(0, 0.3) : 0, () => handle(sc.x(mark), 1));
    placeGrip(right ? null : sc, mark, d, 'The cut in the cable', amt(mark, u) + ' for the ' + d.names[0] + ', ' + amt(w - mark, u) + ' for the ' + d.names[1]);
    return 'A bar for the drum, ' + say(amt(w, u)) + ', cut in two: ' + d.names[0] + ' ' + say(sh[0]) + ', then ' + d.names[1] + ' ' + say(sh[1]) + '.' +
      (cA >= 0.5 ? ' It is cut into ' + n + ' equal blocks of ' + say(amt(b, u)) + '.' : right ? '' : ' The cut can be dragged.') + workSaid(rows, [wA]);
  }

  // The handle Dan drags is one grip kept across repaints (the picture is redrawn every frame), so a drag
  // in progress and the keyboard focus both survive. It is a thumb's width across (about 52 px on a
  // 360 px phone).
  const grip = ui.appendChild(K.svg('circle', { class: 'grip', cx: 0, cy: BY + BH / 2, r: 27, tabindex: -1, role: 'slider', 'aria-label': 'The handle on the bar',
    'aria-orientation': 'horizontal' }));
  grip.style.display = 'none';
  let gripSc = null;
  function placeGrip(sc, v, d, label, valueText) {
    gripSc = sc;
    if (!sc) { grip.style.display = 'none'; grip.setAttribute('tabindex', '-1'); return; }
    grip.style.display = '';
    grip.setAttribute('tabindex', '0');
    grip.setAttribute('cx', sc.x(v).toFixed(2));
    grip.setAttribute('aria-label', label);
    grip.setAttribute('aria-valuemin', d.range[0]); grip.setAttribute('aria-valuemax', d.range[1]); grip.setAttribute('aria-valuenow', v);
    grip.setAttribute('aria-valuetext', say(valueText));
  }
  const dragging = () => { const i = at(), d = STEPS[i]; return !finished && !!gripSc && ((d.kind === 'drag' && S[i].res !== 'right') || !!d.drag); };
  function setMark(v) {
    const i = at(), d = STEPS[i], st = S[i];
    if (v === st.mark) return;
    if (d.show) { anim.pause(); T = Infinity; motion = null; }
    st.mark = v; st.moved = true; st.res = null;
    K.reveal(); K.refresh();
  }
  // Where a pointer at x puts the handle: the nearest snap step inside the step's range.
  const snapOf = (d, x) => K.clamp(Math.round((x - BX0) / BW * scaleOf(d).max / d.snap) * d.snap, d.range[0], d.range[1]);
  let held = null;
  grip.addEventListener('pointerdown', (e) => {
    if (!dragging()) return;
    held = e.pointerId;
    try { grip.setPointerCapture(e.pointerId); } catch (err) { /* the drag still follows the pointer while it stays on the grip */ }
    e.preventDefault();
  });
  grip.addEventListener('pointermove', (e) => {
    if (held !== e.pointerId || !dragging()) return;
    const ctm = svg.getScreenCTM();
    if (!ctm) return;
    const q = new DOMPoint(e.clientX, e.clientY).matrixTransform(ctm.inverse());
    setMark(snapOf(STEPS[at()], q.x));
  });
  const letGo = (e) => { if (held === e.pointerId) held = null; };
  grip.addEventListener('pointerup', letGo);
  grip.addEventListener('pointercancel', letGo);
  grip.addEventListener('lostpointercapture', () => { held = null; });
  grip.addEventListener('keydown', (e) => {
    if (!dragging()) return;
    const d = STEPS[at()], s = d.snap, by = { ArrowUp: s, ArrowRight: s, ArrowDown: -s, ArrowLeft: -s, PageUp: 2 * s, PageDown: -2 * s }[e.key];
    if (by == null && e.key !== 'Home' && e.key !== 'End') return;
    e.preventDefault();
    const st = S[at()], now = st.mark == null ? d.to : st.mark;
    setMark(e.key === 'Home' ? d.range[0] : e.key === 'End' ? d.range[1] : K.clamp(Math.round((now + by) / s) * s, d.range[0], d.range[1]));
  });

  // The scene for a step (the animation calls this every frame).
  function paint(i) {
    if (i == null) i = at();
    const d = STEPS[i], st = S[i], right = st.res === 'right';
    art.textContent = '';
    into = null;
    H = heightOf(d);
    svg.setAttribute('viewBox', '0 0 340 ' + H);
    if (!(d.drag || d.kind === 'drag')) placeGrip(null);
    const live = (t, dur) => arr(t, dur), after = (t, dur) => (right && t != null ? arr(t, dur) : 0);
    let aria;
    if (d.show) aria = d.demo === 'share' ? drawShare(d, AT.share, live) : d.demo === 'whole' ? demoWhole(d) : d.demo === 'stretch' ? demoStretch(d, st) : drawBack(d, AT.back, live);
    else if (d.kind === 'drag') aria = drawCut(d, st, right);
    else aria = d.have != null ? drawBack(d, d.at, after) : drawShare(d, d.at, after);
    svg.setAttribute('aria-label', aria);
  }

  const el = (id) => document.getElementById(id);
  write(el('finish'), FINISH);
  K.update((p) => {
    const i = Math.round(p.step), d = STEPS[i], st = S[i];
    if (!anim.playing()) T = Infinity;   // motion that was stopped (the page hidden, a test) shows finished
    if (i !== lastStep) { lastStep = i; enter('stepbox'); if (d.show) { st.mark = null; play(d.dur, 'demo'); } else { anim.pause(); T = Infinity; motion = null; } }
    if (finished !== lastDone) { lastDone = finished; enter(finished ? 'done' : 'stepbox'); }
    const right = st.res === 'right';
    el('stepbox').hidden = finished;
    el('done').hidden = !finished;
    el('count').textContent = 'Step ' + (i + 1) + ' of ' + STEPS.length;
    const task = el('task');
    task.className = 'task' + (d.show ? ' show' : '');
    write(task, d.show ? d.text : d.task);
    paint(i);

    el('replay').hidden = !d.show || REDUCE;
    const opts = d.show ? [] : d.opts || [];
    el('picks').hidden = !opts.length;
    el('picks').classList.toggle('long', opts.some((o) => o.length > 6));
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      write(b.el, opts[k]);
      b.el.setAttribute('aria-label', say(opts[k]));
      b.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });

    el('acts').hidden = !!d.show;
    checkBtn.el.hidden = right;
    const fb = el('fb');
    fb.hidden = !!d.show;
    fb.className = 'fb' + (right ? ' right' : st.res === 'wrong' ? ' wrong' : '');
    write(fb, d.show ? '' : right ? 'That\'s it.' : st.res === 'wrong' ? hintFor(i, st) : st.res === 'empty' ? emptyFor(i, st) || PICK : '');

    const why = el('why');
    why.hidden = d.show || !st.why;
    write(why, d.show ? '' : d.why);
    whyBtn.setLabel(st.why ? 'Hide why' : 'Why?');

    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !right);
    nextBtn.setLabel(i === STEPS.length - 1 ? 'Finish' : 'Continue');
    nav.hidden = backBtn.el.hidden && nextBtn.el.hidden;
  });

  // ---------- known answers, worked out by hand ----------
  const DO = STEPS.map((d, i) => i).filter((i) => !STEPS[i].show);
  const CUT_I = STEPS.findIndex((d) => d.kind === 'drag'), ST_I = STEPS.findIndex((d) => d.demo === 'stretch');
  const pickRight = (i, v) => isRight(i, Object.assign(solved(i), { pick: v, res: null }));
  // A step painted finished in the state given: what its picture draws.
  function drawn(i, st) {
    const keepS = S[i], keepT = T;
    S[i] = st; T = Infinity;
    try {
      paint(i);
      const all = (sel) => Array.from(art.querySelectorAll(sel));
      const w = (sel) => all(sel).reduce((s, r) => s + Number(r.getAttribute('width')), 0);
      return { ink: w('rect.b1:not(.sw)'), tint: w('rect.b2:not(.sw)'), cuts: all('line.cutn, line.cutt').map((l) => Number(l.getAttribute('x1'))).sort((a, b) => a - b),
        vals: all('text.onb, text.offb').map((t) => t.textContent), tags: all('text.tagt').map((t) => t.textContent), tot: all('text.tot').map((t) => t.textContent),
        texts: all('text').map((t) => t.textContent.replace(/ /g, ' ')), key: all('rect.sw').length };
    } finally { S[i] = keepS; T = keepT; paint(); }
  }
  K.check('Find the total number of parts by adding the parts in each share, so 3 : 2 has 3 + 2 = 5 parts and 1 : 4 has 1 + 4 = 5, not 4', () =>
    parts(STEPS[0]) === 5 && parts(STEPS[2]) === 5 && STEPS[2].ratio.join() === '1,4', { source: 'https://www.bbc.co.uk/bitesize/articles/zwxt2v4' });
  K.check('To share in 2 : 3, divide the whole into five parts, then take two parts for one person and three parts for the other', () => {
    const d = { total: 300, ratio: [2, 3] };
    return parts(d) === 5 && blockOf(d) === 60 && shareOf(d, 0) === 2 * 60 && shareOf(d, 1) === 3 * 60 && shareOf(d, 0) + shareOf(d, 1) === 300;
  }, { source: 'https://www.ncetm.org.uk/media/mqfp3xb3/ncetm_ks3_cc_3_1.pdf' });
  K.check('Each share is its part × (the whole ÷ the parts added), and the two shares add back to the whole on every screen: 24 + 16 = 40, 180 + 120 = 300, 7 + 28 = 35, 6 + 18 = 24, 48 + 32 = 80, 20 + 10 = 30, 12 + 8 = 20, 10 + 25 = 35, 120 + 90 = 210, 24 + 32 = 56, 0.4 + 0.8 = 1.2 and 10 + 6 = 16', () => {
    const rows = STEPS.map((d) => { const e = d.demo === 'stretch' ? Object.assign({}, d, { total: d.to }) : d; return [shareOf(e, 0), shareOf(e, 1), wholeOf(e)]; });
    return rows.every((r) => same(r[0] + r[1], r[2])) && rows.map((r) => r.join('+')).join(' ') === '24+16+40 180+120+300 7+28+35 6+18+24 48+32+80 20+10+30 12+8+20 10+25+35 120+90+210 24+32+56 0.4+0.8+1.2 10+6+16';
  });
  K.check('Working back from one share divides it by its own part to find one block: 12 L of squash in 3 : 2 is 3 blocks of 4 L, 20 L in all; 10 L of squash in 2 : 5 is blocks of 5 L, 35 L in all; Jo\'s £120 in 4 : 3 is blocks of £30, so Sam gets £90; 6 L of water in 5 : 3 is blocks of 2 L, 16 L in all', () => {
    const back = STEPS.filter((d) => d.have != null);
    return back.map((d) => blockOf(d) + '/' + (d.ask ? answerOf(d) : wholeOf(d))).join() === '4/20,5/35,30/90,2/16' && back.every((d) => same(blockOf(d) * d.ratio[d.known], d.have)) &&
      wholeOf(back[0]) === 20 && shareOf(back[0], 1) === 8;
  });
  K.check('Each puzzle accepts only its own answer, worked out by its rule, and every wrong answer offered is the one a named slip gives: the whole divided by one part, the other part taken as the number of blocks, the other share, the whole halved, the other share for the whole, a share taken as one block, a gap of 1 kept as if adding, or the ratio read backwards', () =>
    DO.filter((i) => STEPS[i].opts).every((i) => {
      const d = STEPS[i], want = answerOf(d);
      const unitsOk = d.ask === 'sum' || d.opts.every((o) => unitOf(o) === d.unit);
      return d.opts.length === 3 && unitsOk && same(valueOf(d.want), want) && d.opts.every((o) => pickRight(i, o) === (o === d.want)) && Object.keys(d.slips).length === 2 &&
        Object.keys(d.slips).every((o) => d.opts.indexOf(o) >= 0 && o !== d.want && K.near(valueOf(o), slipOf(d, o), 1e-6) && !K.near(valueOf(o), want, 0.01) && !!d.hints[o]);
    }) && SLIP.onePart(STEPS[1]) === 100 && SLIP.asWhole(STEPS[3]) === 8 && SLIP.gap(STEPS[8]) === 119 && SLIP.flip(STEPS[8]) === 160 && SLIP.half(STEPS[10]) === 0.6 && SLIP.asBlock(STEPS[11]) === 48);
  K.check('The cable puzzle takes only the cut at 20 m, 2 of 3 blocks of 10 m; a cut at 15 m (half) or 10 m (1 : 2) gets that slip\'s hint, anywhere else which way to drag, even back at the 6 m start once the cut has moved; the cut snaps to whole metres from 1 to 29 m', () => {
    const i = CUT_I, d = STEPS[i], st = (m) => Object.assign(blank(i), { mark: m, moved: true });
    let pos = 0;
    for (let m = d.range[0]; m <= d.range[1]; m += d.snap) { pos++; if (isRight(i, st(m)) !== (m === 20)) return false; }
    return pos === 29 && answerOf(d) === 20 && blockOf(d) === 10 && hintFor(i, st(15)) === d.markHint[15] && hintFor(i, st(10)) === d.markHint[10] &&
      hintFor(i, st(25)) === d.markHint.left && hintFor(i, st(12)) === d.markHint.right && emptyFor(i, blank(i)) === d.empty && !isRight(i, blank(i)) &&
      emptyFor(i, st(d.start)) === '' && hintFor(i, st(d.start)) === d.markHint.right &&
      snapOf(d, BX0 + BW * 2 / 3) === 20 && snapOf(d, -50) === 1 && snapOf(d, 900) === 29;
  });
  K.check('Doubling the whole doubles one block and both shares, 80 L in 3 : 2 being 5 blocks of 16 L, 48 L and 32 L; and wherever the end is dragged, from 40 to 80 L, the bar holds 5 equal blocks of the whole ÷ 5, the first 3 in ink', () => {
    const i = ST_I, d = STEPS[i];
    let ok = true, pos = 0;
    for (let v = d.range[0]; v <= d.range[1]; v += d.snap) {
      pos++;
      const g = drawn(i, Object.assign(blank(i), { mark: v })), sc = scaleOf(d), bw = BW * v / d.max / 5;
      ok = ok && g.cuts.length === 3 && g.vals.length === 5 && g.vals.every((s) => s === num(v / 5)) && K.near(g.ink, 3 * bw, 1e-3) && K.near(g.tint, 2 * bw, 1e-3) &&
        g.tags.join() === [amt(v * 3 / 5, 'L'), amt(v * 2 / 5, 'L')].join() && g.cuts.every((x, k) => K.near(x, sc.x(v * [1, 2, 4][k] / 5), 1e-3));
    }
    return ok && pos === 9 && blockOf(Object.assign({}, d, { total: 80 })) === 16 && blockOf(d) === 8;
  });
  K.check('Every picture is drawn to scale, finished: as many equal blocks as the parts add up to, the shares meeting after the first part\'s blocks, each block marked with its worth, and the amounts beneath them the shares the working gives', () =>
    STEPS.every((d, i) => {
      if (d.demo === 'stretch') return true;
      const g = drawn(i, d.show ? blank(i) : solved(i)), sc = scaleOf(d), w = wholeOf(d), n = parts(d), bw = (sc.x(w) - sc.x(0)) / n, u = d.unit;
      const joins = []; for (let k = 1; k < n; k++) if (k !== d.ratio[0]) joins.push(sc.x(w * k / n));
      return K.near(g.ink, d.ratio[0] * bw, 1e-3) && K.near(g.tint, d.ratio[1] * bw, 1e-3) && g.cuts.length === joins.length && g.cuts.every((x, k) => K.near(x, joins[k], 1e-2)) &&
        g.vals.length === n && g.vals.every((s) => s === num(blockOf(d))) && g.tags.slice().sort().join() === [amt(shareOf(d, 0), u), amt(shareOf(d, 1), u)].sort().join() &&
        g.tot.join() === amt(w, u) && rowsOf(d).every((r) => g.texts.indexOf(r.s) >= 0);
    }));
  K.check('Before an answer, nothing in a puzzle\'s picture shows its answer, one block\'s worth or a wrong answer offered: a bar that is to be shared is drawn whole and uncut, with a key, and a whole to be found is a question mark', () =>
    DO.every((i) => {
      const d = STEPS[i], g = drawn(i, blank(i)), ans = amt(answerOf(d), d.unit), b = num(blockOf(d));
      const shown = g.texts.every((t) => t.indexOf(ans) < 0 && t !== num(answerOf(d)) && t !== b && (d.opts || []).every((o) => t.indexOf(o) < 0));
      return shown && g.vals.length === 0 && g.cuts.length === 0 && (d.have != null || d.kind === 'drag' || (g.ink === 0 && g.tint === 0 && g.key === 2)) && (d.have == null || g.tot.length === 0);
    }));
  // Drawn from the lesson's own timetable: each screen is painted finished and every arrival it used is noted.
  K.check('Every demonstration has finished arriving within 3 to 4.5 s of its screen opening, none starting before the 0.35 s screen fade ends; every answer\'s motion within 2.5 s; parts start at least 0.45 s apart, each once the travel before it has ended; a counted travel holds each number at least 0.2 s', () => {
    const keepT = T;
    const ok = STEPS.every((d, i) => {
      const keepS = S[i];
      T = Infinity; latest = 0; earliest = Infinity;
      S[i] = d.show ? blank(i) : solved(i);
      try { paint(i); } finally { S[i] = keepS; }
      return d.show ? latest <= d.dur + 1e-9 && d.dur <= 4.5 && d.dur >= 3 && earliest >= FADE : latest <= d.fb + 1e-9 && d.fb <= 2.5;
    });
    T = keepT; paint();
    // each timetable's parts in order: a start, and when it is done moving (a travel's end)
    const spaced = (A) => {
      const ps = Object.keys(A).map((k) => (Array.isArray(A[k]) ? [A[k][0], A[k][0] + A[k][1]] : [A[k], A[k]])).sort((a, b) => a[0] - b[0]);
      let end = -Infinity;
      return ps.every((q, k) => {
        const ok = k === 0 || q[0] === ps[k - 1][0] || (q[0] - ps[k - 1][0] >= 0.45 - 1e-9 && q[0] >= end + 0.1 - 1e-9);
        end = Math.max(end, q[1]);
        return ok;
      });
    };
    const sd = STEPS[ST_I], holds = holdOf(AT.stretch.go[1], sd.total, sd.to, sd.by) >= 0.2;
    return ok && Object.keys(AT).every((k) => spaced(AT[k])) && DO.every((i) => spaced(STEPS[i].at)) && holds;
  });

  K.ready();
</script>
