<p class="caption">In direct proportion, both amounts take the same × and 0 goes with 0. The amounts are example values.</p>

<script>
  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // dur: how long a demonstration plays; fb: how long the motion after a right answer plays (seconds).
  // pic: the picture, 'table' (a ratio table), 'firms' (three firms' prices by the hour), 'line' (two
  // scales locked together: a 10 : 1 transformer's primary volts above, its secondary's below) or
  // 'blocks' (rows of blocks: a fixed part `c.fee` in a light tint, then one solid block of `c.rate`
  // for each hour, day or 50 m of cable). On a table, names: its two rows, in the ratio's order; units:
  // each row's unit; cols and ops on a SHOW step: its columns and the step between each pair. ratio and
  // given on a DO step: the ratio's column, and the amount known in the second column (null where the
  // answer goes). On the line, k: the turns ratio, 10, so the secondary is the primary ÷ k. rows on
  // the blocks: each row's count of rate blocks (twice: a whole bill doubled; ask: the row to find).
  // ask: what a puzzle wants. slips: which mistake gives each wrong answer (SLIP below). at: when each
  // part of the motion after a right answer arrives, in seconds after Check.
  const PICK = 'Tap one of the answers.';
  const PRI = ['Primary', 'Secondary'];
  // A fixed part plus a rate: fee and rate (in `unit`, '£' before the number); key: each kind's name in
  // the key, before its worth is known and with it; row(n): a row's name for n blocks of the rate.
  const CALL = { fee: 40, rate: 30, unit: '£', key: [['call-out', '£40 call-out'], ['1 hour', '£30 an hour']], row: (n) => n + ' h', said: (n) => n + (n === 1 ? ' hour' : ' hours') };
  const DRUM = { fee: 3, rate: 5, unit: 'kg', key: [['drum', '3 kg drum'], ['50 m of cable', '5 kg per 50 m of cable']], row: (n) => n * 50 + ' m', said: (n) => n * 50 + ' metres of cable' };
  const HIRE = { fee: 25, rate: 30, unit: '£', key: [['fixed fee', '£25 fixed fee'], ['1 day', '£30 a day']], row: (n) => n + (n === 1 ? ' day' : ' days'), said: (n) => n + (n === 1 ? ' day' : ' days') };
  // After a right answer: the step written over and under; the '?' giving way to the amount; the sum
  // worked at the foot; the rise named under the secondary's scale and its reading; the row to find
  // built from its blocks, its total tagged, the working written; on the van hire, the blocks' worth in
  // the key and the 2 extra days' cost first; on the firms, each firm's price at 0 hours and the one in
  // proportion picked out.
  const FILLTAB = { arcs: 0.1, ans: 0.55 };
  const SUMTAB = { arcs: 0.1, ans: 0.55, work: 1.0 };
  const RISE = { ans: 0.1, lab: 0.6 };
  const BLOCKFB = { ans: 0.1, grow: 0.55, tag: 1.0, work: 1.45 };
  const FINDFB = { ans: 0.1, vals: 0.55, work: 0.55, grow: 1.0, tag: 1.45, work2: 1.9 };
  const WHICH = { ans: 0.1, hl: 0.6 };
  const STEPS = [
    { show: true, demo: 'double', pic: 'table', dur: 3.0, names: PRI, units: ['V', 'V'], cols: [[100, 10], [200, 20], [400, 40]], ops: ['× 2', '× 2'], name: 'In step',
      text: 'Two amounts are in *direct proportion* when doubling one doubles the other. A 10 : 1 transformer, primary to secondary, turns 100 V into 10 V, and 200 V into 20 V.' },
    { kind: 'pick', ask: 'fill', pic: 'table', names: PRI, units: ['V', 'V'], ratio: [10, 1], given: [230, null], name: 'The secondary',
      opts: ['23 V', '2,300 V', '221 V'], want: '23 V', slips: { '2,300 V': 'flip', '221 V': 'gap' }, fb: 1.45, at: FILLTAB,
      task: 'A transformer is wound 10 : 1, primary to secondary. Its primary has 230 V. What is on its secondary?',
      why: 'Its voltage ratio is its turns ratio, 10 : 1. 230 is 10 × 23, so both parts are × 23, and the secondary has 1 × 23 = 23 V. Keeping the gap of 9 would give 221 V.',
      hint: 'Not quite. What number takes 10 up to 230?',
      hints: { '2,300 V': 'Not quite. That reads 10 : 1 backwards. The primary is the 10, so the secondary is the smaller.',
        '221 V': 'Not quite. That keeps the gap of 9, as if adding. Multiply both parts by the same number.' } },
    { show: true, demo: 'line', pic: 'line', dur: 4.5, k: 10, from: 100, to: 300, range: [0, 400], snap: 10, drag: true, name: 'Locked together',
      text: 'Drawn as two scales, the voltages stay locked together. 0 V in gives 0 V out, and the secondary stays a tenth of the primary. Drag the mark.' },
    { kind: 'pick', ask: 'rise', pic: 'line', k: 10, from: 200, to: 300, name: 'A rise',
      opts: ['10 V', '100 V', '1,000 V'], want: '10 V', slips: { '100 V': 'same', '1,000 V': 'times' }, fb: 1.25, at: RISE,
      task: 'On the same 10 : 1 transformer, the primary rises from 200 V to 300 V. By how much does the secondary rise?',
      why: 'The secondary goes from 20 V to 30 V, a rise of 10 V. The rise is in proportion too, a tenth of the primary\'s 100 V, not the same 100 V.',
      hint: 'Not quite. Read the secondary at 200 V and at 300 V.',
      hints: { '100 V': 'Not quite. That adds the same 100 V to both. The secondary moves a tenth as much, rise and all.',
        '1,000 V': 'Not quite. That multiplies the rise by 10. On a 10 : 1, the secondary is the smaller voltage.' } },
    { show: true, demo: 'fixed', pic: 'blocks', dur: 3.6, c: CALL, rows: [{ n: 2 }, { n: 4 }, { n: 2, twice: true }], name: 'A fixed charge',
      text: 'A £40 call-out is a *fixed charge*, paid once. With £30 an hour on top, 2 hours cost £100, but 4 hours cost £160, not £200.' },
    { kind: 'pick', ask: 'total', pic: 'blocks', c: CALL, rows: [{ n: 3 }, { n: 6, ask: true }], name: 'A longer job',
      opts: ['£220', '£260', '£180'], want: '£220', slips: { '£260': 'scaled', '£180': 'nofee' }, fb: 2.1, at: BLOCKFB,
      task: 'The same firm charges a £40 call-out plus £30 an hour. A 3-hour job costs £130. What does a 6-hour job cost?',
      why: '6 hours cost £40 + 6 × £30 = £220. The call-out is paid once, so doubling £130 to £260 would pay it twice. Leaving it out gives £180.',
      hint: 'Not quite. Build the 6-hour bill from one call-out and 6 hours.',
      hints: { '£260': 'Not quite. That doubles the whole bill, call-out and all. The call-out is paid only once.',
        '£180': 'Not quite. That is the 6 hours alone. Add the £40 call-out.' } },
    { show: true, demo: 'tests', pic: 'table', dur: 3.0, names: ['Hours', 'Cost'], units: ['h', '£'], cols: [[0, 40], [2, 100], [4, 160]], ops: ['× 2'], bad: '× 1.6', name: 'Two tests',
      text: 'A steady rise is not enough. Doubling one should double the other, and 0 should go with 0. This bill rises £30 an hour but fails both.' },
    { kind: 'pick', ask: 'which', pic: 'firms', firms: [[10, 35], [0, 35], [30, 30]], hours: [0, 1, 2, 3], name: 'Which firm?',
      opts: ['Firm A', 'Firm B', 'Firm C'], want: 'Firm B', slips: { 'Firm A': 'steady', 'Firm C': 'steady' }, fb: 1.25, at: WHICH,
      task: 'Three firms charge by the hour. Which one charges in direct proportion to the hours?',
      why: 'Firm B doubles, £35 to £70, and is £0 at 0 hours. Firms A and C rise steadily too, but £80 is not double £45, nor £90 double £60. Each has a fixed part.',
      hint: 'Not quite. For each firm, see whether 2 hours cost double 1 hour.',
      hints: { 'Firm A': 'Not quite. £80 is not double £45, so Firm A has a fixed part.',
        'Firm C': 'Not quite. £90 is not double £60, so Firm C has a fixed part.' } },
    { show: true, demo: 'strip', pic: 'blocks', dur: 3.6, c: CALL, rows: [{ n: 2 }, { n: 5 }], name: 'Take it off first',
      text: 'The hourly part on its own is in proportion to the hours. Take off the £40, scale the rest, then add it back. 5 hours cost £40 + 5 × £30 = £190.' },
    { kind: 'pick', ask: 'total', pic: 'blocks', c: DRUM, hide: 'rate', rows: [{ n: 1 }, { n: 2, ask: true }], name: 'A cable drum',
      opts: ['13 kg', '16 kg', '10 kg'], want: '13 kg', slips: { '16 kg': 'scaled', '10 kg': 'nofee' }, fb: 2.1, at: BLOCKFB,
      task: 'An empty cable drum weighs 3 kg. With 50 m of cable on it, it weighs 8 kg. What does it weigh with 100 m on it?',
      why: 'The 50 m of cable weighs 8 − 3 = 5 kg, so 100 m weighs 10 kg. The drum counts once, so 3 + 10 = 13 kg. Doubling 8 kg would weigh the drum twice.',
      hint: 'Not quite. Take the drum off, double the cable, then put the drum back.',
      hints: { '16 kg': 'Not quite. That doubles the drum as well as the cable. There is only one drum.',
        '10 kg': 'Not quite. That is the cable alone. Add the 3 kg drum back.' } },
    { kind: 'pick', ask: 'sum', pic: 'table', names: PRI, units: ['V', 'V'], ratio: [10, 1], given: [null, 11.5], name: 'Back to the primary',
      opts: ['11.5 × 10', '11.5 ÷ 10', '11.5 + 9'], want: '11.5 × 10', slips: { '11.5 ÷ 10': 'flip', '11.5 + 9': 'gap' }, fb: 1.65, at: SUMTAB,
      task: 'A 10 : 1 transformer gives 11.5 V on its secondary. Which sum gives the voltage on its primary?',
      why: 'The primary is the 10 in 10 : 1, ten times the secondary. 11.5 × 10 = 115 V, and 115 ÷ 10 = 11.5 checks it. Dividing would make the primary the smaller.',
      hint: 'Not quite. Which is bigger on a 10 : 1, the primary or the secondary?',
      hints: { '11.5 ÷ 10': 'Not quite. That makes the primary smaller. On a 10 : 1, the primary is ten times the secondary.',
        '11.5 + 9': 'Not quite. That keeps the gap of 9, as if adding. Multiply instead.' } },
    { kind: 'pick', ask: 'total', pic: 'blocks', c: HIRE, hide: 'both', rows: [{ n: 2 }, { n: 4 }, { n: 6, ask: true }], name: 'Put it together',
      opts: ['£205', '£255', '£230'], want: '£205', slips: { '£255': 'scaled', '£230': 'added' }, fb: 2.5, at: FINDFB,
      task: 'Put it together. A van hire, a fixed fee plus a daily rate, costs £85 for 2 days and £145 for 4. What do 6 days cost?',
      why: 'The 2 extra days cost £145 − £85 = £60, so a day is £30 and the fee is £85 − £60 = £25. 6 days cost £25 + 6 × £30 = £205. 3 × £85 would pay the fee three times.',
      hint: 'Not quite. Find what the 2 extra days cost first.',
      hints: { '£255': 'Not quite. That is 3 × £85, which pays the fixed fee three times. Find what the 2 extra days cost first.',
        '£230': 'Not quite. That adds the 2-day and 4-day bills, so it pays the fixed fee twice.' } },
  ];
  const FINISH = 'Two amounts are in direct proportion when doubling one doubles the other and 0 goes with 0, like a transformer\'s secondary volts and its primary. A fixed charge plus a rate is not, so take the fixed part off before you scale.';
  // When each demonstration's parts arrive, in seconds after the screen opens (the screen itself takes
  // FADE to fade in, so nothing starts before it has settled). arcs, arcs2: a step written over and
  // under the table; ans, ans2: the next column; bad: the cost's step, not × 2; zero: the column for 0
  // hours; hl: its £40 picked out; arrow: ÷ 10 between the scales; mark: the voltage marked on both;
  // go: the mark travelling [start, how long]; grip: its thumb, to drag; grow: a row's blocks; tag: its
  // total; dbl, tag2: the 2-hour bill doubled, and its total; ring: its second call-out ringed; fee: the
  // call-out put back; off: the 2-hour bill's call-out taken off (back again with fee); work: the working.
  const FADE = 0.35;
  const AT = {
    double: { arcs: 0.6, ans: 1.2, arcs2: 1.8, ans2: 2.4 },
    line: { arrow: 0.6, mark: 1.2, go: [1.8, 1.6], grip: 3.9 },
    fixed: { grow: 0.6, tag: 1.2, dbl: 1.8, tag2: 2.4, ring: 3.0 },
    tests: { arcs: 0.6, bad: 1.2, zero: 1.8, hl: 2.4 },
    strip: { off: 0.6, grow: 1.2, fee: 1.8, tag: 2.4, work: 3.0 },
  };
  // Drawing sizes, in viewBox units (340 wide). Row names at NX. The table's columns are cw apart from
  // tx (both from its names), its rows CH tall from TY. The scales run from LX0 to LX1 (0 to VMAX volts
  // on the primary) at TL and BL. The blocks' key at KEYY; their rows ROW0 down, PITCH apart, BHT tall.
  // The working sits at the foot, a row every WROW.
  const NX = 6, CH = 28, TY = 34, FCH = 26, FTY = 10;
  const LX0 = 96, LX1 = 326, VMAX = 400, TICK = 50, LAB = 100, TL = 52, BL = 122, HLINE = 168;
  const KEYY = 18, ROW0 = 32, PITCH = 42, BHT = 26, WROW = 30;
  let H = 126;
  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  // While the kit's self-test looks at every screen it switches fades off (the k-testing class):
  // demonstrations then open finished, as they do with reduced motion.
  const testing = () => document.documentElement.classList.contains('k-testing');

  // ---------- numbers (pure, so the checks can test them) ----------
  const r3 = (v) => Math.round(v * 1000) / 1000;
  const same = (a, b) => K.near(a, b, 1e-9);
  // A number as Dan reads it: at most three decimal places, thousands with a comma (2,300).
  const num = (v) => { const p = String(r3(v)).split('.'); return p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (p[1] ? '.' + p[1] : ''); };
  const amt = (v, u) => (u === '£' ? '£' + num(v) : num(v) + ' ' + u);
  const volts = (v) => amt(v, 'V');
  // A fixed part and n blocks of the rate; a row's total (a whole bill doubled counts twice).
  const total = (c, n) => c.fee + n * c.rate;
  const rowTotal = (c, row) => (row.twice ? 2 : 1) * total(c, row.n);
  const lastRow = (d) => d.rows[d.rows.length - 1];
  // A table puzzle: the row known (kr) and the row to find (fr); the step from the ratio's column to the
  // second, and that column.
  function tabOf(d) {
    const kr = d.given[0] != null ? 0 : 1, fr = 1 - kr, step = r3(d.given[kr] / d.ratio[kr]);
    return { kr: kr, fr: fr, step: step, out: [r3(d.ratio[0] * step), r3(d.ratio[1] * step)] };
  }
  // A firm's price for h hours: [fixed part, per hour].
  const cost = (f, h) => f[0] + f[1] * h;
  // The answer a puzzle wants, worked out by its rule (a sum is worth what it gives).
  function answerOf(d) {
    if (d.ask === 'fill' || d.ask === 'sum') return tabOf(d).out[tabOf(d).fr];
    if (d.ask === 'rise') return r3((d.to - d.from) / d.k);
    if (d.ask === 'which') return d.firms.findIndex((f) => cost(f, 0) === 0);
    return total(d.c, lastRow(d).n);
  }
  // What each slip makes of the answer: the ratio read backwards; the gap between its parts kept, as if
  // adding; the same rise on both scales; the rise × 10; the whole bill scaled, fixed part and all; the
  // fixed part left out; two bills added, so the fixed part is paid twice; a firm whose price rises steadily but has a fixed part.
  const SLIP = {
    flip: (d) => { const t = tabOf(d); return r3(d.given[t.kr] * d.ratio[t.kr] / d.ratio[t.fr]); },
    gap: (d) => { const t = tabOf(d); return r3(d.given[t.kr] + d.ratio[t.fr] - d.ratio[t.kr]); },
    same: (d) => d.to - d.from,
    times: (d) => (d.to - d.from) * d.k,
    scaled: (d) => r3(total(d.c, d.rows[0].n) * lastRow(d).n / d.rows[0].n),
    nofee: (d) => lastRow(d).n * d.c.rate,
    added: (d) => total(d.c, d.rows[0].n) + total(d.c, d.rows[1].n),
    steady: (d, o) => { const f = d.firms[d.opts.indexOf(o)]; return cost(f, 0) > 0 && cost(f, 2) - cost(f, 1) === cost(f, 3) - cost(f, 2) && cost(f, 2) !== 2 * cost(f, 1); },
  };
  // An option's worth: "23 V" is 23, "2,300 V" 2300, "£220" 220, "13 kg" 13, "11.5 × 10" 115.
  function valueOf(s) {
    const m = /^(\d+(?:\.\d+)?) ([×÷+]) (\d+(?:\.\d+)?)$/.exec(s);
    if (m) return r3(m[2] === '×' ? m[1] * m[3] : m[2] === '÷' ? m[1] / m[3] : +m[1] + +m[3]);
    const n = /^£?(\d{1,3}(?:,\d{3})*(?:\.\d+)?)(?: (?:V|kg))?$/.exec(s);
    return n ? +n[1].replace(/,/g, '') : NaN;
  }
  // As a screen reader says it.
  const say = (s) => String(s).replace(/£(\d[\d,]*(?:\.\d+)?)/g, '$1 pounds').replace(/\b1 V\b/g, '1 volt').replace(/(\d) V\b/g, '$1 volts').replace(/(\d) kg\b/g, '$1 kilograms')
    .replace(/(\d) m\b/g, '$1 metres').replace(/\b1 h\b/g, '1 hour').replace(/(\d) h\b/g, '$1 hours').replace(/(\d) : (\d)/g, '$1 to $2')
    .replace(/×/g, ' times ').replace(/÷/g, ' divided by ').replace(/=/g, ' equals ').replace(/\+/g, ' plus ').replace(/−/g, ' minus ').replace(/\s+/g, ' ').trim();

  function blank(i) { return { pick: null, res: null, why: false, mark: null }; }
  const emptyFor = (i, st) => (st.pick != null ? '' : PICK);
  const isEmpty = (i, st) => !!emptyFor(i, st);
  const isRight = (i, st) => !isEmpty(i, st) && st.pick === STEPS[i].want;
  // A wrong answer's hint names its slip.
  const hintFor = (i, st) => { const d = STEPS[i]; return (d.hints && d.hints[st.pick]) || d.hint; };
  // A step answered right (the timing check draws each one this way).
  function solved(i) { const st = blank(i); st.pick = STEPS[i].want; st.res = 'right'; return st; }

  let S = STEPS.map((d, i) => blank(i));
  let finished = false, lastStep = -1, lastDone = false, T = Infinity;   // T: seconds into the current motion
  let motion = null, motionEnd = 0;                                      // what is moving: 'demo' or 'fb'

  // ---------- text with amber key terms (built with K.el, never innerHTML) ----------
  function pieces(el, text) {
    const re = /\*([^*]+)\*/g;
    let at = 0, m;
    while ((m = re.exec(text))) {
      if (m.index > at) el.appendChild(document.createTextNode(text.slice(at, m.index)));
      el.appendChild(K.el('span', { class: 'term' }, m[1]));
      at = m.index + m[0].length;
    }
    if (at < text.length) el.appendChild(document.createTextNode(text.slice(at)));
  }
  // A sum, a ratio or an amount (with its unit, "4 hours", "3-hour") stays together on one line ("10 : 1", "£40 + 6 × £30 = £220", "11.5 × 10",
  // "2,300 V"), with the stop after it; a long one may break only before an equals sign.
  const TOK = '[−+]?£?(?:\\d{1,3}(?:,\\d{3})+|\\d+)(?:\\.\\d+)?(?:-(?:hour|day)(?![a-z])| (?:V|kg|m|hours?|days?)(?![a-z]))?';
  const GLUE = new RegExp('(?:[×÷] )?' + TOK + '(?: [+−=×÷:] ' + TOK + ')*[.,?!;]?', 'g');
  function write(el, text) {
    el.textContent = '';
    let at = 0, m;
    GLUE.lastIndex = 0;
    while ((m = GLUE.exec(text))) {
      if (m.index > at) pieces(el, text.slice(at, m.index));
      const bits = m[0].length > 18 ? m[0].split(/ (?==)/) : [m[0]];
      bits.forEach((b, k) => {
        if (k) el.appendChild(document.createTextNode(' '));
        if (/[ -]/.test(b)) el.appendChild(K.el('span', { class: 'nw' }, b));
        else el.appendChild(document.createTextNode(b));
      });
      at = m.index + m[0].length;
    }
    if (at < text.length) pieces(el, text.slice(at));
  }

  // ---------- controls ----------
  const stepper = K.stepper({ id: 'step', label: 'Step', steps: STEPS.map((d) => d.name), value: 0, compact: true, into: '#prog' });
  const nav = document.getElementById('nav');
  const at = () => stepper.get();

  // Up to three answer buttons; each step fills in its own options.
  const pickBtns = [0, 1, 2].map((k) => K.button({ label: 'Answer ' + (k + 1), secondary: true, into: '#picks', press: () => {
    const i = at(), d = STEPS[i], st = S[i];
    if (finished || d.show || !d.opts || k >= d.opts.length || st.res === 'right') return;
    st.pick = d.opts[k]; st.res = null;
  } }));

  // Check: marks the answer; a right one plays its picture's motion.
  const checkBtn = K.button({ label: 'Check', into: '#acts', press: () => {
    const i = at(), d = STEPS[i], st = S[i];
    if (d.show || finished) return;
    if (isEmpty(i, st)) { st.res = 'empty'; return; }
    st.res = isRight(i, st) ? 'right' : 'wrong';
    if (st.res === 'right') play(d.fb, 'fb');
  } });
  const whyBtn = K.button({ label: 'Why?', secondary: true, into: '#acts', press: () => {
    if (STEPS[at()].show || finished) return;
    const st = S[at()]; st.why = !st.why;
  } });
  const replayBtn = K.button({ label: 'Play again', secondary: true, into: '#replay', press: () => {
    const i = at(), d = STEPS[i];
    if (!d.show || finished) return;
    S[i].mark = null;
    play(d.dur, 'demo');
  } });
  const backBtn = K.button({ label: 'Back', secondary: true, into: '#nav', press: () => {
    if (finished) { finished = false; return; }
    stepper.set(Math.max(0, at() - 1), true);
  } });
  const nextBtn = K.button({ label: 'Continue', into: '#nav', press: () => {
    const i = at();
    if (finished || (!STEPS[i].show && S[i].res !== 'right')) return;
    if (i < STEPS.length - 1) { stepper.set(i + 1, true); return; }
    finished = true;
    if (typeof K.complete === 'function') K.complete();
  } });
  const againBtn = K.button({ label: 'Start again', secondary: true, into: '#again', press: () => {
    S = STEPS.map((d, i) => blank(i)); finished = false; lastStep = -1; stepper.set(0, true);
  } });

  // One animation plays each demonstration and the motion after a right answer, from its start;
  // with reduced motion (and while the self-test looks) it opens finished.
  const anim = K.anim({ button: false, label: 'Demonstration', step: (dt) => {
    if (finished) return false;
    T += dt;
    paint();
    return T < motionEnd;
  } });
  // The kit pauses the motion while the page is hidden (Dan switches app or locks the phone) and
  // resumes it when he comes back; this only settles a motion that had already stopped.
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !anim.playing() && T !== Infinity) { T = Infinity; paint(); } });
  function play(dur, kind) {
    motion = kind;
    if (REDUCE || testing()) { T = Infinity; anim.pause(); paint(); return; }
    motionEnd = dur; T = 0; anim.play();
  }
  // A new screen (or the finish panel) fades in softly: the CSS animation restarts on it.
  function enter(id) {
    if (REDUCE) return;
    const box = document.getElementById(id);
    box.classList.remove('enter');
    void box.offsetWidth;
    box.classList.add('enter');
  }

  // ---------- drawing ----------
  const svg = document.getElementById('scene'), art = document.getElementById('art'), ui = document.getElementById('ui');
  let into = null;                                   // where shapes go: the picture, or a part that is arriving
  const add = (node) => (into || art).appendChild(node);
  // How far a part due at t0 has arrived (K.arrive), noting the timetable for the timing check.
  let latest = 0, earliest = Infinity;
  function arr(t0, d) {
    d = d == null ? K.SOFT : d;
    if (t0 + d > latest) latest = t0 + d;
    if (t0 < earliest) earliest = t0;
    return K.arrive(T, t0, d);
  }
  // A part arriving: drawn into a group faded in to a and risen `rise` units into place; nothing before it starts.
  function part(a, rise, draw) {
    if (a <= 0) return;
    const g = add(K.svg('g'));
    K.fade(g, a, rise);
    const keep = into; into = g; draw(); into = keep;
  }
  // A part leaving: faded out as a goes 0 -> 1.
  function leave(a, draw) {
    if (a >= 1) return;
    const g = add(K.svg('g'));
    K.fade(g, 1 - a, 0);
    const keep = into; into = g; draw(); into = keep;
  }
  const rect = (cls, x, y, w, h, rx) => add(K.svg('rect', { class: cls, x: r3(x), y: r3(y), width: r3(Math.max(0, w)), height: h, rx: rx || 0 }));
  const line = (cls, x1, y1, x2, y2) => add(K.svg('line', { class: cls, x1: r3(x1), y1: y1, x2: r3(x2), y2: y2 }));
  const circle = (cls, cx, cy, r) => add(K.svg('circle', { class: cls, cx: r3(cx), cy: cy, r: r }));
  const text = (x, y, s, cls, anchor) => add(K.svg('text', { class: cls, x: r3(x), y: y, 'text-anchor': anchor || 'middle' }, String(s)));
  // Spaces that SVG keeps (and measures), so the working's width is right.
  const nb = (s) => String(s).replace(/ /g, ' ');
  // The width of a line of text (measured once it can be; estimated while the scene is hidden).
  const widths = {};
  function tw(s, cls) {
    const key = cls + '|' + s;
    if (widths[key]) return widths[key];
    const t = svg.appendChild(K.svg('text', { class: cls, x: 0, y: -50 }, String(s)));
    let w = 0;
    try { w = t.getComputedTextLength(); } catch (e) { w = 0; }
    svg.removeChild(t);
    if (w > 0) { widths[key] = w; return w; }
    const size = { wk: 20, val: 16, tagt: 15, opl: 15, num: 15, rname: 14 }[cls] || 13;
    return String(s).length * size * 0.6;
  }
  const tagW = (s) => tw(s, 'tagt') + 18;
  // An arrowhead at (x, y) pointing along (dx, dy).
  function head(x, y, dx, dy, cls) {
    const L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L, px = -uy, py = ux;
    add(K.svg('path', { class: 'head' + cls, d: 'M' + r3(x) + ' ' + r3(y) + ' L' + r3(x - 8 * ux + 4.5 * px) + ' ' + r3(y - 8 * uy + 4.5 * py) + ' L' + r3(x - 8 * ux - 4.5 * px) + ' ' + r3(y - 8 * uy - 4.5 * py) + ' Z' }));
  }
  // A bracket from x0 to x1 at y: a line with a short upright at each end.
  function bracket(cls, x0, x1, y) { line(cls, x0, y, x1, y); line(cls, x0, y - 5, x0, y + 5); line(cls, x1, y - 5, x1, y + 5); }
  // The working, at the foot of the picture, right-aligned, one row under another; as[k]: how far row k has arrived.
  function working(rows, as) {
    const y0 = H - 10 - (rows.length - 1) * WROW;
    rows.forEach((s, k) => part(as[k], 6, () => text(334 - tw(nb(s), 'wk'), y0 + k * WROW, nb(s), 'wk', 'start')));
  }
  const workSaid = (rows, as) => { const r = rows.filter((x, k) => as[k] >= 0.5); return r.length ? ' At the foot: ' + r.map(say).join(', then ') + '.' : ''; };

  // --- the ratio table ---
  // Its sizes for a step: the columns start clear of the longest row name and share the room left.
  let TG = { tx: 88, cw: 96, ch: CH, ty: TY, nrow: 2 };
  function tableGeo(d) {
    const firms = d.pic === 'firms', names = firms ? ['Hours', 'Firm A', 'Firm B', 'Firm C'] : d.names;
    const ncol = firms ? d.hours.length : d.cols ? d.cols.length : 2, tx = NX + Math.max.apply(null, names.map((s) => tw(s, 'rname'))) + 12;
    return { tx: tx, cw: Math.min(96, (334 - tx) / ncol), ch: firms ? FCH : CH, ty: firms ? FTY : TY, nrow: names.length, names: names };
  }
  const cx = (k) => TG.tx + k * TG.cw + (TG.cw - 12) / 2;
  const baseY = (r) => TG.ty + r * TG.ch + TG.ch / 2 + 5;
  function colBox(k) {
    const x = TG.tx + k * TG.cw;
    rect('col', x, TG.ty, TG.cw - 12, TG.nrow * TG.ch, 6);
    for (let r = 1; r < TG.nrow; r++) line('mid', x, TG.ty + r * TG.ch, x + TG.cw - 12, TG.ty + r * TG.ch);
  }
  const cell = (k, r, s) => text(cx(k), baseY(r), s, 'val');
  function gapCell(k, r) { rect('gapbox', cx(k) - 17, TG.ty + r * TG.ch + 5, 34, TG.ch - 10, 5); text(cx(k), baseY(r), '?', 'qm'); }
  const hlCell = (k, r) => rect('hl', TG.tx + k * TG.cw + 4, TG.ty + r * TG.ch + 3, TG.cw - 20, TG.ch - 6, 4);
  const cellText = (d, c, r) => amt(c[r], d.units[r]);
  function column(k, d, c) { colBox(k); cell(k, 0, cellText(d, c, 0)); cell(k, 1, cellText(d, c, 1)); }
  // A cell's '?' giving way to its amount (the box fades out first, then the amount in), from t seconds.
  function swapCell(k, r, s, t, at) {
    leave(at(t, 0.25), () => gapCell(k, r));
    part(at(t + 0.25), 4, () => cell(k, r, s));
  }
  const tableNames = () => TG.names.forEach((s, r) => text(NX, baseY(r), s, 'rname', 'start'));
  // The step from column k to k + 1, on an arrow curving over the top row and another under the bottom
  // row (or only one of them: 'top', 'bot'); a step that differs is drawn in the warning colour.
  function arcs(k, op, bad, which) {
    const x0 = cx(k) + 14, x1 = cx(k + 1) - 14, xm = (x0 + x1) / 2, cls = bad ? ' bad' : '', ty = TG.ty, b = ty + 2 * TG.ch;
    [[ty - 3, ty - 21, ty - 19, 'top'], [b + 3, b + 21, b + 30, 'bot']].forEach((g) => {
      if (which && which !== g[3]) return;
      add(K.svg('path', { class: 'arc' + cls, d: 'M' + r3(x0) + ' ' + g[0] + ' Q' + r3(xm) + ' ' + g[1] + ' ' + r3(x1) + ' ' + g[0] }));
      head(x1, g[0], x1 - xm, g[0] - g[1], cls);
      text(xm, g[2], op, 'opl' + cls);
    });
  }
  const sayCol = (d, c) => (c[0] == null || c[1] == null ? say(c[0] == null ? 'a question mark' : cellText(d, c, 0)) + ' to ' + (c[1] == null ? 'a question mark' : say(cellText(d, c, 1))) : say(cellText(d, c, 0)) + ' to ' + say(cellText(d, c, 1)));
  function tableSaid(d, cols, ops) {
    return 'A ratio table with rows for ' + d.names[0].toLowerCase() + ' and ' + d.names[1].toLowerCase() + '. Its columns read ' + cols.map((c) => sayCol(d, c)).join(', then ') +
      (ops.length ? ', the steps ' + ops.map(say).join(' and ') + ' written over and under the rows' : '') + '.';
  }

  // --- two scales locked together ---
  const lx = (v) => LX0 + (LX1 - LX0) * v / VMAX;
  // Both scales with a tick every 50 V of the primary, every other tick labelled (the primary's below its
  // line, every 100 V; the secondary's above its own, every 10 V; only those in `bot`, if given).
  function scales(d, bot) {
    text(NX, TL + 5, 'Primary', 'rname', 'start'); text(NX, TL + 21, 'volts', 'unit', 'start');
    text(NX, BL + 5, 'Secondary', 'rname', 'start'); text(NX, BL + 21, 'volts', 'unit', 'start');
    line('nl', LX0, TL, LX1, TL); line('nl', LX0, BL, LX1, BL);
    for (let v = 0; v <= VMAX; v += TICK) {
      line('tick', lx(v), TL - 6, lx(v), TL + 6); line('tick', lx(v), BL - 6, lx(v), BL + 6);
      if (v % LAB) continue;
      text(lx(v), TL + 21, num(v), 'tl');
      if (!bot || bot.indexOf(v) >= 0) text(lx(v), BL - 11, num(v / d.k), 'tl');
    }
  }
  // ÷ 10 between the scales, at the left: the secondary is the primary ÷ the turns ratio.
  function linkArrow(d) {
    const x = 22, y0 = TL + 30, y1 = BL - 18;
    line('arc', x, y0, x, y1 - 6);
    head(x, y1, 0, 1, '');
    text(x + 9, (y0 + y1) / 2 + 5, '÷ ' + d.k, 'opl', 'start');
  }
  // A voltage marked at v: a dot on the line and a short stem to its label.
  function markAt(top, v) {
    const x = lx(v);
    circle('dot', x, top ? TL : BL, 4.5);
    if (top) line('stem', x, TL - 14, x, TL - 4); else line('stem', x, BL + 4, x, BL + 12);
  }
  // Its label: a pill above the primary's line or below the secondary's, kept on the picture.
  function pillAt(top, v, s) {
    const x = lx(v), y = top ? TL - 38 : BL + 12, w = tagW(s), x0 = K.clamp(x - w / 2, 2, 338 - w);
    rect('tag', x0, y, w, 24, 8); text(x0 + w / 2, y + 17, s, 'tagt k-nohalo');
  }
  const scalesSaid = 'Two scales locked together, the primary from 0 to 400 volts above and the secondary from 0 to 40 volts below, 0 over 0.';

  // While the mark travels, its voltage is counted in held steps: the travel read only every HOLD
  // seconds or more and rounded to `by`, landing on the exact value when the mark does.
  const HOLD = 0.22;
  function counted(t0, dur, from, to, by) {
    if (T === Infinity) return to;
    const n = Math.max(1, Math.floor(dur / HOLD + 1e-9)), k = K.clamp(Math.floor((T - t0) * n / dur + 1e-9), 0, n);
    const a = K.arrive(t0 + k * dur / n, t0, dur);
    return a >= 1 ? to : Math.round((from + (to - from) * a) / by) * by;
  }

  // --- rows of blocks ---
  // A step's blocks: they start clear of the longest row name, and one scale fits every row and its tag.
  const rowName = (c, row) => (row.twice ? amt(total(c, row.n), c.unit) + ' × 2' : c.row(row.n));
  function blockGeo(d) {
    const c = d.c, names = d.rows.map((row) => rowName(c, row)), bx = NX + Math.max.apply(null, names.map((s) => tw(s, 'rname'))) + 10;
    const s = Math.min.apply(null, d.rows.map((row) => (334 - bx - 5 - tagW(amt(rowTotal(c, row), c.unit))) / rowTotal(c, row)));
    return { c: c, bx: bx, s: s, names: names };
  }
  const rowY = (r) => ROW0 + r * PITCH;
  // Where each block of a row sits: the fixed part, then a block for each of the rate (twice over for a doubled bill).
  function blocksOf(G, row) {
    const c = G.c, out = [];
    let x = G.bx;
    for (let k = 0; k < (row.twice ? 2 : 1); k++) {
      out.push({ fee: true, x: x, w: c.fee * G.s, again: k > 0 });
      x += c.fee * G.s;
      for (let j = 0; j < row.n; j++) { out.push({ fee: false, x: x, w: c.rate * G.s }); x += c.rate * G.s; }
    }
    return out;
  }
  // A row's blocks (those keep allows), a hair apart so each reads as one.
  function blockRow(G, r, row, keep) { blocksOf(G, row).forEach((b) => { if (!keep || keep(b)) rect(b.fee ? 'b2' : 'b1', b.x + 1, rowY(r), b.w - 2, BHT, 3); }); }
  const rowEnd = (G, row) => G.bx + rowTotal(G.c, row) * G.s;
  function rowTag(G, r, row) {
    const s = amt(rowTotal(G.c, row), G.c.unit), w = tagW(s), x = rowEnd(G, row) + 5;
    rect('tag', x, rowY(r), w, BHT, 8); text(x + w / 2, rowY(r) + 18, s, 'tagt k-nohalo');
  }
  const rowLabel = (G, r) => text(NX, rowY(r) + 18, G.names[r], 'rname', 'start');
  // The key: a light-tint swatch for the fixed part and a solid one for the rate, each named (with its
  // worth once it is known: gone[k] says how far the bare name has faded out, come[k] how far the name
  // with its worth has come in after it, never both at once).
  function keyOf(G, gone, come) {
    let x = NX;
    G.c.key.forEach((names, k) => {
      rect(k ? 'b1' : 'b2', x, KEYY - 11, 12, 12, 2);
      const w = Math.max(tw(names[0], 'keyt'), tw(names[1], 'keyt'));
      leave(gone[k], () => text(x + 18, KEYY, names[0], 'keyt', 'start'));
      part(come[k], 0, () => text(x + 18, KEYY, names[1], 'keyt', 'start'));
      x += 18 + w + 18;
    });
  }
  // The row to find, before the answer: a '?' where its blocks start (its width never tells the answer).
  function askBox(G, r) { rect('gapbox', G.bx, rowY(r) + 2, 40, BHT - 4, 6); text(G.bx + 20, rowY(r) + 18, '?', 'qm'); }
  // The doubled bill's second call-out, ringed in the warning colour and named under it.
  function ring(G, r, row) {
    const b = blocksOf(G, row).filter((q) => q.again)[0], lw = tw('paid twice', 'overt');
    rect('over', b.x - 2, rowY(r) - 3, b.w + 4, BHT + 6, 5);
    text(K.clamp(b.x + b.w / 2, lw / 2 + 2, 338 - lw / 2), rowY(r) + BHT + 17, 'paid twice', 'overt');
  }
  // The working a blocks screen writes: the fixed part + the rate's blocks; on the van hire, first what
  // the 2 extra days cost.
  function workOf(d) {
    const c = d.c, u = c.unit, n = lastRow(d).n, main = amt(c.fee, u) + ' + ' + n + ' × ' + amt(c.rate, u) + ' = ' + amt(total(c, n), u);
    if (d.hide !== 'both') return [main];
    const a = total(c, d.rows[0].n), b = total(c, d.rows[1].n);
    return [amt(b, u) + ' − ' + amt(a, u) + ' = ' + amt(b - a, u), main];
  }
  const blocksH = (d) => rowY(d.rows.length - 1) + BHT + (d.demo === 'fixed' ? 26 : 8 + 26 + (workOf(d).length - 1) * WROW);
  function blocksSaid(d, shownRows) {
    const c = d.c;
    return 'Rows of blocks: a fixed part in a light tint, then one solid block for each ' + (c === DRUM ? '50 metres of cable' : c === HIRE ? 'day' : 'hour') + '. ' +
      shownRows.map((r) => { const row = d.rows[r]; return (row.twice ? 'The 2-hour bill doubled, with two call-outs' : c.said(row.n)) + ', ' + say(amt(rowTotal(c, row), c.unit)) + '.'; }).join(' ');
  }

  // --- the demonstrations ---
  // In step: × 2 written over and under the table, the next column; × 2 again, the column after.
  function demoDouble(d) {
    const A = AT.double, a1 = arr(A.arcs), c1 = arr(A.ans), a2 = arr(A.arcs2), c2 = arr(A.ans2);
    tableNames(); column(0, d, d.cols[0]);
    part(a1, 0, () => arcs(0, d.ops[0]));
    part(c1, 4, () => column(1, d, d.cols[1]));
    part(a2, 0, () => arcs(1, d.ops[1]));
    part(c2, 4, () => column(2, d, d.cols[2]));
    return tableSaid(d, [d.cols[0]].concat(c1 >= 0.5 ? [d.cols[1]] : [], c2 >= 0.5 ? [d.cols[2]] : []), [a1, a2].filter((x) => x >= 0.5).map((x, k) => d.ops[k]));
  }
  // Two tests: × 2 over the hours; × 1.6, not × 2, under the cost, in the warning colour; then the
  // column for 0 hours, its £40 picked out.
  function demoTests(d) {
    const A = AT.tests, top = arr(A.arcs), bot = arr(A.bad), z = arr(A.zero), h = arr(A.hl);
    tableNames();
    part(z, 4, () => colBox(0));

  // Locked together: ÷ 10 between the scales; a voltage marked on both at 100 V, then travelling to

  // A fixed charge: the 2-hour bill; the 4-hour bill's blocks, then its total; the 2-hour bill doubled,

  // Take it off first: the 2-hour bill's call-out is taken off (its block fades to a dashed outline);

  function demoStrip(d) {

  // --- the puzzles ---

  // at its time in the step's `at`, through at()): the motion that shows why.
  function drawPuz(d, st, right) {
    const F = d.at, at = (t, dur) => (right && t != null ? arr(t, dur) : 0);
    if (d.pic === 'table') return puzTable(d, F, at);
    if (d.pic === 'firms') return puzFirms(d, F, at);
    if (d.pic === 'line') return puzRise(d, F, at);
    return puzBlocks(d, F, at);
  }
  // The table: the ratio's column, and the second with the amount known; the step written over and
  // under, the '?' giving way to the answer, the sum worked at the foot. Where the puzzle asks for a sum,
  // its route is drawn instead: an arrow up the second column, from the secondary to the primary, × 10.
  const upOp = (d) => '× ' + num(d.ratio[0] / d.ratio[1]);
  function upArrow(d) {
    const x = TG.tx + 2 * TG.cw - 12 + 10, y0 = baseY(1) - 5, y1 = TG.ty + 6;
    line('arc', x, y0, x, y1 + 6);

    text(x + 8, TG.ty + TG.ch + 5, upOp(d), 'opl', 'start');
  }
  function puzTable(d, F, at) {
    const t = tabOf(d), got = at(F.ans + 0.25), arcA = at(F.arcs), sum = d.ask === 'sum', rows = F.work ? [d.want + ' = ' + volts(t.out[t.fr])] : [];
    tableNames(); column(0, d, d.ratio);
    colBox(1); cell(1, t.kr, cellText(d, t.out, t.kr));
    swapCell(1, t.fr, cellText(d, t.out, t.fr), F.ans, at);
    part(arcA, 0, () => (sum ? upArrow(d) : arcs(0, '× ' + num(t.step))));
    if (rows.length) working(rows, [at(F.work)]);
    const col = t.out.slice(); if (got < 0.5) col[t.fr] = null;
    return tableSaid(d, [d.ratio, col], arcA >= 0.5 && !sum ? ['× ' + num(t.step)] : []) +

  }
  // A rise: both voltages marked on both scales, the primary's rise bracketed above; under the

  function puzRise(d, F, at) {
    const xm = (lx(d.from) + lx(d.to)) / 2, got = at(F.ans + 0.25), lab = at(F.lab), rise = d.to - d.from;
    scales(d, [0, d.from]);
    part(lab, 0, () => text(lx(d.to), BL - 11, num(d.to / d.k), 'tl'));
    linkArrow(d);
    [d.from, d.to].forEach((v) => { circle('dot', lx(v), TL, 4.5); circle('dot', lx(v), BL, 4.5); });
    bracket('brk', lx(d.from), lx(d.to), TL - 14);
    text(xm, TL - 22, '+ ' + volts(rise), 'num');
    bracket('brk', lx(d.from), lx(d.to), BL + 14);
    leave(at(F.ans, 0.25), () => { rect('gapbox', xm - 20, BL + 22, 40, 22, 6); text(xm, BL + 38, '?', 'qm'); });
    part(got, 4, () => text(xm, BL + 38, '+ ' + volts(rise / d.k), 'num'));
    return scalesSaid + ' Divided by 10 takes the primary to the secondary. Dots mark 200 and 300 volts on the primary, a rise of 100 volts, and the same two places on the secondary, where 20 volts is labelled' +
      (lab >= 0.5 ? ' and 30 volts' : '') + '. The secondary\'s rise is ' + (got >= 0.5 ? say('+ ' + volts(rise / d.k)) : 'a question mark') + '.';
  }
  // The firms: a row of hours and a row of prices for each; a '?' at 0 hours for each that gives way to
  // its price, then the firm in proportion picked out.
  function puzFirms(d, F, at) {
    const pick = d.opts.indexOf(d.want) + 1, got = at(F.ans + 0.25), hl = at(F.hl);
    tableNames();
    d.hours.forEach((h, k) => colBox(k));
    part(hl, 0, () => d.hours.forEach((h, k) => hlCell(k, pick)));
    d.hours.forEach((h, k) => cell(k, 0, h + ' h'));
    d.firms.forEach((f, j) => d.hours.forEach((h, k) => {
      if (h) cell(k, j + 1, amt(cost(f, h), '£'));
      else swapCell(k, j + 1, amt(cost(f, h), '£'), F.ans, at);
    }));
    return 'A table of three firms\' prices for 1, 2 and 3 hours. ' + d.firms.map((f, j) => 'Firm ' + 'ABC'[j] + ': ' + [1, 2, 3].map((h) => say(amt(cost(f, h), '£'))).join(', ') +
      (got >= 0.5 ? ', and ' + say(amt(cost(f, 0), '£')) + ' at 0 hours' : '') + '.').join(' ') + (got >= 0.5 ? '' : ' At 0 hours each is a question mark.') +
      (hl >= 0.5 ? ' ' + d.want + ' is picked out.' : '');

  // The blocks: the rows given, and a '?' for the row to find, which gives way to its blocks, its total

    const G = blockGeo(d), last = d.rows.length - 1, rows = workOf(d), grow = at(F.grow), tag = at(F.tag);

  // Each picture's height.
  const heightOf = (d) => (d.pic === 'line' ? HLINE : d.pic === 'firms' ? FTY + 4 * FCH + 10 : d.pic === 'blocks' ? blocksH(d) : TY + 2 * CH + 36 + (d.ask === 'sum' ? 28 : 0));
  // The scene for a step (the animation calls this every frame).
  function paint(i) {
    if (i == null) i = at();
    const d = STEPS[i], st = S[i], right = st.res === 'right';
    art.textContent = '';
    into = null;
    if (d.pic === 'table' || d.pic === 'firms') TG = tableGeo(d);
    H = heightOf(d);
    svg.setAttribute('viewBox', '0 0 340 ' + H);
    if (!d.drag) placeGrip(null);
    let aria;

  const el = (id) => document.getElementById(id);
  write(el('finish'), FINISH);
  K.update((p) => {
    const i = Math.round(p.step), d = STEPS[i], st = S[i];
    if (!anim.playing()) T = Infinity;   // motion that was stopped (the page hidden, a test) shows finished

    if (finished !== lastDone) { lastDone = finished; enter(finished ? 'done' : 'stepbox'); }
    const right = st.res === 'right';

    const task = el('task');

  // ---------- known answers, worked out by hand ----------
  const DO = STEPS.map((d, i) => i).filter((i) => !STEPS[i].show);
  const LINE_I = STEPS.findIndex((d) => d.demo === 'line'), TEST_I = STEPS.findIndex((d) => d.demo === 'tests'), FIRM_I = STEPS.findIndex((d) => d.ask === 'which');
  const FILL_I = STEPS.findIndex((d) => d.ask === 'fill'), SUM_I = STEPS.findIndex((d) => d.ask === 'sum'), RISE_I = STEPS.findIndex((d) => d.ask === 'rise');

        tls: all('text.tl').map((t) => t.textContent), work: all('text.wk').map((t) => t.textContent.replace(/ /g, ' ')), vals: all('text.val').map((t) => t.textContent),

  // What a puzzle's picture must not show before the answer.

    if (d.pic === 'line') return ['+ ' + volts((d.to - d.from) / d.k), num(d.to / d.k)];
    if (d.pic === 'firms') return d.firms.map((f) => amt(cost(f, 0), '£'));

  K.check('When two variables are directly proportional they increase at the same rate: if the first is doubled, the other is also doubled. 100 V, 200 V and 400 V on a 10 : 1 transformer give 10 V, 20 V and 40 V, and wherever the mark is dragged, twice the primary gives twice the secondary', () => {

  K.check('The turns ratio of any given transformer will be the same as its voltage ratio, so on a 10 : 1 transformer 230 V on the primary gives 230 ÷ 10 = 23 V, a rise of 100 V on the primary is a rise of 10 V on the secondary, and 11.5 V on the secondary needs 11.5 × 10 = 115 V', () =>
    STEPS[FILL_I].ratio.join() === '10,1' && STEPS[SUM_I].ratio.join() === '10,1' && answerOf(STEPS[FILL_I]) === 23 && answerOf(STEPS[RISE_I]) === 10 && answerOf(STEPS[SUM_I]) === 115 &&

  K.check('A fixed charge plus a rate rises steadily but is not in direct proportion: £40 plus £30 an hour costs £40 at 0 hours and £30 more each hour, and for every whole number of hours from 1 to 10, twice the hours costs £40 less than twice the bill, the call-out paid once; so 2 hours at £100 to 4 hours at £160 is × 2 on the hours but × 1.6 on the cost', () => {
