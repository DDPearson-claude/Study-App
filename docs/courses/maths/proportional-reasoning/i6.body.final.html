<p class="caption">In inverse proportion the product stays the same. The amounts are example values.</p>

<script>
  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // pic: the picture a step draws. 'blocks': a rectangle of blocks `w0` wide and `h0` tall, laid out
  // again `w1` wide (blk). 'table': a ratio table; on the SHOW screen `cols`, its two columns, `op` the
  // step over the top row and under the bottom one, `slipOp` the step a direct reading takes; on a
  // puzzle `a`, the first column, and `given`, the first row's amount asked about (the column for one
  // arrives after the answer). 'cyl': a gas cylinder, `v0` litres at `p0` bar absolute (on the gauge
  // screens `g0`, the gauge reading, with the atmosphere added), squeezed to `v1` litres, or to `pt`
  // bar absolute; `counts`, the volumes its labels count through as the piston moves. 'tx': a
  // transformer wound `turns`, with `v` volts and `i` amps on its primary.
  // ask: what a cylinder puzzle asks for ('p' the absolute pressure, 'gauge' the gauge reading, 'vol'
  // the volume). dur: how long a demonstration plays; fb: how long the motion after a right answer
  // plays (seconds); at: when each part of that motion arrives, in seconds after Check. slips: which
  // mistake gives each wrong answer (SLIP below).
  const PICK = 'Tap one of the answers.';
  // The atmosphere is taken as 1 bar on the gauge screens; standard sea-level pressure is 1013.25 mb.
  const ATM = 1, ATM_MB = 1013.25;
  // After a right answer. Blocks: the old labels leave as half the blocks lift and slide onto the
  // rest; the new labels; the working. Table: the column for one arrives with its steps, then its
  // amounts, then the steps on to the answer; the '?' gives way to it; the working. Cylinder: the
  // piston slides in, the rectangle following; the absolute pressure named, where it was hidden; the
  // working. Transformer: the '?' gives way to the current; the ratio of the currents.
  const BLK = { off: 0.1, go: [0.1, 1.1], lab: 1.3, work: 1.85 };
  const VIA = { via: 0.1, viaval: 0.55, arcs: 1.0, ans: 1.45, work: 1.9 };
  const CYL = { go: [0.1, 1.2], tag: 1.4, work: 1.9 };
  const TXA = { ans: 0.1, row: 0.85 };
  const PUMPS = { names: ['Pumps', 'Hours'], u: 'h' };
  const GEARBOX = { names: ['rpm', 'N m'], u: 'N m' };
  // A gearbox puzzle steps straight across: the speed ÷ by, the torque × by; the answer, then the working.
  const BY = { arcs: 0.1, ans: 0.6, work: 1.35 };
  const STEPS = [
    { show: true, pic: 'blocks', demo: 'restack', dur: 3.3, blk: { w0: 6, h0: 2, w1: 3 }, name: 'Halve one, double the other',
      text: 'Twelve blocks sit 6 wide and 2 tall. Halve the width and the same 12 stack 4 tall. When halving one doubles the other, the two are in *inverse proportion*.' },
    { kind: 'pick', pic: 'blocks', blk: { w0: 4, h0: 3, w1: 2 }, name: 'How tall?',
      opts: ['6', '1.5', '5'], want: '6', slips: { '1.5': 'direct', '5': 'add' }, fb: 2.45, at: BLK,
      task: 'These 12 blocks sit 4 wide and 3 tall. Stacked 2 wide instead, how many blocks tall are they?',
      why: 'There are still 12 blocks. Halving the width from 4 to 2 doubles the height from 3 to 6, and 2 × 6 = 12 checks it.',
      hint: 'Not quite. Half the width means more rows.',
      hints: { '1.5': 'Not quite. That halves the height as well, as if it were direct. Fewer blocks across makes the stack taller.',
        '5': 'Not quite. That adds the 2 taken off the width. 2 wide and 5 tall holds only 10 blocks.' } },
    { show: true, pic: 'table', demo: 'opp', dur: 4.3, q: { names: ['Width', 'Height'] }, cols: [[6, 2], [3, 4]], op: ['÷ 2', '× 2'], slipOp: '÷ 2', name: 'Opposite steps',
      text: 'On a table the steps go opposite ways, width ÷ 2 and height × 2. Halving both, as direct proportion would, leaves 3 × 1 = 3 blocks, not 12.' },
    { kind: 'pick', pic: 'table', q: PUMPS, a: [2, 6], given: 3, name: 'More pumps',
      opts: ['4 h', '9 h', '5 h'], want: '4 h', slips: { '9 h': 'direct', '5 h': 'add' }, fb: 2.5, at: VIA,
      task: 'Two equal pumps empty a tank in 6 hours. How long would three of them take?',
      why: 'One pump alone would take 6 × 2 = 12 hours. Three share that, so 12 ÷ 3 = 4 hours. Pumps × hours stays 12.',
      hint: 'Not quite. Find how long one pump alone would take first.',
      hints: { '9 h': 'Not quite. That gives more hours for more pumps, as if it were direct. Three pumps finish sooner than two.',
        '5 h': 'Not quite. That takes an hour off for the extra pump. Find how long one pump alone would take.' } },
    { show: true, pic: 'cyl', demo: 'boyle', dur: 3.6, cyl: { v0: 6, p0: 1, v1: 3, counts: [6, 5, 4, 3] }, drag: true, snapV: [1.5, 2, 2.5, 3, 4, 5, 6], name: 'Boyle\'s law',
      text: 'By *Boyle\'s law*, a sealed-in gas keeps volume × absolute pressure the same at a steady temperature. Halving 6 L to 3 L doubles 1 bar absolute to 2 bar absolute. Drag the piston.' },
    { kind: 'pick', pic: 'cyl', ask: 'p', cyl: { v0: 8, p0: 1, v1: 2, counts: [8, 4, 2] }, name: 'Squeeze it',
      opts: ['4 bar', '0.25 bar', '7 bar'], want: '4 bar', slips: { '0.25 bar': 'direct', '7 bar': 'add' }, fb: 2.5, at: CYL,
      task: 'A cylinder holds 8 L of gas at 1 bar absolute. Squeezed to 2 L at the same temperature, what is its absolute pressure?',
      why: '2 L is a quarter of 8 L, so the absolute pressure is four times as much, 4 bar. As a check, 8 × 1 = 2 × 4.',
      hint: 'Not quite. Less space means more pressure.',
      hints: { '0.25 bar': 'Not quite. That cuts the pressure to a quarter, as if it were direct. Squeezing a gas raises its pressure.',
        '7 bar': 'Not quite. That adds 6 bar for the 6 L taken away. Volume × absolute pressure has to stay 8.' } },
    { show: true, pic: 'cyl', demo: 'gauge', dur: 3.1, cyl: { v0: 6, g0: 1, gauge: true, v1: 3, counts: [6, 5, 4, 3] }, name: 'Gauge or absolute',
      text: 'Boyle\'s law needs absolute pressure, gauge plus about 1 bar. Gauge 1 bar is 2 bar absolute, so halving the space makes 4 bar absolute. The gauge now reads 3 bar, not 2 bar.' },
    { kind: 'pick', pic: 'cyl', ask: 'gauge', cyl: { v0: 4, g0: 2, gauge: true, v1: 2, counts: [4, 3, 2] }, name: 'Read the gauge',
      opts: ['5 bar', '4 bar', '1 bar'], want: '5 bar', slips: { '4 bar': 'gaugeDouble', '1 bar': 'direct' }, fb: 2.5, at: CYL,
      task: 'A cylinder\'s gauge reads 2 bar. Its space is halved at the same temperature. About what will the gauge read now?',
      why: 'The gauge reads 2 bar, so the gas is at about 2 + 1 = 3 bar absolute. Half the space doubles that to 6 bar absolute, and the gauge reads 6 − 1 = 5 bar.',
      hint: 'Not quite. Turn the gauge reading into absolute pressure first.',
      hints: { '4 bar': 'Not quite. That doubles the gauge reading. Boyle\'s law doubles the absolute pressure, gauge plus about 1 bar.',
        '1 bar': 'Not quite. That halves the pressure, as if it were direct. Squeezing a gas raises its pressure.' } },
    { show: true, pic: 'tx', demo: 'tx', dur: 4.2, tx: { turns: [10, 1], v: 230, i: 2 }, name: 'A transformer',
      text: 'A transformer wound 10 : 1 steps 230 V down to 23 V. Its current goes the other way, 1 : 10, so 2 A in the primary goes with about 20 A in the secondary.' },
    { kind: 'pick', pic: 'tx', tx: { turns: [10, 1], i: 0.5 }, name: 'Which way?',
      opts: ['5 A', '0.05 A', '0.5 A'], want: '5 A', slips: { '0.05 A': 'direct', '0.5 A': 'same' }, fb: 1.45, at: TXA,
      task: 'This transformer is wound 10 : 1. Its primary carries 0.5 A. What current does its secondary carry?',
      why: 'Wound 10 : 1, it steps the voltage down 10 : 1, so the current goes up, 1 : 10. 0.5 × 10 = 5 A in the secondary.',
      hint: 'Not quite. The current goes the other way from the voltage.',
      hints: { '0.05 A': 'Not quite. That steps the current down 10 : 1, like the voltage. The current goes the other way.',
        '0.5 A': 'Not quite. The current changes too. It goes the other way from the voltage.' } },
    { kind: 'pick', pic: 'cyl', ask: 'vol', cyl: { v0: 6, p0: 1, pt: 3, counts: [6, 3, 2] }, name: 'How much space?',
      opts: ['2 L', '18 L', '4 L'], want: '2 L', slips: { '18 L': 'direct', '4 L': 'add' }, fb: 2.5, at: CYL,
      task: 'Gas fills 6 L at 1 bar absolute. To reach 3 bar absolute at the same temperature, how small must its space be?',
      why: '3 bar is three times 1 bar, so the space must be a third of 6 L, which is 2 L. As a check, 6 × 1 = 2 × 3.',
      hint: 'Not quite. Three times the pressure needs less space.',
      hints: { '18 L': 'Not quite. That gives more space for more pressure, as if it were direct. Squeezing is what raises the pressure.',
        '4 L': 'Not quite. That takes 2 L off for 2 bar more. Volume × absolute pressure has to stay 6.' } },
    { kind: 'pick', pic: 'table', q: GEARBOX, a: [1500, 120], given: 500, by: 3, name: 'A gearbox',
      opts: ['360 N m', '40 N m', '120 N m'], want: '360 N m', slips: { '40 N m': 'direct', '120 N m': 'same' }, fb: 1.95, at: BY,
      task: 'An ideal reduction gearbox takes 1500 rpm down to 500 rpm. 120 N m of torque goes in. How much torque comes out?',
      why: 'An ideal gearbox trades speed for torque. The speed is a third, 1500 ÷ 3 = 500 rpm, so the torque is three times as much, 360 N m. As a check, 1500 × 120 = 500 × 360.',
      hint: 'Not quite. Slower out means more torque.',
      hints: { '40 N m': 'Not quite. That cuts the torque to a third as well, as if it were direct. A gearbox trades speed for torque.',
        '120 N m': 'Not quite. The torque changes too. It goes the other way from the speed.' } },
  ];
  const FINISH = 'In inverse proportion one amount goes up as the other comes down, with their product the same, so doubling one halves the other. Boyle\'s law works this way on absolute pressure, and a 10 : 1 transformer steps its current up 1 : 10.';
  // When each demonstration's parts arrive, in seconds after the screen opens (the screen itself
  // takes FADE to fade in, so nothing starts before it has settled). restack: the labels leave as
  // half the blocks lift [start, how long] and slide onto the rest; the new labels; the working.
  // opp: the step over the top row; the direct step under the bottom row, its amount and its product,
  // in the warning colour; they leave; the opposite step; its amount and product. boyle, gauge: the
  // piston slides in; the working; the thumb, to drag. tx: each voltage, their ratio, each current,
  // their ratio.
  const FADE = 0.35;
  const AT = {
    restack: { off: 0.6, go: [0.6, 1.4], lab: 2.1, work: 2.6 },
    opp: { top: 0.6, slip: 1.1, sval: 1.6, swork: 2.1, off: 2.7, right: 3.15, ans: 3.6 },
    boyle: { go: [0.6, 1.6], work: 2.4, grip: 2.9 },
    gauge: { go: [0.6, 1.6], work: 2.4 },
    tx: { v1: 0.6, v2: 1.1, vrow: 1.6, i1: 2.1, i2: 2.6, irow: 3.1, prow: 3.6 },
  };
  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  // While the kit's self-test looks at every screen it switches fades off (the k-testing class):
  // demonstrations then open finished, as they do with reduced motion.
  const testing = () => document.documentElement.classList.contains('k-testing');

  // ---------- numbers (pure, so the checks can test them) ----------
  const r3 = (v) => Math.round(v * 1000) / 1000;
  const same = (a, b) => K.near(a, b, 1e-9);
  const M = '−';
  const num = (v) => String(r3(v));
  const amt = (v, u) => num(v) + ' ' + u;
  // Blocks: w0 × h0 of them laid w1 wide stand w0 × h0 ÷ w1 tall.
  const blkH1 = (B) => r3(B.w0 * B.h0 / B.w1);
  // Table: a[0] of the first row goes with a[1] of the second, so one goes with their product, and
  // `given` goes with that product ÷ given.
  const prodOf = (d) => r3(d.a[0] * d.a[1]);
  const tabAns = (d) => r3(prodOf(d) / d.given);
  // Cylinder: the absolute pressure at the start (on the gauge screens, the gauge reading plus the
  // atmosphere), at volume v (volume × absolute pressure stays the same), and the volume it ends at.
  const pAbs0 = (C) => (C.gauge ? r3(C.g0 + ATM) : C.p0);
  const pAt = (C, v) => r3(pAbs0(C) * C.v0 / v);
  const vEnd = (C) => (C.pt != null ? r3(pAbs0(C) * C.v0 / C.pt) : C.v1);
  // Transformer: the secondary's voltage follows the turns ratio and its current goes the other way.
  const txV2 = (X) => r3(X.v * X.turns[1] / X.turns[0]);
  const txI2 = (X) => r3(X.i * X.turns[0] / X.turns[1]);
  const ratio = (a, b) => num(a) + ' : ' + num(b);
  // The answer a puzzle wants, worked out by its rule, as its button reads.
  function answerOf(d) {
    if (d.pic === 'blocks') return num(blkH1(d.blk));
    if (d.pic === 'table') return amt(tabAns(d), d.q.u);
    if (d.pic === 'tx') return amt(txI2(d.tx), 'A');
    const C = d.cyl;
    if (d.ask === 'vol') return amt(vEnd(C), 'L');
    if (d.ask === 'gauge') return amt(pAt(C, C.v1) - ATM, 'bar');
    return amt(pAt(C, C.v1), 'bar');
  }
  // What each slip makes of the answer: both amounts scaled the same way, as if in direct proportion;
  // the change in one taken off (or added to) the other; the gauge reading doubled as if it were
  // absolute; or the current (or the torque) left as it was.
  const SLIP = {
    direct: (d) => {
      if (d.pic === 'blocks') return num(d.blk.h0 * d.blk.w1 / d.blk.w0);
      if (d.pic === 'table') return amt(d.a[1] * d.given / d.a[0], d.q.u);
      if (d.pic === 'tx') return amt(d.tx.i * d.tx.turns[1] / d.tx.turns[0], 'A');
      const C = d.cyl;
      if (d.ask === 'vol') return amt(C.v0 * C.pt / C.p0, 'L');
      if (d.ask === 'gauge') return amt(C.g0 * C.v1 / C.v0, 'bar');
      return amt(C.p0 * C.v1 / C.v0, 'bar');
    },
    add: (d) => {
      if (d.pic === 'blocks') return num(d.blk.h0 + d.blk.w0 - d.blk.w1);
      if (d.pic === 'table') return amt(d.a[1] - (d.given - d.a[0]), d.q.u);
      const C = d.cyl;
      if (d.ask === 'vol') return amt(C.v0 - (C.pt - C.p0), 'L');
      return amt(C.p0 + C.v0 - C.v1, 'bar');
    },
    gaugeDouble: (d) => amt(d.cyl.g0 * d.cyl.v0 / d.cyl.v1, 'bar'),
    same: (d) => (d.pic === 'tx' ? amt(d.tx.i, 'A') : amt(d.a[1], d.q.u)),
  };
  // An option's worth: "360 N m" is 360.
  const valueOf = (s) => { const m = /^(\d+(?:\.\d+)?)/.exec(s); return m ? +m[1] : NaN; };
  // As a screen reader says it.
  const say = (s) => String(s).replace(/ /g, ' ').replace(/(\d) L\b/g, '$1 litres').replace(/(\d) V\b/g, '$1 volts').replace(/(\d) A\b/g, '$1 amps')
    .replace(/(\d) h\b/g, '$1 hours').replace(/(\d) N m\b/g, '$1 newton metres').replace(/\bN m\b/g, 'newton metres').replace(/(\d) rpm\b/g, '$1 revolutions a minute').replace(/\brpm\b/g, 'revolutions a minute')
    .replace(/ : /g, ' to ').replace(/×/g, ' times ').replace(/÷/g, ' divided by ').replace(/=/g, ' equals ').replace(/−/g, ' minus ').replace(/\s+/g, ' ').trim();

  function blank(i) { return { pick: null, res: null, why: false, mark: null }; }
  const emptyFor = (i, st) => (st.pick != null ? '' : PICK);
  const isEmpty = (i, st) => !!emptyFor(i, st);
  const isRight = (i, st) => !isEmpty(i, st) && st.pick === STEPS[i].want;
  // A wrong answer's hint names its slip.
  const hintFor = (i, st) => { const d = STEPS[i]; return (d.hints && d.hints[st.pick]) || d.hint; };
  // A step answered right (the timing check draws each one this way).
  function solved(i) { const st = blank(i); st.pick = STEPS[i].want; st.res = 'right'; return st; }

  let S = STEPS.map((d, i) => blank(i));
  let finished = false, lastStep = -1, lastDone = false, T = Infinity;   // T: seconds into the current motion
  let motion = null, motionEnd = 0;                                      // what is moving: 'demo' or 'fb'

  // ---------- text with amber key terms (built with K.el, never innerHTML) ----------
  function pieces(el, text) {
    const re = /\*([^*]+)\*/g;
    let at = 0, m;
    while ((m = re.exec(text))) {
      if (m.index > at) el.appendChild(document.createTextNode(text.slice(at, m.index)));
      el.appendChild(K.el('span', { class: 'term' }, m[1]));
      at = m.index + m[0].length;
    }
    if (at < text.length) el.appendChild(document.createTextNode(text.slice(at)));
  }
  // A sum, an amount or a ratio stays together on one line ("3 × 1 = 3", "÷ 2", "10 : 1", "230 V"),
  // with the stop after it; a long one may break only before an equals sign.
  const TOK = '[−+]?\\d+(?:\\.\\d+)?(?: (?:bar|min|rpm|N m|[VALhm])(?![A-Za-z]))?';
  const GLUE = new RegExp('(?:[×÷] )?' + TOK + '(?: [+−=×÷:] ' + TOK + ')*[.,?!;]?', 'g');
  function write(el, text) {
    el.textContent = '';
    let at = 0, m;
    GLUE.lastIndex = 0;
    while ((m = GLUE.exec(text))) {
      if (m.index > at) pieces(el, text.slice(at, m.index));
      const bits = m[0].length > 18 ? m[0].split(/ (?==)/) : [m[0]];
      bits.forEach((b, k) => {
        if (k) el.appendChild(document.createTextNode(' '));
        if (/ /.test(b)) el.appendChild(K.el('span', { class: 'nw' }, b));
        else el.appendChild(document.createTextNode(b));
      });
      at = m.index + m[0].length;
    }
    if (at < text.length) pieces(el, text.slice(at));
  }

  // ---------- controls ----------
  const stepper = K.stepper({ id: 'step', label: 'Step', steps: STEPS.map((d) => d.name), value: 0, compact: true, into: '#prog' });
  const nav = document.getElementById('nav');
  const at = () => stepper.get();

  // Up to three answer buttons; each step fills in its own options.
  const pickBtns = [0, 1, 2].map((k) => K.button({ label: 'Answer ' + (k + 1), secondary: true, into: '#picks', press: () => {
    const i = at(), d = STEPS[i], st = S[i];

    st.pick = d.opts[k]; st.res = null;
  } }));

  // Check: marks the answer; a right one plays its picture's motion.
  const checkBtn = K.button({ label: 'Check', into: '#acts', press: () => {
    const i = at(), d = STEPS[i], st = S[i];
    if (d.show || finished) return;
    if (isEmpty(i, st)) { st.res = 'empty'; return; }
    st.res = isRight(i, st) ? 'right' : 'wrong';
    if (st.res === 'right') play(d.fb, 'fb');
  } });
  const whyBtn = K.button({ label: 'Why?', secondary: true, into: '#acts', press: () => {
    if (STEPS[at()].show || finished) return;

  } });
  const replayBtn = K.button({ label: 'Play again', secondary: true, into: '#replay', press: () => {

  const backBtn = K.button({ label: 'Back', secondary: true, into: '#nav', press: () => {

  const nextBtn = K.button({ label: 'Continue', into: '#nav', press: () => {

  } });

  // One animation plays each demonstration and the motion after a right answer, from its start;
  // with reduced motion (and while the self-test looks) it opens finished.
  const anim = K.anim({ button: false, label: 'Demonstration', step: (dt) => {
    if (finished) return false;
    T += dt;
    paint();
    return T < motionEnd;

  // resumes it when he comes back; this only settles a motion that had already stopped.
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !anim.playing() && T !== Infinity) { T = Infinity; paint(); } });
  function play(dur, kind) {
    motion = kind;

    motionEnd = dur; T = 0; anim.play();

  // A new screen (or the finish panel) fades in softly: the CSS animation restarts on it.
  function enter(id) {
    if (REDUCE) return;

    box.classList.remove('enter');
    void box.offsetWidth;
    box.classList.add('enter');
  }

  // ---------- drawing ----------
  const svg = document.getElementById('scene'), art = document.getElementById('art'), ui = document.getElementById('ui');
  let H = 160;
  let into = null;                                   // where shapes go: the picture, or a part that is arriving
  const add = (node) => (into || art).appendChild(node);
  // How far a part due at t0 has arrived (K.arrive), noting the timetable for the timing check.
  let latest = 0, earliest = Infinity;

  function lin(t0, d) {

  }
  // A part arriving: drawn into a group faded in to a and risen `rise` units into place; nothing before it starts.
  function part(a, rise, draw) {
    if (a <= 0) return;
    const g = add(K.svg('g'));
    K.fade(g, a, rise);
    const keep = into; into = g; draw(); into = keep;
  }
  // A part leaving: faded out as a goes 0 -> 1.
  function leave(a, draw) {
    if (a >= 1) return;

    const keep = into; into = g; draw(); into = keep;
  }
  const rect = (cls, x, y, w, h, rx) => add(K.svg('rect', { class: cls, x: x, y: y, width: Math.max(0, w), height: Math.max(0, h), rx: rx || 0 }));
  const line = (cls, x1, y1, x2, y2) => add(K.svg('line', { class: cls, x1: x1, y1: y1, x2: x2, y2: y2 }));
  const circle = (cls, cx, cy, r) => add(K.svg('circle', { class: cls, cx: cx, cy: cy, r: r }));
  const poly = (cls, pts) => add(K.svg('polyline', { class: cls, points: pts.map((p) => p.join(',')).join(' ') }));
  const text = (x, y, s, cls, anchor) => add(K.svg('text', { class: cls, x: x, y: y, 'text-anchor': anchor || 'middle' }, String(s)));
  // Spaces that SVG keeps (and measures), so a highlight under part of a line lines up with it.
  const nb = (s) => String(s).replace(/ /g, ' ');
  // The width of a line of text (measured once it can be; estimated while the scene is hidden).
  const widths = {};
  function tw(s, cls) {
    const key = cls + '|' + s;

    let w = 0;
    try { w = t.getComputedTextLength(); } catch (e) { w = 0; }
    svg.removeChild(t);

  }
  // A bracket from x0 to x1 at y (or, upright, from y0 to y1 at x): a line with a short stroke at each end.
  function bracket(cls, x0, x1, y) { line(cls, x0, y, x1, y); line(cls, x0, y - 5, x0, y + 5); line(cls, x1, y - 5, x1, y + 5); }
  function upright(cls, x, y0, y1) { line(cls, x, y0, x, y1); line(cls, x - 5, y0, x + 5, y0); line(cls, x - 5, y1, x + 5, y1); }
  // A line of working, right-aligned at y, with the part that does the work highlighted.
  function workRow(s, y, cls, hl) {
    const x0 = 334 - tw(nb(s), 'wk');
    if (hl) { const i = s.indexOf(hl); rect('hl', x0 + (i > 0 ? tw(nb(s.slice(0, i)), 'wk') : 0) - 4, y - 18, tw(nb(hl), 'wk') + 8, 25, 5); }
    text(x0, y, nb(s), 'wk' + (cls ? ' ' + cls : ''), 'start');
  }
  // An arrowhead at (x, y) pointing along (dx, dy).

    add(K.svg('path', { class: 'head' + (wrong ? ' wrong' : ''), d: 'M' + r3(x) + ' ' + r3(y) + ' L' + r3(x - 8 * ux + 4.5 * px) + ' ' + r3(y - 8 * uy + 4.5 * py) + ' L' + r3(x - 8 * ux - 4.5 * px) + ' ' + r3(y - 8 * uy - 4.5 * py) + ' Z' }));
  }

  // --- the blocks ---
  // Blocks BS across, BP apart, from BLX; the rectangle's foot at BB (set for each screen, to fit its
  // tallest stack). Block (c, r) is c from the left and r up from the foot.
  const BLX = 30, BP = 24, BS = 22;
  let BB = 110;

  function blockLabels(w, h) {

  // the others: the same blocks, w1 wide and twice as tall. The labels and working change as they land.
  function drawBlocks(d, st, right) {
    const B = d.blk, h1 = blkH1(B), A = d.show ? AT[d.demo] : d.at, moving = !!(d.show || right);
    BB = 14 + Math.max(B.h0, h1) * BP;
    const off = moving ? arr(A.off, 0.4) : 0, u = moving ? lin(A.go[0], A.go[1]) : 0;
    const lab = moving ? arr(A.lab) : 0, wA = moving ? arr(A.work) : 0;
    const up = K.ease(K.clamp(u / 0.45, 0, 1)), across = K.ease(K.clamp((u - 0.45) / 0.55, 0, 1));
    for (let c = 0; c < B.w0; c++) {

      }
    }
    const w0 = blkWork(B.w0, B.h0), w1 = blkWork(B.w1, h1);
    leave(off, () => { blockLabels(B.w0, B.h0); workRow(w0.s, H - 12); });
    part(lab, 4, () => blockLabels(B.w1, h1));
    part(wA, 6, () => workRow(w1.s, H - 12));

    return n + ' blocks in a rectangle, ' + (landed ? B.w1 + ' wide and ' + h1 + ' tall' : B.w0 + ' wide and ' + B.h0 + ' tall') +
      (lifting ? ', the right-hand half lifting and sliding onto the left-hand half.' : '.') +
      (off < 0.5 ? ' At the foot: ' + say(w0.s) + '.' : wA >= 0.5 ? ' At the foot: ' + say(w1.s) + '.' : '');
  }

  // --- the ratio table ---
  // Row names at NX; the table's columns CW apart from TX, its rows CH tall, its top at TY; the working
  // at the foot, a row (or two on the SHOW screen) under it.
  const NX = 6, TX = 72, CW = 86, CH = 28, TY = 34;
  const cx = (k) => TX + k * CW + (CW - 12) / 2;
  function colBox(k) { rect('col', TX + k * CW, TY, CW - 12, 2 * CH, 6); line('mid', TX + k * CW, TY + CH, TX + k * CW + CW - 12, TY + CH); }
  const cell = (k, r, v, cls) => text(cx(k), TY + r * CH + 19, num(v), cls || 'val');
  function gapCell(k, r) { rect('gapbox', cx(k) - 17, TY + r * CH + 5, 34, CH - 10, 5); text(cx(k), TY + r * CH + 19, '?', 'qm'); }
  function column(k, c) { colBox(k); cell(k, 0, c[0]); cell(k, 1, c[1]); }
  const names = (list) => list.forEach((s, r) => text(NX, TY + r * CH + 19, s, 'rname', 'start'));
  // A step from column k0 to k1 on one row: an arrow curving over the top row (r 0) or under the bottom

  function arc(k0, k1, r, op, wrong) {
    const dir = k1 > k0 ? 1 : -1, x0 = cx(k0) + 14 * dir, x1 = cx(k1) - 14 * dir, xm = (x0 + x1) / 2;
    const g = r ? [TY + 2 * CH + 3, TY + 2 * CH + 21, TY + 2 * CH + 30] : [TY - 3, TY - 21, TY - 19];
    add(K.svg('path', { class: 'arc' + (wrong ? ' wrong' : ''), d: 'M' + x0 + ' ' + g[0] + ' Q' + xm + ' ' + g[1] + ' ' + x1 + ' ' + g[0] }));

  // The SHOW screen: from width 6, height 2 to width 3. The step over the top row is ÷ 2. Taken the

  // the warning colour; that leaves, and the opposite step, × 2, gives 4, and 3 × 4 = 12.
  function demoOpp(d) {
    const A = AT.opp, c0 = d.cols[0], c1 = d.cols[1], slipV = r3(c0[1] / 2);
    const top = arr(A.top), sl = arr(A.slip), sv = arr(A.sval), sw = arr(A.swork), off = arr(A.off, 0.4), rt = arr(A.right), an = arr(A.ans);
    const w0 = blkWork(c0[0], c0[1]), wS = blkWork(c1[0], slipV), w1 = blkWork(c1[0], c1[1]);
    column(0, c0); colBox(1); cell(1, 0, c1[0]);
    part(top, 0, () => arc(0, 1, 0, d.op[0]));
    leave(arr(A.slip, 0.25), () => gapCell(1, 1));
    leave(off, () => {
      part(sl, 0, () => arc(0, 1, 1, d.slipOp, true));
      part(sv, 4, () => cell(1, 1, slipV, 'val bad'));
      part(sw, 6, () => workRow(wS.s, W2, 'bad'));
    });
    part(rt, 0, () => arc(0, 1, 1, d.op[1]));
    part(an, 4, () => cell(1, 1, c1[1]));

  }

  // --- the cylinder and its rectangle ---

    for (let i = 0; i < Math.ceil(V - 1e-9); i++) {

    line('wall', X0 - 3, CY1, xe, CY1);
    line('wall', X0 - 3, CY0, X0 - 3, CY1);

  }
  const cylWork = (C, v) => num(C.v0) + ' × ' + num(pAbs0(C)) + ' = ' + num(v) + ' × ' + num(pAt(C, v));
  // A demonstration: the piston slides from v0 to v1 (or sits where Dan dragged it); the rectangle's
  // width follows the gas and its height the absolute pressure. A puzzle: the start, and after a right
  // answer the same slide. The labels (volume, absolute pressure, gauge reading) count through `counts`.
  function drawCyl(d, st, right) {
    const C = d.cyl, sc = cylScale(d), A = d.show ? AT[d.demo] : d.at, v1 = vEnd(C), mine = !!d.show && st.mark != null;

      d.snapV.every((v) => same(v * pAt(d.cyl, v), 6) && snapOf(d, X0 + GDX + v * sc.kx) === v) && snapOf(d, -100) === 1.5 && snapOf(d, 900) === 6 && d.cyl.counts.every((v) => d.snapV.indexOf(v) >= 0);
  });
  // Drawn from the lesson's own timetable: each screen is painted finished and every arrival it used is noted.
  K.check('Every demonstration has finished arriving within 4.5 s of its screen opening, none starting before the 0.35 s screen fade ends; every answer\'s motion within 2.5 s; parts start at least 0.45 s apart, each once the travel before it has ended; and each counted volume holds at least 0.2 s', () => {
    const keepT = T;
    const ok = STEPS.every((d, i) => {
      const keepS = S[i];
      T = Infinity; latest = 0; earliest = Infinity;
      S[i] = d.show ? blank(i) : solved(i);
      try { paint(i); } finally { S[i] = keepS; }
      return d.show ? latest <= d.dur + 1e-9 && d.dur <= 4.5 && d.dur >= 3 && earliest >= FADE : latest <= d.fb + 1e-9 && d.fb <= 2.5;
    });
    T = keepT; paint();
    const spaced = (A) => {
      const ps = Object.keys(A).map((k) => (Array.isArray(A[k]) ? [A[k][0], A[k][0] + A[k][1]] : [A[k], A[k]])).sort((a, b) => a[0] - b[0]);
      let end = -Infinity;
      return ps.every((q, k) => {
        const good = k === 0 || q[0] === ps[k - 1][0] || (q[0] - ps[k - 1][0] >= 0.45 - 1e-9 && q[0] >= end + 0.1 - 1e-9);
        end = Math.max(end, q[1]);
        return good;
      });
    };
    // each counted volume, on every cylinder that moves, held at least 0.2 s as the piston slides
    const holds = CYLS.every((d) => {
      const C = d.cyl, A = d.show ? AT[d.demo] : d.at, v1 = vEnd(C), seen = [];
      for (let t = 0; t <= A.go[1] + 1e-9; t += 0.005) { const v = C.v0 + (v1 - C.v0) * K.arrive(A.go[0] + t, A.go[0], A.go[1]); seen.push(passed(C.counts, v)); }
      return C.counts.slice(0, -1).every((c) => seen.filter((s) => s === c).length * 0.005 >= 0.2) && seen[seen.length - 1] === v1;
    });
    return ok && holds && Object.keys(AT).every((k) => spaced(AT[k])) && DO.every((i) => spaced(STEPS[i].at));
  });

  K.ready();
</script>
