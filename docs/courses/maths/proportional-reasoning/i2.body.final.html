<script>
  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // dur: how long a demonstration plays; fb: how long the motion after a right answer plays (seconds).
  // pic: the picture, 'mix' (blocks above a ratio table), 'table' (the table alone) or 'line' (a double
  // number line for a scale). names: the table's two rows, in the ratio's order. On a SHOW step, cols:
  // the table's columns [first, second] and ops: the step between each pair; batch: one batch, the
  // simplest ratio. On a DO step, ask says what the puzzle wants: 'fill' the missing amount when
  // `given` of the first goes with a ratio (`via`: through one batch first), 'same' the ratio × `by`,
  // 'simp' the simplest ratio, 'up' the real length of `cm` on a drawing at 1 : scale, 'down' the
  // drawing length of `m` metres. slips: which mistake gives each wrong answer (SLIP below). at: when
  // each part of the motion after a right answer arrives, in seconds after Check.
  const PICK = 'Tap one of the answers.';
  const MIX = ['Squash', 'Water'];
  // After a right answer: the step is written over and under the table; the missing amount fills in;
  // the blocks slide into batches, or more arrive, or all but one batch leave; each batch is named.
  const FILLMIX = { arcs: 0.1, ans: 0.6, slide: [1.1, 0.6], grow: 1.8, labs: 1.8 };
  const SAMEMIX = { arcs: 0.1, ans: 0.6, grow: 1.1, labs: 1.6 };
  const SIMPMIX = { arcs: 0.1, slide: [0.1, 0.5], ans: 0.7, labs: 0.7, cut: 1.3 };
  const UPLINE = { arrow: 0.1, ans: 0.55 };
  const DOWNLINE = { arrow: 0.1, real: 0.55, ans: 1.0 };
  const FILLTAB = { arcs: 0.1, ans: 0.55 };
  const VIATAB = { via: 0.1, viaval: 0.55, arcs: 1.0, ans: 1.45 };
  const STEPS = [
    { show: true, demo: 'copies', pic: 'mix', dur: 3.0, names: MIX, batch: [3, 2], cols: [[3, 2], [6, 4]], ops: ['× 2'], name: 'Two batches',
      text: 'Two batches of a 3 : 2 mix make 6 : 4. Both parts are doubled. 3 : 2 and 6 : 4 are *equivalent ratios*, like equivalent fractions.' },
    { kind: 'pick', ask: 'fill', pic: 'mix', names: MIX, ratio: [3, 2], given: 9, unit: '', name: 'Three batches',
      opts: ['8', '6', '13.5'], want: '6', slips: { '8': 'add', '13.5': 'flip' }, fb: 2.45, at: FILLMIX,
      task: 'A mix is 3 : 2, squash to water. How many parts of water go with 9 parts of squash?',
      why: '9 is 3 × 3, so that is three batches. The water is × 3 too, and 2 × 3 = 6, which makes 9 : 6. Adding 6 to both parts would give 9 : 8, a weaker mix.',
      hint: 'Not quite. How many batches of 3 make 9?',
      hints: { '8': 'Not quite. That adds 6 to both parts. 9 is three lots of 3, so the water is three lots of 2.',
        '13.5': 'Not quite. That reads the ratio the wrong way round. Squash comes first, 3 for every 2 water.' } },
    { show: true, demo: 'add', pic: 'mix', dur: 3.0, names: MIX, batch: [3, 2], cols: [[3, 2]], op: '+ 3', tries: ['× 2', '× 3', '+ 1', '+ 3'], name: 'Adding changes it',
      text: 'Adding the same number to both parts changes this mix. 3 : 2 with 3 more of each is 6 : 5, one water too many for two batches. Tap a button to try others.' },
    { kind: 'pick', ask: 'same', pic: 'mix', names: MIX, ratio: [1, 4], by: 2, name: 'Same mix?',
      opts: ['2 : 5', '4 : 7', '2 : 8'], want: '2 : 8', slips: { '2 : 5': 'add1', '4 : 7': 'add3' }, fb: 2.25, at: SAMEMIX,
      task: 'Another mix is 1 : 4, squash to water. Which of these is the same mix?',
      why: '2 : 8 is 1 : 4 with both parts × 2, which is two whole batches. 2 : 5 adds 1 to both parts and 4 : 7 adds 3, so both change the mix.',
      hint: 'Not quite. Look for both parts multiplied by the same number.',
      hints: { '2 : 5': 'Not quite. That adds 1 to both parts, which changes the mix. Multiply both parts instead.',
        '4 : 7': 'Not quite. That adds 3 to both parts. Look for both parts times the same number.' } },
    { show: true, demo: 'join', pic: 'mix', dur: 3.0, names: MIX, batch: [3, 2], cols: [[12, 8], [3, 2]], ops: ['÷ 4'], name: 'One batch',
      text: 'Dividing both parts by the same number keeps the mix too. 12 : 8 is four batches of 3 : 2, so ÷ 4 gives one batch. Dividing as far as it goes is *simplifying*.' },
    { kind: 'pick', ask: 'simp', pic: 'mix', names: MIX, ratio: [20, 12], name: 'As far as it goes',
      opts: ['5 : 3', '10 : 6', '5 : 12'], want: '5 : 3', slips: { '10 : 6': 'half', '5 : 12': 'one' }, fb: 2.0, at: SIMPMIX,
      task: 'A mix is 20 : 12. Simplify it as far as it goes.',
      why: '20 and 12 both divide by 4, so 20 : 12 is four batches of 5 : 3. 10 : 6 is the same mix, but both parts still divide by 2. Only 1 divides both 5 and 3.',
      hint: 'Not quite. Find the biggest number that divides both 20 and 12.',
      hints: { '10 : 6': 'Not quite. 10 : 6 is the same mix, but both parts still divide by 2.',
        '5 : 12': 'Not quite. That divides only the first part. Divide both parts by the same number.' } },
    { show: true, demo: 'scale', pic: 'line', dur: 4.5, scale: 100, from: 1, to: 5, range: [0.5, 8], snap: 0.5, drag: true, name: 'A scale drawing',
      text: 'At a *scale* of 1 : 100, 1 cm on a drawing stands for 100 cm, which is 1 m. The two lines stay locked together. Drag the mark to try other lengths.' },
    { kind: 'pick', ask: 'up', pic: 'line', scale: 100, cm: 4.5, name: 'Real length',
      opts: ['450 m', '103.5 cm', '4.5 m'], want: '4.5 m', slips: { '450 m': 'unitm', '103.5 cm': 'gap' }, fb: 1.45, at: UPLINE,
      task: 'On a 1 : 100 drawing, a wall is 4.5 cm long. How long is the real wall?',
      why: 'The real wall is 100 times as long, and 4.5 × 100 = 450 cm. 100 cm make 1 m, so that is 4.5 m. Both parts of 1 : 100 are in the same unit.',
      hint: 'Not quite. The real wall is 100 times as long, in centimetres.',
      hints: { '450 m': 'Not quite. 4.5 × 100 = 450, but in centimetres, the drawing\'s unit. Turn 450 cm into metres.',
        '103.5 cm': 'Not quite. That adds 99, the gap between 1 and 100. A scale multiplies, so the wall is 100 times as long.' } },
    { kind: 'pick', ask: 'down', pic: 'line', scale: 100, m: 7, name: 'On the drawing',
      opts: ['700 cm', '7 cm', '0.07 cm'], want: '7 cm', slips: { '700 cm': 'real', '0.07 cm': 'unitcm' }, fb: 1.9, at: DOWNLINE,
      task: 'A room is 7 m long. How long is it on a 1 : 100 drawing?',
      why: '7 m is 700 cm, and the drawing is 100 times smaller, so 700 ÷ 100 = 7 cm. At 1 : 100, each metre is a centimetre on the drawing.',
      hint: 'Not quite. Turn 7 m into centimetres, then make it 100 times smaller.',
      hints: { '700 cm': 'Not quite. That is the real length in centimetres. The drawing is 100 times smaller.',
        '0.07 cm': 'Not quite. 7 ÷ 100 = 0.07, but in metres. Turn 0.07 m into centimetres.' } },
    { show: true, demo: 'steps', pic: 'mix', dur: 4.2, names: MIX, batch: [2, 3], cols: [[6, 9], [2, 3], [8, 12]], ops: ['÷ 3', '× 4'], name: 'Through one batch',
      text: 'To scale 6 : 9 up to 8 squash, go through one batch. ÷ 3 gives 2 : 3, then × 4 gives 8 : 12. A *ratio table* can take as many steps as you need.' },
    { kind: 'pick', ask: 'fill', pic: 'table', names: ['Engine', 'Shaft'], note: 'Speeds in rpm', ratio: [2, 1], given: 1800, unit: 'rpm', name: 'A gearbox',
      opts: ['900 rpm', '3,600 rpm', '1,799 rpm'], want: '900 rpm', slips: { '1,799 rpm': 'add', '3,600 rpm': 'flip' }, fb: 1.45, at: FILLTAB,
      task: 'A reduction gearbox lowers speed 2 : 1, engine to shaft. The engine turns at 1,800 rpm. How fast does the shaft turn?',
      why: 'The engine turns twice for each turn of the shaft. 1,800 is 2 × 900, so both parts are × 900 and the shaft turns at 900 rpm.',
      hint: 'Not quite. What number takes 2 up to 1,800?',
      hints: { '1,799 rpm': 'Not quite. That keeps the gap of 1, as if adding. Multiply both parts by the same number.',
        '3,600 rpm': 'Not quite. The engine is the 2, the faster one, so the shaft turns slower.' } },
    { kind: 'pick', ask: 'fill', pic: 'table', names: MIX, ratio: [4, 6], via: true, given: 10, unit: '', name: 'Put it together',
      opts: ['12', '60', '15'], want: '15', slips: { '12': 'add', '60': 'batches' }, fb: 2.35, at: VIATAB,
      task: 'Put it together. A mix is 4 : 6, squash to water. How many parts of water go with 10 parts of squash?',
      why: '4 : 6 simplifies to 2 : 3, one batch. 10 squash is 5 batches, so the water is 3 × 5 = 15. Adding 6 to both parts would give 10 : 12, which changes the mix.',
      hint: 'Not quite. Simplify 4 : 6 first, then scale up.',
      hints: { '12': 'Not quite. That adds 6 to both parts. Go through one batch, 2 : 3, then multiply.',
        '60': 'Not quite. 10 squash is not 10 batches of 4 : 6. Go through one batch first.' } },
  ];
  const FINISH = 'To keep a ratio, multiply or divide both parts by the same number, so 3 : 2 is also 6 : 4 and 30 : 20. Adding the same number to both parts changes a ratio like 3 : 2. A scale such as 1 : 100 multiplies too, once both parts are in the same unit.';
  // When each demonstration's parts arrive, in seconds after the screen opens (the screen itself
  // takes FADE to fade in, so nothing starts before it has settled). grow: more blocks arriving; labs:
  // each batch named under it; arcs: the step written over and under the table; ans: the new column;
  // over: the blocks left over ringed; cut: all but one batch leaving; arrow: the scale's × 100 between
  // the lines; mark: the marked length on both lines; go: the mark travelling [start, how long]; grip:
  // the mark's thumb, to drag.
  const FADE = 0.35;
  const AT = {
    copies: { grow: 0.6, labs: 1.2, arcs: 1.8, ans: 2.4 },
    add: { arcs: 0.6, grow: 1.2, ans: 1.8, over: 2.4 },
    join: { labs: 0.6, arcs: 1.2, cut: 1.8, ans: 2.4 },
    scale: { arrow: 0.6, mark: 1.2, go: [1.8, 1.6], grip: 3.9 },
    steps: { arcs: 0.6, cut: 1.2, ans: 1.8, arcs2: 2.4, grow: 3.0, ans2: 3.6 },
  };
  // A step tapped on the adding screen plays like an answer: the step, the blocks, the column, any left over.
  const TRY = { arcs: 0.1, grow: 0.55, ans: 1.0, over: 1.45 }, TRYDUR = 2.1;
  // Drawing sizes, in viewBox units (340 wide). Row names at NX. Blocks from BX, at most BW across, in two
  // rows at BR (BHT tall, BG apart, batches BATCH apart), labelled at LABY. The table's columns are CW
  // apart from TX, its rows CH tall, its top at TY. The number lines run from LX0 to LX1 (0 to LMAX cm)
  // at TL (the drawing) and BL (real life). HOF: each picture's height.
  const NX = 6, BX = 66, BW = 268, BR = [8, 34], BHT = 20, BG = 3, BATCH = 10, LABY = 70;
  const TX = 66, CW = 88, CH = 28, TY = { mix: 106, table: 34 };
  const LX0 = 84, LX1 = 326, LMAX = 8, TL = 50, BL = 120;
  const HOF = { mix: 198, table: 126, line: 164 };
  let H = HOF.mix;
  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  // While the kit's self-test looks at every screen it switches fades off (the k-testing class):
  // demonstrations then open finished, as they do with reduced motion.
  const testing = () => document.documentElement.classList.contains('k-testing');

  // ---------- numbers (pure, so the checks can test them) ----------
  const r3 = (v) => Math.round(v * 1000) / 1000;
  const M = '−';
  // A number as Dan reads it: at most three decimal places, thousands with a comma (1,800).
  const num = (v) => { const p = String(r3(v)).split('.'); return p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (p[1] ? '.' + p[1] : ''); };
  const withUnit = (v, u) => num(v) + (u ? ' ' + u : '');
  const rat = (a, b) => num(a) + ' : ' + num(b);
  const gcd = (a, b) => (b ? gcd(b, a % b) : a);
  const simplest = (c) => { const g = gcd(c[0], c[1]); return [c[0] / g, c[1] / g]; };
  // A step on both parts: '× 2', '÷ 4', or the slip, '+ 3'.
  function apply(op, c) {
    const k = Number(op.slice(2));
    return op[0] === '×' ? [c[0] * k, c[1] * k] : op[0] === '÷' ? [c[0] / k, c[1] / k] : [c[0] + k, c[1] + k];
  }
  const sameMix = (p, q) => p[0] * q[1] === p[1] * q[0];
  // A step's table, finished: its columns and the step between each pair (bad: the step is the slip).
  function tableOf(d) {
    if (d.show) return d.cols && d.demo !== 'add' ? { cols: d.cols, ops: d.ops } : d.demo === 'add' ? { cols: [d.cols[0], apply(d.op, d.cols[0])], ops: [d.op], bad: true } : null;
    if (d.ask === 'same') return { cols: [d.ratio, apply('× ' + d.by, d.ratio)], ops: ['× ' + d.by] };
    if (d.ask === 'simp') { const g = gcd(d.ratio[0], d.ratio[1]); return { cols: [d.ratio, simplest(d.ratio)], ops: ['÷ ' + g] }; }
    if (d.ask !== 'fill') return null;
    const out = [d.given, d.ratio[1] * d.given / d.ratio[0]];
    if (!d.via) return { cols: [d.ratio, out], ops: ['× ' + num(d.given / d.ratio[0])] };
    const one = simplest(d.ratio);
    return { cols: [d.ratio, one, out], ops: ['÷ ' + gcd(d.ratio[0], d.ratio[1]), '× ' + num(d.given / one[0])] };
  }
  // At 1 : scale, c cm on the drawing is c × scale cm in real life, which is c × scale ÷ 100 m.
  const realCm = (c, scale) => r3(c * scale);
  const realText = (c, scale) => num(realCm(c, scale)) + ' cm = ' + num(realCm(c, scale) / 100) + ' m';
  // The answer a puzzle wants, worked out by its rule, as its button reads.
  function answerOf(d) {
    if (d.ask === 'fill') return withUnit(d.ratio[1] * d.given / d.ratio[0], d.unit);
    if (d.ask === 'same') return rat(d.ratio[0] * d.by, d.ratio[1] * d.by);
    if (d.ask === 'simp') return rat.apply(null, simplest(d.ratio));
    if (d.ask === 'up') return num(realCm(d.cm, d.scale) / 100) + ' m';
    return num(d.m * 100 / d.scale) + ' cm';
  }
  // What each slip makes of the answer: the gap between the parts kept, as if adding; the ratio read
  // backwards; the amount taken as the number of batches; 1 or 3 added to both parts; a ratio halved but
  // not simplified; only the first part divided; centimetres read as metres; the gap of 99 added; the
  // real length given for the drawing's; metres ÷ 100 read as centimetres.
  const SLIP = {
    add: (d) => withUnit(d.ratio[1] + d.given - d.ratio[0], d.unit),
    flip: (d) => withUnit(d.given * d.ratio[0] / d.ratio[1], d.unit),
    batches: (d) => withUnit(d.ratio[1] * d.given, d.unit),
    add1: (d) => rat(d.ratio[0] + 1, d.ratio[1] + 1),
    add3: (d) => rat(d.ratio[0] + 3, d.ratio[1] + 3),
    half: (d) => rat(d.ratio[0] / 2, d.ratio[1] / 2),
    one: (d) => rat(d.ratio[0] / gcd(d.ratio[0], d.ratio[1]), d.ratio[1]),
    unitm: (d) => num(realCm(d.cm, d.scale)) + ' m',
    gap: (d) => num(d.cm + d.scale - 1) + ' cm',
    real: (d) => num(d.m * 100) + ' cm',
    unitcm: (d) => num(d.m / d.scale) + ' cm',
  };
  // What a puzzle's picture must not show before the answer.
  function hiddenOf(d) {
    const t = tableOf(d);
    if (t) { const last = t.cols[t.cols.length - 1]; return d.ask === 'fill' ? [num(last[1])] : last.map(num); }
    return d.ask === 'up' ? [num(realCm(d.cm, d.scale)), answerOf(d)] : [num(d.m * 100), answerOf(d)];
  }
  // As a screen reader says it.
  const say = (s) => String(s).replace(/(\d) : (\d)/g, '$1 to $2').replace(/(\d) cm\b/g, '$1 centimetres').replace(/(\d) m\b/g, '$1 metres').replace(/ rpm\b/g, ' r p m')
    .replace(/×/g, ' times ').replace(/÷/g, ' divided by ').replace(/=/g, ' equals ').replace(/\+/g, ' plus ').replace(/−/g, ' minus ').replace(/ /g, ' ').replace(/\s+/g, ' ').trim();
  const WORD = ['no', 'one', 'two', 'three', 'four', 'five', 'six'];

  function blank(i) { return { pick: null, res: null, why: false, mark: null, op: null }; }
  const emptyFor = (i, st) => (st.pick != null ? '' : PICK);
  const isEmpty = (i, st) => !!emptyFor(i, st);
  const isRight = (i, st) => !isEmpty(i, st) && st.pick === STEPS[i].want;
  // A wrong answer's hint names its slip.
  const hintFor = (i, st) => { const d = STEPS[i]; return (d.hints && d.hints[st.pick]) || d.hint; };
  // A step answered right (the timing check draws each one this way).
  function solved(i) { const st = blank(i); st.pick = STEPS[i].want; st.res = 'right'; return st; }

  let S = STEPS.map((d, i) => blank(i));
  let finished = false, lastStep = -1, lastDone = false, T = Infinity;   // T: seconds into the current motion
  let motion = null, motionEnd = 0;                                      // what is moving: 'demo', 'try' or 'fb'

  // ---------- text with amber key terms (built with K.el, never innerHTML) ----------
  function pieces(el, text) {
    const re = /\*([^*]+)\*/g;
    let at = 0, m;
    while ((m = re.exec(text))) {
      if (m.index > at) el.appendChild(document.createTextNode(text.slice(at, m.index)));
      el.appendChild(K.el('span', { class: 'term' }, m[1]));
      at = m.index + m[0].length;
    }
    if (at < text.length) el.appendChild(document.createTextNode(text.slice(at)));
  }
  // A ratio, a sum, an amount or a step stays together on one line ("3 : 2", "4.5 × 100 = 450 cm",
  // "1,800 rpm", "÷ 4"), with the stop after it; a long one may break only before an equals sign.
  const TOK = '[−+]?(?:\\d{1,3}(?:,\\d{3})+|\\d+)(?:\\.\\d+)?(?: (?:cm|rpm|m)(?![a-z]))?';
  const GLUE = new RegExp('(?:[×÷+] )?' + TOK + '(?: [+−=×÷:] ' + TOK + ')*[.,?!;]?', 'g');
  function write(el, text) {
    el.textContent = '';
    let at = 0, m;
    GLUE.lastIndex = 0;
    while ((m = GLUE.exec(text))) {
      if (m.index > at) pieces(el, text.slice(at, m.index));
      const bits = m[0].length > 18 ? m[0].split(/ (?==)/) : [m[0]];
      bits.forEach((b, k) => {
        if (k) el.appendChild(document.createTextNode(' '));
        if (/ /.test(b)) el.appendChild(K.el('span', { class: 'nw' }, b));
        else el.appendChild(document.createTextNode(b));
      });
      at = m.index + m[0].length;
    }
    if (at < text.length) pieces(el, text.slice(at));
  }

  // ---------- controls ----------
  const stepper = K.stepper({ id: 'step', label: 'Step', steps: STEPS.map((d) => d.name), value: 0, compact: true, into: '#prog' });
  const nav = document.getElementById('nav');
  const at = () => stepper.get();

  // Up to three answer buttons; each step fills in its own options.
  const pickBtns = [0, 1, 2].map((k) => K.button({ label: 'Answer ' + (k + 1), secondary: true, into: '#picks', press: () => {
    const i = at(), d = STEPS[i], st = S[i];
    if (finished || d.show || !d.opts || k >= d.opts.length || st.res === 'right') return;
    st.pick = d.opts[k]; st.res = null;
  } }));
  // The steps to try on the adding screen: each one plays on the table and the blocks.
  const tryBtns = [0, 1, 2, 3].map((k) => K.button({ label: 'Step ' + (k + 1), secondary: true, into: '#tries', press: () => {
    const i = at(), d = STEPS[i];
    if (finished || !d.tries || k >= d.tries.length) return;
    S[i].op = d.tries[k];
    K.reveal();
    play(TRYDUR, 'try');
  } }));

  // Check: marks the answer; a right one plays its picture's motion.
  const checkBtn = K.button({ label: 'Check', into: '#acts', press: () => {
    const i = at(), d = STEPS[i], st = S[i];
    if (d.show || finished) return;
    if (isEmpty(i, st)) { st.res = 'empty'; return; }
    st.res = isRight(i, st) ? 'right' : 'wrong';
    if (st.res === 'right') play(d.fb, 'fb');
  } });
  const whyBtn = K.button({ label: 'Why?', secondary: true, into: '#acts', press: () => {
    if (STEPS[at()].show || finished) return;
    const st = S[at()]; st.why = !st.why;
  } });
  const replayBtn = K.button({ label: 'Play again', secondary: true, into: '#replay', press: () => {
    const i = at(), d = STEPS[i];
    if (!d.show || finished) return;
    S[i].mark = null; S[i].op = null;
    play(d.dur, 'demo');
  } });
  const backBtn = K.button({ label: 'Back', secondary: true, into: '#nav', press: () => {
    if (finished) { finished = false; return; }
    stepper.set(Math.max(0, at() - 1), true);
  } });
  const nextBtn = K.button({ label: 'Continue', into: '#nav', press: () => {
    const i = at();
    if (finished || (!STEPS[i].show && S[i].res !== 'right')) return;
    if (i < STEPS.length - 1) { stepper.set(i + 1, true); return; }
    finished = true;
    if (typeof K.complete === 'function') K.complete();
  } });
  const againBtn = K.button({ label: 'Start again', secondary: true, into: '#again', press: () => {
    S = STEPS.map((d, i) => blank(i)); finished = false; lastStep = -1; stepper.set(0, true);
  } });

  // One animation plays each demonstration, a tapped step and the motion after a right answer, from its
  // start; with reduced motion (and while the self-test looks) it opens finished.
  const anim = K.anim({ button: false, label: 'Demonstration', step: (dt) => {
    if (finished) return false;
    T += dt;
    paint();
    return T < motionEnd;
  } });
  // The kit pauses the motion while the page is hidden (Dan switches app or locks the phone) and
  // resumes it when he comes back; this only settles a motion that had already stopped.
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !anim.playing() && T !== Infinity) { T = Infinity; paint(); } });
  function play(dur, kind) {
    motion = kind;
    if (REDUCE || testing()) { T = Infinity; anim.pause(); paint(); return; }
    motionEnd = dur; T = 0; anim.play();
  }
  // A new screen (or the finish panel) fades in softly: the CSS animation restarts on it.
  function enter(id) {
    if (REDUCE) return;
    const box = document.getElementById(id);
    box.classList.remove('enter');
    void box.offsetWidth;
    box.classList.add('enter');
  }

  // ---------- drawing ----------
  const svg = document.getElementById('scene'), art = document.getElementById('art'), ui = document.getElementById('ui');
  let into = null;                                   // where shapes go: the picture, or a part that is arriving
  const add = (node) => (into || art).appendChild(node);
  // How far a part due at t0 has arrived (K.arrive), noting the timetable for the timing check.
  let latest = 0, earliest = Infinity;
  function arr(t0, d) {
    d = d == null ? K.SOFT : d;

    if (t0 < earliest) earliest = t0;
    return K.arrive(T, t0, d);
  }
  // A part arriving: drawn into a group faded in to a and risen `rise` units into place; nothing before it starts.
  function part(a, rise, draw) {
    if (a <= 0) return;
    const g = add(K.svg('g'));
    K.fade(g, a, rise);
    const keep = into; into = g; draw(); into = keep;
  }
  // A part leaving: faded out as a goes 0 -> 1.
  function leave(a, draw) {
    if (a >= 1) return;
    const g = add(K.svg('g'));
    K.fade(g, 1 - a, 0);
    const keep = into; into = g; draw(); into = keep;
  }
  const rect = (cls, x, y, w, h, rx) => add(K.svg('rect', { class: cls, x: x, y: y, width: Math.max(0, w), height: h, rx: rx || 0 }));
  const line = (cls, x1, y1, x2, y2) => add(K.svg('line', { class: cls, x1: x1, y1: y1, x2: x2, y2: y2 }));
  const circle = (cls, cx, cy, r) => add(K.svg('circle', { class: cls, cx: cx, cy: cy, r: r }));
  const text = (x, y, s, cls, anchor) => add(K.svg('text', { class: cls, x: x, y: y, 'text-anchor': anchor || 'middle' }, String(s)));
  // The width of a line of text (measured once it can be; estimated while the scene is hidden).
  const widths = {};
  function tw(s, cls) {
    const key = cls + '|' + s;
    if (widths[key]) return widths[key];
    const t = svg.appendChild(K.svg('text', { class: cls, x: 0, y: -50 }, String(s)));
    let w = 0;
    try { w = t.getComputedTextLength(); } catch (e) { w = 0; }
    svg.removeChild(t);
    if (w > 0) { widths[key] = w; return w; }
    const size = { tagt: 15, opl: 15, val: 16, rname: 14 }[cls] || 13;
    return String(s).length * size * 0.6;
  }
  const names = (list, ys) => list.forEach((s, r) => text(NX, ys[r], s, 'rname', 'start'));

  // --- blocks ---
  // Where each block of p : q sits: in batches of a : b (n whole batches side by side, then any left
  // over), or loose, one even row each. w: the blocks' width on this screen.
  function layout(p, q, a, b, w, loose) {
    const m = Math.max(a, b), bw = m * (w + BG) - BG, n = Math.min(Math.floor(p / a + 1e-9), Math.floor(q / b + 1e-9));
    const x = (k, per) => (loose ? BX + k * (w + BG) : k < n * per ? BX + Math.floor(k / per) * (bw + BATCH) + (k % per) * (w + BG) : BX + n * (bw + BATCH) + (k - n * per) * (w + BG));
    const xs = (cnt, per) => Array.from({ length: cnt }, (u, k) => x(k, per));
    const top = xs(p, a), bot = xs(q, b), over = loose ? [0, 0] : [p - n * a, q - n * b];
    const right = Math.max(top.length ? top[top.length - 1] + w : BX, bot.length ? bot[bot.length - 1] + w : BX) + (over[0] + over[1] ? 4 : 0);
    return { top: top, bot: bot, n: loose ? 0 : n, a: a, b: b, bw: bw, w: w, over: over, right: right };
  }
  // Every arrangement of blocks a screen shows, [p, q, a, b, loose], so one block width fits them all.
  function blockSets(d) {
    if (d.pic !== 'mix') return [];
    if (d.show) {
      const [a, b] = d.batch, pairs = d.demo === 'add' ? d.tries.concat([d.op]).map((op) => apply(op, d.cols[0])) : d.cols;
      return pairs.map((c) => [c[0], c[1], a, b, false]);
    }
    const last = tableOf(d).cols[tableOf(d).cols.length - 1], [a, b] = d.ask === 'same' ? d.ratio : simplest(d.ratio);
    return [[last[0], last[1], a, b, false], [d.ask === 'simp' ? d.ratio[0] : last[0], d.ask === 'simp' ? d.ratio[1] : 0, a, b, true], [d.ratio[0], d.ratio[1], a, b, false]];
  }
  const wCache = {};
  function wOf(i) {
    if (wCache[i]) return wCache[i];
    const sets = blockSets(STEPS[i]);
    let w = 26;
    while (w > 6 && !sets.every((s) => layout(s[0], s[1], s[2], s[3], w, s[4]).right <= BX + BW)) w -= 0.5;
    return (wCache[i] = w);
  }
  // Blocks of each row at their places in L (or sliding there from `from` as s goes 0 -> 1), those keep(k, row) allows.
  function drawBlocks(L, keep, from, s) {
    [L.top, L.bot].forEach((xs, r) => xs.forEach((x, k) => {
      if (keep && !keep(k, r)) return;
      const x0 = from ? (r ? from.bot : from.top)[k] : x;
      rect(r ? 'b2' : 'b1', from ? K.lerp(x0, x, s) : x, BR[r], L.w, BHT, 3);
    }));
  }
  const batchOf = (L, k, r) => { const per = r ? L.b : L.a; return k < L.n * per ? Math.floor(k / per) : L.n; };
  const inFirst = (L) => (k, r) => batchOf(L, k, r) === 0;
  function batchLabels(L, s, only) { for (let j = 0; j < L.n; j++) if (only == null || only === j) text(BX + j * (L.bw + BATCH) + L.bw / 2, LABY, s, 'blab'); }
  // The blocks left over after the whole batches, ringed in the warning colour and named: beside the
  // ring where there is room (clear of the step written over the table), else under it.
  function overRing(L) {
    if (!(L.over[0] + L.over[1])) return;
    const x0 = BX + L.n * (L.bw + BATCH) - 3, w = Math.max(L.over[0], L.over[1]) * (L.w + BG) - BG + 6;
    const y0 = (L.over[0] ? BR[0] : BR[1]) - 3, y1 = (L.over[1] ? BR[1] : BR[0]) + BHT + 3;
    rect('over', x0, y0, w, y1 - y0, 4);
    const lw = tw('left over', 'overt');
    if (x0 + w + 6 + lw <= 338) text(x0 + w + 6, (y0 + y1) / 2 + 5, 'left over', 'overt', 'start');
    else text(K.clamp(x0 + w / 2, lw / 2 + 2, 338 - lw / 2), LABY, 'left over', 'overt');
  }
  const blockNames = (d) => names(d.names, [BR[0] + 15, BR[1] + 15]);
  function blocksSaid(d, L, shown) {
    const n0 = d.names[0].toLowerCase(), n1 = d.names[1].toLowerCase(), p = shown ? shown[0] : L.top.length, q = shown ? shown[1] : L.bot.length;
    const over = L.over[0] + L.over[1] ? ', with ' + [L.over[0] ? L.over[0] + ' ' + n0 : '', L.over[1] ? L.over[1] + ' ' + n1 : ''].filter(Boolean).join(' and ') + ' left over' : '';
    return 'Blocks in two rows, ' + p + ' ' + n0 + ' in solid ink and ' + q + ' ' + n1 + ' in a light tint' +
      (L.n && !shown ? ', in ' + WORD[L.n] + (L.n > 1 ? ' batches of ' : ' batch of ') + say(rat(L.a, L.b)) + over : '') + '. ';
  }

  // --- the ratio table ---
  const cx = (k) => TX + k * CW + (CW - 12) / 2;
  function colBox(k, ty) { rect('col', TX + k * CW, ty, CW - 12, 2 * CH, 6); line('mid', TX + k * CW, ty + CH, TX + k * CW + CW - 12, ty + CH); }
  const cell = (k, r, ty, v) => text(cx(k), ty + r * CH + 19, typeof v === 'number' ? num(v) : v, 'val');
  function gapCell(k, r, ty) { rect('gapbox', cx(k) - 17, ty + r * CH + 5, 34, CH - 10, 5); text(cx(k), ty + r * CH + 19, '?', 'qm'); }
  function column(k, ty, c) { colBox(k, ty); cell(k, 0, ty, c[0]); cell(k, 1, ty, c[1]); }
  // A cell's '?' giving way to its amount (the box fades out first, then the amount in), from t seconds.
  function swap(k, r, ty, v, t, at) {
    leave(at(t, 0.25), () => gapCell(k, r, ty));
    part(at(t + 0.25), 4, () => cell(k, r, ty, v));
  }
  // An arrowhead at (x, y) pointing along (dx, dy).
  function head(x, y, dx, dy, cls) {
    const L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L, px = -uy, py = ux;
    add(K.svg('path', { class: 'head' + cls, d: 'M' + x + ' ' + y + ' L' + r3(x - 8 * ux + 4.5 * px) + ' ' + r3(y - 8 * uy + 4.5 * py) + ' L' + r3(x - 8 * ux - 4.5 * px) + ' ' + r3(y - 8 * uy - 4.5 * py) + ' Z' }));
  }
  // The step from column k to k + 1, on an arrow curving over the top row and another under the bottom
  // row: the same step on both parts. Adding (the slip) is drawn in the warning colour.
  function arcs(k, ty, op, bad) {
    const x0 = cx(k) + 14, x1 = cx(k + 1) - 14, xm = (x0 + x1) / 2, cls = bad ? ' bad' : '';
    [[ty - 3, ty - 21, ty - 19], [ty + 2 * CH + 3, ty + 2 * CH + 21, ty + 2 * CH + 30]].forEach((g) => {
      add(K.svg('path', { class: 'arc' + cls, d: 'M' + x0 + ' ' + g[0] + ' Q' + xm + ' ' + g[1] + ' ' + x1 + ' ' + g[0] }));
      head(x1, g[0], x1 - xm, g[0] - g[1], cls);
      text(xm, g[2], op, 'opl' + cls);
    });
  }
  // A note on the units (speeds in rpm) sits to the right of the table's last column, clear of the steps.
  const tableNames = (d, ty, ncol) => { names(d.names, [ty + 19, ty + CH + 19]); if (d.note) text(TX + (ncol || 2) * CW, ty + CH + 5, d.note, 'unit', 'start'); };
  const sayCol = (c) => (c[0] === '?' || c[1] === '?' ? c.map((v) => (v === '?' ? 'a question mark' : say(typeof v === 'number' ? num(v) : v))).join(' to ') : say(rat(c[0], c[1])));
  function tableSaid(d, cols, ops) {
    return 'A ratio table with rows for ' + d.names[0].toLowerCase() + ' and ' + d.names[1].toLowerCase() + (d.note ? ', speeds in r p m' : '') + '. Its columns read ' +
      cols.map(sayCol).join(', then ') + (ops.length ? ', each step ' + ops.map(say).join(', then ') + ', written over and under both rows' : '') + '.';
  }

  // --- the double number line ---
  const lx = (c) => LX0 + (LX1 - LX0) * c / LMAX;
  const ALL = [0, 1, 2, 3, 4, 5, 6, 7, 8], PAIR = [0, 1];
  // Both lines with a tick every centimetre of the drawing, each labelled where `topLabs` / `botLabs` says.
  function lines(topLabs, botLabs, scale) {
    names(['Drawing', 'Real'], [TL + 5, BL + 5]);
    text(NX, TL + 21, 'cm', 'unit', 'start'); text(NX, BL + 21, 'cm', 'unit', 'start');
    line('nl', LX0, TL, LX1, TL); line('nl', LX0, BL, LX1, BL);
    for (let c = 0; c <= LMAX; c++) {
      line('tick', lx(c), TL - 6, lx(c), TL + 6); line('tick', lx(c), BL - 6, lx(c), BL + 6);
      if (topLabs.indexOf(c) >= 0) text(lx(c), TL + 21, num(c), 'tl');
      if (botLabs.indexOf(c) >= 0) text(lx(c), BL - 11, num(realCm(c, scale)), 'tl');
    }
  }
  // A length marked at c cm: a dot on the line and a short stem to its label.
  function markAt(top, c) {
    const x = lx(c);
    circle('dot', x, top ? TL : BL, 4.5);
    if (top) line('stem', x, TL - 14, x, TL - 4); else line('stem', x, BL + 4, x, BL + 12);
  }
  // The label: a pill above the drawing's line or below the real one ('?' as a dashed box), kept on the picture.
  function pillAt(top, c, s) {
    const x = lx(c), y = top ? TL - 38 : BL + 12;
    if (s === '?') { const x0 = K.clamp(x - 20, 2, 298); rect('gapbox', x0, y, 40, 24, 8); text(x0 + 20, y + 17, '?', 'qm'); return; }
    const w = tw(s, 'tagt') + 20, x0 = K.clamp(x - w / 2, 2, 338 - w);
    rect('tag', x0, y, w, 24, 8); text(x0 + w / 2, y + 17, s, 'tagt k-nohalo');
  }
  // A '?' kept clear of the line's ticks: above the line's name, at the left of the picture.
  function askPill(y) { rect('gapbox', NX, y, 40, 24, 8); text(NX + 20, y + 17, '?', 'qm'); }
  // The scale's step between the lines, at the left: × 100 down to real life, or ÷ 100 up to the drawing.
  function scaleArrow(op, up) {
    const x = 22, y0 = TL + 30, y1 = BL - 18;
    line('arcl', x, up ? y0 + 6 : y0, x, up ? y1 : y1 - 6);
    head(x, up ? y0 : y1, 0, up ? -1 : 1, '');
    text(x + 9, (y0 + y1) / 2 + 5, op, 'opl', 'start');
  }
  const linesSaid = 'A double number line. The top line is the drawing in centimetres, the bottom line real life in centimetres, the two locked together.';

  // While a mark travels (go: how far, 0 -> 1), its pills count whole centimetres from where the dot is
  // now, so the labels never lag the dot; landing on the exact value when the mark does.
  const travelAt = (d, go) => r3(d.from + (d.to - d.from) * go);
  const counted = (c) => Math.round(c);

  // --- the demonstrations ---
  // Two batches: the second batch arrives beside the first; each is named 3 : 2; × 2 is written over and
  // under the table; the new column fills in.
  function demoCopies(d, i) {
    const A = AT.copies, ty = TY.mix, t = tableOf(d), L = layout(t.cols[1][0], t.cols[1][1], d.batch[0], d.batch[1], wOf(i));
    const grow = arr(A.grow), lab = arr(A.labs), arcA = arr(A.arcs), ans = arr(A.ans);
    blockNames(d);
    drawBlocks(L, inFirst(L));
    part(grow, 4, () => drawBlocks(L, (k, r) => !inFirst(L)(k, r)));
    part(lab, 4, () => batchLabels(L, rat(d.batch[0], d.batch[1])));

  }
  // Adding: + 3 (or the step tapped) is written over and under the table in the warning colour; the new

  function demoAdd(d, i, st) {

  }
  // Dividing: four batches each named 3 : 2; ÷ 4 written over and under; all but one batch leave; the
  // new column fills in.
  function demoJoin(d, i) {
