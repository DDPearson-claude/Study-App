<style>

  .pz > * + *, #stepbox > * + * { margin-top: 14px; }
  /* The stepper is the page's step control: its dots are the progress bar; Back and Continue are below. */
  .pz .k-stepper { gap: 0; }
  .pz .k-stepper .k-label, .pz .k-stepper-nav { display: none; }
  .pz .count { margin-top: 10px; }

  .task.show { font-size: 1.12rem; font-weight: 400; line-height: 1.6; }
  .fr { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; line-height: 1.1; font-weight: 700; margin: 0 .1em; font-size: .9em; }
  .fr .n { border-bottom: 2px solid currentColor; padding: 0 .18em; }

  .scene .pc.tap.locked { cursor: default; }
  .scene .pc:focus { outline: none; }
  .scene .pc:focus-visible, .scene .hit:focus-visible { stroke: var(--k-accent); stroke-width: 4; }
  .scene .edge { fill: none; stroke: var(--k-strong); stroke-width: 2.5; }
  .scene .cut { stroke: var(--k-strong); stroke-width: 2; }

  .scene .tick { stroke: var(--k-ink); stroke-width: 2; }
  .scene .num { font: 700 16px var(--k-font); fill: var(--k-ink); }
  .scene .lab { font: 700 15px var(--k-font); fill: var(--k-ink); }

  .scene .big { font: 700 22px var(--k-font); fill: var(--k-ink); }

  .scene .bbar { stroke: var(--k-ink); stroke-width: 2; }
  .scene .onnum { font: 700 16px var(--k-font); fill: var(--k-on-accent2); }
  .scene .onxs { font: 700 13px var(--k-font); fill: var(--k-on-accent2); }
  .scene .tl { font: 700 15px var(--k-font); fill: var(--k-accent); }
  .scene .brk { fill: none; stroke: var(--k-accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .scene .gapbox { fill: none; stroke: var(--k-accent2); stroke-width: 2; stroke-dasharray: 4 3; }
  .scene .drop { stroke: var(--k-accent2); stroke-width: 2; stroke-dasharray: 5 4; }
  .scene .hit { fill: var(--k-bg); fill-opacity: 0; cursor: pointer; }
  .scene .hit.locked { cursor: default; }
  .scene .hit:focus { outline: none; }
  .scene .dot { fill: var(--k-accent2); stroke: var(--k-bg); stroke-width: 2.5; }
  .scene .ring { fill: none; stroke: var(--k-accent2); stroke-width: 2.5; }
  .scene .hop { fill: none; stroke: var(--k-accent); stroke-width: 2; stroke-linecap: round; }
  .scene .mlab { font: 700 15px var(--k-font); fill: var(--k-accent2); }

  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  .row .k-btn { flex: 1 1 7rem; }
  .replay { display: flex; justify-content: flex-end; }
  .replay .k-btn { flex: 0 0 auto; min-height: 44px; padding-left: 16px; padding-right: 16px; font-size: .95rem; }
  /* The answers stay on one row, each label whole, at every text size. */
  .row.picks { flex-wrap: nowrap; }
  .picks .k-btn { font-size: 1.15rem; min-height: 56px; flex: 1 1 0; min-width: 0; white-space: nowrap; padding-inline: 6px; }
  /* Under the number line: move the placed mark one quarter-step at a time. */

  .done strong { color: var(--k-accent2); }

  /* Each new screen settles in softly: its words and picture fade in and rise 4 px. */
  #stepbox.enter, #done.enter { animation: screen-in .35s ease-out both; }
  @keyframes screen-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  html.k-testing #stepbox.enter, html.k-testing #done.enter { animation: none; }
  @media (prefers-reduced-motion: reduce) {
    #stepbox.enter, #done.enter { animation: none; }
    .scene .pc.tap { transition: none; }

<p class="lead">Bars, a tape and a number line, one small step at a time.</p>

<div class="pz" id="pz">
  <div id="prog"></div>
  <div id="stepbox">
    <p class="k-label count" id="count"></p>
    <p class="task" id="task"></p>
    <svg class="scene" id="scene" viewBox="0 0 340 80" width="100%" role="img" aria-label=""></svg>
    <div class="row nudge" id="nudge" hidden></div>
    <div class="replay" id="replay"></div>
    <div class="row picks" id="picks"></div>
    <div class="row acts" id="acts"></div>
    <p class="fb" id="fb" aria-live="polite"></p>

  </div>

  </div>
  <div class="row nav" id="nav"></div>
</div>

<p class="caption">Each full bar is one whole. On the tape, each metre is one whole.</p>

<script>
  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // dur: how long a demonstration plays; fb: how long the motion after an answer plays (seconds).
  const PICK = 'Tap one of the answers.', EMPTY_LINE = 'Tap the line to place a mark.', EMPTY_PIECE = 'Tap a piece to colour it.';
  const STEPS = [
    { show: true, demo: 'seven', dur: 3.4, name: 'Seven quarters',
      text: 'You\'ve met 7/4 already. Seven quarters fill one whole bar and three quarters of the next. Written as 1 3/4, the same amount is called a *mixed number*.' },
    { kind: 'colour', want: 5, fb: 2.5, name: 'Colour one and a quarter',
      at: { sort: 0.15, counts: 0.15, labels: 0.8, name: 1.3 },
      task: 'Colour 1 1/4.',
      why: '1 1/4 is one whole and one quarter more. The whole is the full bar of four quarters, and one more makes five, so 1 1/4 = 5/4.',
      hint: 'Not quite. Fill one whole bar, then one quarter of the next.' },
    { show: true, demo: 'sort', dur: 4.1, name: 'Sort into wholes',
      text: 'Count how many wholes fit in 11/4, four quarters to each bar. Two fit, and the 3 left over stay quarters. So 11/4 = 2 3/4.' },
    { kind: 'pick', draw: 'fill', given: [9, 4], shaded: true, opts: ['2 1', '2 1/4', '3 1/4'], want: '2 1/4', fb: 1.8, name: 'Nine quarters',
      at: { labels: [0.15, 0.45, 0.75], name: 1.1 },
      task: '9/4 has a top bigger than its bottom, so it is an *improper fraction*. Write it as a mixed number.',
      why: 'Two bars hold eight of the quarters, so 2 wholes fit. The one left over stays a quarter, so 9/4 = 2 1/4.',
      hint: 'Not quite. Count the full bars, then the quarters left.',
      hints: { '2 1': 'Not quite. The one left over is still a quarter.', '3 1/4': 'Not quite. Only 2 of the bars are full.' } },
    { kind: 'pick', draw: 'fill', given: [7, 3], tap: true, opts: ['1 4/3', '2 1/3', '2 1/7'], want: '2 1/3', fb: 2.3, name: 'Seven thirds',
      at: { sort: 0.15, bars: [0.15, 0.6, 1.05], labels: [0.45, 0.9, 1.35], name: 1.6 },
      task: 'Colour 7 thirds, then write 7/3 as a mixed number.',
      why: 'A whole is three thirds, so two wholes take six of the seven. The one left over is a third, so 7/3 = 2 1/3.',
      hint: 'Not quite. A whole is three thirds. See how many wholes fit.',
      hints: { '1 4/3': 'Equal, but three of those 4 thirds make another whole. A mixed number takes out every whole that fits.',
        '2 1/7': 'Not quite. The piece left over is a third, so it stays over 3.' } },
    { show: true, demo: 'back', dur: 3.8, name: 'Back the other way',
      text: 'Now go the other way. Cut the whole into its 4 quarters and keep counting through the 3 more. The top is 1 × 4 + 3 = 7, over the same bottom, so 1 3/4 = 7/4.' },
    { kind: 'gap', given: [2, 1, 2], opts: ['3', '4', '5', '21'], want: '5', fb: 2.0, name: 'Two and a half in halves',
      at: { cuts: [0.15, 0.35], counts: 0.8 },
      task: 'What goes in the gap?',
      why: 'Each whole is 2 halves, so 2 wholes are 4 halves. One more half makes 5, so 2 1/2 = 5/2.',
      hint: 'Not quite. Count the halves.',
      hints: { '21': '2 1/2 means two and a half, not twenty-one halves.', '3': 'Not quite. Each whole is 2 halves, not 1.',
        '4': 'Not quite. That is just the 2 wholes. Add the half on top.' } },
    { kind: 'pick', draw: 'saw', opts: ['13/8', '8/8', '11/8'], want: '11/8', fb: 2.3, name: 'A hole saw in eighths',
      at: { cuts: 0.15, counts: 0.75, name: 1.6 },
      task: 'A hole saw is marked 1 3/8 inch. Write that in eighths of an inch.',
      why: 'One inch is 8 eighths, and 3 more make 11. So 1 3/8 inch = 11/8 inch.',
      hint: 'Not quite. Cut the whole inch into eighths and count.',
      hints: { '13/8': 'Not quite. The 1 is a whole inch, not part of the top.', '8/8': 'Not quite. That is just the whole inch. Add the 3 eighths.' } },
    { show: true, demo: 'line', dur: 4.9, name: 'One place on the line',
      text: 'On the number line, 1 3/4 sits three quarter-steps past 1. Count quarter-steps from 0 instead, and the seventh lands in the same place. So 1 3/4 and 7/4 are the same number.' },
    { kind: 'line', want: 9, fb: 2.0, name: 'Find 2 1/4 on the line',
      at: { wholes: [0.15, 0.55], quarter: 0.95, label: 1.3 },
      task: 'Tap 2 1/4 on the line.',
      why: 'Go 2 wholes from 0, then one quarter-step more. That is nine quarter-steps from 0, so 2 1/4 = 9/4.',
      hint: 'Not quite. Find 2, then go one quarter-step past it.',
      marks: { 8: 'Not quite. That is 2. Go one quarter-step past it.' } },
    { kind: 'pick', draw: 'cable', opts: ['7 1/2', '3 1/2', '3 1'], want: '3 1/2', fb: 2.2, name: 'Seven half metres',
      at: { tape: 0.15, brackets: [0.45, 0.8, 1.15], name: 1.5 },
      task: 'Seven lengths of cable are each 1/2 m long. How long are they end to end, in metres?',
      why: 'Two halves make a metre, so seven halves fill 3 metres with one half left. That is 3 1/2 m.',
      hint: 'Not quite. Two halves make one metre.',
      hints: { '7 1/2': 'Not quite. There are 7 halves, not 7 metres. Two halves make one metre.', '3 1': 'Not quite. The one left over is still a half.' } },
    { kind: 'not', opts: ['7/4', '1 6/8', '13/4'], want: '13/4', fb: 1.7, name: 'Not the same',
      at: { ring: 0.1, drop: 0.3, label: 0.5, equal: 1.0 },
      task: 'Which of these is not the same as 1 3/4?',
      why: '7/4 is seven quarters, and 6/8 is the same as 3/4, so both match. 13/4 is thirteen quarters, which is 3 1/4.',
      hint: 'Not quite. Watch where it lands on the line.',
      hints: { '7/4': 'Not quite. Seven quarters is one whole and three quarters, so it matches.', '1 6/8': 'Not quite. 6/8 is the same as 3/4, so 1 6/8 matches.' } },
  ];
  const FINISH = 'A mixed number is wholes and a fraction. The bottom number says how many equal pieces make one whole.';
  // When each demonstration's parts arrive, in seconds after the screen opens (the screen itself
  // takes FADE to fade in, so nothing starts before it has settled).
  const FADE = 0.35;
  const AT = {
    seven: { bars: [0.5, 1.4], one: 1.1, part: 2.0, name: 2.7 },          // one bar fills, then labelled 1; three more quarters, labelled 3/4; then 7/4 = 1 3/4
    sort: { bars: [0.5, 1.3, 2.1], labels: [1.1, 1.9, 2.7], name: 3.4 },   // the quarters fill whole bars four at a time, each labelled once full, then 11/4 = 2 3/4
    back: { cuts: [0.5, 0.65, 0.8], counts: [1.3, 1.9], rule: 2.5, name: 3.1 },   // the whole is cut into quarters, all seven counted, then the rule
    // 1 and three quarter-hops land on a dot, labelled 1 3/4; then seven quarter-hops from 0, counted as they land, reach it too
    line: { whole: 0.5, quarters: [1.1, 1.6, 2.1], dot: 2.6, label: 2.9, below: 3.0, gap: 0.2, name: 4.4 },
  };
  const RIP = 0.1, CNT = 0.2;   // pieces of one group arrive RIP apart; a piece's count follows its shade by CNT
  // Drawing sizes, in viewBox units (340 wide). Stacked bars run from BX with their labels at LX;
  // lines and tapes run from L0 to L0 + LW.
  // Bars Dan colours by tapping are TAPH tall, so each piece is a thumb's width high on a phone.
  const BX = 64, BW = 256, BH = 44, BG = 12, LX = 30, TAPH = 56;
  const L0 = 20, LW = 300;
  const barY = (b, top, h) => top + b * ((h || BH) + BG);
  // After a right answer, coloured pieces that are not yet in whole bars slide there over SLIDE
  // seconds (from the step's at.sort); what follows waits SHIFT longer when any piece had to move.
  const SLIDE = 0.55, SHIFT = 0.55;
  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  // While the kit's self-test looks at every screen it switches fades off (the k-testing class):
  // demonstrations then open finished, as they do with reduced motion.
  const testing = () => document.documentElement.classList.contains('k-testing');

  // ---------- answers (pure, so the checks can test them) ----------
  // '2 1/4' -> [2, 1, 4]; '13/4' -> [0, 13, 4]; '2 1' -> [2, 1, 0] (no bottom); ' m' is dropped.
  function parts(s) {
    const t = String(s).replace(/\s*m$/, '').trim(), m = t.match(/^(?:(\d+)\s+)?(\d+)(?:\/(\d+))?$/);
    if (!m) return [NaN, NaN, NaN];
    if (m[3] == null) return m[1] == null ? [Number(m[2]), 0, 1] : [Number(m[1]), Number(m[2]), 0];
    return [m[1] == null ? 0 : Number(m[1]), Number(m[2]), Number(m[3])];
  }
  const value = (s) => { const p = parts(s); return p[2] ? p[0] + p[1] / p[2] : NaN; };
  const toMixed = (t, b) => [Math.floor(t / b), t % b, b];            // how many wholes fit; the rest keeps the bottom
  const toImproper = (w, t, b) => [w * b + t, b];                     // wholes times the bottom, plus the top
  const count = (on) => on.filter(Boolean).length;
  // How many pieces Dan can colour on a step: two bars of quarters, or (tap) the fill step's bars.
  const tapCount = (d) => d.kind === 'colour' ? 8 : d.tap ? Math.ceil(d.given[0] / d.given[1]) * d.given[1] : 0;
  function blank(i) {
    const d = STEPS[i];
    return { on: new Array(tapCount(d)).fill(false), from: null, mark: null, pick: null, res: null, why: false };
  }
  // The colouring a right answer settles into: the first pieces in order, so whole bars fill first.
  function filled(i) {
    const d = STEPS[i], n = d.kind === 'colour' ? d.want : d.given[0];
    return new Array(tapCount(d)).fill(false).map((v, k) => k < n);
  }
  // How a colouring `from` sorts into `to`: pieces in both stay, the others slide across in order,
  // and any left over fade in (more needed) or out (too many).
  function sortPlan(from, to) {
    const src = [], dst = [], plan = { stay: [], moves: [], ins: [], outs: [] };
    from.forEach((v, k) => { if (v && to[k]) plan.stay.push(k); else if (v) src.push(k); });
    to.forEach((v, k) => { if (v && !from[k]) dst.push(k); });
    const m = Math.min(src.length, dst.length);
    for (let j = 0; j < m; j++) plan.moves.push([src[j], dst[j]]);
    plan.outs = src.slice(m); plan.ins = dst.slice(m);
    return plan;
  }
  function isEmpty(i, st) {
    const d = STEPS[i];
    if (d.kind === 'colour') return count(st.on) === 0;
    if (d.kind === 'line') return st.mark == null;
    return st.pick == null;
  }
  function isRight(i, st) {
    const d = STEPS[i];
    if (d.kind === 'colour') return count(st.on) === d.want;
    if (d.kind === 'line') return st.mark === d.want;
    return st.pick === d.want;
  }
  function hintFor(i, st) {
    const d = STEPS[i];
    if (d.kind === 'colour') {
      const c = count(st.on);
      return c < 4 ? 'Not quite. The 1 means one whole bar, all four quarters.' : c === 4 ? 'Not quite. That is the one whole. Add one quarter more.' : d.hint;
    }
    if (d.kind === 'line') return (d.marks && d.marks[st.mark]) || d.hint;
    return (d.hints && d.hints[st.pick]) || d.hint;
  }
  // A step answered right (the timing check draws each one this way). Where Dan colours, his
  // colouring is a scattered one, so the pieces have to slide into whole bars: the longest motion.
  const SCATTER = { colour: [0, 1, 2, 4, 5], fill: [0, 4, 8] };
  function solved(i) {
    const d = STEPS[i], st = blank(i);
    if (st.on.length) {
      const some = SCATTER[d.kind === 'colour' ? 'colour' : 'fill'];
      st.from = st.on.map((v, k) => some.includes(k));
      st.on = filled(i);
    }
    if (d.kind === 'line') st.mark = d.want;
    else if (d.kind !== 'colour') st.pick = d.want;
    st.res = 'right';
    return st;
  }

  let S = STEPS.map((d, i) => blank(i));
  let finished = false, lastStep = -1, lastDone = false, T = Infinity;   // T: seconds into the current demonstration, or since Check

  // ---------- text with stacked fractions, mixed numbers and amber key terms (built with K.el, never innerHTML) ----------
  function frac(t, b, hide) {
    return K.el('span', hide ? { class: 'fr', 'aria-hidden': 'true' } : { class: 'fr', role: 'img', 'aria-label': t + '/' + b },
      K.el('span', { class: 'n', 'aria-hidden': 'true' }, t), K.el('span', { class: 'd', 'aria-hidden': 'true' }, b));
  }
  // A mixed number: the whole number beside its stacked fraction, read as "1 and 3/4".
  function mixed(w, t, b) {
    return K.el('span', { class: 'mx', role: 'img', 'aria-label': w + ' and ' + t + '/' + b },
      K.el('span', { class: 'w', 'aria-hidden': 'true' }, w), frac(t, b, true));
  }
  // Plain text with its fractions, mixed numbers and *key terms* drawn in.
  function pieces(el, text) {
    const re = /\*([^*]+)\*|(\d+) (\d+)\/(\d+)|(\d+)\/(\d+)/g;
    let at = 0, m;
    while ((m = re.exec(text))) {
      if (m.index > at) el.appendChild(document.createTextNode(text.slice(at, m.index)));
      let node = m[1] ? K.el('span', { class: 'term' }, m[1]) : m[2] ? mixed(m[2], m[3], m[4]) : frac(m[5], m[6]);
      at = m.index + m[0].length;
      // A full stop or comma after a fraction stays on its line.
      const stop = !m[1] && /^[.,?!;]/.test(text.slice(at)) ? text[at] : '';
      if (stop) { node = K.el('span', { class: 'nw' }, node, stop); at++; re.lastIndex = at; }
      el.appendChild(node);
    }
    if (at < text.length) el.appendChild(document.createTextNode(text.slice(at)));
  }
  // A size with its unit ("1 3/8 inch") or a whole "a = b" between fractions ("9/4 = 2 1/4.")
  // stays together on one line, with the full stop after it.
  const AMOUNT = '(?:\\d+ )?\\d+\\/\\d+(?: (?:inch|m)\\b)?';
  const GLUE = new RegExp(AMOUNT + '(?: = ' + AMOUNT + ')?[.,?!;]?', 'g');
  function write(el, text) {
    el.textContent = '';
    let at = 0, m;
    GLUE.lastIndex = 0;
    while ((m = GLUE.exec(text))) {
      if (m.index > at) pieces(el, text.slice(at, m.index));
      if (/ /.test(m[0])) { const box = el.appendChild(K.el('span', { class: 'nw' })); pieces(box, m[0]); }
      else pieces(el, m[0]);
      at = m.index + m[0].length;
    }
    if (at < text.length) pieces(el, text.slice(at));
  }

  // ---------- controls ----------
  const stepper = K.stepper({ id: 'step', label: 'Step', steps: STEPS.map((d) => d.name), value: 0, compact: true, into: '#prog' });
  const nav = document.getElementById('nav');
  const at = () => stepper.get();

  // Up to four answer buttons; each step fills in its own options.
  const pickBtns = [0, 1, 2, 3].map((k) => K.button({ label: 'Answer ' + (k + 1), secondary: true, into: '#picks', press: () => {
    const i = at(), d = STEPS[i], st = S[i];
    if (finished || d.show || !d.opts || k >= d.opts.length || st.res === 'right') return;
    st.pick = d.opts[k]; st.res = null;
  } }));
  // Under the number line, once a mark is placed: move it one quarter-step left or right, so a
  // thumb that lands a tick out can set it exactly.
  const nudgeBtns = [-1, 1].map((dir) => {
    const b = K.button({ label: dir < 0 ? '← A quarter' : 'A quarter →', secondary: true, into: '#nudge', press: () => {
      const i = at(), d = STEPS[i], st = S[i];
      if (finished || d.kind !== 'line' || st.mark == null || st.res === 'right') return;
      st.mark = K.clamp(st.mark + dir, 0, 12); st.res = null;
    } });
    b.el.setAttribute('aria-label', 'Move the mark one quarter-step ' + (dir < 0 ? 'left' : 'right'));
    return b;
  });
  const checkBtn = K.button({ label: 'Check', into: '#acts', press: () => {
    const i = at(), d = STEPS[i], st = S[i];
    if (d.show || finished) return;
    if (isEmpty(i, st)) { st.res = 'empty'; return; }
    st.res = isRight(i, st) ? 'right' : 'wrong';
    // A right answer gathers the coloured pieces into whole bars first, then the rest: the motion
    // slides them there, so the picture always ends on full bars and what is left over.
    if (st.res === 'right' && st.on.length) { st.from = st.on.slice(); st.on = filled(i); }
    // A right answer plays its picture's motion; on the last screen any answer lands on the line.
    if (st.res === 'right' || d.kind === 'not') play();
  } });
  const whyBtn = K.button({ label: 'Why?', secondary: true, into: '#acts', press: () => {
    if (STEPS[at()].show || finished) return;
    const st = S[at()]; st.why = !st.why;
  } });
  const replayBtn = K.button({ label: 'Play again', secondary: true, into: '#replay', press: () => {
    if (!STEPS[at()].show || finished) return;
    play();
  } });
  const backBtn = K.button({ label: 'Back', secondary: true, into: '#nav', press: () => {
    if (finished) { finished = false; return; }
    stepper.set(Math.max(0, at() - 1), true);
  } });
  const nextBtn = K.button({ label: 'Continue', into: '#nav', press: () => {
    const i = at();
    if (finished || (!STEPS[i].show && S[i].res !== 'right')) return;
    if (i < STEPS.length - 1) { stepper.set(i + 1, true); return; }
    finished = true;
    if (typeof K.complete === 'function') K.complete();
  } });
  const againBtn = K.button({ label: 'Start again', secondary: true, into: '#again', press: () => {
    S = STEPS.map((d, i) => blank(i)); finished = false; lastStep = -1; stepper.set(0, true);
  } });

  // One animation plays each demonstration, and the motion after an answer, from its start; with
  // reduced motion (and while the self-test looks) it opens finished.
  const anim = K.anim({ button: false, label: 'Demonstration', step: (dt) => {
    const d = STEPS[at()];
    if (finished) return false;
    T += dt;
    paint();
    return T < (d.show ? d.dur : d.fb || 0);
  } });
  // The kit pauses the motion while the page is hidden (Dan switches app or locks the phone): when
  // he comes back, the picture opens finished rather than stopping part-way.
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !anim.playing() && T !== Infinity) { T = Infinity; paint(); } });
  function play() {
    if (REDUCE || testing()) { T = Infinity; anim.pause(); return; }
    T = 0; anim.play();
  }
  // A new screen (or the finish panel) fades in softly: the CSS animation restarts on it.
  function enter(id) {
    if (REDUCE) return;
    const box = document.getElementById(id);
    box.classList.remove('enter');
    void box.offsetWidth;
    box.classList.add('enter');
  }

  // ---------- drawing ----------
  const svg = document.getElementById('scene');
  let into = null;                                   // where shapes go: the scene, or a part that is arriving
  const add = (node) => (into || svg).appendChild(node);
  // How far a part due at t0 has arrived (K.arrive), noting the timetable for the timing check.
  let latest = 0, earliest = Infinity;
  function arr(t0, d) {
    d = d == null ? K.SOFT : d;
    if (t0 + d > latest) latest = t0 + d;
    if (t0 < earliest) earliest = t0;
    return K.arrive(T, t0, d);
  }
  // A part arriving: drawn into a group faded in to a and risen `rise` units into place; nothing before it starts.
  function part(a, rise, draw) {
    if (a <= 0) return;
    const g = add(K.svg('g'));
    K.fade(g, a, rise);
    const keep = into; into = g; draw(); into = keep;
  }
  // A part leaving (a slot giving way to its answer): faded out as a goes 0 -> 1.
  function leave(a, draw) {
    if (a >= 1) return;
    const g = add(K.svg('g'));
    K.fade(g, 1 - a, 0);
    const keep = into; into = g; draw(); into = keep;
  }
  const rect = (cls, x, y, w, h) => add(K.svg('rect', { class: cls, x: x, y: y, width: w, height: h }));
  const line = (cls, x1, y1, x2, y2) => add(K.svg('line', { class: cls, x1: x1, y1: y1, x2: x2, y2: y2 }));
  const text = (x, y, s, cls, anchor) => add(K.svg('text', { class: cls, x: x, y: y, 'text-anchor': anchor || 'middle' }, String(s)));
  // A stacked fraction centred on x, its bar at y.
  function sfrac(x, y, t, b, cls, barCls, half, gap) {
    half = half || (String(t).length > 1 ? 11 : 9); gap = gap || 16;
    text(x, y - 5, t, cls);
    line(barCls, x - half, y, x + half, y);
    text(x, y + gap, b, cls);
  }
  const bigFrac = (x, y, t, b) => sfrac(x, y, t, b, 'big', 'bbar', String(t).length > 1 ? 15 : 13, 24);
  // A mixed number: its fraction centred on x, the whole number just to its left.
  function bigMixed(x, y, w, t, b) { text(x - 22, y + 8, w, 'big'); bigFrac(x, y, t, b); }
  function smallMixed(x, y, w, t, b, cls, barCls) { text(x - 15, y + 5, w, cls); sfrac(x, y, t, b, cls, barCls); }
  // A piece, plain, with its shade fading in as a goes 0 -> 1.
  function piece(x, y, w, h, a) { rect('pc', x, y, w, h); if (a > 0) part(a, 0, () => rect('pc on', x, y, w, h)); }
  // One bar of a stack at y (h tall, BH unless given): per pieces, piece k shaded as far as shade(k) (0..1).
  function bar(y, per, shade, h) {
    const w = BW / per;
    h = h || BH;
    for (let k = 0; k < per; k++) piece(BX + k * w, y, w, h, shade(k));
    rect('edge', BX, y, BW, h);
  }
  // A count number on piece k of a bar, rising in as a goes 0 -> 1.
  const countIn = (y, per, k, n, a, h) => part(a, 6, () => text(BX + (k + 0.5) * BW / per, y + (h || BH) / 2 + 6, n, 'onnum'));
  // The label beside a bar: 1 for a whole bar, or the fraction of it shaded.
  const sideLabel = (y, t, b, a, h) => part(a, 6, () => { const m = y + (h || BH) / 2; if (b) sfrac(LX, m + 2, t, b, 'lab', 'fbar'); else text(LX, m + 7, t, 'whole'); });
  // Pieces Dan colours by tapping: `bars` bars of `per`, h tall, from y = top. Once answered right
  // they lock, and pieces not yet in whole bars slide there (st.from -> st.on, see sortPlan) from
  // t0; a piece still needed fades in at need(piece), and any extra fades out. Returns the moves.
  function tapBars(st, bars, per, h, top, right, t0, need) {
    const w = BW / per, pos = (i) => ({ x: BX + (i % per) * w, y: barY(Math.floor(i / per), top, h) });
    const plan = right && st.from ? sortPlan(st.from, st.on) : null;
    let slide = 1, gone = 1, ins = [];
    if (plan) {
      if (plan.moves.length) slide = arr(t0, SLIDE);
      if (plan.outs.length) gone = arr(t0);
      ins = plan.ins.map((i) => arr(need(i)));
    }
    const settled = !plan || (slide >= 1 && gone >= 1 && ins.every((a) => a >= 1));
    for (let i = 0; i < bars * per; i++) {
      const p = pos(i), on = settled ? st.on[i] : plan.stay.includes(i);
      const r = K.svg('rect', { class: 'pc tap' + (on ? ' on' : '') + (right ? ' locked' : ''), x: p.x, y: p.y, width: w, height: h,
        tabindex: right ? -1 : 0, role: 'button', 'aria-pressed': on ? 'true' : 'false', 'aria-label': 'Bar ' + (Math.floor(i / per) + 1) + ', piece ' + (i % per + 1) });
      if (!right) {
        const flip = () => { st.on[i] = !st.on[i]; st.res = null; K.reveal(); K.refresh(); };
        r.addEventListener('click', flip);
        r.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } });
      }
      add(r);
    }
    if (!settled) {
      plan.ins.forEach((i, j) => { const p = pos(i); part(ins[j], 0, () => rect('pc on', p.x, p.y, w, h)); });
      plan.outs.forEach((i) => { const p = pos(i); leave(gone, () => rect('pc on', p.x, p.y, w, h)); });
    }
    for (let b = 0; b < bars; b++) rect('edge', BX, barY(b, top, h), BW, h);
    // the moving pieces travel over the bars' edges, eased, to their places
    if (!settled) plan.moves.forEach((mv) => { const p = pos(mv[0]), q = pos(mv[1]); rect('pc on', K.lerp(p.x, q.x, slide), K.lerp(p.y, q.y, slide), w, h); });
    return plan ? plan.moves : [];
  }
  // A hop along a number line from x1 to x2, above (dir -1) or below (dir 1), starting `off` units
  // (4 unless given) from the line and h deeper at its middle, grown as far as e (eased).
  function hop(x1, x2, Y, dir, h, e, off) {
    if (e <= 0) return;
    off = off || 4;
    const attrs = { class: 'hop', d: 'M' + (x1 + 2) + ' ' + (Y + dir * off) + ' Q' + ((x1 + x2) / 2) + ' ' + (Y + dir * (off + 2 * h)) + ' ' + (x2 - 2) + ' ' + (Y + dir * off) };
    if (e < 1) { attrs.pathLength = 1; attrs['stroke-dasharray'] = '1 1'; attrs['stroke-dashoffset'] = (1 - e).toFixed(3); }
    add(K.svg('path', attrs));
  }
  // A dot on the line, fading in and growing gently from 60% to full size.
  const dot = (x, Y, a) => part(a, 0, () => add(K.svg('circle', { class: 'dot', cx: x, cy: Y, r: 9 * (0.6 + 0.4 * a) })));
  // A number line from 0 to `wholes`, ticked every quarter, numbered at the wholes.
  function axis(Y, wholes, numY) {
    const n = 4 * wholes;
    line('axis', L0, Y, L0 + LW, Y);
    for (let k = 0; k <= n; k++) {
      const x = L0 + k * LW / n, h = k % 4 === 0 ? 12 : k % 2 === 0 ? 8 : 5;
      line('tick', x, Y - h, x, Y + h);
    }
    for (let w = 0; w <= wholes; w++) text(L0 + w * LW / wholes, Y + (numY || 32), w, 'num');
  }
  // The slot an answer goes in: a dashed box that gives way to the answer as a goes 0 -> 1.
  const slot = (x, y, w, h, a) => leave(a, () => add(K.svg('rect', { class: 'gapbox', x: x, y: y, width: w, height: h, rx: 5 })));

  // --- the demonstrations (SHOW steps), drawn at time T ---
  function demoSeven() {
    svg.setAttribute('viewBox', '0 0 340 192');
    const A = AT.seven;
    let n = 0;
    for (let b = 0; b < 2; b++) {
      const y = barY(b, 4), t0 = A.bars[b];
      bar(y, 4, (k) => b * 4 + k < 7 ? arr(t0 + k * RIP) : 0);
      for (let k = 0; k < 4 && b * 4 + k < 7; k++) { const a = arr(t0 + k * RIP + CNT); if (a >= 0.5) n++; countIn(y, 4, k, b * 4 + k + 1, a); }
    }
    sideLabel(barY(0, 4), 1, 0, arr(A.one));
    sideLabel(barY(1, 4), 3, 4, arr(A.part));
    const Y = 146, named = arr(A.name);
    bigFrac(142, Y, 7, 4);
    part(named, 6, () => { text(182, Y + 8, '=', 'big'); bigMixed(244, Y, 1, 3, 4); });
    return 'Two bars of 4 quarters, one above the other, and 7/4 written under them. ' + (n ? n + ' quarters are shaded and counted' : 'None are shaded yet') +
      (n >= 4 ? ', filling the first bar, one whole' : '') + (n > 4 ? ', and ' + (n - 4) + ' of the second' : '') +
      (named >= 0.5 ? '. Beside the bars, 1 and 3/4; under them, 7/4 = 1 and 3/4.' : '.');
  }
  function demoSort() {
    svg.setAttribute('viewBox', '0 0 340 240');
    const A = AT.sort;
    let n = 0;
    for (let b = 0; b < 3; b++) {
      const y = barY(b, 4), t0 = A.bars[b];
      bar(y, 4, (k) => b * 4 + k < 11 ? arr(t0 + k * RIP) : 0);
      for (let k = 0; k < 4 && b * 4 + k < 11; k++) { const a = arr(t0 + k * RIP + CNT); if (a >= 0.5) n++; countIn(y, 4, k, b * 4 + k + 1, a); }
      sideLabel(y, b < 2 ? 1 : 3, b < 2 ? 0 : 4, arr(A.labels[b]));
    }
    const Y = 204, named = arr(A.name);
    bigFrac(142, Y, 11, 4);
    part(named, 6, () => { text(182, Y + 8, '=', 'big'); bigMixed(244, Y, 2, 3, 4); });
    return 'Three bars of 4 quarters, one above another, and 11/4 written under them. ' + (n ? n + ' of the 11 quarters are shaded and counted, four to a bar' : 'None are shaded yet') +
      (named >= 0.5 ? '. Two bars are full, each labelled 1, and the third has 3 quarters, so 11/4 = 2 and 3/4.' : '.');
  }
  function demoBack() {
    svg.setAttribute('viewBox', '0 0 340 192');
    const A = AT.back, y0 = barY(0, 4), y1 = barY(1, 4), w = BW / 4;
    rect('pc on', BX, y0, BW, BH);                            // the whole, shaded and not yet cut
    let cuts = 0;
    A.cuts.forEach((t0, k) => {
      const f = arr(t0);                                       // each cut grows down the bar, eased
      if (f <= 0) return;
      if (f >= 1) cuts++;
      line('cut', BX + (k + 1) * w, y0, BX + (k + 1) * w, y0 + BH * f);
    });
    rect('edge', BX, y0, BW, BH);
    bar(y1, 4, (k) => (k < 3 ? 1 : 0));
    sideLabel(y0, 1, 0, 1); sideLabel(y1, 3, 4, 1);
    let n = 0;
    for (let k = 0; k < 4; k++) { const a = arr(A.counts[0] + k * RIP); if (a >= 0.5) n++; countIn(y0, 4, k, k + 1, a); }
    for (let k = 0; k < 3; k++) { const a = arr(A.counts[1] + k * RIP); if (a >= 0.5) n++; countIn(y1, 4, k, k + 5, a); }
    const Y = 146, ruled = arr(A.rule), named = arr(A.name);
    bigMixed(90, Y, 1, 3, 4);
    part(ruled, 6, () => {
      text(122, Y + 8, '=', 'big');
      text(194, Y - 5, '1 × 4 + 3', 'big'); line('bbar', 146, Y, 242, Y); text(194, Y + 24, 4, 'big');
    });
    part(named, 6, () => { text(264, Y + 8, '=', 'big'); bigFrac(296, Y, 7, 4); });
    return 'A whole bar, labelled 1, above a bar of 4 quarters with 3 shaded, labelled 3/4, and 1 and 3/4 written under them' +
      (cuts ? '. The whole is cut into its 4 quarters' : '') + (n ? ', and ' + n + ' quarters are counted' : '') +
      (named >= 0.5 ? '. 1 and 3/4 = (1 × 4 + 3)/4 = 7/4.' : ruled >= 0.5 ? '. 1 and 3/4 = (1 × 4 + 3)/4.' : '.');
  }
  function demoLine() {
    svg.setAttribute('viewBox', '0 0 340 166');
    const A = AT.line, Y = 100, xs = (k) => L0 + k * LW / 8, x = xs(7);
    hop(xs(0), xs(4), Y, -1, 40, arr(A.whole));
    A.quarters.forEach((t0, j) => hop(xs(4 + j), xs(5 + j), Y, -1, 18, arr(t0, 0.5)));
    axis(Y, 2, 40);
    // the seven quarter-steps from 0 run below the line, clear of its ticks, each numbered as it lands
    let below = 0;
    for (let j = 0; j < 7; j++) {
      const t0 = A.below + j * A.gap, e = arr(t0, 0.4);
      if (e >= 1) below++;
      hop(xs(j), xs(j + 1), Y, 1, 16, e, 14);
      part(arr(t0 + 0.25, 0.4), 6, () => text((xs(j) + xs(j + 1)) / 2, Y + 26, j + 1, 'cnt'));
    }
    const landed = arr(A.dot), labelled = arr(A.label), named = arr(A.name, 0.5);
    dot(x, Y, landed);
    part(labelled, 6, () => smallMixed(x + 6, 40, 1, 3, 4, 'mlab', 'mbar'));
    part(named, 6, () => sfrac(x, Y + 44, 7, 4, 'mlab', 'mbar'));
    return 'A number line from 0 to 2 with a tick at every quarter' + (labelled >= 0.5 ? '. One whole hop to 1 and three quarter-hops land on a mark labelled 1 and 3/4' : '') +
      (below ? '. Below the line, ' + below + ' quarter-hops from 0, numbered 1 to ' + below : '') + (named >= 0.5 ? ', land on the same mark, labelled 7/4.' : '.');
  }

  // --- the puzzles (DO steps); after a right answer their motion runs on the same clock T ---
  function drawColour(d, st, right) {
    svg.setAttribute('viewBox', '0 0 340 200');
    const F = d.at, H = TAPH, top = 4;
    // any five quarters are right; scattered ones first slide into one full bar and one more
    const g = tapBars(st, 2, 4, H, top, right, F.sort, null).length ? SHIFT : 0;
    const Y = 162;
    bigMixed(160, Y, 1, 1, 4);
    if (right) {
      let j = 0;
      for (let b = 0; b < 2; b++) {
        const y = barY(b, top, H);
        for (let k = 0; k < 4; k++) if (st.on[b * 4 + k]) { countIn(y, 4, k, j + 1, arr(F.counts + g + j * 0.12), H); j++; }
        const c = count(st.on.slice(b * 4, b * 4 + 4));
        if (c) sideLabel(y, c === 4 ? 1 : c, c === 4 ? 0 : 4, arr(F.labels + g), H);
      }
      part(arr(F.name + g), 6, () => { text(198, Y + 8, '=', 'big'); bigFrac(230, Y, 5, 4); });
    }
    return 'Two bars, one above the other, each cut into 4 quarters, with 1 and 1/4 written under them. ' + count(st.on) + ' of the 8 quarters are coloured' +
      (right ? (g ? ', gathered into one full bar and one quarter of the next' : '') + ', counted 1 to 5, and 1 and 1/4 = 5/4.' : '.');
  }
  // Bars for given[0] pieces of size 1/given[1]: shaded from the start, or (tap) coloured by Dan
  // and, once answered, sorted into whole bars as the pieces are counted.
  function drawFill(d, st, right) {
    const F = d.at, t = d.given[0], b = d.given[1], bars = Math.ceil(t / b), mx = toMixed(t, b), H = d.tap ? TAPH : BH;
    svg.setAttribute('viewBox', d.tap ? '0 0 340 270' : '0 0 340 240');
    const shadeAt = (q) => F.bars[Math.floor(q / b)] + (q % b) * RIP;   // when piece q's shade arrives, bar by bar
    const moved = d.tap ? tapBars(st, bars, b, H, 4, right, F.sort, shadeAt).map((mv) => mv[1]) : [];
    for (let i = 0; i < bars; i++) {
      const y = barY(i, 4, H), t0 = F.bars ? F.bars[i] : 0;
      if (!d.tap) bar(y, b, (k) => i * b + k >= t ? 0 : d.shaded ? 1 : right ? arr(t0 + k * RIP) : 0);
      for (let k = 0; k < b && i * b + k < t; k++) {
        const q = i * b + k;
        if (d.shaded) countIn(y, b, k, q + 1, 1);
        // a count follows its piece's shade, or a piece that slid into place
        else if (right) countIn(y, b, k, q + 1, arr(moved.includes(q) ? Math.max(t0 + k * RIP + CNT, F.sort + SLIDE) : t0 + k * RIP + CNT), H);
      }
      // a bar's label waits for any piece still sliding into that bar
      const late = moved.some((q) => Math.floor(q / b) === i) ? F.sort + SLIDE : 0;
      if (right) { const c = Math.min(b, t - i * b); sideLabel(y, c === b ? 1 : c, c === b ? 0 : b, arr(Math.max(F.labels[i], late)), H); }
    }
    const Y = d.tap ? 236 : 204, named = right ? arr(F.name) : 0;
    bigFrac(142, Y, t, b);
    text(182, Y + 8, '=', 'big');
    slot(208, Y - 28, 56, 56, named);
    part(named, 6, () => bigMixed(244, Y, mx[0], mx[1], mx[2]));
    const shown = d.shaded || right ? ', with ' + t + ' pieces shaded and counted' : d.tap ? ', ' + count(st.on) + ' of the ' + bars * b + ' coloured' : ', none shaded';
    return bars + ' bars, one above another, each cut into ' + b + ' equal pieces' + shown +
      ', and ' + t + '/' + b + ' = a gap written under them' + (right ? '. ' + mx[0] + ' bars are full, so ' + t + '/' + b + ' = ' + mx[0] + ' and ' + mx[1] + '/' + mx[2] + '.' : '.');
  }
  function drawGap(d, st, right) {
    svg.setAttribute('viewBox', '0 0 340 236');
    const F = d.at, Yf = 36, top = 72, w = BW / 2;
    bigMixed(152, Yf, d.given[0], d.given[1], d.given[2]);
    text(190, Yf + 8, '=', 'big');
    if (st.pick == null) add(K.svg('rect', { class: 'gapbox', x: 219, y: Yf - 29, width: 30, height: 26, rx: 4 }));
    else text(234, Yf - 5, st.pick, 'big');
    line('bbar', 219, Yf, 249, Yf);
    text(234, Yf + 24, d.given[2], 'big');
    let n = 0;
    for (let b = 0; b < 3; b++) {
      const y = barY(b, top);
      if (b < 2) {
        rect('pc on', BX, y, BW, BH);
        if (right) { const f = arr(F.cuts[b]); if (f > 0) line('cut', BX + w, y, BX + w, y + BH * f); }
        rect('edge', BX, y, BW, BH);
        sideLabel(y, 1, 0, 1);
      } else { bar(y, 2, (k) => (k < 1 ? 1 : 0)); sideLabel(y, 1, 2, 1); }
    }
    if (right) for (let j = 0; j < 5; j++) { const a = arr(F.counts + j * 0.12); if (a >= 0.5) n++; countIn(barY(Math.floor(j / 2), top), 2, j % 2, j + 1, a); }
    return '2 and 1/2 = ' + (st.pick == null ? 'a gap' : st.pick) + '/2, above two whole bars, each labelled 1, and a bar of 2 halves with 1 shaded, labelled 1/2' +
      (right ? '. The wholes are cut into halves, and ' + n + ' halves are counted.' : '.');
  }
  // The hole saw's size as two bars, each one inch: the whole inch, then an inch cut into eighths
  // with 3 shaded. A right answer cuts the whole inch into eighths too and counts all 11.
  function drawSaw(d, st, right) {
    svg.setAttribute('viewBox', '0 0 340 200');
    const F = d.at, w = BW / 8, y0 = 24, y1 = barY(1, y0), Y = 164, x = 87;
    text(BX + BW / 2, 15, 'one inch', 'tl');
    rect('pc on', BX, y0, BW, BH);
    let cuts = 0;
    if (right) for (let k = 1; k < 8; k++) { const f = arr(F.cuts + (k - 1) * 0.08); if (f >= 1) cuts++; if (f > 0) line('cut', BX + k * w, y0, BX + k * w, y0 + BH * f); }
    rect('edge', BX, y0, BW, BH);
    bar(y1, 8, (k) => (k < 3 ? 1 : 0));
    sideLabel(y0, 1, 0, 1); sideLabel(y1, 3, 8, 1);
    let n = 0;
    if (right) for (let j = 0; j < 11; j++) { const a = arr(F.counts + j * 0.08); if (a >= 0.5) n++; countIn(j < 8 ? y0 : y1, 8, j % 8, j + 1, a); }
    // 1 3/8 inch = [ ] inch, the gap giving way to 11/8
    const named = right ? arr(F.name) : 0;
    bigMixed(x, Y, 1, 3, 8); text(x + 24, Y + 8, 'inch', 'big', 'start');
    text(x + 86, Y + 8, '=', 'big');
    slot(x + 100, Y - 28, 40, 56, named);
    part(named, 6, () => bigFrac(x + 120, Y, 11, 8));
    text(x + 148, Y + 8, 'inch', 'big', 'start');
    return 'Two bars, each one inch long: the first a whole inch, labelled 1; the second cut into 8 eighths with 3 shaded, labelled 3/8. Under them, 1 and 3/8 inch = ' +
      (right ? (named >= 0.5 ? '11/8' : 'a gap') + ' inch. The whole inch is cut into 8 eighths' + (n ? ', and ' + n + ' eighths are counted.' : '.') : 'a gap, in inches.');
  }
  // Seven half-metre lengths of cable end to end over a tape marked only in halves. A right answer
  // numbers the tape in metres, its whole-metre marks growing, and brackets each pair of halves as 1 m.
  function drawCable(d, st, right) {
    svg.setAttribute('viewBox', '0 0 340 186');
    const F = d.at, m = LW / 4, hm = m / 2, y = 76, H = 44, Y = 142, Yr = 22;
    sfrac(110, Yr, 7, 2, 'lab', 'fbar'); text(122, Yr + 5, 'm', 'lab', 'start');
    text(152, Yr + 5, '=', 'lab');
    const named = right ? arr(F.name) : 0;
    slot(166, 2, 62, 44, named);
    part(named, 6, () => { smallMixed(196, Yr, 3, 1, 2, 'lab', 'fbar'); text(210, Yr + 5, 'm', 'lab', 'start'); });
    if (right) F.brackets.forEach((t0, k) => {
      const a = arr(t0), x1 = L0 + k * m + 4, x2 = L0 + (k + 1) * m - 4;
      part(a, 0, () => add(K.svg('path', { class: 'brk', d: 'M' + x1 + ' ' + (y - 4) + ' V' + (y - 10) + ' H' + x2 + ' V' + (y - 4) })));
      part(a, 6, () => text((x1 + x2) / 2, y - 16, '1 m', 'tl'));
    });
    for (let k = 0; k < 7; k++) { rect('pc on', L0 + k * hm, y, hm, H); text(L0 + (k + 0.5) * hm, y + H / 2 + 6, k + 1, 'onnum'); }
    rect('edge', L0, y, 7 * hm, H);
    const a = right ? arr(F.tape) : 0;
    line('axis', L0, Y, L0 + LW, Y);
    for (let k = 0; k <= 8; k++) line('tick', L0 + k * hm, Y, L0 + k * hm, Y + 8 + (k % 2 === 0 ? 6 * a : 0));
    part(a, 6, () => { for (let k = 0; k < 4; k++) text(L0 + k * m, Y + 34, k, 'num'); text(L0 + LW, Y + 34, '4 m', 'num', 'end'); });
    return 'Seven lengths of cable, each 1/2 m, laid end to end and numbered 1 to 7, over a tape marked in half metres, and 7/2 m = ' +
      (right ? '3 and 1/2 m written above. The tape is numbered 0 to 4 m: they reach three and a half metres, and each pair of halves is bracketed as 1 m.' : 'a gap written above.');
  }
  function drawLine(d, st, right) {
    svg.setAttribute('viewBox', '0 0 340 154');
    const F = d.at, Y = 104, n = 12, step = LW / n, xs = (k) => L0 + k * step;
    if (right) {
      F.wholes.forEach((t0, j) => hop(xs(4 * j), xs(4 * j + 4), Y, -1, 34, arr(t0)));
      hop(xs(8), xs(9), Y, -1, 14, arr(F.quarter, 0.5));
    }
    axis(Y, 3, 42);
    if (st.mark != null) {
      const x = xs(st.mark);
      add(K.svg('circle', { class: 'dot', cx: x, cy: Y, r: 9 }));
      if (right) part(arr(F.label), 6, () => { smallMixed(x - 14, 44, 2, 1, 4, 'mlab', 'mbar'); text(x + 8, 49, '=', 'mlab'); sfrac(x + 28, 44, 9, 4, 'mlab', 'mbar'); });
    }
    // Tap targets: a tall strip around every tick (the nearest tick takes the tap).
    for (let k = 0; k <= n; k++) {
      const r = K.svg('rect', { class: 'hit' + (right ? ' locked' : ''), x: xs(k) - step / 2, y: Y - 44, width: step, height: 88, tabindex: right ? -1 : 0, role: 'button',
        'aria-label': 'Tick ' + k + ' of ' + n });
      if (!right) {
        const put = () => { st.mark = k; st.res = null; K.reveal(); K.refresh(); };
        r.addEventListener('click', put);
        r.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); put(); } });
      }
      add(r);
    }
    return 'A number line from 0 to 3 with a tick at every quarter. ' +
      (st.mark == null ? 'No mark yet.' : 'The mark is on tick ' + st.mark + ' of ' + n + (right ? ', two whole hops and one quarter-hop from 0, where 2 and 1/4 = 9/4.' : '.'));
  }
  // 1 3/4 marked on a line from 0 to 4; a checked answer lands as a ring at its own place.
  function drawNot(d, st) {
    svg.setAttribute('viewBox', '0 0 340 178');
    const F = d.at, Y = 88, xs = (k) => L0 + k * LW / 16, x0 = xs(7);
    axis(Y, 4);
    add(K.svg('circle', { class: 'dot', cx: x0, cy: Y, r: 9 }));
    smallMixed(x0 + 8, 46, 1, 3, 4, 'mlab', 'mbar');
    const shown = (st.res === 'right' || st.res === 'wrong') && st.pick != null;
    let where = '';
    if (shown) {
      const v = value(st.pick), x = xs(Math.round(v * 4)), p = parts(st.pick), ringA = arr(F.ring);
      part(ringA, 0, () => add(K.svg('circle', { class: 'ring', cx: x, cy: Y, r: 15 * (0.6 + 0.4 * ringA) })));
      part(arr(F.drop), 0, () => line('drop', x, Y + 17, x, Y + 46));
      part(arr(F.label), 6, () => { if (p[0]) smallMixed(x + 8, Y + 66, p[0], p[1], p[2], 'mlab', 'mbar'); else sfrac(x, Y + 66, p[1], p[2], 'mlab', 'mbar'); });
      // A right answer lands far along the line: its mixed number goes to the left of it, clear of the edge.
      if (st.res === 'right') {
        const m = toMixed(p[1], p[2]);
        part(arr(F.equal), 6, () => { smallMixed(x - 50, Y + 66, m[0], m[1], m[2], 'mlab', 'mbar'); text(x - 26, Y + 71, '=', 'mlab'); });
      }
      where = K.near(v, 1.75, 1e-9) ? ', and ' + st.pick + ' lands on the same mark.' : ', and ' + st.pick + ' lands far past it, at ' + toMixed(p[1], p[2]).slice(0, 2).join(' and ') + '/4.';
    }
    return 'A number line from 0 to 4 with a tick at every quarter and a mark at 1 and 3/4' + (where || '.');
  }

  // The scene for a step (the animation calls this every frame).
  function paint(i) {
    if (i == null) i = at();
    const d = STEPS[i], st = S[i], right = st.res === 'right';
    svg.textContent = '';
    into = null;
    let aria;
    if (d.show) aria = { seven: demoSeven, sort: demoSort, back: demoBack, line: demoLine }[d.demo]();
    else if (d.kind === 'colour') aria = drawColour(d, st, right);
    else if (d.kind === 'gap') aria = drawGap(d, st, right);
    else if (d.kind === 'line') aria = drawLine(d, st, right);
    else if (d.kind === 'not') aria = drawNot(d, st);
    else aria = { fill: drawFill, saw: drawSaw, cable: drawCable }[d.draw](d, st, right);
    svg.setAttribute('aria-label', aria);
  }

  const el = (id) => document.getElementById(id);
  el('finish').textContent = FINISH;
  K.update((p) => {
    const i = Math.round(p.step), d = STEPS[i], st = S[i];
    if (!anim.playing()) T = Infinity;          // motion that was stopped (the page hidden, a test) shows finished
    if (i !== lastStep) { lastStep = i; enter('stepbox'); if (d.show) play(); else { anim.pause(); T = Infinity; } }
    if (finished !== lastDone) { lastDone = finished; enter(finished ? 'done' : 'stepbox'); }
    const right = st.res === 'right';
    el('stepbox').hidden = finished;
    el('done').hidden = !finished;
    el('count').textContent = 'Step ' + (i + 1) + ' of ' + STEPS.length;
    const task = el('task');
    task.className = 'task' + (d.show ? ' show' : '');
    write(task, d.show ? d.text : d.task);
    paint(i);

    el('replay').hidden = !d.show || REDUCE;
    el('nudge').hidden = d.kind !== 'line' || st.mark == null || right;
    const opts = d.show ? [] : d.opts || [];
    el('picks').hidden = !opts.length;
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      write(b.el, opts[k]);
      b.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });

    el('acts').hidden = !!d.show;
    checkBtn.el.hidden = right;
    const fb = el('fb');
    fb.hidden = !!d.show;
    fb.className = 'fb' + (right ? ' right' : st.res === 'wrong' ? ' wrong' : '');
    const empty = d.kind === 'line' ? EMPTY_LINE : d.kind === 'colour' ? EMPTY_PIECE : PICK;
    write(fb, d.show ? '' : right ? 'That\'s it.' : st.res === 'wrong' ? hintFor(i, st) : st.res === 'empty' ? empty : '');

    const why = el('why');
    why.hidden = d.show || !st.why;
    write(why, d.show ? '' : d.why);
    whyBtn.setLabel(st.why ? 'Hide why' : 'Why?');

    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !right);
    nextBtn.setLabel(i === STEPS.length - 1 ? 'Finish' : 'Continue');
    nav.hidden = backBtn.el.hidden && nextBtn.el.hidden;
  });

  // ---------- known answers, worked out by hand ----------
  const sameNum = (a, b) => K.near(a, b, 1e-9);
  const pickRight = (i, v) => isRight(i, Object.assign(blank(i), { pick: v }));
  // The one option a step accepts: equal in value to `v` and, for a mixed number, its leftover less than one whole.
  const onlyEqual = (i, v, mixedAnswer) => STEPS[i].opts.filter((o) => { const p = parts(o); return sameNum(value(o), v) && (!mixedAnswer || p[1] < p[2]); }).join() === STEPS[i].want;
  K.check('Improper to mixed: 7/4 = 1 3/4, 11/4 = 2 3/4, 9/4 = 2 1/4, 7/3 = 2 1/3 and seven halves = 3 1/2 (the wholes that fit, then the rest over the same bottom); 2 1, 3 1/4, 1 4/3, 2 1/7 and 7 1/2 are not the answers', () =>
    toMixed(7, 4).join() === '1,3,4' && toMixed(11, 4).join() === '2,3,4' && toMixed(9, 4).join() === '2,1,4' && toMixed(7, 3).join() === '2,1,3' && toMixed(7, 2).join() === '3,1,2' &&
    onlyEqual(3, 9 / 4, true) && onlyEqual(4, 7 / 3, true) && onlyEqual(10, 7 / 2, true) &&
    pickRight(3, '2 1/4') && !pickRight(3, '2 1') && !pickRight(3, '3 1/4') && pickRight(4, '2 1/3') && !pickRight(4, '1 4/3') && !pickRight(4, '2 1/7') &&
    sameNum(value('1 4/3'), 7 / 3) && !sameNum(value('2 1/7'), 7 / 3) && Number.isNaN(value('2 1')) && pickRight(10, '3 1/2') && !pickRight(10, '7 1/2') && !pickRight(10, '3 1'));
  K.check('Mixed to improper: 1 1/4 = 5/4 (any five quarters, settling as one full bar and one quarter more), 1 3/4 = 7/4, 2 1/2 = 5/2 and 1 3/8 = 11/8 (wholes × bottom + top); 21/2, 4/2, 3/2, 13/8 and 8/8 are not', () => {
    const colour = (n) => isRight(1, Object.assign(blank(1), { on: blank(1).on.map((v, k) => k < n) }));
    // three quarters in the first bar and two in the second: right, and one piece slides across to fill the first bar
    const scattered = blank(1).on.map((v, k) => [0, 1, 2, 4, 5].includes(k)), settled = filled(1), plan = sortPlan(scattered, settled);
    return toImproper(1, 1, 4).join() === '5,4' && toImproper(1, 3, 4).join() === '7,4' && toImproper(2, 1, 2).join() === '5,2' && toImproper(1, 3, 8).join() === '11,8' &&
      colour(5) && !colour(2) && !colour(4) && !colour(6) && isRight(1, Object.assign(blank(1), { on: scattered })) &&
      count(settled.slice(0, 4)) === 4 && count(settled.slice(4)) === 1 && plan.moves.join() === '5,3' && !plan.ins.length && !plan.outs.length &&
      pickRight(6, '5') && !pickRight(6, '21') && !pickRight(6, '4') && !pickRight(6, '3') && sameNum(5 / 2, 2.5) && !sameNum(21 / 2, 2.5) && !sameNum(4 / 2, 2.5) &&
      onlyEqual(7, 1 + 3 / 8) && pickRight(7, '11/8') && !pickRight(7, '13/8') && !pickRight(7, '8/8') && sameNum(11 / 8, 1.375) && !sameNum(13 / 8, 1.375) &&
      !sameNum(3 / 2, 2.5) && !sameNum(8 / 8, 1.375);
  });
  K.check('Line: 1 3/4 is three quarter-steps past 1 and seven from 0, the same tick; 2 1/4 is the ninth quarter tick; 1 6/8 lands with 1 3/4, and 13/4 lands at 3 1/4', () => {
    const x = (k, n) => L0 + k * LW / n;
    return sameNum(x(4, 8) + 3 * (LW / 8), x(7, 8)) && sameNum(x(7, 8), L0 + 1.75 * LW / 2) &&
      isRight(9, Object.assign(blank(9), { mark: 9 })) && !isRight(9, Object.assign(blank(9), { mark: 8 })) && !isRight(9, Object.assign(blank(9), { mark: 3 })) &&
      sameNum(x(9, 12), L0 + 2.25 * LW / 3) && sameNum(value('1 6/8'), 1.75) && sameNum(value('7/4'), 1.75) && sameNum(value('13/4'), 3.25) &&
      STEPS[11].opts.filter((o) => !sameNum(value(o), 1.75)).join() === STEPS[11].want && pickRight(11, '13/4') && !pickRight(11, '7/4');
  });
  // Drawn from the lesson's own timetable: each screen is painted finished and every arrival it used is noted.
  K.check('Every demonstration has finished arriving within 5 s of its screen opening, none starting before the 0.35 s screen fade ends, and every answer\'s motion within 2.5 s', () => {
    const keepT = T, ok = STEPS.every((d, i) => {
      const keepS = S[i];
      T = Infinity; latest = 0; earliest = Infinity;
      if (!d.show) S[i] = solved(i);
      try { paint(i); } finally { S[i] = keepS; }
      return d.show ? latest <= d.dur && d.dur <= 5 && earliest >= FADE : latest <= d.fb && d.fb <= 2.5;
    });
    T = keepT; paint();
    return ok;
  });

  K.ready();
</script>
