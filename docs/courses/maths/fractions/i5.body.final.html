<style>
  [hidden] { display: none !important; }
  .pz { max-width: 30rem; }
  .pz > * + *, #stepbox > * + * { margin-top: 14px; }
  /* The stepper is the page's step control: its dots are the progress bar; Back and Continue are below. */
  .pz .k-stepper { gap: 0; }
  .pz .k-stepper .k-label, .pz .k-stepper-nav { display: none; }
  .pz .count { margin-top: 10px; }
  .task { font-size: 1.2rem; font-weight: 700; line-height: 1.5; margin-top: 4px; }
  .task.show { font-size: 1.12rem; font-weight: 400; line-height: 1.6; }
  .fr { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; line-height: 1.1; font-weight: 700; margin: 0 .1em; font-size: .9em; }
  .fr .n { border-bottom: 2px solid currentColor; padding: 0 .18em; }
  .fr .d { padding: 0 .18em; }
  .mx { display: inline-flex; align-items: center; vertical-align: middle; white-space: nowrap; }
  .mx .w { font-weight: 700; margin-left: .1em; }
  .mx .fr { margin-left: .08em; }
  .nw { white-space: nowrap; }
  .scene { display: block; width: 100%; }
  .scene .pc { fill: var(--k-panel); stroke: var(--k-strong); stroke-width: 2; }
  .scene .pc.on { fill: var(--k-accent2); }
  .scene .pc.bad { fill: var(--k-warn); fill-opacity: .5; }
  .scene .pc.tap { cursor: pointer; transition: fill .15s ease; }
  .scene .pc.tap.locked { cursor: default; }
  .scene .pc:focus { outline: none; }
  .scene .pc:focus-visible { stroke: var(--k-accent); stroke-width: 4; }
  .scene .edge { fill: none; stroke: var(--k-strong); stroke-width: 2.5; }
  .scene .cut { stroke: var(--k-strong); stroke-width: 2; }
  .scene .axis { stroke: var(--k-ink); stroke-width: 2.5; stroke-linecap: round; }
  .scene .tick { stroke: var(--k-ink); stroke-width: 2; }
  .scene .num { font: 700 16px var(--k-font); fill: var(--k-ink); }
  .scene .lab { font: 700 15px var(--k-font); fill: var(--k-ink); }
  .scene .whole { font: 700 20px var(--k-font); fill: var(--k-ink); }
  .scene .big { font: 700 22px var(--k-font); fill: var(--k-ink); }
  .scene .sign { font: 700 20px var(--k-font); fill: var(--k-ink); }
  .scene .fbar { stroke: var(--k-ink); stroke-width: 1.5; }
  .scene .bbar { stroke: var(--k-ink); stroke-width: 2; }
  .scene .wlab { font: 700 15px var(--k-font); fill: var(--k-warn); }
  .scene .wbar { stroke: var(--k-warn); stroke-width: 1.5; }
  .scene .onnum { font: 700 16px var(--k-font); fill: var(--k-on-accent2); }
  .scene .tl { font: 700 15px var(--k-font); fill: var(--k-accent); }
  .scene .gapbox { fill: none; stroke: var(--k-accent2); stroke-width: 2; stroke-dasharray: 4 3; }
  .scene .drop { stroke: var(--k-accent2); stroke-width: 2; stroke-dasharray: 5 4; }
  .scene .ghost { fill: none; stroke: var(--k-muted); stroke-width: 2; stroke-dasharray: 6 4; }
  .scene .join { stroke: var(--k-ink); stroke-width: 4; stroke-linecap: round; }
  .scene .dot { fill: var(--k-accent2); stroke: var(--k-bg); stroke-width: 2.5; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  .row .k-btn { flex: 1 1 7rem; }
  .replay { display: flex; justify-content: flex-end; }
  .replay .k-btn { flex: 0 0 auto; min-height: 44px; padding-left: 16px; padding-right: 16px; font-size: .95rem; }
  /* The answers stay on one row, each label whole, at every text size. */
  .row.picks { flex-wrap: nowrap; }
  .picks .k-btn { font-size: 1.15rem; min-height: 56px; flex: 1 1 0; min-width: 0; white-space: nowrap; padding-inline: 6px; }
  .picks .k-btn[aria-pressed="true"] { background: var(--k-accent2); color: var(--k-on-accent2); border-color: var(--k-accent2); }
  .fb { font-weight: 700; min-height: 1.5em; margin-top: 10px; }
  .fb.right { color: var(--k-good); }
  .fb.wrong { color: var(--k-ink); }
  .why { line-height: 1.6; }
  .done { line-height: 1.6; }
  .done strong { color: var(--k-accent2); }
  .done .row { margin-top: 14px; }
  /* Each new screen settles in softly: its words and picture fade in and rise 4 px. */
  #stepbox.enter, #done.enter { animation: screen-in .35s ease-out both; }
  @keyframes screen-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  html.k-testing #stepbox.enter, html.k-testing #done.enter { animation: none; }
  @media (prefers-reduced-motion: reduce) {
    #stepbox.enter, #done.enter { animation: none; }
    .scene .pc.tap { transition: none; }
  }
</style>

<p class="lead">Bars and lengths of cable, one small step at a time.</p>

<div class="pz" id="pz">
  <div id="prog"></div>
  <div id="stepbox">
    <p class="k-label count" id="count"></p>
    <p class="task" id="task"></p>
    <svg class="scene" id="scene" viewBox="0 0 340 80" width="100%" role="img" aria-label=""></svg>
    <div class="replay" id="replay"></div>
    <div class="row picks" id="picks"></div>
    <div class="row acts" id="acts"></div>
    <p class="fb" id="fb" aria-live="polite"></p>
    <div class="note why" id="why" hidden></div>
  </div>
  <div class="panel done" id="done" hidden>
    <p><strong id="finish"></strong></p>
    <div class="row" id="again"></div>
  </div>
  <div class="row nav" id="nav"></div>
</div>

<p class="caption">Each full bar is one whole, or one hour on the timesheet. On the tape, each metre is one whole.</p>

<script>
  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // A `sum` picture: bar A, bar B (op '+' adds it, '−' takes it away), then the result bar(s) C,
  // all cut into pieces of size 1/to. Bars whose bottom is not `to` are cut into those pieces
  // first (their label renamed). Adding, both groups of shaded pieces slide down into C; taking
  // away, A's pieces slide down and then B's worth of them leave C, each leaving a dashed outline.
  // at: when each part arrives (seconds after the screen opens, or after Check);
  // dur: how long a demonstration plays; fb: how long the motion after a right answer plays.
  const PICK = 'Tap one of the answers.', EMPTY_JOBS = 'Colour the two jobs, then tap an answer.';
  const STEPS = [
    { show: true, demo: 'sum', dur: 3.4, name: 'Same pieces',
      sum: { a: [1, 4], b: [2, 4], op: '+', to: 4 },
      at: { cut: 0.5, joinA: 1.1, joinB: 1.7, name: 2.8 },
      text: '1/4 and 2/4 are both quarters. Put them together and you have 3 quarters, so 1/4 + 2/4 = 3/4. The tops add, and the bottom stays, because it names the piece.' },
    { kind: 'pick', draw: 'sum', sum: { a: [3, 8], b: [2, 8], op: '+', to: 8 }, opts: ['5/16', '5/8', '6/8'], want: '5/8', fb: 2.2, name: 'Eighths and eighths',
      at: { cut: 0.15, joinA: 0.55, joinB: 0.95, name: 1.6 },
      task: 'What is 3/8 + 2/8?',
      why: 'The pieces are all eighths, so count them. 3 and 2 make 5, and the bottom stays 8.',
      hint: 'Not quite. Count the shaded eighths in both bars.',
      hints: { '5/16': 'Not quite. The pieces are still eighths, so the bottom stays 8.', '6/8': 'Not quite. That multiplies the tops. Count the shaded eighths instead.' } },
    { show: true, demo: 'sum', dur: 4.6, name: 'Different pieces',
      sum: { a: [1, 2], b: [1, 4], op: '+', to: 4, bad: [2, 6] },
      at: { cut: 0.5, rel: 1.0, joinA: 1.5, joinB: 2.0, name: 2.6, bad: 3.0, half: 3.5 },
      text: 'Cut the half into quarters, and both have the same bottom, called a *common denominator*. Adding tops and bottoms instead gives 2/6, less than the half alone.' },
    { kind: 'pick', draw: 'sum', sum: { a: [1, 2], b: [3, 8], op: '+', to: 8 }, opts: ['4/10', '4/8', '7/8'], want: '7/8', fb: 2.5, name: 'Halves and eighths',
      at: { cut: 0.15, rel: 0.6, joinA: 0.9, joinB: 1.3, name: 1.9 },
      task: 'What is 1/2 + 3/8?',
      why: 'A half is 4 eighths, so 1/2 + 3/8 = 4/8 + 3/8. That makes 7 eighths, 7/8.',
      hint: 'Not quite. Cut the half into eighths first.',
      hints: { '4/10': 'Not quite. 4/10 is less than the half alone. Cut the half into eighths first.', '4/8': 'Not quite. Cut into eighths, the half is 4/8, not 1/8.' } },
    { show: true, demo: 'sum', dur: 4.3, name: 'Taking away',
      sum: { a: [3, 4], b: [1, 2], op: '−', to: 4 },
      at: { cut: 0.5, rel: 1.0, joinA: 1.6, take: 3.0, name: 3.7 },
      text: 'Taking away works the same way. Cut the half into quarters, so 3/4 − 1/2 = 3/4 − 2/4. Take 2 quarters from 3, and 1/4 is left.' },
    { kind: 'pick', draw: 'sum', sum: { a: [5, 8], b: [1, 4], op: '−', to: 8 }, opts: ['3/8', '4/4', '4/8'], want: '3/8', fb: 2.5, name: 'Take a quarter',
      at: { cut: 0.15, rel: 0.55, joinA: 0.75, take: 1.7, name: 1.9 },
      task: 'What is 5/8 − 1/4?',
      why: 'A quarter is 2 eighths, so 5/8 − 1/4 = 5/8 − 2/8. Take 2 eighths from 5, and 3/8 is left.',
      hint: 'Not quite. Cut the quarter into eighths first.',
      hints: { '4/4': 'Not quite. 4/4 is a whole, more than you started with. Cut the quarter into eighths first.', '4/8': 'Not quite. In eighths, the quarter is 2/8, not 1/8.' } },
    { show: true, demo: 'sum', dur: 4.2, name: 'Past a whole',
      sum: { a: [1, 2], b: [3, 4], op: '+', to: 4, title: 'Each bar is one hour', eq: true },
      at: { cut: 0.5, rel: 1.0, joinA: 1.6, joinB: 2.2, name: 3.0, eq: 3.6 },
      text: 'On a timesheet, half an hour is 2 quarter-hours. Add 3/4 h and that makes 5 quarter-hours, 5/4 h. Four make a whole hour, so it\'s 1 1/4 h.' },
    // Dan colours the two jobs on two hour bars of quarters (any colouring), then picks the total.
    // A right answer gathers his colouring into the first six quarters (one hour and half the next)
    // from at.sort, counts them, labels each hour bar, and writes the total in the gap.
    { kind: 'pick', draw: 'jobs', tap: 8, give: 6, opts: ['6/8', '6/4', '1 1/2'], want: '1 1/2', fb: 2.5, name: 'Two jobs',
      at: { sort: 0.1, counts: 0.1, labels: [0.75, 1.15], name: 1.25 },
      task: 'Colour two jobs of 3/4 h on the hour bars. How long is that, as a mixed number?',
      why: 'Six quarter-hours make one hour and 2 quarters more. 2/4 is a half, so it\'s 1 1/2 h.',
      hint: 'Not quite. Four quarter-hours make one hour.',
      hints: { '6/8': 'Not quite. That adds the bottoms too. The pieces are still quarters, and 6/8 is only 3/4, one job.', '6/4': 'Equal, but four quarter-hours make a whole hour. Write it as a mixed number.' } },
    { kind: 'pick', draw: 'cables', opts: ['3 1/4', '4 1/4', '1/4'], want: '4 1/4', fb: 2.1, name: 'Two cables',
      at: { slide: 0.15, whole: 0.9, drop: 1.0, name: 1.5 },
      task: 'Two lengths of cable, 2 3/4 m and 1 1/2 m, are laid end to end. How long are they together?',
      why: '3/4 + 1/2 is 5/4, which is 1 1/4. With the 3 whole metres, that makes 4 1/4 m.',
      hint: 'Not quite. Add the wholes, then the fractions.',
      hints: { '3 1/4': 'Not quite. 3/4 + 1/2 makes 1 1/4, so carry that whole metre too.', '1/4': 'Not quite. Keep the whole metres too: 2, 1 and the one the fractions make.' } },
    { show: true, demo: 'break', dur: 4.5, name: 'Break a whole',
      at: { cut: 0.5, rel: 1.0, count: 1.5, five: 2.5, take: 3.1, name: 3.85 },
      text: 'There is only 1/4, not enough to take 3/4 from. Break the whole into 4 quarters, so 1 1/4 is 5/4. Take 3 quarters, and 2/4 is left.' },
    { kind: 'pick', draw: 'cut', opts: ['2 1/2', '1/2', '1 1/2'], want: '1 1/2', fb: 2.5, name: 'Cut a length off',
      at: { cuts: 0.15, rename: 0.5, away: 1.1, ghost: 1.3, name: 1.85 },
      task: 'A 3 1/4 m length of cable has 1 3/4 m cut off. How much is left?',
      why: '1/4 isn\'t enough to take 3/4 from, so break one metre into quarters. Then 3 1/4 m is 2 5/4 m, and taking 1 3/4 m leaves 1 2/4 m, or 1 1/2 m.',
      hint: 'Not quite. Break one whole metre into quarters first.',
      hints: { '2 1/2': 'Not quite. That takes 1/4 from 3/4, the wrong way round. Break a metre into quarters first.', '1/2': 'Not quite. A whole metre is left as well as the half.' } },
    { kind: 'pick', draw: 'sum', sum: { a: [1, 2], b: [1, 3], op: '+', to: 6 }, opts: ['2/5', '5/6', '2/6'], want: '5/6', fb: 2.5, name: 'Halves and thirds',
      at: { cut: 0.15, rel: 0.6, joinA: 0.9, joinB: 1.3, name: 1.9 },
      task: 'Sixths are a common denominator for halves and thirds. What is 1/2 + 1/3?',
      why: 'A half is 3/6 and a third is 2/6. Together they make 5/6.',
      hint: 'Not quite. Cut both into sixths first.',
      hints: { '2/5': 'Not quite. 2/5 is less than the half you started with. Cut both into sixths first.', '2/6': 'Not quite. The half changes too when you cut it into sixths. Count its sixths.' } },
  ];
  const FINISH = 'Give the pieces the same name, then add or take away the tops. With mixed numbers, do the wholes and the fractions, carrying or breaking a whole when you need to.';
  // The screen itself takes FADE to fade in, so no demonstration part starts before it has settled.
  // Cuts grow down a bar over GROW; pieces slide over SLIDE; a count rises in over CNT; counted
  // pieces go STEP apart; a piece taken away slides OUT units to the right as it fades.
  const FADE = 0.35, GROW = 0.6, SLIDE = 0.6, CNT = 0.4, STEP = 0.2, OUT = 14;
  // After a right answer, coloured pieces not yet in place slide (or fade) there over SORT seconds
  // from the step's at.sort; what follows waits SHIFT longer when any piece had to move.
  const SORT = 0.55, SHIFT = 0.6;
  // Drawing sizes, in viewBox units (340 wide). Bars run from BX with their labels at LX and their
  // + − = signs at SX; bars Dan colours by tapping are TAPH tall, so each piece is a thumb's width
  // high on a phone. Tapes run from L0 to L0 + TL, leaving room for the unit after the last number.
  const BX = 64, BW = 256, BH = 44, BG = 12, LX = 36, SX = 9, TAPH = 56;
  const L0 = 20, TL = 290;
  const barY = (b, top, h) => top + b * ((h || BH) + BG);
  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  // While the kit's self-test looks at every screen it switches fades off (the k-testing class):
  // demonstrations then open finished, as they do with reduced motion.
  const testing = () => document.documentElement.classList.contains('k-testing');

  // ---------- the arithmetic (pure, so the checks can test it) ----------
  // '2 1/4' -> [2, 1, 4]; '13/4' -> [0, 13, 4]; ' m' or ' h' is dropped.
  function parts(s) {
    const t = String(s).replace(/\s*[mh]$/, '').trim(), m = t.match(/^(?:(\d+)\s+)?(\d+)(?:\/(\d+))?$/);
    if (!m) return [NaN, NaN, NaN];
    if (m[3] == null) return m[1] == null ? [Number(m[2]), 0, 1] : [Number(m[1]), Number(m[2]), 0];
    return [m[1] == null ? 0 : Number(m[1]), Number(m[2]), Number(m[3])];
  }
  const value = (s) => { const p = parts(s); return p[2] ? p[0] + p[1] / p[2] : NaN; };
  const gcd = (a, b) => (b ? gcd(b, a % b) : a);
  const toMixed = (t, b) => [Math.floor(t / b), t % b, b];             // the wholes that fit; the rest keeps the bottom
  const nOf = (f, to) => f[0] * to / f[1];                             // a fraction counted in pieces of size 1/to
  // Add or take away the way the lesson does: rename both to pieces of size 1/to, then work with the tops.
  const combine = (a, b, op, to) => [op === '+' ? nOf(a, to) + nOf(b, to) : nOf(a, to) - nOf(b, to), to];
  // The common slip: tops with tops and bottoms with bottoms.
  const slip = (a, b, op) => (op === '+' ? [a[0] + b[0], a[1] + b[1]] : [a[0] - b[0], a[1] - b[1]]);
  // Mixed numbers: wholes with wholes, fractions renamed to `to` and combined, then any whole the
  // fractions make carried (or one whole broken into pieces when taking away needs it).
  function mixedSum(x, y, op, to) {
    let w = op === '+' ? x[0] + y[0] : x[0] - y[0], t = op === '+' ? nOf([x[1], x[2]], to) + nOf([y[1], y[2]], to) : nOf([x[1], x[2]], to) - nOf([y[1], y[2]], to);
    while (t < 0) { w -= 1; t += to; }                                  // borrow: one whole is `to` more pieces
    while (t >= to) { w += 1; t -= to; }                                // carry: `to` pieces make a whole
    return [w, t, to];
  }
  const resultN = (s) => combine(s.a, s.b, s.op, s.to)[0];              // the result's top, in pieces of size 1/to
  const cRows = (s) => Math.max(1, Math.ceil((s.op === '+' ? resultN(s) : nOf(s.a, s.to)) / s.to));

  const count = (on) => on.filter(Boolean).length;
  // A step's state: the pick, the result of Check, Why? open, and (where Dan colours) which pieces are on.
  function blank(i) { return { on: new Array(STEPS[i].tap || 0).fill(false), from: null, pick: null, res: null, why: false }; }
  const isRight = (i, st) => st.pick === STEPS[i].want;
  const hintFor = (i, st) => { const d = STEPS[i]; return (d.hints && d.hints[st.pick]) || d.hint; };
  // The colouring a right answer settles into: the first pieces in order, so the first hour fills first.
  const filled = (i) => new Array(STEPS[i].tap).fill(false).map((v, k) => k < STEPS[i].give);
  // How a colouring `from` sorts into `to`: pieces in both stay, the others slide across in order,
  // and any left over fade in (more needed) or out (too many).
  function sortPlan(from, to) {
    const src = [], dst = [], plan = { stay: [], moves: [], ins: [], outs: [] };
    from.forEach((v, k) => { if (v && to[k]) plan.stay.push(k); else if (v) src.push(k); });
    to.forEach((v, k) => { if (v && !from[k]) dst.push(k); });
    const m = Math.min(src.length, dst.length);
    for (let j = 0; j < m; j++) plan.moves.push([src[j], dst[j]]);
    plan.outs = src.slice(m); plan.ins = dst.slice(m);
    return plan;
  }
  // A step answered right (the timing check draws each one this way). Where Dan colours, his
  // colouring is a scattered one (each job in its own hour bar), so a piece has to slide: the longest motion.
  const SCATTER = [0, 1, 2, 4, 5, 6];
  function solved(i) {
    const st = blank(i);
    if (st.on.length) { st.from = st.on.map((v, k) => SCATTER.includes(k)); st.on = filled(i); }
    st.pick = STEPS[i].want; st.res = 'right';
    return st;
  }

  let S = STEPS.map((d, i) => blank(i));
  let finished = false, lastStep = -1, lastDone = false, T = Infinity;   // T: seconds into the current demonstration, or since Check

  // ---------- text with stacked fractions, mixed numbers and amber key terms (built with K.el, never innerHTML) ----------
  function frac(t, b, hide) {
    return K.el('span', hide ? { class: 'fr', 'aria-hidden': 'true' } : { class: 'fr', role: 'img', 'aria-label': t + '/' + b },
      K.el('span', { class: 'n', 'aria-hidden': 'true' }, t), K.el('span', { class: 'd', 'aria-hidden': 'true' }, b));
  }
  // A mixed number: the whole number beside its stacked fraction, read as "1 and 3/4".
  function mixed(w, t, b) {
    return K.el('span', { class: 'mx', role: 'img', 'aria-label': w + ' and ' + t + '/' + b },
      K.el('span', { class: 'w', 'aria-hidden': 'true' }, w), frac(t, b, true));
  }
  // Plain text with its fractions, mixed numbers and *key terms* drawn in.
  function pieces(el, text) {
    const re = /\*([^*]+)\*|(\d+) (\d+)\/(\d+)|(\d+)\/(\d+)/g;
    let at = 0, m;
    while ((m = re.exec(text))) {
      if (m.index > at) el.appendChild(document.createTextNode(text.slice(at, m.index)));
      let node = m[1] ? K.el('span', { class: 'term' }, m[1]) : m[2] ? mixed(m[2], m[3], m[4]) : frac(m[5], m[6]);
      at = m.index + m[0].length;
      // A full stop or comma after a fraction stays on its line.
      const stop = !m[1] && /^[.,?!;]/.test(text.slice(at)) ? text[at] : '';
      if (stop) { node = K.el('span', { class: 'nw' }, node, stop); at++; re.lastIndex = at; }
      el.appendChild(node);
    }
    if (at < text.length) el.appendChild(document.createTextNode(text.slice(at)));
  }
  // An amount with its unit ("1 1/4 h") or a whole sum ("2/4 + 1/4 = 3/4.") stays together on
  // one line, with the full stop after it.
  const AMOUNT = '(?:\\d+ )?\\d+\\/\\d+(?: [mh]\\b)?';
  const GLUE = new RegExp(AMOUNT + '(?: [+−=] ' + AMOUNT + ')*[.,?!;]?', 'g');
  function write(el, text) {
    el.textContent = '';
    let at = 0, m;
    GLUE.lastIndex = 0;
    while ((m = GLUE.exec(text))) {
      if (m.index > at) pieces(el, text.slice(at, m.index));
      if (/ /.test(m[0])) { const box = el.appendChild(K.el('span', { class: 'nw' })); pieces(box, m[0]); }
      else pieces(el, m[0]);
      at = m.index + m[0].length;
    }
    if (at < text.length) pieces(el, text.slice(at));
  }

  // ---------- controls ----------
  const stepper = K.stepper({ id: 'step', label: 'Step', steps: STEPS.map((d) => d.name), value: 0, compact: true, into: '#prog' });
  const nav = document.getElementById('nav');
  const at = () => stepper.get();

  // Three answer buttons; each step fills in its own options.
  const pickBtns = [0, 1, 2].map((k) => K.button({ label: 'Answer ' + (k + 1), secondary: true, into: '#picks', press: () => {
    const i = at(), d = STEPS[i], st = S[i];
    if (finished || d.show || !d.opts || k >= d.opts.length || st.res === 'right') return;
    st.pick = d.opts[k]; st.res = null;
  } }));
  const checkBtn = K.button({ label: 'Check', into: '#acts', press: () => {
    const i = at(), d = STEPS[i], st = S[i];
    if (d.show || finished) return;
    if (st.pick == null) { st.res = 'empty'; return; }
    st.res = isRight(i, st) ? 'right' : 'wrong';
    // A right answer plays its picture's motion: the pieces renamed and joined, the answer in place.
    // A right answer gathers the coloured pieces into the first hour, then the next: the motion
    // slides them there, so the picture always ends on one full hour and half the next.
    if (st.res === 'right' && st.on.length) { st.from = st.on.slice(); st.on = filled(i); }
    if (st.res === 'right') play();
  } });
  const whyBtn = K.button({ label: 'Why?', secondary: true, into: '#acts', press: () => {
    if (STEPS[at()].show || finished) return;
    const st = S[at()]; st.why = !st.why;
  } });
  const replayBtn = K.button({ label: 'Play again', secondary: true, into: '#replay', press: () => {
    if (!STEPS[at()].show || finished) return;
    play();
  } });
  const backBtn = K.button({ label: 'Back', secondary: true, into: '#nav', press: () => {
    if (finished) { finished = false; return; }
    stepper.set(Math.max(0, at() - 1), true);
  } });
  const nextBtn = K.button({ label: 'Continue', into: '#nav', press: () => {
    const i = at();
    if (finished || (!STEPS[i].show && S[i].res !== 'right')) return;
    if (i < STEPS.length - 1) { stepper.set(i + 1, true); return; }
    finished = true;
    if (typeof K.complete === 'function') K.complete();
  } });
  const againBtn = K.button({ label: 'Start again', secondary: true, into: '#again', press: () => {
    S = STEPS.map((d, i) => blank(i)); finished = false; lastStep = -1; stepper.set(0, true);
  } });

  // One animation plays each demonstration, and the motion after an answer, from its start; with
  // reduced motion (and while the self-test looks) it opens finished. If the page is hidden part-way,
  // the kit pauses it and carries on from there when Dan comes back.
  const anim = K.anim({ button: false, label: 'Demonstration', step: (dt) => {
    const d = STEPS[at()];
    if (finished) return false;
    T += dt;
    paint();
    return T < (d.show ? d.dur : d.fb || 0);
  } });
  function play() {
    if (REDUCE || testing()) { T = Infinity; anim.pause(); return; }
    T = 0; anim.play();
  }
  // A new screen (or the finish panel) fades in softly: the CSS animation restarts on it.
  function enter(id) {
    if (REDUCE) return;
    const box = document.getElementById(id);
    box.classList.remove('enter');
    void box.offsetWidth;
    box.classList.add('enter');
  }

  // ---------- drawing ----------
  const svg = document.getElementById('scene');
  let into = null;                                   // where shapes go: the scene, or a part that is arriving
  const add = (node) => (into || svg).appendChild(node);
  // How far a part due at t0 has arrived (K.arrive), noting the timetable for the timing check.
  let latest = 0, earliest = Infinity;
  function arr(t0, d) {
    d = d == null ? K.SOFT : d;
    if (t0 + d > latest) latest = t0 + d;
    if (t0 < earliest) earliest = t0;
    return K.arrive(T, t0, d);
  }
  // A part arriving: drawn into a group faded in to a and risen `rise` units into place; nothing before it starts.
  function part(a, rise, draw) {
    if (a <= 0) return;
    const g = add(K.svg('g'));
    K.fade(g, a, rise);
    const keep = into; into = g; draw(); into = keep;
  }
  // A part leaving: faded out as a goes 0 -> 1.
  function leave(a, draw) {
    if (a >= 1) return;
    const g = add(K.svg('g'));
    K.fade(g, 1 - a, 0);
    const keep = into; into = g; draw(); into = keep;
  }
  const rect = (cls, x, y, w, h) => add(K.svg('rect', { class: cls, x: x, y: y, width: w, height: h }));
  const line = (cls, x1, y1, x2, y2) => add(K.svg('line', { class: cls, x1: x1, y1: y1, x2: x2, y2: y2 }));
  const text = (x, y, s, cls, anchor) => add(K.svg('text', { class: cls, x: x, y: y, 'text-anchor': anchor || 'middle' }, String(s)));
  // A stacked fraction centred on x, its bar at y.
  function sfrac(x, y, t, b, cls, barCls, half, gap) {
    half = half || (String(t).length > 1 || String(b).length > 1 ? 11 : 9); gap = gap || 16;
    text(x, y - 5, t, cls);
    line(barCls, x - half, y, x + half, y);
    text(x, y + gap, b, cls);
  }
  const bigFrac = (x, y, t, b) => sfrac(x, y, t, b, 'big', 'bbar', String(t).length > 1 ? 15 : 13, 24);
  // A mixed number: its fraction centred on x, the whole number just to its left.
  function bigMixed(x, y, w, t, b) { text(x - 22, y + 8, w, 'big'); bigFrac(x, y, t, b); }
  function smallMixed(x, y, w, t, b, cls, barCls) { text(x - 15, y + 5, w, cls); sfrac(x, y, t, b, cls, barCls); }
  // An amount for a label: a whole number, a fraction or a mixed number, centred on x.
  function amount(x, y, w, t, b, cls, barCls) {
    if (!t) text(x, y + 5, w, cls);
    else if (w) smallMixed(x + 6, y, w, t, b, cls, barCls);
    else sfrac(x, y, t, b, cls, barCls);
  }
  // The label beside a bar (h tall, BH unless given): 1 for a whole bar, or a fraction.
  function sideLabel(y, t, b, cls, barCls, h) {
    const m = y + (h || BH) / 2;
    if (b === 1 || t === b) text(LX, m + 7, t === b ? 1 : t, 'whole');
    else sfrac(LX, m + 2, t, b, cls || 'lab', barCls || 'fbar');
  }
  const sign = (y, s) => text(SX, y + BH / 2 + 7, s, 'sign');
  // The slot an answer goes in: a dashed box that gives way to the answer as a goes 0 -> 1.
  const slot = (x, y, w, h, a) => leave(a, () => add(K.svg('rect', { class: 'gapbox', x: x, y: y, width: w, height: h, rx: 5 })));
  // Pieces taken away, each {x, y, also}: as a goes 0 -> 1 they slide OUT units to the right and fade
  // (with whatever `also` draws on them, shifted by dx), and a dashed outline settles where each was.
  function takeAway(list, w, h, a) {
    list.forEach((p) => part(a, 0, () => rect('ghost', p.x + 3, p.y + 3, w - 6, h - 6)));
    list.forEach((p) => leave(a, () => { const dx = OUT * a; rect('pc on', p.x + dx, p.y, w, h); if (p.also) p.also(dx); }));
  }

  // A sum (or a taking away) of two fractions in bars: see STEPS. The demonstration (SHOW) or the
  // motion after a right answer (DO) runs on the clock T; before Check only the question is drawn.
  function drawSum(d, st, right) {
    const s = d.sum, F = d.at, to = s.to, w = BW / to, live = d.show || right, plus = s.op === '+';
    const nA = nOf(s.a, to), nB = nOf(s.b, to), rows = cRows(s), n = resultN(s);
    const top = s.title ? 26 : 4, yA = barY(0, top), yB = barY(1, top), yC = (r) => barY(2 + r, top);
    // under the result: the slip's bar and its half line, the timesheet's total, or the "taken" label
    const yD = barY(2 + rows, top), bottom = s.bad ? yD + BH + 30 : yC(rows - 1) + BH + (s.eq ? 76 : plus ? 4 : 28);
    svg.setAttribute('viewBox', '0 0 340 ' + bottom);
    if (s.title) text(BX + BW / 2, 16, s.title, 'tl');
    // the moments: cuts grow, labels renamed, the groups slide, pieces taken, the answer named
    const grow = live ? arr(F.cut, GROW) : 0, rel = live && F.rel != null ? F.rel : null;
    const pA = live ? arr(F.joinA, SLIDE) : 0, pB = live && plus ? arr(F.joinB, SLIDE) : 0;
    const cA = live ? arr(F.joinA + SLIDE, CNT) : 0, cB = live && plus ? arr(F.joinB + SLIDE, CNT) : 0;
    const tk = live && !plus ? arr(F.take) : 0, named = live ? arr(F.name) : 0;
    // The two bars being added (or taken away), renamed into pieces of size 1/to as the cuts grow.
    [[s.a, yA, null], [s.b, yB, s.op]].forEach(([f, y, op]) => {
      const per = f[1];
      for (let k = 0; k < per; k++) rect('pc' + (k < f[0] ? ' on' : ''), BX + k * BW / per, y, BW / per, BH);
      if (per !== to && grow > 0) for (let k = 1; k < to; k++) if ((k * per) % to) line('cut', BX + k * w, y, BX + k * w, y + BH * grow);
      rect('edge', BX, y, BW, BH);
      if (op) sign(y, op);
      if (per === to || rel == null) sideLabel(y, f[0], f[1]);
      else {
        leave(arr(rel, 0.45), () => sideLabel(y, f[0], f[1]));
        part(arr(rel + 0.25), 6, () => sideLabel(y, nOf(f, to), to));
      }
    });
    // Where the pieces land: slot q of the result, filling a bar of `to` before the next.
    const slotXY = (q) => ({ x: BX + (q % to) * w, y: yC(Math.floor(q / to)) });
    for (let r = 0; r < rows; r++) {
      const y = yC(r), shown = r === 0 ? 1 : live ? arr(F.joinB - 0.1) : 0;   // a bar past the first arrives as the pieces overflow
      part(shown, 0, () => {
        rect('pc', BX, y, BW, BH);
        if (r > 0 || grow > 0) for (let k = 1; k < to; k++) line('cut', BX + k * w, y, BX + k * w, y + BH * (r > 0 ? 1 : grow));
      });
    }
    // The pieces that have landed, counted. Taking away, the last nB of them then leave the result
    // bar where they are: each slides a little out and fades, and a dashed outline stays behind.
    const gone = (q) => !plus && q >= nA - nB, leaving = [];
    for (let q = 0; q < nA + (plus ? nB : 0); q++) {
      const fromA = q < nA, p = fromA ? pA : pB, c = fromA ? cA : cB;
      if (p < 1) continue;
      const xy = slotXY(q), num = (dx) => part(c, 6, () => text(xy.x + dx + w / 2, xy.y + BH / 2 + 6, q + 1, 'onnum'));
      if (gone(q) && tk > 0) leaving.push({ x: xy.x, y: xy.y, also: num });
      else { rect('pc on', xy.x, xy.y, w, BH); num(0); }
    }
    takeAway(leaving, w, BH, tk);
    for (let r = 0; r < rows; r++) part(r === 0 ? 1 : live ? arr(F.joinB - 0.1) : 0, 0, () => rect('edge', BX, yC(r), BW, BH));
    sign(yC(0), '=');
    if (!plus) {
      const x0 = slotXY(nA - nB).x, x1 = slotXY(nA - 1).x + w;
      part(live ? arr(F.take + 0.2) : 0, 6, () => text((x0 + x1) / 2, yC(0) + BH + 20, 'taken', 'tl'));
    }
    // the answer, beside each result bar: 1 for a full bar, else the pieces in it
    if (!d.show) slot(LX - 13, yC(0) + 5, 26, BH - 10, named);
    part(named, 6, () => { for (let r = 0; r < rows; r++) sideLabel(yC(r), Math.min(to, n - r * to), to); });
    // The slip, tops and bottoms added: a bar of that many pieces, against the half line.
    if (s.bad) {
      const bd = s.bad, bw = BW / bd[1], hx = BX + BW * s.a[0] / s.a[1];
      part(arr(F.bad), 0, () => { for (let k = 0; k < bd[1]; k++) rect('pc' + (k < bd[0] ? ' bad' : ''), BX + k * bw, yD, bw, BH); rect('edge', BX, yD, BW, BH); });
      part(arr(F.bad + 0.3), 6, () => sideLabel(yD, bd[0], bd[1], 'wlab', 'wbar'));
      const h = arr(F.half, GROW);
      if (h > 0) line('drop', hx, yA - 2, hx, K.lerp(yA - 2, yD + BH + 4, h));
      // the label once the line has reached it
      part(arr(F.half + GROW - 0.1), 6, () => text(hx, yD + BH + 20, 'half', 'tl'));
    }
    // the pieces on their way, over everything else
    const glide = (k, y0, q, p) => { const xy = slotXY(q); rect('pc on', BX + k * w, K.lerp(y0, xy.y, p), w, BH); };
    if (pA > 0 && pA < 1) for (let k = 0; k < nA; k++) glide(k, yA, k, pA);
    if (pB > 0 && pB < 1) for (let k = 0; k < nB; k++) { const xy = slotXY(nA + k); rect('pc on', K.lerp(BX + k * w, xy.x, pB), K.lerp(yB, xy.y, pB), w, BH); }
    // The timesheet's total, as an improper fraction and a mixed number.
    if (s.eq) {
      const Y = yC(rows - 1) + BH + 40, mx = toMixed(n, to);
      part(arr(F.eq), 6, () => {
        bigFrac(96, Y, n, to); text(116, Y + 8, 'h', 'big', 'start');
        text(160, Y + 8, '=', 'big');
        bigMixed(222, Y, mx[0], mx[1], mx[2]); text(242, Y + 8, 'h', 'big', 'start');
      });
    }
    const say = (f) => f[0] + '/' + f[1];
    const res = toMixed(n, to);
    return 'Bars for ' + say(s.a) + (plus ? ' add ' : ' take away ') + say(s.b) + (s.title ? ', each bar one hour' : '') +
      (live && grow >= 1 && (s.a[1] !== to || s.b[1] !== to) ? ', both now cut into pieces of size 1/' + to : '') +
      (plus ? (live && pB >= 1 ? '. Their shaded pieces have joined in the bottom bar' : '. The bottom bar is still empty')
        : live && pA >= 1 ? '. The first bar\'s ' + nA + ' shaded pieces are in the bottom bar' + (tk >= 1 ? ', and the last ' + nB + ' are taken away, leaving dashed outlines marked taken' : '')
          : '. The bottom bar is still empty') +
      (named >= 0.5 ? ', which shows ' + (res[0] && res[1] ? res[0] + ' and ' + res[1] + '/' + to : res[0] ? res[0] : n + '/' + to) : '') +
      (s.bad && arr(F.bad) >= 0.5 ? '. Below, a bar of 6 with 2 shaded, labelled 2/6, stops short of the half line.' : '.');
  }

  // Two hour bars of quarters that Dan colours by tapping (TAPH tall). Once answered right they
  // lock, and pieces not yet among the first six slide there (st.from -> st.on, see sortPlan) from
  // t0, any still needed fading in and any extra fading out at the same time. Returns whether any did.
  function tapBars(st, bars, per, h, top, right, t0) {
    const w = BW / per, pos = (i) => ({ x: BX + (i % per) * w, y: barY(Math.floor(i / per), top, h) });
    const plan = right && st.from ? sortPlan(st.from, st.on) : null;
    const moving = !!plan && plan.moves.length + plan.ins.length + plan.outs.length > 0;
    const a = moving ? arr(t0, SORT) : 1;
    for (let i = 0; i < bars * per; i++) {
      const p = pos(i), on = a >= 1 ? st.on[i] : plan.stay.includes(i);
      const r = K.svg('rect', { class: 'pc tap' + (on ? ' on' : '') + (right ? ' locked' : ''), x: p.x, y: p.y, width: w, height: h,
        tabindex: right ? -1 : 0, role: 'button', 'aria-pressed': on ? 'true' : 'false', 'aria-label': 'Hour ' + (Math.floor(i / per) + 1) + ', quarter ' + (i % per + 1) });
      if (!right) {
        const flip = () => { st.on[i] = !st.on[i]; st.res = null; K.reveal(); K.refresh(); };
        r.addEventListener('click', flip);
        r.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } });
      }
      add(r);
    }
    if (a < 1) {
      plan.ins.forEach((i) => { const p = pos(i); part(a, 0, () => rect('pc on', p.x, p.y, w, h)); });
      plan.outs.forEach((i) => { const p = pos(i); leave(a, () => rect('pc on', p.x, p.y, w, h)); });
    }
    for (let b = 0; b < bars; b++) rect('edge', BX, barY(b, top, h), BW, h);
    // the moving pieces travel over the bars' edges, eased, to their places
    if (a < 1) plan.moves.forEach((mv) => { const p = pos(mv[0]), q = pos(mv[1]); rect('pc on', K.lerp(p.x, q.x, a), K.lerp(p.y, q.y, a), w, h); });
    return moving;
  }
  // Two jobs of 3/4 h, coloured by Dan on two hour bars, with 3/4 h + 3/4 h = [ ] under them. A
  // right answer gathers the colouring into one full hour and half the next, counts the six
  // quarter-hours, labels each bar and writes 1 1/2 h in the gap.
  function drawJobs(d, st, right) {
    svg.setAttribute('viewBox', '0 0 340 236');
    const F = d.at, H = TAPH, top = 26, Y = 200;
    text(BX + BW / 2, 16, 'Each bar is one hour', 'tl');
    const g = tapBars(st, 2, 4, H, top, right, F.sort) ? SHIFT : 0;
    let n = 0, labelled = 0;
    if (right) {
      let j = 0;
      for (let b = 0; b < 2; b++) {
        const y = barY(b, top, H);
        for (let k = 0; k < 4; k++) {
          if (!st.on[b * 4 + k]) continue;
          const a = arr(F.counts + g + j * STEP, CNT), x = BX + (k + 0.5) * BW / 4, c = j + 1;
          if (a >= 0.5) n++;
          part(a, 6, () => text(x, y + H / 2 + 6, c, 'onnum'));
          j++;
        }
        const c = count(st.on.slice(b * 4, b * 4 + 4)), k = gcd(c, 4), a = arr(F.labels[b] + g);
        if (c && a >= 0.5) labelled++;
        if (c) part(a, 6, () => sideLabel(y, c / k, 4 / k, null, null, H));
      }
    }
    const named = right ? arr(F.name + g) : 0;
    bigFrac(76, Y, 3, 4); text(94, Y + 8, 'h', 'big', 'start');
    text(124, Y + 8, '+', 'big');
    bigFrac(154, Y, 3, 4); text(172, Y + 8, 'h', 'big', 'start');
    text(204, Y + 8, '=', 'big');
    slot(218, Y - 28, 76, 56, named);
    part(named, 6, () => { bigMixed(251, Y, 1, 1, 2); text(269, Y + 8, 'h', 'big', 'start'); });
    return 'Two bars, each one hour, cut into 4 quarters, with 3/4 h + 3/4 h = ' + (named >= 0.5 ? '1 and 1/2 h' : 'a gap') + ' written under them. ' +
      (right ? 'Six quarters are coloured' + (g ? ', gathered into' : ', filling') + ' the first hour and 2 quarters of the next' + (n ? ', counted 1 to ' + n : '') +
        (labelled === 2 ? ', and the bars are labelled 1 and 1/2.' : '.') : count(st.on) + ' of the 8 quarters are coloured.');
  }

  // A tape in quarter metres from 0 to `wholes` m, numbered at each whole metre with the unit after
  // the last number, whose digit sits on its tick like the others.
  function tape(Y, wholes) {
    const m = TL / wholes;
    line('axis', L0, Y, L0 + TL, Y);
    for (let k = 0; k <= 4 * wholes; k++) { const h = k % 4 === 0 ? 12 : k % 2 === 0 ? 8 : 5; line('tick', L0 + k * m / 4, Y - h, L0 + k * m / 4, Y + h); }
    for (let k = 0; k <= wholes; k++) text(L0 + k * m, Y + 34, k, 'num');
    text(L0 + TL + 12, Y + 34, 'm', 'num', 'start');
  }
  // The sum above a tape, in the big size: a op b = [ ], the slot giving way to the answer and its
  // unit as named goes 0 -> 1. `first` draws the first amount (so it can change); b and the answer
  // are [whole, top, bottom].
  function tapeSum(Yq, first, op, b, ans, named) {
    first(40); text(58, Yq + 8, 'm', 'big', 'start');
    text(96, Yq + 8, op, 'big');
    bigMixed(142, Yq, b[0], b[1], b[2]); text(160, Yq + 8, 'm', 'big', 'start');
    text(198, Yq + 8, '=', 'big');
    slot(212, Yq - 28, 76, 56, named);
    part(named, 6, () => { bigMixed(245, Yq, ans[0], ans[1], ans[2]); text(263, Yq + 8, 'm', 'big', 'start'); });
  }

  // Two lengths of cable on a tape in quarter metres: 2 3/4 m from 0, and 1 1/2 m lying further
  // along (3 1/4 m to 4 3/4 m, its end on no numbered mark). A right answer slides the second up
  // against the first (the join a heavier line), its own metre line gives way to lines at the tape's
  // 3 and 4 m, so 4 whole metres and a quarter show, and a line drops from the end to the tape.
  function drawCables(d, st, right) {
    svg.setAttribute('viewBox', '0 0 340 186');
    const F = d.at, m = TL / 5, y = 76, H = 40, Y = 142, Yq = 34;
    const slide = right ? arr(F.slide, 0.7) : 0, whole = right ? arr(F.whole) : 0, drop = right ? arr(F.drop, GROW) : 0, named = right ? arr(F.name) : 0;
    tapeSum(Yq, (x) => bigMixed(x, Yq, 2, 3, 4), '+', [1, 1, 2], [4, 1, 4], named);
    // the cables, each with a line at every whole metre along it
    const xa = L0, wa = 2.75 * m, xb = K.lerp(L0 + 3.25 * m, L0 + 2.75 * m, slide), wb = 1.5 * m;
    rect('pc on', xa, y, wa, H); for (let k = 1; k <= 2; k++) line('cut', xa + k * m, y, xa + k * m, y + H); rect('edge', xa, y, wa, H);
    rect('pc on', xb, y, wb, H);
    leave(whole, () => line('cut', xb + m, y, xb + m, y + H));
    part(whole, 0, () => [3, 4].forEach((k) => line('cut', L0 + k * m, y, L0 + k * m, y + H)));
    rect('edge', xb, y, wb, H);
    line('join', xb, y - 5, xb, y + H + 5);
    tape(Y, 5);
    const xe = L0 + 4.25 * m;
    if (drop > 0) line('drop', xe, y + H + 3, xe, K.lerp(y + H + 3, Y - 2, drop));
    part(right ? arr(F.drop + 0.3) : 0, 0, () => add(K.svg('circle', { class: 'dot', cx: xe, cy: Y, r: 7 })));
    return 'A tape from 0 to 5 m in quarter metres. A 2 and 3/4 m cable starts at 0' +
      (right && slide >= 1 ? ', and the 1 and 1/2 m cable lies end to end with it, reaching 4 and 1/4 m on the tape' +
        (whole >= 1 ? ', with a line at each whole metre, so 4 whole metres and a quarter' : '') + '. 2 and 3/4 m + 1 and 1/2 m = ' + (named >= 0.5 ? '4 and 1/4 m' : 'a gap') + ' written above.'
        : ', and a 1 and 1/2 m cable lies further along. 2 and 3/4 m + 1 and 1/2 m = a gap written above.');
  }

  // 1 1/4 − 3/4, with too few quarters to take from: a whole bar and a bar with one quarter shaded,
  // and the sum under them. The whole is broken into 4 quarters (its label renamed 4/4) and all five
  // are counted, so 1 1/4 becomes 5/4; then the last 3 leave, each sliding a little out and fading
  // to a dashed outline, and 2/4 is left.
  function drawBreak(d) {
    svg.setAttribute('viewBox', '0 0 340 184');
    const F = d.at, w = BW / 4, y0 = barY(0, 4), y1 = barY(1, 4), m0 = y0 + BH / 2, m1 = y1 + BH / 2, Y = 152;
    const grow = arr(F.cut, GROW), tk = arr(F.take), five = arr(F.five + 0.25), named = arr(F.name);
    const pos = (q) => ({ x: BX + (q % 4) * w, y: q < 4 ? y0 : y1 });   // quarter q of the five: 0-3 in the whole, 4 below
    // the whole, shaded; once quarters start to leave, its last two are drawn apart
    if (tk <= 0) rect('pc on', BX, y0, BW, BH);
    else { rect('pc on', BX, y0, 2 * w, BH); rect('pc', BX + 2 * w, y0, w, BH); rect('pc', BX + 3 * w, y0, w, BH); }
    if (grow > 0) for (let k = 1; k < 4; k++) line('cut', BX + k * w, y0, BX + k * w, y0 + BH * grow);
    for (let k = 0; k < 4; k++) rect('pc' + (k === 0 && tk <= 0 ? ' on' : ''), BX + k * w, y1, w, BH);
    // the five quarters counted; the last three then taken away
    let n = 0;
    const counts = [0, 1, 2, 3, 4].map((q) => { const c = arr(F.count + q * STEP, CNT); if (c >= 0.5) n++; return c; });
    const num = (q) => (dx) => part(counts[q], 6, () => text(pos(q).x + dx + w / 2, pos(q).y + BH / 2 + 6, q + 1, 'onnum'));
    for (let q = 0; q < 5; q++) if (q < 2 || tk <= 0) num(q)(0);
    if (tk > 0) takeAway([2, 3, 4].map((q) => ({ x: pos(q).x, y: pos(q).y, also: num(q) })), w, BH, tk);
    rect('edge', BX, y0, BW, BH); rect('edge', BX, y1, BW, BH);
    // labels: 1, then 4/4 once broken, then the 2/4 left; the 1/4 goes with its quarter
    leave(arr(F.rel, 0.45), () => text(LX, m0 + 7, 1, 'whole'));
    const four = arr(F.rel + 0.25), unfour = arr(F.name - 0.25, 0.45);
    leave(unfour, () => part(four, 6, () => sfrac(LX, m0 + 2, 4, 4, 'lab', 'fbar')));
    part(named, 6, () => sfrac(LX, m0 + 2, 2, 4, 'lab', 'fbar'));
    leave(arr(F.take, 0.45), () => sfrac(LX, m1 + 2, 1, 4, 'lab', 'fbar'));
    part(arr(F.take + 0.2), 6, () => text(pos(4).x + w / 2, m1 + 5, 'taken', 'tl'));
    // 1 1/4 − 3/4, the 1 1/4 becoming 5/4, then = 2/4
    leave(arr(F.five, 0.45), () => bigMixed(126, Y, 1, 1, 4));
    part(five, 6, () => bigFrac(126, Y, 5, 4));
    text(162, Y + 8, '−', 'big'); bigFrac(198, Y, 3, 4);
    part(named, 6, () => { text(234, Y + 8, '=', 'big'); bigFrac(270, Y, 2, 4); });
    return 'A whole bar above a bar of 4 quarters with 1 shaded, together 1 and 1/4, and 1 and 1/4 − 3/4 written under them' +
      (grow >= 1 ? '. The whole is cut into 4 quarters' : '') + (n ? ', and ' + n + ' quarters are counted' : '') +
      (five >= 0.5 ? ', so the sum now reads 5/4 − 3/4' : '') +
      (tk >= 1 ? '. The last 3 quarters are taken away, leaving dashed outlines marked taken' : '') +
      (named >= 0.5 ? ', and 2 quarters are left, so 5/4 − 3/4 = 2/4.' : '.');
  }

  // A 3 1/4 m cable on a tape in quarter metres, a line at each whole metre. A right answer breaks
  // the third metre into quarters, so 3 1/4 m is 2 5/4 m (written above), and the last 1 3/4 m is
  // cut off: it slides a little away and fades, leaving a dashed outline, and 1 1/2 m is left.
  function drawCut(d, st, right) {
    svg.setAttribute('viewBox', '0 0 340 186');
    const F = d.at, m = TL / 4, y = 76, H = 40, Y = 142, Yq = 34, xc = L0 + 1.5 * m, xe = L0 + 3.25 * m;
    const cuts = right ? arr(F.cuts, GROW) : 0, was = right ? arr(F.rename, 0.45) : 0, now = right ? arr(F.rename + 0.25) : 0;
    const away = right ? arr(F.away) : 0, named = right ? arr(F.name) : 0;
    tapeSum(Yq, (x) => { leave(was, () => bigMixed(x, Yq, 3, 1, 4)); part(now, 6, () => bigMixed(x, Yq, 2, 5, 4)); }, '−', [1, 3, 4], [1, 1, 2], named);
    if (away <= 0) {
      // the whole cable, a line at each whole metre; after Check the third metre's quarter lines grow down it
      rect('pc on', L0, y, xe - L0, H);
      [1, 2, 3].forEach((k) => line('cut', L0 + k * m, y, L0 + k * m, y + H));
      if (cuts > 0) [2.25, 2.5, 2.75].forEach((k) => line('cut', L0 + k * m, y, L0 + k * m, y + H * cuts));
      rect('edge', L0, y, xe - L0, H);
    } else {
      // the part that stays, up to 1 1/2 m
      rect('pc on', L0, y, xc - L0, H);
      line('cut', L0 + m, y, L0 + m, y + H);
      // the part cut off slides a little away and fades, leaving a dashed outline marked "cut off"
      part(arr(F.ghost), 0, () => rect('ghost', xc + 2, y + 1, xe - xc - 3, H - 2));
      part(arr(F.ghost + 0.2), 6, () => text((xc + xe) / 2, y + H / 2 + 5, 'cut off', 'tl'));
      leave(away, () => {
        const dx = OUT * away;
        rect('pc on', xc + dx, y, xe - xc, H);
        [2, 2.25, 2.5, 2.75, 3].forEach((k) => line('cut', L0 + k * m + dx, y, L0 + k * m + dx, y + H));
        rect('edge', xc + dx, y, xe - xc, H);
      });
      rect('edge', L0, y, xc - L0, H);
    }
    tape(Y, 4);
    return 'A tape from 0 to 4 m in quarter metres, under a 3 and 1/4 m cable with a line at each whole metre. ' +
      (right && away >= 1 ? 'The third metre is broken into quarters, so 3 and 1/4 m is 2 and 5/4 m, and the last 1 and 3/4 m is cut off, leaving a dashed outline and 1 and 1/2 m. ' +
        '2 and 5/4 m − 1 and 3/4 m = ' + (named >= 0.5 ? '1 and 1/2 m' : 'a gap') + ' written above.' : '3 and 1/4 m − 1 and 3/4 m = a gap written above.');
  }

  // The scene for a step (the animation calls this every frame).
  function paint(i) {
    if (i == null) i = at();
    const d = STEPS[i], st = S[i], right = st.res === 'right';
    svg.textContent = '';
    into = null;
    const draw = d.show ? { sum: drawSum, break: drawBreak }[d.demo] : { sum: drawSum, jobs: drawJobs, cables: drawCables, cut: drawCut }[d.draw];
    svg.setAttribute('aria-label', draw(d, st, right));
  }

  const el = (id) => document.getElementById(id);
  el('finish').textContent = FINISH;
  K.update((p) => {
    const i = Math.round(p.step), d = STEPS[i], st = S[i];
    if (!anim.playing()) T = Infinity;          // motion that was stopped (a test, the end) shows finished
    if (i !== lastStep) { lastStep = i; enter('stepbox'); if (d.show) play(); else { anim.pause(); T = Infinity; } }
    if (finished !== lastDone) { lastDone = finished; enter(finished ? 'done' : 'stepbox'); }
    const right = st.res === 'right';
    el('stepbox').hidden = finished;
    el('done').hidden = !finished;
    el('count').textContent = 'Step ' + (i + 1) + ' of ' + STEPS.length;
    const task = el('task');
    task.className = 'task' + (d.show ? ' show' : '');
    write(task, d.show ? d.text : d.task);
    paint(i);

    el('replay').hidden = !d.show || REDUCE;
    const opts = d.show ? [] : d.opts || [];
    el('picks').hidden = !opts.length;
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      write(b.el, opts[k]);
      b.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });

    el('acts').hidden = !!d.show;
    checkBtn.el.hidden = right;
    const fb = el('fb');
    fb.hidden = !!d.show;
    fb.className = 'fb' + (right ? ' right' : st.res === 'wrong' ? ' wrong' : '');
    write(fb, d.show ? '' : right ? 'That\'s it.' : st.res === 'wrong' ? hintFor(i, st) : st.res === 'empty' ? (d.tap && !count(st.on) ? EMPTY_JOBS : PICK) : '');

    const why = el('why');
    why.hidden = d.show || !st.why;
    write(why, d.show ? '' : d.why);
    whyBtn.setLabel(st.why ? 'Hide why' : 'Why?');

    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !right);
    nextBtn.setLabel(i === STEPS.length - 1 ? 'Finish' : 'Continue');
    nav.hidden = backBtn.el.hidden && nextBtn.el.hidden;
  });

  // ---------- known answers, worked out by hand ----------
  const sameNum = (a, b) => K.near(a, b, 1e-9);
  const val = (f) => f[0] / f[1];
  const pickRight = (i, v) => isRight(i, Object.assign(blank(i), { pick: v }));
  // A step's options: exactly one is equal to `v` (or, for a mixed-number answer, equal with its leftover under one whole).
  const onlyEqual = (i, v, mixedAnswer) => STEPS[i].opts.filter((o) => { const p = parts(o); return sameNum(value(o), v) && (!mixedAnswer || (p[1] < p[2] && p[0] > 0)); }).join() === STEPS[i].want;
  K.check('Same bottom, the tops add or take away and the bottom stays: 1/4 + 2/4 = 3/4, 3/8 + 2/8 = 5/8 (not 5/16 or 6/8) and 3/4 − 2/4 = 1/4', () =>
    combine([1, 4], [2, 4], '+', 4).join() === '3,4' && combine([3, 8], [2, 8], '+', 8).join() === '5,8' && combine([3, 4], [2, 4], '−', 4).join() === '1,4' &&
    onlyEqual(1, 5 / 8) && pickRight(1, '5/8') && !pickRight(1, '5/16') && !pickRight(1, '6/8') && !sameNum(value('5/16'), 5 / 8));
  K.check('Different bottoms, renamed first: 1/2 + 1/4 = 2/4 + 1/4 = 3/4, 1/2 + 3/8 = 7/8, 3/4 − 1/2 = 1/4, 5/8 − 1/4 = 3/8 and 1/2 + 1/3 = 5/6; each step offers one equal answer', () =>
    combine([1, 2], [1, 4], '+', 4).join() === '3,4' && sameNum(val([1, 2]) + val([1, 4]), 0.75) &&
    sameNum(val(combine([1, 2], [3, 8], '+', 8)), 0.875) &&
    sameNum(val(combine([3, 4], [1, 2], '−', 4)), 0.25) && sameNum(val(combine([5, 8], [1, 4], '−', 8)), 0.375) && sameNum(val(combine([1, 2], [1, 3], '+', 6)), 5 / 6) &&
    onlyEqual(3, 7 / 8) && onlyEqual(5, 3 / 8) && onlyEqual(11, 5 / 6) &&
    [1, 3, 5, 11].every((i) => sameNum(val(combine(STEPS[i].sum.a, STEPS[i].sum.b, STEPS[i].sum.op, STEPS[i].sum.to)), value(STEPS[i].want))));
  K.check('Tops and bottoms added gives less than the first fraction alone (2/6 < 1/2, 4/10 < 1/2, 2/5 < 1/2), and taken away gives more than you started with (4/4 > 5/8)', () =>
    slip([1, 2], [1, 4], '+').join() === '2,6' && val([2, 6]) < 0.5 && slip([1, 2], [3, 8], '+').join() === '4,10' && val([4, 10]) < 0.5 &&
    slip([1, 2], [1, 3], '+').join() === '2,5' && val([2, 5]) < 0.5 &&
    slip([5, 8], [1, 4], '−').join() === '4,4' && val([4, 4]) > 5 / 8 && STEPS[2].sum.bad.join() === '2,6');
  K.check('Past a whole: 1/2 h + 3/4 h = 5/4 h = 1 1/4 h; 3/4 + 3/4 = 1 1/2 (6/4 is equal but not mixed, 6/8 is only 3/4); 2 3/4 + 1 1/2 = 4 1/4, not 3 1/4 or 1/4, its whole metres at 3 and 4 inside the second cable', () => {
    const h = combine([1, 2], [3, 4], '+', 4), j = combine([3, 4], [3, 4], '+', 4);
    return h.join() === '5,4' && toMixed(5, 4).join() === '1,1,4' && j.join() === '6,4' && toMixed(6, 4).join() === '1,2,4' && gcd(2, 4) === 2 &&
      sameNum(value('1 1/2'), 1.5) && sameNum(value('6/4'), 1.5) && sameNum(value('6/8'), 0.75) && onlyEqual(7, 1.5, true) && pickRight(7, '1 1/2') && !pickRight(7, '6/4') && !pickRight(7, '6/8') &&
      mixedSum([2, 3, 4], [1, 1, 2], '+', 4).join() === '4,1,4' && sameNum(2.75 + 1.5, value('4 1/4')) && onlyEqual(8, 4.25) && !pickRight(8, '3 1/4') && !pickRight(8, '1/4') &&
      2.75 < 3 && 4 < 2.75 + 1.5 && (3.25 + 1.5) % 1 !== 0 && cRows(STEPS[6].sum) === 2 && cRows(STEPS[0].sum) === 1;
  });
  K.check('Two jobs coloured any way settle as one full hour of 4 quarters and 2 quarters of the next, 6 in all; with each job in its own hour bar, one quarter moves up', () => {
    const settled = filled(7), scattered = blank(7).on.map((v, k) => SCATTER.includes(k)), plan = sortPlan(scattered, settled);
    return count(settled) === 6 && count(settled.slice(0, 4)) === 4 && count(settled.slice(4)) === 2 && count(scattered) === 6 &&
      plan.moves.join() === '6,3' && !plan.ins.length && !plan.outs.length &&
      sortPlan(blank(7).on, settled).ins.length === 6 && sortPlan(settled.map(() => true), settled).outs.length === 2;
  });
  K.check('Breaking a whole: 1 1/4 − 3/4 = 5/4 − 3/4 = 2/4, and 3 1/4 − 1 3/4 = 2 5/4 − 1 3/4 = 1 2/4 = 1 1/2, not 2 1/2 or 1/2', () =>
    mixedSum([1, 1, 4], [0, 3, 4], '−', 4).join() === '0,2,4' && combine([5, 4], [3, 4], '−', 4).join() === '2,4' && 1 + 1 / 4 === 5 / 4 &&
    mixedSum([3, 1, 4], [1, 3, 4], '−', 4).join() === '1,2,4' && 2 + 5 / 4 === 3.25 && sameNum(3.25 - 1.75, value('1 1/2')) &&
    onlyEqual(10, 1.5) && !pickRight(10, '2 1/2') && !pickRight(10, '1/2'));
  // Drawn from the lesson's own timetable: each screen is painted finished and every arrival it used is noted.
  K.check('Every demonstration has finished arriving within 5 s of its screen opening, none starting before the 0.35 s screen fade ends, and every answer\'s motion within 2.5 s', () => {
    const keepT = T, ok = STEPS.every((d, i) => {
      const keepS = S[i];
      T = Infinity; latest = 0; earliest = Infinity;
      if (!d.show) S[i] = solved(i);
      try { paint(i); } finally { S[i] = keepS; }
      return d.show ? latest <= d.dur && d.dur <= 5 && earliest >= FADE : latest <= d.fb && d.fb <= 2.5;
    });
    T = keepT; paint();
    return ok;
  });

  K.ready();
</script>
