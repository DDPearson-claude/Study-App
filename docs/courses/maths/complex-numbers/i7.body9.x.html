<p class="caption">Ideal parts in series: Z = R + j(X<sub>L</sub> − X<sub>C</sub>), X<sub>L</sub> = 2πfL, X<sub>C</sub> = 1 ÷ (2πfC), reactances to 0.1 Ω.</p>

<script>
  // ---------- numbers ----------
  const rad = (v) => v * Math.PI / 180, dgr = (v) => v * 180 / Math.PI;
  const TWO_PI = 2 * Math.PI, QUARTER = 90;
  const rnd = (v, dp) => { const k = Math.pow(10, dp), r = Math.round(v * k) / k; return Math.abs(r) < 1e-12 ? 0 : r; };
  const fmtN = (v, dp) => { const r = rnd(v, dp); return (r < 0 ? '−' : '') + Math.abs(r); };
  const fx1 = (v) => { const r = rnd(v, 1); return (r < 0 ? '−' : '') + Math.abs(r).toFixed(1); };
  const n2 = (v) => fmtN(v, 2), dg = (v) => n2(v) + '°';
  const near = (a, b, tol) => Math.abs(a - b) <= (tol == null ? 1e-9 : tol);
  const same = (p, q, tol) => !!p && !!q && near(p[0], q[0], tol || 1e-6) && near(p[1], q[1], tol || 1e-6);
  const P = (r, th) => [r * Math.cos(rad(th)), r * Math.sin(rad(th))];
  const angOf = (x, y) => dgr(Math.atan2(y, x));
  const polar = (R, X) => [Math.hypot(R, X), angOf(R, X)];
  const pname = (q) => n2(q[0]) + '∠' + dg(q[1]);

  // ---------- the lesson's rule ----------
  // A coil's reactance X_L = 2πfL and a capacitor's X_C = 1 ÷ (2πfC), with L in henries and C in farads (the sliders give mH and µF).
  const MH = 1000, UF = 1000000;   // millihenries in a henry, microfarads in a farad
  const XLof = (f, L) => TWO_PI * f * (L / MH);
  const XCof = (f, C) => 1 / (TWO_PI * f * (C / UF));
  const inH = (L) => String(rnd(L / MH, 6)), inF = (C) => String(rnd(C / UF, 8));
  // A builder circuit: each reactance rounded to 0.1 Ω, as the explanation writes it, then added tip to tail: Z = R + j(X_L − X_C).
  function circ(s) {
    const xl = rnd(XLof(s.f, s.L), 1), xc = rnd(XCof(s.f, s.C), 1);
    return { R: s.R, xl, xc, X: rnd(xl - xc, 1), hasC: true, d: 1, set: { R: s.R, L: s.L, C: s.C, f: s.f } };
  }
  // A worked example in whole ohms; xc null means there is no capacitor.
  const ex = (R, xl, xc, o) => Object.assign({ R, xl, xc: xc || 0, X: xl - (xc || 0), hasC: xc != null, d: 0 }, o);
  function lerpC(a, b, p) {
    if (p >= 1) return b;
    const R = K.lerp(a.R, b.R, p), xl = K.lerp(a.xl, b.xl, p), xc = K.lerp(a.xc, b.xc, p);
    return Object.assign({}, b, { R, xl, xc, X: xl - xc, hasC: a.hasC || b.hasC, moving: true, nmZ: b.nmZ === false ? false : null, nmC: null });
  }
  // Names as the explanation writes them: whole ohms in the examples, 0.1 Ω on the builder.
  const fX = (v, c) => (c.d ? fx1(v) : c.moving ? fmtN(v, 0) : n2(v));
  function zParts(c) {
    const xs = fX(Math.abs(c.X), c), rs = c.moving ? fmtN(c.R, 0) : n2(c.R);
    if (Number(xs) === 0) return rs;
    const js = 'j' + xs;
    if (rnd(c.R, 2) === 0) return (c.X < 0 ? '−' : '') + js;
    return rs + (c.X < 0 ? ' − ' : ' + ') + js;
  }
  const zp = (R, X) => zParts({ R, X, d: 0 });
  // The builder's lines of working, from its settings.
  function bRows(c) {
    const b = circ(c.set), s = b.set, q = polar(b.R, b.X), none = q[0] < 1e-9;
    return [
      { e: 'X_L = 2π × ' + s.f + ' × ' + inH(s.L), w: fx1(b.xl) + ' Ω' },
      { e: 'X_C = 1 ÷ (2π × ' + s.f + ' × ' + inF(s.C) + ')', w: fx1(b.xc) + ' Ω' },
      { e: 'Z = ' + n2(b.R) + ' + j(' + fx1(b.xl) + ' − ' + fx1(b.xc) + ')', w: zParts(b) },
      { e: 'As a length and angle', w: none ? '0, no angle' : pname(q) },
      { e: 'Power factor cos φ', w: none ? 'not defined' : n2(Math.cos(rad(q[1]))) },
    ];
  }
  // The sentence under the builder: what is on screen now.
  function sayFree(c) {
    const at = c.set ? 'At ' + c.set.f + ' Hz the ' : 'The ', xl = fx1(c.xl), xc = fx1(c.xc), X = rnd(c.X, 1);
    if (X === 0) {
      return at + 'coil\'s ' + xl + ' Ω and the capacitor\'s ' + xc + ' Ω cancel, so Z is ' +
        (rnd(c.R, 2) > 0 ? 'the resistor\'s ' + n2(c.R) + ' Ω alone, along the real axis.' : '0: with no resistor either, nothing holds the current back.');
    }
    const up = X > 0, q = polar(c.R, c.X);
    return at + (up ? 'coil\'s ' + xl + ' Ω is bigger than the capacitor\'s ' + xc : 'capacitor\'s ' + xc + ' Ω is bigger than the coil\'s ' + xl) +
      ' Ω, so Z points ' + (up ? 'up, ' : 'down, ') + dg(Math.abs(q[1])) + (up ? ' above' : ' below') + ' the real axis.';
  }

  const MODEL = 'https://ibiblio.org/kuphaldt/socratic/model/mod_rxz.pdf';
  const BBC = 'https://www.bbc.co.uk/bitesize/guides/zcfm8mn/revision/3';
  const OSRLC = 'https://openstax.org/books/university-physics-volume-2/pages/15-3-rlc-series-circuits-with-ac';
  const ETUT = 'https://www.electronics-tutorials.ws/accircuits/complex-numbers.html';
  const BU = 'http://physics.bu.edu/~duffy/semester2/c20_AC.html';
  const OSX = 'https://openstax.org/books/college-physics-2e/pages/23-11-reactance-inductive-and-capacitive';

  // ---------- what a screen draws: a list of parts, each arriving at t (null: there from the start) ----------
  const SEG = (a, b, cls, t, o) => Object.assign({ k: 'seg', a, b, cls, t }, o);
  const CIRC = (o) => Object.assign({ k: 'circ' }, o);
  const ARC = (sw, t, o) => Object.assign({ k: 'arc', sw, t }, o);
  const TRI = (pts, t) => ({ k: 'tri', pts, t });
  const SQ = (at, up, t) => ({ k: 'sq', at, up, t });
  const RW = (e, w, t, o) => Object.assign({ k: 'row', e, w, t }, o);
  const LRW = (n, t) => ({ k: 'row', live: n, t });
  const WV = (o) => Object.assign({ k: 'wv' }, o);
  const wrong = (o) => Object.assign({ bad: true }, o);
  const KEYS = { r: ['shaft r', 'resistor, R'], l: ['shaft l', 'coil, +jX_L'], c: ['shaft c', 'capacitor, −jX_C'], z: ['shaft z', 'impedance Z'],
    t: ['box', 'impedance triangle'], i: ['wave i', 'current'], v: ['wave v', 'coil voltage'], h: ['proj', 'an arrow\'s height'], m: ['wave bad', 'a mistaken wave'] };
  const keyOf = (s) => s.split(' ').map((k) => KEYS[k]);

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  const DEF = { R: 8, L: 19.1, C: 318, f: 50 }, F2 = 100;
  const B50 = circ(DEF), B100 = circ(Object.assign({}, DEF, { f: F2 }));
  const R0 = 8, XL0 = 6, XC0 = 10, C0 = ex(R0, XL0, XC0), RL0 = ex(R0, XL0), XC1 = 10;
  const A86 = angOf(R0, XL0), Z10 = P(Math.hypot(R0, XL0), A86);
  const Z11 = [5, -53.13], R11 = Z11[0] * Math.cos(rad(Z11[1])), X11 = Z11[0] * Math.sin(rad(Z11[1]));
  const R12 = 6, X12 = 4;
  const sq = (v) => v * v;
  const VB = { lo: -2, hi: 15, blo: -11, bhi: 13, gs: 1, tk: 5 };   // the builder at its opening settings
  const STEPS = [
    { show: true, name: 'Coil up, capacitor down', view: { lo: -2, hi: 12, blo: -6, bhi: 8 }, dur: 4.0, lines: 1, key: keyOf('r l c z'),
      ops: [CIRC({ c: C0, tb: { r: 0.4, l: 1.0, c: 1.6, z: 2.4, a: 3.0 } }),
        RW('Z = ' + n2(R0) + ' + j' + n2(XL0) + ' − j' + n2(XC0), 'Z = ' + zParts(C0), 3.4)],
      text: 'A resistor, a coil and a capacitor each hold back an alternating current, and each one\'s opposition is counted in ohms. On the complex plane the resistor\'s lies along the real axis, the coil\'s points straight up and the capacitor\'s points straight down.',
      more: 'Here an 8 Ω resistor, a coil of 6 Ω and a capacitor of 10 Ω are laid tip to tail, as in the adding lesson. A coil\'s or a capacitor\'s size in ohms, `X_L` or `X_C`, is called its reactance. The arrow from 0 to the last tip is one complex number, `Z = 8 + j6 − j10 = 8 − j4`. It is called the impedance: the AC version of resistance, still in ohms. Its angle from the real axis is called φ.\nWith no coil or capacitor, Z is just R, your DC resistance, and parts in series still add as series resistors do, only now as arrows.' },
    { name: 'A 10 Ω capacitor', view: { lo: -2, hi: 12, blo: -12, bhi: 12, tk: 5 }, lines: 1, key: keyOf('r l c'),
      base: [SEG([0, 0], [R0, 0], 'r', null, { nm: n2(R0), lp: 'below' }), SEG([0, 0], [0, XL0], 'l', null, { nm: '+j' + n2(XL0), lp: 'right' })],
      opts: [n2(XC1), '+j' + n2(XC1), '−j' + n2(XC1)], ok: 2,
      truth: () => '−j' + n2(Math.abs(P(XC1, -QUARTER)[1])),
      truthOk: (g) => g.arrows.some((a) => a.cls === 'c' && !a.bad && same(a.b, P(XC1, -QUARTER), 1e-9)),
      mvs: [
        [SEG([0, 0], [XC1, 0], 'c', 0.1, wrong({ nm: n2(XC1), lp: 'above' })), RW('Along the real axis, a resistor\'s way', n2(XC1), 0.7, { bad: true })],
        [SEG([0, 0], [0, XC1], 'c', 0.1, wrong({ nm: '+j' + n2(XC1), lp: 'left' })), RW('Straight up, a coil\'s way', '+j' + n2(XC1), 0.7, { bad: true })],
        [SEG([0, 0], P(XC1, -QUARTER), 'c', 0.1, { nm: '−j' + n2(XC1), lp: 'right' }), RW('A quarter turn down: ' + n2(XC1) + ' × (−j)', '−j' + n2(XC1), 0.7)],
      ],
      task: 'A capacitor holds back the current by 10 Ω. Which complex number is its opposition?',
      hint: 'Not quite. A capacitor\'s opposition points straight down.',
      hints: { 0: 'Not quite. A plain 10 lies along the real axis, which is a resistor\'s way. A capacitor\'s points down.', 1: 'Not quite. +j10 points up, which is a coil\'s way. A capacitor\'s points down, so it takes −j.' },
      why: 'A capacitor\'s opposition is a quarter turn clockwise from the real axis, straight down. So its 10 Ω becomes `−j10`. The size, 10 Ω, is its reactance; the −j comes from it being a capacitor.' },
    { show: true, wave: true, name: 'Why straight up', dur: 4.3, key: keyOf('i v h'),
      ops: [WV({ ph: 0, cls: 'i', t: 0.5, dur: 3.0, pen: true }), WV({ ph: QUARTER, cls: 'v', t: 0.5, dur: 3.0, pen: true }),
        { k: 'xj', t: 0.5, dur: 3.0 }, { k: 'brk', a: 360, b: 450, t: 3.7 }],
      text: 'Why straight up? A coil\'s voltage follows how fast its current changes. The current changes fastest as it crosses zero, and stops changing for an instant at its peak.',
      more: 'So the coil\'s voltage is biggest as the current crosses zero, a quarter cycle before the current peaks. Drawn as turning arrows, the voltage\'s arrow is the current\'s turned a quarter turn anticlockwise, which is multiplying by j. A part\'s opposition is what turns its current into its voltage, as R does in `V = IR`, so a coil\'s opposition points up, `+jX_L`. A capacitor is the other way round: its current follows how fast its voltage changes, `i = C dv/dt`, so its current peaks a quarter cycle first and its opposition points down, `−jX_C`.' },
    { wave: true, name: 'Current crossing zero', key: keyOf('i v m'),
      base: [WV({ ph: 0, cls: 'i', at: 360 }), { k: 'now', at: 360 }],
      opts: ['At its peak', 'At zero', 'At its lowest'], ok: 0,
      truth: () => 'At its peak',
      truthOk: (g) => g.waves.some((w) => w.cls === 'v' && !w.bad && near(Math.sin(rad(360 + w.ph)), 1)) && g.dots.some((t) => !t.bad && near(t.y, WCY - WR, 1e-9)),
      mvs: [
        [WV({ ph: QUARTER, cls: 'v', t: 0.1, dur: 1.2, at: 360, dot: 'peak' })],
        [WV({ ph: 0, cls: 'v', t: 0.1, dur: 1.2, at: 360, dot: 'zero', bad: true })],
        [WV({ ph: -QUARTER, cls: 'v', t: 0.1, dur: 1.2, at: 360, dot: 'lowest', bad: true })],
      ],
      task: 'The current through a coil is crossing zero on its way up, at the dashed line. What is the coil\'s voltage doing then?',
      hint: 'Not quite. A coil\'s voltage follows how fast its current changes.',
      hints: { 1: 'Not quite. Rising and falling in step is a resistor\'s way. Here the current is changing fastest, so the coil\'s voltage is biggest.', 2: 'Not quite. That is a quarter cycle the other way, a capacitor\'s way round. The current is rising fastest here, so the coil\'s voltage is at its peak.' },
      why: 'A coil\'s voltage follows how fast its current changes. Crossing zero on its way up, the current is rising at its fastest, so the coil\'s voltage is at its peak. A quarter cycle later the current peaks and stops changing for an instant, and the voltage is zero.' },
    { show: true, free: true, name: 'The builder', view: VB, dur: 4.0, lines: 5, key: keyOf('r l c z'),
      ops: [CIRC({ c: B50, tb: { r: 0.4, l: 0.9, c: 1.5, z: 2.2, a: 2.8 } }), LRW(0, 1.2), LRW(1, 1.8), LRW(2, 2.6), LRW(3, 3.1), LRW(4, 3.5)],
      text: 'The sizes depend on the frequency f. A wave twice as steep doubles a coil\'s voltage for the same current, and drives twice the current through a capacitor for the same voltage. So a coil\'s reactance is `X_L = 2πfL` and a capacitor\'s is `X_C = 1 ÷ (2πfC)`, with L in henries and C in farads.',
      more: 'At 50 Hz, the UK mains frequency, a 19.1 mH coil has `X_L = 6.0 Ω` and a 318 µF capacitor has `X_C = 10.0 Ω`. With an 8 Ω resistor in series, `Z = 8 + j(6.0 − 10.0) = 8 − j4.0`.\nRaise the frequency and watch the coil\'s arrow grow and the capacitor\'s shrink. The other sliders change R, L and C.' },
    { name: 'At 100 Hz', view: { lo: -2, hi: 15, blo: -18, bhi: 13, tk: 5 }, lines: 2, key: keyOf('r l c z'),
      base: [CIRC({ c: B50 })],

    drawKey(d.key.filter((r) => r[0] === 'wave v' ? wv.some((w) => w.cls === 'v' && !w.bad) : r[0] === 'wave bad' ? wv.some((w) => w.bad) : true), WAVEG.keyY);
    placeLabels(LB);
  }
  function paintPlane(d, st, G, said) {
    const V = G.V, LB = [], W = [];
    plane(V);
    itemsOf(d, st).map((it, n) => ({ it, n })).sort((p, q) => (layerOf(p.it) - layerOf(q.it)) || (p.n - q.n)).forEach(({ it }) => drawItem(V, it, LB, W, said));
    W.forEach((r, m) => drawWork(r, m, G, said));
    if (!d.show && shownIdx(d, st) == null && G.lines) text(12, G.workY + 20, 'The working appears here after Check.', 'key', 'start');
    if (d.key) drawKey(d.key, G.keyY);
    placeLabels(LB);
  }
  function paintStep(d, st) {
    REC = { work: [], labels: [], arrows: [], arcs: [], bad: 0, circ: null, waves: [], dots: [], brk: null, tri: null, xj: false };
    AV = []; into = null; LIVE = null;
    art.textContent = '';
    const said = [];
    if (d.wave) {
      svg.setAttribute('viewBox', '0 0 340 ' + WAVEG.H);
      said.push('A current arrow and a coil voltage arrow turning in a circle, and the waves their heights trace out over time.');
      paintWave(d, st, said);
    } else {
      const view = d.free && st.mode === 'static' ? levelView(circ(st.set || sliderVals())) : d.view;
      const G = geo(view, d.lines || 0, d.key ? Math.ceil(d.key.length / 2) : 0);
      svg.setAttribute('viewBox', '0 0 340 ' + G.H);
      said.push('The complex plane in ohms, real across and j up.');
      paintPlane(d, st, G, said);
    }
    svg.setAttribute('aria-label', said.join(' '));
  }
  // The page's own paint: on a builder screen the sliders follow the demonstration, and the sentence says what is on screen.
  function paint(i) {
    if (i == null) i = cur();
    const d = STEPS[i], st = S[i];
    paintStep(d, st);
    if (d.free && LIVE) {
      if (st.mode !== 'static' && LIVE.set) setSliders(LIVE.set);
      el('say').textContent = sayFree(LIVE);
    }
  }

  write(el('finish'), FINISH);
  K.update((p) => {
    let i = Math.round(p.step), d = STEPS[i];
    // Sliders are hidden off the builder screens, so only a test can move them there: show what it set on the builder.
    if (!d.free && i === lastStep && seenS && !sameS(sliderVals(), seenS)) {
      i = STEPS.findIndex((x) => x.name === 'The builder'); d = STEPS[i];
      stepper.set(i, true); lastStep = i; enter('stepbox'); S[i] = blank();
    }
    if (!anim.playing()) T = Infinity;   // motion that was stopped (the page hidden, a test) shows finished
    if (i !== lastStep) {
      lastStep = i; enter('stepbox');
      if (d.show) { S[i] = blank(); if (d.free) setSliders(DEF); play(d.dur); } else { anim.pause(); T = Infinity; }
    } else if (d.free && seenS && !sameS(sliderVals(), seenS)) {
      // A slider moved: the builder follows it.
      if (anim.playing()) anim.pause();
      T = Infinity; S[i].mode = 'static';
      K.reveal();
    }
    seenS = sliderVals();
    if (finished !== lastDone) { lastDone = finished; enter(finished ? 'done' : 'stepbox'); }
    const st = S[i], right = st.res === 'right';
    el('stepbox').hidden = finished;
    el('done').hidden = !finished;
    el('count').textContent = 'Step ' + (i + 1) + ' of ' + STEPS.length;
    const task = el('task');
    task.className = 'task' + (d.show ? ' show' : '');
    write(task, d.show ? d.text : d.task);
    el('more').hidden = !(d.show && d.more);   // a SHOW screen's rest of the words, under its picture
    write(el('more'), d.show && d.more ? d.more : '');
    el('free').hidden = !d.free;
    el('say').hidden = !d.free;
    paint(i);

    replayBtn.el.hidden = !d.show || REDUCE;
    el('replay').hidden = replayBtn.el.hidden;
    const opts = d.show ? [] : d.opts;
    el('picks').hidden = !opts.length;
    el('picks').classList.toggle('long', opts.some((o) => o.length > 5));
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      b.setLabel(opts[k]);
      b.el.setAttribute('aria-label', spoken(opts[k]));
      b.el.setAttribute('aria-pressed', st.pick === k ? 'true' : 'false');
    });
    el('acts').hidden = !!d.show;
    checkBtn.el.hidden = right;
    const fb = el('fb');
    fb.hidden = !!d.show;
    fb.className = 'fb' + (right ? ' right' : st.res === 'wrong' ? ' wrong' : '');
    write(fb, d.show ? '' : right ? 'That\'s it.' : st.res === 'wrong' ? hintFor(d, st) : st.res === 'empty' ? 'Tap one of the answers.' : '');
    const why = el('why');
    why.hidden = d.show || !st.why;
    write(why, d.show ? '' : d.why);
    whyBtn.setLabel(st.why ? 'Hide why' : 'Why?');
    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !right);
    nextBtn.setLabel(i === STEPS.length - 1 ? 'Finish' : 'Continue');
    el('nav').hidden = backBtn.el.hidden && nextBtn.el.hidden;
  });

  // ---------- known answers, worked out by hand ----------
  const idx = (nm) => STEPS.findIndex((d) => d.name === nm);
  const DOS = STEPS.map((d, i) => i).filter((i) => !STEPS[i].show);
  const I2 = idx('Why straight up'), I4 = idx('The builder'), I8 = idx('Coil against capacitor');
  const solved = (i, k) => Object.assign(blank(), { pick: k, res: k === STEPS[i].ok ? 'right' : 'wrong' });
  // A screen painted in the state given, finished, without labels: what it drew.
  function drawnD(d, st) {
    const keepT = T;
    T = Infinity; NOLAB = true;
    try { paintStep(d, st); return Object.assign({}, REC); } finally { T = keepT; }
  }
  const drawn = (i, st) => drawnD(STEPS[i], st);
  const atSet = (s) => drawn(I4, { mode: 'static', set: s });
  const probe = (c) => drawnD({ show: true, view: { lo: -2, hi: 12, blo: -12, bhi: 12 }, lines: 0, ops: [CIRC({ c })] }, blank());
  // Each check paints what it needs, then puts the page back as it was.
  function chk(label, fn, opts) {
    K.check(label, () => { const keepT = T; try { return fn(); } finally { NOLAB = false; T = keepT; paint(); } }, opts);
  }
  const arrowOf = (g, cls) => g.arrows.find((a) => a.cls === cls && !a.bad);
  let ALL = null, BS = null;
  function allDrawn() {
    if (ALL) return ALL;
    ALL = [];
    STEPS.forEach((d, i) => {
      ALL.push(drawn(i, blank()));
      if (!d.show) d.opts.forEach((o, k) => ALL.push(drawn(i, solved(i, k))));
    });
    return ALL;
  }
  const FSET = [];
  [0, 8, 20].forEach((R) => [0, 19.1, 40].forEach((L) => [100, 318, 1000].forEach((C) => [20, 50, 65, 100, 150].forEach((f) => FSET.push({ R, L, C, f })))));
  const builderSample = () => BS || (BS = FSET.map((s) => ({ s, g: atSet(s) })));
  const dirOk = (a) => (a.cls === 'r' ? a.a[1] === 0 && a.b[1] === 0 && a.b[0] > a.a[0]
    : a.cls === 'l' ? near(a.a[0], a.b[0]) && a.b[1] > a.a[1]
      : a.cls === 'c' ? near(a.a[0], a.b[0]) && a.b[1] < a.a[1] : true);

  chk('Resistive impedance has a phase angle of zero degrees, so its vector points to the right, while inductive impedance with its 90° phase angle points up and capacitive impedance with its −90° phase angle points down: on every screen, in every answer and at every builder setting tested, the resistor\'s arrow points right along the real axis, the coil\'s straight up and the capacitor\'s straight down', () => {
    const gs = allDrawn().concat(builderSample().map((x) => x.g));
    return gs.every((g) => g.arrows.filter((a) => !a.bad).every(dirOk)) && gs.some((g) => !!arrowOf(g, 'c')) && gs.some((g) => !!arrowOf(g, 'l'));
  }, { source: MODEL });
  chk('Reactance is computed as XL = 2πfL: at every builder setting tested (R 0, 8 and 20 Ω; L 0, 19.1 and 40 mH; C 100, 318 and 1000 µF; f 20, 50, 65, 100 and 150 Hz) the coil\'s arrow is 2πfL ohms long, with L in henries, to 0.1 Ω, and starts at the resistor\'s tip', () =>
    builderSample().every(({ s, g }) => {
      const a = arrowOf(g, 'l'), want = rnd(2 * Math.PI * s.f * s.L / 1000, 1);
      return want === 0 ? !a : !!a && near(a.b[1] - a.a[1], want) && same(a.a, [s.R, 0]);
    }), { source: MODEL });
  chk('X_C = 1/ωC is the capacitive reactance, with ω = 2πf: at every builder setting tested the capacitor\'s arrow is 1 ÷ (2πfC) ohms long, with C in farads, to 0.1 Ω, and starts at the coil\'s tip', () =>
    builderSample().every(({ s, g }) => {
      const a = arrowOf(g, 'c'), w = 2 * Math.PI * s.f;
      return !!a && near(a.a[1] - a.b[1], rnd(1 / (w * s.C * 1e-6), 1)) && near(a.a[1], rnd(w * s.L * 1e-3, 1)) && near(a.a[0], s.R);
    }), { source: BU });
  chk('At very high frequencies, the capacitor\'s reactance tends to zero: on the builder each step up in frequency leaves the capacitor\'s arrow no longer and the coil\'s no shorter, and at the top of the frequency range the capacitor\'s is far shorter than at the bottom', () => {
    const mono = [19.1, 40].every((L) => [100, 318, 1000].every((C) => {
      for (let f = 20; f < 150; f++) { const a = circ({ R: 8, L, C, f }), b = circ({ R: 8, L, C, f: f + 1 }); if (!(b.xc <= a.xc && b.xl >= a.xl)) return false; }
      return true;
    }));
    const lo = arrowOf(atSet({ R: 8, L: 19.1, C: 318, f: 20 }), 'c'), hi = arrowOf(atSet({ R: 8, L: 19.1, C: 318, f: 150 }), 'c');
    return mono && !!lo && !!hi && (hi.a[1] - hi.b[1]) * 5 < (lo.a[1] - lo.b[1]);
  }, { source: OSX });
  chk('The mains supply in the UK is an alternating current at a frequency of 50 hertz: the builder opens at 50 Hz, where its 19.1 mH coil comes to 6.0 Ω and its 318 µF capacitor to 10.0 Ω', () => {
    const c = drawn(I4, blank()).circ;
    return DEF.f === 50 && !!c && c.set.f === 50 && fx1(c.xl) === '6.0' && fx1(c.xc) === '10.0';
  }, { source: BBC });
  chk('Impedance is the ac analog to resistance and measures the combined effect of resistance, capacitive reactance and inductive reactance: at every builder setting tested Z\'s arrow runs from 0 to the capacitor\'s tip, R + j(X_L − X_C), and where the coil\'s and capacitor\'s reactances are equal Z is R alone', () =>
    builderSample().every(({ s, g }) => {
      const z = arrowOf(g, 'z'), c = arrowOf(g, 'c'), want = [s.R, rnd(XLof(s.f, s.L), 1) - rnd(XCof(s.f, s.C), 1)];
      if (Math.hypot(want[0], want[1]) < 0.05) return !z;
      return !!z && same(z.a, [0, 0]) && same(z.b, want, 1e-9) && !!c && same(c.b, z.b, 1e-9);
    }) && (() => { const z = arrowOf(probe(ex(8, 7.7, 7.7)), 'z'); return !!z && same(z.b, [8, 0], 1e-9); })(), { source: OSRLC });
  chk('Z = 6 + j0 for a pure resistance and Z = 0 + j4 for a pure reactance: drawn by the builder\'s rule, the first lies along the real axis and the second points straight up', () => {
    const a = arrowOf(probe(ex(6, 0)), 'z'), b = arrowOf(probe(ex(0, 4)), 'z');
    return !!a && !!b && same(a.b, [6, 0], 1e-12) && same(b.b, [0, 4], 1e-12);
  }, { source: ETUT });
  chk('Known answers worked by hand: at 50 Hz 19.1 mH is 6.0 Ω and 318 µF is 10.0 Ω, at 100 Hz 12.0 Ω and 5.0 Ω; 8 + j6 − j10 = 8 − j4; 8 + j6 = 10∠36.87°, power factor 0.8; 8 − j4 = 8.94∠−26.57°, power factor 0.89; the builder at 100 Hz gives 8 + j7.0; 10∠36.87° = 8 + j6; 5∠−53.13° = 3 − j4; 6 + j8 = 10∠53.13°, 6 + j4 = 7.21∠33.69°, 6 + j2 = 6.32∠18.43°; the slips give 14, 2, 8 + j16 and 24', () => {
    const eq = [[fx1(XLof(50, 19.1)), '6.0'], [fx1(XCof(50, 318)), '10.0'], [fx1(XLof(100, 19.1)), '12.0'], [fx1(XCof(100, 318)), '5.0'],
      [zParts(C0), '8 − j4'], [zParts(B50), '8 − j4.0'], [pname(polar(8, 6)), '10∠36.87°'], [n2(Math.cos(rad(36.87))), '0.8'],
      [pname(polar(8, -4)), '8.94∠−26.57°'], [n2(Math.cos(Math.atan2(-4, 8))), '0.89'], [zParts(B100), '8 + j7.0'],
      [zp(Z10[0], Z10[1]), '8 + j6'], [zp(R11, X11), '3 − j4'], [pname(polar(6, 8)), '10∠53.13°'], [pname(polar(6, 4)), '7.21∠33.69°'],
      [pname(polar(6, 2)), '6.32∠18.43°'], [n2(8 + 6), '14'], [n2(8 - 6), '2'], [zp(8, 6 + 10), '8 + j16'], [n2(8 + 6 + 10), '24']];
    return eq.every((q) => q[0] === q[1]);
  });
  chk('Each puzzle takes only its right answer: its three answers differ, the right one matches a working done separately here and only it is drawn without a mistake; each wrong one is drawn as what its slip makes, in red', () =>
    DOS.every((i) => {
      const d = STEPS[i];
      if (d.opts.length !== 3 || new Set(d.opts).size !== 3 || d.opts[d.ok] !== d.truth()) return false;
      return d.opts.every((o, k) => { const g = drawn(i, solved(i, k)); return k === d.ok ? g.bad === 0 && d.truthOk(g) : g.bad > 0 && !d.truthOk(g); });
    }));
  chk('Before an answer, a puzzle shows only its question: no working, no voltage wave and nothing marked as a mistake', () =>
    DOS.every((i) => { const g = drawn(i, blank()); return g.work.length === 0 && g.bad === 0 && g.dots.length === 0 && !g.waves.some((w) => w.cls === 'v') && !STEPS[i].truthOk(g); }));
  chk('Every demonstration finishes within 4.8 s of its screen opening and none starts before the 0.35 s screen fade ends; every answer\'s motion, right or wrong, within 3 s', () => {
    const timed = (i, st) => { T = Infinity; latest = 0; earliest = Infinity; NOLAB = true; paintStep(STEPS[i], st); return { latest, earliest }; };
    return STEPS.every((d, i) => {
      if (d.show) { const r = timed(i, blank()); return r.latest <= d.dur + 1e-9 && d.dur <= 4.8 && d.dur >= 3 && r.earliest >= FADE; }
      return d.opts.every((o, k) => timed(i, solved(i, k)).latest <= 3 + 1e-9);
    });
  });
  chk('Raising the frequency lengthens the coil\'s arrow, shortens the capacitor\'s and swings Z from below the real axis to above it: at the opening settings, for every whole hertz from 50 to 100, the drawn coil never shortens, the capacitor never lengthens and Z\'s angle never falls, crossing the real axis between 64 and 66 Hz; the frequency demonstration ends at 100 Hz with Z above the axis', () => {
    let prev = null, ok = true;
    for (let f = 50; f <= 100; f++) {
      const g = atSet(Object.assign({}, DEF, { f })), l = arrowOf(g, 'l'), c = arrowOf(g, 'c'), z = arrowOf(g, 'z');
      if (!l || !c || !z) return false;
      const now = { l: l.b[1] - l.a[1], c: c.a[1] - c.b[1], phi: angOf(z.b[0], z.b[1]) };
      if (prev && !(now.l >= prev.l - 1e-9 && now.c <= prev.c + 1e-9 && now.phi >= prev.phi - 1e-9)) ok = false;
      if (f === 50 && !(now.phi < 0)) ok = false;
      if (f === 64 && !(now.phi < 0)) ok = false;
      if (f === 66 && !(now.phi > 0)) ok = false;
      prev = now;
    }
    const e = drawn(I8, blank()).circ;
    return ok && !!e && e.set.f === F2 && e.X > 0;
  });
  chk('A coil\'s voltage peaks a quarter cycle before its current: on the wave screen the voltage wave, its arrow a quarter turn ahead, peaks at 360°, the current\'s at 450°, and the bracket spans those 90°, a quarter of the 360° cycle', () => {
    const g = drawn(I2, blank()), v = g.waves.find((w) => w.cls === 'v' && !w.bad), c = g.waves.find((w) => w.cls === 'i');
    const peak = (w) => { let best = -2, at = 0; for (let th = 300; th <= TH; th += 5) { const y = Math.sin(rad(th + w.ph)); if (y > best + 1e-12) { best = y; at = th; } } return at; };
    return !!v && !!c && v.th1 === TH && c.th1 === TH && v.ph - c.ph === QUARTER && peak(v) === 360 && peak(c) === 450 && !!g.brk &&
      g.brk[0] === peak(v) && g.brk[1] === peak(c) && (g.brk[1] - g.brk[0]) * 4 === 360 && g.xj;
  });
  chk('From outside the rule: the practice coil, 12 Ω of winding with 50.9 mH on 50 Hz, has X_L = 16.0 Ω and Z = 12 + j16 = 20∠53.13°, power factor 0.6; the power triangle\'s 8 kW with 6 kVAr is 10 kVA, not 14; and a coil and capacitor cancel where 2πfL = 1 ÷ (2πfC), at f = 1 ÷ (2π√(LC)), which for 19.1 mH and 318 µF is near 65 Hz', () => {
    const xl = XLof(50, 50.9), f0 = 1 / (2 * Math.PI * Math.sqrt(0.0191 * 0.000318));
    return fx1(xl) === '16.0' && pname(polar(12, rnd(xl, 1))) === '20∠53.13°' && n2(Math.cos(Math.atan2(16, 12))) === '0.6' &&
      Math.hypot(8, 6) === 10 && Math.round(f0) === 65 && near(XLof(f0, 19.1), XCof(f0, 318), 1e-9);
  });

  K.ready();
</script>
