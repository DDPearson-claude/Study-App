<p class="caption">Adding works like two-dimensional vectors (Sheffield); times −1 turns an arrow 180° (LibreTexts); axes as in an Argand diagram (Newcastle).</p>

<script>
  // ---------- numbers: a complex number is [real part, j part] ----------
  const Z = (re, im) => [re, im || 0];
  const O = Z(0), NEG = Z(-1);
  const plus = (a, b) => [a[0] + b[0], a[1] + b[1]];
  const times = (a, b) => [a[0] * b[0] - a[1] * b[1], a[0] * b[1] + a[1] * b[0]];
  const neg = (a) => times(NEG, a);   // turned half round
  const minus = (a, b) => plus(a, neg(b));
  const scale = (z, p) => [z[0] * p, z[1] * p];
  const tidy = (v) => (Math.abs(v) < 1e-9 ? 0 : Math.round(v * 1e6) / 1e6);
  const size = (z) => Math.hypot(z[0], z[1]);
  // The direction an arrow points, anticlockwise from the real axis, in degrees (0 up to 360).
  const turnOf = (z) => { const a = tidy(Math.atan2(z[1], z[0]) * 180 / Math.PI); return a < 0 ? a + 360 : a; };
  const same = (a, b) => !!a && !!b && Math.abs(a[0] - b[0]) < 1e-6 && Math.abs(a[1] - b[1]) < 1e-6;
  const num = (v) => { v = tidy(v); return (v < 0 ? '−' : '') + Math.abs(v); };
  // As the explanation writes it: 3 + j2, −2 − j3, 6 + j0 (full), or short: 8, 0, j10.
  function name(z, full) {
    const re = tidy(z[0]), im = tidy(z[1]);
    if (!full && !im) return num(re);
    if (!full && !re) return (im < 0 ? '−' : '') + 'j' + Math.abs(im);
    return num(re) + (im < 0 ? ' − ' : ' + ') + 'j' + Math.abs(im);
  }
  const paren = (z) => '(' + name(z, true) + ')';
  const sumText = (x, y) => num(x) + ' + ' + (tidy(y) < 0 ? '(' + num(y) + ')' : num(y));
  const dirWords = (z) => { const re = tidy(z[0]), im = tidy(z[1]); return (re < 0 ? num(-re) + ' left' : num(re) + ' across') + ', ' + (im < 0 ? num(-im) + ' down' : num(im) + ' up'); };
  const jTick = (w) => (w < 0 ? '−' : '') + 'j' + Math.abs(w);
  const rot = (z, deg) => { const r = size(z), a = (turnOf(z) + deg) * Math.PI / 180; return [r * Math.cos(a), r * Math.sin(a)]; };
  const HALF = turnOf(NEG);   // 180°: the turn that times −1 makes

  // Sources the checks restate (the lesson's own).
  const LIBRE = 'https://chem.libretexts.org/Bookshelves/Physical_and_Theoretical_Chemistry_Textbook_Maps/Physical_Chemistry_(LibreTexts)/32%3A_Math_Chapters/32.01%3A_Complex_Numbers';
  const NCL = 'https://www.mas.ncl.ac.uk/ask/numeracy-maths-statistics/core-mathematics/pure-maths/algebra/modulus-and-argument.html';
  const SHEF = 'https://sheffield.ac.uk/media/31975/download?attachment';

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // pic: 'plane' (numbers placed across then up), 'read' (which number is this dot or arrow?), 'sum' (two
  // arrows laid tip to tail). a, b: the first and second numbers; sub: taking away; drag: both tips can be
  // dragged; sw: an Add / Take away switch; other: the other order too; lengths: the lengths compared.
  // A puzzle's mvs give each answer what it lays on the first arrow's tip (t), a misread first number (a),
  // the half turn (turn), or every part lumped into one number (lump); its label is where that lands.
  const RKEY = [{ sw: 'leg re', label: 'real part, across' }, { sw: 'leg im', label: 'j part, up' }];
  const SKEY = [{ sw: 'shaft a', label: 'first' }, { sw: 'shaft b', label: 'second' }, { sw: 'shaft slidk', label: 'slid' }, { sw: 'shaft sum', label: 'sum' }];
  const DRAGV = { lo: -5, hi: 7, blo: -5, bhi: 5 };
  const PICK = 'Tap one of the answers.';
  const STEPS = [
    { show: true, name: 'The complex plane', pic: 'plane', key: RKEY, lines: 2, dur: 4.0,
      nums: [{ z: Z(3, 2), t: 0.5 }, { z: Z(-2, -3), t: 2.3 }],
      text: 'A complex number has two parts, a real part and a `j` part, so it needs two directions. Keep the number line across for the real part, and give the `j` part its own line through 0, straight up, with `j1` one step up and `−j2` two steps down. This is the coordinate plane with its axes renamed, called the *complex plane*.\n`3 + j2` sits 3 across and 2 up. `−2 − j3` sits 2 to the left and 3 down. Read each number as the arrow from 0 to its dot.' },
    { name: 'Read a dot', pic: 'read', as: 'dot', z: Z(-2, 3), key: RKEY, lines: 1,
      mvs: [Z(-3, 2), Z(-2, 3), Z(2, 3)], ok: 1,
      task: 'Which number does this dot mark?',
      hint: 'Not quite. Count across from 0 first, then up.',
      hints: { 0: 'Not quite. That swaps the parts. The real part is how far across, and the dot is 2 to the left, not 3.', 2: 'Not quite. The dot is to the left of 0, so its real part is negative.' },
      why: 'Across first. The dot is 2 to the left of 0, so its real part is `−2`. Then up. It is 3 up, so its `j` part is 3. The dot marks `−2 + j3`.' },
    { show: true, name: 'Four quarters', pic: 'plane', key: RKEY, lines: 3, dur: 4.2,
      old: [Z(3, 2), Z(-2, 3), Z(-2, -3)],
      nums: [{ z: Z(4, -3), t: 0.4 }, { z: Z(6, 0), t: 1.9, full: true, w: 'pure resistance' }, { z: Z(0, 4), t: 3.0, full: true, w: 'pure reactance' }],
      text: 'The two axes cut the plane into four quarters, and complex numbers sit in all of them. `4 − j3` is in the bottom right, 4 across and 3 down. A number with no `j` part lies on the real axis, like `6 + j0`, and one with no real part lies on the `j` axis, like `0 + j4`.\nLater lessons use this plane for a circuit\'s opposition to AC, which is measured in ohms. There the real part is the *resistance* and the `j` part the *reactance*, which is why the axes carry those names in brackets. So `6 + j0` is a pure resistance, and `0 + j4` a pure reactance.' },
    { name: 'Read an arrow', pic: 'read', as: 'arrow', z: Z(3, -2), key: RKEY, lines: 1,
      mvs: [Z(3, 2), Z(2, -3), Z(3, -2)], ok: 2,
      task: 'Which number does this arrow show?',
      hint: 'Not quite. Read across first, then up or down.',
      hints: { 0: 'Not quite. The arrow ends below the real axis, so its `j` part is negative.', 1: 'Not quite. That swaps the parts. The arrow ends 3 across, so the real part is 3.' },
      why: 'The arrow ends 3 across, so the real part is 3, and 2 down, so the `j` part is `−2`. It shows `3 − j2`.' },
    { show: true, name: 'Tip to tail', pic: 'sum', drag: true, view: DRAGV, a: Z(3, 1), b: Z(1, 2), key: SKEY, lines: 3, dur: 3.6,
      text: 'Add `(3 + j1) + (1 + j2)`. Slide the second arrow, without turning or stretching it, until its tail sits on the first arrow\'s tip. It still means 1 across and 2 up. Going up does not change how far across you are, so the across parts add on their own, `3 + 1 = 4`, and the up parts add on their own, `1 + 2 = 3`. The bold arrow from 0 to the finish is the sum, `4 + j3`. Lumping every number together, `3 + 1 + 1 + 2 = 7`, would lose which way it points.\nDrag either tip, in any quarter, and watch the parts add along the axes.' },
    { name: '(2 + j3) + (4 − j1)', pic: 'sum', a: Z(2, 3), b: Z(4, -1), key: SKEY, lines: 3,
      mvs: [{ t: Z(4, -1) }, { lump: true }, { t: Z(4, 1) }], ok: 0,
      task: 'Work out `(2 + j3) + (4 − j1)`. After Check, the second arrow slides onto the first to show your answer.',
      hint: 'Not quite. Add the real parts, then the `j` parts.',
      hints: { 1: 'Not quite. That lumps every part into one number. Keep real with real and `j` with `j`.', 2: 'Not quite. The `j` part of `4 − j1` is `−1`, so the `j` parts make `3 + (−1)`.' },
      why: 'Real parts: `2 + 4 = 6`. The `j` parts: `3 + (−1) = 2`. So the sum is `6 + j2`. Laid on the first arrow\'s tip, the second arrow finishes 6 across and 2 up.' },
    { show: true, name: 'Lengths do not add', pic: 'sum', lengths: true, a: Z(4, 0), b: Z(0, 3), key: SKEY, lines: 3, dur: 4.3,
      text: 'The sum adds the parts, not the lengths. Take `4 + j0`, an arrow 4 long, and `0 + j3`, an arrow 3 long. Their lengths add to `4 + 3 = 7`. But the sum `4 + j3` runs straight from 0 to the finish, and by Pythagoras it is only `√(4² + 3²) = 5` long. Lengths add only when the arrows point the same way.' },
    { name: '(−3 + j2) + (1 − j4)', pic: 'sum', a: Z(-3, 2), b: Z(1, -4), key: SKEY, lines: 3,
      mvs: [{ t: Z(-1, -4) }, { t: Z(1, -4) }, { t: Z(1, 4) }], ok: 1,
      task: 'Work out `(−3 + j2) + (1 − j4)`.',
      hint: 'Not quite. Add the real parts, then the `j` parts, keeping each sign.',
      hints: { 0: 'Not quite. The real parts are `−3 + 1`. Adding 1 moves right, to `−2`.', 2: 'Not quite. The `j` part of `1 − j4` is `−4`, so the `j` parts make `2 + (−4)`.' },
      why: 'Real parts: `−3 + 1 = −2`. The `j` parts: `2 + (−4) = −2`. The sum is `−2 − j2`, in the bottom left quarter.' },
    { show: true, name: 'Taking away', pic: 'sum', drag: true, sw: true, sub: true, view: DRAGV, a: Z(5, 3), b: Z(2, 1), key: SKEY, lines: 4, dur: 4.5,
      text: 'Taking away is adding the opposite. Multiplying by `−1` turns an arrow through 180°, the same length pointing the other way, so `−(2 + j1)` is `−2 − j1`. Both parts change sign. Then add as before. `(5 + j3) − (2 + j1)` is `(5 + j3) + (−2 − j1)`, which makes `3 + j2`, real from real and `j` from `j`.\nSwitch between Add and Take away, and drag either tip.' },
    { name: '(4 + j1) − (1 − j3)', pic: 'sum', sub: true, a: Z(4, 1), b: Z(1, -3), key: SKEY, lines: 4,
      mvs: [{ t: Z(-1, -3), e: 'First sign changed only' }, { turn: true }, { t: Z(1, -3), e: 'No half turn' }], ok: 1,
      task: 'Work out `(4 + j1) − (1 − j3)`.',
      hint: 'Not quite. Turn the second number half round, then add.',
      hints: { 0: 'Not quite. Taking away changes the sign of both parts, so `−(1 − j3)` is `−1 + j3`.', 2: 'Not quite. That adds the second number. Turn it half round first.' },
      why: 'Turn the second number half round. `−(1 − j3) = −1 + j3`. Then add. Real parts: `4 + (−1) = 3`. The `j` parts: `1 + 3 = 4`. The answer is `3 + j4`.' },
    { show: true, name: 'Either order', pic: 'sum', drag: true, sw: true, other: true, view: DRAGV, a: Z(-3, 2), b: Z(4, -5), key: SKEY, lines: 4, dur: 4.4,
      text: 'Lay the arrows the other way round, the first on the second one\'s tip, and you finish at the same point. `(−3 + j2) + (4 − j5)` and `(4 − j5) + (−3 + j2)` both make `1 − j3`, so the order does not matter.\nNow drag either tip into any quarter, and try Take away too. Real with real and `j` with `j`, every time.' },
    { name: '(−2 + j5) + (2 − j5)', pic: 'sum', a: Z(-2, 5), b: Z(2, -5), key: SKEY, lines: 3,
      mvs: [{ a: Z(2, 5), t: Z(2, -5) }, { t: Z(2, 5) }, { t: Z(2, -5) }], ok: 2,
      task: 'Work out `(−2 + j5) + (2 − j5)`.',
      hint: 'Not quite. Add the real parts, then the `j` parts, keeping each sign.',
      hints: { 0: 'Not quite. The real part of `−2 + j5` is `−2`, so the real parts make `−2 + 2`.', 1: 'Not quite. The `j` part of `2 − j5` is `−5`, so the `j` parts make `5 + (−5)`.' },
      why: 'Real parts: `−2 + 2 = 0`. The `j` parts: `5 + (−5) = 0`. The second arrow points exactly the opposite way to the first, so laid on its tip it leads straight back to 0. The sum is 0.' },
    { name: 'w = (5 + j1) − (2 + j3)', pic: 'sum', sub: true, q: 'w = (5 + j1) − (2 + j3)', a: Z(5, 1), b: Z(2, 3), key: SKEY, lines: 4,
      mvs: [{ turn: true }, { t: Z(2, 3), e: 'No half turn' }, { t: Z(-2, 3), e: 'First sign changed only' }], ok: 0,
      task: 'Work out `w = (5 + j1) − (2 + j3)`.',
      hint: 'Not quite. Turn the second number half round, then add.',
      hints: { 1: 'Not quite. That adds the two numbers. To take away, turn the second half round first.', 2: 'Not quite. Taking away changes the sign of both parts, so the `j` parts make `1 + (−3)`.' },
      why: 'Turn the second number half round. `−(2 + j3) = −2 − j3`. Then real parts: `5 + (−2) = 3`, and the `j` parts: `1 + (−3) = −2`. So `w = 3 − j2`.' },
  ];
  const FINISH = 'To add complex numbers, add the real parts together and the `j` parts together, which lays their arrows tip to tail. To take away, turn the second arrow half round, then add.';
  const GROW = 0.5, TURN = 0.8, SLIDE = 0.75, SUMD = 0.45, OTHER = 0.75, OVER = 0.6;
  const FADE = 0.35;
  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const testing = () => document.documentElement.classList.contains('k-testing');

  // ---------- each step's state ----------
  // pick (an answer's index), res ('right', 'wrong' or 'empty'), why; A, B: the tips Dan set (null: the
  // step's own); sub: Take away on (null: the step's own); mode: 'demo', 'quick' (after the switch) or 'static'.
  function blank() { return { pick: null, res: null, why: false, A: null, B: null, sub: null, mode: 'demo' }; }
  const hintFor = (d, st) => (d.hints && d.hints[st.pick]) || d.hint;
  const shownIdx = (d, st) => (st.why || st.res === 'right' ? d.ok : st.res === 'wrong' ? st.pick : null);
  const subOf = (d, st) => (st.sub != null ? st.sub : !!d.sub);
  const tipsOf = (d, st) => ({ A: st.A || d.a, B: st.B || d.b });
  const laidOf = (d, m) => (m.turn ? neg(d.b) : m.t);
  const lumpOf = (d) => d.a[0] + d.a[1] + d.b[0] + d.b[1];
  const lumpText = (d) => [d.a[0], d.a[1], d.b[0], d.b[1]].map((v, k) => (k && v < 0 ? '(' + num(v) + ')' : num(v))).join(' + ');
  function optZ(d, k) {
    const m = d.mvs[k];
    if (d.pic === 'read') return m;
    if (m.lump) return Z(lumpOf(d));
    return plus(m.a || d.a, laidOf(d, m));
  }
  STEPS.forEach((d) => { if (d.mvs) d.opts = d.mvs.map((m, k) => name(optZ(d, k))); });
  let S = STEPS.map(() => blank());
  let finished = false, lastStep = -1, lastDone = false, T = Infinity, motionEnd = 0;
  let REC = null, NOLAB = false, AV = [], KN = {};

  // ---------- text: maths in `backticks` stays on one line; *key terms* highlighted ----------
  const ITAL = /(\bw\b)/;

  }
  function writeLine(el, s) {
    String(s).split('`').forEach((seg, k) => {
      if (!seg) return;

      const re = /\*([^*]+)\*/g;
      let at = 0, m;

  // As a screen reader says it.
  const say = (s) => String(s == null ? '' : s).replace(/√/g, ' the square root of ').replace(/²/g, ' squared').replace(/°/g, ' degrees')
    .replace(/=/g, ' equals ').replace(/\+/g, ' plus ').replace(/−/g, ' minus ').replace(/\s+/g, ' ').trim();

  // ---------- controls ----------
  const el = (id) => document.getElementById(id);
  const stepper = K.stepper({ id: 'step', label: 'Step', steps: STEPS.map((d) => d.name), value: 0, compact: true, into: '#prog' });
  const cur = () => stepper.get();
  function motionLen(i, st) {
    const keepS = S[i], keepT = T, keepN = NOLAB;

  // Up to three answers; a new choice after a wrong one settles the picture back to the question.
  const pickBtns = [0, 1, 2].map((k) => K.button({ label: 'Answer ' + (k + 1), secondary: true, into: '#picks', press: () => {
    const i = cur(), d = STEPS[i], st = S[i];

  // Check: marks the answer, then lays its arrows: the right one, or what the slip does.
  const checkBtn = K.button({ label: 'Check', into: '#acts', press: () => {
    const i = cur(), d = STEPS[i], st = S[i];
    if (d.show || finished) return;

    st.why = false;

  // Why?: the reason in words, and the right answer's arrows laid again.
  const whyBtn = K.button({ label: 'Why?', secondary: true, into: '#acts', press: () => {
    const i = cur(), d = STEPS[i], st = S[i];

  } });
  // Add or Take away: the second arrow is laid on as it is, or turned half round first.
  const swBtns = [false, true].map((sub) => K.button({ label: sub ? 'Take away' : 'Add', secondary: true, into: '#sw', press: () => {
    const i = cur(), d = STEPS[i], st = S[i];
    if (finished || !d.sw || subOf(d, st) === sub) return;
    const tp = tipsOf(d, st);
    st.A = tp.A;
    st.B = fits(d, tp.A, tp.B, sub) ? tp.B : nearestFit(d, tp.B, 'B', tp, sub);
    st.sub = sub; st.mode = 'quick';
    play(motionLen(i, st));
  } }));
  const replayBtn = K.button({ label: 'Play again', secondary: true, into: '#replay', press: () => {
    const i = cur(), d = STEPS[i];
    if (!d.show || finished) return;
    S[i].mode = 'demo';
    play(d.dur);
  } });
  const backBtn = K.button({ label: 'Back', secondary: true, into: '#nav', press: () => {
    if (finished) { finished = false; return; }
    stepper.set(Math.max(0, cur() - 1), true);
  } });
  const nextBtn = K.button({ label: 'Continue', into: '#nav', press: () => {
    const i = cur();
    if (finished || (!STEPS[i].show && S[i].res !== 'right')) return;
    if (i < STEPS.length - 1) { stepper.set(i + 1, true); return; }
    finished = true;
    if (typeof K.complete === 'function') K.complete();
  } });
  K.button({ label: 'Start again', secondary: true, into: '#again', press: () => {
    S = STEPS.map(() => blank()); finished = false; lastStep = -1; stepper.set(0, true);
  } });

  // One animation plays each demonstration and the motion after an answer or a switch; with reduced
  // motion (and while the self-test looks) everything opens finished.
  const anim = K.anim({ button: false, label: 'Demonstration', step: (dt) => {
    if (finished) return false;
    T += dt;
    paint();
    return T < motionEnd;
  } });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !anim.playing() && T !== Infinity) { T = Infinity; paint(); } });
  function play(dur) {
    if (REDUCE || testing()) { T = Infinity; anim.pause(); paint(); return; }
    motionEnd = dur; T = 0; anim.play();
  }
  function enter(id) {
    if (REDUCE) return;
    const box = el(id);
    box.classList.remove('enter');
    void box.offsetWidth;
    box.classList.add('enter');
  }

  // ---------- drawing ----------
  const svg = el('scene'), art = el('art'), lab = el('lab'), ui = el('ui');
  let into = null;
  const add = (node) => (into || art).appendChild(node);
  // How far a part due at t0 has arrived, noting the timetable for the timing check.
  let latest = 0, earliest = Infinity;
  function note(t0, d) { if (t0 >= 0) { if (t0 + d > latest) latest = t0 + d; if (t0 < earliest) earliest = t0; } }
  function arr(t0, d) { d = d == null ? 0.4 : d; note(t0, d); return K.arrive(T, t0, d); }
  function prog(t0, d) { note(t0, d); return T === Infinity ? 1 : K.clamp((T - t0) / d, 0, 1); }
  // A timetable entry: false, not shown; null, there from the start; a time, arriving then.
  const vis = (t) => (t === false ? 0 : t == null ? 1 : arr(t));
  const after = (t, d) => (t === false ? false : t == null ? null : t + d);
  const grow = (t0, d) => (t0 === false ? 0 : t0 == null ? 1 : K.ease(prog(t0, d)));
  function part(a, rise, draw) {
    if (a <= 0) return;
    const g = add(K.svg('g'));
    K.fade(g, a, rise);
    const keep = into; into = g; draw(); into = keep;
  }
  const r3 = (v) => Math.round(v * 1000) / 1000;
  const rad = (a) => a * Math.PI / 180;
  const line = (cls, x1, y1, x2, y2) => add(K.svg('line', { class: cls, x1: r3(x1), y1: r3(y1), x2: r3(x2), y2: r3(y2) }));
  const circle = (cls, x, y, r) => add(K.svg('circle', { class: cls, cx: r3(x), cy: r3(y), r }));
  function text(x, y, s, cls, anchor, maths) {
    const t = K.svg('text', { class: cls, x: r3(x), y: r3(y), 'text-anchor': anchor || 'middle' });
    if (maths) italics(t, s, true); else t.textContent = s;
    return add(t);
  }
  const widths = {};
  function tw(s, cls) {
    const key = cls + '|' + s;
    if (widths[key]) return widths[key];
    const t = svg.appendChild(K.svg('text', { class: cls, x: 0, y: -50 }, s));
    let w = 0;
    try { w = t.getComputedTextLength(); } catch (e) { w = 0; }
    svg.removeChild(t);
    if (w > 0) { widths[key] = w; return w; }
    return String(s).length * 7;
  }
  // An arrow with a solid head at (x1, y1).
  function arrowPx(x0, y0, x1, y1, cls, hmax) {
    const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy);
    if (L < 1) return;
    const ux = dx / L, uy = dy / L, h = Math.min(hmax || 11, L * 0.55), w = h * 0.5, bx = x1 - ux * h, by = y1 - uy * h;
    if (L - h > 0.5) AV.push(line('shaft ' + cls, x0, y0, bx + ux, by + uy));
    AV.push(add(K.svg('polygon', { class: 'head ' + cls, points: [x1, y1, bx - uy * w, by + ux * w, bx + uy * w, by - ux * w].map(r3).join(' ') })));
  }

  // ---------- the plane's sizes ----------
  const X = (V, x) => V.ox + x * V.u, Y = (V, y) => V.oy - y * V.u;
  const arrowZ = (V, from, to, cls, hmax) => arrowPx(X(V, from[0]), Y(V, from[1]), X(V, to[0]), Y(V, to[1]), cls, hmax);
  const LEFT = 30, TOPB = 24, BOTB = 24, UMAX = 32, HMAX = 270, WAV = 302, NAMEW = 112;
  const overOf = (A, B) => { const R = plus(A, B); return scale(R, (size(A) + size(B)) / size(R)); };
  // Every point a step draws, in any state, so its plane shows them all with a step to spare.
  function pointsOf(d) {
    if (d.pic === 'plane') return d.nums.map((n) => n.z).concat(d.old || []);
    if (d.pic === 'read') return [d.z].concat(d.mvs);

    if (!d.sub || d.sw) out.push(plus(d.a, d.b));
    if (d.sub || d.sw) out.push(neg(d.b), minus(d.a, d.b));
    (d.mvs || []).forEach((m, k) => { out.push(optZ(d, k)); if (!m.lump) out.push(m.a || d.a, laidOf(d, m)); });

  }
  function boundsOf(d) {

  // The plane: grid, axes, numbers along the edges, and the axes' names.
  function plane(V) {
    const x0 = V.gx, x1 = V.gx + V.gw, y0 = V.gy, y1 = V.gy + V.gh;

    for (let w = V.blo; w <= V.bhi; w++) line('gr', x0, Y(V, w), x1, Y(V, w));
    line('ax', x0, V.oy, x1, V.oy);
    line('ax', V.ox, y0, V.ox, y1);

    for (let v = V.lo; v <= V.hi; v++) if (v % k === 0) text(X(V, v), y1 + 17, num(v), v ? 'tn' : 'tn0');
    for (let w = V.blo; w <= V.bhi; w++) if (w && w % k === 0) text(x0 - 5, Y(V, w) + 4.5, jTick(w), 'tn', 'end');
    const jw = tw('j (reactance)', 'an');
    if (V.ox + 6 + jw <= 336) text(V.ox + 6, y0 - 8, 'j (reactance)', 'an', 'start');
    else text(V.ox - 6, y0 - 8, 'j (reactance)', 'an', 'end');
    if (V.outside) text(x1 + 6, V.oy + 4.5, 'real (resistance)', 'an', 'start');
    else { text(x1 - 3, V.oy + 19, 'real', 'an', 'end'); text(x1 - 3, V.oy + 33, '(resistance)', 'an', 'end'); }
  }
  // A number's two parts from 0: across along the real axis, then up.
  function legs(V, z, tA, tU, bad) {
    const re = tidy(z[0]), im = tidy(z[1]), pA = re ? grow(tA, 0.45) : 0, pU = im ? grow(tU, 0.45) : 0;
    if (pA > 0) AV.push(line('leg ' + (bad ? 'bad' : 're'), X(V, 0), V.oy, X(V, re * pA), V.oy));
    if (pU > 0) AV.push(line('leg ' + (bad ? 'bad' : 'im'), X(V, re), V.oy, X(V, re), Y(V, im * pU)));
  }
  // One part of an arrow laid along an axis (c = 0, the real axis; c = 1, the j axis), lifted off it by off.
  function bar(V, c, f, to, off, cls) {

    else line('bar ' + cls, V.ox + off, Y(V, f), V.ox + off, Y(V, to));

  // The turn so far, traced round 0, with a small head showing its way.

  // ---------- the pictures ----------
  // Numbers placed on the plane: across, then up, then the arrow from 0 to the dot.
  function drawPlane(d, st, G, W, LB, said) {
    const V = G.V;
    plane(V);
    (d.old || []).forEach((z) => {
      AV.push(circle('dot old', X(V, z[0]), Y(V, z[1]), 4.5));
      LB.push({ z, dir: null, text: name(z), cls: 'tl old', a: 1 });
    });
    d.nums.forEach((n) => {
      const z = n.z, re = tidy(z[0]) !== 0, im = tidy(z[1]) !== 0;
      const tA = n.t, tU = re ? n.t + 0.5 : n.t, tR = im ? tU + 0.5 : tU, a = vis(tR);

      if (a >= 1) REC.dots.push({ z, x: X(V, z[0]), y: Y(V, z[1]) });
      LB.unshift({ z, dir: turnOf(z), text: name(z, n.full), cls: 'tl', a });
      W.push({ e: name(z, n.full), w: n.w || dirWords(z), t: tR });
      if (a >= 1) said.push(name(z, n.full) + ' sits ' + dirWords(z) + '.');

  }

  // Which number is this? The answer's parts are laid from 0, across then up, to where it lands.
  function drawRead(d, st, G, W, LB, said) {
    const V = G.V, z = d.z, k = shownIdx(d, st);

    said.push(d.as === 'arrow' ? 'An arrow from 0 to a point on the plane.' : 'A dot on the plane.');
    if (k == null) return;

  }

  // When each motion of a sum starts: false, never; null, already done.
  function sched(d, st, m) {
    const no = false;

      const base = { tA: null, tB: null, tTurn: no, tCopy: no, tSlide: no, tSum: no, tOther: no, tOver: no, tBarsA: no, tBarsT: no };
      if (!m || m.lump) return base;

      return Object.assign(base, { tCopy: 0.1, tSlide: 0.55, tSum: 0.55 + SLIDE + 0.1, tBarsA: 0.1, tBarsT: 0.1 });

  }

  // Two arrows from 0; the second (turned half round first, to take away) slides onto the first one's tip,
  // its real part and j part riding along the axes; the bold arrow from 0 to the finish is the sum.
  function drawSum(d, st, G, W, LB, said) {
    const V = G.V;
    plane(V);
    const tp = tipsOf(d, st), A = tp.A, B = tp.B, sub = subOf(d, st);
    const k = d.show ? null : shownIdx(d, st), m = k == null ? null : d.mvs[k];
    const wrong = !!m && k !== d.ok, bad = wrong ? ' bad' : '';
    const sc = sched(d, st, m);
    let a = A, t = null, turn = false;
    if (d.show) { t = sub ? neg(B) : B; turn = sub; }
    else if (m && !m.lump) { a = m.a || A; t = laidOf(d, m); turn = !!m.turn; }
    const misread = !same(a, A), R = t ? plus(a, t) : null;
    const pA = grow(sc.tA, GROW), pB = grow(sc.tB, GROW), pTurn = turn ? grow(sc.tTurn, TURN) : 0;
    const pSlide = t ? grow(sc.tSlide, SLIDE) : 0, pSum = R ? grow(sc.tSum, SUMD) : 0;

    REC.A = A; REC.B = B; REC.t = t;
    LB.push({ z: A, dir: turnOf(A), text: name(A, true), cls: 'tl', a: vis(after(sc.tA, GROW)) });
    LB.push({ z: B, dir: turnOf(B), text: name(B, true), cls: 'tl', a: vis(after(sc.tB, GROW)) });
    if (R) LB.push({ z: R, dir: size(R) > 1e-9 ? turnOf(R) : null, text: d.show ? name(R, true) : d.opts[k], cls: 'tl' + bad, a: vis(after(sc.tSum, SUMD)) });

        part(aA, 0, () => bar(V, c, 0, a[c], 0, misread ? 'bad' : 'a'));

      const am = rad(turnOf(B) + HALF / 2), ag = vis(sc.tSlide);
      LB.push({ pt: [V.ox + 38 * Math.cos(am), V.oy - 38 * Math.sin(am) + 5], text: num(HALF) + '°', cls: 'al', a: vis(after(sc.tTurn, TURN)) });
      part(ag, 0, () => arrowZ(V, O, t, 'ghost', 9));
      LB.push({ z: t, dir: turnOf(t), text: name(t, true), cls: 'tl old', a: ag });
