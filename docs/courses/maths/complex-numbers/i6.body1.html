<p class="caption">To multiply, multiply the moduli and add the arguments; to divide, divide the moduli and subtract them (mathcentre).</p>

<script>
  // ---------- numbers: an arrow is [length, angle in degrees]; a point is [across, up] ----------
  const rad = (v) => v * Math.PI / 180, dgr = (v) => v * 180 / Math.PI;
  const P = (r, th) => [r * Math.cos(rad(th)), r * Math.sin(rad(th))];
  const HALF = 180, WHOLE = 2 * HALF, QUARTER = HALF / 2;   // half a turn, a whole turn, a quarter turn
  // The usual range: more than −180° and up to 180°. Adding or taking away a whole turn names the same arrow.
  const norm = (a) => { let v = a; while (v > HALF) v -= WHOLE; while (v <= -HALF) v += WHOLE; return v; };
  const outOfRange = (a) => a > HALF || a <= -HALF;
  const atan2d = (z) => { const a = dgr(Math.atan2(z[1], z[0])); return a <= -HALF + 1e-9 ? a + WHOLE : a; };
  const polOf = (z) => [Math.hypot(z[0], z[1]), atan2d(z)];
  // The lesson's rule: multiply the lengths and add the angles; divide the lengths and take the angles away.
  const times = (z, w) => [z[0] * w[0], z[1] + w[1]];
  const over = (z, w) => [z[0] / w[0], z[1] - w[1]];
  // The same by parts, for the checks: (a + jb)(c + jd) = (ac − bd) + j(ad + bc); dividing multiplies top and bottom by the bottom's conjugate.
  const cmul = (z, w) => [z[0] * w[0] - z[1] * w[1], z[0] * w[1] + z[1] * w[0]];
  const cdiv = (z, w) => { const m = w[0] * w[0] + w[1] * w[1]; return [(z[0] * w[0] + z[1] * w[1]) / m, (z[1] * w[0] - z[0] * w[1]) / m]; };
  // Rounding as the explanation does: lengths and angles to two places.
  const rnd = (v, dp) => { const k = Math.pow(10, dp), r = Math.round(v * k) / k; return Math.abs(r) < 1e-12 ? 0 : r; };
  const fmtN = (v, dp) => { const r = rnd(v, dp); return (r < 0 ? '−' : '') + Math.abs(r); };
  const n2 = (v) => fmtN(v, 2), dg = (v) => n2(v) + '°';
  const sg = (v) => (rnd(v, 2) < 0 ? '(' + dg(v) + ')' : dg(v));   // a negative angle inside a sum, in brackets
  const pname = (r, th) => n2(r) + '∠' + dg(th);
  const nA = pname;                                // named with its angle as worked out
  const pn = (q) => pname(q[0], norm(q[1]));       // named with its angle in the usual range
  const pnXY = (z) => pn(polOf(z));
  function name(z) {
    const a = rnd(z[0], 2), b = rnd(z[1], 2), jb = 'j' + n2(Math.abs(b));
    if (!b) return n2(a);
    if (!a) return (b < 0 ? '−' : '') + jb;
    return n2(a) + (b < 0 ? ' − ' : ' + ') + jb;
  }
  const same = (p, q, tol) => !!p && !!q && Math.abs(p[0] - q[0]) < (tol || 1e-6) && Math.abs(p[1] - q[1]) < (tol || 1e-6);
  const near = (a, b, tol) => a != null && b != null && Math.abs(a - b) <= (tol || 1e-9);

  // Sources the checks restate (the lesson's own).
  const MC = 'https://www.mathcentre.ac.uk/resources/Engineering%20maths%20first%20aid%20kit/latexsource%20and%20diagrams/7_6.pdf';
  const KHAN = 'https://www.khanacademy.org/science/electrical-engineering/ee-circuit-analysis-topic/ee-ac-analysis/v/ee-complex-rotation';
  const SHEF = 'https://sheffield.ac.uk/media/31975/download?attachment';

  // ---------- lines of working, built from the rule ----------
  const lenRow = (z, w, dv) => ({ e: 'Lengths: ' + n2(z[0]) + (dv ? ' ÷ ' : ' × ') + n2(w[0]), w: n2(dv ? z[0] / w[0] : z[0] * w[0]) });
  const angRow = (z, w, dv) => ({ e: 'Angles: ' + dg(z[1]) + (dv ? ' − ' : ' + ') + sg(w[1]), w: dg(dv ? z[1] - w[1] : z[1] + w[1]) });
  const rangeRow = (raw) => (raw > HALF ? { e: 'Usual range: ' + dg(raw) + ' − ' + dg(WHOLE), w: dg(raw - WHOLE) }
    : { e: 'Usual range: ' + dg(raw) + ' + ' + dg(WHOLE), w: dg(raw + WHOLE) });

  // ---------- what a screen draws: a list of parts, each arriving at t (null: there from the start) ----------
  // Radii of the arcs, in px from 0: z's, w's, the answer's (w's arc laid on the end of z's), w's arc taken back, a whole turn.
  const R1 = 22, R2 = 38, R3 = 56, RD = 66, R4 = 82;
  const A = (p, t, o) => Object.assign({ k: 'arrow', p, t, cls: 'z' }, o);
  const ARC = (a0, sw, R, cls, t, o) => Object.assign({ k: 'arc', a0, sw, R, cls, t }, o);
  // A copy of an arrow turning through b and stretching kk times; it sweeps its turn as an arc at R.
  const TU = (from, kk, b, t, o) => Object.assign({ k: 'turn', from, kk, b, t, cls: 'pr', arcCls: 'w', R: R3 }, o);
  const WH = (p, t, o) => Object.assign({ k: 'whole', p, t }, o);
  const SL = (base, w, t, o) => Object.assign({ k: 'slide', base, w, t, cls: 'w' }, o);
  const RW = (r, t, o) => Object.assign({ k: 'row', e: r.e, w: r.w, t }, o);
  const wrong = (o) => Object.assign({ bad: true, cls: 'bad' }, o);
  // The two numbers, each with its arc from the positive real axis.
  function pair(z, w, o) {
    o = o || {};
    const lab = o.lab !== false;
    return [ARC(0, z[1], R1, 'z', null, { lab }), A(z, null, { cls: 'z', nm: o.zn || 'z = ' + pn(z) }),
      ARC(0, w[1], R2, 'w', null, { lab: lab && !o.wNoLab }), A(w, null, { cls: 'w', nm: o.wn || 'w = ' + pn(w), knob: !!o.knob })];
  }
  // The answer: z's arc copied out to R3, then w's arc laid on its end (taken back off it, dividing) while a copy of z
  // turns through w's angle and stretches by w's length. A turn back over z's own arc is drawn just outside it.
  function prodOps(z, w, t, o) {
    o = o || {};
    const dv = !!o.dv, kk = o.k != null ? o.k : dv ? 1 / w[0] : w[0], b = o.b != null ? o.b : dv ? -w[1] : w[1];
    const res = [z[0] * kk, z[1] + b];
    return [ARC(0, z[1], R3, 'z', t, { dur: 0.4 }),
      TU(z, kk, b, t == null ? null : t + 0.4, Object.assign({ R: z[1] * b < 0 ? RD : R3, nm: (dv ? 'z ÷ w = ' : 'z × w = ') + pn(res) }, o.tu))];
  }
  const KZ = { sw: 'shaft z', label: 'z and its arc' }, KW = { sw: 'shaft w', label: 'w and its arc' };
  const KP = { sw: 'shaft pr', label: 'the answer' }, KH = { sw: 'arc wh', label: 'a whole turn' }, KS = { sw: 'shaft pr', label: 'the sum' };
  const KEY = [KZ, KW, KP], KEYH = [KZ, KW, KP, KH];

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  const ZF = [2, 30], WF = [3, 40], J = [1, QUARTER];
  const SMIN = 0.5, SMAX = 3;
  const Z1 = [4, 25], W1 = [2, 50], Z3 = [5, 20], ZD = [6, 70], WD = [3, 40], Z5 = [12, 80], W5 = [4, 30];
  const ZH = [5, 150], WH6 = [2, 60], Z7 = [4, 120], W7 = [3, 100];
  const A34 = atan2d([3, 4]), A43 = atan2d([4, 3]);
  const Z8 = [5, A34], W8 = [5, A43], Z9 = [10, 0], W9 = [5, A34], Z11 = [20, -30], W11 = [4, 60], Z12 = [2, QUARTER];
  const S11 = polOf([1, 1]);   // 1 + j1 in polar form
  const STEPS = [
    { show: true, free: true, name: 'Turn and stretch', view: { lo: -6, hi: 6, blo: -6, bhi: 6 }, hmax: 280, dur: 4.3, lines: 3, key: KEYH,
      ops: [A([1, 0], null, { cls: 'one', nm: '1' }), ARC(0, ZF[1], R1, 'z', null, { lab: true }), A(ZF, null, { nm: 'z = ' + pn(ZF) }),
        TU([1, 0], WF[0], WF[1], 0.5, { dur: 1.1, cls: 'w', arcCls: 'w', R: R2, nm: 'w = ' + pn(WF), knob: true, lab: true }),
        ...prodOps(ZF, WF, 1.9, { tu: { dur: 1.2 } }),
        RW(lenRow(ZF, WF), 3.5), RW(angRow(ZF, WF), 3.9)],
      text: 'Multiplying by `w` turns and stretches. Here the arrow 1, 1 long at 0°, turns through 40° and grows 3 times as long, which makes `w = 3∠40°`.',
      more: 'Multiplying by w does exactly the same to `z = 2∠30°`. It turns z through 40°, so the answer\'s arc is z\'s 30° with w\'s 40° laid on its end, `30° + 40° = 70°`. It stretches z 3 times, so the length is `2 × 3 = 6`. So `z × w = 6∠70°`: multiply the lengths and add the angles. A w shorter than 1 shrinks instead.\nDrag w\'s tip round and out. Turn on Divide to take w\'s arc away instead, or press × j.' },
    { name: '4∠25° × 2∠50°', view: { lo: -9, hi: 6, blo: -2, bhi: 9 }, lines: 2, key: KEY,
      base: pair(Z1, W1),
      opts: [nA(Z1[0] + W1[0], Z1[1] + W1[1]), nA(Z1[0] * W1[0], Z1[1] * W1[1]), pn(times(Z1, W1))], ok: 2,
      truthXY: cmul(P(Z1[0], Z1[1]), P(W1[0], W1[1])),
      mvs: [
        [...prodOps(Z1, W1, 0.1, { k: (Z1[0] + W1[0]) / Z1[0], tu: wrong({ nm: nA(Z1[0] + W1[0], Z1[1] + W1[1]) }) }),
          RW({ e: 'Lengths added: ' + n2(Z1[0]) + ' + ' + n2(W1[0]), w: n2(Z1[0] + W1[0]) }, 1.5, wrong())],
        [ARC(0, Z1[1] * W1[1], R3 - 16, 'bad', 0.1, wrong({ dur: 1.4, spiral: true })),
          A([Z1[0] * W1[0], Z1[1] * W1[1]], 1.5, wrong({ nm: nA(Z1[0] * W1[0], Z1[1] * W1[1]) })),
          RW({ e: 'Angles multiplied: ' + dg(Z1[1]) + ' × ' + dg(W1[1]), w: dg(Z1[1] * W1[1]) }, 1.5, wrong())],
        [...prodOps(Z1, W1, 0.1), RW(lenRow(Z1, W1), 1.5), RW(angRow(Z1, W1), 1.9)],
      ],
      task: 'Work out `4∠25° × 2∠50°`.',
      hint: 'Not quite. Multiply the lengths and add the angles.',
      hints: { 0: 'Not quite. That adds the lengths. Multiplying by `2∠50°` stretches 2 times, so multiply them.', 1: 'Not quite. That multiplies the angles. The turns stack end to end, so the angles add.' },
      why: 'Multiplying by `2∠50°` turns `4∠25°` through 50° and stretches it 2 times. Its arc is 25° with 50° laid on the end, `25° + 50° = 75°`, and its length is `4 × 2 = 8`. So the answer is `8∠75°`.' },
    { show: true, name: 'Times j', view: { lo: -3, hi: 3, blo: -2, bhi: 3 }, dur: 4.4, lines: 3, key: KEY,
      ops: [...pair(ZF, J, { wn: 'w = j = ' + pn(J) }), ...prodOps(ZF, J, 0.5, { tu: { nm: 'z × j = ' + pn(times(ZF, J)) } }),
        RW(lenRow(ZF, J), 1.9), RW(angRow(ZF, J), 2.3),
        A([1, 0], 2.6, { cls: 'one', nm: '1' }), TU([1, 0], 1, -QUARTER, 3.1, { dur: 0.9, nm: '1 ÷ j = ' + pn([1, -QUARTER]) + ' = −j' }),
        RW({ e: '1 ÷ j: ' + dg(0) + ' − ' + dg(QUARTER), w: dg(-QUARTER) }, 4.0)],
      text: '`j` is `1∠90°`, 1 long at a quarter turn. Multiplying by j adds 90° and multiplies the length by 1, which is no stretch at all.',
      more: 'So `2∠30° × j` is `2∠120°`, the same arrow turned a quarter turn anticlockwise, as in the first lesson. Dividing by j takes the 90° away instead. That is why `1 ÷ j` came to `−j` in the conjugate lesson: it is `1∠−90°`.' },
    { name: '5∠20° × j', view: { lo: -4, hi: 7, blo: -6, bhi: 7 }, hmax: 280, lines: 2, key: KEY,
      base: pair(Z3, J, { wn: 'w = j = ' + pn(J) }),
      opts: [nA(Z3[0] + J[0], Z3[1] + J[1]), pn(times(Z3, J)), nA(Z3[0], Z3[1] - J[1])], ok: 1,
      truthXY: cmul(P(Z3[0], Z3[1]), [0, 1]),
      mvs: [
        [...prodOps(Z3, J, 0.1, { k: (Z3[0] + J[0]) / Z3[0], tu: wrong({ nm: nA(Z3[0] + J[0], Z3[1] + J[1]) }) }),
          RW({ e: 'j\'s length added: ' + n2(Z3[0]) + ' + ' + n2(J[0]), w: n2(Z3[0] + J[0]) }, 1.5, wrong())],
        [...prodOps(Z3, J, 0.1, { tu: { nm: 'z × j = ' + pn(times(Z3, J)) } }), RW(lenRow(Z3, J), 1.5), RW(angRow(Z3, J), 1.9)],
        [...prodOps(Z3, J, 0.1, { b: -QUARTER, tu: wrong({ arcCls: 'bad', nm: nA(Z3[0], Z3[1] - J[1]) }) }),
          RW({ e: 'Turned clockwise: ' + dg(Z3[1]) + ' − ' + dg(J[1]), w: dg(Z3[1] - J[1]) }, 1.5, wrong())],
      ],
      task: 'Work out `5∠20° × j`.',
      hint: 'Not quite. Times j adds 90° and leaves the length as it is.',
      hints: { 0: 'Not quite. j is 1 long, and multiplying a length by 1 leaves it as it is.', 2: 'Not quite. That turns it clockwise. Times j is a quarter turn anticlockwise, so add 90°.' },
      why: '`j` is `1∠90°`. Multiplying by it multiplies the length by 1, so 5 stays 5, and adds 90°, so 20° becomes `20° + 90° = 110°`. The answer is `5∠110°`, the arrow turned a quarter turn anticlockwise.' },
    { show: true, name: 'Dividing', view: { lo: -2, hi: 6, blo: -1, bhi: 7 }, dur: 3.4, lines: 3, key: KEY,
      ops: [...pair(ZD, WD), ...prodOps(ZD, WD, 0.5, { dv: true, tu: { dur: 1.2 } }),
        RW(lenRow(ZD, WD, true), 2.1), RW(angRow(ZD, WD, true), 2.5),
        RW({ e: 'Multiplying back: ' + pn(over(ZD, WD)) + ' × ' + pn(WD), w: pn(times(over(ZD, WD), WD)) }, 3.0)],
      text: 'Dividing asks which number, multiplied by w, gives z. Multiplying adds w\'s angle and multiplies by w\'s length, so dividing does the opposite.',
      more: 'Take w\'s arc away from the end of z\'s arc, `70° − 40° = 30°`, and divide the lengths, `6 ÷ 3 = 2`. So `6∠70° ÷ 3∠40° = 2∠30°`, and multiplying back gives `6∠70°` again. Take the bottom\'s angle from the top\'s, never the other way round.' },
    { name: '12∠80° ÷ 4∠30°', view: { lo: -3, hi: 6, blo: -4, bhi: 13 }, hmax: 280, lines: 2, key: KEY,

    nextBtn.el.hidden = finished || (!d.show && !right);
    nextBtn.setLabel(i === STEPS.length - 1 ? 'Finish' : 'Continue');
    el('nav').hidden = backBtn.el.hidden && nextBtn.el.hidden;
  });

  // ---------- known answers, worked out by hand ----------
  const idx = (nm) => STEPS.findIndex((d) => d.name === nm);
  const DOS = STEPS.map((d, i) => i).filter((i) => !STEPS[i].show);
  const I0 = 0, I2 = idx('Times j'), I6 = idx('Past half a turn'), I10 = idx('Adding is different');
  const solved = (i, k) => Object.assign(blank(STEPS[i]), { pick: k, res: k === STEPS[i].ok ? 'right' : 'wrong' });
  const freeState = (s, phi, dv) => Object.assign(blank(STEPS[I0]), { mode: 'static', s, phi, div: dv });
  // A step painted in the state given (finished, or t seconds in), without labels: what it drew.
  function drawn(i, st, t) {
    const keepS = S[i], keepT = T;
    S[i] = st; T = t == null ? Infinity : t; NOLAB = true;
    try { paint(i); return Object.assign({}, REC); } finally { S[i] = keepS; T = keepT; }
  }
  // Each check paints what it needs, then puts the page back as it was.
  function chk(label, fn, opts) {
    K.check(label, () => { const keepT = T; try { return fn(); } finally { NOLAB = false; T = keepT; paint(); } }, opts);
  }
  const prOf = (g) => g.arrows.filter((x) => x.cls === 'pr');
  const answerLab = (g, dv) => g.labels.find((l) => l.indexOf(dv ? 'z ÷ w = ' : 'z × w = ') === 0) || '';
  const angOfLab = (l) => { const s = l.split('∠')[1]; return s == null ? NaN : parseFloat(s.replace('−', '-')); };
  // Every whole-step w on the first screen, multiplying and dividing, painted once and kept for the checks.
  const WS = [];
  for (let s = SMIN; s <= SMAX + 1e-9; s += 0.5) for (let f = -170; f <= HALF; f += 10) WS.push([s, f]);
  let FREE = null;
  function freeAll() {
    if (FREE) return FREE;
    FREE = [];
    WS.forEach((w) => [false, true].forEach((dv) => FREE.push({ w, dv, g: drawn(I0, freeState(w[0], w[1], dv)) })));
    return FREE;
  }

  chk('To multiply the two numbers we multiply their moduli and add their arguments: for every whole-step tip of w on the first screen, the answer arrow ends exactly at z × w worked out by parts, (a + jb)(c + jd), its length is 2 × s, and its arc is z\'s 30° with w\'s arc laid on the end', () =>
    freeAll().filter((f) => !f.dv).every(({ w, g }) => {
      const a = prOf(g)[0], want = cmul(P(ZF[0], ZF[1]), P(w[0], w[1]));
      return !!a && same(a.xy, want, 1e-9) && near(a.p[0], ZF[0] * w[0], 1e-12) && near(Math.hypot(want[0], want[1]), a.p[0], 1e-9) &&
        g.arcs.some((c) => c.cls === 'z' && c.R === R3 && c.a0 === 0 && c.sw === ZF[1]) &&
        g.arcs.some((c) => c.cls === 'w' && c.a0 === ZF[1] && c.sw === w[1]) && answerLab(g, false) === 'z × w = ' + pnXY(want);
    }), { source: MC });
  chk('To divide, we divide their moduli and subtract their arguments: with Divide on, for every whole-step tip of w the answer arrow ends exactly at z ÷ w worked out by parts with the conjugate, its length is 2 ÷ s, and w\'s arc is taken back off the end of z\'s 30°', () =>
    freeAll().filter((f) => f.dv).every(({ w, g }) => {
      const a = prOf(g)[0], want = cdiv(P(ZF[0], ZF[1]), P(w[0], w[1]));
      return !!a && same(a.xy, want, 1e-9) && near(a.p[0], ZF[0] / w[0], 1e-12) && near(Math.hypot(want[0], want[1]), a.p[0], 1e-9) &&
        g.arcs.some((c) => c.cls === 'z' && c.R === R3 && c.a0 === 0 && c.sw === ZF[1]) &&
        g.arcs.some((c) => c.cls === 'w' && c.a0 === ZF[1] && c.sw === -w[1]) && answerLab(g, true) === 'z ÷ w = ' + pnXY(want);
    }), { source: MC });
  chk('Multiplying a number by the imaginary unit j corresponds to a rotation by +90 degrees: the × j button sets w to 1∠90°, and the answer is z turned a quarter turn anticlockwise with its length unchanged, ending at −b + ja for z = a + jb; the j screen draws 2∠30° × j the same way', () => {
    const st = jSet(freeState(WF[0], WF[1], true));
    const g = drawn(I0, st), a = prOf(g)[0], z = P(ZF[0], ZF[1]), want = [-z[1], z[0]];
    const g2 = drawn(I2, blank(STEPS[I2])), a2 = prOf(g2).find((x) => near(x.p[0], ZF[0]));
    return st.s === 1 && st.phi === QUARTER && !st.div && !!a && same(a.xy, want, 1e-9) && near(a.p[0], ZF[0]) && near(a.p[1] - ZF[1], QUARTER) &&
      !!a2 && same(a2.xy, want, 1e-9);
  }, { source: KHAN });
  chk('θ normally lies in −π < θ ≤ π, although any value θ + 2kπ is equivalent: for every whole-step w, multiplying or dividing, an answer angle past half a turn gets a whole-turn arc of 360° and is named in the usual range, more than −180° and up to 180°, the same arrow; an angle already in range gets none; 5∠150° × 2∠60° is named 10∠−150°', () => {
    const ok = freeAll().every(({ w, dv, g }) => {
      const raw = dv ? ZF[1] - w[1] : ZF[1] + w[1], ang = angOfLab(answerLab(g, dv));
      if (!(ang > -HALF && ang <= HALF)) return false;
      if (!outOfRange(raw)) return g.wholes.length === 0 && near(ang, raw, 0.005);
      return g.wholes.length === 1 && g.wholes[0].sw === (raw > HALF ? -WHOLE : WHOLE) && near(ang, raw + g.wholes[0].sw, 0.005);
    });
    const g6 = drawn(I6, blank(STEPS[I6]));
    return ok && g6.wholes.length === 1 && g6.labels.indexOf('z × w = 10∠−150°') >= 0;
  }, { source: SHEF });
  chk('Addition and subtraction are most easily carried out in Cartesian form whereas multiplication and division are most easily carried out in polar form: on the adding screen 1∠0° + 1∠90° is drawn by parts, tip to tail, ending at 1 + j1 = 1.41∠45°, and adding the lengths and the angles, 2∠90°, is drawn as a mistake', () => {
    const g = drawn(I10, blank(STEPS[I10])), s = prOf(g)[0];
    return !!s && same(s.xy, [1, 1], 1e-9) && g.slides.some((x) => same(x.end, [1, 1], 1e-9)) && g.bad > 0 &&
      g.arrows.some((x) => x.cls === 'bad' && same(x.xy, P(2, QUARTER), 1e-9)) && g.labels.indexOf('z + w = 1.41∠45°') >= 0;
  }, { source: SHEF });
  chk('Known answers worked by hand: 2∠30° × 3∠40° = 6∠70°; 4∠25° × 2∠50° = 8∠75° (6∠75° with the lengths added, 8∠1250° with the angles multiplied); 2∠30° × j = 2∠120° and 1 ÷ j = 1∠−90°; 5∠20° × j = 5∠110°; 6∠70° ÷ 3∠40° = 2∠30°, and 2∠30° × 3∠40° = 6∠70°; 12∠80° ÷ 4∠30° = 3∠50°; 5∠150° × 2∠60° = 10∠210° = 10∠−150°; 4∠120° × 3∠100° = 12∠−140°; (3 + j4)(4 + j3) = j25 = 25∠90°, with 3 + j4 at 53.13° and 4 + j3 at 36.87°; 10 ÷ (3 + j4) = 2∠−53.13° = 1.2 − j1.6; 1 + j1 = 1.41∠45°; 20∠−30° ÷ 4∠60° = 5∠−90° = −j5; j2 × j2 = 4∠180° = −4', () => {
    const eq = [[pn(times(ZF, WF)), '6∠70°'], [pn(times(Z1, W1)), '8∠75°'], [nA(4 + 2, 75), '6∠75°'], [nA(8, 25 * 50), '8∠1250°'],
      [pn(times(ZF, J)), '2∠120°'], [pn([1, -QUARTER]), '1∠−90°'], [name(cdiv([1, 0], [0, 1])), '−j1'], [pn(times(Z3, J)), '5∠110°'],
      [pn(over(ZD, WD)), '2∠30°'], [pn(times(over(ZD, WD), WD)), '6∠70°'], [pn(over(Z5, W5)), '3∠50°'],
      [nA(10, 210), '10∠210°'], [pn(times(ZH, WH6)), '10∠−150°'], [pn(times(Z7, W7)), '12∠−140°'],
      [name(cmul([3, 4], [4, 3])), 'j25'], [pn(times(Z8, W8)), '25∠90°'], [dg(A34), '53.13°'], [dg(A43), '36.87°'],
      [pn(over(Z9, W9)), '2∠−53.13°'], [name(P(2, -A34)), '1.2 − j1.6'], [name(cdiv([10, 0], [3, 4])), '1.2 − j1.6'],
      [pn(S11), '1.41∠45°'], [pn(over(Z11, W11)), '5∠−90°'], [name(P(5, -90)), '−j5'], [pn(times(Z12, Z12)), '4∠180°'], [name(cmul([0, 2], [0, 2])), '−4']];
    return eq.every((q) => q[0] === q[1]);
  });
  chk('Each puzzle takes only its right answer: its three answers differ, the right one matches an independent working by parts ((a + jb)(c + jd), or the conjugate for dividing) and only it draws the answer arrow, ending there and named; each wrong one is drawn as what its slip makes, marked as a mistake', () =>
    DOS.every((i) => {
      const d = STEPS[i];
      if (d.opts.length !== 3 || new Set(d.opts).size !== 3 || d.opts[d.ok] !== d.truth) return false;
      return d.opts.every((o, k) => {
        const g = drawn(i, solved(i, k)), a = prOf(g);
        if (k !== d.ok) return g.bad > 0 && a.length === 0;
        return g.bad === 0 && a.length === 1 && same(a[0].xy, d.truthXY, 1e-9) && g.labels.some((l) => l.indexOf(o) >= 0);
      });
    }));
  chk('Before an answer, a puzzle shows only its question: the two numbers and their arcs, no answer arrow, no working and nothing marked as a mistake', () =>
    DOS.every((i) => {
      const g = drawn(i, blank(STEPS[i]));
      return g.work.length === 0 && g.bad === 0 && prOf(g).length === 0 && g.arrows.length === STEPS[i].base.filter((x) => x.k === 'arrow').length && g.arcs.length >= 2;
    }));
  chk('Every demonstration finishes within 4.6 s of its screen opening, none starting before the 0.35 s screen fade ends; every answer\'s motion, right or wrong, within 3 s', () => {
    const timed = (i, st) => { const keepS = S[i]; T = Infinity; latest = 0; earliest = Infinity; S[i] = st; NOLAB = true; try { paint(i); } finally { S[i] = keepS; } return { latest, earliest }; };
    return STEPS.every((d, i) => {
      if (d.show) { const r = timed(i, blank(d)); return r.latest <= d.dur + 1e-9 && d.dur <= 4.6 && d.dur >= 3 && r.earliest >= FADE; }
      return d.opts.every((o, k) => timed(i, solved(i, k)).latest <= 3 + 1e-9);
    });
  });
  chk('From outside the rule: two transformers stepping down 2 to 1 and then 5 to 1 step down 10 to 1; cos(30° + 40°) = cos 30° cos 40° − sin 30° sin 40°, and likewise for sin, so a turn of 30° then 40° is a turn of 70°; the practice example (6 + j8) ÷ (1 + j1) is 7 + j1 by the conjugate and 7.07∠8.13° in polar form, the same number', () => {
    const c = Math.cos, s = Math.sin, a = rad(30), b = rad(40), q = cdiv([6, 8], [1, 1]);
    return 2 * 5 === 10 && near(c(a + b), c(a) * c(b) - s(a) * s(b), 1e-12) && near(s(a + b), s(a) * c(b) + c(a) * s(b), 1e-12) &&
      name(q) === '7 + j1' && pnXY(q) === '7.07∠8.13°' && pn(over(polOf([6, 8]), polOf([1, 1]))) === '7.07∠8.13°';
  });

  K.ready();
</script>
