<p class="caption">Ideal parts on 230 V UK mains (BBC Bitesize); I = V ÷ Z, with volts and amps drawn to separate scales.</p>

<script>
  // ---------- numbers ----------
  const rad = (v) => v * Math.PI / 180, dgr = (v) => v * 180 / Math.PI;
  const rnd = (v, dp) => { const k = Math.pow(10, dp), r = Math.round(v * k) / k; return Math.abs(r) < 1e-12 ? 0 : r; };
  const fmtN = (v, dp) => { const r = rnd(v, dp); return (r < 0 ? '−' : '') + Math.abs(r); };
  const n2 = (v) => fmtN(v, 2), dg = (v) => n2(v) + '°';
  const near = (a, b, tol) => Math.abs(a - b) <= (tol == null ? 1e-9 : tol);
  const same = (p, q, tol) => { const t = tol == null ? 1e-6 : tol; return !!p && !!q && near(p[0], q[0], t) && near(p[1], q[1], t); };
  const O = [0, 0];
  const P = (r, th) => [r * Math.cos(rad(th)), r * Math.sin(rad(th))];
  const len = (z) => Math.hypot(z[0], z[1]);
  const ang = (z) => (len(z) < 1e-12 ? 0 : dgr(Math.atan2(z[1], z[0])));
  const cadd = (a, b) => [a[0] + b[0], a[1] + b[1]];
  const csub = (a, b) => [a[0] - b[0], a[1] - b[1]];
  const cmul = (a, b) => [a[0] * b[0] - a[1] * b[1], a[0] * b[1] + a[1] * b[0]];
  const cdiv = (a, b) => { const q = b[0] * b[0] + b[1] * b[1]; return [(a[0] * b[0] + a[1] * b[1]) / q, (a[1] * b[0] - a[0] * b[1]) / q]; };
  // As the explanation writes them: a length and an angle, or parts, to two decimals.
  const pol = (z) => (rnd(len(z), 2) === 0 ? '0' : n2(len(z)) + '∠' + dg(ang(z)));
  function parts(z) {
    const re = rnd(z[0], 2), im = rnd(z[1], 2), js = 'j' + n2(Math.abs(im));
    if (im === 0) return n2(re);
    if (re === 0) return (im < 0 ? '−' : '') + js;
    return n2(re) + (im < 0 ? ' − ' : ' + ') + js;
  }

  // ---------- the lesson's rule: Ohm's law with j ----------
  const VS = 230, V = [VS, 0];                          // UK mains, drawn along the real axis at 0°: the measuring point
  const Iof = (Z) => cdiv(V, Z);                        // I = V ÷ Z
  const capZ = (xc) => [0, -xc];                        // a capacitor's opposition points straight down: −jX_C
  const pos = (a, b) => cdiv(cmul(a, b), cadd(a, b));   // two branches side by side: product over sum
  const reactName = (X) => (X > 0 ? 'j' : '−j') + n2(Math.abs(X)) + ' Ω';
  const A = (I) => pol(I) + ' A';
  const rel = (I) => n2(Math.abs(ang(I))) + '° ' + (ang(I) > 0 ? 'ahead of V' : 'behind V');

  const ALLC = 'https://www.allaboutcircuits.com/textbook/alternating-current/chpt-3/parallel-resistor-inductor-circuits';
  const MIT = 'https://openlearninglibrary.mit.edu/courses/course-v1:OCW+18.031+2019_Spring/courseware/week4/rec6';
  const KIRT = 'https://eng.libretexts.org/Bookshelves/Electrical_Engineering/Electro-Optics/Introduction_to_Electric_Power_Systems_(Kirtley)/02%3A_AC_power_flow_in_linear_networks/2.06%3A_Phasors';
  const MODEL = 'https://ibiblio.org/kuphaldt/socratic/model/mod_rxz.pdf';
  const BBC = 'https://www.bbc.co.uk/bitesize/guides/zcfm8mn/revision/3';
  const FIORE = 'https://eng.libretexts.org/Bookshelves/Electrical_Engineering/Electronics/AC_Electrical_Circuit_Analysis%3A_A_Practical_Approach_(Fiore)/07%3A_AC_Power/7.3%3A_Power_Triangle';
  const MC = 'https://www.mathcentre.ac.uk/resources/Engineering%20maths%20first%20aid%20kit/latexsource%20and%20diagrams/7_6.pdf';

  // ---------- the worked examples, all from the rule ----------
  const R0 = 8, X0 = 6, XC0 = 10, Z0 = [R0, X0], ZC0 = capZ(XC0);
  const I0 = Iof(Z0), I2c = Iof(ZC0), IS0 = cadd(I0, I2c), ZP0 = pos(Z0, ZC0);
  const VR0 = cmul(I0, [R0, 0]), VX0 = cmul(I0, [0, X0]), VSUM = cadd(VR0, VX0);
  const Z3 = [R0, -X0], I3 = Iof(Z3);
  const Z9 = [6, -8], I9 = Iof(Z9);
  const ZT10 = cmul(Z0, Z0), ZB10 = cadd(Z0, Z0), Z10 = cdiv(ZT10, ZB10), I10 = Iof(Z10);
  const ZS10 = P(len(ZT10) / len(ZB10), ang(ZT10));     // the slip: the bottom's angle not taken away
  const I11 = P(11.5, -36.87), Z11 = cdiv(V, I11);
  const DEF = { R: R0, X: X0, XC: XC0, cap: true };
  const CONJ8 = [ZB10[0] / 2, -cadd(Z0, ZC0)[1]];       // 8 + j4, the conjugate of the bottom 8 − j4
  const TOP8 = cmul(Z0, ZC0), BOT8 = cadd(Z0, ZC0);

  // ---------- what a screen draws: a list of parts, each arriving at t (null: there from the start) ----------
  const AR = (pane, u, a, b, cls, o) => Object.assign({ k: 'ar', pane, u, a, b, cls, t: null }, o);
  const PV = (a, b, cls, o) => AR('p', 'V', a, b, cls, o);
  const PA = (a, b, cls, o) => AR('p', 'A', a, b, cls, o);
  const PZ = (a, b, cls, o) => AR('z', 'O', a, b, cls, o);
  const ARC = (pane, u, vec, cls, t) => ({ k: 'arc', pane, u, vec, cls, t });
  const SQ = (at, to, t) => ({ k: 'sq', at, to, t });
  const DOT = (nm, t) => ({ k: 'dot', nm, t, bad: true });
  const RW = (e, w, t, o) => Object.assign({ k: 'row', e, w, t }, o);
  const CIR = (spec, o) => Object.assign({ k: 'cir', spec }, o);
  const bad = (o) => Object.assign({ bad: true }, o);
  const ser = (R, X, o) => Object.assign({ type: 'ser', R, X }, o);
  const par = (R, X, xc, o) => Object.assign({ type: 'par', R, X, xc }, o);
  const VB = PV(O, V, 'v', { nm: 'V' });   // the supply, fixed at 0° on every screen

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  const STEPS = [
    { show: true, name: 'Ohm\'s law with j', z: true, dur: 4.3, circ: ser(R0, X0),
      ops: [VB, PZ(O, Z0, 'z', { t: 0.4, nm: 'Z' }), ARC('z', 'O', Z0, 'z', 1.0), RW('Z = ' + parts(Z0) + ' Ω', pol(Z0) + ' Ω', 1.0),
        PA(O, I0, 'i', { t: 1.5, dur: 0.6, nm: 'I', mv: { t: 2.6, dur: 1.1, b0: [len(I0), 0] } }),
        RW('Lengths divided: 230 ÷ ' + n2(len(Z0)), n2(VS / len(Z0)) + ' A', 2.0),
        RW('Angles taken away: 0° − ' + dg(ang(Z0)), dg(0 - ang(Z0)), 3.0),
        ARC('p', 'A', I0, 'i', 3.7), RW('So the current I', A(I0), 3.7)],
      text: 'Ohm\'s law works for AC just as it does for DC, once the opposition is the impedance Z: `I = V ÷ Z`. The supply voltage V is drawn along the real axis, at 0°, and every other angle is measured from it.',
      more: 'Here the 8 Ω resistor and 6 Ω coil make `Z = 8 + j6 = 10∠36.87° Ω`. Divide the lengths, `230 ÷ 10 = 23` A, and take the angles away: `I = 23∠−36.87° A`. The 23 A is what a clamp meter reads. Why 36.87° behind? Turn it round: `V = I × Z`, and multiplying by Z turns I forward 36.87°, onto V at 0°.' },
    { name: 'Dividing by Z', z: true, circ: ser(R0, X0),
      base: [VB, PZ(O, Z0, 'z', { nm: 'Z' }), ARC('z', 'O', Z0, 'z', null)],
      opts: [A([I0[0], -I0[1]]), n2(VS / (R0 + X0)) + '∠' + dg(ang(I0)) + ' A', A(I0)], ok: 2,
      truth: () => A(cdiv([230, 0], [8, 6])),
      truthOk: (g) => g.arrows.some((a) => a.cls === 'i' && !a.bad && same(a.b, Iof([8, 6]), 1e-9)),
      mvs: [
        [PA(O, [I0[0], -I0[1]], 'i', bad({ t: 0.1, nm: 'I' })), RW('Angles added: 0° + ' + dg(ang(Z0)), A([I0[0], -I0[1]]), 0.7, { bad: true })],
        [PA(O, P(VS / (R0 + X0), ang(I0)), 'i', bad({ t: 0.1, nm: 'I' })), RW('Sizes added: 230 ÷ (' + R0 + ' + ' + X0 + ')', n2(VS / (R0 + X0)) + ' A', 0.7, { bad: true })],
        [PA(O, I0, 'i', { t: 0.1, nm: 'I', mv: { t: 0.8, dur: 0.9, b0: [len(I0), 0] } }), RW('Lengths divided: 230 ÷ ' + n2(len(Z0)), n2(len(I0)) + ' A', 0.6),
          RW('Angles taken away: 0° − ' + dg(ang(Z0)), dg(ang(I0)), 1.5), ARC('p', 'A', I0, 'i', 1.8)],
      ],
      task: 'An 8 Ω resistor and a 6 Ω coil, `Z = 8 + j6`, are in series on 230 V. What current flows?',
      hint: 'Not quite. Divide the lengths and take Z\'s angle away.',
      hints: { 0: 'Not quite. Dividing takes the angles away, so the current\'s angle is `0° − 36.87°`, not plus.', 1: 'Not quite. The 8 Ω and the j6 Ω stand at a quarter turn, so Z is `√(8² + 6²) = 10` Ω, not 14.' },
      why: 'Z is `8 + j6 = 10∠36.87° Ω`. Dividing divides the lengths, `230 ÷ 10 = 23` A, and takes the angles away, `0° − 36.87° = −36.87°`. So `I = 23∠−36.87° A`: 23 A on a clamp meter, lagging the voltage by Z\'s angle.' },
    { show: true, free: true, mode: 'ser', name: 'Drag Z', z: true, dur: 4.1,
      demo: { ph: [{ t: 0.4, dur: 1.3, to: { X: 16 } }, { t: 2.1, dur: 1.9, to: { X: -16 } }] },
      text: 'Drag the tip of Z, or use the sliders. The current\'s length is always 230 V divided by Z\'s length, and its angle is Z\'s angle taken the other way.',
      more: 'Point Z higher, as a bigger coil does, and I shrinks and swings further back. Bring Z down onto the real axis and the current is in step with the voltage, as in DC. Take Z below the axis, as a capacitor does, and I swings ahead of V.' },
    { name: 'A capacitor instead', z: true, circ: ser(R0, -X0),
      base: [VB, PZ(O, Z3, 'z', { nm: 'Z' }), ARC('z', 'O', Z3, 'z', null)],
      opts: [A(Iof(Z0)), A([VS / len(Z3), 0]), A(I3)], ok: 2,
      truth: () => A(cdiv([230, 0], [8, -6])),
      truthOk: (g) => g.arrows.some((a) => a.cls === 'i' && !a.bad && same(a.b, Iof([8, -6]), 1e-9)),
      mvs: [
        [PA(O, Iof(Z0), 'i', bad({ t: 0.1, nm: 'I' })), RW('Swung back, as with the coil', A(Iof(Z0)), 0.7, { bad: true })],
        [PA(O, [VS / len(Z3), 0], 'i', bad({ t: 0.1, nm: 'I' })), RW('Angle left out, as in DC', A([VS / len(Z3), 0]), 0.7, { bad: true })],
        [PA(O, I3, 'i', { t: 0.1, nm: 'I', mv: { t: 0.8, dur: 0.9, b0: [len(I3), 0] } }), RW('Lengths divided: 230 ÷ ' + n2(len(Z3)), n2(len(I3)) + ' A', 0.6),
          RW('Angles taken away: 0° − (' + dg(ang(Z3)) + ')', '+' + dg(ang(I3)), 1.5), ARC('p', 'A', I3, 'i', 1.8)],
      ],
      task: 'Swap the coil for a capacitor of 6 Ω, so `Z = 8 − j6`. What current flows from the 230 V supply now?',
      hint: 'Not quite. Z now points down, so you take away a negative angle.',
      hints: { 0: 'Not quite. Taking away a negative angle adds it: `0° − (−36.87°) = +36.87°`. A capacitor swings the current ahead of the voltage.', 1: 'Not quite. Only a Z with no angle keeps the current in step, as in DC. This Z points 36.87° down.' },
      why: '`8 − j6` is `10∠−36.87° Ω`: the same length as before, pointing down. So `I = 230∠0° ÷ 10∠−36.87° = 23∠36.87° A`. The +36.87° is measured from the supply voltage: the current leads V by 36.87°, where the coil made it lag.' },
    { show: true, free: true, mode: 'volts', name: 'The part voltages', z: true, dur: 3.3, amps: 2,
      demo: { tb: { vr: 0.4, vx: 1.4, sq: 2.3, rvr: 1.1, rvx: 2.1 } },
      text: 'In series one current flows through every part, so each part\'s voltage is that current times the part\'s own impedance. The two voltages add as arrows, tip to tail, back to V.',
      more: 'Across the resistor, `I × 8 = 184∠−36.87° V`, lying along I because 8 has no angle. Across the coil, `I × j6 = 138∠53.13° V`, a quarter turn ahead of I. A meter would read 184 V and 138 V. They stand at a quarter turn, so they add as arrows and end exactly on V\'s tip: in parts, `(147.2 − j110.4) + (82.8 + j110.4) = 230 + j0`. Drag Z and they always do.' },
    { name: 'Two meter readings', z: false, circ: ser(R0, X0),
      base: [PV(O, VR0, 'vr', { nm: n2(len(VR0)) + ' V' }), PV(VR0, VSUM, 'vx', { nm: n2(len(VX0)) + ' V' }), SQ(VR0, VSUM, null)],
      opts: [n2(len(VR0) + len(VX0)) + ' V', n2(len(VR0) - len(VX0)) + ' V', n2(len(VSUM)) + ' V'], ok: 2,
      truth: () => n2(Math.hypot(147.2 + 82.8, -110.4 + 110.4)) + ' V',
      truthOk: (g) => g.arrows.some((a) => a.cls === 'v' && !a.bad && same(a.b, [230, 0], 1e-9)),
      mvs: [

  chk('From outside the rule: the practice motor, 12 + j16 Ω on 230 V, is √400 = 20∠53.13° Ω and draws 11.5 A, 6.9 − j9.2 in parts; a capacitor of 230 ÷ 9.2 = 25 Ω cancels that j part, which at 50 Hz is 1 ÷ (2π × 50 × 25) = 127.3 µF', () => {
    const Zm = [12, 16], Im = Iof(Zm), C = 1 / (2 * Math.PI * 50 * (VS / -Im[1]));
    return 12 * 12 + 16 * 16 === 400 && pol(Zm) === '20∠53.13°' && n2(len(Im)) === '11.5' && parts(Im) === '6.9 − j9.2' &&
      n2(VS / -Im[1]) === '25' && fmtN(C * 1000000, 1) === '127.3';
  });
  chk('Each puzzle takes only its right answer: its three answers differ, the right one matches a working done separately here and only it is drawn without a mistake; each wrong one is drawn as what its slip makes, in red', () =>
    DOS.every((i) => {
      const d = STEPS[i];
      if (d.opts.length !== 3 || new Set(d.opts).size !== 3 || d.opts[d.ok] !== d.truth()) return false;
      return d.opts.every((o, k) => { const g = drawn(i, solved(i, k)); return k === d.ok ? g.bad === 0 && d.truthOk(g) && g.rows.length > 0 : g.bad > 0 && !d.truthOk(g) && g.rows.some((r) => r.bad); });
    }));
  chk('Before an answer, a puzzle shows only its question: no working, nothing marked as a mistake and not its answer\'s arrow', () =>
    DOS.every((i) => { const g = drawn(i, blank()); return g.rows.length === 0 && g.bad === 0 && !STEPS[i].truthOk(g); }));
  chk('Every demonstration finishes within 4.8 s of its screen opening and none starts before the 0.35 s screen fade ends; every answer\'s motion, right or wrong, within 3 s; and a drag or slider move on a free screen shows its result at once', () => {
    const timed = (i, st) => { T = Infinity; latest = 0; earliest = Infinity; NOLAB = true; paintStep(STEPS[i], st); return { latest, earliest }; };
    const demos = STEPS.every((d, i) => {
      if (d.show) { const r = timed(i, blank()); return r.latest <= d.dur + 1e-9 && d.dur <= 4.8 && d.dur >= 3 && r.earliest >= FADE; }
      return d.opts.every((o, k) => timed(i, solved(i, k)).latest <= 3 + 1e-9);
    });
    const moved = [I2s, I4s, I6s].every((i) => {
      const st = Object.assign(blank(), { mode: 'static', set: Object.assign({}, DEF, { R: 12, X: 10, XC: 20 }) });
      T = 0; NOLAB = true; paintStep(STEPS[i], st);
      const n0 = REC.arrows.length, r0 = REC.rows.length;
      T = Infinity; paintStep(STEPS[i], st);
      return n0 > 0 && n0 === REC.arrows.length && r0 === REC.rows.length;
    });
    return demos && moved;
  });

  K.ready();
</script>
