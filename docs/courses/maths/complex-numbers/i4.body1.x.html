<p class="caption">The conjugate as mirror image (Oxford); dividing by the bottom's conjugate (Bird); times j turns 90° (Khan Academy).</p>

<script>
  // ---------- numbers: a complex number is [real part, j part] ----------
  const Z = (re, im) => [re, im || 0];
  const O = Z(0), ONE = Z(1), J = Z(0, 1);
  const plus = (a, b) => [a[0] + b[0], a[1] + b[1]];
  const times = (a, b) => [a[0] * b[0] - a[1] * b[1], a[0] * b[1] + a[1] * b[0]];
  const conj = (z) => [z[0], -z[1]];   // the mirror: the same real part, the j part's sign flipped
  const neg = (z) => [-z[0], -z[1]];
  const scale = (z, p) => [z[0] * p, z[1] * p];
  const sq = (z) => z[0] * z[0] + z[1] * z[1];
  // Dividing: multiply the top and the bottom by the bottom's mirror, then divide each part by the new bottom.
  const div = (t, b) => scale(times(t, conj(b)), 1 / times(b, conj(b))[0]);
  const size = (z) => Math.hypot(z[0], z[1]);
  const ang = (z) => Math.atan2(z[1], z[0]) * 180 / Math.PI;   // anticlockwise from the real axis, −180 to 180
  const rad = (a) => a * Math.PI / 180;
  const rot = (z, deg) => { const r = size(z), a = rad(ang(z) + deg); return [r * Math.cos(a), r * Math.sin(a)]; };
  const QUARTER = Math.round(ang(J));   // 90°, the turn times j makes
  const r2 = (v) => { const r = Math.round(v * 100) / 100; return Math.abs(r) < 1e-9 ? 0 : r; };   // two places, as the explanation rounds
  const same = (a, b) => !!a && !!b && Math.abs(a[0] - b[0]) < 1e-6 && Math.abs(a[1] - b[1]) < 1e-6;
  const num = (v) => { v = r2(v); return (v < 0 ? '−' : '') + Math.abs(v); };
  const par = (v) => (r2(v) < 0 ? '(' + num(v) + ')' : num(v));
  const jName = (v) => (r2(v) < 0 ? '−' : '') + 'j' + Math.abs(r2(v));
  // As the explanation writes it: 3 + j4, −3 − j2, or short: 5, −j5, j, −j.
  function name(z, full) {
    const re = r2(z[0]), im = r2(z[1]);
    if (!full && !im) return num(re);
    if (!full && !re) return Math.abs(im) === 1 ? (im < 0 ? '−j' : 'j') : jName(im);
    return num(re) + (im < 0 ? ' − ' : ' + ') + 'j' + Math.abs(im);
  }
  const paren = (z) => '(' + name(z, true) + ')';
  const both = (z) => !!r2(z[0]) && !!r2(z[1]);
  // A product as the explanation writes it: (3 + j4)(3 − j4), 10 × (3 − j4), j × (−j).
  function mulQ(a, b) {
    const s = (z) => (both(z) ? paren(z) : (r2(z[0]) < 0 || r2(z[1]) < 0 ? '(' + name(z) + ')' : name(z)));
    return both(a) && both(b) ? paren(a) + paren(b) : s(a) + ' × ' + s(b);
  }

  // Sources the checks restate (the lesson's own).
  const KHAN = 'https://www.khanacademy.org/science/electrical-engineering/ee-circuit-analysis-topic/ee-ac-analysis/v/ee-complex-rotation';
  const LAMAR = 'https://tutorial.math.lamar.edu/classes/alg/complexnumbers.aspx';
  const OXF = 'https://www.maths.ox.ac.uk/system/files/attachments/complex.pdf';
  const OSTX = 'https://openstax.org/books/college-algebra-2e/pages/2-4-complex-numbers';
  const BIRD = 'https://ndl.ethernet.edu.et/server/api/core/bitstreams/95c3b47e-ec1a-47d9-997e-96f202d2a949/content';

  // ---------- the four tiles: every part of the first times every part of the second ----------
  function partsOf(z) {
    const out = [];
    if (r2(z[0])) out.push({ v: z[0], j: 0 });
    if (r2(z[1])) out.push({ v: z[1], j: 1 });
    return out.length ? out : [{ v: 0, j: 0 }];
  }
  function partName(p) { return p.j ? jName(p.v) : num(p.v); }
  function jjText(v) { return (v < 0 ? '−j × j × ' : 'j × j × ') + num(Math.abs(v)); }
  // kind 0 real × real, 1 real × j, 2 j × j; pile 0 real, 1 j. Done right, the j × j tile goes to the
  // real pile with its sign changed, because j × j = −1. A slip changes one tile and marks it.
  function tilesOf(z, m, mode) {
    const R = partsOf(z), C = partsOf(m), out = [];
    R.forEach((r, i) => C.forEach((c, k) => {
      const kind = r.j + c.j, v = r.v * c.v;
      const t = { i, k, kind, v, text: kind === 0 ? num(v) : kind === 1 ? jName(v) : jjText(v), pile: kind === 1 ? 1 : 0, val: kind === 2 ? -v : v, flip: kind === 2, bad: false };
      if (kind === 2 && mode === 'plusJJ') Object.assign(t, { val: v, flip: false, bad: true });
      if (kind === 1 && mode === 'noCancel' && v < 0) Object.assign(t, { val: -v, bad: true });
      if (kind === 0 && mode === 'negSq' && r.v < 0 && c.v < 0) Object.assign(t, { val: -v, bad: true });
      t.chip = t.pile === 1 ? jName(t.val) : (kind === 2 && t.val > 0 ? '+' : '') + num(t.val);
      out.push(t);
    }));
    return out;
  }
  function totalOf(tiles) { return tiles.reduce((s, t) => plus(s, t.pile ? Z(0, t.val) : Z(t.val)), O); }

  // ---------- dividing, done right or with a slip: what the card shows ----------
  function sqText(b) {
    if (!r2(b[1])) return par(b[0]) + '²';
    if (!r2(b[0])) return mulQ(b, conj(b));
    return par(b[0]) + '² + ' + par(b[1]) + '²';
  }
  function divText(w, nb) {
    if (Math.abs(nb - 1) < 1e-9) return 'Each part ÷ 1';
    const out = [];
    if (r2(w[0])) out.push(num(w[0]) + ' ÷ ' + num(nb));
    if (r2(w[1])) out.push(num(w[1]) + ' ÷ ' + num(nb));
    return out.join(' and ') || '0 ÷ ' + num(nb);
  }
  function planOf(d, mode) {
    const t = d.top, b = d.bot, c = conj(b), nb = times(b, c)[0], nt = times(t, c);
    const P = { mode, c, nb, fr2: true, topMul: true, note: 'is 1', fr3: { top: name(nt), bot: num(nb), topBad: false }, strip: true, rows: [], ans: null };
    const topRow = { e: 'Top: ' + mulQ(t, c), w: name(nt) }, botRow = { e: 'Bottom: ' + sqText(b), w: num(nb) };
    if (mode === 'ok') {
      P.ans = scale(nt, 1 / nb);
      P.rows = [topRow, botRow, { e: divText(nt, nb), w: name(P.ans) }];
    } else if (mode === 'noDivide') {
      P.ans = nt;
      P.rows = [topRow, botRow, { e: 'New top not divided by ' + num(nb), w: name(nt), bad: true }];
    } else if (mode === 'onlyBottom') {
      Object.assign(P, { topMul: false, note: 'not 1', fr3: { top: name(t), bot: num(nb), topBad: true }, ans: scale(t, 1 / nb) });
      P.rows = [{ e: 'Top left as it is', w: name(t), bad: true }, botRow, { e: divText(t, nb), w: name(P.ans), bad: true }];
    } else if (mode === 'plusJJ') {
      const w = Z(t[0] * c[0] + t[1] * c[1], t[0] * c[1] + t[1] * c[0]);
      Object.assign(P, { fr3: { top: name(w), bot: num(nb), topBad: true }, ans: scale(w, 1 / nb) });
      P.rows = [{ e: 'Top, with j × j as +1', w: name(w), bad: true }, botRow, { e: divText(w, nb), w: name(P.ans), bad: true }];
    } else if (mode === 'partwise') {
      Object.assign(P, { fr2: false, fr3: null, strip: false, note: null, ans: Z(t[0] / b[0], r2(t[1]) ? t[1] / b[1] : t[0] / b[1]) });
      P.rows = [{ e: 'Real part: ' + num(t[0]) + ' ÷ ' + par(b[0]), w: num(P.ans[0]), bad: true },
        { e: 'j part: ' + (r2(t[1]) ? jName(t[1]) + ' ÷ ' + jName(b[1]) : num(t[0]) + ' ÷ ' + par(b[1])), w: jName(P.ans[1]), bad: true },
        { e: 'Part by part', w: name(P.ans), bad: true }];
    }
    if (d.checkRow) { const back = times(P.ans, b); P.rows.push({ e: 'Check: ' + mulQ(P.ans, b), w: name(back), bad: !same(back, t) }); }
    return P;
  }

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // plane: the complex plane (prod: with z × mirror on a real line below); card: dividing; grid: the four tiles.
  // ops (SHOW) and mvs (each answer): mirror, half (both signs flipped), hflip (real part flipped), grow (an
  // arrow to a point), pair (a second number and its mirror), arcs, prod, turn; g: a tile slip; div: a dividing slip.
  const KNUM = { sw: 'shaft a', label: 'the number' }, KZ = { sw: 'shaft a', label: 'z' }, KMIR = { sw: 'shaft b', label: 'its mirror' };
  const KHALF = { sw: 'shaft h', label: 'both signs flipped' }, KPROD = { sw: 'shaft res', label: 'z × mirror, drawn smaller' };
  const ZMAX = 4;
  const STEPS = [
    { show: true, name: 'The mirror', plane: true, z: Z(3, 4), dur: 4.0, lines: 2, view: { lo: -4, hi: 4, blo: -5, bhi: 5 },
      ops: [{ mirror: true, t: 0.5, row: 'Mirror, j part\'s sign flipped' }, { half: true, t: 2.2, row: 'Both signs flipped, half a turn' }],
      key: [KNUM, KMIR, KHALF],
      text: 'The conjugate of `3 + j4` is `3 − j4`. The real part stays as it is, and only the sign of the j part flips.',
      more: 'On the plane `3 + j4` is 3 across and 4 up, and `3 − j4` is 3 across and 4 down. So the conjugate is the number\'s mirror image in the real axis. Flip both signs instead and you get `−3 − j4`, the arrow turned half round, which is a different number.' },
    { name: 'Mirror of −3 − j2', plane: true, z: Z(-3, -2), lines: 2, view: { lo: -4, hi: 4, blo: -3, bhi: 3 }, key: [KNUM, KMIR],
      mvs: [{ half: true, row: 'Both signs flipped, half a turn' }, { mirror: true, row: 'Mirror, j part\'s sign flipped' }, { hflip: true, row: 'Real part\'s sign flipped' }], ok: 1,
      task: 'What is the conjugate of `−3 − j2`?',
      hint: 'Not quite. Keep the real part, and flip only the sign of the j part.',
      hints: { 0: 'Not quite. That flips both signs, which turns the arrow half round. Only the j part\'s sign flips.', 2: 'Not quite. That flips the real part, which mirrors the arrow left to right. The real part stays as it is.' },
      why: 'Keep the real part, `−3`, and flip the sign of the j part, so `−j2` becomes `+j2`. The conjugate is `−3 + j2`, the mirror image of `−3 − j2` in the real axis.' },
    { show: true, name: 'On the mirror line', plane: true, z: Z(5), dur: 3.8, lines: 2, view: { lo: -2, hi: 6, blo: -3, bhi: 3 },
      ops: [{ mirror: true, t: 0.5, row: 'j part 0, flipped, is still 0' }, { pair: Z(-1, 2), t: 1.6, row: 'Mirror of −1 + j2' }],
      key: [{ sw: 'shaft a', label: 'a number' }, KMIR],
      text: 'A number on the real axis, such as 5, sits on the mirror line. Its j part is 0, and flipping 0 changes nothing, so 5 is its own conjugate.',
      more: 'The two roots of the quadratic in the first lesson, `−1 + j2` and `−1 − j2`, are a mirror pair. Each is the other\'s conjugate.' },
    { name: 'Mirror of 5', plane: true, z: Z(5), lines: 2, view: { lo: -6, hi: 6, blo: -6, bhi: 2 }, key: [KNUM, KMIR],
      mvs: [{ hflip: true, row: 'Real part\'s sign flipped' }, { grow: Z(0, -5), row: 'A j part made up' }, { mirror: true, row: 'j part 0, flipped, is still 0' }], ok: 2,
      task: 'What is the conjugate of 5?',
      hint: 'Not quite. Keep the real part, and flip only the sign of the j part.',
      hints: { 0: 'Not quite. That flips the real part. The real part stays as it is, so 5 stays 5.', 1: 'Not quite. 5 has no j part to flip. Its j part is 0, and flipping 0 changes nothing.' },
      why: '5 sits on the real axis, so its j part is 0. Keep the real part, 5, and flip the sign of 0, which is still 0. So the conjugate of 5 is 5 itself.' },
    { show: true, name: 'Times its mirror', plane: true, prod: true, grid: true, drag: true, z: Z(3, 4), dur: 4.4, lines: 2,
      view: { lo: -5, hi: 5, blo: -5, bhi: 5 }, pl: [0, 32], gridAt: { t: 0.9, f: 0.9 },
      ops: [{ mirror: true, t: 0.5 }, { arcs: true, t: 1.5 }, { prod: true, t: 3.3 }], key: [KZ, KMIR, KPROD],
      text: 'Now multiply `3 + j4` by its mirror `3 − j4` with the four tiles. The two j tiles are the same size with opposite signs, so they cancel. In the last tile `j × j = −1`, so it becomes `+16`, not `−16`. The answer is `9 + 16 = 25`, with no j part at all.',
      more: 'So the answer is an arrow lying flat on the real axis, drawn smaller below the plane. The mirror points down by just the angle `z` points up, the two ticked arcs, so the turn brings it level. By Pythagoras `3 + j4` is 5 long, and the stretch makes it `5 × 5 = 25` long.\nDrag the tip of `z` anywhere. The answer is always the real part squared plus the j part squared, flat on the real axis and never negative.' },
    { name: '(2 + j1)(2 − j1)', grid: true, z: Z(2, 1), m: Z(2, -1),
      mvs: [{ g: 'ok' }, { g: 'plusJJ' }, { g: 'noCancel' }], ok: 0,
      task: 'Work out `(2 + j1)(2 − j1)`.',
      hint: 'Not quite. Draw all four tiles, and put `−1` for `j × j`.',
      hints: { 1: 'Not quite. The last tile is `−j × j × 1`, and `j × j = −1` makes it `+1`, not `−1`.', 2: 'Not quite. `2 × (−j1)` is `−j2`, so the two j tiles have opposite signs and cancel.' },

    { show: true, name: 'Dividing', card: true, grid: true, top: Z(10), bot: Z(3, 4), dur: 4.4,

  function act(d, V, G, z, a, W, LB, said) {

      LB.push({ pt: [K.clamp(d.drag ? (x0 + xe) / 2 : xe, 12 + w / 2, 328 - w / 2), G.prodY - 14], text: txt, cls: bad ? 'tl bad' : 'tl', a: aL });
      if (d.drag) W.push({ e: 'Length of z by Pythagoras, √' + num(val), w: num(Math.sqrt(val)), t: after(a.t, PROD) });

  const zOf = (d, st) => (st && st.Z) || d.z;
  function drawPlane(d, st, G, W, LB, said) {

  }

  // A line of working: the expression on the left, what it makes on the right.
  function drawWork(r, m, G, said) {
    const y = G.workY + 20 + 28 * m, a = vis(r.t), aw = r.tw === undefined ? a : vis(r.tw), bad = r.bad ? ' bad' : '';
    part(a, 6, () => text(12, y, r.e, r.cls || ('te' + (r.tw === undefined ? bad : '')), 'start', true));
    if (r.w) part(aw, 6, () => text(328, y, r.w, 'tw' + bad, 'end', true));

  }
  // The key, inside the drawing.
  function drawKey(items, y) {
    keyLayout(items).forEach(({ it, x, row }) => {
      const yy = y + row * 20;

  // Labels sit just beyond what they name, moved by K.labels clear of the arrows and other words; always

    const px = X(V, it.z[0]), py = Y(V, it.z[1]), w = tw(it.text, it.cls);
    const gl = V.gx + 3, gr = V.gx + V.gw - 3, gt = V.gy + 3, gb = V.gy + V.gh - 3;

  // ---------- the dividing card: top over bottom, times the mirror over itself, the new fraction ----------
  function drawCard(d, st) {

    const P = mode ? planOf(d, mode) : null, said = ['A card dividing ' + say(name(d.top)) + ' by ' + say(name(d.bot)) + '.'];
    const tm = !P ? null : d.show ? (st.mode === 'static' ? { f2: null, f3: null, s: null, r: null, rg: 0 } : d.cardAt) : { f2: 0.1, f3: 0.45, s: 0.7, r: 0.6, rg: 0.3 };

      x += w + 12;

    line('stub', 40, SY - 16, 40, SY + 6);

  // ---------- the four tiles, as in the last lesson ----------
  const CW = 100, CH = 34, CG = 6, HW = 56, HH = 28, PX = 70;
  const rowY = (i) => HH + i * (CH + CG) + CH / 2;
  const REALY = HH + 2 * (CH + CG) + 22, JY = REALY + 34, ANSY = JY + 36;
  // Which product the tiles show: z times its mirror, a puzzle's two brackets, a new top, or the check.
  function gridSpec(d, st) {
    if (!d.grid) return null;
    const k = d.show ? null : shownIdx(d, st);
    if (d.card) {
      const mode = d.show ? 'ok' : k == null ? null : d.mvs[k].div;
      if (!mode) return null;
      const P = planOf(d, mode), tm = d.show ? (st.mode === 'static' ? null : d.gridAt) : { t: 0.7, f: 0.6 };
      if (d.gridTop) return { z: d.top, m: P.c, mode: 'ok', tm, q: 'New top: ' + mulQ(d.top, P.c) };

  }
  function drawGrid(gs) {

    const R = partsOf(z), C = partsOf(m), tiles = tilesOf(z, m, mode), tot = totalOf(tiles);

    R.forEach((r, n) => text(gx + HW - 10, rowY(n) + 5, partName(r), 'th', 'end'));

      if (ts === false) return;
      const p = grow(ts, dur);
      if (p <= 0) return;
      const sy = t.pile ? JY : REALY, x = K.lerp(colX(t.k), sx, p), y = K.lerp(rowY(t.i), sy, p), w = K.lerp(w0, w1, p);
      add(K.svg('rect', { class: 'chip p' + t.pile + (t.bad ? ' bad' : ''), x: r3(x - w / 2), y: r3(y - 13), width: r3(w), height: 26, rx: 8 }));
      const q = special ? K.clamp((p - 0.35) / 0.3, 0, 1) : 1;
      if (q < 1) text(x, y + 5, t.text, 'tt', 'middle').setAttribute('opacity', r3(1 - q));

      text(328, REALY + 5, '= ' + num(tot[0]), 'tw' + bad, 'end');
      text(328, JY + 5, '= ' + (r2(tot[1]) ? jName(tot[1]) : '0'), 'tw' + bad, 'end');
    });
    if (aT >= 1) REC.total = tot;
    // The question, and the answer the piles make.
    text(12, ANSY, gs.q, 'tq', 'start', true);
    if (answered) part(vis(after(tT, 0.3 * f)), 4, () => text(328, ANSY, name(tot), 'tw' + bad, 'end'));
    root = art;
    const said = [(answered ? 'Tiles for ' : 'Empty tiles for ') + say(gs.q) + (answered ? ': ' + tiles.map((t) => say(t.text)).join(', ') : '') + '.'];
    if (aT >= 1) said.push('Real pile ' + say(num(tot[0])) + ', j pile ' + say(r2(tot[1]) ? jName(tot[1]) : '0') + ', so it makes ' + say(name(tot)) + '.');
    return said.join(' ');
  }

  function paint(i) {
    if (i == null) i = cur();
    const d = STEPS[i], st = S[i], G = geo(d);
    REC = { work: [], labels: [], mirrors: [], chips: [], arcs: null, res: null, total: null, mirror: null, mirTip: null, guide: null, half: null,

    root = art; into = null;
  }

  // ---------- the drag screen: the tip of z snaps to whole steps, anywhere but 0 ----------
  function snapTip(raw) {
    let x = K.clamp(Math.round(raw[0]), -ZMAX, ZMAX), y = K.clamp(Math.round(raw[1]), -ZMAX, ZMAX);
    if (!x && !y) { if (Math.abs(raw[0]) >= Math.abs(raw[1])) x = raw[0] < 0 ? -1 : 1; else y = raw[1] < 0 ? -1 : 1; }
    return Z(x, y);
  }
  const grip = ui.appendChild(K.svg('circle', { class: 'grip', cx: 0, cy: 0, r: 22, tabindex: -1, role: 'slider',
    'aria-label': 'Tip of z, its real part; arrow keys move it across and up' }));
  grip.style.display = 'none';
  function placeGrip(d, st) {
    const on = !!d && !!d.drag && !!KN && !finished;
    grip.style.display = on ? '' : 'none';
    grip.setAttribute('tabindex', on ? '0' : '-1');
    if (!on) return;
    const z = zOf(d, st);
    grip.setAttribute('cx', r3(KN[0])); grip.setAttribute('cy', r3(KN[1]));
    grip.setAttribute('aria-valuemin', -ZMAX); grip.setAttribute('aria-valuemax', ZMAX);
    grip.setAttribute('aria-valuenow', r2(z[0]));
    grip.setAttribute('aria-valuetext', say(name(z, true)));
  }
  const dragOn = () => !finished && !!STEPS[cur()].drag;
  function unitsFrom(e) {
    const ctm = svg.getScreenCTM();
    if (!ctm) return null;
    const q = new DOMPoint(e.clientX, e.clientY).matrixTransform(ctm.inverse()), V = geo(STEPS[cur()]).V;
    return [(q.x - V.ox) / V.u, (V.oy - q.y) / V.u];
  }
  function moveTip(raw) {
    const i = cur(), d = STEPS[i], st = S[i], z = snapTip(raw);
    if (same(z, zOf(d, st)) && st.mode === 'static' && !anim.playing()) return;
    if (anim.playing()) anim.pause();
    T = Infinity;
    st.Z = z; st.mode = 'static';
    K.reveal(); K.refresh();
  }
  let held = null;
  grip.addEventListener('pointerdown', (e) => {
    if (!dragOn()) return;
    held = e.pointerId;
    try { grip.setPointerCapture(e.pointerId); } catch (err) { /* the drag still follows while the pointer stays on the tip */ }
    e.preventDefault();
  });
  grip.addEventListener('pointermove', (e) => {
    if (held !== e.pointerId || !dragOn()) return;
    const q = unitsFrom(e);
    if (q) moveTip(q);
  });
  const letGo = (e) => { if (held === e.pointerId) held = null; };
  grip.addEventListener('pointerup', letGo);
  grip.addEventListener('pointercancel', letGo);
  grip.addEventListener('lostpointercapture', () => { held = null; });
  grip.addEventListener('keydown', (e) => {
    if (!dragOn()) return;
    const by = { ArrowUp: [0, 1], ArrowDown: [0, -1], ArrowRight: [1, 0], ArrowLeft: [-1, 0] }[e.key];
    if (!by) return;
    e.preventDefault();
    moveTip(plus(zOf(STEPS[cur()], S[cur()]), by));
  });

  write(el('finish'), FINISH);
  K.update((p) => {
    const i = Math.round(p.step), d = STEPS[i];
    el('planebox').hidden = !d.plane;
    el('cardbox').hidden = !d.card;
    if (!anim.playing()) T = Infinity;   // motion that was stopped (the page hidden, a test) shows finished
    if (i !== lastStep) {
      lastStep = i; enter('stepbox');
      if (d.show) { S[i] = blank(); play(d.dur); } else { anim.pause(); T = Infinity; }
    }
    if (finished !== lastDone) { lastDone = finished; enter(finished ? 'done' : 'stepbox'); }
    const st = S[i], right = st.res === 'right';
    el('stepbox').hidden = finished;
    el('done').hidden = !finished;
    el('count').textContent = 'Step ' + (i + 1) + ' of ' + STEPS.length;
    const task = el('task');
    task.className = 'task' + (d.show ? ' show' : '');
    write(task, d.show ? d.text : d.task);
    el('more').hidden = !(d.show && d.more);   // a SHOW screen's rest of the words, under its picture
    write(el('more'), d.show && d.more ? d.more : '');
    paint(i);
    el('tilebox').hidden = !REC.gridOn;

    replayBtn.el.hidden = !d.show || REDUCE;
    el('replay').hidden = replayBtn.el.hidden;
    const opts = d.show ? [] : d.opts;
    el('picks').hidden = !opts.length;
    el('picks').classList.toggle('long', opts.some((o) => o.length > 5));
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      b.setLabel(opts[k]);
      b.el.setAttribute('aria-label', say(opts[k]));
      b.el.setAttribute('aria-pressed', st.pick === k ? 'true' : 'false');
    });
    el('acts').hidden = !!d.show;
    checkBtn.el.hidden = right;
    const fb = el('fb');
    fb.hidden = !!d.show;
    fb.className = 'fb' + (right ? ' right' : st.res === 'wrong' ? ' wrong' : '');
    write(fb, d.show ? '' : right ? 'That\'s it.' : st.res === 'wrong' ? hintFor(d, st) : st.res === 'empty' ? 'Tap one of the answers.' : '');
    const why = el('why');
    why.hidden = d.show || !st.why;
    write(why, d.show ? '' : d.why);
    whyBtn.setLabel(st.why ? 'Hide why' : 'Why?');
    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !right);
    nextBtn.setLabel(i === STEPS.length - 1 ? 'Finish' : 'Continue');
    el('nav').hidden = backBtn.el.hidden && nextBtn.el.hidden;
  });

  // ---------- known answers, worked out by hand ----------
  const idx = (nm) => STEPS.findIndex((d) => d.name === nm);
  const DOS = STEPS.map((d, i) => i).filter((i) => !STEPS[i].show);
  const DIVS = STEPS.map((d, i) => i).filter((i) => !!STEPS[i].card);
  const solved = (i, k) => Object.assign(blank(), { pick: k, res: k === STEPS[i].ok ? 'right' : 'wrong' });
  // A step painted in the state given (finished, or t seconds into its motion), without labels: what it drew.
  function drawn(i, st, t) {
    const keepS = S[i], keepT = T;
    S[i] = st; T = t == null ? Infinity : t; NOLAB = true;
    try { paint(i); return Object.assign({}, REC); } finally { S[i] = keepS; T = keepT; }
  }
  // Each check paints what it needs, then puts the page back as it was.
  function chk(label, fn, opts) {
    K.check(label, () => { const keepT = T; try { return fn(); } finally { NOLAB = false; T = keepT; paint(); } }, opts);
  }

  chk('The conjugate of a + bi is a − bi, the same number with the sign on its imaginary part changed: every mirror drawn keeps its number\'s real part and flips the sign of its j part, as 3 + j4 to 3 − j4, −3 − j2 to −3 + j2, −1 + j2 to −1 − j2, and 5 to 5', () => {
    const i1 = idx('Mirror of −3 − j2'), i3 = idx('Mirror of 5');
    const g0 = drawn(idx('The mirror'), blank()), g1 = drawn(i1, solved(i1, STEPS[i1].ok)), g2 = drawn(idx('On the mirror line'), blank()), g3 = drawn(i3, solved(i3, STEPS[i3].ok));
    const all = [g0, g1, g2, g3].every((g) => g.mirrors.length > 0 && g.mirrors.every((pr) => same(pr[1], conj(pr[0])) && pr[1][0] === pr[0][0]));
    return all && same(g0.mirror, Z(3, -4)) && same(g1.mirror, Z(-3, 2)) && g2.mirrors.some((pr) => same(pr[1], Z(-1, -2))) &&
      g2.mirrors.some((pr) => same(pr[1], Z(5))) && same(g3.mirror, Z(5));
  }, { source: LAMAR });
  chk('The conjugate of a point is its mirror image in the real axis: on The mirror, the dashed arrow\'s tip moves straight down from 3 + j4 to 3 − j4, keeping its real part 3 and crossing the real axis on the way, and the line joining the two tips is upright', () => {
    const i = idx('The mirror'), t0 = STEPS[i].ops[0].t;
    const mids = [0.2, 0.5, 0.8].map((f) => drawn(i, blank(), t0 + FLIP * f).mirTip), fin = drawn(i, blank());
    const ys = mids.map((m) => (m ? m[1] : NaN));
    return mids.every((m) => !!m && Math.abs(m[0] - 3) < 1e-9) && ys[0] > 0 && ys[0] > ys[1] && ys[1] > ys[2] && ys[2] < 0 &&
      same(fin.mirror, Z(3, -4)) && !!fin.guide && Math.abs(fin.guide[0] - fin.guide[2]) < 1e-9 && fin.guide[1] < fin.guide[3];
  }, { source: OXF });
  chk('When a complex number is multiplied by its complex conjugate, the result is a real number: on Times its mirror, for every whole-step z dragged to, the two j tiles cancel, the j pile is 0, and the product arrow lies flat on the real line, the real part squared plus the j part squared long, never negative', () => {
    const i = idx('Times its mirror');
    let ok = true;
    for (let a = -ZMAX; a <= ZMAX; a++) for (let b = -ZMAX; b <= ZMAX; b++) {
      if (!a && !b) continue;
      const z = Z(a, b), g = drawn(i, Object.assign(blank(), { Z: z, mode: 'static' })), want = a * a + b * b, jc = g.chips.filter((c) => c.pile === 1);
      const cancel = a && b ? jc.length === 2 && Math.abs(jc[0].val + jc[1].val) < 1e-9 : true;
      if (!(same(g.z, z) && same(g.mirror, conj(z)) && g.prod != null && Math.abs(g.prod - want) < 1e-9 && same(g.total, Z(want)) && want > 0 && cancel)) ok = false;
    }
    return ok;
  }, { source: OSTX });
  chk('Division of complex numbers is achieved by multiplying both numerator and denominator by the complex conjugate of the denominator: on every dividing screen, done right, the card multiplies the top and the bottom by the bottom\'s mirror, the new bottom is a plain number lying on the real axis, and the answer multiplied back by the old bottom gives the old top', () =>
    DIVS.every((i) => {
      const d = STEPS[i], g = drawn(i, d.show ? blank() : solved(i, d.ok)), P = g.plan, nb = times(d.bot, conj(d.bot));
      return !!P && P.mode === 'ok' && P.fr2 && P.topMul && same(P.c, conj(d.bot)) && Math.abs(nb[1]) < 1e-12 && g.stripBot != null &&
        Math.abs(g.stripBot - nb[0]) < 1e-9 && same(P.ans, div(d.top, d.bot)) && same(times(P.ans, d.bot), d.top);
    }), { source: BIRD });
  chk('Multiplying a number by the imaginary unit j is a rotation by +90 degrees, so dividing by j turns it back: on Dividing by j, 1 ÷ j = −j, and the arrow 1 swings a quarter turn clockwise about 0 at full length to −j, the turn drawn as 90°', () => {
    const i = idx('Dividing by j'), a = STEPS[i].ops[0];
    const mids = [0.3, 0.6, 0.9].map((f) => drawn(i, blank(), a.t + TURN * f).turnTip), fin = drawn(i, blank());
    const swing = mids.every((p) => !!p && Math.abs(size(p) - 1) < 1e-6) && ang(mids[0]) < 0 && ang(mids[1]) < ang(mids[0]) && ang(mids[2]) < ang(mids[1]) && ang(mids[2]) > -90;
    return QUARTER === 90 && swing && same(fin.turnEnd, Z(0, -1)) && same(div(ONE, J), Z(0, -1)) && same(times(J, div(ONE, J)), ONE) &&
      fin.labels.indexOf('90°') >= 0 && !!fin.plan && same(fin.plan.ans, Z(0, -1));
  }, { source: KHAN });
  chk('Known answers worked by hand: the mirror of 3 + j4 is 3 − j4, both signs flipped −3 − j4; of −3 − j2, −3 + j2; of 5, 5; (3 + j4)(3 − j4) = 25 and 3 + j4 is 5 long; (2 + j1)(2 − j1) = 5, or 3 with j × j as +1, or 5 + j4 with a sign dropped; 10 ÷ (3 + j4) = 1.2 − j1.6; 5 ÷ (1 + j2) = 1 − j2; (7 + j1) ÷ (3 + j4) = 1 − j1; (5 + j5) ÷ (2 + j1) = 3 + j1, not 2.5 + j5 (which multiplies back to j12.5); 1 ÷ j = −j; (−1 + j2)(−1 − j2) = 5; 25 ÷ (4 − j3) = 4 + j3', () => {
    const i7 = STEPS[idx('5 ÷ (1 + j2)')], i9 = STEPS[idx('(5 + j5) ÷ (2 + j1)')], i12 = STEPS[idx('25 ÷ (4 − j3)')];
    const P = [[conj(Z(3, 4)), Z(3, -4)], [neg(Z(3, 4)), Z(-3, -4)], [conj(Z(-3, -2)), Z(-3, 2)], [conj(Z(5)), Z(5)], [conj(Z(-1, 2)), Z(-1, -2)],
      [times(Z(3, 4), Z(3, -4)), Z(25)], [times(Z(2, 1), Z(2, -1)), Z(5)], [totalOf(tilesOf(Z(2, 1), Z(2, -1), 'plusJJ')), Z(3)], [totalOf(tilesOf(Z(2, 1), Z(2, -1), 'noCancel')), Z(5, 4)],
      [times(Z(10), Z(3, -4)), Z(30, -40)], [div(Z(10), Z(3, 4)), Z(1.2, -1.6)], [times(Z(1.2, -1.6), Z(3, 4)), Z(10)],
      [div(Z(5), Z(1, 2)), Z(1, -2)], [planOf(i7, 'onlyBottom').ans, Z(1)], [planOf(i7, 'noDivide').ans, Z(5, -10)],
      [times(Z(7, 1), Z(3, -4)), Z(25, -25)], [div(Z(7, 1), Z(3, 4)), Z(1, -1)], [times(Z(1, -1), Z(3, 4)), Z(7, 1)],
      [times(Z(5, 5), Z(2, -1)), Z(15, 5)], [div(Z(5, 5), Z(2, 1)), Z(3, 1)], [planOf(i9, 'partwise').ans, Z(2.5, 5)], [times(Z(2.5, 5), Z(2, 1)), Z(0, 12.5)], [planOf(i9, 'plusJJ').ans, Z(1, 1)],
      [div(ONE, J), Z(0, -1)], [times(J, Z(0, -1)), ONE],
      [times(Z(-1, 2), Z(-1, -2)), Z(5)], [totalOf(tilesOf(Z(-1, 2), Z(-1, -2), 'plusJJ')), Z(-3)], [totalOf(tilesOf(Z(-1, 2), Z(-1, -2), 'negSq')), Z(3)],
      [div(Z(25), Z(4, -3)), Z(4, 3)], [planOf(i12, 'noDivide').ans, Z(100, 75)], [times(Z(4, 3), Z(4, -3)), Z(25)]];
    return P.every((p) => same(p[0], p[1])) && size(Z(3, 4)) === 5 && name(planOf(i12, 'partwise').ans) === '6.25 − j8.33' && name(Z(0, -1)) === '−j' &&
      name(Z(1.2, -1.6)) === '1.2 − j1.6' && name(Z(0, -5)) === '−j5' && mulQ(Z(3, 4), Z(3, -4)) === '(3 + j4)(3 − j4)' && mulQ(J, conj(J)) === 'j × (−j)';
  });
  chk('Each puzzle takes only its right answer: every answer is named for what its arrows, tiles or card make, and each wrong one makes something else (a dividing slip multiplies back to something other than the old top)', () =>
    DOS.every((i) => {
      const d = STEPS[i], right = rightOf(d);
      return d.opts.length === 3 && new Set(d.opts).size === 3 && d.mvs.every((mv, k) => {
        const v = optVal(d, k), g = drawn(i, solved(i, k));
        const shown = mv.div ? (!!g.plan && same(g.plan.ans, v) && !!g.total && same(g.total, d.top) === (k === d.ok))
          : mv.g ? (!!g.total && same(g.total, v) && (!d.prod || (g.prod != null && Math.abs(g.prod - v[0]) < 1e-9)))
          : (!!g.res && same(g.res, v));
        return shown && d.opts[k] === name(v) && same(v, right) === (k === d.ok);
      });
    }));
  chk('Before an answer, a puzzle shows only the question: its arrow, empty tiles or bare card, with no answer, no mirror built, no tile moved and no working', () =>
    DOS.every((i) => {
      const g = drawn(i, blank());
      return g.res == null && g.total == null && g.plan == null && g.prod == null && g.chips.length === 0 && g.work.every((r) => !r.w) && (!STEPS[i].card || !g.gridOn);
    }));
  chk('Every demonstration finishes within 4.6 s of its screen opening, none starting before the 0.35 s screen fade ends; every answer\'s motion, right or wrong, within 3 s', () => {
    const timed = (i, st) => { const keepS = S[i]; T = Infinity; latest = 0; earliest = Infinity; S[i] = st; NOLAB = true; try { paint(i); } finally { S[i] = keepS; } return { latest, earliest }; };
    return STEPS.every((d, i) => {
      if (d.show) { const r = timed(i, blank()); return r.latest <= d.dur + 1e-9 && d.dur <= 4.6 && d.dur >= 3 && r.earliest >= FADE; }
      return d.opts.every((o, k) => timed(i, solved(i, k)).latest <= 3 + 1e-9);
    });
  });
  chk('From outside the rule: 3 ÷ 0.25 is 12 ÷ 1 = 12 once the top and the bottom are both multiplied by 4; the worked example (4 + j2) ÷ (1 − j1) has new top 2 + j6, new bottom 2 and answer 1 + j3, which multiplies back to 4 + j2; and for every whole-step number tried, the number times its mirror is its Pythagoras length squared, a real number never below 0', () => {
    let pyth = true;
    for (let a = -5; a <= 5; a++) for (let b = -5; b <= 5; b++) {
      const p = times(Z(a, b), conj(Z(a, b)));
      if (Math.abs(p[1]) > 1e-9 || Math.abs(p[0] - Math.pow(size(Z(a, b)), 2)) > 1e-9 || p[0] < 0) pyth = false;
    }
    const w = div(Z(4, 2), Z(1, -1));
    return (3 * 4) / (0.25 * 4) === 12 && same(times(Z(4, 2), Z(1, 1)), Z(2, 6)) && same(times(Z(1, -1), Z(1, 1)), Z(2)) && same(w, Z(1, 3)) && same(times(w, Z(1, -1)), Z(4, 2)) && pyth;
  });

  K.ready();
</script>
