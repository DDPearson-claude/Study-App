<p class="lead">The complex plane, real across and j up, with an example arrow 3 + j4 named two ways: by its parts, a + jb, and by its length and angle, r∠θ.</p>

<p class="caption">Modulus and argument as mathcentre defines them; a = r cos θ and b = r sin θ (Oxford).</p>

<script>
  // ---------- numbers: a complex number is [a, b], its real part across and its j part up ----------
  const Z = (a, b) => [a, b || 0];
  const O = Z(0);
  const rad = (v) => v * Math.PI / 180, dgr = (v) => v * 180 / Math.PI;
  const len = (z) => Math.hypot(z[0], z[1]);   // Pythagoras: r = √(a² + b²)
  const P = (r, th) => [r * Math.cos(rad(th)), r * Math.sin(rad(th))];   // going back: a = r cos θ, b = r sin θ
  const cl = (v) => (Math.abs(v) < 1e-9 ? 0 : v);
  const HALF = 180, WHOLE = 2 * HALF, QUARTER = HALF / 2;   // half a turn, a whole turn, straight up
  // The calculator sees only the one number b ÷ a (none on the j axis, where a is 0) and answers between −90° and 90°.
  const ratio = (z) => (cl(z[0]) === 0 ? null : z[1] / z[0]);
  const calc = (z) => { const q = ratio(z); return q == null ? null : dgr(Math.atan(q)); };
  // The fix: in the right-hand half keep it; with a negative, turn it half round, adding 180° when the arrow
  // points up (or straight left) and taking 180° away when it points down.
  function fixBy(z) { const a = cl(z[0]), b = cl(z[1]); return a >= 0 ? 0 : b < 0 ? -HALF : HALF; }
  // The angle θ, anticlockwise from the positive real axis; on the j axis it is read off the sketch.
  function angle(z) { const a = cl(z[0]), b = cl(z[1]); if (!a) return b > 0 ? QUARTER : b < 0 ? -QUARTER : null; return calc(z) + fixBy(z); }
  const dirOf = (z) => dgr(Math.atan2(z[1], z[0]));
  const atan2d = dirOf;
  // Rounding as the explanation does: lengths and parts to at most three places, angles to two.
  const rnd = (v, dp) => { const k = Math.pow(10, dp), r = Math.round(v * k) / k; return Math.abs(r) < 1e-12 ? 0 : r; };
  const fmtN = (v, dp) => { const r = rnd(v, dp); return (r < 0 ? '−' : '') + Math.abs(r); };
  const n3 = (v) => fmtN(v, 3), n2 = (v) => fmtN(v, 2), dg = (v) => n2(v) + '°';
  const par = (v) => (rnd(v, 3) < 0 ? '(' + n3(v) + ')' : n3(v));
  const ofAng = (th) => (rnd(th, 2) < 0 ? '(' + dg(th) + ')' : ' ' + dg(th));   // cos 30°, cos(−36.87°)
  function name(z) {
    const a = rnd(z[0], 3), b = rnd(z[1], 3), jb = 'j' + n3(Math.abs(b));
    if (!b) return n3(a);
    if (!a) return (b < 0 ? '−' : '') + jb;
    return n3(a) + (b < 0 ? ' − ' : ' + ') + jb;
  }
  const pname = (r, th) => n3(r) + '∠' + dg(th);
  const polOf = (z) => pname(len(z), angle(z));
  const jsq = (z) => z[0] * z[0] - z[1] * z[1];   // the slip of squaring the j too: j × j = −1 turns + b² into − b²
  const same = (p, q, tol) => !!p && !!q && Math.abs(p[0] - q[0]) < (tol || 1e-6) && Math.abs(p[1] - q[1]) < (tol || 1e-6);
  const near = (a, b, tol) => a != null && b != null && Math.abs(a - b) <= (tol || 1e-9);

  // Sources the checks restate (the lesson's own).
  const MC = 'https://www.mathcentre.ac.uk/resources/Engineering%20maths%20first%20aid%20kit/latexsource%20and%20diagrams/7_4.pdf';
  const OXF = 'https://www.maths.ox.ac.uk/system/files/attachments/complex.pdf';

  // ---------- lines of working, built from the rule ----------
  const sqRow = (z) => ({ e: par(z[0]) + '² + ' + par(z[1]) + '² = ' + n3(z[0] * z[0]) + ' + ' + n3(z[1] * z[1]), w: n3(z[0] * z[0] + z[1] * z[1]) });
  const lenRow = (z) => ({ e: 'Length, √' + n3(z[0] * z[0] + z[1] * z[1]), w: n3(len(z)) });
  const lenRow2 = (z) => ({ e: 'Length, √(' + n3(z[0] * z[0]) + ' + ' + n3(z[1] * z[1]) + ')', w: n3(len(z)) });
  const tanRow = (z) => ({ e: 'tan θ = ' + n3(z[1]) + ' ÷ ' + n3(z[0]), w: n2(z[1] / z[0]) });
  const atanRow = (z) => ({ e: 'θ = tan⁻¹(' + n3(z[1]) + ' ÷ ' + n3(z[0]) + ')', w: dg(calc(z)) });
  const calcRow = (z) => (ratio(z) == null ? { e: 'On the j axis, b ÷ a has', w: 'no value' } : { e: 'Calculator: tan⁻¹(' + n3(z[1]) + ' ÷ ' + n3(z[0]) + ')', w: dg(calc(z)) });
  function fixRow(z) {
    const a = cl(z[0]), b = cl(z[1]), g = calc(z), t = angle(z);
    if (!a) return { e: b > 0 ? 'Straight up, off the sketch' : 'Straight down, off the sketch', w: dg(t) };
    if (a > 0) return { e: 'Points right: no fix needed', w: dg(t) };
    if (b < 0) return { e: 'Points down: ' + dg(g) + ' − ' + dg(HALF), w: dg(t) };
    return { e: (b > 0 ? 'Points up: ' : 'Points left: ') + dg(g) + ' + ' + dg(HALF), w: dg(t) };
  }
  const cosRow = (r, th) => ({ e: 'a = ' + n3(r) + ' cos' + ofAng(th) + ' = ' + n3(r) + ' × ' + par(Math.cos(rad(th))), w: n3(r * Math.cos(rad(th))) });
  const sinRow = (r, th) => ({ e: 'b = ' + n3(r) + ' sin' + ofAng(th) + ' = ' + n3(r) + ' × ' + par(Math.sin(rad(th))), w: n3(r * Math.sin(rad(th))) });
  // Going back with a slip: cos and sin swapped, or cos's minus dropped.
  const swapP = (r, th) => Z(r * Math.sin(rad(th)), r * Math.cos(rad(th)));
  const cosDropped = (r, th) => Z(Math.abs(r * Math.cos(rad(th))), r * Math.sin(rad(th)));
  const swapRows = (r, th) => [{ e: 'a = ' + n3(r) + ' sin' + ofAng(th) + ', swapped', w: n3(r * Math.sin(rad(th))) },
    { e: 'b = ' + n3(r) + ' cos' + ofAng(th) + ', swapped', w: n3(r * Math.cos(rad(th))) }];

  // ---------- what a screen draws: a list of parts, each arriving at t (null: there from the start) ----------
  const A = (z, t, o) => Object.assign({ k: 'arrow', z, t, cls: 'a' }, o);
  const TRI = (z, t, o) => Object.assign({ k: 'tri', z, t }, o);
  const RL = (z, t) => ({ k: 'rlab', z, t });
  const TH = (v, t, o) => Object.assign({ k: 'theta', deg: v, t }, o);
  const GH = (z, t) => ({ k: 'ghost', z, t });
  const FX = (z, t, o) => Object.assign({ k: 'fix', z, t }, o);
  const SH = (z, t, o) => Object.assign({ k: 'shadow', z, t }, o);
  const RW = (r, t, o) => Object.assign({ k: 'row', e: r.e, w: r.w, t }, o);
  const HF = (t) => ({ k: 'half', t });
  const wrong = (o) => Object.assign({ bad: true }, o);
  const KA = { sw: 'shaft a', label: 'the arrow' }, KG = { sw: 'shaft g', label: 'calculator\'s tan⁻¹' };
  const TVIEW = { lo: -5, hi: 5, blo: -5, bhi: 5 }, RVIEW = { lo: -10, hi: 10, blo: -10, bhi: 10 };
  const ZMAX = 4, RMAX = 10;

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  const z34 = Z(3, 4), z68 = Z(6, -8), z43 = Z(4, 3), zm34 = Z(-3, -4), zm11 = Z(-1, -1), zm21 = Z(-2, 1), zj5 = Z(0, -5), zm4 = Z(-4, 0);
  const G270 = 270, G120 = 120, G37 = -36.87;   // the puzzles' given angles
  const p270 = P(5, G270), p120 = P(4, G120), p30 = P(10, 30), p150 = P(10, 150), pm37 = P(10, G37);
  const up11 = Z(-1, 1);   // −1 + j1, where 135° points
  const STEPS = [
    { show: true, name: 'The length', view: { lo: -1, hi: 5, blo: -1, bhi: 5 }, dur: 3.0, lines: 2,
      card0: { a: name(z34), p: n3(len(z34)) + '∠?' },
      ops: [A(z34, null), TRI(z34, 0.5), RW(sqRow(z34), 1.4), RW(lenRow(z34), 2.0), RL(z34, 2.0)],
      text: 'Take `3 + j4`, which is 3 across and 4 up. The across part, the up part and the arrow make a right-angled triangle, with the arrow as the longest side.',
      more: 'So Pythagoras gives its length, `√(3² + 4²) = √25 = 5`. The up side is 4 long, the size of the j part, so square 4 and not `j4`. `(j4)²` is −16, and `√(9 − 16) = √−7` is not a length at all. The length is called the modulus, or magnitude, and it is never negative.' },
    { name: 'Length of 6 − j8', view: { lo: -1, hi: 8, blo: -9, bhi: 1 }, lines: 2,
      card0: { a: name(z68), p: '?' }, base: [A(z68, null)],
      opts: [n3(Math.abs(z68[0]) + Math.abs(z68[1])), n3(len(z68)), '√' + n3(jsq(z68))], ok: 1, truth: n3(Math.hypot(6, -8)),
      mvs: [
        [TRI(z68, 0.1, wrong()), RW({ e: 'Two sides walked round, ' + n3(Math.abs(z68[0])) + ' + ' + n3(Math.abs(z68[1])), w: n3(Math.abs(z68[0]) + Math.abs(z68[1])) }, 0.9, wrong())],
        [TRI(z68, 0.1), RW(sqRow(z68), 0.9), RW(lenRow(z68), 1.5, { card: { p: polOf(z68) } }), RL(z68, 1.5)],
        [TRI(z68, 0.1, wrong()), RW({ e: par(z68[0]) + '² + (' + name(Z(0, z68[1])) + ')² = ' + n3(z68[0] * z68[0]) + ' − ' + n3(z68[1] * z68[1]), w: n3(jsq(z68)) }, 0.9, wrong()),
          RW({ e: 'The square root of ' + n3(jsq(z68)) + ' is', w: 'no length' }, 1.5, wrong())],
      ],
      task: 'How long is the arrow `6 − j8`?',
      hint: 'Not quite. Square the sizes of the two parts, add them, then take the square root.',
      hints: { 0: 'Not quite. `6 + 8` walks round two sides of the triangle. The arrow cuts straight across, so it is shorter.', 2: 'Not quite. That squares the j too. Square the size of the j part, 8, so the sum is `36 + 64`.' },
      why: 'The arrow goes 6 across and 8 down, so the triangle\'s short sides are 6 and 8 long. Pythagoras gives `√(36 + 64) = √100 = 10`. The length is never negative, whichever way the arrow points.' },
    { show: true, name: 'The angle', view: { lo: -5, hi: 5, blo: -2, bhi: 5 }, dur: 3.6, lines: 2, key: [KA, KG],
      card0: { a: name(z34), p: n3(len(z34)) + '∠?' },
      ops: [A(z34, null), TRI(z34, 0.5), TH(angle(z34), 1.3), RW(tanRow(z34), 1.5), RW(atanRow(z34), 2.1, { card: { p: polOf(z34) } }), HF(2.7), GH(z34, 2.7)],
      text: 'The angle θ is measured from the positive real axis round to the arrow, anticlockwise counting as positive. It is called the argument. In the triangle the up side, 4, is opposite θ, and the across side, 3, is next to it.',
      more: 'So `tan θ = 4 ÷ 3`, and `θ = tan⁻¹(4 ÷ 3) = 53.13°`. That makes `3 + j4 = 5∠53.13°`, which is polar form. The dashed ghost is where a calculator\'s tan⁻¹ points. Like sin⁻¹ in Trigonometry lesson 3, it gives only one angle, between −90° and 90°, into the right-hand half, so here it lies on the arrow.' },
    { name: 'Angle of 4 + j3', view: { lo: -1, hi: 5, blo: -1, bhi: 5 }, lines: 2, key: [KA, KG],
      card0: { a: name(z43), p: '?' }, base: [A(z43, null)],
      opts: [dg(dgr(Math.atan(z43[0] / z43[1]))), n2(z43[1] / z43[0]), dg(calc(z43))], ok: 2, truth: dg(atan2d(z43)),
      mvs: [
        [A(Z(z43[1], z43[0]), 0.1, wrong()), TH(dirOf(Z(z43[1], z43[0])), 0.6, wrong()),
          RW({ e: 'tan⁻¹(' + n3(z43[0]) + ' ÷ ' + n3(z43[1]) + '), across ÷ up', w: dg(dgr(Math.atan(z43[0] / z43[1]))) }, 0.6, wrong())],
        [RW({ e: 'tan θ = ' + n3(z43[1]) + ' ÷ ' + n3(z43[0]) + ', tan⁻¹ left off', w: n2(z43[1] / z43[0]) }, 0.1, wrong()),
          A(P(len(z43), z43[1] / z43[0]), 0.5, wrong({ nm: dg(z43[1] / z43[0]) }))],
        [TRI(z43, 0.1), TH(angle(z43), 0.9), RW(tanRow(z43), 0.9), RW(atanRow(z43), 1.5, { card: { p: polOf(z43) } }), GH(z43, 1.9)],
      ],
      task: 'What angle does `4 + j3` make with the positive real axis?',
      hint: 'Not quite. Opposite θ is the up part, so take tan⁻¹ of up ÷ across.',
      hints: { 0: 'Not quite. That is `tan⁻¹(4 ÷ 3)`, across ÷ up, the angle of `3 + j4`. Opposite θ is the up part, 3.', 1: 'Not quite. 0.75 is tan θ, and θ is tan⁻¹ of it.' },
      why: 'The up side, 3, is opposite θ, and the across side, 4, is next to it. So `tan θ = 3 ÷ 4 = 0.75`, and `θ = tan⁻¹(0.75) = 36.87°`. The arrow points into the top right, where the calculator\'s answer is the right one.' },
    { show: true, free: 'tip', name: 'Half a turn out', z: zm34, view: TVIEW, dur: 3.6, lines: 2, key: [KA, KG],
      card0: { a: name(z34), p: polOf(z34) },
      ops: [HF(null), A(z34, null, { cls: 'old' }), GH(zm34, null), A(zm34, 0.5, { knob: true, card: { a: name(zm34), p: '?' } }),

  const FINISH = 'Find the length with Pythagoras and the angle with tan⁻¹(b ÷ a). Check the angle against a sketch, and turn it 180° when the arrow points left. Go back with a = r cos θ and b = r sin θ.';
  const DUR = { arrow: 0.5, tri: 0.8, rlab: 0.4, theta: 0.6, ghost: 0.5, fix: 0.8, shadow: 0.8, row: 0.4, half: 0.4 };
  const LAYER = { half: 0, tri: 1, shadow: 1, theta: 2, fix: 2, arrow: 4, ghost: 5, rlab: 6, row: 7 };
  const durOf = (it) => it.dur || DUR[it.k];
  const FADE = 0.35;
  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const testing = () => document.documentElement.classList.contains('k-testing');

  // ---------- the free screens: drag the tip (whole steps, never 0), or set r and θ ----------
  function snapTip(raw) {
    let x = K.clamp(Math.round(raw[0]), -ZMAX, ZMAX), y = K.clamp(Math.round(raw[1]), -ZMAX, ZMAX);
    if (!x && !y) { if (Math.abs(raw[0]) >= Math.abs(raw[1])) x = raw[0] < 0 ? -1 : 1; else y = raw[1] < 0 ? -1 : 1; }
    return Z(cl(x), cl(y));
  }
  const toPol = (z) => [K.clamp(Math.round(len(z)), 1, RMAX), Math.round(angle(z))];
  const toTip = (r, th) => snapTip(P(r, th));

  // ---------- each step's state ----------
  // pick, res ('right', 'wrong' or 'empty'), why; on a free screen: mode ('demo' or 'static'), rev (setting r and θ), Z, R, TH.
  function blank(d) {
    const st = { pick: null, res: null, why: false, mode: 'demo', rev: false, Z: null, R: RMAX, TH: 30 };
    if (d && d.free) {
      st.rev = d.free === 'polar';
      if (d.pol) { st.R = d.pol[0]; st.TH = d.pol[1]; st.Z = toTip(st.R, st.TH); } else { st.Z = d.z.slice(); const q = toPol(st.Z); st.R = q[0]; st.TH = q[1]; }
    }
    return st;
  }
  const hintFor = (d, st) => (d.hints && d.hints[st.pick]) || d.hint;
  const shownIdx = (d, st) => (st.why || st.res === 'right' ? d.ok : st.res === 'wrong' ? st.pick : null);
  const modeOf = (d, st) => (d.free ? (st.rev ? 'polar' : 'tip') : 'fixed');
  let S = STEPS.map((d) => blank(d));
  let finished = false, lastStep = -1, lastDone = false, T = Infinity, motionEnd = 0;
  let REC = null, NOLAB = false, AV = [], KN = null, seen = null;

  function freeItems(st) {
    if (st.rev) {
      const r = st.R, th = st.TH, z = P(r, th), pn = pname(r, th);
      return [A(z, null, { nm: pn, card: { a: name(z), p: pn } }), TH(th, null), SH(z, null), RW(cosRow(r, th), null), RW(sinRow(r, th), null)];
    }
    const z = st.Z, out = [HF(null), A(z, null, { knob: true, card: { a: name(z), p: polOf(z) } }), TH(angle(z), null)];
    out.push(GH(z, null));   // on the j axis it draws nothing and records that there is no ghost
    if (fixBy(z)) out.push(FX(z, null));
    return out.concat([RW(calcRow(z), null), RW(fixRow(z), null)]);
  }
  function itemsOf(d, st) {
    if (d.show) return d.free && st.mode === 'static' ? freeItems(st) : d.ops;
    const k = shownIdx(d, st);
    return k == null ? d.base : d.base.concat(d.mvs[k]);
  }

  // ---------- text: maths in `backticks` stays on one line ----------
  function write(el, s) {
    el.textContent = '';
    String(s).split('\n').forEach((para, n) => {
      if (n) el.appendChild(K.el('span', { class: 'gap' }));
      para.split('`').forEach((seg, k) => { if (seg) el.appendChild(k % 2 ? K.el('span', { class: 'nw' }, seg) : document.createTextNode(seg)); });
    });
  }
  // As a screen reader says it.
  const say = (s) => String(s == null ? '' : s).replace(/tan⁻¹/g, 'tan inverse ').replace(/√/g, ' the square root of ').replace(/²/g, ' squared').replace(/°/g, ' degrees')
    .replace(/∠/g, ' at an angle of ').replace(/θ/g, ' theta ').replace(/÷/g, ' divided by ').replace(/=/g, ' equals ').replace(/\+/g, ' plus ').replace(/−/g, ' minus ')
    .replace(/×/g, ' times ').replace(/\s+/g, ' ').trim();

  // ---------- controls ----------
  const el = (id) => document.getElementById(id);
  const stepper = K.stepper({ id: 'step', label: 'Step', steps: STEPS.map((d) => d.name), value: 0, compact: true, into: '#prog' });
  const cur = () => stepper.get();
  // The reverse switch and its two sliders, shown on the free screens.
  const revCtl = K.toggle({ id: 'rev', label: 'Reverse: set r and θ', value: false, into: '#tog' });
  const rCtl = K.control({ id: 'r', label: 'Length r', min: 1, max: RMAX, step: 1, value: RMAX, fmt: (v) => n3(v), into: '#rbox' });
  const thCtl = K.control({ id: 'th', label: 'Angle θ', min: -HALF, max: HALF, step: 1, value: 30, fmt: (v) => dg(v), into: '#rbox' });
  const ctlNow = () => ({ rev: revCtl.get(), r: rCtl.get(), th: thCtl.get() });
  function syncCtls(st) { revCtl.set(!!st.rev, true); rCtl.set(st.R, true); thCtl.set(st.TH, true); seen = ctlNow(); }
  function motionLen(i, st) {
    const keepS = S[i], keepT = T, keepN = NOLAB;
    S[i] = st; T = Infinity; latest = 0; NOLAB = true;
    try { paint(i); } finally { S[i] = keepS; T = keepT; NOLAB = keepN; }
    return Math.max(0.3, latest);
  }
  // Up to three answers; a new choice after a wrong one settles the picture back to the question.
  const pickBtns = [0, 1, 2].map((k) => K.button({ label: 'Answer ' + (k + 1), secondary: true, into: '#picks', press: () => {
    const i = cur(), d = STEPS[i], st = S[i];
    if (finished || d.show || !d.opts || k >= d.opts.length || st.res === 'right') return;
    const was = st.res === 'wrong';
    st.pick = k; st.res = null;
    if (was) { anim.pause(); T = Infinity; }
  } }));
  // Check: marks the answer, then builds it: the right one, or what the slip does.
  const checkBtn = K.button({ label: 'Check', into: '#acts', press: () => {
    const i = cur(), d = STEPS[i], st = S[i];
    if (d.show || finished) return;
    if (st.pick == null) { st.res = 'empty'; return; }
    st.res = st.pick === d.ok ? 'right' : 'wrong';
    st.why = false;
    play(motionLen(i, st));
  } });
  // Why?: the reason in words, and the arrow, the triangle and the ghost built again for the right answer.
  const whyBtn = K.button({ label: 'Why?', secondary: true, into: '#acts', press: () => {
    const i = cur(), d = STEPS[i], st = S[i];
    if (d.show || finished) return;
    st.why = !st.why;
    if (st.why) play(motionLen(i, st)); else { anim.pause(); T = Infinity; }
  } });
  const replayBtn = K.button({ label: 'Play again', secondary: true, into: '#replay', press: () => {
    const i = cur(), d = STEPS[i];
    if (!d.show || finished) return;
    S[i] = blank(d);
    if (d.free) syncCtls(S[i]);
    play(d.dur);
  } });
  const backBtn = K.button({ label: 'Back', secondary: true, into: '#nav', press: () => {
    if (finished) { finished = false; return; }
    stepper.set(Math.max(0, cur() - 1), true);
  } });
  const nextBtn = K.button({ label: 'Continue', into: '#nav', press: () => {
    const i = cur();
    if (finished || (!STEPS[i].show && S[i].res !== 'right')) return;
    if (i < STEPS.length - 1) { stepper.set(i + 1, true); return; }
    finished = true;
    if (typeof K.complete === 'function') K.complete();
  } });
  K.button({ label: 'Start again', secondary: true, into: '#again', press: () => {
    S = STEPS.map((d) => blank(d)); finished = false; lastStep = -1;
    stepper.set(0, true);
  } });

  // One animation plays each demonstration and the motion after an answer; with reduced motion (and
  // while the self-test looks) everything opens finished.
  const anim = K.anim({ button: false, label: 'Demonstration', step: (dt) => {
    if (finished) return false;
    T += dt;
    paint();
    return T < motionEnd;
  } });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !anim.playing() && T !== Infinity) { T = Infinity; paint(); } });
  function play(dur) {
    if (REDUCE || testing()) { T = Infinity; anim.pause(); paint(); return; }
    motionEnd = dur; T = 0; anim.play();
  }
  function enter(id) {
    if (REDUCE) return;
    const box = el(id);
    box.classList.remove('enter');
    void box.offsetWidth;
    box.classList.add('enter');
  }

  // ---------- drawing ----------
  const svg = el('scene'), art = el('art'), lab = el('lab'), ui = el('ui');
  let into = null, root = art;
  const add = (node) => (into || root).appendChild(node);
  // How far a part due at t0 has arrived, noting the timetable for the timing check.
  let latest = 0, earliest = Infinity;

  grip.addEventListener('keydown', (e) => {
    if (!dragOn()) return;
    const by = { ArrowUp: [0, 1], ArrowDown: [0, -1], ArrowRight: [1, 0], ArrowLeft: [-1, 0] }[e.key];
    if (!by) return;
    e.preventDefault();
    const z = S[cur()].Z;
    moveTip([z[0] + by[0], z[1] + by[1]]);
  });

  write(el('finish'), FINISH);
  K.update((p) => {
    const i = Math.round(p.step), d = STEPS[i];
    if (!anim.playing()) T = Infinity;   // motion that was stopped (the page hidden, a test) shows finished
    if (i !== lastStep) {
      lastStep = i; enter('stepbox');
      if (d.show) { S[i] = blank(d); play(d.dur); } else { anim.pause(); T = Infinity; }
      if (d.free) syncCtls(S[i]);
    } else if (d.free && seen) {
      // The reverse switch swaps how the arrow is set, keeping it as near the same arrow as whole steps allow.
      const now = ctlNow(), st = S[i];
      if (now.rev !== seen.rev) {
        if (anim.playing()) anim.pause();
        T = Infinity;
        if (now.rev) { const q = toPol(st.Z); st.R = q[0]; st.TH = q[1]; } else st.Z = toTip(st.R, st.TH);
        st.rev = now.rev; st.mode = 'static';
        rCtl.set(st.R, true); thCtl.set(st.TH, true);
      } else if (now.r !== seen.r || now.th !== seen.th) {
        st.R = now.r; st.TH = now.th;
        if (st.rev) { if (anim.playing()) anim.pause(); T = Infinity; st.mode = 'static'; }
      }
      seen = ctlNow();
    }
    if (finished !== lastDone) { lastDone = finished; enter(finished ? 'done' : 'stepbox'); }
    const st = S[i], right = st.res === 'right';
    el('stepbox').hidden = finished;
    el('done').hidden = !finished;
    el('count').textContent = 'Step ' + (i + 1) + ' of ' + STEPS.length;
    const task = el('task');
    task.className = 'task' + (d.show ? ' show' : '');
    write(task, d.show ? d.text : d.task);
    el('more').hidden = !(d.show && d.more);   // a SHOW screen's rest of the words, under its picture
    write(el('more'), d.show && d.more ? d.more : '');
    el('free').hidden = !d.free;
    el('rbox').hidden = !(d.free && st.rev);
    paint(i);

    replayBtn.el.hidden = !d.show || REDUCE;
    el('replay').hidden = replayBtn.el.hidden;
    const opts = d.show ? [] : d.opts;
    el('picks').hidden = !opts.length;
    el('picks').classList.toggle('long', opts.some((o) => o.length > 5));
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      b.setLabel(opts[k]);
      b.el.setAttribute('aria-label', say(opts[k]));
      b.el.setAttribute('aria-pressed', st.pick === k ? 'true' : 'false');
    });
    el('acts').hidden = !!d.show;
    checkBtn.el.hidden = right;
    const fb = el('fb');
    fb.hidden = !!d.show;
    fb.className = 'fb' + (right ? ' right' : st.res === 'wrong' ? ' wrong' : '');
    write(fb, d.show ? '' : right ? 'That\'s it.' : st.res === 'wrong' ? hintFor(d, st) : st.res === 'empty' ? 'Tap one of the answers.' : '');
    const why = el('why');
    why.hidden = d.show || !st.why;
    write(why, d.show ? '' : d.why);
    whyBtn.setLabel(st.why ? 'Hide why' : 'Why?');
    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !right);
    nextBtn.setLabel(i === STEPS.length - 1 ? 'Finish' : 'Continue');
    el('nav').hidden = backBtn.el.hidden && nextBtn.el.hidden;
  });

  // ---------- known answers, worked out by hand ----------
  const idx = (nm) => STEPS.findIndex((d) => d.name === nm);
  const DOS = STEPS.map((d, i) => i).filter((i) => !STEPS[i].show);
  const I4 = idx('Half a turn out'), I8 = idx('Going back');
  const solved = (i, k) => Object.assign(blank(STEPS[i]), { pick: k, res: k === STEPS[i].ok ? 'right' : 'wrong' });
  const tipState = (z) => Object.assign(blank(STEPS[I4]), { mode: 'static', rev: false, Z: z });
  const polState = (r, th) => Object.assign(blank(STEPS[I8]), { mode: 'static', rev: true, R: r, TH: th });
  // A step painted in the state given (finished, or t seconds in), without labels: what it drew.
  function drawn(i, st, t) {
    const keepS = S[i], keepT = T;
    S[i] = st; T = t == null ? Infinity : t; NOLAB = true;
    try { paint(i); return Object.assign({}, REC); } finally { S[i] = keepS; T = keepT; }
  }
  // Each check paints what it needs, then puts the page back as it was.
  function chk(label, fn, opts) {
    K.check(label, () => { const keepT = T; try { return fn(); } finally { NOLAB = false; T = keepT; paint(); } }, opts);
  }
  const tips = [];
  for (let a = -ZMAX; a <= ZMAX; a++) for (let b = -ZMAX; b <= ZMAX; b++) if (a || b) tips.push(Z(a, b));

  chk('The distance of the point from the origin is called the modulus, and the modulus is never negative: for every whole-step tip on the drag screen, the arrow drawn ends at the tip, and the length in its r∠θ name is the distance of the tip from the origin, more than none', () =>
    tips.every((z) => {
      const g = drawn(I4, tipState(z)), r = Math.sqrt(z[0] * z[0] + z[1] * z[1]);
      return g.arrows.some((x) => same(x.z, z)) && g.card.p.split('∠')[0] === n3(r) && r > 0;
    }), { source: MC });
  chk('Care must be taken when using a calculator to find an inverse tangent that the solution obtained is in the correct quadrant: for every whole-step tip, the dashed ghost (the calculator\'s answer) lies along the arrow in the right-hand quarters, points exactly the opposite way in the left-hand quarters, where a half turn is drawn to bring it onto the arrow, is absent on the j axis, and the angle named always points into the tip\'s own quarter', () =>
    tips.every((z) => {
      const g = drawn(I4, tipState(z)), want = atan2d(z), th = g.thetas.length ? g.thetas[g.thetas.length - 1] : null;
      if (!near(th, want, 1e-9) || g.card.p !== pname(len(z), want)) return false;
      if (!z[0]) return g.ghost == null && g.noGhost && !g.fix;
      if (z[0] > 0) return near(g.ghost, want, 1e-9) && !g.fix && same(g.ghostTip, z);
      return !!g.ghostTip && same(g.ghostTip, Z(-z[0], -z[1])) && !!g.fix && Math.abs(g.fix.by) === HALF && near(g.ghost + g.fix.by, want, 1e-9);
    }), { source: MC });
  chk('x = r cos θ and y = r sin θ: with the reverse switch on, for every length and every whole-degree angle tried, the arrow ends r cos θ across and r sin θ up, its shadows on the two axes end level with its tip, and the parts named are those two', () => {
    for (const r of [1, 4, 7, RMAX]) for (let th = -HALF; th <= HALF; th += 15) {
      const g = drawn(I8, polState(r, th)), z = [r * Math.cos(th * Math.PI / 180), r * Math.sin(th * Math.PI / 180)], s = g.shadows[0];
      if (!(g.arrows.some((x) => same(x.z, z)) && !!s && near(s.a, z[0]) && near(s.b, z[1]) && g.card.a === name(z) && g.card.p === pname(r, th))) return false;
    }
    return true;
  }, { source: OXF });
  chk('Known answers worked by hand: 3 + j4 = 5∠53.13°; 6 − j8 is 10 long (14 with the sides added, √−28 with the j squared); 4 + j3 is at 36.87°; for −3 − j4 the calculator says 53.13° and the angle is −126.87°, and the drag screen opens drawing just that; for −3 + j4, −53.13° and 126.87°; −1 − j1 = 1.414∠−135°, and −135° + 360° = 225°; −126.87° + 360° = 233.13°; 5∠270° = 5∠−90° = −j5; 10∠30° = 8.66 + j5 and 10∠150° = −8.66 + j5; 4∠120° = −2 + j3.464; −j5 = 5∠−90° and −4 = 4∠180°; −2 + j1 = 2.236∠153.43°, its ghost at −26.57°; 10∠−36.87° = 8 − j6; −4 − j3 = 5∠−143.13°, which goes back to −4 − j3', () => {
    const g4 = drawn(I4, blank(STEPS[I4]));
    const eq = [[polOf(Z(3, 4)), '5∠53.13°'], [n3(len(Z(6, -8))), '10'], [n3(6 + 8), '14'], [n3(jsq(Z(6, -8))), '−28'], [n2(4 / 3), '1.33'], [dg(calc(Z(4, 3))), '36.87°'],
      [dg(calc(Z(-3, -4))), '53.13°'], [dg(angle(Z(-3, -4))), '−126.87°'], [dg(calc(Z(-3, 4))), '−53.13°'], [dg(angle(Z(-3, 4))), '126.87°'],
      [polOf(Z(-1, -1)), '1.414∠−135°'], [dg(angle(Z(-1, -1)) + WHOLE), '225°'], [dg(angle(Z(-3, -4)) + WHOLE), '233.13°'],
      [pname(5, G270 - WHOLE), '5∠−90°'], [name(P(5, G270)), '−j5'], [name(P(10, 30)), '8.66 + j5'], [name(P(10, 150)), '−8.66 + j5'], [n3(Math.cos(rad(30))), '0.866'],
      [name(P(4, G120)), '−2 + j3.464'], [polOf(Z(0, -5)), '5∠−90°'], [polOf(Z(-4, 0)), '4∠180°'], [polOf(Z(-2, 1)), '2.236∠153.43°'], [dg(calc(Z(-2, 1))), '−26.57°'],
      [n3(Math.sqrt(jsq(Z(-2, 1)))), '1.732'], [name(P(10, G37)), '8 − j6'], [polOf(Z(-4, -3)), '5∠−143.13°'], [name(P(5, -143.13)), '−4 − j3']];
    return eq.every((q) => q[0] === q[1]) && near(g4.ghost, dgr(Math.atan(4 / 3)), 1e-9) && !!g4.fix && g4.fix.by === -HALF &&
      g4.thetas.some((v) => near(v, dgr(Math.atan(4 / 3)) - HALF, 1e-9)) && g4.arrows.some((x) => same(x.z, Z(-3, -4))) && g4.arrows.some((x) => same(x.z, Z(3, 4)));
  });
  chk('Each puzzle takes only its right answer: every answer is worked out from the lesson\'s rule or from its named slip, the right one matches an independent working (atan2, or cos and sin of the angle in radians), and only it fills in the unknown name; each wrong one is drawn as what its slip makes, marked as a mistake', () =>
    DOS.every((i) => {
      const d = STEPS[i];
      if (d.opts.length !== 3 || new Set(d.opts).size !== 3 || d.opts[d.ok] !== d.truth) return false;
      return d.opts.every((o, k) => {
        const g = drawn(i, solved(i, k)), full = g.card.a.indexOf('?') < 0 && g.card.p.indexOf('?') < 0, pp2 = g.card.p.split('∠');
        if (k !== d.ok) return !full && g.bad > 0 && o !== d.truth;
        return full && g.bad === 0 && (o === g.card.a || o === g.card.p || o === pp2[0] || o === pp2[1]);
      });
    }));
  chk('Before an answer, a puzzle shows only its question: its one arrow and what is given, the unknown name as a question mark, no working, no ghost, no fix and nothing marked as a mistake', () =>
    DOS.every((i) => {
      const g = drawn(i, blank(STEPS[i]));
      return g.work.length === 0 && g.bad === 0 && (g.card.a === '?' || g.card.p === '?') && g.arrows.length === 1 && !g.fix && g.ghost == null && g.shadows.length === 0;
    }));
  chk('Every demonstration finishes within 4.6 s of its screen opening, none starting before the 0.35 s screen fade ends; every answer\'s motion, right or wrong, within 3 s', () => {
    const timed = (i, st) => { const keepS = S[i]; T = Infinity; latest = 0; earliest = Infinity; S[i] = st; NOLAB = true; try { paint(i); } finally { S[i] = keepS; } return { latest, earliest }; };
    return STEPS.every((d, i) => {
      if (d.show) { const r = timed(i, blank(d)); return r.latest <= d.dur + 1e-9 && d.dur <= 4.6 && d.dur >= 3 && r.earliest >= FADE; }
      return d.opts.every((o, k) => timed(i, solved(i, k)).latest <= 3 + 1e-9);
    });
  });
  chk('From outside the rule: the lesson\'s fix agrees with the two-argument arctangent (atan2) at every whole-step point from −5 to 5; a navigator 3 km east and 4 km north of a buoy is 5 km away on a bearing of 036.87°, which is 90° − 53.13°; and tan⁻¹(4 ÷ 3) is 0.93 in radians', () => {
    for (let a = -5; a <= 5; a++) for (let b = -5; b <= 5; b++) { if ((a || b) && !near(angle(Z(a, b)), dgr(Math.atan2(b, a)), 1e-9)) return false; }
    return Math.hypot(3, 4) === 5 && n2(dgr(Math.atan(3 / 4))) === '36.87' && near(QUARTER - dgr(Math.atan(4 / 3)), dgr(Math.atan(3 / 4)), 1e-9) && n2(Math.atan(4 / 3)) === '0.93';
  });

  K.ready();
</script>
