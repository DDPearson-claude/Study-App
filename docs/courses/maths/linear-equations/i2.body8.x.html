  // Sources the checks restate (the lesson's own).
  const OPENSTAX = 'https://openstax.org/books/algebra-1/pages/6-simplify-expressions-using-the-distributive-property-mini-lesson-review';
  const BITESIZE = 'https://www.bbc.co.uk/bitesize/articles/z7wkjfr';

  // ---------- expressions (pure, so the checks can test them) ----------
  // Reads +, −, ×, brackets, a minus in front and letters side by side (3x, IR₁, R₀αΔT).
  function evalExpr(s, vars) {
    const src = String(s).replace(/ /g, ' ').replace(/−/g, '-').replace(/×/g, '*').replace(/[ΩVA]/g, '').replace(/\s+/g, '');
    let i = 0;
    const peek = () => src[i];
    function expr() {
      let sign = 1;
      if (peek() === '-') { i++; sign = -1; } else if (peek() === '+') i++;
      let v = sign * term();
      while (peek() === '+' || peek() === '-') { const op = src[i++]; const t = term(); v = op === '+' ? v + t : v - t; }
      return v;
    }
    function term() {
      let v = factor();
      while (i < src.length && peek() !== '+' && peek() !== '-' && peek() !== ')') { if (peek() === '*') i++; v *= factor(); }
      return v;
    }
    function factor() {
      const rest = src.slice(i);
      if (rest[0] === '(') { i++; const v = expr(); if (src[i] !== ')') throw new Error('no closing bracket'); i++; return v; }
      if (rest[0] === '-') { i++; return -factor(); }
      let m = /^\d+(?:\.\d+)?/.exec(rest);
      if (m) { i += m[0].length; return +m[0]; }
      m = /^(ΔT|R[₀₁₂]?|[xabIα])/.exec(rest);
      if (m) { i += m[0].length; if (!(m[0] in vars)) throw new Error('no value for ' + m[0]); return vars[m[0]]; }
      throw new Error('cannot read ' + rest);
    }
    const v = expr();
    if (i !== src.length) throw new Error('left over: ' + src.slice(i));
    return v;
  }
  // cx + k written out ('6x − 12', '−2x + 8').
  const fmtLin = (c, k, l) => (c === 1 ? '' : c === -1 ? '−' : String(c).replace('-', '−')) + l + (k ? (k > 0 ? ' + ' : ' − ') + Math.abs(k) : '');
  // As a screen reader says it.
  const say = (s) => String(s == null ? '' : s).replace(/ /g, ' ').replace(/R₀/g, 'R nought').replace(/R₁/g, 'R one').replace(/R₂/g, 'R two')
    .replace(/α/g, ' alpha ').replace(/ΔT/g, ' delta T').replace(/Ω/g, ' ohms').replace(/\bV\b/g, 'volts').replace(/\bA\b/g, 'amps')
    .replace(/\+/g, ' plus ').replace(/×/g, ' times ').replace(/=/g, ' equals ').replace(/−/g, ' minus ').replace(/\s+/g, ' ').trim();

  // ---------- each step's state ----------
  // pick: the answer chosen; res: 'right', 'wrong' or 'empty' once checked; why: the Why? note open;
  // x: on the slider screen, the x Dan has set (null until he slides it).

  let S = STEPS.map(() => blank());
  let finished = false, lastStep = -1, lastDone = false, T = Infinity;   // T: seconds into the current motion
  let motionEnd = 0;
  let REC = null;                                                        // what the last paint drew, for the checks

  // ---------- text with amber key terms and italic letters (built with K.el, never innerHTML) ----------

  const ITAL = /(R[₀₁₂]?|(?<![A-Za-z])I(?=R|\(|\s|$)|(?<![A-Za-z])[xa](?![A-Za-z])|α|(?<=Δ)T)/;

  // ---------- controls ----------
  const stepper = K.stepper({ id: 'step', label: 'Step', steps: STEPS.map((d) => d.name), value: 0, compact: true, into: '#prog' });
  const nav = document.getElementById('nav');
  const at = () => stepper.get();

  // Up to three answer buttons; each step fills in its own options. A new choice after a wrong
  // answer settles the picture back to the question.
  const pickBtns = [0, 1, 2].map((k) => K.button({ label: 'Answer ' + (k + 1), secondary: true, into: '#picks', press: () => {
    const i = at(), d = STEPS[i], st = S[i];
    if (finished || d.show || !d.opts || k >= d.opts.length || st.res === 'right') return;
    const was = st.res === 'wrong';
    st.pick = d.opts[k]; st.res = null;
    if (was) { anim.pause(); T = Infinity; enter('scene'); }
  } }));
  // Check: marks the answer; a right one splits the picture or tries the number, a wrong one shows its slip.
  const checkBtn = K.button({ label: 'Check', into: '#acts', press: () => {
    const i = at(), d = STEPS[i], st = S[i];
    if (d.show || finished) return;
    if (st.pick == null) { st.res = 'empty'; return; }

    const f = fbOf(d);
    play(st.res === 'right' ? f[0] : f[1]);
  } });
  const whyBtn = K.button({ label: 'Why?', secondary: true, into: '#acts', press: () => {
    if (STEPS[at()].show || finished) return;
    const st = S[at()]; st.why = !st.why;
  } });
  const replayBtn = K.button({ label: 'Play again', secondary: true, into: '#replay', press: () => {
    const d = STEPS[at()];

  } });
  const backBtn = K.button({ label: 'Back', secondary: true, into: '#nav', press: () => {
    if (finished) { finished = false; return; }

  } });
  const nextBtn = K.button({ label: 'Continue', into: '#nav', press: () => {
    const i = at();

  K.button({ label: 'Start again', secondary: true, into: '#again', press: () => {

  } });

  // One animation plays each demonstration and the motion after an answer; with reduced motion

  function play(dur) {

  }
  function enter(id) {

    void box.offsetWidth;
    box.classList.add('enter');
  }

  // ---------- drawing ----------
  const svg = document.getElementById('scene'), art = document.getElementById('art'), ui = document.getElementById('ui');

  const vis = (t) => (t === false ? 0 : t == null ? 1 : arr(t));
  function part(a, rise, draw) {
    if (a <= 0) return;

  }
  const r3 = (v) => Math.round(v * 1000) / 1000;
  const rect = (cls, x, y, w, h, rx) => add(K.svg('rect', { class: cls, x: r3(x), y: r3(y), width: r3(Math.max(0, w)), height: r3(Math.max(0, h)), rx: r3(rx || 0) }));
  const line = (cls, x1, y1, x2, y2) => add(K.svg('line', { class: cls, x1: r3(x1), y1: r3(y1), x2: r3(x2), y2: r3(y2) }));

    let w = 0;

  // Labels in a line, each as near the middle of its span as it can sit without touching the next.

  // Brackets along a rectangle's edge (a0, a1 measured from X0), each with its name: over the

  function labelSet(items, ly, by, up, cls) {

    return items.map((it, m) => () => {

  // ---------- each step's sizes ----------
  const GEO = new Map();
  const letterOf = (d) => (d.area && d.area.letter) || 'x';
  function geo(d) {
    if (GEO.has(d)) return GEO.get(d);

    if (d.pic === 'area') {
      const A = d.area, xMax = d.slide ? d.slide.max : A.bars ? d.vars[letterOf(d)] : 0;

  function timeline(d, st) {

    const tl = { rows: Array(k).fill(null), top: Array(n).fill(null), side: null, outline: null, cut: null, split: false, parts: false, slip: false,
      main: null, strip: null, whole: false, work: [] };

      const first = k ? tl.rows[0] : s.main != null ? s.main : null;

      if (s.split != null) tl.split = s.split;
      if (s.parts) tl.parts = s.parts;
      if (s.slip != null) tl.slip = s.slip;
      if (s.main != null) tl.main = s.main;
      if (s.strip != null) tl.strip = s.strip;
      if (s.whole != null) tl.whole = s.whole;

    } else if (st.res === 'wrong' && st.pick != null) tl.work.push({ e: st.pick, w: d.ow[st.pick], t: d.pic === 'area' ? 0.5 : 0.1, bad: true });

  // The rectangle: k rows stacked, the cut, its outline, the factor, the brackets, the split and parts.
  function drawArea(d, tl, G, xv) {
    const A = d.area, U = G.U, Sp = spans(d, xv, G), ry = G.rectY, k = A.k, l = letterOf(d), bw = xv * U, yb = ry + k * U;

    const cutAt = A.cut ? Sp.cut[0] : Infinity;
    function pieces(y, nbars, nsq, bad, count) {
      for (let b = 0; b < nbars; b++) {
        rect('xb' + bad, X0 + b * bw + 0.75, y + 1, bw - 1.5, U - 2, Math.min(3, bw / 4));
        count.bars++;

    tops.forEach((f, m) => part(vis(tl.top[m]), 4, f));

    if (tl.parts) [1, 2].forEach((lv) => {
      const ms = d.parts.map((p, m) => m).filter((m) => d.parts[m][2] === lv);
      if (!ms.length) return;
      const by = yb + 8 + (lv - 1) * 30;
      const fs = labelSet(ms.map((m) => ({ a0: Sp[d.parts[m][0]][0], a1: Sp[d.parts[m][0]][1], text: d.parts[m][1] })), by + 17, by, false);

  // R = R0(1 + αΔT): a rectangle R0 tall, 1 long, with a thin strip αΔT long on its end.

  }
  const sliding = () => !finished && !!STEPS[at()].slide;
  // Dan's x, a whole number on the track: it settles the demonstration and every bar takes it up.
  function setX(v) {
    const i = at(), d = STEPS[i], st = S[i];
    v = K.clamp(Math.round(v), d.slide.min, d.slide.max);
    if (st.x === v && T === Infinity) return;
    if (anim.playing()) anim.pause();
    T = Infinity;
    st.x = v;
    K.reveal(); K.refresh();
  }
  function xFrom(e) {
    const ctm = svg.getScreenCTM();
    if (!ctm) return null;
    const q = new DOMPoint(e.clientX, e.clientY).matrixTransform(ctm.inverse()), s = STEPS[at()].slide;
    return s.min + (q.x - SX0) / (SX1 - SX0) * (s.max - s.min);
  }
  let held = null;
  grip.addEventListener('pointerdown', (e) => {
    if (!sliding()) return;
    held = e.pointerId;
    try { grip.setPointerCapture(e.pointerId); } catch (err) { /* the drag still follows the pointer while it stays on the band */ }
    e.preventDefault();
    const v = xFrom(e);
    if (v != null) setX(v);
  });
  grip.addEventListener('pointermove', (e) => {
    if (held !== e.pointerId || !sliding()) return;
    const v = xFrom(e);
    if (v != null) setX(v);
  });
  const letGo = (e) => { if (held === e.pointerId) held = null; };
  grip.addEventListener('pointerup', letGo);
  grip.addEventListener('pointercancel', letGo);
  grip.addEventListener('lostpointercapture', () => { held = null; });
  grip.addEventListener('keydown', (e) => {
    if (!sliding()) return;
    const d = STEPS[at()], st = S[at()], now = Math.round(xNow(d, st));
    const by = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1 }[e.key];
    if (by == null && e.key !== 'Home' && e.key !== 'End') return;
    e.preventDefault();
    setX(e.key === 'Home' ? d.slide.min : e.key === 'End' ? d.slide.max : now + by);
  });

  // The scene for a step (the animation calls this every frame).
  function paint(i) {
    if (i == null) i = at();
    const d = STEPS[i], st = S[i], G = geo(d);
    art.textContent = '';
    into = null;
    svg.setAttribute('viewBox', '0 0 340 ' + G.H);
    svg.setAttribute('aria-label', drawScene(d, st, G));
  }

  const el = (id) => document.getElementById(id);
  write(el('finish'), FINISH);
  K.update((p) => {
    const i = Math.round(p.step), d = STEPS[i], st = S[i];
    if (!anim.playing()) T = Infinity;   // motion that was stopped (the page hidden, a test) shows finished
    if (i !== lastStep) {
      lastStep = i; enter('stepbox');
      if (d.show) { st.x = null; play(d.dur); } else { anim.pause(); T = Infinity; }
    }
    if (finished !== lastDone) { lastDone = finished; enter(finished ? 'done' : 'stepbox'); }
    const right = st.res === 'right';
    el('stepbox').hidden = finished;
    el('done').hidden = !finished;
    el('count').textContent = 'Step ' + (i + 1) + ' of ' + STEPS.length;
    const task = el('task');
    task.className = 'task' + (d.show ? ' show' : '');
    write(task, d.show ? d.text : d.task);
    paint(i);

    replayBtn.el.hidden = !d.show || REDUCE;
    el('replay').hidden = replayBtn.el.hidden;
    const opts = d.show ? [] : d.opts || [];
    el('picks').hidden = !opts.length;
    el('picks').classList.toggle('long', opts.some((o) => o.length > 6));
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      b.setLabel(opts[k]);
      b.el.textContent = '';
      italics(b.el.appendChild(K.el('span')), opts[k], false);   // one span, so the button's gap does not split "6a + 8"
      b.el.setAttribute('aria-label', say(opts[k]));
      b.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });

    el('acts').hidden = !!d.show;
    checkBtn.el.hidden = right;
    const fb = el('fb');
    fb.hidden = !!d.show;
    fb.className = 'fb' + (right ? ' right' : st.res === 'wrong' ? ' wrong' : '');
    write(fb, d.show ? '' : right ? 'That\'s it.' : st.res === 'wrong' ? hintFor(i, st) : st.res === 'empty' ? PICK : '');

    const why = el('why');
    why.hidden = d.show || !st.why;
    write(why, d.show ? '' : d.why);
    whyBtn.setLabel(st.why ? 'Hide why' : 'Why?');

    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !right);
    nextBtn.setLabel(i === STEPS.length - 1 ? 'Finish' : 'Continue');
    nav.hidden = backBtn.el.hidden && nextBtn.el.hidden;
  });

  // ---------- known answers, worked out by hand ----------
  const DO = STEPS.map((d, i) => i).filter((i) => !STEPS[i].show);
  const pickRight = (i, v) => isRight(i, Object.assign(blank(), { pick: v }));
  const solvedSt = (i) => Object.assign(blank(), { pick: STEPS[i].want, res: 'right' });
  const wrongSt = (i, o) => Object.assign(blank(), { pick: o, res: 'wrong' });
  const close = (a, b) => Math.abs(a - b) < 1e-9 * Math.max(1, Math.abs(a), Math.abs(b));
  const idx = (name) => STEPS.findIndex((d) => d.name === name);
  // Values tried for every letter: whole numbers, a half and a negative, each letter its own.
  const TRY = [1, 2, 3, 4, 7, 10, 0.5, -4];
  const ENVS = TRY.map((v, n) => ({ x: v, a: TRY[(n + 1) % 8], b: TRY[(n + 3) % 8], I: v, 'R₀': TRY[(n + 2) % 8], 'R₁': TRY[(n + 5) % 8], 'R₂': TRY[(n + 6) % 8], 'α': TRY[(n + 4) % 8], 'ΔT': TRY[(n + 7) % 8] }));
  const same = (p, q) => ENVS.every((e) => close(evalExpr(p, e), evalExpr(q, e)));
  const endOf = (w) => evalExpr(String(w).split('=').pop(), {});
  // Every line of working a step can show, with the values it was tried at.
  function works(i) {
    const d = STEPS[i], out = [];
    if (d.show) {
      const vs = d.slide ? Array.from({ length: d.slide.max - d.slide.min + 1 }, (z, n) => ({ x: d.slide.min + n })) : [d.vars];
      vs.forEach((v) => d.work.forEach((r) => out.push({ e: r.e, w: typeof r.w === 'function' ? r.w(v) : r.w, v })));
    } else {
      out.push({ e: d.q, w: d.qw, v: d.vars });
      d.opts.forEach((o) => out.push({ e: o, w: d.ow[o], v: d.vars }));
    }
    return out;
  }
  const workAddsUp = (r) => { const ps = r.w.split('='), end = evalExpr(ps[ps.length - 1], {}); return close(evalExpr(r.e, r.v), end) && ps.slice(0, -1).every((p) => close(evalExpr(p, {}), end)); };
  // A step painted in the state given (finished, or at t seconds into its motion): what it draws.
  function drawn(i, st, t) {
    const keepS = S[i], keepT = T;
    S[i] = st; T = t == null ? Infinity : t;
    try {
      paint(i);
      const rec = REC;
      return { texts: Array.from(art.querySelectorAll('text')).map((n) => n.textContent.replace(/ /g, ' ')), area: rec.area, slip: rec.slip, split: rec.split, res: rec.res, work: rec.work };
    } finally { S[i] = keepS; T = keepT; paint(); }
  }

  K.check('Expanding brackets does not change the value of an expression, as it is two ways of writing the same one: on every screen the bracket and its expansion make the same value at every number tried, whole, a half or negative', () =>
    STEPS.every((d) => { const p = d.show ? d.pair : [d.q, d.want]; return same(p[0], p[1]); }), { source: BITESIZE });
  K.check('The factor outside of the brackets is multiplied by each term inside: each puzzle accepts only the answer that multiplies every term inside, and every wrong answer offered makes a different value at the number tried', () =>
    DO.every((i) => {
      const d = STEPS[i];
      let okWant;
      if (d.multi) okWant = same(d.q, d.want) && d.want === 'IR₁ + IR₂';
      else { const l = Object.keys(d.vars)[0], f = (v) => evalExpr(d.q, { [l]: v }); okWant = fmtLin(f(1) - f(0), f(0), l) === d.want; }
      return okWant && d.opts.every((o) => pickRight(i, o) === (o === d.want)) &&
        d.opts.every((o) => o === d.want || !close(evalExpr(o, d.vars), evalExpr(d.q, d.vars)));
    }), { source: OPENSTAX });
  K.check('The negative sign must be multiplied into both terms in the bracket, leaving x − (a − b) = x − a + b: every minus in front of a bracket changes both signs inside, and keeping a sign makes a different value', () =>
    same('x − (a − b)', 'x − a + b') && !same('x − (a − b)', 'x − a − b') &&
    same('−(6x − 5)', '−6x + 5') && !same('−(6x − 5)', '−6x − 5') && same('8x − (6x − 5)', '2x + 5') && !same('8x − (6x − 5)', '2x − 5') &&
    same('−2(x − 4)', '−2x + 8') && !same('−2(x − 4)', '−2x − 8') &&
    STEPS[idx('A minus in front')].work.some((r) => r.e === '−6x − 5' && r.bad), { source: NIPISSINGU });
  K.check('R = R₀(1 + αΔT), where R₀ is the original resistance: it expands to R₀ + R₀αΔT, and for the example winding of 2.0 Ω cold and 2.4 Ω after a run the strip R₀αΔT is 0.4 Ω, drawn on the rectangle R₀ tall', () => {
    const i = idx('A letter outside'), v = STEPS[i].vars, g = drawn(i, blank());
    return close(v['R₀'], 2) && close(evalExpr('R₀(1 + αΔT)', v), 2.4) && close(evalExpr('R₀ + R₀αΔT', v), 2.4) && close(evalExpr('R₀αΔT', v), 0.4) &&
      ['R₀ = 2.0 Ω', 'R = 2.4 Ω', 'R₀αΔT', 'R₀ × 1'].every((s) => g.texts.indexOf(s) >= 0) && close(g.res.strip / g.res.main, 0.2);
  }, { source: LUMEN });
  K.check('V = IR₁ + IR₂ + IR₃ = I(R₁ + R₂ + R₃): a current I through resistors in series makes a voltage I(R₁ + R₂), which expands to IR₁ + IR₂; with the example 2 A through 3 Ω and 5 Ω both make 16 V, drawn as I rows of R₁ + R₂ squares, each 1 A through 1 Ω, worth 1 V', () => {
    const d = STEPS[idx('Two resistors')], v = d.vars, A = d.area;
    return same('I(R₁ + R₂)', 'IR₁ + IR₂') && !same('I(R₁ + R₂)', 'IR₁ + R₂') && d.q === 'I(R₁ + R₂)' && d.want === 'IR₁ + IR₂' &&
      close(evalExpr(d.q, v), 16) && close(evalExpr(d.want, v), 16) && d.unit === 'V' && A.k === v.I && A.sq === v['R₁'] + v['R₂'] && A.groups[0] === v['R₁'] && A.groups[1] === v['R₂'];
  }, { source: LIBRE });
  K.check('Every worked number is right (27 at x = 4; 28, 13 and 40 at x = 2; 21 and 11; 20, 16 and 28 at a = 2; 20 at x = 6; 18, 26 and 42 at x = 5; 16 V and 11; −7 and −17; 16, 20 and 8 at x = 1; −2, −18 and −14; 11, 1 and 37 at x = 3), and every line of working on every screen adds up', () => {
    const e2 = { I: 2, 'R₁': 3, 'R₂': 5 };
    const listed = [['3(x + 5)', { x: 4 }, 27], ['3x + 15', { x: 4 }, 27], ['4(x + 5)', { x: 2 }, 28], ['4x + 5', { x: 2 }, 13], ['20x', { x: 2 }, 40],
      ['3(x + 5)', { x: 2 }, 21], ['3x + 15', { x: 2 }, 21], ['3x + 5', { x: 2 }, 11], ['2(3a + 4)', { a: 2 }, 20], ['6a + 4', { a: 2 }, 16], ['14a', { a: 2 }, 28],
      ['5(x − 2)', { x: 6 }, 20], ['5x − 10', { x: 6 }, 20], ['3(2x − 4)', { x: 5 }, 18], ['6x − 4', { x: 5 }, 26], ['6x + 12', { x: 5 }, 42],
      ['I(R₁ + R₂)', e2, 16], ['IR₁ + IR₂', e2, 16], ['IR₁ + R₂', e2, 11], ['−(6x − 5)', { x: 2 }, -7], ['−6x + 5', { x: 2 }, -7], ['−6x − 5', { x: 2 }, -17],
      ['4(x + 3) + 2(x − 1)', { x: 1 }, 16], ['6x + 14', { x: 1 }, 20], ['6x + 2', { x: 1 }, 8], ['−2(x − 4)', { x: 5 }, -2], ['−2x − 8', { x: 5 }, -18], ['−2x − 4', { x: 5 }, -14],
      ['8x − (6x − 5)', { x: 3 }, 11], ['2x − 5', { x: 3 }, 1], ['14x − 5', { x: 3 }, 37]];
    return listed.every((r) => close(evalExpr(r[0], r[1]), r[2])) && STEPS.every((d, i) => works(i).every(workAddsUp));
  });
  K.check('Every rectangle is drawn to count: each bar is x long and each square 1, so it holds the factor\'s rows of bars and squares, the split line falls between its two parts, and wherever x is slid both expressions make its area', () =>
    STEPS.every((d, i) => {
      if (d.pic !== 'area') return true;
      const A = d.area, G = geo(d), g = drawn(i, d.show ? blank() : solvedSt(i)), r = g.area, xv = xNow(d, blank());
      const ok = r.bars === A.k * A.bars && r.sqs === A.k * A.sq && r.cuts === A.k * (A.cut || 0) && close(r.len, (A.bars * xv + A.sq) * G.U) &&
        g.split != null && close(g.split, X0 + spans(d, xv, G)[d.split][1]);
      const slip = !d.slip || (g.slip && g.slip.bars === 3 && g.slip.sqs === 5);
      const slide = !d.slide || [1, 2, 3, 4, 5, 6, 7].every((x) => {
        const h = drawn(i, Object.assign(blank(), { x }));
        return h.work.length === 2 && close(h.area.len, (x + 5) * G.U) && close(endOf(h.work[0].w), 3 * (x + 5)) && close(endOf(h.work[1].w), 3 * (x + 5));
      });
      return ok && slip && slide;
    }));
  K.check('Before an answer, nothing in a puzzle\'s picture shows the answer: no split line, no part names and no answer row', () =>
    DO.every((i) => {
      const d = STEPS[i], g = drawn(i, blank());
      return g.texts.indexOf(d.want) < 0 && g.split == null && g.work.every((r) => r.e === d.q) && (d.parts || []).every((p) => g.texts.indexOf(p[1]) < 0);
    }));
  K.check('Trying the number: a right answer makes the same value as the question, and every wrong one shows in red making a different value', () =>
    DO.every((i) => {
      const d = STEPS[i], g = drawn(i, solvedSt(i)), q = g.work[0], a = g.work[g.work.length - 1];
      if (!(g.work.length === 2 && q.e === d.q && a.e === d.want && !a.bad && close(endOf(a.w), endOf(q.w)))) return false;
      return d.opts.filter((o) => o !== d.want).every((o) => {
        const h = drawn(i, wrongSt(i, o)), b = h.work[h.work.length - 1];
        return h.work.length === 2 && b.e === o && b.bad && !close(endOf(b.w), endOf(h.work[0].w));
      });
    }));
  K.check('Every demonstration has finished arriving within 4.5 s of its screen opening, none starting before the 0.35 s screen fade ends; every answer\'s motion, right or wrong, within 2.5 s', () => {
    const keepT = T;
    const timed = (i, st, limit) => {
      const keepS = S[i];
      T = Infinity; latest = 0; earliest = Infinity;
      S[i] = st;
      try { paint(i); } finally { S[i] = keepS; }
      return latest <= limit + 1e-9;
    };
    const ok = STEPS.every((d, i) => {
      if (d.show) { const r = timed(i, blank(), d.dur); return r && d.dur <= 4.5 && d.dur >= 3 && earliest >= FADE; }
      const f = fbOf(d);
      return timed(i, solvedSt(i), f[0]) && f[0] <= 2.5 && d.opts.filter((o) => o !== d.want).every((o) => timed(i, wrongSt(i, o), f[1]) && f[1] <= 2.5);
    });
    T = keepT; paint();
    return ok;
  });

  K.ready();
</script>
