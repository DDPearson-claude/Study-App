      tl: { eq: 0.4, a: [0.4, 0.9, 1.4], b: [1.9, 2.3, 2.7], s: [3.2] },
      text: 'A fraction bar holds everything above it together, the way a bracket does. So in (x + 4) ÷ 3 = 5 the 4 is added first, then the whole of x + 4 is divided by 3. Undo it from the right, 5 × 3 = 15 and 15 − 4 = 11.' },
    { kind: 'pick', pic: 'flow', name: 'Undo in order', eq: '{x − 2|4} = 3', ops: [['−', 2], ['÷', 4]], mid: 'x − 2',
      opts: ['10', '14', '20'], want: '14', slips: { '10': 'sameSign', '20': 'wrongOrder' },
      task: 'Solve (x − 2) ÷ 4 = 3 by undoing the flow diagram.',
      why: 'The flow diagram is x, then − 2, then ÷ 4, giving 3. Undo it from the right: 3 × 4 = 12, and 12 + 2 = 14. Check: (14 − 2) ÷ 4 = 3.',
      hint: 'Not quite. Undo each step, starting from the right.',
      hints: { '10': 'Not quite. Taking 2 away is undone by adding 2.', '20': 'Not quite. The ÷ 4 was done last, so undo it first.' } },

      text: 'With two fractions, multiply every term on both sides by the *least common denominator*, the smallest number both bottom numbers divide into. For x ÷ 2 + x ÷ 3 = 10 that is 6, so the 10 becomes 60 too. Then 5x = 60 and x = 12.' },

      opts: ['3', '54', '12'], want: '12', slips: { '3': 'plainNot', '54': 'addBottoms' },

      task: 'Solve x ÷ 2 + x ÷ 4 = 9.',
      why: '4 is the smallest number that 2 and 4 both divide into. Multiply every term by 4, the 9 as well: 2x + x = 36, so 3x = 36 and x = 12. Check: 6 + 3 = 9.',
      hint: 'Not quite. Multiply every term by the least common denominator.',
      hints: { '3': 'Not quite. Multiply the 9 by 4 as well, making 36.', '54': 'Not quite. That adds the bottom numbers. Multiply every term by 4, the smallest number 2 and 4 divide into.' } },

      task: 'Put it together. Solve (2x + 1) ÷ 3 = x − 1.',

  const FINISH = 'Work out what was done to x, in order, and undo it from the last step back, treating a bracket or a fraction bar as one thing. Or expand first and collect like terms. Then put the answer back in to check it.';

  const OPENSTAX = 'https://openstax.org/books/algebra-1/pages/1-solve-linear-equations-mini-lesson-review';
  const BITESIZE = 'https://www.bbc.co.uk/bitesize/articles/z7wkjfr';
  const NCETM = 'https://www.ncetm.org.uk/media/wbylane0/ncetm_ks3_cc_2_2.pdf';
  const NIPISSING = 'http://algebra.nipissingu.ca/mistakes.html';
  const LCDSRC = 'https://openstax.org/books/elementary-algebra-2e/pages/2-5-solve-equations-with-fractions-or-decimals';
  // A screen takes FADE to fade in, so no demonstration starts before it has settled.
  const FADE = 0.35;
  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  // While the kit's self-test looks at every screen it switches fades off (the k-testing class):
  // demonstrations then open finished, as they do with reduced motion.
  const testing = () => document.documentElement.classList.contains('k-testing');

  // ---------- numbers (pure, so the checks can test them) ----------
  // A fraction {a|b} read as a ÷ b, its top in a bracket when it has more than one term.
  const plain = (s) => String(s).replace(/\{([^|}]*)\|([^}]*)\}/g, (m, a, b) => (/[+−]/.test(a) ? '(' + a + ')' : a) + ' ÷ ' + b);
  // The value of an expression at x: brackets first, then × and ÷ (a number before x or a bracket
  // multiplies it), then + and −, left to right.
  function ev(s, x) {
    const toks = String(s).replace(/−/g, '-').match(/\d+(?:\.\d+)?|[x()+\-×÷]/g) || [];
    let i = 0;
    const peek = () => toks[i];
    const atom = () => { const p = toks[i++]; if (p === '(') { const v = sum(); i++; return v; } return p === 'x' ? x : +p; };
    const unary = () => (peek() === '-' ? (i++, -unary()) : atom());
    function prod() {
      let v = unary();
      for (;;) {
        const p = peek();
        if (p === '×') { i++; v *= unary(); } else if (p === '÷') { i++; v /= unary(); } else if (p === 'x' || p === '(') v *= unary();
        else return v;
      }
    }
    function sum() { let v = prod(); while (peek() === '+' || peek() === '-') { const o = toks[i++], w = prod(); v = o === '+' ? v + w : v - w; } return v; }
    return sum();
  }
  const sides = (e) => { const s = plain(e), k = s.indexOf(' = '); return [s.slice(0, k), s.slice(k + 3)]; };
  // How far the left side is above the right at x; a straight-line equation's answer makes it 0.
  const gap = (e, v) => { const s = sides(e); return ev(s[0], v) - ev(s[1], v); };
  const solve = (e) => { const a = gap(e, 1) - gap(e, 0); return Math.abs(a) < 1e-12 ? NaN : -gap(e, 0) / a; };
  // A value as the lesson writes it: whole, to two places, or a whole number ÷ another.
  function fmtV(v) {
    const sg = v < 0 ? '−' : '', a = Math.abs(v);
    if (Math.abs(a - Math.round(a)) < 1e-9) return sg + Math.round(a);
    if (Math.abs(a * 100 - Math.round(a * 100)) < 1e-6) return sg + String(Math.round(a * 100) / 100);
    for (let q = 2; q <= 12; q++) if (Math.abs(a * q - Math.round(a * q)) < 1e-9) return sg + Math.round(a * q) + ' ÷ ' + q;
    return sg + a.toFixed(2);
  }
  // An expression with a number put in for x ("4(8 + 3)", "9 × 24 − (5 × 24 − 6)").
  const subst = (s, v) => plain(s).replace(/(\d)x/g, '$1 × ' + fmtV(v)).replace(/x/g, fmtV(v));
  const bottoms = (e) => (String(e).match(/\|(\d+)\}/g) || []).map((m) => +m.slice(1, -1));
  const gcd = (a, b) => (b ? gcd(b, a % b) : a);
  const lcm = (a, b) => a / gcd(a, b) * b;
  // A flow diagram's steps, each undone by its opposite.
  const OPF = { '+': (a, b) => a + b, '−': (a, b) => a - b, '×': (a, b) => a * b, '÷': (a, b) => a / b };
  const INV = { '+': '−', '−': '+', '×': '÷', '÷': '×' };
  const opText = (o) => o[0] + ' ' + o[1];
  const undo = (o) => [INV[o[0]], o[1]];
  const run = (o, v) => OPF[o[0]](v, o[1]);
  // The right side r, undone from the right: its last step first (mid), then its first (ans).

    return [1, 2, 3, 4, 5].every((v) => { const r = drawn(i, Object.assign(blank(i), { x: v })).rec.bars; return !!r && near(r.l, 4 * v + 6) && near(r.r, 4 * v) && near(r.gap, 6 * KB); }) &&
      TRY.every((v) => near(gap(d.eq, v), 6)) && isNaN(solve(d.eq));
  });
  K.check('Before an answer, nothing in a puzzle\'s picture shows the answer', () =>
    DO.every((i) => { const d = STEPS[i], g = drawn(i, blank(i)); return g.texts.indexOf(d.want) < 0 && g.texts.indexOf('x = ' + d.want) < 0 && g.rec.rows.length === 0; }));
  // Drawn from the lesson's own timetable: each screen is painted finished and every arrival it used is noted.
  K.check('Every demonstration has finished arriving within 4.5 s of its screen opening, none starting before the 0.35 s screen fade ends; every answer\'s motion, right or wrong, within 2.5 s', () => {
    const keepT = T;
    const timed = (i, st) => { const keepS = S[i]; T = Infinity; latest = 0; earliest = Infinity; S[i] = st; try { paint(i); } finally { S[i] = keepS; } return latest; };
    const ok = STEPS.every((d, i) => {
      if (d.show) { const L = timed(i, blank(i)); return L <= d.dur + 1e-9 && d.dur <= 4.5 && d.dur >= 3 && earliest >= FADE; }
      return timed(i, solvedSt(i)) <= 2.5 && d.opts.filter((o) => o !== d.want).every((o) => timed(i, wrongSt(i, o)) <= 2.5);
    });
    T = keepT; paint();
    return ok;
  });

  K.ready();
</script>
