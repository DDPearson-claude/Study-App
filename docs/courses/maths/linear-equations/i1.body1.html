<p class="caption">Only like terms join, and trying a number checks a tidy-up.</p>

<script>
  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // Every picture is rows of pieces laid end to end from the same left edge, so rows that make the
  // same amount end in the same place. A bar is x long (R on the last screen) and a square is 1
  // long. rows: the expressions drawn, as written; a term with a minus is a dashed outline under the
  // pieces it takes away, and a tidy-up (tidy) fades those out and closes the gap.
  // x: the value of x drawn (shown when tag, or set by the slider when slide = {min, max, from, to,
  // t, d}: on a SHOW screen x slides from `from` to `to` starting at t, over d seconds).
  // A SHOW step's tl is its timetable in seconds from when the screen opens: groups, when each
  // row's terms arrive (split: a row's pieces arriving in parts); negs, when each taken-away term
  // arrives; tidy, when a row tidies; sub, when each bar's letter gives way to x's value; val, when
  // each row's value appears at its end; strips, rows of squares under a row (n squares in all by
  // each time in at); work, a line of working under the picture.
  // A puzzle asks for a value (ask 'value': its right answer counts squares under the row and gives
  // each row's value) or a tidy-up (ask 'tidy': the answer's own row is drawn under the question,
  // lining up when it is right). fb and fbw: how long the motion after a right and a wrong answer
  // plays. slips: which mistake gives each wrong answer (SLIP below).
  const PICK = 'Tap one of the answers.';
  const STEPS = [
    { show: true, name: 'A letter is a number', x: 4, tag: true, rows: ['3x'], split: { 0: [1, 2] }, dur: 3.5,
      tl: { groups: [[0.5, 1.7]], strips: [{ row: 0, n: [4, 12], at: [1.1, 2.3] }], val: 2.9 },
      text: 'A letter such as x stands for a number. Picture x as a bar that long, so here x = 4 and the bar matches 4 squares. 3x means 3 lots of x, three bars end to end, and makes 3 × 4 = 12.' },
    { kind: 'pick', ask: 'value', name: 'Three lots of x', x: 4, tag: true, rows: ['3x'], q: [0],
      opts: ['12', '7', '34'], want: '12', slips: { '7': 'add', '34': 'side' },
      right: { sub: 0.1, strips: [{ row: 0, n: [12], at: [0.6] }], val: 1.1 }, fb: 1.7, fbw: 0.7,
      task: 'Here x = 4. What does 3x make?',
      why: '3x is three bars end to end, each 4 long. So 3x makes 3 × 4 = 12, the length of 12 squares.',
      hint: 'Not quite. 3x means 3 lots of x.',
      hints: { '7': 'Not quite. That adds 3 and 4. 3x means 3 lots of 4.',
        '34': 'Not quite. That writes 3 and 4 side by side. 3x means 3 times x.' } },
    { show: true, name: 'Like terms join', slide: { min: 1, max: 7, from: 3, to: 7, t: 2.1, d: 1.2 }, rows: ['3x + 2x', '5x'], dur: 4.1,
      tl: { groups: [[0.5, 1.0], [1.5]], val: 3.5 },
      text: '3x and 2x are *like terms*, lots of the same number x, so 3 lots and 2 more make 5 lots, 5x. At x = 7 both rows make 35, as 3 sevens and 2 sevens make 5 sevens. Slide x and every bar stretches together, so they always line up.' },
    { kind: 'pick', ask: 'tidy', name: 'Count the lots', x: 2, rows: ['4x + 3x'],
      opts: ['12x', '7x', '7x²'], want: '7x', slips: { '12x': 'times', '7x²': 'power' }, fb: 0.7, fbw: 0.7,
      task: 'Tidy 4x + 3x into one term.',
      why: '4x and 3x are like terms, both lots of x. 4 lots and 3 more make 7 lots, so 4x + 3x = 7x.',
      hint: 'Not quite. Count the lots of x.',
      hints: { '12x': 'Not quite. That multiplies 4 by 3. 4 lots and 3 more lots make 7 lots.',
        '7x²': 'Not quite. x² is x times x, a different term. 4 lots of x and 3 more make 7 lots of x.' } },
    { show: true, name: 'Already finished', slide: { min: 1, max: 3, from: 3, to: 1, t: 2.7, d: 1.0 }, rows: ['3x + 4', '7x'], dur: 4.3,
      tl: { groups: [[0.5, 1.0], [1.5]], val: 2.1 },
      text: '3x + 4 has bars and plain squares, which are not like terms, so it cannot join into one term. It lines up with 7x only at x = 1, where both make 7. Slide x and they part, so 3x + 4 is already finished.' },
    { kind: 'pick', ask: 'tidy', name: 'Leave it be', x: 2, rows: ['5x + 2'],
      opts: ['7x', '7', '5x + 2'], want: '5x + 2', slips: { '7x': 'joinX', '7': 'joinNum' }, fb: 0.7, fbw: 0.7,
      task: 'Tidy 5x + 2 as far as it will go.',
      why: '5x is lots of x and 2 is a plain number, so they are not like terms. Nothing joins, so 5x + 2 is already finished.',
      hint: 'Not quite. Only like terms join.',
      hints: { '7x': 'Not quite. That joins the 2 onto the bars. 2 is a plain number, not lots of x.',
        '7': 'Not quite. That adds 5 and 2 and drops the x. 5x is 5 lots of x, not 5.' } },
    { show: true, name: 'Try a number', x: 3, tag: true, rows: ['3x + 2x', '5x', '3x + 4', '7x'], pairs: true, dur: 3.4,
      tl: { groups: [[0.5, 0.5], [0.5], [1.0, 1.0], [1.0]], sub: 1.6, val: [2.2, 2.2, 2.8, 2.8] },
      text: 'A tidy-up writes the same *expression* another way, so you can check one by trying a number in both. At x = 3, 3x + 2x and 5x both make 15. But 3x + 4 makes 13 and 7x makes 21, so they are not the same.' },
    { kind: 'pick', ask: 'value', name: 'Test a claim', x: 2, tag: true, rows: ['4x + 3', '7x'], q: [0],
      opts: ['14', '11', '7'], want: '11', slips: { '14': 'other', '7': 'drop' },
      right: { sub: 0.1, val: 0.6, work: [{ s: '8 + 3 = 11, not 14', t: 1.1, bad: true }] }, fb: 1.7, fbw: 0.7,
      task: 'Someone says 4x + 3 = 7x. Try x = 2. What does 4x + 3 make?',
      why: 'With x = 2, 4x + 3 makes 8 + 3 = 11, but 7x makes 14. They differ, so 4x + 3 is not the same as 7x.',
      hint: 'Not quite. Put 2 in place of x in 4x + 3.',
      hints: { '14': 'Not quite. 14 is what 7x makes. Work out 4 × 2 + 3.',
        '7': 'Not quite. That adds 4 and 3 and leaves out x. 4x is 4 lots of 2.' } },
    { show: true, name: 'Signs belong to terms', x: 2, tag: true, rows: ['7x − 2x + 3 − x'], dur: 4.4,
      tl: { groups: [[0.5, 1.0]], negs: [[1.5, 2.0]], tidy: [2.5], val: 3.8, work: [{ s: '14 − 4 + 3 − 2 = 11', t: 3.8 }] },
      text: 'Each part joined on by + or − is a *term*, and the sign in front belongs to it. Taking away 2x and x leaves 7 − 2 − 1 = 4 lots of x, so 7x − 2x + 3 − x = 4x + 3. At x = 2 both make 11.' },
    { kind: 'pick', ask: 'tidy', name: 'A minus at the start', x: 2, rows: ['−x + 8x + 3'],
      opts: ['9x + 3', '8x + 3', '7x + 3'], want: '7x + 3', slips: { '9x + 3': 'startMinus', '8x + 3': 'loneX' }, fb: 2.0, fbw: 2.0,
      task: 'Tidy −x + 8x + 3.',
      why: 'The minus at the start belongs to the lone x, which is 1x. 8 lots take away 1 lot leaves 7 lots, so −x + 8x + 3 = 7x + 3.',
      hint: 'Not quite. Each sign belongs to the term after it.',
      hints: { '9x + 3': 'Not quite. That adds the first x. Its minus belongs to it, so it takes one x away.',
        '8x + 3': 'Not quite. That drops the lone x. It is 1x, taken away, so 8 − 1.' } },
    { kind: 'pick', ask: 'tidy', name: 'Put it together', x: 2, rows: ['9x + 4 − 3x − 1'],
      opts: ['6x + 3', '12x + 5', '6x + 5'], want: '6x + 3', slips: { '12x + 5': 'ignoreMinus', '6x + 5': 'lastMinus' }, fb: 2.0, fbw: 2.0,
      task: 'Put it together. Tidy 9x + 4 − 3x − 1.',
      why: 'The x terms are 9x and −3x, and 9 − 3 = 6. The numbers are 4 and −1, which make 3. So 9x + 4 − 3x − 1 = 6x + 3.',
      hint: 'Not quite. Each sign belongs to the term after it.',
      hints: { '12x + 5': 'Not quite. That adds every term. The minuses belong to 3x and 1, so take those away.',
        '6x + 5': 'Not quite. The minus in front of the 1 belongs to it, so 4 − 1 = 3.' } },
    { kind: 'pick', ask: 'tidy', name: 'Resistors in series', x: 2, letter: 'R', circuit: true, rows: ['R + R + R + 10'],
      opts: ['13R', '3R + 10', 'R³ + 10'], want: '3R + 10', slips: { '13R': 'joinX', 'R³ + 10': 'cube' }, fb: 0.7, fbw: 0.7,
      task: 'Three resistors of R ohms and a 10 Ω one in series total R + R + R + 10. Tidy it.',
      why: 'R + R + R is 3 lots of R, so 3R. The 10 is a plain number, not a like term, so the total is 3R + 10.',
      hint: 'Not quite. Only like terms join.',
      hints: { '13R': 'Not quite. That joins the 10 onto the R\'s. 10 is a plain number, not lots of R.',
        'R³ + 10': 'Not quite. R³ means R × R × R. Adding three R\'s makes 3R.' } },
  ];
  const FINISH = 'A letter stands for a number, so like terms count together and 3x + 2x = 5x. Anything else, such as 3x + 4, is already finished. Each sign belongs to the term after it, and trying a number checks a tidy-up.';
  // Sources the checks restate (the lesson's own).
  const NCETM = 'https://www.ncetm.org.uk/media/bdddodxr/secmm-cc-audit-1-4-simplifying-and-manipulating-expressions-equations-and-formulae.pdf';
  const OPENSTAX = 'https://openstax.org/books/prealgebra-2e/pages/2-2-evaluate-simplify-and-translate-expressions';
  const PURPLEMATH = 'https://www.purplemath.com/modules/polydefs2.htm';
  // Rows start at X0 and may run L long (room is kept on the right for a row's value); a square is
  // U long, at most UMAX; bars are BH tall. The slider's track runs from SX0 to SX1.
  const X0 = 12, L = 284, UMAX = 24, BH = 28, SX0 = 40, SX1 = 300;
  // A screen takes FADE to fade in, so no demonstration starts before it has settled.
  const FADE = 0.35;
  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  // While the kit's self-test looks at every screen it switches fades off (the k-testing class):
  // demonstrations then open finished, as they do with reduced motion.
  const testing = () => document.documentElement.classList.contains('k-testing');

  // ---------- expressions (pure, so the checks can test them) ----------
  // A term is {c, v, p}: its count (negative after a minus), its letter ('' for a plain number) and
  // the letter's power.
  const SUP = { '²': 2, '³': 3 }, SUPS = { 2: '²', 3: '³' };
  function parse(s) {
    return String(s).replace(/\s+/g, '').replace(/−/g, '-').match(/[+-]?[^+-]+/g).map((tok) => {
      const m = /^([+-]?)(\d*)([A-Za-z]?)([²³]?)$/.exec(tok);
      const n = m[2] === '' ? 1 : +m[2];
      return { c: (m[1] === '-' ? -1 : 1) * n, v: m[3] || '', p: m[3] ? (SUP[m[4]] || 1) : 0 };
    });
  }
  const valueOf = (terms, x) => terms.reduce((a, t) => a + t.c * (t.v ? Math.pow(x, t.p) : 1), 0);
  const val = (s, x) => valueOf(parse(s), x);
  // Like terms (the same letter to the same power, or plain numbers) counted together; letters first.
  function tidy(terms) {
    const keys = [], sum = {};
    terms.forEach((t) => { const k = t.v + t.p; if (!(k in sum)) { keys.push(k); sum[k] = { c: 0, v: t.v, p: t.p }; } sum[k].c += t.c; });
    return keys.map((k) => sum[k]).filter((t) => t.c !== 0).sort((a, b) => (b.v ? 1 : 0) - (a.v ? 1 : 0) || b.p - a.p);
  }
  const termText = (t) => (t.v ? (Math.abs(t.c) === 1 ? '' : String(Math.abs(t.c))) + t.v + (t.p > 1 ? SUPS[t.p] : '') : String(Math.abs(t.c)));
  const fmt = (terms) => terms.map((t, k) => (k === 0 ? (t.c < 0 ? '−' : '') : t.c < 0 ? ' − ' : ' + ') + termText(t)).join('') || '0';
  const tidied = (s) => fmt(tidy(parse(s)));
  // The answer a puzzle wants, worked out by its rule.
  const answerOf = (d) => (d.ask === 'value' ? String(val(d.rows[0], d.x)) : tidied(d.rows[0]));
  // What each slip makes of the question: 3 and 4 added, or written side by side; the counts
  // multiplied; the counts added but a power made up; every count joined onto the letter, or added
  // with the letter dropped; the plain numbers added with x left out; the other side of a claim
  // worked out instead; a minus at the start ignored; a lone x dropped; every minus ignored; the
  // minus on a plain number ignored; three R's made into R³.
  const first = (d) => parse(d.rows[0]);
  const SLIP = {
    add: (d) => String(first(d)[0].c + d.x),
    side: (d) => String(first(d)[0].c) + String(d.x),
    times: (d) => first(d).reduce((a, t) => a * t.c, 1) + 'x',
    power: (d) => fmt([{ c: first(d).reduce((a, t) => a + t.c, 0), v: 'x', p: 2 }]),
    joinX: (d) => first(d).reduce((a, t) => a + Math.abs(t.c), 0) + first(d).filter((t) => t.v)[0].v,
    joinNum: (d) => String(first(d).reduce((a, t) => a + t.c, 0)),
    drop: (d) => String(first(d).reduce((a, t) => a + t.c, 0)),
    other: (d) => String(val(d.rows[1], d.x)),
    startMinus: (d) => fmt(tidy(first(d).map((t, k) => (k === 0 ? Object.assign({}, t, { c: Math.abs(t.c) }) : t)))),
    loneX: (d) => fmt(tidy(first(d).filter((t) => !(t.v && Math.abs(t.c) === 1)))),
    ignoreMinus: (d) => fmt(tidy(first(d).map((t) => Object.assign({}, t, { c: Math.abs(t.c) })))),
    lastMinus: (d) => fmt(tidy(first(d).map((t) => (t.v ? t : Object.assign({}, t, { c: Math.abs(t.c) }))))),
    cube: (d) => { const ts = first(d), ls = ts.filter((t) => t.v); return fmt([{ c: 1, v: ls[0].v, p: ls.length }].concat(tidy(ts.filter((t) => !t.v)))); },
  };
  // As a screen reader says it.
  const say = (s) => String(s).replace(/ /g, ' ').replace(/²/g, ' squared').replace(/³/g, ' cubed').replace(/Ω/g, ' ohms').replace(/\?/g, ' a question mark ')
    .replace(/\+/g, ' plus ').replace(/×/g, ' times ').replace(/=/g, ' equals ').replace(/−/g, ' minus ').replace(/\s+/g, ' ').trim();

  // A row's pieces: each term with a plus laid out as bars or squares in the order written; each
  // term with a minus takes away the last pieces of its own kind (a dashed outline under them).
  const ROWS = {};
  function rowInfo(e) {
    if (ROWS[e]) return ROWS[e];
    const terms = parse(e), pieces = [], groups = [], negs = [];
    terms.forEach((t, j) => {
      if (t.c <= 0) return;
      const g = { term: j, pieces: [] };
      for (let n = 0; n < t.c; n++) { g.pieces.push(pieces.length); pieces.push({ kind: t.v ? 'bar' : 'sq', v: t.v, cut: null }); }
      groups.push(g);
    });
    terms.forEach((t, j) => {
      if (t.c >= 0) return;
      const covers = [];
      for (let k = pieces.length - 1; k >= 0 && covers.length < -t.c; k--) if (pieces[k].cut == null && pieces[k].v === t.v) { pieces[k].cut = negs.length; covers.unshift(k); }
      negs.push({ term: j, covers });
    });
    ROWS[e] = { e, terms, pieces, groups, negs, drawable: terms.every((t) => t.p <= 1) };
    return ROWS[e];
  }
  // How long a row's solid pieces run, in squares, with x as given.
  const solidUnits = (r, x) => r.pieces.reduce((a, p) => a + (p.kind === 'bar' ? x : 1), 0);
  // Where each piece sits: x0 as written, x1 once the taken-away pieces are gone and the gap closed.
  function positions(r, x, U) {
    let a = X0, b = X0;
    const list = r.pieces.map((p) => { const w = p.kind === 'bar' ? x * U : U, q = { x0: a, x1: b, w }; a += w; if (p.cut == null) b += w; return q; });
    return { list, solid: a - X0, net: b - X0 };
  }

  // ---------- each step's sizes ----------
  // The square's length U fits the longest row the screen can draw; the picture's height follows
  // from what each row may carry (a taken-away band, a strip of squares), the answer's row, the
  // working and the key.
  const GEO = new Map();
  function geo(d) {
    if (GEO.has(d)) return GEO.get(d);
    const info = d.rows.map(rowInfo);
    const xMax = d.slide ? d.slide.max : d.x;
    let units = 0;
    info.forEach((r) => { units = Math.max(units, solidUnits(r, xMax)); });
    if (d.ask === 'tidy') d.opts.forEach((o) => { const r = rowInfo(o); if (r.drawable) units = Math.max(units, solidUnits(r, d.x)); });
    const U = Math.min(UMAX, L / units);
    const fit = (n) => n > 0 && n * U <= L + 1e-9;
    const stripRows = {};

  let S = STEPS.map((d, i) => blank(i));

  // ---------- text with amber key terms and italic letters (built with K.el, never innerHTML) ----------

  // ---------- controls ----------

  const nav = document.getElementById('nav');
  const at = () => stepper.get();

  // Up to three answer buttons; each step fills in its own options. A new choice after a wrong

  const pickBtns = [0, 1, 2].map((k) => K.button({ label: 'Answer ' + (k + 1), secondary: true, into: '#picks', press: () => {
    const i = at(), d = STEPS[i], st = S[i];
    if (finished || d.show || !d.opts || k >= d.opts.length || st.res === 'right') return;
    const was = st.res === 'wrong' && st.pick != null && hasWrongMotion(d, st.pick);

  // A new screen (or the finish panel, or the picture after a fresh start) fades in softly.

  // One row of the question: its pieces, what is taken away, the term names, its value and any
  // strip of squares under it.
  function drawRow(d, st, tl, G, k, xv) {
    const info = G.info[k], U = G.U, y0 = G.rowY[k], bt = y0 + 29, P = positions(info, xv, U), xr = Math.round(xv);

      });

  // The answer's own row under the question: lining up when right, in the warning colour when not.
  function drawAns(d, tl, G) {

      r.pieces.forEach((p, j) => drawPiece(p, P.list[j].x0, bt, P.list[j].w, U, bad, { 'data-row': 'ans' }, null, d.x));
      const items = r.groups.map((g, n) => { const f = P.list[g.pieces[0]], l = P.list[g.pieces[g.pieces.length - 1]]; return { a0: f.x0, a1: l.x0 + l.w, text: (n === 0 ? '' : '+ ') + termText(r.terms[g.term]) }; });
      labelSet(items, y0 + 15, y0 + 22, !!bad).forEach((f) => f());
    });
    REC.ans = { end: X0 + P.net, e: tl.ans.e, bad: !!tl.ans.bad };
    return a >= 0.5 ? ' Under it, the answer ' + say(tl.ans.e) + ' as its own row, ' + pieceWords(r.terms, d.letter || 'x') + (tl.ans.bad ? ', which does not line up.' : ', which lines up.') : '';
  }
  // The slider for x: its track, a tick at each whole number, the knob and its value.
  const xPos = (s, v) => SX0 + (v - s.min) / (s.max - s.min) * (SX1 - SX0);
  function drawSlider(d, xv) {
    const s = d.slide, ty = 40;
    line('track', SX0, ty, SX1, ty);
    for (let v = s.min; v <= s.max; v++) line('tick', xPos(s, v), ty - 7, xPos(s, v), ty + 7);
    const kx = xPos(s, xv), lab = 'x = ' + Math.round(xv), w = tw(nb(lab), 'xl');
    add(K.svg('circle', { class: 'knob', cx: r3(kx), cy: ty, r: 10 }));
    text(K.clamp(kx, 12 + w / 2, 328 - w / 2), 19, nb(lab), 'xl');
  }
  // Three resistors of R ohms and a 10 ohm one on one wire.
  function drawCircuit() {
    const wy = 48, xs = [64, 134, 204, 274], labs = ['R', 'R', 'R', '10 Ω'];
    line('wire', 20, wy, 320, wy);
    [20, 320].forEach((x) => add(K.svg('circle', { class: 'end', cx: x, cy: wy, r: 4 })));
    xs.forEach((cx, k) => { rect('res', cx - 22, wy - 9, 44, 18, 2); text(cx, wy - 17, nb(labs[k]), 'tl'); });
  }
  // The key, inside the drawing: a bar, a square and (where used) a dashed outline.
  function drawKey(d, G) {
    const y = G.keyY, letter = d.letter || 'x';
    let x = X0;
    const item = (sw, wd, label) => { sw(x); x += wd + 6; text(x, y + 5, nb(label), 'key', 'start'); x += tw(nb(label), 'key') + 18; };
    item((x0) => rect('xb', x0 + 0.75, y - 7, 24, 14, 3), 25, letter + ' long');
    item((x0) => rect('sq', x0, y - 6, 12, 12, 2), 12, 'worth 1');
    if (G.neg) item((x0) => rect('neg', x0 + 1, y - 7, 24, 14, 3), 26, 'taken away');
  }

  // The whole picture for a step now; returns it in words.
  function drawScene(d, st, G) {
    const tl = timeline(d, st), xv = xNow(d, st);
    REC = { rows: [], strips: [], ans: null, x: xv };
    const said = [];
    if (d.slide) { drawSlider(d, xv); said.push('A slider sets x, now ' + Math.round(xv) + '.'); }
    else if (d.tag) { text(X0, 21, nb('x = ' + d.x), 'tag', 'start'); said.push('Here x is ' + d.x + '.'); }
    if (d.circuit) { drawCircuit(); said.push('Three resistors marked R and one marked 10 ohms, one after another on a wire.'); }
    d.rows.forEach((e, k) => said.push(drawRow(d, st, tl, G, k, xv)));
    if (tl.ans) said.push(drawAns(d, tl, G));
    tl.work.forEach((w, m) => {
      const a = arr(w.t);
      part(a, 6, () => text(170, G.workY + 30 * m, nb(w.s), 'wk' + (w.bad ? ' bad' : '')));
      if (a >= 0.5) said.push('Working: ' + say(w.s) + '.');
    });
    drawKey(d, G);
    placeGrip(d, xv);
    return said.filter(Boolean).join(' ');
  }

  // ---------- the slider: Dan sets x himself ----------
  // A band over the track, kept across repaints so a drag survives them; a thumb's height tall.
  const grip = ui.appendChild(K.svg('rect', { class: 'grip', x: 0, y: 0, width: 0, height: 0, tabindex: -1, role: 'slider', 'aria-label': 'x', 'aria-orientation': 'horizontal' }));
  grip.style.display = 'none';
  function placeGrip(d, xv) {
    const on = !!d.slide && !finished;
    grip.style.display = on ? '' : 'none';
    grip.setAttribute('tabindex', on ? '0' : '-1');
    if (!on) return;
    grip.setAttribute('x', SX0 - 24); grip.setAttribute('width', SX1 - SX0 + 48);
    grip.setAttribute('y', 14); grip.setAttribute('height', 48);
    const v = Math.round(xv);
    grip.setAttribute('aria-valuemin', d.slide.min); grip.setAttribute('aria-valuemax', d.slide.max); grip.setAttribute('aria-valuenow', v);
    grip.setAttribute('aria-valuetext', 'x = ' + v);
  }
  const sliding = () => !finished && !!STEPS[at()].slide;
  // Dan's x, a whole number on the track: it stops the demonstration and every bar takes it up.
  function setX(v) {
    const i = at(), d = STEPS[i], st = S[i];
    v = K.clamp(Math.round(v), d.slide.min, d.slide.max);
    if (st.x === v && T === Infinity) return;
    if (anim.playing()) anim.pause();
    T = Infinity; motion = null;
    st.x = v;
    K.reveal(); K.refresh();
  }
  function xFrom(e) {
    const ctm = svg.getScreenCTM();
    if (!ctm) return null;
    const q = new DOMPoint(e.clientX, e.clientY).matrixTransform(ctm.inverse()), s = STEPS[at()].slide;
    return s.min + (q.x - SX0) / (SX1 - SX0) * (s.max - s.min);
  }
  let held = null;
  grip.addEventListener('pointerdown', (e) => {
    if (!sliding()) return;
    held = e.pointerId;
    try { grip.setPointerCapture(e.pointerId); } catch (err) { /* the drag still follows the pointer while it stays on the band */ }
    e.preventDefault();
    const v = xFrom(e);
    if (v != null) setX(v);
  });
  grip.addEventListener('pointermove', (e) => {
    if (held !== e.pointerId || !sliding()) return;
    const v = xFrom(e);
    if (v != null) setX(v);
  });
  const letGo = (e) => { if (held === e.pointerId) held = null; };
  grip.addEventListener('pointerup', letGo);
  grip.addEventListener('pointercancel', letGo);
  grip.addEventListener('lostpointercapture', () => { held = null; });
  grip.addEventListener('keydown', (e) => {
    if (!sliding()) return;
    const d = STEPS[at()], st = S[at()], now = st.x != null ? st.x : Math.round(xNow(d, st));
    const by = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1 }[e.key];
    if (by == null && e.key !== 'Home' && e.key !== 'End') return;
    e.preventDefault();
    setX(e.key === 'Home' ? d.slide.min : e.key === 'End' ? d.slide.max : now + by);
  });

  // The scene for a step (the animation calls this every frame).
  function paint(i) {
    if (i == null) i = at();
    const d = STEPS[i], st = S[i], G = geo(d);
    art.textContent = '';
    into = null;
    svg.setAttribute('viewBox', '0 0 340 ' + G.H);
    svg.setAttribute('aria-label', drawScene(d, st, G));
  }

  const el = (id) => document.getElementById(id);
  write(el('finish'), FINISH);
  K.update((p) => {
    const i = Math.round(p.step), d = STEPS[i], st = S[i];
    if (!anim.playing()) T = Infinity;   // motion that was stopped (the page hidden, a test) shows finished
    if (i !== lastStep) {
      lastStep = i; enter('stepbox');
      if (d.show) { st.x = null; play(d.dur, 'demo'); } else { anim.pause(); T = Infinity; motion = null; }
    }
    if (finished !== lastDone) { lastDone = finished; enter(finished ? 'done' : 'stepbox'); }
    const right = st.res === 'right';
    el('stepbox').hidden = finished;
    el('done').hidden = !finished;
    el('count').textContent = 'Step ' + (i + 1) + ' of ' + STEPS.length;
    const task = el('task');
    task.className = 'task' + (d.show ? ' show' : '');
    write(task, d.show ? d.text : d.task);
    paint(i);

    replayBtn.el.hidden = !d.show || REDUCE;
    el('replay').hidden = replayBtn.el.hidden;
    const opts = d.show ? [] : d.opts || [];
    el('picks').hidden = !opts.length;
    el('picks').classList.toggle('long', opts.some((o) => o.length > 6));
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      b.setLabel(opts[k]);
      b.el.setAttribute('aria-label', say(opts[k]));
      b.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });

    el('acts').hidden = !!d.show;
    checkBtn.el.hidden = right;
    const fb = el('fb');
    fb.hidden = !!d.show;
    fb.className = 'fb' + (right ? ' right' : st.res === 'wrong' ? ' wrong' : '');
    write(fb, d.show ? '' : right ? 'That\'s it.' : st.res === 'wrong' ? hintFor(i, st) : st.res === 'empty' ? PICK : '');

    const why = el('why');
    why.hidden = d.show || !st.why;
    write(why, d.show ? '' : d.why);
    whyBtn.setLabel(st.why ? 'Hide why' : 'Why?');

    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !right);
    nextBtn.setLabel(i === STEPS.length - 1 ? 'Finish' : 'Continue');
    nav.hidden = backBtn.el.hidden && nextBtn.el.hidden;
  });

  // ---------- known answers, worked out by hand ----------
  const DO = STEPS.map((d, i) => i).filter((i) => !STEPS[i].show);
  const pickRight = (i, v) => isRight(i, Object.assign(blank(i), { pick: v }));
  const solvedSt = (i) => Object.assign(blank(i), { pick: STEPS[i].want, res: 'right' });
  const wrongSt = (i, o) => Object.assign(blank(i), { pick: o, res: 'wrong' });
  const near = (a, b) => Math.abs(a - b) < 1e-6;
  const TRY = [1, 2, 3, 4, 7, 10, 0.5, -4];
  // A step painted in the state given (finished, or at t seconds into its motion): what it draws.
  function drawn(i, st, t) {
    const keepS = S[i], keepT = T;
    S[i] = st; T = t == null ? Infinity : t;
    try {
      paint(i);
      const rec = REC;
      const count = (cls, k) => art.querySelectorAll('rect.' + cls + '[data-row="' + k + '"]').length;
      return { texts: Array.from(art.querySelectorAll('text')).map((n) => n.textContent.replace(/ /g, ' ')), rows: rec.rows, strips: rec.strips, ans: rec.ans, count };
    } finally { S[i] = keepS; T = keepT; paint(); }
  }
  K.check('Collecting like terms generalises unitising in number: three lots and two lots of the same number make five lots of it, whatever the number, so the two rows that compare them line up wherever x is slid', () => {
    const G = geo(STEPS[2]);
    return TRY.every((v) => val('3x + 2x', v) === val('5x', v)) &&
      [1, 2, 3, 4, 5, 6, 7].every((v) => { const g = drawn(2, Object.assign(blank(2), { x: v })); return near(g.rows[0].end, g.rows[1].end) && near(g.rows[0].end - X0, 5 * v * G.U); });
  }, { source: NCETM });
  K.check('Terms are like terms if they have the same variables and exponents, and all constant terms are like terms: each tidy-up joins only those, and each puzzle accepts only its own tidy answer', () =>
    tidied('4x + 3x') === '7x' && tidied('7x − 2x + 3 − x') === '4x + 3' && tidied('9x + 4 − 3x − 1') === '6x + 3' && tidied('R + R + R + 10') === '3R + 10' &&
    tidied('x + x²') === 'x² + x' && tidied('5x + 2') === '5x + 2' && tidy(parse('3 + 4')).length === 1 &&
    DO.every((i) => STEPS[i].want === answerOf(STEPS[i]) && STEPS[i].opts.every((o) => pickRight(i, o) === (o === STEPS[i].want))), { source: OPENSTAX });
  K.check('Terms can be combined only if they have the exact same variable portion: a letter term and a plain number never join, and the row that holds them lines up with the joined-up version at just one value of x', () => {
    const G = geo(STEPS[4]);
    return tidy(parse('3x + 4')).length === 2 && tidy(parse('5x + 2')).length === 2 && tidy(parse('R + R + R + 10')).length === 2 &&
      TRY.filter((v) => val('3x + 4', v) === val('7x', v)).join() === '1' && TRY.filter((v) => val('5x + 2', v) === val('7x', v)).join() === '1' &&
      [1, 2, 3].every((v) => { const g = drawn(4, Object.assign(blank(4), { x: v })); return near(g.rows[0].end, g.rows[1].end) === (v === 1) && near(g.rows[1].end - X0, 7 * v * G.U); });
  }, { source: PURPLEMATH });
  K.check('The worked numbers: 3x makes 12 at x = 4; 3x + 2x and 5x make 35 at x = 7 and 15 at x = 3; 3x + 4 and 7x make 7 at x = 1 but 13 and 21 at x = 3; 4x + 3 makes 11 and 7x makes 14 at x = 2; 7x − 2x + 3 − x and 4x + 3 both make 11 at x = 2', () => {
    const g = drawn(6, blank(6)), h = drawn(8, blank(8));
    return val('3x', 4) === 12 && val('3x + 2x', 7) === 35 && val('5x', 7) === 35 && val('3x + 2x', 3) === 15 && val('5x', 3) === 15 &&
      val('3x + 4', 1) === 7 && val('7x', 1) === 7 && val('3x + 4', 3) === 13 && val('7x', 3) === 21 && val('4x + 3', 2) === 11 && val('7x', 2) === 14 &&
      val('7x − 2x + 3 − x', 2) === 11 && val('4x + 3', 2) === 11 && 7 * 2 - 2 * 2 + 3 - 2 === 11 &&
      ['15', '15', '13', '21'].every((s) => g.texts.indexOf(s) >= 0) && g.texts.filter((s) => s === '15').length === 2 &&
      h.texts.indexOf('11') >= 0 && h.texts.indexOf('14 − 4 + 3 − 2 = 11') >= 0;
  });
  K.check('Every tidy answer gives the same value as its question for every x tried, whole, a half or negative, and every wrong answer offered gives a different value at the x drawn', () =>
    DO.every((i) => {
      const d = STEPS[i];
      if (d.ask === 'value') return String(val(d.rows[0], d.x)) === d.want && d.opts.every((o) => o === d.want || +o !== val(d.rows[0], d.x));
      return TRY.every((v) => near(val(d.rows[0], v), val(d.want, v))) && d.opts.every((o) => o === d.want || !near(val(o, d.x), val(d.rows[0], d.x)));
    }));
  K.check('Each wrong answer offered is the one a named slip gives: 3 and 4 added or written side by side, the counts multiplied, a power made up, a plain number joined onto the letters, the letter dropped, the other side of a claim worked out, a starting minus ignored, a lone x dropped, every minus ignored, or the minus on a plain number dropped', () =>
    DO.every((i) => {
      const d = STEPS[i];
      return d.opts.length === 3 && d.opts.indexOf(d.want) >= 0 && Object.keys(d.slips).length === 2 &&
        Object.keys(d.slips).every((o) => d.opts.indexOf(o) >= 0 && o !== d.want && SLIP[d.slips[o]](d) === o);
    }) && SLIP.add(STEPS[1]) === '7' && SLIP.side(STEPS[1]) === '34' && SLIP.times(STEPS[3]) === '12x' && SLIP.ignoreMinus(STEPS[10]) === '12x + 5' && SLIP.cube(STEPS[11]) === 'R³ + 10');
  K.check('Every picture is drawn to count: each bar is x long and each square 1, so a row ends at its value; a right answer lines up with its question and a wrong one does not', () =>
    STEPS.every((d, i) => {
      const G = geo(d);
      const ok = (g) => g.rows.every((r, k) => {
        const info = G.info[k], ts = r.tidied ? tidy(info.terms) : info.terms.filter((t) => t.c > 0);
        const bars = ts.filter((t) => t.v).reduce((a, t) => a + t.c, 0), sqs = ts.filter((t) => !t.v).reduce((a, t) => a + t.c, 0);
        return near(r.end - X0, (r.tidied ? r.value : r.solid) * G.U) && g.count('xb', k) === bars && g.count('sq', k) === sqs;
      });
      if (d.show) { const g = drawn(i, blank(i)); return ok(g) && g.strips.every((s) => near(s.end - X0, s.n * G.U)); }
      const g = drawn(i, solvedSt(i));
      if (!ok(g)) return false;
      if (d.ask === 'tidy' && !(g.ans && near(g.ans.end, g.rows[0].end) && g.rows[0].tidied)) return false;
      if (d.ask === 'value' && !g.strips.every((s) => near(s.end, g.rows[0].end))) return false;
      return d.opts.filter((o) => o !== d.want && hasWrongMotion(d, o)).every((o) => {
        const w = drawn(i, wrongSt(i, o));
        if (d.ask === 'tidy') return !w.ans || (w.ans.bad && !near(w.ans.end, w.rows[0].end));
        return w.strips.length === 1 && w.strips[0].bad && !near(w.strips[0].end, w.rows[0].end);
      });
    }));
  K.check('Before an answer, nothing in a puzzle\'s picture shows the answer', () =>
    DO.every((i) => { const d = STEPS[i], g = drawn(i, blank(i)); return g.texts.indexOf(d.want) < 0 && !g.ans && !g.strips.length && (d.ask !== 'value' || g.texts.indexOf('?') >= 0); }));
  // Drawn from the lesson's own timetable: each screen is painted finished and every arrival it used is noted.
  K.check('Every demonstration has finished arriving within 4.5 s of its screen opening, none starting before the 0.35 s screen fade ends; every answer\'s motion, right or wrong, within 2.5 s', () => {
    const keepT = T;
    const timed = (i, st, limit) => {
      const keepS = S[i];
      T = Infinity; latest = 0; earliest = Infinity;
      S[i] = st;
      try { paint(i); } finally { S[i] = keepS; }
      return latest <= limit + 1e-9;
    };
    const ok = STEPS.every((d, i) => {
      if (d.show) { const r = timed(i, blank(i), d.dur); return r && d.dur <= 4.5 && d.dur >= 3 && earliest >= FADE; }
      const right = timed(i, solvedSt(i), d.fb) && d.fb <= 2.5;
      const wrongs = d.opts.filter((o) => o !== d.want && hasWrongMotion(d, o)).every((o) => timed(i, wrongSt(i, o), d.fbw) && d.fbw <= 2.5);
      return right && wrongs;
    });
    T = keepT; paint();
    return ok;
  });

  K.ready();
</script>
