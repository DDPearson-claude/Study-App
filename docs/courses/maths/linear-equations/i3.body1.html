  // Sources the checks restate (the lesson's own).
  const NCETM = 'https://www.ncetm.org.uk/media/bdddodxr/secmm-cc-audit-1-4-simplifying-and-manipulating-expressions-equations-and-formulae.pdf';
  const GCF = 'https://openstax.org/books/college-algebra-2e/pages/1-5-factoring-polynomials';
  const OPENSTAX = 'https://openstax.org/books/algebra-1/pages/6-simplify-expressions-using-the-distributive-property-mini-lesson-review';
  const BITESIZE = 'https://www.bbc.co.uk/bitesize/articles/z7wkjfr';
  const LUMEN = 'https://courses.lumenlearning.com/ivytech-sci111/chapter/resistance-and-resistivity';
  const LIBRE = 'https://phys.libretexts.org/Bookshelves/College_Physics/College_Physics_1e_%28OpenStax%29/21%3A_Circuits_Bioelectricity_and_DC_Instruments/21.01%3A_Resistors_in_Series_and_Parallel';

  const X0 = 46, L = 278, SX0 = 40, SX1 = 300;
  const FADE = 0.35, SLIDE = 0.9, ROWLAG = 0.06;

  // ---------- expressions (pure, so the checks can test them) ----------
  // Reads +, −, ×, ÷, brackets, a minus in front and letters side by side (6x, ab, IR₁, R₀αΔT).
  function evalExpr(s, vars) {
    const src = String(s).replace(/ /g, ' ').replace(/−/g, '-').replace(/×/g, '*').replace(/÷/g, '/').replace(/[ΩVA]/g, '').replace(/\s+/g, '');
    let i = 0;
    const peek = () => src[i];
    function expr() {
      let sign = 1;
      if (peek() === '-') { i++; sign = -1; } else if (peek() === '+') i++;
      let v = sign * term();
      while (peek() === '+' || peek() === '-') { const op = src[i++]; const t = term(); v = op === '+' ? v + t : v - t; }
      return v;
    }
    function term() {
      let v = factor();
      while (i < src.length && peek() !== '+' && peek() !== '-' && peek() !== ')') {
        if (peek() === '/') { i++; v /= factor(); continue; }
        if (peek() === '*') i++;
        v *= factor();
      }
      return v;
    }

    const names = labelSet([{ a0: 0, a1: MW, text: 'R₀ = 2.0 Ω' }, { a0: so, a1: so + SW, text: 'R₀αΔT = 0.4 Ω' }], yb + 25, yb + 8, false);
    part(vis(tl.main), 4, names[0]);
    part(vis(tl.strip), 4, names[1]);
    REC.res = { main: MW, strip: SW, joined: p >= 1 };
    return (vis(tl.main) >= 0.5 ? 'A block R nought tall, 2.0 ohms.' : '') +
      (vis(tl.strip) >= 0.5 ? (p >= 1 ? ' Against its end, a thin strip, R nought alpha delta T, 0.4 ohms.' : ' Apart from it, a thin strip as tall, R nought alpha delta T, 0.4 ohms.') : '') +
      (vis(tl.side) >= 0.5 ? ' Together they are R nought tall and 1 plus alpha delta T long.' : '');
  }
  // A line of working: the expression on the left, what it makes at the value tried on the right.
  function drawWork(r, m, G, v) {
    const y = G.workY + 20 + 30 * m, a = vis(r.t), bad = r.bad ? ' bad' : '', w = typeof r.w === 'function' ? r.w(v) : r.w;
    part(a, 6, () => { text(12, y, r.e, 'te' + bad, 'start'); text(328, y, w, 'tw' + bad, 'end'); });
    if (a >= 0.5) REC.work.push({ e: r.e, w, bad: !!r.bad, nd: !!r.nd });
    return a >= 0.5 ? (r.nd ? 'Inside, ' + say(r.e) + ': ' + say(w) + '.' : say(r.e) + ' makes ' + say(w) + (r.bad ? ', the slip.' : '.')) : '';
  }
  // The key, inside the drawing: a bar, a square and (where used) a dashed outline.
  function drawKey(d, G) {
    const y = G.keyY, A = d.area;
    let x = 12;
    const item = (sw, wd, label) => { sw(x); x += wd + 6; text(x, y + 5, label, 'key', 'start'); x += tw(label, 'key') + 18; };
    if (A.segs.some((g) => g.t === 'bar')) item((x0) => rect('xb', x0 + 0.75, y - 7, 24, 14, 3), 25, letterOf(d) + ' long');
    item((x0) => rect('sq', x0, y - 6, 12, 12, 2), 12, d.unit ? 'worth 1 ' + d.unit : 'worth 1');
    if (A.segs.some((g) => g.t === 'neg')) item((x0) => rect('neg', x0 + 1, y - 7, 24, 14, 3), 26, 'taken away');
  }
  // The slider for x: its track, a tick at each whole number, the knob and its value.
  const xPos = (s, v) => SX0 + (v - s.min) / (s.max - s.min) * (SX1 - SX0);
  function drawSlider(d, xv) {
    const s = d.slide, ty = 40;
    line('track', SX0, ty, SX1, ty);
    for (let v = s.min; v <= s.max; v++) line('tick', xPos(s, v), ty - 7, xPos(s, v), ty + 7);
    const kx = xPos(s, xv), lab = 'x = ' + Math.round(xv), w = tw(lab, 'xl');
    add(K.svg('circle', { class: 'knob', cx: r3(kx), cy: ty, r: 10 }));
    text(K.clamp(kx, 12 + w / 2, 328 - w / 2), 19, lab, 'xl');
  }
  // The whole picture for a step now; returns it in words.
  function drawScene(d, st, G) {
    const tl = timeline(d, st), xv = xNow(d, st), v = varsNow(d, xv);
    REC = { area: null, split: [], res: null, work: [] };
    const said = [];
    if (d.slide) { drawSlider(d, xv); said.push('A slider sets x, now ' + Math.round(xv) + '.'); }
    else if (d.tag) { const t = tagText(d); text(12, 21, t, 'tag', 'start'); said.push(say(t) + '.'); }
    if (d.pic === 'area') said.push(drawArea(d, tl, G, xv));
    if (d.pic === 'res') said.push(drawRes(d, tl, G));
    tl.work.forEach((r, m) => said.push(drawWork(r, m, G, v)));
    if (G.keyY != null) drawKey(d, G);
    placeGrip(d, xv);
    return said.filter(Boolean).join(' ');
  }

  // ---------- the slider: Dan sets x himself ----------
  const grip = ui.appendChild(K.svg('rect', { class: 'grip', x: 0, y: 0, width: 0, height: 0, tabindex: -1, role: 'slider', 'aria-label': 'x', 'aria-orientation': 'horizontal' }));
  grip.style.display = 'none';
  function placeGrip(d, xv) {
    const on = !!d.slide && !finished;
    grip.style.display = on ? '' : 'none';
    grip.setAttribute('tabindex', on ? '0' : '-1');
    if (!on) return;
    grip.setAttribute('x', SX0 - 24); grip.setAttribute('width', SX1 - SX0 + 48);
    grip.setAttribute('y', 14); grip.setAttribute('height', 48);
    const v = Math.round(xv);
    grip.setAttribute('aria-valuemin', d.slide.min); grip.setAttribute('aria-valuemax', d.slide.max); grip.setAttribute('aria-valuenow', v);
    grip.setAttribute('aria-valuetext', 'x = ' + v);
  }
  const sliding = () => !finished && !!STEPS[at()].slide;
  // Dan's x, a whole number on the track: it settles the demonstration and every bar takes it up.
  function setX(v) {
    const i = at(), d = STEPS[i], st = S[i];
    v = K.clamp(Math.round(v), d.slide.min, d.slide.max);
    if (st.x === v && T === Infinity) return;
    if (anim.playing()) anim.pause();
    T = Infinity;
    st.x = v;
    K.reveal(); K.refresh();
  }
  function xFrom(e) {
    const ctm = svg.getScreenCTM();
    if (!ctm) return null;
    const q = new DOMPoint(e.clientX, e.clientY).matrixTransform(ctm.inverse()), s = STEPS[at()].slide;
    return s.min + (q.x - SX0) / (SX1 - SX0) * (s.max - s.min);
  }
  let held = null;
  grip.addEventListener('pointerdown', (e) => {
    if (!sliding()) return;
    held = e.pointerId;
    try { grip.setPointerCapture(e.pointerId); } catch (err) { /* the drag still follows the pointer while it stays on the band */ }
    e.preventDefault();
    const v = xFrom(e);
    if (v != null) setX(v);
  });
  grip.addEventListener('pointermove', (e) => {
    if (held !== e.pointerId || !sliding()) return;
    const v = xFrom(e);
    if (v != null) setX(v);
  });
  const letGo = (e) => { if (held === e.pointerId) held = null; };
  grip.addEventListener('pointerup', letGo);
  grip.addEventListener('pointercancel', letGo);
  grip.addEventListener('lostpointercapture', () => { held = null; });
  grip.addEventListener('keydown', (e) => {
    if (!sliding()) return;
    const d = STEPS[at()], st = S[at()], now = Math.round(xNow(d, st));
    const by = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1 }[e.key];
    if (by == null && e.key !== 'Home' && e.key !== 'End') return;
    e.preventDefault();
    setX(e.key === 'Home' ? d.slide.min : e.key === 'End' ? d.slide.max : now + by);
  });

  // The scene for a step (the animation calls this every frame).
  function paint(i) {
    if (i == null) i = at();
    const d = STEPS[i], st = S[i], G = geo(d);
    art.textContent = '';
    into = null;
    svg.setAttribute('viewBox', '0 0 340 ' + G.H);
    svg.setAttribute('aria-label', drawScene(d, st, G));
  }

  const el = (id) => document.getElementById(id);
  write(el('finish'), FINISH);
  K.update((p) => {
    const i = Math.round(p.step), d = STEPS[i], st = S[i];
    if (!anim.playing()) T = Infinity;   // motion that was stopped (the page hidden, a test) shows finished
    if (i !== lastStep) {
      lastStep = i; enter('stepbox');
      if (d.show) { st.x = null; play(d.dur); } else { anim.pause(); T = Infinity; }
    }
    if (finished !== lastDone) { lastDone = finished; enter(finished ? 'done' : 'stepbox'); }
    const right = st.res === 'right';
    el('stepbox').hidden = finished;
    el('done').hidden = !finished;
    el('count').textContent = 'Step ' + (i + 1) + ' of ' + STEPS.length;
    const task = el('task');
    task.className = 'task' + (d.show ? ' show' : '');
    write(task, d.show ? d.text : d.task);
    paint(i);

    replayBtn.el.hidden = !d.show || REDUCE;
    el('replay').hidden = replayBtn.el.hidden;
    const opts = d.show ? [] : d.opts || [];
    el('picks').hidden = !opts.length;
    el('picks').classList.toggle('long', opts.some((o) => o.length > 6));
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      b.setLabel(opts[k]);
      b.el.textContent = '';
      italics(b.el.appendChild(K.el('span')), opts[k], false);   // one span, so the button's gap does not split "4(x + 5)"
      b.el.setAttribute('aria-label', say(opts[k]));
      b.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });

    el('acts').hidden = !!d.show;
    checkBtn.el.hidden = right;
    const fb = el('fb');
    fb.hidden = !!d.show;
    fb.className = 'fb' + (right ? ' right' : st.res === 'wrong' ? ' wrong' : '');
    write(fb, d.show ? '' : right ? 'That\'s it.' : st.res === 'wrong' ? hintFor(i, st) : st.res === 'empty' ? PICK : '');

    const why = el('why');
    why.hidden = d.show || !st.why;
    write(why, d.show ? '' : d.why);
    whyBtn.setLabel(st.why ? 'Hide why' : 'Why?');

    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !right);
    nextBtn.setLabel(i === STEPS.length - 1 ? 'Finish' : 'Continue');
    nav.hidden = backBtn.el.hidden && nextBtn.el.hidden;
  });

  // ---------- known answers, worked out by hand ----------
  const DO = STEPS.map((d, i) => i).filter((i) => !STEPS[i].show);
  const pickRight = (i, v) => isRight(i, Object.assign(blank(), { pick: v }));
  const solvedSt = (i) => Object.assign(blank(), { pick: STEPS[i].want, res: 'right' });
  const wrongSt = (i, o) => Object.assign(blank(), { pick: o, res: 'wrong' });
  const close = (a, b) => Math.abs(a - b) < 1e-9 * Math.max(1, Math.abs(a), Math.abs(b));
  const idx = (name) => STEPS.findIndex((d) => d.name === name);
  // Values tried for every letter: whole numbers, a half and a negative, each letter its own.
  const TRY = [1, 2, 3, 4, 7, 10, 0.5, -4];
  const ENVS = TRY.map((v, n) => ({ x: v, a: TRY[(n + 1) % 8], b: TRY[(n + 3) % 8], I: v, 'R₀': TRY[(n + 2) % 8], 'R₁': TRY[(n + 5) % 8], 'R₂': TRY[(n + 6) % 8], 'R₃': TRY[(n + 3) % 8], 'α': TRY[(n + 4) % 8], 'ΔT': TRY[(n + 7) % 8] }));
  const same = (p, q) => ENVS.every((e) => close(evalExpr(p, e), evalExpr(q, e)));
  const endOf = (w) => evalExpr(String(w).split('=').pop(), {});
  // Every line of working a step can show, with the values it was tried at.
  function works(i) {
    const d = STEPS[i], out = [];
    if (d.show) {
      const vs = d.slide ? Array.from({ length: d.slide.max - d.slide.min + 1 }, (z, n) => ({ x: d.slide.min + n })) : [d.vars];
      vs.forEach((v) => d.work.forEach((r) => out.push({ e: r.e, w: typeof r.w === 'function' ? r.w(v) : r.w, v })));
    } else {
      out.push({ e: d.q, w: d.qw, v: d.vars });
      d.opts.forEach((o) => out.push({ e: o, w: d.ow[o], v: d.vars }));
    }
    return out;
  }
  const workAddsUp = (r) => { const ps = r.w.split('='), end = evalExpr(ps[ps.length - 1], {}); return close(evalExpr(r.e, r.v), end) && ps.slice(0, -1).every((p) => close(evalExpr(p, {}), end)); };
  // A step painted in the state given (finished, or at t seconds into its motion): what it draws.
  function drawn(i, st, t) {
    const keepS = S[i], keepT = T;
    S[i] = st; T = t == null ? Infinity : t;
    try {
      paint(i);
      const rec = REC;
      return { texts: Array.from(art.querySelectorAll('text')).map((n) => n.textContent.replace(/ /g, ' ')), area: rec.area, split: rec.split, res: rec.res, work: rec.work };
    } finally { S[i] = keepS; T = keepT; paint(); }
  }
  const innerShares = (s, ls) => { const f = coefs(s, ls); return [f.k].concat(f.c).reduce(gcd, 0); };

  K.check('Factorising is the reverse process to expanding brackets: on every screen the bracket expands back to the expression it started from, making the same value at every number tried, whole, a half or negative', () =>
    STEPS.every((d) => { const p = d.show ? d.pair : [d.q, d.want]; return same(p[0], p[1]); }), { source: NCETM });
  K.check('The greatest common factor is the largest that divides evenly into all the terms: every answer takes out the largest whole number dividing every term, so what is left inside shares nothing more (12x and 18 share 2, 3 and 6, the biggest 6)', () =>
    STEPS.filter((d) => d.num).every((d) => { const p = d.show ? d.pair : [d.q, d.want]; return fullForm(p[0], Object.keys(d.vars)) === p[1]; }) &&
    [2, 3, 6].every((f) => 12 % f === 0 && 18 % f === 0) && gcd(12, 18) === 6 && innerShares('6x + 9', ['x']) === 3, { source: GCF });
  K.check('The factor outside of the parentheses is multiplied by each term inside: each puzzle accepts only the answer that multiplies back to the start, and every wrong answer offered either makes a different value at the number tried or, true but not finished, still has a factor shared inside its bracket', () =>
    DO.every((i) => {
      const d = STEPS[i];
      return d.opts.indexOf(d.want) >= 0 && d.opts.every((o) => pickRight(i, o) === (o === d.want)) && d.opts.every((o) => {
        if (o === d.want) return same(o, d.q);
        const nd = d.nd && d.nd[o];
        if (nd) { const m = /^(\d+)\((.*)\)$/.exec(o); return !!m && m[2] === nd[0] && same(o, d.q) && innerShares(nd[0], Object.keys(d.vars)) > 1; }
        return !close(evalExpr(o, d.vars), evalExpr(d.q, d.vars));
      });
    }) && same('4(x + 20)', '4x + 80') && same('3(2x − 5)', '6x − 15') && !same('3(2x + 5)', '6x − 15'), { source: OPENSTAX });
  K.check('Expanding brackets does not change the value of an expression, as it is two ways of writing the same one: on the first screen 6x + 15 and 3(2x + 5) both make 27 at x = 2, and the same as each other wherever x is slid from 1 to 6, the rectangle staying 3 rows of 2x + 5', () => {
    const i = idx('Two parts, one rectangle'), G = geo(STEPS[i]), g0 = drawn(i, blank());
    return g0.work.length === 2 && close(endOf(g0.work[0].w), 27) && close(endOf(g0.work[1].w), 27) && [1, 2, 3, 4, 5, 6].every((x) => {
      const h = drawn(i, Object.assign(blank(), { x }));
      return h.work.length === 2 && h.area.placed && h.area.bars === 6 && h.area.sqs === 15 && close(h.area.len, (2 * x + 5) * G.U) &&
        close(endOf(h.work[0].w), 3 * (2 * x + 5)) && close(endOf(h.work[1].w), 3 * (2 * x + 5));
    });
  }, { source: BITESIZE });
  K.check('R = R₀(1 + αΔT) gives the resistance R after a temperature change ΔT, where R₀ is the original resistance: R₀ + R₀αΔT factorises back to it, and for the example winding of 2.0 Ω cold and 2.4 Ω after a run, 2.0 + 0.4 = 2.0 × 1.2, drawn as a block R₀ tall, R₀ × 1, and the strip R₀αΔT', () => {
    const i = idx('Keep the 1'), v = STEPS[i].vars, g = drawn(i, blank());
    return same('R₀ + R₀αΔT', 'R₀(1 + αΔT)') && close(v['R₀'], 2) && close(evalExpr('R₀(1 + αΔT)', v), 2.4) && close(evalExpr('1 + αΔT', v), 1.2) &&
      close(evalExpr('R₀αΔT', v), 0.4) && ['R₀ = 2.0 Ω', 'R₀αΔT = 0.4 Ω', 'R₀ × 1', '1', 'αΔT', 'R₀'].every((s) => g.texts.indexOf(s) >= 0) && g.res.joined && close(g.res.strip / g.res.main, 0.2);
  }, { source: LUMEN });
  K.check('V = IR₁ + IR₂ + IR₃ = I(R₁ + R₂ + R₃): with the example 2 A through 3, 5 and 2 Ω the three parts make 6 + 10 + 4 = 20 V and I(R₁ + R₂ + R₃) makes 2 × 10 = 20 V, drawn as I rows of R₁ + R₂ + R₃ squares, each worth 1 V', () => {
    const i = idx('Three resistors'), d = STEPS[i], v = d.vars, A = d.area, g = drawn(i, blank());
    return same('IR₁ + IR₂ + IR₃', 'I(R₁ + R₂ + R₃)') && close(evalExpr(d.pair[0], v), 20) && close(evalExpr(d.pair[1], v), 20) && d.unit === 'V' &&
      A.k === v.I && A.segs.map((s) => s.n).join() === [v['R₁'], v['R₂'], v['R₃']].join() && g.area.placed && g.area.sqs === 20 && g.split.length === 2;
  }, { source: LIBRE });
  K.check('Every worked number is right (27 at x = 2; 28, 88 and 30; 30 at x = 1; 20, 20 and 56; 2.4 Ω and 1.2; 20, 15 and 40 at x = 3; 20 V; 24, 60 and 12; 9, 9 and 39 at x = 4; 7, 49 and −119; 8, 6 and 10; 20, 20 and 44), and every line of working on every screen adds up', () => {
    const listed = [['6x + 15', { x: 2 }, 27], ['3(2x + 5)', { x: 2 }, 27], ['4x + 20', { x: 2 }, 28], ['4(x + 20)', { x: 2 }, 88], ['5(x + 4)', { x: 2 }, 30],
      ['12x + 18', { x: 1 }, 30], ['6(2x + 3)', { x: 1 }, 30], ['8x + 12', { x: 1 }, 20], ['2(4x + 6)', { x: 1 }, 20], ['4(2x + 12)', { x: 1 }, 56],
      ['5x + 5', { x: 3 }, 20], ['5x', { x: 3 }, 15], ['5(x + 5)', { x: 3 }, 40], ['4a + 4b + 12', { a: 1, b: 2 }, 24], ['4(a + b + 12)', { a: 1, b: 2 }, 60], ['4(a + b)', { a: 1, b: 2 }, 12],
      ['6x − 15', { x: 4 }, 9], ['3(2x − 5)', { x: 4 }, 9], ['3(2x + 5)', { x: 4 }, 39], ['14x − 21', { x: 2 }, 7], ['7(2x + 3)', { x: 2 }, 49], ['7(2x − 21)', { x: 2 }, -119],
      ['ab + a', { a: 2, b: 3 }, 8], ['ab', { a: 2, b: 3 }, 6], ['a(b + a)', { a: 2, b: 3 }, 10], ['12x + 8', { x: 1 }, 20], ['2(6x + 4)', { x: 1 }, 20], ['4(3x + 8)', { x: 1 }, 44]];
    return listed.every((r) => close(evalExpr(r[0], r[1]), r[2])) && STEPS.every((d, i) => works(i).every(workAddsUp));
  });
  K.check('Every rectangle is drawn to count: once fitted it holds the factor\'s rows of bars and squares, each bar x long and each square 1, filling exactly the height and length its sides name, with a split line where each part ends; before a puzzle is answered the same pieces lie loose inside the drawing', () =>
    STEPS.every((d, i) => {
      if (d.pic !== 'area') return true;
      const A = d.area, G = geo(d), Sp = spans(d, xNow(d, blank()), G), g = drawn(i, d.show ? blank() : solvedSt(i)), r = g.area;
      const per = (t) => A.segs.filter((s) => s.t === t).reduce((n, s) => n + s.n, 0);
      const ok = r.placed && r.bars === A.k * per('bar') && r.sqs === A.k * per('sq') && r.cuts === A.k * per('neg') &&
        close(r.right, X0 + Sp.all[1]) && close(r.bottom, G.rectY + A.k * G.U) &&
        g.split.length === d.splits.length && d.splits.every((key, m) => close(g.split[m], X0 + Sp[key][1]));
      if (d.show) return ok;
      const h = drawn(i, blank()).area;
      return ok && !h.placed && h.right <= X0 + L + 0.5 && h.bars === r.bars && h.sqs === r.sqs;
    }));
  K.check('Before an answer, nothing in a puzzle\'s picture shows the answer: the parts lie loose, with no height, no bracket, no split line and no answer row', () =>
    DO.every((i) => {
      const d = STEPS[i], g = drawn(i, blank());
      return g.texts.indexOf(d.want) < 0 && g.split.length === 0 && g.work.every((r) => r.e === d.q) &&
        (!g.area || (!g.area.placed && (d.top || []).every((t) => g.texts.indexOf(t[1]) < 0)));
    }));
  K.check('Trying the number: a right answer makes the same value as the question; a wrong one shows in red making a different value, or, true but not finished, shows in red what its bracket still shares', () =>
    DO.every((i) => {
      const d = STEPS[i], g = drawn(i, solvedSt(i)), q = g.work[0], a = g.work[g.work.length - 1];
      if (!(g.work.length === 2 && q.e === d.q && a.e === d.want && !a.bad && close(endOf(a.w), endOf(q.w)))) return false;
      if (d.pic === 'area' && !g.area.placed) return false;
      return d.opts.filter((o) => o !== d.want).every((o) => {
        const h = drawn(i, wrongSt(i, o)), nd = d.nd && d.nd[o];
        if (nd) return h.work.length === 3 && h.work[1].e === o && !h.work[1].bad && close(endOf(h.work[1].w), endOf(h.work[0].w)) && h.work[2].bad && h.work[2].nd && h.work[2].e === nd[0];
        const b = h.work[h.work.length - 1];
        return h.work.length === 2 && b.e === o && b.bad && !close(endOf(b.w), endOf(h.work[0].w));
      });
    }));
  K.check('Every demonstration has finished arriving within 4.5 s of its screen opening, none starting before the 0.35 s screen fade ends; every answer\'s motion, right or wrong, within 2.5 s', () => {
    const keepT = T;
    const timed = (i, st, limit) => {
      const keepS = S[i];
      T = Infinity; latest = 0; earliest = Infinity;
      S[i] = st;
      try { paint(i); } finally { S[i] = keepS; }
      return latest <= limit + 1e-9;
    };
    const ok = STEPS.every((d, i) => {
      if (d.show) { const r = timed(i, blank(), d.dur); return r && d.dur <= 4.5 && d.dur >= 3 && earliest >= FADE; }
      const f = fbOf(d);
      return timed(i, solvedSt(i), f[0]) && f[0] <= 2.5 && d.opts.filter((o) => o !== d.want).every((o) => timed(i, wrongSt(i, o), f[1]) && f[1] <= 2.5);
    });
    T = keepT; paint();
    return ok;
  });

  K.ready();
</script>
