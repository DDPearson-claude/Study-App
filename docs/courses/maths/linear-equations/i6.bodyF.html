<p class="lead">A sheet with a bar for each part of a job, and flow diagrams for its equation and for formulas with a bracket. Every length, hour, price and resistance is an example.</p>

<div class="pz" id="pz">

<p class="caption">Copper's α, 0.0039 per °C, and the rule's limit of about 100 °C are from Lumen Learning's Science 111.</p>

  // ---------- the pictures ----------

  // The formula and the key that gives each letter its value.

  // The step between boxes k and k + 1: an arrow (rightwards on the top row, leftwards when undoing)

  function stepAt(k, y, label, back, G, whole) {

  // A flow diagram: what is done to the unknown, in order, then undone from the right.

    const W = STEPS.filter((d) => d.flow && d.flow.whole);
    return W.length === 3 && W.every((d) => {
      const f = d.flow, V = varsOf(d), part1 = Object.keys(d.slips).filter((o) => /÷ 0\./.test(d.slips[o]));
      return f.ao.length === 1 && /^× \(1 \+ .+\)$/.test(f.ao[0]) && f.bo[0] === '÷ ' + d.B && near(apply(f.ao[0], 1, V), num(d.B)) &&
        near(num(d.R) / num(d.B), valOf(f.b[0])) && part1.length === 1 && !near(putRow(d, numText(part1[0])).l, num(d.R));
    });
  }, { source: NCETM });
  K.check('Each flow diagram is drawn to its rule: every step on the top row turns one box into the next, every undo step turns each box back, both rows hold the same values at the answer, and all of it is on the picture', () =>
    STEPS.every((d, i) => {
      if (!d.flow) return true;
      const f = d.flow, V = varsOf(d), n = f.a.length;
      for (let k = 0; k < n - 1; k++) if (!near(apply(f.ao[k], ev(f.a[k], V), V), ev(f.a[k + 1], V))) return false;
      if (!f.b) return true;
      const tol = (s) => (/≈/.test(s) ? 0.5 : 1e-9);
      for (let k = 0; k < n - 1; k++) if (!near(apply(f.bo[k], valOf(f.b[k + 1]), V), valOf(f.b[k]), tol(f.b[k]))) return false;
      for (let k = 0; k < n; k++) if (!near(valOf(f.b[k]), ev(f.a[k], V), tol(f.b[k]))) return false;
      const g = drawn(i, d.show ? blank() : solvedSt(i)).texts;
      return f.a.concat(f.ao, f.b, f.bo).every((s) => g.indexOf(s) >= 0);
    }));
  K.check('Each wrong answer offered is the one its slip gives: a once-per-part figure counted once, the bracket only half undone, the 1 taken off before dividing by R₀, R₀ taken away instead, multiplying by the bracket, or dividing by part of it', () =>
    DO.every((i) => {
      const d = STEPS[i], wrong = d.opts.filter((o) => o !== d.want);
      return d.opts.indexOf(d.want) >= 0 && wrong.length === Object.keys(d.slips).length && wrong.every((o) => {
        const dp = (numText(o).split('.')[1] || '').length, v = ev(d.slips[o], {});
        return near(Math.round(v * Math.pow(10, dp)) / Math.pow(10, dp), num(o));
      }) && (!d.putOf || d.opts.every((o) => Math.round(num(d.putOf[o]) / ALPHA) === num(o)));
    }));
  K.check('Before an answer, nothing in a puzzle\'s picture shows the answer', () =>
    DO.every((i) => { const d = STEPS[i], g = drawn(i, blank()); return g.texts.indexOf(d.flow.b[0]) < 0 && g.texts.indexOf(numText(d.want)) < 0 && g.rec.rows.length === 0; }));
  K.check('Translate the problem into an equation: on the cable drum screen the equation is picked before it is shown, the right pick is how many parts times one part, and each wrong one, solved, gives a length that does not fit the job', () => {
    const i = idx('A cable drum'), d = STEPS[i], f = d.form, e = sides(d.eq), g = drawn(i, blank()).texts;
    const solve = (q) => { const s = sides(q), a = ev(s[0], { x: 0 }), b = ev(s[0], { x: 1 }); return (ev(s[1], {}) - a) / (b - a); };
    return f.want === d.eq && f.opts.length === 3 && g.every((t) => f.opts.indexOf(t) < 0) && near(solve(f.want), valOf(d.flow.b[0])) &&
      f.opts.filter((o) => o !== f.want).every((o) => !near(ev(e[0], { x: solve(o) }), ev(e[1], {}))) &&
      drawn(i, formedSt()).texts.indexOf(d.eq) >= 0;
  }, { source: SENTENCE });
  K.check('ΔT made the subject, ΔT = (R ÷ R₀ − 1) ÷ α, is drawn under the undo row, gives back each warming worked out from the rule, and is in the next puzzle\'s Why?', () => {
    const d = STEPS[idx('Undo for ΔT')], p = STEPS[idx('Your turn')], e = sides(d.rule);
    return [d, p].every((q) => { const V = varsOf(q); return near(ev(e[1], V), V['ΔT'], 1e-6); }) &&
      drawn(idx('Undo for ΔT'), blank()).texts.indexOf(d.rule) >= 0 && p.why.indexOf(d.rule) >= 0;
  }, { source: LUMEN });
  // Drawn from the lesson's own timetable: each screen is painted finished and every arrival it used is noted.
  K.check('Every demonstration has finished arriving within 4.5 s of its screen opening, none starting before the 0.35 s screen fade ends; every answer\'s motion, right or wrong, within 2.5 s', () => {
    const keepT = T;
    const timed = (i, st) => { const keepS = S[i]; T = Infinity; latest = 0; earliest = Infinity; S[i] = st; try { paint(i); } finally { S[i] = keepS; } return latest; };
    const ok = STEPS.every((d, i) => {
      if (d.show) { const L = timed(i, blank()); return L <= d.dur + 1e-9 && d.dur <= 4.5 && d.dur >= 3 && earliest >= FADE; }
      return timed(i, solvedSt(i)) <= 2.5 && (!d.form || timed(i, formedSt()) <= 2.5) && d.opts.filter((o) => o !== d.want).every((o) => timed(i, wrongSt(i, o)) <= 2.5);
    });
    T = keepT; paint();
    return ok;
  });

  K.ready();
</script>
