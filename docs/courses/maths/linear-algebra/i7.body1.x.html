<p class="caption">Tank flows and k/m are example values. Every dot, line and number comes from the card’s matrix.</p>

<script>
  // ---------- numbers and words (pure, so the checks can test them) ----------
  const MINUS = '−', NB = ' ';
  function num(v, dp) { const f = Math.pow(10, dp == null ? 2 : dp); let r = Math.round(v * f) / f; if (Math.abs(r) < 1e-9) r = 0; return (r < 0 ? MINUS : '') + String(Math.abs(r)); }
  function fixed(v, dp) { const f = Math.pow(10, dp); let r = Math.round(v * f) / f; if (Math.abs(r) < 0.5 / f) r = 0; return (r < 0 ? MINUS : '') + Math.abs(r).toFixed(dp); }
  const pt = (v, dp) => '(' + v.map((x) => num(x, dp)).join(', ') + ')';
  const say = (s) => String(s).replace(/ /g, ' ').replace(/×/g, ' times ').replace(/−/g, ' minus ').replace(/=/g, ' equals ').replace(/≈/g, ' about ').replace(/\s+/g, ' ').trim();
  // One term of a rate: "0.2x₁", or " − 0.2x₂" after the first.
  function term(c, v, first) { const a = num(Math.abs(c)) + v; return first ? (c < 0 ? MINUS : '') + a : (c < 0 ? ' − ' : ' + ') + a; }
  const rateStr = (r) => term(r[0], 'x₁', true) + term(r[1], 'x₂', false);

  // ---------- vectors and matrices ----------
  const add = (a, b) => a.map((x, k) => x + b[k]);
  const sub = (a, b) => a.map((x, k) => x - b[k]);
  const scl = (a, s) => a.map((x) => x * s);
  const dot = (a, b) => a.reduce((s, x, k) => s + x * b[k], 0);
  const len = (a) => Math.sqrt(dot(a, a));
  const unit = (a) => scl(a, 1 / (len(a) || 1));
  const cross2 = (a, b) => a[0] * b[1] - a[1] * b[0];
  const near = (a, b, t) => Math.abs(a - b) < (t || 1e-9);
  const same = (a, b, t) => !!a && !!b && a.length === b.length && a.every((x, k) => near(x, b[k], t || 1e-7));
  const sameR = (a, b) => !!a && !!b && a.length === b.length && a.every((x, k) => Math.abs(x - b[k]) <= 1e-9 * (1 + Math.abs(b[k])));
  const sameM = (P, Q) => P.length === Q.length && P.every((r, i) => same(r, Q[i]));
  const lerpV = (a, b, e) => (e >= 1 ? b.slice() : e <= 0 ? a.slice() : a.map((x, k) => x + (b[k] - x) * e));
  const mul = (M, x) => M.map((r) => dot(r, x));
  const det2 = (M) => M[0][0] * M[1][1] - M[0][1] * M[1][0];
  const inv2 = (M) => { const d = det2(M); return [[M[1][1] / d, -M[0][1] / d], [-M[1][0] / d, M[0][0] / d]]; };
  const fromCols = (a, b) => [[a[0], b[0]], [a[1], b[1]]];
  const minusI = (M, l) => M.map((r, i) => r.map((x, j) => (i === j ? x - l : x)));
  const sameLine = (a, b) => len(a) > 1e-9 && len(b) > 1e-9 && Math.abs(cross2(unit(a), unit(b))) < 1e-7;
  function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { const t = a % b; a = b; b = t; } return a; }
  // A direction in whole numbers where it can be, its first part that is not 0 made positive.
  function tidy(v) {
    const k = v.findIndex((x) => Math.abs(x) > 1e-9);
    if (k < 0) return v.map(() => 0);
    let w = v[k] < 0 ? scl(v, -1) : v.slice();
    const m = Math.min(...w.filter((x) => Math.abs(x) > 1e-9).map(Math.abs));
    w = scl(w, 1 / m);
    for (let q = 1; q <= 12; q++) {
      const u = scl(w, q);
      if (u.every((x) => Math.abs(x - Math.round(x)) < 1e-7)) { const r = u.map(Math.round), g = r.reduce((s, x) => gcd(s, x), 0) || 1; return r.map((x) => x / g + 0); }
    }
    return unit(w);
  }
  // The direction a 2 by 2 crushes, from its bigger row (p, q): p v1 + q v2 = 0 along (−q, p).
  function crushed(N) {
    const n0 = Math.hypot(N[0][0], N[0][1]), n1 = Math.hypot(N[1][0], N[1][1]);
    if (n0 < 1e-9 && n1 < 1e-9) return null;
    const row = n0 >= n1 ? N[0] : N[1];
    return tidy([-row[1], row[0]]);
  }
  // Every real eigenvalue and its line: the roots of λ² − (a + d)λ + (ad − bc) = 0, then (A − λI)v = 0.
  function eig2(M) {
    const a = M[0][0], b = M[0][1], c = M[1][0], d = M[1][1], tr = a + d, dt = a * d - b * c, disc = tr * tr - 4 * dt;
    const res = { tr, dt, disc, roots: [], lines: [] };
    if (disc < -1e-12) return res;
    const sq = Math.sqrt(Math.max(0, disc));
    res.roots = [(tr + sq) / 2, (tr - sq) / 2];
    (sq < 1e-9 ? [tr / 2] : res.roots).forEach((r) => {
      const dir = crushed(minusI(M, r));
      if (dir) res.lines.push({ dir, lam: Math.round(r * 1e9) / 1e9 });
    });
    return res;
  }
  // Any arrow w: on its own line when Aw is a number times w; then λ is that number.
  function lamOf(M, w) {
    const av = mul(M, w);
    if (Math.abs(cross2(w, av)) > 1e-7 * (1 + len(av))) return null;
    return Math.round(dot(av, w) / dot(w, w) * 1e9) / 1e9;
  }
  // Where a line through p along d crosses a box: its range of t, or null.
  function clipLine(p, d, bx) {
    let t0 = -Infinity, t1 = Infinity;
    for (let k = 0; k < p.length; k++) {
      if (Math.abs(d[k]) < 1e-12) { if (p[k] < bx[k][0] - 1e-9 || p[k] > bx[k][1] + 1e-9) return null; continue; }
      let a = (bx[k][0] - p[k]) / d[k], b = (bx[k][1] - p[k]) / d[k];
      if (a > b) { const s = a; a = b; b = s; }
      t0 = Math.max(t0, a); t1 = Math.min(t1, b);
    }
    return t1 >= t0 - 1e-9 ? [t0, Math.max(t0, t1)] : null;
  }
  const inBox = (q, bx) => q[0] >= bx[0][0] - 1e-9 && q[0] <= bx[0][1] + 1e-9 && q[1] >= bx[1][0] - 1e-9 && q[1] <= bx[1][1] + 1e-9;

  // ---------- the three systems ----------
  // Open tanks: 100 L each. Fresh water into tank 1, a pump from 1 to 2, some back, the rest down tank 2's drain.
  const V = 100, FRESH = 15, PUMP = 20, BACK = 5, DRAIN = PUMP - BACK;   // tank 2: 20 L/min in, 5 back, so 15 drains
  // Each flow carries salt at its tank's strength, grams ÷ 100 L: what leaves is minus, what arrives is plus.
  const A_OPEN = [[-PUMP / V, BACK / V], [PUMP / V, -(BACK + DRAIN) / V]];
  // Closed tanks: inlet and drain shut, the pumps move 20 L/min each way.
  const CPUMP = 20;
  const A_SHUT = [[-CPUMP / V, CPUMP / V], [CPUMP / V, -CPUMP / V]];
  // Two equal masses between three equal springs: mass 1 feels −kx₁ + k(x₂ − x₁), mass 2 the mirror image.
  const KM = 100, KS = [1, 1, 1];
  const BMAT = [[KS[0] + KS[1], -KS[1]], [-KS[1], KS[1] + KS[2]]];
  // A system: its matrix, its eigenvectors as the lesson writes them, their eigenvalues (worked out), the drag square,
  // and the box the plane shows: the square's corners, their two parts, and the origin.
  function mkSys(o) {
    o.P = fromCols(o.E[0], o.E[1]); o.PI = inv2(o.P);
    o.lam = o.E.map((e) => lamOf(o.M, e));
    if (o.kind === 'mass') o.om = o.lam.map((l) => Math.sqrt(KM * l));
    const pts = [[0, 0]];
    [[0, 0], [0, 1], [1, 0], [1, 1]].forEach(([i, j]) => {
      const c = [o.range[0][i], o.range[1][j]], am = mul(o.PI, c);
      pts.push(c, scl(o.E[0], am[0]), scl(o.E[1], am[1]));
    });
    const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]), m = o.margin;
    o.box = [[Math.min(...xs) - m, Math.max(...xs) + m], [Math.min(...ys) - m, Math.max(...ys) + m]];
    return o;
  }
  const SYS = {
    open: mkSys({ key: 'open', name: 'Open tanks', kind: 'tank', M: A_OPEN, E: [[1, 2], [1, -2]], range: [[0, 40], [0, 40]], start: [30, 0], ux: 'g', ut: 'min', pace: 2, tMax: 30, grid: 10, snap: 1, margin: 3 }),
    shut: mkSys({ key: 'shut', name: 'Closed tanks', kind: 'tank', M: A_SHUT, E: [[1, 1], [1, -1]], range: [[0, 40], [0, 40]], start: [30, 0], ux: 'g', ut: 'min', pace: 2, tMax: 30, grid: 10, snap: 1, margin: 3 }),
    mass: mkSys({ key: 'mass', name: 'Two masses', kind: 'mass', M: BMAT, E: [[1, 1], [-1, 1]], range: [[-3, 3], [-3, 3]], start: [0, 2], ux: 'cm', ut: 's', pace: 0.1, tMax: 2, grid: 1, snap: 0.1, margin: 0.35 }),
  };
  const OPEN = SYS.open, SHUT = SYS.shut, MASS = SYS.mass;
  const SYSKEY = {};
  Object.keys(SYS).forEach((k) => { SYSKEY[SYS[k].name] = k; });

  // The rule: split the start along the eigenvectors; each amount changes on its own, by e^(λt) for the tanks and
  // cos(ωt) for the masses let go from rest; the dot is the parts added back.
  function posAt(sys, x0, t) {
    const c = mul(sys.PI, x0);
    const f = sys.kind === 'mass' ? sys.om.map((w) => Math.cos(w * t)) : sys.lam.map((l) => Math.exp(l * t));
    return add(scl(sys.E[0], c[0] * f[0]), scl(sys.E[1], c[1] * f[1]));
  }
  // The two parts of any point: its amount of each eigenvector, times that eigenvector.
  function partsAt(sys, x) { const am = mul(sys.PI, x); return [scl(sys.E[0], am[0]), scl(sys.E[1], am[1])]; }

  // ---------- the lesson's values ----------
  const START = OPEN.start, ON_LINE = [10, 20], T5 = 5, T6 = 10;
  // Tank 2 is fullest when its two parts' rates cancel: e^((λ₁ − λ₂)t) = λ₂ / λ₁.
  const TSTAR = Math.log(OPEN.lam[1] / OPEN.lam[0]) / (OPEN.lam[0] - OPEN.lam[1]);
  const AM0 = mul(OPEN.PI, START);                      // 15 lots of each
  const B10 = AM0[1] * Math.exp(OPEN.lam[1] * T6);      // b after 10 minutes
  const PER = MASS.om.map((w) => 2 * Math.PI / w);      // one full swing of each mode, in seconds
  const M9 = [scl(MASS.E[0], 2), scl(MASS.E[1], 2)];    // (2, 2) and (−2, 2)
  const S12 = [3, 1], AM12 = mul(MASS.PI, S12);
  const SHUTAM = mul(SHUT.PI, SHUT.start), SHUTEND = scl(SHUT.E[0], SHUTAM[0]);
  const RATE_MIN = 5;                                   // the rate arrow shows 5 minutes' worth
  const SRC = ['https://www.karlin.mff.cuni.cz/~slavik/papers/mixing-problems.pdf', 'https://www.sfu.ca/phys/255/063/lec/P255OutlineL15.pdf',
    'https://ocw.mit.edu/courses/8-03sc-physics-iii-vibrations-and-waves-fall-2016/eaf7cfc65a8415677214ecea99c10457_MIT8_03SCF16_Text_Ch3.pdf'];

  // ---------- the puzzles' answers, worked out from the rule ----------
  const O2 = [rateStr([A_OPEN[0][0], -A_OPEN[0][1]]), rateStr(scl(A_OPEN[0], -1)), rateStr(A_OPEN[0])];
  const O4 = ['Straight along the line to the origin', 'Curving off the line', 'Round onto the ' + pt(OPEN.E[1]) + ' line'];
  const O6 = ['About ' + num(AM0[1] * Math.exp(OPEN.lam[0] * T6), 1), 'About ' + num(B10, 2), '0'];
  const O8 = ['The x₁ axis', 'The ' + pt(OPEN.E[1]) + ' line', 'The ' + pt(OPEN.E[0]) + ' line'];
  const O10 = ['About ' + num(MASS.om[1], 1) + ' rad/s', num(KM * MASS.lam[1]) + ' rad/s', num(3 * MASS.om[0]) + ' rad/s'];
  const modeMix = (a, b) => num(a) + ' of ' + pt(MASS.E[0]) + ' and ' + num(b) + ' of ' + pt(MASS.E[1]);
  const O12 = [modeMix(S12[0], S12[1]), modeMix(AM12[0], AM12[1]), modeMix(AM12[0], Math.abs(AM12[1]))];
  const O13 = [pt([0, 0]), pt(SHUT.start), pt(SHUTEND)];
  const combo = (a, b) => num(a) + pt(MASS.E[0]) + (b < 0 ? ' − ' : ' + ') + num(Math.abs(b)) + pt(MASS.E[1]);
  const comboAt = (a, b) => add(scl(MASS.E[0], a), scl(MASS.E[1], b));

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // sys: the system drawn; plane: the state plane beside it; faint: the two parts ('always', or 'after' a right answer);
  // drag: the start dot can be dragged; sysPick: the System choice shows; runs: each run's start, its end time in the
  // demonstration (tEnd) and on Go (goEnd), and how long the demonstration or the answer's motion takes it (dur, s).
  const STEPS = [
    { show: true, key: 'tanks1', name: 'Two linked tanks', sys: 'open', plane: false, faint: false, lead: 1.2,
      runs: [{ x0: START, tEnd: TSTAR, goEnd: OPEN.tMax, dur: TSTAR / OPEN.pace }],
      act: 'Tap Go to run it at 2 minutes a second, up to 30 minutes.',
      text: 'Two 100 L tanks of brine are joined by pipes. x₁ and x₂ are the grams of salt in tanks 1 and 2, starting at 30 g and none. Each flow carries salt at its tank’s strength, the grams divided by 100 L. So each tank’s rate depends on the salt in both. The two are linked. Tank 2 gains `0.2x₁` grams a minute from the 20 L/min that arrives. It loses `0.2x₂` with the 20 L/min that leaves. So `x₂′ = 0.2x₁ − 0.2x₂`. Tank 2’s salt rises, then falls.' },
    { key: 'rate1', name: 'Tank 1’s rate', sys: 'open', plane: false, faint: false, rows: 3, fb: [1.3, 0.6],
      runs: [{ x0: START, tEnd: 0, goEnd: 0, dur: 0 }],
      task: 'What is tank 1’s rate, x₁′?',

  // The lines parallel to b through each multiple of g along a, across the pane (finer ones faded).

  // ---------- the card: the rule in symbols ----------
  function cardW(label, Es, sm, post) {

  function card(label, M, post) {

  // A line of words in pieces, each fading in on its own, centred.

  function drawCard(d, st, sys) {

  // ---------- the real thing ----------
  const TK = [[48, 118], [196, 266]];   // each tank's walls, across the panel
  function tanksDraw(sys, x, R) {

    [0, 1].forEach((j) => {
      const a = R.x + TK[j][0], b = R.x + TK[j][1], lv = bot - H * K.clamp(x[j] / full, 0, 1);
      if (bot - lv > 0.05) put(K.svg('rect', { class: 'salt', x: a, y: r3(lv), width: b - a, height: r3(bot - lv) }));
      put(K.svg('path', { class: 'tank', d: 'M' + a + ' ' + top + ' V' + bot + ' H' + b + ' V' + top }));
      text2((a + b) / 2, K.clamp(lv - 6, top + 16, bot - 4), j ? 'x₂' : 'x₁', 'tag');
      text2((a + b) / 2, bot + 18, 'Tank ' + (j + 1), 'ttl');

  // A spring drawn as a zigzag from x1 to x2 at height y.

  function realDraw(sys, x, R) {

  // ---------- the state plane ----------
  const faintOn = (d, st) => d.faint === 'always' || (d.faint === 'after' && st.res === 'right');
  function faintA(d, st) {

  function lineLab(d, st, sys, k) {

    const w = sys.om[k], full = e + ', ω ' + (near(w, Math.round(w), 1e-9) ? '= ' : '≈ ') + num(w, 1) + ' rad/s';
    if (k === 1 && sys.key === d.sys && d.key === 'modes') return { s: e + ', ω² = ' + num(sys.lam[k]) + 'k/m' };

  // ---------- what each step adds: rows of working, marks, and wrong answers drawn in red ----------
  function slip(d, st) { row(d.slips[st.pick], 'rw rbad', arr(0, 0.5)); }
  function ring(p, lab) { const a = arr(0, 0.5); part(a, () => dotD('bring', p, 8)); labD(p, lab, 'lbad', a); REC.bad++; }
  function guess(pts) { const a = arr(0, 0.5); part(a, () => pathW('guess', pts)); REC.bad++; }
  const bez = (a, c, b) => K.linspace(0, 1, 30).map((t) => add(add(scl(a, (1 - t) * (1 - t)), scl(c, 2 * t * (1 - t))), scl(b, t * t)));
  const EXTRA = {
    rate1: (d, st) => {
      if (st.res === 'right') {
        const a = [fa(st, 0.5, 0.4), fa(st, 0.7, 0.4), fa(st, 0.9, 0.4)];
        row('out: ' + PUMP + ' L/min carries ' + num(PUMP / V) + 'x₁ g/min', 'rw rok', a[0]);
        row('in: ' + BACK + ' L/min carries ' + num(BACK / V) + 'x₂ g/min', 'rw rok', a[1]);
        row('fresh water: ' + FRESH + ' L/min carries no salt', 'rw rok', a[2]);
        if (a[0] > 0) REC.reveal++;
      } else if (st.res === 'wrong') slip(d, st);
    },
    online: (d, st, i, sys) => {
      if (st.res === 'right') {
        const a = fa(st, 0.1, 0.3), r = mul(sys.M, ON_LINE);
        part(a, () => arrowD('rate', ON_LINE, add(ON_LINE, scl(r, RATE_MIN)), 10));
        labD(add(ON_LINE, scl(r, RATE_MIN * 0.5)), 'rate', 'nm', a, true);
        row('A' + pt(ON_LINE) + ' = ' + pt(r) + ' = ' + num(sys.lam[0]) + ' × ' + pt(ON_LINE), 'rw rok', a);
        if (a > 0) REC.reveal++;
      } else if (st.res === 'wrong') {
        guess(st.pick === O4[1] ? bez(ON_LINE, [24, 14], [16, 2]) : bez(ON_LINE, [22, 2], scl(OPEN.E[1], 8)));
        slip(d, st);
      }
    },
    faint: (d, st, i, sys, F) => {
      const x0 = F.sc.runs[0].x0, am = mul(sys.PI, x0);
      if (sys.kind !== 'tank' || sys.key !== d.sys) return;
      row(num(am[0]) + pt(sys.E[0]) + (am[1] < 0 ? ' − ' : ' + ') + num(Math.abs(am[1])) + pt(sys.E[1]) + ' = ' + pt(x0), 'rw', st.mode === 'demo' ? arr(0.4, 0.5) : 1);
    },
    bleft: (d, st) => {
      if (st.res === 'right') {
        const a = fa(st, 1.6, 0.4);
        row(num(AM0[1]) + 'e^(' + num(OPEN.lam[1]) + ' × ' + T6 + ') = ' + num(AM0[1]) + 'e^(' + num(OPEN.lam[1] * T6) + ') ≈ ' + num(B10, 2), 'rw rok', a);
        if (a > 0) REC.reveal++;
      } else if (st.res === 'wrong') {
        if (st.pick === O6[0]) { const q = scl(OPEN.E[1], AM0[1] * Math.exp(OPEN.lam[0] * T6)); ring(q, num(len(q) / len(OPEN.E[1]), 1)); }
        else ring([0, 0], '0');
        slip(d, st);
      }
    },
    sum: (d, st, i, sys, F) => {
      if (sys.key !== d.sys || st.start || F.k !== 0 || F.t < TSTAR) return;
      const q = posAt(OPEN, START, TSTAR), a = K.clamp((F.t - TSTAR) / 4, 0, 1);
      part(a, () => dotD('mk', q, 4.5));
      labD(q, 'tank 2 fullest, ' + num(TSTAR, 1) + ' min', 'nm', a);
      REC.mark = a > 0;
    },
    line30: (d, st) => {
      if (st.res === 'right') {
        const a = fa(st, 2.0, 0.4), slow = AM0[0] * Math.exp(OPEN.lam[0] * OPEN.tMax), fast = AM0[1] * Math.exp(OPEN.lam[1] * OPEN.tMax);
        row('slow part ' + num(AM0[0]) + 'e^(' + num(OPEN.lam[0] * OPEN.tMax) + ') ≈ ' + num(slow, 2), 'rw rok', a);
        row('fast part ' + num(AM0[1]) + 'e^(' + num(OPEN.lam[1] * OPEN.tMax) + ') ' + (fast < 0.01 ? '< 0.01' : '≈ ' + num(fast, 2)), 'rw rok', a);
        if (a > 0) REC.reveal++;
      } else if (st.res === 'wrong') {
        const u = st.pick === O8[0] ? [1, 0] : unit(OPEN.E[1]), a = arr(0, 0.5);
        part(a, () => segW('guess', scl(u, -500), scl(u, 500)));
        REC.bad++;
        slip(d, st);
      }
    },
    omega: (d, st) => {
      if (st.res === 'right') {
        const a = fa(st, 1.5, 0.4), w2 = KM * MASS.lam[1];
        row('ω² = ' + num(MASS.lam[1]) + 'k/m = ' + num(w2) + ', so ω = √' + num(w2) + ' ≈ ' + num(MASS.om[1], 1) + ' rad/s', 'rw rok', a);
        if (a > 0) REC.reveal++;
      } else if (st.res === 'wrong') slip(d, st);
    },
    split: (d, st) => {
      if (st.res === 'right') {
        const a = fa(st, 0.5, 0.4);
        row(combo(AM12[0], AM12[1]) + ' = ' + pt(S12), 'rw rok', a);
        if (a > 0) REC.reveal++;
      } else if (st.res === 'wrong') {
        if (st.pick === O12[2]) { const q = comboAt(AM12[0], Math.abs(AM12[1])); if (inBox(q, PAN.bx)) ring(q, pt(q)); }
        slip(d, st);
      }
    },
    closed: (d, st) => {
      if (st.res === 'right') {
        const a = fa(st, 2.2, 0.3);
        row(num(SHUTAM[0]) + pt(SHUT.E[0]) + ' stays, ' + num(SHUTAM[1]) + 'e^(' + num(SHUT.lam[1]) + 't)' + pt(SHUT.E[1]) + ' dies away', 'rw rok', a);
        if (a > 0) REC.reveal++;
      } else if (st.res === 'wrong') {
        if (st.pick === O13[0]) ring([0, 0], pt([0, 0]));
        slip(d, st);
      }
    },
  };
  STEPS[STEPS.findIndex((d) => d.key === 'bleft')].faintLab = (st, F) => (st.res === 'right' && F.t >= T6 - 1e-9 ? ['a', 'b ≈ ' + num(B10, 2)] : null);
  STEPS[STEPS.findIndex((d) => d.key === 'split')].faintLab = (st) => (st.res === 'right' ? ['a = ' + num(AM12[0]), 'b = ' + num(AM12[1])] : null);

  // ---------- the key under the picture (it wraps onto more lines when it must) ----------
  function keyLines(list, maxW) {
    const lines = [];
    let cur = [], w = 0;
    list.forEach((it) => {
      if (!(it.a >= 0)) return;
      const iw = 28 + tw(it.s, 'ttl');
      if (cur.length && w + 16 + iw > maxW) { lines.push(cur); cur = []; w = 0; }
      w += (cur.length ? 16 : 0) + iw;
      cur.push({ k: it.k, s: it.s, w: iw, a: it.a });
    });
    if (cur.length) lines.push(cur);
    return lines;
  }
  function swatch(k, x, y) {
    if (k === 'salt') put(K.svg('rect', { class: 'salt', x: r3(x + 3), y: y - 12, width: 16, height: 13, rx: 2 }));
    else if (k === 'rdot') put(K.svg('circle', { class: 'rdot', cx: r3(x + 11), cy: y - 5, r: 5 }));
    else if (k === 'fdot') put(K.svg('circle', { class: 'fdot', cx: r3(x + 11), cy: y - 5, r: 6 }));
    else if (k === 'sdia') put(K.svg('path', { class: 'sdia', d: 'M' + r3(x + 11) + ' ' + (y - 10) + ' l5 5 l-5 5 l-5 -5 Z' }));
    else if (k === 'grid') put(K.svg('rect', { class: 'gsq', x: r3(x + 4), y: y - 12, width: 13, height: 13 }));
    else put(K.svg('line', { class: k, x1: r3(x + 2), y1: y - 5, x2: r3(x + 20), y2: y - 5 }));
  }
  function drawKey(lines, y) {
    lines.forEach((ln, r) => {
      const yy = y + r * 22;
      let seen = 0;
      const gaps = ln.map((it) => { const g = 16 * it.a * Math.min(1, seen); seen += it.a; return g; });
      let x = W / 2 - ln.reduce((s, it, j) => s + it.w * it.a + gaps[j], 0) / 2;
      ln.forEach((it, j) => {
        x += gaps[j];
        const x0 = x;
        part(it.a, () => { swatch(it.k, x0, yy); text2(x0 + 28, yy, it.s, 'ttl', 'start'); });
        x += it.w * it.a;
      });
    });
  }

  // ---------- each step's layout: the card on top, the real thing, the plane beside or below it ----------
  const CARDH = 58, PH = 256, GAPY = 8;
  const wideNow = () => { const p = el('pz'); return !!p && p.clientWidth >= 640; };
  function layoutOf(d, sys, wide) {
    const RH = sys.kind === 'mass' ? 112 : 124;
    if (!d.plane) return { W: 340, real: { x: 4, y: CARDH, w: 332, h: RH }, plane: null, bottom: CARDH + RH };
    if (wide) return { W: 680, real: { x: 4, y: CARDH + (PH - RH) / 2, w: 332, h: RH }, plane: { x: 344, y: CARDH, w: 332, h: PH }, bottom: CARDH + PH };
    return { W: 340, real: { x: 4, y: CARDH, w: 332, h: RH }, plane: { x: 4, y: CARDH + RH + GAPY, w: 332, h: PH }, bottom: CARDH + RH + GAPY + PH };
  }

  // ---------- the picture for a step (the animation calls this every frame) ----------
  function paint(i) {
    if (i == null) i = at();
    const d = STEPS[i], st = S[i], sys = sysOf(i, st), wide = !!d.plane && wideNow(), L = layoutOf(d, sys, wide);
    W = L.W;
    art.textContent = '';
    into = null; LAB = []; PAN = null;
    REC = { texts: [], rows: [], segs: [], dots: [], bad: 0, reveal: 0, cards: [], said: [], key: [], lines: [], sys: sys.key, x: null, t: 0, k: 0,
      faint: null, trail: [], trails: [], box: null, z: 1, mark: false, stretch: null, gridTxt: '' };
    const F = frameAt(i, st, T);
    REC.x = F.x; REC.t = F.t; REC.k = F.k; REC.glide = F.glide;
    drawCard(d, st, sys);
    realDraw(sys, F.x, L.real);
    if (L.plane) planeDraw(d, st, i, sys, F, L.plane);
    if (EXTRA[d.key]) EXTRA[d.key](d, st, i, sys, F);
    placeLabels();
    const kl = keyLines(REC.key, W - 14), y0 = L.bottom + 26;
    drawKey(kl, y0);
    const ry = y0 + 22 * Math.max(0, kl.length - 1) + 30, nRows = Math.max(REC.rows.length, d.rows || 0);
    REC.rows.forEach((r, k) => part(r.a, () => fitText(W / 2, ry + k * 22, r.s, r.cls)));
    const H = (nRows ? ry + (nRows - 1) * 22 : y0 + 22 * Math.max(0, kl.length - 1)) + 12;
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + r3(H));
    svg.classList.toggle('wide', wide);
    const said = REC.said.slice();
    REC.rows.forEach((r) => { if (r.a > 0) said.push(r.s + '.'); });
    svg.setAttribute('aria-label', say(said.join(' ')));
    if (!PROBE) {
      LASTP = PAN; CURSYS = sys; lastWide = wide;
      outs.x1.set(F.x[0]); outs.x2.set(F.x[1]); outs.t.set(F.t);
    }
    return REC;
  }

  // ---------- text with amber key terms (built with K.el, never innerHTML) ----------
  function write(node, s) {
    node.textContent = '';
    String(s).split('`').forEach((seg, k) => {
      if (!seg) return;
      if (k % 2) { node.appendChild(K.el('span', { class: seg.length <= 16 ? 'nw' : '' }, seg)); return; }
      const re = /\*([^*]+)\*/g;
      let at0 = 0, m;
      while ((m = re.exec(seg))) {
        if (m.index > at0) node.appendChild(document.createTextNode(seg.slice(at0, m.index)));
        node.appendChild(K.el('span', { class: 'term' }, m[1]));
        at0 = m.index + m[0].length;
      }
      if (at0 < seg.length) node.appendChild(document.createTextNode(seg.slice(at0)));
    });
  }

  // ---------- controls ----------
  const stepper = K.stepper({ id: 'step', label: 'Step', steps: STEPS.map((d) => d.name), value: 0, compact: true, into: '#prog' });
  const at = () => stepper.get();
  const sysCtl = K.choice({ id: 'system', label: 'System', options: Object.keys(SYS).map((k) => SYS[k].name), value: 0, into: '#sysbox' });
  const goOn = (i) => !finished && (!!STEPS[i].show || (!!STEPS[i].goAfter && S[i].res === 'right'));
  const sysOn = (i) => !finished && !!STEPS[i].sysPick;
  const dragOn = (i) => !finished && !!STEPS[i].drag;
  const outs = {
    x1: K.readout({ id: 'x1Out', label: 'x₁', fmt: (v) => fixed(v, 2) + NB + CURSYS.ux, into: '#outs' }),
    x2: K.readout({ id: 'x2Out', label: 'x₂', fmt: (v) => fixed(v, 2) + NB + CURSYS.ux, into: '#outs' }),
    t: K.readout({ id: 'clock', label: 'Time', fmt: (v) => fixed(v, 1) + NB + CURSYS.ut, into: '#outs' }),
  };
  K.model(() => { const i = at(), F = frameAt(i, S[i], T); return { x1Out: F.x[0], x2Out: F.x[1], clock: F.t }; });
  K.button({ label: 'Go', into: '#runrow', press: () => {
    const i = at();
    if (!goOn(i)) return;
    const st = S[i];
    st.mode = 'go';
    K.reveal();
    play(sched(i, st).total);
  } });
  K.button({ label: 'Reset', secondary: true, into: '#runrow', press: () => {
    const i = at();
    if (!goOn(i)) return;
    S[i].mode = 'idle';
    anim.pause(); T = Infinity;
  } });
  // Dragging the dot sets a new start; Go runs it.
  let dragging = false;
  function dragTo(ev) {
    const i = at(), st = S[i], sys = sysOf(i, st), m = svg.getScreenCTM();
    if (!m || !LASTP) return;
    const pp = new DOMPoint(ev.clientX, ev.clientY).matrixTransform(m.inverse());
    st.start = snapStart(sys, LASTP.inv(pp.x, pp.y), LASTP.s);
    st.mode = 'idle';
    if (anim.playing()) anim.pause();
    T = Infinity;
    K.reveal();
    K.refresh();
  }
  svg.addEventListener('pointerdown', (ev) => {
    const t = ev.target;
    if (!t || !t.classList || !t.classList.contains('handle') || !dragOn(at())) return;
    dragging = true;
    try { svg.setPointerCapture(ev.pointerId); } catch (e) { /* not every pointer can be captured */ }
    ev.preventDefault();
    dragTo(ev);
  });
  svg.addEventListener('pointermove', (ev) => { if (dragging) { ev.preventDefault(); dragTo(ev); } });
  const endDrag = () => { dragging = false; };
  svg.addEventListener('pointerup', endDrag);
  svg.addEventListener('pointercancel', endDrag);

  const pickBtns = [0, 1, 2].map((k) => K.button({ label: 'Answer ' + (k + 1), secondary: true, into: '#picks', press: () => {
    const i = at(), d = STEPS[i], st = S[i];
    if (finished || d.show || !d.opts || k >= d.opts.length || st.res === 'right') return;
    const was = st.res === 'wrong';
    st.pick = d.opts[k]; st.res = null;
    if (was) { anim.pause(); T = Infinity; enter('scene'); }
  } }));
  // Check: marks the answer; a right one shows itself on the picture, a wrong one is drawn in red.
  const checkBtn = K.button({ label: 'Check', into: '#acts', press: () => {
    const i = at(), d = STEPS[i], st = S[i];
    if (d.show || finished || st.res === 'right') return;
    if (st.pick == null) { st.res = 'empty'; return; }
    doCheck(i, st);
    play(st.res === 'right' ? d.fb[0] : d.fb[1]);
  } }).el;
  const whyBtn = K.button({ label: 'Why?', secondary: true, into: '#acts', press: () => {
    if (STEPS[at()].show || finished) return;
    const st = S[at()]; st.why = !st.why;
  } });
  const backBtn = K.button({ label: 'Back', secondary: true, into: '#nav', press: () => {
    if (finished) { finished = false; return; }
    stepper.set(Math.max(0, at() - 1), true);
  } });
  const nextBtn = K.button({ label: 'Continue', into: '#nav', press: () => {
    const i = at();
    if (finished || (!STEPS[i].show && S[i].res !== 'right')) return;
    if (i < STEPS.length - 1) { stepper.set(i + 1, true); return; }
    finished = true;
    if (typeof K.complete === 'function') K.complete();
  } });
  K.button({ label: 'Start again', secondary: true, into: '#again', press: () => {
    S = STEPS.map((d, i) => blank(i)); finished = false; lastStep = -1; stepper.set(0, true);
  } });
  const nav = el('nav');

  // One animation plays each demonstration, each run and the motion after an answer; with reduced motion (and while
  // the self-test looks) everything opens finished.
  const anim = K.anim({ button: false, label: 'Run', step: (dt) => {
    if (finished) return false;
    T += dt;
    paint();
    return T < motionEnd;
  } });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !anim.playing() && T !== Infinity) { T = Infinity; paint(); } });
  window.addEventListener('resize', () => { if (wideNow() !== lastWide && STEPS[at()].plane) K.refresh(); });
  function play(dur) {
    if (REDUCE || testing()) { T = Infinity; anim.pause(); paint(); return; }
    motionEnd = dur; T = 0; anim.play();
  }
  function enter(id) {
    if (REDUCE) return;
    const b = el(id);
    b.classList.remove('enter');
    void b.offsetWidth;
    b.classList.add('enter');
  }

  write(el('finish'), FINISH);
  K.update((p) => {
    const i = at(), d = STEPS[i];
    if (!anim.playing()) T = Infinity;
    if (i !== lastStep) {
      lastStep = i; enter('stepbox');
      if (d.show) { S[i] = blank(i); play(sched(i, S[i]).total); } else { anim.pause(); T = Infinity; }
      sysSet = SYS[d.sys].name;
      if (sysCtl.get() !== sysSet) sysCtl.set(sysSet, true);
    } else if (p.system !== sysSet) {
      sysSet = p.system;
      if (sysOn(i) && SYSKEY[p.system]) {
        const st = S[i];
        st.sys = SYSKEY[p.system]; st.start = null; st.mode = 'idle';
        anim.pause(); T = Infinity; enter('scene');
      }
    }
    const st = S[i];
    if (finished !== lastDone) { lastDone = finished; enter(finished ? 'done' : 'stepbox'); }
    const right = st.res === 'right';
    el('stepbox').hidden = finished;
    el('done').hidden = !finished;
    el('count').textContent = 'Screen ' + (i + 1) + ' of ' + STEPS.length;
    const task = el('task');
    task.className = 'task' + (d.show ? ' show' : '');
    write(task, d.show ? d.text : d.task);
    paint(i);
    el('runrow').hidden = !goOn(i);
    el('sysbox').hidden = !sysOn(i);
    const actTxt = d.show ? d.act || '' : right ? d.actAfter || '' : '';
    const act = el('act');
    write(act, actTxt);
    act.hidden = finished || !actTxt;
    el('outs').hidden = finished;

    const opts = d.show ? [] : d.opts || [];
    el('picks').hidden = !opts.length;
    el('picks').classList.toggle('long', opts.some((o) => o.length > 8));
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      b.setLabel(opts[k]);
      b.el.setAttribute('aria-label', say(opts[k]));
      b.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });
    el('acts').hidden = !!d.show;
    checkBtn.hidden = right;
    // Why? gives the answer away, so it shows only once an answer has been checked.
    const checked = st.res === 'right' || st.res === 'wrong';
    whyBtn.el.hidden = !checked;
    const fb = el('fb');
    fb.hidden = !!d.show;
    fb.className = 'fb' + (right ? ' right' : st.res === 'wrong' ? ' wrong' : '');
    write(fb, d.show ? '' : right ? 'That\'s it.' : st.res === 'wrong' ? hintFor(i, st) : st.res === 'empty' ? 'Tap one of the answers.' : '');
    const why = el('why');
    why.hidden = d.show || !st.why || !checked;
    write(why, d.show ? '' : d.why);
    whyBtn.setLabel(st.why ? 'Hide why' : 'Why?');
    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !right);
    nextBtn.setLabel(i === STEPS.length - 1 ? 'Finish' : 'Continue');
    nav.hidden = backBtn.el.hidden && nextBtn.el.hidden;
  });

  // ---------- known answers, worked out by hand ----------
  const DO = STEPS.map((d, i) => i).filter((i) => !STEPS[i].show);
  const idx = (k) => STEPS.findIndex((d) => d.key === k);
  const solvedSt = (i) => doCheck(i, Object.assign(blank(i), { pick: STEPS[i].want }));
  const wrongSt = (i, o) => doCheck(i, Object.assign(blank(i), { pick: o }));
  // A step painted in the state given (finished, or t seconds into its motion): what it draws.
  function drawnRaw(i, st, t) {
    const keepS = S[i], keepT = T;
    PROBE = true; S[i] = st; T = t == null ? Infinity : t;
    try { return paint(i); } finally { S[i] = keepS; T = keepT; PROBE = false; }
  }

  K.check('Linked tanks lead to a linear system of differential equations, solved with the eigenvalues and eigenvectors of its matrix: for the open and the closed tanks, the eigenvector parts added up obey the rates x′ = Ax at every moment, from every corner of the drag square and from the lesson’s starts', () => {
    let ok = true;
    [OPEN, SHUT].forEach((sy) => {
      const e = eig2(sy.M);
      ok = ok && e.lines.length === 2 && sy.E.every((v, k) => e.lines.some((l) => sameLine(l.dir, v) && near(l.lam, sy.lam[k], 1e-9)));
      [[0, 0], [40, 0], [0, 40], [40, 40], [30, 0], [10, 20], [7, 33]].forEach((x0) => [0, 0.5, 1, 5, 10, 30].forEach((t) => {
        const h = 1e-4, dx = scl(sub(posAt(sy, x0, t + h), posAt(sy, x0, t - h)), 1 / (2 * h)), ax = mul(sy.M, posAt(sy, x0, t));
        ok = ok && dx.every((v, k) => Math.abs(v - ax[k]) <= 1e-6 * (1 + Math.abs(ax[k])));
      }));
      ok = ok && same(posAt(sy, [7, 33], 0), [7, 33], 1e-9);
    });
    return ok;
  }, { source: SRC[0] });
  K.check('(1, 1) is an eigenvector of the masses’ matrix with eigenvalue k/m, and (−1, 1) one with eigenvalue 3k/m', () => {
    const KB = BMAT.map((r) => r.map((x) => KM * x));
    return same(mul(KB, [1, 1]), scl([1, 1], KM)) && same(mul(KB, [-1, 1]), scl([-1, 1], 3 * KM)) && near(MASS.lam[0], 1) && near(MASS.lam[1], 3) &&
      near(MASS.om[0], Math.sqrt(KM)) && near(MASS.om[1], Math.sqrt(3 * KM));
  }, { source: SRC[1] });
  K.check('The most general motion of the masses is a sum of the simple swings, the normal modes: from starts all over the drag square, each faint dot alone obeys x″ = −(k/m)Bx, and the dot drawn is always their sum', () => {
    const KB = BMAT.map((r) => r.map((x) => KM * x)), i = idx('weave');
    let ok = true;
    [[-3, -3], [-3, 1.5], [0, 2], [1.3, -0.4], [3, 1], [2.2, 3]].forEach((x0) => {
      [0, 0.1, 0.37, 1, 2].forEach((t) => {
        const h = 1e-3, P = (s) => partsAt(MASS, posAt(MASS, x0, s));
        const p0 = P(t), pm = P(t - h), pp = P(t + h);
