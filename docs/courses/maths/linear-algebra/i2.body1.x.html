<p class="lead">Your square grid, with Jennifer's slanted grid over it. Her arrows are b₁ = (2, 1) and b₂ = (−1, 1), and one arrow runs to (3, 3).</p>

<p class="caption" id="cap">Her numbers are amounts of b₁ and b₂ that reach the tip. P's columns are b₁ and b₂.</p>

<script>
  // ---------- numbers and words (pure, so the checks can test them) ----------
  const MINUS = '−', NB = ' ';
  function num(v, dp) { const f = Math.pow(10, dp == null ? 2 : dp); let r = Math.round(v * f) / f; if (Math.abs(r) < 1e-9) r = 0; return (r < 0 ? MINUS : '') + String(Math.abs(r)); }
  // Whole numbers and short decimals as they are; thirds, sixths and the like as fractions, exactly.
  function fr(v) {
    if (Math.abs(v * 100 - Math.round(v * 100)) < 1e-7) return num(v, 2);
    for (let q = 3; q <= 12; q++) { const p = v * q; if (Math.abs(p - Math.round(p)) < 1e-7) { const n = Math.round(p); return (n < 0 ? MINUS : '') + Math.abs(n) + '/' + q; } }
    return num(v, 2);
  }
  const pt = (v) => '(' + v.map(fr).join(', ') + ')';
  const say = (s) => String(s == null ? '' : s).replace(/ /g, ' ').replace(/⁻¹/g, ' inverse ').replace(/₁/g, ' 1').replace(/₂/g, ' 2')
    .replace(/−/g, ' minus ').replace(/×/g, ' times ').replace(/÷/g, ' divided by ').replace(/=/g, ' equals ').replace(/\s+/g, ' ').trim();
  const SUB = ['₁', '₂'];
  function mixT(cs) { return cs.map((c, k) => (k === 0 ? fr(c) : (c < 0 ? ' − ' : ' + ') + fr(Math.abs(c))) + 'b' + SUB[k]).join(''); }
  function mixP(cs, u, v) { return fr(cs[0]) + ' × ' + pt(u) + (cs[1] < 0 ? ' − ' : ' + ') + fr(Math.abs(cs[1])) + ' × ' + pt(v); }
  const coordsT = (u, v) => 'b₁ = ' + pt(u) + ' and b₂ = ' + pt(v);
  const parsePts = (s) => (String(s).match(/\(([^)]+)\)/g) || []).map((m) => m.replace(/[()]/g, '').split(',').map((t) => +t.trim().replace(MINUS, '-')));

  // ---------- the rule ----------
  // An arrow's numbers on a grid are the amounts of that grid's two basis arrows, laid nose to tail,
  // that reach its tip. P has her arrows as its columns: P times her numbers gives yours, and P⁻¹
  // (swap the diagonal, change the signs of the other two, divide by the determinant) goes back.
  const add = (p, q) => p.map((x, k) => x + q[k]);
  const scl = (p, s) => p.map((x) => x * s);
  const det2 = (u, v) => u[0] * v[1] - u[1] * v[0];
  const near = (a, b, t) => Math.abs(a - b) < (t || 1e-9);
  const samePt = (a, b) => !!a && !!b && a.length === b.length && a.every((x, k) => near(x, b[k]));
  const lerpV = (p, q, e) => (e >= 1 ? q.slice() : e <= 0 ? p.slice() : p.map((x, k) => x + (q[k] - x) * e));
  const isZero = (p) => p.every((x) => Math.abs(x) < 1e-9);
  const clean = (p) => p.map((x) => (Math.abs(x - Math.round(x)) < 1e-9 ? Math.round(x) : x) || 0);
  const mix2 = (a, b, u, v) => clean(add(scl(u, a), scl(v, b)));
  const cols = (u, v) => [[u[0], v[0]], [u[1], v[1]]];
  const colOf = (M, k) => [M[0][k], M[1][k]];
  const mulMV = (M, x) => clean([M[0][0] * x[0] + M[0][1] * x[1], M[1][0] * x[0] + M[1][1] * x[1]]);
  const mulMM = (A, B) => [0, 1].map((i) => [0, 1].map((j) => A[i][0] * B[0][j] + A[i][1] * B[1][j]));
  const detM = (M) => M[0][0] * M[1][1] - M[0][1] * M[1][0];
  const adjM = (M) => [[M[1][1], -M[0][1]], [-M[1][0], M[0][0]]];
  const invM = (M) => { const D = detM(M); return near(D, 0) ? null : adjM(M).map((r) => r.map((x) => x / D)); };
  const sameM = (A, B) => !!A && !!B && A.every((r, i) => r.every((x, j) => near(x, B[i][j])));
  const transpose = (M) => [[M[0][0], M[1][0]], [M[0][1], M[1][1]]];
  // Her amounts for the tip t (Cramer's rule), while her arrows make cells with real area.
  const amountsOf = (t, u, v) => { const D = det2(u, v); return clean([det2(t, v) / D, det2(u, t) / D]); };
  const onLine = (t, u, v) => near(det2(isZero(u) ? v : u, t), 0);
  const rotD = (p, deg) => { const a = deg * Math.PI / 180, c = Math.cos(a), s = Math.sin(a); return [p[0] * c - p[1] * s, p[0] * s + p[1] * c]; };
  const len = (p) => Math.hypot(p[0], p[1]);

  // ---------- the lesson's values ----------
  const I2 = [1, 0], J2 = [0, 1];
  const B1 = [2, 1], B2 = [-1, 1], TIP = [3, 3], B1N = [1, 1];
  const P0 = cols(B1, B2), PI0 = invM(P0), HERS = mulMV(PI0, TIP);
  const MT = [[0, -1], [1, 0]], TURNED = mulMV(MT, TIP), HERS_T = mulMV(PI0, TURNED);
  const C1 = [1, 0], C2 = [-1, 1], MS = [[3, 1], [0, 2]], PS = cols(C1, C2), DS = mulMM(invM(PS), mulMM(MS, PS)).map((r) => clean(r));
  const H1 = [1, 2];
  const Q1 = [1, 2], Q2 = [1, -1];
  const Y8 = [1, -1];
  const G1 = [1, 1], G2 = [1, -1], T12 = [4, 2];
  const L1 = [2, 1], L2 = [4, 2];
  const LINE_WARN = 'b₁ and b₂ lie on one line';
  const herNums = (u, v) => (near(det2(u, v), 0) ? null : amountsOf(TIP, u, v));
  const noneText = (u, v) => (onLine(TIP, u, v) ? 'many' : 'none');
  // Where the tips may be dragged.
  const DX = [-5, 6], DY = [-1, 6];

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // band: the readouts or the strip above the picture; rows: worked lines; card: the matrix card under
  // it. dur: a SHOW step's demonstration; act: what he can do with the picture, under it; drag: the tips
  // of b1 and b2 move (u0, v0 where they rest); how: the How button. A puzzle: task, opts, want, hints
  // (one per wrong answer), slips (the red line drawn for each), why, fb (seconds of motion after a
  // right and a wrong answer).
  const PICK = 'Tap one of the answers.';
  const O3 = ['The arrow itself', 'Nothing at all', 'Only the numbers'];
  const O5 = ['[1 1; 2 −1]', '[1 2; 1 −1]', '[2 −1; 1 1]'];
  const MATS = { [O5[0]]: cols(Q1, Q2), [O5[1]]: transpose(cols(Q1, Q2)), [O5[2]]: P0 };
  const O9 = ['PMP⁻¹', 'P⁻¹MP', 'M alone'];
  const PRODS = { 'P⁻¹MP': mulMM(PI0, mulMM(MT, P0)), 'PMP⁻¹': mulMM(P0, mulMM(MT, PI0)), 'M alone': MT };
  const O12 = ['Most arrows get no numbers on her grid', 'Nothing goes wrong', 'Her numbers are yours halved'];
  const HALF = scl(TIP, 0.5);
  const landsB = (am, u, v, t) => mixT(am) + ' = ' + pt(mix2(am[0], am[1], u, v)) + ', not ' + pt(t);
  const landsP = (am, u, v) => mixP(am, u, v) + ' = ' + pt(mix2(am[0], am[1], u, v));
  const colsSlip = (o) => { const M = MATS[o]; return 'Its columns, ' + pt(colOf(M, 0)) + ' and ' + pt(colOf(M, 1)) + ', are not the arrows'; };
  const prodSlip = (o) => { const r = mulMV(PRODS[o], HERS); return o + ' gives ' + pt(r) + '. It lands on ' + pt(mix2(r[0], r[1], B1, B2)); };
  const DRAG = 'Drag the tip of b₁ or b₂ to a whole point. How lays her amounts again, nose to tail.';
  const STEPS = [
    { show: true, key: 'meet', name: 'One arrow, two grids', dur: 3.9, band: 'read', rows: 2, drag: true, how: true, u0: B1, v0: B2, act: DRAG,
      text: 'Your grid uses i and j. The arrow to `(3, 3)` means 3 lots of i and 3 of j. Jennifer\'s slanted grid sits over yours. Her basis arrows are `b₁ = (2, 1)` and `b₂ = (−1, 1)`, written in your numbers. Two lots of b₁ reach `(4, 2)`. One b₂ on the end reaches `(3, 3)`. So to her, the same arrow is `(2, 1)`. Her numbers mean nothing until you know her arrows.' },
    { kind: 'pick', key: 'toYours', name: 'Her numbers to yours', band: 'read', rows: 2, fb: [1.6, 0.6],
      task: 'Her numbers are `(1, 2)`. Where does the arrow end on your grid?',
      opts: ['(1, 2)', '(0, 3)', '(4, 1)'], want: '(0, 3)',
      hints: { '(1, 2)': 'Not quite. Those are her amounts, not your numbers. Lay 1 lot of b₁, then 2 lots of b₂.',
        '(4, 1)': 'Not quite. That mixes up the across and up parts. Lay 1 lot of b₁, then 2 lots of b₂, nose to tail.' },
      slips: { '(1, 2)': '(1, 2) reads her amounts as your numbers', '(4, 1)': '(4, 1) mixes up the across and up parts' },
      why: 'Her numbers are amounts. One lot of b₁ is `(2, 1)`. Two lots of b₂ are `(−2, 2)`. Nose to tail they reach `(0, 3)`.' },
    { show: true, key: 'move', name: 'Move b₁', dur: 4.2, band: 'read', rows: 2, drag: true, how: true, u0: B1N, v0: B2, act: DRAG,
      text: 'Now b₁ moves to `(1, 1)`, and her grid swings with it. The arrow is now 3 lots of the new b₁ and none of b₂. Her numbers read `(3, 0)`. The arrow has not moved. Only b₁ moved, yet both numbers changed. Each number depends on the whole basis.' },
    { kind: 'pick', key: 'changed', name: 'What changed?', band: 'read', rows: 2, fb: [1.6, 1.2],
      task: 'b₁ has moved from `(2, 1)` to `(1, 1)`. What changed?',
      opts: O3, want: O3[2],
      hints: { [O3[0]]: 'Not quite. Look at the tip. It still sits on (3, 3).',
        [O3[1]]: 'Not quite. Lay 2 lots of the new b₁ and 1 of b₂. They miss the tip.' },
      slips: { [O3[0]]: 'The tip still sits on ' + pt(TIP), [O3[1]]: landsB(HERS, B1N, B2, TIP) },
      why: 'The arrow still ends at `(3, 3)`. It is now 3 lots of the new b₁ and none of b₂. So her numbers went from `(2, 1)` to `(3, 0)`. Numbers belong to a grid. The arrow belongs to none.' },
    { show: true, key: 'P', name: 'The matrix P', dur: 4.0, band: 'read', rows: 2, card: true, drag: true, how: true, u0: B1, v0: B2,
      act: 'Drag the tip of b₁ or b₂. P\'s columns follow them.',
      text: 'To turn her numbers into yours, take 2 lots of b₁ and add 1 of b₂. You land on `(3, 3)`. A matrix times a column is exactly that sum. It is a mix of the matrix\'s columns. So put her arrows in as columns. `P = [2 −1; 1 1]`, and P times `(2, 1)` is `(3, 3)`. This is the *change-of-basis matrix*. Its columns are her arrows written in your numbers.' },
    { kind: 'pick', key: 'pickP', name: 'Build a P', rows: 1, card: true, fb: [1.4, 1.0],
      task: 'A grid is made of `(1, 2)` and `(1, −1)`. Which matrix takes its numbers to yours?',
      opts: O5, want: O5[0],
      hints: { [O5[1]]: 'Not quite. That puts the arrows in as rows. They go in as columns.', [O5[2]]: 'Not quite. That is Jennifer\'s P. This grid has other arrows.' },
      slips: { [O5[1]]: colsSlip(O5[1]), [O5[2]]: colsSlip(O5[2]) },
      why: 'P has the grid\'s arrows as its columns. The first column is `(1, 2)`, and the second is `(1, −1)`. So `P = [1 1; 2 −1]`. Then P times any numbers on that grid gives yours.' },
    { show: true, key: 'back', name: 'The way back', dur: 3.6, band: 'read', rows: 1, card: true, drag: true, how: true, u0: B1, v0: B2,
      act: 'Drag the tip of b₁ or b₂. The cell and P⁻¹ follow them.',
      text: 'To go from your numbers to hers, undo P with its inverse. P\'s determinant is `2 × 1 − (−1) × 1 = 3`. That is also the area of one cell of her grid. So `P⁻¹ = [1 1; −1 2] ÷ 3`. P⁻¹ times `(3, 3)` is `(6, 3) ÷ 3 = (2, 1)`. Multiply back with P to check. The area is not 0, so P has an inverse.' },
    { kind: 'pick', key: 'toHers', name: 'Yours to hers', band: 'read', rows: 2, fb: [1.6, 1.6],
      task: 'Your arrow is `(1, −1)`. Where does it sit on her grid?',
      opts: ['(3, 0)', '(1, −1)', '(0, −1)'], want: '(0, −1)',
      hints: { '(3, 0)': 'Not quite. That is P times (1, −1). Going from yours to hers needs P⁻¹.', '(1, −1)': 'Not quite. Those are your numbers. Her arrows are not i and j.' },
      slips: { '(3, 0)': landsB([3, 0], B1, B2, Y8), '(1, −1)': landsB([1, -1], B1, B2, Y8) },
      why: 'Use `P⁻¹ = [1 1; −1 2] ÷ 3`. It takes `(1, −1)` to `(0, −3) ÷ 3 = (0, −1)`. Check with P. Zero lots of b₁ and −1 lot of b₂ give `(1, −1)`.' },
    { show: true, key: 'strip', name: 'A move in her numbers', dur: 4.3, band: 'strip', rows: 0,
      text: 'A quarter turn anticlockwise is `M = [0 −1; 1 0]` in your numbers. Jennifer wants it in hers. Follow her `(2, 1)` along the strip. P turns it into your `(3, 3)`. M turns that to `(−3, 3)`. P⁻¹ brings it back to her numbers, `(0, 3)`. Three lots of b₂ do reach `(−3, 3)`. The first step goes on the right. So the turn, in her numbers, is P⁻¹MP.' },
    { kind: 'pick', key: 'order', name: 'Which order?', band: 'strip', rows: 1, fb: [1.9, 1.6],
      task: 'Which product does the quarter turn in her numbers?',
      opts: O9, want: 'P⁻¹MP',
      hints: { 'PMP⁻¹': 'Not quite. The step on the right goes first. It must turn her numbers into yours.', 'M alone': 'Not quite. M is written in your numbers. It cannot act on hers directly.' },
      slips: { 'PMP⁻¹': prodSlip('PMP⁻¹'), 'M alone': prodSlip('M alone') },

      const d = STEPS[i];
      if (d.opts.length !== 3 || new Set(d.opts).size !== 3 || d.opts.indexOf(d.want) < 0) return false;
      if (!d.opts.every((o) => isRight(i, Object.assign(blank(), { pick: o })) === (o === d.want))) return false;
      if (drawnRaw(i, solvedSt(i)).bad !== 0) return false;
      return d.opts.filter((o) => o !== d.want).every((o) => drawnRaw(i, wrongSt(i, o)).bad > 0 && !!d.hints[o] && !!d.slips[o]);
    });
    paint();
    return ok;
  });
  K.check('Before Check, no puzzle shows its answer; after a right answer, it does', () => {
    const ok = DO.every((i) => {
      const d = STEPS[i], b = drawnRaw(i, blank()), s = drawnRaw(i, solvedSt(i));
      return b.reveal === 0 && s.reveal > 0 && okRows(b).length === 0 && !b.texts.some((x) => x.indexOf(d.want) >= 0);
    });
    paint();
    return ok;
  });
  K.check('Each demonstration ends where the lesson says: the arrow (3, 3) read as (2, 1); b₁ on (1, 1) with her numbers (3, 0) and the arrow unmoved; P = [2 −1; 1 1] taking (2, 1) to (3, 3); a cell of area 3 and P⁻¹ = [1 1; −1 2] ÷ 3; the strip (2, 1), (3, 3), (−3, 3), (0, 3); the stretches to (3, 0) and (−2, 2) with P⁻¹MP = [3 0; 0 2]', () => {
    const m = drawnRaw(idx('meet'), blank()), mv = drawnRaw(idx('move'), blank()), p = drawnRaw(idx('P'), blank()), bk = drawnRaw(idx('back'), blank());
    const sp = drawnRaw(idx('strip'), blank()), sr = drawnRaw(idx('stretch'), blank());
    paint();
    const turnChain = sp.chains.find((c) => near(c.a, 0) && near(c.b, 3));
    return m.reads[0] === '(3, 3)' && m.reads[1] === '(2, 1)' && samePt(m.chains[0].end, TIP) &&
      samePt(mv.u, B1N) && mv.reads[1] === '(3, 0)' && samePt(mv.main, TIP) && samePt([mv.chains[0].a, mv.chains[0].b], [3, 0]) && samePt(mv.chains[0].end, TIP) &&
      sameM(p.card.M, P0) && samePt(p.card.inV, HERS) && samePt(p.card.outV, TIP) &&
      near(bk.areas[0], 3) && sameM(bk.card.adj, [[1, 1], [-1, 2]]) && bk.card.det === 3 && samePt(bk.card.out, HERS) && bk.reads[1] === '(2, 1)' &&
      sp.strip.nodes.join(' ') === '(2, 1) (3, 3) (−3, 3) (0, 3)' && sp.strip.ops.join(' ') === 'P M P⁻¹' && sp.strip.prod.every((a) => a === 1) &&
      samePt(sp.main, TURNED) && !!turnChain && samePt(turnChain.end, TURNED) &&
      sameM(sr.card.D, [[3, 0], [0, 2]]) && samePt(sr.u, [3, 0]) && samePt(sr.v, [-2, 2]) && samePt(sr.j, [1, 2]);

  K.check('While b₁ swings to (1, 1), the How chain re-lays along it and ends on the arrow\'s tip at every moment; while the arrow turns, its length stays the same; the product is written right to left, P first and P⁻¹ last', () => {
    const mi = idx('move'), si = idx('strip');
    let ok = true;
    const first = [Infinity, Infinity, Infinity];
    for (let k = 0; k <= 45; k++) {
      const t = k / 10, r = drawnRaw(mi, blank(), t);
      ok = ok && samePt(r.main, TIP) && r.chains.length === 1 && samePt(r.chains[0].end, TIP);
      const s = drawnRaw(si, blank(), t);
      if (s.main) ok = ok && near(len(s.main), len(TIP), 1e-9);
      s.strip.prod.forEach((a, j) => { if (a >= 0.5 && t < first[j]) first[j] = t; });
    }
    paint();
    return ok && first[2] < first[1] && first[1] < first[0] && first[0] < Infinity;
  });
  K.check('With her two arrows on one line, the cells have area 0: there is no How chain, her numbers read none (or many, when the arrow lies on that line), and P has no inverse', () => {
    const i = idx('back'), a = drawnRaw(i, liveSt({ u: [2, 1], v: [4, 2] })), b = drawnRaw(i, liveSt({ u: [1, 1], v: [2, 2] }));
    paint();
    return a.chains.length === 0 && a.reads[1] === 'none' && a.card.det === 0 && a.card.adj === null && b.reads[1] === 'many' && b.card.det === 0;

  K.check('Every demonstration has finished arriving within its 3 to 4.5 s, none starting before the 0.35 s screen fade ends; every answer\'s motion, right or wrong, within 2.5 s', () => {
    const timed = (i, st, limit) => { latest = 0; earliest = Infinity; drawnRaw(i, st); return latest <= limit + 1e-9; };
    const ok = STEPS.every((d, i) => {
      if (d.show) { const r = timed(i, blank(), d.dur); return r && d.dur <= 4.5 && d.dur >= 3 && earliest >= FADE; }
      return timed(i, solvedSt(i), d.fb[0]) && d.fb[0] <= 2.5 && d.opts.filter((o) => o !== d.want).every((o) => timed(i, wrongSt(i, o), d.fb[1]) && d.fb[1] <= 2.5);
    });
    paint();
    return ok;
  });

  K.ready();
