<p class="caption">Every arrow, path, grid, lit line and λ is worked out from the matrix on the card.</p>

<script>
  // ---------- numbers and words (pure, so the checks can test them) ----------
  const MINUS = '−', NB = ' ';
  function num(v, dp) { const f = Math.pow(10, dp == null ? 2 : dp); let r = Math.round(v * f) / f; if (Math.abs(r) < 1e-9) r = 0; return (r < 0 ? MINUS : '') + String(Math.abs(r)); }
  const pt = (v, dp) => '(' + v.map((x) => num(x, dp)).join(', ') + ')';
  const mstr = (M, dp) => '[' + M.map((r) => r.map((x) => num(x, dp)).join(' ')).join('; ') + ']';
  const parsePt = (s) => { const m = String(s).match(/\(([^)]+)\)/); return m ? m[1].split(',').map((x) => +x.trim().replace(MINUS, '-')) : null; };
  const say = (s) => String(s).replace(/ /g, ' ').replace(/×/g, ' times ').replace(/−/g, ' minus ').replace(/=/g, ' equals ').replace(/\s+/g, ' ').trim();

  // ---------- the rule: Av is v's first number times column 1 plus its second times column 2 ----------
  const add = (a, b) => a.map((x, k) => x + b[k]);
  const scl = (a, s) => a.map((x) => x * s);
  const dot = (a, b) => a.reduce((s, x, k) => s + x * b[k], 0);
  const len = (a) => Math.sqrt(dot(a, a));
  const unit = (a) => scl(a, 1 / (len(a) || 1));
  const cross2 = (a, b) => a[0] * b[1] - a[1] * b[0];
  const near = (a, b, t) => Math.abs(a - b) < (t || 1e-9);
  const same = (a, b, t) => !!a && !!b && a.length === b.length && a.every((x, k) => near(x, b[k], t || 1e-7));
  const sameM = (P, Q) => P.length === Q.length && P.every((r, i) => same(r, Q[i]));
  const clean = (a) => a.map((x) => { const r = Math.round(x * 1e9) / 1e9; return Math.abs(r) < 1e-12 ? 0 : r; });
  const lerpV = (a, b, e) => (e >= 1 ? b.slice() : e <= 0 ? a.slice() : a.map((x, k) => x + (b[k] - x) * e));
  const mul = (M, x) => M.map((r) => dot(r, x));
  const colsOf = (M) => M[0].map((_, k) => M.map((r) => r[k]));
  const det2 = (M) => M[0][0] * M[1][1] - M[0][1] * M[1][0];
  const minusI = (M, l) => M.map((r, i) => r.map((x, j) => (i === j ? x - l : x)));
  const sameLine = (a, b) => len(a) > 1e-9 && len(b) > 1e-9 && Math.abs(cross2(unit(a), unit(b))) < 1e-7;
  const ANG = (d) => Math.atan2(d[1], d[0]) * 180 / Math.PI;
  const angOf = (d) => ((ANG(d) % 180) + 180) % 180;
  const d180 = (a, b) => { const x = (((a - b) % 180) + 180) % 180; return Math.min(x, 180 - x); };
  const d360 = (a, b) => { const x = (((a - b) % 360) + 360) % 360; return Math.min(x, 360 - x); };
  const unitAt = (g) => clean([Math.cos(g * Math.PI / 180), Math.sin(g * Math.PI / 180)]);
  function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { const t = a % b; a = b; b = t; } return a; }
  // A direction in whole numbers where it can be, its first part that is not 0 made positive.
  function tidy(v) {
    const k = v.findIndex((x) => Math.abs(x) > 1e-9);
    if (k < 0) return v.map(() => 0);
    let w = v[k] < 0 ? scl(v, -1) : v.slice();
    const m = Math.min(...w.filter((x) => Math.abs(x) > 1e-9).map(Math.abs));
    w = scl(w, 1 / m);
    for (let q = 1; q <= 12; q++) {
      const u = scl(w, q);
      if (u.every((x) => Math.abs(x - Math.round(x)) < 1e-7)) { const r = u.map(Math.round), g = r.reduce((s, x) => gcd(s, x), 0) || 1; return r.map((x) => x / g + 0); }
    }
    return unit(w);
  }
  // The direction a 2 by 2 crushes, from its bigger row (p, q): p v1 + q v2 = 0 along (−q, p).
  function crushed(N) {
    const n0 = Math.hypot(N[0][0], N[0][1]), n1 = Math.hypot(N[1][0], N[1][1]);
    if (n0 < 1e-9 && n1 < 1e-9) return null;
    const row = n0 >= n1 ? N[0] : N[1];
    return tidy([-row[1], row[0]]);
  }
  // Every real eigenvalue and its line: the roots of λ² − (a + d)λ + (ad − bc) = 0, then (A − λI)v = 0.
  function eig2(M) {
    const a = M[0][0], b = M[0][1], c = M[1][0], d = M[1][1], tr = a + d, dt = a * d - b * c, disc = tr * tr - 4 * dt;
    const res = { tr, dt, disc, roots: [], lines: [], all: false, lam: null };
    if (disc < -1e-12) return res;
    const sq = Math.sqrt(Math.max(0, disc));
    res.roots = [(tr + sq) / 2, (tr - sq) / 2];
    (sq < 1e-9 ? [tr / 2] : res.roots).forEach((r) => {
      const dir = crushed(minusI(M, r));
      if (!dir) { res.all = true; res.lam = r; return; }
      res.lines.push({ dir, u: unit(dir), lam: Math.round(r * 1e9) / 1e9, ang: angOf(dir) });
    });
    return res;
  }
  // The probe at angle g: within snap degrees of a lit line it lands on it.
  const SNAP = 3;
  function probe(M, g, snap) {
    const E = eig2(M);
    let ang = g, line = null;
    if (E.all) line = { u: unitAt(g), lam: E.lam, ang: ((g % 180) + 180) % 180 };
    else {
      let best = null, bd = Infinity;
      E.lines.forEach((L) => { const dd = d180(g, L.ang); if (dd < bd) { bd = dd; best = L; } });
      if (best && bd <= (snap || 0) + 1e-7) {
        if (bd > 1e-7) ang = d360(g, best.ang) <= d360(g, best.ang + 180) ? best.ang : best.ang + 180;
        line = best;
      }
    }
    const v = unitAt(ang);
    return { ang, v, av: mul(M, v), line, lam: line ? line.lam : null };
  }
  // Any arrow w: on its own line when Aw is a number times w.
  function onLine(M, w) {
    if (len(w) < 1e-9) return null;
    const av = mul(M, w);
    if (Math.abs(cross2(w, av)) > 1e-7 * (1 + len(av))) return null;
    return { u: unit(w), lam: dot(av, w) / dot(w, w) };
  }
  // A row of A − λI as an equation: (−1, −1) -> "v₁ + v₂ = 0".
  function eqV(r) {
    let c = r.slice();
    const k = c.findIndex((x) => Math.abs(x) > 1e-9);
    if (k >= 0 && c[k] < 0) c = scl(c, -1);
    let s = '';
    c.forEach((x, j) => { if (near(x, 0)) return; const m = Math.abs(x); s += (s ? (x < 0 ? ' − ' : ' + ') : (x < 0 ? MINUS : '')) + (near(m, 1) ? '' : num(m)) + (j ? 'v₂' : 'v₁'); });
    return (s || '0') + ' = 0';
  }
  const lamI = (l) => (near(l, 1) ? 'I' : num(l) + 'I');
  function detFormula(M, nm) {
    const e = eig2(M);
    if (near(M[1][0], 0) || near(M[0][1], 0)) return 'det(' + nm + ' − λI) = (' + num(M[0][0]) + ' − λ)(' + num(M[1][1]) + ' − λ)';
    return 'det(' + nm + ' − λI) = λ² ' + (e.tr < 0 ? '+ ' : '− ') + num(Math.abs(e.tr)) + 'λ ' + (e.dt < 0 ? '− ' : '+ ') + num(Math.abs(e.dt));
  }
  function nearest(list, X) { let best = list[0], bd = Infinity; list.forEach((q) => { const d = (q[0] - X[0]) * (q[0] - X[0]) + (q[1] - X[1]) * (q[1] - X[1]); if (d < bd - 1e-12) { bd = d; best = q; } }); return best.slice(); }
  const has = (list, p) => list.some((q) => same(q, p));
  // Where a line through p along d crosses a box: its range of t, or null.
  function clipLine(p, d, bx) {
    let t0 = -Infinity, t1 = Infinity;
    for (let k = 0; k < p.length; k++) {
      if (Math.abs(d[k]) < 1e-12) { if (p[k] < bx[k][0] - 1e-9 || p[k] > bx[k][1] + 1e-9) return null; continue; }
      let a = (bx[k][0] - p[k]) / d[k], b = (bx[k][1] - p[k]) / d[k];
      if (a > b) { const s = a; a = b; b = s; }
      t0 = Math.max(t0, a); t1 = Math.min(t1, b);
    }
    return t1 >= t0 - 1e-9 ? [t0, Math.max(t0, t1)] : null;
  }
  // A polygon cut to a box (each edge in turn).
  function clipPoly(poly, bx) {
    let out = poly;
    [[0, bx[0][0], 1], [0, bx[0][1], -1], [1, bx[1][0], 1], [1, bx[1][1], -1]].forEach(([k, v, sg]) => {
      const inp = out; out = [];
      const inside = (q) => sg * (q[k] - v) >= -1e-12;
      for (let j = 0; j < inp.length; j++) {
        const P = inp[j], Q = inp[(j + 1) % inp.length], pi = inside(P), qi = inside(Q);
        if (pi) out.push(P);
        if (pi !== qi) out.push(lerpV(P, Q, (v - P[k]) / (Q[k] - P[k])));
      }
    });
    return out;
  }

  // ---------- the lesson's values ----------
  const A = [[3, 1], [0, 2]], MIR = [[0, 1], [1, 0]], SHR = [[1, 1], [0, 1]], QT = [[0, -1], [1, 0]];
  const B = [[2, -1], [-1, 2]], D4 = [[4, 1], [2, 3]], M5 = [[5, 2], [2, 2]];
  const C = [[1, 1, 0], [1, 2, 1], [0, 1, 1]];
  const EIG3 = [{ dir: [1, -1, 1], lam: 0 }, { dir: [1, 0, -1], lam: 1 }, { dir: [1, 2, 1], lam: 3 }];
  const PRESETS = [['Stretch', A], ['Mirror', MIR], ['Shear', SHR], ['Quarter turn', QT]];
  const O2 = [0, 0], O3 = [0, 0, 0];
  const W1 = [-2, 2];                                   // the puzzle's arrow, on A's λ = 2 line
  const GIVEN5 = 5, OTHER = eig2(D4).tr - GIVEN5;       // [4 1; 2 3]: one eigenvalue given, the other from the trace
  const lineOf = (M, lam) => eig2(M).lines.find((l) => near(l.lam, lam));
  // Where the columns may be dragged: whole points that keep Av's path on the pane.
  const XA = 3.3, YA = 2.3;
  function allowCol(M, k) {
    const o = [];
    for (let x = -3; x <= 3; x++) for (let y = -2; y <= 2; y++) {
      const N = M.map((r) => r.slice()); N[0][k] = x; N[1][k] = y;
      if (Math.hypot(N[0][0], N[0][1]) <= XA + 1e-9 && Math.hypot(N[1][0], N[1][1]) <= YA + 1e-9) o.push([x, y]);
    }
    return o;
  }

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // kind: 'sweep' (the probe and Av), 'grid' (the grid of A − λI) or '3d'. M, nm: the matrix and its name.
  // probe: v can be dragged; cols, presets: the matrix can be changed; slider: the λ slider shows.
  // A puzzle: task, opts, want, secret (what only a right answer shows), hints, slips (the red line drawn
  // for each wrong answer), why, fb (seconds of motion after a right and a wrong answer).
  const PICK = 'Tap one of the answers.';
  const ACT_V = 'Drag the tip of v round the circle. Near a lit line, v snaps onto it.';
  const ACT_L = 'Slide λ. The grid lies flat at each eigenvalue.';
  const O1 = ['(1, 1)', '(0, 1)', pt(W1)];
  const O3s = ['The shear', 'The quarter turn', 'The mirror'];
  const O5 = ['A matrix minus a number means nothing', 'λI keeps λ a whole number', 'I stops v being zero'];
  const O7 = [num(-GIVEN5), num(OTHER), num(eig2(D4).tr)];
  const O9 = ['(0, 0) is the eigenvector', '3 is not an eigenvalue', 'There is a slip in the working'];
  const R5 = eig2(M5).roots.slice().sort((a, b) => a - b);
  const O11 = [num(R5[0]) + ' and ' + num(R5[1]), '3 and 4', num(M5[0][0]) + ' and ' + num(M5[1][1])];
  const O12 = ['6 with (1, −2), 1 with (2, 1)', '6 with (2, 1), 1 with (0, 0)', '6 with (2, 1), 1 with (1, −2)'];
  const BOX3 = [[-3.5, 3.5], [-2.5, 2.5]], GBOX = [[-4.2, 4.2], [-2.6, 2.6]];
  const STEPS = [
    { show: true, key: 'sweep', kind: 'sweep', M: A, nm: 'A', probe: true, dur: 4.6, name: 'Arrows that keep their line', act: ACT_V,
      text: 'A matrix usually knocks an arrow off its own line. Along a few directions it only stretches or squishes the arrow. Take `A = [3 1; 0 2]`. The probe `(0, 1)` gives `(1, 2)`, which points somewhere else. Along `(1, 0)`, Av is `(3, 0)`. That is 3 lots of v, so the line lights and `λ = 3`. Along `(−1, 1)`, Av is twice v, so `λ = 2`. Such an arrow is an *eigenvector*. λ is its *eigenvalue*, the factor it is stretched by.' },
    { key: 'which', kind: 'sweep', M: A, nm: 'A', fit: [[-4, 4], [4, 2], [1, 2]], rows: 1, fb: [1.4, 0.9], name: 'Which keeps its line?',
      task: 'For `A = [3 1; 0 2]`, which arrow stays on its own line?',
      opts: O1, want: pt(W1), secret: pt(W1),
      hints: { '(1, 1)': 'Not quite. A(1, 1) = (4, 2), which is not a number times (1, 1).',
        '(0, 1)': 'Not quite. A(0, 1) is column 2, (1, 2), which points off the line through (0, 1).' },
      slips: { '(1, 1)': 'A(1, 1) = ' + pt(mul(A, [1, 1])) + ', off its line', '(0, 1)': 'A(0, 1) = ' + pt(mul(A, [0, 1])) + ', off its line' },
      why: '`(−2, 2)` is 2 lots of `(−1, 1)`, so it lies on the lit line. `A(−2, 2) = (−4, 4)`, which is still 2 lots. Each eigenvector is really a whole line of them, because any multiple works too.' },

  K.check('Each demonstration passes and ends where the lesson says: v at (0, 1) with Av = (1, 2), then at (1, 0) with λ = 3, ending on the line through (−1, 1) with λ = 2; the mirror lighting (1, 1) with λ = 1, ending on (1, −1) with λ = −1; A − λI flat at λ = 2 crushing (−1, 1), at λ = 3 crushing (1, 0), ending at 2; B − λI flat at 1 crushing (1, 1), ending at 3 crushing (1, −1); B’s lines (1, 1) with 1 and (1, −1) with 3; C’s three lines with 0 (dashed), 1 and 3', () => {

  K.check('While each demonstration plays, the rule holds at every moment: Av is always A times v; a line is lit only while Av lies along v’s line, with Av = λv; the grid drawn is always A − λI, and a crushed line appears only while its area scale is 0 and is sent to zero', () => {
