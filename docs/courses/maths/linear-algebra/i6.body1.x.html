<p class="caption">Every flag, card, amount and litre here is worked out from the matrix on the card.</p>

<script>
  // ---------- numbers and words (pure, so the checks can test them) ----------
  const MINUS = '−', NB = ' ';
  function num(v, dp) { const f = Math.pow(10, dp == null ? 2 : dp); let r = Math.round(v * f) / f; if (Math.abs(r) < 1e-9) r = 0; return (r < 0 ? MINUS : '') + String(Math.abs(r)); }
  const pt = (v, dp) => '(' + v.map((x) => num(x, dp)).join(', ') + ')';
  const mstr = (M, dp) => '[' + M.map((r) => r.map((x) => num(x, dp)).join(' ')).join('; ') + ']';
  const parsePt = (s) => { const m = String(s).match(/\(([^)]+)\)/); return m ? m[1].split(',').map((x) => +x.trim().replace(MINUS, '-')) : null; };
  const parseM = (s) => { const m = String(s).match(/\[([^\]]+)\]/); return m ? m[1].split(';').map((r) => r.trim().split(/\s+/).map((x) => +x.replace(MINUS, '-'))) : null; };
  const say = (s) => String(s).replace(/ /g, ' ').replace(/×/g, ' times ').replace(/−/g, ' minus ').replace(/=/g, ' equals ').replace(/≈/g, ' about ').replace(/\s+/g, ' ').trim();
  const SUPS = '⁰¹²³⁴⁵⁶⁷⁸⁹';
  const sup = (n) => String(n).replace(/\d/g, (c) => SUPS[+c]);
  const pw = (nm, n) => nm + (n === 1 ? '' : sup(n));

  // ---------- vectors and matrices ----------
  const add = (a, b) => a.map((x, k) => x + b[k]);
  const sub = (a, b) => a.map((x, k) => x - b[k]);
  const scl = (a, s) => a.map((x) => x * s);
  const dot = (a, b) => a.reduce((s, x, k) => s + x * b[k], 0);
  const len = (a) => Math.sqrt(dot(a, a));
  const unit = (a) => scl(a, 1 / (len(a) || 1));
  const cross2 = (a, b) => a[0] * b[1] - a[1] * b[0];
  const near = (a, b, t) => Math.abs(a - b) < (t || 1e-9);
  const same = (a, b, t) => !!a && !!b && a.length === b.length && a.every((x, k) => near(x, b[k], t || 1e-7));
  const sameR = (a, b) => !!a && !!b && a.length === b.length && a.every((x, k) => Math.abs(x - b[k]) <= 1e-9 * (1 + Math.abs(b[k])));
  const sameM = (P, Q) => P.length === Q.length && P.every((r, i) => same(r, Q[i]));
  const lerpV = (a, b, e) => (e >= 1 ? b.slice() : e <= 0 ? a.slice() : a.map((x, k) => x + (b[k] - x) * e));
  const mul = (M, x) => M.map((r) => dot(r, x));
  const mm = (P, Q) => P.map((r) => Q[0].map((_, j) => r.reduce((s, x, k) => s + x * Q[k][j], 0)));
  const I2 = [[1, 0], [0, 1]];
  function mpow(M, n) { let R = I2; for (let k = 0; k < n; k++) R = mm(R, M); return R; }
  const lerpM = (P, Q, e) => P.map((r, i) => r.map((x, j) => x + (Q[i][j] - x) * e));
  // Part-way through a step, the picture moves straight from one whole power to the next.
  function mpowF(M, x) { const k = Math.max(0, Math.floor(x + 1e-9)), f = x - k; return f < 1e-9 ? mpow(M, k) : lerpM(mpow(M, k), mpow(M, k + 1), f); }
  const det2 = (M) => M[0][0] * M[1][1] - M[0][1] * M[1][0];
  const inv2 = (M) => { const d = det2(M); return [[M[1][1] / d, -M[0][1] / d], [-M[1][0] / d, M[0][0] / d]]; };
  const diag = (a, b) => [[a, 0], [0, b]];
  const fromCols = (a, b) => [[a[0], b[0]], [a[1], b[1]]];
  const minusI = (M, l) => M.map((r, i) => r.map((x, j) => (i === j ? x - l : x)));
  const sameLine = (a, b) => len(a) > 1e-9 && len(b) > 1e-9 && Math.abs(cross2(unit(a), unit(b))) < 1e-7;
  const stepBy = (M, q, k) => { let v = q; for (let j = 0; j < k; j++) v = mul(M, v); return v; };
  function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { const t = a % b; a = b; b = t; } return a; }
  // A direction in whole numbers where it can be, its first part that is not 0 made positive.
  function tidy(v) {
    const k = v.findIndex((x) => Math.abs(x) > 1e-9);
    if (k < 0) return v.map(() => 0);
    let w = v[k] < 0 ? scl(v, -1) : v.slice();
    const m = Math.min(...w.filter((x) => Math.abs(x) > 1e-9).map(Math.abs));
    w = scl(w, 1 / m);
    for (let q = 1; q <= 12; q++) {
      const u = scl(w, q);
      if (u.every((x) => Math.abs(x - Math.round(x)) < 1e-7)) { const r = u.map(Math.round), g = r.reduce((s, x) => gcd(s, x), 0) || 1; return r.map((x) => x / g + 0); }
    }
    return unit(w);
  }
  // The direction a 2 by 2 crushes, from its bigger row (p, q): p v1 + q v2 = 0 along (−q, p).
  function crushed(N) {
    const n0 = Math.hypot(N[0][0], N[0][1]), n1 = Math.hypot(N[1][0], N[1][1]);
    if (n0 < 1e-9 && n1 < 1e-9) return null;
    const row = n0 >= n1 ? N[0] : N[1];
    return tidy([-row[1], row[0]]);
  }
  // Every real eigenvalue and its line: the roots of λ² − (a + d)λ + (ad − bc) = 0, then (A − λI)v = 0.
  function eig2(M) {
    const a = M[0][0], b = M[0][1], c = M[1][0], d = M[1][1], tr = a + d, dt = a * d - b * c, disc = tr * tr - 4 * dt;
    const res = { tr, dt, disc, roots: [], lines: [], all: false, lam: null };
    if (disc < -1e-12) return res;
    const sq = Math.sqrt(Math.max(0, disc));
    res.roots = [(tr + sq) / 2, (tr - sq) / 2];
    (sq < 1e-9 ? [tr / 2] : res.roots).forEach((r) => {
      const dir = crushed(minusI(M, r));
      if (!dir) { res.all = true; res.lam = r; return; }
      res.lines.push({ dir, u: unit(dir), lam: Math.round(r * 1e9) / 1e9 });
    });
    return res;
  }
  // Any arrow w: on its own line when Aw is a number times w; then λ is that number.
  function onLine(M, w) {
    if (len(w) < 1e-9) return null;
    const av = mul(M, w);
    if (Math.abs(cross2(w, av)) > 1e-7 * (1 + len(av))) return null;
    return { u: unit(w), lam: dot(av, w) / dot(w, w) };
  }
  const lamOf = (M, v) => { const l = onLine(M, v); return l ? Math.round(l.lam * 1e9) / 1e9 : null; };
  // Where a line through p along d crosses a box: its range of t, or null.
  function clipLine(p, d, bx) {
    let t0 = -Infinity, t1 = Infinity;
    for (let k = 0; k < p.length; k++) {
      if (Math.abs(d[k]) < 1e-12) { if (p[k] < bx[k][0] - 1e-9 || p[k] > bx[k][1] + 1e-9) return null; continue; }
      let a = (bx[k][0] - p[k]) / d[k], b = (bx[k][1] - p[k]) / d[k];
      if (a > b) { const s = a; a = b; b = s; }
      t0 = Math.max(t0, a); t1 = Math.min(t1, b);
    }
    return t1 >= t0 - 1e-9 ? [t0, Math.max(t0, t1)] : null;
  }
  // A polygon cut to a box (each edge in turn).
  function clipPoly(poly, bx) {
    let out = poly;
    [[0, bx[0][0], 1], [0, bx[0][1], -1], [1, bx[1][0], 1], [1, bx[1][1], -1]].forEach(([k, v, sg]) => {
      const inp = out; out = [];
      const inside = (q) => sg * (q[k] - v) >= -1e-12;
      for (let j = 0; j < inp.length; j++) {
        const P0 = inp[j], Q0 = inp[(j + 1) % inp.length], pi = inside(P0), qi = inside(Q0);
        if (pi) out.push(P0);
        if (pi !== qi) out.push(lerpV(P0, Q0, (v - P0[k]) / (Q0[k] - P0[k])));
      }
    });
    return out;
  }

  // ---------- the lesson's values ----------
  const A = [[3, 1], [0, 2]], SHR = [[1, 1], [0, 1]], JOR = [[2, 1], [0, 2]], M13 = [[0.7, 0.2], [0.2, 0.7]], TWO_I = [[2, 0], [0, 2]];
  const E1 = [1, 0], E2 = [-1, 1];                       // A's eigenvectors, as the lesson writes them
  const P = fromCols(E1, E2), PI = inv2(P), D = diag(lamOf(A, E1), lamOf(A, E2));
  const PS = fromCols(E2, E1), DS = diag(lamOf(A, E2), lamOf(A, E1));   // P's columns the other way round
  const V1 = [1, 1], AM1 = mul(PI, V1);                  // (1, 1) is 2 lots of (1, 0) plus 1 lot of (−1, 1)
  const NMAX = 10, N1 = 3, N2 = 4, N7 = 10, N9 = 4, N10 = 5, N13 = 20;
  const AM3 = mul(mpow(D, N1), AM1);
  // The pumped tanks: each hour 20% of tank 1 goes to tank 2 and 30% of tank 2 comes back.
  const LITRES = 1000, OUT1 = 0.2, OUT2 = 0.3;
  const PUMP = [[1 - OUT1, OUT2], [OUT1, 1 - OUT2]];
  const START = [LITRES, 0], PE1 = [3, 2], PE2 = [1, -1];
  const PP = fromCols(PE1, PE2), PPI = inv2(PP), PDg = diag(lamOf(PUMP, PE1), lamOf(PUMP, PE2));
  const PART = mul(PPI, START), STEADY = scl(PE1, PART[0]);   // 200 lots of (3, 2), 400 of (1, −1); heads for (600, 400)
  const tanks = (x) => mul(mpowF(PUMP, x), START);
  // The last puzzle's matrix and its two lines.
  const SE1 = [1, 1], SE2 = [1, -1], START13 = [1, 0];
  const L13a = lamOf(M13, SE1), L13b = lamOf(M13, SE2), PART13 = mul(inv2(fromCols(SE1, SE2)), START13);
  // The flag: an F, its pole up the y axis. The dot marks the top of the pole, 1 lot of each eigenvector.
  const FLAG = [[0, 0], [0.2, 0], [0.2, 0.45], [0.45, 0.45], [0.45, 0.62], [0.2, 0.62], [0.2, 0.82], [0.6, 0.82], [0.6, 1], [0, 1]];
  const CORNER = [0, 1];
  const PRESETS = [['Stretch', A], ['Pumps', PUMP], ['Shear', SHR]];
  const basisOf = (M) => (sameM(M, A) ? [E1, E2] : null);
  const SW_WHY = 'There is no second eigenvector line to make a grid from.';

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // M: the matrix in view; taps: the Step buttons show (true, or 'after' a right answer); sw: the grid switch shows;
  // presets: the three preset matrices show; views: which pictures the step can draw (for its key); rows: lines of
  // working under the picture. A demonstration's demo() gives n and the grid's mix (0 square, 1 eigenvector) at time T.
  // A puzzle: task, opts, want, secret (what only a right answer shows), hints, slips (the red line drawn for each
  // wrong answer), why, fb (seconds of motion after a right and a wrong answer).
  const PICK = 'Tap one of the answers.';
  const O2s = [pt(scl(E1, lamOf(A, E1) * N2)), pt(stepBy(A, E1, N2)), pt(mul(A, E1))];
  const O4s = [pt(AM3), pt(mul(D, AM1)), pt([AM1[0] * D[0][0] * N1, AM1[1] * D[1][1] * N1])];
  const O6s = [mstr(D), mstr(A), mstr(DS)];
  const O8s = ['P and P⁻¹ should swap places', 'Nothing is wrong', 'D was not cubed'];
  const O10s = [num(tanks(N10)[0], 1) + ' L', num(tanks(N9)[0], 1) + ' L', num(STEADY[0]) + ' L'];
  const O12s = ['Yes, it has two eigenvalues', 'No, it has only one eigenvector line', 'Yes, every 2 by 2 can'];
  const O13s = ['Still the line through ' + pt(START13), 'The line through ' + pt(SE2), 'The line through ' + pt(SE1)];
  const SWAPROW = 'A' + pt(E2) + ' = ' + num(DS[0][0]) + pt(E2) + ' and A' + pt(E1) + ' = ' + num(DS[1][1]) + pt(E1);
  const STEPS = [
    { show: true, key: 'square', name: 'The same step, again', M: A, taps: true, sw: true, views: ['flag'], dur: 3.6,
      demo: () => ({ n: taps(0.5, N1, 1.05, 0.85), mix: 0 }),
      act: 'Tap Step to apply A once more. Back a step and Reset take it down again.',
      text: 'Some changes repeat, like a pump that runs every hour. Doing a matrix step n times means working out `Aⁿ`. Take `A = [3 1; 0 2]` again. Each step moves the flag by A once more, so it leans further and grows. A dot marks the top of its pole. The card reads `A² = [9 5; 0 4]`, then `A³ = [27 19; 0 8]`. Each power is one more full multiplication. That is slow, and it hides where the steps are heading.' },
    { key: 'four', name: 'Four steps along (1, 0)', M: A, taps: 'after', views: ['four'], rows: 1, fb: [2.1, 0.9],
      act: 'Tap Step or Back a step to check it one step at a time.',
      task: '`(1, 0)` is an eigenvector of A with eigenvalue 3. Where is it after four steps?',
      opts: O2s, want: O2s[1], secret: O2s[1],
      hints: { [O2s[0]]: 'Not quite. Each step multiplies by 3 again, so the 3s multiply rather than add.',
        [O2s[2]]: 'Not quite. (3, 0) is where it is after one step. Take three more.' },
      slips: { [O2s[0]]: '3 × ' + N2 + ' = ' + num(3 * N2) + ' adds the steps up', [O2s[2]]: 'A(1, 0) = ' + pt(mul(A, E1)) + ' is only one step' },
      why: 'An eigenvector is only stretched. Each step multiplies `(1, 0)` by 3 again. So four steps multiply it by `3 × 3 × 3 × 3 = 81`. That gives `(81, 0)`, still on the same line.' },
    { show: true, key: 'eig', name: 'Measure along the eigenvectors', M: A, taps: true, sw: true, views: ['flag'], dur: 4.3,

    const p = { bx, s, area: { x0: PX0 + 3, y0: L.top + 3, x1: PX0 + PW - 3, y1: L.top + L.PH - 3 } };
    p.map = (q) => [PX0 + (q[0] - bx[0][0]) * s, L.top + (bx[1][1] - q[1]) * s];
    put(K.svg('rect', { class: 'pane', x: PX0, y: L.top, width: PW, height: L.PH, rx: 8 }));
    PAN = p;
    const B = o.basis, mix = B ? o.mix || 0 : 0, lv = levels(s, o.minG == null ? 1 : o.minG), sqA = 1 - mix;
    if (sqA > 0) part(sqA, () => { gridFam([1, 0], [0, 1], lv, 'grid'); gridFam([0, 1], [1, 0], lv, 'grid'); });
    if (B && mix > 0) part(mix, () => { gridFam(B[0], B[1], lv, 'eg'); gridFam(B[1], B[0], lv, 'eg'); });
    if (sqA > 0) part(sqA, () => [[1, 0], [0, 1]].forEach((u) => { const r = clipLine([0, 0], u, bx); if (r) line2('axis', scl(u, r[0]), scl(u, r[1])); }));
    (o.lit || []).forEach((l) => { if (l.a > 0) { litLine(unit(l.u), l.a, l.lab); REC.lit.push({ u: l.u, a: l.a, lab: l.lab }); } });
    REC.box = bx; REC.s = s; REC.g = lv.g;
    return p;
  }

  // ---------- the cards: matrices with brackets, in one row ----------
  function cardW(label, Es, sm) {
    const cls = sm ? 'en s' : 'en', n = Es[0].length, cw = [];
    for (let j = 0; j < n; j++) cw.push(Math.max(...Es.map((r) => tw(r[j], cls))) + (sm ? 11 : 14));
    const wM = cw.reduce((s, x) => s + x, 0) + 6, lw = label ? tw(label, sm ? 'mx s' : 'mx') + 8 : 0;
    return { cw, wM, lw, w: lw + wM };
  }
  function cardAt(x0, cy, label, Es, wd, sm, hlA) {
    const rg = sm ? 18 : 20, m = Es.length, xb = x0 + wd.lw;
    if (label) text2(x0, cy + 6, label, sm ? 'mx s' : 'mx', 'start');
    if (hlA > 0) part(hlA, () => put(K.svg('rect', { class: 'hlc', x: r3(xb - 2), y: r3(cy - m * rg / 2 - 6), width: r3(wd.wM + 4), height: r3(m * rg + 12), rx: 6 })));
    const top = cy - m * rg / 2 - 3, bot = cy + m * rg / 2 + 3;
    put(K.svg('path', { class: 'brk', d: 'M' + r3(xb + 6) + ' ' + r3(top) + ' H' + r3(xb) + ' V' + r3(bot) + ' H' + r3(xb + 6) }));
    put(K.svg('path', { class: 'brk', d: 'M' + r3(xb + wd.wM - 6) + ' ' + r3(top) + ' H' + r3(xb + wd.wM) + ' V' + r3(bot) + ' H' + r3(xb + wd.wM - 6) }));
    Es.forEach((r, i) => r.forEach((s, j) => {
      const x = xb + 3 + wd.cw.slice(0, j).reduce((a, b) => a + b, 0) + wd.cw[j] / 2, y = cy + (i - (m - 1) / 2) * rg + 5;
      text2(x, y, s, sm ? 'en s' : 'en');
    }));
  }
  // A card that fades in (a < 1) takes its room as it arrives, so the others slide over smoothly.
  function cards(list, cy) {
    cy = cy || 30;
    const full = (sm) => list.map((c) => cardW(c.label, c.Es, sm));
    let sm = false, ws = full(false), gap = 18;
    if (ws.reduce((s, w) => s + w.w, 0) + gap * (list.length - 1) > 326) { sm = true; ws = full(true); gap = 12; }
    const al = list.map((c) => (c.a == null ? 1 : c.a));
    const tot = ws.reduce((s, w, k) => s + w.w * al[k], 0) + list.reduce((s, c, k) => s + (k ? gap * al[k] : 0), 0);
    let x = W / 2 - tot / 2;
    list.forEach((c, k) => {
      if (k) x += gap * al[k];
      const x0 = x;
      part(al[k], () => cardAt(x0, cy, c.label, c.Es, ws[k], sm, 0));
      REC.cards.push({ label: c.label, Es: c.Es, a: al[k] });
      x += ws[k].w * al[k];
    });
  }
  const ents = (M, dp) => M.map((r) => r.map((x) => num(x, dp)));

  // ---------- the key under each picture (it wraps onto a second line when it must) ----------
  const KEYS = { flag: [['flag', 'the flag'], ['ghost', 'a step before'], ['litln', 'eigenvector line'], ['leg', 'the dot’s amounts']],
    tanks: [['water', 'water'], ['ref', 'where it heads']], four: [['litln', 'eigenvector line']],
    amts: [['litln', 'eigenvector line'], ['leg', 'amounts']], swap: [['litln', 'eigenvector line']],
    pdp: [['leg', 'amounts'], ['gl', 'before D']], settle: [['litln', 'eigenvector line'], ['trail', 'each step']] };
  function keyLines(list) {
    const lines = [];
    let cur = [], w = 0;
    list.forEach(([k, s]) => {
      const iw = 28 + tw(s, 'ttl');
      if (cur.length && w + 16 + iw > 326) { lines.push(cur); cur = []; w = 0; }
      w += (cur.length ? 16 : 0) + iw;
      cur.push({ k, s, w: iw });
    });
    if (cur.length) lines.push(cur);
    return lines;
  }
  function swatch(k, x, y) {
    if (k === 'flag' || k === 'ghost' || k === 'water') put(K.svg('rect', { class: k, x: r3(x + 3), y: y - 12, width: 16, height: 13, rx: 2 }));
    else if (k === 'trail') put(K.svg('circle', { class: 'trail', cx: r3(x + 11), cy: y - 5, r: 3 }));
    else put(K.svg('line', { class: k, x1: r3(x + 2), y1: y - 5, x2: r3(x + 20), y2: y - 5 }));
  }
  function drawKey(list, A0, y) {
    keyLines(list).forEach((ln, r) => {
      const yy = y + r * 22;
      let x = W / 2 - (ln.reduce((a, it) => a + it.w, 0) + 16 * (ln.length - 1)) / 2;
      ln.forEach((it) => {
        const a = A0[it.k] == null ? 1 : A0[it.k], x0 = x;
        part(a, () => { swatch(it.k, x0, yy); text2(x0 + 28, yy, it.s, 'ttl', 'start'); });
        x += it.w + 16;
      });
    });
  }

  // ---------- the flag after n steps of M (n may be part-way through a step) ----------
  // mix: 0 the square grid, 1 the eigenvector grid (only for a matrix with two eigenvector lines).
  function flagScene(L, M, n, mix, o) {
    o = o || {};
    const B = basisOf(M), k = Math.round(n), Mn = mpowF(M, n), Q = FLAG.map((q) => mul(Mn, q));
    const c = Math.ceil(n - 1e-9), Qg = c >= 1 ? FLAG.map((q) => mul(mpow(M, c - 1), q)) : null;
    mix = B ? mix : 0;
    if (!o.noCards) {
      const list = [{ label: pw(o.nm || 'A', k) + ' =', Es: ents(mpow(M, k)) }];
      if (B) list.push({ label: pw('D', k) + ' =', Es: ents(mpow(diag(lamOf(M, B[0]), lamOf(M, B[1])), k)), a: mix });
      cards(list);
    }
    let lit = B ? B.map((u) => ({ u, a: mix, lab: 'λ = ' + num(lamOf(M, u)) })) : [];
    if (o.oneLine) { const e = eig2(M); if (!e.all && e.lines.length === 1) lit.push({ u: e.lines[0].u, a: 1, lab: 'λ = ' + num(e.lines[0].lam) }); }
    lit = lit.concat(o.lit || []);
    planePane(L, Q.concat(o.fit || []), { smax: 60, minG: 1, mix, basis: B, lit });
    if (Qg) poly('ghost', Qg);
    poly('flag', Q);
    const Cw = mul(Mn, CORNER), Ck = mul(mpow(M, k), CORNER), la = labA(n);
    let amk = null, am = null;
    if (B) {
      const Bi = inv2(fromCols(B[0], B[1]));
      am = mul(Bi, Cw); amk = mul(Bi, Ck);
      if (mix > 0) part(mix, () => { segW('leg', [0, 0], scl(B[0], am[0])); segW('leg', scl(B[0], am[0]), Cw); });
    }
    dotD('cdot', Cw, 4.5);
    const onEig = !!B && mix >= 0.5, cornerTxt = onEig ? 'amounts ' + pt(amk) : pt(Ck);
    labD(Cw, cornerTxt, 'nm', la);
    Object.assign(REC, { view: 'flag', n, k, mix, M, Mn, flag: Q, ghost: Qg, corner: Cw, amounts: am, amountsK: amk, cornerK: Ck });
    REC.keyA = { ghost: K.clamp(n, 0, 1), litln: REC.lit.reduce((m0, l) => Math.max(m0, l.a), 0), leg: B ? mix : 0 };
    REC.reads = [['Steps taken, n', String(k)], ['Zoom', (onEig ? '1 cell = ' : '1 square = ') + num(REC.g)]];
    REC.said.push('The flag after ' + k + (k === 1 ? ' step' : ' steps') + ' on the ' + (onEig ? 'eigenvector' : 'square') + ' grid, its dot at ' + cornerTxt + '.');
    REC.cards.forEach((cd) => { if (cd.a >= 0.5) REC.said.push('The card reads ' + cd.label + ' ' + '[' + cd.Es.map((r) => r.join(' ')).join('; ') + '].'); });
  }

  // ---------- the tanks after n hours: water as bars, the 600 L and 400 L they head for, and the part above ----------
  const TX = [[62, 132], [250, 320]];
  function tanksScene(L, n, o) {
    o = o || {};
    const v = tanks(n), k = Math.round(n), vk = tanks(k), la = labA(n), top = L.top;
    cards([{ label: 'A =', Es: ents(PUMP) }]);
    put(K.svg('rect', { class: 'pane', x: PX0, y: top, width: PW, height: L.PH, rx: 8 }));
    PAN = { area: { x0: PX0 + 3, y0: top + 3, x1: PX0 + PW - 3, y1: top + L.PH - 3 } };
    const base = top + L.PH - 32, Ht = L.PH - 66, yOf = (l) => base - (l / LITRES) * Ht;
    [0, 1].forEach((j) => {
      const [a, b] = TX[j], lv = yOf(v[j]);
      if (base - lv > 0.05) put(K.svg('rect', { class: 'water', x: a, y: r3(lv), width: b - a, height: r3(base - lv) }));
      put(K.svg('path', { class: 'tank', d: 'M' + a + ' ' + r3(base - Ht) + ' V' + r3(base) + ' H' + b + ' V' + r3(base - Ht) }));
      REC.segs.push([a, base - Ht, a, base], [a, base, b, base], [b, base, b, base - Ht]);
      const yr = yOf(STEADY[j]);

      part(la, () => text2((a + b) / 2, base - Ht - 9, num(vk[j], 1) + ' L', 'nm'));
      text2((a + b) / 2, base + 20, 'Tank ' + (j + 1), 'ttl');
      text2(a - 8, yr + 5, num(STEADY[j]) + ' L', 'sm', 'end');
    });
    // The part above 600 L: its lots of (1, −1), read from the eigenvector split.
    const gk = mul(PPI, vk)[1], y6 = yOf(STEADY[0]), yw = yOf(v[0]), bx0 = TX[0][1] + 9;
    if (y6 - yw > 1) put(K.svg('path', { class: 'brk', d: 'M' + (bx0 - 4) + ' ' + r3(yw) + ' H' + bx0 + ' V' + r3(y6) + ' H' + (bx0 - 4) }));
    part(la, () => text2(bx0 + 6, (y6 + yw) / 2 + 5, num(gk, 1) + ' L above', 'tag', 'start'));
    if (o.row) row(pt(vk, 1) + ' = ' + num(PART[0]) + pt(PE1) + ' + ' + num(gk, 1) + pt(PE2), 'rw');
    Object.assign(REC, { view: 'tanks', n, k, M: PUMP, tanks: v, tanksK: vk, gapK: gk });
    REC.reads = [['Hours, n', String(k)]];
    REC.said.push('Two tanks after ' + k + (k === 1 ? ' hour' : ' hours') + '. Tank 1 holds ' + num(vk[0], 1) + ' L and tank 2 holds ' + num(vk[1], 1) + ' L. Tank 1 is ' + num(gk, 1) + ' L above 600 L.');
  }

  // ---------- the scenes ----------
  const SC = {};
  // A demonstration: the flag (or the tanks) stepping, until he taps or switches; then the picture is his.
  function showScene(d, st, i, L) {
    const M = st.M || d.M, B = basisOf(M);
    let n, mix;
    if (st.live) { n = liveN(st); mix = liveMix(st, B); } else { const o = d.demo(); n = o.n; mix = B ? o.mix : 0; }
    if (sameM(M, PUMP)) tanksScene(L, n, { row: true });
    else {
      flagScene(L, M, n, mix, { oneLine: !B });
      if (d.rowFn) row(d.rowFn(REC.k), 'rw');
    }
    REC.gridOn = st.live ? !!(st.grid && B) : mix >= 0.5;
  }
  SC.square = SC.eig = SC.power = SC.tanks = SC.shear = showScene;

  // (1, 0) on its eigenvector line; a right answer steps it four times.
  SC.four = (d, st, i, L) => {
    const right = st.res === 'right', wrong = st.res === 'wrong';
    const n = st.live ? liveN(st) : right ? taps(0, N2, 0.42, 0.4) : 0, k = Math.round(n);
    const bad = wrong ? lerpV(E1, parsePt(st.pick), go(0, 0.6)) : null, tip = mul(mpowF(A, n), E1);
    cards([{ label: 'A =', Es: ents(A) }]);
    planePane(L, [tip, [0, 1], [0, -0.4]].concat(bad ? [bad] : []), { smax: 60, lit: [{ u: E1, a: 1, lab: 'λ = ' + num(lamOf(A, E1)) }] });
    if (bad) { arrowD('pv bad', [0, 0], bad, 10); labD(bad, st.pick, 'lbad'); }
    arrowD('pv', [0, 0], tip, 10);
    labD(tip, pt(stepBy(A, E1, k)), 'nm', labA(n));
    Object.assign(REC, { view: 'four', n, k, M: A, tip });
    REC.reads = [['Steps taken, n', String(k)], ['Zoom', '1 square = ' + num(REC.g)]];
    REC.said.push('The arrow (1, 0) after ' + k + ' steps of A is ' + pt(stepBy(A, E1, k)) + ', on its eigenvector line.');
    if (right) {
      const a = st.live ? 1 : arr(1.66, 0.4), l = lamOf(A, E1);
      row(num(l) + sup(N2) + ' = ' + num(Math.pow(l, N2)) + ', so it lands on ' + pt(stepBy(A, E1, N2)), 'rw rok', a);
      if (a > 0 && k >= N2) REC.reveal++;
    } else if (wrong) row(d.slips[st.pick], 'rw rbad', arr(0.3, 0.5));
  };
  // (1, 1) on the eigenvector grid, read as amounts; a right answer steps it three times.
  SC.amts = (d, st, i, L) => {
    const right = st.res === 'right', wrong = st.res === 'wrong';
    const n = right ? taps(0, N1, 0.5, 0.45) : 0, k = Math.round(n);
    const badAm = wrong ? parsePt(st.pick) : null, bad = badAm ? lerpV(V1, mul(P, badAm), go(0, 0.6)) : null;
    const tip = mul(mpowF(A, n), V1), am = mul(PI, tip);
    cards([{ label: 'A =', Es: ents(A) }, { label: 'D =', Es: ents(D) }]);
    planePane(L, [tip, scl(E1, am[0]), [0, 1.2], [-1, 0]].concat(bad ? [bad] : []), { smax: 60, mix: 1, basis: [E1, E2],
      lit: [E1, E2].map((u) => ({ u, a: 1, lab: 'λ = ' + num(lamOf(A, u)) })) });
    segW('leg', [0, 0], scl(E1, am[0])); segW('leg', scl(E1, am[0]), tip);
    if (bad) { arrowD('pv bad', [0, 0], bad, 10); labD(bad, 'amounts ' + st.pick, 'lbad'); }
    arrowD('pv', [0, 0], tip, 10);
    const amk = mul(PI, stepBy(A, V1, k));
    labD(tip, 'amounts ' + pt(amk), 'nm', labA(n));
    Object.assign(REC, { view: 'amts', n, k, M: A, tip, amountsK: amk });
    REC.keyA = { litln: 1, leg: 1 };
    REC.reads = [['Steps taken, n', String(k)], ['Zoom', '1 cell = ' + num(REC.g)]];
    REC.said.push('The arrow ' + pt(stepBy(A, V1, k)) + ' on the eigenvector grid, with amounts ' + pt(amk) + '.');
    if (right) {
      const a = arr(1.45, 0.4);
      row(pt(AM3) + ' means ' + num(AM3[0]) + pt(E1) + ' + ' + num(AM3[1]) + pt(E2) + ' = ' + pt(mul(P, AM3)), 'rw rok', a);
      if (a > 0) REC.reveal++;
    } else if (wrong) row(d.slips[st.pick], 'rw rbad', arr(0.3, 0.5));
  };
  // P's columns swapped: column 1 is (−1, 1), column 2 is (1, 0); a right answer shows what A does to each.
  SC.swap = (d, st, i, L) => {
    const right = st.res === 'right', wrong = st.res === 'wrong', a = right ? arr(0, 0.6) : 0;
    cards([{ label: 'P =', Es: ents(PS) }, { label: 'D =', Es: ents(DS), a }]);
    planePane(L, [[-3, 3], [3, 0], [0, -0.5]], { smax: 60, lit: [E2, E1].map((u) => ({ u, a: 1 })) });
    [[E2, 'column 1'], [E1, 'column 2']].forEach(([u, nm]) => {
      if (right) part(a, () => arrowD('av', [0, 0], mul(A, u), 11));
      arrowD('pv', [0, 0], u, 9);
      labD(u, nm, 'sm');
      if (right) labD(mul(A, u), num(lamOf(A, u)) + ' lots', 'nm', a);
    });
    if (wrong && st.pick === O6s[0]) {
      const w = scl(E2, lamOf(A, E1)), b = arr(0, 0.5);
      part(b, () => arrowD('av bad', [0, 0], w, 11));
      labD(w, num(lamOf(A, E1)) + ' lots', 'lbad', b);
    }
    Object.assign(REC, { view: 'swap', M: A });
    REC.said.push('P’s columns: column 1 is ' + pt(E2) + ' and column 2 is ' + pt(E1) + ', each on its eigenvector line.');
    if (right) { const b = arr(0.5, 0.5); row(SWAPROW, 'rw rok', b); if (b > 0) REC.reveal++; }
    else if (wrong) row(d.slips[st.pick], 'rw rbad', arr(0, 0.5));

  // PDP⁻¹ worked out without the power: one step. A right answer cubes D and takes the flag on to three steps.
  SC.cubed = (d, st, i, L) => {
    const right = st.res === 'right', wrong = st.res === 'wrong';
    const n = right ? 1 + taps(0.2, 2, 0.6, 0.5) : 1;
    cards([right ? { label: 'PD' + sup(3) + 'P⁻¹ =', Es: ents(mm(mm(P, mpow(D, 3)), PI)) } : { label: 'PDP⁻¹ =', Es: ents(mm(mm(P, D), PI)) }]);
    flagScene(L, A, n, 0, { noCards: true });
    if (right) { const a = arr(1.3, 0.4); row('PD' + sup(3) + 'P⁻¹ = A' + sup(3) + ', three steps of A', 'rw rok', a); if (a > 0) REC.reveal++; }
    else if (wrong) row(d.slips[st.pick], 'rw rbad', arr(0, 0.5));
  };
  // The tanks after four hours; a right answer runs one more hour.
  SC.five = (d, st, i, L) => {
    const right = st.res === 'right', wrong = st.res === 'wrong';
    tanksScene(L, right ? N9 + go(0, 0.8) : N9, { row: false });
    if (right) {
      const a = arr(0.8, 0.4);
      row(num(STEADY[0]) + ' + ' + num(PART[1]) + ' × ' + num(PDg[1][1]) + sup(N10) + ' = ' + num(tanks(N10)[0], 1), 'rw rok', a);
      if (a > 0) REC.reveal++;
    } else if (wrong) row(d.slips[st.pick], 'rw rbad', arr(0, 0.5));
  };
  // [2 1; 0 2] one step on; a right answer lights its only eigenvector line.
  SC.jordan = (d, st, i, L) => {
    const right = st.res === 'right', wrong = st.res === 'wrong', a = right ? arr(0, 0.5) : 0, l = eig2(JOR).lines[0];
    cards([{ label: 'A =', Es: ents(JOR) }]);
    flagScene(L, JOR, 1, 0, { noCards: true, lit: right ? [{ u: l.u, a, lab: 'λ = ' + num(l.lam) + ', the only line' }] : [] });
    if (right) { const b = arr(0.3, 0.5); row('A − ' + num(l.lam) + 'I = ' + mstr(minusI(JOR, l.lam)) + ', so ' + pt(l.dir) + ' gives the only line', 'rw rok', b); if (a > 0) REC.reveal++; }
    else if (wrong) row(d.slips[st.pick], 'rw rbad', arr(0, 0.5));
  };
  // (1, 0) under M; a right answer takes 20 steps, the view zooming in as the arrow shrinks onto (1, 1)'s line.
  SC.settle = (d, st, i, L) => {
    const right = st.res === 'right', wrong = st.res === 'wrong';
    const n = right ? N13 * go(0, 1.7) : 0, k = Math.round(n), tip = mul(mpowF(M13, n), START13), r = len(tip) * 0.95;
    cards([{ label: 'M =', Es: ents(M13) }]);
    planePane(L, [tip, scl(unit(SE1), r), scl(unit(SE2), r), scl(unit(SE2), -r)], { smax: 1e6, minG: 0.01,
      lit: [[SE1, L13a], [SE2, L13b]].map(([u, l]) => ({ u, a: 1, lab: pt(u) + ', λ = ' + num(l) })) });
    if (right) for (let j = 1; j <= Math.floor(n + 1e-9); j++) {
      const q = stepBy(M13, START13, j);
      if (inBox(q, REC.box)) part(K.clamp((n - j + 0.25) * 4, 0, 1), () => dotD('trail', q, 2.6));
    }
    arrowD('pv', [0, 0], tip, 10);
    const a0 = right ? 1 - arr(0, 0.3) : 1, a1 = right ? arr(1.7, 0.3) : 0;
    labD(tip, 'start ' + pt(START13), 'nm', a0);
    labD(tip, 'after ' + N13 + ' steps', 'nm', a1);
    Object.assign(REC, { view: 'settle', n, k, M: M13, tip });
    REC.keyA = { litln: 1, trail: right ? K.clamp(n, 0, 1) : 0 };
    REC.reads = [['Steps taken, n', String(k)], ['Zoom', '1 square = ' + num(REC.g)]];
    REC.said.push('The arrow ' + pt(tip) + ' after ' + k + ' steps of M, with the lines through (1, 1) and (1, −1).');
    if (right) {
      const a = arr(1.7, 0.4), c1 = PART13[0] * Math.pow(L13a, N13);
