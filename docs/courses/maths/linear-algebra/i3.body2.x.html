<script>
  // ---------- numbers and words (pure, so the checks can test them) ----------
  const MINUS = '−', NB = ' ';
  function num(v, dp) { const f = Math.pow(10, dp == null ? 2 : dp); let r = Math.round(v * f) / f; if (Math.abs(r) < 1e-9) r = 0; return (r < 0 ? MINUS : '') + String(Math.abs(r)); }
  // Whole numbers and short decimals as they are; thirds and the like as fractions, exactly.
  function fr(v) {
    if (Math.abs(v * 100 - Math.round(v * 100)) < 1e-7) return num(v, 2);
    for (let q = 3; q <= 12; q++) { const p = v * q; if (Math.abs(p - Math.round(p)) < 1e-7) { const n = Math.round(p); return (n < 0 ? MINUS : '') + Math.abs(n) + '/' + q; } }
    return num(v, 2);
  }
  const pt = (v, dp) => '(' + v.map((x) => num(x, dp)).join(', ') + ')';
  const P3 = (s) => { const m = String(s).match(/\(([^)]+)\)/); return m ? m[1].split(',').map((x) => +x.trim().replace(MINUS, '-')) : null; };
  // A slider's quarter or half value: 2, ½, −1¾.
  const QS = ['', '¼', '½', '¾'];
  function tf(v) { const q = Math.round(Math.abs(v) * 4), w = Math.floor(q / 4), f = q % 4; return (v < 0 && q ? MINUS : '') + ((w || !f ? String(w) : '') + QS[f]); }
  const say = (s) => String(s == null ? '' : s).replace(/ /g, ' ').replace(/·/g, ' dot ').replace(/×/g, ' cross ').replace(/÷/g, ' divided by ')
    .replace(/√/g, ' root ').replace(/\|n\|/g, 'the size of n').replace(/−/g, ' minus ').replace(/=/g, ' equals ').replace(/[½]/g, ' a half').replace(/[¼]/g, ' a quarter').replace(/[¾]/g, ' three quarters').replace(/\s+/g, ' ').trim();

  // ---------- the rule ----------
  // A line is r = p + t v. A plane is every point whose step from its start is square to its
  // normal: n · (r − p) = 0, which multiplies out to ax + by + cz = d with (a, b, c) = n and d = n · p.
  const add = (a, b) => a.map((x, k) => x + b[k]);
  const sub = (a, b) => a.map((x, k) => x - b[k]);
  const scl = (a, s) => a.map((x) => x * s);
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const len = (a) => Math.sqrt(dot(a, a));
  const unit = (a) => scl(a, 1 / len(a));
  const near = (a, b, t) => Math.abs(a - b) < (t || 1e-9);
  const same = (a, b) => !!a && !!b && a.length === b.length && a.every((x, k) => near(x, b[k]));
  const clean = (a) => a.map((x) => { const r = Math.round(x * 1e9) / 1e9; return Math.abs(r) < 1e-12 ? 0 : r; });
  const lerp3 = (a, b, e) => (e >= 1 ? b.slice() : e <= 0 ? a.slice() : a.map((x, k) => x + (b[k] - x) * e));
  const onLine = (p, v, t) => clean(add(p, scl(v, t)));
  const reading = (n, p, r) => dot(n, sub(r, p));
  const meetT = (n, d, p, v) => { const nv = dot(n, v); return near(nv, 0) ? null : (d - dot(n, p)) / nv; };
  // A square tile in the plane: one edge level (square to z), the other up the slope.
  function axesOf(n) { let e1 = cross(n, [0, 0, 1]); if (len(e1) < 1e-9) e1 = [1, 0, 0]; e1 = unit(e1); return [e1, unit(cross(n, e1))]; }
  function tileOf(c, n, h) {
    const [e1, e2] = axesOf(n);
    return { c, n, h, e1, e2, d: dot(n, c), corners: [[1, 1], [1, -1], [-1, -1], [-1, 1]].map(([a, b]) => add(c, add(scl(e1, a * h), scl(e2, b * h)))) };
  }
  function eqT(n, d) {
    let s = '';
    n.forEach((a, k) => {
      if (near(a, 0)) return;
      const m = Math.abs(a);
      s += (s ? (a < 0 ? ' − ' : ' + ') : (a < 0 ? MINUS : '')) + (near(m, 1) ? '' : num(m)) + 'xyz'[k];
    });
    return (s || '0') + ' = ' + num(d);
  }
  const factT = (n, p) => n.map((a, k) => (k ? (a < 0 ? ' − ' : ' + ') : (a < 0 ? MINUS : '')) + num(Math.abs(a)) + '(' + 'xyz'[k] + (p[k] < 0 ? ' + ' : ' − ') + num(Math.abs(p[k])) + ')').join('') + ' = 0';
  const dotT = (a, b) => pt(a) + ' · ' + pt(b) + ' = ' + num(dot(a, b));

  // ---------- the lesson's values ----------
  const O = [0, 0, 0];
  const L0 = { p: [0, 1, 0], v: [1, 2, 0] };
  const TR = [-2, 3], TA = [-1, 2], SR = [-2, 2];
  const A2 = [1, 0, 2], B2 = [3, 4, 0];
  const A4 = [2, 1, 1], B4 = [5, 3, 1];
  const P = [1, 1, 3], N0 = [2, 1, 2], R0 = [2, 1, 2], D0 = dot(N0, P);
  const ON5 = [1, 3, 2];
  const Q7 = [1, 2, 0], N7 = [3, -1, 2], D7 = dot(N7, Q7);
  const U8 = [1, 0, -1], W8 = [0, 2, -1], UW = cross(U8, W8);
  const DA = [1, 1, 0], DB = [0, 1, 1], NN = cross(DA, DB);
  const CM = [1.5, 3, 1.5];
  const L11 = { p: [1, 0, 0], v: [0, 1, 1] }, N11 = [1, 1, 1], D11 = 5, C11 = [2, 1, 2];
  const S12 = [-2, -1, -2], E12 = [1, -2, 0];
  // Where a dragged test point and a dragged normal may go.
  const RX = [[-1, 4], [-2, 4], [-1, 6]], NX = [-3, 3];
  const W = 340, PH = 22 * Math.PI / 180, TH0 = -52;
  let H3 = 280;

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // scene: what the picture draws; dur: a SHOW step's demonstration; act: what he can do with the picture,
  // under it; sliders, dragR (the test point r), dragN (the tip of n); th: the view's turn; fit: every point
  // the step may draw, so the view's scale never jumps. A puzzle: task, opts, want, hints (one per wrong
  // answer), slips (the red line drawn for each), why, fb (seconds of motion after a right and a wrong answer).
  const PICK = 'Tap one of the answers.';
  const TURN = 'Drag the background to turn the view.';
  const box = (lo, hi) => { const o = []; for (let k = 0; k < 8; k++) o.push([k & 1 ? hi[0] : lo[0], k & 2 ? hi[1] : lo[1], k & 4 ? hi[2] : lo[2]]); return o; };
  const lineFit = () => [onLine(L0.p, L0.v, TR[0] - 0.4), onLine(L0.p, L0.v, TR[1] + 0.4)];
  const planeFit = () => box([-2, -2, -1], [4, 4, 6]);
  const O12 = ['Straight through, square on', 'Alongside, never meeting it', 'Lying in the plane'];
  const STEPS = [
    { show: true, key: 'line', scene: 'line', name: 'A start and a direction', dur: 3.4, sliders: ['t'],
      act: 'Move t to run the dot along the line. ' + TURN, fit: lineFit,
      text: 'A line in space is a start point plus any amount of one direction. Write the start as p and the direction as v. A point on the line is `r = p + t v`, where t is any number. At `t = 0` you are at the start. Each extra unit of t adds one more v. Take `p = (0, 1, 0)` and `v = (1, 2, 0)`. At `t = 2` the dot is at `(0, 1, 0)` + `(2, 4, 0)` = `(2, 5, 0)`.' },
    { kind: 'pick', key: 'at3', scene: 'at3', name: 'Where at t = 3?', rows: 1, fb: [1.6, 0.6], act: TURN,
      fit: () => lineFit().concat([[3, 6, 0], [1, 5, 0]]),
      task: 'The line is `(0, 1, 0) + t(1, 2, 0)`. Where is the dot at `t = 3`?',
      opts: ['(3, 6, 0)', '(3, 7, 0)', '(1, 5, 0)'], want: '(3, 7, 0)',
      hints: { '(3, 6, 0)': 'Not quite. That is 3v alone, from the origin. Start from p, then add 3v.',
        '(1, 5, 0)': 'Not quite. That takes 3 lots of p and one v. Take one p and 3 lots of v.' },
      slips: { '(3, 6, 0)': '3v alone starts at the origin, not at p', '(1, 5, 0)': '3p + v = (1, 5, 0) is off the line' },
      why: 'A point on the line is `p + t v`. At `t = 3` that is `(0, 1, 0)` + `(3, 6, 0)` = `(3, 7, 0)`.' },
    { show: true, key: 'two', scene: 'two', name: 'Through two points', dur: 3.4, sliders: ['ta'],
      act: 'Move t to slide the dot along. ' + TURN,
      fit: () => [onLine(A2, sub(B2, A2), TA[0] - 0.3), onLine(A2, sub(B2, A2), TA[1] + 0.3)],
      text: 'For the line through two points A and B, the direction is the step between them, B − A. Here `A = (1, 0, 2)` and `B = (3, 4, 0)`, so `B − A = (2, 4, −2)`. B − A is the whole step from A to B. So for t from 0 to 1, `A + t(B − A)` is a fraction t of the way along. `t = ½` gives the midpoint, `(2, 2, 1)`.' },
    { kind: 'pick', key: 'dir', scene: 'dir', name: 'Which direction?', rows: 1, fb: [1.5, 1.5], act: TURN,
      fit: () => [A4, B4, add(A4, [7, 4, 2]), add(A4, B4), onLine(A4, sub(B4, A4), -0.6), onLine(A4, sub(B4, A4), 1.6)],
      task: 'A line runs through `A = (2, 1, 1)` and `B = (5, 3, 1)`. Which arrow is a direction for it?',
      opts: ['(7, 4, 2)', '(5, 3, 1)', '(3, 2, 0)'], want: '(3, 2, 0)',
      hints: { '(7, 4, 2)': 'Not quite. That adds A and B. The direction is the step from A to B.',
        '(5, 3, 1)': 'Not quite. That is B itself, a place. The direction is the step from A to B.' },
      slips: { '(7, 4, 2)': 'A + B points off the line', '(5, 3, 1)': 'B used as an arrow points off the line' },
      why: 'The direction is the step between the points. `B − A` = `(5 − 2, 3 − 1, 1 − 1)` = `(3, 2, 0)`.' },
    { show: true, key: 'plane', scene: 'plane', name: 'A plane and its normal', dur: 4.3, dragR: true, dragN: true,
      act: 'Drag the test point r off the tile and back, or drag the tip of n to tilt the tile. ' + TURN, fit: planeFit,
      text: 'A plane is a start point plus one arrow that stands square to it, its *normal*. The plane is every point whose step from the start is square to the normal. Take `p = (1, 1, 3)` and `n = (2, 1, 2)`. The test point `r = (2, 1, 2)` is a step of `(1, 0, −1)` from p. That step lies in the tile, so `n · (r − p) = 0`. Off the plane, the reading is plus on n’s side and minus on the other.' },
    { kind: 'pick', key: 'on', scene: 'on', name: 'Which point is on it?', rows: 1, fb: [1.5, 1.0], act: TURN, fit: planeFit,
      task: 'The plane runs through `p = (1, 1, 3)` with normal `n = (2, 1, 2)`. Which point lies on it?',
      opts: ['(1, 3, 2)', '(3, 2, 5)', '(0, 0, 0)'], want: '(1, 3, 2)',
      hints: { '(3, 2, 5)': 'Not quite. Its step from p is n itself, and n · n = 9, not 0.',
        '(0, 0, 0)': 'Not quite. Its step from p is (−1, −1, −3), so n · (r − p) = −9, not 0.' },
      slips: { '(3, 2, 5)': 'n · (2, 1, 2) = 4 + 1 + 4 = 9, not 0', '(0, 0, 0)': 'n · (−1, −1, −3) = −2 − 1 − 6 = −9' },
      why: 'A point is on the plane when its step from p is square to n. For `(1, 3, 2)` the step is `(0, 2, −1)`. Then `n · (0, 2, −1)` = `0 + 2 − 2` = `0`. In `2x + y + 2z = 9` it gives `2 + 3 + 4 = 9`.' },
    { show: true, key: 'eq', scene: 'eq', name: 'Its equation', dur: 4.1, rows: 4, dragR: true,
      act: 'Drag the test point r anywhere. The dashed line shows how far it is from the plane. ' + TURN, fit: planeFit,
      text: 'Multiply it out. 2(x − 1) + 1(y − 1) + 2(z − 3) = 0 becomes `2x + y + 2z = 9`. The normal’s parts sit in front of x, y and z. The 9 is `n · p`. The dot product is |n| times the part of the step along n. Here `|n| = √(4 + 1 + 4) = 3`. The origin reads −9. So the origin is `9 ÷ 3 = 3` from the plane, on the side away from n.' },
    { kind: 'pick', key: 'eq7', scene: 'eq7', name: 'Which equation?', rows: 1, fb: [0.8, 1.2], act: TURN, th: -135,
      fit: () => tileOf(Q7, N7, 2).corners.concat(tileOf(O, N7, 2).corners, [add(Q7, N7), add(Q7, [1, 2, 0])]),
      task: 'A plane passes through `(1, 2, 0)` with normal `(3, −1, 2)`. Which is its equation?',
      opts: ['3x − y + 2z = 0', 'x + 2y = 1', '3x − y + 2z = 1'], want: '3x − y + 2z = 1',
      hints: { '3x − y + 2z = 0': 'Not quite. Put (1, 2, 0) in. 3 − 2 + 0 = 1, not 0. Only a plane through the origin has d = 0.',
        'x + 2y = 1': 'Not quite. Those are the point’s parts. The normal’s parts go in front of x, y and z.' },
      slips: { '3x − y + 2z = 0': '3x − y + 2z = 0 runs through the origin instead', 'x + 2y = 1': '(1, 2, 0) is the point, not the normal' },
      why: 'The normal’s parts go in front of x, y and z. So the plane is `3x − y + 2z = d`. The point `(1, 2, 0)` gives `d = 3 − 2 + 0 = 1`.' },
    { show: true, key: 'span', scene: 'span', name: 'Two directions', dur: 3.8, sliders: ['su', 'tw'], clear: true,

    paint();
    return ok;
  });
  K.check('Every demonstration has finished arriving within its 3 to 4.5 s, none starting before the 0.35 s screen fade ends; every answer\'s motion, right or wrong, within 2.5 s', () => {
    const timed = (i, st, limit) => { latest = 0; earliest = Infinity; drawnRaw(i, st); return latest <= limit + 1e-9; };
    const ok = STEPS.every((d, i) => {
      if (d.show) { const r = timed(i, blank(), d.dur); return r && d.dur <= 4.5 && d.dur >= 3 && earliest >= FADE; }
      return timed(i, solvedSt(i), d.fb[0]) && d.fb[0] <= 2.5 && d.opts.filter((o) => o !== d.want).every((o) => timed(i, wrongSt(i, o), d.fb[1]) && d.fb[1] <= 2.5);
    });
    paint();
    return ok;
  });

  K.ready();
</script>
