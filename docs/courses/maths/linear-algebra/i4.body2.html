<p class="caption">Every output, shaded set and lit answer is worked out from the matrix on the card.</p>

<script>
  // ---------- numbers and words (pure, so the checks can test them) ----------
  const MINUS = '−', NB = ' ';
  function num(v, dp) { const f = Math.pow(10, dp == null ? 2 : dp); let r = Math.round(v * f) / f; if (Math.abs(r) < 1e-9) r = 0; return (r < 0 ? MINUS : '') + String(Math.abs(r)); }
  const pt = (v, dp) => '(' + v.map((x) => num(x, dp)).join(', ') + ')';
  const P3 = (s) => { const m = String(s).match(/\(([^)]+)\)/); return m ? m[1].split(',').map((x) => +x.trim().replace(MINUS, '-')) : null; };
  const flat = (s) => (Array.isArray(s) ? s.map((p) => p[0]).join('') : String(s == null ? '' : s));
  const say = (s) => flat(s).replace(/ /g, ' ').replace(/×/g, ' times ').replace(/−/g, ' minus ').replace(/=/g, ' equals ').replace(/\s+/g, ' ').trim();

  // ---------- the rule: an output is a mix of the columns, Ax = x1 col1 + x2 col2 (+ x3 col3) ----------
  const add = (a, b) => a.map((x, k) => x + b[k]);
  const sub = (a, b) => a.map((x, k) => x - b[k]);
  const scl = (a, s) => a.map((x) => x * s);
  const dot = (a, b) => a.reduce((s, x, k) => s + x * b[k], 0);
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const len = (a) => Math.sqrt(dot(a, a));
  const near = (a, b, t) => Math.abs(a - b) < (t || 1e-9);
  const same = (a, b) => !!a && !!b && a.length === b.length && a.every((x, k) => near(x, b[k]));
  const clean = (a) => a.map((x) => { const r = Math.round(x * 1e9) / 1e9; return Math.abs(r) < 1e-12 ? 0 : r; });
  const lerpV = (a, b, e) => (e >= 1 ? b.slice() : e <= 0 ? a.slice() : a.map((x, k) => x + (b[k] - x) * e));
  const mul = (M, x) => clean(M.map((r) => dot(r, x)));
  const colsOf = (M) => M[0].map((_, k) => M.map((r) => r[k]));
  const det2 = (M) => M[0][0] * M[1][1] - M[0][1] * M[1][0];
  // A crushed direction in whole numbers, its first part that is not 0 made positive.
  function tidy(v) {
    const k = v.findIndex((x) => Math.abs(x) > 1e-9);
    let w = k >= 0 && v[k] < 0 ? scl(v, -1) : v.slice();
    for (let q = 1; q <= 12; q++) { const u = scl(w, q); if (u.every((x) => Math.abs(x - Math.round(x)) < 1e-9)) { w = u; break; } }
    return clean(w);
  }
  // Elimination: the rank, whether b can be reached, one answer (free unknowns 0) and the crushed directions.
  function rref(M, b) {
    const m = M.length, n = M[0].length, R = M.map((r, i) => r.concat([b ? b[i] : 0])), piv = [];
    for (let c = 0, row = 0; c < n && row < m; c++) {
      let p = -1;
      for (let i = row; i < m; i++) if (Math.abs(R[i][c]) > 1e-9) { p = i; break; }
      if (p < 0) continue;
      const tmp = R[row]; R[row] = R[p]; R[p] = tmp;
      const f = R[row][c]; R[row] = R[row].map((x) => x / f);
      for (let i = 0; i < m; i++) if (i !== row && Math.abs(R[i][c]) > 1e-9) { const g = R[i][c]; R[i] = R[i].map((x, k) => x - g * R[row][k]); }
      piv.push(c); row++;
    }
    const rank = piv.length, ok = R.slice(rank).every((r) => Math.abs(r[n]) < 1e-9);
    const p = new Array(n).fill(0); piv.forEach((c, i) => { p[c] = R[i][n]; });
    const dirs = [];
    for (let f = 0; f < n; f++) {
      if (piv.indexOf(f) >= 0) continue;
      const v = new Array(n).fill(0); v[f] = 1; piv.forEach((c, i) => { v[c] = -R[i][f]; });
      dirs.push(tidy(v));
    }
    return { rank, ok, p: clean(p), dirs };
  }
  const rankOf = (M) => rref(M).rank;
  const nullOf = (M) => rref(M).dirs;
  const solve = (M, b) => { const r = rref(M, b); return r.ok ? { p: r.p, dirs: r.dirs, rank: r.rank } : null; };
  // An equation row: (1, 2) and 3 -> "x + 2y = 3".
  function eqRow(r, v) {
    let s = '';
    r.forEach((a, k) => { if (near(a, 0)) return; const m = Math.abs(a); s += (s ? (a < 0 ? ' − ' : ' + ') : (a < 0 ? MINUS : '')) + (near(m, 1) ? '' : num(m)) + 'xyz'[k]; });
    return (s || '0') + ' = ' + num(v);
  }
  // Ax as its mix of columns, each part in its column's colour: "Ax = 1(1, 2) + 1(2, 4) = (3, 6)".
  function mixParts(A, x, pre, dpv) {
    const cs = colsOf(A), out = [[pre || '', '']];
    cs.forEach((c, k) => {
      const v = x[k], m = num(Math.abs(v), dpv);
      if (k) out.push([v < 0 && m !== '0' ? ' − ' : ' + ', '']);
      out.push([(!k && v < 0 && m !== '0' ? MINUS : '') + m + pt(c), 'c' + (k + 1)]);
    });
    out.push([' = ' + pt(mul(A, x), dpv), '']);
    return out;
  }
  const plus = (a, b, dpv) => num(a, dpv) + (b < 0 ? ' − ' + num(-b, dpv) : ' + ' + num(b, dpv));
  const inBox = (p, bx) => p.every((x, k) => x >= bx[k][0] - 1e-9 && x <= bx[k][1] + 1e-9);
  function wholes(bx) { const o = []; const rec = (k, cur) => { if (k === bx.length) { o.push(cur.slice()); return; } for (let v = bx[k][0]; v <= bx[k][1]; v++) { cur[k] = v; rec(k + 1, cur); } }; rec(0, []); return o; }
  const has = (list, p) => list.some((q) => same(q, p));
  function nearest(list, X) { let best = list[0], bd = Infinity; list.forEach((q) => { const d = q.reduce((s, x, k) => s + (x - X[k]) * (x - X[k]), 0); if (d < bd - 1e-12) { bd = d; best = q; } }); return best.slice(); }
  // Where a line through p along d crosses a box: its range of t, or null.
  function clipLine(p, d, bx) {
    let t0 = -Infinity, t1 = Infinity;
    for (let k = 0; k < p.length; k++) {
      if (Math.abs(d[k]) < 1e-12) { if (p[k] < bx[k][0] - 1e-9 || p[k] > bx[k][1] + 1e-9) return null; continue; }
      let a = (bx[k][0] - p[k]) / d[k], b = (bx[k][1] - p[k]) / d[k];
      if (a > b) { const s = a; a = b; b = s; }
      t0 = Math.max(t0, a); t1 = Math.min(t1, b);
    }
    return t1 >= t0 - 1e-9 ? [t0, Math.max(t0, t1)] : null;
  }

  // ---------- the lesson's values ----------
  const A1 = [[1, 2], [2, 4]], A5 = [[1, 2], [2, 5]], A3 = [[1, 1, 1], [1, 2, 3], [2, 3, 4]];
  const O2 = [0, 0], O3 = [0, 0, 0], E1 = [1, 0, 0];
  const C1 = colsOf(A1), C3 = colsOf(A3), N2 = nullOf(A1)[0], N3 = nullOf(A3)[0], NRM = cross(C3[0], C3[1]);
  const K2 = A1[1][0] / A1[0][0];                       // row 2 of [1 2; 2 4] is 2 lots of row 1
  const X1 = [1, 1], B1 = mul(A1, X1), BOFF = [3, 7], X3 = add(X1, N2), BQ = [2, 5], XR = [-1, 0], BR = mul(A1, XR);
  const X9 = [1, 2, 3], B9 = mul(A3, X9), X9B = add(X9, N3), B9OFF = [6, 14, 21];
  const B12 = [2, 3, 5], P12 = [1, 1, 0];
  const ROWMIX = add(add(A3[0], scl(A3[1], -2)), A3[2]);  // the rows mixed by 1, −2, 1
  const ZC = [[1, 0, 1], [0, 1, 1]], ZS = add(ZC[0], ZC[1]);   // two arrows ending in z = 1, and their sum
  const NC4 = 4, RK4 = 2;                               // the 4-column matrix of rank 2
  // Each panel's whole-number grid.
  const IN2 = [[-2, 4], [-2, 3]], IN2T = [[-2, 4], [-2, 6]], OUT2 = [[-2, 5], [-3, 8]];
  const IN3 = [[-1, 3], [-3, 3], [-1, 5]];
  const T9 = [[-1, 7], [-1, 15]], TC = [[-2, 2], [-4, 2]], T12 = [[-1, 3], [-1, 4]], TZ = [[-1, 2], [-1, 2]];
  // Where a dragged input or target may go: whole points whose outputs, answers or targets stay on the picture.
  const reach3 = new Map();
  wholes(IN3).forEach((x) => { const y = mul(A3, x); if (inBox(y.slice(0, 2), T9)) reach3.set(y[0] + ',' + y[1], [y[0], y[1]]); });
  const ALLOW = {
    x2: wholes(IN2).filter((x) => inBox(mul(A1, x), OUT2)),
    b2: wholes(OUT2),
    b5: wholes(OUT2).filter((b) => inBox(rref(A5, b).p, IN2)),
    x3: wholes(IN3).filter((x) => inBox(mul(A3, x).slice(0, 2), T9)),
    b3: [],
  };
  reach3.forEach(([u, v]) => { for (let dz = -1; dz <= 1; dz++) ALLOW.b3.push([u, v, u + v + dz]); });
  const planeCorners = (T) => [[T[0][0], T[1][0]], [T[0][1], T[1][0]], [T[0][1], T[1][1]], [T[0][0], T[1][1]]].map(([x, y]) => [x, y, x + y]);
  const flatCorners = (T, z) => [[T[0][0], T[1][0], z], [T[0][1], T[1][0], z], [T[0][1], T[1][1], z], [T[0][0], T[1][1], z]];
  const boxCorners = (b) => { const o = []; for (let k = 0; k < 8; k++) o.push([b[0][k & 1 ? 1 : 0], b[1][k & 2 ? 1 : 0], b[2][k & 4 ? 1 : 0]]); return o; };

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // scene: what the picture draws; view: a flat step's input and output grids; d3: two 3-D panels; one: a
  // single 3-D panel; count: the column count picture; drag: what he can drag ('x' the input, 'b' the target),
  // allow: where it may go; slide: the Slide along button; rows: working lines under the picture.
  // A puzzle: task, opts, want, hints (one per wrong answer), slips (the red line drawn for each), why,
  // fb (seconds of motion after a right and a wrong answer).
  const PICK = 'Tap one of the answers.';
  const TURN = 'Drag the background to turn the view.';
  const V2 = { in: IN2, out: OUT2 };
  const OC = ['None', 'Exactly one', 'A whole line'];
  const OO = ['Yes, if its columns lie in that plane', 'No, it must hold the origin', 'Only for a 3 by 3 matrix'];
  const OK10 = ['1 lot of column 1, −2 of column 2 and 1 of column 3 add to zero', '1 lot of row 1, −2 of row 2 and 1 of row 3 add to zero', 'A crushes every input to zero'];
  const OZ = ['Only the zero arrow', 'A line of inputs', 'A plane of inputs'];
  const slipA = (o) => 'A' + o + ' = ' + pt(mul(A1, P3(o))) + ', not ' + pt(B1);
  const STEPS = [
    { show: true, key: 'reach', scene: 'reach', name: 'Where outputs land', dur: 3.6, view: V2, drag: 'x', allow: 'x2', rows: 1,
      act: 'Drag the input dot x. Its output Ax moves with it, always along the shaded line.',
      text: 'A matrix takes an input arrow x and gives an output Ax. Every output is a mix of the columns. x’s first number says how much of column 1. Its second says how much of column 2. Take `A = [1 2; 2 4]`. Its second column is 2 lots of the first. So an input `(x, y)` gives `(x + 2y)` lots of `(1, 2)`. Everything A can reach, its *column space*, is the line through `(1, 2)`. The input `(1, 1)` lands on `(3, 6)`.' },
    { kind: 'pick', key: 'which', scene: 'which', name: 'Which can it reach?', view: V2, rows: 1, fb: [1.6, 0.5],
      task: 'Which target can `A = [1 2; 2 4]` reach?',
      opts: ['(2, 1)', pt(BR), '(1, 3)'], want: pt(BR),
      hints: { '(2, 1)': 'Not quite. Every output is some lots of (1, 2), so its second part is twice its first.',
        '(1, 3)': 'Not quite. Lots of (1, 2) with first part 1 is just (1, 2), not (1, 3).' },
      slips: { '(2, 1)': '(2, 1) is off the shaded line', '(1, 3)': '(1, 3) is off the shaded line' },
      why: 'Every output is some lots of `(1, 2)`. `(−1, −2)` is −1 lot of `(1, 2)`, so the input `(−1, 0)` reaches it. `(2, 1)` and `(1, 3)` are not lots of `(1, 2)`, so no input reaches them.' },

  const solvedSt = (i) => Object.assign(blank(), { pick: STEPS[i].want, res: 'right' });
  const wrongSt = (i, o) => Object.assign(blank(), { pick: o, res: 'wrong' });
  const liveSt = (o) => Object.assign(blank(), { live: true }, o);
  // A step painted in the state given (finished, or t seconds into its motion): what it draws.
  function drawnRaw(i, st, t) {
    const keepS = S[i], keepT = T;
    PROBE = true; S[i] = st; T = t == null ? Infinity : t;
    try { return paint(i); } finally { S[i] = keepS; T = keepT; PROBE = false; }
  }
  const zeroOf = (A) => A.map(() => 0);
  const mixOf = (A, x) => colsOf(A).reduce((s, c, j) => add(s, scl(c, x[j])), zeroOf(A));

  K.check('The column space is all combinations of the columns of A, and the null space all solutions of Ax = 0: for every place the input can be dragged, the output drawn is x’s first number times column 1 plus its second times column 2 (and its third times column 3), and both ends of every dashed null space line land on zero', () => {
    let ok = true;
    [['reach', A1, ALLOW.x2], ['crush', A1, ALLOW.x2], ['space', A3, ALLOW.x3]].forEach(([k, A, list]) => list.forEach((x) => {
      const r = drawnRaw(idx(k), liveSt({ x })), want = mixOf(A, x);
      ok = ok && same(r.x, x) && same(r.out, want) && same(r.chainEnd, want) && same(mul(A, x), want);
    }));
    [['crush', A1], ['other', A1], ['target', A1], ['space', A3], ['cols', A3], ['target3', A3]].forEach(([k, A]) => {
      const r = drawnRaw(idx(k), blank());
      ok = ok && !!r.nullEnds && len(r.nullDir) > 0 && r.nullEnds.every((e) => same(mul(A, e), zeroOf(A)));
    });
    paint();
    return ok;
  }, { source: SRC[0] });
  K.check('When Ax = b has answers, they are a translated copy of the null space, with n − rank(A) directions: for every place b can be dragged, every lit input lands on b; for [1 2; 2 4] and the 3 by 3 matrix the lit inputs run along a line parallel to the null space, and for [1 2; 2 5] exactly one input lights', () => {
    let ok = true;
    const t = (k, A, list, dims) => list.forEach((b) => {
      const r = drawnRaw(idx(k), liveSt({ b })), s = solve(A, b);
      if (!s) { ok = ok && r.lit === null; return; }
      ok = ok && !!r.lit && r.lit.pts.length > 0 && r.lit.pts.every((p) => same(mul(A, p), b)) && s.dirs.length === dims && A[0].length - rankOf(A) === dims;
      ok = ok && (dims ? same(r.lit.dir, nullOf(A)[0]) : r.lit.pts.length === 1);
    });
    t('target', A1, ALLOW.b2, 1); t('target3', A3, ALLOW.b3, 1); t('full', A5, ALLOW.b5, 0);
    paint();
    return ok;
  }, { source: SRC[1] });
  K.check('If b is not in the column space of A, Ax = b has no solution: for every b off the shaded line or plane, nothing lights and the last working line reads 0 = a number other than 0; for every b on it, inputs light and it reads 0 = 0', () => {
    let ok = true;
    [['target', A1, ALLOW.b2], ['target3', A3, ALLOW.b3]].forEach(([k, A, list]) => list.forEach((b) => {
      const r = drawnRaw(idx(k), liveSt({ b })), on = !!solve(A, b), last = flat(r.rows[r.rows.length - 1].s);
      ok = ok && (on ? /: 0 = 0$/.test(last) && !!r.lit : /: 0 = −?[1-9]/.test(last) && r.lit === null);
    }));
    paint();
    return ok;
  }, { source: SRC[2] });
  K.check('Rank is the number of independent columns: the label under the card reads rank 1 for [1 2; 2 4], rank 2 for [1 2; 2 5] and rank 2 for the 3 by 3 matrix, and the rank plus the crushed directions always makes the number of columns, as for a 4-column matrix of rank 2 with 2 crushed directions', () => {
    const M4 = [[1, 0, 1, 2], [0, 1, 1, 3]];
    const a = drawnRaw(idx('reach'), blank()), b = drawnRaw(idx('full'), blank()), c = drawnRaw(idx('space'), blank());
    const ta = a.texts.indexOf('rank 1') >= 0, tb = b.texts.indexOf('rank 2') >= 0, tc = c.texts.indexOf('rank 2') >= 0;
    paint();
    return a.rank === 1 && b.rank === 2 && c.rank === 2 && ta && tb && tc &&
      [A1, A5, A3, M4].every((M) => rankOf(M) + nullOf(M).length === M[0].length && nullOf(M).every((v) => same(mul(M, v), zeroOf(M)))) &&
      nullOf(A5).length === 0 && rankOf(M4) === RK4 && M4[0].length === NC4 && nullOf(M4).length === NC4 - RK4 && NC4 - RK4 === 2;
  }, { source: SRC[3] });
  K.check('Every worked number is right: A(1, 1) = (3, 6); (2, −1) gives (0, 0); (3, 0) also gives (3, 6); (2, 3) gives (8, 16) and (3, 6) gives (15, 30); (−1, 0) gives (−1, −2); 7 − 2 × 3 = 1; the determinant 1 × 5 − 2 × 2 = 1 and (3, 7) from (1, 1) alone; normal (−1, −1, 1); A(1, −2, 1) = 0 and the rows mix to (1, 0, −1); (1, 2, 3) and (2, 0, 4) give (6, 14, 20); the worked example (−2, 8, 0) + t(1, −2, 1); (6, 14, 21) ends in 0 = 1; (1, 1, 0) gives (2, 3, 5); 4 − 2 = 2', () => {
    return same(B1, [3, 6]) && same(N2, [2, -1]) && same(mul(A1, N2), O2) && same(X3, [3, 0]) && same(mul(A1, X3), [3, 6]) &&
      same(add(X1, C1[0]), [2, 3]) && same(mul(A1, [2, 3]), [8, 16]) && same(mul(A1, [3, 6]), [15, 30]) && same(BR, [-1, -2]) &&
      BOFF[1] - K2 * BOFF[0] === 1 && K2 === 2 && !solve(A1, BOFF) && !solve(A1, BQ) && BQ[1] - K2 * BQ[0] === 1 &&
      det2(A5) === 1 && same(solve(A5, BOFF).p, X1) && rankOf(A1) === 1 && rankOf(A5) === 2 &&
      same(NRM, [-1, -1, 1]) && C3.every((c) => dot(NRM, c) === 0) && same(add(A3[0], A3[1]), A3[2]) && same(N3, [1, -2, 1]) && same(mul(A3, N3), O3) &&
      same(ROWMIX, [1, 0, -1]) && same(mixOf(A3, N3), O3) && same(add(scl(C3[1], 2), scl(C3[0], -1)), C3[2]) &&
      same(B9, [6, 14, 20]) && same(X9B, [2, 0, 4]) && same(mul(A3, X9B), B9) && same(solve(A3, B9).p, [-2, 8, 0]) && same(add([-2, 8, 0], scl(N3, 3)), X9) &&
      !solve(A3, B9OFF) && B9OFF[2] - B9OFF[0] - B9OFF[1] === 1 && same(solve(A3, B12).p, P12) && same(mul(A3, P12), B12) && same(add(C3[0], C3[1]), B12) &&
      same(ZS, [1, 1, 2]) && ZS[2] !== 1 && rankOf(A3) === 2 && 2 + nullOf(A3).length === 3;
  });
  K.check('Each puzzle\'s answer comes from the rule, and each wrong answer offered is the slip its hint names', () => {
    const g = (k) => STEPS[idx(k)];
    const only = (k, f) => g(k).opts.every((o) => f(o) === (o === g(k).want));
    const howMany = (A, b) => { const s = solve(A, b); return !s ? OC[0] : s.dirs.length ? OC[2] : OC[1]; };
    return only('which', (o) => !!solve(A1, P3(o))) &&
      only('other', (o) => same(mul(A1, P3(o)), B1) && !same(P3(o), X1)) && g('other').opts.indexOf(pt(add(X1, C1[0]))) >= 0 && g('other').opts.indexOf(pt(B1)) >= 0 &&
      g('count').want === howMany(A1, BQ) && g('mix1').want === howMany(A3, B12) &&
      g('origin').want === OO[1] && !near(dot([0, 0, 1], O3), 1) &&
      g('cols').want === OK10[0] && same(mixOf(A3, N3), O3) && !same(ROWMIX, O3) && !same(mul(A3, E1), O3) &&
      g('mix2').want === OZ[NC4 - RK4];
  });
  K.check('Each puzzle offers three different answers, accepts only the right one, and draws every wrong one in the warning colour', () => {
    const ok = DO.every((i) => {
      const d = STEPS[i];
      if (d.opts.length !== 3 || new Set(d.opts).size !== 3 || d.opts.indexOf(d.want) < 0) return false;
      if (!d.opts.every((o) => isRight(i, Object.assign(blank(), { pick: o })) === (o === d.want))) return false;
      if (drawnRaw(i, solvedSt(i)).bad !== 0) return false;
      return d.opts.filter((o) => o !== d.want).every((o) => drawnRaw(i, wrongSt(i, o)).bad > 0 && !!d.hints[o] && !!d.slips[o]);
    });
    paint();
    return ok;
  });
  K.check('Before Check, no puzzle shows its answer; after a right answer, it does', () => {
    const ok = DO.every((i) => {
      const d = STEPS[i], b = drawnRaw(i, blank()), s = drawnRaw(i, solvedSt(i));
      return b.reveal === 0 && s.reveal > 0 && b.rows.length === 0 && !b.texts.some((x) => x.indexOf(d.want) >= 0);
    });
    paint();
    return ok;
  });
  K.check('Each demonstration ends where the lesson says: (1, 1) landing on (3, 6); the input slid from (1, 1) to (3, 0), still on (3, 6); b back at (3, 6) with (−1, 2), (1, 1) and (3, 0) lit; [1 2; 2 5] at rank 2 with b = (3, 7) lighting (1, 1) alone; the input slid from (1, 2, 3) to (2, 0, 4), still on (6, 14, 20); b back at (6, 14, 20) with (1, 2, 3) and (2, 0, 4) lit', () => {
    const a = drawnRaw(idx('reach'), blank()), c = drawnRaw(idx('crush'), blank()), t = drawnRaw(idx('target'), blank());
    const f = drawnRaw(idx('full'), blank()), s = drawnRaw(idx('space'), blank()), u = drawnRaw(idx('target3'), blank());
    paint();
    return same(a.x, X1) && same(a.out, B1) && flat(a.rows[0].s) === 'Ax = 1(1, 2) + 1(2, 4) = (3, 6)' &&
      same(c.x, X3) && same(c.out, B1) && same(c.from, X1) &&
      same(t.b, B1) && !!t.lit && [[-1, 2], X1, X3].every((p) => has(t.lit.pts, p)) && /: 0 = 0$/.test(flat(t.rows[2].s)) &&
      same(f.b, BOFF) && !!f.lit && f.lit.pts.length === 1 && same(f.lit.pts[0], X1) && f.rank === 2 && flat(f.rows[0].s) === '1 × 5 − 2 × 2 = 1, not 0' &&
      same(s.x, X9B) && same(s.out, B9) && same(s.from, X9) &&
      same(u.b, B9) && !!u.lit && has(u.lit.pts, X9) && has(u.lit.pts, X9B);
  });
  K.check('While each demonstration plays, the rule holds at every moment: the output is always A times the input and sits on the column space; while the input slides along the null space the output stays exactly where it was; every lit input lands on its target', () => {
    let ok = true;
    for (let k = 0; k <= 50; k++) {
      const t = k / 10;
      const a = drawnRaw(idx('reach'), blank(), t), c = drawnRaw(idx('crush'), blank(), t), s = drawnRaw(idx('space'), blank(), t);
      const g = drawnRaw(idx('target'), blank(), t), u = drawnRaw(idx('target3'), blank(), t), f = drawnRaw(idx('full'), blank(), t);
      ok = ok && same(a.out, mul(A1, a.x)) && same(a.chainEnd, a.out) && near(a.out[1], K2 * a.out[0], 1e-9) &&
        same(c.out, mul(A1, c.x)) && same(c.chainEnd, c.out) && (t < 2.8 || same(c.out, B1)) &&
        same(s.out, B9) && same(s.out, mul(A3, s.x)) && same(s.chainEnd, B9) &&
        [[g, A1], [u, A3]].every(([r, A]) => !r.lit || r.lit.pts.every((p) => same(mul(A, p), r.litB))) &&
        (!f.x || same(f.chainEnd, mul(A5, f.x))) && (!f.lit || same(mul(A5, f.lit.pts[0]), f.litB));
    }
    paint();
    return ok;
  });
  K.check('Every demonstration has finished arriving within its 3 to 5 s, none starting before the 0.35 s screen fade ends; every answer\'s motion, right or wrong, within 2.5 s', () => {
    const timed = (i, st, limit) => { latest = 0; earliest = Infinity; drawnRaw(i, st); return latest <= limit + 1e-9; };
    const ok = STEPS.every((d, i) => {
      if (d.show) { const r = timed(i, blank(), d.dur); return r && d.dur <= 5 && d.dur >= 3 && earliest >= FADE; }
      return timed(i, solvedSt(i), d.fb[0]) && d.fb[0] <= 2.5 && d.opts.filter((o) => o !== d.want).every((o) => timed(i, wrongSt(i, o), d.fb[1]) && d.fb[1] <= 2.5);
    });
    paint();
    return ok;
  });

  K.ready();
</script>
