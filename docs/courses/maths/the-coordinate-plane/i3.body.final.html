<style>
  [hidden] { display: none !important; }
  .pz { max-width: 30rem; }
  .pz > * + *, #stepbox > * + * { margin-top: 14px; }
  /* The stepper is the page's step control: its dots are the progress bar; Back and Continue are below. */
  .pz .k-stepper { gap: 0; }
  .pz .k-stepper .k-label, .pz .k-stepper-nav { display: none; }
  .pz .count { margin-top: 10px; }
  .task { font-size: 1.2rem; font-weight: 700; line-height: 1.5; margin-top: 4px; }
  .task.show { font-size: 1.12rem; font-weight: 400; line-height: 1.6; }
  .nw { white-space: nowrap; }
  /* A key term stays whole on one line, so its amber highlight never splits. */
  .task .term { white-space: nowrap; }
  .vx { font-style: italic; }
  .scene { display: block; width: 100%; touch-action: pan-y; }
  .scene #art * { pointer-events: none; }
  /* The grid: faint large squares (and, on some screens, fainter small ones), the axes in ink with their
     arrowheads, the numbers along each axis, and each axis's name and unit in teal. A number a point sits
     on is picked out in amber. */
  .scene .gl { fill: none; stroke: var(--k-line); stroke-width: 1; }
  .scene .gm { fill: none; stroke: var(--k-line); stroke-width: .75; stroke-opacity: .55; }
  .scene .ax { stroke: var(--k-ink); stroke-width: 2; stroke-linecap: round; }
  .scene .axh { fill: var(--k-ink); }
  .scene .tkl { font: 400 14px var(--k-font); fill: var(--k-ink); }
  .scene .tkl.on { font-weight: 700; }
  .scene .an { font: 700 13px var(--k-font); fill: var(--k-accent); letter-spacing: .02em; }
  .scene .hl { fill: var(--k-hl); }
  /* The route from the origin, along and then up: a wide see-through band under the axes. */
  .scene .rt { fill: none; stroke: var(--k-accent2); stroke-opacity: .3; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
  .scene .rt.bad { stroke: var(--k-warn); }
  .scene .rl { font: 700 13px var(--k-font); fill: var(--k-accent); }
  .scene .tag { font: 700 13px var(--k-font); fill: var(--k-accent); }
  .scene .gd { stroke: var(--k-muted); stroke-width: 1.5; stroke-dasharray: 4 3; }
  .scene .gd.bad { stroke: var(--k-warn); }

  .scene .pt { fill: var(--k-accent2); }
  .scene .pt.bad { fill: var(--k-warn); }
  .scene .over { fill: var(--k-warn); }
  .scene .ring { fill: none; stroke: var(--k-accent2); stroke-width: 2; stroke-dasharray: 4 3; }
  .scene .ltr { font: 700 16px var(--k-font); fill: var(--k-ink); }
  .scene .pl { fill: var(--k-bg); stroke: var(--k-accent2); stroke-width: 1.5; }
  .scene .pl.bad { stroke: var(--k-warn); }
  .scene .pv { font: 700 15px var(--k-font); fill: var(--k-ink); }
  .scene .pv2 { font: 400 13px var(--k-font); fill: var(--k-ink); }
  .scene .ptag { font: 700 13px var(--k-font); fill: var(--k-accent); }
  /* A steady line drawn by its rule; small squares outlined beside an axis, the counted ones in amber;
     a bracket beside the graph. */
  .scene .dl { fill: none; stroke: var(--k-accent2); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
  .scene .dl.bad { stroke: var(--k-warn); }
  .scene .cell { fill: var(--k-hl); }
  .scene .cellb { fill: none; stroke: var(--k-accent2); stroke-width: 1.25; }
  .scene .brk { fill: none; stroke: var(--k-ink); stroke-width: 1.75; stroke-linecap: round; }
  .scene .brk.bad { stroke: var(--k-warn); }
  /* A slip's words in the warning colour, over any text style above. */
  .scene text.warnt { fill: var(--k-warn); }
  /* What Dan drags: a thumb's-width hit circle over the point; a tap anywhere on the grid moves it too. */
  .scene .grip { fill: var(--k-bg); fill-opacity: 0; stroke: none; cursor: grab; touch-action: none; }
  .scene .grip:active { cursor: grabbing; }
  .scene .grip:focus { outline: none; }

  .row { display: flex; flex-wrap: wrap; gap: 10px; }

  .replay { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 10px; }

  /* The answers stay on one row, each label whole, at every text size; longer ones stack one to a row. */
  .row.picks { flex-wrap: nowrap; }
  .picks .k-btn { font-size: 1.15rem; min-height: 56px; flex: 1 1 0; min-width: 0; white-space: nowrap; padding-inline: 6px; }
  .row.picks.long { flex-direction: column; }

  #stepbox > .plab { margin-top: 10px; margin-bottom: -6px; }
  .fb { font-weight: 700; min-height: 1.5em; margin-top: 10px; }
  .fb.right { color: var(--k-good); }

  #stepbox.enter, #done.enter { animation: screen-in .35s ease-out both; }
  @keyframes screen-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    #stepbox.enter, #done.enter { animation: none; }

<p class="caption">Read the axis numbers before counting squares. All the readings are example values.</p>

<script>
  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // g: the graph a step draws, its axis along (x) and up (y). An axis has a name, the unit its readings
  // carry, n squares, and what each square is worth (step) from `start`; a broken one lists its own labels,
  // one to a gridline (red: the ones that break the pattern). minor: each large square split into that many
  // small ones. A reading is [along, up] in the axes' units; a place on the grid is in squares.
  // DO kinds: 'plot' (drag the point to the reading goal) and 'pick' (tap an answer), whose ask is 'read'
  // (what the point pt says), 'between' (its value between two marks), 'choose' (what a square up should
  // be worth for the readings data), 'bent' (why the readings seem to bend), 'compare' (how two readings
  // compare on an axis that starts above 0) or 'spot' (what went wrong with the reading logged as claim).
  // slips: which slip gives each wrong answer (SLIP below); for a plot, keyed by where the point is left,
  // in squares, 'a,b'. dur: how long a demonstration plays; fb: how long the motion after a right answer
  // plays; at: when each part of it arrives, in seconds after Check.
  const PICK = 'Tap one of the answers.';
  const PLACE = 'Drag the point to a crossing first, or tap one.';
  const X = (name, u, step, o) => Object.assign({ name: name, u: u, step: step, start: 0, n: 6 }, o || {});
  const Y = (name, u, step, o) => Object.assign({ name: name, u: u, step: step, start: 0, n: 5 }, o || {});
  const HOURS = (s, o) => X('time (h)', 'h', s, o), MINS = (s, o) => X('time (min)', 'min', s, o);
  const FUEL = (s, o) => Y('fuel used (L)', 'L', s, o), VOL = (s, o) => Y('volume (L)', 'L', s, o), VOLT = (s, o) => Y('voltage (V)', 'V', s, o);
  const MINOR = 5;
  // After a right answer. ROUTE: the route from the origin travels along, then up, to the point (TRAVEL
  // seconds), then its label, the sums and the numbers it sits on. BETW: the small squares counted, CNTGAP
  // apart, then the label. CHOOSE: the numbers up the side, the readings, the verdict. BENT: the uneven
  // labels marked, giving way to even ones, the readings sliding into line (GLIDE), the verdict. CMP: guides
  // to the axis, then the gap between the two readings. SPOT: the logged reading marked as the slip, then
  // the route to the point and its label.
  const TRAVEL = 0.8, GLIDE = 0.7, BEND = 0.8;
  const ROUTE = { route: 0.1, pill: 1.0 };
  const BETW = { count: 0.1, pill: 0.9 };
  const CHOOSE = { labels: 0.1, pts: 0.6, tag: 1.1 };
  const BENT = { red: 0.1, swap: 0.6, glide: 1.1, tag: 1.8 };
  const CMP = { guides: 0.1, gap: 0.6 };
  const SPOT = { bad: 0.1, route: 0.6, pill: 1.5 };
  // After a wrong answer: where that answer puts the point, or what it does to the graph, in the warning colour.
  const WRONG = { slip: 0.1 }, WRONG_DUR = 0.7;
  const STEPS = [
    { show: true, demo: 'scale', dur: 4.2, drag: true, g: { x: HOURS(2), y: FUEL(50) }, to: [4, 3], name: 'Read the scale',
      text: 'A square need not be worth 1. The numbers on each axis set its *scale*, here 2 h a square along and 50 L up. Drag the point to try it.' },
    { kind: 'pick', ask: 'read', g: { x: HOURS(2), y: FUEL(20) }, pt: [6, 40], opts: ['3 h, 2 L', '6 h, 40 L', '8 h, 60 L'], want: '6 h, 40 L', slips: { '3 h, 2 L': 'ones', '8 h, 60 L': 'lines' }, fb: 1.6, at: ROUTE, name: 'Read a point',
      task: 'This point is one example reading. What does it say?',
      why: 'Each square along is 2 h and each square up is 20 L. The point is 3 squares along, 3 × 2 = 6 h, and 2 up, 2 × 20 = 40 L.',
      hint: 'Not quite. Read what a square is worth from the axis numbers, then count.',
      hints: { '3 h, 2 L': 'Not quite. That takes each square as 1. Along goes up in 2s and up goes in 20s.',
        '8 h, 60 L': 'Not quite. That counts the gridlines, 0 included. Count the squares from 0, then multiply by what each is worth.' } },
    { kind: 'plot', g: { x: HOURS(2), y: FUEL(5) }, goal: [4, 5], want: '(4, 5)', slips: { '4,5': 'ones', '4,1': 'along' }, fb: 1.6, at: ROUTE, name: 'Plot a reading',
      task: 'At 4 h a generator had used 5 L, an example reading. Drag the point to plot it.',
      why: 'Each square along is 2 h, so 4 h is 2 squares. Each square up is 5 L, so 5 L is 1 square. The reading sits at (4, 5).',
      hint: 'Not quite. Work out how many squares 4 h and 5 L are.',
      hints: { '4,5': 'Not quite. That point is 8 h and 25 L. A square is not 1 here, so 4 h is only 2 squares along.',
        '4,1': 'Not quite. That point is 8 h along. Each square along is 2 h, so 4 h is 2 squares.' } },
    { show: true, demo: 'between', dur: 3.4, g: { x: MINS(10), y: VOL(20), minor: MINOR }, pt: [30, 52], name: 'Between the marks',
      text: 'Between two numbers, find what a *small square* is worth. Here 20 L splits into 5, so each is 4 L, and 3 small squares past 40 is 52 L.' },
    { kind: 'pick', ask: 'between', g: { x: MINS(10), y: VOL(50), minor: MINOR }, pt: [40, 170], opts: ['152 L', '160 L', '170 L'], want: '170 L', slips: { '152 L': 'small1', '160 L': 'ten' }, fb: 1.5, at: BETW, name: 'Read between',
      task: 'What volume does this point show?',
      why: 'Each large square up is 50 L, split into 5 small squares of 50 ÷ 5 = 10 L. The point is 2 small squares past 150, so 150 + 20 = 170 L.',
      hint: 'Not quite. Work out what one small square is worth first.',
      hints: { '152 L': 'Not quite. That takes each small square as 1. 50 L splits into 5, so each is 10 L.',
        '160 L': 'Not quite. That splits 50 L into 10. There are 5 small squares, so each is 10 L.' } },
    { show: true, demo: 'fit', dur: 3.9, g: { x: HOURS(1), y: FUEL(5) }, data: [[0, 0], [1, 4], [2, 8], [3, 12], [4, 16], [5, 20], [6, 24]], scales: [1, 2, 5, 10], path: [10, 2, 5], name: 'Pick a scale',
      text: 'Too small a scale runs readings off the top, and too big squashes them low. Pick the smallest that fits from 0.5, 1, 2, 5, 10, 20, 50 and so on.' },
    { kind: 'pick', ask: 'choose', g: { x: MINS(10), y: VOL(50), minor: MINOR }, data: [[0, 0], [10, 30], [20, 55], [30, 80], [40, 110], [50, 135], [60, 160]], opts: ['20 L', '40 L', '50 L'], want: '50 L', slips: { '20 L': 'over', '40 L': 'odd' }, fb: 1.7, at: CHOOSE, name: 'Choose a scale',
      task: 'Readings run up to 160 L, with 5 squares up the side. What should each square be worth?',
      why: '160 ÷ 5 = 32, so a square must be worth at least 32 L. The next of 1, 2, 5, 10, 20, 50 is 50 L, which runs to 250 L in easy small squares of 10 L.',
      hint: 'Not quite. Divide 160 by 5, then take the next of 1, 2, 5, 10, 20, 50.',
      hints: { '20 L': 'Not quite. 5 squares of 20 L only reach 100 L, so the readings run off the top.',
        '40 L': 'Not quite. 40 L fits, but it is not one of 1, 2, 5, 10, 20, 50, so its small squares are an awkward 8 L.' } },
    { show: true, demo: 'uneven', dur: 3.7, g: { x: MINS(1), y: VOL(20) }, bad: VOL(20, { labels: [0, 10, 20, 30, 50, 100], red: [4, 5] }), rate: 15, name: 'Equal steps',
      text: 'Keep the steps equal. These labels go up 10, 10, 10, then 20 and 50 on equal squares, so a steady fill looks bent. The bend is in the axis.' },
    { kind: 'pick', ask: 'bent', g: { x: HOURS(2, { n: 5 }), y: VOL(20) }, bad: HOURS(1, { n: 5, labels: [0, 1, 2, 3, 5, 10], red: [4, 5] }), data: [[0, 0], [1, 10], [2, 20], [3, 30], [5, 50], [10, 100]], opts: ['It filled faster', 'A point is misread', 'Uneven steps'], want: 'Uneven steps', slips: { 'It filled faster': 'face', 'A point is misread': 'misread' }, fb: 2.4, at: BENT, name: 'Spot the bend',
      task: 'These tank readings climb faster after 3 h. Why?',
      why: 'The time labels go up 1, 1, 1, then 2 and 5 h a square, so the later squares hold more time. On even steps the readings lie straight, a steady 10 L an hour.',
      hint: 'Not quite. Read the labels along the bottom.',
      hints: { 'It filled faster': 'Not quite. Read the time labels first. After 3 h a square holds 2 h, then 5 h, so a steady fill climbs more steeply.',
        'A point is misread': 'Not quite. Each point sits on its own time, 50 L at 5 h and 100 L at 10 h. Look at the gaps between the time labels.' } },
    { show: true, demo: 'zero', dur: 3.8, g: { x: HOURS(1), y: VOLT(50), zeros: true }, from: VOLT(1, { start: 228 }), data: [[0, 229], [1, 230], [2, 229], [3, 231], [4, 232], [5, 231], [6, 233]], name: 'Where it starts',
      text: 'From 228 V, a 4 V rise fills the graph. Drawn from 0, as here, the same readings look almost flat. To compare sizes by height, start at 0.' },
    { kind: 'pick', ask: 'compare', g: { x: HOURS(1), y: VOLT(1, { start: 228 }) }, pts: { A: [2, 229], B: [4, 232] }, opts: ['4 times', '3 V more', '4 V more'], want: '3 V more', slips: { '4 times': 'times', '4 V more': 'bottom' }, fb: 1.2, at: CMP, name: 'Compare two',
      task: 'B sits 4 times as high as A on this graph. How do their voltages compare?',
      why: 'The axis starts at 228 V, not 0. A reads 229 V and B reads 232 V, so B is only 232 − 229 = 3 V more. To compare sizes by height, start at 0.',
      hint: 'Not quite. Read A and B off the axis numbers.',
      hints: { '4 times': 'Not quite. The axis starts at 228 V, not 0, so the heights are not the voltages. Read A and B off the axis.',
        '4 V more': 'Not quite. That measures B from the bottom, 228 V. A is at 229 V, so take 229 from 232.' } },
    { kind: 'pick', ask: 'spot', g: { x: HOURS(2), y: FUEL(5) }, pt: [6, 20], claim: [3, 4], opts: ['Nothing', 'Squares read as 1', 'Swapped round'], want: 'Squares read as 1', slips: { Nothing: 'none', 'Swapped round': 'swap' }, fb: 2.1, at: SPOT, name: 'Spot the slip',
      task: 'This reading was logged as 3 h and 4 L. What went wrong?',
      why: 'Each square along is 2 h and each up is 5 L. 3 squares along is 6 h and 4 up is 20 L, so the reading is 6 h, 20 L.',
      hint: 'Not quite. Read what each square is worth.',
      hints: { 'Swapped round': 'Not quite. 3 along and 4 up are in the right order. Look at what each square is worth.',
        Nothing: 'Not quite. Read the axis numbers. Each square along is 2 h, so 3 squares is 6 h.' } },
  ];
  const FINISH = 'Read what a square is worth from the axis numbers before you count, and divide to find a small square. When you draw, take the smallest of 0.5, 1, 2, 5, 10, 20, 50 and so on that fits, keep the steps equal, and check where each axis starts.';
  // When each demonstration's parts arrive, in seconds after the screen opens (the screen itself takes
  // FADE to fade in, so nothing starts before it has settled). scale: the point at the origin with its
  // label; hopping along a square at a time (HOPGAP apart, each hop HOP long), its label counting in the
  // axis's steps; hopping up; the sums. between: the point; the large square split into 5 small ones, with
  // what each is worth; the small squares counted, CNTGAP apart; the label. fit: the readings on 10 L a
  // square; sliding (GLIDE) to 2 L a square; then to 5 L. uneven: the steady line and its readings; their
  // verdict; the uneven labels; the line bending (BEND); the new verdict. zero: the readings from 228 V;
  // the rise bracketed; the axis redrawn from 0, the readings sliding (BEND); the verdict.
  const FADE = 0.35, CNTGAP = 0.3, CNT = 0.3, HOPGAP = 0.3, HOP = 0.25, SHOWUP = 0.3;
  const AT = {
    scale: { pt: 0.6, along: 1.1, up: 2.6, legs: 3.6 },
    between: { pt: 0.6, split: 1.1, count: 1.6, pill: 2.8 },
    fit: { pts: 0.6, second: 1.8, third: 3.1 },
    uneven: { pts: 0.6, tag: 1.1, labels: 1.6, bend: 2.1, tag2: 3.1 },
    zero: { pts: 0.6, rise: 1.1, axis: 2.1, tag: 3.2 },
  };
  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  // While the kit's self-test looks at every screen it switches fades off (the k-testing class):
  // demonstrations then open finished, as they do with reduced motion.
  const testing = () => document.documentElement.classList.contains('k-testing');

  // ---------- numbers (pure, so the checks can test them) ----------
  const r3 = (v) => Math.round(v * 1000) / 1000;
  const num = (v) => { const a = r3(v); return (a < 0 ? '−' : '') + String(Math.abs(a)); };
  // An axis's labels, one to a gridline; where a reading sits along it, in squares; a gridline's value.
  const labelsOf = (a) => (a.labels ? a.labels.slice() : Array.from({ length: a.n + 1 }, (_, k) => r3(a.start + k * a.step)));
  function posOf(a, v) {
    if (!a.labels) return (v - a.start) / a.step;
    const L = a.labels;
    for (let k = 0; k + 1 < L.length; k++) if (v <= L[k + 1] || k + 2 === L.length) return k + (v - L[k]) / (L[k + 1] - L[k]);
    return 0;
  }
  const valOf = (a, s) => r3(a.start + s * a.step);
  const sq = (g, v) => [r3(posOf(g.x, v[0])), r3(posOf(g.y, v[1]))];
  const vals = (g, p) => [valOf(g.x, p[0]), valOf(g.y, p[1])];
  const coord = (v) => '(' + num(v[0]) + ', ' + num(v[1]) + ')';
  const reading = (g, v) => num(v[0]) + ' ' + g.x.u + ', ' + num(v[1]) + ' ' + g.y.u;
  const amt = (v, u) => num(v) + ' ' + u;
  const sameP = (p, q) => !!p && !!q && K.near(p[0], q[0], 1e-9) && K.near(p[1], q[1], 1e-9);
  const keyOf = (p) => num(p[0]) + ',' + num(p[1]);
  const fromKey = (s) => s.split(',').map(Number);
  // 1, 2 or 5 times a power of ten; the smallest such value at least v.
  const is125 = (v) => { const p = Math.pow(10, Math.floor(Math.log10(v) + 1e-9)); return [1, 2, 5].some((m) => K.near(v / p, m, 1e-9)); };
  function next125(v) { for (let p = 0.001; p < 1e7; p *= 10) for (const m of [1, 2, 5]) if (r3(m * p) >= v - 1e-9) return r3(m * p); return NaN; }
  function prev125(v) { let best = NaN; for (let p = 0.001; p < 1e7; p *= 10) for (const m of [1, 2, 5]) if (r3(m * p) < v - 1e-9) best = r3(m * p); return best; }
  const topOf = (d) => Math.max.apply(null, d.data.map((p) => p[1]));
  // A reading between two marks: the large square below it (its index and value), what a small square is
  // worth, and how many small squares past it the reading is.
  function smallOf(g, v) {
    const s = posOf(g.y, v), base = Math.floor(s + 1e-9), small = r3(g.y.step / g.minor);
    return { base: base, baseV: valOf(g.y, base), small: small, n: Math.round((v - valOf(g.y, base)) / small) };
  }
  // A point's place in squares at fraction s of its route, along first, then up.
  function travel(p, s) {
    const d = K.clamp(s, 0, 1) * (p[0] + p[1]);
    return [Math.min(d, p[0]), Math.max(0, d - p[0])];
  }
  // What a puzzle's answer reads, by the rule: the reading the point makes; its value up the side; the
  // smallest of 1, 2, 5 times a power of ten that fits the readings; the reason for the bend; how B compares
  // with A; or what turned the reading into the one logged.
  function answerOf(d) {
    const g = d.g;
    if (d.kind === 'plot') return coord(d.goal);
    if (d.ask === 'read') return reading(g, d.pt);
    if (d.ask === 'between') return amt(d.pt[1], g.y.u);
    if (d.ask === 'choose') return amt(next125(topOf(d) / g.y.n), g.y.u);
    if (d.ask === 'bent') return 'Uneven steps';
    if (d.ask === 'compare') return amt(d.pts.B[1] - d.pts.A[1], g.y.u) + ' more';

  function drawPill(pp, bad) {
    const b = pp.box, n = pp.lines.length;
    rect('pl' + (bad ? ' bad' : ''), b.x0, b.y0, b.x1 - b.x0, b.y1 - b.y0, 8);
    pp.lines.forEach((l, k) => text((b.x0 + b.x1) / 2, b.y0 + (n === 1 ? 18.5 : 17 + 17 * k), l[0], l[1] + (bad && l[1] !== 'ptag' ? ' warnt' : '')));
  }
  // A one-line label in a box whose left edge is at x, centred on y (wide enough for `wide`, its widest text).
  function labelBox(x, y, wide) { const w = tw(wide, 'pv') + 18; return { x0: x, x1: x + w, y0: y - 13, y1: y + 13 }; }
  function drawBox(b, s, bad) { drawPill({ box: b, lines: [[s, 'pv']] }, bad); }
  // A verdict on the graph, in teal (in the warning colour for a slip), its place noted.
  function verdict(x, y, s, anchor, bad) { text(x, y, s, 'tag' + (bad ? ' warnt' : ''), anchor); }
  // Readings at squares (xs(v), ys(v)); one above the top of the graph is an arrowhead pointing up from the
  // top line, in the warning colour.
  function readings(g, data, xs, ys, bad) {
    overMarks(g, data, xs, ys);
    data.forEach((p) => { const sy = ys(p[1]); if (sy <= g.y.n + 1e-6) circle('pt' + (bad ? ' bad' : ''), gx(xs(p[0])), gy(sy), 5); });
  }
  function overMarks(g, data, xs, ys) {
    data.forEach((p) => {
      if (ys(p[1]) <= g.y.n + 1e-6) return;
      const x = gx(xs(p[0])), y = TOP;
      add(K.svg('path', { class: 'over', d: 'M' + r3(x) + ' ' + r3(y - 8) + ' L' + r3(x + 6) + ' ' + r3(y + 2) + ' L' + r3(x - 6) + ' ' + r3(y + 2) + ' Z' }));
    });
  }
  // Readings that slide: every one a dot, drawn inside a window that ends just above the top line, so
  // a reading sliding above it goes out of view rather than changing shape.
  function slidingReadings(g, data, xs, ys) {
    const cp = add(K.svg('clipPath', { id: 'topclip' }));
    cp.appendChild(K.svg('rect', { x: 0, y: TOP - 6, width: 340, height: H - TOP + 6 }));
    const cg = add(K.svg('g', { 'clip-path': 'url(#topclip)' }));
    const keep = into; into = cg;
    data.forEach((p) => circle('pt', gx(xs(p[0])), gy(ys(p[1])), 5));

  }
  const offTop = (g, data, ys) => data.filter((p) => ys(p[1]) > g.y.n + 1e-6).length;
  // A bracket beside the graph from y0 to y1 (picture units), with its words.
  const BRX = OX + 6 * GS + 14;
  function bracket(y0, y1, s, bad) {
    add(K.svg('path', { class: 'brk' + (bad ? ' bad' : ''), d: 'M' + (BRX - 5) + ' ' + r3(y0) + 'H' + BRX + 'V' + r3(y1) + 'H' + (BRX - 5) }));
    text(BRX + 6, r3((y0 + y1) / 2 + 5), s, 'rl' + (bad ? ' warnt' : ''), 'start');
  }

  // --- the demonstrations ---
  // Each returns what the picture shows, in words, and where the point that can be dragged is drawn.
  function hopped(n, t0) { let v = 0; for (let k = 0; k < n; k++) v += arr(t0 + k * HOPGAP, HOP); return v; }
  const DEMO = {
    // The point hops from the origin along, a square at a time, then up, its label counting in the axes'
    // steps (2 h, then 50 L); then the sums. Once dragged it sits where it was put, its label following.
    scale(d, st) {
      const A = AT.scale, g = d.g, mine = st.pos, demo = !mine;
      let cur, pa = 1, lg = 1;
      if (mine) cur = mine;
      else { pa = arr(A.pt); lg = arr(A.legs); cur = [hopped(d.to[0], A.along), hopped(d.to[1], A.up)]; }
      // the label counts a square only once the point has arrived on it
      const shown = cur.map((c) => Math.floor(c + 0.05)), v = vals(g, shown);
      gridLines(g);
      if (demo) band(cur[0], cur[1]);
      axisLines(g);
      nums(g, { hx: shown[0], hy: shown[1], hxa: pa, hya: pa });
      // While it plays, the label's side is chosen once, from where the point ends (clear of the sums
      // that arrive there), and it keeps that place beside the point all the way, so it never jumps.
      noteDot(demo ? d.to : cur);
      const legs = demo ? legBoxes(g, d.to) : [];
      let pp = placePill(demo ? d.to : cur, pillOf(g, demo ? vals(g, d.to) : v));
      if (demo) {
        const dx = gx(cur[0]) - gx(d.to[0]), dy = gy(cur[1]) - gy(d.to[1]), b = pp.box;
        pp = { box: { x0: b.x0 + dx, x1: b.x1 + dx, y0: b.y0 + dy, y1: b.y1 + dy }, lines: pillOf(g, v) };
      }
      part(lg, 0, () => guides(cur, !demo));
      part(pa, 0, () => dot(cur));
      part(lg, 0, () => ring(cur));
      part(lg, 4, () => drawLegs(legs));
      part(pa, 4, () => drawPill(pp));
      const said = [sayG(g) + ' Along goes up in steps of ' + num(g.x.step) + ' hours a square, and up in steps of ' + num(g.y.step) + ' litres.'];
      if (pa >= 0.5) said.push('A point ' + shown[0] + ' squares along and ' + shown[1] + ' up reads ' + coord(v) + ', ' + sayR(g, v) + '.');
      if (lg >= 0.5) said.push('It can be dragged.');
      return { said: said.join(' '), grip: cur };
    },
    // A point between two marks; the large square below it split into 5 small ones, with what each is
    // worth; the small squares counted up from the mark below, the running sum beside them; its label.
    between(d) {
      const A = AT.between, g = d.g, b = smallOf(g, d.pt[1]), p = sq(g, d.pt);
      const po = arr(A.pt), spl = arr(A.split), pa = arr(A.pill);
      const cells = [];
      for (let k = 0; k < b.n; k++) cells.push(arr(A.count + k * CNTGAP, CNT));
      const counted = cells.filter((c) => c >= 0.5).length;
      return drawBetween(d, { po: po, spl: spl, cells: cells, counted: counted, pa: pa, b: b, p: p });
    },
    // The same readings on 10 L a square (squashed into the bottom half), sliding to 2 L a square (most run
    // off the top), then to 5 L (they fit). Dan can set 1, 2, 5 or 10 L himself.
    fit(d, st) {
      const A = AT.fit, g = d.g, mine = st.scale != null;
      const P = mine ? [st.from, st.scale, st.scale] : d.path;
      const pa = mine ? 1 : arr(A.pts);
      const e1 = mine ? K.arrive(T, 0, GLIDE) : arr(A.second, GLIDE), e2 = mine ? 0 : arr(A.third, GLIDE);
      const ys = (v) => K.lerp(K.lerp(v / P[0], v / P[1], e1), v / P[2], e2);
      const tagOf = (s) => {
        const off = offTop(g, d.data, (v) => v / s);
        return off ? [off + ' run off the top', true] : d.data.every((q) => q[1] / s <= g.y.n / 2 + 1e-9) ? ['squashed into the bottom half', false] : ['fits the graph', false];
      };
      // a scale's verdict and its marks for the readings above the top line, which give way together
      const xs = (t) => posOf(g.x, t);
      const drawTag = (s) => () => { const t = tagOf(s); verdict(OX + 8, TOP + 20, t[0], 'start', t[1]); overMarks(g, d.data, xs, (v) => v / s); };
      const ynum = (s) => () => yNums(FUEL(s), { corner: true });
      gridLines(g);
      axisLines(g);
      xNums(g.x, { corner: true });
      if (e2 > 0) swap(e2, ynum(P[1]), ynum(P[2]), 0); else swap(e1, ynum(P[0]), ynum(P[1]), 0);
      part(pa, 0, () => {
        if (e2 > 0) swap(e2, drawTag(P[1]), drawTag(P[2]), 0); else swap(e1, drawTag(P[0]), drawTag(P[1]), 0);
        slidingReadings(g, d.data, xs, ys);
      });
      const now = e2 >= 0.5 ? P[2] : e1 >= 0.5 ? P[1] : P[0], t = tagOf(now);
      pressChooser(d, now);
      return { said: sayG(g) + ' Seven readings, rising 4 litres an hour to 24 litres. Each square up is worth ' + num(now) + (now === 1 ? ' litre' : ' litres') + ', and ' + (t[0] === 'fits the graph' ? 'the readings fit the graph' : t[1] ? t[0].replace(/^(\d+) run/, '$1 of the readings run') : 'the readings are squashed into the bottom half') + '.' };
    },
    // A steady fill (15 L a minute) drawn by its rule, with its readings, straight on labels 0, 20, 40, ...;
    // the labels give way to 0, 10, 20, 30, 50, 100 (the last two in the warning colour) and the line bends.
    uneven(d) {
      const A = AT.uneven, g = d.g, good = g.y, bad = d.bad;
      const pa = arr(A.pts), tg = arr(A.tag), lb = arr(A.labels), bd = arr(A.bend, BEND), tg2 = arr(A.tag2);
      const ys = (v) => K.lerp(posOf(good, v), posOf(bad, v), bd);
      const pts = [], line0 = [];
      for (let t = 0; t <= g.x.n + 1e-9; t += 0.1) line0.push(r3(gx(t)) + ',' + r3(gy(ys(d.rate * t))));
      for (let t = 0; t <= g.x.n; t++) pts.push([t, d.rate * t]);
      gridLines(g);
      axisLines(g);
      xNums(g.x, { corner: true });
      swap(lb, () => yNums(good, { corner: true }), () => yNums(bad, { corner: true, red: bad.red }), 0);
      part(pa, 0, () => {
        leave(bd, () => add(K.svg('polyline', { class: 'dl', points: line0.join(' ') })));
        part(bd, 0, () => add(K.svg('polyline', { class: 'dl bad', points: line0.join(' ') })));
        readings(g, pts, (t) => t, ys);
      });
      const vx = gx(g.x.n) - 6, vy = OY - 16;
      part(tg, 0, () => swap(tg2, () => verdict(vx, vy, 'even steps, straight', 'end'), () => verdict(vx, vy, 'uneven steps, bent', 'end', true), 0));
      const said = [sayG(g) + ' A steady fill of ' + d.rate + ' litres a minute.'];
      said.push(bd >= 0.5 ? 'The labels up the side go 0, 10, 20, 30, 50, 100 on equal squares, the last two marked as the slip, and the same line bends.' : 'The labels go up in equal steps of 20, and the line is straight.');
      return { said: said.join(' ') };
    },
    // Voltage readings on an axis from 228 V, 1 V a square: the 4 V rise bracketed fills the graph; the axis
    // is redrawn from 0, 50 V a square, and the readings slide to lie almost flat.
    zero(d) {
      const A = AT.zero, g = d.g, from = d.from, to = g.y;
      const pa = arr(A.pts), br = arr(A.rise), sw = arr(A.axis, BEND), tg = arr(A.tag);
      const ys = (v) => K.lerp(posOf(from, v), posOf(to, v), sw);
      const lo = Math.min.apply(null, d.data.map((p) => p[1])), hi = Math.max.apply(null, d.data.map((p) => p[1]));
      gridLines(g);
      axisLines(g);
      xNums(g.x, {});
      swap(sw, () => yNums(from, {}), () => yNums(to, {}), 0);
      part(pa, 0, () => readings(g, d.data, (t) => t, ys));
      // the bracket goes as the axis is redrawn: from 0 the rise is too small to bracket
      part(br, 0, () => leave(sw, () => bracket(gy(ys(lo)), gy(ys(hi)), amt(hi - lo, 'V'))));
      part(tg, 4, () => verdict(OX + 8, OY - 16, 'the same readings, from 0', 'start'));
      const said = [sayG(g) + ' Seven readings from ' + lo + ' to ' + hi + ' volts.'];
      said.push(sw >= 0.5 ? 'The axis runs from 0 to 250 volts, and the readings lie almost flat.' : 'The axis starts at 228 volts, 1 volt a square, and the ' + (hi - lo) + ' volt rise fills the graph.');
      return { said: said.join(' ') };
    },
  };
  // The between picture (a demonstration, or a puzzle once answered). o: when the point (po), the split
  // (spl), each counted small square (cells) and the label (pa) arrive.
  function drawBetween(d, o) {
    const g = d.g, b = o.b, p = o.p;
    gridLines(g);
    // the large square above the mark below, split into small squares beside the y-axis; the counted ones lit
    part(o.spl, 0, () => { for (let k = 0; k < g.minor; k++) rect('cellb', OX + 1, gy(b.base + (k + 1) / g.minor), 14, GS / g.minor, 0); });
    o.cells.forEach((c, k) => part(c, 0, () => rect('cell', OX + 1.5, gy(b.base + (k + 1) / g.minor) + 0.5, 13, GS / g.minor - 1, 0)));
    axisLines(g);
    nums(g, { hx: p[0], hxa: o.pa, hy: b.base, hya: o.spl });
    const sTxt = num(g.y.step) + ' ÷ ' + g.minor + ' = ' + num(b.small);
    const cTxt = (k) => num(b.baseV) + ' + ' + k + ' × ' + num(b.small) + ' = ' + num(b.baseV + k * b.small);
    const sBox = labelBox(OX + 22, gy(b.base + 1) - 16, sTxt), cBox = labelBox(OX + 22, gy(b.base) + 14, cTxt(b.n));
    if (o.spl > 0) taken.push(sBox);
    if (o.cells.length && o.cells[0] > 0) taken.push(cBox);
    noteDot(p);
    const pp = placePill(p, pillOf(g, d.pt));
    part(o.pa, 0, () => guides(p, false));
    part(o.po, 0, () => dot(p));
    part(o.spl, 4, () => drawBox(sBox, sTxt));
    if (o.cells.length) part(o.cells[0], 4, () => drawBox(cBox, cTxt(Math.max(1, o.counted))));
    part(o.pa, 4, () => drawPill(pp));
    const said = [sayG(g) + ' Each large square is split into ' + g.minor + ' small ones. A point is marked.'];
    if (o.spl >= 0.5) said.push('The large square from ' + num(b.baseV) + ' to ' + num(b.baseV + g.y.step) + ' litres is split into ' + g.minor + ', ' + num(b.small) + ' litres each.');
    if (o.counted) said.push(cTxt(o.counted).replace(/×/g, 'times').replace(/=/g, 'equals') + '.');
    if (o.pa >= 0.5) said.push('The point reads ' + coord(d.pt) + ', ' + sayR(g, d.pt) + '.');
    return { said: said.join(' ') };
  }

  // --- the puzzles ---
  // Before an answer nothing shows it. After a right answer its motion plays; after a wrong one, what that
  // answer means is drawn in the warning colour.
  function drawDo(d, st) {
    const right = st.res === 'right', A = d.at;
    const wrong = st.res === 'wrong' && (d.kind === 'plot' || st.pick != null);
    const go = (k, dur) => (right && A[k] != null ? arr(A[k], dur) : 0);
    const sl = wrong ? arr(WRONG.slip) : 0;
    if (d.kind === 'plot' || d.ask === 'read' || d.ask === 'spot') return drawRoute(d, st, right, wrong, go, sl);
    if (d.ask === 'between') return drawBetweenDo(d, st, right, wrong, go, sl);
    if (d.ask === 'choose') return drawChoose(d, st, right, wrong, go, sl);
    if (d.ask === 'bent') return drawBent(d, st, right, wrong, go, sl);
    return drawCompare(d, st, right, wrong, go, sl);
  }
  // A point to read (or to drag): the route from the origin, the sums along it and its label, once right.
  function drawRoute(d, st, right, wrong, go, sl) {
    const g = d.g, A = d.at, goalV = d.kind === 'plot' ? d.goal : d.pt, gq = sq(g, goalV);
    const s = go('route', TRAVEL), pa = go('pill'), c = travel(gq, s), bad = wrong ? slipAt(d, st) : null;
    gridLines(g);
    if (s > 0) band(c[0], c[1]);
    if (bad && d.kind === 'plot') part(sl, 0, () => band(bad.p[0], bad.p[1], true));
    axisLines(g);
    nums(g, right ? { hx: gq[0], hy: gq[1], hxa: pa, hya: pa } : {});
    const mine = d.kind === 'plot' ? st.pos : null, marked = d.kind === 'plot' ? null : gq;
    if (marked) noteDot(marked);
    if (mine) noteDot(mine);
    if (right) noteDot(gq);
    if (bad) noteDot(bad.p);
    const claim = d.ask === 'spot' ? placePill(gq, [['logged', 'ptag'], [reading(g, d.claim), 'pv']]) : null;
    const legs = right ? legBoxes(g, gq) : [];
    const pp = right ? placePill(gq, pillOf(g, goalV)) : null;
    const pb = bad ? placePill(bad.p, pillOf(g, bad.v)) : null;
    part(pa, 0, () => guides(gq, false));
    if (marked) dot(marked);
    if (mine && !(wrong && sl >= 1)) dot(mine);
    if (mine && !right && !wrong) ring(mine);
    // the point travelling to the answer on the plot puzzle, faded in as it sets off
    if (right && d.kind === 'plot') walker(c, arr(A.route, SHOWUP));
    if (claim) {
      const sb = right ? arr(A.bad) : 0;
      swap(sb, () => drawPill(claim), () => drawPill(claim, true), 0);
    }
    if (bad) part(sl, 0, () => { dot(bad.p, true); drawPill(pb, true); });
    part(pa, 4, () => { drawLegs(legs); drawPill(pp); });
    const said = [sayG(g) + ' Each square along is ' + num(g.x.step) + ' ' + UNITW[g.x.u] + ' and each square up ' + num(g.y.step) + ' ' + UNITW[g.y.u] + '.'];
    if (d.ask === 'read') said.push('A point is marked, one reading.');
    if (d.ask === 'spot') said.push('A point ' + gq[0] + ' squares along and ' + gq[1] + ' up, labelled as logged at ' + sayR(g, d.claim) + '.' + (right ? ' The logged reading is marked as the slip.' : ''));
    if (mine && !right) said.push('The point to drag is ' + mine[0] + ' squares along and ' + mine[1] + ' up.');
    if (right && pa >= 0.5) said.push('The answer, ' + coord(goalV) + ', ' + sayR(g, goalV) + ', reached ' + gq[0] + ' squares along, then ' + gq[1] + ' up.');
    if (bad && sl >= 0.5) said.push('That answer is the point ' + coord(bad.v) + ', ' + sayR(g, bad.v) + ', marked wrong.');
    return { said: said.join(' '), grip: d.kind === 'plot' && !right ? mine : null };
  }
  // A point between two marks: once right, its small squares counted and its label; a slip's value drawn
  // across to the point's line, in the warning colour.
  function drawBetweenDo(d, st, right, wrong, go, sl) {
    const g = d.g, b = smallOf(g, d.pt[1]), p = sq(g, d.pt), A = d.at;
    const cells = [];
    for (let k = 0; k < b.n; k++) cells.push(right ? arr(A.count + k * CNTGAP, CNT) : 0);
    const r = drawBetween(d, { po: 1, spl: right ? 1 : 0, cells: cells, counted: cells.filter((c) => c >= 0.5).length, pa: go('pill'), b: b, p: p });
    if (!wrong) return r;
    const v = scaleOf(st.pick), y = posOf(g.y, v), pb = placePill([p[0], y], [[amt(v, g.y.u), 'pv']]);
    part(sl, 0, () => { line('gd bad', OX + 2, gy(y), gx(p[0]) - 4, gy(y)); drawPill(pb, true); });
    return { said: r.said + (sl >= 0.5 ? ' ' + num(v) + ' litres would sit at this height, away from the point, marked wrong.' : '') };
  }
  // Readings with no numbers up the side yet: once answered, the side numbered in that answer's scale and
  // the readings plotted on it, with a verdict (a slip's in the warning colour).
  function drawChoose(d, st, right, wrong, go, sl) {
    const g = d.g, scale = right ? scaleOf(d.want) : wrong ? scaleOf(st.pick) : null;
    const la = right ? go('labels') : sl, pa = right ? go('pts') : sl, ta = right ? go('tag') : sl;
    gridLines(g);
    axisLines(g);
    xNums(g.x, { corner: true });
    verdict(OX + 8, TOP + 20, 'highest reading ' + amt(topOf(d), g.y.u), 'start');
    const said = [sayG(g) + ' The side has no numbers yet. The highest reading is ' + topOf(d) + ' litres.'];
    if (scale == null) return { said: said.join(' ') };
    const ys = (v) => v / scale, off = offTop(g, d.data, ys), slip = wrong ? d.slips[st.pick] : null;
    const t = right ? 'fits the graph' : slip === 'over' ? off + ' run off the top' : 'small squares of ' + amt(scale / g.minor, g.y.u);
    part(la, 0, () => yNums(VOL(scale), { corner: true }));
    part(pa, 0, () => readings(g, d.data, (x) => posOf(g.x, x), ys));
    part(ta, 4, () => verdict(gx(g.x.n) - 6, OY - 16, t, 'end', !right));
    if (la >= 0.5) said.push('Numbered at ' + num(scale) + ' litres a square, the readings ' + (off ? 'run off the top, ' + off + ' of them, marked wrong.' : right ? 'fit the graph.' : 'fit, but each small square is ' + num(scale / g.minor) + ' litres, marked wrong.'));
    return { said: said.join(' ') };
  }
  // Readings on uneven time labels: once right, the labels that break the pattern are marked, give way to
  // even ones, and the readings slide into a straight line. After a wrong answer they are marked and stay.
  function drawBent(d, st, right, wrong, go, sl) {
    // the labels that break the pattern turn red once right (and then give way), or after a wrong answer
    const g = d.g, bad = d.bad, rd = right ? go('red') : sl, sw = go('swap'), gl = go('glide', GLIDE), tg = go('tag');
    const xs = (t) => K.lerp(posOf(bad, t), posOf(g.x, t), gl);
    gridLines(g);
    axisLines(g);
    swap(sw, () => swap(rd, () => xNums(bad, { corner: true, red: [] }), () => xNums(bad, { corner: true, red: bad.red }), 0), () => xNums(g.x, { corner: true, red: false }), 0);
    yNums(g.y, { corner: true });
    readings(g, d.data, xs, (v) => posOf(g.y, v));
    const rate = d.data[d.data.length - 1][1] / d.data[d.data.length - 1][0];
    part(tg, 4, () => verdict(gx(g.x.n) - 6, OY - 16, 'a steady ' + amt(rate, 'L') + ' an hour', 'end'));
    const said = [sayG(g) + ' Six readings.'];
    said.push(sw >= 0.5 ? 'The time labels go up in equal steps of 2 hours, and the readings lie in a straight line, a steady ' + rate + ' litres an hour.' : 'The time labels go 0, 1, 2, 3, 5, 10' + (rd >= 0.5 ? ', the last two marked as the slip' : '') + ', and the readings seem to rise faster after 3 hours.');
    return { said: said.join(' ') };
  }
  // Two readings, A and B, on an axis from 228 V: once right, guides to the axis and the 3 V between them;
  // a slip's way of reading them, in the warning colour.
  function drawCompare(d, st, right, wrong, go, sl) {
    const g = d.g, A = sq(g, d.pts.A), B = sq(g, d.pts.B), gu = go('guides'), gp = go('gap');
    const slip = wrong ? d.slips[st.pick] : null;
    gridLines(g);
    axisLines(g);
    xNums(g.x, {});
