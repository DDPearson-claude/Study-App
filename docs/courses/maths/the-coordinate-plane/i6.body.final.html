<p class="caption">A straight line through (0, 0) means in proportion. The amounts and readings are example values.</p>

<script>
  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // g: which graph a step draws on (G below). demo: what a SHOW step plays (dur seconds); cursor: the
  // point riding a line that Dan can slide along it once the demonstration has played (f: the line,
  // its rule in FN). A 'pick' puzzle takes one answer, its picture `pic`; a 'drag' puzzle asks for the
  // point to be put at `to`. fb: how long the motion after a right answer plays; at: when each part of
  // it arrives, in seconds after Check ([start, gap, count] for parts counted one at a time). slips:
  // which slip gives each wrong answer, and hints: what is said for it.
  const PICK = 'Tap one of the answers.', PLACE = 'Drag the point to its place first.';
  // After a right answer. DOUBLE: the line through (0, 0) and the given point grows on, the guides to
  // the answer, then its point and readout. MISS: the line's start ringed and named; the reading at 20 m;
  // the reading at 40 m, not double. READ: the point travels along the curve, then the readout. STEEP:
  // each line's ohms at its end, one at a time. PLOT: the guides, then the readout. CORNER: the side's
  // numbers redrawn from 0 as the line eases up to its start, then that start named. FIT: the best-fit line grows, its name, then
  // where it runs through.
  const DOUBLE = { line: 0.1, guides: 0.6, pt: 1.1 };
  const MISS = { ring: 0.1, r20: 0.6, r40: 1.1 };
  const READ = { move: 0.1, ro: 0.6 };
  const STEEP = { ohm: [0.1, 0.25, 3] }, STEEP2 = { ohm: [0.1, 0.25, 2] };
  const PLOT = { guides: 0.1, ro: 0.6 };
  const CORNER = { regrid: 0.1, ring: 0.9 };
  const FIT = { line: 0.1, label: 0.6, ro: 1.1 };
  // After a wrong answer: the slip, in the warning colour.
  const WRONG = { slip: 0.1 }, WRONG_DUR = 0.7;
  // How long a counted part takes to arrive, a line to grow, a point to travel along a line, a best-fit
  // line to grow, and the swapped line to swing.
  const COUNT = 0.3, GROW = 0.7, TRAVEL = 0.8, LINE_T = 0.8, SWING = 1.2, REGRID = 0.7;
  // A reading that steps along a line hops a square at a time: each hop takes HOP seconds, a hop starting
  // every HOPS seconds, and its readout counts when it lands. The numbers it sits on fade in over PICK_T
  // as it lands (and out as it leaves); on the first screen it hops to each point in COUNT_HOP.
  const HOP = 0.25, HOPS = 0.45, PICK_T = 0.25, COUNT_HOP = 0.2;
  // An answer's motion: the given point's guides and numbers fade out over this while the new ones arrive.
  const OLD = [0.1, 0.3];

  // The graphs: x along (6 squares of x.step), y up (y.n squares of y.step from y.min), each axis named
  // with its unit. A unit written before the number (£) is `pre`.
  const G = {
    vi: { x: { name: 'current (A)', unit: 'A', step: 1 }, y: { name: 'voltage (V)', unit: 'V', step: 5, min: 0, n: 6 } },
    vi14: { x: { name: 'current (A)', unit: 'A', step: 1 }, y: { name: 'voltage (V)', unit: 'V', step: 2, min: 0, n: 7 } },
    iv: { x: { name: 'voltage (V)', unit: 'V', step: 5 }, y: { name: 'current (A)', unit: 'A', step: 1, min: 0, n: 6 } },
    iv6: { x: { name: 'voltage (V)', unit: 'V', step: 1 }, y: { name: 'current (A)', unit: 'A', step: 1, min: 0, n: 6 } },
    bill: { x: { name: 'time (h)', unit: 'h', step: 1 }, y: { name: 'cost (£)', unit: '£', step: 50, min: 0, n: 6 } },
    drum: { x: { name: 'cable (m)', unit: 'm', step: 10 }, y: { name: 'weight (kg)', unit: 'kg', step: 10, min: 0, n: 6 } },
    heat: { x: { name: 'current (A)', unit: 'A', step: 1 }, y: { name: 'power (W)', unit: 'W', step: 50, min: 0, n: 4 } },
    tank: { x: { name: 'time (min)', unit: 'min', step: 1 }, y: { name: 'level (cm)', unit: 'cm', step: 5, min: 20, n: 6 } },
    tank0: { x: { name: 'time (min)', unit: 'min', step: 1 }, y: { name: 'level (cm)', unit: 'cm', step: 10, min: 0, n: 6 } },
  };
  const NX = 6;
  // The rules the lines are drawn from. A resistor by V = IR; the call-out bill, £40 plus £30 an hour;
  // the cable drum, 20 kg empty plus 0.5 kg a metre; the heater by P = I²R at 5 Ω; the part's bent V-I
  // curve, drawn from example numbers (through (2, 5), (4, 15) and (6, 30)); the tank, 20 cm at the start
  // and 5 cm a minute. All are example values.
  const ohm = (R) => (I) => R * I;
  const BILL = { fixed: 40, rate: 30 }, DRUM = { empty: 20, per: 0.5 }, HEAT_R = 5, PART = { a: 1.25, b: 0.625 }, TANK = { start: 20, rate: 5 };
  const FN = {
    R3: ohm(3), R5: ohm(5), R10: ohm(10),
    bill: (h) => BILL.fixed + BILL.rate * h,
    drum: (m) => DRUM.empty + DRUM.per * m,
    heat: (I) => I * I * HEAT_R,
    part: (I) => PART.a * I + PART.b * I * I,
    tank: (t) => TANK.start + TANK.rate * t,
  };
  // The resistors on the steepness puzzles, by their letters: voltage up the side (screen 8), and current
  // up the side (screen 11), where each line is I = V / R and the one that climbs less has more ohms.
  const LINES = { 'Line A': 4, 'Line B': 8, 'Line C': 3 }, LINES_I = { 'Line A': 6, 'Line B': 15 };
  // A resistor's measured readings (example values): 5 V an amp, give or take a little.
  const READINGS = [[0, 0], [1, 6], [2, 8.5], [3, 16.5], [4, 17.5], [5, 26.5]];

  const STEPS = [
    { show: true, g: 'vi', demo: 'line', dur: 3.7, cursor: { f: 'R5' }, name: 'A line through zero',
      text: 'By V = IR, a 5 Ω resistor takes 5 V at 1 A and 10 V at 2 A. Its points make a straight line through (0, 0), the mark of amounts *in proportion*.' },
    { kind: 'pick', pic: 'double', g: 'vi14', R: 3, from: 2, x2: 4, opts: ['(4, 12)', '(4, 8)', '(4, 6)'], want: '(4, 12)', slips: { '(4, 8)': 'add', '(4, 6)': 'same' }, fb: 1.7, at: DOUBLE, name: 'Double it',
      task: 'A resistor reads 6 V at 2 A, and its graph is a straight line through (0, 0). Which point is on it at 4 A?',
      why: 'On a straight line through (0, 0), doubling the current doubles the voltage. 4 A is double 2 A, so the voltage is 2 × 6 = 12 V, the point (4, 12).',
      hint: 'Not quite. 4 A is double 2 A. What happens to the voltage?',
      hints: { '(4, 8)': 'Not quite. That adds 2 to the voltage. On a line through (0, 0), doubling the current doubles the voltage.',
        '(4, 6)': 'Not quite. That keeps 6 V. More current through the same resistor takes more voltage.' } },
    { show: true, g: 'bill', demo: 'bill', dur: 3.7, cursor: { f: 'bill' }, name: 'Straight, but not through zero',
      text: 'A £40 call-out plus £30 an hour makes a straight line too, but it starts at £40. So 4 hours cost £160, not double the £100 for 2 hours.' },
    { kind: 'pick', pic: 'miss', g: 'drum', opts: ['Yes, it is straight', 'No, it misses (0, 0)', 'No, it bends'], want: 'No, it misses (0, 0)', slips: { 'Yes, it is straight': 'straight', 'No, it bends': 'bends' }, fb: 1.7, at: MISS, name: 'In proportion?',
      task: 'As cable is wound onto a drum, the drum gets heavier. Is its weight in proportion to the length of cable?',
      why: 'The line is straight, but at 0 m the empty drum already weighs 20 kg, so the line misses (0, 0). 20 m weighs 30 kg and 40 m weighs 40 kg, not double.',
      hint: 'Not quite. Look at where the line meets the weight axis.',
      hints: { 'Yes, it is straight': 'Not quite. Straight is not enough. Where is the line at 0 m?',
        'No, it bends': 'Not quite. The line is straight. Look at where it meets the weight axis.' } },
    { show: true, g: 'heat', demo: 'heat', dur: 3.7, cursor: { f: 'heat' }, name: 'Through zero, but bent',
      text: 'By P = I²R, a 5 Ω heater\'s power graph starts at (0, 0) but curves upwards. From 2 A to 4 A it goes from 20 W to 80 W, four times as much.' },
    { kind: 'pick', pic: 'curve', g: 'vi', from: 2, x2: 4, opts: ['15 V', '10 V', '20 V'], want: '15 V', slips: { '10 V': 'double', '20 V': 'four' }, fb: 1.25, at: READ, name: 'Read the curve',
      task: 'This part\'s V-I graph bends. It takes 5 V at 2 A. What voltage does it take at 4 A?',
      why: 'The graph bends, so doubling does not work. Read up from 4 A to the curve, then across to the side. It takes 15 V, three times the 5 V at 2 A.',
      hint: 'Not quite. Read up from 4 A to the curve, then across to the voltage.',
      hints: { '10 V': 'Not quite. That doubles 5 V, as if it were in proportion. This graph bends, so read it off the curve at 4 A.',
        '20 V': 'Not quite. That is four times 5 V, as the heater\'s power went. Read this curve itself at 4 A.' } },
    { show: true, g: 'vi', demo: 'steep', dur: 3.2, cursor: { f: 'R10', also: 'R5' }, name: 'Steeper means more ohms',
      text: 'With voltage up the side, a 10 Ω resistor\'s line is *steeper* than a 5 Ω one. At 2 A it takes 20 V, where the 5 Ω takes 10 V. On the same axes, steeper means more ohms.' },
    { kind: 'pick', pic: 'steep', g: 'vi', opts: ['Line A', 'Line B', 'Line C'], want: 'Line B', slips: { 'Line A': 'far', 'Line C': 'flat' }, fb: 1.2, at: STEEP, name: 'Most ohms',
      task: 'With voltage up the side, which resistor has the most ohms?',
      why: 'Line B is the steepest. At 3 A it takes 24 V, where line A takes 12 V and line C takes 9 V. More volts for each amp means more ohms.',
      hint: 'Not quite. Compare how steeply the lines climb.',
      hints: { 'Line A': 'Not quite. Line A runs furthest, but it climbs less steeply than B. At 3 A it takes 12 V, and B takes 24 V.',
        'Line C': 'Not quite. Line C is the flattest, so each amp takes the fewest volts. That is the fewest ohms.' } },
    { show: true, g: 'vi', demo: 'swap', dur: 3.2, name: 'Axes swapped',
      text: 'Bitesize puts voltage up the side, as this lesson has so far. Some books put current up the side instead. Then the 5 Ω line is the steeper one, so read the labels first.' },
    { kind: 'drag', g: 'iv6', R: 3, I: 2, to: [6, 2], start: [1, 5], want: '(6, 2)', fb: 1.2, at: PLOT, name: 'Current up the side',
      slips: { '(2, 6)': 'swap', '(5, 2)': 'add' },
      task: 'This graph has current up the side. Drag the point to show a 3 Ω resistor carrying 2 A.',
      why: 'By V = IR, 2 A through 3 Ω takes 2 × 3 = 6 V. Current goes up the side here, so the point is 6 along and 2 up, (6, 2).',
      hint: 'Not quite. Work out the voltage by V = IR, then put the current up and the voltage along.',
      hints: { '(2, 6)': 'Not quite. That puts 6 up the side, as if voltage went up. Here current goes up, so 2 A is 2 up and 6 V is 6 along.',
        '(5, 2)': 'Not quite. That adds 3 and 2. By V = IR, 2 A through 3 Ω takes 2 × 3 = 6 V.' } },
    { kind: 'pick', pic: 'steep', g: 'iv', lines: LINES_I, badges: { 'Line A': 15, 'Line B': 20 }, opts: ['Line A', 'Line B'], want: 'Line B', slips: { 'Line A': 'steeper' }, fb: 1.2, at: STEEP2, name: 'Labels first',
      task: 'This graph has current up the side. Which resistor has more ohms?',
      why: 'Current is up the side here. At 30 V, line A carries 5 A and line B only 2 A. More volts for each amp means more ohms, so line B has more.',
      hint: 'Not quite. Read the labels first. Which line takes more volts for each amp?',
      hints: { 'Line A': 'Not quite. Current is up the side here, so the line that climbs less takes more volts for each amp.' } },
    { kind: 'pick', pic: 'corner', g: 'tank', opts: ['Yes, it is straight', 'Yes, from the corner', 'No, it misses (0, 0)'], want: 'No, it misses (0, 0)', slips: { 'Yes, it is straight': 'straight', 'Yes, from the corner': 'corner' }, fb: 1.5, at: CORNER, name: 'Check the corner',
      task: 'This tank\'s level graph is straight and starts in the corner. Is the level in proportion to the time?',
      why: 'The side starts at 20 cm, not 0, so the corner is (0, 20). At 0 min the tank already holds 20 cm, so the line misses (0, 0).',
      hint: 'Not quite. Read the numbers up the side, starting at the corner.',
      hints: { 'Yes, it is straight': 'Not quite. Straight is not enough, as it must pass through (0, 0). Read the side\'s number at the corner.',
        'Yes, from the corner': 'Not quite. The corner here is 20 cm, not 0. Read the numbers up the side.' } },
    { kind: 'pick', pic: 'measured', g: 'vi', opts: ['Yes', 'No, they zigzag', 'No, they bend'], want: 'Yes', slips: { 'No, they zigzag': 'dots', 'No, they bend': 'bend' }, fb: 1.7, at: FIT, name: 'Measured readings',
      task: 'These are a resistor\'s measured readings. Is its voltage in proportion to its current?',
      why: 'Measured readings wobble a little. One best-fit line through them is straight and runs through (0, 0), so the voltage is in proportion to the current.',
      hint: 'Not quite. Picture one best-fit line through the readings.',
      hints: { 'No, they zigzag': 'Not quite. Joining the dots makes a zigzag of small wobbles. Picture one best-fit line through them instead.',
        'No, they bend': 'Not quite. The readings wobble either side of one straight line, but they do not curve away from it.' } },
  ];
  const FINISH = 'Two amounts are in proportion when their graph is a straight line through (0, 0). A line that misses (0, 0), or bends, is not. With voltage up the side, a steeper V-I line on the same axes means more ohms, but read the labels first, as some graphs swap them.';
  // When each demonstration's parts arrive, in seconds after the screen opens (the screen itself takes
  // FADE to fade in, so nothing starts before it has settled); [start, gap, count] for parts counted one
  // at a time. line: the points at 0 to 5 A one at a time, the reading following them; the line grows
  // through them; its ohms. bill and heat: the line or curve grows; (bill) its start ringed and named;
  // the reading at 2; the reading hops to 3, then 4; the note. steep: the 5 Ω line grows, its name; the
  // 10 Ω line, its name; the reading at 2 A. swap: the axes' names and numbers change places as the 10 Ω
  // line swings; its name; the note.
  const FADE = 0.35;
  const AT = {
    line: { pts: [0.6, 0.3, 6], line: 2.6, label: 3.1 },
    bill: { line: 0.6, ring: 1.1, cur: 1.6, hops: [2.1, HOPS, 2], note: 3.1 },
    heat: { line: 0.6, cur: 1.6, hops: [2.1, HOPS, 2], note: 3.1 },
    steep: { l5: 0.6, n5: 1.1, l10: 1.6, n10: 2.1, cur: 2.6 },
    swap: { axes: 0.6, label: 2.1, note: 2.6 },
  };
  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  // While the kit's self-test looks at every screen it switches fades off (the k-testing class):
  // demonstrations then open finished, as they do with reduced motion.
  const testing = () => document.documentElement.classList.contains('k-testing');

  // ---------- numbers (pure, so the checks can test them) ----------
  const r3 = (v) => Math.round(v * 1000) / 1000;
  const num = (v) => { const a = r3(v); return (a < 0 ? '−' : '') + Math.abs(a); };
  const pair = (x, y) => '(' + num(x) + ', ' + num(y) + ')';
  const parsePair = (s) => { const m = /^\((−?)([\d.]+), (−?)([\d.]+)\)$/.exec(s); return m ? [(m[1] ? -1 : 1) * +m[2], (m[3] ? -1 : 1) * +m[4]] : null; };
  const amt = (v, u) => (u === '£' ? '£' + num(v) : num(v) + ' ' + u);
  // The best-fit line of readings: the straight line y = a + b x they sit closest to overall (the
  // smallest total of their squared gaps up or down to it).
  function fitOf(cols) {
    const n = cols.length, mx = cols.reduce((s, c) => s + c[0], 0) / n, my = cols.reduce((s, c) => s + c[1], 0) / n;
    let sxy = 0, sxx = 0;
    cols.forEach((c) => { sxy += (c[0] - mx) * (c[1] - my); sxx += (c[0] - mx) * (c[0] - mx); });
    const b = sxy / sxx;
    return { a: my - b * mx, b: b };
  }
  const lineFn = (L) => (x) => L.a + L.b * x;
  // The doubling test: does f(2x) = 2 f(x)? On a line through (0, 0) it holds everywhere.
  const doubles = (f, x) => K.near(f(2 * x), 2 * f(x), 1e-9);
  // What each slip makes of an answer. add: the change in current added to the voltage; same: the voltage
  // kept; double: the curve's reading doubled; four: four times it; swap: current along and voltage up;
  // addR: the ohms added to the amps.
  const SLIP = {
    add: (d) => [d.x2, d.R * d.from + (d.x2 - d.from)],
    same: (d) => [d.x2, d.R * d.from],
    double: (d) => 2 * FN.part(d.from),
    four: (d) => 4 * FN.part(d.from),
    swap: (d) => [d.I, d.R * d.I],

  // The lines on the steepness puzzle, and how far each runs on the graph (in squares).

  // A pick's slip as its button reads.
  function slipOpt(d, s) {
    if (d.pic === 'double') return pair.apply(null, SLIP[s](d));
    if (d.pic === 'curve') return amt(SLIP[s](d), 'V');
    if (d.kind === 'drag') return pair.apply(null, s === 'swap' ? SLIP.swap(d) : SLIP.add2(d));
    if (d.pic === 'steep') {
      const L = linesOf(d), names = Object.keys(L), best = answerOf(d);
      // steeper: with current up the side, the line that climbs most, which has the fewest ohms
      if (s === 'steeper') return names.filter((n) => L[n] === Math.min.apply(null, names.map((m) => L[m])))[0];

  // The answer a puzzle wants, worked out by its rule, as its button reads.
  function answerOf(d) {

  const say = (s) => String(s).replace(/\((−?[\d.]+), (−?[\d.]+)\)/g, ' the point $1, $2 ').replace(/£(\d[\d.]*)/g, '$1 pounds').replace(/(\d) min\b/g, '$1 minutes').replace(/(\d) h\b/g, '$1 hours')
    .replace(/(\d) cm\b/g, '$1 centimetres').replace(/(\d) kg\b/g, '$1 kilograms').replace(/(\d) m\b/g, '$1 metres').replace(/(\d) V\b/g, '$1 volts').replace(/(\d) A\b/g, '$1 amps')
    .replace(/(\d) W\b/g, '$1 watts').replace(/Ω/g, ' ohms').replace(/²/g, ' squared').replace(/−/g, ' minus ').replace(/×/g, ' times ').replace(/=/g, ' equals ').replace(/[()]/g, ' ').replace(/\s+/g, ' ').trim();

  function blank(i) { return { pick: null, res: null, why: false, pt: null, moved: false, c: null }; }
  const emptyFor = (i, st) => (STEPS[i].kind === 'drag' ? (st.moved ? '' : PLACE) : st.pick != null ? '' : PICK);
  const isEmpty = (i, st) => !!emptyFor(i, st);
  const isRight = (i, st) => !isEmpty(i, st) && st.pick === STEPS[i].want;

  const hintFor = (i, st) => { const d = STEPS[i]; return (d.hints && d.hints[st.pick]) || d.hint; };

  function solved(i) { const d = STEPS[i], st = blank(i); st.res = 'right'; st.moved = true; st.pick = d.want; if (d.kind === 'drag') st.pt = d.to.slice(); return st; }

  let S = STEPS.map((d, i) => blank(i));
  let finished = false, lastStep = -1, lastDone = false, T = Infinity;   // T: seconds into the current motion
  let motion = null, motionEnd = 0;                                      // what is moving: 'demo' or 'fb'

  // ---------- text with amber key terms (built with K.el, never innerHTML) ----------
  // V, I, R and P, the letters in V = IR and P = I²R, alone or as IR and I²R, but not inside a word or a
  // unit after its number ("6 V").
  const VRE = /(?<![A-Za-z'’])(?:I²R|IR|[VIRP])(?![A-Za-z-])/g;
  function spans(s) {
    const out = [];
    let at = 0, m;

      if (/\d $/.test(s.slice(0, m.index)) || /-$/.test(s.slice(0, m.index))) continue;

  function pieces(el, text) {
    const re = /\*([^*]+)\*/g;

  // A point, an amount or a sum stays together on one line ("(4, 12)", "5 Ω", "£160", "2 × 6 = 12 V",

  const TOK = '(?:\\(−?\\d+(?:\\.\\d+)?, −?\\d+(?:\\.\\d+)?\\)|£\\d+|I²R|IR|[VIRP](?![A-Za-z-])|−?\\d+(?:\\.\\d+)?(?: (?:V|A|Ω|W|kg|cm|min|m|h)(?![A-Za-z]))?)';

  }

  // ---------- controls ----------

  // Up to three answer buttons; each step fills in its own options.

  const checkBtn = K.button({ label: 'Check', into: '#acts', press: () => {
    const i = here(), d = STEPS[i], st = S[i];
    if (d.show || finished) return;
    if (isEmpty(i, st)) { st.res = 'empty'; return; }

  const replayBtn = K.button({ label: 'Play again', secondary: true, into: '#replay', press: () => {

    play(d.dur, 'demo');
  } });
  const backBtn = K.button({ label: 'Back', secondary: true, into: '#nav', press: () => {
    if (finished) { finished = false; return; }

  } });
  const nextBtn = K.button({ label: 'Continue', into: '#nav', press: () => {
    const i = here();
    if (finished || (!STEPS[i].show && S[i].res !== 'right')) return;

  // One animation plays each demonstration and the motion after an answer, from its start; with
  // reduced motion (and while the self-test looks) it opens finished.

    if (finished) return false;
    T += dt;
    paint();
    return T < motionEnd;
  } });
  // The kit pauses the motion while the page is hidden (Dan switches app or locks the phone) and
  // resumes it when he comes back; this only settles a motion that had already stopped.
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !anim.playing() && T !== Infinity) { T = Infinity; paint(); } });
  function play(dur, kind) {
    motion = kind;
    if (REDUCE || testing()) { T = Infinity; anim.pause(); paint(); return; }
    motionEnd = dur; T = 0; anim.play();
  }
  // A new screen (or the finish panel) fades in softly: the CSS animation restarts on it.
  function enter(id) {
    if (REDUCE) return;
    const box = document.getElementById(id);
    box.classList.remove('enter');
    void box.offsetWidth;
    box.classList.add('enter');
  }

  // ---------- drawing ----------
  // The graph's left edge is OX and its top PT, each square Q across; the side's name (and the readout)
  // sit on the row YNY above it.
  const OX = 44, PT = 44, Q = 32, YNY = 24, RIGHT = OX + NX * Q;

  let F = null;                                      // the graph being drawn: its axes and scales
  let H = 262;
  function frame(g) { return { g: g, xs: g.x.step, ys: g.y.step, ymin: g.y.min, ymax: g.y.min + g.y.n * g.y.step, xmax: NX * g.x.step, n: g.y.n, bottom: PT + g.y.n * Q }; }
  const gx = (v) => OX + Q * v / F.xs;

  const heightOf = (g) => PT + g.y.n * Q + 26;

  let latest = 0, earliest = Infinity;
  function note(t0, d) { if (t0 + d > latest) latest = t0 + d; if (t0 < earliest) earliest = t0; }
  function arr(t0, d) { d = d == null ? K.SOFT : d; note(t0, d); return K.arrive(T, t0, d); }

  }

  const rect = (cls, x, y, w, h, rx) => add(K.svg('rect', { class: cls, x: r3(x), y: r3(y), width: Math.max(0, r3(w)), height: Math.max(0, r3(h)), rx: rx || 0 }));
  const line = (cls, x1, y1, x2, y2) => add(K.svg('line', { class: cls, x1: r3(x1), y1: r3(y1), x2: r3(x2), y2: r3(y2) }));
  const circle = (cls, cx, cy, r) => add(K.svg('circle', { class: cls, cx: r3(cx), cy: r3(cy), r: r }));
  const path = (cls, d) => add(K.svg('path', { class: cls, d: d }));

  }

  // Gridlines and the axes with arrowheads; then (axisText) their names, with units, and the numbers along

    const hys = o.hys || (o.hy != null ? [[o.hy, o.hya == null ? 1 : o.hya]] : []);

      number(v, picked(hys, v), OX - 6, gy(v) + 5, 'end', k === 0 && o.corner >= 0.5 ? ' warnt' : '');
    }
  }
  function grid(o) { gridLines(); axisText(o); }
  const unitWord = (u) => ({ A: 'amps', V: 'volts', W: 'watts', h: 'hours', min: 'minutes', m: 'metres', kg: 'kilograms', cm: 'centimetres', '£': 'pounds' }[u]);
  // One square's worth, said: "1 amp a square", "5 volts a square".
  const perSquare = (v, u) => say(amt(v, u)).replace(/^1 (amp|hour|minute|volt|watt|metre|kilogram|centimetre|pound)s\b/, '1 $1');
  const graphSaid = () => 'A graph with ' + F.g.x.name.replace(/ \(.*/, '') + ' along, ' + perSquare(F.xs, F.g.x.unit) + ' a square, and ' +
    F.g.y.name.replace(/ \(.*/, '') + ' up, ' + perSquare(F.ys, F.g.y.unit) + ' a square, from ' + say(num(F.ymin)) + ' to ' + say(num(F.ymax)) + ' ' + unitWord(F.g.y.unit) + '.';
  const dot = (p, cls) => circle('pt' + (cls ? ' ' + cls : ''), gx(p[0]), gy(p[1]), 6);
  // The dashed guides to a point: up from its place on the bottom axis, and across from the side.
  function guideUp(p) { const y0 = F.bottom - 2, y = gy(p[1]); if (y0 - y - 8 > 1) line('gd', gx(p[0]), y0, gx(p[0]), y + 8); }
  function guideAcross(p) { const x1 = gx(p[0]) - 8; if (x1 - (OX + 2) > 1) line('gd', OX + 2, gy(p[1]), x1, gy(p[1])); }

  // A rule's line or curve across the graph from x = 0 (to xEnd, if given), grown from there as far as e.
  function plot(f, cls, e, xEnd) {

    let d = '';
    for (let k = 0; k <= n; k++) { const x = x1 * k / n; d += (k ? 'L' : 'M') + r3(gx(x)) + ' ' + r3(gy(f(x))); }
    path(cls, d);
  }
  // Dot to dot: the pieces between readings.
  function zigzag(cols) { let d = ''; cols.forEach((c, k) => { d += (k ? 'L' : 'M') + r3(gx(c[0])) + ' ' + r3(gy(c[1])); }); path('zz', d); }
  // A short name: at the right-hand end of a line that leaves by the right edge, or just right of where it
  // leaves by the top; push moves it further out (clear of the reading's ring when that sits at the end).
  function endLabel(f, s, warn, push) {
    const x = xTop(f), cls = 'lbl' + (warn ? ' warnt' : ''), out = push || 0;
    if (x >= F.xmax - 1e-9) text(RIGHT + 10 + out, gy(f(x)) + 5, s, cls, 'start');
    else text(gx(x) + 8 + out, PT + 12, s, cls, 'start');
  }
  // How far an end label moves out when the reading c sits at its line's end, so the ring stays clear of it.
  const RING_PUSH = 8;
  const pushAt = (d, c, f) => (T === Infinity && c != null && K.near(c, Math.floor(xTop(f) / F.xs + 1e-9) * F.xs, 1e-9) ? RING_PUSH : 0);
  // A line's letter on a patch at (x, y).
  function badge(s, x, y, warn) { rect('bdg' + (warn ? ' bad' : ''), x - 10, y - 10, 20, 20, 10); text(x, y + 4.5, s, 'bdl' + (warn ? ' warnt' : '')); }
  // The readout on the row above the graph: a point's (x, y) and what it says, or a short statement.
  function readout(p, warn) {

  }
  function readout2(big, small, warn) { const w = warn ? ' warnt' : ''; text(338, YNY, big, 'ro' + w, 'end'); text(338 - tw(big, 'ro') - 10, YNY - 1, small, 'rou' + w, 'end'); }
  const readoutHidden = () => text(338, YNY, '(?, ?)', 'ro q', 'end');
  // A label on a patch of the page, so a reading's guide slides behind it rather than through it.
  function plabel(x, y, s, cls) { const w = tw(s, cls); rect('patch', x - 3, y - 12, w + 6, 16, 3); text(x, y, s, cls, 'start'); }
  // Where a line meets the side: a point there, and its amount just under the line.
  function startMark(f, u, warn) { dot([0, f(0)], warn ? 'bad' : null); plabel(OX + 8, gy(f(0)) + 16, amt(f(0), u), 'lbl' + (warn ? ' warnt' : '')); }
  // A short note under and to the right of a point on a rising line, clear of the line.
  const noteAt = (p, s, warn) => plabel(gx(p[0]) + 9, gy(p[1]) + 19, s, 'lbl' + (warn ? ' warnt' : ''));
  // A reading the cursor has left: a small ink dot, and its amount on a patch to its left (dx along, dy
  // down from the dot), above the line and clear of the guides.
  function markAt(p, s, dx, dy) { circle('pt', gx(p[0]), gy(p[1]), 4.5); plabel(gx(p[0]) + dx - tw(s, 'lbl'), gy(p[1]) + dy, s, 'lbl'); }
  const MARK = { bill: [-10, -3], heat: [-14, -2] };

  // --- the reading cursor on a demonstration: a point riding a line, its guides and its readout ---
  // c: where it is along; f: the line it rides (also: a second line its guide crosses); a: how far it
  // has arrived. Once a demonstration has played, Dan can slide it (the soft ring shows it moves).
  function cursorMax(d) { return Math.floor(xTop(FN[d.cursor.f]) / F.xs + 1e-9) * F.xs; }
  let shownC = null;                                 // where the reading was last drawn along
  function cursorDot(d, c, live) { if (live == null) live = T === Infinity; if (live) circle('ringp', gx(c), gy(FN[d.cursor.f](c)), 15); dot([c, FN[d.cursor.f](c)]); }
  function drawCursor(d, c, a, live, count, late) {
    shownC = c;
    const f = FN[d.cursor.f], g = d.cursor.also ? FN[d.cursor.also] : null, p = [c, f(c)];
    const shown = count == null ? c : count, ps = [shown, f(shown)];
    part(a, 0, () => {
      guideUp(p); guideAcross(p);
      if (g) { guideAcross([c, g(c)]); dot([c, g(c)]); }
      if (!late) cursorDot(d, c, live);
      if (g) readout2(amt(g(shown), F.g.y.unit) + ', ' + amt(f(shown), F.g.y.unit), 'at ' + amt(shown, F.g.x.unit));
      else readout(ps);
    });
  }
  const onGrid = (v) => K.near(v / F.ys - Math.round(v / F.ys), 0, 1e-9);
  // The cursor's place now: Dan's, once he has moved it; else where the demonstration has it.
  const cursorAt = (i, demoC) => (S[i].moved && S[i].c != null ? S[i].c : demoC);

  // --- the demonstrations (SHOW steps), drawn at time T ---
  // A line through zero: the points at 0 to 5 A one at a time, the reading following each; the line
  // grows through them; its ohms at its end.
  function demoLine(i, d) {
    const A = AT.line, f = FN.R5, pts = [0, 1, 2, 3, 4, 5].map((I) => [I, f(I)]);
    const as = pts.map((p, k) => arr(nth(A.pts, k), COUNT)), got = as.filter((a) => a >= 0.5).length;
    const e = grow(A.line, 0.8), la = arr(A.label);
    const moved = S[i].moved && S[i].c != null, done = T === Infinity;
    // Halfway through each point's arrival the reading sets off for it, a short eased hop; the numbers
    // it lands on fade in as it goes, and the last ones fade out.
    const go = pts.map((p, k) => nth(A.pts, k) + COUNT / 2), pick = go.map((t) => arr(t, PICK_T));
    const hops = go.map((t) => K.ease(lin(t, COUNT_HOP)));
    let k = 0;
    while (k + 1 < pts.length && hops[k + 1] > 0) k++;
    const demoC = k ? K.lerp(k - 1, k, hops[k]) : 0, c = cursorAt(i, demoC);
    const count = moved ? c : hops[k] >= 1 || k === 0 ? k : k - 1;
    const sits = moved ? [[c, 1]] : pts.map((p, j) => [p[0], pick[j] * (j + 1 < pts.length ? 1 - pick[j + 1] : 1)]);
    grid({ hxs: sits, hys: sits.map((h) => [f(h[0]), h[1]]) });
    plot(f, 'fit', e);
    pts.forEach((p, j) => part(as[j], 3, () => dot(p)));
    part(la, 0, () => endLabel(f, '5 Ω', false, pushAt(d, moved ? c : null, f)));
    if (as[0] > 0 || moved) drawCursor(d, c, moved ? 1 : as[0], done, count);
    const said = [graphSaid()];
    if (got) said.push('By V equals I R, a 5 ohm resistor\'s points are plotted: ' + pts.slice(0, got).map((p) => say(pair(p[0], p[1]))).join(', ') + '.');
    if (e > 0.5) said.push('They lie on one straight line through the point 0, 0.');
    said.push('The reading is at ' + say(amt(count, 'A')) + ', ' + say(amt(f(count), 'V')) + '.');
    return said.join(' ');
  }
  // Straight, but not through zero (the bill) and through zero, but bent (the heater): the line grows; (the
  // bill) its start ringed and named; the reading at 2; it travels to 4, counting; the note.
  function demoTravel(i, d) {
    const A = AT[d.demo], f = FN[d.cursor.f], bill = d.demo === 'bill';
    const e = grow(A.line, 0.8), ra = bill ? arr(A.ring) : 0, ca = arr(A.cur), na = arr(A.note);
    const hop = (k) => K.ease(lin(nth(A.hops, k), HOP)), demoC = 2 + hop(0) + hop(1);
    const moved = S[i].moved && S[i].c != null, c = cursorAt(i, demoC);
    const count = moved ? c : Math.floor(demoC + 1e-9);
    // The number the reading sits on: 2 arrives with it; as it hops off, that one fades out, and each new
    // one fades in as the reading lands on it.
    const sits = moved ? [[c, 1]] : [[2, ca * (1 - hop(0))], [3, arr(nth(A.hops, 0) + HOP, PICK_T) * (1 - hop(1))], [4, arr(nth(A.hops, 1) + HOP, PICK_T)]];
    grid({ hxs: sits, hys: sits.filter((h) => onGrid(f(h[0]))).map((h) => [f(h[0]), h[1]]) });
    plot(f, 'fit', e);
    if (ca > 0 || moved) drawCursor(d, c, moved ? 1 : ca, T === Infinity, count, true);
    // Once the reading leaves 2, that reading stays marked, so both amounts the screen compares are shown.
    const p2 = [2, f(2)], ma = moved ? 1 : arr(nth(A.hops, 0), 0.35);
    part(ma, 0, () => markAt(p2, amt(p2[1], F.g.y.unit), MARK[d.demo][0], MARK[d.demo][1]));
    if (bill) part(ra, 0, () => startMark(f, '£', false));
    const p4 = [4, f(4)];
    part(na, 3, () => noteAt(p4, bill ? amt(f(4), '£') + ', not ' + amt(2 * f(2), '£') : 'four times ' + amt(f(2), 'W'), false));
    if (ca > 0 || moved) part(moved ? 1 : ca, 0, () => cursorDot(d, c));
    const said = [graphSaid()];
    if (bill) said.push('A straight line for a 40 pound call-out plus 30 pounds an hour, starting at 40 pounds at 0 hours.');
    else said.push('A curve for a 5 ohm heater\'s power by P equals I squared R, starting at the point 0, 0 and curving upwards.');
    if (ma >= 0.5) said.push('The reading at ' + say(amt(2, F.g.x.unit)) + ', ' + say(amt(p2[1], F.g.y.unit)) + ', stays marked.');
    if (ca >= 0.5 || moved) said.push('The reading is at ' + say(amt(count, F.g.x.unit)) + ', ' + say(amt(f(count), F.g.y.unit)) + '.');
    if (na >= 0.5) said.push(bill ? '4 hours cost 160 pounds, not double the 100 pounds for 2 hours.' : '4 amps gives 80 watts, four times the 20 watts at 2 amps.');
    return said.join(' ');
  }
  // Steeper means more ohms: the 5 Ω line grows and is named, then the 10 Ω line; the reading at 2 A
  // crosses both.
  function demoSteep(i, d) {
    const A = AT.steep, e5 = grow(A.l5), n5 = arr(A.n5), e10 = grow(A.l10), n10 = arr(A.n10), ca = arr(A.cur);
    const moved = S[i].moved && S[i].c != null, c = cursorAt(i, 2);
    grid({ hx: ca > 0 ? c : null, hxa: moved ? 1 : ca, hy: ca > 0 && onGrid(FN.R10(c)) ? FN.R10(c) : null, hya: moved ? 1 : ca });
    plot(FN.R5, 'fit', e5);
    plot(FN.R10, 'fit', e10);
    part(n5, 0, () => endLabel(FN.R5, '5 Ω'));
    part(n10, 0, () => endLabel(FN.R10, '10 Ω', false, pushAt(d, moved ? c : null, FN.R10)));
    if (ca > 0 || moved) drawCursor(d, c, moved ? 1 : ca, T === Infinity);
    const said = [graphSaid(), 'Two resistors\' lines from the point 0, 0: 5 ohms, and 10 ohms, which is steeper.'];
    if (ca >= 0.5 || moved) said.push('At ' + say(amt(c, 'A')) + ' the 5 ohm resistor takes ' + say(amt(FN.R5(c), 'V')) + ' and the 10 ohm one ' + say(amt(FN.R10(c), 'V')) + '.');
    return said.join(' ');
  }
  // Axes swapped: the axes' names and numbers change places; the 5 Ω line stays on the diagonal and the
  // 10 Ω line swings from steep to shallow; its name; the note.
  function demoSwap(i, d) {
    const A = AT.swap, sa = arr(A.axes, SWING), mv = K.ease(lin(A.axes, SWING)), la = arr(A.label), na = arr(A.note);
    gridLines();
    swap(sa, () => axisText(), () => on(G.iv, () => axisText()), 0);
    // in squares: the 5 Ω line ends at (6, 6) both ways; the 10 Ω line's end goes from (3, 6) to (6, 3)
    const sq = (x, y) => [OX + Q * x, F.bottom - Q * y];
    const a = sq(0, 0), e5 = sq(6, 6), e10 = sq(K.lerp(3, 6, mv), K.lerp(6, 3, mv));
    line('fit', a[0], a[1], e5[0], e5[1]);
    line('fit', a[0], a[1], e10[0], e10[1]);
    text(RIGHT + 10, PT + 5, '5 Ω', 'lbl', 'start');
    leave(Math.min(1, sa * 2), () => text(OX + 3 * Q + 8, PT + 12, '10 Ω', 'lbl', 'start'));
    part(la, 0, () => text(RIGHT + 10, F.bottom - 3 * Q + 5, '10 Ω', 'lbl', 'start'));
    part(na, 3, () => text(OX + 8, PT + 18, '5 Ω is now steeper', 'lbl', 'start'));
    const said = [];
    if (sa < 0.5) said.push('Voltage up the side and current along, with the 5 ohm and 10 ohm resistors\' lines; 10 ohms is steeper.');
    else said.push('The axes swapped: current up the side, 1 amp a square, and voltage along, 5 volts a square. The 5 ohm line runs from the point 0, 0 to the point 30, 6' + (mv >= 0.5 ? ', and the 10 ohm line to the point 30, 3, so the 5 ohm line is now the steeper.' : '.'));
    return said.join(' ');
  }

  // --- the puzzles (DO steps) ---
  // Double it: the point given, with its guides; a right answer grows the line through (0, 0) and it on to
  // the answer, then its guides, point and readout; a wrong one puts the point picked, and its readout, in
  // the warning colour.
  function drawDouble(i, d, st, right) {
    const A = d.at, wrong = st.res === 'wrong', f = ohm(d.R), p1 = [d.from, f(d.from)], p2 = [d.x2, f(d.x2)];
    const ga = right ? arr(A.guides) : 0, pa = right ? arr(A.pt) : 0, sw = wrong ? arr(WRONG.slip) : 0, lo = right ? arr(OLD[0], OLD[1]) : 0;
    grid({ hxs: [[p1[0], 1 - lo], [p2[0], ga]], hys: [[p1[1], 1 - lo], [p2[1], ga]] });
    if (right) plot(f, 'fit', grow(A.line));
    leave(lo, () => { guideUp(p1); guideAcross(p1); });
    dot([0, 0]); dot(p1);
    text(gx(p1[0]) + 10, gy(p1[1]) + 20, pair(p1[0], p1[1]), 'lbl', 'start');
    const said = [graphSaid(), 'Points at the point 0, 0 and ' + say(pair(p1[0], p1[1])) + ', ' + say(amt(p1[1], 'V')) + ' at ' + say(amt(p1[0], 'A')) + '.'];
    if (right) {
      part(ga, 0, () => { guideUp(p2); guideAcross(p2); });
      part(pa, 4, () => { dot(p2); readout(p2); });
      said.push('The straight line through them runs on to ' + say(pair(p2[0], p2[1])) + ', ' + say(amt(p2[1], 'V')) + ' at ' + say(amt(p2[0], 'A')) + '.');
    } else if (wrong) {
      const p = parsePair(st.pick);
      part(sw, 0, () => { dot(p, 'bad'); readout(p, true); });
      said.push('The point picked, ' + say(st.pick) + ', is marked wrong.');
    }
    return said.join(' ');
  }
  // In proportion? The drum's line; a right answer rings where it meets the weight axis and names it, then
  // reads 20 m and 40 m; the straight slip rings that start in the warning colour.
  function drawMiss(i, d, st, right) {
    const A = d.at, wrong = st.res === 'wrong', f = FN.drum, s = wrong ? d.slips[st.pick] : null, p0 = [0, f(0)];
    const ra = right ? arr(A.ring) : s === 'straight' ? arr(WRONG.slip) : 0, a20 = right ? arr(A.r20) : 0, a40 = right ? arr(A.r40) : 0;
    grid({ hx: right ? 40 : null, hxa: a40, hy: right ? f(40) : null, hya: a40 });
    plot(f, 'fit', 1);
    const bad = s === 'straight';
    part(ra, 0, () => startMark(f, 'kg', bad));
    const said = [graphSaid(), 'A straight line for the drum\'s weight as cable is wound on.'];
    if (right) {
      [[20, a20], [40, a40]].forEach((q) => { const p = [q[0], f(q[0])]; part(q[1], 3, () => { guideUp(p); guideAcross(p); dot(p); noteAt(p, q[0] === 40 ? amt(p[1], 'kg') + ', not ' + amt(2 * f(20), 'kg') : amt(p[1], 'kg'), false); }); });
      said.push('It meets the weight axis at 20 kilograms, so it misses the point 0, 0. 20 metres weighs 30 kilograms, and 40 metres weighs 40 kilograms, not 60.');
    } else if (bad) said.push('Where it meets the weight axis, 20 kilograms at 0 metres, is marked in red.');
    return said.join(' ');
  }
  // Read the curve: the part's curve and its reading at 2 A; a right answer moves the reading along the
  // curve to 4 A, then its readout; a wrong one puts the slip's point, and its readout, in the warning colour.
  function drawCurve(i, d, st, right) {
    const A = d.at, wrong = st.res === 'wrong', f = FN.part, sw = wrong ? arr(WRONG.slip) : 0;
    const mv = right ? K.ease(lin(A.move, TRAVEL)) : 0, ra = right ? arr(A.ro) : 0;
    const c = K.lerp(d.from, d.x2, mv), p = [c, f(c)], p1 = [d.from, f(d.from)], p2 = [d.x2, f(d.x2)];
    const lo = right ? arr(OLD[0], OLD[1]) : 0;
    grid({ hxs: [[p1[0], 1 - lo], [p2[0], ra]], hys: [[p1[1], 1 - lo], [p2[1], ra]] });
    plot(f, 'fit', 1);
    guideUp(p); guideAcross(p);
    if (right) dot(p1);
    dot(p);
    if (right) swap(ra, () => readout(p1), () => readout(p2), 0); else readout(p1);
    const said = [graphSaid(), 'A curve for the part\'s voltage against its current, through the point 0, 0, bending upwards. Its reading at 2 amps is 5 volts.'];
    if (wrong) {
      const q = [d.x2, valueOfV(st.pick)];
      const above = q[1] > f(q[0]);
      part(sw, 0, () => { dot(q, 'bad'); text(gx(q[0]) + (above ? -10 : 10), gy(q[1]) + 5, st.pick, 'lbl warnt', above ? 'end' : 'start'); });
      said.push('The answer picked, ' + say(st.pick) + ' at 4 amps, is marked wrong, off the curve.');
    }
    if (right) said.push('Read up from 4 amps to the curve and across: 15 volts.');
    return said.join(' ');
  }
  const valueOfV = (s) => +String(s).replace(/[^\d.]/g, '');
  // Most ohms: three resistors' lines with their letters; a right answer names each line's ohms at its end,
  // one at a time; a wrong one turns the line picked the warning colour.
  // Where each line's letter sits (how far along). With current up the side a resistor's line is I = V / R.
  const BADGE = { 'Line A': 5, 'Line B': 2.5, 'Line C': 4 };
  const linesOf = (d) => d.lines || LINES;
  const currentUp = (d) => G[d.g].y.unit === 'A';
  const lineOf = (d, R) => (currentUp(d) ? (V) => V / R : ohm(R));
  function drawSteep(i, d, st, right) {
    const A = d.at, wrong = st.res === 'wrong', sw = wrong ? arr(WRONG.slip) : 0, L = linesOf(d), names = Object.keys(L), at = d.badges || BADGE;
    grid();
    names.forEach((n) => {
      const f = lineOf(d, L[n]), x = at[n], draw = (warn) => { plot(f, 'fit thin' + (warn ? ' bad' : ''), 1); badge(n.slice(-1), gx(x), gy(f(x)), warn); };
      if (wrong && st.pick === n) swap(sw, () => draw(false), () => draw(true), 0); else draw(false);
    });
    if (right) names.forEach((n, k) => part(arr(nth(A.ohm, k), COUNT), 3, () => endLabel(lineOf(d, L[n]), L[n] + ' Ω')));
    const said = [graphSaid()];
    if (currentUp(d)) {
      said.push('Two resistors\' straight lines from the point 0, 0, with current up the side: A reaches ' + names.map((n) => say(amt(lineOf(d, L[n])(F.xmax), 'A'))).join(' and B reaches ') + ' at ' + say(amt(F.xmax, 'V')) + '.');
      if (right) said.push('Line B, which climbs less, is ' + L['Line B'] + ' ohms; line A is ' + L['Line A'] + ' ohms.');
    } else {
      said.push('Three resistors\' straight lines from the point 0, 0: A reaches 24 volts at 6 amps, B reaches 30 volts at 3.75 amps, and C reaches 18 volts at 6 amps.');
      if (right) said.push('Line B, the steepest, is 8 ohms; A is 4 ohms and C is 3 ohms.');
    }
    if (wrong) said.push(st.pick + ' is marked wrong.');
    return said.join(' ');
  }
  // Current up the side: put the point. Before Check the readout says (?, ?); a right answer draws the
  // guides to it and its readout; a wrong one turns it and its readout the warning colour.
  function drawDrag(i, d, st, right) {
    const A = d.at, wrong = st.res === 'wrong', p = st.pt || d.start;
    const ga = right ? arr(A.guides) : 0, ro = right ? arr(A.ro) : 0, sw = wrong ? arr(WRONG.slip) : 0;
    grid({ hx: right ? p[0] : null, hxa: ga, hy: right ? p[1] : null, hya: ga });
    if (right) part(ga, 0, () => { guideUp(p); guideAcross(p); });
    if (!right && !wrong) circle('ringp', gx(p[0]), gy(p[1]), 15);
    if (wrong) swap(sw, () => dot(p), () => dot(p, 'bad'), 0); else dot(p);
    if (right) swap(ro, readoutHidden, () => readout(p), 0);
    else if (wrong) swap(sw, readoutHidden, () => readout(p, true), 0);
    else readoutHidden();
    placeGrip(right ? null : p);
    const lead = graphSaid() + ' ';
    if (right) return lead + 'The point is at ' + say(d.want) + ': ' + say(amt(p[1], 'A')) + ' at ' + say(amt(p[0], 'V')) + '.';
    if (wrong) return lead + 'The point is at ' + say(pair(p[0], p[1])) + ', which says ' + say(amt(p[1], 'A')) + ' at ' + say(amt(p[0], 'V')) + ', marked wrong.';
    return lead + 'A point to drag' + (st.moved ? '' : ', starting near the top left') + '. Its readout is hidden until you check.';
  }
  // Check the corner: the tank's line from the corner of a side that starts at 20 cm; a right answer redraws
  // the graph from 0, then rings where the line starts and names it; a slip boxes the corner's number in
  // the warning colour, with its readout.
  function drawCorner(i, d, st, right) {
    const A = d.at, wrong = st.res === 'wrong', f = FN.tank, sw = wrong ? arr(WRONG.slip) : 0;
    const said = [];
    if (right) {
      const rg = arr(A.regrid, REGRID), mv = K.ease(lin(A.regrid, REGRID)), ra = arr(A.ring);
      gridLines();
      axisText({ only: 'x' });
      swap(rg, () => on(G.tank, () => axisText({ only: 'y' })), () => axisText({ only: 'y' }), 0);
      // the same line, from its place on the old side to its place on the new one
      const ends = () => [[gx(0), gy(f(0))], [gx(F.xmax), gy(f(F.xmax))]], was = [], now = ends();
      on(G.tank, () => was.push.apply(was, ends()));
      const at = (k) => [K.lerp(was[k][0], now[k][0], mv), K.lerp(was[k][1], now[k][1], mv)], a = at(0), b = at(1);
      path('fit', 'M' + r3(a[0]) + ' ' + r3(a[1]) + 'L' + r3(b[0]) + ' ' + r3(b[1]));
      part(ra, 0, () => startMark(f, 'cm', false));
      said.push(graphSaid(), 'With the side renumbered from 0, the tank\'s straight line starts at 20 centimetres at 0 minutes, so it misses the point 0, 0.');
      return said.join(' ');
    }
    grid({ corner: sw });
    plot(f, 'fit', 1);
    said.push(graphSaid(), 'A straight line for the tank\'s level, from the corner to the top right.');
    if (wrong) { part(sw, 0, () => readout2(pair(0, f(0)), 'the corner is', true)); said.push('The corner\'s number, 20 centimetres, is boxed in red: the corner is the point 0, 20.'); }
    return said.join(' ');
  }
  // Measured readings: the readings alone until Check; a right answer grows the best-fit line, names it, then
  // says where it runs through; the zigzag slip joins the dots in the warning colour.
  function drawMeasured(i, d, st, right) {
    const A = d.at, wrong = st.res === 'wrong', sw = wrong ? arr(WRONG.slip) : 0, L = fitOf(READINGS), f = lineFn(L);
    grid();
    const said = [graphSaid(), 'A resistor\'s measured readings: ' + READINGS.map((c) => say(amt(c[1], 'V')) + ' at ' + say(amt(c[0], 'A'))).join(', ') + '.'];
    if (right) {
      const last = READINGS[READINGS.length - 1][0];
      plot(f, 'fit', grow(A.line, LINE_T), last);
      part(arr(A.label), 0, () => text(gx(last) + 10, gy(f(last)) + 5, 'best fit', 'lbl', 'start'));
      part(arr(A.ro), 0, () => readout2(pair(0, 0), 'best fit through'));
      said.push('One straight best-fit line runs through them, from the point 0, 0 to the last reading at 5 amps, close to every reading.');
    }
    if (wrong && d.slips[st.pick] === 'dots') {
      part(sw, 0, () => { zigzag(READINGS); const c = READINGS[READINGS.length - 1]; text(gx(c[0]) + 10, gy(c[1]) + 5, 'dot to dot', 'lbl warnt', 'start'); });
      said.push('Joined dot to dot in red, they zigzag.');
    }
    READINGS.forEach((c) => dot(c));
    return said.join(' ');
  }

  // ---------- the point Dan drags, or the reading he slides (kept from frame to frame) ----------
  // The graph takes a tap (the point goes to the nearest crossing, or the reading to the nearest square
  // along); the point is dragged, or moved with the arrow keys. The page does not scroll under a finger on it.
  const board = hits.appendChild(K.svg('rect', { class: 'hit board' }));

  function live() {
