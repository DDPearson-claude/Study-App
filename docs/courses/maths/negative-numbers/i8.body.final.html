<p class="caption">Brackets, then powers, then times and divide, then add and take away. The sums are example values.</p>

<script>

  const M = '−';
  const STEPS = [

      at: { hl: 0.15, val: 0.6, sum: 1.2 },
      task: 'In 6 + 12 ÷ −3, tap the job to do first.',
      empty: 'Tap the +, the ÷ or the minus sign in the sum.',
      why: 'Divide comes before add, even with a negative, so 12 ÷ −3 = −4 goes first. Then 6 + (−4) = 2. Adding first would give 18 ÷ −3 = −6.',
      hint: 'Not quite. Times and divide come before add and take away, even when a number is negative.',
      hints: { 2: 'Not quite. That minus is part of the number −3, saying it is below zero. The jobs sit between two numbers.' } },
    { show: true, demo: 'partners', dur: 4.5, lay: 'partners', name: 'Equal partners',
      lad: { first: '1 − 4 + 2', jobs: [['1 − 4', 'a'], ['−3 + 2', 'a']] },
      text: '*BIDMAS*, the school word for this order, lists A (add) before S (subtract). But add and take away are equal *partners*, so go left to right. 1 − 4 + 2 takes away 4, then adds\u00a02.' },
    { kind: 'ladder', lay: 'p8', name: 'Left to right',
      lad: { first: '8 − 3 + 2', jobs: [['8 − 3', 'a'], ['5 + 2', 'a']] },
      opts: ['7', '3', '13'], want: '7', slips: { '3': 'addFirst', '13': 'allAdd' }, fb: 2.5,

      hints: { '3': 'Not quite. That adds 3 + 2 first. Add and take away are equal partners, so start with 8 − 3.',

    { show: true, demo: 'power', dur: 3.6, lay: 'pow3', name: 'A power', toggle: true,
      text: 'A *power*, the small raised number, is worked before a minus sign. In −3² it touches only the 3, so 3² = 9, then the minus makes it −9. Tap Add brackets to square\u00a0−3.' },
    { kind: 'power', lay: 'pow25', expr: '−5²', grow: 25, turns: 1, note: '5 × 5 = 25', job: 'p', name: 'Square, then the minus',
      opts: ['−25', '25', '−10'], want: '−25', slips: { '25': 'signSticks', '−10': 'powTimes' }, fb: 2.3,
      at: { note: 0.15, grow: [0.15, 0.45], turns: [0.95], turn: 0.7, tag: 1.7 },
      task: 'What is −5²?',
      why: 'The square touches only the 5, so 5² = 25 comes first. The minus in front then turns it to its opposite, −25. To square −5 itself, write (−5)², which is 25.',
      hint: 'Not quite. Square the 5 first, then deal with the minus.',
      hints: { '25': 'Not quite. The minus looks stuck to the 5, but the square goes first. 5² = 25, then the minus.', '−10': 'Not quite. 5² is 5 × 5, not 5 × 2.' } },
    { kind: 'power', lay: 'pow8', expr: '(−2)³', grow: 8, turns: 3, note: '2 × 2 × 2 = 8', job: 'p', name: 'A cube',
      opts: ['−8', '8', '−6'], want: '−8', slips: { '8': 'powDropsSign', '−6': 'powTimes' }, fb: 2.45,
      at: { note: 0.15, grow: [0.15, 0.4], turns: [0.6, 1.02, 1.44], turn: 0.4, tag: 1.85 },
      task: '(−2)³ means (−2) × (−2) × (−2). What is it?',
      why: '2 × 2 × 2 = 8, and each −2 gives a half-turn about zero. Three half-turns go down, up, then down again, so (−2)³ = −8.',
      hint: 'Not quite. Work out 2 × 2 × 2, then count the −2s.',
      hints: { '8': 'Not quite. There are three −2s, so count three half-turns.', '−6': 'Not quite. The small 3 means three −2s multiplied together, not −2 × 3.' } },
    { show: true, demo: 'bracket', dur: 4.0, lay: 'brk', name: 'A minus before brackets',
      lad: { first: '6 − (1 − 4)', jobs: [['(1 − 4)', 'b'], ['6 − (−3)', 'a']] },
      text: 'Brackets still come first when there is a minus in front. 6 − (1 − 4) is 6 − (−3), and taking away −3 adds 3, so it makes 9.' },
    { kind: 'ladder', lay: 'b10', name: 'Take away a bracket',
      lad: { first: '10 − (3 − 5)', jobs: [['(3 − 5)', 'b'], ['10 − (−2)', 'a']] },
      opts: ['12', '8', '2'], want: '12', slips: { '8': 'keepMinus', '2': 'dropBrackets' }, fb: 2.4,
      at: { rows: [0, 0.6, 1.8], hl: [0.15, 0.75], mk: 0.75, mkd: 0.35, walks: [{ hops: [1.15, 1.4] }], hop: 0.25, tag: 1.8 },
      task: 'What is 10 − (3 − 5)?',
      why: 'Brackets first, 3 − 5 = −2. Then 10 − (−2), and taking away −2 adds 2, so it is 12. Dropping the brackets would give 10 − 3 − 5 = 2.',
      hint: 'Not quite. Work the bracket out first.',
      hints: { '8': 'Not quite. 3 − 5 is −2, and taking away −2 adds 2.', '2': 'Not quite. That takes away the 5 as well. Work the bracket out first, 3 − 5.' } },
    { kind: 'power', lay: 'opp3', expr: '−(5 − 8)', grow: -3, turns: 1, note: '5 − 8 = −3', job: 'b', name: 'The opposite',
      opts: ['3', '−3', '−13'], want: '3', slips: { '−3': 'noOpposite', '−13': 'dropBrackets' }, fb: 2.3,
      at: { note: 0.15, grow: [0.15, 0.45], turns: [0.95], turn: 0.7, tag: 1.7 },
      task: 'A lone minus in front of a bracket turns it to its opposite. What is −(5 − 8)?',
      why: 'Brackets first, 5 − 8 = −3. The minus in front turns −3 to its opposite, a half-turn about zero, so −(5 − 8) = 3.',
      hint: 'Not quite. Work the bracket out first, then take its opposite.',
      hints: { '−3': 'Not quite. 5 − 8 is −3, and the minus in front turns it to its opposite.', '−13': 'Not quite. The minus works on the whole bracket. Work out 5 − 8 first.' } },
    { kind: 'which', lay: 'pow16', grow: 16, turns: 2, note: '4 × 4 = 16', job: 'p', target: 16, name: 'Which is 16?',
      opts: ['−4²', '(−4)²', '−(4²)'], want: '(−4)²', fb: 2.3,
      at: { note: 0.15, grow: [0.15, 0.4], turns: [0.65, 1.15], turn: 0.45, tag: 1.65 },
      task: 'Which of these comes to 16?',
      why: '(−4)² = (−4) × (−4), and two minus signs give two half-turns, so it is 16. −4² and −(4²) both square the 4 first, then turn it to −16.',
      hint: 'Not quite. Look at what each square touches.',
      hints: { '−4²': 'Not quite. The square belongs to the 4 alone, so −4² is −16.', '−(4²)': 'Not quite. That squares 4 to 16, then turns it to its opposite, −16.' } },
    { kind: 'ladder', lay: 'mix', name: 'All together',
      lad: { first: '2 − 3 × (−2)²', jobs: [['(−2)²', 'p'], ['3 × 4', 'm'], ['2 − 12', 'a']] },
      opts: ['−10', '−4', '14'], want: '−10', slips: { '−4': 'flat', '14': 'powKeepsSign' }, fb: 2.45,
      at: { rows: [0, 0.5, 1.0, 1.85], hl: [0.1, 0.6, 1.1], mk: 1.1, mkd: 0.3, walks: [{ big: [1.3, 0.5] }], tag: 1.85 },
      task: 'Put it all together. What is 2 − 3 × (−2)²?',
      why: 'Powers first, (−2)² = 4. Times next, 3 × 4 = 12. Last, 2 − 12 = −10, 12 steps down from\u00a02.',
      hint: 'Not quite. Powers first, then times, then take away.',
      hints: { '−4': 'Not quite. That takes away before the times. Times comes first, 3 × 4.', '14': 'Not quite. (−2)² is (−2) × (−2), which is 4, not −4.' } },
  ];
  const FINISH = 'Brackets, then powers, then times and divide, then add and take away, with partners left to right. A power belongs only to the number or bracket it touches, so −3² = −9 but (−3)² = 9.';
  // The order of jobs, across the top of every picture.
  const JOBS = [{ k: 'b', s: 'Brackets', said: 'brackets' }, { k: 'p', s: 'Powers', said: 'powers' }, { k: 'm', s: '× and ÷', said: 'times and divide' }, { k: 'a', s: '+ and −', said: 'add and take away' }];
  // When each demonstration's parts arrive, in seconds after the screen opens (the screen itself
  // takes FADE to fade in, so nothing starts before it has settled). HOP: one step of the marker;
  // HL: a highlight; CNT: a hop's count rising in, from half-way through its hop.
  const FADE = 0.35, HOP = 0.25, HL = 0.4, CNT = 0.35;
  const AT = {
    // the sum; the times highlighted; its row; the marker on 1, facing up, adds −6; the answer
    order: { rows: [0.5, 1.6, 3.5], hl: [1.0, 2.2], mk: 2.2, walks: [{ big: [2.8, 0.6] }], tag: 3.5 },
    // the sum; left to right; the marker on 1, facing down, takes away 4; it turns to face up and adds 2
    partners: { rows: [0.5, 2.9, 3.8], arrow: 1.0, hl: [1.5, 3.0], mk: 1.5, walks: [{ hops: [2.0, 2.22, 2.44, 2.66] }, { hops: [3.3, 3.52] }], hop: 0.22, turn: [2.9, 0.4], tag: 3.8 },
    // the sum; its bracket highlighted; its row; the marker on 6, facing down, takes away −3, backwards; the answer
    bracket: { rows: [0.5, 1.6, 3.4], hl: [1.0, 2.1], mk: 2.1, walks: [{ hops: [2.6, 2.85, 3.1] }], hop: 0.25, tag: 3.4 },
    // −3² from the screen opening; (−3)² played again; the brackets put on; the brackets taken off.
    // out: the old picture leaving; brk: the brackets arriving (or leaving); lab: what the power
    // touches; grow: the arrow to 9, which rests there a moment; turns: its half-turns; sum: the answer written out.
    power: {
      open: { expr: 0.5, lab: 1.0, grow: [1.4, 0.45], turns: [2.2], turn: 0.7, sum: 3.0 },
      openOn: { expr: 0.5, lab: 1.0, grow: [1.4, 0.45], turns: [2.2, 3.0], turn: 0.7, sum: 3.8 },
      on: { out: 0.4, brk: 0.15, lab: 0.8, grow: [1.2, 0.45], turns: [2.0, 2.8], turn: 0.7, sum: 3.6 },
      off: { out: 0.4, brk: 0.15, lab: 0.8, grow: [1.2, 0.45], turns: [2.0], turn: 0.7, sum: 2.8 },
    },
  };
  // Drawing sizes, in viewBox units (340 wide). The order runs across the top; the line runs up
  // x = X inside a tube TW either side of it, its numbers ending at LX. Each line: values top..bot
  // drawn from Y0 down to H - 46, a tick every `minor`, a number every `every`; `ly`: where the
  // working's first row sits. The tap screen is TAPH tall.
  const X = 76, TW = 9, LX = 56, Y0 = 60, H0 = 286, TAGX = 120, CNTX = 102, TAPH = 214, LDY = 34;
  let H = H0;
  const LAY = {
    order: { top: 3, bot: -7, minor: 1, every: 1, ly: 104 },
    partners: { top: 3, bot: -5, minor: 1, every: 1, ly: 116 },
    p8: { top: 14, bot: -1, minor: 1, every: 2, ly: 104, H: 304 },
    pow3: { top: 10, bot: -10, minor: 1, every: 3 },
    pow25: { top: 30, bot: -30, minor: 5, every: 10 },
    pow8: { top: 10, bot: -10, minor: 1, every: 4 },
    brk: { top: 10, bot: -2, minor: 1, every: 2, ly: 108 },
    b10: { top: 14, bot: -1, minor: 1, every: 2, ly: 108, H: 304 },
    opp3: { top: 5, bot: -15, minor: 1, every: 5 },
    pow16: { top: 20, bot: -20, minor: 2, every: 8 },
    mix: { top: 15, bot: -15, minor: 1, every: 5, ly: 100 },
  };
  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  // While the kit's self-test looks at every screen it switches fades off (the k-testing class):
  // demonstrations then open finished, as they do with reduced motion.
  const testing = () => document.documentElement.classList.contains('k-testing');
  const OPENSTAX = 'https://openstax.org/books/elementary-algebra-2e/pages/1-4-multiply-and-divide-integers';
  const OPENLEARN = 'https://www.open.edu/openlearn/science-maths-technology/mathematics-statistics/squares-roots-and-powers/content-section-3.2';

  // ---------- numbers (pure, so the checks can test them) ----------
  const same = (a, b) => K.near(a, b, 1e-9);
  const round3 = (v) => Math.round(v * 1000) / 1000;
  // As Dan reads it: a proper minus sign; as a screen reader says it.
  const fmt = (v) => (v < 0 ? M : '') + String(round3(Math.abs(v)));
  const say = (s) => String(s).replace(/²/g, ' squared').replace(/³/g, ' cubed').replace(/\(/g, ' open bracket ').replace(/\)/g, ' close bracket ')
    .replace(/−\s*/g, ' minus ').replace(/\+/g, ' plus ').replace(/×/g, ' times ').replace(/÷/g, ' divided by ').replace(/=/g, ' equals ').replace(/\s+/g, ' ').trim();
  // A written sum worked by the order: a sum is terms joined by + and −, left to right; a term is
  // factors joined by × and ÷, left to right; a factor is a minus in front of a factor (its
  // opposite), or a power; a power is a number or a bracket, raised by ² or ³. So a power belongs
  // only to what it touches, −3² = −(3²). `slip` works it the way a common mistake does instead:
  // addFirst adds before taking away; allAdd adds what is taken away; flat works every job left to
  // right, whatever its kind; signSticks squares the minus with the number; dropBrackets ignores the
  // brackets; keepMinus takes away a negative as if it were positive; noOpposite drops a minus in
  // front of a bracket; powTimes reads 5² as 5 × 2; powDropsSign and powKeepsSign give a power of a
  // negative number always a plus, or always a minus.
  function evaluate(src, slip) {
    let toks = String(src).replace(/-/g, M).match(/\d+(?:\.\d+)?|[−+×÷()²³]/g) || [];
    if (slip === 'dropBrackets') toks = toks.filter((t) => t !== '(' && t !== ')');
    let i = 0;
    const peek = () => toks[i], next = () => toks[i++], isNum = (t) => /^\d/.test(t || '');
    function sum() {
      if (slip === 'flat') {
        let v = factor();
        while (/^[−+×÷]$/.test(peek() || '')) { const op = next(), f = factor(); v = op === '+' ? v + f : op === M ? v - f : op === '×' ? v * f : v / f; }
        return v;
      }
      if (slip === 'addFirst') { let v = adds(); while (peek() === M) { next(); v -= adds(); } return v; }
      let v = term();
      while (peek() === '+' || peek() === M) {
        const op = next(), t = term();

    const y = sc.y(v), w = Math.max(40, tw(s, 'tagt') + 20);
    part(a, 6, () => {
      pathOf('tag', 'M' + TAGX + ' ' + (y - 7).toFixed(2) + ' L' + (TAGX - 7) + ' ' + y.toFixed(2) + ' L' + TAGX + ' ' + (y + 7).toFixed(2) + ' Z');
      rect('tag', TAGX, y - 15, w, 30, 8);
      text(TAGX + w / 2, y + 5.5, s, 'tagt k-nohalo');
    });
  }
  // The slot an answer goes in: a dashed box that gives way to the answer as a goes 0 -> 1.
  const slot = (x, y, w, h, a) => leave(a, () => rect('gapbox', x, y, w, h, 5));
  // The sum at the foot of the picture, right-aligned: its left side, then a slot that gives way to
  // the answer as a goes 0 -> 1 (or the whole sum risen in as a does, with `whole`).
  function sumAt(left, ans, a, whole) {
    const y = H - 12;
    if (whole) { part(a, 6, () => text(334, y, left, 'sum', 'end')); return; }
    const w = Math.max(36, tw(ans, 'sum') + 12), x = 334 - w;
    text(x - 6, y, left, 'sum', 'end');
    slot(x, y - 21, w, 29, a);
    part(a, 6, () => text(x + w / 2, y, ans, 'sum'));
  }

  // --- the arrow from zero, and its half-turns (as in Multiplying) ---
  // The tip of an arrow r units long from zero, turned `ang` degrees clockwise from pointing up.
  function tip(sc, r, ang) {
    const th = ang * Math.PI / 180;
    return { x: X + r * Math.sin(th), y: sc.y(0) - r * Math.cos(th) };
  }
  // The arrow to a number, r units long, turned `ang` degrees, on its pivot at zero.
  function pointer(sc, r, ang) {
    const th = ang * Math.PI / 180, s = Math.sin(th), c = Math.cos(th), y0 = sc.y(0), p = tip(sc, r, ang);
    const hl = Math.min(13, r), hw = hl * 0.55;
    if (r - hl > 1) line('ptr', X, y0, X + (r - hl + 2) * s, y0 - (r - hl + 2) * c);
    const bx = X + (r - hl) * s, by = y0 - (r - hl) * c;
    if (r > 0.5) pathOf('ptrh', 'M' + p.x.toFixed(2) + ' ' + p.y.toFixed(2) + ' L' + (bx + c * hw).toFixed(2) + ' ' + (by + s * hw).toFixed(2) +
      ' L' + (bx - c * hw).toFixed(2) + ' ' + (by - s * hw).toFixed(2) + ' Z');
    circle('pivot', X, y0, 5.5);
  }
  // Half-turn k (1, 2, …) of an arrow r units long: a curved arrow beside the line, 12 units further
  // out each time, round the right side, down or up the way it turns, grown as far as e.
  function trail(sc, r, k, e, startDown) {
    if (e <= 0) return;
    const R = r + 12 * k, down = goesDown(k, startDown), a0 = down ? 6 : 174, a1 = down ? 174 : 6;
    const p0 = tip(sc, R, a0), p1 = tip(sc, R, a1);
    grown('trail', 'M' + p0.x.toFixed(2) + ' ' + p0.y.toFixed(2) + ' A' + R + ' ' + R + ' 0 0 ' + (down ? 1 : 0) + ' ' + p1.x.toFixed(2) + ' ' + p1.y.toFixed(2), e);
    // its head, along the way it turns, as it lands
    part(e >= 1 ? 1 : K.clamp((e - 0.8) / 0.2, 0, 1), 0, () => {
      const th = a1 * Math.PI / 180, ux = (down ? 1 : -1) * Math.cos(th), uy = (down ? 1 : -1) * Math.sin(th);
      const bx = p1.x - ux * 9, by = p1.y - uy * 9, px = -uy * 4.5, py = ux * 4.5;
      pathOf('head', 'M' + p1.x.toFixed(2) + ' ' + p1.y.toFixed(2) + ' L' + (bx + px).toFixed(2) + ' ' + (by + py).toFixed(2) + ' L' + (bx - px).toFixed(2) + ' ' + (by - py).toFixed(2) + ' Z');
    });
  }
  // How many half-turns, beside the outermost curved arrow, level with zero.
  const turnLabel = (sc, r, n) => text(X + r + 12 * n + 8, sc.y(0) + 5, n + ' half-turn' + (n === 1 ? '' : 's'), 'turnl', 'start');
  const turnsWord = (n) => (n === 1 ? 'one half-turn' : n === 2 ? 'two half-turns' : n === 3 ? 'three half-turns' : n + ' half-turns');
  // The value at the arrow's tip, beside the line's numbers.
  const tipLabel = (sc, v, a) => part(a, 6, () => text(LX, sc.y(v) + 5.5, fmt(v), 'val', 'end'));
  // The arrow's way after its half-turns so far (each e 0..1): 0 points up, 180 down.
  function angleOf(startDown, es) {
    let ang = startDown ? 180 : 0;
    es.forEach((e, k) => { ang += (goesDown(k + 1, startDown) ? 180 : -180) * e; });
    return ang;
  }

  // --- the screens with a sum worked on the line (SHOW demos, and DO steps after a right answer) ---
  // A: the timetable; live: whether it plays (a DO step before its right answer shows only the sum).
  function ladScene(d, A, live) {
    const L = d.L, Ly = LAY[d.lay], sc = scaleOf(Ly);
    upright(sc);
    const hls = live ? chipsAt(L.jobs.map((j, k) => [j.job, A.hl[k]])) : null;
    strip(hls);
    const box = ladderBox(L.rows, Ly.ly);
    const ra = L.rows.map((s, k) => (k === 0 ? (A.rows[0] ? arr(A.rows[0]) : 1) : live ? arr(A.rows[k]) : 0));
    const ha = L.jobs.map((j, k) => (live ? arr(A.hl[k], HL) : 0));
    L.jobs.forEach((j, k) => part(Math.min(ha[k], ra[k]), 0, () => hlOn(box, L.rows[k], j, k)));
    L.rows.forEach((s, k) => part(ra[k], k ? 6 : 0, () => rowAt(box, s, k)));
    if (A.arrow != null) flowArrow(box, L.rows[0], live ? arr(A.arrow) : 0);
    // the marker's walks, one for each add or take away; between two, it turns and the first walk's hops give way
    const W = L.jobs.filter((j) => j.walk).map((j) => j.walk);
    let mk = 0, v = W.length ? W[0].from : 0, ang = W.length && W[0].down ? 180 : 0, moving = false;
    if (W.length && live) {
      mk = arr(A.mk, A.mkd);
      W.forEach((w, k) => {
        const sp = A.walks[k];
        if (k > 0) { const tn = arr(A.turn[0], A.turn[1]); ang = K.lerp(ang, w.down ? 180 : 0, tn); if (tn > 0 && tn < 1) moving = true; }
        let went;
        if (sp.big) went = bigHop(sc, { a: w.from, b: w.to, t: sp.big[0], dur: sp.big[1], lt: sp.big[0] + 0.3, lab: fmt(w.by) }) * w.n;
        else {
          went = hopsWent(sp.hops, A.hop);
          const gone = k === 0 && W.length > 1 ? arr(A.turn[0], A.turn[1]) : 0;
          leave(gone, () => drawHops(sc, w.from, w.unit, sp.hops, A.hop));
        }
        if (went > 0) { v = round3(w.from + w.unit * went); if (went < w.n) moving = true; }
      });
      marker(sc, v, ang, mk);
    }
    const done = live ? arr(A.tag) : 0;
    tag(sc, L.value, fmt(L.value), done);
    // in words
    const shown = L.rows.filter((s, k) => ra[k] >= 0.5), lit = L.jobs.filter((j, k) => ha[k] >= 0.5 && ra[k] >= 0.5).pop();
    return lineSaid(Ly) + stripSaid(hls) + (shown.length ? ' Beside it, the working: ' + shown.map((s, k) => (k ? 'equals ' : '') + say(s)).join(', then ') + '.' : '') +
      (lit ? ' Highlighted: ' + say(lit.on) + '.' : '') + (A.arrow != null && live && arr(A.arrow) >= 0.5 ? ' An arrow along the sum says left to right.' : '') +
      (mk >= 0.5 ? ' A marker facing ' + (ang >= 90 ? 'down' : 'up') + (moving ? ' is moving along the line.' : ' stands on ' + say(fmt(v)) + '.') : '') +
      (done >= 0.5 ? ' A tag marks the answer, ' + say(fmt(L.value)) + '.' : '');
  }

  // --- the brackets screen: −3², and (−3)² with the brackets on ---
  // Its timetable: as the screen opens (or plays again), or as the brackets are put on or taken off.
  function powerTT(st) {
    const P = AT.power;
    return st.mode === 'toggle' ? (st.brk ? P.on : P.off) : (st.brk ? P.openOn : P.open);
  }
  // −3², written large, with brackets coming in round −3 as b goes 0 -> 1 (the −3 and the square
  // slide apart to make room). At rest it is one line of text, so its parts never read as separate labels.
  const EX = { cx: 262, y: 98 };
  function exprLayout() {
    const w = (s) => tw(s, 'huge'), off = M + '3²', on = '(' + M + '3)²', wOff = w(off), wOn = w(on);
    return { off: off, on: on, wOff: wOff, wOn: wOn, wm: w(M), wp: w('('), wn: w(M + '3'), wq: w(')'), xOff: EX.cx - wOff / 2, xOn: EX.cx - wOn / 2 };
  }
  function bigExpr(b) {
    const g = exprLayout(), y = EX.y;
    if (b <= 0) { text(g.xOff, y, g.off, 'huge', 'start'); return; }
    if (b >= 1) { text(g.xOn, y, g.on, 'huge', 'start'); return; }
    text(K.lerp(g.xOff, g.xOn + g.wp, b), y, M + '3', 'huge', 'start');
    text(K.lerp(g.xOff + g.wn, g.xOn + g.wp + g.wn + g.wq, b), y, '²', 'huge', 'start');
    part(b, 0, () => { text(g.xOn, y, '(', 'huge', 'start'); text(g.xOn + g.wp + g.wn, y, ')', 'huge', 'start'); });
  }
  // Under the expression, what the power touches: the 3 alone, or (−3) with the brackets on.
  function touched(on) {
    const g = exprLayout(), y = EX.y, x0 = on ? g.xOn : g.xOff + g.wm, x1 = on ? g.xOn + g.wOn : g.xOff + g.wOff;
    grown('brk', 'M' + x0.toFixed(2) + ' ' + (y + 12) + ' V' + (y + 18) + ' H' + x1.toFixed(2) + ' V' + (y + 12), 1);
    text((x0 + x1) / 2, y + 36, on ? '(−3) × (−3)' : '3 × 3', 'note');
  }
  // The arrow to 9 (3 × 3), grown as g goes 0 -> 1, then turned once for the minus in front, or twice
  // for the two minus signs in (−3) × (−3); its value; the answer written out.
  function powerParts(sc, on, a) {
    const n = on ? 2 : 1, r = 9 * sc.k, fin = turned(9, n), es = a.ts.slice(0, n);
    es.forEach((e, k) => trail(sc, r, k + 1, e, false));
    part(a.sum, 6, () => turnLabel(sc, r, n));
    if (a.g > 0) part(Math.min(1, 3 * a.g), 0, () => pointer(sc, r * a.g, angleOf(false, es)));
    tipLabel(sc, 9, a.v9);
    tipLabel(sc, fin, a.sum);
    part(a.lab, 6, () => touched(on));
    if (!on) part(a.opp, 6, () => { const g = exprLayout(); text(g.xOff + g.wm / 2, EX.y - 47, 'opposite', 'note'); });
    part(a.sum, 6, () => text(334, H - 12, (on ? '(−3)²' : '−3²') + ' = ' + fmt(fin), 'sum', 'end'));
  }
  // One state of the brackets screen ({brk, mode, was}) t seconds into its motion: how far each part
  // has arrived. A toggle starts from the picture on screen when it was tapped (`was`, frozen at was.T,
  // Infinity if it had settled): that picture fades out over `out` with each part where it was, and
  // the expression and its brackets carry on from where they were. `rec`: the live picture, whose
  // arrivals the timing check notes.
  function powerAt(st, t, rec) {
    const A = powerTT(st), on = st.brk, tog = st.mode === 'toggle';
    const ar = rec ? arr : (t0, d) => K.arrive(t, t0, d == null ? K.SOFT : d);
    const w = tog && st.was ? powerAt(st.was, st.was.T, false) : null;
    const out = tog ? ar(0, A.out) : 1;
    const ex = tog ? K.lerp(w ? w.ex : 1, 1, out) : ar(A.expr);
    const b = tog ? K.lerp(w ? w.b : on ? 0 : 1, on ? 1 : 0, ar(A.brk)) : on ? 1 : 0;
    const a = { g: ar(A.grow[0], A.grow[1]), ts: A.turns.map((x) => ar(x, A.turn)), lab: ar(A.lab), sum: ar(A.sum), opp: on ? 0 : ar(A.turns[0]),
      v9: Math.min(ar(A.grow[0] + A.grow[1] - 0.1, 0.3), 1 - ar(A.turns[0], 0.25)) };
    const hls = chipsAt(on ? [['b', tog ? A.brk : A.expr], ['p', A.lab]] : [['p', A.lab]], ar);
    return { on: on, w: w, out: w ? out : 1, ex: ex, b: b, a: a, hls: hls };
  }
  // The brackets put on or taken off t seconds into the motion on screen (Infinity: it had settled).
  // The state then on screen is kept, frozen at t, to fade out under the new one, and so is the one
  // under it while that can still show (a toggle has let go of it by the time its brackets are on).
  function toggled(st, t) {
    const keep = st.mode === 'toggle' && t < AT.power.on.brk + K.SOFT;
    return { brk: !st.brk, mode: 'toggle', was: { brk: st.brk, mode: st.mode, T: t, was: keep ? st.was : null } };
  }
  // A frozen state's picture, over the one before it as that fades in turn (the expression is the live state's).
  function powerPic(sc, p) {
    if (p.w) leave(p.out, () => powerPic(sc, p.w));
    powerParts(sc, p.on, p.a);
  }
  // Across a state and the ones fading under it (each shown k): what the line's numbers give way to,
  // and how lit each job is.
  function powerReadings(p, k) {
    return [{ v: 9, a: p.a.v9 * k }, { v: turned(9, p.on ? 2 : 1), a: p.a.sum * k }].concat(p.w ? powerReadings(p.w, k * (1 - p.out)) : []);
  }
  function powerHls(p, k) {
    const h = {}, o = p.w ? powerHls(p.w, k * (1 - p.out)) : {};
    JOBS.forEach((j) => { h[j.k] = Math.max((p.hls[j.k] || 0) * k, o[j.k] || 0); });
    return h;
  }
  function demoPower(d) {
    const st = S[STEPS.indexOf(d)], sc = scaleOf(LAY[d.lay]), p = powerAt(st, T, true), on = p.on, a = p.a, ex = p.ex, g = a.g, ts = a.ts;
    const fin = turned(9, on ? 2 : 1), hls = powerHls(p, 1);
    upright(sc, powerReadings(p, 1));
    strip(hls);
    // the picture that was on screen gives way, from where it was, as the brackets go on or come off
    if (p.w) leave(p.out, () => powerPic(sc, p.w));
    part(ex, 6, () => bigExpr(p.b));
    powerParts(sc, on, a);
    const said = on ? 'open bracket minus 3 close bracket squared' : 'minus 3 squared', n = on ? 2 : 1;
    const turning = ts.some((e) => e > 0 && e < 1);
    return lineSaid(LAY[d.lay]) + stripSaid(hls) +
      (ex >= 0.5 ? ' Beside it, ' + said + ', written large' + (a.lab >= 0.5 ? '; the square touches ' + (on ? 'the bracket, minus 3 times minus 3' : 'the 3 alone, 3 times 3') : '') + '.' : '') +
      (g >= 0.5 ? ' An arrow from zero ' + (turning ? 'is turning about zero' : 'points to ' + say(fmt(turned(9, ts.filter((e) => e >= 1).length)))) + '.' : '') +
      (a.sum >= 0.5 ? ' After ' + turnsWord(n) + ', ' + say((on ? '(−3)²' : '−3²') + ' = ' + fmt(fin)) + '.' : '');
  }

  // --- the puzzles drawn as an arrow from zero: a power, or a minus in front of a bracket ---
  function drawPower(d, st, right) {
    const L = LAY[d.lay], sc = scaleOf(L), F = d.at, n = d.turns, r = Math.abs(d.grow) * sc.k, down0 = d.grow < 0, v = turned(d.grow, n);
    const g = right ? arr(F.grow[0], F.grow[1]) : 0, nt = right ? arr(F.note) : 0;
    const ts = F.turns.map((t) => (right ? arr(t, F.turn) : 0));
    const done = right ? arr(F.tag) : 0;
    // the grown arrow's value, until it starts to turn; the landing's, as it is named
    const gl = right ? Math.min(arr(F.grow[0] + F.grow[1] - 0.1, 0.3), 1 - arr(F.turns[0], 0.25)) : 0;
    upright(sc, [{ v: d.grow, a: gl }, { v: v, a: done }]);
    const hls = right ? chipsAt([[d.job, F.note]]) : null;
    strip(hls);
    if (d.target != null) ring(sc, d.target, 1);
    ts.forEach((e, k) => trail(sc, r, k + 1, e, down0));
    part(done, 6, () => turnLabel(sc, r, n));
    if (g > 0) part(Math.min(1, 3 * g), 0, () => pointer(sc, r * g, angleOf(down0, ts)));
    part(nt, 6, () => text(334, 58, d.note, 'note', 'end'));
    tipLabel(sc, d.grow, gl);
    tipLabel(sc, v, done);
    if (d.kind === 'which') sumAt(d.want + ' = ' + fmt(v), '', done, true);
    else sumAt(d.expr + ' =', fmt(v), done);
    const turning = ts.some((e) => e > 0 && e < 1);
    return lineSaid(L) + stripSaid(hls) + (d.target != null ? ' A ring marks ' + say(fmt(d.target)) + '.' : '') +
      (nt >= 0.5 ? ' Top right: ' + say(d.note) + '.' : '') +
      (g >= 0.5 ? ' An arrow from zero ' + (turning ? 'is turning about zero' : 'points to ' + say(fmt(turned(d.grow, ts.filter((e) => e >= 1).length)))) + '.' : '') +
      (done >= 0.5 ? ' After ' + turnsWord(n) + ', ' + say((d.kind === 'which' ? d.want : d.expr) + ' = ' + fmt(v)) + '.' : d.kind === 'which' ? '' : ' Below, ' + say(d.expr) + ' equals an empty box.');
  }

  // --- the tap puzzle: a sum written large; Dan taps the job to do first ---
  const TAP = { y: 112, G: 28 };
  function tapLayout(d) {
    const ws = d.expr.map((s) => tw(s, 'huge')), total = ws.reduce((s, w) => s + w, 0) + TAP.G * (ws.length - 1);
    let x = 170 - total / 2;
    const g = d.expr.map((s, k) => { const o = { s: s, x: x, w: ws[k] }; x += ws[k] + TAP.G; return o; });
    const mw = tw(M, 'huge');
    g.targets = d.taps.map((k) => { const o = g[k], w = o.s.length > 1 ? mw : o.w; return { c: o.x + w / 2, w: w }; });
    const gaps = g.targets.slice(1).map((t, k) => t.c - g.targets[k].c);
    g.boxW = Math.max(46, Math.min(52, Math.min.apply(null, gaps) - 4));
    return g;
  }
  function drawTap(d, st, right) {
    svg.setAttribute('viewBox', '0 0 340 ' + TAPH);
    const g = tapLayout(d), F = d.at, L = d.L, y = TAP.y, s0 = g[d.span[0]], s1 = g[d.span[1]];
    const h1 = right ? arr(F.hl, HL) : 0, va = right ? arr(F.val) : 0, sa = right ? arr(F.sum) : 0;
    const hls = right ? chipsAt([['m', F.hl], ['a', F.sum]]) : null;
    strip(hls);
    part(h1, 0, () => rect('hl', s0.x - 8, y - 40, s1.x + s1.w - s0.x + 16, 52, 8));
    g.forEach((o) => text(o.x, y, o.s, 'huge', 'start'));
    // until it is answered, a dashed line under each sign says it can be tapped; the picked one gets a bar
    const taps = () => g.targets.forEach((o, k) => line(st.sel === k ? 'picked' : 'tapline', o.c - o.w / 2 + 2, y + 14, o.c + o.w / 2 - 2, y + 14));
    if (!right) taps(); else leave(h1, taps);
    const x0 = s0.x, x1 = s1.x + s1.w;
    part(va, 0, () => grown('brk', 'M' + x0.toFixed(2) + ' ' + (y + 16) + ' V' + (y + 22) + ' H' + x1.toFixed(2) + ' V' + (y + 16), 1));
    part(va, 6, () => text((x0 + x1) / 2, y + 46, fmt(L.jobs[0].v), 'hl2'));
    part(sa, 6, () => text(334, TAPH - 14, L.rows[1] + ' = ' + L.rows[2], 'sum', 'end'));
    placeHits(right ? null : g, d);
    return 'The sum ' + say(d.expr.join(' ')) + ', written large, with its plus, its divide and the minus of minus 3 to tap' +
      (st.sel != null && !right ? '; ' + say(d.tapNames[st.sel]).toLowerCase() + ' is picked' : '') + '.' + stripSaid(hls) +
      (h1 >= 0.5 ? ' Highlighted, the job done first: ' + say(L.jobs[0].on) + '.' : '') + (va >= 0.5 ? ' Under it: ' + say(fmt(L.jobs[0].v)) + '.' : '') +
      (sa >= 0.5 ? ' Below: ' + say(L.rows[1] + ' = ' + L.rows[2]) + '.' : '');
  }
  // The signs Dan can tap are kept across repaints (the picture is redrawn every frame), so the
  // keyboard focus survives. Each is a thumb's width across.
  const hits = [0, 1, 2].map((k) => {
    const r = ui.appendChild(K.svg('rect', { class: 'hit', role: 'button', tabindex: -1, 'aria-pressed': 'false', 'aria-label': 'Sign ' + (k + 1) }));
    r.style.display = 'none';
    const pickIt = () => {
      const i = at(), st = S[i];
      if (finished || STEPS[i].kind !== 'tap' || st.res === 'right') return;
      st.sel = k; st.res = null;
      K.reveal(); K.refresh();
    };
    r.addEventListener('click', pickIt);
    r.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pickIt(); } });
    return r;
  });
  function placeHits(g, d) {
    hits.forEach((r, k) => {
      if (!g || k >= g.targets.length) { r.style.display = 'none'; r.setAttribute('tabindex', '-1'); return; }
      const o = g.targets[k], st = S[at()];
      r.style.display = '';
      r.setAttribute('tabindex', '0');
      r.setAttribute('x', (o.c - g.boxW / 2).toFixed(2)); r.setAttribute('y', TAP.y - 52);
      r.setAttribute('width', g.boxW.toFixed(2)); r.setAttribute('height', 72); r.setAttribute('rx', 10);
      r.setAttribute('aria-label', say(d.tapNames[k]).replace(/^the /, 'The '));
      r.setAttribute('aria-pressed', st.sel === k ? 'true' : 'false');
    });
  }

  // The scene for a step (the animation calls this every frame).
  function paint(i) {
    if (i == null) i = at();
    const d = STEPS[i], st = S[i], right = st.res === 'right';
    art.textContent = '';
    into = null;
    H = d.kind === 'tap' ? TAPH : (d.lay && LAY[d.lay].H) || H0;
    svg.setAttribute('viewBox', '0 0 340 ' + H);
    if (d.kind !== 'tap') placeHits(null, d);
    let aria;
    if (d.show) aria = d.demo === 'power' ? demoPower(d) : ladScene(d, AT[d.demo], true);
    else if (d.kind === 'ladder') aria = ladScene(d, d.at, right);
    else if (d.kind === 'tap') aria = drawTap(d, st, right);
    else aria = drawPower(d, st, right);
    svg.setAttribute('aria-label', aria);
  }

  const el = (id) => document.getElementById(id);
  write(el('finish'), FINISH);
  K.update((p) => {
    const i = Math.round(p.step), d = STEPS[i], st = S[i];
    if (!anim.playing()) T = Infinity;   // motion that was stopped (the page hidden, a test) shows finished
    if (i !== lastStep) { lastStep = i; enter('stepbox'); if (d.show) { st.mode = 'open'; play(demoDur(i), 'demo'); } else { anim.pause(); T = Infinity; motion = null; } }
    if (finished !== lastDone) { lastDone = finished; enter(finished ? 'done' : 'stepbox'); }
    const right = st.res === 'right';
    el('stepbox').hidden = finished;
    el('done').hidden = !finished;
    el('count').textContent = 'Step ' + (i + 1) + ' of ' + STEPS.length;
    const task = el('task');
    task.className = 'task' + (d.show ? ' show' : '');
    write(task, d.show ? d.text : d.task);
    paint(i);

    el('replay').hidden = !d.show || (REDUCE && !d.toggle);
    replayBtn.el.hidden = REDUCE;
    togBtn.el.hidden = !d.toggle;
    togBtn.setLabel(st.brk ? 'Remove brackets' : 'Add brackets');
    togBtn.el.setAttribute('aria-pressed', st.brk ? 'true' : 'false');
    togBtn.el.setAttribute('aria-label', st.brk ? 'Remove brackets from minus 3 squared' : 'Add brackets round the minus 3 in minus 3 squared');
    const opts = d.show ? [] : d.opts || [];
    el('picks').hidden = !opts.length;
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      write(b.el, opts[k]);
      b.el.setAttribute('aria-label', say(opts[k]));
      b.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });

    el('acts').hidden = !!d.show;
    checkBtn.el.hidden = right;
    const fb = el('fb');
    fb.hidden = !!d.show;
    fb.className = 'fb' + (right ? ' right' : st.res === 'wrong' ? ' wrong' : '');
    write(fb, d.show ? '' : right ? 'That\'s it.' : st.res === 'wrong' ? hintFor(i, st) : st.res === 'empty' ? emptyFor(i, st) || PICK : '');

    const why = el('why');
    why.hidden = d.show || !st.why;
    write(why, d.show ? '' : d.why);
    whyBtn.setLabel(st.why ? 'Hide why' : 'Why?');

    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !right);
    nextBtn.setLabel(i === STEPS.length - 1 ? 'Finish' : 'Continue');
    nav.hidden = backBtn.el.hidden && nextBtn.el.hidden;
  });

  // ---------- known answers, worked out by hand ----------
  const DO = STEPS.map((d, i) => i).filter((i) => !STEPS[i].show);
  const LADS = STEPS.filter((d) => d.L);
  const TAP_I = STEPS.findIndex((d) => d.kind === 'tap'), POW_I = STEPS.findIndex((d) => d.toggle);
  const pickRight = (i, v) => isRight(i, Object.assign(solved(i), { pick: v, res: null }));
  // The one option a step accepts: the only one worth the answer the order gives.
  function onlyRight(i) {
    const d = STEPS[i];
    if (d.kind === 'tap') return true;
    const ok = d.kind === 'which' ? d.opts.filter((o) => same(evaluate(o), d.target)) : d.opts.filter((o) => same(evaluate(o), answerOf(d)));
    return ok.join() === d.want && d.opts.every((o) => pickRight(i, o) === (o === d.want));
  }
  const PRI = { b: 0, p: 1, m: 2, a: 3 };
  K.check('The order of operations still applies when negatives are included, so every screen\'s working does brackets, then powers, then times and divide, then add and take away, partners left to right, each row worth the same as the sum', () =>
    LADS.every((d) => {
      const L = d.L, v0 = evaluate(L.rows[0]);
      return L.rows.every((s) => same(evaluate(s), v0)) && same(L.value, v0) && /^−?\d+$/.test(L.rows[L.rows.length - 1]) &&
        L.jobs.every((j, k) => j.at >= 0 && jobOf(j.on) === j.job && (k === 0 || PRI[j.job] >= PRI[L.jobs[k - 1].job]) && (j.job !== 'a' || j.at === 0));
    }), { source: OPENSTAX });
  K.check('Brackets are needed to make 9 negative and then square it, so (−9)² = 81 while −9² = −81; in the same way (−3)² = 9 and −3² = −9, the arrow to 9 turned twice or once', () =>
    evaluate('(−9)²') === 81 && evaluate('−9²') === -81 && evaluate('(−3)²') === 9 && evaluate('−3²') === -9 && turned(9, 2) === 9 && turned(9, 1) === -9, { source: OPENLEARN });
  K.check('It is best to use brackets when squaring negative numbers: each square or cube of a negative number in this lesson has its brackets, and each power written after a lone minus raises the number alone', () => {
    const all = [].concat.apply([], STEPS.map((d) => [d.expr, d.text, d.task, d.why].concat(d.opts || [], d.L ? d.L.rows : []))).filter((s) => s && /[²³]/.test(s));
    const withB = [], without = [];
    all.forEach((s) => { (s.match(/\(−\d+\)[²³]/g) || []).forEach((m) => withB.push(m)); (s.match(/(^|[^)\d(])−\d+[²³]/g) || []).forEach((m) => without.push(m.replace(/^[^−]/, ''))); });
    return withB.length >= 4 && without.length >= 3 && withB.every((m) => { const n = Number(m.match(/\d+/)[0]), p = /²/.test(m) ? 2 : 3; return evaluate(m) === Math.pow(-n, p); }) &&
      without.every((m) => { const n = Number(m.match(/\d+/)[0]), p = /²/.test(m) ? 2 : 3; return evaluate(m) === -Math.pow(n, p); });
  }, { source: OPENLEARN });
  K.check('Equal partners go left to right: 8 − 3 + 2 = 7, while adding first gives 8 − 5 = 3; 1 − 4 + 2 = −1, not 1 − 6 = −5; and the times or divide goes before the add, so 6 + 12 ÷ −3 = 2, not 18 ÷ −3 = −6, and 1 + 2 × −3 = −5', () =>
    evaluate('8 − 3 + 2') === 7 && evaluate('8 − 3 + 2', 'addFirst') === 3 && evaluate('1 − 4 + 2') === -1 && evaluate('1 − 4 + 2', 'addFirst') === -5 &&
    evaluate('6 + 12 ÷ −3') === 2 && evaluate('6 + 12 ÷ −3', 'flat') === -6 && evaluate('1 + 2 × −3') === -5 && STEPS[0].L.value === -5 && STEPS[1].L.value === 2 && STEPS[2].L.value === -1);
  K.check('Each puzzle accepts only its own answer, and every wrong answer offered is the one a named slip gives: adding first, adding what is taken away, squaring the minus, reading a power as a times, losing or keeping a power\'s sign, keeping a minus, dropping a bracket, forgetting the opposite, working left to right regardless', () =>
    DO.every(onlyRight) && DO.every((i) => {
      const d = STEPS[i], q = d.L ? d.L.rows[0] : d.expr;
      return !d.slips || Object.keys(d.slips).every((o) => d.opts.indexOf(o) >= 0 && o !== d.want && same(evaluate(q, d.slips[o]), evaluate(o)) && !same(evaluate(o), answerOf(d)));
    }) && DO.filter((i) => STEPS[i].opts).every((i) => STEPS[i].opts.length === 3));
  K.check('In 6 + 12 ÷ −3 only the divide is accepted as the job to do first; the minus of −3 is part of the number, not a job between two numbers; the working gives 6 + (−4) = 2', () => {
    const d = STEPS[TAP_I], st = (k) => Object.assign(blank(TAP_I), { sel: k });
    return firstJob(d.expr) === d.taps[d.want] && d.expr[d.taps[2]] === '−3' && /^−\d/.test(d.expr[d.taps[2]]) && d.expr.slice(d.span[0], d.span[1] + 1).join(' ') === d.L.jobs[0].on &&
      same(evaluate(d.expr.join(' ')), d.L.value) && d.L.value === 2 && d.L.rows[1] === '6 + (−4)' && isRight(TAP_I, st(1)) && !isRight(TAP_I, st(0)) && !isRight(TAP_I, st(2)) && isEmpty(TAP_I, blank(TAP_I));
  });
  K.check('The marker lands where the working says: facing up to add and down to take away, it steps forwards for a positive number and backwards for a negative one, so 1 + (−6) = −5, 1 − 4 = −3, −3 + 2 = −1, 6 − (−3) = 9 and 2 − 12 = −10', () => {
    const walks = [].concat.apply([], LADS.map((d) => d.L.jobs.filter((j) => j.job === 'a')));
    return walks.length >= 9 && walks.every((j) => j.walk && same(j.walk.to, j.v) && Number.isInteger(j.walk.n)) &&
      walkOf('1 + (−6)').to === -5 && !walkOf('1 + (−6)').down && walkOf('1 + (−6)').back && walkOf('6 − (−3)').down && walkOf('6 − (−3)').back && walkOf('6 − (−3)').to === 9 &&
      walkOf('2 − 12').to === -10 && !walkOf('2 − 12').back && walkOf('1 − 4').to === -3 && walkOf('−3 + 2').to === -1;
  });
  K.check('The arrow pictures agree with the sums: the arrow drawn to the part worked out first (5 × 5, 2 × 2 × 2, 5 − 8, 4 × 4), then one half-turn for each minus sign left: −5² = −25, (−2)³ = −8, −(5 − 8) = 3 and (−4)² = 16', () =>
    STEPS.filter((d) => d.grow != null).every((d) => same(turned(d.grow, d.turns), d.kind === 'which' ? evaluate(d.want) : evaluate(d.expr)) && same(evaluate(d.note.split(' = ')[0]), d.grow) && same(evaluate(d.note.split(' = ')[1]), d.grow)) &&
    evaluate('−5²') === -25 && evaluate('(−2)³') === -8 && evaluate('−(5 − 8)') === 3 && evaluate('(−4)²') === 16 && evaluate('−4²') === -16 && evaluate('−(4²)') === -16);
  // Drawn from the lesson's own timetable: each screen is painted finished and every arrival it used is noted.
  K.check('Every demonstration has finished arriving within 4.5 s of its screen opening, none starting before the 0.35 s screen fade ends; putting the brackets on or taking them off plays out within 4.5 s; every answer\'s motion within 2.5 s; hops and half-turns start at least 0.2 s apart', () => {
    const keepT = T, keepP = S[POW_I];
    let ok = STEPS.every((d, i) => {
      const keepS = S[i];
      T = Infinity; latest = 0; earliest = Infinity;
      if (!d.show) S[i] = solved(i); else S[i] = Object.assign(blank(i), { brk: false, mode: 'open' });
      try { paint(i); } finally { S[i] = keepS; }
      return d.show ? latest <= d.dur && d.dur <= 4.5 && earliest >= FADE : latest <= d.fb && d.fb <= 2.5;
    });
    [['open', true], ['toggle', true], ['toggle', false]].forEach((c) => {
      T = Infinity; latest = 0; earliest = Infinity;
      S[POW_I] = Object.assign(blank(POW_I), { brk: c[1], mode: c[0] });
      try { paint(POW_I); } finally { S[POW_I] = keepP; }
      const end = powerTT({ brk: c[1], mode: c[0] }).sum + K.SOFT;
      ok = ok && latest <= end && end <= 4.5 && (c[0] !== 'open' || earliest >= FADE);
    });
    T = keepT; paint();
    const runs = [];
    [AT.order, AT.partners, AT.bracket].concat(STEPS.filter((d) => d.at && d.at.walks).map((d) => d.at)).forEach((A) => A.walks.forEach((w) => { if (w.hops) runs.push(w.hops); }));
    STEPS.filter((d) => d.at && d.at.turns).forEach((d) => runs.push(d.at.turns));
    Object.keys(AT.power).forEach((k) => runs.push(AT.power[k].turns));
    return ok && runs.length >= 12 && runs.every((ts) => ts.every((t, k) => k === 0 || t - ts[k - 1] >= 0.2 - 1e-9));
  });

  // What every drawn part of the picture shows, by what it is: a word by its text, a box by where it
  // starts, any other shape by its kind (the most of each); a part in a fading group shows as much as the group lets it.
  function shown() {
    const o = {};
    art.querySelectorAll('text, path, line, rect, circle').forEach((n) => {
      let a = 1;
      for (let q = n; q && q !== art; q = q.parentNode) if (q.style && q.style.opacity !== '') a *= Number(q.style.opacity);
      const key = n.getAttribute('class') + '|' + (n.tagName === 'text' ? n.textContent : n.tagName === 'rect' ? Math.round(Number(n.getAttribute('x'))) : '');
      o[key] = Math.max(o[key] || 0, a);
    });
    return o;
  }
  K.check('Putting the brackets on or taking them off part-way through never pops a picture in or out: tapped 1.0 s or 2.5 s into the screen or into a toggle, and tapped again 0.2 s later, no part\'s opacity changes by more than 0.5 from one 1/60 s frame to the next', () => {
    const keepT = T, keepP = S[POW_I], dt = 1 / 60;
    const look = (st, t) => { S[POW_I] = st; T = t; paint(POW_I); return shown(); };
    const smooth = (x, y) => Object.keys(Object.assign({}, x, y)).every((k) => Math.abs((x[k] || 0) - (y[k] || 0)) <= 0.5);
    const tap = (st, t) => Object.assign({}, st, toggled(st, t));
    let ok = true, n = 0;
    try {
      [{ brk: false, mode: 'open' }, { brk: true, mode: 'toggle' }, { brk: false, mode: 'toggle' }].forEach((s) => [1.0, 2.5].forEach((t) => {
        const s0 = Object.assign(blank(POW_I), s), s1 = tap(s0, t);
        ok = ok && smooth(look(s0, t), look(s1, dt)) && smooth(look(s1, 0.2), look(tap(s1, 0.2), dt));
        n++;
      }));
    } finally { S[POW_I] = keepP; T = keepT; paint(); }
    return ok && n === 6;
  });
  K.check('Every answer offered sits on its puzzle\'s number line, and the right one is never at an end of it, so the line gives nothing away', () =>
    DO.filter((i) => STEPS[i].opts && STEPS[i].lay).every((i) => {
      const d = STEPS[i], L = LAY[d.lay], w = evaluate(d.want);
      return d.opts.every((o) => evaluate(o) <= L.top && evaluate(o) >= L.bot) && w < L.top && w > L.bot;
    }) && DO.filter((i) => STEPS[i].opts && STEPS[i].lay).length === 7);

  K.ready();
</script>
