  const FINISH = 'To take away a negative, face down and step backwards, up the line. Taking away a negative is adding its opposite, so 3 − (−2) = 3 + 2 = 5.';

  const RULES = ['Facing up: add', 'Facing down: take away', 'Positive: forwards', 'Negative: backwards'];
  // When each demonstration's parts arrive, in seconds after the screen opens (the screen itself
  // takes FADE to fade in, so nothing starts before it has settled). HOP: how long one hop takes;

    walk: { top: 7, bot: -3, minor: 1, every: 1 },

  const same = (a, b) => K.near(a, b, 1e-9);
  const round3 = (v) => Math.round(v * 1000) / 1000;
  // '−0.7' -> −0.7; '+12' -> 12; a sum or words -> NaN.
  function value(s) {
    const t = String(s).replace(/−/g, '-').trim();
    return /^[-+]?\d+(\.\d+)?$/.test(t) ? Number(t) : NaN;

    u = u || 1;
    const face = op === M ? -1 : 1, dir = b < 0 ? -1 : 1, way = face * dir, n = Math.round(Math.abs(b) / u), seen = [a];

    return m ? walk(value(m[1]), m[2], value(m[3])).at : NaN;

  function chainStops(d) {
    const out = [];
    let v = d.from;
    d.terms.forEach((t) => { v = walk(v, t.op, t.n).at; out.push(v); });

  function counted(first, last) {
    let v = first, c = 0;

  function answerOf(d) {
    if (d.kind === 'walk' || d.kind === 'take' || d.kind === 'same' || d.kind === 'more') {

    if (d.kind === 'change') return changeOf(d.first, d.last);
    if (d.kind === 'which') return d.opts.filter((o) => same(sumValue(o), d.target)).join();
    if (d.kind === 'chain') { const s = chainStops(d); return s[s.length - 1]; }

  }

  // n: the marker's steps so far, signed (forwards +, backwards −), the one gliding included;
  // queue: taps waiting for it to finish gliding (+1 forwards, −1 backwards); hopAt: when each step
  // began, on the motion's clock (its count rises in after that).
  function blank(i) {
    return { n: 0, queue: [], hopAt: [], down: false, glide: null, pick: null, res: null, why: false };
  }
  // Nothing to check yet: says what to do first ('' when there is something to check).
  function emptyFor(i, st) {
    const d = STEPS[i];
    if (d.kind === 'walk') return st.n === 0 && !st.down ? d.empty : '';
    return st.pick == null ? PICK : '';
  }
  const isEmpty = (i, st) => !!emptyFor(i, st);
  const stepsOf = (d) => Math.round(d.take / (d.unit || 1));   // signed: a negative number steps backwards
  function isRight(i, st) {
    const d = STEPS[i];

    return st.pick === d.want;
  }
  // A wrong answer's hint names its slip: on the walk, the way the marker faces, then the way it

  function hintFor(i, st) {

      if (Math.abs(n) === Math.abs(want) - 1) return said + '. Count the hops, not the number you start on. Step backwards once more.';
      if (Math.abs(n) < Math.abs(want)) return said + '. Taking away ' + fmt(d.take) + ' takes ' + Math.abs(want) + ' steps backwards.';
      return said + '. Taking away ' + fmt(d.take) + ' takes ' + Math.abs(want) + ' steps backwards. Tap Start again.';

  let S = STEPS.map((d, i) => blank(i));

  // ---------- controls ----------
  const stepper = K.stepper({ id: 'step', label: 'Step', steps: STEPS.map((d) => d.name), value: 0, compact: true, into: '#prog' });
  const nav = document.getElementById('nav');
  const at = () => stepper.get();

  const pickBtns = [0, 1, 2, 3].map((k) => K.button({ label: 'Answer ' + (k + 1), secondary: true, into: '#picks', press: () => {
    const i = at(), d = STEPS[i], st = S[i];

  function glide(st, now, v1, a1, dur, n0, gone, goneWay) {

  const turnBtn = K.button({ label: 'Turn round', secondary: true, into: '#walk', press: turnOrRestart });
  const fwdBtn = K.button({ label: 'Forwards', secondary: true, into: '#walk', press: () => stepMarker(1) });
  const backBtnW = K.button({ label: 'Backwards', secondary: true, into: '#walk', press: () => stepMarker(-1) });
  fwdBtn.el.setAttribute('aria-label', 'Step the marker forwards, the way it faces');
  backBtnW.el.setAttribute('aria-label', 'Step the marker backwards, away from the way it faces');

  // Check: marks the answer; a right one plays its picture's motion.
  const checkBtn = K.button({ label: 'Check', into: '#acts', press: () => {
    const i = at(), d = STEPS[i], st = S[i];

    st.res = isRight(i, st) ? 'right' : 'wrong';

  } });
  const whyBtn = K.button({ label: 'Why?', secondary: true, into: '#acts', press: () => {
    if (STEPS[at()].show || finished) return;

  } });
  const replayBtn = K.button({ label: 'Play again', secondary: true, into: '#replay', press: () => {
    const d = STEPS[at()];
    if (!d.show || finished) return;
    play(d.dur, 'demo');
  } });
  const backBtn = K.button({ label: 'Back', secondary: true, into: '#nav', press: () => {
    if (finished) { finished = false; return; }
    stepper.set(Math.max(0, at() - 1), true);
  } });
  const nextBtn = K.button({ label: 'Continue', into: '#nav', press: () => {
    const i = at();
    if (finished || (!STEPS[i].show && S[i].res !== 'right')) return;
    if (i < STEPS.length - 1) { stepper.set(i + 1, true); return; }
    finished = true;
    if (typeof K.complete === 'function') K.complete();
  } });
  const againBtn = K.button({ label: 'Start again', secondary: true, into: '#again', press: () => {
    S = STEPS.map((d, i) => blank(i)); finished = false; lastStep = -1; stepper.set(0, true);
  } });

  // One animation plays each demonstration, the motion after a right answer, and each move Dan
  // gives the marker, from its start; with reduced motion (and while the self-test looks) it opens finished.
  const anim = K.anim({ button: false, label: 'Demonstration', step: (dt) => {
    if (finished) return false;
    T += dt;
    if (motion === 'walk') walkOn();
    paint();
    return T < motionEnd;
  } });

  // resumes it when he comes back; this only settles a motion that had already stopped.
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !anim.playing() && T !== Infinity) { T = Infinity; paint(); } });
  function play(dur, kind) {
    motion = kind;

    motionEnd = dur; T = 0; anim.play();
  }
  // A new screen (or the finish panel) fades in softly: the CSS animation restarts on it.
  function enter(id) {
    if (REDUCE) return;
    const box = document.getElementById(id);
    box.classList.remove('enter');
    void box.offsetWidth;
    box.classList.add('enter');
  }

  // ---------- drawing ----------
  const svg = document.getElementById('scene'), art = document.getElementById('art');
  let into = null;                                   // where shapes go: the picture, or a part that is arriving
  const add = (node) => (into || art).appendChild(node);
  // How far a part due at t0 has arrived (K.arrive), noting the timetable for the timing check.
  let latest = 0, earliest = Infinity;

  }
  // Boxes of the card, the answer tags and the sum, noted as they are drawn (for the layout check).
  let boxes = [];
  // A part arriving: drawn into a group faded in to a and risen `rise` units into place; nothing before it starts.
  function part(a, rise, draw) {
    if (a <= 0) return;
    const g = add(K.svg('g'));
    K.fade(g, a, rise);
    const keep = into; into = g; draw(); into = keep;
  }
  // A part leaving (a slot giving way to its answer): faded out as a goes 0 -> 1.
  function leave(a, draw) {
    if (a >= 1) return;
    const g = add(K.svg('g'));
    K.fade(g, 1 - a, 0);
    const keep = into; into = g; draw(); into = keep;
  }
  // The second of two lines side by side: its parts drawn SHIFT units to the right.
  function shifted(draw) {
    const g = add(K.svg('g', { transform: 'translate(' + SHIFT + ' 0)' }));
    const keep = into; into = g; draw(); into = keep;
  }
  const rect = (cls, x, y, w, h, rx) => add(K.svg('rect', { class: cls, x: x, y: y, width: w, height: h, rx: rx || 0 }));
  const line = (cls, x1, y1, x2, y2) => add(K.svg('line', { class: cls, x1: x1, y1: y1, x2: x2, y2: y2 }));
  const text = (x, y, s, cls, anchor) => add(K.svg('text', { class: cls, x: x, y: y, 'text-anchor': anchor || 'middle' }, String(s)));

  }
  // The width of a line of text (measured once it can be; estimated while the scene is hidden).
  const widths = {};
  function tw(s, cls) {
    const key = cls + '|' + s;
    if (widths[key]) return widths[key];
    const t = svg.appendChild(K.svg('text', { class: cls, x: 0, y: -50 }, String(s)));
    let w = 0;
    try { w = t.getComputedTextLength(); } catch (e) { w = 0; }
    svg.removeChild(t);

  function scaleOf(L) {

      ' A15 15 0 1 1 ' + (X - TW) + ' ' + yB + ' Z');

  }
  // A reading on the line: a dot, and its value beside the numbers, risen in as a goes 0 -> 1.
  function reading(sc, v, a, unit) {
    part(a, 0, () => add(K.svg('circle', { class: 'dot', cx: X, cy: sc.y(v), r: 7 })));
    part(a, 6, () => text(LX, sc.y(v) + 5.5, (unit === '°C' ? signed(v) : fmt(v)) + ' ' + unit, 'val', 'end'));
  }
  // The marker at v, turned `ang` degrees from facing up (180 faces down): its round end on the line
  // at v, its point the way it faces.
  const PIN = 'M0 -18 L6.93 -4 A8 8 0 1 1 -6.93 -4 Z';
  function marker(sc, v, ang, a) {
    part(a, 0, () => add(K.svg('path', { class: 'mk', 'data-v': round3(v), 'data-ang': Math.round(ang),
      transform: 'translate(' + X + ' ' + sc.y(v).toFixed(2) + ') rotate(' + ang.toFixed(1) + ')', d: PIN })));
  }
  const ring = (sc, v, a) => part(a, 0, () => add(K.svg('circle', { class: 'ring', cx: X, cy: sc.y(v), r: 9 })));

    for (let k = 0; k < RULES.length; k++) {
      const yb = y0 + 20 + 20 * k, h = hls ? hls[k] || 0 : 0;

      part(ins[k], 6, () => {
        if (k < 2) add(K.svg('path', { class: 'mini', transform: 'translate(' + (x + 16) + ' ' + (yb - 5) + ') rotate(' + (k === 0 ? 0 : 180) + ') scale(0.55)', d: PIN }));
        text(x + 11 + (k < 2 ? 18 : 0), yb, RULES[k], 'rule k-nohalo', 'start');

  }
  // What the card says, and which of its lines are highlighted (hls as for card).
  function ruleSaid(hls) {

    return ' Beside it, the rule: facing up means add, facing down means take away, a positive number steps forwards and a negative number steps backwards' +

  }

    const e = arr(h.t, h.dur), hd = arr(h.t + h.dur * 0.6, 0.3), x = X + TW + 3, d = 14, up = h.b > h.a;
    if (e > 0) {
      const y1 = sc.y(h.a) + (up ? -2 : 2), y2 = sc.y(h.b) + (up ? 2 : -2), ym = (y1 + y2) / 2;
      grown('hop', 'M' + x + ' ' + y1.toFixed(2) + ' Q' + (x + 2 * d) + ' ' + ym.toFixed(2) + ' ' + x + ' ' + y2.toFixed(2), e);
      const dx = -2 * d, dy = y2 - ym, len = Math.hypot(dx, dy) || 1, ux = dx / len, uy = dy / len;
      const bx = x - ux * 9, by = y2 - uy * 9, px = -uy * 4.5, py = ux * 4.5;
      part(hd, 0, () => pathOf('head', 'M' + x + ' ' + y2.toFixed(2) + ' L' + (bx + px).toFixed(2) + ' ' + (by + py).toFixed(2) + ' L' + (bx - px).toFixed(2) + ' ' + (by - py).toFixed(2) + ' Z'));
    }
    part(arr(h.lt), 6, () => text(x + d + 8, (sc.y(h.a) + sc.y(h.b)) / 2 + 5, h.lab, 'hl2', 'start'));
    return e;
  }
  // The answer's tag at v, its point at TAGX - 7, risen in as a goes 0 -> 1.
  function tag(sc, v, s, a) {
    const y = sc.y(v), w = Math.max(40, tw(s, 'tagt') + 20);
    boxes.push({ k: 'tag', x: TAGX - 7, y: y - 15, w: w + 7, h: 30 });
    part(a, 6, () => {
      pathOf('tag', 'M' + TAGX + ' ' + (y - 7).toFixed(2) + ' L' + (TAGX - 7) + ' ' + y.toFixed(2) + ' L' + TAGX + ' ' + (y + 7).toFixed(2) + ' Z');
      rect('tag', TAGX, y - 15, w, 30, 8);
      text(TAGX + w / 2, y + 5.5, s, 'tagt k-nohalo');
    });
  }
  // The slot an answer goes in: a dashed box that gives way to the answer as a goes 0 -> 1.
  const slot = (x, y, w, h, a) => leave(a, () => rect('gapbox', x, y, w, h, 5));
  // The sum at the foot of the picture, right-aligned: its left side, then a slot that gives way to
  // the answer as a goes 0 -> 1 (or the whole sum risen in as a does, with `whole`).
  function sumAt(left, ans, a, whole) {
    const y = H - 12;
    if (whole) { boxes.push({ k: 'sum', x: 334 - tw(left, 'sum'), y: y - 21, w: tw(left, 'sum'), h: 27 }); part(a, 6, () => text(334, y, left, 'sum', 'end')); return; }
    const w = Math.max(36, tw(ans, 'sum') + 12), x = 334 - w;
    boxes.push({ k: 'sum', x: x - 6 - tw(left, 'sum'), y: y - 21, w: w + 6 + tw(left, 'sum'), h: 29 });
    text(x - 6, y, left, 'sum', 'end');
    slot(x, y - 21, w, 29, a);
    part(a, 6, () => text(x + w / 2, y, ans, 'sum'));
  }
  // A vertical arrow at x from value a to b, grown as far as e, its head on the growing tip; it
  // fades in over the first third of its growth, so its head never pops in.
  function arrow(sc, x, a, b, e) {
    if (e <= 0) return;
    const y1 = sc.y(a), y2 = sc.y(b), y = K.lerp(y1, y2, e), s = y2 < y1 ? 1 : -1;
    part(Math.min(1, e * 3), 0, () => {
      line('ov', x, y1, x, y);
      pathOf('ov', 'M' + (x - 6) + ' ' + (y + 9 * s).toFixed(2) + ' L' + x + ' ' + y.toFixed(2) + ' L' + (x + 6) + ' ' + (y + 9 * s).toFixed(2));
    });
  }
  // A bracket at x, its ends turned back towards the line, from value a to b.
  const bracket = (sc, x, a, b, e) => grown('brk', 'M' + (x - 6) + ' ' + sc.y(a).toFixed(2) + ' H' + x + ' V' + sc.y(b).toFixed(2) + ' H' + (x - 6), e);
  // The words "first" and "last" (or "loaded" and "set point") beside a change's readings, on the side away from its move.
  function ends(sc, d, a1, a2) {
    const rise = d.last > d.first;
    part(a1, 6, () => text(X + TW + 7, sc.y(d.first) + (rise ? 20 : -9), d.tags[0], 'note', 'start'));
    part(a2, 6, () => text(X + TW + 7, sc.y(d.last) + (rise ? -9 : 20), d.tags[1], 'note', 'start'));
  }
  const lineSaid = (L) => 'An upright number line from ' + say(fmt(L.top)) + ' down to ' + say(fmt(L.bot)) + (L.unit ? ' ' + say(L.unit) : '') +
    (L.bulb ? ', drawn like a thermometer' : '') + ', with zero marked.';
  const stepsSaid = (n, way) => n + ' step' + (n === 1 ? '' : 's') + ' backwards, up the line';

  // --- the demonstrations (SHOW steps), drawn at time T ---
  // 1 − (−3): the marker on 1 faces down to take away; −3 is negative, so it steps backwards 3, up, to 4.
  function demoBack() {
    const A = AT.back, sc = scaleOf(LAY.back), mk = arr(A.mk), c = arr(A.card), h1 = arr(A.hl1, HL), h2 = arr(A.hl2, HL);
    upright(sc);
    card([c, c, c, c], [0, h1, 0, h2]);
    const w = stepArcs(sc, A.from, 1, A.hops, A.hop, 1), n = w.counted;
    marker(sc, A.from + w.went, 180, mk);
    const done = arr(A.tag), ans = takeAway(A.from, A.take).at;
    tag(sc, ans, fmt(ans), done);
    sumAt('1 − (−3) = ' + fmt(ans), '', done, true);
    return lineSaid(LAY.back) + (mk >= 0.5 ? ' A marker stands on 1, facing down' + (n ? ', and has stepped ' + stepsSaid(n) : '') + '.' : '') +
      (c >= 0.5 ? ruleSaid([0, h1, 0, h2]) : '') + (done >= 0.5 ? ' It lands on 4: 1 minus negative 3 equals 4.' : '');
  }
  // 3 − (−2) beside 3 + 2: on the left the marker faces down and steps backwards 2; on the right it
  // faces up and steps forwards 2. Both land on 5, and the two sums are set equal.
  function demoOpp() {
    const A = AT.opp, L = LAY.opp, sc = scaleOf(L), a = arr(A.a), b = arr(A.b), eq = arr(A.eq);
    const ta = arr(A.tagA), tb = arr(A.tagB), ans = takeAway(A.from, -A.n).at, y = H - 12;
    upright(sc);
    const wa = stepArcs(sc, A.from, 1, A.hopsA, A.hop, 1);
    marker(sc, A.from + wa.went, 180, a);
    tag(sc, ans, fmt(ans), ta);
    part(a, 6, () => text(X, y, '3 − (−2)', 'sum'));
    let wb = { went: 0, counted: 0 };
    shifted(() => {
      upright(sc);
      wb = stepArcs(sc, A.from, 1, A.hopsB, A.hop, 1);
      marker(sc, A.from + wb.went, 0, b);
      tag(sc, addOpposite(A.from, -A.n).at, fmt(ans), tb);
      part(b, 6, () => text(X, y, '3 + 2', 'sum'));
    });
    part(eq, 6, () => text((X + X + SHIFT) / 2, y, '=', 'sum'));
    return 'Two upright number lines side by side, each from 6 down to minus 1.' +
      (a >= 0.5 ? ' On the left, 3 minus negative 2: a marker on 3 faces down' + (wa.counted ? ' and has stepped ' + stepsSaid(wa.counted) : '') + '.' : '') +
      (ta >= 0.5 ? ' It lands on 5.' : '') +
      (b >= 0.5 ? ' On the right, 3 plus 2: a marker on 3 faces up' + (wb.counted ? ' and has stepped ' + wb.counted + ' step' + (wb.counted === 1 ? '' : 's') + ' forwards, up the line' : '') + '.' : '') +
      (tb >= 0.5 ? ' It lands on 5 too.' : '') + (eq >= 0.5 ? ' So 3 minus negative 2 equals 3 plus 2.' : '');
  }
  // A rise from −20 °C to +4 °C: the first reading, then the last; the change grows from one to the
  // other and is named +24; the sum, last minus first; then the gap, 24, beside it with no sign.
  function demoGap() {
    const A = AT.gap, L = LAY.rooms, sc = scaleOf(L), d = { first: A.first, last: A.last, tags: ['first', 'last'] };
    const r1 = arr(A.r1), r2 = arr(A.r2), e = arr(A.arrow[0], A.arrow[1]), lab = arr(A.label), wk = arr(A.work), gp = arr(A.gap);
    upright(sc, [{ v: A.first, a: r1 }, { v: A.last, a: r2 }]);
    reading(sc, A.first, r1, L.unit); reading(sc, A.last, r2, L.unit);
    ends(sc, d, r1, r2);
    changeParts(sc, d, e, lab, gp, '');
    // last − first, then the sum on two lines, right-aligned and clear of the bulb
    part(wk, 6, () => { text(334, H - 58, 'last − first', 'note', 'end'); text(334, H - 34, A.sum[0], 'sum', 'end'); text(334, H - 12, A.sum[1], 'sum', 'end'); });
    const sw = Math.max(tw(A.sum[0], 'sum'), tw(A.sum[1], 'sum'));
    boxes.push({ k: 'sum', x: 334 - sw, y: H - 55, w: sw, h: 49 });
    return lineSaid(L) + (r1 >= 0.5 ? ' The first reading is minus 20 degrees' : '') + (r2 >= 0.5 ? ' and the last is plus 4 degrees.' : '.') +
      (e >= 1 ? ' An arrow points up from the first to the last' + (lab >= 0.5 ? ', labelled change plus 24' : '') + '.' : '') +
      (wk >= 0.5 ? ' Last minus first: 4 minus negative 20, which equals 4 plus 20, equals 24.' : '') +
      (gp >= 0.5 ? ' A bracket beside it, with no direction, is labelled gap 24.' : '');
  }
  // A change's arrow from the first reading to the last (grown as e goes 0 -> 1) with its value, and
  // the gap's bracket with its size (arriving as g does).
  function changeParts(sc, d, e, lab, g, unit) {
    const c = changeOf(d.first, d.last), ym = (sc.y(d.first) + sc.y(d.last)) / 2;
    // faint guides from the two readings across, arriving with the arrow, so its ends meet them
    part(Math.min(1, e * 3), 0, () => [d.first, d.last].forEach((v) => line('guide', X + TW + 4, sc.y(v), AX - 4, sc.y(v))));
    arrow(sc, AX, d.first, d.last, e);
    part(lab, 6, () => { text(AX + 10, ym - 6, 'change', 'note', 'start'); text(AX + 10, ym + 16, signed(c) + (unit ? ' ' + unit : ''), 'chg', 'start'); });
    if (g <= 0) return;
    part(g, 0, () => bracket(sc, BX, d.first, d.last, 1));
    part(g, 6, () => text(BX + 8, ym + 5.5, 'gap ' + gapOf(d.first, d.last), 'gapl', 'start'));
  }

  // --- the puzzles (DO steps); after a right answer their motion runs on the same clock T ---
  // The marker Dan turns and steps himself; a right answer tags where it landed and fills in the sum.
  function drawWalk(d, st, right) {
    const i = STEPS.indexOf(d), sc = scaleOf(LAY[d.lay]), now = walkNow(i), F = d.at, g = st.glide;
    upright(sc);
    const fr = now.ang / 180, live = !!(g && motion === 'walk' && i === at() && T !== Infinity && now.e < 1);
    // the forwards and backwards lines of the rule follow the steps taken, fading over the move
    const was = live ? g.nPrev : st.n, blend = (p, q) => K.lerp(p ? 1 : 0, q ? 1 : 0, live ? now.e : 1);
    card([1, 1, 1, 1], [1 - fr, fr, blend(was > 0, st.n > 0), blend(was < 0, st.n < 0)]);
    // the hops taken so far; the newest grows as the marker glides, or a step undone shrinks away;
    // after Start again, the old ones fade as the marker glides back
    const k = Math.abs(st.n), way = faceOf(st) * Math.sign(st.n);
    if (live && now.gone) leave(now.e, () => hopsFrom(sc, d.from, now.gone, g.goneWay, 1, null));
    const growing = live && Math.abs(st.n) > Math.abs(g.n0), undoing = live && Math.abs(st.n) < Math.abs(g.n0);
    if (k) hopsFrom(sc, d.from, k, way, growing ? now.e : 1, walkLive() ? st.hopAt : null);
    if (undoing) {
      const wayGone = faceOf(st) * Math.sign(g.n0), a = round3(d.from + wayGone * k), b = round3(a + wayGone);
      leave(now.e, () => { hop(sc, a, b, 1 - now.e, 8); text(CNTX, sc.y((a + b) / 2) + 4.5, k + 1, 'cnt', 'start'); });
    }
    marker(sc, now.v, now.ang, 1);
    const done = right ? arr(F.tag) : 0, ans = answerOf(d);
    tag(sc, ans, fmt(ans), done);
    sumAt(fmt(d.from) + ' − ' + br(d.take) + ' =', fmt(ans), done);
    const n = st.n;
    return lineSaid(LAY[d.lay]) + ' The marker you move stands on ' + say(fmt(walkAt(d, st))) + ', facing ' + (st.down ? 'down' : 'up') +
      (n ? ', after ' + Math.abs(n) + ' step' + (Math.abs(n) === 1 ? '' : 's') + (n > 0 ? ' forwards' : ' backwards') + ' from 3' : '') + '.' +
      ruleSaid([st.down ? 0 : 1, st.down ? 1 : 0, n > 0 ? 1 : 0, n < 0 ? 1 : 0]) +
      (done >= 0.5 ? ' 3 minus negative 2 equals 5.' : ' Below, 3 minus negative 2 equals an empty box.');
  }
  // n unit hops from `from` the way `way` points (the last grown as far as last), each counted: while
  // the marker moves, a hop's count rises in softly from half-way through it (hopAt: when each began).
  function hopsFrom(sc, from, n, way, last, hopAt) {
    for (let k = 0; k < n; k++) {
      const e = k === n - 1 && last != null ? last : 1, a = round3(from + k * way), b = round3(from + (k + 1) * way);
      const c = hopAt && hopAt[k] != null ? K.arrive(T, hopAt[k] + WALK / 2, CNT) : 1;
      hop(sc, a, b, e, 8);
      part(c, 6, () => text(CNTX, sc.y((a + b) / 2) + 4.5, k + 1, 'cnt', 'start'));
    }
  }
  // Take away a negative with the marker facing down (0 − (−5), 2 − (−6), 5 − (−2), −2.5 − (−4)): a
  // right answer highlights the negative line of the rule, hops the marker backwards, up the line,
  // tags where it lands and fills the slot (or brings in the whole sum).
  function drawTake(d, st, right) {
    const L = LAY[d.lay], sc = scaleOf(L), F = d.at, w = takeAway(d.from, d.take, d.unit), ans = w.at;
    upright(sc);
    const hl = right ? arr(F.hl, HL) : 0;
    card([1, 1, 1, 1], [0, 1, 0, hl], L.card);
    let travelled = 0, hopsSaid = '';
    if (F.big) {
      F.big.forEach((h) => { const e = right ? bigHop(sc, h) : 0; travelled += (h.b - h.a) * e; });
      if (right) hopsSaid = ' It hops up 2.5 to zero, then 1.5 more.';
    } else {
      const s = right ? stepArcs(sc, d.from, 1, F.hops, HOP, w.way) : { went: 0, counted: 0 };
      travelled = s.went;
      if (s.counted) hopsSaid = ' It has stepped ' + stepsSaid(s.counted) + '.';
    }
    if (d.kind === 'more' && right) ring(sc, d.from, arr(F.hops[0]));
    marker(sc, round3(d.from + travelled), 180, 1);
    const done = right ? arr(F.tag) : 0;
    tag(sc, ans, fmt(ans), done);
    const left = fmt(d.from) + ' − ' + br(d.take);
    let sumSaid;
    if (d.kind === 'same') {
      sumAt(left + ' =', d.want + ' = ' + fmt(ans), done);
      sumSaid = done >= 0.5 ? ' ' + cap(say(left + ' = ' + d.want + ' = ' + fmt(ans))) + '.' : ' Below, ' + say(left) + ' equals an empty box.';
    } else {
      sumAt(left + ' =', fmt(ans), done);
      sumSaid = done >= 0.5 ? ' ' + cap(say(left + ' = ' + fmt(ans))) + '.' : ' Below, ' + say(left) + ' equals an empty box.';
    }
    let noteSaid = '';
    if (d.kind === 'more') {
      const nt = right ? arr(F.note) : 0, y = sc.y(ans), wt = Math.max(40, tw(fmt(ans), 'tagt') + 20);
      part(nt, 6, () => text(TAGX + wt + 10, y + 5, 'more than ' + fmt(d.from), 'note', 'start'));
      if (nt >= 0.5) noteSaid = ' Beside it: more than 5. A ring marks 5, where it started.';
    }
    return lineSaid(L) + ' A marker facing down ' + (travelled ? 'started on ' : 'stands on ') + say(fmt(d.from)) + '.' + hopsSaid + ruleSaid([0, 1, 0, hl]) + sumSaid + noteSaid;
  }
  // A change between two readings: a right answer grows the arrow from first to last, names the change, then the gap and the sum.
  function drawChange(d, st, right) {
    const L = LAY[d.lay], sc = scaleOf(L), F = d.at;
    upright(sc, [{ v: d.first }, { v: d.last }]);
    reading(sc, d.first, 1, L.unit); reading(sc, d.last, 1, L.unit);
    ends(sc, d, 1, 1);
    const e = right ? arr(F.arrow[0], F.arrow[1]) : 0, lab = right ? arr(F.label) : 0, g = right && d.gap ? arr(F.gap) : 0, wk = right ? arr(F.work) : 0;
    changeParts(sc, d, e, lab, g, '');
    part(wk, 6, () => { text(334, H - 34, d.workTag, 'note', 'end'); text(334, H - 12, d.work, 'sum', 'end'); });
    boxes.push({ k: 'sum', x: 334 - tw(d.work, 'sum'), y: H - 33, w: tw(d.work, 'sum'), h: 27 });
    const c = changeOf(d.first, d.last), u = L.unit;
    return lineSaid(L) + ' The ' + d.tags[0] + ' reading is ' + say(signedU(d.first, u)) + ' and the ' + d.tags[1] + ' reading is ' + say(signedU(d.last, u)) + '.' +
      (lab >= 0.5 ? ' An arrow points ' + (c < 0 ? 'down' : 'up') + ' from one to the other, labelled change ' + say(signed(c)) + '.' : '') +
      (g >= 0.5 ? ' A bracket beside it, with no direction, is labelled gap ' + gapOf(d.first, d.last) + '.' : '') + (wk >= 0.5 ? ' Last minus first: ' + say(d.work) + '.' : '');
  }
  const signedU = (v, u) => (u === '°C' ? signed(v) : fmt(v)) + ' ' + u;
  // Which sum comes to −4: the target ringed; a right answer brings the marker to −6, facing down,
  // and steps it backwards 2, up into the ring.
  function drawWhich(d, st, right) {
    const L = LAY[d.lay], sc = scaleOf(L), F = d.at, w = takeAway(d.from, d.take);
    upright(sc);
    const mk = right ? arr(F.mk) : 0, hl = right ? arr(F.hl, HL) : 0;
    card([1, 1, 1, 1], [0, mk, 0, hl]);
    ring(sc, d.target, 1);
    const s = right ? stepArcs(sc, d.from, 1, F.hops, HOP, w.way) : { went: 0, counted: 0 }, n = s.counted;
    marker(sc, d.from + s.went, 180, mk);
    const done = right ? arr(F.tag) : 0;
    tag(sc, d.target, fmt(d.target), done);
    sumAt(d.want + ' = ' + fmt(d.target), '', done, true);
    return lineSaid(L) + ' A ring marks minus 4.' + (mk >= 0.5 ? ' A marker facing down stands on minus 6' + (n ? ' and has stepped ' + stepsSaid(n) : '') + '.' : '') +
      ruleSaid([0, mk, 0, hl]) + (done >= 0.5 ? ' It lands in the ring: minus 6 minus negative 2 equals minus 4.' : '');
  }
  // The chain 5 − 3 + (−2) − (−4): a right answer makes each move in turn, an arrow in its own column
  // with the move written by it, while the marker on the line turns to face the move's way (down to
  // take away, up to add) and goes along with it; then the answer's tag.
  function drawChain(d, st, right) {
    const L = LAY[d.lay], sc = scaleOf(L), F = d.at, stops = chainStops(d), faces = d.terms.map((t) => (t.op === M ? 180 : 0));
    upright(sc);
    ring(sc, d.from, 1);
    let m = d.from, made = 0, ang = faces[0];
    d.terms.forEach((t, k) => {
      const a = k ? stops[k - 1] : d.from, b = stops[k], e = right ? arr(F.moves[k][0], F.moves[k][1]) : 0;
      m += (b - a) * e;
      if (e >= 1) made++;
      if (k) ang += (faces[k] - faces[k - 1]) * (right ? arr(F.turns[k - 1][0], F.turns[k - 1][1]) : 0);
      // a faint guide from where the last move ended across to this move's column
      part(Math.min(1, e * 3), 0, () => line('guide', (k ? CHX[k - 1] + 6 : X + TW + 4), sc.y(a), CHX[k] - 6, sc.y(a)));
      arrow(sc, CHX[k], a, b, e);
      const down = b < a, ly = down ? sc.y(a) - 10 : sc.y(a) + 24;
      part(right ? arr(F.labels[k]) : 0, 6, () => text(CHX[k], ly, termText(t), 'hl2'));
    });
    marker(sc, m, ang, 1);
    const done = right ? arr(F.tag) : 0, ans = stops[stops.length - 1];
    tag(sc, ans, fmt(ans), done);
    const sum = fmt(d.from) + ' ' + d.terms.map(termText).join(' ');
    sumAt(sum + ' =', fmt(ans), done);
    const moves = d.terms.slice(0, made).map((t, k) => termSaid(t) + ', ' + ((k ? stops[k - 1] : d.from) < stops[k] ? 'up ' : 'down ') + Math.abs(stops[k] - (k ? stops[k - 1] : d.from)));
    return lineSaid(L) + ' A ring marks 5, where the chain starts, and a marker stands ' + (made ? 'on ' + say(fmt(made ? stops[made - 1] : d.from)) : 'on 5') + ', facing ' + (ang > 90 ? 'down' : 'up') + '.' +
      (made ? ' Arrows show the moves so far: ' + moves.join('; ') + '.' : '') + (done >= 0.5 ? ' ' + cap(say(sum + ' = ' + fmt(ans))) + '.' : ' Below, ' + say(sum) + ' equals an empty box.');
  }
  const termText = (t) => (t.op === M ? '− ' : '+ ') + br(t.n);
  const termSaid = (t) => (t.op === M ? 'take away ' : 'add ') + (t.n < 0 ? 'negative ' : '') + Math.abs(t.n);

  // The scene for a step (the animation calls this every frame).
  function paint(i) {
    if (i == null) i = at();
    const d = STEPS[i], st = S[i], right = st.res === 'right';
    art.textContent = '';
    into = null;
    boxes = [];
    H = (d.lay && LAY[d.lay].H) || H0;
    svg.setAttribute('viewBox', '0 0 340 ' + H);
    let aria;
    if (d.show) aria = { back: demoBack, opp: demoOpp, gap: demoGap }[d.demo]();
    else aria = { walk: drawWalk, take: drawTake, same: drawTake, more: drawTake, change: drawChange, which: drawWhich, chain: drawChain }[d.kind](d, st, right);
    svg.setAttribute('aria-label', aria);
  }

  const el = (id) => document.getElementById(id);
  write(el('finish'), FINISH);
  K.update((p) => {
    const i = Math.round(p.step), d = STEPS[i], st = S[i];
    if (!anim.playing()) { T = Infinity; if (motion === 'walk') settle(st); }   // motion that was stopped (the page hidden, a test) shows finished
    if (i !== lastStep) { lastStep = i; enter('stepbox'); settle(S[i]); if (d.show) play(d.dur, 'demo'); else { anim.pause(); T = Infinity; motion = null; } }
    if (finished !== lastDone) { lastDone = finished; enter(finished ? 'done' : 'stepbox'); }
    const right = st.res === 'right';
    el('stepbox').hidden = finished;
    el('done').hidden = !finished;
    el('count').textContent = 'Step ' + (i + 1) + ' of ' + STEPS.length;
    const task = el('task');
    task.className = 'task' + (d.show ? ' show' : '');
    write(task, d.show ? d.text : d.task);
    paint(i);

    el('replay').hidden = !d.show || REDUCE;
    el('walk').hidden = d.kind !== 'walk' || right;
    if (d.kind === 'walk') {
      const n = pendingN(st);
      turnBtn.setLabel(n !== 0 ? 'Start again' : 'Turn round');
      turnBtn.el.setAttribute('aria-label', n !== 0 ? 'Start again: the marker back on 3, still facing ' + (st.down ? 'down' : 'up') : 'Turn the marker round');
    }
    const opts = d.show ? [] : d.opts || [];
    el('picks').hidden = !opts.length;
    el('picks').className = 'row picks' + (d.wrap === 'fit' ? ' fit' : d.wrap ? ' wrap' : '');
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      write(b.el, opts[k]);
      b.el.setAttribute('aria-label', say(opts[k]));
      b.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });

    el('acts').hidden = !!d.show;
    checkBtn.el.hidden = right;
    const fb = el('fb');
    fb.hidden = !!d.show;
    fb.className = 'fb' + (right ? ' right' : st.res === 'wrong' ? ' wrong' : '');
    write(fb, d.show ? '' : right ? 'That\'s it.' : st.res === 'wrong' ? hintFor(i, st) : st.res === 'empty' ? emptyFor(i, st) || PICK : st.res === 'end' ? END : '');

    const why = el('why');
    why.hidden = d.show || !st.why;
    write(why, d.show ? '' : d.why);
    whyBtn.setLabel(st.why ? 'Hide why' : 'Why?');

    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !right);
    nextBtn.setLabel(i === STEPS.length - 1 ? 'Finish' : 'Continue');
    nav.hidden = backBtn.el.hidden && nextBtn.el.hidden;
  });

  // ---------- known answers, worked out by hand ----------
  const DO = STEPS.map((d, i) => i).filter((i) => !STEPS[i].show);
  const WALK_I = STEPS.findIndex((d) => d.kind === 'walk');
  const pickRight = (i, v) => isRight(i, Object.assign(solved(i), { pick: v, res: null }));
  // The one option a step accepts: the only one equal to the answer the rule gives.
  function onlyRight(i) {
    const d = STEPS[i], ans = answerOf(d);
    if (d.kind === 'walk') return true;
    const ok = typeof ans === 'number' ? d.opts.filter((o) => same(value(o), ans)) : d.opts.filter((o) => o === ans);
    return ok.join() === d.want && d.opts.every((o) => pickRight(i, o) === (o === d.want));
  }
  const bothWays = (a, b, u) => { const t = takeAway(a, b, u), o = addOpposite(a, b, u); return same(t.at, o.at) && same(t.at, a - b) && t.steps === o.steps; };
  K.check('Taking away a negative steps the marker backwards, up the line, and lands where adding its opposite does: 1 − (−3) = 4, 3 − (−2) = 5, 0 − (−5) = 5, 2 − (−6) = 8, 5 − (−2) = 7, −6 − (−2) = −4, and −2.5 − (−4) = 1.5 in steps of 0.5; each puzzle accepts only its answer', () =>
    takeAway(1, -3).at === 4 && takeAway(3, -2).at === 5 && takeAway(0, -5).at === 5 && takeAway(2, -6).at === 8 && takeAway(5, -2).at === 7 && takeAway(-6, -2).at === -4 &&
    same(takeAway(-2.5, -4, 0.5).at, 1.5) && takeAway(-2.5, -4, 0.5).steps === 8 &&
    [[1, -3], [3, -2], [0, -5], [2, -6], [5, -2], [-6, -2]].every((p) => bothWays(p[0], p[1]) && takeAway(p[0], p[1]).way === 1) && bothWays(-2.5, -4, 0.5) &&
    DO.every(onlyRight));
  K.check('Taking away something negative takes you up the number line, just as adding something positive does: every such sum in the lesson lands above where it starts', () =>
    STEPS.filter((d) => d.take < 0).every((d) => takeAway(d.from, d.take, d.unit).at > d.from && addOpposite(d.from, d.take, d.unit).at > d.from) &&
    takeAway(AT.back.from, AT.back.take).at > AT.back.from && takeAway(AT.opp.from, -AT.opp.n).at > AT.opp.from, { source: NRICH });
  K.check('Taking away makes a number smaller only when what you take away is positive: 5 − 2 = 3 is less than 5, 5 − 0 = 5 is the same, 5 − (−2) = 7 is more; and of 2 + 6, 2 − 6 and −2 + 6 only 2 + 6 equals 2 − (−6)', () =>
    takeAway(5, 2).at === 3 && takeAway(5, 0).at === 5 && takeAway(5, -2).at === 7 && answerOf(STEPS[5]) === 'More' &&
    sumValue('2 + 6') === 8 && sumValue('2 − 6') === -4 && sumValue('−2 + 6') === 4 && answerOf(STEPS[4]) === '2 + 6' &&
    sumValue('−6 − 2') === -8 && sumValue('6 − (−2)') === 8 && answerOf(STEPS[9]) === '−6 − (−2)');
  K.check('A change is last minus first: −20 °C up to +4 °C is 4 − (−20) = +24, the same as the 24-degree gap; −7 °C to +5 °C is 5 − (−7) = +12 with a gap of 12; counted along the line, each rise comes out positive', () =>
    changeOf(-20, 4) === 24 && gapOf(-20, 4) === 24 && counted(-20, 4) === 24 && changeOf(-7, 5) === 12 && gapOf(-7, 5) === 12 && counted(-7, 5) === changeOf(-7, 5) &&
    AT.gap.first === -20 && AT.gap.last === 4 && STEPS[7].first === -7 && STEPS[7].last === 5);
  const REEF = STEPS.find((d) => d.lay === 'reefer');
  K.check('The cargo temperature at loading was around −5 °C, the first reading on the reefer screen', () => REEF.first === -5 && /around −5 °C/.test(REEF.task), { source: REEFER });
  K.check('The core of the stow did not reach the −18 °C set point until over 3 days later: from −5 °C that is a change of −18 − (−5) = −13, a fall, counted 13 steps down the line', () =>
    REEF.last === -18 && /over 3 days/.test(REEF.task) && changeOf(-5, -18) === -13 && counted(-5, -18) === -13 && answerOf(REEF) === -13, { source: REEFER });
  K.check('Reefer containers are built to maintain temperatures, not to lower them, so cargo should be pre-cooled: the reefer screen\'s Why? says a reefer is built to hold a temperature, not to lower it, and calls the 13-degree fall still to come about 13 degrees too warm', () =>
    /not to lower it/.test(REEF.why) && /about 13 degrees too warm/.test(REEF.why), { source: SKULD });
  K.check('The chain 5 − 3 + (−2) − (−4), worked left to right, stops at 2, then 0, then 4: taking away 3 and adding −2 go down, taking away −4 goes up', () => {
    const d = STEPS[11], s = chainStops(d);
    return s.join() === '2,0,4' && walk(5, M, 3).way === -1 && walk(2, '+', -2).way === -1 && walk(0, M, -4).way === 1 && answerOf(d) === 4 && 5 - 3 + (-2) - (-4) === 4;
  });
  K.check('Using the marker for 3 − (−2) is accepted only facing down after exactly 2 steps backwards, which land on 5; facing down, 2 steps forwards land on 1 and get the backwards hint; facing up, 2 steps forwards also land on 5 but are 3 + 2 and are not accepted; one step short is told to count the hops; the marker never leaves the line', () => {
    const d = STEPS[WALK_I], st = (down, n) => Object.assign(blank(WALK_I), { down: down, n: n });
    return isRight(WALK_I, st(true, -2)) && walkAt(d, st(true, -2)) === 5 && !isRight(WALK_I, st(true, 2)) && walkAt(d, st(true, 2)) === 1 && hintFor(WALK_I, st(true, 2)) === d.fwd &&
      !isRight(WALK_I, st(false, 2)) && walkAt(d, st(false, 2)) === 5 && hintFor(WALK_I, st(false, 2)) === d.upSame && hintFor(WALK_I, st(false, -2)) === d.up &&
      /count the hops/i.test(hintFor(WALK_I, st(true, -1))) && !isRight(WALK_I, st(true, -3)) && isEmpty(WALK_I, blank(WALK_I)) && hintFor(WALK_I, st(true, 0)) === d.none &&
      canStep(d, true, -4, -1) === false && walkAt(d, st(true, -4)) === LAY[d.lay].top && canStep(d, true, 6, 1) === false && walkAt(d, st(true, 6)) === LAY[d.lay].bot;
  });
  // Drawn from the lesson's own timetable: each screen is painted finished and every arrival it used is noted.
  K.check('Every demonstration has finished arriving within 4.5 s of its screen opening, none starting before the 0.35 s screen fade ends; every answer\'s motion within 2.5 s; hops along the line start at least 0.2 s apart; and no answer tag touches the rule card or the sum', () => {
    const keepT = T, overlap = (a, b) => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
    const ok = STEPS.every((d, i) => {
      const keepS = S[i];
      T = Infinity; latest = 0; earliest = Infinity;
      if (!d.show) S[i] = solved(i);
      try { paint(i); } finally { S[i] = keepS; }
      const tags = boxes.filter((b) => b.k === 'tag'), others = boxes.filter((b) => b.k !== 'tag');
      const clear = d.demo === 'opp' || tags.every((t) => others.every((o) => !overlap(t, o)));
      return clear && (d.show ? latest <= d.dur && d.dur <= 4.5 && earliest >= FADE : latest <= d.fb && d.fb <= 2.5);
    });
    T = keepT; paint();
    const runs = [AT.back.hops, AT.opp.hopsA, AT.opp.hopsB].concat(STEPS.filter((d) => d.at && (d.at.hops || d.at.big)).map((d) => d.at.hops || d.at.big.map((h) => h.t)));
    return ok && runs.every((ts) => ts.every((t, k) => k === 0 || t - ts[k - 1] >= 0.2 - 1e-9));
  });

  K.ready();
</script>
