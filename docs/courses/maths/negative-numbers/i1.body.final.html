<script>
  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // dur: how long a demonstration plays; fb: how long the motion after a right answer plays (seconds).
  // lay: which upright line a step draws (LAY below). A drag step's tags each start at 0 and are slid
  // to their places (lane: the x of each tag); a tap step marks a place on the line; a pick step
  // takes one answer; an order step takes every answer, tapped in order.
  const PICK = 'Tap one of the answers.', EMPTY_LINE = 'Tap the line to place a mark.', EMPTY_ORDER = 'Tap all four, smallest first.';
  const STEPS = [
    { show: true, demo: 'down', dur: 4.4, name: 'Below zero',
      text: 'Reefer cargo claims have come from mixing up plus and minus temperatures. On a thermometer, count down past 0 and the numbers keep going. Below zero are the *negative numbers*.' },
    { kind: 'drag', draw: 'find', lay: 'down', lane: [170], fb: 1.8, name: 'Find −3',
      tags: [{ label: '−3', want: -3, hint: 'Not quite. Start at 0 and count 3 steps down.', above: 'Not quite. That is 3 above zero. −3 is 3 steps below it.' }],
      at: { fill: 0.15, hops: [0.15, 0.45, 0.75], note: 1.15 },
      task: 'Where does −3 go? Slide it to its place on the line.',
      empty: 'Slide the −3 tag to its place first.',
      why: '−3 means 3 below zero. Start at 0 and count 3 steps down, to −1, −2 and then −3.' },
    { show: true, demo: 'bigger', dur: 4.2, name: 'Higher is bigger',
      text: 'On the line, higher up is bigger. −2 sits above −7, so −2 is bigger. The bigger the number after the minus, the further below zero it sits.' },
    { kind: 'drag', draw: 'warm', lay: 'warm', lane: [151, 236], opts: ['−5 °C', '−18 °C'], want: '−5 °C', ask: 'Which is warmer?', fb: 1.4, name: 'Which is warmer?',
      tags: [{ label: '−5 °C', want: -5, hint: 'Not quite. −5 °C is 5 steps below zero.', above: 'Not quite. −5 °C is below zero, not above it.',
        near: 'Nearly. −5 °C is on the tick numbered −5.' },
        { label: '−18 °C', want: -18, hint: 'Not quite. Count down from 0. −18 °C is 3 steps below −15.', near: 'Nearly. Count the small ticks. −18 °C is 3 below −15.' }],
      at: { fill: 0.15, arw: 0.15, note: 0.6 },
      task: 'Slide both into place, then tap the warmer.',
      empty: 'Slide both readings to their places first.', emptyPick: 'Now tap the warmer reading.',
      why: 'Higher up the thermometer is warmer. −5 °C is 5 below zero and −18 °C is 18 below, so −18 °C sits much lower and −5 °C is warmer.',
      hint: 'Not quite. Higher is warmer. −5 °C sits above −18 °C.' },
    { show: true, demo: 'parts', dur: 3.6, name: 'Between whole numbers',
      text: 'Fractions and decimals go below zero too. −1/2 sits halfway from 0 down to −1. −1.5 sits halfway from −1 down to −2.' },
    { kind: 'tap', draw: 'quarters', lay: 'quarters', want: 3, fb: 1.9, name: 'Find −3/4',
      at: { hops: [0.15, 0.45, 0.75], tag: 1.15 },
      task: 'In Fractions you put 3/4 on a line. Now tap where −3/4 goes.',
      why: 'Below zero, count quarters down from 0. Three quarter-steps down land on −3/4, one quarter short of −1.',
      hint: 'Not quite. Count quarter-steps down from 0.',
      marks: { 0: 'Not quite. That is 0 itself. −3/4 is three quarter-steps below it.', 1: 'Not quite. That is one quarter-step below zero. Go two more.',
        2: 'Not quite. That is halfway, −1/2. −3/4 is one quarter-step further down.', 4: 'Not quite. That is −1. −3/4 is one quarter-step above it.' } },
    { show: true, demo: 'gauge', dur: 3.5, name: 'Where zero is',
      text: 'Zero is not always nothing. Many pressure gauges read 0 at the pressure of the air around them. A gauge made to read below that shows a negative reading, like −0.6 bar.' },
    { kind: 'pick', draw: 'gauge', lay: 'gauge', read: -0.3, unit: 'bar', opts: ['0.3', '−0.3', '−0.7'], want: '−0.3', fb: 2.3, name: 'Read the gauge',
      at: { hops: [0.15, 0.45, 0.75], count: 1.1, answer: 1.6 },
      task: 'What does this gauge read, in bar?',
      why: 'Five small steps go from 0 down to −0.5, so each is 0.1 bar. The marker is 3 steps below 0, so it reads −0.3 bar.',
      hint: 'Not quite. Count the small steps down from 0.',
      hints: { '0.3': 'Not quite. The marker is below zero, so the reading is negative.', '−0.7': 'Not quite. That counts from the wrong end. Count the small steps down from 0.' } },
    { show: true, demo: 'meter', dur: 4.2, name: 'The other way',
      text: 'A minus can also mean the other way. Swap a meter\'s leads on 12.0 V DC and it reads −12.0 V. 12 and −12 are *opposites*, the same distance either side of zero.' },
    { kind: 'pick', draw: 'meter', lay: 'meter', words: true, opts: ['Leads swapped', 'A fault'], want: 'Leads swapped', fb: 2.3, name: 'A minus on the meter',
      at: { swap: 0.15, pos: 0.7, brk: 1.2, opp: 1.6 },
      task: 'Your meter reads −12.0 V across a battery. Why the minus?',
      why: 'On DC, a meter shows a minus when its leads are the other way round. Swap them back and it reads 12.0 V, the opposite of −12.0 V.',
      hint: 'Not quite. Here a minus means the other way round, not a fault.' },
    { kind: 'pick', draw: 'rooms', lay: 'rooms', opts: ['−12 °C', '−18 °C', '−29 °C'], want: '−12 °C', fb: 1.7, name: 'Least cold',
      at: { fill: 0.15, arw: 0.15, note: 0.6, cold: 0.9 },
      task: 'Which of these cold rooms is the least cold?',
      why: 'Least cold means the warmest. On the thermometer that is the one nearest the top, −12 °C. −29 °C sits lowest, so it is the coldest.',
      hint: 'Not quite. Least cold means warmest, the one nearest the top.',
      hints: { '−29 °C': 'Not quite. −29 °C is the coldest. Least cold means warmest.', '−18 °C': 'Not quite. −12 °C sits higher, so it is warmer still.' } },
    { kind: 'order', draw: 'order', lay: 'order', opts: ['1', '−0.5', '−2', '−3/4'], want: ['−2', '−3/4', '−0.5', '1'], fb: 2.3, name: 'Smallest to biggest',
      at: { marks: [0.15, 0.65, 1.15, 1.65] },
      task: 'Tap these from smallest to biggest.',
      why: 'Smallest is lowest on the line. −2 is lowest, then −3/4, then −0.5, which is −1/2. 1 is above zero, so it is the biggest.',
      hint: 'Not quite. Smallest is lowest on the line.' },
  ];
  const FINISH = 'Higher up is bigger, so the further below zero a number sits, the smaller it is. A minus can also mean the other way round.';
  // When each demonstration's parts arrive, in seconds after the screen opens (the screen itself
  // takes FADE to fade in, so nothing starts before it has settled). HOP: how long one hop takes.
  const FADE = 0.35, HOP = 0.3;
  const AT = {
    // a marker at 1 counts down past 0 to −5, one hop at a time; each number below zero arrives as it
    // lands; then the bracket, then its note, about 0.55 s apart
    down: { from: 1, dot: 0.5, hops: [0.95, 1.25, 1.55, 1.85, 2.15, 2.45], brk: 3.2, note: 3.75 },
    // up is bigger; −2 and −7 are placed; then how far below zero each sits
    bigger: { big: 0.5, a: 1.3, b: 1.9, brA: 2.6, brB: 3.1 },
    // half a step down from 0, then half a step down from −1
    parts: { h1: 0.5, t1: 1.1, h2: 2.0, t2: 2.6 },
    // zero is the air around it; the reading hops down below it
    gauge: { air: 0.5, hop: 1.2, tag: 1.9, below: 2.6 },
    // 12.0 V; the leads swap and it reads −12.0 V; both are 12 from zero
    meter: { on: 0.5, swap: 1.3, neg: 2.0, brk: 2.6, opp: 3.4 },
  };
  // A meter's reading changing: the old one fades out (SWAP seconds) before the new one rises in.
  const SWAP = 0.3, SWAP_GAP = 0.05;
  // An answer's tag filling in: a quick crossfade (FILL seconds), so its label is only briefly
  // between its two colours.
  const FILL = 0.3;
  // Drawing sizes, in viewBox units (340 wide). The line runs up x = X inside a tube TW either side
  // of it, its numbers ending at LX. Each line: values top..bot drawn from y0 down to y1, a tick
  // every `minor`, a longer one every `mid`, a number every `every`; `bulb` for a thermometer.
  const X = 112, TW = 9, LX = 91;
  const LAY = {
    down: { top: 5, bot: -5, y0: 40, y1: 250, minor: 1, every: 1, unit: '°C', bulb: true, H: 292 },
    bigger: { top: 2, bot: -10, y0: 26, y1: 266, minor: 1, every: 2, H: 282 },
    warm: { top: 5, bot: -20, y0: 34, y1: 228, minor: 1, every: 5, unit: '°C', bulb: true, H: 264 },
    parts: { top: 1, bot: -2, y0: 26, y1: 262, minor: 0.25, mid: 0.5, every: 1, H: 280 },
    quarters: { top: 0, bot: -1, y0: 40, y1: 256, minor: 0.25, mid: 0.5, every: 1, H: 276 },
    gauge: { top: 1, bot: -1, y0: 40, y1: 262, minor: 0.1, mid: 0.5, every: 0.5, unit: 'bar', H: 282 },
    meter: { top: 15, bot: -15, y0: 66, y1: 222, minor: 1, every: 5, unit: 'V', H: 238 },
    rooms: { top: 5, bot: -30, y0: 34, y1: 226, minor: 1, every: 5, unit: '°C', bulb: true, H: 262 },
    order: { top: 1.25, bot: -2.25, y0: 26, y1: 262, minor: 0.25, mid: 0.5, every: 1, H: 280 },
  };
  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  // While the kit's self-test looks at every screen it switches fades off (the k-testing class):
  // demonstrations then open finished, as they do with reduced motion.
  const testing = () => document.documentElement.classList.contains('k-testing');

  // ---------- numbers (pure, so the checks can test them) ----------
  const same = (a, b) => K.near(a, b, 1e-9);
  const round3 = (v) => Math.round(v * 1000) / 1000;
  // '−3/4' -> −0.75, '−0.3 bar' -> −0.3, '12.0 V' -> 12; words -> NaN.
  function value(s) {
    const t = String(s).replace(/−/g, '-').replace(/\s*(°C|bar|V)$/, '').trim(), f = /^(-?)(\d+)\/(\d+)$/.exec(t);
    if (f) return (f[1] ? -1 : 1) * Number(f[2]) / Number(f[3]);
    return /^-?\d+(\.\d+)?$/.test(t) ? Number(t) : NaN;
  }
  // As Dan reads it: a proper minus sign; and as a screen reader says it.
  const fmt = (v) => (v < 0 ? '−' : '') + String(round3(Math.abs(v)));
  const say = (s) => String(s).replace(/−/g, 'minus ').replace(/°C/g, 'degrees');
  // A line's scale: where value v sits (y), and the value at a height (v).
  function scaleOf(L) {
    const k = (L.y1 - L.y0) / (L.top - L.bot);
    return { L: L, top: L.top, bot: L.bot, k: k, y: (v) => L.y0 + (L.top - v) * k, v: (y) => L.top - (y - L.y0) / k };
  }
  // A slid tag lands on the nearest tick and never leaves the line.
  const snap = (L, v) => round3(K.clamp(Math.round(v / L.minor) * L.minor, L.bot, L.top));
  const isMult = (v, s) => Math.abs(v / s - Math.round(v / s)) < 1e-6;
  // The value of a tapped mark on the quarters line: mark k is k quarter-steps below 0.
  const markValue = (k) => -k / 4;

  function blank(i) {
    const d = STEPS[i], n = d.tags ? d.tags.length : 0;
    return { at: new Array(n).fill(0), moved: new Array(n).fill(false), sel: 0, mark: null, order: [], pick: null, res: null, why: false };
  }
  // Nothing to check yet: says what to do first ('' when there is something to check).
  function emptyFor(i, st) {
    const d = STEPS[i];
    if (d.kind === 'drag') {
      if (!st.moved.every(Boolean)) return d.empty;
      // the answer is asked for only once every tag is in its place: a misplaced tag is checked first
      if (d.opts && st.pick == null) return d.tags.every((t, k) => same(st.at[k], t.want)) ? d.emptyPick : '';
      return '';
    }
    if (d.kind === 'tap') return st.mark == null ? EMPTY_LINE : '';
    if (d.kind === 'order') return st.order.length < d.opts.length ? EMPTY_ORDER : '';
    return st.pick == null ? PICK : '';
  }
  const isEmpty = (i, st) => !!emptyFor(i, st);
  function isRight(i, st) {
    const d = STEPS[i];
    if (isEmpty(i, st)) return false;
    if (d.kind === 'drag') return d.tags.every((t, k) => same(st.at[k], t.want)) && (!d.opts || (st.pick != null && st.pick === d.want));
    if (d.kind === 'tap') return st.mark === d.want;
    if (d.kind === 'order') return st.order.join('|') === d.want.join('|');
    return st.pick === d.want;
  }
  // A wrong answer's hint names its slip.
  function hintFor(i, st) {
    const d = STEPS[i];
    if (d.kind === 'drag') {
      // the first misplaced tag: on the wrong side of zero, one step out, or further
      for (let k = 0; k < d.tags.length; k++) {
        const t = d.tags[k];
        if (same(st.at[k], t.want)) continue;
        if (t.above && same(st.at[k], -t.want)) return t.above;
        return t.near && Math.abs(st.at[k] - t.want) <= LAY[d.lay].minor + 1e-9 ? t.near : t.hint;
      }
      return d.hint;
    }
    if (d.kind === 'tap') return (d.marks && d.marks[st.mark]) || d.hint;
    if (d.kind === 'order') {
      const o = st.order, w = d.want;
      if (o[0] !== w[0]) return 'Not quite. Smallest is lowest on the line, and −2 sits furthest below zero.';
      if (o[o.length - 1] !== w[w.length - 1]) return 'Not quite. 1 is the only one above zero, so it is the biggest.';
      return 'Not quite. −3/4 is further below zero than −0.5, which is −1/2. So −3/4 is smaller.';
    }
    return (d.hints && d.hints[st.pick]) || d.hint;
  }
  // A step answered right (the timing check draws each one this way).
  function solved(i) {
    const d = STEPS[i], st = blank(i);
    if (d.tags) { st.at = d.tags.map((t) => t.want); st.moved = d.tags.map(() => true); }
    if (d.kind === 'tap') st.mark = d.want;
    if (d.kind === 'order') st.order = d.want.slice();
    else if (d.opts) st.pick = d.want;
    st.res = 'right';
    return st;
  }

  let S = STEPS.map((d, i) => blank(i));
  let finished = false, lastStep = -1, lastDone = false, T = Infinity;   // T: seconds into the current demonstration, or since Check

  // ---------- text with stacked fractions and amber key terms (built with K.el, never innerHTML) ----------
  function frac(t, b) {
    return K.el('span', { class: 'fr', role: 'img', 'aria-label': t + '/' + b },
      K.el('span', { class: 'n', 'aria-hidden': 'true' }, t), K.el('span', { class: 'd', 'aria-hidden': 'true' }, b));
  }
  // Plain text with its fractions and *key terms* drawn in.
  function pieces(el, text) {
    const re = /\*([^*]+)\*|(\d+)\/(\d+)/g;
    let at = 0, m;
    while ((m = re.exec(text))) {
      if (m.index > at) el.appendChild(document.createTextNode(text.slice(at, m.index)));
      let node = m[1] ? K.el('span', { class: 'term' }, m[1]) : frac(m[2], m[3]);
      at = m.index + m[0].length;
      // A full stop or comma after a fraction stays on its line.
      const stop = !m[1] && /^[.,?!;]/.test(text.slice(at)) ? text[at] : '';
      if (stop) { node = K.el('span', { class: 'nw' }, node, stop); at++; re.lastIndex = at; }
      el.appendChild(node);
    }
    if (at < text.length) el.appendChild(document.createTextNode(text.slice(at)));
  }
  // A number with its minus, a fraction, or a reading with its unit ("−0.3 bar", "−18 °C") stays
  // together on one line, with the full stop after it.
  const GLUE = /−?\d+(?:\.\d+)?(?:\/\d+)?(?: (?:°C|bar|V)(?![A-Za-z]))?[.,?!;]?/g;
  function write(el, text) {
    el.textContent = '';
    let at = 0, m;
    GLUE.lastIndex = 0;
    while ((m = GLUE.exec(text))) {
      if (m.index > at) pieces(el, text.slice(at, m.index));
      if (/[ −\/]/.test(m[0])) { const box = el.appendChild(K.el('span', { class: 'nw' })); pieces(box, m[0]); }
      else pieces(el, m[0]);
      at = m.index + m[0].length;
    }
    if (at < text.length) pieces(el, text.slice(at));
  }

  // ---------- controls ----------
  const stepper = K.stepper({ id: 'step', label: 'Step', steps: STEPS.map((d) => d.name), value: 0, compact: true, into: '#prog' });
  const nav = document.getElementById('nav');
  const at = () => stepper.get();

  // Up to four answer buttons; each step fills in its own options. On the order step a tap adds the
  // answer to the order, and a second tap takes it out again; after a wrong order, a tap starts a new one.
  const pickBtns = [0, 1, 2, 3].map((k) => K.button({ label: 'Answer ' + (k + 1), secondary: true, into: '#picks', press: () => {
    const i = at(), d = STEPS[i], st = S[i];
    if (finished || d.show || !d.opts || k >= d.opts.length || st.res === 'right') return;
    if (d.kind === 'order') {
      const o = d.opts[k], j = st.order.indexOf(o);
      if (st.res === 'wrong') st.order = [o];
      else if (j >= 0) st.order.splice(j, 1); else st.order.push(o);
    } else st.pick = d.opts[k];
    st.res = null;
  } }));
  // Under a line with tags: move the chosen tag (the one last touched) one step up or down, so a
  // thumb that lands a tick out can set it exactly, and a keyboard can do it all.
  function nudge(i, k, dir) {
    const d = STEPS[i], st = S[i], L = LAY[d.lay];
    if (finished || d.kind !== 'drag' || st.res === 'right' || k == null || k >= d.tags.length) return;
    st.at[k] = snap(L, st.at[k] + dir * L.minor); st.moved[k] = true; st.sel = k; st.res = null;
    K.reveal();
  }
  const nudgeBtns = [1, -1].map((dir) => K.button({ label: dir > 0 ? 'Up one' : 'Down one', secondary: true, into: '#nudge', press: () => nudge(at(), S[at()].sel, dir) }));
  const checkBtn = K.button({ label: 'Check', into: '#acts', press: () => {
    const i = at(), d = STEPS[i], st = S[i];
    if (d.show || finished) return;
    if (isEmpty(i, st)) { st.res = 'empty'; return; }
    st.res = isRight(i, st) ? 'right' : 'wrong';
    // A right answer plays its picture's motion.
    if (st.res === 'right') play();
  } });
  const whyBtn = K.button({ label: 'Why?', secondary: true, into: '#acts', press: () => {
    if (STEPS[at()].show || finished) return;
    const st = S[at()]; st.why = !st.why;
  } });
  const replayBtn = K.button({ label: 'Play again', secondary: true, into: '#replay', press: () => {
    if (!STEPS[at()].show || finished) return;
    play();
  } });
  const backBtn = K.button({ label: 'Back', secondary: true, into: '#nav', press: () => {
    if (finished) { finished = false; return; }
    stepper.set(Math.max(0, at() - 1), true);
  } });
  const nextBtn = K.button({ label: 'Continue', into: '#nav', press: () => {
    const i = at();
    if (finished || (!STEPS[i].show && S[i].res !== 'right')) return;
    if (i < STEPS.length - 1) { stepper.set(i + 1, true); return; }
    finished = true;
    if (typeof K.complete === 'function') K.complete();
  } });
  const againBtn = K.button({ label: 'Start again', secondary: true, into: '#again', press: () => {
    S = STEPS.map((d, i) => blank(i)); finished = false; lastStep = -1; stepper.set(0, true);
  } });

  // One animation plays each demonstration, and the motion after a right answer, from its start;
  // with reduced motion (and while the self-test looks) it opens finished.
  const anim = K.anim({ button: false, label: 'Demonstration', step: (dt) => {
    const d = STEPS[at()];
    if (finished) return false;
    T += dt;
    paint();
    return T < (d.show ? d.dur : d.fb || 0);
  } });
  // The kit pauses the motion while the page is hidden (Dan switches app or locks the phone) and
  // resumes it when he comes back; this only settles a motion that had already stopped.
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !anim.playing() && T !== Infinity) { T = Infinity; paint(); } });
  function play() {
    if (REDUCE || testing()) { T = Infinity; anim.pause(); return; }
    T = 0; anim.play();
  }
  // A new screen (or the finish panel) fades in softly: the CSS animation restarts on it.
  function enter(id) {
    if (REDUCE) return;
    const box = document.getElementById(id);
    box.classList.remove('enter');
    void box.offsetWidth;
    box.classList.add('enter');
  }

  // ---------- drawing ----------
  // The scene has two layers: the picture, redrawn every frame, and above it the places Dan
  // touches (tags to slide, marks to tap), kept from frame to frame so a finger or the keyboard
  // stays on them while the picture changes.
  const svg = document.getElementById('scene');
  const art = svg.appendChild(K.svg('g'));
  const hits = svg.appendChild(K.svg('g'));
  let into = null;                                   // where shapes go: the picture, or a part that is arriving
  const add = (node) => (into || art).appendChild(node);
  // How far a part due at t0 has arrived (K.arrive), noting the timetable for the timing check.
  let latest = 0, earliest = Infinity;
  function arr(t0, d) {
    d = d == null ? K.SOFT : d;
    if (t0 + d > latest) latest = t0 + d;
    if (t0 < earliest) earliest = t0;
    return K.arrive(T, t0, d);
  }
  // A part arriving: drawn into a group faded in to a and risen `rise` units into place; nothing before it starts.
  function part(a, rise, draw) {
    if (a <= 0) return;
    const g = add(K.svg('g'));
    K.fade(g, a, rise);
    const keep = into; into = g; draw(); into = keep;
  }
  // A part leaving (a slot giving way to its answer): faded out as a goes 0 -> 1.
  function leave(a, draw) {
    if (a >= 1) return;
    const g = add(K.svg('g'));
    K.fade(g, 1 - a, 0);
    const keep = into; into = g; draw(); into = keep;
  }
  const rect = (cls, x, y, w, h, rx) => add(K.svg('rect', { class: cls, x: x, y: y, width: w, height: h, rx: rx || 0 }));
  const line = (cls, x1, y1, x2, y2) => add(K.svg('line', { class: cls, x1: x1, y1: y1, x2: x2, y2: y2 }));
  const text = (x, y, s, cls, anchor) => add(K.svg('text', { class: cls, x: x, y: y, 'text-anchor': anchor || 'middle' }, String(s)));
  const pathOf = (cls, d) => add(K.svg('path', { class: cls, d: d }));
  // A stroke grown as far as e (0..1) along its own length.
  function grown(cls, d, e) {
    if (e <= 0) return;
    const attrs = { class: cls, d: d };
    if (e < 1) { attrs.pathLength = 1; attrs['stroke-dasharray'] = '1 1'; attrs['stroke-dashoffset'] = (1 - e).toFixed(3); }
    add(K.svg('path', attrs));
  }
  // The width of a line of text (measured once it can be; estimated while the scene is hidden).
  const widths = {};
  function tw(s, cls) {
    const key = cls + '|' + s;
    if (widths[key]) return widths[key];
    const t = svg.appendChild(K.svg('text', { class: cls, x: 0, y: -50 }, String(s)));
    let w = 0;
    try { w = t.getComputedTextLength(); } catch (e) { w = 0; }
    svg.removeChild(t);
    if (w > 0) { widths[key] = w; return w; }
    return String(s).length * 15 * 0.6;
  }

  // The upright line: a tube (with a bulb for a thermometer), the line up its middle, a tick at every
  // step, longer at every `mid` and `every`, the longest at 0; numbers at every `every`, 0 the largest.
  // labelIn(v): how far the number at v has arrived (all there unless given).
  function upright(sc, labelIn) {
    const L = sc.L, yT = L.y0 - 12, yB = L.y1 + 6;
    if (L.bulb) pathOf('tube', 'M' + (X - TW) + ' ' + (yT + TW) + ' A' + TW + ' ' + TW + ' 0 0 1 ' + (X + TW) + ' ' + (yT + TW) + ' V' + yB +
      ' A15 15 0 1 1 ' + (X - TW) + ' ' + yB + ' Z');
    else rect('tube', X - TW, yT, 2 * TW, yB + 6 - yT, TW);
    line('axis', X, L.y0 - 4, X, L.y1 + 4);
    const n = Math.round((L.top - L.bot) / L.minor);
    for (let j = 0; j <= n; j++) {
      const v = round3(L.top - j * L.minor), y = sc.y(v), z = same(v, 0), big = isMult(v, L.every), mid = L.mid && isMult(v, L.mid);
      const h = z ? 14 : big ? 8 : mid ? 6 : 4;
      line('tick' + (z || big ? '' : ' m'), X - h, y, X + h, y);
      if (z || big) { const a = labelIn ? labelIn(v) : 1; part(a, 6, () => text(LX, y + (z ? 6.5 : 5.5), fmt(v), z ? 'zero' : 'num', 'end')); }
    }
    if (L.unit) text(LX, L.y0 - 20, L.unit, 'unit', 'end');
  }
  const dot = (sc, v, a) => part(a, 0, () => add(K.svg('circle', { class: 'dot', cx: X, cy: sc.y(v), r: 7 })));
  // A tag's text: plain, or a minus and a stacked fraction ('−3/4').
  const fracOf = (s) => /^(−?)(\d+)\/(\d+)$/.exec(s);
  const tagW = (s) => (fracOf(s) ? 50 : Math.max(40, tw(s, 'tagt') + 20));
  const tagH = (s) => (fracOf(s) ? 46 : 30);
  function tagLabel(cx, cy, s, on) {
    const cls = 'tagt k-nohalo' + (on ? ' on' : ''), f = fracOf(s);
    if (!f) { text(cx, cy + 5.5, s, cls); return; }
    const fx = cx + (f[1] ? 5 : 0);
    if (f[1]) text(cx - 9, cy + 3, '−', cls);
    text(fx, cy - 6, f[2], cls);
    line('tbar' + (on ? ' on' : ''), fx - 8, cy - 1, fx + 8, cy - 1);
    text(fx, cy + 15, f[3], cls);
  }
  // A reading's tag at x (its left edge), joined by a leader to v on the line, risen in as a goes 0 -> 1.
  // cls: 'on' (the answer, filled in) or 'sel' (the tag the Up and Down buttons move). behind: the
  // boxes of tags nearer the line ({x1, x2, y1, y2}); the leader passes behind them, so it stops at
  // their edges. Returns this tag's box.
  // dy: the tag sits dy above (−) or below (+) its place, its leader kinked to reach it, so two
  // readings close together each keep their own tag.
  function tag(sc, v, x, s, a, cls, behind, dy) {
    const y = sc.y(v), ty = y + (dy || 0), w = tagW(s), h = tagH(s), box = { x1: x, x2: x + w, y1: ty - h / 2, y2: ty + h / 2 };
    if (a <= 0) return box;
    let x1 = X + TW + 2;
    const cuts = (behind || []).filter((b) => y > b.y1 - 3 && y < b.y2 + 3 && b.x2 > x1 && b.x1 < x).sort((p, q) => p.x1 - q.x1);
    part(a, 0, () => {
      if (dy) { pathOf('lead', 'M' + x1 + ' ' + y + ' H' + (x - 14) + ' L' + x + ' ' + ty); return; }
      cuts.forEach((b) => { if (b.x1 - 3 > x1) line('lead', x1, y, b.x1 - 3, y); x1 = Math.max(x1, b.x2 + 3); });
      if (x > x1) line('lead', x1, y, x, y);
    });
    part(a, 6, () => { rect('tag' + (cls ? ' ' + cls : ''), x, ty - h / 2, w, h, 8); tagLabel(x + w / 2, ty, s, cls === 'on'); });
    return box;
  }
  // The same tag, crossfading into its filled-in answer as a goes 0 -> 1 (over FILL seconds).
  function tagFill(sc, v, x, s, a) {
    if (a < 1) tag(sc, v, x, s, 1);
    if (a > 0) part(a, 0, () => tag(sc, v, x, s, 1, 'on'));
  }
  // A hop down the right side of the line, from value a to b, bulging `bulge` units, grown as far as e.
  function hop(sc, a, b, e, bulge) {
    const x = X + TW + 3, y1 = sc.y(a) + 2, y2 = sc.y(b) - 2;
    grown('hop', 'M' + x + ' ' + y1 + ' Q' + (x + 2 * bulge) + ' ' + ((y1 + y2) / 2).toFixed(2) + ' ' + x + ' ' + y2, e);
  }
  // A bracket at x, its ends turned back towards the line, spanning heights y1..y2, grown as far as e.
  const bracket = (x, y1, y2, e) => grown('brk', 'M' + (x - 6) + ' ' + y1 + ' H' + x + ' V' + y2 + ' H' + (x - 6), e);
  // One bracket at x spanning n above zero to n below it, grown out from zero both ways as far as e,
  // with a mark at zero growing towards the line with them: the two halves are the same length.
  function fromZero(sc, x, n, e) {
    if (e <= 0) return;
    const y0 = sc.y(0);
    grown('brk', 'M' + x + ' ' + y0 + ' V' + sc.y(n) + ' H' + (x - 6), e);
    grown('brk', 'M' + x + ' ' + y0 + ' V' + sc.y(-n) + ' H' + (x - 6), e);
    grown('brk', 'M' + x + ' ' + y0 + ' H' + (x - 8), e);
  }
  // An arrow up at x from y1 to y2, grown as far as e; its head rides on the tip, fading in over the
  // first third of the growth, so it never appears whole before there is a shaft under it.
  function arrowUp(x, y1, y2, e) {
    if (e <= 0) return;
    const y = K.lerp(y1, y2, e);
    line('arw', x, y1, x, y);
    part(K.clamp(e / 0.35, 0, 1), 0, () => pathOf('arw', 'M' + (x - 6) + ' ' + (y + 9) + ' L' + x + ' ' + y + ' L' + (x + 6) + ' ' + (y + 9)));
  }
  // A meter's display: a box with its reading, above the top of the line. What was done to the
  // meter is noted just under the display (NOTE_Y), clear of the 12 row, so it belongs to the display.
  const LCD = { x: 214, y: 4, w: 116, h: 38 }, NOTE_Y = LCD.y + LCD.h + 16;
  // The opposites bracket beside the meter's line, its labels just right of it.
  const BRX = 200;
  function lcd(s, a) {
    part(a, 6, () => text(LCD.x + LCD.w / 2, LCD.y + 27, s, 'lcdt k-nohalo'));
  }

  // ---------- the places Dan touches (kept from frame to frame) ----------
  let seen = null;
  function setAttrs(el, o) { Object.keys(o).forEach((k) => { if (o[k] == null) el.removeAttribute(k); else el.setAttribute(k, String(o[k])); }); }
  function hitEl(key, make) {
    let el = null;
    Array.prototype.forEach.call(hits.children, (c) => { if (c.getAttribute('data-key') === key) el = c; });
    if (!el) { el = make(); el.setAttribute('data-key', key); hits.appendChild(el); }
    if (seen) seen.add(el);
    return el;
  }
  // Sliding a tag: the finger's height, less where on the tag it was picked up, sets the value,
  // snapped to the nearest tick. The page does not scroll under a finger on a tag.
  let grab = null;
  const live = (i) => !finished && at() === i && S[i].res !== 'right';
  function svgY(e) {
    const m = svg.getScreenCTM();
    return m ? new DOMPoint(e.clientX, e.clientY).matrixTransform(m.inverse()).y : null;
  }
  function slideTo(i, k, y) {
    const d = STEPS[i], st = S[i], L = LAY[d.lay], sc = scaleOf(L);
    if (y == null || !isFinite(y)) return;
    st.at[k] = snap(L, sc.v(y)); st.moved[k] = true; st.sel = k; st.res = null;
    K.reveal(); K.refresh();
  }
  function grip(i, k, x, y, w, locked) {
    const d = STEPS[i], st = S[i], L = LAY[d.lay], t = d.tags[k];
    const el = hitEl('tag' + i + '-' + k, () => {
      const r = K.svg('rect', { class: 'hit grab', role: 'slider' });
      r.addEventListener('pointerdown', (e) => {
        if (!live(i) || e.button > 0) return;
        e.preventDefault();
        const y0 = svgY(e);
        grab = { id: e.pointerId, i: i, k: k, off: y0 == null ? 0 : y0 - scaleOf(LAY[STEPS[i].lay]).y(S[i].at[k]) };
        try { r.setPointerCapture(e.pointerId); } catch (x) { /* the slide still follows inside the tag */ }
        S[i].sel = k; S[i].moved[k] = true; S[i].res = null;
        K.reveal(); K.refresh();
      });
      r.addEventListener('pointermove', (e) => {
        if (!grab || grab.id !== e.pointerId || !live(i)) return;
        e.preventDefault();
        const y = svgY(e);
        if (y != null) slideTo(i, k, y - grab.off);
      });
      ['pointerup', 'pointercancel', 'lostpointercapture'].forEach((n) => r.addEventListener(n, (e) => { if (grab && grab.id === e.pointerId) grab = null; }));
      r.addEventListener('touchstart', (e) => { if (live(i)) e.preventDefault(); }, { passive: false });
      r.addEventListener('keydown', (e) => {
        const step = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1, PageUp: 5, PageDown: -5 }[e.key];
        if (!step || !live(i)) return;
        e.preventDefault(); nudge(i, k, step); K.refresh();
      });
      r.addEventListener('focus', () => { if (live(i) && S[i].sel !== k) { S[i].sel = k; K.refresh(); } });
      return r;
    });
    setAttrs(el, { x: x - 8, y: y - 26, width: w + 16, height: 52, class: 'hit grab' + (locked ? ' locked' : ''), tabindex: locked ? -1 : 0,
      'aria-label': 'The ' + say(t.label) + ' tag. Move it up or down the line.', 'aria-valuemin': L.bot, 'aria-valuemax': L.top,
      'aria-valuenow': st.at[k], 'aria-valuetext': 'pointing at ' + say(fmt(st.at[k])), 'aria-disabled': locked ? 'true' : null });
  }
  // A mark to tap on the quarters line: a strip across the line around each quarter tick.
  function spot(i, k, y, h, locked) {
    const el = hitEl('mark' + i + '-' + k, () => {
      const r = K.svg('rect', { class: 'hit', role: 'button' });
      const put = () => { if (!live(i)) return; S[i].mark = k; S[i].res = null; K.reveal(); K.refresh(); };
      r.addEventListener('click', put);
      r.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); put(); } });
      return r;
    });
    setAttrs(el, { x: 40, y: y - h / 2, width: 290, height: h, class: 'hit' + (locked ? ' locked' : ''), tabindex: locked ? -1 : 0,
      'aria-label': 'Tick ' + (k + 1) + ' of 5, counting down from 0', 'aria-pressed': S[i].mark === k ? 'true' : 'false' });
  }

  // --- the demonstrations (SHOW steps), drawn at time T ---
  // A marker counts down from 1 past 0 to −5; each number below zero arrives as it lands, then the
  // negative numbers are bracketed, from just below zero (0 itself stays outside) to −5.
  function demoDown() {
    const A = AT.down, sc = scaleOf(LAY.down);
    let v = A.from;
    const e = A.hops.map((t0) => arr(t0, HOP));
    e.forEach((x) => { v -= x; });
    // −n is landed on by hop n + from (the hops run 1 -> 0 -> −1 ... -> −5), 0.7 of the way through it
    const landing = (n) => A.hops[n + A.from - 1] + HOP * 0.7;
    let shown = 0;
    upright(sc, (u) => { if (u >= 0) return 1; const a = arr(landing(-u)); if (a >= 0.5) shown++; return a; });
    e.forEach((x, k) => hop(sc, A.from - k, A.from - k - 1, x, 8));
    dot(sc, v, arr(A.dot));
    const b = arr(A.brk);
    bracket(196, sc.y(0) + 6, sc.y(-5) + 4, b);
    part(arr(A.note), 6, () => text(204, sc.y(-2.5) + 5, 'negative numbers', 'note', 'start'));
    const where = Math.round(v * 10) / 10;
    return 'A thermometer drawn as an upright number line from 5 down to minus 5, with 0 marked. A marker counts down from ' + A.from +
      (where < A.from ? ' and is at ' + say(fmt(where)) : '') + '. ' + (shown ? shown + ' numbers below zero are labelled.' : 'Below zero the line is not yet numbered.') +
      (b >= 1 ? ' The numbers below zero are bracketed as negative numbers.' : '');
  }
  // Up is bigger; −2 and −7 are placed, then how far below zero each one sits.
  function demoBigger() {
    const A = AT.bigger, sc = scaleOf(LAY.bigger), big = arr(A.big), a = arr(A.a), b = arr(A.b);
    upright(sc);
    arrowUp(26, sc.y(-9), sc.y(1), big);
    part(arr(A.big + 0.3), 6, () => text(26, sc.y(1) - 14, 'bigger', 'note'));
    dot(sc, -2, a); tag(sc, -2, 151, '−2', a);
    dot(sc, -7, b); tag(sc, -7, 151, '−7', b);
    const ea = arr(A.brA), eb = arr(A.brB);
    bracket(228, sc.y(0), sc.y(-2), ea);
    part(arr(A.brA + 0.3), 6, () => text(236, sc.y(-1) + 5, '2 below zero', 'note', 'start'));
    bracket(208, sc.y(0), sc.y(-7), eb);
    part(arr(A.brB + 0.3), 6, () => text(216, sc.y(-5) + 5, '7 below zero', 'note', 'start'));
    return 'An upright number line from 2 down to minus 10, with an arrow up the side marked bigger.' + (a >= 0.5 ? ' Minus 2 is marked' : '') +
      (b >= 0.5 ? ', and minus 7 lower down' : '') + (eb >= 1 ? '. Brackets show minus 2 is 2 below zero and minus 7 is 7 below zero.' : '.');
  }
  // Half a step down from 0 lands on −1/2; half a step down from −1 lands on −1.5.
  function demoParts() {
    const A = AT.parts, sc = scaleOf(LAY.parts), t1 = arr(A.t1), t2 = arr(A.t2);
    upright(sc);
    hop(sc, 0, -0.5, arr(A.h1, 0.5), 12);
    dot(sc, -0.5, t1); tag(sc, -0.5, 160, '−1/2', t1);
    hop(sc, -1, -1.5, arr(A.h2, 0.5), 12);
    dot(sc, -1.5, t2); tag(sc, -1.5, 160, '−1.5', t2);
    return 'An upright number line from 1 down to minus 2, marked in quarters.' + (t1 >= 0.5 ? ' Minus 1/2 is marked halfway from 0 down to minus 1.' : '') +
      (t2 >= 0.5 ? ' Minus 1.5 is marked halfway from minus 1 down to minus 2.' : '');
  }
  // A pressure gauge's line: 0 is the air pressure around it; the reading hops down below it.
  function demoGauge() {
    const A = AT.gauge, sc = scaleOf(LAY.gauge), air = arr(A.air), t = arr(A.tag), below = arr(A.below);
    upright(sc);
    part(air, 6, () => text(150, sc.y(0) + 5, 'air pressure', 'note', 'start'));
    hop(sc, 0, -0.6, arr(A.hop), 10);
    dot(sc, -0.6, t); tag(sc, -0.6, 150, '−0.6 bar', t);
    part(below, 6, () => text(150, sc.y(-0.3) + 5, 'below air pressure', 'note', 'start'));
    return 'A pressure gauge drawn as an upright line in bar, from 1 down to minus 1, with a small step every 0.1 bar.' + (air >= 0.5 ? ' 0 is marked as the air pressure around it.' : '') +
      (t >= 0.5 ? ' A reading of minus 0.6 bar is marked below it' + (below >= 0.5 ? ', below air pressure.' : '.') : '');
  }
  // A meter reads 12.0 V; with its leads swapped it reads −12.0 V, as far below zero as 12 is above.
  function demoMeter() {
    const A = AT.meter, sc = scaleOf(LAY.meter), on = arr(A.on), sw = arr(A.swap), out = arr(A.swap, SWAP), nw = arr(A.swap + SWAP + SWAP_GAP), neg = arr(A.neg);
    upright(sc);
    rect('lcd', LCD.x, LCD.y, LCD.w, LCD.h, 6);
    leave(out, () => lcd('12.0 V', on));
    lcd('−12.0 V', nw);
    part(sw, 6, () => text(LCD.x + LCD.w / 2, NOTE_Y, 'leads swapped', 'note'));
    dot(sc, 12, on); tag(sc, 12, 140, '12', on);
    dot(sc, -12, neg); tag(sc, -12, 140, '−12', neg);
    const e = arr(A.brk), lab = arr(A.brk + 0.3), opp = arr(A.opp);
    fromZero(sc, BRX, 12, e);
    part(lab, 6, () => { text(BRX + 8, sc.y(6) + 5, '12', 'note', 'start'); text(BRX + 8, sc.y(-6) + 5, '12', 'note', 'start'); });
    part(opp, 6, () => text(BRX + 8, sc.y(0) + 5, 'opposites', 'note', 'start'));
    return 'A meter display and an upright line from 15 down to minus 15 volts. ' + (sw >= 0.5 ? 'With the leads swapped the display reads minus 12.0 V' : 'The display reads 12.0 V') +
      (neg >= 0.5 ? '; 12 and minus 12 are both marked on the line' : on >= 0.5 ? ', marked at 12 on the line' : '') +
      (lab >= 0.5 ? ', each 12 from zero' : '') + (opp >= 0.5 ? ', and labelled opposites.' : '.');
  }

  // --- the puzzles (DO steps); after a right answer their motion runs on the same clock T ---
  // Slide −3 to its place; a right answer counts the three steps down from 0.
  function drawFind(i, d, st, right) {
    const F = d.at, sc = scaleOf(LAY[d.lay]), x = d.lane[0], t = d.tags[0];
    upright(sc);
    let counted = 0;
    if (right) F.hops.forEach((t0, k) => {
      hop(sc, -k, -k - 1, arr(t0, HOP), 10);
      const c = arr(t0 + 0.15);
      if (c >= 0.5) counted++;
      part(c, 6, () => text(X + TW + 24, sc.y(-k - 0.5) + 5, k + 1, 'cnt', 'start'));
    });
    dot(sc, st.at[0], 1);
    if (right) tagFill(sc, st.at[0], x, t.label, arr(F.fill, FILL)); else tag(sc, st.at[0], x, t.label, 1);
    grip(i, 0, x, sc.y(st.at[0]), tagW(t.label), right);
    const note = right ? arr(F.note) : 0;
    part(note, 6, () => text(x + tagW(t.label) + 12, sc.y(-3) + 5, '3 below zero', 'note', 'start'));
    return 'A thermometer drawn as an upright number line from 5 down to minus 5, with 0 marked. The minus 3 tag points at ' + say(fmt(st.at[0])) +
      (right ? (counted ? ', and ' + counted + ' steps down from 0 are counted' : '') + (note >= 0.5 ? ', 3 below zero.' : '.') : '.');
  }
  // Slide −5 °C and −18 °C to their places, then tap the warmer; a right answer fills in −5 °C and
  // draws an arrow up from −18 °C to it, marked warmer.
  function drawWarm(i, d, st, right) {
    const F = d.at, sc = scaleOf(LAY[d.lay]), many = d.tags.length > 1;
    upright(sc);
    // the tags nearer the line come first; a leader from further out passes behind them
    const boxes = [];
    d.tags.forEach((t, k) => {
      const x = d.lane[k];
      dot(sc, st.at[k], 1);
      if (right && k === 0) tagFill(sc, st.at[k], x, t.label, arr(F.fill, FILL));
      boxes.push(tag(sc, st.at[k], x, t.label, right && k === 0 ? 0 : 1, !right && many && st.sel === k ? 'sel' : '', boxes.slice()));
      grip(i, k, x, sc.y(st.at[k]), tagW(t.label), right);
    });
    const e = right ? arr(F.arw) : 0, note = right ? arr(F.note) : 0;
    arrowUp(322, sc.y(-18), sc.y(-5) + 2, e);
    part(note, 6, () => text(330, sc.y(-5) - 16, 'warmer', 'note', 'end'));
    return 'A thermometer from 5 down to minus 20 °C, numbered every 5 degrees with a tick at every degree. ' +
      d.tags.map((t, k) => 'The ' + say(t.label) + ' tag points at ' + say(fmt(st.at[k])) + (st.moved[k] ? '' : ', where it started')).join('. ') + '.' +
      (note >= 0.5 ? ' An arrow up from minus 18 to minus 5 is marked warmer.' : '');
  }
  // Tap −3/4 on a line from 0 down to −1 in quarters; a right answer counts the three quarter-steps.
  function drawQuarters(i, d, st, right) {
    const F = d.at, sc = scaleOf(LAY[d.lay]), step = sc.k / 4;
    upright(sc);
    let counted = 0;
    if (right) F.hops.forEach((t0, k) => {
      hop(sc, markValue(k), markValue(k + 1), arr(t0, HOP), 12);
      const c = arr(t0 + 0.15);
      if (c >= 0.5) counted++;
      part(c, 6, () => text(X + TW + 28, sc.y(markValue(k + 0.5)) + 5, k + 1, 'cnt', 'start'));
    });
    if (st.mark != null) dot(sc, markValue(st.mark), 1);
    const named = right ? arr(F.tag) : 0;
    tag(sc, markValue(d.want), 170, '−3/4', named, 'on');
    for (let k = 0; k <= 4; k++) spot(i, k, sc.y(markValue(k)), step, right);
    return 'An upright number line from 0 down to minus 1, with a tick at every quarter. ' +
      (st.mark == null ? 'No mark yet.' : 'The mark is on tick ' + (st.mark + 1) + ' of 5, counting down from 0' + (right ? (counted ? ', ' + counted + ' quarter-steps are counted' : '') + (named >= 0.5 ? ', and it is labelled minus 3/4.' : '.') : '.'));
  }
  // Read the gauge: the marker sits 3 small steps below 0; a right answer hops the steps, notes how
  // many (each tick is too small to number), then fills the slot.
  function drawGauge(i, d, st, right) {
    const F = d.at, sc = scaleOf(LAY[d.lay]), y = sc.y(d.read), said = d.want + ' ' + d.unit, w = tagW(said), named = right ? arr(F.answer) : 0;
    const n = Math.round(-d.read * 10), counted = right ? arr(F.count) : 0;
    upright(sc);
    text(150, sc.y(0) + 5, 'air pressure', 'note', 'start');
    if (right) F.hops.forEach((t0, k) => hop(sc, -k / 10, -(k + 1) / 10, arr(t0, HOP), 10));
    part(counted, 6, () => text(150, y + 36, n + ' steps of 0.1', 'note', 'start'));
    dot(sc, d.read, 1);
    line('lead', X + TW + 2, y, 150, y);
    leave(named, () => add(K.svg('rect', { class: 'gapbox', x: 150, y: y - 15, width: w, height: 30, rx: 8 })));
    part(named, 6, () => { rect('tag on', 150, y - 15, w, 30, 8); tagLabel(150 + w / 2, y, said, true); });
    return 'A pressure gauge drawn as an upright line in bar, from 1 down to minus 1, numbered every 0.5 with a small step every 0.1. 0 is marked as air pressure. A marker sits 3 small steps below 0' +
      (named >= 0.5 ? ', labelled minus 0.3 bar' : ', with a gap for its reading') + (counted >= 0.5 ? ', 3 steps of 0.1.' : '.');
  }
  // The meter reads −12.0 V; a right answer swaps the leads back, so it reads 12.0 V, and shows the
  // two readings are opposites, each 12 from zero.
  function drawMeter(i, d, st, right) {
    const F = d.at, sc = scaleOf(LAY[d.lay]);
    upright(sc);
    rect('lcd', LCD.x, LCD.y, LCD.w, LCD.h, 6);
    const sw = right ? arr(F.swap) : 0, out = right ? arr(F.swap, SWAP) : 0, nw = right ? arr(F.swap + SWAP + SWAP_GAP) : 0, pos = right ? arr(F.pos) : 0;
    leave(out, () => lcd('−12.0 V', 1));
    lcd('12.0 V', nw);
    part(sw, 6, () => text(LCD.x + LCD.w / 2, NOTE_Y, 'swapped back', 'note'));
    dot(sc, -12, 1); tag(sc, -12, 140, '−12', 1);
    dot(sc, 12, pos); tag(sc, 12, 140, '12', pos);
    const e = right ? arr(F.brk) : 0, lab = right ? arr(F.brk + 0.2) : 0, opp = right ? arr(F.opp) : 0;
    fromZero(sc, BRX, 12, e);
    part(lab, 6, () => { text(BRX + 8, sc.y(6) + 5, '12', 'note', 'start'); text(BRX + 8, sc.y(-6) + 5, '12', 'note', 'start'); });
    part(opp, 6, () => text(BRX + 8, sc.y(0) + 5, 'opposites', 'note', 'start'));
    return 'A meter display reading ' + (nw >= 0.5 ? '12.0 V with its leads swapped back' : 'minus 12.0 V') + ', and an upright line from 15 down to minus 15 volts with minus 12 marked' +
      (pos >= 0.5 ? ' and 12 marked' : '') + (opp >= 0.5 ? ', each 12 from zero, labelled opposites.' : '.');
  }
  // Three cold rooms on a thermometer; a right answer fills in −12 °C, marks it least cold and draws
  // an arrow up from the coldest, marked warmer.
  const ROOMS = [-12, -18, -29];
  function drawRooms(i, d, st, right) {
    const F = d.at, sc = scaleOf(LAY[d.lay]);
    upright(sc);
    ROOMS.forEach((v, k) => {
      dot(sc, v, 1);
      if (right && k === 0) tagFill(sc, v, 151, d.opts[k], arr(F.fill, FILL));
      else tag(sc, v, 151, d.opts[k], 1);
    });
    const e = right ? arr(F.arw) : 0, note = right ? arr(F.note) : 0, cold = right ? arr(F.cold) : 0;
    arrowUp(318, sc.y(-29), sc.y(-12) + 2, e);
    part(note, 6, () => text(310, (sc.y(-29) + sc.y(-12)) / 2 + 5, 'warmer', 'note', 'end'));
    part(cold, 6, () => text(151 + tagW(d.opts[0]) + 10, sc.y(-12) + 5, 'least cold', 'note', 'start'));
    return 'A thermometer from 5 down to minus 30 °C with three readings marked, minus 12, minus 18 and minus 29 °C, from the top down.' +
      (cold >= 0.5 ? ' Minus 12 °C, nearest the top, is marked least cold, and an arrow up the side is marked warmer.' : '');
  }
  // Put four numbers in order; a right answer places them on the line from the bottom up, in his order.
  // −0.5 and −3/4 sit a quarter-step apart: their tags are nudged apart, each with its own leader.
  const ORDER_DY = { '1': 0, '−0.5': -12, '−2': 0, '−3/4': 16 };
  function drawOrder(i, d, st, right) {
    const F = d.at, sc = scaleOf(LAY[d.lay]);
    upright(sc);
    let placed = 0;
    if (right) st.order.forEach((s, k) => {
      const a = arr(F.marks[k]), v = value(s);
      if (a >= 0.5) placed++;
      dot(sc, v, a); tag(sc, v, 151, s, a, '', null, ORDER_DY[s]);
    });
    return 'An upright number line from 1 down to minus 2, marked in quarters.' +
      (right ? ' ' + placed + ' of the numbers are placed on it, smallest lowest.' : st.order.length ? ' Your order so far, smallest first: ' + st.order.map((s) => say(s)).join(', ') + '.' : '');
  }

  // The scene for a step (the animation calls this every frame).
  function paint(i) {
    if (i == null) i = at();
    const d = STEPS[i], st = S[i], right = st.res === 'right';
    art.textContent = '';
    into = null;
    seen = new Set();
    svg.setAttribute('viewBox', '0 0 340 ' + LAY[d.lay || d.demo].H);
    let aria;
    if (d.show) aria = { down: demoDown, bigger: demoBigger, parts: demoParts, gauge: demoGauge, meter: demoMeter }[d.demo]();
    else aria = { find: drawFind, warm: drawWarm, quarters: drawQuarters, gauge: drawGauge, meter: drawMeter, rooms: drawRooms, order: drawOrder }[d.draw](i, d, st, right);
    Array.prototype.slice.call(hits.children).forEach((c) => { if (!seen.has(c)) hits.removeChild(c); });
    seen = null;
    svg.setAttribute('aria-label', aria);
  }

  const el = (id) => document.getElementById(id);
  el('finish').textContent = FINISH;
  K.update((p) => {
    const i = Math.round(p.step), d = STEPS[i], st = S[i];
    if (!anim.playing()) T = Infinity;          // motion that was stopped (the page hidden, a test) shows finished
    if (i !== lastStep) { lastStep = i; grab = null; enter('stepbox'); if (d.show) play(); else { anim.pause(); T = Infinity; } }
    if (finished !== lastDone) { lastDone = finished; enter(finished ? 'done' : 'stepbox'); }
    const right = st.res === 'right';
    el('stepbox').hidden = finished;
    el('done').hidden = !finished;
    el('count').textContent = 'Step ' + (i + 1) + ' of ' + STEPS.length;
    const task = el('task');
    task.className = 'task' + (d.show ? ' show' : '');
    write(task, d.show ? d.text : d.task);
    paint(i);

    el('replay').hidden = !d.show || REDUCE;
    el('nudge').hidden = d.kind !== 'drag' || right;
    if (d.kind === 'drag') {
      // with two tags, the buttons say which one they move (the one last touched)
      const t = d.tags[Math.min(st.sel, d.tags.length - 1)], name = say(t.label), many = d.tags.length > 1;
      nudgeBtns[0].setLabel(many ? t.label + ' up' : 'Up one');
      nudgeBtns[1].setLabel(many ? t.label + ' down' : 'Down one');
      // the spoken name starts with the words on the button
      nudgeBtns[0].el.setAttribute('aria-label', many ? name + ' up one step' : 'Move the ' + name + ' tag up one step');
      nudgeBtns[1].el.setAttribute('aria-label', many ? name + ' down one step' : 'Move the ' + name + ' tag down one step');
    }
    const opts = d.show ? [] : d.opts || [];
    // on a line with tags, the answers come once every tag has been moved, under their own label
    el('picks').hidden = !opts.length || (d.kind === 'drag' && !st.moved.every(Boolean));
    el('ask').hidden = !d.ask;
    el('ask').textContent = d.ask || '';
    el('picks').className = 'row picks' + (d.words ? ' words' : '') + (d.kind === 'order' ? ' order' : '');
    if (d.ask) { el('picks').setAttribute('role', 'group'); el('picks').setAttribute('aria-labelledby', 'ask'); }
    else { el('picks').removeAttribute('role'); el('picks').removeAttribute('aria-labelledby'); }
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      write(b.el, opts[k]);
      if (d.kind === 'order') {
        const j = st.order.indexOf(opts[k]);
        b.el.setAttribute('aria-pressed', j >= 0 ? 'true' : 'false');
        if (j >= 0) b.el.appendChild(K.el('span', { class: 'ord', 'aria-hidden': 'true' }, String(j + 1)));
        b.el.setAttribute('aria-label', say(opts[k]) + (j >= 0 ? ', number ' + (j + 1) + ' in your order' : ''));
      } else {
        b.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
        b.el.removeAttribute('aria-label');
      }
    });

    el('acts').hidden = !!d.show;
    checkBtn.el.hidden = right;
    const fb = el('fb');
    fb.hidden = !!d.show;
    fb.className = 'fb' + (right ? ' right' : st.res === 'wrong' ? ' wrong' : '');
    write(fb, d.show ? '' : right ? 'That\'s it.' : st.res === 'wrong' ? hintFor(i, st) : st.res === 'empty' ? emptyFor(i, st) || PICK : '');

    const why = el('why');
    why.hidden = d.show || !st.why;
    write(why, d.show ? '' : d.why);
    whyBtn.setLabel(st.why ? 'Hide why' : 'Why?');

    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !right);
    nextBtn.setLabel(i === STEPS.length - 1 ? 'Finish' : 'Continue');
    nav.hidden = backBtn.el.hidden && nextBtn.el.hidden;
  });

  // ---------- known answers, worked out by hand ----------
  const DO = STEPS.map((d, i) => i).filter((i) => !STEPS[i].show);
  const idx = (name) => STEPS.findIndex((d) => d.name === name);
  // Each puzzle accepts its one right answer and nothing else.
  function onlyRight(i) {
    const d = STEPS[i], ok = (st) => isRight(i, Object.assign(blank(i), st, { moved: d.tags ? d.tags.map(() => true) : [] }));
    if (d.kind === 'drag') {
      const wants = d.tags.map((t) => t.want), L = LAY[d.lay];
      let good = ok({ at: wants, pick: d.opts ? d.want : null });
      // every other place for each tag, and (with answers) the other answer, are refused
      d.tags.forEach((t, k) => { for (let v = L.bot; v <= L.top; v += L.minor) if (!same(v, t.want)) { const a = wants.slice(); a[k] = v; if (ok({ at: a, pick: d.want })) good = false; } });
      if (d.opts) d.opts.forEach((o) => { if (o !== d.want && ok({ at: wants, pick: o })) good = false; });
      return good;
    }
    if (d.kind === 'tap') return [0, 1, 2, 3, 4].every((k) => ok({ mark: k }) === (k === d.want));
    if (d.kind === 'order') return ok({ order: d.want.slice() }) && !ok({ order: ['−2', '−0.5', '−3/4', '1'] }) && !ok({ order: d.opts.slice() });
    return d.opts.every((o) => ok({ pick: o }) === (o === d.want));
  }
  // The drawing itself, measured: step i painted finished in state st; the dots' heights, top first in drawing order.
  function dotsDrawn(i, st) {
    const keepT = T, keepS = S[i];
    T = Infinity; S[i] = st;
    try { paint(i); return Array.prototype.map.call(art.querySelectorAll('circle.dot'), (c) => +c.getAttribute('cy')); } finally { S[i] = keepS; T = keepT; paint(); }
  }
  const W4 = idx('Which is warmer?'), R11 = idx('Least cold'), O12 = idx('Smallest to biggest'), Q6 = idx('Find −3/4'), G8 = idx('Read the gauge');
  K.check('Higher up is bigger: −2 > −7, −5 > −18, −12 > −18 > −29 and 1 > −0.5 > −3/4 > −2. As drawn, −5 °C sits above −18 °C and −12 °C above −18 °C above −29 °C; and each puzzle accepts only its right answer', () => {
    const warm = dotsDrawn(W4, solved(W4)), rooms = dotsDrawn(R11, solved(R11));
    const order = STEPS[O12].opts.map(value).sort((a, b) => a - b);
    return -2 > -7 && -5 > -18 && -12 > -18 && -18 > -29 && 1 > -0.5 && -0.5 > -0.75 && -0.75 > -2 &&
      warm.length === 2 && warm[0] < warm[1] && rooms.length === 3 && rooms[0] < rooms[1] && rooms[1] < rooms[2] &&
      order.map(fmt).join() === ['−2', '−0.75', '−0.5', '1'].join() && STEPS[O12].want.map(value).every((v, k) => same(v, order[k])) &&
      value(STEPS[R11].want) === Math.max.apply(null, ROOMS) && value(STEPS[W4].want) === Math.max(-5, -18) && DO.every(onlyRight);
  });
  K.check('Places: −3 is 3 steps below 0 and 3 is as far above it; −3/4 is the third of four quarter ticks below 0; the gauge marker 3 tenth-steps below 0 reads −0.3 bar, not −0.7; 12 and −12 are opposites, drawn the same distance either side of 0', () => {
    const a = scaleOf(LAY.down), q = scaleOf(LAY.quarters), g = scaleOf(LAY.gauge), m = scaleOf(LAY.meter);
    return same(a.y(-3) - a.y(0), 3 * a.k) && same(a.y(0) - a.y(3), a.y(-3) - a.y(0)) && same(markValue(STEPS[Q6].want), -0.75) &&
      same(q.y(markValue(3)) - q.y(0), 3 * (q.y(-1) - q.y(0)) / 4) && same(g.y(STEPS[G8].read) - g.y(0), 3 * g.k / 10) &&
      same(value(STEPS[G8].want), STEPS[G8].read) && !same(value('−0.7'), STEPS[G8].read) && !same(value('0.3'), STEPS[G8].read) && same(-12 + 12, 0) && same(m.y(-12) - m.y(0), m.y(0) - m.y(12));
  });
  K.check('A slid tag lands on the nearest whole step and stays on the line: 2.4 steps down from 0 lands on −2, 2.6 on −3, and past either end it stops at the end', () => {
    const L = LAY.down, sc = scaleOf(L), wl = LAY.warm, ws = scaleOf(wl);
    return same(snap(L, sc.v(sc.y(-2.4))), -2) && same(snap(L, sc.v(sc.y(-2.6))), -3) && same(snap(L, sc.v(sc.y(-9))), -5) && same(snap(L, sc.v(sc.y(7))), 5) &&
      same(snap(wl, ws.v(ws.y(-17.6))), -18) && same(snap(wl, -0), 0) && snap(wl, -0.4) === 0;
  });
  // Drawn from the lesson's own timetable: each screen is painted finished and every arrival it used is noted.
  K.check('Every demonstration has finished arriving within 4.5 s of its screen opening, none starting before the 0.35 s screen fade ends, hops at least 0.2 s apart, and every answer\'s motion within 2.5 s', () => {
    const keepT = T, ok = STEPS.every((d, i) => {
      const keepS = S[i];
      T = Infinity; latest = 0; earliest = Infinity;
      if (!d.show) S[i] = solved(i);
      try { paint(i); } finally { S[i] = keepS; }
      return d.show ? latest <= d.dur && d.dur <= 4.5 && earliest >= FADE : latest <= d.fb && d.fb <= 2.5;
    });
    const gaps = (list) => list.every((t, k) => k === 0 || t - list[k - 1] >= 0.2);
    T = keepT; paint();
    return ok && gaps(AT.down.hops) && DO.every((i) => !STEPS[i].at || !STEPS[i].at.hops || gaps(STEPS[i].at.hops)) && gaps(STEPS[O12].at.marks);
  });

  K.ready();
</script>
