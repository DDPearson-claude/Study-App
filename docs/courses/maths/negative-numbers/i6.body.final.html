<p class="caption">Times −1 turns a number's arrow half a turn about zero. The tank's numbers are example values.</p>

<script>
  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // dur: how long a demonstration plays; fb: how long the motion after a right answer plays (seconds).
  // lay: which upright line a step draws (LAY below). by, of: by lots of `of`, added with the marker.
  // rows, ask: a pattern's rows (their first numbers) and the row it asks for. size, sum: the arrow
  // Dan turns and the times it stands for. nums: a times worked by half-turns.
  // at: when each part of the motion after a right answer arrives, in seconds after Check.
  // (In the text Dan reads, "Start again", the button's name, never breaks across two lines.)
  const PICK = 'Tap one of the answers.', END = 'That is four half-turns. Tap Start again.';
  const M = '−';
  const STEPS = [
    { show: true, demo: 'lots', dur: 4.4, lay: 'lots', name: 'Lots of −4',
      text: '3 × −4 means three lots of −4, added together. Each −4 steps the marker 4 backwards, down the line, so 3 × −4 = −12.' },
    { kind: 'lots', lay: 'lots5', by: 2, of: -5, note: '−5 + (−5)', opts: ['−10', '10', '−3'], want: '−10', fb: 2.2, name: 'Two lots of −5',
      at: { hops: [0.15, 0.85], hop: 0.55, tag: 1.5 },
      task: 'What is 2 × −5?',
      why: '2 × −5 is two lots of −5, added together. Each −5 steps the marker 5 backwards, from 0 to −5, then on to −10. So 2 × −5 = −10.',
      hint: 'Not quite. Add two lots of −5, starting from 0.',
      hints: { '10': 'Not quite. Each −5 steps the marker down, so two lots end below zero.', '−3': 'Not quite. That adds 2 and −5. 2 × −5 means two lots of −5.' } },
    { show: true, demo: 'pattern', dur: 3.6, lay: 'pat4', name: 'A pattern',
      text: 'These rows make a *pattern*. Each row has one lot of −4 fewer, so the answer climbs 4 up the line, from −12 to 0.' },
    { kind: 'pattern', lay: 'pat4', of: -4, rows: [3, 2, 1, 0], ask: -1, opts: ['−4', '4', '−5'], want: '4', fb: 1.3, name: 'Carry it on',
      at: { hops: [0.15], hop: 0.45, tag: 0.6 },
      task: 'Carry the pattern on. What is −1 × −4?',
      why: 'Each row so far has one lot of −4 fewer, so the answer climbs 4. Carry that climb on: after 0 × −4 = 0, which is neither positive nor negative, comes −1 × −4 = 4.',
      hint: 'Not quite. Each row the answer climbs 4.',
      hints: { '−4': 'Not quite. The answer climbs 4 every row, so after 0 comes 4.', '−5': 'Not quite. That adds −1 and −4. Follow the pattern up 4 from 0.' } },
    { show: true, demo: 'past', dur: 3.4, lay: 'pat4', name: 'Past zero',
      text: 'You can\'t add −1 lots of −4, so for a negative first number the marker stops working. The pattern carries on, climbing 4 a row, to −3 × −4 = 12.' },
    { kind: 'pattern', lay: 'pat2', of: -2, rows: [2, 1, 0], ask: -3, opts: ['6', '−6', '−5'], want: '6', fb: 2.2, name: 'Same signs',
      at: { hops: [0.15, 0.65, 1.15], hop: 0.4, tag: 1.55 },
      task: 'Carry this pattern on, row by row. What is −3 × −2?',
      why: 'The answer climbs 2 a row, so −3 × −2 = 6. Brackets agree. −3 × (2 + (−2)) is −3 × 0 = 0, and it splits into −3 × 2 = 2 × −3 = −6 plus −3 × −2, so −3 × −2 must be 6.',
      hint: 'Not quite. Each row the answer climbs 2.',
      hints: { '−6': 'Not quite. The answer climbs 2 every row. After 0 come 2, 4 and 6.', '−5': 'Not quite. That adds −3 and −2. Carry the times pattern on, up 2 a row.' } },
    { show: true, demo: 'turn', dur: 4.1, lay: 'turn4', name: 'A half-turn',
      text: 'You found −1 × −4 = 4, the opposite of −4. Times −1 turns each number into its opposite, a *half-turn* about zero. Two half-turns bring it back.' },
    { kind: 'turns', lay: 'turn12', size: 12, sum: '−3 × −4', note: '3 × 4 = 12', want: 2, fb: 0.8, name: 'Turn it',
      at: { sum: 0.15 },
      task: 'Work out −3 × −4 by turning. Start from 3 × 4 = 12, and give it one half-turn for each minus sign.',
      empty: 'Tap Half-turn once for each minus sign in −3 × −4.',
      turnHints: { 1: 'Not quite. One half-turn gives 3 × −4 = −12. −3 × −4 has two minus signs, so give it one more.',
        3: 'Not quite. That is three half-turns. −3 × −4 has two minus signs, so tap Start again.',
        4: 'Not quite. Four half-turns land on 12 too, but −3 × −4 has two minus signs. Tap Start again.' },
      hint: 'Not quite. Give it one half-turn for each minus sign.',
      why: '−3 is 3 × −1 and −4 is 4 × −1, so each minus sign brings one half-turn. Two half-turns take 12 round and back, so −3 × −4 = 12. Same signs give a positive answer.' },
    { kind: 'add', lay: 'add', from: -3, add: -4, opts: ['−7', '7', '12'], want: '−7', fb: 2.1, name: 'Adding is different',
      at: { hops: [0.15, 0.45, 0.75, 1.05], tag: 1.45 },
      task: '−3 × −4 = 12. What is −3 + (−4)?',
      why: 'Adding −4 steps the marker 4 backwards, from −3 down to −7. Half-turns come from multiplying, so −3 × −4 = 12 but −3 + (−4) = −7.',
      hint: 'Not quite. Stand on −3, facing up, and step backwards 4.',
      hints: { '7': 'Not quite. Half-turns come from multiplying, not adding. Adding −4 moves you down 4 from −3.', '12': 'Not quite. 12 is −3 × −4. Adding −4 moves you down 4 from −3.' } },
    { kind: 'lots', lay: 'tank', by: 3, of: -0.4, unit: 'm', note: '−0.4 + (−0.4) + (−0.4)', opts: ['−1.2 m', '1.2 m', '2.6 m'], want: '−1.2 m', fb: 2.3, name: 'A tank',
      at: { hops: [0.15, 0.65, 1.15], hop: 0.45, tag: 1.6 },
      task: 'Say a tank\'s level changes by −0.4 m each hour. What is the change over 3 hours?',
      why: 'Each hour adds −0.4 m to the change, so 3 hours give 3 × −0.4 = −1.2. The level ends 1.2 m lower than it started.',
      hint: 'Not quite. Add three lots of −0.4.',
      hints: { '1.2 m': 'Not quite. The level drops every hour, so the change over 3 hours is negative.', '2.6 m': 'Not quite. That adds 3 and −0.4. Three hours of −0.4 m is 3 × −0.4.' } },
    { kind: 'times', lay: 'turn24', nums: [-2, -3, -4], note: '2 × 3 × 4 = 24', opts: ['−24', '24', '−9'], want: '−24', fb: 2.5, name: 'Three minus signs',
      at: { grow: [0.05, 0.3], turns: [0.35, 0.95, 1.55], turn: 0.4, tag: 1.85 },
      task: 'What is −2 × −3 × −4?',
      why: '2 × 3 × 4 = 24. Three minus signs give three half-turns, down, back up, then down again. So −2 × −3 × −4 = −24.',
      hint: 'Not quite. Work out 2 × 3 × 4, then count the minus signs.',
      hints: { '24': 'Not quite. Three minus signs are three half-turns, which leave the arrow pointing down, so the answer is negative.', '−9': 'Not quite. That adds them. Times first, 2 × 3 × 4 = 24, then count the minus signs.' } },
    { kind: 'which', lay: 'turn15', target: 15, nums: [-5, -3], note: '5 × 3 = 15', opts: ['−5 × 3', '−5 × −3', '−5 + (−3)'], want: '−5 × −3', wrap: true, fb: 2.3, name: 'Which is 15?',
      at: { grow: [0.05, 0.3], turns: [0.35, 0.95], turn: 0.4, tag: 1.6 },
      task: 'Which of these comes to 15?',
      why: '−5 × −3 has two minus signs, so two half-turns bring 15 back to 15. −5 × 3 has one, so it is −15. −5 + (−3) adds, so it is −8.',
      hint: 'Not quite. Count the minus signs in each times sum.',
      hints: { '−5 × 3': 'Not quite. One minus sign is one half-turn, so −5 × 3 = −15.', '−5 + (−3)': 'Not quite. That adds −3 to −5, which moves down 3, to −8.' } },
  ];
  const FINISH = 'Each minus sign in a times sum gives a half-turn about zero, so, unless a number is 0, one makes the answer negative and two make it positive. That rule is for times, not adding, so −3 + (−4) is still −7.';
  // The rule beside the marker, in words (as in Adding).
  const RULES = ['Facing up: add', 'Positive: forwards', 'Negative: backwards'];
  // The rule beside the half-turns, in words: true for two numbers or three (count the minus signs).
  const TURN_RULES = ['Times −1: a half-turn', 'Even count: positive', 'Odd count: negative'];
  // When each demonstration's parts arrive, in seconds after the screen opens (the screen itself
  // takes FADE to fade in, so nothing starts before it has settled). TURN: how long a half-turn Dan
  // gives takes; BACK: how long Start again takes to fade the old turns away; LABEL: how long a
  // landing's labels take to rise in; HOP: one step of the marker; CNT: a count rising in.
  const FADE = 0.35, TURN = 0.6, BACK = 0.45, LABEL = 0.3, HOP = 0.3, HL = 0.4, CNT = 0.35, MAXT = 4;
  const AT = {
    // the rule; the marker on 0, facing up; three lots of −4, each a hop of 4 backwards; the answer
    lots: { by: 3, of: -4, card: 0.5, mk: 1.0, hl: 1.3, hops: [1.7, 2.35, 3.0], hop: 0.55, tag: 3.7 },
    // the first row; then each row a hop up the line, its climb, and the row beside its answer
    pattern: { of: -4, rows: [3, 2, 1, 0], first: 0.5, hops: [1.05, 1.7, 2.35], hop: 0.45 },
    // the rows so far; then three more, on past zero
    past: { of: -4, rows: [3, 2, 1, 0], more: [-1, -2, -3], hops: [0.6, 1.3, 2.0], hop: 0.5 },
    // the arrow to 4; a half-turn to −4 and its sum; a second half-turn back to 4 and its sum
    turn: { v: 4, mk: 0.5, turns: [1.1, 2.5], turn: 0.8, lab1: 1.9, sum1: 2.0, lab2: 3.3, sum2: 3.4, card: 3.4 },
  };
  // Drawing sizes, in viewBox units (340 wide). The line runs up x = X inside a tube TW either side
  // of it, its numbers ending at LX. Each line: values top..bot drawn from Y0 down to H - 46 (H: the
  // picture's height, shorter where a line's own `H` says so, to keep a long question on a phone
  // screen), a tick every `minor`, a number every `every`. RX: where a pattern's rows put "=".
  const X = 76, TW = 9, LX = 56, Y0 = 40, H0 = 286, TAGX = 120, CNTX = 102, RX = 258;
  let H = H0;
  const LAY = {
    lots: { top: 2, bot: -13, minor: 1, every: 2 },
    lots5: { top: 10, bot: -12, minor: 1, every: 2 },
    pat4: { top: 12, bot: -12, minor: 1, every: 4 },
    pat2: { top: 8, bot: -6, minor: 1, every: 2 },
    turn4: { top: 5, bot: -5, minor: 1, every: 1 },
    turn12: { top: 20, bot: -20, minor: 1, every: 5, H: 262 },
    add: { top: 2, bot: -9, minor: 1, every: 1 },
    tank: { top: 1.5, bot: -1.5, minor: 0.1, every: 0.5, unit: 'm', H: 262 },
    turn24: { top: 30, bot: -30, minor: 2, every: 10 },
    turn15: { top: 20, bot: -20, minor: 1, every: 5 },
  };
  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  // While the kit's self-test looks at every screen it switches fades off (the k-testing class):
  // demonstrations then open finished, as they do with reduced motion.
  const testing = () => document.documentElement.classList.contains('k-testing');
  const BBC = 'https://www.bbc.co.uk/bitesize/articles/z8x44xs';

  // ---------- numbers (pure, so the checks can test them) ----------
  const same = (a, b) => K.near(a, b, 1e-9);
  const round3 = (v) => Math.round(v * 1000) / 1000;
  // '−1.2 m' -> −1.2; '(−4)' -> −4; a sum or words -> NaN.
  function value(s) {
    const t = String(s).replace(/−/g, '-').replace(/\s*m$/, '').replace(/[()]/g, '').trim();
    return /^[-+]?\d+(\.\d+)?$/.test(t) ? Number(t) : NaN;
  }
  // As Dan reads it: a proper minus sign; as a screen reader says it.
  const fmt = (v) => (v < 0 ? M : '') + String(round3(Math.abs(v)));
  const say = (s) => String(s).replace(/[()]/g, '').replace(/−\s*/g, 'minus ').replace(/ × /g, ' times ').replace(/ \+ /g, ' plus ')
    .replace(/ = /g, ' equals ').replace(/(\d) m\b/g, '$1 metres');
  // n lots of b (n a whole number, 0 or more), added one lot at a time from 0: where it lands, and each place on the way.
  function lotsOf(n, b) {
    let v = 0;
    const seen = [0];
    for (let k = 0; k < n; k++) { v = round3(v + b); seen.push(v); }
    return { at: v, seen: seen };
  }
  // Adding a whole number b to a, one step at a time along the line: up for a positive b, down for a negative one.
  function stepBy(a, b) {
    let v = a;
    for (let k = 0; k < Math.abs(b); k++) v = round3(v + (b < 0 ? -1 : 1));
    return v;
  }
  // The pattern: `top` lots of b (added, so top is 0 or more), then each row the first number drops by
  // 1 and the answer moves the same amount, −b, again. The answer on the row whose first number is m.
  function patternAt(m, b, top) {
    let v = lotsOf(top, b).at;
    for (let r = top; r > m; r--) v = round3(v - b);
    return v;
  }
  // Half-turns about zero: the arrow to `size`, turned n half-turns, points at size × cos(n × 180°).
  const turned = (size, n) => round3(size * Math.cos(Math.PI * n));
  const minusCount = (nums) => nums.filter((x) => x < 0).length;
  const sizeOf = (nums) => round3(nums.reduce((p, x) => p * Math.abs(x), 1));
  // A times worked the half-turn way: the sizes multiplied, then one half-turn for each minus sign.
  const byTurns = (nums) => turned(sizeOf(nums), minusCount(nums));
  // An answer written on a button: 'a × b' worked by half-turns, 'a + (b)' by steps along the line.
  function worth(s) {
    const t = /^(−?\d+(?:\.\d+)?) × (−?\d+(?:\.\d+)?)$/.exec(s), p = /^(−?\d+) \+ \((−?\d+)\)$/.exec(s);
    if (t) return byTurns([value(t[1]), value(t[2])]);
    if (p) return stepBy(value(p[1]), value(p[2]));
    return value(s);
  }
  // The answer a step asks for, worked by its rule.
  function answerOf(d) {
    if (d.kind === 'lots') return lotsOf(d.by, d.of).at;
    if (d.kind === 'pattern') return patternAt(d.ask, d.of, d.rows[0]);
    if (d.kind === 'turns') return turned(d.size, d.want);
    if (d.kind === 'add') return stepBy(d.from, d.add);
    if (d.kind === 'times') return byTurns(d.nums);
    if (d.kind === 'which') return d.opts.filter((o) => same(worth(o), d.target)).join();
    return null;
  }

  // n: the half-turns Dan has given (the one turning included); queued: taps waiting for it to finish.
  function blank(i) {
    return { n: 0, queued: 0, glide: null, pick: null, res: null, why: false };
  }
  // Nothing to check yet: says what to do first ('' when there is something to check).
  function emptyFor(i, st) {
    const d = STEPS[i];
    if (d.kind === 'turns') return st.n + st.queued === 0 ? d.empty : '';
    return st.pick == null ? PICK : '';
  }
  const isEmpty = (i, st) => !!emptyFor(i, st);
  function isRight(i, st) {
    const d = STEPS[i];
    if (isEmpty(i, st)) return false;
    if (d.kind === 'turns') return st.n === d.want;
    return st.pick === d.want;
  }
  // A wrong answer's hint names its slip: for the turns, how many half-turns were given.
  function hintFor(i, st) {
    const d = STEPS[i];
    if (d.kind === 'turns') return d.turnHints[st.n] || d.hint;
    return (d.hints && d.hints[st.pick]) || d.hint;
  }
  // A step answered right (the timing check draws each one this way).
  function solved(i) {
    const d = STEPS[i], st = blank(i);
    if (d.kind === 'turns') st.n = d.want;
    else st.pick = d.want;
    st.res = 'right';
    return st;
  }

  let S = STEPS.map((d, i) => blank(i));
  let finished = false, lastStep = -1, lastDone = false, T = Infinity;   // T: seconds into the current motion
  let motion = null, motionEnd = 0;                                      // what is moving: 'demo', 'fb' or 'turn'

  // ---------- text with amber key terms (built with K.el, never innerHTML) ----------

  const nav = document.getElementById('nav');

  function restart() {

    const gone = st.n;
    st.n = 0; st.queued = 0;
    glide(st, gone % 2 ? 180 : 0, 0, BACK, gone);

    K.button({ label: 'Start again', secondary: true, into: '#turnrow', press: restart })];

  } });

  } });

  // gives the arrow, from its start; with reduced motion (and while the self-test looks) it opens finished.
  const anim = K.anim({ button: false, label: 'Demonstration', step: (dt) => {
    if (finished) return false;

      part(ins[k], 6, () => {
        if (k === 0) add(K.svg('path', { class: 'mini', transform: 'translate(' + (x + 16) + ' ' + (yb - 5) + ') scale(0.55)',
          d: 'M0 -18 L6.93 -4 A8 8 0 1 1 -6.93 -4 Z' }));

  const turnCardBox = () => { const w = Math.max.apply(null, TURN_RULES.map((s) => tw(s, 'rule'))) + 22; return { x: 336 - w, w: w, y: 4, h: 8 + 18 * TURN_RULES.length }; };

  }
  const turnRuleSaid = ' Beside it, the rule: times minus 1 is a half-turn; an even count of minus signs gives a positive answer, an odd count a negative one.';
  const ruleSaid = ' Beside it, the rule: facing up means add, a positive number steps forwards and a negative number steps backwards; the adding and the backwards lines are highlighted.';
  // A hop beside the line, from value a to b, bulging `bulge` units, grown as far as e.
  function hop(sc, a, b, e, bulge) {

      const dx = -2 * d, dy = y2 - ym, len = Math.hypot(dx, dy) || 1, ux = dx / len, uy = dy / len;

  // --- the arrow from zero, and its half-turns ---

  // Half-turn k (1, 2, …) of an arrow r units long: a curved arrow beside the line, 12 units further

  function trail(sc, r, k, e) {

    const p0 = tip(sc, R, a0), p1 = tip(sc, R, a1);
    grown('trail', 'M' + p0.x.toFixed(2) + ' ' + p0.y.toFixed(2) + ' A' + R + ' ' + R + ' 0 0 ' + (down ? 1 : 0) + ' ' + p1.x.toFixed(2) + ' ' + p1.y.toFixed(2), e);
    // its head, along the way it turns, fading in over the turn's second half so it never pops in
    part(e >= 1 ? 1 : K.clamp((e - 0.4) / 0.6, 0, 1), 0, () => {

  // How many half-turns so far, beside the outermost curved arrow, level with zero.

  const turnsWord = (n) => (n === 1 ? 'one half-turn' : n === 2 ? 'two half-turns' : n === 3 ? 'three half-turns' : n + ' half-turns');

  // --- the demonstrations (SHOW steps), drawn at time T ---
  // 3 × −4: the marker on 0, facing up, adds three lots of −4, each a hop of 4 backwards, to −12.
  function demoLots() {
    const A = AT.lots, sc = scaleOf(LAY.lots), mk = arr(A.mk), hl = arr(A.hl, HL), cd = arr(A.card);
    upright(sc);

    const w = lotsHops(sc, A.by, A.of, A.hops, A.hop);

      (cd >= 0.5 ? ruleSaid : '') + (done >= 0.5 ? ' It lands on minus 12: minus 4 plus minus 4 plus minus 4, so 3 times minus 4 equals minus 12.' : '');

  // The rows 3 × −4 = −12 down to 0 × −4 = 0, each answer 4 higher up the line than the one before.
  function demoPattern() {

  // The rows carry on past zero: −1 × −4 = 4, −2 × −4 = 8 and −3 × −4 = 12, still 4 higher each row.

    rows(sc, A.of, A.rows[0], items);

  // An arrow from zero to 4; times −1 turns it half a turn about zero, to −4, and a second half-turn brings it back.
  function demoTurn() {

    const t1 = arr(A.turns[0], A.turn), t2 = arr(A.turns[1], A.turn), out1 = arr(A.turns[0], LABEL), out2 = arr(A.turns[1], LABEL);
    const in1 = arr(A.lab1, LABEL), in2 = arr(A.lab2, LABEL), s1 = arr(A.sum1), s2 = arr(A.sum2), cd = arr(A.card);
    const up = Math.min(1, mk * (1 - out1) + in2), down = in1 * (1 - out2);
    upright(sc, [{ v: A.v, a: up }, { v: -A.v, a: down }]);

    part(in2, 6, () => turnLabel(sc, r, 2));

      (s1 >= 0.5 ? ' 4 times minus 1 equals minus 4.' : '') + (s2 >= 0.5 ? ' 4 times minus 1 times minus 1 equals 4.' : '') + (cd >= 0.5 ? turnRuleSaid : '');
  }

  // --- the puzzles (DO steps); after a right answer their motion runs on the same clock T ---
  // Lots added with the marker: a right answer hops it down one lot at a time, tags the landing and fills in the sum.
  function drawLots(d, st, right) {
    const L = LAY[d.lay], sc = scaleOf(L), F = d.at, ans = answerOf(d);
    upright(sc);
    card([1, 1, 1], [1, 0, 1]);
    const w = lotsHops(sc, d.by, d.of, right ? F.hops : null, F.hop);
    marker(sc, w.v, 0, 1);
    const done = right ? arr(F.tag) : 0;

      (done >= 0.5 ? ' ' + say(d.by + ' × ' + fmt(d.of) + ' = ' + fmt(ans)) + '.' : ' Below, ' + say(d.by + ' × ' + fmt(d.of)) + ' equals an empty box.');

  // A pattern to carry on: its rows so far; a right answer hops on up the line, row by row, and fills the slot.

    upright(sc);

      ? { m: m, h: arr(F.hops[k], F.hop), c: arr(F.hops[k] + F.hop / 2, CNT), a: arr(F.hops[k] + F.hop) } : { m: m, h: 0, c: 0, a: 0 })));
    rows(sc, d.of, top, items);
    const done = right ? arr(F.tag) : 0;
    sumAt(fmt(d.ask) + ' × ' + fmt(d.of) + ' =', fmt(ans), done);
    const shown = d.rows.concat(more).filter((m, k) => items[k].a >= 0.5);
    return lineSaid(L) + ' Beside it, rows level with their answers, each ' + fmt(-d.of) + ' higher up the line than the one before: ' + rowsSaid(d.of, top, shown) + '.' +
      (done >= 0.5 ? '' : ' Below, ' + say(fmt(d.ask) + ' × ' + fmt(d.of)) + ' equals an empty box.');
  }
  // The arrow Dan turns, from 3 × 4 = 12: each half-turn swings it about zero and leaves a curved arrow.
  function drawTurns(d, st, right) {
    const i = STEPS.indexOf(d), L = LAY[d.lay], sc = scaleOf(L), now = turnNow(i), r = d.size * sc.k, F = d.at;
    const turning = now.live && !now.gone, moving = turning && now.e < 1, landed = turning ? K.arrive(T, now.t1, LABEL) : 1, off = turning ? K.arrive(T, now.t0, 0.25) : 1;
    const v = turned(d.size, st.n), was = turned(d.size, st.n - 1), old = now.gone ? turned(d.size, now.gone) : v, kept = same(old, v);

    // only once the old value has gone, so the two never show at once.

    if (turning) readings = [{ v: was, a: 1 - landed }, { v: v, a: off }];
    else if (now.gone && !kept) readings = [{ v: old, a: 1 - K.arrive(T, now.t1, LABEL) }, { v: v, a: Math.min(1, 2 * now.e) }];

  // Adding with the marker: a right answer steps it backwards one step at a time, tags the landing and fills the slot.

  // A times worked by half-turns: a right answer grows the arrow to the sizes multiplied, then turns

  // The scene for a step (the animation calls this every frame).

  // ---------- known answers, worked out by hand ----------
  const DO = STEPS.map((d, i) => i).filter((i) => !STEPS[i].show);

    byTurns([-3, -2]) === 6 && patternAt(-3, -2, 2) === 6 && byTurns([3, 2]) > 0 && byTurns([3, -2]) < 0 && byTurns([-3, 2]) < 0 &&

  K.check('A half-turn about zero takes the tip of the arrow to 4 round to −4 on the line, and a second brings it back to 4; turning once for each minus sign, −3 × −4 = 12, −2 × −3 × −4 = −24 and −5 × −3 = 15, as ordinary arithmetic gives, and every row of the pattern agrees', () => {
