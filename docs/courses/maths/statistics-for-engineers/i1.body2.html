<p class="caption">Simulated readings: true value plus random error times twelve nudges, read to 0.01 Ω. Puzzle readings are examples.</p>

<script>
  // ==== Beads: the shared language (dataviz.md, "Copy this code"). Paste unchanged. ====
  const B = (() => {
    const B = {}, lerp = (a, b, t) => a + (b - a) * t, c01 = (v) => Math.max(0, Math.min(1, v)); B.lerp = lerp; B.c01 = c01; B.r2 = (v) => Math.round(v * 100) / 100;
    // The rule. Seeded, so every picture and check is stable; a fresh batch is the next seed.
    B.rng = (seed) => { let a = (Math.imul(seed | 0, 7919) + 104729) >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; };
    // n readings × 12 nudges in −½..+½: twelve sum to SD exactly 1, so sd × B.sum(u) is an error of SD sd; B.sum(u, row) is a bead after `row` rows of pegs.
    // A second string of readings takes rows n..2n−1 of B.nudges(seed, 2n), never reading i's own: two strings share only what the rule gives them both.
    B.nudges = (seed, n) => { const r = B.rng(seed); return Array.from({ length: n }, () => Array.from({ length: 12 }, () => r() - 0.5)); };
    B.sum = (u, upto) => { let s = 0; for (let j = 0; j < (upto == null ? u.length : upto); j++) s += u[j]; return s; };
    B.uni = (seed, n) => { const r = B.rng(seed); return Array.from({ length: n }, () => 1 - r()); };   // in (0, 1]: a lifetime is −ln(u) / rate
    B.round = (v, res) => +(Math.round(v / res) * res).toFixed(9);
    B.stats = (vs) => { const n = vs.length; if (!n) return null; let m = 0, q = 0; vs.forEach((v) => { m += v / n; }); vs.forEach((v) => { q += (v - m) * (v - m); });
      const s = vs.slice().sort((a, b) => a - b); return { n, m, sd: n > 1 ? Math.sqrt(q / (n - 1)) : 0, med: n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2, lo: s[0], hi: s[n - 1] }; };
    B.within = (vs, m, sd, z) => vs.filter((v) => Math.abs(v - m) <= z * sd * (1 + 1e-9)).length;
    B.fit = (pts) => { const n = pts.length; if (n < 2) return null; let mx = 0, my = 0, sxx = 0, sxy = 0, rr = 0; pts.forEach((p) => { mx += p[0] / n; my += p[1] / n; });
      pts.forEach((p) => { sxx += (p[0] - mx) * (p[0] - mx); sxy += (p[0] - mx) * (p[1] - my); }); const b = sxx ? sxy / sxx : 0;
      pts.forEach((p) => { rr += Math.pow(p[1] - my - b * (p[0] - mx), 2); }); return { b, mx, my, at: (x) => my + b * (x - mx), res: n > 2 ? Math.sqrt(rr / (n - 2)) : 0 }; };
    // How closely two strings of readings move together: +1 a rising line, −1 a falling one, 0 no line at all.
    B.corr = (xs, ys) => { const n = xs.length; let mx = 0, my = 0, sxy = 0, sxx = 0, syy = 0; xs.forEach((x, i) => { mx += x / n; my += ys[i] / n; });
      xs.forEach((x, i) => { sxy += (x - mx) * (ys[i] - my); sxx += (x - mx) * (x - mx); syy += (ys[i] - my) * (ys[i] - my); }); return sxx > 0 && syy > 0 ? sxy / Math.sqrt(sxx * syy) : 0; };
    // A lifetime from a sketched hazard: the t at which the total hazard H(t) reaches −ln u, by halving; Infinity past tmax.
    B.lifeFrom = (H, u, tmax) => { const goal = -Math.log(u); if (!(H(tmax) >= goal)) return Infinity; let a = 0, b = tmax; for (let k = 0; k < 44; k++) { const m = (a + b) / 2; if (H(m) < goal) a = m; else b = m; } return (a + b) / 2; };
    // What the rule expects a column `bin` wide centred on t to hold, from its survival R (R(0) = 1): n × (R(t − bin/2) − R(t + bin/2)).
    B.colExpect = (R, n, bin) => (t) => n * (R(Math.max(0, t - bin / 2)) - R(Math.max(0, t + bin / 2)));
    // Columns one bin wide: lo, hi the end columns' centres, drawn a0 → a1. col(v) clamps; a value on an edge goes up; off(v) is −1 or +1 past an end.
    B.scale = (lo, hi, bin, a0, a1) => { const n = Math.round((hi - lo) / bin) + 1, w = (a1 - a0) / n, col = (v) => Math.max(0, Math.min(n - 1, Math.round((v - lo) / bin + 1e-7)));
      return { lo, hi, bin, n, w, a0, a1, col, mid: (c) => a0 + (c + 0.5) * w, at: (v) => a0 + ((v - lo) / bin + 0.5) * w, val: (x) => lo + ((x - a0) / w - 0.5) * bin, off: (v) => (v < lo - bin / 2 ? -1 : v > hi + bin / 2 ? 1 : 0) }; };
    // Columns of equal ratio, `steps` to a decade, for readings that spread by a factor (insulation resistance). Takes and gives plain values.
    B.logScale = (lo, hi, steps, a0, a1) => { const L = Math.log10, s = B.scale(L(lo), L(hi), 1 / steps, a0, a1);
      return Object.assign({}, s, { lo, hi, log: true, col: (v) => s.col(L(v)), at: (v) => s.at(L(v)), val: (x) => Math.pow(10, s.val(x)), off: (v) => s.off(L(v)) }); };
    // A scale with no columns, for a view that zooms or a strip of a time view: v0..v1 drawn a0 → a1; w is one bin's length on it.
    B.lin = (v0, v1, a0, a1, bin) => { const k = (a1 - a0) / (v1 - v0); return { lo: v0, hi: v1, bin, w: k * bin, a0, a1, at: (v) => a0 + (v - v0) * k, val: (x) => v0 + (x - a0) / k }; };
    // Beads are sized once, for the narrowest pile the controls allow: B.peak, about its tallest stack (expected peak plus its root); B.fitPile, the bead.
    B.peak = (n, bin, sd) => { const x = Math.min(2, bin / sd), t = Math.min(n, n * x * 0.3989 * (1 - x * x / 24)); return t + Math.sqrt(t); };
    B.fitPile = (tall, room, colW, rmax) => { const r = Math.min(rmax, Math.abs(colW) / 2 - 0.6, (room / Math.max(1, tall) - 1) / 2); return { r, pitch: 2 * r + 1 }; };
    // The pile on the beam at y base, earlier readings lower, `per` across a wide column; readings past an end on top; a batch too tall shrinks every bead.
    B.stack = (vs, sc, base, top, fit) => { const per = Math.max(1, Math.floor((Math.abs(sc.w) + 1) / fit.pitch)), cnt = {}, idx = [];
      vs.map((v, i) => i).sort((a, b) => (sc.off(vs[a]) ? 1 : 0) - (sc.off(vs[b]) ? 1 : 0) || a - b).forEach((i) => { const c = sc.col(vs[i]); cnt[c] = (cnt[c] || 0) + 1; idx[i] = cnt[c] - 1; });
      const tall = Math.max(1, ...Object.values(cnt).map((k) => Math.ceil(k / per))), pitch = Math.min(fit.pitch, (base - 1.5 - top) / tall), r = Math.min(fit.r, (pitch - 1) / 2);
      return { r, tall, pitch, per, base, cnt, pos: vs.map((v, i) => { const c = sc.col(v), lay = Math.floor(idx[i] / per), row = Math.min(per, cnt[c] - lay * per);
        return { x: sc.mid(c) + (idx[i] % per - (row - 1) / 2) * pitch, y: base - 1.5 - r - lay * pitch, r }; }) }; };
    // In the order taken: reading i across from x0 to x1, its value up the page on scale sv.
    B.run = (vs, sv, x0, x1, r) => vs.map((v, i) => ({ x: lerp(x0, x1, vs.length > 1 ? i / (vs.length - 1) : 0.5), y: sv.at(v), r }));
    // A pile place turned u of the way onto its side about (x0, y0) sliding to (x1, y1): value up the page (k), stacks leftwards (kh); at u = 1, level with B.run.
    B.tip = (p, u, A) => { const th = u * Math.PI / 2, c = Math.cos(th), s = Math.sin(th), k = lerp(1, A.k, u), kh = lerp(1, A.kh, u), dx = p.x - A.x0, dh = A.y0 - p.y;
      return { x: lerp(A.x0, A.x1, u) + k * dx * c - kh * dh * s, y: lerp(A.y0, A.y1, u) - k * dx * s - kh * dh * c, r: p.r * lerp(1, Math.min(A.k, A.kh), u) }; };
    B.anchor = (st, sc, sv, ref, spine, room) => { let h = 1; st.pos.forEach((p) => { h = Math.max(h, st.base - p.y + p.r); }); const k = Math.abs(sv.w / sc.w);
      return { x0: sc.at(ref), y0: st.base, x1: spine, y1: sv.at(ref), k, kh: Math.min(k, room / h) }; };
    // Two strings over time folded into one against the other, u 0..1: a and b are reading i's places in their strips, f the pair's place once folded.
    // First the time axis becomes a's scale (both slide across), then b's strip stretches to full height and a drops onto its partner.
    B.fold = (a, b, f, u) => { const ux = K.ease(c01(2 * u)), uy = K.ease(c01(2 * u - 1)), x = lerp(a.x, f.x, ux), q = { x: lerp(b.x, f.x, ux), y: lerp(b.y, f.y, uy), r: lerp(b.r, f.r, uy) };
      return [uy > 0 ? B.hop({ x, y: a.y, r: a.r }, q, uy, 12, (v) => v) : { x, y: a.y, r: a.r }, q]; };
    // Timings (s) every lesson shares: a pour releases a bead every dt; a fresh batch re-sorts one every hop; a fold takes `fold`.
    B.T = { dt: 0.045, hop: 0.028, field: 0.5, fly: 0.5, settle: 0.45, bounce: 0.24, peel: 0.025, tip: 0.8, fold: 1.6, g: 1600 };
    // Release times from t0: one every dt; slow, the first few one at a time so each can be read, then pouring.
    B.releases = (n, t0, slow) => { const out = []; let t = t0; for (let i = 0; i < n; i++) { out.push(t); t += slow ? Math.max(B.T.dt, 0.32 * Math.pow(0.68, i)) : B.T.dt; } return out; };
    B.bounce = (tc) => (tc < 0 ? 0 : tc < 0.15 ? 4.5 * Math.sin(Math.PI * tc / 0.15) : tc < B.T.bounce ? 1.3 * Math.sin(Math.PI * (tc - 0.15) / (B.T.bounce - 0.15)) : 0); const fallT = (d, v0) => (-v0 + Math.sqrt(v0 * v0 + 2 * B.T.g * Math.max(2, d))) / B.T.g;
    // A bead released at rel jinks down the field (y0..y1) through its nudges, xAt(row) for row 0..12, falls onto p, bounces twice; tc = s since landing.
    B.pour = (T, rel, xAt, p, y0, y1) => { const tau = T - rel, F = B.T.field, v0 = (y1 - y0) / F; if (tau < 0) return null;
      if (tau < F) { const f = 12 * tau / F, row = Math.min(11, Math.floor(f)); return { x: lerp(xAt(row), xAt(row + 1), K.ease(f - row)), y: lerp(y0, y1, tau / F), r: p.r, a: c01(tau / 0.08) }; }
      const tf = tau - F, tb = fallT(p.y - y1, v0); if (tf < tb) return { x: lerp(xAt(12), p.x, K.ease(tf / tb)), y: Math.min(p.y, y1 + v0 * tf + B.T.g * tf * tf / 2), r: p.r, a: 1 };
      return { x: p.x, y: p.y - B.bounce(tf - tb), r: p.r, a: 1, tc: tf - tb }; }; B.landed = (rel, p, y0, y1) => rel + B.T.field + fallT(p.y - y1, (y1 - y0) / B.T.field);
    // Dropped from rest at a onto b (a unit leaving a shelf), tau s after the drop: falls, lands, bounces.
    B.fall = (a, b, tau) => { const tb = fallT(b.y - a.y, 0); if (tau < tb) return { x: lerp(a.x, b.x, K.ease(tau / tb)), y: Math.min(b.y, a.y + B.T.g * tau * tau / 2), r: lerp(a.r, b.r, tau / tb), a: 1 };
      return { x: b.x, y: b.y - B.bounce(tau - tb), r: b.r, a: 1, tc: tau - tb }; };
    // From a to b, q of the way, on an arc `lift` high (landing with the bounce); ease K.ease to travel, B.backOut to settle with a 6% overshoot.

    const i = at();
    if (finished || (!STEPS[i].show && S[i].res !== 'right')) return;
    if (i < STEPS.length - 1) { stepper.set(i + 1, true); return; }
    finished = true; anim.pause();
    if (typeof K.complete === 'function') K.complete();
  } });
  K.button({ label: 'Start again', secondary: true, into: '#again', press: () => {
    S = STEPS.map(() => blank()); finished = false; lastStep = -1; stepper.set(0, true);
  } });

  function startDemo(i) {
    const d = STEPS[i];
    SP.f.init = false;
    if (d.view === 'big') { const D = bigLayout(S[i].spread, TRUE); MOT = makePour(D); B.aim(SP.fy, D.fy, true); play(MOT.end); }
    else { MOT = { kind: 'still' }; play(d.dur); }
    paint(i);
  }
  function enterStep(i) {
    const d = STEPS[i], st = S[i];
    lastStep = i; enter('stepbox');
    // The sliders open where this screen left them (quietly: this is not Dan moving them).
    if (Math.abs(ctl.spread.get() - st.spread) > 1e-9) ctl.spread.set(st.spread, true);
    if (Math.abs(ctl.probe.get() - st.probe) > 1e-9) ctl.probe.set(st.probe, true);
    trace = { i: -1, t: -1e9 };
    SPR.forEach((s) => { s.init = false; });
    MOT = { kind: 'still' }; anim.pause(); T = Infinity;
    if (d.show && d.dur) startDemo(i);
  }

  write(el('finish'), FINISH);
  K.update((p) => {
    const i = Math.round(p.step), d = STEPS[i], st = S[i];
    if (i !== lastStep) enterStep(i);
    else if (d.show && !finished && d.sliders) {
      let moved = false;
      d.sliders.forEach((id) => { const v = p[id]; if (typeof v === 'number' && Math.abs(v - st[id]) > 1e-9) { st[id] = v; moved = true; } });
      if (moved) settle();
    }
    if (finished !== lastDone) { lastDone = finished; enter(finished ? 'done' : 'stepbox'); }
    const right = st.res === 'right';
    el('stepbox').hidden = finished;
    el('done').hidden = !finished;
    el('count').textContent = 'Step ' + (i + 1) + ' of ' + STEPS.length;
    const task = el('task');
    task.className = 'task' + (d.show ? ' show' : '');
    write(task, d.show ? (d.after && st.spread < 0.0101 ? d.after : d.text) : d.task);
    svg.toggleAttribute('hidden', d.view === 'none');
    replayBtn.el.hidden = !d.show || !d.dur || REDUCE;
    el('replay').hidden = replayBtn.el.hidden;
    let anyCtl = false;
    Object.keys(ctl).forEach((id) => { const on = !finished && !!d.show && (d.sliders || []).indexOf(id) >= 0; ctl[id].el.hidden = !on; if (on) anyCtl = true; });
    el('ctl').hidden = !anyCtl;
    const tiles = d.show && !finished ? d.tiles || [] : [];
    Object.keys(R).forEach((k) => { R[k].el.hidden = tiles.indexOf(k) < 0; });
    el('outs').hidden = !tiles.length;
    const opts = d.show ? [] : d.opts || [];
    el('picks').hidden = !opts.length;
    el('picks').classList.toggle('long', opts.some((o) => o.length > 9));
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      b.setLabel(opts[k]);
      b.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });
    el('acts').hidden = !!d.show;
    checkBtn.el.hidden = right;
    const fb = el('fb');
    fb.hidden = !!d.show;
    fb.className = 'fb' + (right ? ' right' : st.res === 'wrong' ? ' wrong' : '');
    write(fb, d.show ? '' : right ? 'That\'s it.' : st.res === 'wrong' ? hintFor(i, st) : st.res === 'empty' ? PICK : '');
    const why = el('why');
    why.hidden = d.show || !st.why;
    write(why, d.show ? '' : d.why);
    whyBtn.setLabel(st.why ? 'Hide why' : 'Why?');
    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !right);
    nextBtn.setLabel(i === STEPS.length - 1 ? 'Finish' : 'Continue');
    el('nav').hidden = backBtn.el.hidden && nextBtn.el.hidden;
    paint(i);
  });

  // ---------- known answers, worked out by hand ----------
  // A step painted in the state given, settled: what it draws.
  function drawnAt(i, patch) {
    const keepS = S[i], keepT = T, keepTr = trace;
    S[i] = Object.assign({}, keepS, patch); T = Infinity; FORCE = true;
    try { paint(i); return Object.assign({}, REC); }
    finally { S[i] = keepS; T = keepT; trace = keepTr; FORCE = false; paint(); }
  }
  K.check('Extreme values in the tails distort the mean but not the median, since the median is based on ranks: slipping the ringed reading off the top of the scale lifts the mean of the fifty by a fiftieth of the slip and moves the median by half a meter step at most, at every random error', () =>
    SPREADS.every((sp) => { const a = B.stats(readings(sp, TRUE)), b = B.stats(readings(sp, 1.8)); return near(b.m - a.m, 1 / N, 1e-9) && Math.abs(b.med - a.med) <= RES / 2 + 1e-9; }), { source: SRC1 });
  K.check('From every raw data value, subtract the mean, square the results, average them over one fewer than the count and then take the square root: every SD worked on screen follows that recipe line by line and agrees with the standard deviation of its readings', () =>
    [W1, W2, PA, PB, BUMPY, FLAT, CIRCUITS, REPEAT].every((vs) => near(workOf(vs).sd, B.stats(vs).sd, 1e-6)), { source: SRC2 });
  K.check('Worked by hand: 0.79, 0.80, 0.80, 0.81 and 0.85 Ω add to 4.05 Ω and balance at 0.81 Ω, with 0.04 Ω of distance each side; nine readings of 0.50 Ω and one of 1.50 Ω have a mean of 0.60 Ω and a median of 0.50 Ω; 0.77 to 0.82 Ω give squares adding to 0.0016, then 0.0004 and an SD of 0.02 Ω; 0.75 to 0.83 Ω give 0.0036, 0.0009 and 0.03 Ω; piles A and B both span 0.08 Ω with SDs of 0.028 and 0.040 Ω; the bumpy and flat piles 0.016 and 0.035 Ω; the ten circuits a mean of 0.62 Ω and an SD of 0.13 Ω', () => {
    const s1 = B.stats(FIVE1), below = FIVE1.filter((v) => v < 0.81).reduce((a, v) => a + 0.81 - v, 0), above = FIVE1.filter((v) => v > 0.81).reduce((a, v) => a + v - 0.81, 0);
    const s3 = B.stats(SLIP10), w1 = workOf(W1), w2 = workOf(W2), a = B.stats(PA), b = B.stats(PB), bu = B.stats(BUMPY), fl = B.stats(FLAT), c = B.stats(CIRCUITS);
    return near(FIVE1.reduce((x, v) => x + v, 0), 4.05, 1e-9) && near(s1.m, 0.81, 1e-9) && near(below, 0.04, 1e-9) && near(above, 0.04, 1e-9)
      && near(s3.m, 0.6, 1e-9) && near(s3.med, 0.5, 1e-9) && near(w1.tot, 0.0016, 1e-9) && near(w1.vr, 0.0004, 1e-9) && near(w1.sd, 0.02, 1e-9)
      && near(w2.tot, 0.0036, 1e-9) && near(w2.vr, 0.0009, 1e-9) && near(w2.sd, 0.03, 1e-9) && near(a.hi - a.lo, 0.08, 1e-9) && near(b.hi - b.lo, 0.08, 1e-9)
      && near(a.sd, 0.028, 0.0005) && near(b.sd, 0.04, 1e-9) && near(bu.sd, 0.016, 0.0005) && near(fl.sd, 0.035, 0.0005) && near(c.m, 0.62, 1e-9) && near(c.sd, 0.13, 0.001);
  });
  K.check('The rule on screen: twelve nudges of −½ to +½ add to an error of SD 1, within 2% over 20,000 simulated readings; halving the random error from 0.02 to 0.01 Ω takes the fifty from 10 columns to 5 and their tallest stack from 11 to 20 beads, nearly twice, with the mean within 0.002 Ω of 0.80 Ω both times', () => {
    const many = B.nudges(7, 20000).map((u) => B.sum(u)), m = many.reduce((a, v) => a + v, 0) / many.length, sd = Math.sqrt(many.reduce((a, v) => a + (v - m) * (v - m), 0) / (many.length - 1));
    const a = bigLayout(0.02, TRUE), b = bigLayout(0.01, TRUE);
    return near(sd, 1, 0.02) && a.cols === 10 && a.tall === 11 && b.cols === 5 && b.tall === 20 && near(a.s.m, TRUE, 0.002) && near(b.s.m, TRUE, 0.002);
  });
  K.check('A slipped probe: with the ringed reading at 1.80 Ω, 1.00 Ω too high, the mean of the fifty is exactly 0.02 Ω higher and the SD jumps to about 0.14 Ω, at a random error of 0.02 Ω and of 0.01 Ω; honest, the SD comes out close to the random error', () =>
    [0.01, 0.02].every((sp) => { const h = B.stats(readings(sp, TRUE)), s = B.stats(readings(sp, 1.8)); return near(h.sd, sp, 0.0015) && near(s.sd, 0.14, 0.006) && near(s.m - h.m, 0.02, 1e-9); }));
  K.check('Drawn right: settled, the fulcrum sits exactly under the mean and the beam is level at every random error, honest or slipped; a slipped reading past the scale sits on its end column with an arrow, never clipped; no bead of the fifty is drawn smaller than r 3.5; each puzzle\'s fulcrum lands where its pick puts it', () => {
    let ok = true;
    SPREADS.forEach((sp) => [TRUE, 1.8].forEach((pr) => {
      const r = drawnAt(8, { spread: sp, probe: pr });
      ok = ok && Math.abs(r.theta) < 1e-6 && Math.abs(r.fx - r.xm) < 1e-6 && r.rmin >= 3.5 && (pr < 1 ? !r.off : r.off && r.ringX >= XEND - 1);
    }));
    [1, 3].forEach((i) => STEPS[i].opts.forEach((o) => {
      const r = drawnAt(i, { pick: o, res: o === STEPS[i].want ? 'right' : 'wrong' }), x = smallLayout(i).sc.at(STEPS[i].claim[o].m);
      ok = ok && Math.abs(r.fx - x) < 1e-6 && (o === STEPS[i].want ? Math.abs(r.theta) < 1e-6 : Math.abs(r.theta) > 0.5 || STEPS[i].claim[o].m === STEPS[i].claim[STEPS[i].want].m);
    }));
    return ok;
  });
  K.check('Each puzzle accepts only its right answer, and before an answer nothing in its picture gives it away: no fulcrum where the balance point is asked, no worked rows where the SD is asked, no SD brackets where spreads are compared, no rings on the far beads', () =>
    STEPS.every((d, i) => d.show || d.opts.filter((o) => o === d.want).length === 1) && [1, 3, 5, 7, 9, 11].every((i) => {
      const r = drawnAt(i, { pick: null, res: null });
      return (i === 1 || i === 3 ? !r.fulcrum : true) && !r.rows && !r.sd && !r.rings;
    }));
  K.check('Every demonstration has finished arriving within 4.5 s of its screen opening, none starting before the 0.35 s screen fade ends, and every answer\'s motion within 2.5 s', () => {
    const P = makePour(bigLayout(0.02, TRUE));
    return P.end <= 4.5 && P.rel[0] >= FADE && STEPS.every((d) => !d.dur || d.dur <= 4.5) && rowsEnd(RT_SHOW) <= STEPS[6].dur && RT_SHOW.r0 >= FADE
      && rowsEnd(RT_FAST) <= 2.5 && ANSWER <= 2.5 && 3.4 + 0.5 <= STEPS[10].dur;
  });

  K.ready();
</script>
