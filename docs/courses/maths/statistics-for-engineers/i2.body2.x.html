<p class="caption" id="cap">Simulated: the true value, plus any offset, plus 0.04 V times twelve nudges added, read to the meter's step.</p>

<script>
  // ==== Beads: the shared language (dataviz.md, "Copy this code"). Paste unchanged. ====
  const B = (() => { const B = {}, lerp = (a, b, t) => a + (b - a) * t, c01 = (v) => Math.max(0, Math.min(1, v)); B.lerp = lerp; B.c01 = c01; B.r2 = (v) => Math.round(v * 100) / 100;
    // The rule. Seeded, so every picture and check is stable; a fresh batch is the next seed.
    B.rng = (seed) => { let a = (Math.imul(seed | 0, 7919) + 104729) >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; };
    // n readings × 12 nudges in −½..+½: twelve sum to SD exactly 1, so sd × B.sum(u) is an error of SD sd; B.sum(u, row) is a bead after `row` rows of pegs.
    // A second string of readings takes rows n..2n−1 of B.nudges(seed, 2n), never reading i's own: two strings share only what the rule gives them both.
    B.nudges = (seed, n) => { const r = B.rng(seed); return Array.from({ length: n }, () => Array.from({ length: 12 }, () => r() - 0.5)); }; B.sum = (u, upto) => { let s = 0; for (let j = 0; j < (upto == null ? u.length : upto); j++) s += u[j]; return s; };
    B.uni = (seed, n) => { const r = B.rng(seed); return Array.from({ length: n }, () => 1 - r()); };   // in (0, 1]: a lifetime is −ln(u) / rate
    B.round = (v, res) => +(Math.round(v / res) * res).toFixed(9); B.stats = (vs) => { const n = vs.length; if (!n) return null; let m = 0, q = 0; vs.forEach((v) => { m += v / n; }); vs.forEach((v) => { q += (v - m) * (v - m); });
      const s = vs.slice().sort((a, b) => a - b); return { n, m, sd: n > 1 ? Math.sqrt(q / (n - 1)) : 0, med: n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2, lo: s[0], hi: s[n - 1] }; }; B.within = (vs, m, sd, z) => vs.filter((v) => Math.abs(v - m) <= z * sd * (1 + 1e-9)).length;
    B.fit = (pts) => { const n = pts.length; if (n < 2) return null; let mx = 0, my = 0, sxx = 0, sxy = 0, rr = 0; pts.forEach((p) => { mx += p[0] / n; my += p[1] / n; }); pts.forEach((p) => { sxx += (p[0] - mx) * (p[0] - mx); sxy += (p[0] - mx) * (p[1] - my); }); const b = sxx ? sxy / sxx : 0;
      pts.forEach((p) => { rr += Math.pow(p[1] - my - b * (p[0] - mx), 2); }); return { b, mx, my, at: (x) => my + b * (x - mx), res: n > 2 ? Math.sqrt(rr / (n - 2)) : 0 }; };
    /* How closely two strings move together: +1 a rising line, −1 a falling one, 0 no line at all. */ B.corr = (xs, ys) => { const n = xs.length; let mx = 0, my = 0, sxy = 0, sxx = 0, syy = 0; xs.forEach((x, i) => { mx += x / n; my += ys[i] / n; });
      xs.forEach((x, i) => { sxy += (x - mx) * (ys[i] - my); sxx += (x - mx) * (x - mx); syy += (ys[i] - my) * (ys[i] - my); }); return sxx > 0 && syy > 0 ? sxy / Math.sqrt(sxx * syy) : 0; };
    // A lifetime from a sketched hazard: the t at which the total hazard H(t) reaches −ln u, by halving; Infinity past tmax. A column's expected count from R.
    B.lifeFrom = (H, u, tmax) => { const goal = -Math.log(u); if (!(H(tmax) >= goal)) return Infinity; let a = 0, b = tmax; for (let k = 0; k < 44; k++) { const m = (a + b) / 2; if (H(m) < goal) a = m; else b = m; } return (a + b) / 2; };
    B.colExpect = (R, n, bin) => (t) => n * (R(Math.max(0, t - bin / 2)) - R(Math.max(0, t + bin / 2)));
    // Columns one bin wide: lo, hi the end columns' centres, drawn a0 → a1. col(v) clamps; a value on an edge goes up; off(v) is −1 or +1 past an end.
    B.scale = (lo, hi, bin, a0, a1) => { const n = Math.round((hi - lo) / bin) + 1, w = (a1 - a0) / n, col = (v) => Math.max(0, Math.min(n - 1, Math.round((v - lo) / bin + 1e-7)));
      return { lo, hi, bin, n, w, a0, a1, col, mid: (c) => a0 + (c + 0.5) * w, at: (v) => a0 + ((v - lo) / bin + 0.5) * w, val: (x) => lo + ((x - a0) / w - 0.5) * bin, off: (v) => (v < lo - bin / 2 ? -1 : v > hi + bin / 2 ? 1 : 0) }; };

    B.logScale = (lo, hi, steps, a0, a1) => { const L = Math.log10, s = B.scale(L(lo), L(hi), 1 / steps, a0, a1); return Object.assign({}, s, { lo, hi, log: true, col: (v) => s.col(L(v)), at: (v) => s.at(L(v)), val: (x) => Math.pow(10, s.val(x)), off: (v) => s.off(L(v)) }); };

    /* The pile on the beam at y base, earlier readings lower, `per` across a wide column; readings past an end on top; a batch too tall shrinks every bead. */ B.stack = (vs, sc, base, top, fit) => { const per = Math.max(1, Math.floor((Math.abs(sc.w) + 1) / fit.pitch)), cnt = {}, idx = [];
      vs.map((v, i) => i).sort((a, b) => (sc.off(vs[a]) ? 1 : 0) - (sc.off(vs[b]) ? 1 : 0) || a - b).forEach((i) => { const c = sc.col(vs[i]); cnt[c] = (cnt[c] || 0) + 1; idx[i] = cnt[c] - 1; });
      const tall = Math.max(1, ...Object.values(cnt).map((k) => Math.ceil(k / per))), pitch = Math.min(fit.pitch, (base - 1.5 - top) / tall), r = Math.min(fit.r, (pitch - 1) / 2);
      return { r, tall, pitch, per, base, cnt, pos: vs.map((v, i) => { const c = sc.col(v), lay = Math.floor(idx[i] / per), row = Math.min(per, cnt[c] - lay * per); return { x: sc.mid(c) + (idx[i] % per - (row - 1) / 2) * pitch, y: base - 1.5 - r - lay * pitch, r }; }) }; };

    // A pile place turned u of the way onto its side about (x0, y0) sliding to (x1, y1): value up the page (k), stacks leftwards (kh); at u = 1, level with B.run.
    B.tip = (p, u, A) => { const th = u * Math.PI / 2, c = Math.cos(th), s = Math.sin(th), k = lerp(1, A.k, u), kh = lerp(1, A.kh, u), dx = p.x - A.x0, dh = A.y0 - p.y;
      return { x: lerp(A.x0, A.x1, u) + k * dx * c - kh * dh * s, y: lerp(A.y0, A.y1, u) - k * dx * s - kh * dh * c, r: p.r * lerp(1, Math.min(A.k, A.kh), u) }; }; B.anchor = (st, sc, sv, ref, spine, room) => { let h = 1; st.pos.forEach((p) => { h = Math.max(h, st.base - p.y + p.r); }); const k = Math.abs(sv.w / sc.w);
      return { x0: sc.at(ref), y0: st.base, x1: spine, y1: sv.at(ref), k, kh: Math.min(k, room / h) }; };
    // Two strings over time folded into one against the other, u 0..1: a and b are reading i's places in their strips, f the pair's place once folded.
    B.fold = (a, b, f, u) => { const ux = K.ease(c01(2 * u)), uy = K.ease(c01(2 * u - 1)), x = lerp(a.x, f.x, ux), q = { x: lerp(b.x, f.x, ux), y: lerp(b.y, f.y, uy), r: lerp(b.r, f.r, uy) }; return [uy > 0 ? B.hop({ x, y: a.y, r: a.r }, q, uy, 12, (v) => v) : { x, y: a.y, r: a.r }, q]; };
    /* Timings (s) every lesson shares: a pour releases a bead every dt, each jinks `jink` high off every peg; a fresh batch re-sorts one every hop. */ B.T = { dt: 0.045, hop: 0.028, field: 0.5, fly: 0.5, settle: 0.45, bounce: 0.24, peel: 0.025, tip: 0.8, fold: 1.6, g: 1600, jink: 2 };
    B.releases = (n, t0, slow) => { const out = []; let t = t0; for (let i = 0; i < n; i++) { out.push(t); t += slow ? Math.max(B.T.dt, 0.32 * Math.pow(0.68, i)) : B.T.dt; } return out; };

      return { x: p.x, y: p.y - B.bounce(tf - tb), r: p.r, a: 1, tc: tf - tb }; }; B.landed = (rel, p, y0, y1) => rel + B.T.field + fallT(p.y - y1, (y1 - y0) / B.T.field);

    else { R.mean.set('none yet'); R.unc.set('none yet'); R.sd.set('none yet'); }
    let rmin = Infinity;
    drawn.forEach((q) => { if (q.a > 0.5) rmin = Math.min(rmin, q.r); });
    Object.assign(REC, { theta, fx, xm, rmin, off: L.vs.some((v) => sc.off(v)), n, res: +st.mres, pouring, fulcrum: fa > 0 });
  }

  // A meter reading on a scale in volts; after a right answer, 1% of it each side, then three digits more, then the whole range.
  function paintRating(i, d, st) {
    const right = st.got === 'right', T = M.Ts, sc = RSC, r = 5;

    FLOOR[0] = p.y; drawn[0] = p;

  }

  // A result against a maximum: the value marked, and after a right answer its bracket growing out across the limit.

  // The line under the picture: what is on screen now, cause then effect, in everyday words.
  function sayFor(i, d, st) {
    const L = d.view === 'pile' ? layout(+st.avg, st.off, +st.mres) : null;
    if (d.name === 'Fifty readings') {
      if (REC.pouring) return 'Readings are landing, and the fulcrum keeps sliding to the mean of those down so far.';
      return trace.i >= 0 ? 'That bead was nudged twelve times on its way down. It landed where its nudges added up to.' : 'Fifty readings of one steady voltage, each nudged differently. Most sit inside the bracket under the beam.';
    }
    if (d.name === 'Average a few') {
      if (st.avg === '4') return 'Four readings a bead. The pile is half as wide and taller, and it still centres on the true value.';
      if (st.avg === '2') return 'Two readings a bead. Their random errors partly cancel, so the pile narrows to about seven tenths of its width.';
      return st.avgMoved ? 'One reading a bead, so the pile is as wide as single readings scatter.' : 'Each bead is one reading for now. Will averaging move the pile, or only narrow it?';
    }
    if (d.name === 'The result') return 'The result is narrow because it pins down the mean of fifty. Single readings still spread across the wide bracket.';
    if (d.name === 'A coarser meter') {

      return st.mresMoved ? 'Back on the 0.01 V meter, each column is one step of 0.01 V.' : 'This meter reads to 0.01 V, so each column of the pile is one step.';

  function paint(i) {

  // ---------- Dan's moves ----------

    if (k < 0) return;

  });
  const pickBtns = [0, 1, 2].map((k) => K.button({ label: 'Answer ' + (k + 1), secondary: true, into: '#picks', press: () => {
    const i = at(), d = STEPS[i], st = S[i];

    const was = st.got === 'wrong';

    if (was) halt();
  } }));
  // A right answer brings in its working: a bracket grows, or the beads re-sort to the setting the answer names.
  function answer(i) {
    const d = STEPS[i], st = S[i];
    if (d.onRight) { Object.assign(st, d.onRight); M.enter(M.plan(M.arc(0.012, 20), 0, ARC_END + 0.6, {}, false)); }

  } });
  const whyBtn = K.button({ label: 'Why?', secondary: true, into: '#acts', press: () => {

    const st = S[at()]; st.why = !st.why;
  } });
  const replayBtn = K.button({ label: 'Play again', secondary: true, into: '#replay', press: () => {
    const i = at(), d = STEPS[i];
    if (!d.show || !d.dur || finished) return;
    trace = { i: -1, t: -1e9 };

  } });
  const backBtn = K.button({ label: 'Back', secondary: true, into: '#nav', press: () => {

  // A step's demonstration: the pour on the first screen, or its parts arriving on the story clock.
  function startDemo(i) {

  // The controls open where this screen left them (quietly: this is not Dan moving them).

  }

  // The still for the read-through: the step settled in the state its words end on.

  function stillAt(name, patch) {

    M.springs.forEach((s) => { s.init = false; });
    K.refresh();
  }

  write(el('finish'), FINISH);
  K.update((p) => {
    const i = Math.round(p.step), d = STEPS[i], st = S[i];

      if (d.ctls.indexOf('mres') >= 0 && ['0.01', '0.05'].indexOf(mres) >= 0 && mres !== st.mres) { st.mres = mres; st.mresMoved = true; arc = true; }

    checkBtn.el.hidden = right;

    write(fb, d.show ? '' : right ? 'That\'s it.' : st.got === 'wrong' ? hintFor(i, st) : st.got === 'empty' ? PICK : '');

    write(why, d.show ? '' : d.why);
    whyBtn.setLabel(st.why ? 'Hide why' : 'Why?');
    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !right);

  });

  // ---------- known answers, worked out by hand ----------
  // A step painted in the state given, settled: what it draws.
  function drawnAt(i, patch) {
    // Everything a paint moves is put back as it was: the springs (a check run mid-pour must not shift the hopper) and the beads.
    const keepS = S[i], keepTb = M.Tb, keepTs = M.Ts, keepSc = M.sc, keepTr = trace, keepFA = Object.assign({}, FA), keepL = LASTRS;
    const keepSp = M.springs.map((s) => [s.v, s.vel, s.to, s.init]), keepD = drawn.map((q) => Object.assign({}, q)), keepF = FLOOR.slice();
    S[i] = Object.assign({}, keepS, patch); M.Tb = M.Ts = Infinity; M.sc = STILL; FORCE = true;

  }
  K.check('The spread of a mean is the spread of one reading divided by the square root of the number of times the measurement was repeated: over 2,000 beads from the rule on screen, single readings spread 0.04 V, and means of 2 and of 4 readings spread 1 ÷ √2 and 1 ÷ 2 as widely, within 5%', () => {

  K.check('An accuracy of ±(2% + 2) means a reading of 100.0 V can be from 97.8 V to 102.2 V; by the same rule ±(1% + 3 digits) on 50.0 V read to 0.1 V gives 49.2 V to 50.8 V, as the rating puzzle draws it, and the example meter\'s ±(0.1% + 2 digits) at 27.00 V read to 0.01 V reaches 0.047 V either side, the width of the window behind the hopper', () => {

  K.check('Worked by hand from this batch: one reading a bead gives a mean of 27.00 V, an SD close to 0.04 V and a result of ± 0.011 V (2 × 0.04 ÷ √50, with √50 about 7.07), with 49 of the 50 within 0.08 V of 27.00 V and one at 27.06 V; two a bead about seven tenths as wide; four a bead half as wide and ± 0.006 V; 0.02 V high and four a bead, 27.02 ± 0.006 V, missing 27.00 V; against 27.02 V the result sits below, below, across and above as the offset rises; on the 0.05 V meter every reading is a whole step and the mean moves under 0.002 V; 0.82 ± 0.03 Ω runs 0.79 to 0.85 Ω, across 0.84 Ω', () => {
    const a = layout(1, 0, RES), b = layout(2, 0, RES), c = layout(4, 0, RES), h = layout(4, 0.02, RES), k = layout(1, 0, COARSE);
    const sides = [0, 0.01, 0.02, 0.03].map((o) => { const L = layout(4, o, RES); return L.s.m + L.U < LIM ? 'below' : L.s.m - L.U > LIM ? 'above' : 'across'; }).join();
    return B.facts([
      ['one a bead', near(a.s.m, TRUE, 0.005) && near(a.s.sd, SD, 0.002) && near(a.U, 0.011, 0.0005) && near(Math.sqrt(50), 7.07, 0.005) && near(2 * SD / Math.sqrt(50), 0.011, 0.0005)],
      ['49 of 50 within 0.08 V, one at 27.06 V', a.vs.filter((v) => Math.abs(v - TRUE) <= REACH + 1e-9).length === 49 && near(a.vs[RING], RINGV, 1e-9)],
      ['two a bead', b.s.sd / a.s.sd > 0.66 && b.s.sd / a.s.sd < 0.75 && near(SD / Math.SQRT2, 0.028, 0.0005)],

  K.check('Drawn right: settled, the fulcrum sits under the mean and the beam is level at every setting of averaging, offset and meter step; the hopper sits over 27.00 V plus the offset, inside the window; the limit line sits at 27.02 V; no bead is under r 3.5 or off the scale; no dashed line runs through a label', () => {
    const out = [];

  });
