<p class="caption" id="cap">Simulated readings: true value plus random error times twelve nudges, read to 0.01 Ω. Puzzle readings are examples.</p>

<script>
  // ==== Beads: the shared language (dataviz.md, "Copy this code"). Paste unchanged. ====
  const B = (() => { const B = {}, lerp = (a, b, t) => a + (b - a) * t, c01 = (v) => Math.max(0, Math.min(1, v)); B.lerp = lerp; B.c01 = c01; B.r2 = (v) => Math.round(v * 100) / 100;
    // The rule. Seeded, so every picture and check is stable; a fresh batch is the next seed.
    B.rng = (seed) => { let a = (Math.imul(seed | 0, 7919) + 104729) >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; };
    // n readings × 12 nudges in −½..+½: twelve sum to SD exactly 1, so sd × B.sum(u) is an error of SD sd; B.sum(u, row) is a bead after `row` rows of pegs.
    // A second string of readings takes rows n..2n−1 of B.nudges(seed, 2n), never reading i's own: two strings share only what the rule gives them both.
    B.nudges = (seed, n) => { const r = B.rng(seed); return Array.from({ length: n }, () => Array.from({ length: 12 }, () => r() - 0.5)); }; B.sum = (u, upto) => { let s = 0; for (let j = 0; j < (upto == null ? u.length : upto); j++) s += u[j]; return s; };
    B.uni = (seed, n) => { const r = B.rng(seed); return Array.from({ length: n }, () => 1 - r()); };   // in (0, 1]: a lifetime is −ln(u) / rate
    B.round = (v, res) => +(Math.round(v / res) * res).toFixed(9); B.stats = (vs) => { const n = vs.length; if (!n) return null; let m = 0, q = 0; vs.forEach((v) => { m += v / n; }); vs.forEach((v) => { q += (v - m) * (v - m); });
      const s = vs.slice().sort((a, b) => a - b); return { n, m, sd: n > 1 ? Math.sqrt(q / (n - 1)) : 0, med: n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2, lo: s[0], hi: s[n - 1] }; }; B.within = (vs, m, sd, z) => vs.filter((v) => Math.abs(v - m) <= z * sd * (1 + 1e-9)).length;
    B.fit = (pts) => { const n = pts.length; if (n < 2) return null; let mx = 0, my = 0, sxx = 0, sxy = 0, rr = 0; pts.forEach((p) => { mx += p[0] / n; my += p[1] / n; }); pts.forEach((p) => { sxx += (p[0] - mx) * (p[0] - mx); sxy += (p[0] - mx) * (p[1] - my); }); const b = sxx ? sxy / sxx : 0;
      pts.forEach((p) => { rr += Math.pow(p[1] - my - b * (p[0] - mx), 2); }); return { b, mx, my, at: (x) => my + b * (x - mx), res: n > 2 ? Math.sqrt(rr / (n - 2)) : 0 }; };
    /* How closely two strings move together: +1 a rising line, −1 a falling one, 0 no line at all. */ B.corr = (xs, ys) => { const n = xs.length; let mx = 0, my = 0, sxy = 0, sxx = 0, syy = 0; xs.forEach((x, i) => { mx += x / n; my += ys[i] / n; });
      xs.forEach((x, i) => { sxy += (x - mx) * (ys[i] - my); sxx += (x - mx) * (x - mx); syy += (ys[i] - my) * (ys[i] - my); }); return sxx > 0 && syy > 0 ? sxy / Math.sqrt(sxx * syy) : 0; };
    // A lifetime from a sketched hazard: the t at which the total hazard H(t) reaches −ln u, by halving; Infinity past tmax. A column's expected count from R.
    B.lifeFrom = (H, u, tmax) => { const goal = -Math.log(u); if (!(H(tmax) >= goal)) return Infinity; let a = 0, b = tmax; for (let k = 0; k < 44; k++) { const m = (a + b) / 2; if (H(m) < goal) a = m; else b = m; } return (a + b) / 2; };
    B.colExpect = (R, n, bin) => (t) => n * (R(Math.max(0, t - bin / 2)) - R(Math.max(0, t + bin / 2)));
    // Columns one bin wide: lo, hi the end columns' centres, drawn a0 → a1. col(v) clamps; a value on an edge goes up; off(v) is −1 or +1 past an end.
    B.scale = (lo, hi, bin, a0, a1) => { const n = Math.round((hi - lo) / bin) + 1, w = (a1 - a0) / n, col = (v) => Math.max(0, Math.min(n - 1, Math.round((v - lo) / bin + 1e-7)));
      return { lo, hi, bin, n, w, a0, a1, col, mid: (c) => a0 + (c + 0.5) * w, at: (v) => a0 + ((v - lo) / bin + 0.5) * w, val: (x) => lo + ((x - a0) / w - 0.5) * bin, off: (v) => (v < lo - bin / 2 ? -1 : v > hi + bin / 2 ? 1 : 0) }; };
    // Columns of equal ratio, `steps` to a decade, for readings that spread by a factor (insulation resistance). Takes and gives plain values.
    B.logScale = (lo, hi, steps, a0, a1) => { const L = Math.log10, s = B.scale(L(lo), L(hi), 1 / steps, a0, a1); return Object.assign({}, s, { lo, hi, log: true, col: (v) => s.col(L(v)), at: (v) => s.at(L(v)), val: (x) => Math.pow(10, s.val(x)), off: (v) => s.off(L(v)) }); };

    /* The pile on the beam at y base, earlier readings lower, `per` across a wide column; readings past an end on top; a batch too tall shrinks every bead. */ B.stack = (vs, sc, base, top, fit) => { const per = Math.max(1, Math.floor((Math.abs(sc.w) + 1) / fit.pitch)), cnt = {}, idx = [];
      vs.map((v, i) => i).sort((a, b) => (sc.off(vs[a]) ? 1 : 0) - (sc.off(vs[b]) ? 1 : 0) || a - b).forEach((i) => { const c = sc.col(vs[i]); cnt[c] = (cnt[c] || 0) + 1; idx[i] = cnt[c] - 1; });
      const tall = Math.max(1, ...Object.values(cnt).map((k) => Math.ceil(k / per))), pitch = Math.min(fit.pitch, (base - 1.5 - top) / tall), r = Math.min(fit.r, (pitch - 1) / 2);
      return { r, tall, pitch, per, base, cnt, pos: vs.map((v, i) => { const c = sc.col(v), lay = Math.floor(idx[i] / per), row = Math.min(per, cnt[c] - lay * per); return { x: sc.mid(c) + (idx[i] % per - (row - 1) / 2) * pitch, y: base - 1.5 - r - lay * pitch, r }; }) }; };
    /* In the order taken: reading i across from x0 to x1, its value up the page on scale sv. */ B.run = (vs, sv, x0, x1, r) => vs.map((v, i) => ({ x: lerp(x0, x1, vs.length > 1 ? i / (vs.length - 1) : 0.5), y: sv.at(v), r }));
    // A pile place turned u of the way onto its side about (x0, y0) sliding to (x1, y1): value up the page (k), stacks leftwards (kh); at u = 1, level with B.run.
    B.tip = (p, u, A) => { const th = u * Math.PI / 2, c = Math.cos(th), s = Math.sin(th), k = lerp(1, A.k, u), kh = lerp(1, A.kh, u), dx = p.x - A.x0, dh = A.y0 - p.y;
      return { x: lerp(A.x0, A.x1, u) + k * dx * c - kh * dh * s, y: lerp(A.y0, A.y1, u) - k * dx * s - kh * dh * c, r: p.r * lerp(1, Math.min(A.k, A.kh), u) }; };
    // Two strings over time folded into one against the other, u 0..1: a and b are reading i's places in their strips, f the pair's place once folded.
    B.fold = (a, b, f, u) => { const ux = K.ease(c01(2 * u)), uy = K.ease(c01(2 * u - 1)), x = lerp(a.x, f.x, ux), q = { x: lerp(b.x, f.x, ux), y: lerp(b.y, f.y, uy), r: lerp(b.r, f.r, uy) }; return [uy > 0 ? B.hop({ x, y: a.y, r: a.r }, q, uy, 12, (v) => v) : { x, y: a.y, r: a.r }, q]; };
    /* Timings (s) every lesson shares: a pour releases a bead every dt, each jinks `jink` high off every peg; a fresh batch re-sorts one every hop. */ B.T = { dt: 0.045, hop: 0.028, field: 0.5, fly: 0.5, settle: 0.45, bounce: 0.24, peel: 0.025, tip: 0.8, fold: 1.6, g: 1600, jink: 2 };
    B.releases = (n, t0, slow) => { const out = []; let t = t0; for (let i = 0; i < n; i++) { out.push(t); t += slow ? Math.max(B.T.dt, 0.32 * Math.pow(0.68, i)) : B.T.dt; } return out; };
    B.bounce = (tc) => (tc < 0 ? 0 : tc < 0.15 ? 4.5 * Math.sin(Math.PI * tc / 0.15) : tc < B.T.bounce ? 1.3 * Math.sin(Math.PI * (tc - 0.15) / (B.T.bounce - 0.15)) : 0); const fallT = (d, v0) => (-v0 + Math.sqrt(v0 * v0 + 2 * B.T.g * Math.max(2, d))) / B.T.g;
    /* A bead released at rel strikes a peg on each of the twelve rows (y0..y1), xAt(row) its nudges so far, then falls onto p and bounces twice; tc = s since landing. */ B.pour = (T, rel, xAt, p, y0, y1) => { const tau = T - rel, F = B.T.field, v0 = (y1 - y0) / F; if (tau < 0) return null;

    paintField(i, D.pile, D.vs, (v) => [[v.toFixed(2), 'n'], [' Ω', 'u']], inV.length);

    let ra = 0;

      if (show(ring, ra)) B.set(ring, { cx: rd.x, cy: rd.y, r: rd.r + 2.6 });
      if (d.ring && show(chev, ra)) { const o = rd.r + 5; B.set(chev, { d: 'M' + B.r2(rd.x - o) + ' ' + B.r2(rd.y - 3.5) + 'v7l-4 -3.5zM' + B.r2(rd.x + o) + ' ' + B.r2(rd.y - 3.5) + 'v7l4 -3.5z' }); }

    // a tapped bead's path draws.

  }

  // Insulation resistance: poured by factors through the pegs, rising into a bell; turned onto an even scale, the beads hop across, the
  // swarm leans with a long high tail, and the fulcrum slides in under the mean, right of the median.
  function paintIR(i, d, st) {
    const even = st.irs === 'even', L = irLayout(even), L0 = irLayout(false), sc = L.sc, pouring = M.live('pour');
    FIELD.hx = IRL.at(IR0); FIELD.U = UI;
    const inV = [];
    for (let k = 0; k < N; k++) if (M.counted(k)) inV.push(IRS[k]);
    const RS = B.stats(inV);
    B.aim(SP.su, IR_SD * 20 * IRL.w / 2.4); B.aim(SP.fy, L0.fy);
    if (RS) { B.aim(SP.f, sc.at(RS.m)); B.aim(SP.m, sc.at(RS.m)); }
    restIfStill();
    FY.y1 = SP.fy.v; FY.y0 = FY.y1 - FH;
    const geo = { field: fieldNow }, land = pouring ? L0.heap : L.pile;
    TGT = L.pile;
    for (let k = 0; k < N; k++) {
      let q = M.place(k, L.pile, land, geo);
      if (q && pouring && M.sc.rise) q = B.risen(M.Tb, M.sc, k, q, L0.heap, L.pile)[0];

    if (rock && fa < 0.01 && RS) { SP.f.v = sc.at(RS.lo) - 24; SP.f.vel = 0; }   // held at the swarm's left end until it slides in
    const fx = SP.f.v, theta = fa > 0 ? 5 * Math.tanh((xm - fx) / Math.max(6, 1.2 * Math.abs(sc.at(RS.m + RS.sd) - xm))) * fa : 0;
    tilt(theta, fx);
    if (show(fulcrum, fa)) B.set(fulcrum, { d: fulD(fx, BASE) });
    show(beam, 1);
    [['l', IRT.l], ['e', IRT.e]].forEach(([k, t]) => { show(t.minor, FA[k]); show(t.major, FA[k]); t.labs.forEach((e) => show(e, FA[k])); });
    show(irTitle, Math.max(FA.l, FA.e));

  }

  // A small swarm on the beam: a puzzle's, or the SD worked in rows.
  function paintOne(i, d, st) {
    const L = smallLayout(i), sc = L.sc, s = L.s, xm = sc.at(s.m), T = M.Ts;
    const rows = d.rows === 'show' || (d.rows === 'answer' && st.res === 'right'), Q = d.rows === 'show' ? RT_SHOW : RT_FAST;
    const claim = d.claim && (st.res === 'right' || st.res === 'wrong') ? d.claim[st.pick] : null;
    if (claim) B.aim(SP.p, sc.at(claim.m));
    restIfStill();
    const n = d.vals.length, W = rows ? workOf(d.vals) : null;
    hideFrom(n);
    TGT = null;
    for (let k = 0; k < n; k++) {
      const p = L.pos[k];
      FLOOR[k] = p.y; ZT[k] = L.z[k];
      let q = { x: p.x, y: p.y, r: p.r, a: 1 };
      if (rows) {
        const rk = L.rank[k], tgt = { x: p.x, y: ROWY[rk], r: p.r, a: 1 }, u = (T - (Q.r0 + Q.gap * rk)) / Q.hop;
        q = u >= 1 ? tgt : u <= 0 ? q : B.hop(q, tgt, u, 12, K.ease);
        if (u > 0 && show(ghosts[k], B.c01(u * 3))) B.set(ghosts[k], { cx: p.x, cy: p.y, r: p.r - 0.6 });
      }
      drawn[k] = q;
    }
    let fa = 0, fx = xm;
    if (d.given) fa = 1;
    else if (claim) { fa = K.arrive(T, 0.05, 0.3); fx = SP.p.v; }
    const theta = fa > 0 && !rows ? 5 * Math.tanh((xm - fx) / Math.max(6, 1.2 * s.sd / RES * Math.abs(sc.w))) * fa : 0;
    tilt(theta, fx);
    if (show(fulcrum, fa)) B.set(fulcrum, { d: fulD(fx, BASE) });
    [beam, minor, major, title].concat(nums).forEach((e) => show(e, 1));
    paintEnds(null);
    // The mean: given, or once the right answer is in (and the median where it was asked); it rises to the top while the rows are worked.
    const ma = d.given ? 1 : claim && st.res === 'right' ? K.arrive(T, 1.1, 0.4) : 0, mda = claim && claim.md != null && st.res === 'right' ? K.arrive(T, 1.5, 0.4) : 0;
    paintVals({ Z: sc, m: s.m, med: s.med, xm, ma, mda, va: 1, marks: L.pos, line: L.sw.line, r: L.sw.r, dec: 3, unit: ' Ω', lift: rows ? [20, K.arrive(T, Q.r0 - 0.1, 0.4)] : null });

        if (show(rowLab[rk], a)) { rowLab[rk].textContent = sgn(dv); B.set(rowLab[rk], dv < 0 ? { x: xv - r - 5, y: y + 4.5, 'text-anchor': 'end' } : { x: xv + r + 5, y: y + 4.5, 'text-anchor': 'start' }); }
        if (show(rowSq[rk], K.arrive(T, Q.sq + Q.sqGap * rk, 0.3))) { rowSq[rk].textContent = sq4(W.sq[k]); B.set(rowSq[rk], { y: y + 4.5 }); }
      });
      show(sqHead, K.arrive(T, Q.sq, 0.3));
      const fl = [[['added ', 'w'], [sq4(W.tot), 'n']], [['÷ ' + (n - 1) + ' ', 'w'], [sq4(W.vr), 'n']], [['square root ', 'w'], [W.sd.toFixed(2), 'n'], [' Ω', 'u']]];
      foot.forEach((t, j) => { if (show(t, K.arrive(T, Q.foot + Q.footGap * j, 0.3))) { B.words(t, fl[j]); B.set(t, { y: 152 + 20 * j }); } });
      sdBracket(sdP, sdL, sdR, xm, W.sd / RES * Math.abs(sc.w), RD, K.arrive(T, Q.bar, Q.barD));
    }

  }

  // Two swarms, A above and B below, on one scale: each balanced at its mean, with its SD bracket when that is shown.
  function dropAt(p, y0, t0) {
    if (M.Ts === Infinity) return { x: p.x, y: p.y, r: p.r, a: 1 };
    const tau = M.Ts - t0;
    if (tau < 0) return { x: p.x, y: y0, r: p.r, a: 0 };
    const q = B.fall({ x: p.x, y: y0, r: p.r }, p, tau);
    q.a = B.c01(tau / 0.12);
    return q;
  }
  function paintTwo(i, d, st) {
    const L = smallLayout(i), sc = L.sc, right = st.res === 'right', T = M.Ts;
    restIfStill();
    hideFrom(0);
    TGT = null;
    const put = (sw, z, y0, off, t0, gap) => { if (sw) sw.pos.forEach((p, k) => { const q = d.drop ? dropAt(p, y0, t0 + gap * k) : { x: p.x, y: p.y, r: p.r, a: 1 }; FLOOR[off + k] = p.y; ZT[off + k] = z[k]; drawn[off + k] = q; LANDED[off + k] = !d.drop || M.Ts === Infinity || q.tc != null; }); };
    put(L.a, L.za, 40, 0, FADE + 0.1, 0.08); put(L.b, L.zb, 192, 10, 1.4, 0.12);
    tilt(0, 170);
    [beamA, minorA, majorA, beam, minor, major, title, titleA, titleB].concat(numsA, nums).forEach((e) => show(e, 1));
    paintEnds(null);
    const mA = L.sa ? L.sa.m : d.mean, mB = L.sb ? L.sb.m : d.mean, fa = d.drop ? K.arrive(T, 2.7, 0.5) : 1;
    const xA = B.lerp(d.drop ? 41 : sc.at(mA), sc.at(mA), fa), xB = B.lerp(d.drop ? 41 : sc.at(mB), sc.at(mB), fa);
    if (show(fulcrumA, fa)) B.set(fulcrumA, { d: fulD(xA, YA) });
    if (show(fulcrum, fa)) B.set(fulcrum, { d: fulD(xB, BASE) });
    let ga = 0, gb = 0;
    if (d.sd === 'show') { ga = K.arrive(T, 3.2, 0.5); gb = K.arrive(T, 3.4, 0.5); }
    else if (d.sd === 'answer' && right) { ga = K.arrive(T, 0.2, 0.5); gb = K.arrive(T, 0.6, 0.6); }
    const sdA = L.sa ? L.sa.sd : d.sdGiven[0], sdB = L.sb ? L.sb.sd : d.sdGiven[1];
    sdBracket(sdPA, sdLA, sdRA, sc.at(mA), sdA / RES * sc.w, YA + 42, ga);
    sdBracket(sdP, sdL, sdR, sc.at(mB), sdB / RES * sc.w, RD, gb);
    // After a right answer, each bead that sits far from the mean sends out a ring that stays.
    let j = 0;
    if (d.far && right) [[L.a, d.a], [L.b, d.b]].forEach((g) => g[1].forEach((v, k) => {
      if (Math.abs(v - TRUE) < d.far - 1e-9 || j >= rings.length) return;
      const p = g[0].pos[k];
      if (show(rings[j], K.arrive(T, 0.2 + 0.18 * j, 0.35))) B.set(rings[j], { cx: p.x, cy: p.y, r: p.r + 2.6 });
      j++;
    }));
    if (L.sa && L.sb) { R.sdA.set(L.sa.sd); R.mB.set(L.sb.m); R.sdB.set(L.sb.sd); }
    Object.assign(REC, { fulcrum: true, rings: j, xA, xB, D: L });
  }

  // The line under the picture: one or two warm sentences on the state, the prediction first and the answer only after the move.
  function sayFor(d, st) {
    if (d.name === 'Fifty readings') {
      if (REC.pouring) return 'Readings are landing, and the fulcrum keeps sliding to the mean of those down so far.';
      return trace.i >= 0 ? 'That bead was nudged twelve times on its way down. It landed where its nudges added up to.' : 'Fifty readings of one circuit, each a little different, gather round the middle.';
    }
    if (d.name === 'A slipped probe') {
      if (st.probe > 0.805) return 'The slipped reading drags the mean up. The median has hardly moved.';
      if (st.probe < 0.795) return 'One reading slipped low pulls the mean down a little. The median has hardly moved.';
      return 'Every reading is honest, so the mean and the median sit together in the middle.';
    }
    if (d.name === 'Spread by a factor') {
      if (st.irs === 'even') return 'The long tail is on the high side, so the balance point sits above the middle reading.';
      return st.irMoved ? 'By factors, each column is the last one times the same amount, so the swarm is a bell again.' : 'Predict: on an even scale of megohms, will the swarm still be a bell?';
    }
    if (d.name === 'Halve the random error') {
      if (st.spread < 0.0199) return 'Less random error: the same readings crowd into fewer columns, so the swarm grows taller.';
      if (st.spread > 0.0201) return 'More random error: the swarm spreads wider and lower, still balanced near 0.80 Ω.';
      return '';
    }
    if (d.name === 'Back to the fifty') {
      if (st.probe >= 1) return 'One slipped reading stretches the bracket far past the honest swarm, because squaring makes it count heavily.';
      if (Math.abs(st.probe - TRUE) > 0.005) return 'One reading has moved, so the bracket widens a little.';
      return 'Every reading is honest, so the bracket hugs the swarm.';
    }
    return '';
  }

  function paint(i) {
    if (i == null) i = at();
    const d = STEPS[i], st = S[i];
    if (FORCE || M.idle()) fadeStep(1e9, i);
    SEEN = new Set(); REC = { view: d.view, sd: false, rows: false, rings: 0, fulcrum: false, vals: '' };
    setView(i, d);
    if (d.view === 'big') paintBig(i, d, st);
    else if (d.view === 'ir') paintIR(i, d, st);
    else { B.vis(G.field, 0); B.pegHit(PEG, []); TGT = null; if (d.view === 'one') paintOne(i, d, st); else if (d.view === 'two') paintTwo(i, d, st); else { tilt(0, 170); hideFrom(0); } }
    // Each bead on the fade: a step opens with its beads already coloured; tests and reduced motion open finished.
    if (FORCE || M.instant() || kSnap) { kStep(1e9, i); if (!FORCE) kSnap = false; }
    // A new move restacks the beads, the farthest travellers on top, each with its colour disc.
    if (M.sc !== zSc && M.sc.from && TGT) beads.map((b, k) => [Math.hypot(M.sc.from[k].x - TGT[k].x, M.sc.from[k].y - TGT[k].y), k]).sort((a, b) => a[0] - b[0]).forEach((q) => G.beads.append(beads[q[1]].c, beads[q[1]].f, beads[q[1]].g));
    zSc = M.sc;
    // A splash where a bead lands on the beam; a faint ripple where one settles in mid-air.
    const pouring = M.live('pour');
    let colour = false;
    for (let k = 0; k < N; k++) {
      const q = drawn[k], rp = q && q.tc != null && !pouring ? 0.65 + 2 * q.tc : null;
      B.paint(beads[k], rp != null ? Object.assign({}, q, { ring: rp }) : q, 0, FLOOR[k], ZD[k] = zAt(k), KK[k]);
      if (q && q.a > 0.5 && KK[k] > 0.5) colour = true;
    }
    REC.colour = colour;
    ALL.forEach((e) => { if (!SEEN.has(e)) e.setAttribute('display', 'none'); });
    svg.setAttribute('aria-label', d.alt || '');
    svg.classList.toggle('nodrag', !d.ring);
    const sy = el('say'), s = d.show ? sayFor(d, st) : '';
    sy.textContent = s; sy.hidden = !s;
    M.fade();
  }

  // ---------- Dan's moves ----------
  // Drag the ringed bead along the beam; past the last column it slips off the scale into the pile marked over, up to 1.80 Ω. Its slider
  // is the keyboard's way in.
  const XEND = SC.mid(SC.n - 1);
  K.drag(handle, { control: 'probe', toValue: (x) => {
    if (x <= XEND + 4) return B.round(Math.max(0.7, Math.min(0.9, SC.val(x))), RES);
    return B.round(Math.min(1.8, 0.9 + (x - XEND - 4) / Math.max(4, 334 - XEND - 4) * 0.9), RES);
  } });
  // Tap a bead on the first screen, once the pour has landed: its path through the pegs draws in.
  svg.addEventListener('click', (ev) => {
    if (at() !== 0 || finished || M.moving('pour')) return;
    const k = B.pick(svg, ev, drawn.map((q) => (q.a > 0.5 ? q : { x: -99, y: -99, r: 0 })), 14);
    if (k < 0) return;
    trace = { i: k, t: M.instant() ? M.Tl - 10 : M.Tl };
    if (M.instant()) { paint(); return; }
    M.anim.play();
  });
  const pickBtns = [0, 1, 2].map((k) => K.button({ label: 'Answer ' + (k + 1), secondary: true, into: '#picks', press: () => {
    const i = at(), d = STEPS[i], st = S[i];

    const was = st.res === 'wrong';
    st.pick = d.opts[k]; st.res = null;

  } }));
  // Check: a pick of the balance point sends the fulcrum there from the swarm's left end; a right answer then shows its working, and the
  // beads take their colours.
  const checkBtn = K.button({ label: 'Check', into: '#acts', press: () => {
    const i = at(), d = STEPS[i], st = S[i];
    if (d.show || finished) return;
    if (st.pick == null) { st.res = 'empty'; return; }
    st.res = isRight(i, st) ? 'right' : 'wrong';
    if (d.claim) { const L = smallLayout(i); SP.p.v = Math.max(14, L.sc.at(Math.min(...d.vals)) - 24); SP.p.vel = 0; SP.p.init = true; }
    if (st.res === 'right' || d.claim) story(ANSWER); else halt();
  } });
  const whyBtn = K.button({ label: 'Why?', secondary: true, into: '#acts', press: () => {
    if (STEPS[at()].show || finished) return;
    const st = S[at()]; st.why = !st.why;
  } });
  const replayBtn = K.button({ label: 'Play again', secondary: true, into: '#replay', press: () => {
    const i = at(), d = STEPS[i];
    if (!d.show || !d.dur || finished) return;
    trace = { i: -1, t: -1e9 };
    startDemo(i, true);
  } });
  const backBtn = K.button({ label: 'Back', secondary: true, into: '#nav', press: () => {
    if (finished) { finished = false; return; }

  } });
  const nextBtn = K.button({ label: 'Continue', into: '#nav', press: () => {
    const i = at();

    finished = true; halt();
    if (typeof K.complete === 'function') K.complete();
  } });
  K.button({ label: 'Start again', secondary: true, into: '#again', press: () => {
    S = STEPS.map(() => blank()); finished = false; lastStep = -1; stepper.set(0, true);
  } });

  // A step's demonstration: a pour (the fifty, or insulation resistance by factors) that lands as a pile and rises into the swarm, the
  // beads hopping onto the even scale while the beam finds its balance, or this lesson's own parts arriving on the story clock.
  function startDemo(i, again) {
    const d = STEPS[i], st = S[i];
