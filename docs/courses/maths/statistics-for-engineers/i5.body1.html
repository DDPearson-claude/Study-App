<p class="lead" id="lead">Each bead is one simulated unit in service, say a pump. Each fails at random, at the same steady failure rate λ = 0.1 a year, an example.</p>

<p class="caption" id="cap">Simulated: each lifetime is t = −ln(u) ÷ λ, with u a random number between 0 and 1.</p>

<script>
  // ==== Beads: the shared language (dataviz.md, "Copy this code"). Paste unchanged. ====
  const B = (() => { const B = {}, lerp = (a, b, t) => a + (b - a) * t, c01 = (v) => Math.max(0, Math.min(1, v)); B.lerp = lerp; B.c01 = c01; B.r2 = (v) => Math.round(v * 100) / 100;
    // The rule. Seeded, so every picture and check is stable; a fresh batch is the next seed.
    B.rng = (seed) => { let a = (Math.imul(seed | 0, 7919) + 104729) >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; };
    // n readings × 12 nudges in −½..+½: twelve sum to SD exactly 1, so sd × B.sum(u) is an error of SD sd; B.sum(u, row) is a bead after `row` rows of pegs.
    // A second string of readings takes rows n..2n−1 of B.nudges(seed, 2n), never reading i's own: two strings share only what the rule gives them both.
    B.nudges = (seed, n) => { const r = B.rng(seed); return Array.from({ length: n }, () => Array.from({ length: 12 }, () => r() - 0.5)); }; B.sum = (u, upto) => { let s = 0; for (let j = 0; j < (upto == null ? u.length : upto); j++) s += u[j]; return s; };
    B.uni = (seed, n) => { const r = B.rng(seed); return Array.from({ length: n }, () => 1 - r()); };   // in (0, 1]: a lifetime is −ln(u) / rate
    B.round = (v, res) => +(Math.round(v / res) * res).toFixed(9); B.stats = (vs) => { const n = vs.length; if (!n) return null; let m = 0, q = 0; vs.forEach((v) => { m += v / n; }); vs.forEach((v) => { q += (v - m) * (v - m); });
      const s = vs.slice().sort((a, b) => a - b); return { n, m, sd: n > 1 ? Math.sqrt(q / (n - 1)) : 0, med: n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2, lo: s[0], hi: s[n - 1] }; }; B.within = (vs, m, sd, z) => vs.filter((v) => Math.abs(v - m) <= z * sd * (1 + 1e-9)).length;
    B.fit = (pts) => { const n = pts.length; if (n < 2) return null; let mx = 0, my = 0, sxx = 0, sxy = 0, rr = 0; pts.forEach((p) => { mx += p[0] / n; my += p[1] / n; }); pts.forEach((p) => { sxx += (p[0] - mx) * (p[0] - mx); sxy += (p[0] - mx) * (p[1] - my); }); const b = sxx ? sxy / sxx : 0;
      pts.forEach((p) => { rr += Math.pow(p[1] - my - b * (p[0] - mx), 2); }); return { b, mx, my, at: (x) => my + b * (x - mx), res: n > 2 ? Math.sqrt(rr / (n - 2)) : 0 }; };
    /* How closely two strings move together: +1 a rising line, −1 a falling one, 0 no line at all. */ B.corr = (xs, ys) => { const n = xs.length; let mx = 0, my = 0, sxy = 0, sxx = 0, syy = 0; xs.forEach((x, i) => { mx += x / n; my += ys[i] / n; });
      xs.forEach((x, i) => { sxy += (x - mx) * (ys[i] - my); sxx += (x - mx) * (x - mx); syy += (ys[i] - my) * (ys[i] - my); }); return sxx > 0 && syy > 0 ? sxy / Math.sqrt(sxx * syy) : 0; };
    // A lifetime from a sketched hazard: the t at which the total hazard H(t) reaches −ln u, by halving; Infinity past tmax. A column's expected count from R.
    B.lifeFrom = (H, u, tmax) => { const goal = -Math.log(u); if (!(H(tmax) >= goal)) return Infinity; let a = 0, b = tmax; for (let k = 0; k < 44; k++) { const m = (a + b) / 2; if (H(m) < goal) a = m; else b = m; } return (a + b) / 2; };
    B.colExpect = (R, n, bin) => (t) => n * (R(Math.max(0, t - bin / 2)) - R(Math.max(0, t + bin / 2)));
    // Columns one bin wide: lo, hi the end columns' centres, drawn a0 → a1. col(v) clamps; a value on an edge goes up; off(v) is −1 or +1 past an end.
    B.scale = (lo, hi, bin, a0, a1) => { const n = Math.round((hi - lo) / bin) + 1, w = (a1 - a0) / n, col = (v) => Math.max(0, Math.min(n - 1, Math.round((v - lo) / bin + 1e-7)));
      return { lo, hi, bin, n, w, a0, a1, col, mid: (c) => a0 + (c + 0.5) * w, at: (v) => a0 + ((v - lo) / bin + 0.5) * w, val: (x) => lo + ((x - a0) / w - 0.5) * bin, off: (v) => (v < lo - bin / 2 ? -1 : v > hi + bin / 2 ? 1 : 0) }; };
    // Columns of equal ratio, `steps` to a decade, for readings that spread by a factor (insulation resistance). Takes and gives plain values.
    B.logScale = (lo, hi, steps, a0, a1) => { const L = Math.log10, s = B.scale(L(lo), L(hi), 1 / steps, a0, a1); return Object.assign({}, s, { lo, hi, log: true, col: (v) => s.col(L(v)), at: (v) => s.at(L(v)), val: (x) => Math.pow(10, s.val(x)), off: (v) => s.off(L(v)) }); };
    /* A scale with no columns, for a view that zooms or a strip of a time view: v0..v1 drawn a0 → a1; w is one bin's length on it. */ B.lin = (v0, v1, a0, a1, bin) => { const k = (a1 - a0) / (v1 - v0); return { lo: v0, hi: v1, bin, w: k * bin, a0, a1, at: (v) => a0 + (v - v0) * k, val: (x) => v0 + (x - a0) / k }; };
    // Bead size: B.peak, about the tallest stack of the narrowest pile a slider allows; B.tallest, a batch's own; B.fitPile, the bead for that height and column.
    B.peak = (n, bin, sd) => { const x = Math.min(2, bin / sd), t = Math.min(n, n * x * 0.3989 * (1 - x * x / 24)); return t + Math.sqrt(t); }; B.tallest = (vs, sc) => { const c = {}; let m = 1; vs.forEach((v) => { const k = sc.col(v); c[k] = (c[k] || 0) + 1; m = Math.max(m, c[k]); }); return m; };
    B.fitPile = (tall, room, colW, rmax) => { const r = Math.min(rmax, Math.abs(colW) / 2 - 0.6, (room / Math.max(1, tall) - 1) / 2); return { r, pitch: 2 * r + 1 }; };
    /* The pile on the beam at y base, earlier readings lower, `per` across a wide column; readings past an end on top; a batch too tall shrinks every bead. */ B.stack = (vs, sc, base, top, fit) => { const per = Math.max(1, Math.floor((Math.abs(sc.w) + 1) / fit.pitch)), cnt = {}, idx = [];
      vs.map((v, i) => i).sort((a, b) => (sc.off(vs[a]) ? 1 : 0) - (sc.off(vs[b]) ? 1 : 0) || a - b).forEach((i) => { const c = sc.col(vs[i]); cnt[c] = (cnt[c] || 0) + 1; idx[i] = cnt[c] - 1; });
      const tall = Math.max(1, ...Object.values(cnt).map((k) => Math.ceil(k / per))), pitch = Math.min(fit.pitch, (base - 1.5 - top) / tall), r = Math.min(fit.r, (pitch - 1) / 2);
      return { r, tall, pitch, per, base, cnt, pos: vs.map((v, i) => { const c = sc.col(v), lay = Math.floor(idx[i] / per), row = Math.min(per, cnt[c] - lay * per); return { x: sc.mid(c) + (idx[i] % per - (row - 1) / 2) * pitch, y: base - 1.5 - r - lay * pitch, r }; }) }; };
    /* In the order taken: reading i across from x0 to x1, its value up the page on scale sv. */ B.run = (vs, sv, x0, x1, r) => vs.map((v, i) => ({ x: lerp(x0, x1, vs.length > 1 ? i / (vs.length - 1) : 0.5), y: sv.at(v), r }));
    // A pile place turned u of the way onto its side about (x0, y0) sliding to (x1, y1): value up the page (k), stacks leftwards (kh); at u = 1, level with B.run.
    B.tip = (p, u, A) => { const th = u * Math.PI / 2, c = Math.cos(th), s = Math.sin(th), k = lerp(1, A.k, u), kh = lerp(1, A.kh, u), dx = p.x - A.x0, dh = A.y0 - p.y;
      return { x: lerp(A.x0, A.x1, u) + k * dx * c - kh * dh * s, y: lerp(A.y0, A.y1, u) - k * dx * s - kh * dh * c, r: p.r * lerp(1, Math.min(A.k, A.kh), u) }; }; B.anchor = (st, sc, sv, ref, spine, room) => { let h = 1; st.pos.forEach((p) => { h = Math.max(h, st.base - p.y + p.r); }); const k = Math.abs(sv.w / sc.w);
      return { x0: sc.at(ref), y0: st.base, x1: spine, y1: sv.at(ref), k, kh: Math.min(k, room / h) }; };
    // Two strings over time folded into one against the other, u 0..1: a and b are reading i's places in their strips, f the pair's place once folded.
    B.fold = (a, b, f, u) => { const ux = K.ease(c01(2 * u)), uy = K.ease(c01(2 * u - 1)), x = lerp(a.x, f.x, ux), q = { x: lerp(b.x, f.x, ux), y: lerp(b.y, f.y, uy), r: lerp(b.r, f.r, uy) }; return [uy > 0 ? B.hop({ x, y: a.y, r: a.r }, q, uy, 12, (v) => v) : { x, y: a.y, r: a.r }, q]; };
    /* Timings (s) every lesson shares: a pour releases a bead every dt, each jinks `jink` high off every peg; a fresh batch re-sorts one every hop. */ B.T = { dt: 0.045, hop: 0.028, field: 0.5, fly: 0.5, settle: 0.45, bounce: 0.24, peel: 0.025, tip: 0.8, fold: 1.6, g: 1600, jink: 2 };
    B.releases = (n, t0, slow) => { const out = []; let t = t0; for (let i = 0; i < n; i++) { out.push(t); t += slow ? Math.max(B.T.dt, 0.32 * Math.pow(0.68, i)) : B.T.dt; } return out; };
    B.bounce = (tc) => (tc < 0 ? 0 : tc < 0.15 ? 4.5 * Math.sin(Math.PI * tc / 0.15) : tc < B.T.bounce ? 1.3 * Math.sin(Math.PI * (tc - 0.15) / (B.T.bounce - 0.15)) : 0); const fallT = (d, v0) => (-v0 + Math.sqrt(v0 * v0 + 2 * B.T.g * Math.max(2, d))) / B.T.g;
    /* A bead released at rel strikes a peg on each of the twelve rows (y0..y1), xAt(row) its nudges so far, then falls onto p and bounces twice; tc = s since landing. */ B.pour = (T, rel, xAt, p, y0, y1) => { const tau = T - rel, F = B.T.field, v0 = (y1 - y0) / F; if (tau < 0) return null;
      if (tau < F) { const f = 12 * tau / F, row = Math.min(11, Math.floor(f)), u = f - row; return { x: lerp(xAt(row), xAt(row + 1), K.ease(u)), y: lerp(y0, y1, tau / F) - (row ? B.T.jink * Math.sin(Math.PI * u) : 0), r: p.r, a: c01(tau / 0.08) }; }
      const tf = tau - F, tb = fallT(p.y - y1, v0); if (tf < tb) return { x: lerp(xAt(12), p.x, K.ease(tf / tb)), y: Math.min(p.y, y1 + v0 * tf + B.T.g * tf * tf / 2), r: p.r, a: 1 };

    if (st.pick == null) { st.got = 'empty'; return; }
    st.got = st.pick === d.want ? 'right' : 'wrong';
    if (st.got !== 'right') return;
    // A right answer brings in its working: the clock runs on, the rates add up, or the battery bank fails.
    story(ANSWER);
    if (d.view !== 'parts' && d.after != null) lifeGo(arrOf(i, st), yearsOf(i, st), 'run');
  } });
  const whyBtn = K.button({ label: 'Why?', secondary: true, into: '#acts', press: () => {
    if (STEPS[at()].show || finished) return;
    const st = S[at()]; st.why = !st.why;
  } });
  const replayBtn = K.button({ label: 'Play again', secondary: true, into: '#replay', press: () => {
    const i = at(), d = STEPS[i], st = S[i];
    if (!d.show || !d.demo || finished) return;
    lifeGo(arrOf(i, st), yearsOf(i, st), 'fill');
  } });
  const backBtn = K.button({ label: 'Back', secondary: true, into: '#nav', press: () => {
    if (finished) { finished = false; return; }
    stepper.set(Math.max(0, at() - 1), true);
  } });
  const nextBtn = K.button({ label: 'Continue', into: '#nav', press: () => {
    const i = at();
    if (finished || (!STEPS[i].show && S[i].got !== 'right')) return;
    if (i < STEPS.length - 1) { stepper.set(i + 1, true); return; }
    finished = true; halt();
    if (typeof K.complete === 'function') K.complete();
  } });
  K.button({ label: 'Start again', secondary: true, into: '#again', press: () => {
    S = STEPS.map((d, i) => blank(i)); finished = false; lastStep = -1; stepper.set(0, true);
  } });

  // A screen's controls open where that screen left them (quietly: this is not Dan moving them).
  function syncCtl(st) {
    if (yearsCtl.get() !== st.years) yearsCtl.set(st.years, true);
    if (arrCh.get() !== st.arr) arrCh.set(st.arr, true);
  }
  function enterStep(i) {
    const d = STEPS[i], st = S[i], w = lastStep, wd = w >= 0 ? STEPS[w] : null;
    lastStep = i; enter('stepbox');
    syncCtl(st); halt();
    M.springs.forEach((s) => { s.init = false; });
    if (d.view === 'parts') { story(0.9, { parts: [0, 0.45], labs: [0.25, 0.45] }); return; }
    freeze();
    const arr = arrOf(i, st), yrs = yearsOf(i, st);
    // The first screen opens on a full shelf, and the clock runs to its setting.
    if (!booted) {
      booted = true;
      lifeSet(arr, M.instant() ? yrs : 0);
      if (!M.instant()) { CK = { from: 0, to: yrs, t0: M.Tl + 0.6, dur: CLOCK_D, lin: true }; M.anim.play(); }
      return;
    }
    if (!wd || wd.view === 'parts') { if (d.demo) { lifeSet(arr, 0); lifeGo(arr, yrs, 'fill'); } else lifeSet(arr, yrs); return; }
    // What this screen adds arrives by a timetable: the MTBF line, then the curve traces the skyline and relaxes.
    const times = {};
    if (d.mtbf && !wd.mtbf) times.mtbf = [0.1, 0.5];
    if (d.demo || arr !== ARR) { lifeGo(arr, yrs, 'fill', times); return; }
    if (d.curve && !wd.curve) Object.assign(times, { sky: [0.35, 0.6], relax: [1.0, 0.6] });
    if (Object.keys(times).length) story(1.7, times);
    lifeGo(arr, yrs, 'ease');
  }
  // The still for the read-through: the step settled in the state its words end on.
  function stillAt(i, patch) {
    Object.assign(S[i], patch); syncCtl(S[i]); halt(); freeze();
    if (STEPS[i].view !== 'parts') lifeSet(arrOf(i, S[i]), yearsOf(i, S[i]));
    M.springs.forEach((s) => { s.init = false; });
    K.refresh();
  }

  write(el('finish'), FINISH);
  K.update((p) => {
    const i = Math.round(p.step), d = STEPS[i], st = S[i];
    if (i !== lastStep) enterStep(i);
    else if (d.show && !finished) {
      if (d.ctl && typeof p.years === 'number') {
        const v = Math.max(0, Math.min(30, Math.round(p.years)));
        if (v !== st.years) { st.years = v; st.moved = true; lifeGo(arrOf(i, st), v, 'ease'); }
      }
      if (d.choice && ARRS.indexOf(p.arr) >= 0 && p.arr !== st.arr) { st.arr = p.arr; lifeGo(p.arr, yearsOf(i, st), 'fill'); }
    }
    if (finished !== lastDone) { lastDone = finished; enter(finished ? 'done' : 'stepbox'); }
    const right = st.got === 'right', arr = arrOf(i, st), life = d.view !== 'parts';
    el('stepbox').hidden = finished;
    el('done').hidden = !finished;
    el('lead').textContent = d.lead || (d.view === 'tub' ? LEAD_TUB : LEAD);
    el('cap').textContent = d.caption || (d.view === 'tub' ? CAP_TUB : CAP);
    el('count').textContent = 'Step ' + (i + 1) + ' of ' + STEPS.length;
    const task = el('task');
    task.className = 'task' + (d.show ? ' show' : '');
    write(task, d.show ? d.text : d.task);
    replayBtn.el.hidden = finished || !d.show || !d.demo || M.reduce;
    el('replay').hidden = replayBtn.el.hidden;
    arrCh.el.hidden = finished || !d.show || !d.choice;
    el('choice').hidden = arrCh.el.hidden;
    yearsCtl.el.hidden = finished || !d.show || !d.ctl;
    el('ctl').hidden = yearsCtl.el.hidden;
    const tiles = finished || !life ? [] : d.show ? d.tiles || [] : right ? d.tilesAfter || [] : [];
    Object.keys(R).forEach((k) => { R[k].el.hidden = tiles.indexOf(k) < 0; });
    el('outs').hidden = !tiles.length;
    gaugeEl.hidden = !d.gauge;
    setText(hintOf(R.alive), d.gauge ? 'Counted on the shelf. The tick marks 37%.' : 'Counted on the shelf');
    setText(labOf(R.expect), arr === 'tub' ? 'The sketch expects' : 'The rule expects');
    setText(hintOf(R.expect), RULE[arr]);
    setText(hintOf(R.mtbf), MRULE[arr]);
    setText(hintOf(R.rate), paired(arr) ? 'For each pair still working' : 'For each unit still working');
    const opts = d.show ? [] : d.opts || [];
    el('picks').hidden = !opts.length;
    el('picks').classList.toggle('long', opts.some((o) => o.length > 9));
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      b.setLabel(opts[k]);
      b.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });
    el('acts').hidden = !!d.show;
    checkBtn.el.hidden = right;
    const fb = el('fb');
    fb.hidden = !!d.show;
    fb.className = 'fb' + (right ? ' right' : st.got === 'wrong' ? ' wrong' : '');
    write(fb, d.show ? '' : right ? 'That\'s it.' : st.got === 'wrong' ? hintFor(i, st) : st.got === 'empty' ? PICK : '');
    const why = el('why');
    why.hidden = d.show || !st.why;
    write(why, d.show ? '' : d.why);
    whyBtn.setLabel(st.why ? 'Hide why' : 'Why?');
    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !right);
    nextBtn.setLabel(i === STEPS.length - 1 ? 'Finish' : 'Continue');
    el('nav').hidden = backBtn.el.hidden && nextBtn.el.hidden;
    paint(i);
  });

  // ---------- known answers, worked out by hand ----------
  // A step painted in the state given, settled: what it draws. Everything a paint moves is put back as it was.
  function drawnAt(i, patch) {
    const keep = { S: S[i], LS: LS.map((s) => Object.assign({}, s)), CK: Object.assign({}, CK), lifeT0, ARR, Tb: M.Tb, Ts: M.Ts, sc: M.sc, times: M.times,
      sp: M.springs.map((s) => [s.v, s.vel, s.to, s.init]), dr: drawn.map((q) => Object.assign({}, q)) };
    S[i] = Object.assign({}, keep.S, patch); M.Tb = M.Ts = Infinity; M.sc = STILL; M.times = {}; FORCE = true;
    if (STEPS[i].view !== 'parts') lifeSet(arrOf(i, S[i]), yearsOf(i, S[i]));
    M.springs.forEach((s) => { s.init = false; });
    try { paint(i); return Object.assign({}, REC); }
    finally {
      S[i] = keep.S; keep.LS.forEach((s, k) => Object.assign(LS[k], s)); CK = keep.CK; lifeT0 = keep.lifeT0; ARR = keep.ARR;
      M.Tb = keep.Tb; M.Ts = keep.Ts; M.sc = keep.sc; M.times = keep.times; FORCE = false;
      M.springs.forEach((s, k) => { [s.v, s.vel, s.to, s.init] = keep.sp[k]; });
      keep.dr.forEach((q, k) => { drawn[k] = q; });
      paint();
    }
  }
  K.check('Only 36.7% of units are statistically likely to operate as long as the MTBF: with R(t) = e^(−λt), R at the MTBF of 1 ÷ λ is e^(−1) = 0.368, and of 20,000 lifetimes from the rule on screen at λ = 0.1 a year, about 36.8% outlast 10 years', () => {
    let k = 0;
    B.uni(910001, 20000).forEach((u) => { if (-Math.log(u) / RATE > 10) k++; });
    return B.facts([['e^(−1) = 0.368', near(Rsys('single', MTBF('single')), 0.3679, 1e-4)], ['about 36.8% outlast it', near(k / 20000, 0.368, 0.012)]]);
  }, { source: SRC_BEL });
  K.check('The inverse of λ, 1/λ, gives the mean time to failure, the MTBF: at λ = 0.1 a year that is 10 years, and 20,000 lifetimes from the rule on screen average about 10 years', () => {
    let s = 0;
    B.uni(920001, 20000).forEach((u) => { s += -Math.log(u) / RATE; });
    return B.facts([['1 ÷ λ = 10 years', MTBF('single') === 10], ['they average about 10 years', near(s / 20000, 10, 0.3)]]);
  }, { source: SRC_BEL });
  K.check('Worked by hand: 30 × 0.1 = 3 and 50 × 0.1 = 5; e^(−0.5) = 0.61, so 50 × e^(−0.5) = 30.3 and 1 − e^(−0.5) = 39%; 50 × e^(−1) = 18.4, 37%; ln 2 ÷ 0.1 = 6.9, about 7 years; in series e^(−2) = 13.5%, 0.1 + 0.1 = 0.2 a year and an MTBF of 5 years; in parallel 1 − (1 − e^(−1))² = 60%, and R added up over all time gives an MTBF of 15 years; 0.9 × 0.9 = 0.81, 1 − 0.1 × 0.1 = 0.99 and 0.9 × 0.1 + 0.1 × 0.9 = 0.18; 20 + 10 + 20 = 50 per million hours, so 1,000,000 ÷ 50 = 20,000 hours, the weakest part alone 50,000 and the MTBFs added 200,000. From the batch shown: 30 of 50 still work at 5 years, 27 at 6, 25 at 7 and 18 at 10; in series 21 of 25 pairs at 1 year and 3 at 10; in parallel all 25 at 1 year and 15 at 10', () => {
    const f = (v, dp) => K.fmt(v, { decimals: dp });
    let mp = 0, ms = 0;
    for (let t = 0; t < 400; t += 0.01) { mp += 0.005 * (Rsys('parallel', t) + Rsys('parallel', t + 0.01)); ms += 0.005 * (Rsys('series', t) + Rsys('series', t + 0.01)); }
    return B.facts([
      ['3 and 5', near(30 * RATE, 3, 1e-12) && near(N * RATE, 5, 1e-12)],
      ['0.61, 30.3 and 39%', f(Math.exp(-0.5), 2) === '0.61' && f(N * Math.exp(-0.5), 1) === '30.3' && f(100 * (1 - Math.exp(-0.5)), 0) === '39'],
      ['18.4 and 37%', f(N * Math.exp(-1), 1) === '18.4' && f(100 * Math.exp(-1), 0) === '37'],
      ['about 7 years', f(Math.LN2 / RATE, 1) === '6.9'],
      ['series: 13.5%, 0.2 a year, 5 years', f(100 * Rsys('series', 10), 1) === '13.5' && near(hsys('series', 3), 0.2, 1e-12) && MTBF('series') === 5 && near(ms, 5, 0.01)],
      ['parallel: 60% and 15 years', f(100 * Rsys('parallel', 10), 0) === '60' && near(mp, 15, 0.01) && MTBF('parallel') === 15],
      ['0.81, 0.99 and 0.18', near(0.9 * 0.9, 0.81, 1e-12) && near(1 - 0.1 * 0.1, 0.99, 1e-12) && near(0.9 * 0.1 + 0.1 * 0.9, 0.18, 1e-12)],
      ['the UPS', 20 + 10 + 20 === 50 && 1e6 / 50 === 20000 && 1e6 / 20 === 50000 && 1e6 / 20 + 1e6 / 10 + 1e6 / 20 === 200000],
      ['the batch, one by one', aliveAt('single', 5) === 30 && aliveAt('single', 6) === 27 && aliveAt('single', 7) === 25 && aliveAt('single', 10) === 18],
      ['the batch in pairs', aliveAt('series', 1) === 21 && aliveAt('series', 10) === 3 && aliveAt('parallel', 1) === 25 && aliveAt('parallel', 10) === 15],
    ]);
  });
  K.check('Shapes the rules give: one unit\'s failure rate is flat at 0.1 a year at every age and a series pair\'s at 0.2, while a parallel pair\'s starts at 0 and climbs towards 0.1 without reaching it; a steady rate loses the same share of what is left each year; the bathtub sketch starts high, sits near 0.02 a year in its middle years and climbs past 0.3 with wear-out; its batch fails in an early heap, a quiet floor and a wear-out hump; a lifetime is where the failure rate added up reaches −ln u', () => {
    const ys = Array.from({ length: 31 }, (_, t) => t), per = Array(30).fill(0);
    OWN_TUB.forEach((t) => { if (t <= 30) per[Math.min(29, Math.floor(t))]++; });
    let rising = true;
    for (let t = 0; t < 30; t++) if (!(hsys('parallel', t + 1) > hsys('parallel', t))) rising = false;
    return B.facts([
      ['flat at 0.1', ys.every((t) => hsys('single', t) === RATE)], ['0.2 in series', ys.every((t) => near(hsys('series', t), 0.2, 1e-12))],
      ['parallel from 0, climbing, under 0.1', hsys('parallel', 0) === 0 && rising && hsys('parallel', 30) < RATE && hsys('parallel', 30) > 0.09],
      ['the same share each year', ys.slice(0, 29).every((t) => near(Rsys('single', t + 1) / Rsys('single', t), Math.exp(-RATE), 1e-12))],
      ['the sketch high, low, high', htub(0) > 0.25 && htub(10) > 0.019 && htub(10) < 0.021 && htub(26) > 0.3],
      ['an early heap, a quiet floor, a wear-out hump', per[0] >= 7 && Math.max(...per.slice(4, 15)) <= 2 && per.slice(15).reduce((s, v) => s + v, 0) >= 25],
      ['a lifetime from the rate added up', near(B.lifeFrom(Htub, Math.exp(-Htub(10)), 30), 10, 1e-9) && near(B.lifeFrom((t) => RATE * t, Math.exp(-1), 30), 10, 1e-9)],
    ]);
  });
  K.check('Drawn right, and each puzzle hidden until answered: every unit stays on the picture at full size; each puzzle accepts one right answer of three, and before it nothing gives the answer away (the clock waits, no dots on the rate, no rates added, no fault); a right answer brings each in; every demonstration settles within 5 s and every answer within 2.5 s', () => {
    const facts = [];
    const shows = { year: (r) => r.clock === 6 && r.alive === 27, mtbf: (r) => r.clock === 10 && r.alive === 18, five: (r) => r.clock === 5 && r.alive === 30,
      ser1: (r) => r.clock === 1 && r.alive === 21, par1: (r) => r.clock === 1 && r.alive === 25 && r.hollow > 0, dots: (r) => r.dots === 2, add: (r) => r.add === true, fault: (r) => r.fault === true };
    STEPS.forEach((d, i) => {
      const r = drawnAt(i, d.show ? {} : { pick: d.want, got: 'right' });
      facts.push([d.name + ': drawn inside', r.inside && r.rmin >= 4.3]);
      if (d.show) return;
      const before = drawnAt(i, { pick: null, got: null });
      facts.push([d.name + ': one right answer of three', d.opts.length === 3 && d.opts.filter((o) => o === d.want).length === 1]);
      facts.push([d.name + ': hidden before, shown after', !shows[d.key](before) && !!shows[d.key](r)]);
    });
    facts.push(['series pairs at 10 years: 3 still work', drawnAt(6, { arr: 'series', years: 10 }).alive === 3]);
    facts.push(['a replay settles within 5 s', FILL_LEN <= 4.5 && CLOCK0 + CLOCK_D + 0.5 + B.T.bounce <= 4.5]);
    facts.push(['answers within 2.5 s', 0.1 + RUN_D + 0.5 + B.T.bounce <= ANSWER && 1.45 + 0.4 <= ANSWER && 1.05 + 0.4 <= ANSWER]);
    return B.facts(facts);
  });

  K.ready();
</script>
