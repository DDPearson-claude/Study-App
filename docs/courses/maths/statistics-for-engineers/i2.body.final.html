<script>
  // ==== Beads: the shared language (dataviz.md, "Copy this code"). Paste unchanged. ====
  const B = (() => { const B = {}, lerp = (a, b, t) => a + (b - a) * t, c01 = (v) => Math.max(0, Math.min(1, v)); B.lerp = lerp; B.c01 = c01; B.r2 = (v) => Math.round(v * 100) / 100;

    B.round = (v, res) => +(Math.round(v / res) * res).toFixed(9); B.stats = (vs) => { const n = vs.length; if (!n) return null; let m = 0, q = 0; vs.forEach((v) => { m += v / n; }); vs.forEach((v) => { q += (v - m) * (v - m); });

    B.fit = (pts) => { const n = pts.length; if (n < 2) return null; let mx = 0, my = 0, sxx = 0, sxy = 0, rr = 0; pts.forEach((p) => { mx += p[0] / n; my += p[1] / n; }); pts.forEach((p) => { sxx += (p[0] - mx) * (p[0] - mx); sxy += (p[0] - mx) * (p[1] - my); }); const b = sxx ? sxy / sxx : 0;

      xs.forEach((x, i) => { sxy += (x - mx) * (ys[i] - my); sxx += (x - mx) * (x - mx); syy += (ys[i] - my) * (ys[i] - my); }); return sxx > 0 && syy > 0 ? sxy / Math.sqrt(sxx * syy) : 0; };

    // The true value: a dashed line from the hopper (or the window) down to the beam, named beside the hopper, or above it without the
    // field. Where the mean all but sits on it, it stops at the mean's value and the mean's own line carries on down.
    const tx = SC.at(TRUE), fOn = FA.field > 0.5, tTop = B.lerp(TT, d.win ? FY.y0 - 13 : FY.y0 - 3, FA.field);
    if (!d.win || !fOn) {
      if (show(trueLab, fOn ? FA.field : 1)) { B.set(trueLab, fOn ? { x: SP.h.v + 18, y: FY.y0 - 1, 'text-anchor': 'start' } : { x: tx, y: TT - 6, 'text-anchor': 'middle' }); REC.boxes.push(boxOf(trueLab)); }
    }
    // Once the mean has moved off it, the true value's line stops at the top of the swarm: only the mean's own line runs through beads.
    const meet = !hatOn && valBox && Math.abs(SP.m.v - tx) < 3, moved = Math.abs(SP.m.v - tx) > 4;
    const colTop = L.pile.reduce((m, q) => (Math.abs(q.x - tx) < q.r + 1 ? Math.min(m, q.y - q.r - 2) : m), BASE - 1);
    const tl = vline(tx, tTop, meet ? valBox.y0 - 2 : moved ? colTop : BASE - 1, GAPS);
    show(truth, 1); B.set(truth, { d: tl.d });
    REC.lines.push({ x: tx, segs: tl.segs });
    if (d.limit) {
      // The limit line breaks round every bead it would cross, as it does round labels.
      const bg = drawn.filter((q) => q && !(q.a < 0.5) && Math.abs(q.x - lx) < q.r + 1).map((q) => ({ x0: q.x - q.r + 1, x1: q.x + q.r - 1, y0: q.y - q.r + 1, y1: q.y + q.r - 1 }));
      const la = arrive(d, 'limit'), ll = vline(lx, B.lerp(262, 64, la), 262, GAPS.concat(bg));
      if (show(limitL, la > 0.01 ? 1 : 0)) B.set(limitL, { d: ll.d });
      REC.lines.push({ x: lx, segs: ll.segs });
    }
    if (RS && RS.n > 1) { R.unc.set(RS.U); R.sd.set(RS.sd); }
    else { R.unc.set('none yet'); R.sd.set('none yet'); }
    // Each bead on its colour: z its distance from the mean, KK how far it has taken it; a splash on the pile, a ripple in mid-air.
    let rmin = Infinity;
    for (let k = 0; k < N; k++) {
      const q = drawn[k], rp = q.tc != null && !pouring ? 0.65 + 2 * q.tc : null;
      B.paint(beads[k], rp == null ? q : Object.assign({}, q, { ring: rp }), 0, FLOOR[k], ZD[k] = zAt(k, L), KK[k]);
      if (q.a > 0.5) rmin = Math.min(rmin, q.r);
    }
    const ovOk = ['lo', 'hi'].every((k) => L.sw.over[k].every((j) => { const q = L.pile[j], e = ENDS[k]; return sc.off(L.vs[j]) === e.dir && q.x - q.r >= e.x0 - 1e-6 && q.x + q.r <= e.x1 + 1e-6; }))
      && L.vs.every((v, j) => !sc.off(v) || L.sw.over.lo.indexOf(j) >= 0 || L.sw.over.hi.indexOf(j) >= 0) && L.pile.every((q) => q.x - q.r > 0 && q.x + q.r < 340);
    Object.assign(REC, { theta, fx, xm, rmin, ovOk, over: L.over, n, res: +st.mres, pouring, fulcrum: fa > 0 });
  }

  // A meter reading on a scale in volts; after a right answer, 1% of it each side, then three digits more, then the whole range.
  function paintRating(i, d, st) {
    const right = st.got === 'right', T = M.Ts, sc = RSC, r = 5;
    hideFrom(1);
    const p = { x: sc.at(RATE.v), y: BASE - 1.5 - r, r, a: 1 };
    FLOOR[0] = p.y; drawn[0] = p;
    [beam, minor, major, title].forEach((e) => show(e, 1));
    nums.forEach((t, k) => { if (NUMON[k]) show(t, 1); });
    if (show(readLab, 1)) { B.set(readLab, { x: p.x, y: p.y - r - 9 }); REC.boxes.push(boxOf(readLab)); }
    if (right) {
      const a1 = K.arrive(T, 0.15, 0.5), a2 = K.arrive(T, 0.75, 0.5), a3 = K.arrive(T, 1.35, 0.5);
      const pct = accOf(RATE.v, RATE.pct, 0, RATE.step), dig = accOf(RATE.v, 0, RATE.dig, RATE.step);
      if (show(rIn, a1) && show(rInLab, a1)) B.bracket(rIn, rInLab, sc.at(RATE.v - pct * a1), sc.at(RATE.v + pct * a1), 170, 5);
      rDig.forEach(([pth, lab], k) => {
        const s = k ? 1 : -1, e0 = RATE.v + s * pct, e1 = RATE.v + s * (pct + dig * a2);
        if (a2 > 0.01 && show(pth, a2) && show(lab, a2)) B.bracket(pth, lab, sc.at(Math.min(e0, e1)), sc.at(Math.max(e0, e1)), 170, 5, true);
      });
      if (show(rAll, a3) && show(rAllLab, a3)) B.bracket(rAll, rAllLab, sc.at(RATE.v - pct - dig), sc.at(RATE.v + pct + dig), 134, 5, true);
      REC.rLo = RATE.v - pct - dig; REC.rHi = RATE.v + pct + dig;
    }
    REC.rating = right;
  }

  // A result against a maximum: the value marked, and after a right answer its bracket growing out across the limit.
  function paintMax(i, d, st) {
    const right = st.got === 'right', T = M.Ts, sc = MSC, xm = sc.at(MAXR.m), lx = sc.at(MAXR.max), f = B.r2;
    hideFrom(0);
    [beam, minor, major, title].forEach((e) => show(e, 1));
    nums.forEach((t, k) => { if (NUMON[k]) show(t, 1); });
    show(meanLine, 1); B.set(meanLine, { x1: xm, x2: xm, y1: BASE - 1, y2: 156 });
    if (show(resLab, 1)) { B.set(resLab, { x: xm, y: 146 }); REC.boxes.push(boxOf(resLab)); }
    if (show(limLab, 1)) { B.set(limLab, { x: lx, y: RD + 2 }); REC.boxes.push(boxOf(limLab)); }
    if (show(zone, 1)) B.set(zone, { x: lx, y: BASE + 1.2, width: sc.a1 - lx });
    const ll = vline(lx, 100, 262, [boxOf(resLab)]);
    show(limitL, 1); B.set(limitL, { d: ll.d });
    REC.lines = [{ x: lx, segs: ll.segs }];
    if (right) {
      const a = K.arrive(T, 0.15, 0.6), h = (sc.at(MAXR.m + MAXR.u) - xm) * a;
      if (show(hat, a)) B.set(hat, { d: 'M' + f(xm - h) + ' 161V156H' + f(xm + h) + 'V161' });
      REC.maxLo = sc.val(xm - h); REC.maxHi = sc.val(xm + h);
    }
    REC.maxB = right;
  }

  // The line under the picture: what is on screen now, cause then effect, in everyday words.
  function sayFor(i, d, st) {
    const L = d.view === 'pile' ? layout(+st.avg, st.off, +st.mres, st.b) : null;
    if (d.name === 'Fifty readings') {
      if (REC.pouring) return 'Readings are landing, and the fulcrum keeps sliding to the mean of those down so far.';
      return trace.i >= 0 ? 'That bead was nudged twelve times on its way down. It landed where its nudges added up to.' : 'Fifty readings of one steady voltage, each nudged differently. Most sit inside the bracket under the beam.';
    }
    if (d.name === 'Average a few') {
      if (st.avg === '4') return 'Four readings a bead. The swarm is half as wide and taller, and it still centres on the true value.';
      if (st.avg === '2') return 'Two readings a bead. Their random errors partly cancel, so the swarm narrows to about seven tenths of its width.';
      return st.avgMoved ? 'One reading a bead, so the swarm is as wide as single readings scatter.' : 'Each bead is one reading for now. Will averaging move the swarm, or only narrow it?';
    }
    if (d.name === 'The result') return 'The result is narrow because it pins down the mean of fifty. Single readings still spread across the wide bracket.';
    if (d.name === 'A coarser meter') {
      if (st.mres === '0.05') return 'Each reading is rounded to the nearest 0.05 V, so they stack into bricks. The mean of the fifty barely moves.';
      return st.mresMoved ? 'Back on the 0.01 V meter, each column is one step of 0.01 V.' : 'This meter reads to 0.01 V, so each column of the swarm is one step.';
    }
    if (d.name === 'Reads high') {
      const n = +st.avg, gap = Math.abs(L.s.m - TRUE) - L.U;
      const lead = n === 4 ? 'Four readings a bead halve the spread. ' : n === 2 ? 'Two readings a bead cut the spread to about seven tenths. ' : '';
      if (st.off < 0.005) return lead + (n > 1 ? 'The swarm and the result still centre on the dashed true value.' : 'The meter reads true, so the swarm and the result centre on the dashed true value.');
      const tail = gap > 0.0005 ? 'The true value falls outside the result.' : gap > -0.0005 ? 'The true value sits right at the edge of the result.' : 'The result still reaches back to the true value.';
      return (n > 1 ? lead + 'They tighten round where the meter centres, not round the true value. ' : 'The meter reads high, so every reading lands high and the whole swarm shifts across. ') + tail;
    }
    if (d.name === 'Against a limit') {
      const lo = L.s.m - L.U, hi = L.s.m + L.U;
      if (hi < LIM) return 'The whole result sits below the limit, so the readings show a pass.';
      if (lo > LIM) return 'The whole result sits above the limit, so the readings say fail. Yet the true value is still 27.00 V, under the limit.';
      return 'The result overlaps the limit. From the readings alone, the true value could be either side, so this shows neither a pass nor a fail.';
    }
    return '';
  }

  function paint(i) {
    if (i == null) i = at();
    const d = STEPS[i], st = S[i];
    if (FORCE || M.idle()) { fadeStep(1e9, i); kStep(1e9, i); }
    SEEN = new Set(); GAPS = []; REC = { view: d.view, boxes: [], lines: [], sd: false, most: false, within: false, hat: null, rating: false, maxB: false, extra: false, ring: false, step: false, val: null };
    setView(d.view);
    if (d.view === 'pile') paintPile(i, d, st);
    else {
      B.vis(G.field, 0); B.pegHit(PEG, []); tilt(0, 170);
      if (d.view === 'rating') paintRating(i, d, st); else paintMax(i, d, st);
      for (let k = 0; k < N; k++) B.paint(beads[k], drawn[k], 0, FLOOR[k], 0, 0);
      B.paint(extra, null, 0, 0, 0, 0);
    }
    ALL.forEach((e) => { if (!SEEN.has(e)) e.setAttribute('display', 'none'); });
    // Does any dashed line run through a label? (A check reads this.)
    REC.clear = REC.lines.every((ln) => ln.segs.every((s) => REC.boxes.every((b) => ln.x < b.x0 - 1 || ln.x > b.x1 + 1 || s[1] < b.y0 || s[0] > b.y1)));
    svg.setAttribute('aria-label', d.alt || '');
    const sy = el('say'), s = d.show ? sayFor(i, d, st) : '';
    sy.textContent = s; sy.hidden = !s;
    M.fade();
  }

  // ---------- Dan's moves ----------
  // Tap a bead on the first screen, once the pour has landed: its path through the pegs draws in.
  svg.addEventListener('click', (ev) => {
    if (!STEPS[at()].tap || finished || M.moving('pour')) return;
    const k = B.pick(svg, ev, drawn.map((q) => (q.a > 0.5 ? q : { x: -99, y: -99, r: 0 })), 14);
    if (k < 0) return;
    trace = { i: k, t: M.instant() ? M.Tl - 10 : M.Tl };
    if (M.instant()) { paint(); return; }
    M.anim.play();
  });
  const pickBtns = [0, 1, 2].map((k) => K.button({ label: 'Answer ' + (k + 1), secondary: true, into: '#picks', press: () => {
    const i = at(), d = STEPS[i], st = S[i];
    if (finished || d.show || !d.opts || k >= d.opts.length || st.got === 'right') return;
    const was = st.got === 'wrong';
    st.pick = d.opts[k]; st.got = null;
    if (was) halt();
  } }));
  // A right answer brings in its working: a bracket grows, or the beads re-sort to the setting the answer names.
  function answer(i) {
    const d = STEPS[i], st = S[i];
    if (d.onRight) { Object.assign(st, d.onRight); M.enter(M.plan(M.arc(0.012, 20), 0, ARC_END + 0.6, {}, false)); }
    else story(ANSWER);
  }
  const checkBtn = K.button({ label: 'Check', into: '#acts', press: () => {
    const i = at(), d = STEPS[i], st = S[i];
    if (d.show || finished || st.got === 'right') return;
    if (st.pick == null) { st.got = 'empty'; return; }
    st.got = st.pick === d.want ? 'right' : 'wrong';
    if (st.got === 'right') answer(i); else halt();
  } });
  const whyBtn = K.button({ label: 'Why?', secondary: true, into: '#acts', press: () => {
    if (STEPS[at()].show || finished) return;
    const st = S[at()]; st.why = !st.why;
  } });
  // Drop a fresh batch: the next seed's fifty pour through the pegs, one soft tick each as it leaves (the shared B.ticks), land on the
  // pile and rise into the swarm with a soft chime.
  const freshBtn = K.button({ label: 'Drop a fresh batch', secondary: true, into: '#fresh', press: () => {
    const i = at(), d = STEPS[i], st = S[i];
    if (!d.fresh || finished) return;
    st.b += 1; trace = { i: -1, t: -1e9 };
    const L = layout(+st.avg, st.off, +st.mres, st.b), fy = fyOf(L);
    B.ticks(L.vs, L.sc, B.T.dt);
    const sc = B.rise(M.pour(L.heap, fy - FH, fy, 0.03, false), L.heap, SC.at(L.s.m));
    if (M.move(sc)) B.chime(sc);
    K.refresh();
  } });
  const replayBtn = K.button({ label: 'Play again', secondary: true, into: '#replay', press: () => {
    const i = at(), d = STEPS[i];
    if (!d.show || !d.dur || finished) return;
    trace = { i: -1, t: -1e9 };
    startDemo(i);
  } });
  const backBtn = K.button({ label: 'Back', secondary: true, into: '#nav', press: () => {
    if (finished) { finished = false; return; }
    stepper.set(Math.max(0, at() - 1), true);
  } });
  const nextBtn = K.button({ label: 'Continue', into: '#nav', press: () => {
    const i = at();
    if (finished || (!STEPS[i].show && S[i].got !== 'right')) return;
    if (i < STEPS.length - 1) { stepper.set(i + 1, true); return; }
    finished = true; halt();
    if (typeof K.complete === 'function') K.complete();
  } });
  K.button({ label: 'Start again', secondary: true, into: '#again', press: () => {
    S = STEPS.map((d, i) => blank(i)); finished = false; lastStep = -1; stepper.set(0, true);
  } });

  // A step's demonstration: the pour on the first screen, or the beads settling while its parts arrive on the story clock.
  function startDemo(i) {
    const d = STEPS[i];
    SP.f.init = false;
    if (d.pour) { const L = layout(1, 0, RES, S[i].b), fy = fyOf(L); B.aim(SP.fy, fy, true); M.enter(M.plan(B.rise(M.pour(L.heap, fy - FH, fy, FADE, true), L.heap, SC.at(L.s.m)), 0, 0, {}, false)); }
    else M.enter(M.plan(M.settle(0), 0, d.dur, {}, false));
    paint(i);
  }
  // The controls open where this screen left them (quietly: this is not Dan moving them).
  function syncCtl(st) {
    if (ctl.avg.get() !== st.avg) ctl.avg.set(st.avg, true);
    if (ctl.mres.get() !== st.mres) ctl.mres.set(st.mres, true);
    if (Math.abs(ctl.off.get() - st.off) > 1e-9) ctl.off.set(st.off, true);
  }
  // Entering a screen: its demonstration plays, or the beads settle into its swarm (fading in where the last screen had none).
  function enterStep(i) {
    const d = STEPS[i], st = S[i], prev = lastStep >= 0 ? STEPS[lastStep].view : 'pile';
    lastStep = i; enter('stepbox');
    syncCtl(st);
    trace = { i: -1, t: -1e9 }; LASTRS = null;
    M.springs.forEach((s) => { s.init = false; });
    halt(); fadeStep(1e9, i);
    if (prev !== 'pile') hideFrom(0);   // from a scale of its own, the swarm fades in where it settles
    if (d.dur) startDemo(i);
    else if (d.view === 'pile') M.move(M.settle(0));
  }
  // The still for the read-through: the step settled in the state its words end on.
  function finishNow() { halt(); M.rest(); paint(); }
  function stillAt(name, patch) {
    const i = IX(name);
    Object.assign(S[i], patch); syncCtl(S[i]); halt();
    M.springs.forEach((s) => { s.init = false; });
    K.refresh();
  }

  write(el('finish'), FINISH);
  K.update((p) => {
    const i = Math.round(p.step), d = STEPS[i], st = S[i];
    if (i !== lastStep) enterStep(i);
    else if (d.show && !finished && d.ctls) {
      let arc = false, slide = false;
      const avg = String(p.avg), mres = String(p.res);
      if (d.ctls.indexOf('avg') >= 0 && ['1', '2', '4'].indexOf(avg) >= 0 && avg !== st.avg) { st.avg = avg; st.avgMoved = true; arc = true; }
      if (d.ctls.indexOf('mres') >= 0 && ['0.01', '0.05'].indexOf(mres) >= 0 && mres !== st.mres) { st.mres = mres; st.mresMoved = true; arc = true; }
      if (d.ctls.indexOf('off') >= 0 && typeof p.offset === 'number') { const v = Math.round(p.offset * 100) / 100; if (Math.abs(v - st.off) > 1e-9) { st.off = v; st.offMoved = true; slide = true; } }
      if (arc) M.move(M.arc(0.012, 20)); else if (slide) M.move(M.settle(0.004));
    }
    if (finished !== lastDone) { lastDone = finished; enter(finished ? 'done' : 'stepbox'); }
    const right = st.got === 'right';
    el('stepbox').hidden = finished;
    el('done').hidden = !finished;
    el('lead').textContent = d.lead || LEAD;
    el('cap').textContent = d.caption || CAP;
    el('count').textContent = 'Step ' + (i + 1) + ' of ' + STEPS.length;
    // The colour key: its beads painted by the same rule as the swarm's, in this theme; it shows wherever beads are coloured.
    fkDots.forEach(([c, z]) => { c.style.fill = B.fade(z); });
    el('fkey').hidden = d.view !== 'pile';
    const task = el('task');
    task.className = 'task' + (d.show ? ' show' : '');
    write(task, d.show ? (d.afterIf && d.afterIf(st) ? d.after : d.text) : d.task);
    replayBtn.el.hidden = !d.show || !d.dur || M.reduce;
    el('replay').hidden = replayBtn.el.hidden;
    freshBtn.el.hidden = !d.show || !d.fresh || finished;
    el('fresh').hidden = freshBtn.el.hidden;
    let anyChoice = false, anySlider = false;
    Object.keys(ctl).forEach((id) => { const on = !finished && !!d.show && (d.ctls || []).indexOf(id) >= 0; ctl[id].el.hidden = !on; if (on) { if (id === 'off') anySlider = true; else anyChoice = true; } });
    el('choices').hidden = !anyChoice;
    el('ctl').hidden = !anySlider;
    const tiles = d.show && !finished ? d.tiles || [] : [];
    Object.keys(R).forEach((k) => { R[k].el.hidden = tiles.indexOf(k) < 0; });
    el('outs').hidden = !tiles.length;
    const opts = d.show ? [] : d.opts || [];
    el('picks').hidden = !opts.length;
    el('picks').classList.toggle('long', opts.some((o) => o.length > 9));
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      b.setLabel(opts[k]);
      b.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });
    el('acts').hidden = !!d.show;
    checkBtn.el.hidden = right;
    const fb = el('fb');
    fb.hidden = !!d.show;
    fb.className = 'fb' + (right ? ' right' : st.got === 'wrong' ? ' wrong' : '');
    write(fb, d.show ? '' : right ? 'That\'s it.' : st.got === 'wrong' ? hintFor(i, st) : st.got === 'empty' ? PICK : '');
    const why = el('why');
    why.hidden = d.show || !st.why;
    write(why, d.show ? '' : d.why);
    whyBtn.setLabel(st.why ? 'Hide why' : 'Why?');
    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !right);
    nextBtn.setLabel(i === STEPS.length - 1 ? 'Finish' : 'Continue');
    el('nav').hidden = backBtn.el.hidden && nextBtn.el.hidden;
    paint(i);
  });

  // ---------- known answers, worked out by hand; each names the fact that broke ----------
  // A step painted in the state given, settled: what it draws. Everything a paint moves is put back as it was: the springs (a check run
  // mid-pour must not shift the hopper), the beads and their colours.
  function drawnAt(i, patch) {
    const keepS = S[i], keepTb = M.Tb, keepTs = M.Ts, keepSc = M.sc, keepTr = trace, keepFA = Object.assign({}, FA), keepL = LASTRS;
    const keepSp = M.springs.map((s) => [s.v, s.vel, s.to, s.init]), keepD = drawn.map((q) => Object.assign({}, q)), keepF = FLOOR.slice(), keepK = KK.slice(), keepZ = ZD.slice();
    S[i] = Object.assign({}, keepS, { b: 0 }, patch); M.Tb = M.Ts = Infinity; M.sc = STILL; FORCE = true;
    try { paint(i); return Object.assign({}, REC); }
    finally {
      S[i] = keepS; M.Tb = keepTb; M.Ts = keepTs; M.sc = keepSc; trace = keepTr; Object.assign(FA, keepFA); LASTRS = keepL; FORCE = false;
      M.springs.forEach((s, k) => { [s.v, s.vel, s.to, s.init] = keepSp[k]; });
      keepD.forEach((q, k) => { drawn[k] = q; FLOOR[k] = keepF[k]; KK[k] = keepK[k]; ZD[k] = keepZ[k]; });
      paint();
    }
  }
  K.check('The spread of a mean is the spread of one reading divided by the square root of the number of times the measurement was repeated: over 2,000 beads from the rule on screen, single readings spread 0.04 V, and means of 2 and of 4 readings spread 1 ÷ √2 and 1 ÷ 2 as widely, within 5%', () => {
    const sdN = (n) => { const all = []; for (let b = 1; b <= 40; b++) { const W = B.nudges(7000 + b, 4 * N); for (let i = 0; i < N; i++) { let v = 0; for (let j = 0; j < n; j++) v += SD * B.sum(W[i + j * N]); all.push(v / n); } } return B.stats(all).sd; };
    const s1 = sdN(1), s2 = sdN(2), s4 = sdN(4);
    return B.facts([['single readings spread 0.04 V', near(s1, SD, 0.05 * SD)], ['two a bead spread 1 ÷ √2 as wide', near(s2 / s1, Math.SQRT1_2, 0.05 * Math.SQRT1_2)], ['four a bead spread half as wide', near(s4 / s1, 0.5, 0.025)]]);
  }, { source: SRC_N });
  K.check('Systematic: the same influence affects the result for each of the repeated measurements, so you learn nothing extra just by repeating. With the meter 0.01, 0.02 or 0.03 V high, every reading of the batch lands exactly that much higher, and so does the mean, whether each bead is the mean of 1, 2 or 4 readings; the scatter is unchanged', () =>
    B.facts([0.01, 0.02, 0.03].flatMap((o) => [1, 2, 4].map((n) => {
      const a = layout(n, 0, RES), b = layout(n, o, RES);
