<p class="lead" id="lead">Each bead is one simulated reading of a UPS's output voltage, taken on rounds. Say the UPS holds its output at 115.0 V.</p>

<div class="pz" id="pz">
  <div id="prog"></div>
  <div id="stepbox">
    <p class="k-label count" id="count"></p>
    <p class="task" id="task"></p>
    <svg class="bd-scene" id="scene" viewBox="0 0 340 300" width="100%" role="img" aria-label=""></svg>
    <div class="replay" id="replay"></div>
    <div class="k-controls" id="ctl"></div>
    <div class="row" id="fresh"></div>
    <p class="say" id="say"></p>
    <div class="k-readouts" id="outs"></div>
    <div class="row picks" id="picks"></div>
    <div class="row acts" id="acts"></div>
    <p class="fb" id="fb" aria-live="polite"></p>

</div>

<p class="caption" id="cap">Simulated: 115.0 V plus 0.3 V times twelve nudges added, read to the meter's step of 0.1 V.</p>

<script>
  // ==== Beads: the shared language (dataviz.md, "Copy this code"). Paste unchanged. ====
  const B = (() => { const B = {}, lerp = (a, b, t) => a + (b - a) * t, c01 = (v) => Math.max(0, Math.min(1, v)); B.lerp = lerp; B.c01 = c01; B.r2 = (v) => Math.round(v * 100) / 100;
    // The rule. Seeded, so every picture and check is stable; a fresh batch is the next seed.
    B.rng = (seed) => { let a = (Math.imul(seed | 0, 7919) + 104729) >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; };
    // n readings × 12 nudges in −½..+½: twelve sum to SD exactly 1, so sd × B.sum(u) is an error of SD sd; B.sum(u, row) is a bead after `row` rows of pegs.
    // A second string of readings takes rows n..2n−1 of B.nudges(seed, 2n), never reading i's own: two strings share only what the rule gives them both.
    B.nudges = (seed, n) => { const r = B.rng(seed); return Array.from({ length: n }, () => Array.from({ length: 12 }, () => r() - 0.5)); }; B.sum = (u, upto) => { let s = 0; for (let j = 0; j < (upto == null ? u.length : upto); j++) s += u[j]; return s; };
    B.uni = (seed, n) => { const r = B.rng(seed); return Array.from({ length: n }, () => 1 - r()); };   // in (0, 1]: a lifetime is −ln(u) / rate
    B.round = (v, res) => +(Math.round(v / res) * res).toFixed(9); B.stats = (vs) => { const n = vs.length; if (!n) return null; let m = 0, q = 0; vs.forEach((v) => { m += v / n; }); vs.forEach((v) => { q += (v - m) * (v - m); });
      const s = vs.slice().sort((a, b) => a - b); return { n, m, sd: n > 1 ? Math.sqrt(q / (n - 1)) : 0, med: n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2, lo: s[0], hi: s[n - 1] }; }; B.within = (vs, m, sd, z) => vs.filter((v) => Math.abs(v - m) <= z * sd * (1 + 1e-9)).length;
    B.fit = (pts) => { const n = pts.length; if (n < 2) return null; let mx = 0, my = 0, sxx = 0, sxy = 0, rr = 0; pts.forEach((p) => { mx += p[0] / n; my += p[1] / n; }); pts.forEach((p) => { sxx += (p[0] - mx) * (p[0] - mx); sxy += (p[0] - mx) * (p[1] - my); }); const b = sxx ? sxy / sxx : 0;
      pts.forEach((p) => { rr += Math.pow(p[1] - my - b * (p[0] - mx), 2); }); return { b, mx, my, at: (x) => my + b * (x - mx), res: n > 2 ? Math.sqrt(rr / (n - 2)) : 0 }; };

      xs.forEach((x, i) => { sxy += (x - mx) * (ys[i] - my); sxx += (x - mx) * (x - mx); syy += (ys[i] - my) * (ys[i] - my); }); return sxx > 0 && syy > 0 ? sxy / Math.sqrt(sxx * syy) : 0; };
    // A lifetime from a sketched hazard: the t at which the total hazard H(t) reaches −ln u, by halving; Infinity past tmax. A column's expected count from R.
    B.lifeFrom = (H, u, tmax) => { const goal = -Math.log(u); if (!(H(tmax) >= goal)) return Infinity; let a = 0, b = tmax; for (let k = 0; k < 44; k++) { const m = (a + b) / 2; if (H(m) < goal) a = m; else b = m; } return (a + b) / 2; };
    B.colExpect = (R, n, bin) => (t) => n * (R(Math.max(0, t - bin / 2)) - R(Math.max(0, t + bin / 2)));

    B.scale = (lo, hi, bin, a0, a1) => { const n = Math.round((hi - lo) / bin) + 1, w = (a1 - a0) / n, col = (v) => Math.max(0, Math.min(n - 1, Math.round((v - lo) / bin + 1e-7)));
      return { lo, hi, bin, n, w, a0, a1, col, mid: (c) => a0 + (c + 0.5) * w, at: (v) => a0 + ((v - lo) / bin + 0.5) * w, val: (x) => lo + ((x - a0) / w - 0.5) * bin, off: (v) => (v < lo - bin / 2 ? -1 : v > hi + bin / 2 ? 1 : 0) }; };

      vs.map((v, i) => i).sort((a, b) => (sc.off(vs[a]) ? 1 : 0) - (sc.off(vs[b]) ? 1 : 0) || a - b).forEach((i) => { const c = sc.col(vs[i]); cnt[c] = (cnt[c] || 0) + 1; idx[i] = cnt[c] - 1; });
      const tall = Math.max(1, ...Object.values(cnt).map((k) => Math.ceil(k / per))), pitch = Math.min(fit.pitch, (base - 1.5 - top) / tall), r = Math.min(fit.r, (pitch - 1) / 2);
      return { r, tall, pitch, per, base, cnt, pos: vs.map((v, i) => { const c = sc.col(v), lay = Math.floor(idx[i] / per), row = Math.min(per, cnt[c] - lay * per); return { x: sc.mid(c) + (idx[i] % per - (row - 1) / 2) * pitch, y: base - 1.5 - r - lay * pitch, r }; }) }; };
    /* In the order taken: reading i across from x0 to x1, its value up the page on scale sv. */ B.run = (vs, sv, x0, x1, r) => vs.map((v, i) => ({ x: lerp(x0, x1, vs.length > 1 ? i / (vs.length - 1) : 0.5), y: sv.at(v), r }));
    // A pile place turned u of the way onto its side about (x0, y0) sliding to (x1, y1): value up the page (k), stacks leftwards (kh); at u = 1, level with B.run.
    B.tip = (p, u, A) => { const th = u * Math.PI / 2, c = Math.cos(th), s = Math.sin(th), k = lerp(1, A.k, u), kh = lerp(1, A.kh, u), dx = p.x - A.x0, dh = A.y0 - p.y;
      return { x: lerp(A.x0, A.x1, u) + k * dx * c - kh * dh * s, y: lerp(A.y0, A.y1, u) - k * dx * s - kh * dh * c, r: p.r * lerp(1, Math.min(A.k, A.kh), u) }; }; B.anchor = (st, sc, sv, ref, spine, room) => { let h = 1; st.pos.forEach((p) => { h = Math.max(h, st.base - p.y + p.r); }); const k = Math.abs(sv.w / sc.w);
      return { x0: sc.at(ref), y0: st.base, x1: spine, y1: sv.at(ref), k, kh: Math.min(k, room / h) }; };
    // Two strings over time folded into one against the other, u 0..1: a and b are reading i's places in their strips, f the pair's place once folded.
    B.fold = (a, b, f, u) => { const ux = K.ease(c01(2 * u)), uy = K.ease(c01(2 * u - 1)), x = lerp(a.x, f.x, ux), q = { x: lerp(b.x, f.x, ux), y: lerp(b.y, f.y, uy), r: lerp(b.r, f.r, uy) }; return [uy > 0 ? B.hop({ x, y: a.y, r: a.r }, q, uy, 12, (v) => v) : { x, y: a.y, r: a.r }, q]; };

  // ---------- motion: the shared engine (B.motion) moves every bead; this lesson's own parts run on its story clock, M.Ts ----------

  const FLOOR = new Array(N).fill(BASE);

  const FA = { field: 0 };

  const drawn = M.drawn;

  // Springs give the balance point its weight: the fulcrum lags the mean, so the beam tips, then levels as it catches up. The bell's

  const FY = { y0: 44, y1: 100 };   // the peg field's top and bottom

  const story = (dur) => M.enter(M.plan(STILL, 0, dur, {}, false));
  function halt() { M.anim.pause(); M.Tb = M.Ts = Infinity; M.sc = STILL; M.leave = null; }
  function enter(id) {

  }
  // A demonstration's part, by its step's timetable; 1 when the step has none or its story is over.

  // The counting sweep: each band blooms, then its beads send out a ring one by one from the middle outward.
  function countPlan(L) {

  // ---------- painting ----------
  const show = (e, a, rise) => { if (B.vis(e, a, rise)) { SEEN.add(e); return true; } return false; };
  function tilt(theta, fx) {

  // A label's box, from where it is set and how wide its words are.

      if (show(ring, ra)) { B.set(ring, { cx: rd.x + shake[RING], cy: rd.y, r: rd.r + 2.6 }); ring.classList.toggle('out', rOut); }
      if (d.ctls) {
        const cx = rd.x + shake[RING], o = rd.r + 5;
        if (show(chev, ra)) { B.set(chev, { d: 'M' + B.r2(cx - o) + ' ' + B.r2(rd.y - 3.5) + 'v7l-4 -3.5zM' + B.r2(cx + o) + ' ' + B.r2(rd.y - 3.5) + 'v7l4 -3.5z' }); chev.classList.toggle('out', rOut); }
        show(handle, 1); B.set(handle, { cx: rd.x, cy: rd.y });
      }
      REC.ring = true;
    }
    svg.classList.toggle('nodrag', !(d.ring && d.ctls));
    // A new reading dropped onto the top of its column, ringed.
    if (d.next != null) {
      const c = sc.col(d.next), h = L.st.cnt[c] || 0, slot = { x: sc.mid(c), y: BASE - 1.5 - L.st.r - h * L.st.pitch, r: L.st.r };
      let q = null;
      if (T === Infinity || right) q = { x: slot.x, y: slot.y, r: slot.r, a: 1 };
      else if (T > 0.45) { q = B.fall({ x: slot.x, y: 64, r: slot.r }, slot, T - 0.45); q.a = B.c01((T - 0.45) / 0.12); }
      B.draw(extra, q, 0, slot.y); REC.extra = !!q;
      if (q && show(ring, T === Infinity || right ? 1 : K.arrive(T, 1.0, 0.35))) { B.set(ring, { cx: q.x, cy: q.y, r: q.r + 2.6 }); ring.classList.remove('out'); }
      rd = q;
    }
    // The ruler, and the pointer over the ringed reading or (after a right answer) over the new one.
    if (d.ruler && RU) {
      const ua = arrive(d, 'ruler');
      const pa = d.next != null ? (right ? (T === Infinity ? 1 : K.arrive(T, 0.15, 0.5)) : 0) : d.pointer ? Math.min(ua, arrive(d, 'ring')) : 0;
      paintRuler(sc, ua, pa, pv, rd, theta, fx);
    }

    // The tiles give what is drawn now.
    if (d.tiles) {
      const t = d.tiles;
      if (t.indexOf('in1') >= 0) {
        const c = cnt3 || (bell ? [1, 2, 3].map((z) => B.within(inV, bell.mv, bell.sv, z)) : [0, 0, 0]);
        [R.in1, R.in2, R.in3].forEach((r, j) => { r.set(c[j]); GAUGE[j](c[j] / N); });
      }
      if (t.indexOf('z') >= 0) R.z.set((L.vs[RING] - L.rest.m) / L.rest.sd);
      if (t.indexOf('out') >= 0) R.out.set(outNow);
      if (t.indexOf('tally') >= 0) {
        let k = 0, n = 0;
        seen.forEach((o, b) => { if (b === st.b && hopping) return; n++; if (o) k++; });
        tallyN = n; R.tally.set(k);
      }
    }
    let rmin = Infinity;
    drawn.forEach((q) => { if (q.a > 0.5) rmin = Math.min(rmin, q.r); });
    Object.assign(REC, { theta, fx, xm, rmin, pouring, hopping, off: L.vs.some((v) => sc.off(v)) });
  }

  // The line under the picture: what is on screen now, cause then effect, in everyday words.
  function sayFor(i, d, st) {
    if (d.name === 'Fifty readings') {
      if (REC.pouring) return 'Readings are landing, and the fulcrum keeps sliding to the mean of those down so far.';
      return 'Most of the fifty land near the middle and few reach the ends. The curve has the pile\'s own mean and standard deviation.';
    }
    if (d.name === 'The bands') return REC.counting ? 'Each band blooms, and the beads inside it ring as its tile counts them.' : 'Each count sits close to what the curve expects, not exactly on it, because real counts wobble.';
    if (d.ctls) {
      const L = layout(st.b, st.slip), z = (L.vs[RING] - L.rest.m) / L.rest.sd, a = Math.round(Math.abs(z) * 10) / 10, side = z > 0 ? 'above' : 'below';
      const out = d.limits && isOut(L.vs[RING], d.limits) ? ' It is past a limit, yet it could still be honest.' : '';
      if (!st.slipMoved && a <= 1) return 'The ringed reading sits near the middle of the others. Slide it far out either way and watch the pointer.';
      if (a <= 1) return 'The ringed reading sits within about 1 SD of the others\' mean, where about 68% of honest readings land.';
      if (a <= 2) return 'The ringed reading sits within about 2 SD of the others\' mean, where about 95% of honest readings land.';
      if (a <= 3) return 'The ringed reading sits between 2 and 3 SD ' + side + ' the others\' mean. Honest readings land there only now and then.' + out;
      return 'The ringed reading sits more than 3 SD ' + side + ' the others\' mean' + (out ? ', past a limit' : '') + '. Honest readings almost never land this far out, so test again and look for a cause.';
    }
    if (d.name === 'Example limits') {
      if (REC.hopping) return 'A fresh batch is landing. Any reading past a limit shivers and turns to a warning.';
      const k = layout(st.b, 0).vs.filter((v) => isOut(v, LIM)).length;
      if (!k) return 'Every reading of this batch is inside the limits. Chance alone still puts one out now and then.';
      return (k === 1 ? 'One honest reading of the 50 lands' : k + ' honest readings of the 50 land') + ' past a limit. Nothing is wrong with the UPS. Chance alone puts one out now and then.';
    }
    if (d.name === 'Fresh batches') return 'The counts wobble round what the curve expects. The ruler\'s marks shift a little with each batch\'s mean and SD.';
    return '';
  }

  function paint(i) {
    if (i == null) i = at();
    const d = STEPS[i], st = S[i];
    if (FORCE || M.idle()) fadeStep(1e9, i);
    SEEN = new Set(); REC = { boxes: [], lines: [], bands: [], path: false, curve: false, pointer: null, beyond: 0, extra: false, ring: false, counting: false, limX: null, ruler: null };
    setView(d.view === 'ir' ? 'ir' : 'ups');
    paintPile(i, d, st);
    if (d.next == null) B.draw(extra, null);
    ALL.forEach((e) => { if (!SEEN.has(e)) e.setAttribute('display', 'none'); });
    // Does any dashed limit line run through a label? (A check reads this.)
    REC.clear = REC.lines.every((ln) => REC.boxes.every((b) => ln.x < b.x0 - 1 || ln.x > b.x1 + 1 || ln.y1 < b.y0 || ln.y0 > b.y1));
    svg.setAttribute('aria-label', d.alt + (st.got === 'right' && d.altAfter ? ' ' + d.altAfter : ''));
    const sy = el('say'), s = d.show ? sayFor(i, d, st) : '';
    sy.textContent = s; sy.hidden = !s;
    M.fade();
  }

  // ---------- Dan's moves ----------
  K.drag(handle, { control: 'slip', toValue: (x) => B.round(K.clamp(SC.val(x) - layout(S[at()].b, 0).vs[RING], -1.2, 1.2), RES) });
  const pickBtns = [0, 1, 2].map((k) => K.button({ label: 'Answer ' + (k + 1), secondary: true, into: '#picks', press: () => {
    const i = at(), d = STEPS[i], st = S[i];
    if (finished || d.show || !d.opts || k >= d.opts.length || st.got === 'right') return;
    const was = st.got === 'wrong';
    st.pick = d.opts[k]; st.got = null;
    if (was) halt();
  } }));
  const checkBtn = K.button({ label: 'Check', into: '#acts', press: () => {
    const i = at(), d = STEPS[i], st = S[i];
    if (d.show || finished || st.got === 'right') return;
    if (st.pick == null) { st.got = 'empty'; return; }
    st.got = st.pick === d.want ? 'right' : 'wrong';
    if (st.got === 'right') story(ANSWER); else halt();   // a right answer brings in its working
  } });
  const whyBtn = K.button({ label: 'Why?', secondary: true, into: '#acts', press: () => {
    if (STEPS[at()].show || finished) return;
    const st = S[at()]; st.why = !st.why;
  } });
  // Drop a fresh batch: the next seed's fifty hop into place, one soft tick each as it leaves (the shared B.ticks).
  const freshBtn = K.button({ label: 'Drop a fresh batch', secondary: true, into: '#fresh', press: () => {
    const i = at(), d = STEPS[i], st = S[i];
    if (!d.fresh || finished) return;
    st.b = nextB++; note(st.b);
    B.ticks(layout(st.b, 0).vs, SC, B.T.hop);
    M.move(M.arc(B.T.hop, 26));
    K.refresh();
  } });
  const replayBtn = K.button({ label: 'Play again', secondary: true, into: '#replay', press: () => {
    const i = at(), d = STEPS[i];
    if (!d.show || !d.demo || finished) return;
    startDemo(i);
  } });
  const backBtn = K.button({ label: 'Back', secondary: true, into: '#nav', press: () => {
    if (finished) { finished = false; return; }
    stepper.set(Math.max(0, at() - 1), true);
  } });
  const nextBtn = K.button({ label: 'Continue', into: '#nav', press: () => {
    const i = at();
    if (finished || (!STEPS[i].show && S[i].got !== 'right')) return;
    if (i < STEPS.length - 1) { stepper.set(i + 1, true); return; }
    finished = true; halt();
    if (typeof K.complete === 'function') K.complete();
  } });
  K.button({ label: 'Start again', secondary: true, into: '#again', press: () => {
    S = STEPS.map((d, i) => blank(i)); finished = false; lastStep = -1; stepper.set(0, true);
  } });

  // A step's demonstration: the pour and the curve on the first screen, the counting sweep, or its parts arriving on the story clock.
  function startDemo(i) {
    const d = STEPS[i], st = S[i];
    SP.f.init = false;
    if (d.pour) {
      const L = layout(st.b, 0), P = M.pour(L.pile, L.fy - FH, L.fy, FADE, true);
      d.arr = { sky: [P.end - 0.7, 0.8], relax: [P.end + 0.1, 0.55] };
      M.enter(M.plan(P, 0, P.end + 0.65, {}, false));
    } else if (d.count) story(countPlan(layout(st.b, 0)).end + 0.4);
    else story(d.dur);
    paint(i);
  }
  // The slider opens where this screen left it (quietly: this is not Dan moving it).
  function syncCtl(st) { if (Math.abs(slipCtl.get() - st.slip) > 1e-9) slipCtl.set(st.slip, true); }
  function enterStep(i) {
    const d = STEPS[i], st = S[i];
    lastStep = i; enter('stepbox');
    syncCtl(st);
    LASTRS = null; ringFlip = -1e9;
    M.springs.forEach((s) => { s.init = false; });
    halt(); fadeStep(1e9, i);
    if (d.demo || d.dur) startDemo(i);
  }
  // The still for the read-through: the step settled in the state its words end on.
  function finishNow() { halt(); M.rest(); paint(); }
  function stillAt(name, patch) {
    const i = IX(name);
    Object.assign(S[i], patch); if (patch.b) note(patch.b); syncCtl(S[i]); halt(); ringFlip = -1e9;
    M.springs.forEach((s) => { s.init = false; });
    K.refresh();
  }

  write(el('finish'), FINISH);
  K.update((p) => {
    const i = Math.round(p.step), d = STEPS[i], st = S[i];
    if (i !== lastStep) enterStep(i);
    else if (d.show && !finished && d.ctls && typeof p.slip === 'number') {
      const v = Math.round(p.slip * 10) / 10;
      if (Math.abs(v - st.slip) > 1e-9) {
        const base = layout(st.b, 0).vs[RING], lim = d.limits;
        const wasOut = !!lim && isOut(B.round(base + st.slip, RES), lim), nowOut = !!lim && isOut(B.round(base + v, RES), lim);
        st.slip = v; st.slipMoved = true;
        if (nowOut && !wasOut) ringFlip = M.instant() ? -1e9 : M.Tl;
        M.move(M.settle(0));
      }
    }
    if (finished !== lastDone) { lastDone = finished; enter(finished ? 'done' : 'stepbox'); }
    const right = st.got === 'right';
    el('stepbox').hidden = finished;
    el('done').hidden = !finished;
    el('lead').textContent = d.lead || LEAD;
    el('cap').textContent = d.caption || CAP;
    el('count').textContent = 'Step ' + (i + 1) + ' of ' + STEPS.length;
    const task = el('task');
    task.className = 'task' + (d.show ? ' show' : '');
    write(task, d.show ? d.text : d.task);
    replayBtn.el.hidden = !d.show || !d.demo || M.reduce;
    el('replay').hidden = replayBtn.el.hidden;
    freshBtn.el.hidden = !d.show || !d.fresh || finished;
    el('fresh').hidden = freshBtn.el.hidden;
    slipCtl.el.hidden = finished || !d.show || !d.ctls;
    el('ctl').hidden = slipCtl.el.hidden;
    const tiles = d.show && !finished ? d.tiles || [] : [];
    Object.keys(R).forEach((k) => { R[k].el.hidden = tiles.indexOf(k) < 0; });
    el('outs').hidden = !tiles.length;
    const opts = d.show ? [] : d.opts || [];
    el('picks').hidden = !opts.length;
    el('picks').classList.toggle('long', opts.some((o) => o.length > 9));
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      b.setLabel(opts[k]);
      b.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });
    el('acts').hidden = !!d.show;
    checkBtn.el.hidden = right;
    const fb = el('fb');
    fb.hidden = !!d.show;
    fb.className = 'fb' + (right ? ' right' : st.got === 'wrong' ? ' wrong' : '');
    write(fb, d.show ? '' : right ? 'That\'s it.' : st.got === 'wrong' ? hintFor(i, st) : st.got === 'empty' ? PICK : '');
    const why = el('why');
    why.hidden = d.show || !st.why;
    write(why, d.show ? '' : d.why);
    whyBtn.setLabel(st.why ? 'Hide why' : 'Why?');
    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !right);
    nextBtn.setLabel(i === STEPS.length - 1 ? 'Finish' : 'Continue');
    el('nav').hidden = backBtn.el.hidden && nextBtn.el.hidden;
    paint(i);
  });

  // ---------- known answers, worked out by hand ----------
  // A step painted in the state given, settled: what it draws. Everything a paint moves is put back as it was.
  function drawnAt(i, patch) {
    const keepS = S[i], keepTb = M.Tb, keepTs = M.Ts, keepSc = M.sc, keepFA = FA.field, keepL = LASTRS, keepRF = ringFlip;
    const keepSp = M.springs.map((s) => [s.v, s.vel, s.to, s.init]), keepD = drawn.map((q) => Object.assign({}, q)), keepF = FLOOR.slice();
    S[i] = Object.assign({}, keepS, { b: 0 }, patch); M.Tb = M.Ts = Infinity; M.sc = STILL; FORCE = true; ringFlip = -1e9; LASTRS = null;
    try { paint(i); return Object.assign({}, REC); }
    finally {
      S[i] = keepS; M.Tb = keepTb; M.Ts = keepTs; M.sc = keepSc; FA.field = keepFA; LASTRS = keepL; ringFlip = keepRF; FORCE = false;
      M.springs.forEach((s, k) => { [s.v, s.vel, s.to, s.init] = keepSp[k]; });
      keepD.forEach((q, k) => { drawn[k] = q; FLOOR[k] = keepF[k]; });
      paint();
    }
  }
  K.check('A normal distribution with k = 2 gives an interval with a coverage probability of approximately 95%: the normal curve holds 95.4% within 2 SD of its mean, and 2,000 readings from the rule on screen land within 2 SD of their batch\'s mean about 95% of the time', () => {
    let inside = 0, all = 0;
    for (let b = 1; b <= 40; b++) { const vs = honest(1000 + b), s = B.stats(vs); inside += B.within(vs, s.m, s.sd, 2); all += N; }
    return B.facts([['the curve holds 95.4%', near(share(2), 0.9545, 0.0005)], ['the readings land about 95%', near(inside / all, 0.95, 0.015)], ['the curve holds 68% within 1 SD', near(share(1), 0.6827, 0.0005)]]);
  }, { source: SRC_UKAS });
  K.check('Some 99.7% of a normal population lies within 3 standard deviations of the mean, so a value further than about 3.3 standard deviations from the mean may be treated as an outlier: the normal curve holds 99.7% within 3 SD; slipped 1.2 V the ringed reading sits 4.0 SD from the mean of the others, beyond 3.3, and slipped 0.6 V it sits 2.0 SD out', () => {
    const z = (s) => { const L = layout(0, s); return (L.vs[RING] - L.rest.m) / L.rest.sd; };
    return B.facts([['99.7% within 3 SD', near(share(3), 0.9973, 0.0001)], ['1.2 V high is 4.0 SD out', K.fmt(z(1.2), { decimals: 1 }) === '4.0' && z(1.2) > 3.3],
      ['0.6 V high is 2.0 SD out', K.fmt(z(0.6), { decimals: 1 }) === '2.0'], ['1.2 V low is past 3.3 SD too', z(-1.2) < -3.3]]);
  }, { source: SRC_HELM });
  K.check('Worked by hand from the opening batch: mean 114.98 V and SD 0.31 V; 33, 48 and 49 of the 50 within 1, 2 and 3 SD, near the 34, 2 or 3 beyond 2 SD, and 50 the curve expects; one reading past the example limits, at 115.9 V, and one past limits 2 SD out; the limits 0.8 V from 115.0 V, about 2.7 SD; a reading on a limit is in; 116.0 V about 3.3 SD from the mean of the fifty and 116.2 V about 4.0; one reading above 115.6 V; twelve nudges reach at most 6 SD', () => {
    const L = layout(0, 0), s = L.s, z5 = (116.0 - s.m) / s.sd, z9 = (116.2 - s.m) / s.sd;
    return B.facts([
      ['mean and SD', near(s.m, 114.98, 0.005) && near(s.sd, 0.306, 0.002)],
      ['33, 48 and 49 within 1, 2 and 3 SD', B.within(L.vs, s.m, s.sd, 1) === 33 && B.within(L.vs, s.m, s.sd, 2) === 48 && B.within(L.vs, s.m, s.sd, 3) === 49],
      ['68% of 50 is 34; 5% of 50 is 2.5; 2.5% is one in forty', near(0.68 * N, 34, 1e-9) && near(0.05 * N, 2.5, 1e-9) && near(1 / 0.025, 40, 1e-9) && near(1 / 0.05, 20, 1e-9)],
      ['one reading out, at 115.9 V', L.vs.filter((v) => isOut(v, LIM)).length === 1 && near(L.vs[FAR], 115.9, 1e-9) && isOut(L.vs[FAR], LIM) && L.vs.filter((v) => isOut(v, LIM2)).length === 1],
      ['the ringed reading honest at 115.0 V', near(L.vs[RING], 115, 1e-9)],
      ['on a limit is in', !isOut(114.2, LIM) && !isOut(115.8, LIM) && isOut(114.1, LIM) && isOut(115.9, LIM)],
      ['limits about 2.7 SD out', K.fmt(0.8 / SD, { decimals: 1 }) === '2.7'],
      ['116.0 V about 3.3 SD, 116.2 V about 4.0', K.fmt(z5, { decimals: 1 }) === '3.3' && K.fmt(z9, { decimals: 1 }) === '4.0' && K.fmt(1.0 / SD, { decimals: 1 }) === '3.3' && near(1.2 / SD, 4, 1e-9)],
      ['one above 115.6 V, two beyond 2 SD', L.vs.filter((v) => v > 115.6 + 1e-9).length === 1 && N - B.within(L.vs, s.m, s.sd, 2) === 2],
      ['at most 6 SD', near(12 * 0.5, 6, 1e-12)],
    ]);
  });
  K.check('Drawn right: settled, the fulcrum sits under the mean and the beam is level at every slip; each limit line sits on the outer edge of its limit\'s column, so every bead past a line is counted out and every one counted is past a line; the pointer sits over the ringed reading at its count of SDs on the ruler; no bead is under r 3.5 over 200 fresh batches, none off the scale; no dashed line runs through a label', () => {
    const out = [], j = IX('Far out on the ruler');
    SLIPS.forEach((slip) => {
      const r = drawnAt(j, { slip, slipMoved: true }), L = layout(0, slip), z = (L.vs[RING] - L.rest.m) / L.rest.sd;
      out.push(['slip ' + slip, Math.abs(r.theta) < 1e-6 && Math.abs(r.fx - r.xm) < 1e-6 && r.rmin >= 3.5 && !r.off && r.clear && !!r.pointer
        && near(r.pointer.px, SC.at(L.vs[RING]), 1e-6) && near(r.pointer.z, z, 1e-6) && r.out === L.vs.filter((v) => isOut(v, LIM)).length]);
    });
    const r6 = drawnAt(IX('Example limits'), {}), L0 = layout(0, 0);
    out.push(['limits on the column edges', !!r6.limX && L0.pile.every((q, k) => isOut(L0.vs[k], LIM) === (q.x < r6.limX[0] || q.x > r6.limX[1])) && r6.out === 1 && r6.clear]);
    STEPS.forEach((d, i) => { const r = drawnAt(i, d.show ? {} : { pick: d.want, got: 'right' }); out.push([d.name, r.rmin >= 3.5 && !r.off && r.clear && Math.abs(r.theta) < 1e-6]); });
    let rmin = Infinity, off = false;
    for (let b = 1; b <= 200; b++) { const vs = honest(b); rmin = Math.min(rmin, B.stack(vs, SC, BASE, TOPP, FIT).r); off = off || vs.some((v) => SC.off(v)); }
    out.push(['200 fresh batches', rmin >= 3.5 && !off]);
    return B.facts(out);
  });
  K.check('Each puzzle accepts only its right answer of three, and before an answer nothing in its picture gives it away: no farthest path, no 2 SD band, no pointer over the new reading, no normal curve over the leaning pile; a right answer brings each in. Every demonstration settles within 5 s and every answer\'s motion within 2.5 s', () => {
    const facts = [], shows = { path: (r) => r.path, beyond: (r) => r.bands.indexOf(2) >= 0 && r.beyond === 2, band: (r) => r.bands.indexOf(2) >= 0, pointer: (r) => !!r.pointer, normal: (r) => r.curve };
    STEPS.forEach((d, i) => {
      if (d.show) return;
      const before = drawnAt(i, { pick: null, got: null }), after = drawnAt(i, { pick: d.want, got: 'right' });
      facts.push([d.name + ': one right answer of three', d.opts.length === 3 && d.opts.filter((o) => o === d.want).length === 1]);
      facts.push([d.name + ': hidden before, shown after', !shows[d.key](before) && !!shows[d.key](after)]);
    });
    const L = layout(0, 0), P = M.pour(L.pile, L.fy - FH, L.fy, FADE, true);
    facts.push(['the pour and its curve', P.end + 0.65 <= 5 && P.rel[0] >= FADE]);
    facts.push(['the count', countPlan(L).end + 0.4 <= 4.5]);
    STEPS.forEach((d) => { if (d.dur) facts.push([d.name + ' timetable', d.dur <= 4.5 && Object.keys(d.arr || {}).every((k) => d.arr[k][0] + d.arr[k][1] <= d.dur)]); });
    facts.push(['answers', ANSWER <= 2.5 && 1.05 + 0.6 <= ANSWER && 0.15 + 1.2 <= ANSWER && 0.8 + 0.25 + 0.5 <= ANSWER && 0.9 + 0.4 + 0.8 <= ANSWER + 0.2]);
    return B.facts(facts);
  });

  K.ready();
</script>
