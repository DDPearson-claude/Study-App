<p class="caption">Every rule is an example; every slope shown is worked out from the rule drawn.</p>

<script>
  // ---------- numbers ----------
  const tidy = (v) => { const r = +(+v).toPrecision(10); return Math.abs(r) < 1e-12 ? 0 : r; };
  const fmtN = (v) => String(tidy(v)).replace('-', '−');
  const signed = (v) => (v < 0 ? '− ' + fmtN(-v) : '+ ' + fmtN(v));
  // The slope at x, from the rule: a chord 0.0002 wide centred on x, rounded to six places.
  const HH = 1e-4;
  const rate = (f, x) => tidy(Math.round((f(x + HH) - f(x - HH)) / (2 * HH) * 1e6) / 1e6);
  // A slope written the way the lesson writes it: a whole number, so many thirds, or two places.
  function fq(v) {
    const t = tidy(v);
    if (Math.abs(t - Math.round(t)) < 1e-6) return fmtN(Math.round(t));
    const th = t * 3;
    if (Math.abs(th - Math.round(th)) < 1e-4) return fmtN(Math.round(th)) + ' ÷ 3';
    return fmtN(Math.round(t * 100) / 100);
  }
  const sl = (f, x) => fq(rate(f, x));

  // ---------- the rules ----------
  // A rule is a list of terms [number in front, power]. The reverse power rule: k xⁿ becomes
  // k xⁿ⁺¹ ÷ (n + 1); for n = −1 the new power is 0, and there is nothing to divide by.
  const poly = (terms) => (x) => terms.reduce((s, q) => s + q[0] * (q[1] === 0 ? 1 : Math.pow(x, q[1])), 0);
  function rev(k, n) { const m = n + 1; return m === 0 ? null : { k: k / m, n: m }; }
  const integ = (terms) => poly(terms.map((q) => { const r = rev(q[0], q[1]); return [r.k, r.n]; }));
  const plus = (f, c) => (x) => f(x) + c;
  const solveC = (f, x0, y0) => tidy(y0 - f(x0));   // the c that puts f + c through (x0, y0)
  const R = {
    cube: poly([[1, 3]]), cubeD: poly([[3, 2]]),
    sq: integ([[2, 1]]), twice: poly([[2, 2]]), two: poly([[2, 0]]),
    third: integ([[1, 2]]),
    quart: integ([[1, 3]]), old: poly([[1 / 3, 4]]), down3: poly([[3, 2]]),
    sumR: poly([[6, 2], [4, 1], [5, 0]]), sum: integ([[6, 2], [4, 1], [5, 0]]),
    q4R: poly([[4, 3], [-6, 1], [2, 0]]), q4: integ([[4, 3], [-6, 1], [2, 0]]), q4down: poly([[12, 2], [-6, 0]]), q4nodiv: poly([[4, 4], [-6, 2], [2, 1]]),
    fam: integ([[2, 1]]), c3: integ([[3, 2]]),
    cap: integ([[1, 1]]), boat: integ([[2, 1]]), boatRaw: poly([[2, 1], [10, 0]]),
    mixR: poly([[6, 2], [-4, 1]]), mix: integ([[6, 2], [-4, 1]]), mixNodiv: poly([[6, 3], [-4, 2]]),
    cap2: integ([[3, 2]]),
  };
  const capC = solveC(R.cap, 0, 3), boatC = solveC(R.boat, 0, 10), mixC = solveC(R.mix, 1, 5), nodivC = solveC(R.mixNodiv, 1, 5), cap2C = solveC(R.cap2, 1, 2);

  const say = (s) => String(s == null ? '' : s).replace(/`/g, '').replace(/÷/g, ' divided by ').replace(/×/g, ' times ').replace(/−/g, ' minus ')
    .replace(/²/g, ' squared').replace(/³/g, ' cubed').replace(/⁴/g, ' to the fourth').replace(/→/g, ' becomes ').replace(/\+/g, ' plus ').replace(/=/g, ' equals ').replace(/\s+/g, ' ').trim();

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // g: the graph's axes, x and y as [from, to, tick step]; step: where a drag of P lands.
  const AX = (o) => Object.assign({ yn: '`y`', xn: '`x`', step: 0.5 }, o);
  const TQ = { yn: '`q`, charge in C', xn: '`t`, time in s' };
  const TS = { yn: '`s`, distance in m', xn: '`t`, time in s' };
  const PICK = 'The rule you pick, with its tangent at `x` = 1';
  const TXT = {
    fwd: '*Integrating* is differentiating run backwards: you are given a rate and asked for the rule it came from. You know the forward direction already. The power rule takes `x³` to `3x²`: bring the 3 to the front, then take one off the power. So the question ‘whose derivative is `3x²`?’ has the answer `x³`. Wherever P goes on the curve `y = x³`, its tangent’s slope is `3x²`. Drag P.',
    add: 'To work backwards without guessing, undo the power rule’s two steps in the opposite order. Forwards, you bring the power to the front, then take one off it. Backwards, you add one to the power, then divide by the new power. For `x²`, add one to get `x³`, then divide by 3 to get `x³ ÷ 3`. Check it by differentiating: `3x² ÷ 3 = x²`, what you started with. On the curve, the tangent’s slope at P is P’s `x` squared.',
    terms: 'A number in front carries through, and a sum is done one term at a time, because differentiating works that way forwards. So the example rate `6x² + 4x + 5` becomes `2x³ + 2x² + 5x`. The plain 5 comes from `5x`, whose slope is 5 everywhere. One power will not go: −1, which is `1 ÷ x`. Adding one gives a power of 0, and you cannot divide by 0.',
    fam: 'Differentiating loses something. A plain number does not change as `x` changes, so its derivative is zero, and `x² + 5`, `x²` and `x² − 3` all differentiate to `2x`. Adding a number `c` lifts every point of the curve by the same amount, so the whole curve slides up or down without its steepness changing anywhere. The tangent at `x` = 2 keeps its slope, 4, while its height, `4 + c`, changes. Slide `c` and watch.',
    cap: 'To pick one curve out of the family, you need one value you know. Say a capacitor charges with a current that rises steadily, `t` amps after `t` seconds. Current is the rate charge flows, so the charge is its integral, `q = 0.5t² + c` coulombs. Say it held 3 C at 0 s. Put `t` = 0 in: `0.5 × 0 + c = 3`, so `c` = 3, and at 4 s it holds `8 + 3 = 11` C. Leave `c` out and it starts at 0 C, 3 C short all the way along. Told 5 C at 2 s instead, `2 + c = 5` gives `c` = 3 again.',
  };
  const STEPS = [
    { show: true, name: 'Forwards and backwards', g: AX({ who: 'The curve `y = x³`', x: [0, 2, 0.5], y: [0, 8, 2] }), f: R.cube, dur: 4.6, rows: 2,
      tour: { v0: 0.5, legs: [{ to: 2, t: 0.7, len: 2.0 }, { to: 1, t: 3.0, len: 1.0 }] },
      strip: { L: '`x³`', R: '`3x²`', top: 'differentiate', bot: [[1.0, 'integrate: whose derivative is `3x²`?']], on: 'bot' },
      rowsAt: (x) => [{ s: '`x³`: the 3 to the front, one off the power', soft: true, t: 0.4 },
        { s: 'P at `x` = ' + fmtN(x) + ': slope 3 × ' + fmtN(x) + '² = ' + sl(R.cube, x), big: true }],
      text: TXT.fwd },
    { name: 'Whose derivative is 2x?', g: AX({ who: PICK, x: [0, 2, 0.5], y: [0, 8, 2] }), ask: 1, rows: 3, opts: ['twice', 'right', 'down'],
      strip: { R: '`2x`' },
      task: 'Which rule has the derivative `2x`? At `x` = 1 its tangent must have slope 2 × 1 = 2.',
      why: 'Run the power rule forwards on each answer. `x²` gives `2x`, so it is the one. `2x²` gives `2 × 2x = 4x`, twice too steep, and a plain 2 gives 0. The 2 is what you get by differentiating `2x`, the wrong way round.',
      hint: 'Not quite. Differentiate each answer: which gives `2x`?',
      hints: { twice: 'Not quite. `2x²` differentiates to `4x`, twice too steep.', down: 'Not quite. 2 is `2x` differentiated, the wrong way. A plain number has slope 0.' },
      pre: ['Needed: slope 2 at `x` = 1', 'The rule is ?'],
      right: ['Needed: slope 2 at `x` = 1', '`x²` has slope 2 × 1 = ' + sl(R.sq, 1) + ' there', 'Its derivative is `2x`: it fits'],
      o: {
        twice: { t: '2x²', L: '`2x²`', fn: R.twice, tan: 1, bad: 'slope ' + sl(R.twice, 1) + ', not 2', rows: ['`2x²` differentiates to `4x`', 'At `x` = 1 that is ' + sl(R.twice, 1) + ': twice too steep'] },
        right: { t: 'x²', L: '`x²`', fn: R.sq, tan: 1, lab: 'slope ' + sl(R.sq, 1) },
        down: { t: '2', L: '2', fn: R.two, tan: 1, bad: 'slope ' + sl(R.two, 1) + ', not 2', rows: ['2 is `2x` differentiated, the wrong way', 'A plain 2 has slope ' + sl(R.two, 1)] },
      } },
    { show: true, name: 'Add one, then divide', g: AX({ who: 'The curve `y = x³ ÷ 3`', x: [0, 3, 1], y: [0, 9, 3] }), f: R.third, dur: 4.6, rows: 2, curveAt: 1.1,
      tour: { v0: 0.5, legs: [{ to: 3, t: 1.7, len: 1.4 }, { to: 2, t: 3.3, len: 0.7 }] },
      strip: { L: [[0, '?'], [0.5, '`x³`'], [1.1, '`x³ ÷ 3`']], R: '`x²`', top: [[0, 'differentiate'], [1.7, 'differentiate: `3x² ÷ 3 = x²`']],
        bot: [[0, 'integrate'], [0.5, '1. add one to the power'], [1.1, '2. divide by the new power, 3']], on: 'bot' },
      rowsAt: (x) => [{ s: 'P at `x` = ' + fmtN(x) + ': slope ' + sl(R.third, x), big: true }, { s: '`x²` there: ' + fmtN(x) + '² = ' + fmtN(x * x) + ', the same', soft: true }],
      text: TXT.add },
    { name: 'Whose derivative is x³?', g: AX({ who: PICK, x: [0, 2, 0.5], y: [0, 8, 2] }), ask: 1, rows: 3, opts: ['right', 'old', 'down'],
      strip: { R: '`x³`' },
      task: 'Which rule has the derivative `x³`? At `x` = 1 its tangent must have slope 1³ = 1.',
      why: 'Add one to the power, 3 to 4, then divide by the new power: `x⁴ ÷ 4`. Check: `4x³ ÷ 4 = x³`. Dividing by the old power gives `x⁴ ÷ 3`, which differentiates to `4x³ ÷ 3`, a third too steep. `3x²` lowers the power: that is `x³` differentiated, not its reverse.',
      hint: 'Not quite. Add one to the power, then divide by the new power.',
      hints: { old: 'Not quite. Divide by the new power, 4. `x⁴ ÷ 3` differentiates to `4x³ ÷ 3`.', down: 'Not quite. `3x²` lowers the power, so it differentiates `x³` instead.' },
      pre: ['Needed: slope 1 at `x` = 1', 'The rule is ?'],
      right: ['Add one to the power: `x⁴`', 'Divide by the new power: `x⁴ ÷ 4`', 'Slope ' + sl(R.quart, 1) + ' at `x` = 1: it fits'],
      o: {
        right: { t: 'x⁴ ÷ 4', L: '`x⁴ ÷ 4`', fn: R.quart, tan: 1, lab: 'slope ' + sl(R.quart, 1) },
        old: { t: 'x⁴ ÷ 3', L: '`x⁴ ÷ 3`', fn: R.old, tan: 1, bad: 'slope ' + sl(R.old, 1) + ', not 1', rows: ['`x⁴ ÷ 3` differentiates to `4x³ ÷ 3`', 'Divided by the old power, 3, not the new'] },
        down: { t: '3x²', L: '`3x²`', fn: R.down3, tan: 1, bad: 'slope ' + sl(R.down3, 1) + ', not 1', rows: ['`3x²` lowers the power', 'That is `x³` differentiated, not integrated'] },
      } },
    { show: true, name: 'Term by term', g: AX({ who: 'The curve `y = 2x³ + 2x² + 5x`', x: [0, 1.5, 0.5], y: [0, 20, 5] }), f: R.sum, dur: 4.6, rows: 4, curveAt: 1.5,
      tour: { v0: 0, legs: [{ to: 1.5, t: 2.0, len: 1.2 }, { to: 1, t: 3.4, len: 0.6 }] },
      strip: { L: [[0, '?'], [0.5, '`2x³`'], [1.0, '`2x³ + 2x²`'], [1.5, '`2x³ + 2x² + 5x`']], R: '`6x² + 4x + 5`', top: 'differentiate',
        bot: [[0, 'integrate'], [0.5, 'integrate, one term at a time']], on: 'bot' },
      rowsAt: (x) => [{ s: '`6x²` → 6 × `x³` ÷ 3 = `2x³`', soft: true, t: 0.5 }, { s: '`4x` → 4 × `x²` ÷ 2 = `2x²`', soft: true, t: 1.0 },
        { s: '5 → `5x`, whose slope is 5 everywhere', soft: true, t: 1.5 },
        { s: 'P at `x` = ' + fmtN(x) + ': slope ' + fmtN(6 * x * x) + ' + ' + fmtN(4 * x) + ' + 5 = ' + sl(R.sum, x), big: true }],
      text: TXT.terms },
    { name: 'Integrate 4x³ − 6x + 2', g: AX({ who: PICK, x: [0, 2, 0.5], y: [-4, 12, 4] }), ask: 1, rows: 3, opts: ['down', 'right', 'nodiv'],
      strip: { R: '`4x³ − 6x + 2`' },
      task: 'Integrate the example rate `4x³ − 6x + 2`. At `x` = 1 it is 4 − 6 + 2 = 0, so the answer’s tangent there must be level.',
      why: 'Term by term: `4x³` becomes 4 × `x⁴` ÷ 4 = `x⁴`, `−6x` becomes −6 × `x²` ÷ 2 = `−3x²`, and 2 becomes `2x`. Differentiate `x⁴ − 3x² + 2x` and `4x³ − 6x + 2` comes back. `12x² − 6` lowers the powers: that is differentiating. `4x⁴ − 6x² + 2x` raises them but never divides.',
      hint: 'Not quite. Raise each power by one, then divide by the new power.',
      hints: { down: 'Not quite. `12x² − 6` lowers the powers: that is the rate differentiated.', nodiv: 'Not quite. The powers went up, but each term still needs dividing by its new power.' },
      pre: ['Needed: slope 0 at `x` = 1', 'The rule is ?'],
      right: ['`4x³` → `x⁴`, `−6x` → `−3x²`, 2 → `2x`', 'Slope 4 − 6 + 2 = ' + sl(R.q4, 1) + ' at `x` = 1', 'Level there: it fits'],
      o: {
        down: { t: '12x² − 6', L: '`12x² − 6`', fn: R.q4down, tan: 1, bad: 'slope ' + sl(R.q4down, 1) + ', not 0', rows: ['`12x² − 6` lowers the powers', 'That is the rate differentiated: slope ' + sl(R.q4down, 1)] },
        right: { t: 'x⁴ − 3x² + 2x', L: '`x⁴ − 3x² + 2x`', fn: R.q4, tan: 1, lab: 'slope ' + sl(R.q4, 1) + ', level' },
        nodiv: { t: '4x⁴ − 6x² + 2x', L: '`4x⁴ − 6x² + 2x`', fn: R.q4nodiv, tan: 1, bad: 'slope ' + sl(R.q4nodiv, 1) + ', not 0', rows: ['The powers went up, but never divided', 'Its slope at 1: 16 − 12 + 2 = ' + sl(R.q4nodiv, 1)] },
      } },
    { show: true, kind: 'fam', name: 'A family of curves', g: AX({ who: 'The family `y = x² + c`', x: [-3, 3, 1], y: [-5, 15, 5] }), f: R.fam, cid: 'c', dur: 4.4, rows: 2,
      members: [-3, 0, 5],
      ctour: { v0: 0, legs: [{ to: -3, t: 0.7, len: 1.1 }, { to: 5, t: 2.2, len: 1.6 }] },
      strip: { L: '`x² + c`', R: '`2x`', top: 'differentiate: a plain number gives 0', bot: 'integrate: put back `+ c`, any number', on: 'bot' },
      rowsAt: (c) => [{ s: 'Tangent at `x` = 2: slope 2 × 2 = ' + sl(plus(R.fam, c), 2), big: true },
        { s: 'Its height: 4 + `c` = 4 ' + signed(c) + ' = ' + fmtN(plus(R.fam, c)(2)), soft: true }],
      text: TXT.fam },
    { name: 'The whole family', g: AX({ who: '`y = x³` and `y = x³ + 4`', x: [0, 2, 0.5], y: [0, 12, 4] }), base: R.c3, both: [0, 4], rows: 3, opts: ['one', 'four', 'right'],
      strip: { R: '`3x²`' },
