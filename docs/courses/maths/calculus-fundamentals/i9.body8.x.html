<p class="caption">Every curve is drawn from its rule with example values; every total is worked out from the curve drawn.</p>

<script>
  // ---------- numbers ----------
  const tidy = (v) => { const r = +(+v).toPrecision(10); return Math.abs(r) < 1e-12 ? 0 : r; };
  const fmtN = (v) => String(tidy(v)).replace('-', '−');
  const dec = (v, d) => { const p = Math.pow(10, d); return fmtN(Math.round(tidy(v) * p) / p); };
  const fix = (v, d) => { let s = (Math.round(tidy(v) * Math.pow(10, d)) / Math.pow(10, d)).toFixed(d); if (/^-0(\.0+)?$/.test(s)) s = s.slice(1); return s.replace('-', '−'); };
  // A slope worked out from a rule: a chord 2 × 10⁻⁶ m³ wide, centred on V.
  const HH = 1e-6;
  const slope = (f, x) => (f(x + HH) - f(x - HH)) / (2 * HH);

  // ---------- the rules ----------
  // A gas going from volume V1 to V2 along pVⁿ = C, starting at pressure p1 (kPa, m³, so work in kJ).
  // n = 0 is a steady pressure. The work is the area under the curve, (p₁V₁ − p₂V₂) ÷ (n − 1); at n = 1 there is none.
  function proc(p1, V1, V2, n) {
    const C = p1 * Math.pow(V1, n), f = (V) => C / Math.pow(V, n), p2 = tidy(f(V2));
    const W = Math.abs(n - 1) < 1e-12 ? null : tidy((p1 * V1 - f(V2) * V2) / (n - 1));
    return { p1, V1, V2, n, C, f, p2, W };
  }
  // The reverse power rule for p = C × V⁻ⁿ: C × V¹⁻ⁿ ÷ (1 − n), which has no answer at n = 1.
  function revRule(pr) { const m = 1 - pr.n; return Math.abs(m) < 1e-12 ? null : (V) => pr.C * Math.pow(V, m) / m; }
  const area = (pr, a, b) => { const F = revRule(pr); return tidy(F(b) - F(a)); };
  // N bars of equal width from a to b, each as tall as the pressure at its middle (the mid-ordinate rule).
  // Run backwards (b < a) every width is minus, so every bar's work is minus.
  function barsOf(f, a, b, N) {
    const w = (b - a) / N, out = [];
    for (let k = 0; k < N; k++) { const v0 = a + k * w, h = f(v0 + w / 2); out.push({ v0, v1: v0 + w, h, amt: h * w }); }
    return out;
  }
  const sumOf = (list) => tidy(list.reduce((s, q) => s + q.amt, 0));
  const barSum = (f, a, b, N) => sumOf(barsOf(f, a, b, N));
  const P = {
    st200: proc(200, 0.1, 0.3, 0), st300: proc(300, 0.05, 0.15, 0),
    sq: proc(400, 0.1, 0.2, 2), sqc: proc(100, 0.2, 0.1, 2),
    e15: proc(800, 0.1, 0.4, 1.5), c15: proc(100, 0.4, 0.1, 1.5), big: proc(2700, 0.02, 0.18, 1.5),
    flat: proc(500, 0.02, 0.06, 0), tail: proc(500, 0.06, 0.12, 2),
  };
  // The last puzzle's path: steady 500 kPa to 0.06 m³, then pV² = C.
  const BOTH = { f: (V) => (V <= P.flat.V2 ? P.flat.f(V) : P.tail.f(V)), V1: 0.02, V2: 0.12, W: tidy(P.flat.W + P.tail.W) };

  const SUBS = { '₁': ' 1', '₂': ' 2' };
  const say = (s) => String(s == null ? '' : s).replace(/`/g, '').replace(/¹⁻ⁿ/g, ' to the power 1 minus n').replace(/⁻ⁿ/g, ' to the power minus n').replace(/⁻²/g, ' to the power minus 2').replace(/⁻¹/g, ' to the power minus 1').replace(/≈/g, ' is about ').replace(/¹·⁵/g, ' to the power 1.5').replace(/ⁿ/g, ' to the power n').replace(/²/g, ' squared')
    .replace(/[₁₂]/g, (m) => SUBS[m]).replace(/÷/g, ' divided by ').replace(/×/g, ' times ').replace(/−/g, ' minus ').replace(/\+/g, ' plus ').replace(/=/g, ' equals ')
    .replace(/m³/g, 'cubic metres').replace(/\s+/g, ' ').trim();

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  const AX = { yn: '`p`, pressure in kPa', xn: '`V`, volume in m³' };
  const GG = (o) => Object.assign({}, AX, o);
  const WG = (o) => Object.assign({ lab: 'Work done by the gas', unit: 'kJ', min: 0, max: 50, dec: 2 }, o);
  const TXT = {
    steady: 'Gas at a steady 200 kPa, an example, pushes a piston out, and its volume grows from 0.1 to 0.3 m³. Work is the push times the distance moved. The push is the pressure times the piston’s area, and that area times the distance is the volume swept, so the work is the pressure times the *change in volume*. On a *pV diagram*, pressure up the side and volume along the bottom, that is the rectangle under the flat line: 200 × 0.2 = 40 kJ. A kPa is a kN on each m², so a kPa times a m³ is a kN m, a kJ.',
    bars: 'Usually the pressure falls as the gas expands: the same gas spread through more room presses less on each square metre. Here it follows `pV² = C`, an example. 400 kPa in 0.1 m³ makes `C` = 400 × 0.1² = 4, so at 0.2 m³ the pressure is 4 ÷ 0.2² = 100 kPa. No one rectangle fits, so cut the change in volume into bars, each as tall as the pressure at its middle: the *mid-ordinate rule*. Each bar is a pressure times a change in volume, a little work. Four bars give 19.82 kJ, eight 19.95 kJ and a hundred 20.00 kJ.',
    derive: 'Where does an exact answer come from? Along `pV² = 4` the pressure is `4 ÷ V²`, also written `4 × V⁻²`, because a power below zero means one over. The reverse power rule adds one to the power, giving −1, and divides by it: `4 × V⁻¹ ÷ (1 − 2)`. Differentiate that and `4 × V⁻²` comes back, so it is right. And `4 × V⁻¹` is just `pV` at each end, 40 and 20, the dashed rectangles. Put in the end, take away the start: (20 − 40) ÷ (1 − 2) = 20 kJ, the bars’ total.',
    rule: 'Any `n` goes the same way. `p = C × V⁻ⁿ`, the reverse power rule gives `C × V¹⁻ⁿ ÷ (1 − n)`, and `C × V¹⁻ⁿ` is `pV` at each end. Turn both subtractions round and the work is `(p₁V₁ − p₂V₂) ÷ (n − 1)`, with 1 the start and 2 the end. Here that is (40 − 20) ÷ (2 − 1) = 20 kJ, just where the bars settle. Slide `n` and the end volume: a hundred bars and the rule agree to 0.01 kJ every time. `n` = 1 is the one value the rule cannot take, as it would divide by 0.',
    squeeze: 'Run it backwards and the piston squeezes the gas from 0.2 m³ at 100 kPa back to 0.1 m³ at 400 kPa. The curve is the same, still above the axis, but each bar’s width, the change in volume, is now minus, so each bar counts as minus: hatched. The rule, with 1 the start, gives (100 × 0.2 − 400 × 0.1) ÷ 1 = −20 kJ. Work done by the gas is positive for expansion and negative for compression: here the piston does 20 kJ of work on the gas. Flip the switch to run it either way.',
    mep: 'Last, lay a rectangle over the curve with the same area and the same width. Its height is its area divided by its length along the volume axis: 20 kJ ÷ 0.1 m³ = 200 kPa, the steady pressure that would do the same work. That is the idea behind the *mean effective pressure*, which the marine syllabuses ask you to define and to find from an indicator card. It is not the average of the end pressures, 250 kPa: the curve spends most of its width below that.',
  };
  const two = barsOf(P.sq.f, 0.1, 0.2, 2);
  const STEPS = [
    { show: true, kind: 'steady', name: 'A steady push', pr: P.st200, g: GG({ who: 'A steady 200 kPa, from 0.1 to 0.3 m³', x: [0, 0.35, 0.1], y: [0, 250, 50] }),
      gauge: WG({ max: 50, dec: 0 }), dur: 4.4, rows: 4, text: TXT.steady },
    { name: 'A steady 300 kPa', pr: P.st300, g: GG({ who: 'A steady 300 kPa, from 0.05 to 0.15 m³', x: [0, 0.2, 0.05], y: [0, 400, 100] }),
      gauge: WG({ max: 50 }), opts: ['endvol', 'right', 'startvol'],
      task: 'Gas at a steady 300 kPa, an example, pushes the piston out from 0.05 m³ to 0.15 m³. How much work does it do?',
      why: 'The work is the pressure times the change in volume: 0.15 − 0.05 = 0.1 m³, so 300 × 0.1 = 30 kJ, the rectangle under the flat line. 300 × 0.15 = 45 kJ counts the 0.05 m³ the gas filled before the piston moved. 300 × 0.05 = 15 kJ uses the start volume, not the change.',
      hint: 'Not quite. Multiply the pressure by the change in volume.',
      hints: { endvol: 'Not quite. 0.15 m³ is the whole volume. Use the change, 0.15 − 0.05.', startvol: 'Not quite. 0.05 m³ is where it starts. Use the change in volume.' },
      pre: ['300 kPa, from 0.05 to 0.15 m³', 'Work = ?'], right: ['Change in volume: 0.15 − 0.05 = 0.1 m³', '300 × 0.1 = 30 kJ, the rectangle’s area'],
      amounts: () => [P.st300.W],
      o: {
        endvol: { t: '45 kJ', v: tidy(300 * 0.15), rows: ['300 × 0.15 counts the whole volume', 'Only the change, 0.1 m³, is swept'] },
        right: { t: '30 kJ', v: P.st300.W },
        startvol: { t: '15 kJ', v: tidy(300 * 0.05), rows: ['300 × 0.05 uses the start volume', 'Use the change, 0.15 − 0.05'] },
      },
      scene: (s) => {
        const pr = P.st300;
        base(pr, s);
        if (s.k === 'right') queue(s.a, [{ x: (X(pr.V1) + X(pr.V2)) / 2, y: Y(150) + 5, text: '300 × 0.1 = 30 kJ' }]);
        if (s.k === 'endvol') { rectA(0, pr.V2, 300, 'area bad', s.a); queue(s.a, [{ x: X(0.01), y: Y(370), text: '300 × 0.15: the whole volume', cls: 'bad', anchor: 'start' }]); }
        if (s.k === 'startvol') { rectA(0, pr.V1, 300, 'area bad', s.a); queue(s.a, [{ x: X(0.01), y: Y(370), text: '300 × 0.05: the start volume', cls: 'bad', anchor: 'start' }]); }
      } },
    { show: true, kind: 'bars', name: 'Bars under a curve', pr: P.sq, cid: 'bars', g: GG({ who: 'Pressure falling along `pV² = 4`', x: [0, 0.25, 0.05], y: [0, 500, 100] }),
      gauge: WG({ max: 25 }), dur: 4.8, rows: 3, ctour: { v0: 4, log: true, legs: [{ to: 8, t: 1.9, len: 0.7 }, { to: 100, t: 3.0, len: 1.3 }] },
      rowsAt: (n) => {
        const tot = barSum(P.sq.f, 0.1, 0.2, n);
        return [{ s: n + ' bars, each 0.1 ÷ ' + n + ' = ' + dec(0.1 / n, 4) + ' m³ wide', soft: true },
          { s: 'Each: the pressure at its middle × its width', soft: true },
          { s: n + ' bars: ' + fix(tot, 2) + ' kJ' + (n >= 100 ? ', settled on 20 kJ' : n === 4 ? '' : ', closing in on 20 kJ'), big: true }];
      },
      text: TXT.bars },
    { name: 'One bar', pr: P.sq, g: GG({ who: '`pV² = 4`, cut into two bars', x: [0, 0.25, 0.05], y: [0, 500, 100] }),
      gauge: WG({ max: 300 }), opts: ['vol', 'pres', 'right'],
      task: 'Cut the stretch from 0.1 to 0.2 m³ into two bars. The first runs from 0.1 to 0.15 m³; its middle is at 0.125 m³, where the pressure is 4 ÷ 0.125² = 256 kPa. How much work does that bar stand for?',
      why: 'A bar is a pressure times a change in volume: 256 kPa across 0.15 − 0.1 = 0.05 m³ gives 256 × 0.05 = 12.8 kJ, the bar’s area. 256 × 0.125 = 32 multiplies by where the middle is, a volume, not the bar’s width. 256 on its own is a pressure, not work.',
      hint: 'Not quite. Multiply the pressure by the bar’s width.',
      hints: { vol: 'Not quite. 0.125 m³ is where the middle is. Use the bar’s width, 0.05 m³.', pres: 'Not quite. 256 kPa is a pressure. Multiply it by the bar’s width.' },
      pre: ['256 kPa at its middle, 0.05 m³ wide', 'Its work = ?'], right: ['256 kPa at its middle, 0.05 m³ wide', '256 × 0.05 = 12.8 kJ, the bar’s area'],
      amounts: () => [two[0].amt],
      o: {
        vol: { t: '32 kJ', v: tidy(two[0].h * 0.125), rows: ['256 × 0.125 uses where the middle is', 'Use the bar’s width, 0.05 m³'] },
        pres: { t: '256 kJ', v: tidy(two[0].h), rows: ['256 kPa is a pressure, not work', 'Multiply it by the width, 0.05 m³'] },
        right: { t: '12.8 kJ', v: tidy(two[0].amt) },
      },
      scene: (s) => {
        const pr = P.sq;
        two.forEach((q, j) => drawBar(q, j === 0 ? 'hi' : 'soft', 1));
        if (s.k === 'vol') rectA(0, 0.125, two[0].h, 'area bad', s.a);
        curve(pr.f, pr.V1, pr.V2, '', 1);
        dotAt(0.125, two[0].h, 1);
        queue(1, [{ x: X(0.125) + 10, y: Y(two[0].h) - 8, text: '256 kPa', anchor: 'start' }]);
        hbr(0.1, 0.15, 30, '0.05 m³', false, 1);
        dotAt(pr.V2, pr.p2, 1); REC.dot = pr.V2; drawCyl(pr.V2);
        if (s.k === 'vol') queue(s.a, [{ x: X(0.01), y: Y(450), text: '256 × 0.125: where the middle is', cls: 'bad', anchor: 'start' }]);
        if (s.k === 'pres') { vbr(0.1, 0, two[0].h, '', true, s.a, 'left'); queue(s.a, [{ x: X(0.01), y: Y(450), text: '256 kPa: a pressure, not work', cls: 'bad', anchor: 'start' }]); }
      } },
    { show: true, kind: 'derive', name: 'Where the rule comes from', pr: P.sq, g: GG({ who: '`pV² = 4`: the exact area from 0.1 to 0.2 m³', x: [0, 0.25, 0.05], y: [0, 500, 100] }),
      gauge: WG({ max: 25 }), dur: 4.6, rows: 5, text: TXT.derive },
    { show: true, kind: 'rule', name: 'The rule', cid: 'rule', g: GG({ who: '`pVⁿ = C`, from 400 kPa at 0.1 m³', x: [0, 0.45, 0.1], y: [0, 500, 100] }),
      gauge: WG({ lab: 'Work done by the gas, by 100 bars', max: 60 }), dur: 4.6, rows: 4,
      vtour: { v0: 0.2, legs: [{ to: 0.4, t: 0.6, len: 1.6 }, { to: 0.2, t: 2.7, len: 1.3 }] }, text: TXT.rule },

  const queue = (a, items) => { items = items.filter((it) => it.text); if (a > 0 && items.length) LQ.push({ a, items }); };
  function flushLabels() {
    const list = LQ; LQ = [];
    list.forEach((q) => part(q.a, 4, () => {
      const ts = K.labels(into, q.items.map((it) => ({ x: r3(it.x), y: r3(it.y), text: it.text.replace(/`/g, ''), anchor: it.anchor || 'middle', class: 'lab' + (it.cls ? ' ' + it.cls : '') })), { avoid: AV });
      ts.forEach((t, j) => {
        const raw = String(q.items[j].text);
        if (raw.indexOf('`') >= 0) { t.textContent = ''; raw.split('`').forEach((seg, k) => { if (!seg) return; if (k % 2) italics(t, seg, true); else t.appendChild(document.createTextNode(seg)); }); }
        REC.labs.push(t.textContent); if (/\bbad\b/.test(t.getAttribute('class') || '')) REC.bad++; });
    }));
  }

  // ---------- the cylinder and the pV diagram, sharing one volume scale ----------
  const PL = 52, PR = 318, GH = 140, GT = 178, GB = GT + GH, ROW0 = GB + 60, CY0 = 106, CY1 = 146;
  const X = (v) => PL + (v - g.x[0]) / (g.x[1] - g.x[0]) * (PR - PL);
  const Y = (v) => GB - (v - g.y[0]) / (g.y[1] - g.y[0]) * GH;
  // The gas: the same 14 molecules wherever the piston is, so more room spreads them out.
  const GAS = [[0.15, 0.2], [0.42, 0.85], [0.7, 0.35], [0.92, 0.8], [0.28, 0.55], [0.55, 0.1], [0.83, 0.55], [0.06, 0.75], [0.62, 0.95], [0.35, 0.05], [0.49, 0.45], [0.97, 0.15], [0.2, 0.98], [0.76, 0.0]];
  function drawCyl(V) {
    const x0 = X(0), xp = X(V), mid = (CY0 + CY1) / 2;
    REC.piston = V;
    rect('gas', x0, CY0, xp - x0, CY1 - CY0);
    GAS.forEach((q) => circle('mol', x0 + 5 + q[0] * Math.max(0, xp - x0 - 10), CY0 + 22 + q[1] * (CY1 - CY0 - 28), 2));
    if (xp - x0 >= 36) text(x0 + 6, CY0 + 15, 'gas', 'gname', 'start');
    AV.push(path('cyl', 'M' + (PR + 8) + ' ' + CY0 + ' H' + r3(x0) + ' V' + CY1 + ' H' + (PR + 8)));
    AV.push(line('rod', xp + 9, mid, 334, mid));
    AV.push(rect('piston', xp, CY0 + 2, 9, CY1 - CY0 - 4));
  }
  // Gridlines, the volume axis at zero pressure, the pressure axis on the left, numbers and names.
  function frame() {
    for (let j = 0, v = g.y[0]; v <= g.y[1] + 1e-9; j++, v = g.y[0] + j * g.y[2]) {
      const y = Y(v);
      if (v > g.y[0] + 1e-9) line('grid', PL, y, PR, y);
      text(PL - 7, y + 4.5, fmtN(v), 'tick', 'end');
    }
    for (let j = 0, v = g.x[0]; v <= g.x[1] + 1e-9; j++, v = g.x[0] + j * g.x[2]) {
      const x = X(v);
      if (v > g.x[0] + 1e-9) line('grid', x, GT, x, GB);
      line('mtick', x, GB, x, GB + 5);
      text(x, GB + 17, fmtN(v), 'tick');
    }
    AV.push(line('axis', PL, GB, PR + 6, GB), line('axis', PL, GT - 6, PL, GB));
    text(12, GT - 16, g.yn, 'aname', 'start');
    text(PR + 8, GB + 35, g.xn, 'aname', 'end');
  }
  // A curve from one volume to another, cut where it leaves the graph.
  function pathOf(f, lo, hi) {
    if (lo > hi) { const s = lo; lo = hi; hi = s; }
    const n = 160, y0 = g.y[0], y1 = g.y[1];
    let s = '', on = false, px = null, pv = null;
    for (let j = 0; j <= n; j++) {
      const x = lo + (hi - lo) * j / n, v = f(x), inside = v >= y0 && v <= y1;
      if (inside) {
        if (!on && pv != null) { const e = pv < y0 ? y0 : y1, xe = px + (x - px) * (e - pv) / (v - pv); s += ' M' + r3(X(xe)) + ' ' + r3(Y(e)); on = true; }
        s += (on ? ' L' : ' M') + r3(X(x)) + ' ' + r3(Y(v)); on = true;
      } else if (on) { const e = v < y0 ? y0 : y1, xe = px + (x - px) * (e - pv) / (v - pv); s += ' L' + r3(X(xe)) + ' ' + r3(Y(e)); on = false; }
      px = x; pv = v;
    }
    return s.trim();
  }
  function curve(f, lo, hi, cls, a) {
    a = a == null ? 1 : a;
    if (a <= 0) return;
    const dd = pathOf(f, lo, hi);
    if (dd) part(a, 0, () => AV.push(path('curve' + (cls ? ' ' + cls : ''), dd)));
  }
  // One bar: from the volume axis up to its pressure; hatched when its width, the change in volume, is minus.
  function drawBar(q, cls, al) {
    if (al <= 0) return;
    const xa = X(Math.min(q.v0, q.v1)), w = Math.abs(X(q.v1) - X(q.v0)), neg = q.amt < 0;
    const c = 'bar' + (neg ? ' neg' : '') + (w >= 5 ? ' edge' : '') + (cls ? ' ' + cls : '');
    part(al, 0, () => rect(c, xa, Y(q.h), w, Y(0) - Y(q.h)));
    if (neg) REC.hatched++;
    REC.bars.push({ v0: q.v0, v1: q.v1, h: q.h, amt: q.amt, neg, cls: cls || '' });
  }
  // The area under a curve between two volumes: plain, neutral, hatched (minus) or a red outline.
  function areaOf(f, a, b, cls, al) {
    if (al <= 0) return;
    const pts = K.linspace(a, b, 121);
    const dd = 'M' + r3(X(a)) + ' ' + r3(Y(0)) + pts.map((v) => ' L' + r3(X(v)) + ' ' + r3(Y(Math.min(f(v), g.y[1])))).join('') + ' L' + r3(X(b)) + ' ' + r3(Y(0)) + ' Z';
    const bad = /bad/.test(cls || '');
    part(al, 0, () => { const p = path('area' + (cls ? ' ' + cls : ''), dd); if (bad) AV.push(p); });
    if (bad) REC.bad++;
    if (/neg/.test(cls || '')) REC.hatched++;
  }
  function rectA(x0, x1, h, cls, al) {
    if (al <= 0) return;
    const bad = /bad/.test(cls);
    part(al, 0, () => { const r = rect(cls, X(Math.min(x0, x1)), Y(h), Math.abs(X(x1) - X(x0)), Y(0) - Y(h)); if (bad) AV.push(r); });
    if (bad) REC.bad++;
  }
  // The rectangle with the same area and width as the area under the curve: its height is the mean effective pressure.
  function mepRect(x0, x1, h, al) {
    if (al <= 0 || h <= 1e-9) return;
    part(al, 0, () => { rect('mep', X(x0), Y(h), X(x1) - X(x0), Y(0) - Y(h)); AV.push(line('mepedge', X(x0), Y(h), X(x1), Y(h))); });
    REC.mep = { h: tidy(h), w: tidy(x1 - x0) };
    queue(al, [{ x: (X(x0) + X(x1)) / 2, y: Y(h * 0.25) + 5, text: 'same area' }]);
  }
  function dotAt(x, y, a) {
    if (a <= 0) return;
    part(a, 0, () => AV.push(circle('pt', X(x), Y(y), 5)));
  }
  // A bracket beside a height (from v0 to v1 at volume x), its label on the side given.
  function vbr(x, v0, v1, label, bad, a, side) {
    if (a <= 0) return;
    const right = side === 'right', px = X(x) + (right ? 6 : -6), y0 = Y(v0), y1 = Y(v1), tk = right ? -5 : 5;
    part(a, 0, () => AV.push(path('brk' + (bad ? ' bad' : ''), 'M' + r3(px + tk) + ' ' + r3(y0) + ' H' + r3(px) + ' V' + r3(y1) + ' H' + r3(px + tk))));
    if (label) queue(a, [{ x: px + (right ? 8 : -8), y: (y0 + y1) / 2 + 5, text: label, anchor: right ? 'start' : 'end', cls: bad ? 'bad' : '' }]);
    if (bad) REC.bad++;
  }
  // A bracket along a stretch of volume, just above pressure v, its label above it.
  function hbr(x0, x1, v, label, bad, a) {
    if (a <= 0) return;
    const y = Y(v), p0 = X(x0) + 2, p1 = X(x1) - 2;
    part(a, 0, () => AV.push(path('brk' + (bad ? ' bad' : ''), 'M' + r3(p0) + ' ' + r3(y - 5) + ' V' + r3(y) + ' H' + r3(p1) + ' V' + r3(y - 5))));
    if (label) queue(a, [{ x: (p0 + p1) / 2, y: y - 9, text: label, cls: bad ? 'bad' : '' }]);
    if (bad) REC.bad++;
  }
  // The key, inside the graph.
  function drawKey(k) {
    k.items.forEach((it, j) => {
      const y = Y(k.v) + 20 * j;
      AV.push(rect('sw ' + it.sw, k.x, y - 10, 16, 11));
      text(k.x + 22, y, it.text, 'keyt', 'start');
    });
  }
  // A puzzle's path: the area under it (neutral until answered), the curve, its start and end, the piston at the end.
  function base(pr, s, o) {
    o = o || {};
    const neg = pr.V2 < pr.V1;
    areaOf(pr.f, pr.V1, pr.V2, o.known || s.k === 'right' ? (neg ? 'neg' : '') : 'soft', 1);
    curve(pr.f, pr.V1, pr.V2, '', 1);
    dotAt(pr.V1, pr.f(pr.V1), 1); dotAt(pr.V2, pr.f(pr.V2), 1);
    queue(1, [{ x: X(pr.V1) + 10, y: Y(pr.f(pr.V1)) - 10, text: 'start', anchor: 'start', cls: 'soft' },
      { x: X(pr.V2) + 8, y: Y(pr.f(pr.V2)) - 10, text: 'end', anchor: 'start', cls: 'soft' }]);
    REC.dot = pr.V2; drawCyl(pr.V2);
  }

  // ---------- the running total of the work ----------
  // Plus amounts run rightwards along the top lane; minus amounts run back along the lower lane,
  // hatched. The tick marks where the total stands; the dashed line, the rule's answer.
  const GL = 20, GR = 320, GY = 48;
  function drawGauge(G, s) {
    const GX = (v) => GL + (K.clamp(v, G.min, G.max) - G.min) / (G.max - G.min) * (GR - GL), lane = !!G.neg, bot = GY + (lane ? 34 : 20);
    text(12, 36, G.lab, 'gtitle', 'start');
    text(328, 36, s.value, 'gval', 'end');
    REC.value = s.value;
    AV.push(rect('track', GL, GY, GR - GL, 16));
    if (lane) AV.push(rect('track', GL, GY + 19, GR - GL, 12));
    let am = s.amounts || [];
    if (am.length > 16) {   // many thin bars: one piece for each run of the same sign
      const merged = [];
      am.forEach((q) => { const last = merged[merged.length - 1]; if (last && (last.amt >= 0) === (q.amt >= 0)) last.amt += q.amt; else merged.push({ amt: q.amt, a: q.a }); });
      am = merged;
    }
    let run = 0;
    const segs = [];
    am.forEach((q) => {
      const from = run, to = run + q.amt;
      run = to;
      if (Math.abs(q.amt) < 1e-12) return;
      const neg = q.amt < 0, lo = GX(Math.min(from, to)), hi = GX(Math.max(from, to));
      part(q.a, 0, () => rect('seg' + (neg ? ' neg' : ''), lo, neg ? GY + 19 : GY, Math.max(0.6, hi - lo), neg ? 12 : 16));
      segs.push({ from: tidy(from), to: tidy(to) });
    });
    REC.segs = segs;
    REC.net = am.length ? tidy(run) : null;
    if (am.length) { const x = GX(run); AV.push(line('net', x, GY - 5, x, bot - 2)); }
    const below = [];
    if (s.goal && s.goal[2] > 0) {
      const x = GX(s.goal[0]);
      part(s.goal[2], 0, () => AV.push(line('goal', x, GY - 6, x, bot)));
      below.push([x, s.goal[1], 'glab', s.goal[2]]);
      REC.goal = s.goal[0];
    }
    if (s.mark && s.mark[3] > 0) {
      const x = GX(s.mark[0]);
      part(s.mark[3], 0, () => AV.push(line('pmark' + (s.mark[2] ? ' bad' : ''), x, GY - 6, x, bot)));
      below.push([x, s.mark[1], 'glab' + (s.mark[2] ? ' bad' : ' soft'), s.mark[3]]);
      REC.mark = s.mark[0];
    }
    const z = GX(0);
    if (!below.some((b) => Math.abs(b[0] - z) < 36)) below.push([z, '0', 'tick', 1]);
    below.forEach((b) => {
      const anc = b[0] < 70 ? 'start' : b[0] > 270 ? 'end' : 'middle';
      part(b[3], 0, () => text(anc === 'start' ? Math.max(4, b[0] - 4) : anc === 'end' ? Math.min(336, b[0] + 4) : b[0], bot + 14, b[1], b[2], anc));
    });
  }

  // ---------- the working under the drawing, one line each ----------
  function drawRows(RW) {
    RW.forEach((r, n) => {
      const a = r.a != null ? r.a : r.t != null ? arr(r.t) : 1;
      part(a, 4, () => fit(text(12, ROW0 + 26 * n, r.s, 'row' + (r.big ? ' big' : '') + (r.soft ? ' soft' : '') + (r.bad ? ' bad' : ''), 'start'), 316, 14));
      if (a >= 0.5) REC.rows.push(r.s);
      if (r.bad && a > 0) REC.bad++;
    });
  }

  // ---------- motion along legs: the number of bars, or the end volume ----------
  // x: where it is now; rx: the last place it reached (the working shows that); la: the working's fade.
  function tourAt(tr) {
    let x = tr.v0, rx = x, la = 1;
    for (const Lg of tr.legs) {
      if (T < Lg.t) break;
      if (T < Lg.t + Lg.len) {
        la = 1 - K.arrive(T, Lg.t, 0.3);
        const e = K.ease((T - Lg.t) / Lg.len);
        x = tr.log ? Math.exp(K.lerp(Math.log(x), Math.log(Lg.to), e)) : K.lerp(x, Lg.to, e);
        break;
      }
      x = Lg.to; rx = x; la = arr(Lg.t + Lg.len, 0.5);
    }
    tr.legs.forEach((Lg) => note(Lg.t + Lg.len + 0.5));
    return { x, rx, la };
  }

  // ---------- the SHOW screens ----------
  // A steady 200 kPa: the piston moves out, the rectangle under the flat line grows behind the dot.
  function drawSteady(d, st, RW) {
    const pr = d.pr, V = K.lerp(pr.V1, pr.V2, sweep(0.3, 2.4)), done = tidy(pr.p1 * (V - pr.V1));
    if (V - pr.V1 > 1e-9) rectA(pr.V1, V, pr.p1, 'area', 1);
    curve(pr.f, pr.V1, pr.V2, '', 1);
    queue(1, [{ x: X(pr.V2) - 4, y: Y(pr.p1) - 12, text: 'steady 200 kPa', anchor: 'end' }]);
    queue(arr(2.8), [{ x: (X(pr.V1) + X(pr.V2)) / 2, y: Y(pr.p1 / 2) + 5, text: fmtN(pr.W) + ' kJ' }]);
    dotAt(V, pr.p1, 1); REC.dot = V; drawCyl(V);
    RW.push({ s: 'From 0.1 to 0.3 m³: a change of 0.2 m³', soft: true, t: 2.9 }, { s: 'Work: 200 × 0.2 = ' + fmtN(pr.W) + ' kJ', big: true, t: 3.3 },
      { s: 'Not 200 × 0.3 = 60 kJ: the gas filled 0.1 m³', soft: true, t: 3.7 }, { s: 'before the piston moved', soft: true, t: 3.7 });
    return { amounts: [{ amt: done, a: 1 }], value: fix(done, 0) + ' kJ' };
  }
  // pV² = 4: the piston moves out and four bars arrive as it passes them; then they thin to 8, then 100.
  function drawThin(d, st, RW) {
    const pr = d.pr, own = st.c != null, s = own ? { x: st.c, rx: st.c, la: 1 } : tourAt(d.ctour), N = Math.round(s.x), rn = Math.round(s.rx);
    REC.n = N;
    const V = own ? pr.V2 : K.lerp(pr.V1, pr.V2, sweep(0.2, 1.4)), list = barsOf(pr.f, pr.V1, pr.V2, N), got = [];
    list.forEach((q, k) => { const a = own ? 1 : arr(tAt((k + 0.5) / N, 0.2, 1.4), 0.35); if (a > 0) { drawBar(q, '', a); got.push({ amt: q.amt, a }); } });
    curve(pr.f, pr.V1, pr.V2, '', 1);
    queue(1, [{ x: X(pr.V1) - 10, y: Y(pr.p1) + 5, text: '`pV² = 4`', anchor: 'end' }]);   // left of the start, where no bar stands
    dotAt(V, pr.f(V), 1); REC.dot = V; drawCyl(V);
    d.rowsAt(rn).forEach((r) => RW.push({ s: r.s, big: r.big, soft: r.soft, a: s.la }));
    return { amounts: got, value: fix(sumOf(got), 2) + ' kJ', goal: [pr.W, 'settles on 20 kJ', 1] };
  }
  // pVⁿ = C from 400 kPa at 0.1 m³: 100 bars and the rule, at the power and end volume set.
  function drawRule(d, st, RW) {
    const own = st.v != null, s = own ? { x: st.v, rx: st.v, la: 1 } : tourAt(d.vtour), V2 = s.x, n = own ? st.n : 2;
    const pr = proc(400, 0.1, V2, n), list = barsOf(pr.f, 0.1, V2, 100);
    REC.n = n; REC.V2 = V2; REC.W = pr.W;
    list.forEach((q) => drawBar(q, '', 1));
    curve(pr.f, 0.1, V2, '', 1);
    dotAt(0.1, 400, 1); dotAt(V2, pr.p2, 1); REC.dot = V2; drawCyl(V2);
    queue(1, [{ x: X(0.1) + 10, y: Y(400) - 8, text: '1: start', anchor: 'start', cls: 'soft' }, { x: X(V2) + 8, y: Y(pr.p2) - 12, text: '2: end', anchor: 'start', cls: 'soft' }]);
    const rp = proc(400, 0.1, s.rx, n), p2v2 = tidy(rp.p2 * rp.V2), pv4 = Math.round(p2v2 * 1e4) / 1e4, w4 = tidy((40 - pv4) / (n - 1));
    const eq = (v, dd) => (Math.abs(v - Math.round(v * Math.pow(10, dd)) / Math.pow(10, dd)) < 1e-9 ? ' = ' : ' ≈ ') + dec(v, dd);
    RW.push({ s: 'Start: `p₁V₁` = 400 × 0.1 = 40', soft: true, a: s.la },
      { s: 'End: `p₂`' + eq(rp.p2, 1) + ' kPa, so `p₂V₂`' + eq(p2v2, 4), soft: true, a: s.la },
      { s: 'Rule: (40 − ' + dec(pv4, 4) + ') ÷ (' + dec(n, 1) + ' − 1)' + eq(w4, 2) + ' kJ', big: true, a: s.la },
      { s: '100 bars: ' + fix(barSum(rp.f, 0.1, rp.V2, 100), 2) + ' kJ, within 0.01 kJ', soft: true, a: s.la });
    return { amounts: list.map((q) => ({ amt: q.amt, a: 1 })), value: fix(sumOf(list), 2) + ' kJ', goal: [pr.W, 'the rule', 1] };
  }
  // pV² = 4 run either way: eight bars arrive as the piston passes them, hatched when it squeezes.
  function drawSqueeze(d, st, RW) {
    const sq = st.sq !== false, pr = sq ? P.sqc : P.sq, V = K.lerp(pr.V1, pr.V2, sweep(0.3, 2.2));
    REC.sq = sq;
    const list = barsOf(pr.f, pr.V1, pr.V2, 8), got = [];
    list.forEach((q, k) => { const a = arr(tAt((k + 0.5) / 8, 0.3, 2.2), 0.35); if (a > 0) { drawBar(q, '', a); got.push({ amt: q.amt, a }); } });
    curve(pr.f, 0.1, 0.2, '', 1);
    queue(1, [{ x: X(0.1) - 10, y: Y(400) + 5, text: '`pV² = 4`', anchor: 'end' }]);   // left of the curve, where no bar stands
    dotAt(V, pr.f(V), 1); REC.dot = V; drawCyl(V);
    RW.push({ s: 'Each bar’s width, the change in volume, is ' + (sq ? 'minus' : 'plus'), soft: true, t: 2.7 },
      { s: 'Rule: (' + (sq ? '100 × 0.2 − 400 × 0.1' : '400 × 0.1 − 100 × 0.2') + ') ÷ 1 = ' + fmtN(pr.W) + ' kJ', big: true, t: 3.1 },
      { s: sq ? 'The piston does 20 kJ of work on the gas' : 'The gas does 20 kJ of work on the piston', soft: true, t: 3.5 });
    return { amounts: got, value: fix(sumOf(got), 2) + ' kJ', goal: [pr.W, 'rule: ' + fmtN(pr.W) + ' kJ', 1] };
  }
  // pV² = 4: the area grows behind the piston, then a rectangle of the same area and width rises to 200 kPa.
  function drawMep(d, st, RW) {
    const pr = d.pr, V = K.lerp(pr.V1, pr.V2, sweep(0.2, 1.4)), done = V - pr.V1 > 1e-9 ? area(pr, pr.V1, V) : 0;
    if (V - pr.V1 > 1e-9) areaOf(pr.f, pr.V1, V, '', 1);
    const H = tidy(pr.W / (pr.V2 - pr.V1)), h = H * sweep(1.9, 1.2), avg = tidy((pr.p1 + pr.p2) / 2);
    if (h > 1e-6) { rect('mep', X(pr.V1), Y(h), X(pr.V2) - X(pr.V1), Y(0) - Y(h)); AV.push(line('mepedge', X(pr.V1), Y(h), X(pr.V2), Y(h))); REC.mep = { h: tidy(h), w: tidy(pr.V2 - pr.V1) }; }
    curve(pr.f, pr.V1, pr.V2, '', 1);
    const la = arr(3.4);
    REC.avg = avg;
    part(la, 0, () => AV.push(line('lvl', X(pr.V1), Y(avg), X(pr.V2), Y(avg))));
    queue(la, [{ x: X(pr.V1) - 6, y: Y(avg) + 5, text: 'ends’ average', anchor: 'end', cls: 'soft' }]);
    queue(arr(3.1), [{ x: X(pr.V2) + 6, y: Y(H) + 5, text: '200 kPa', anchor: 'start' }, { x: (X(pr.V1) + X(pr.V2)) / 2, y: Y(30) + 5, text: 'same area' }]);
    dotAt(V, pr.f(V), 1); REC.dot = V; drawCyl(V);
    RW.push({ s: 'Height: 20 kJ ÷ 0.1 m³ = ' + fmtN(H) + ' kPa', big: true, t: 3.2 }, { s: 'The mean effective pressure for this stroke', soft: true, t: 3.5 },
      { s: 'Not (400 + 100) ÷ 2 = ' + fmtN(avg) + ' kPa, the ends’ average', soft: true, t: 3.8 });
    return { amounts: [{ amt: done, a: 1 }], value: fix(done, 2) + ' kJ' };
  }

      has('Using the rule', 'why', ['(80 − 40) ÷ (1.5 − 1) = 40 ÷ 0.5 = 80 kJ', '40 ÷ 1.5 = 26.7 kJ']) && has('A squeeze', 'why', ['(40 − 80) ÷ (1.5 − 1) = −40 ÷ 0.5 = −80 kJ']) &&
      has('Its mean pressure', 'why', ['80 ÷ 0.3 = 267 kPa', '(800 + 100) ÷ 2 = 450 kPa', '80 ÷ 0.4 = 200 kPa']) && has('A big expansion', 'why', ['36 ÷ 0.5 = 72 kJ', '36 ÷ 1.5 = 24 kJ']) &&
      has('Flat, then falling', 'why', ['500 × 0.04 = 20 kJ', '500 × 0.06² = 1.8', '1.8 ÷ 0.12² = 125 kPa', '(30 − 15) ÷ 1 = 15 kJ', '20 + 15 = 35 kJ']) &&
      STEPS[idx('Bars under a curve')].rowsAt(4)[2].s === '4 bars: 19.82 kJ' && STEPS[idx('Bars under a curve')].rowsAt(100)[2].s === '100 bars: 20.00 kJ, settled on 20 kJ';
    return nums && words;
  });
  K.check('Every puzzle offers three different answers and accepts only the right one; each answer’s number is the value its slip gives, rounded as shown', () => {
    const want = {
      'A steady 300 kPa': ['45 kJ', '30 kJ', '15 kJ'], 'One bar': ['32 kJ', '256 kJ', '12.8 kJ'], 'Using the rule': ['80 kJ', '40 kJ', '26.7 kJ'], 'A squeeze': ['80 kJ', '−80 kJ', '−40 kJ'],
      'Its mean pressure': ['450 kPa', '200 kPa', '267 kPa'], 'A big expansion': ['72 kJ', '24 kJ', '−72 kJ'], 'Flat, then falling': ['15 kJ', '35 kJ', '30 kJ'],
    };
    const right = { 'A steady 300 kPa': 1, 'One bar': 2, 'Using the rule': 0, 'A squeeze': 1, 'Its mean pressure': 2, 'A big expansion': 0, 'Flat, then falling': 1 };
    return DO.length === 7 && DO.every((i) => {
      const d = STEPS[i], labs = d.opts.map((k) => d.o[k].t);
      return labs.join('|') === want[d.name].join('|') && new Set(labs).size === 3 && d.opts.filter((k) => k === 'right').length === 1 && d.opts[right[d.name]] === 'right' &&
        d.opts.every((k) => { const num = d.o[k].t.replace('−', '-').split(' ')[0], dp = (num.split('.')[1] || '').length; return Number(num) === Number(d.o[k].v.toFixed(dp)); });
    });
  });
  K.check('Before Check no puzzle gives its verdict: nothing red, the working ends in a question mark and the total reads ? (or the work the question gives); a picked answer only marks its own value; a right answer fills in with nothing red; every wrong answer shows its slip in red', () =>
    DO.every((i) => {
      const d = STEPS[i], pre = drawn(i, blank()), ok = drawn(i, solvedSt()), shut = d.known != null ? dec(d.known, 2) + ' kJ' : '?';
      const preOk = pre.bad === 0 && / \?$/.test(pre.rows[pre.rows.length - 1]) && pre.value === shut && pre.mark == null && (d.known != null || pre.net == null);
      const pickOk = d.opts.every((o) => { const h = drawn(i, pickSt(o)); return h.bad === 0 && h.value === shut && close(h.mark, d.o[o].v) && / \?$/.test(h.rows[h.rows.length - 1]); });
      const rightOk = ok.bad === 0 && (d.known != null ? ok.mep && close(ok.mep.h, d.o.right.v) : close(ok.net, d.o.right.v) && ok.mark == null);
      return preOk && pickOk && rightOk && d.opts.filter((k) => k !== 'right').every((k) => { const h = drawn(i, wrongSt(k)); return h.bad > 0 && close(h.mark, d.o[k].v) && (d.known != null || h.net == null); });
    }));
  K.check('Every demonstration has finished arriving within 5 s of its screen opening, and every pick’s or answer’s motion within 1.3 s', () => {
    const keepT = T;
    const timed = (i, st, limit) => {
      const keepS = S[i];
      T = Infinity; latest = 0; checking = true;
      S[i] = st;
      try { paint(i); } finally { S[i] = keepS; checking = false; }
      return latest <= limit + 1e-9;
    };
    const ok = STEPS.every((d, i) => (d.show ? timed(i, blank(), d.dur) && d.dur <= 5 && d.dur >= 3 && (d.cid !== 'squeeze' || timed(i, sqAt(false), d.dur))
      : timed(i, solvedSt(), FB[0]) && d.opts.every((o) => timed(i, pickSt(o), FB[1]) && (o === 'right' || timed(i, wrongSt(o), FB[1])))));
    T = keepT; paint();
    return ok;
  });

  K.ready();
