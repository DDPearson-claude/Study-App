<p class="lead">Linked graphs sharing one time across: above, an amount on the job; below, what its slope gives at each moment.</p>

<div class="pz" id="pz">

<p class="caption">Every rule is an example and every dot is worked out from it; the charging curve is only a sketch.</p>

<script>
  // ---------- the example rules ----------
  // fn: the top graph's rule in time t; x, y, d, e: [from, to, tick step] for time and each graph's
  // height; mul: what the slope is multiplied by for the graph below (C in mA for a capacitor, L for
  // a coil); corners: where a drawn rule turns a sharp corner (no slope there).
  const C_F = 0.01, L_H = 0.5, MA = 1000;   // the example capacitor (farads) and coil (henrys); mA in an amp
  const Q = { yn: '`q`, charge passed in C', dn: '`i`, current in A', yu: 'C', du: 'A', mul: 1 };
  const VC = { yn: '`v`, voltage across it in V', dn: '`i`, current in mA', yu: 'V', du: 'mA', mul: C_F * MA };
  const IL = { yn: '`i`, current in A', dn: '`v`, voltage across it in V', yu: 'A', du: 'V', mul: L_H };
  const MO = { yn: '`s`, displacement in m', dn: 'velocity in m per s', en: 'acceleration in m per s each second', yu: 'm', du: 'm per s', mul: 1 };
  const GR = {
    steady: Object.assign({ who: 'An example cable: `q = 3t`', fn: (t) => 3 * t, x: [0, 5, 1], y: [0, 15, 5], d: [0, 6, 2] }, Q),
    growing: Object.assign({ who: 'An example cable: `q = 0.5t²`', fn: (t) => 0.5 * t * t, x: [0, 5, 1], y: [0, 15, 5], d: [0, 6, 2] }, Q),
    cap: Object.assign({ who: 'An example capacitor, `C` = 0.01 F', fn: (t) => Math.min(5 * t, 20), x: [0, 8, 1], y: [0, 25, 5], d: [0, 60, 20], corners: [4] }, VC),
    held: Object.assign({ who: 'The same capacitor, `C` = 0.01 F', fn: (t) => Math.min(5 * t, 50), x: [0, 12, 2], y: [0, 60, 20], d: [0, 60, 20], corners: [10] }, VC),
    charge: { who: 'Charging through a resistor: a sketch', fn: (t) => 1 - Math.exp(-t), x: [0, 5, 1], y: [0, 1.25, 0.25], d: [0, 1.25, 0.25], sketch: true, sup: 1, mul: 1,
      yn: '`v`, voltage across the capacitor', dn: '`i`, current', xn: '`t`, time', yu: '', du: '' },
    coil: Object.assign({ who: 'An example coil, `L` = 0.5 H', fn: (t) => (t < 2 ? 4 * t : t < 4 ? 8 : Math.max(0, 8 - 4 * (t - 4))), x: [0, 6, 1], y: [0, 10, 2], d: [-4, 4, 2], corners: [2, 4] }, IL),
    off: Object.assign({ who: 'The same coil, `L` = 0.5 H', fn: (t) => K.clamp(2 - (2 / 0.01) * (t - 0.02), 0, 2), x: [0, 0.05, 0.01], y: [0, 3, 1], d: [-120, 40, 40], corners: [0.02, 0.03], step: 0.005 }, IL),
    boat: Object.assign({ who: 'The speeding boat: `s = t²`', fn: (t) => t * t, x: [0, 5, 1], y: [0, 25, 5], d: [0, 10, 5], e: [0, 4, 2] }, MO),
    trolley: Object.assign({ who: 'An example trolley: `s = 8t − t²`', fn: (t) => 8 * t - t * t, x: [0, 8, 1], y: [0, 20, 5], d: [-8, 8, 4], e: [-4, 2, 2] }, MO),
    mixq: Object.assign({ who: 'An example cable: `q = 2t² + 3t`', fn: (t) => 2 * t * t + 3 * t, x: [0, 3, 1], y: [0, 30, 10], d: [0, 20, 5] }, Q),
    mixv: Object.assign({ who: 'A 0.01 F capacitor: `v = t²`', fn: (t) => t * t, x: [0, 4, 1], y: [0, 16, 4], d: [0, 100, 20] }, VC),
  };
  const cb = GR.steady, cg = GR.growing, cp = GR.cap, ch = GR.held, sk = GR.charge, co = GR.coil, sw = GR.off, bt = GR.boat, tl = GR.trolley, mq = GR.mixq, mv = GR.mixv;
  const keepPow = (t) => 4 * t * t + 3;   // the slip on the mixed charge puzzle: 2t² read as 4t², the power not lowered

  // ---------- numbers ----------
  const tidy = (v) => { const r = +(+v).toPrecision(10); return Math.abs(r) < 1e-12 ? 0 : r; };
  const fmtN = (v) => String(tidy(v)).replace('-', '−');
  const slope = (g, a, b) => (g.fn(b) - g.fn(a)) / (b - a);   // a chord's slope from the rule
  // The slope at t, from the rule: a chord 0.0002 wide centred on t, rounded to six places (the
  // number the chords settle on). Beside a corner the chord stays on t's own side of it.
  const HH = 1e-4;
  function rate(g, x, side) {
    if (!side && g.corners) g.corners.forEach((c) => { if (Math.abs(x - c) < 2 * HH) side = x <= c ? -1 : 1; });
    const v = side < 0 ? (g.fn(x) - g.fn(x - HH)) / HH : side > 0 ? (g.fn(x + HH) - g.fn(x)) / HH : (g.fn(x + HH) - g.fn(x - HH)) / (2 * HH);
    return Math.round(v * 1e6) / 1e6;
  }
  // The slope of the slope (the second derivative), from the rule: how the chords' slopes change.
  function rate2(g, x) { const h = 1e-3; return Math.round((g.fn(x + h) - 2 * g.fn(x) + g.fn(x - h)) / (h * h) * 1e4) / 1e4; }
  // Each graph's height at t: 0 the rule, 1 the slope (times C or L), 2 the slope of the slope.
  function val(g, k, x) { return k === 0 ? g.fn(x) : k === 1 ? tidy(g.mul * rate(g, x)) : rate2(g, x); }
  const cur = (g, x) => val(g, 1, x);
  const K2 = (g) => rate(g, 1) - rate(g, 0);   // the 2 in 2t, read from the slopes themselves
  const coord = (g, x) => '(' + fmtN(x) + ' s, ' + fmtN(g.fn(x)) + ' ' + g.yu + ')';
  const amt = (g, v) => fmtN(v) + (g.yu ? ' ' + g.yu : '');
  const lab = (g, k, v) => (k === 1 ? (g.du ? fmtN(v) + ' ' + g.du : '') : fmtN(v));
  const say = (s) => String(s == null ? '' : s).replace(/`/g, '').replace(/÷/g, ' divided by ').replace(/×/g, ' times ').replace(/−/g, ' minus ')
    .replace(/²/g, ' squared').replace(/\+/g, ' plus ').replace(/=/g, ' equals ').replace(/\s+/g, ' ').trim();
  const stepOf = (g) => g.step || 0.5;
  const onGrid = (g, x) => tidy(Math.round(x / stepOf(g)) * stepOf(g));
  const halvesIn = (g, lo, hi) => { const s = stepOf(g), out = []; for (let k = Math.ceil(lo / s - 1e-9); k <= Math.floor(hi / s + 1e-9); k++) out.push(tidy(k * s)); return out; };
  const uniq = (g, xs) => Array.from(new Set(xs.map((x) => onGrid(g, x)))).sort((a, b) => a - b);
  // Half steps P has visited, as stretches of neighbours (joined up between them).
  function runsOf(g, xs) {
    const out = [], s = stepOf(g);
    uniq(g, xs).forEach((x) => { const r = out[out.length - 1]; if (r && x - r[1] <= s + 1e-9) r[1] = x; else out.push([x, x]); });
    return out;
  }
  const isCorner = (g, x) => !!g.corners && g.corners.some((c) => Math.abs(c - x) < 1e-9);
  // A stretch of time split at the rule's corners, each piece stopping just short of a corner.
  function pieces(g, lo, hi) {
    const eps = (g.x[1] - g.x[0]) * 1e-5, cuts = (g.corners || []).filter((c) => c > lo + 1e-9 && c < hi - 1e-9);
    const ends = [lo].concat(cuts, [hi]), out = [];
    for (let j = 0; j + 1 < ends.length; j++) {
      const a = ends[j] + (isCorner(g, ends[j]) ? eps : 0), b = ends[j + 1] - (isCorner(g, ends[j + 1]) ? eps : 0);
      if (b > a) out.push([a, b]);
    }
    return out;
  }

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // A SHOW step draws a tour: P travels along the top graph (legs) and what its slope gives drops onto
  // the graphs below, at each stop (stops) or all the way (sweep). A puzzle's o lists its answers: right,
  // and each slip with the working it shows (rows) and what it draws (mark).
  const STEPS = [
    { show: true, name: 'A steady 3 C each second', g: 'steady', drag: true, dur: 4.0, rows: 2, draw: drawTour,
      tour: { mode: 'stops', x0: 1, legs: [{ to: 2, t: 1.3, len: 0.6 }, { to: 3, t: 2.7, len: 0.6 }], drops: [0.6, 2.0, 3.4] },
      rowsAt: (x) => [{ s: 'P ' + coord(cb, x) + ', slope ' + fmtN(rate(cb, x)) + ' C per s', soft: true }, { s: '`i` = ' + fmtN(cur(cb, x)) + ' A', big: true }],
      text: 'An ampere is one coulomb of charge passing a point each second. An example cable carries a steady 3 C every second, so the charge passed, `q`, climbs 3 C each second: `q = 3t`. Its slope is 3 C per s, so the current is 3 A wherever P goes, and every dot below sits at 3. The current is the slope of the charge graph: `i = dq/dt`. Drag P to drop more dots.' },
    { name: 'The current at 4 s', g: 'growing', p: 4, rows: 3, opts: ['height', 'right', 'chord'],
      task: 'Now the charge passed is `q = 0.5t²` coulombs, an example rule, and P is at 4 s. The power rule gives `dq/dt = 0.5 × 2t = t`. What is the current at 4 s, the height of P\'s dot below?',
      why: '`dq/dt = t`, so at 4 s the current is 4 A, and P\'s dot sits at 4. The graph stands at `0.5 × 16 = 8` C, which is how much charge has passed, and the chord from the start gives `8 ÷ 4 = 2` A on average. Only the tangent\'s slope says how fast at that instant.',
      hint: 'Not quite. Put 4 into `dq/dt = t`.',
      hints: { height: 'Not quite. 8 C is how much charge has passed by 4 s, the height of P. The current is how fast it passes.', chord: 'Not quite. 2 A is the chord from the start, the average over 4 s. Use the slope at 4 s.' },
      pre: ['P ' + coord(cg, 4), '`dq/dt = t`', 'Current at 4 s = ?'],
      right: ['P ' + coord(cg, 4), 'Slope of the tangent: ' + fmtN(rate(cg, 4)) + ' C per s', '`i` = ' + fmtN(cur(cg, 4)) + ' A'],
      o: {
        right: { t: fmtN(cur(cg, 4)) + ' A' },
        height: { t: fmtN(cg.fn(4)) + ' A', mark: { height: true }, rows: ['0.5 × 16 = ' + fmtN(cg.fn(4)) + ' C is the charge passed', 'A height, not a slope'] },
        chord: { t: fmtN(cg.fn(4) / 4) + ' A', mark: { chord: true, dot: { v: cg.fn(4) / 4, text: fmtN(cg.fn(4) / 4) + ' A on average' } }, rows: ['8 ÷ 4 = ' + fmtN(cg.fn(4) / 4) + ' A is the chord\'s average', 'Not the slope at 4 s'] },
      } },
    { show: true, name: 'A capacitor', g: 'cap', drag: true, dur: 4.6, rows: 2, draw: drawTour,
      tour: { mode: 'sweep', x0: 0, legs: [{ to: 3, t: 0.8, len: 1.2 }, { to: 7, t: 2.6, len: 1.4 }] },
      rowsAt: (x) => { const r = rate(cp, x), i = cur(cp, x); return [{ s: 'P ' + coord(cp, x) + ', slope ' + fmtN(r) + ' V per s', soft: true }, { s: '`i` = 0.01 × ' + fmtN(r) + ' = ' + (i ? fmtN(i / MA) + ' A, ' + fmtN(i) + ' mA' : '0'), big: true }]; },
      text: 'Now an example 0.01 F capacitor, with the voltage across it on top and its current below. Its current is its capacitance times the slope of its voltage graph: `i = C dv/dt`. While its voltage climbs 5 V each second, the current is `0.01 × 5 = 0.05` A, 50 mA. From 4 s the voltage holds at 20 V, so its slope is 0 and the current is 0, however high it is held. Drag P and watch the dot follow the slope, not the height.' },
    { name: 'Held at 50 V', g: 'held', p: 11, rows: 3, known: { trail: [0, 10] }, opts: ['height', 'climb', 'right'],
      task: 'The same capacitor is charged at 5 V each second up to 50 V, then held there, steady. P is on the steady part. What current flows through it now?',
      why: 'Held steady, the voltage graph is flat, so its slope is 0 and the current is `0.01 × 0 = 0`, however high it is held. `0.01 × 50 = 0.5` A uses the height, and 50 mA is the current while it climbed.',
      hint: 'Not quite. How steep is the voltage graph at P?',
      hints: { height: 'Not quite. `0.01 × 50` uses how high the voltage is. The current follows how fast it changes.', climb: 'Not quite. 50 mA flowed while the voltage climbed. At P it is holding steady.' },
      pre: ['P ' + coord(ch, 11) + ', held steady', 'Current at P = ?'],
      right: ['P ' + coord(ch, 11) + ', slope ' + fmtN(rate(ch, 11)) + ' V per s', '`i` = 0.01 × 0 = ' + fmtN(cur(ch, 11)) + ' A'],
      o: {
        right: { t: fmtN(cur(ch, 11)) + ' A' },
        height: { t: fmtN(C_F * ch.fn(11)) + ' A', mark: { height: true }, rows: ['0.01 × 50 = ' + fmtN(C_F * ch.fn(11)) + ' A uses the height', 'The current follows the slope'] },
        climb: { t: fmtN(cur(ch, 5)) + ' mA', mark: { dot: { v: cur(ch, 5), text: fmtN(cur(ch, 5)) + ' mA' } }, rows: [fmtN(cur(ch, 5)) + ' mA flowed while it climbed', 'At P the voltage holds steady'] },
      } },
    { show: true, name: 'Charging through a resistor', g: 'charge', drag: true, dur: 4.0, rows: 2, draw: drawTour,
      tour: { mode: 'sweep', x0: 0, legs: [{ to: 5, t: 0.8, len: 2.6 }] },
      rowsAt: (x) => {
        const f = cur(sk, x) / cur(sk, 0);
        return f > 0.5 ? [{ s: 'Here the voltage climbs steeply', soft: true }, { s: 'So a large current flows', big: true }]
          : f > 0.12 ? [{ s: 'Here the climb is gentler', soft: true }, { s: 'So less current flows', big: true }]
          : [{ s: 'Here the voltage has nearly levelled off', soft: true }, { s: 'So almost no current flows', big: true }];
      },
      text: 'Now charge a capacitor from a steady supply through a resistor: a sketch, with no numbers. At the start the resistor has the whole supply\'s voltage across it, so the most current flows and the voltage climbs fastest. As the capacitor\'s voltage climbs, less is left across the resistor, so less current flows and the climb gets gentler. The current is largest at the start and falls away towards zero.' },
    { name: 'The largest current', g: 'charge', p: null, rows: 3, opts: ['right', 'end', 'same'],
      task: 'On the same charging sketch, when is the current through the capacitor largest?',
      why: 'The current follows how fast the voltage climbs, and the climb is steepest at the start, when the voltage is lowest. At the end the voltage is highest but has nearly levelled off, so almost no current flows. A steady current would make the voltage climb in a straight line.',
      hint: 'Not quite. Where is the voltage graph steepest?',
      hints: { end: 'Not quite. The voltage is highest at the end, but it has nearly levelled off there.', same: 'Not quite. A steady current would make the voltage climb in a straight line, and this one curves.' },
      pre: ['The current follows the voltage\'s slope', 'Largest current = ?'],
      right: ['The current follows the voltage\'s slope', 'The steepest climb is at the start', 'Largest current: at the start'],
      o: {
        right: { t: 'At the start', at: 0, all: true, lab: 'largest at the start' },
        end: { t: 'At the end', at: 5, mark: { tan: true, note: 'nearly level', dot: { v: cur(sk, 5), text: 'almost 0 at the end' } }, rows: ['The voltage is highest at the end', 'But nearly level, so almost no current'] },
        same: { t: 'The same all along', mark: { line: { k: 1, fn: () => cur(sk, 0), text: 'a steady current', at: [2.5, 1.1, 'middle'] } }, rows: ['A steady current: a straight climb', 'This climb curves, so the current falls'] },
      } },
    { show: true, name: 'A coil', g: 'coil', drag: true, dur: 5.0, rows: 2, draw: drawTour,
      tour: { mode: 'sweep', x0: 0, legs: [{ to: 1, t: 0.5, len: 0.6 }, { to: 3, t: 1.7, len: 0.9 }, { to: 5, t: 3.2, len: 0.9 }] },
      rowsAt: (x) => [{ s: 'P ' + coord(co, x) + ', slope ' + fmtN(rate(co, x)) + ' A per s', soft: true }, { s: '`v` = 0.5 × ' + fmtN(rate(co, x)) + ' = ' + fmtN(cur(co, x)) + ' V', big: true }],
      text: 'A coil, an inductor, has the same pattern with voltage and current swapped: textbooks add that the voltage across it is its inductance times how fast its current changes, `v = L di/dt`. In an example 0.5 H coil, while the current climbs 4 A each second the voltage is `0.5 × 4 = 2` V; while it holds steady, 0 V; and while it falls 4 A each second, −2 V, the other way round.' },
    { name: 'Switched off fast', g: 'off', p: 0.025, rows: 3, opts: ['lc', 'right', 'end'],
      task: 'The same coil carries 2 A, and a switch cuts it to 0 in 0.01 s, so the current falls at `−2 ÷ 0.01 = −200` A per s. What voltage is across the coil while it falls?',
      why: 'While the current falls, `v = 0.5 × −200 = −100` V: a large voltage, the other way round, because the current changes so fast. `0.5 × 2 = 1` V uses how big the current is, and 0 V is what is left once the current has stopped.',
      hint: 'Not quite. Multiply 0.5 by how fast the current changes.',
      hints: { lc: 'Not quite. `0.5 × 2` uses how big the current is. The voltage follows how fast it changes.', end: 'Not quite. The current ends at 0, but while it falls it is changing very fast.' },

  // ---------- the linked graphs: the rule on top, what its slope gives below, one time across ----------
  const PL = 52, PR = 318;

  function panes(g) {
    if (g._p) return g._p;

    g._p = rs.map((r, k) => { const L = LAY[rs.length][k]; return { k, T: L[0], H: L[1], B: L[0] + L[1], r, name: ns[k] }; });

  // Gridlines (one time across every graph), the axes (through zero where zero is in view), numbers

  // The stretch of a straight line through (x0, y0) with slope m that lies inside the top graph.
  function clipLine(g, x0, y0, m) {

    } else if (y0 < g.y[0] || y0 > g.y[1]) return null;

  // P on the top graph, with its name.
  function drawP(g, x, a, halo) {

  function drawTangent(g, x, a) {

    if (!s) return;
    const c = { x1: X(g, s[0][0]), y1: Yk(g, 0, s[0][1]), x2: X(g, s[1][0]), y2: Yk(g, 0, s[1][1]) };

  // The dotted drop from P to graph k below (to its foot while the answer is still a question), broken

  function drawGuide(g, x, k, v, grow, a) {

  // The trail on graph k: a line through what the slope gives over each stretch P has covered (broken

  function drawTrail(g, k, runs, xs, a, r) {

    KEY.push({ cls: 'trail', text: 'from the slope', a });
  }
  // Where a dot's value is named: above or below it, right or left, inside its own graph and clear of
  // the zero line.
  function valSpot(g, k, x, s) {
    const P = panes(g)[k], px = X(g, x), py = Yk(g, k, val(g, k, x)), w = tw(s, 'lab') + 2;
    const zy = P.r[0] < 0 && P.r[1] > 0 ? Yk(g, k, 0) : null;
    const ok = (x0, b) => {
      const top = b - 11, bot = b + 3;
      if (x0 < PL + 2 || x0 + w > PR + 14 || bot > P.B - 2 || top < P.T + 1) return false;
      return !(zy != null && top < zy + 3 && bot > zy - 3);
    };
    const cands = [[px + 10, py - 9, 'start'], [px - 10, py - 9, 'end'], [px + 10, py + 19, 'start'], [px - 10, py + 19, 'end'], [px + 12, py - 22, 'start'], [px - 12, py - 22, 'end']];
    for (const c of cands) if (ok(c[2] === 'end' ? c[0] - w : c[0], c[1])) return c;
    return cands[0];
  }
  function valLabel(g, k, x, a, s) {
    if (a <= 0) return;
    const v = val(g, k, x);
    s = s || lab(g, k, v);
    if (!s || !inR(g, k, v)) return;
    const c = valSpot(g, k, x, s);
    queue(a, [{ x: c[0], y: c[1], text: s, anchor: c[2] }]);
  }
  // The key, under the lowest graph on the left.
  function drawKey(y) {
    const seen = {}, list = [];
    KEY.forEach((k) => { if (k.a <= 0) return; if (seen[k.cls]) { seen[k.cls].a = Math.max(seen[k.cls].a, k.a); return; } seen[k.cls] = Object.assign({}, k); list.push(seen[k.cls]); });
    const order = ['tan', 'trail'];
    list.sort((a, b) => order.indexOf(a.cls) - order.indexOf(b.cls));
    let x = 12;
    list.forEach((k) => {
      const x0 = x;
      part(k.a, 0, () => {
        if (k.cls === 'trail') { line('dline', x0, y - 4.5, x0 + 22, y - 4.5); circle('dot', x0 + 11, y - 4.5, 3.5); } else line(k.cls, x0, y - 4.5, x0 + 22, y - 4.5);
        text(x0 + 28, y, k.text, 'key', 'start');
      });
      x += 28 + tw(k.text, 'key') + 18;
    });
  }
  // ---------- the working under the drawing, one line each ----------
  function drawRows(G, RW) {
    RW.forEach((r, n) => {
      const a = r.a != null ? r.a : vis(r.t);
      part(a, 4, () => {
        const t = text(12, G.rowsY + 18 + 26 * n, r.s, 'row' + (r.big ? ' big' : '') + (r.soft ? ' soft' : '') + (r.bad ? ' bad' : ''), 'start');
        try { if (t.getComputedTextLength() > 314) t.style.fontSize = '13.5px'; } catch (e) { /* measured again next paint */ }
      });
      if (a >= 0.5) REC.rows.push(r.s);
      if (r.bad && a > 0) REC.bad++;

  }

  // ---------- the SHOW screens ----------
  // A tour of the graphs: P travels, its tangent riding with it, and what its slope gives drops a dot
  // straight below on each graph. Once Dan drags P the tour gives way to his trail.
  const tourEnd = (d) => (d.tour.legs.length ? d.tour.legs[d.tour.legs.length - 1].to : d.tour.x0);
  function finalTrail(d) {
    const tr = d.tour, g = GR[d.g];
    if (tr.mode === 'stops') return [tr.x0].concat(tr.legs.map((Lg) => Lg.to));
    const ends = [tr.x0].concat(tr.legs.map((Lg) => Lg.to));
    return halvesIn(g, Math.min.apply(null, ends), Math.max.apply(null, ends));
  }
  function drawTour(d, st, G, RW) {
    const g = G.g, tr = d.tour, own = st.p != null, pa = own ? 1 : vis(0.4), L = lastK(g);
    const each = (fn) => { for (let k = 1; k <= L; k++) fn(k); };
    let x = tr.x0, rx = x, la = 1, lb = 1;
    if (own) {
      x = st.p; rx = x;
      each((k) => drawTrail(g, k, runsOf(g, st.seen), st.seen, 1));
      drawGuide(g, x, L, val(g, L, x), 1, 1);
      each((k) => drawLive(g, k, x, 1));
    } else if (tr.mode === 'stops') {
      // P stops at each place, its dot drops, then it moves on.
      let n0 = 0, moving = false;
      for (let n = 0; n < tr.legs.length; n++) {
        const Lg = tr.legs[n];
        if (T < Lg.t) break;
        if (T < Lg.t + Lg.len) { moving = true; x = K.lerp(x, Lg.to, K.ease((T - Lg.t) / Lg.len)); break; }
        x = Lg.to; rx = x; n0 = n + 1;
      }
      const stops = [tr.x0].concat(tr.legs.map((Lg) => Lg.to));
      stops.forEach((sx, j) => each((k) => drawTrail(g, k, [], [sx], arr(tr.drops[j] + 0.25, 0.35), 5)));
      if (moving) {
        la = 1 - K.arrive(T, tr.legs[n0].t, 0.3); lb = la;
        drawGuide(g, rx, L, val(g, L, rx), 1, la);
      } else {
        lb = arr(tr.drops[n0] + 0.25, 0.35);
        drawGuide(g, rx, L, val(g, L, rx), arr(tr.drops[n0], 0.35), 1);
        each((k) => drawLive(g, k, rx, lb));
        la = n0 === 0 ? 1 : arr(tr.drops[n0], 0.5);
      }
    } else {
      // P sweeps along, dropping what its slope gives all the way; the trail grows behind it.
      for (let n = 0; n < tr.legs.length; n++) {
        const Lg = tr.legs[n];
        if (T < Lg.t) break;
        if (T < Lg.t + Lg.len) { la = 1 - K.arrive(T, Lg.t, 0.3); x = K.lerp(x, Lg.to, K.ease((T - Lg.t) / Lg.len)); break; }
        x = Lg.to; rx = x; la = arr(Lg.t + Lg.len, 0.5);
      }
      const lo = Math.min(x, tr.x0), hi = Math.max(x, tr.x0);
      each((k) => drawTrail(g, k, [[lo, hi]], halvesIn(g, lo, hi), pa));
      drawGuide(g, x, L, val(g, L, x), pa, 1);
      each((k) => drawLive(g, k, x, pa));
      lb = Math.min(la, pa);
    }
    if (lb > 0) each((k) => valLabel(g, k, rx, lb));
    drawTangent(g, x, 1);
    drawP(g, x, 1, d.drag && !finished);
    d.rowsAt(rx).forEach((r) => RW.push({ s: r.s, big: r.big, soft: r.soft, a: la }));
    return [[X(g, x), Yk(g, 0, g.fn(x)), x]];
  }

  // ---------- the puzzles ----------
  // Before Check the working ends in a question mark and P's drop ends in "?"; after it, the answer
  // (the tangent and P's dot below), or the slip drawn in red.
  function puzzleRows(d, k, o, RW) {
    if (!k) d.pre.forEach((s, n) => RW.push({ s, soft: n < d.pre.length - 1 }));
    else if (k === 'right') d.right.forEach((s, n) => RW.push(n === 0 ? { s, soft: true } : { s, big: n === d.right.length - 1, t: 0.2 + 0.2 * n }));
    else { RW.push({ s: d.pre[0], soft: true }); o.rows.forEach((s, n) => RW.push({ s, bad: true, soft: n === 1, t: 0.2 + 0.2 * n })); }
  }
  function drawRedLine(g, k, fn, a, txt, pos) {
    let s = '', on = false;
    K.linspace(g.x[0], g.x[1], 51).forEach((x) => { const v = fn(x); if (inR(g, k, v)) { s += (on ? ' L' : ' M') + r3(X(g, x)) + ' ' + r3(Yk(g, k, v)); on = true; } else on = false; });
    part(a, 0, () => AV.push(path('dline bad', s.trim())));
    queue(a, [{ x: X(g, pos[0]), y: Yk(g, k, pos[1]), text: txt, anchor: pos[2] || 'middle', cls: 'bad' }]);
  }
  function drawSlipG(g, p, mk, a) {
    const L = lastK(g);
    if (mk.height) {   // a guide to P's height: the amount, read as if it were the rate
      const y = Yk(g, 0, g.fn(p));
      part(a, 0, () => AV.push(line('slip', PL + 2, y, X(g, p) - 9, y)));
      queue(a, [{ x: PL + 8, y: y - 8, text: amt(g, g.fn(p)), anchor: 'start', cls: 'bad' }]);
      REC.bad++;
    }
    if (mk.chord) {   // the chord from the start to P: an average, not the rate now
      const x0 = X(g, g.x[0]), y0 = Yk(g, 0, g.fn(g.x[0])), x1 = X(g, p), y1 = Yk(g, 0, g.fn(p));
      part(a, 0, () => AV.push(line('slip', x0, y0, x1, y1)));
      queue(a, [{ x: PL + 8, y: y1 + 4, text: 'chord from the start', anchor: 'start', cls: 'bad' }]);
      REC.bad++;
    }
    if (mk.tan) drawTangent(g, p, a);
    if (mk.note) { queue(a, [{ x: X(g, p) - 12, y: Yk(g, 0, g.fn(p)) + 24, text: mk.note, anchor: 'end', cls: 'bad' }]); REC.bad++; }
    if (mk.dot) {   // a red dot at the wrong value, below P
      const k = mk.dot.k != null ? mk.dot.k : L, px = X(g, p), py = Yk(g, k, mk.dot.v), w = tw(mk.dot.text, 'lab');
      part(a, 0, () => AV.push(circle('dot bad', px, py, 6)));
      queue(a, [px + 11 + w > 334 ? { x: px - 12, y: py - 9, text: mk.dot.text, anchor: 'end', cls: 'bad' } : { x: px + 11, y: py - 8, text: mk.dot.text, anchor: 'start', cls: 'bad' }]);
      REC.bad++;
    }
    if (mk.line) { drawRedLine(g, mk.line.k, mk.line.fn, a, mk.line.text, mk.line.at); REC.bad++; }
    if (mk.tanLab) {   // the tangent's slope, read as if it were already the current
      drawTangent(g, p, a);
      queue(a, [{ x: X(g, p) - 14, y: Yk(g, 0, g.fn(p)) - 12, text: mk.tanLab, anchor: 'end', cls: 'bad' }]);
      REC.bad++;
    }
  }
  function drawPuzzleG(d, st, G, RW) {
    const g = G.g, L = lastK(g), k = st.res === 'right' ? 'right' : st.res === 'wrong' ? st.pick : null, a = arr(0.1), o = k ? d.o[k] : null, kn = d.known || {};
    const p = o && o.at != null ? o.at : d.p;
    if (kn.trail) drawTrail(g, L, [kn.trail], halvesIn(g, kn.trail[0], kn.trail[1]), 1);
    if (kn.mid) { drawTrail(g, 1, [[g.x[0], g.x[1]]], halvesIn(g, g.x[0], g.x[1]), 1); drawLive(g, 1, d.p, 1); valLabel(g, 1, d.p, 1); }

  }

  // ---------- each step's sizes ----------
  const GEO = new Map();
  function geo(d) {
    if (GEO.has(d)) return GEO.get(d);
    const g = GR[d.g], PS = panes(g), rowsY = PS[PS.length - 1].B + 40, G = { g, rowsY, H: Math.ceil(rowsY + 26 * d.rows + 12) };
    GEO.set(d, G);
    return G;
  }
  // The step's picture: the graphs, then what this screen shows on them, then the key and the working.
  function drawScene(d, st, G) {
    const RW = [], g = G.g, PS = panes(g), foot = PS[PS.length - 1].B + 36;
    REC = { rows: [], labs: [], bad: 0, dots: [], live: [], tan: null, P: null, p: null, G };
    AV = []; LQ = []; KEY = [];
    text(12, 20, g.who, 'tag', 'start');
    PS.forEach((P) => drawFrame(g, P));
    text(PR + 8, foot, g.xn || '`t` in seconds', 'aname', 'end');
    AV.push(path('curve', curveD(g)));

  }

  // ---------- dragging P along the top graph (the SHOW screens) ----------
  // P lands on half steps inside the axes, never on a corner, and leaves a dot at every half step it passes.
  const snapP = (g, v) => {
    let n = K.clamp(Math.round(v * 2) / 2, g.x[0], g.x[1]);
    if (isCorner(g, n)) n = K.clamp(n + (v >= n ? 0.5 : -0.5), g.x[0], g.x[1]);
    return n;
  };
  const dragOn = () => !finished && !!STEPS[at()].drag;
  const curP = () => { const d = STEPS[at()], st = S[at()]; return st.p != null ? st.p : tourEnd(d); };
  function setP(v) {
    const i = at(), d = STEPS[i], st = S[i], g = GR[d.g], n = snapP(g, v);
    if (st.p === n && T === Infinity) return;
    if (anim.playing()) anim.pause();
    const from = curP();
    st.seen = uniq(g, (st.seen || finalTrail(d)).concat(halvesIn(g, Math.min(from, n), Math.max(from, n))));

  }
  function svgPoint(e) {

  }
  let held = null;
  const grip = ui.appendChild(K.svg('circle', { class: 'grip', cx: 0, cy: 0, r: 22, tabindex: -1, role: 'slider', 'aria-orientation': 'horizontal', 'aria-label': 'Point P' }));

  grip.addEventListener('pointerdown', (e) => {
    if (!dragOn()) return;
    held = e.pointerId;
    try { grip.setPointerCapture(e.pointerId); } catch (err) { /* the drag still follows while the pointer stays on the grip */ }

  });
  grip.addEventListener('pointermove', (e) => {
    if (held !== e.pointerId || !dragOn()) return;
    const q = svgPoint(e), g = GR[STEPS[at()].g];

  });

  grip.addEventListener('pointercancel', letGo);

  grip.addEventListener('keydown', (e) => {
    if (!dragOn()) return;

    if (by == null) return;
    e.preventDefault();
    setP(curP() + 0.5 * by);
  });
  function placeGrip(d, list) {
    if (checking) return;
    const on = !!d.drag && !finished && list.length > 0;
    grip.style.display = on ? '' : 'none';
    grip.setAttribute('tabindex', on ? '0' : '-1');
    if (!on) return;
    const g = GR[d.g];
    grip.setAttribute('cx', r3(list[0][0])); grip.setAttribute('cy', r3(list[0][1]));
    grip.setAttribute('aria-valuemin', g.x[0]); grip.setAttribute('aria-valuemax', g.x[1]); grip.setAttribute('aria-valuenow', list[0][2]);
    grip.setAttribute('aria-valuetext', fmtN(list[0][2]) + ' s');
  }

  // The scene for a step (the animation calls this every frame).
  function paint(i) {
    if (i == null) i = at();
    const d = STEPS[i], st = S[i], G = geo(d);
    art.textContent = '';
    into = null;
    svg.setAttribute('viewBox', '0 0 340 ' + G.H);
    svg.setAttribute('aria-label', drawScene(d, st, G));
  }

  const el = (id) => document.getElementById(id);
  write(el('finish'), FINISH);
  K.update((p) => {
    const i = Math.round(p.step), d = STEPS[i], st = S[i];
    if (!anim.playing()) T = Infinity;   // motion that was stopped (the page hidden, a test) shows finished
    if (i !== lastStep) {
      lastStep = i; enter('stepbox');
      if (d.show) { st.p = null; st.seen = null; play(d.dur); } else { anim.pause(); T = Infinity; }
    }
    if (finished !== lastDone) { lastDone = finished; enter(finished ? 'done' : 'stepbox'); }
    const right = st.res === 'right';
    el('stepbox').hidden = finished;
    el('done').hidden = !finished;
    el('count').textContent = 'Step ' + (i + 1) + ' of ' + STEPS.length;
    const task = el('task');
    task.className = 'task' + (d.show ? ' show' : '');
    write(task, d.show ? d.text : d.task);
    paint(i);

    replayBtn.el.hidden = !d.show || REDUCE;
    el('replay').hidden = replayBtn.el.hidden;
    const opts = d.show ? [] : d.opts, labs = opts.map((k) => d.o[k].t);
    el('picks').hidden = !opts.length;
    el('picks').classList.toggle('long', labs.some((o) => o.length > 6));
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      b.setLabel(labs[k]);
      b.el.textContent = '';
      b.el.appendChild(K.el('span', {}, labs[k]));
      b.el.setAttribute('aria-label', say(labs[k]));
      b.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });

    el('acts').hidden = !!d.show;
    checkBtn.el.hidden = right;
    const fb = el('fb');
    fb.hidden = !!d.show;
    fb.className = 'fb' + (right ? ' right' : st.res === 'wrong' ? ' wrong' : '');
    write(fb, d.show ? '' : right ? 'That\'s it.' : st.res === 'wrong' ? hintFor(i, st) : st.res === 'empty' ? 'Tap one of the answers.' : '');

    const why = el('why');
    why.hidden = d.show || !st.why;
    write(why, d.show ? '' : d.why);
    whyBtn.setLabel(st.why ? 'Hide why' : 'Why?');

    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !right);
    nextBtn.setLabel(i === STEPS.length - 1 ? 'Finish' : 'Continue');
    nav.hidden = backBtn.el.hidden && nextBtn.el.hidden;
  });

  // ---------- known answers, worked out by hand ----------
  const DO = STEPS.map((d, i) => i).filter((i) => !STEPS[i].show);
  const solvedSt = () => Object.assign(blank(), { pick: 'right', res: 'right' });
  const wrongSt = (o) => Object.assign(blank(), { pick: o, res: 'wrong' });
  const close = (a, b, tol) => typeof a === 'number' && typeof b === 'number' && Math.abs(a - b) <= (tol || 1e-9) * Math.max(1, Math.abs(a), Math.abs(b));
  const idx = (name) => STEPS.findIndex((d) => d.name === name);
  // A height on graph k, and a line's slope on the top graph, read back through the axes.
  const readV = (g, k, py) => { const P = panes(g)[k]; return P.r[0] + (P.B - py) / P.H * (P.r[1] - P.r[0]); };
  const tanSlope = (c, g) => { const P = panes(g)[0]; return (-(c.y2 - c.y1) / P.H * (P.r[1] - P.r[0])) / ((c.x2 - c.x1) / (PR - PL) * (g.x[1] - g.x[0])); };
  const onLine = (c, pt) => Math.abs((c.x2 - c.x1) * (pt[1] - c.y1) - (c.y2 - c.y1) * (pt[0] - c.x1)) / Math.hypot(c.x2 - c.x1, c.y2 - c.y1) < 1e-6;
  // Chords from both sides, ever shorter, settle on the slope the page uses.
  const settles = (g, x) => [1e-3, 1e-5].every((e) => Math.abs(slope(g, x, x + e) - rate(g, x)) < 1e-2 && Math.abs(slope(g, x - e, x) - rate(g, x)) < 1e-2);
  // A step painted in the state given (finished, or t seconds into its motion): what it draws.
  function drawn(i, st, t) {
    const keepS = S[i], keepT = T;
    S[i] = st; T = t == null ? Infinity : t; checking = true;
    try {
      paint(i);
      return Object.assign({}, REC, { rows: REC.rows.slice(), labs: REC.labs.slice(), dots: REC.dots.slice(), live: REC.live.slice() });
    } finally { S[i] = keepS; T = keepT; checking = false; paint(); }
  }
  const dragged = (g, p, lo) => Object.assign(blank(), { p, seen: halvesIn(g, lo, p) });

  K.check('The instantaneous current is the time derivative of the charge that flows: on every charge screen each dot below sits straight under its time, as high as the slope the chords there settle on from either side, and the tangent through P has that slope', () =>
    STEPS.every((d, i) => {
      if (['steady', 'growing', 'mixq'].indexOf(d.g) < 0) return true;
      const g = GR[d.g], states = d.show ? [blank(), dragged(g, 2.5, 1.5)] : [solvedSt()];
      return states.every((st) => {
        const h = drawn(i, st), ds = h.dots.filter((q) => q.k === 1), lv = h.live.filter((q) => q.k === 1);
        return (!d.show || ds.length > 0) && ds.every((q) => close(q.px, X(g, q.x)) && settles(g, q.x) && close(readV(g, 1, q.py), rate(g, q.x))) &&
          lv.length === 1 && close(lv[0].px, h.P[0]) && close(readV(g, 1, lv[0].py), rate(g, h.p)) && settles(g, h.p) &&
          !!h.tan && close(tanSlope(h.tan, g), rate(g, h.p)) && onLine(h.tan, h.P);
      });
    }), { source: LT_I });
  K.check('One ampere is the current in which one coulomb of charge passes a point each second: the charge line climbing 3 C every second drops every dot at 3 A, wherever P goes', () => {
    const i = idx('A steady 3 C each second'), hs = [drawn(i, blank()), drawn(i, dragged(cb, 5, 0))];
    const at3 = (h) => { const ds = h.dots.filter((q) => q.k === 1); return ds.length >= 3 && ds.every((q) => close(readV(cb, 1, q.py), 3)); };
    return cb.fn(1) - cb.fn(0) === 3 && hs.every(at3) && hs[1].dots.filter((q) => q.k === 1).length === 11;
  }, { source: NIST });
  K.check('The current through a capacitor is equal to the capacitance times the slope of its voltage graph: on every capacitor screen each dot below reads 0.01 F × that slope, in mA, so 50 mA while the voltage climbs 5 V each second and 0 while it holds', () => {
    const all = STEPS.every((d, i) => {
      if (['cap', 'held', 'mixv'].indexOf(d.g) < 0) return true;
      const g = GR[d.g], states = d.show ? [blank(), dragged(g, 6, 2)] : [solvedSt()];
      return states.every((st) => {
        const h = drawn(i, st), ds = h.dots.filter((q) => q.k === 1).concat(h.live.filter((q) => q.k === 1));

      });
    });
    const h = drawn(idx('A capacitor'), blank()), ds = h.dots.filter((q) => q.k === 1);
    return all && ds.length > 8 && ds.every((q) => close(readV(cp, 1, q.py), q.x < 4 ? 50 : 0)) && !!h.tan && close(tanSlope(h.tan, cp), rate(cp, h.p));
  }, { source: CAPS });
  K.check('Velocity from the displacement-time function and acceleration from the velocity-time function: on both motion screens the middle dots read the slope of the displacement graph (2t for the boat, 8 − 2t for the trolley) and the bottom dots the slope of the velocity graph (2, then −2)', () => {
    const b = drawn(idx('Velocity and acceleration'), blank()), t = drawn(idx('The trolley at the top'), solvedSt());
    const vOK = (h, g, f) => { const ds = h.dots.filter((q) => q.k === 1); return ds.length > 3 && ds.every((q) => close(readV(g, 1, q.py), f(q.x)) && settles(g, q.x)); };
    const aOK = (h, g, a) => { const ds = h.dots.filter((q) => q.k === 2).concat(h.live.filter((q) => q.k === 2)); return ds.length > 0 && ds.every((q) => close(readV(g, 2, q.py), a) && close((val(g, 1, q.x + 0.5) - val(g, 1, q.x)) / 0.5, a)); };
    return vOK(b, bt, (x) => 2 * x) && aOK(b, bt, 2) && vOK(t, tl, (x) => 8 - 2 * x) && aOK(t, tl, -2);
  }, { source: GOV });
  K.check('The derivative of a constant function is zero: wherever a voltage or a current holds steady (the capacitor at 20 V and at 50 V, the coil at 8 A, the coil before and after the switch-off) its rate below is 0', () =>
    [4.5, 5, 6, 7, 8].every((x) => cur(cp, x) === 0) && [10.5, 11, 12].every((x) => cur(ch, x) === 0) && [2.5, 3, 3.5].every((x) => cur(co, x) === 0) &&
    [0, 0.01, 0.015, 0.035, 0.05].every((x) => cur(sw, x) === 0) &&

  K.check('Charging through a resistor (the sketch): the voltage climbs at every step but stays under the supply\'s voltage, and the current below falls at every step, largest at the start and nearly 0 by the end', () => {
    const xs = halvesIn(sk, 0, 5);

  });
  K.check('From the rules, by hand: 3t gives 3 A; 0.5t² at 4 s is 8 C, slope 4, chord 8 ÷ 4 = 2; the capacitor climbing 5 V per s gives 0.01 × 5 = 0.05 A = 50 mA, and 0 held at 20 V or 50 V (0.01 × 50 = 0.5); the coil gives 0.5 × 4 = 2 V, 0 and −2 V; switched off, −2 ÷ 0.01 = −200 A per s and −100 V (0.5 × 2 = 1); the boat at 3 s is 9 m, 6 m per s, 2; the trolley at 4 s is 16 m, 0, −2; 2t² + 3t at 2 s is 14 C and 11 A (19 with the power kept); t² volts at 3 s is 9 V, slope 6, 60 mA (90 from the height); and the screens\' words quote these values', () => {
    const nums = rate(cb, 2) === 3 && cur(cb, 2) === 3 &&
      cg.fn(4) === 8 && rate(cg, 4) === 4 && cur(cg, 4) === 4 && cg.fn(4) / 4 === 2 &&

      ch.fn(11) === 50 && close(C_F * ch.fn(11), 0.5) && cur(ch, 11) === 0 && cur(ch, 5) === 50 &&
      rate(co, 1) === 4 && cur(co, 1) === 2 && cur(co, 3) === 0 && rate(co, 5) === -4 && cur(co, 5) === -2 &&
      rate(sw, 0.025) === -200 && cur(sw, 0.025) === -100 && L_H * 2 === 1 &&
      bt.fn(3) === 9 && rate(bt, 3) === 6 && rate2(bt, 3) === 2 && K2(bt) === 2 &&
      tl.fn(4) === 16 && rate(tl, 4) === 0 && rate2(tl, 4) === -2 &&
      mq.fn(2) === 14 && rate(mq, 2) === 11 && keepPow(2) === 19 &&
      mv.fn(3) === 9 && rate(mv, 3) === 6 && cur(mv, 3) === 60 && close(C_F * mv.fn(3) * MA, 90);
    const has = (name, key, bits) => { const v = key.split('.').reduce((o, k) => o[k], STEPS[idx(name)]); return bits.every((b) => v.indexOf(b) >= 0); };
    const words = has('A steady 3 C each second', 'text', ['steady ' + fmtN(rate(cb, 1)) + ' C every second', 'current is ' + fmtN(cur(cb, 1)) + ' A']) &&
      has('The current at 4 s', 'why', ['at 4 s the current is ' + fmtN(cur(cg, 4)) + ' A', '0.5 × 16 = ' + fmtN(cg.fn(4)), '8 ÷ 4 = ' + fmtN(cg.fn(4) / 4)]) &&
      has('A capacitor', 'text', ['climbs ' + fmtN(rate(cp, 1)) + ' V each second', '0.01 × 5 = ' + fmtN(cur(cp, 1) / MA), fmtN(cur(cp, 1)) + ' mA', 'holds at ' + fmtN(cp.fn(6)) + ' V']) &&
      has('Held at 50 V', 'why', ['0.01 × 50 = ' + fmtN(C_F * ch.fn(11)), fmtN(cur(ch, 5)) + ' mA']) &&
      has('A coil', 'text', ['climbs ' + fmtN(rate(co, 1)) + ' A each second', '0.5 × 4 = ' + fmtN(cur(co, 1)), fmtN(cur(co, 5)) + ' V']) &&
      has('Switched off fast', 'task', ['−2 ÷ 0.01 = ' + fmtN(rate(sw, 0.025))]) && has('Switched off fast', 'why', ['0.5 × −200 = ' + fmtN(cur(sw, 0.025)), '0.5 × 2 = ' + fmtN(L_H * 2)]) &&
      has('Velocity and acceleration', 'text', ['at 3 s is ' + fmtN(bt.fn(3)) + ' m', '2 × 3 = ' + fmtN(rate(bt, 3)), 'acceleration is ' + fmtN(rate2(bt, 3))]) &&
      has('The trolley at the top', 'task', ['at 4 s it is ' + fmtN(tl.fn(4)) + ' m up']) && has('The trolley at the top', 'why', ['acceleration is ' + fmtN(rate2(tl, 4))]) &&
      has('Charge, mixed', 'why', ['4 × 2 + 3 = ' + fmtN(rate(mq, 2)), '8 + 6 = ' + fmtN(mq.fn(2)), '4 × 4 + 3 = ' + fmtN(keepPow(2))]) &&
      has('A capacitor, mixed', 'why', ['2 × 3 = ' + fmtN(rate(mv, 3)), '0.01 × 6 = ' + fmtN(cur(mv, 3) / MA), fmtN(cur(mv, 3)) + ' mA']);
    return nums && words;
  });
  K.check('Every puzzle offers three different answers and accepts only the right one; each wrong answer is the slip it stands for: 8 A and 2 A against 4 A; 0.5 A and 50 mA against 0 A; the end and the same all along against the start; 1 V and 0 V against −100 V; 0 and 16 against −2; 14 A and 19 A against 11 A; 90 mA and 6 A against 60 mA', () => {
    const want = {
      'The current at 4 s': ['8 A', '4 A', '2 A'], 'Held at 50 V': ['0.5 A', '50 mA', '0 A'], 'The largest current': ['At the start', 'At the end', 'The same all along'],
      'Switched off fast': ['1 V', '−100 V', '0 V'], 'The trolley at the top': ['0', '16', '−2'], 'Charge, mixed': ['11 A', '14 A', '19 A'], 'A capacitor, mixed': ['90 mA', '60 mA', '6 A'],

    return DO.length === 7 && DO.every((i) => {

    DO.every((i) => {

  K.check('Dragging P keeps it on a half second inside the axes and never on a corner of the capacitor\'s or the coil\'s graph, and the dots below skip the corners', () =>
    snapP(cb, 2.3) === 2.5 && snapP(cb, 7) === 5 && snapP(cb, -1) === 0 && snapP(cp, 4.1) === 4.5 && snapP(cp, 3.9) === 3.5 && snapP(co, 2) === 2.5 && snapP(co, 3.9) === 3.5 &&
    JSON.stringify(runsOf(cb, [1, 2, 3, 3.5, 4])) === '[[1,1],[2,2],[3,4]]' && JSON.stringify(pieces(cp, 0, 8).map((q) => q.map((v) => Math.round(v)))) === '[[0,4],[4,8]]' &&
    drawn(idx('A capacitor'), blank()).dots.every((q) => !isCorner(cp, q.x)));
  K.check('Every demonstration has finished arriving within 5 s of its screen opening, none starting before the 0.35 s screen fade ends; every answer\'s motion, right or wrong, within 1.3 s', () => {
    const keepT = T;
    const timed = (i, st, limit) => {
      const keepS = S[i];
      T = Infinity; latest = 0; earliest = Infinity; checking = true;
      S[i] = st;
      try { paint(i); } finally { S[i] = keepS; checking = false; }

    };

      if (d.show) { const r = timed(i, blank(), d.dur); return r && d.dur <= 5 && d.dur >= 3 && earliest >= FADE; }
      return timed(i, solvedSt(), FB[0]) && d.opts.filter((o) => o !== 'right').every((o) => timed(i, wrongSt(o), FB[1]));
    });
    T = keepT; paint();
    return ok;
  });

  K.ready();
