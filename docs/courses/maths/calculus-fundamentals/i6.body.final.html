<style>
  [hidden] { display: none !important; }
  .pz, .lead, .caption { max-width: 30rem; margin-inline: auto; }
  .pz > * + *, #stepbox > * + * { margin-top: 14px; }
  /* The stepper is the page's step control: its dots are the progress bar; Back and Continue are below. */
  .pz .k-stepper { gap: 0; }
  .pz .k-stepper .k-label, .pz .k-stepper-nav { display: none; }
  .pz .count { margin-top: 10px; }
  .task { font-size: 1.2rem; font-weight: 700; line-height: 1.5; margin-top: 4px; }
  .task.show { font-size: 1.08rem; font-weight: 400; line-height: 1.6; }
  .nw { white-space: nowrap; }
  .v { font-style: italic; }
  .scene { display: block; width: 100%; max-width: 25rem; margin-inline: auto; touch-action: pan-y; }
  .scene .grid { stroke: var(--k-line); stroke-width: 1; }
  .scene .axis, .scene .mtick { stroke: var(--k-strong); stroke-width: 1.5; }
  .scene .tick, .scene .aname, .scene .key { font: 400 13px var(--k-font); fill: var(--k-muted); }
  .scene .tag { font: 700 15px var(--k-font); fill: var(--k-accent2); }
  /* The top graph: the rule's curve, P and its tangent. */
  .scene .curve { fill: none; stroke: var(--k-accent2); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  .scene .tan { fill: none; stroke: var(--k-ink); stroke-width: 2; stroke-dasharray: 7 5; }
  .scene .pt { fill: var(--k-accent2); stroke: var(--k-bg); stroke-width: 2; }
  .scene .halo { fill: var(--k-accent); fill-opacity: .08; stroke: var(--k-accent); stroke-opacity: .5; stroke-width: 1.5; }
  /* The graph below: P's slope at each x, as dots joined where P has passed, and the dotted drop from P. */
  .scene .dline { fill: none; stroke: var(--k-accent); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  .scene .dot { fill: var(--k-accent); stroke: var(--k-bg); stroke-width: 1.5; }
  .scene .dot.now { stroke: var(--k-ink); stroke-width: 2; }
  .scene .drop { stroke: var(--k-muted); stroke-width: 1.5; stroke-dasharray: 2 4; }
  /* A slip is drawn in the warning colour. */
  .scene .dline.bad { stroke: var(--k-warn); stroke-dasharray: 7 5; }
  .scene .dot.bad { fill: var(--k-warn); stroke: var(--k-bg); stroke-width: 1.5; }
  .scene .ring { fill: none; stroke: var(--k-warn); stroke-width: 2.5; }
  .scene .lab { font: 600 14px var(--k-font); fill: var(--k-ink); }
  .scene .lab.soft { font-weight: 400; fill: var(--k-muted); }
  .scene .row { font: 600 15px var(--k-font); fill: var(--k-ink); }
  .scene .row.big { font-weight: 700; fill: var(--k-accent2); }
  .scene .row.soft { font-weight: 400; }
  .scene .lab.bad, .scene .row.bad { fill: var(--k-warn); }
  .scene .v { font-style: italic; }
  .scene #art * { pointer-events: none; }
  .scene .grip { fill: var(--k-bg); fill-opacity: 0; stroke: none; cursor: grab; touch-action: none; }
  .scene .grip:active { cursor: grabbing; }
  .scene .grip:focus { outline: none; }
  .scene .grip:focus-visible { stroke: var(--k-accent); stroke-width: 3; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  .row .k-btn { flex: 1 1 7rem; }
  .replay { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 10px; }
  .replay .k-btn { flex: 0 0 auto; min-height: 44px; padding-left: 16px; padding-right: 16px; font-size: .95rem; white-space: nowrap; }
  /* The answers stay on one row, each label whole; longer ones stack one to a row. */
  .row.picks { flex-wrap: nowrap; }
  .picks .k-btn { font-size: 1.15rem; min-height: 56px; flex: 1 1 0; min-width: 0; white-space: nowrap; padding-inline: 6px; }
  .row.picks.long { flex-direction: column; gap: 8px; }
  .picks.long .k-btn { flex: 0 0 auto; width: 100%; min-height: 48px; }
  .picks .k-btn[aria-pressed="true"] { background: var(--k-accent2); color: var(--k-on-accent2); border-color: var(--k-accent2); }
  .fb { font-weight: 700; min-height: 1.5em; margin-top: 10px; }
  .fb.right { color: var(--k-good); }
  .fb.wrong { color: var(--k-ink); }
  .why, .done { line-height: 1.6; }
  .done strong { color: var(--k-accent2); }
  .done .row { margin-top: 14px; }
  /* Each new screen settles in softly: its words and picture fade in and rise 4 px. */
  #stepbox.enter, #done.enter, #scene.enter { animation: screen-in .35s ease-out both; }
  @keyframes screen-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  html.k-testing #stepbox.enter, html.k-testing #done.enter, html.k-testing #scene.enter { animation: none; }
  @media (prefers-reduced-motion: reduce) {
    #stepbox.enter, #done.enter, #scene.enter { animation: none; }
  }
</style>

<p class="lead">Linked graphs sharing one x across: above, an amount you want the most or the least of; below, its slope at the same x.</p>

<div class="pz" id="pz">
  <div id="prog"></div>
  <div id="stepbox">
    <p class="k-label count" id="count"></p>
    <p class="task" id="task"></p>
    <svg class="scene" id="scene" viewBox="0 0 340 470" width="100%" role="img" aria-label=""><g id="art"></g><g id="ui"></g></svg>
    <div class="replay" id="replay"></div>
    <div class="row picks" id="picks"></div>
    <div class="row acts" id="acts"></div>
    <p class="fb" id="fb" aria-live="polite"></p>
    <div class="note why" id="why" hidden></div>
  </div>
  <div class="panel done" id="done" hidden>
    <p><strong id="finish"></strong></p>
    <div class="row" id="again"></div>
  </div>
  <div class="row nav" id="nav"></div>
</div>

<p class="caption">Every rule is an example, and every dot below is the slope worked out from the rule above.</p>

<script>
  // ---------- the example rules ----------
  // fn: the top graph's rule; x, y, d: [from, to, tick step] across, for the amount above and for its
  // slope below; step: where a drag of P lands; xu, yu: the units across and up.
  const G2 = (o) => Object.assign({ yn: '`y`', dn: 'slope `dy/dx`', xn: '`x`', xu: '', yu: '', step: 0.5 }, o);
  const PW = { yn: '`P`, power into the load in W', dn: 'slope `dP/dI`', xn: '`I`, current in A', xu: 'A', yu: 'W' };
  const GR = {
    tape: G2({ who: '40 m of tape: `A = 20x − x²`', fn: (x) => 20 * x - x * x, x: [0, 20, 5], y: [0, 125, 25], d: [-20, 20, 10], step: 1,
      yn: '`A`, area in m²', dn: 'slope `dA/dx`', xn: '`x`, one side in m', xu: 'm', yu: 'm²' }),
    cup: G2({ who: 'An example cup: `y = x² − 8x + 20`', fn: (x) => x * x - 8 * x + 20, x: [0, 8, 2], y: [0, 20, 5], d: [-8, 8, 4] }),
    hill: G2({ who: 'An example: `y = 12x − 3x²`', fn: (x) => 12 * x - 3 * x * x, x: [0, 4, 1], y: [0, 15, 5], d: [-12, 12, 6] }),
    cube: G2({ who: 'The curve `y = x³`', fn: (x) => x * x * x, x: [-2, 2, 1], y: [-8, 8, 4], d: [-4, 12, 4] }),
    flat3: G2({ who: 'An example: `y = x³ − 3x² + 3x`', fn: (x) => x * x * x - 3 * x * x + 3 * x, x: [0, 2, 0.5], y: [0, 2.5, 0.5], d: [-1, 3, 1], step: 0.25 }),
    power: G2(Object.assign({ who: '12 V, 0.5 Ω inside: `P = 12I − 0.5I²`', fn: (i) => 12 * i - 0.5 * i * i, x: [0, 24, 4], y: [0, 80, 20], d: [-12, 12, 6], step: 1, E: 12, r: 0.5 }, PW)),
    pow24: G2(Object.assign({ who: '24 V, 3 Ω inside: `P = 24I − 3I²`', fn: (i) => 24 * i - 3 * i * i, x: [0, 8, 2], y: [0, 100, 25], d: [-24, 24, 12], E: 24, r: 3 }, PW)),
    box: G2({ who: 'A 30 cm sheet: `V = x(30 − 2x)²`', fn: (x) => x * (30 - 2 * x) * (30 - 2 * x), x: [0, 15, 5], y: [0, 2500, 500], d: [-300, 900, 300],
      yn: '`V`, volume in cm³', dn: 'slope `dV/dx`', xn: '`x`, the cut in cm', xu: 'cm', yu: 'cm³' }),
    bowl: G2({ who: 'An example: `y = 2x² − 12x + 25`', fn: (x) => 2 * x * x - 12 * x + 25, x: [0, 6, 1], y: [0, 30, 10], d: [-12, 12, 6] }),
    cubic2: G2({ who: 'An example: `y = x³ − 12x`', fn: (x) => x * x * x - 12 * x, x: [0, 4, 1], y: [-20, 20, 10], d: [-12, 36, 12] }),
  };
  const ta = GR.tape, cu = GR.cup, hl = GR.hill, c3 = GR.cube, f3 = GR.flat3, pw = GR.power, p24 = GR.pow24, bx = GR.box, bw = GR.bowl, c2 = GR.cubic2;

  // ---------- numbers ----------
  const tidy = (v) => { const r = +(+v).toPrecision(10); return Math.abs(r) < 1e-12 ? 0 : r; };
  const fmtN = (v) => String(tidy(v)).replace('-', '−');
  const fmtK = (v) => { const t = tidy(v); return Math.abs(t) >= 1000 ? t.toLocaleString('en-GB', { maximumFractionDigits: 6 }).replace('-', '−') : fmtN(t); };
  const slope = (g, a, b) => (g.fn(b) - g.fn(a)) / (b - a);   // a chord's slope from the rule
  // The slope at x, from the rule: a chord 0.0002 wide centred on x, rounded to six places (the number
  // the chords settle on). The slope of the slope, the second derivative, from how the chords change.
  const HH = 1e-4;
  const rate = (g, x) => tidy(Math.round((g.fn(x + HH) - g.fn(x - HH)) / (2 * HH) * 1e6) / 1e6);
  function rate2(g, x) { const h = 1e-3; return tidy(Math.round((g.fn(x + h) - 2 * g.fn(x) + g.fn(x - h)) / (h * h) * 1e4) / 1e4); }
  const val = (g, k, x) => (k === 0 ? g.fn(x) : rate(g, x));
  const amt = (g, v) => fmtK(v) + (g.yu ? ' ' + g.yu : '');
  const sq = (v) => (v < 0 ? '(' + fmtN(v) + ')' : fmtN(v));
  // Where the slope readout passes through 0 between lo and hi, closed in on by halving.
  function zeroOf(g, lo, hi) {
    let a = lo, b = hi;
    const sa = Math.sign(rate(g, a));
    for (let j = 0; j < 60; j++) { const m = (a + b) / 2; if (Math.sign(rate(g, m)) === sa) a = m; else b = m; }
    return tidy(Math.round(b * 1e4) / 1e4);
  }
  const xT = zeroOf(ta, 0, 20), iT = zeroOf(pw, 0, 24), i24 = zeroOf(p24, 0, 8), xB = zeroOf(bx, 1, 10), xW = zeroOf(bw, 0, 6);
  const say = (s) => String(s == null ? '' : s).replace(/`/g, '').replace(/÷/g, ' divided by ').replace(/×/g, ' times ').replace(/−/g, ' minus ')
    .replace(/²/g, ' squared').replace(/³/g, ' cubed').replace(/Ω/g, ' ohms').replace(/\+/g, ' plus ').replace(/=/g, ' equals ').replace(/\s+/g, ' ').trim();
  const onGrid = (g, x) => tidy(Math.round(x / g.step) * g.step);
  const gridIn = (g, lo, hi) => { const s = g.step, out = []; for (let k = Math.ceil(lo / s - 1e-9); k <= Math.floor(hi / s + 1e-9); k++) out.push(tidy(k * s)); return out; };
  const uniq = (g, xs) => Array.from(new Set(xs.map((x) => onGrid(g, x)))).sort((a, b) => a - b);
  // Grid points P has visited, as stretches of neighbours (joined up between them).
  function runsOf(g, xs) {
    const out = [];
    uniq(g, xs).forEach((x) => { const r = out[out.length - 1]; if (r && x - r[1] <= g.step + 1e-9) r[1] = x; else out.push([x, x]); });
    return out;
  }

  // ---------- the working under each SHOW screen's graphs, at P ----------
  const top0 = (s, w) => (s === 0 ? w : '');
  const RA = {
    tape: (x) => { const s = rate(ta, x); return [{ s: 'P at `x` = ' + fmtN(x) + ' m: area ' + fmtN(x) + ' × ' + fmtN(20 - x) + ' = ' + amt(ta, ta.fn(x)), soft: true },
      { s: 'Slope 20 − 2 × ' + fmtN(x) + ' = ' + fmtN(s) + top0(s, ': the top'), big: true }]; },
    cup: (x) => { const s = rate(cu, x); return [{ s: 'P at `x` = ' + fmtN(x) + ': `y` = ' + fmtN(x * x) + ' − ' + fmtN(8 * x) + ' + 20 = ' + fmtN(cu.fn(x)), soft: true },
      { s: 'Slope 2 × ' + fmtN(x) + ' − 8 = ' + fmtN(s) + top0(s, ': the bottom'), big: true }]; },
    cube: (x) => { const s = rate(c3, x); return [{ s: 'P at `x` = ' + fmtN(x) + ': `y` = ' + fmtN(c3.fn(x)), soft: true },
      { s: 'Slope 3 × ' + sq(x) + '² = ' + fmtN(s) + top0(s, ', plus either side'), big: true }]; },
    power: (i) => { const s = rate(pw, i), V = pw.E - pw.r * i; return [{ s: 'At `I` = ' + fmtN(i) + ' A: `P` = ' + fmtN(12 * i) + ' − ' + fmtN(0.5 * i * i) + ' = ' + amt(pw, pw.fn(i)), soft: true },
      { s: 'Slope 12 − ' + fmtN(i) + ' = ' + fmtN(s) + top0(s, ': the top'), big: true },
      { s: s === 0 ? 'Load ' + fmtN(V) + ' V ÷ ' + fmtN(i) + ' A = ' + fmtN(V / i) + ' Ω, as inside' : 'Terminal voltage 12 − ' + fmtN(pw.r * i) + ' = ' + fmtN(V) + ' V', soft: true }]
      .concat(s === 0 ? [{ s: 'Either side: ' + fmtN(pw.fn(i - 8)) + ' W at ' + fmtN(i - 8) + ' A and at ' + fmtN(i + 8) + ' A', soft: true }] : []); },
    box: (x) => { const s = rate(bx, x), w = 30 - 2 * x, out = [{ s: 'P at `x` = ' + fmtN(x) + ' cm: ' + fmtN(x) + ' × ' + fmtN(w) + ' × ' + fmtN(w) + ' = ' + amt(bx, bx.fn(x)), soft: true },
      { s: 'Slope ' + fmtN(12 * x * x) + ' − ' + fmtN(240 * x) + ' + 900 = ' + fmtN(s) + (s === 0 ? (w > 0 ? ': the top' : ': no base') : ''), big: true }];
      if (s === 0) out.push({ s: 'Second derivative 24 × ' + fmtN(x) + ' − 240 = ' + fmtN(rate2(bx, x)), soft: true });
      if (s === 0 && w > 0) out.push({ s: 'Either side: ' + amt(bx, bx.fn(x - 1)) + ' at ' + fmtN(x - 1) + ' cm, ' + fmtK(bx.fn(x + 1)) + ' at ' + fmtN(x + 1) + ' cm', soft: true });
      return out; },
  };

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // A SHOW step sweeps P along the top graph (legs) while its slope drops a dot below at every x it
  // passes; flags name a place once P has passed it. A puzzle's o lists its answers: right, and each
  // slip with the working it shows (rows), where P goes (at) and what it draws (mark).
  const STEPS = [
    { show: true, name: 'Tape round a work area', g: 'tape', dur: 4.2, rows: 2, rowsAt: RA.tape,
      tour: { x0: 4, legs: [{ to: 16, t: 0.7, len: 3.0 }] },
      flags: [{ k: 1, x: xT, text: 'slope 0' }, { k: 0, x: xT, text: 'the top' }],
      text: 'Take 40 m of barrier tape, an example, round a rectangular work area. If one side is `x` metres, one side and the next together take half the tape, 20 m, so the other side is `20 − x` and the area is `A = 20x − x²` square metres. Its slope is `20 − 2x`: ' +
        fmtN(rate(ta, 4)) + ' at 4 m, ' + fmtN(rate(ta, 16)) + ' at 16 m. Where a curve turns over, at a *turning point*, its tangent lies level. Drag P over the top.' },
    { name: 'The largest area', g: 'tape', p: null, rows: 3, opts: ['zero', 'right', 'two'],
      task: 'The same tape. Set the slope `20 − 2x` to zero: which side `x` gives the largest area?',
      why: '`20 − 2x = 0` gives `2x = 20`, so `x` = ' + fmtN(xT) + ' m, the other side is `20 − 10 = 10` m too, and the area is `10 × 10 = ' + fmtN(ta.fn(xT)) + '` m², a square. Dropping the 2 gives `20 − x = 0` and 20 m; setting the area itself to zero gives 0 m. Both enclose nothing.',
      hint: 'Not quite. Solve `20 − 2x = 0`.',
      hints: { zero: 'Not quite. 0 m is where the area itself is 0. Set the slope to zero, not the area.', two: 'Not quite. Bring the power down: `x²` gives `2x`, so the slope is `20 − 2x`.' },
      pre: ['Slope `20 − 2x` = 0', 'So `x` = ?'],
      right: ['Slope `20 − 2x` = 0', '`2x` = 20, so `x` = ' + fmtN(xT) + ' m', 'Area 10 × 10 = ' + amt(ta, ta.fn(xT)) + ', a square'],
      o: {
        zero: { t: '0 m', at: 0, mark: { ring: 'no area: ' + amt(ta, ta.fn(0)), pts: [{ k: 1, x: 0, text: 'slope ' + fmtN(rate(ta, 0)) + ', not 0' }] }, rows: ['Setting the area to 0 gives `x` = 0 m', 'That is no area at all'] },
        right: { t: fmtN(xT) + ' m', at: xT, lab: 'slope 0' },
        two: { t: '20 m', at: 20, mark: { ring: 'no area: ' + amt(ta, ta.fn(20)), pts: [{ k: 1, x: 20, text: 'slope ' + fmtN(rate(ta, 20)) + ', not 0' }] }, rows: ['`20 − x = 0` drops the 2: `x` = 20 m', 'A strip with no width: ' + amt(ta, ta.fn(20))] },
      } },
    { show: true, name: 'A top or a bottom', g: 'cup', dur: 4.6, rows: 2, rowsAt: RA.cup,
      tour: { x0: 1, legs: [{ to: 7, t: 0.7, len: 2.2 }, { to: 4, t: 3.1, len: 1.0 }] },
      flags: [{ k: 1, x: 4, text: 'slope 0' }, { k: 0, x: 4, text: 'the bottom' }, { k: 1, x: 6, text: 'slope rising' }],
      text: 'On the tape, the dots below P fell steadily as it went across, from ' + fmtN(rate(ta, 4)) + ' at 4 m through 0 at 10 m to ' + fmtN(rate(ta, 16)) + ' at 16 m: 2 for each metre. That fall is the slope\'s own slope, the *second derivative*, which is ' + fmtN(rate2(ta, 10)) + '. So the slope runs from plus through zero to minus, and the flat point is a top, the *maximum*. On a cup, an example `y = x² − 8x + 20`, the slope `2x − 8` rises instead: ' +
        fmtN(rate(cu, 2)) + ' at 2, ' + fmtN(rate(cu, 4)) + ' at 4, ' + fmtN(rate(cu, 6)) + ' at 6. Its second derivative is ' + fmtN(rate2(cu, 4)) + ', plus, so the flat point is a bottom, the *minimum*.' },
    { name: 'A flat point at 2', g: 'hill', p: 2, near: 0.3, rows: 3, opts: ['right', 'bottom', 'neither'],
      task: 'An example rule, `y = 12x − 3x²`, has slope `12 − 6x`. That is 0 at `x` = 2, where `y = 24 − 12 = ' + fmtN(hl.fn(2)) + '`, and its second derivative is ' + fmtN(rate2(hl, 2)) + '. What is the flat point?',
      why: 'The slope `12 − 6x` falls 6 for each 1 across: its second derivative is ' + fmtN(rate2(hl, 2)) + ', so the slope runs from plus through zero to minus, and the flat point is a top, the largest `y`, ' + fmtN(hl.fn(2)) + '. A bottom needs the slope rising through zero; neither needs it to stay plus, or stay minus, either side.',
      hint: 'Not quite. Is the slope rising or falling as it passes 0?',
      hints: { bottom: 'Not quite. A bottom has a plus second derivative. This one is ' + fmtN(rate2(hl, 2)) + '.', neither: 'Not quite. The slope is ' + fmtN(rate(hl, 1)) + ' before 2 and ' + fmtN(rate(hl, 3)) + ' after it: it changes from plus to minus.' },
      pre: ['Flat at `x` = 2, `y` = ' + fmtN(hl.fn(2)), 'Second derivative ' + fmtN(rate2(hl, 2)), 'The flat point is ?'],
      right: ['Flat at `x` = 2, `y` = ' + fmtN(hl.fn(2)), 'Second derivative ' + fmtN(rate2(hl, 2)) + ': the slope falls', 'A top: the largest `y`, ' + fmtN(hl.fn(2))],
      o: {
        right: { t: 'A top', all: true, lab: 'falling through 0' },
        bottom: { t: 'A bottom', mark: { line: { k: 1, fn: (x) => 6 * x - 12, text: 'a bottom needs this', at: [3.3, 10, 'end'] } }, rows: ['A bottom needs the slope rising', 'Here it falls 6 for each 1 across'] },
        neither: { t: 'Neither', mark: { pts: [{ k: 1, x: 1, text: 'slope ' + fmtN(rate(hl, 1)) + ' before' }, { k: 1, x: 3, text: 'slope ' + fmtN(rate(hl, 3)) + ' after' }] }, rows: ['The slope goes from plus to minus', 'So the curve turns over at 2'] },
      } },
    { show: true, name: 'Flat, but not a turn', g: 'cube', dur: 4.5, rows: 2, rowsAt: RA.cube,
      tour: { x0: -2, legs: [{ to: 2, t: 0.7, len: 2.2 }, { to: 0, t: 3.1, len: 0.9 }] },
      flags: [{ k: 1, x: 0, text: 'touches 0' }, { k: 0, x: 0, text: 'level, still climbing' }],
      text: 'A zero slope is a candidate, not a guarantee. `y = x³` climbs, is level for an instant at `x` = 0, then climbs again. Its slope, `3x²`, is ' + fmtN(rate(c3, -1)) + ' at −1, ' + fmtN(rate(c3, 0)) + ' at 0 and ' + fmtN(rate(c3, 1)) +
        ' at 1: plus on both sides, so the dots below touch the axis without crossing it. Its second derivative, `6x`, is ' + fmtN(rate2(c3, 0)) + ' there too, so that test cannot decide: look at the slope either side.' },
    { name: 'A flat point at 1', g: 'flat3', p: 1, near: 0.15, rows: 3, opts: ['top', 'bottom', 'right'],
      task: 'An example rule, `y = x³ − 3x² + 3x`, is flat at `x` = 1. Its slope is ' + fmtN(rate(f3, 0)) + ' at `x` = 0 and ' + fmtN(rate(f3, 2)) + ' at `x` = 2, and its heights at 0, 1 and 2 are ' + [0, 1, 2].map((x) => fmtN(f3.fn(x))).join(', ').replace(/, (\d+)$/, ' and $1') + '. What is the flat point?',
      why: 'The slope is plus at 0, 0 at 1 and plus again at 2: it touches zero without crossing, so the curve climbs, is level for an instant, then climbs on, like `y = x³`. Flat, but neither a top nor a bottom: its heights ' + [0, 1, 2].map((x) => fmtN(f3.fn(x))).join(', ') + ' keep rising.',
      hint: 'Not quite. Look at the slope just either side of 1.',
      hints: { top: 'Not quite. After 1 it keeps climbing: ' + fmtN(f3.fn(2)) + ' at `x` = 2 is higher.', bottom: 'Not quite. Before 1 it was lower: ' + fmtN(f3.fn(0)) + ' at `x` = 0.' },

  }
  // Labels wait in LQ and are placed last (K.labels), clear of every line, shape and label drawn.

  // ---------- the linked graphs: the rule on top, its slope below, one x across ----------
  const PL = 52, PR = 318;

  function panes(g) {

  function curveD(g, lo, hi) {

  // The stretch of a straight line through (x0, y0) with slope m that lies inside the top graph.

  // P on the top graph, with its name.
  function drawP(g, x, a, halo) {
    const px = X(g, x), py = Yk(g, 0, g.fn(x));
    REC.P = [px, py]; REC.p = x;
    if (a <= 0) return;
    part(a, 0, () => { if (halo) AV.push(circle('halo', px, py, 13)); AV.push(circle('pt', px, py, 7)); });
    queue(a, [{ x: px - 10, y: py - 10, text: 'P', anchor: 'end' }]);
  }
  // The tangent at P: the line through P with the slope the chords settle on.
  function drawTangent(g, x, a) {
    if (a <= 0) return;

    if (!s) return;
    const c = { x1: X(g, s[0][0]), y1: Yk(g, 0, s[0][1]), x2: X(g, s[1][0]), y2: Yk(g, 0, s[1][1]) };
    part(a, 0, () => AV.push(line('tan', c.x1, c.y1, c.x2, c.y2)));

    KEY.push({ cls: 'tan', text: 'tangent', a });
  }
  // The dotted drop from P to the graph below (to its foot while the answer is still a question),
  // broken between the graphs where their numbers and names sit. grow: how far it has dropped.
  function drawGuide(g, x, v, grow, a) {
    if (grow <= 0 || a <= 0) return;
    const PS = panes(g), px = X(g, x), segs = [];
    const y0 = Yk(g, 0, g.fn(x)) + 10, y1 = PS[0].B, y2 = PS[1].T, y3 = v == null ? PS[1].B : Yk(g, 1, v) - 8;
    if (y1 > y0) segs.push([y0, y1]);

    part(a, 0, () => segs.forEach((q) => { if (left <= 0) return; const L = Math.min(left, q[1] - q[0]); AV.push(line('drop', px, q[0], px, q[0] + L)); left -= L; }));
  }
  // The trail below: a line through the slope over each stretch P has covered, and a dot at each grid
  // point, every height worked out from the rule.
  function drawTrail(g, runs, xs, a, r) {
    if (a <= 0) return;
    part(a, 0, () => {
      runs.forEach((rn) => {
        const lo = rn[0], hi = rn[1];
        if (!(hi > lo)) return;
        const n = Math.max(2, Math.ceil((hi - lo) / (g.x[1] - g.x[0]) * 80));
        let s = '';
        for (let j = 0; j <= n; j++) { const x = lo + (hi - lo) * j / n; s += (j ? ' L' : 'M') + r3(X(g, x)) + ' ' + r3(Yk(g, 1, rate(g, x))); }
        AV.push(path('dline', s));
      });
      xs.forEach((x) => {
        const v = rate(g, x);
        if (!inR(g, 1, v)) return;
        const px = X(g, x), py = Yk(g, 1, v);
        AV.push(circle('dot', px, py, r || 3.5));
        REC.dots.push({ k: 1, x, px, py });
      });
    });
    KEY.push({ cls: 'trail', text: 'slope', a });
  }
  // The dot P is dropping now, straight below it.
  function drawLive(g, x, a) {
    if (a <= 0) return;
    const v = rate(g, x);
    if (!inR(g, 1, v)) return;
    const px = X(g, x), py = Yk(g, 1, v);
    part(a, 0, () => AV.push(circle('dot now', px, py, 6)));
    REC.live.push({ k: 1, x, px, py });
    KEY.push({ cls: 'trail', text: 'slope', a });
  }
  // Where a label for a point on graph k goes: above or below it, right or left, inside its own graph
  // and clear of the zero line.
  function spot(g, k, x, v, s) {
    const P = panes(g)[k], px = X(g, x), py = Yk(g, k, v), w = tw(s, 'lab') + 2;
    const zy = P.r[0] < 0 && P.r[1] > 0 ? Yk(g, k, 0) : null;
    const ok = (x0, b) => {
      const top = b - 11, bot = b + 3;
      if (x0 < PL + 2 || x0 + w > PR + 14 || bot > P.B - 2 || top < P.T + 1) return false;
      return !(zy != null && top < zy + 3 && bot > zy - 3);
    };
    const cands = [[px + 10, py - 9, 'start'], [px - 10, py - 9, 'end'], [px + 10, py + 19, 'start'], [px - 10, py + 19, 'end'], [px + 12, py - 22, 'start'], [px - 12, py - 22, 'end']];
    for (const c of cands) if (ok(c[2] === 'end' ? c[0] - w : c[0], c[1])) return c;
    return cands[0];
  }
  function valLabel(g, x, a, s) {
    if (a <= 0) return;
    const v = rate(g, x);
    s = s || fmtN(v);
    if (!inR(g, 1, v)) return;
    const c = spot(g, 1, x, v, s);
    queue(a, [{ x: c[0], y: c[1], text: s, anchor: c[2] }]);
  }
  function flag(g, f, a) {
    const v = val(g, f.k, f.x), c = f.c ? [X(g, f.x) + f.c[0], Yk(g, f.k, v) + f.c[1], f.c[2]] : spot(g, f.k, f.x, v, f.text);   // c: a set place, clear of a crowded corner
    queue(a, [{ x: c[0], y: c[1], text: f.text, anchor: c[2] }]);
  }
  // The key, on its own line under the graphs.
  function drawKey(y) {
    const seen = {}, list = [];
    KEY.forEach((k) => { if (k.a <= 0) return; if (seen[k.cls]) { seen[k.cls].a = Math.max(seen[k.cls].a, k.a); return; } seen[k.cls] = Object.assign({}, k); list.push(seen[k.cls]); });
    const order = ['tan', 'trail'];
    list.sort((a, b) => order.indexOf(a.cls) - order.indexOf(b.cls));
    let x = 12;
    list.forEach((k) => {
      const x0 = x;
      part(k.a, 0, () => {
        if (k.cls === 'trail') { line('dline', x0, y - 4.5, x0 + 22, y - 4.5); circle('dot', x0 + 11, y - 4.5, 3.5); } else line(k.cls, x0, y - 4.5, x0 + 22, y - 4.5);
        text(x0 + 28, y, k.text, 'key', 'start');
      });
      x += 28 + tw(k.text, 'key') + 18;
    });
  }
  // ---------- the working under the drawing, one line each ----------
  function drawRows(G, RW) {
    RW.forEach((r, n) => {
      const a = r.a != null ? r.a : vis(r.t);
      part(a, 4, () => fit(text(12, G.rowsY + 18 + 26 * n, r.s, 'row' + (r.big ? ' big' : '') + (r.soft ? ' soft' : '') + (r.bad ? ' bad' : ''), 'start'), 316, 15));
      if (a >= 0.5) REC.rows.push(r.s);
      if (r.bad && a > 0) REC.bad++;
    });
  }

  // ---------- the SHOW screens ----------
  // P sweeps along the top graph, its tangent riding with it, and its slope drops a dot straight below
  // at every grid point it passes. Once Dan drags P the sweep gives way to his trail.
  const tourEnd = (d) => (d.tour.legs.length ? d.tour.legs[d.tour.legs.length - 1].to : d.tour.x0);
  function finalTrail(d) {
    const ends = [d.tour.x0].concat(d.tour.legs.map((Lg) => Lg.to));
    return gridIn(GR[d.g], Math.min.apply(null, ends), Math.max.apply(null, ends));
  }
  // When the sweep first carries P past x (null if it never does).
  function tPass(d, fx) {
    let a = d.tour.x0;
    if (Math.abs(fx - a) < 1e-9) return 0.4;
    for (const Lg of d.tour.legs) {
      const b = Lg.to;
      if (a !== b && (fx - a) * (fx - b) <= 0) {
        const want = (fx - a) / (b - a);
        let lo = 0, hi = 1;
        for (let j = 0; j < 40; j++) { const m = (lo + hi) / 2; if (K.ease(m) < want) lo = m; else hi = m; }
        return Lg.t + hi * Lg.len;
      }
      a = b;
    }
    return null;
  }
  function drawTour(d, st, G, RW) {
    const g = G.g, tr = d.tour, own = st.p != null, pa = own ? 1 : vis(0.4);
    let x = tr.x0, rx = x, la = 1, lo = x, hi = x;
    if (own) {
      x = st.p; rx = x;
      drawTrail(g, runsOf(g, st.seen), st.seen, 1);
    } else {
      for (let n = 0; n < tr.legs.length; n++) {
        const Lg = tr.legs[n];
        if (T < Lg.t) break;
        if (T < Lg.t + Lg.len) { la = 1 - K.arrive(T, Lg.t, 0.3); x = K.lerp(x, Lg.to, K.ease((T - Lg.t) / Lg.len)); break; }
        x = Lg.to; rx = x; la = arr(Lg.t + Lg.len, 0.5);
        lo = Math.min(lo, x); hi = Math.max(hi, x);
      }
      lo = Math.min(lo, x); hi = Math.max(hi, x);
      drawTrail(g, [[lo, hi]], gridIn(g, lo, hi), pa);
    }
    drawGuide(g, x, rate(g, x), pa, 1);
    drawLive(g, x, pa);
    const lb = own ? 1 : Math.min(la, pa), fl = d.flags || [];
    fl.forEach((f) => {
      let fa = 0;
      if (own) fa = st.seen.some((s) => Math.abs(s - f.x) < 1e-9) ? 1 : 0;
      else { const tp = tPass(d, f.x); fa = tp == null ? 0 : arr(tp, 0.5); }
      if (fa > 0) flag(g, f, fa);
    });
    if (lb > 0 && !fl.some((f) => f.k === 1 && Math.abs(f.x - rx) < 1e-9)) valLabel(g, rx, lb);
    drawTangent(g, x, 1);
    drawP(g, x, 1, !finished);
    d.rowsAt(rx).forEach((r) => RW.push({ s: r.s, big: r.big, soft: r.soft, a: own ? 1 : la }));
    return [[X(g, x), Yk(g, 0, g.fn(x)), x]];
  }

  // ---------- the puzzles ----------
  // Before Check the working ends in a question mark and P's drop ends in "?"; after it, the answer
  // (the level tangent and P's dot on the zero line), or the slip drawn in red.
  function puzzleRows(d, k, o, RW) {
    if (!k) d.pre.forEach((s, n) => RW.push({ s, soft: n < d.pre.length - 1 }));
    else if (k === 'right') d.right.forEach((s, n) => RW.push(n === 0 ? { s, soft: true } : { s, big: n === d.right.length - 1, t: 0.2 + 0.2 * n }));
    else { RW.push({ s: d.pre[0], soft: true }); o.rows.forEach((s, n) => RW.push({ s, bad: true, soft: n === 1, t: 0.2 + 0.2 * n })); }
  }
  function drawRedLine(g, k, fn, a, txt, pos) {
    let s = '', on = false;
    K.linspace(g.x[0], g.x[1], 81).forEach((x) => { const v = fn(x); if (inR(g, k, v)) { s += (on ? ' L' : ' M') + r3(X(g, x)) + ' ' + r3(Yk(g, k, v)); on = true; } else on = false; });
    part(a, 0, () => AV.push(path('dline bad', s.trim())));
    queue(a, [{ x: X(g, pos[0]), y: Yk(g, k, pos[1]), text: txt, anchor: pos[2] || 'middle', cls: 'bad' }]);
  }
  function drawSlipG(g, p, mk, a) {
    const px = X(g, p), py = Yk(g, 0, g.fn(p)), right = px > 200;
    if (mk.ring) {   // a red ring round P where the slip lands
      part(a, 0, () => AV.push(circle('ring', px, py, 12)));
      queue(a, [right ? { x: px - 18, y: py - 14, text: mk.ring, anchor: 'end', cls: 'bad' } : { x: px + 18, y: py - 14, text: mk.ring, anchor: 'start', cls: 'bad' }]);
      REC.bad++;
    }
    if (mk.tan) drawTangent(g, p, a);
    if (mk.note) { queue(a, [right ? { x: px - 14, y: py - 20, text: mk.note, anchor: 'end', cls: 'bad' } : { x: px + 14, y: py - 20, text: mk.note, anchor: 'start', cls: 'bad' }]); REC.bad++; }
    (mk.pts || []).forEach((q) => {   // red dots at the values the slip reads
      const v = q.v != null ? q.v : val(g, q.k, q.x), qx = X(g, q.x), qy = Yk(g, q.k, v), c = spot(g, q.k, q.x, v, q.text);
      part(a, 0, () => AV.push(circle('dot bad', qx, qy, 6)));
      queue(a, [{ x: c[0], y: c[1], text: q.text, anchor: c[2], cls: 'bad' }]);
      REC.bad++;
    });
    if (mk.line) { drawRedLine(g, mk.line.k, mk.line.fn, a, mk.line.text, mk.line.at); REC.bad++; }
  }
  function drawPuzzleG(d, st, G, RW) {
    const g = G.g, k = st.res === 'right' ? 'right' : st.res === 'wrong' ? st.pick : null, a = arr(0.1), o = k ? d.o[k] : null, kn = d.known || {};
    const p = o && o.at != null ? o.at : d.p;
    if (kn.dots) { drawTrail(g, [], kn.dots, 1, 5); kn.dots.forEach((x) => valLabel(g, x, 1)); }

      drawTangent(g, p, a);

  }

  // ---------- each step's sizes ----------
  const GEO = new Map();
  function geo(d) {
    if (GEO.has(d)) return GEO.get(d);
    const g = GR[d.g], rowsY = panes(g)[1].B + 62, G = { g, rowsY, H: Math.ceil(rowsY + 26 * d.rows + 12) };
    GEO.set(d, G);
    return G;
  }
  // The step's picture: the graphs, then what this screen shows on them, then the key and the working.

    const RW = [], g = G.g, PS = panes(g), foot = PS[1].B + 36;
    REC = { rows: [], labs: [], bad: 0, dots: [], live: [], tan: null, P: null, p: null, G };
    AV = []; LQ = []; KEY = [];
    fit(text(12, 20, g.who, 'tag', 'start'), 318, 15);

    // A flat-point puzzle shows only a short stretch near P until Check, so its shape cannot give the answer away.

    AV.push(path('curve', near ? curveD(g, d.p - d.near, d.p + d.near) : curveD(g)));

  }

  // ---------- dragging P along the top graph (the SHOW screens) ----------
  // P lands on the graph's grid inside the axes, and leaves a dot at every grid point it passes.
  const snapP = (g, v) => tidy(K.clamp(Math.round(v / g.step) * g.step, g.x[0], g.x[1]));

  const curP = () => { const d = STEPS[at()], st = S[at()]; return st.p != null ? st.p : tourEnd(d); };
  function setP(v) {
    const i = at(), d = STEPS[i], st = S[i], g = GR[d.g], n = snapP(g, v);
    if (st.p === n && T === Infinity) return;
    if (anim.playing()) anim.pause();
    const from = curP();
    st.seen = uniq(g, (st.seen || finalTrail(d)).concat(gridIn(g, Math.min(from, n), Math.max(from, n))));
    T = Infinity; st.p = n;

  }
  function svgPoint(e) {
    const ctm = svg.getScreenCTM();
    return ctm ? new DOMPoint(e.clientX, e.clientY).matrixTransform(ctm.inverse()) : null;
  }
  let held = null;
  const grip = ui.appendChild(K.svg('circle', { class: 'grip', cx: 0, cy: 0, r: 22, tabindex: -1, role: 'slider', 'aria-orientation': 'horizontal', 'aria-label': 'Point P' }));

  grip.addEventListener('pointercancel', letGo);

    if (!dragOn()) return;

    setP(curP() + GR[STEPS[at()].g].step * by);
  });
  function placeGrip(d, list) {
    if (checking) return;
    const on = !!d.show && !finished && list.length > 0;
    grip.style.display = on ? '' : 'none';
    grip.setAttribute('tabindex', on ? '0' : '-1');
    if (!on) return;
    const g = GR[d.g];

    grip.setAttribute('aria-valuemin', g.x[0]); grip.setAttribute('aria-valuemax', g.x[1]); grip.setAttribute('aria-valuenow', list[0][2]);

  }

  // The scene for a step (the animation calls this every frame).
  function paint(i) {
    if (i == null) i = at();
    const d = STEPS[i], st = S[i], G = geo(d);
    art.textContent = '';
    into = null;
    svg.setAttribute('viewBox', '0 0 340 ' + G.H);
    svg.setAttribute('aria-label', drawScene(d, st, G));
  }

  const el = (id) => document.getElementById(id);
  write(el('finish'), FINISH);
  K.update((p) => {
    const i = Math.round(p.step), d = STEPS[i], st = S[i];
    if (!anim.playing()) T = Infinity;   // motion that was stopped (the page hidden, a test) shows finished
    if (i !== lastStep) {
      lastStep = i; enter('stepbox');
      if (d.show) { st.p = null; st.seen = null; play(d.dur); } else { anim.pause(); T = Infinity; }
    }
    if (finished !== lastDone) { lastDone = finished; enter(finished ? 'done' : 'stepbox'); }
    const right = st.res === 'right';
    el('stepbox').hidden = finished;
    el('done').hidden = !finished;
    el('count').textContent = 'Step ' + (i + 1) + ' of ' + STEPS.length;
    const task = el('task');
    task.className = 'task' + (d.show ? ' show' : '');
    write(task, d.show ? d.text : d.task);
    paint(i);

    replayBtn.el.hidden = !d.show || REDUCE;
    el('replay').hidden = replayBtn.el.hidden;

      b.el.hidden = k >= opts.length;

      b.setLabel(labs[k]);
      b.el.textContent = '';
      b.el.appendChild(K.el('span', {}, labs[k]));
      b.el.setAttribute('aria-label', say(labs[k]));
      b.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });

    el('acts').hidden = !!d.show;
    checkBtn.el.hidden = right;
    const fb = el('fb');
    fb.hidden = !!d.show;
    fb.className = 'fb' + (right ? ' right' : st.res === 'wrong' ? ' wrong' : '');
    write(fb, d.show ? '' : right ? 'That\'s it.' : st.res === 'wrong' ? hintFor(i, st) : st.res === 'empty' ? 'Tap one of the answers.' : '');

    const why = el('why');
    why.hidden = d.show || !st.why;
    write(why, d.show ? '' : d.why);
    whyBtn.setLabel(st.why ? 'Hide why' : 'Why?');

    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !right);
    nextBtn.setLabel(i === STEPS.length - 1 ? 'Finish' : 'Continue');
    nav.hidden = backBtn.el.hidden && nextBtn.el.hidden;
  });

  // ---------- known answers, worked out by hand ----------
  const DO = STEPS.map((d, i) => i).filter((i) => !STEPS[i].show);
  const solvedSt = () => Object.assign(blank(), { pick: 'right', res: 'right' });
  const wrongSt = (o) => Object.assign(blank(), { pick: o, res: 'wrong' });
  const close = (a, b, tol) => typeof a === 'number' && typeof b === 'number' && Math.abs(a - b) <= (tol || 1e-9) * Math.max(1, Math.abs(a), Math.abs(b));
  const idx = (name) => STEPS.findIndex((d) => d.name === name);
  // A height on graph k, and a line's slope on the top graph, read back through the axes.
  const readV = (g, k, py) => { const P = panes(g)[k]; return P.r[0] + (P.B - py) / P.H * (P.r[1] - P.r[0]); };
  const tanSlope = (c, g) => { const P = panes(g)[0]; return (-(c.y2 - c.y1) / P.H * (P.r[1] - P.r[0])) / ((c.x2 - c.x1) / (PR - PL) * (g.x[1] - g.x[0])); };
