<p class="caption">To change area units, square the step between lengths. The sizes are example values, except Nexans's conductor sizes.</p>

<script>
  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // demo: what a SHOW step plays (dur seconds); grip: what Dan can move once it has played (the big
  // square's corner along its diagonal, or the big triangle's corner along its base). A 'pick' puzzle
  // takes one answer, its picture `pic`; the 'drag' puzzle asks for the big square's corner to be put
  // where its area is `times` the small one's. fb: how long the motion after a right answer plays; at:
  // when each part of it arrives, in seconds after Check ([start, gap, count] for parts counted one at
  // a time). slips: which slip gives each wrong answer, and hints: what is said for it.
  const PICK = 'Tap one of the answers.', PLACE = 'Drag the corner to its place first.';
  // After a right answer. MMFILL: the plate's millimetre lines and its sides in mm; one cm² tinted and
  // named; the sum. CMFILL: one m² split and named; one 10 cm square of it
  // named, 100 cm²; the sides in cm; the sum. COPIES: the copies of the
  // small square numbered one at a time; the sum. TRIROWS: the copies of the small plate, a row at a
  // time; the sum. QUARTER: the other three 25 mm² blocks and the cm² named; the sum. MILLION: a 100 mm
  // square named; the square tinted from the bottom up; the sum. BARCM: the cm lines and the sides in
  // cm; the sum.
  const MMFILL = { mm: 0.1, one: 0.6, ro: 1.1 };
  const CMFILL = { block: 0.1, cell: 0.6, sides: 1.1, ro: 1.6 };
  const COPIES = { cp: [0.1, 0.2, 4], ro: 1.2 };
  const TRIROWS = { row: [0.1, 0.5, 3], ro: 1.6 };
  const QUARTER = { whole: 0.1, ro: 0.6 };
  const MILLION = { block: 0.1, rise: 0.6, ro: 1.5 };
  const BARCM = { cm: 0.1, ro: 0.6 };
  // After a wrong answer: the slip, in the warning colour.
  const WRONG = { slip: 0.1 }, WRONG_DUR = 0.7;
  // How long a counted part takes to arrive, a shape to grow, the row of cm squares to run along, the
  // rows to rise (in mm, cm, and after the million answer), the turned copy to turn, and the tint to
  // step from one cable size to the next.
  const COUNT = 0.3, SIDE_T = 0.5, GROW = 0.6, STRIP_T = 0.8, RISE_MM = 0.7, RISE_M = 1.2, RISE_MIL = 0.8, TURN_T = 0.8, SIZE_T = 0.3;

  // The units: 10 mm in a cm, 100 cm in a m, 1,000 mm in a m. An area unit's factor is the length's squared.
  const MM_PER_CM = 10, CM_PER_M = 100, MM_PER_M = 1000;
  // The 1 m square's grid lines are every 10 cm: each square of it is 10 cm × 10 cm = 100 cm².
  const CELL = 10;
  const sq = (f) => f * f;
  const CM2MM = sq(MM_PER_CM), M2CM = sq(CM_PER_M), M2MM = sq(MM_PER_M);
  // The shapes, all example sizes: the rating plate in cm (2); the floor in m (4); the small square, 10 cm
  // a side, made 1 to 4 times as long (5, 6); the small triangle in picture units, made 1 to 3 times as
  // long (7, 8), and the 600 cm² plate tripled (8); the conductor (10); the copper bar in mm (12).
  const PLATE = { w: 5, h: 4 }, FLOOR = { w: 3, h: 2 }, TILE = 10, KMAX = 4, TRI_KMAX = 3;
  const TRI = { b: 84, a: 28, h: 64 }, PLATE3 = { area: 600, k: 3 }, COND = 25, BAR = { w: 30, t: 5 };
  // Nexans's conductor cross-sections, in mm² (Nexans, 2-core XLPE cables as per IEC 60502-1).
  const SZ = [1.5, 2.5, 4, 6, 10, 16, 25, 35];

  const STEPS = [
    { show: true, demo: 'mm', dur: 4.2, name: 'Square millimetres',
      text: 'A 1 cm square is 10 mm each way. It holds 10 rows of 10 *square millimetres*, so 1 cm² is 100 mm², not 10.' },
    { kind: 'pick', pic: 'plate', opts: ['2,000 mm²', '200 mm²', '0.2 mm²'], want: '2,000 mm²', slips: { '200 mm²': 'ten', '0.2 mm²': 'divide' }, fb: 1.7, at: MMFILL, name: 'cm² to mm²',
      task: 'A rating plate is 5 cm by 4 cm, so it covers 20 cm². How many mm² is that?',
      why: 'Each cm² holds 10 × 10 = 100 mm², so 20 cm² is 20 × 100 = 2,000 mm². In mm the plate is 50 mm by 40 mm, and 50 × 40 = 2,000 mm² too.',
      hint: 'Not quite. How many mm² fit in each cm²?',
      hints: { '200 mm²': 'Not quite. That multiplies by 10, as for a length. Each cm² holds 10 rows of 10, which is 100 mm².',
        '0.2 mm²': 'Not quite. That divides, but mm² are smaller, so it takes more of them. Multiply by 100.' } },
    { show: true, demo: 'm', dur: 4.1, name: 'Square metres',
      text: 'A 1 m square is 100 cm each way. One row of 1 cm squares along the bottom is only 100 cm². With 100 rows, 1 m² is 10,000 cm².' },
    { kind: 'pick', pic: 'floor', opts: ['60,000 cm²', '600 cm²', '6,000 cm²'], want: '60,000 cm²', slips: { '600 cm²': 'hundred', '6,000 cm²': 'thousand' }, fb: 2.2, at: CMFILL, name: 'm² to cm²',
      task: 'A switch room floor is 3 m by 2 m, so it covers 6 m². How many cm² is that?',
      why: 'Each m² is 100 × 100 = 10,000 cm², so 6 m² is 6 × 10,000 = 60,000 cm². In cm the floor is 300 cm by 200 cm, and 300 × 200 = 60,000 cm² too.',
      hint: 'Not quite. How many cm² fit in each m²?',
      hints: { '600 cm²': 'Not quite. That multiplies by 100, as for a length. Each m² is 100 rows of 100, which is 10,000 cm².',
        '6,000 cm²': 'Not quite. That multiplies by 1,000, but there are no thousands here. A 1 m square is 100 cm by 100 cm, so each m² is 100 × 100 = 10,000 cm².' } },
    { show: true, demo: 'scale', dur: 3.1, grip: 'diag', name: 'Twice the sides',
      text: 'Double each side of a 10 cm square and 4 copies fit inside. The *scale factor* is 2, and the area goes up 2 × 2 = 4 times.' },
    { kind: 'drag', pic: 'four', times: 4, start: 1, to: 2, want: '20 cm × 20 cm', slips: { '40 cm × 40 cm': 'side' }, fb: 1.8, at: COPIES, name: 'Four times the area',
      task: 'Drag the corner to draw a square with 4 times the area of the shaded 10 cm square.',
      why: 'Twice the side fits 2 × 2 = 4 copies, so the square is 20 cm by 20 cm, 400 cm². Four times the side would fit 4 × 4 = 16 copies.',
      hint: 'Not quite. Count how many 10 cm squares fit inside. You want 4.',
      hints: { '40 cm × 40 cm': 'Not quite. Four times the side fits 4 × 4 = 16 copies, 16 times the area. Which side fits 4?' } },
    { show: true, demo: 'tri', dur: 3.8, grip: 'base', name: 'Any shape',
      text: 'Any shape made twice as long every way covers 4 times the area. A triangle holds 4 copies, one turned round. A round wire twice as wide has 4 times the *cross-section*.' },
    { kind: 'pick', pic: 'tri3', opts: ['5,400 cm²', '1,800 cm²', '3,600 cm²'], want: '5,400 cm²', slips: { '1,800 cm²': 'times', '3,600 cm²': 'add' }, fb: 2.2, at: TRIROWS, name: 'Three times the sides',
      task: 'A triangular plate covers 600 cm². What does a plate the same shape cover with every side 3 times as long?',
      why: 'Every side is 3 times as long, so 3 × 3 = 9 copies of the small plate fit inside. 9 × 600 = 5,400 cm².',
      hint: 'Not quite. How many copies of the small plate fit inside?',
      hints: { '1,800 cm²': 'Not quite. That makes the area only 3 times as much. Each side is 3 times as long, so the area is 3 × 3 = 9 times.',
        '3,600 cm²': 'Not quite. That multiplies by 3 + 3 = 6. The sides grow 3 times in both directions, so the area grows 3 × 3 = 9 times.' } },
    { show: true, demo: 'cable', dur: 4.2, name: 'Cable sizes are areas',
      text: 'Cable sizes are areas. Nexans lists 1.5 mm² to 35 mm², sizes set by IEC 60228. A 35 mm² size means an area of 35 of these 1 mm squares.' },
    { kind: 'pick', pic: 'c25', opts: ['0.25 cm²', '2.5 cm²', '2,500 cm²'], want: '0.25 cm²', slips: { '2.5 cm²': 'ten', '2,500 cm²': 'times' }, fb: 1.2, at: QUARTER, name: 'mm² to cm²',
      task: 'A conductor\'s cross-section is 25 mm². How many cm² is that?',
      why: '1 cm² is 100 mm², so 25 mm² is 25 ÷ 100 = 0.25 cm², a quarter of the 1 cm square.',
      hint: 'Not quite. How many mm² make 1 cm²?',
      hints: { '2.5 cm²': 'Not quite. That divides by 10, as for a length. 1 cm² is 100 mm², so divide by 100.',
        '2,500 cm²': 'Not quite. That multiplies, but cm² are bigger, so it takes fewer of them. Divide by 100.' } },
    { kind: 'pick', pic: 'mil', opts: ['1,000,000 mm²', '1,000 mm²', '10,000 mm²'], want: '1,000,000 mm²', slips: { '1,000 mm²': 'row', '10,000 mm²': 'cm' }, fb: 2.1, at: MILLION, name: 'm² to mm²',
      task: '1 m is 1,000 mm. How many mm² make 1 m²?',
      why: 'A 1 m square is 1,000 mm each way, so it holds 1,000 rows of 1,000 square millimetres. That is 1,000 × 1,000 = 1,000,000 mm².',
      hint: 'Not quite. Picture the 1 m square in rows of 1 mm squares. How many rows, and how many in each?',
      hints: { '1,000 mm²': 'Not quite. That is one row along the bottom, 1 mm tall. The 1 m square holds 1,000 rows of 1,000.',
        '10,000 mm²': 'Not quite. 10,000 is how many cm² make 1 m². In mm each side is 1,000, so 1,000 × 1,000.' } },
    { kind: 'pick', pic: 'bar', opts: ['1.5 cm²', '15 cm²', '150 cm²'], want: '1.5 cm²', slips: { '15 cm²': 'ten', '150 cm²': 'mm' }, fb: 1.2, at: BARCM, name: 'A copper bar',
      task: 'A flat copper bar is 30 mm wide and 5 mm thick. What is its cross-section in cm²?',
      why: '30 × 5 = 150 mm², and 150 ÷ 100 = 1.5 cm². In cm the bar is 3 cm by 0.5 cm, and 3 × 0.5 = 1.5 cm² too.',
      hint: 'Not quite. Work out the mm² first, then change to cm².',
      hints: { '15 cm²': 'Not quite. That divides 150 mm² by 10, as for a length. Each cm² is 100 mm², so divide by 100.',
        '150 cm²': 'Not quite. 30 × 5 = 150 is in mm², because the sides are in mm. Divide by 100 for cm².' } },
  ];
  const FINISH = 'To change area units, square the step between lengths. 1 cm² is 10 × 10 = 100 mm², and 1 m² is 100 × 100 = 10,000 cm², not 100. Make a shape twice as long every way, keeping its shape, and its area is 4 times as much.';
  // When each demonstration's parts arrive, in seconds after the screen opens (the screen itself takes
  // FADE to fade in, so nothing starts before it has settled); [start, gap, count] for parts counted one
  // at a time. mm: the bottom row's squares one at a time; the other rows rise; the sum. m: the row of
  // cm squares runs along the bottom; it is named; the rows rise; one 10 cm square of the grid is named;
  // the sum. scale: the big square grows
  // to twice the side; the new copies one at a time; the sum. tri: the big triangle grows to twice the
  // sides; two copies one at a time; the third turns round into place; the sum. cable: the tint steps
  // through Nexans's sizes one at a time; the last in cm².
  const FADE = 0.35;
  const AT = {
    mm: { sq: [0.6, 0.2, 10], rise: 2.85, sum: 3.6 },
    m: { strip: 0.6, label: 1.6, rise: 2.1, cell: 2.9, sum: 3.5 },
    scale: { grow: 0.6, cp: [1.4, 0.25, 3], sum: 2.45 },
    tri: { grow: 0.6, cp: [1.4, 0.3, 2], turn: 2.2, sum: 3.2 },
    cable: { size: [0.6, 0.35, 8], sum: 3.6 },
  };
  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  // While the kit's self-test looks at every screen it switches fades off (the k-testing class):
  // demonstrations then open finished, as they do with reduced motion.
  const testing = () => document.documentElement.classList.contains('k-testing');

  // ---------- numbers (pure, so the checks can test them) ----------
  const r3 = (v) => Math.round(v * 1000) / 1000;
  const num = (v) => { const a = r3(v), p = String(Math.abs(a)).split('.'); return (a < 0 ? '−' : '') + p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (p[1] ? '.' + p[1] : ''); };
  const amt = (v, u) => num(v) + ' ' + u;
  // A square k tiles a side, as its button reads ("20 cm × 20 cm"), and back.
  const side = (k) => amt(k * TILE, 'cm');
  const dims = (k) => side(k) + ' × ' + side(k);
  const parseDims = (s) => { const m = /^(\d+) cm × (\d+) cm$/.exec(s); return m && m[1] === m[2] ? +m[1] / TILE : null; };
  const copiesWord = (n) => (n === 1 ? '1 copy' : n + ' copies');
  // The squares of a k by k block, the first the small one, then ring by ring outwards (the new
  // copies a bigger k adds come last).
  function squareCopies(k) {
    const out = [];
    for (let r = 0; r < k; r++) { for (let y = 0; y < r; y++) out.push([r, y]); for (let x = 0; x <= r; x++) out.push([x, r]); }
    return out;
  }
  // The small triangle and the triangle k times as big; the k × k copies of the small one that fill
  // the big one, row by row from the bottom: upright ones, and between them ones turned round.
  const triPts = (k) => [[0, 0], [k * TRI.b, 0], [k * TRI.a, k * TRI.h]];
  function triCopies(k) {
    const out = [];
    for (let j = 0; j < k; j++) for (let i = 0; i + j < k; i++) {
      const ox = i * TRI.b + j * TRI.a, oy = j * TRI.h;
      out.push({ up: true, j: j, i: i, pts: [[ox, oy], [ox + TRI.b, oy], [ox + TRI.a, oy + TRI.h]] });
      if (i + j < k - 1) out.push({ up: false, j: j, i: i, pts: [[ox + TRI.b, oy], [ox + TRI.a + TRI.b, oy + TRI.h], [ox + TRI.a, oy + TRI.h]] });
    }
    return out;
  }
  const centroid = (pts) => [pts.reduce((s, p) => s + p[0], 0) / pts.length, pts.reduce((s, p) => s + p[1], 0) / pts.length];
  // A shape's area from its corners (the shoelace sum), so the checks can measure what is drawn.
  const areaOf = (pts) => Math.abs(pts.reduce((s, p, k) => { const q = pts[(k + 1) % pts.length]; return s + p[0] * q[1] - q[0] * p[1]; }, 0)) / 2;
  const rot = (p, c, th) => [c[0] + (p[0] - c[0]) * Math.cos(th) - (p[1] - c[1]) * Math.sin(th), c[1] + (p[0] - c[0]) * Math.sin(th) + (p[1] - c[1]) * Math.cos(th)];
  // A triangle's three side lengths, smallest first (two triangles with the same three are the same shape and size).
  const sidesOf = (pts) => pts.map((p, k) => { const q = pts[(k + 1) % 3]; return Math.hypot(q[0] - p[0], q[1] - p[1]); }).sort((a, b) => a - b);
  // Whether p lies in (or on) triangle t.
  function inside(p, t) {
    const s = (a, b, c) => (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0]);
    const d1 = s(t[0], t[1], p), d2 = s(t[1], t[2], p), d3 = s(t[2], t[0], p);
    return !((d1 < -1e-9 || d2 < -1e-9 || d3 < -1e-9) && (d1 > 1e-9 || d2 > 1e-9 || d3 > 1e-9));
  }
  // What each slip makes of an answer, and the answer a puzzle wants, worked out by its rule, as its button reads.
  function slipOpt(d, s) {
    const plate = PLATE.w * PLATE.h, floor = FLOOR.w * FLOOR.h, bar = BAR.w * BAR.t;
    if (d.pic === 'plate') return s === 'ten' ? amt(plate * MM_PER_CM, 'mm²') : amt(plate / CM2MM, 'mm²');
    if (d.pic === 'floor') return s === 'hundred' ? amt(floor * CM_PER_M, 'cm²') : amt(floor * 1000, 'cm²');
    if (d.pic === 'four') return dims(d.times);
    if (d.pic === 'tri3') return s === 'times' ? amt(PLATE3.k * PLATE3.area, 'cm²') : amt((PLATE3.k + PLATE3.k) * PLATE3.area, 'cm²');
    if (d.pic === 'c25') return s === 'ten' ? amt(COND / MM_PER_CM, 'cm²') : amt(COND * CM2MM, 'cm²');
    if (d.pic === 'mil') return s === 'row' ? amt(MM_PER_M, 'mm²') : amt(M2CM, 'mm²');
    return s === 'ten' ? amt(bar / MM_PER_CM, 'cm²') : amt(bar, 'cm²');
  }
  function answerOf(d) {
    if (d.pic === 'plate') return amt(PLATE.w * PLATE.h * CM2MM, 'mm²');
    if (d.pic === 'floor') return amt(FLOOR.w * FLOOR.h * M2CM, 'cm²');
    if (d.pic === 'four') return dims(Math.sqrt(d.times));
    if (d.pic === 'tri3') return amt(sq(PLATE3.k) * PLATE3.area, 'cm²');
    if (d.pic === 'c25') return amt(COND / CM2MM, 'cm²');
    if (d.pic === 'mil') return amt(M2MM, 'mm²');
    return amt(BAR.w * BAR.t / CM2MM, 'cm²');
  }
  // As a screen reader says it.
  const say = (s) => String(s).replace(/(\d),(\d{3})/g, '$1$2').replace(/(\d),(\d{3})/g, '$1$2')
    .replace(/mm²/g, 'square millimetres').replace(/cm²/g, 'square centimetres').replace(/m²/g, 'square metres')
    .replace(/(\d) mm\b/g, '$1 millimetres').replace(/(\d) cm\b/g, '$1 centimetres').replace(/(\d) m\b/g, '$1 metres')
    .replace(/(^|[^\d.])1 square (milli|centi)?metres/g, '$11 square $2metre').replace(/(^|[^\d.])1 (milli|centi)?metres/g, '$11 $2metre')
    .replace(/×/g, ' times ').replace(/÷/g, ' divided by ').replace(/−/g, ' minus ').replace(/\+/g, ' plus ').replace(/=/g, ' equals ').replace(/\s+/g, ' ').trim();

  function blank(i) { return { pick: null, res: null, why: false, k: null, moved: false }; }
  const emptyFor = (i, st) => (STEPS[i].kind === 'drag' ? (st.moved ? '' : PLACE) : st.pick != null ? '' : PICK);
  const isEmpty = (i, st) => !!emptyFor(i, st);
  const isRight = (i, st) => !isEmpty(i, st) && st.pick === STEPS[i].want;
  // A wrong answer's hint names its slip.
  const hintFor = (i, st) => { const d = STEPS[i]; return (d.hints && d.hints[st.pick]) || d.hint; };
  // A step answered right (the timing check draws each one this way), or with a slip.
  function solved(i) { const d = STEPS[i], st = blank(i); st.res = 'right'; st.moved = true; st.pick = d.want; if (d.kind === 'drag') st.k = d.to; return st; }
  function slipped(i, o) { const d = STEPS[i], st = blank(i); st.res = 'wrong'; st.moved = true; st.pick = o; if (d.kind === 'drag') st.k = parseDims(o); return st; }

  let S = STEPS.map((d, i) => blank(i));
  let finished = false, lastStep = -1, lastDone = false, T = Infinity;   // T: seconds into the current motion
  let motion = null, motionEnd = 0;                                      // what is moving: 'demo' or 'fb'

  // ---------- text with amber key terms (built with K.el, never innerHTML) ----------
  function pieces(el, text) {
    const re = /\*([^*]+)\*/g;
    let at = 0, m;
    while ((m = re.exec(text))) {
      if (m.index > at) el.appendChild(document.createTextNode(text.slice(at, m.index)));
      el.appendChild(K.el('span', { class: 'term' }, m[1]));
      at = m.index + m[0].length;
    }
    if (at < text.length) el.appendChild(document.createTextNode(text.slice(at)));
  }
  // An amount or a sum stays together on one line ("100 mm²", "1,000,000 mm²", "10 × 10 = 100 mm²"),
  // with the stop after it; a long one may break only before an equals sign.
  const TOK = '(?:\\d[\\d,]*(?:\\.\\d+)?(?: (?:mm²|cm²|m²|mm|cm|m)(?![A-Za-z²]))?)';
  const GLUE = new RegExp('IEC \\d+[.,]?|(?<![A-Za-z0-9\'’-])' + TOK + '(?: [=+−×÷] ' + TOK + ')*[.,?!;]?', 'g');
  function write(el, text) {
    el.textContent = '';
    let at = 0, m;
    GLUE.lastIndex = 0;
    while ((m = GLUE.exec(text))) {
      if (m.index > at) pieces(el, text.slice(at, m.index));
      const bits = m[0].length > 18 ? m[0].split(/ (?==)/) : [m[0]];
      bits.forEach((b, k) => {
        if (k) el.appendChild(document.createTextNode(' '));
        if (/ /.test(b)) el.appendChild(K.el('span', { class: 'nw' }, b)); else el.appendChild(document.createTextNode(b));
      });
      at = m.index + m[0].length;
    }
    if (at < text.length) pieces(el, text.slice(at));
  }

  // ---------- controls ----------
  const stepper = K.stepper({ id: 'step', label: 'Step', steps: STEPS.map((d) => d.name), value: 0, compact: true, into: '#prog' });
  const nav = document.getElementById('nav');
  const here = () => stepper.get();

  // Up to three answer buttons; each step fills in its own options.
  const pickBtns = [0, 1, 2].map((k) => K.button({ label: 'Answer ' + (k + 1), secondary: true, into: '#picks', press: () => {
    const i = here(), d = STEPS[i], st = S[i];
    if (finished || d.show || !d.opts || k >= d.opts.length || st.res === 'right') return;
    st.pick = d.opts[k]; st.res = null;
  } }));

  // Check: marks the answer; a right one plays its picture's motion, a wrong one shows its slip.
  const checkBtn = K.button({ label: 'Check', into: '#acts', press: () => {
    const i = here(), d = STEPS[i], st = S[i];
    if (d.show || finished) return;
    if (isEmpty(i, st)) { st.res = 'empty'; return; }
    st.res = isRight(i, st) ? 'right' : 'wrong';
    if (st.res === 'right') play(d.fb, 'fb'); else play(WRONG_DUR, 'fb');
  } });
  const whyBtn = K.button({ label: 'Why?', secondary: true, into: '#acts', press: () => {
    if (STEPS[here()].show || finished) return;
    const st = S[here()]; st.why = !st.why;
  } });
  const replayBtn = K.button({ label: 'Play again', secondary: true, into: '#replay', press: () => {
    const i = here(), d = STEPS[i];
    if (!d.show || finished) return;
    S[i].moved = false; S[i].k = null;
    play(d.dur, 'demo');
  } });
  const backBtn = K.button({ label: 'Back', secondary: true, into: '#nav', press: () => {
    if (finished) { finished = false; return; }
    stepper.set(Math.max(0, here() - 1), true);
  } });
  const nextBtn = K.button({ label: 'Continue', into: '#nav', press: () => {
    const i = here();
    if (finished || (!STEPS[i].show && S[i].res !== 'right')) return;
    if (i < STEPS.length - 1) { stepper.set(i + 1, true); return; }
    finished = true;
    if (typeof K.complete === 'function') K.complete();
  } });
  const againBtn = K.button({ label: 'Start again', secondary: true, into: '#again', press: () => {
    S = STEPS.map((d, i) => blank(i)); finished = false; lastStep = -1; stepper.set(0, true);
  } });

  // One animation plays each demonstration and the motion after an answer, from its start; with
  // reduced motion (and while the self-test looks) it opens finished.
  const anim = K.anim({ button: false, label: 'Demonstration', step: (dt) => {
    if (finished) return false;
    T += dt;
    // Once the motion has played, the picture is drawn finished, so a corner Dan can move shows its ring.
    if (T >= motionEnd) { T = Infinity; paint(); return false; }
    paint();
    return true;
  } });
  // The kit pauses the motion while the page is hidden (Dan switches app or locks the phone) and
  // resumes it when he comes back; this only settles a motion that had already stopped.
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !anim.playing() && T !== Infinity) { T = Infinity; paint(); } });
  function play(dur, kind) {
    motion = kind;
    if (REDUCE || testing()) { T = Infinity; anim.pause(); paint(); return; }
    motionEnd = dur; T = 0; anim.play();
  }
  // A new screen (or the finish panel) fades in softly: the CSS animation restarts on it.
  function enter(id) {
    if (REDUCE) return;
    const box = document.getElementById(id);
    box.classList.remove('enter');
    void box.offsetWidth;
    box.classList.add('enter');
  }

  // ---------- drawing ----------
  // Each picture has its own frame: Q units a grid unit (a mm, a cm, a m, a 10 cm tile, or one picture
  // unit for the triangles), its bottom-left corner at (ox, by), H tall. The readout sits on the row YNY.
  const YNY = 24;
  const LAY = {
    mm: { Q: 18, ox: 80, by: 230, H: 256 },        // a 1 cm square, 18 units a mm
    plate: { Q: 46, ox: 70, by: 226, H: 252 },     // the plate, 46 units a cm
    m: { Q: 2.1, ox: 76, by: 252, H: 280 },        // a 1 m square, 2.1 units a cm
    floor: { Q: 80, ox: 66, by: 214, H: 240 },     // the floor, 80 units a m
    sq: { Q: 48, ox: 74, by: 238, H: 264 },        // squares, 48 units a 10 cm tile
    tri: { Q: 1, ox: 44, by: 244, H: 270 },        // triangles, in picture units
    cable: { Q: 16, ox: 90, by: 200, H: 254 },     // a 1 cm square, 16 units a mm, the sizes below
    c25: { Q: 12, ox: 80, by: 236, H: 262 },       // a 1 cm square, 12 units a mm
    bar: { Q: 9, ox: 56, by: 112, H: 140 },        // the bar's end, 9 units a mm
  };
  const LAY_OF = { mm: 'mm', m: 'm', scale: 'sq', tri: 'tri', cable: 'cable', plate: 'plate', floor: 'floor', four: 'sq', tri3: 'tri', c25: 'c25', mil: 'm', bar: 'bar' };
  const svg = document.getElementById('scene'), art = document.getElementById('art'), hits = document.getElementById('hits');
  let F = LAY.mm, H = F.H;
  const gx = (x) => F.ox + F.Q * x;
  const gy = (y) => F.by - F.Q * y;
  let into = null;                                   // where shapes go: the picture, or a part that is arriving
  const add = (node) => (into || art).appendChild(node);
  // How far a part due at t0 has arrived (K.arrive), noting the timetable for the timing check.
  let latest = 0, earliest = Infinity;
  function note(t0, d) { if (t0 + d > latest) latest = t0 + d; if (t0 < earliest) earliest = t0; }
  function arr(t0, d) { d = d == null ? K.SOFT : d; note(t0, d); return K.arrive(T, t0, d); }
  // A steady run from t0 over d seconds, 0 -> 1; grow: the same, eased.
  function lin(t0, d) { note(t0, d); return T === Infinity ? 1 : K.clamp((T - t0) / d, 0, 1); }
  const grow = (t0, d) => K.ease(lin(t0, d == null ? GROW : d));
  // The kth of a counted run of parts [start, gap].
  const nth = (A, k) => A[0] + A[1] * k;
  // A part arriving: drawn into a group faded in to a and risen `rise` units into place; nothing before it starts.
  function part(a, rise, draw) {
    if (a <= 0) return;
    const g = add(K.svg('g'));
    K.fade(g, a, rise);
    const keep = into; into = g; draw(); into = keep;
  }
  // A part leaving: faded out as a goes 0 -> 1.
  function leave(a, draw) {
    if (a >= 1) return;
    const g = add(K.svg('g'));
    K.fade(g, 1 - a, 0);
    const keep = into; into = g; draw(); into = keep;
  }
  // One thing giving way to another at arrival a: the first fades out over the first half, and only then
  // the second fades in, so the two never sit over each other.
  function swap(a, from, to, rise) { leave(Math.min(1, a * 2), from); part(Math.max(0, a * 2 - 1), rise == null ? 4 : rise, to); }
  const rect = (cls, x, y, w, h, rx) => add(K.svg('rect', { class: cls, x: r3(x), y: r3(y), width: Math.max(0, r3(w)), height: Math.max(0, r3(h)), rx: rx || 0 }));
  const line = (cls, x1, y1, x2, y2) => add(K.svg('line', { class: cls, x1: r3(x1), y1: r3(y1), x2: r3(x2), y2: r3(y2) }));
  const circle = (cls, cx, cy, r) => add(K.svg('circle', { class: cls, cx: r3(cx), cy: r3(cy), r: r }));
  const path = (cls, d) => add(K.svg('path', { class: cls, d: d }));
  function mtext(x, y, s, cls, anchor, parent) {
    const t = K.svg('text', { class: cls, x: r3(x), y: r3(y), 'text-anchor': anchor || 'middle' });
    t.textContent = String(s);
    return parent ? parent.appendChild(t) : add(t);
  }
  const text = (x, y, s, cls, anchor) => mtext(x, y, s, cls, anchor);
  // The width of a line of text (measured once it can be; estimated while the scene is hidden).
  const widths = {};
  const SIZE = { ro: 20, an: 13, lbl: 13, rou: 13, cn: 13, axv: 13 };
  function tw(s, cls) {
    const key = cls + '|' + s;
    if (widths[key]) return widths[key];
    const t = mtext(0, -50, s, cls, 'start', svg);
    let w = 0;
    try { w = t.getComputedTextLength(); } catch (e) { w = 0; }
    svg.removeChild(t);
    if (w > 0) { widths[key] = w; return w; }
    return String(s).length * (SIZE[cls.split(' ')[0]] || 14) * 0.6;
  }
  // --- shapes in unit squares ---
  const P = (pts) => 'M' + pts.map((p) => r3(gx(p[0])) + ' ' + r3(gy(p[1]))).join('L') + 'Z';
  const poly = (cls, pts) => path(cls, P(pts));
  const box = (cls, x, y, w, h) => rect(cls, gx(x), gy(y + h), F.Q * w, F.Q * h);
  // The lines between unit squares every `step` inside a w by h block (and its border, if asked).
  function gridIn(x0, y0, w, h, step, border, cls) {
    let p = '';
    const nx = Math.round(w / step), ny = Math.round(h / step);
    for (let k = border ? 0 : 1; k <= (border ? nx : nx - 1); k++) p += 'M' + r3(gx(x0 + k * step)) + ' ' + r3(gy(y0)) + 'V' + r3(gy(y0 + h));
    for (let k = border ? 0 : 1; k <= (border ? ny : ny - 1); k++) p += 'M' + r3(gx(x0)) + ' ' + r3(gy(y0 + k * step)) + 'H' + r3(gx(x0 + w));
    if (p) path(cls || 'gl', p);
  }
  // A ruler along the bottom and up the left of an n by n square: a tick every unit, a longer one every ten.
  function ruler(n) {
    let p = '';
    for (let k = 0; k <= n; k++) { const L = k % 10 ? 3 : 6; p += 'M' + r3(gx(k)) + ' ' + r3(gy(0)) + 'v' + L + 'M' + r3(gx(0)) + ' ' + r3(gy(k)) + 'h' + (-L); }
    path('tk', p);
  }
  // A side's length beside it: below a bottom side, left of an upright one.
  const below = (x0, x1, y, s, cls, dy) => text((gx(x0) + gx(x1)) / 2, gy(y) + (dy || 18), s, cls || 'lbl');
  const leftOf = (x, y0, y1, s, cls, dx) => text(gx(x) - (dx || 7), (gy(y0) + gy(y1)) / 2 + 5, s, cls || 'lbl', 'end');
  // A label on a patch of the page (centred on x, or starting at x), so the lines it sits over stay clear of it.
  function plabel(x, y, s, cls) { const w = tw(s, cls); rect('patch', x - w / 2 - 4, y - 13, w + 8, 18, 4); text(x, y, s, cls); }
  function plabelAt(x, y, s, cls, anchor) { const w = tw(s, cls), x0 = anchor === 'end' ? x - w : x; rect('patch', x0 - 4, y - 13, w + 8, 18, 4); text(x0, y, s, cls, 'start'); }
  // The readout on the row above the picture: what it comes to (big) after the sum that gives it (small).
  // (loose: the readouts drawn this frame straight onto the picture, outside part() or swap(), which
  // the timing check notes.)
  let loose = [];
  function readout2(big, small, warn) {
    if (!into) loose.push(big);
    const w = warn ? ' warnt' : '';
    text(338, YNY, big, 'ro' + w, 'end');
    if (small) text(338 - tw(big, 'ro') - 8, YNY - 1, small, 'rou' + w, 'end');
  }
  const readoutHidden = (u) => { if (!into) loose.push('? ' + u); text(338, YNY, '? ' + u, 'ro q', 'end'); };
  // The corner Dan moves: a dot, with a soft ring while it can be moved.
  function handle(p, live, warn) { if (live) circle('ringp', gx(p[0]), gy(p[1]), 15); circle('pt' + (warn ? ' bad' : ''), gx(p[0]), gy(p[1]), 6); }
  let gripAt = null;                                 // where the grip sits this frame (grid units), if anywhere
  // A sum of k × k copies of a square tile, and what they cover.
  const tileSum = (k) => [amt(sq(k) * TILE * TILE, 'cm²'), k + ' × ' + k + ' = ' + copiesWord(sq(k)) + ','];

  // One 10 cm square of a 1 m square's grid (n cm a side), its top-left one, picked out and named.
  function cellName(n) {
    const c = CELL;
    box('rowh', 0, n - c, c, c);
    plabelAt(gx(c) + 6, gy(n - c / 2) + 5, amt(c, 'cm') + ' × ' + amt(c, 'cm') + ' = ' + amt(c * c, 'cm²'), 'lbl');
  }

  // --- the demonstrations (SHOW steps), drawn at time T ---
  // Square millimetres: the bottom row's ten squares fill one at a time, numbered; the readout fades in
  // with the first and counts them, 0.2 s apart. Then the other rows rise while it holds "one row,
  // 10 mm²"; then the sum takes its place.
  function demoMM(i, d) {
    const A = AT.mm, n = MM_PER_CM;
    const as = []; for (let k = 0; k < n; k++) as.push(arr(nth(A.sq, k), COUNT));
    const got = as.filter((a) => a >= 0.5).length, ri = K.ease(lin(A.rise, RISE_MM)), rows = 1 + (n - 1) * ri, sa = arr(A.sum);
    const whole = Math.floor(rows + 1e-9);
    as.forEach((a, k) => part(a, 0, () => box('t1', k, 0, 1, 1)));
    if (ri > 0) box('t1', 0, 1, n, rows - 1);
    gridIn(0, 0, n, n, 1, true, 'gl');
    as.forEach((a, k) => part(a, 0, () => text(gx(k + 0.5), gy(0.5) + 4.5, k + 1, 'cn')));
    box('shp', 0, 0, n, n);
    below(0, n, 0, '1 cm = 10 mm'); leftOf(0, 0, n, '10 mm');
    const rowRead = () => readout2(amt(Math.max(1, got), 'mm²'), 'one row');
    if (sa > 0) swap(sa, rowRead, () => readout2(amt(CM2MM, 'mm²'), n + ' × ' + n + ' ='), 0);
    else part(as[0], 0, rowRead);
    const said = ['A 1 centimetre square, 10 millimetres each way, ruled into 1 millimetre squares.'];
    if (got) said.push('Along the bottom row, ' + got + ' of its 10 squares are numbered.');
    if (ri >= 0.5) said.push('The rows above fill too, ' + whole + ' rows of 10.');
    if (sa >= 0.5) said.push('10 times 10 equals 100 square millimetres.');
    return said.join(' ');
  }
  // Square metres: the row of cm squares runs along the bottom; it is named, and the readout fades in
  // with its name, "one row, 100 cm²", and holds while the rows rise. One 10 cm square of the grid is
  // picked out and named, 10 cm × 10 cm = 100 cm² (so its 100 squares are not taken for 100 cm²); then
  // the sum takes the readout's place.
  function demoM(i, d) {
    const A = AT.m, n = CM_PER_M;
    const e = K.ease(lin(A.strip, STRIP_T)), la = arr(A.label), ri = K.ease(lin(A.rise, RISE_M)), ca = arr(A.cell), sa = arr(A.sum);
    const rows = 1 + (n - 1) * ri, whole = Math.floor(rows + 1e-9);
    if (ri > 0) box('t1', 0, 1, n, rows - 1);
    gridIn(0, 0, n, n, CELL, false, 'gl');
    ruler(n);
    box('shp', 0, 0, n, n);
    // The row is drawn over the square's edge, so its 1 cm stays in sight.
    if (e > 0) box('rowh', 0, 0, n * e, 1);
    below(0, n, 0, '1 m = 100 cm', 'lbl', 22); leftOf(0, 0, n, '100 cm', 'lbl', 10);
    part(la, 0, () => plabel(gx(n / 2), gy(1) - 8, 'one row, 100 cm²', 'lbl'));
    part(ca, 0, () => cellName(n));
    const rowRead = () => readout2(amt(n, 'cm²'), 'one row');
    if (sa > 0) swap(sa, rowRead, () => readout2(amt(M2CM, 'cm²'), n + ' × ' + n + ' ='), 0);
    else part(la, 0, rowRead);
    const said = ['A 1 metre square, 100 centimetres each way, with a ruler of centimetres along the bottom and up the side.'];
    if (e >= 0.5) said.push('One row of 1 centimetre squares along the bottom is 100 square centimetres.');
    if (ri >= 0.5) said.push(whole + ' rows of 100 are filled.');
    if (ca >= 0.5) said.push('Each 10 centimetre square of the grid is 10 times 10, 100 square centimetres.');
    if (sa >= 0.5) said.push('100 times 100 equals 10,000 square centimetres.');
    return said.join(' ');
  }
  // Twice the sides: the big square grows from the small one to twice its side; the three new copies
  // arrive one at a time, numbered; the sum. Once it has played, Dan drags the corner and the copies fill at once.
  function demoScale(i, d, st) {
    const A = AT.scale, moved = st.moved && st.k != null;
    const k = moved ? st.k : 1 + grow(A.grow), kk = moved ? st.k : 2;
    const cps = squareCopies(kk), as = cps.map((c, j) => (moved || j === 0 ? 1 : arr(nth(A.cp, j - 1), COUNT)));
    const got = as.filter((a) => a >= 0.5).length, sa = moved ? 1 : arr(A.sum);
    gridIn(0, 0, KMAX, KMAX, 1, true, 'gl');
    cps.forEach((c, j) => part(as[j], 0, () => { box('cp', c[0], c[1], 1, 1); text(gx(c[0] + 0.5), gy(c[1] + 0.5) + 4.5, j + 1, 'cn'); }));
    box('shp', 0, 0, k, k);
    // The sides' lengths follow the corner but never roll through the numbers between: they read 10 cm
    // while the square grows, and 20 cm takes their place once it has landed.
    const sides = (v) => () => { below(0, k, 0, side(v)); leftOf(0, 0, k, side(v)); };
    if (moved) sides(kk)(); else swap(arr(A.grow + GROW - 0.15, SIDE_T), sides(1), sides(kk), 0);
    const counted = () => readout2(amt(got * TILE * TILE, 'cm²'), copiesWord(got) + ',');
    if (moved) readout2.apply(null, tileSum(kk));
    else if (sa > 0) swap(sa, counted, () => readout2.apply(null, tileSum(kk)), 0);
    else counted();
    handle([k, k], T === Infinity);
    gripAt = [k, k];
    const said = ['A grid of 10 centimetre squares, 4 each way. The shaded square in the bottom left corner is 10 centimetres a side.'];
    said.push('A bigger square from the same corner, ' + say(amt(Math.round(k * TILE), 'cm')) + ' a side, holds ' + copiesWord(got) + ' of it, numbered.');
    if (sa >= 0.5) said.push(kk + ' times ' + kk + ' equals ' + sq(kk) + ', so it covers ' + say(amt(sq(kk) * 100, 'cm²')) + '.');
    said.push('Its top right corner can be dragged.');
    return said.join(' ');
  }
  // Any shape: the big triangle grows from the small one to twice its sides; two upright copies arrive
  // one at a time; the third turns round into the gap between them; the sum. Once it has played, Dan
  // drags the big triangle's right-hand corner, 1 to 3 times as long, and the copies fill at once.
  function demoTri(i, d, st) {
    const A = AT.tri, moved = st.moved && st.k != null;

      Object.keys(A).forEach((k) => { const v = A[k]; if (Array.isArray(v)) { if (v[1] < 0.2 - 1e-9) ts.push([0, 'x']); for (let n = 0; n < (v[2] || 1); n++) ts.push([v[0] + v[1] * n, k]); } else ts.push([v, k]); });
      ts.sort((a, b) => a[0] - b[0]);
      return ts.every((t, k) => k === 0 || (t[1] === ts[k - 1][1] ? t[0] - ts[k - 1][0] >= 0.2 - 1e-9 : t[0] - ts[k - 1][0] >= 0.45 - 1e-9));
    };
    return ok && Object.keys(AT).every((k) => spaced(AT[k])) && DO.every((i) => spaced(STEPS[i].at)) &&
      STEPS.every((d, i) => filmed(i, d.show ? blank(i) : solved(i), d.show ? d.dur : d.fb));
  });

  K.ready();
