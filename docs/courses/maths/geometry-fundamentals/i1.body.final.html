<p class="caption">Area counts unit squares, and a triangle is half its rectangle. All the sizes are example values.</p>

<script>
  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // demo: what a SHOW step plays (dur seconds); grip: what Dan can move once it has played (a floor's
  // corner, or a triangle's top corner). A 'pick' puzzle takes one answer, its picture `pic`; a 'drag'
  // puzzle asks for a floor's corner to be put at `to` (or at one of `also`). fb: how long the motion
  // after a right answer plays; at: when each part of it arrives, in seconds after Check ([start, gap,
  // count] for parts counted one at a time). slips: which slip gives each wrong answer, and hints: what
  // is said for it.
  const PICK = 'Tap one of the answers.', PLACE = 'Drag the corner to its place first.';
  // After a right answer. ROWS: the floor's rows tinted one at a time, each with its running total, then
  // the sum. BOTH: floor A's squares and area, then floor B's. TALLY: each row's running total, then the
  // area. TURN: the rectangle around the triangle, then a turned copy or the outside pieces turning in,
  // then the sum. SPLIT: the split line, the left part, the right part, then the sum. EDGE: the edge
  // traced side by side, the unlabelled lengths picked out, then the sum.
  const ROWS = { row: [0.1, 0.3, 4], ro: 1.5 };
  const BOTH = { a: 0.1, b: 0.6 };
  const TALLY = { row: [0.1, 0.25, 4], ro: 1.4 };
  const TURN = { rect: 0.1, turn: 0.7, ro: 1.8 };
  const SPLIT = { split: 0.1, left: 0.6, right: 1.1, ro: 1.6 };
  const EDGE = { side: [0.1, 0.2, 6], ro: 1.6 };
  // After a wrong answer: the slip, in the warning colour.
  const WRONG = { slip: 0.1 }, WRONG_DUR = 0.7;
  // How long a counted part takes to arrive, a line to grow, a side to be traced (on a demonstration and
  // after an answer), the cut half to turn, the outside pieces to turn, and a turned copy to turn.
  // After Dan lets go of the top corner: the outside pieces turn in again (SLIDE_DUR in all).
  const SLIDE = { turn: 0.1 }, SLIDE_DUR = 1.3;
  const COUNT = 0.3, GROW = 0.5, SIDE_T = 0.45, TRACE_T = 0.3, HALF_T = 1.4, PIECE_T = 1.2, COPY_T = 1.0;

  // The shapes, all example sizes. A floor before it is dragged (screen 1); the plant room (2, 3); two
  // floors the same distance around (4); the rectangle cut corner to corner and the any-triangle's
  // rectangle (6, 8), whose top corner starts 2 m along; the bracket plate in cm, drawn 10 cm a square,
  // its long side given (it comes from Pythagoras, a later lesson); the triangle with sloping sides
  // (9); the L-shaped floors, each a w by h rectangle less an nw by nh corner at its top right (10, 11, 12).
  const FLOOR = { w: 4, h: 3 }, ROOM = { w: 6, h: 4 }, PAIR = { A: { w: 6, h: 2 }, B: { w: 4, h: 4 } };
  const RECT = { w: 6, h: 4 }, APEX = 2, PLATE = { b: 40, h: 30, s: 50, per: 10 }, ISO = { b: 6, h: 4, s: 5 };
  const ELL1 = { w: 5, h: 4, nw: 2, nh: 1 }, ELL2 = { w: 6, h: 5, nw: 2, nh: 3 };
  const GRID = { cols: 8, rows: 5 };

  const STEPS = [
    { show: true, demo: 'count', dur: 3.9, grip: 'corner', name: 'Squares you can count',
      text: '*Area* is how many unit squares cover a shape. This floor is 3 rows of 4 one-metre squares, so 4 × 3 = 12 m². Drag its corner to try others.' },
    { kind: 'pick', pic: 'area', opts: ['20 m²', '10 m²', '24 m²'], want: '24 m²', slips: { '20 m²': 'around', '10 m²': 'two' }, fb: 2.1, at: ROWS, name: 'Area, not around',
      task: 'A plant room floor is 6 m by 4 m. What is its area?',
      why: 'Area counts the squares inside. 4 rows of 6 one-metre squares is 6 × 4 = 24 m².',
      hint: 'Not quite. Count the squares inside. How many rows, and how many in each?',
      hints: { '20 m²': 'Not quite. 20 adds all four sides, the distance around the edge. Area counts the squares inside.',
        '10 m²': 'Not quite. 6 + 4 adds two sides. Area counts the squares, 4 rows of 6.' } },
    { show: true, demo: 'around', dur: 3.7, name: 'Around, or inside',
      text: 'The *perimeter* is the distance around the edge, so for straight sides you add them up. Area counts the squares inside. This floor is 20 m around and covers 24 m².' },
    { kind: 'pick', pic: 'same', opts: ['Floor A', 'Floor B', 'The same'], want: 'Floor B', slips: { 'The same': 'same', 'Floor A': 'longer' }, fb: 1.2, at: BOTH, name: 'Same distance around',
      task: 'Both floors are 16 m around. Which covers more floor?',
      why: 'A covers 6 × 2 = 12 m² and B covers 4 × 4 = 16 m². The same perimeter can hold different areas.',
      hint: 'Not quite. Count the squares in each floor.',
      hints: { 'The same': 'Not quite. The same distance around can hold different areas. Count each floor\'s squares.',
        'Floor A': 'Not quite. A is longer, but it is only 2 rows of 6. Count B\'s squares too.' } },
    { kind: 'drag', pic: 'corner', side: 3, area: 12, start: [2, 2], to: [4, 3], also: ['3 m × 4 m'], want: '4 m × 3 m', fb: 2.0, at: TALLY, name: 'Draw the floor',
      slips: { '3 m × 3 m': 'around', '6 m × 2 m': 'noside' },
      task: 'A floor has a 3 m side and covers 12 m². Drag the corner to draw it.',
      why: 'With a 3 m side, 12 ÷ 3 = 4, so the other side is 4 m. The floor is 4 m by 3 m, or 3 m by 4 m.',
      hint: 'Not quite. Keep one side 3 m. What times 3 makes 12?',
      hints: { '3 m × 3 m': 'Not quite. That floor is 12 m around the edge, but it covers 9 m². Area counts the squares inside.',
        '6 m × 2 m': 'Not quite. That covers 12 m², but neither side is 3 m. Keep one side 3 m long.' } },
    { show: true, demo: 'half', dur: 3.8, name: 'Half a rectangle',
      text: 'Cut a rectangle corner to corner and the two halves match. So each half is a triangle covering 6 × 4 ÷ 2 = 12 m².' },
    { kind: 'pick', pic: 'bracket', opts: ['1,200 cm²', '600 cm²', '1,000 cm²'], want: '600 cm²', slips: { '1,000 cm²': 'slope', '1,200 cm²': 'whole' }, fb: 2.4, at: TURN, name: 'A bracket plate',
      task: 'A triangular bracket plate has these sides. What is its area?',
      why: 'The 40 cm and 30 cm sides meet at a square corner, so they are the base and height. 40 × 30 ÷ 2 = 600 cm². The 50 cm side is not used.',
      hint: 'Not quite. Multiply the two sides that meet at the square corner, then halve.',
      hints: { '1,000 cm²': 'Not quite. 50 cm is the sloping side, across from the square corner. Use the two sides at the square corner, 40 cm and 30 cm.',
        '1,200 cm²': 'Not quite. 40 × 30 is the whole rectangle around the plate. The triangle is half of it.' } },
    { show: true, demo: 'any', dur: 3.5, grip: 'apex', name: 'Any triangle',
      text: 'Slide the top corner along and the triangle is still half its rectangle. Its *height* is the 4 m at right angles to the base, not a sloping side.' },
    { kind: 'pick', pic: 'iso', opts: ['15 cm²', '24 cm²', '12 cm²'], want: '12 cm²', slips: { '15 cm²': 'slope', '24 cm²': 'whole' }, fb: 2.4, at: TURN, name: 'Which height?',
      task: 'What is this triangle\'s area?',
      why: 'The height at right angles to the 6 cm base is 4 cm. 6 × 4 ÷ 2 = 12 cm². The 5 cm sides slope, so they are not used.',
      hint: 'Not quite. Use the base and the height at right angles to it, then halve.',
      hints: { '15 cm²': 'Not quite. 5 cm is a sloping side. The height is the 4 cm at right angles to the base.',
        '24 cm²': 'Not quite. 6 × 4 is the whole rectangle around the triangle. The triangle is half of it.' } },
    { show: true, demo: 'ell', dur: 3.7, name: 'L-shaped floors',
      text: 'Split an L-shaped floor into rectangles and add, 12 + 6 = 18 m². Or take the missing corner from the whole, 20 − 2 = 18 m².' },
    { kind: 'pick', pic: 'ell', opts: ['30 m²', '24 m²', '20 m²'], want: '24 m²', slips: { '30 m²': 'outer', '20 m²': 'part' }, fb: 2.2, at: SPLIT, name: 'An L-shaped room',
      task: 'What is the floor area of this L-shaped room?',
      why: 'The right part is 6 − 4 = 2 m wide and 5 − 3 = 2 m tall, 4 m². With the 4 m by 5 m part, 20 + 4 = 24 m².',
      hint: 'Not quite. Split the room into two rectangles and add their areas.',
      hints: { '30 m²': 'Not quite. 6 × 5 is the whole rectangle around the room. The missing corner is not floor, so take it away.',
        '20 m²': 'Not quite. 4 × 5 is the left-hand part only. Add the 2 m by 2 m part on the right.' } },
    { kind: 'pick', pic: 'edge', opts: ['18 m', '24 m', '22 m'], want: '22 m', slips: { '18 m': 'labelled', '24 m': 'area' }, fb: 2.2, at: EDGE, name: 'Around the room',
      task: 'A cable runs once around the edge of the same room. How long is that run?',
      why: 'The two unlabelled sides are 6 − 4 = 2 m and 5 − 3 = 2 m. Around the edge, 5 + 4 + 3 + 2 + 2 + 6 = 22 m.',
      hint: 'Not quite. Add every side around the edge, working out the two unlabelled ones.',
      hints: { '18 m': 'Not quite. That adds the four labelled sides, but the room has six. The two short ones are 2 m each.',
        '24 m': 'Not quite. 24 m² is the floor inside. The cable runs around the edge, so add the sides.' } },
  ];
  const FINISH = 'Area counts unit squares, so a rectangle covers length × width. A triangle is half its rectangle, base × height ÷ 2, with the height at right angles to the base. The perimeter is the distance around the edge, so for a straight-sided shape add every side.';
  // When each demonstration's parts arrive, in seconds after the screen opens (the screen itself takes
  // FADE to fade in, so nothing starts before it has settled); [start, gap, count] for parts counted one
  // at a time. count: the floor's squares one at a time, then the sum. around: the four sides traced one
  // at a time, each with its length; the squares inside; their area. half: the cut grows; the top half
  // turns onto the other; "halves match"; the sum. any: the height drops; its square-corner mark and
  // length; the two outside pieces turn in; the sum. ell: the split line; the left part; the right part;
  // their sum; the missing corner; the whole less the corner.
  const FADE = 0.35;
  const AT = {
    count: { sq: [0.6, 0.2, 12], sum: 3.3 },
    around: { side: [0.6, 0.5, 4], fill: 2.6, label: 3.1 },
    half: { cut: 0.6, turn: 1.2, match: 2.7, ro: 3.2 },
    any: { ht: 0.6, mark: 1.1, turn: 1.6, ro: 2.9 },
    ell: { split: 0.6, left: 1.1, right: 1.6, sum: 2.1, notch: 2.6, whole: 3.1 },
  };
  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  // While the kit's self-test looks at every screen it switches fades off (the k-testing class):
  // demonstrations then open finished, as they do with reduced motion.
  const testing = () => document.documentElement.classList.contains('k-testing');

  // ---------- numbers (pure, so the checks can test them) ----------
  const r3 = (v) => Math.round(v * 1000) / 1000;
  const num = (v) => { const a = r3(v), s = String(Math.abs(a)).replace(/\B(?=(\d{3})+(?!\d))/g, ','); return (a < 0 ? '−' : '') + s; };
  const amt = (v, u) => num(v) + ' ' + u;
  const dims = (w, h) => num(w) + ' m × ' + num(h) + ' m';
  const parseDims = (s) => { const m = /^([\d.]+) m × ([\d.]+) m$/.exec(s); return m ? [+m[1], +m[2]] : null; };
  const rectA = (r) => r.w * r.h;
  const around = (r) => 2 * (r.w + r.h);
  const triA = (b, h) => b * h / 2;
  const ellA = (L) => L.w * L.h - L.nw * L.nh;
  // An L split by the line under its missing corner: the left part, all its height, and the right part, under the corner.
  const ellParts = (L) => [{ x: 0, y: 0, w: L.w - L.nw, h: L.h }, { x: L.w - L.nw, y: 0, w: L.nw, h: L.h - L.nh }];
  // Its corners, around from the bottom left, up first; and its sides' lengths in that order.
  const ellPts = (L) => [[0, 0], [0, L.h], [L.w - L.nw, L.h], [L.w - L.nw, L.h - L.nh], [L.w, L.h - L.nh], [L.w, 0]];
  const ellSides = (L) => ellPts(L).map((p, k, a) => { const q = a[(k + 1) % a.length]; return Math.abs(q[0] - p[0]) + Math.abs(q[1] - p[1]); });
  const ellAround = (L) => ellSides(L).reduce((s, v) => s + v, 0);
  // The unit squares of a w by h floor, row by row from the bottom left.
  const squaresOf = (w, h) => { const out = []; for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) out.push([x, y]); return out; };
  // A shape's area from its corners (the shoelace sum), so the checks can measure what is drawn.
  const areaOf = (pts) => Math.abs(pts.reduce((s, p, k) => { const q = pts[(k + 1) % pts.length]; return s + p[0] * q[1] - q[0] * p[1]; }, 0)) / 2;
  // A point turned through th about c (a half-turn is th = π).
  const rot = (p, c, th) => [c[0] + (p[0] - c[0]) * Math.cos(th) - (p[1] - c[1]) * Math.sin(th), c[1] + (p[0] - c[0]) * Math.sin(th) + (p[1] - c[1]) * Math.cos(th)];
  // Two shapes the same, corner for corner in any order.
  const same = (a, b) => a.length === b.length && a.every((p) => b.some((q) => K.near(p[0], q[0], 1e-9) && K.near(p[1], q[1], 1e-9)));
  // A triangle on base 0..w with its top corner at (a, h): the triangle, and the pieces of its rectangle
  // left and right of it, each in its own small rectangle (centre c).
  function triParts(w, h, a) {
    return { tri: [[0, 0], [w, 0], [a, h]],
      left: { pts: [[0, 0], [0, h], [a, h]], c: [a / 2, h / 2], into: [[0, 0], [a, 0], [a, h]] },
      right: { pts: [[w, 0], [w, h], [a, h]], c: [(a + w) / 2, h / 2], into: [[w, 0], [a, 0], [a, h]] } };
  }
  // What each slip makes of an answer, and the answer a puzzle wants, worked out by its rule, as its button reads.
  function slipOpt(d, s) {
    if (d.pic === 'area') return s === 'around' ? amt(around(ROOM), 'm²') : amt(ROOM.w + ROOM.h, 'm²');
    if (d.pic === 'same') return s === 'same' ? 'The same' : (PAIR.A.w > PAIR.B.w ? 'Floor A' : 'Floor B');
    if (d.pic === 'corner') return s === 'around' ? dims(d.area / 4, d.area / 4) : dims(d.area / 2, 2);
    if (d.pic === 'bracket') return s === 'slope' ? amt(triA(PLATE.b, PLATE.s), 'cm²') : amt(PLATE.b * PLATE.h, 'cm²');
    if (d.pic === 'iso') return s === 'slope' ? amt(triA(ISO.b, ISO.s), 'cm²') : amt(ISO.b * ISO.h, 'cm²');
    if (d.pic === 'ell') return s === 'outer' ? amt(rectA(ELL2), 'm²') : amt(ellParts(ELL2)[0].w * ELL2.h, 'm²');
    return s === 'labelled' ? amt(ELL2.w + ELL2.h + (ELL2.w - ELL2.nw) + ELL2.nh, 'm') : amt(ellA(ELL2), 'm');
  }
  function answerOf(d) {
    if (d.pic === 'area') return amt(rectA(ROOM), 'm²');
    if (d.pic === 'same') { const a = rectA(PAIR.A), b = rectA(PAIR.B); return b > a ? 'Floor B' : a > b ? 'Floor A' : 'The same'; }
    if (d.pic === 'corner') return dims(d.area / d.side, d.side);
    if (d.pic === 'bracket') return amt(triA(PLATE.b, PLATE.h), 'cm²');
    if (d.pic === 'iso') return amt(triA(ISO.b, ISO.h), 'cm²');
    if (d.pic === 'ell') return amt(ellA(ELL2), 'm²');
    return amt(ellAround(ELL2), 'm');
  }
  // As a screen reader says it.
  const say = (s) => String(s).replace(/(\d),(\d{3})/g, '$1$2').replace(/cm²/g, 'square centimetres').replace(/m²/g, 'square metres').replace(/\b1 square (centi)?metres/g, '1 square $1metre')
    .replace(/(\d) cm\b/g, '$1 centimetres').replace(/(\d) m\b/g, '$1 metres').replace(/\b1 (centi)?metres/g, '1 $1metre')
    .replace(/×/g, ' times ').replace(/÷/g, ' divided by ').replace(/−/g, ' minus ').replace(/\+/g, ' plus ').replace(/=/g, ' equals ').replace(/\s+/g, ' ').trim();

  function blank(i) { return { pick: null, res: null, why: false, pt: null, moved: false, c: null }; }

  }

  // ---------- controls ----------

  } });
  const replayBtn = K.button({ label: 'Play again', secondary: true, into: '#replay', press: () => {
    const i = here(), d = STEPS[i];
    if (!d.show || finished) return;
    // Screen 1 replays its 4 m by 3 m floor; the any-triangle screen replays wherever its top corner is.
    S[i].moved = false; S[i].pt = null;
    sliding = false;
    play(d.dur, 'demo');
  } });
  const backBtn = K.button({ label: 'Back', secondary: true, into: '#nav', press: () => {
    if (finished) { finished = false; return; }
    stepper.set(Math.max(0, here() - 1), true);
  } });
  const nextBtn = K.button({ label: 'Continue', into: '#nav', press: () => {
    const i = here();
    if (finished || (!STEPS[i].show && S[i].res !== 'right')) return;

  const againBtn = K.button({ label: 'Start again', secondary: true, into: '#again', press: () => {

  // One animation plays each demonstration and the motion after an answer, from its start; with

  const svg = document.getElementById('scene'), art = document.getElementById('art'), hits = document.getElementById('hits');

  }
  const text = (x, y, s, cls, anchor) => mtext(x, y, s, cls, anchor);
  // The width of a line of text (measured once it can be; estimated while the scene is hidden).
  const widths = {};
  const SIZE = { ro: 20, an: 13, lbl: 13, bdl: 13, rou: 13, cn: 13 };
  function tw(s, cls) {
    const key = cls + '|' + s;

  }
  // A side's length beside it: below a bottom side, above a top side, left or right of an upright one.
  const below = (x0, x1, y, s, cls) => text((gx(x0) + gx(x1)) / 2, gy(y) + 18, s, cls || 'lbl');
  const above = (x0, x1, y, s, cls) => text((gx(x0) + gx(x1)) / 2, gy(y) - 7, s, cls || 'lbl');
  const leftOf = (x, y0, y1, s, cls) => text(gx(x) - 7, (gy(y0) + gy(y1)) / 2 + 5, s, cls || 'lbl', 'end');

  }
  // A floor's letter on a patch at (x, y).

    if (got) said.push('Its squares are numbered 1 to ' + got + '.');
    if (sa >= 0.5) said.push(say(c[0] + ' × ' + c[1] + ' = ' + amt(area, 'm²')) + '.');

    for (let w = 1; w <= GRID.cols; w++) for (let h = 1; h <= GRID.rows; h++) corners.push([w, h]);
    return STEPS.every((d, i) => clear(drawn(i, d.show ? blank(i) : solved(i))) && (d.show || clear(drawn(i, blank(i))))) &&
      corners.every((c) => clear(drawn(0, Object.assign(blank(0), { moved: true, pt: c }))) && clear(drawn(4, Object.assign(blank(4), { moved: true, pt: c, pick: dims(c[0], c[1]) })))) &&
      [0, 1, 2, 3, 4, 5, 6].every((a) => clear(drawn(7, Object.assign(blank(7), { moved: true, c: a }))));
  });
  // Drawn from the lesson's own timetable: each screen is painted finished and every arrival it used is noted.
  K.check('Every demonstration has finished arriving within 4.5 s of its screen opening, none starting before the 0.35 s screen fade ends; every answer\'s motion, and the turn after the top corner is let go, within 2.5 s and a slip within 1 s; parts start at least 0.45 s apart and counted steps at least 0.2 s apart', () => {
    const keepT = T;
    const ok = STEPS.every((d, i) => {
      const keepS = S[i];
      T = Infinity; latest = 0; earliest = Infinity;
      S[i] = d.show ? blank(i) : solved(i);
      try { paint(i); } finally { S[i] = keepS; }
      const good = d.show ? latest <= d.dur + 1e-9 && d.dur <= 4.5 && d.dur >= 3 && earliest >= FADE : latest <= d.fb + 1e-9 && d.fb <= 2.5;
      if (!good || d.show) return good;
      return Object.keys(d.slips).every((o) => {
        S[i] = slipped(i, o); latest = 0;
        try { paint(i); } finally { S[i] = keepS; }
        return latest <= WRONG_DUR + 1e-9 && WRONG_DUR <= 1;
      });
    });
    T = keepT; paint();
    // Every start time, a counted run expanded one part per item; counted parts may be 0.2 s apart.
    const spaced = (A) => {
      const ts = [];
      Object.keys(A).forEach((k) => { const v = A[k]; if (Array.isArray(v)) { if (v[1] < 0.2 - 1e-9) ts.push([0, 'x']); for (let n = 0; n < (v[2] || 1); n++) ts.push([v[0] + v[1] * n, k]); } else ts.push([v, k]); });
      ts.sort((a, b) => a[0] - b[0]);
      return ts.every((t, k) => k === 0 || (t[1] === ts[k - 1][1] ? t[0] - ts[k - 1][0] >= 0.2 - 1e-9 : t[0] - ts[k - 1][0] >= 0.45 - 1e-9));
    };
    return ok && SLIDE.turn + PIECE_T <= SLIDE_DUR + 1e-9 && SLIDE_DUR <= 2.5 && SLIDE.turn >= 0 && AT.count.sq[2] === rectA(FLOOR) && Object.keys(AT).every((k) => spaced(AT[k])) && DO.every((i) => spaced(STEPS[i].at));
  });

  K.ready();
</script>
