<style>
  [hidden] { display: none !important; }
  .pz { max-width: 30rem; }
  .pz > * + *, #stepbox > * + * { margin-top: 14px; }
  /* The stepper is the page's step control: its dots are the progress bar; Back and Continue are below. */
  .pz .k-stepper { gap: 0; }
  .pz .k-stepper .k-label, .pz .k-stepper-nav { display: none; }
  .pz .count { margin-top: 10px; }
  .task { font-size: 1.2rem; font-weight: 700; line-height: 1.5; margin-top: 4px; }
  .task.show { font-size: 1.12rem; font-weight: 400; line-height: 1.6; }
  .nw { white-space: nowrap; }
  /* A key term stays whole on one line, so its amber highlight never splits. */
  .task .term { white-space: nowrap; }
  /* Nothing in the picture is selected as text while a part is dragged. */
  .scene { display: block; width: 100%; -webkit-user-select: none; user-select: none; }
  /* Solids: unit cubes and liquid in the light tint (their tops and sides a shade deeper, so they read as
     solid), the base area being counted in the highlighted tint, shapes edged in ink, the edges behind dashed. */
  .scene .cube, .scene .liq { fill: var(--k-fill1); }
  .scene .cube.ft, .scene .liq.ft { fill: color-mix(in srgb, var(--k-fill1) 90%, var(--k-ink)); }
  .scene .cube.fs, .scene .liq.fs { fill: color-mix(in srgb, var(--k-fill1) 80%, var(--k-ink)); }
  .scene .base { fill: var(--k-fill2); }
  .scene .one { fill: var(--k-fill2); stroke: var(--k-accent2); stroke-width: 1.25; stroke-linejoin: round; }
  .scene .gc { stroke: var(--k-accent2); stroke-opacity: .45; stroke-width: .8; fill: none; }
  .scene .gl2 { stroke: var(--k-line); stroke-width: .7; fill: none; }
  .scene .shp { fill: none; stroke: var(--k-accent2); stroke-width: 2.25; stroke-linejoin: round; stroke-linecap: round; }
  .scene .shp.thin { stroke-width: 1.25; }
  .scene .hid { stroke: var(--k-muted); stroke-width: 1.25; stroke-dasharray: 4 3; fill: none; }
  .scene .tk { stroke: var(--k-muted); stroke-width: 1; fill: none; }
  .scene .dim { stroke: var(--k-muted); stroke-width: 1.25; fill: none; }
  .scene .rad { stroke: var(--k-amber-line); stroke-width: 3; stroke-linecap: round; }
  .scene .radi { stroke: var(--k-accent2); stroke-width: 2; stroke-linecap: round; }
  .scene .rowl { stroke: var(--k-amber-line); stroke-width: 5; stroke-linecap: round; }
  /* A slip: a red tint over what it counts, a red edge or outline. */
  .scene .tbad { fill: var(--k-warn); fill-opacity: .18; }
  .scene .edge { stroke: var(--k-warn); stroke-width: 5; stroke-linecap: round; fill: none; }
  .scene .ring { fill: none; stroke: var(--k-warn); stroke-width: 2.25; }
  .scene .redl { stroke: var(--k-warn); stroke-width: 1.5; fill: none; }
  .scene .redg { stroke: var(--k-warn); stroke-opacity: .6; stroke-width: .8; fill: none; }
  .scene .hl { fill: var(--k-hl); }
  /* Lengths in ink; small labels in teal; the table's numbers in muted, the one reached in ink. */
  .scene .lbl { font: 700 13px var(--k-font); fill: var(--k-ink); }
  .scene .an { font: 700 13px var(--k-font); fill: var(--k-accent); }
  .scene .axv { font: 600 13px var(--k-font); fill: var(--k-muted); }
  .scene .axv.on { fill: var(--k-ink); }
  .scene .patch { fill: var(--k-bg); }
  /* The readout along the top: a sum and what it comes to. */
  .scene .ro { font: 700 20px var(--k-font); fill: var(--k-ink); }
  .scene .ro.q { fill: var(--k-muted); }
  .scene .rou { font: 700 13px var(--k-font); fill: var(--k-accent); }
  /* A slip's words in the warning colour, over any text style above. */
  .scene text.warnt { fill: var(--k-warn); }
  /* The part Dan moves: a dot with a soft ring. */
  .scene .pt { fill: var(--k-accent2); stroke: var(--k-bg); stroke-width: 2; }
  .scene .ringp { fill: var(--k-accent2); fill-opacity: .16; }
  .scene .hit { fill: var(--k-bg); fill-opacity: 0; cursor: pointer; }
  .scene .hit.grab { cursor: grab; touch-action: none; }
  .scene .hit:focus { outline: none; }
  .scene .hit.grab:focus-visible { stroke: var(--k-accent); stroke-width: 3; stroke-opacity: 1; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  .row .k-btn { flex: 1 1 7rem; }
  .replay { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 10px; }
  .replay .k-btn { flex: 0 0 auto; min-height: 44px; padding-left: 16px; padding-right: 16px; font-size: .95rem; white-space: nowrap; }
  /* The answers stay on one row, each label whole, at every text size; longer ones stack one to a row. */
  .row.picks { flex-wrap: nowrap; }
  .picks .k-btn { font-size: 1.15rem; min-height: 56px; flex: 1 1 0; min-width: 0; white-space: nowrap; padding-inline: 6px; }
  .row.picks.long { flex-direction: column; }
  .picks.long .k-btn { flex: 0 0 auto; width: 100%; }
  .picks .k-btn[aria-pressed="true"] { background: var(--k-accent2); color: var(--k-on-accent2); border-color: var(--k-accent2); }
  .fb { font-weight: 700; min-height: 1.5em; margin-top: 10px; }
  .fb.right { color: var(--k-good); }
  .fb.wrong { color: var(--k-ink); }
  .why { line-height: 1.6; }
  .done { line-height: 1.6; }
  .done strong { color: var(--k-accent2); }
  .done .row { margin-top: 14px; }
  /* Each new screen settles in softly: its words and picture fade in and rise 4 px. */
  #stepbox.enter, #done.enter { animation: screen-in .35s ease-out both; }
  @keyframes screen-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  html.k-testing #stepbox.enter, html.k-testing #done.enter { animation: none; }
  @media (prefers-reduced-motion: reduce) {
    #stepbox.enter, #done.enter { animation: none; }
  }

<p class="lead">Solids with their lengths labelled, some built from unit cubes: boxes, a metre cube of litres, a drum, a round tank, a box tank with liquid, and boxes unfolded flat.</p>

<div class="pz" id="pz">

<p class="caption" id="cap">A box or cylinder holds its base area × its length, and 1 m³ is 1,000 L. All sizes are example values.</p>

<script>
  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // demo: what a SHOW step plays (dur seconds); grip: what Dan can move once it has played (the top of the
  // stack of cubes, the drum's end, or the level of the liquid). Each puzzle takes one answer, its picture
  // `pic`: a 'pick' puzzle one of its options, a 'drag' puzzle the tank's top dragged to the depth `want`. fb: how long the motion after a right answer plays; at: when each part of it arrives, in
  // seconds after Check ([start, gap, count] for parts counted one at a time). slips: which slip gives
  // each wrong answer, and hints: what is said for it.
  const PICK = 'Tap one of the answers.', PLACE = 'Drag the top to its place first.';
  // After a right answer. LAYER1: the tank's base tinted, its sum; a layer of 1 m cubes; the half layer
  // and the sum. MILLION: one row of 1 cm cubes; one layer; the layers rise; the sum. LITRES: the metre
  // cube ruled into litres; one litre picked out; the sum. ROUND: the radius; the round base; the tank
  // fills up from it; the sum. DEPTH: the liquid's base area; its m³; its litres. MASS: each cube of oil
  // tagged with its mass, one at a time; the sum. PAIRS: the net's faces tinted a matching pair at a time,
  // with their areas, the readout counting up to the sum.
  const LAYER1 = { base: 0.1, layer: 0.6, half: 1.1 };
  const MILLION = { row: 0.1, layer: 0.6, rise: 1.1, ro: 1.8 };
  const LITRES = { grid: 0.1, one: 0.6, ro: 1.1 };
  const ROUND = { r: 0.1, base: 0.6, rise: 1.1, ro: 1.6 };
  const DEPTH = { area: 0.1, m3: 0.6, ro: 1.1 };
  const MASS = { tag: [0.1, 0.3, 3], ro: 1.2 };
  const PAIRS = { pair: [0.1, 0.45, 3] };
  // After a wrong answer: the slip, in the warning colour.
  const WRONG = { slip: 0.1 }, WRONG_DUR = 0.7;
  // How long a layer of cubes takes to drop in, a row or layer of litres to grow, the layers of cm³ to rise,
  // the round tank to fill, the drum's end to turn and to slide, the box to unfold, the liquid to rise a
  // step, and a row of the table to light up.
  const LAY_T = 0.4, GROW = 0.6, RISE = 0.7, FILL_T = 0.8, TURN = 0.7, SLIDE = 1.0, UNFOLD = 1.1, HOP = 0.35, PICK_T = 0.25;

  // The solids, all example sizes, in metres: the base of 1 m squares and the layers stacked on it (1);
  // the box tank, 3 m long, 2 m wide and 1.5 m deep (2, 5, 8, 9, 12), and its liquid's depth (9); the
  // drum (6); the round tank (7); the oil, its density in kg per m³ and its volume in m³ (10); the box
  // unfolded (11).
  const BASE = { l: 4, w: 3, n: 5 };
  const TANK = { l: 3, w: 2, h: 1.5 }, LIQ = 0.8;
  const DRUM = { d: 1, L: 2, min: 0.5, max: 3 };
  const RTANK = { d: 1.2, h: 2 };
  const OIL = { rho: 850, v: 3 };
  const NETBOX = { l: 3, w: 2, h: 1 };
  // The units: a litre is a 10 cm cube, so 10 fit along a metre; 100 cm in a metre.
  const L_EDGE = 10, CM_PER_M = 100, L_PER_M3 = L_EDGE * L_EDGE * L_EDGE, CM3_PER_L = 10 * 10 * 10;
  // The sounding table drawn for the example tank: the liquid's volume at every 0.25 m of depth.
  const TABLE_STEP = 0.25;

  const STEPS = [
    { show: true, demo: 'layers', dur: 4.0, grip: 'height', name: 'Layers of cubes',
      text: '*Volume* counts unit cubes, here 1 m cubes called *cubic metres*. A 4 m by 3 m base takes 12 in a layer, so 5 layers hold 12 × 5 = 60 m³. Drag the top.' },
    { kind: 'drag', pic: 'tank', grip: 'depth', start: 0.5, want: '1.5 m', slips: { '1 m': 'base' }, fb: 1.7, at: LAYER1, name: 'A box tank',
      task: 'An example box tank is 3 m long and 2 m wide. Drag its top until it holds 9 m³.',
      why: 'Its base is 3 × 2 = 6 m², so each 1 m layer holds 6 cubes. 9 m³ is one and a half layers, so the tank is 1.5 m deep, and 6 × 1.5 = 9 m³.',
      hint: 'Not quite. Work out the base area, the cubes in one 1 m layer. How many layers make 9 m³?',
      hints: { '1 m': 'Not quite. 1 m deep is one layer of 3 × 2 = 6 cubes, only 6 m³. 9 m³ needs half a layer more.' } },
    { show: true, demo: 'litre', dur: 4.2, name: 'A litre',
      text: 'A *litre* is the space in a 10 cm cube. Ten of them fit along each edge of a 1 m cube, so 1 m³ holds 10 × 10 × 10 = 1,000 L.' },
    { kind: 'pick', pic: 'million', opts: ['100 cm³', '10,000 cm³', '1,000,000 cm³'], want: '1,000,000 cm³', slips: { '100 cm³': 'row', '10,000 cm³': 'layer' }, fb: 2.4, at: MILLION, name: 'cm³ in a m³',
      task: '1 m is 100 cm. How many cm³ make 1 m³?',
      why: 'A 1 m cube is 100 cm each way. One row of 1 cm cubes along the bottom is 100 cm³, a layer is 100 × 100 = 10,000, and 100 layers make 100 × 100 × 100 = 1,000,000 cm³.',
      hint: 'Not quite. Picture the 1 m cube in 1 cm cubes. How many in a row, in a layer, and how many layers?',
      hints: { '100 cm³': 'Not quite. That uses the length\'s factor, 100. It is only one row of 1 cm cubes along the bottom edge.',
        '10,000 cm³': 'Not quite. 100 × 100 = 10,000 fills only one layer, 1 cm tall. The cube is 100 layers tall.' } },
    { kind: 'pick', pic: 'litres', opts: ['900 L', '9,000 L', '9,000,000 L'], want: '9,000 L', slips: { '900 L': 'hundred', '9,000,000 L': 'cm3' }, fb: 1.7, at: LITRES, name: 'm³ to litres',
      task: 'The tank from step 2 holds 9 m³. How many litres is that?',
      why: 'Each m³ holds 10 × 10 × 10 = 1,000 litre cubes, so 9 m³ is 9 × 1,000 = 9,000 L.',
      hint: 'Not quite. How many litres fill 1 m³?',
      hints: { '900 L': 'Not quite. That multiplies by 100, as for a length. 10 litre cubes fit along each edge of a 1 m cube, so 10 × 10 × 10 fill it.',
        '9,000,000 L': 'Not quite. That counts 1 cm cubes, which are cm³. A litre is a whole 10 cm cube, 1,000 cm³.' } },
    { show: true, demo: 'drum', dur: 3.7, grip: 'length', name: 'Cylinders',
      text: 'A *cylinder* works the same way, its round end of πr² sliding along its length. A drum 1 m across and 2 m long holds π × 0.5² × 2 = 1.57 m³. Drag its end.' },
    { kind: 'pick', pic: 'round', opts: ['2.26 m³', '7.54 m³', '9.05 m³'], want: '2.26 m³', slips: { '9.05 m³': 'diam', '7.54 m³': 'side' }, fb: 2.2, at: ROUND, name: 'A round tank',
      task: 'An example round tank is 1.2 m across and 2 m tall. How many m³ does it hold?',
      why: 'Halve 1.2 m for the radius, 0.6 m. The round base is π × 0.6² = 1.13 m², and it rises 2 m, so π × 0.6² × 2 = 2.26 m³.',
      hint: 'Not quite. Find the radius, then the round base\'s area, then multiply by the height.',
      hints: { '9.05 m³': 'Not quite. That puts 1.2 m into πr², but 1.2 m is the diameter. Halve it for the radius first.',
        '7.54 m³': 'Not quite. That is 2πr × the 2 m height, the area of the round side, in m². The space inside is the base\'s area, πr², times the height.' } },
    { show: true, demo: 'level', dur: 3.1, grip: 'level', name: 'A tank\'s table',
      text: 'On a ship, each tank comes with its own *sounding table*, giving the volume of liquid in it at each sounding, or depth. In this made-up box tank the liquid is a box, 6 m² × its depth. Drag the level.' },
    { kind: 'pick', pic: 'liquid', opts: ['4.8 L', '4,800 L', '9,000 L'], want: '4,800 L', slips: { '9,000 L': 'full', '4.8 L': 'nolitre' }, fb: 1.7, at: DEPTH, name: 'Liquid in a tank',
      task: 'The liquid in this example tank is 0.8 m deep. How many litres is it?',
      why: 'The liquid is a box too, 6 m² across the base and 0.8 m deep, so 6 × 0.8 = 4.8 m³. Each m³ is 1,000 L, so that is 4,800 L.',
      hint: 'Not quite. Multiply the base area by the liquid\'s depth, then change m³ to litres.',
      hints: { '9,000 L': 'Not quite. That is the whole tank, 1.5 m deep. Use the liquid\'s depth, 0.8 m.',
        '4.8 L': 'Not quite. 6 × 0.8 = 4.8 is in m³. Each m³ holds 1,000 L.' } },
    { kind: 'pick', pic: 'mass', opts: ['283.33 kg', '2,550 kg', '2,550,000 kg'], want: '2,550 kg', slips: { '283.33 kg': 'divide', '2,550,000 kg': 'litres' }, fb: 1.8, at: MASS, name: 'Mass from density',
      task: '*Density* is mass ÷ volume. An example tank holds 3 m³ of an oil of 850 kg per m³. What is the oil\'s mass?',
      why: 'Density is mass ÷ volume, so mass is density × volume. Each m³ of the oil has a mass of 850 kg, so 3 m³ has 850 × 3 = 2,550 kg.',
      hint: 'Not quite. Each m³ of the oil has a mass of 850 kg. How much do 3 of them have?',
      hints: { '283.33 kg': 'Not quite. That divides 850 by 3. Mass is density × volume, so multiply.',
        '2,550,000 kg': 'Not quite. That multiplies by 3,000 litres. The density is per m³, so use the 3 m³.' } },
    { show: true, demo: 'net', dur: 4.0, name: 'A box\'s net',
      text: 'Unfold a box and its six faces lie flat as a *net*. They come in three matching pairs, so the area of this box\'s whole outside, its *surface area*, is 2 × (6 + 3 + 2) = 22 m².' },
    { kind: 'pick', pic: 'sheet', opts: ['9 m³', '13.5 m²', '27 m²'], want: '27 m²', slips: { '13.5 m²': 'half', '9 m³': 'volume' }, fb: 1.6, at: PAIRS, name: 'Sheet for a tank',
      task: 'How much sheet covers the outside of the closed tank from step 2, 3 m by 2 m by 1.5 m?',
      why: 'Its net has three pairs of faces, 3 × 2 = 6 m², 3 × 1.5 = 4.5 m² and 2 × 1.5 = 3 m². So 2 × (6 + 4.5 + 3) = 27 m².',
      hint: 'Not quite. Add the areas of all six faces of its net.',
      hints: { '13.5 m²': 'Not quite. That counts three faces, one of each pair. Each face has a matching one opposite it.',
        '9 m³': 'Not quite. 3 × 2 × 1.5 = 9 m³ is the space inside. The sheet is an area, the six faces added.' } },
  ];
  const FINISH = 'A box or a cylinder holds its base area × its length, counted in unit cubes. A litre is a 10 cm cube, so 1 m³ holds 1,000 L and 1,000,000 cm³. Volume × density gives mass, and a box\'s six faces give its surface area.';
  // When each demonstration's parts arrive, in seconds after the screen opens (the screen itself takes
  // FADE to fade in, so nothing starts before it has settled); [start, gap, count] for parts counted one
  // at a time. layers: the base with its sum; the layers drop in one at a time; the sum. litre: one litre
  // cube; a row of 10 grows along the edge, the readout swapping to 10 L as it lands (ro1); it spreads back
  // into a layer of 100 (ro2); the layers rise to 1,000, and the sum. drum: the round end, face on, with its area; it turns side on; it slides along 2 m; the sum.
  // level: the liquid rises a quarter metre at a time, its row of the table lighting up as it lands; its
  // base area. net: the box; it unfolds; the edges' lengths; each pair's areas, the readout counting to
  // the sum.
  const FADE = 0.35;
  const AT = {
    layers: { base: 0.6, lay: [1.1, 0.45, 5], sum: 3.4 },
    litre: { cube: 0.6, row: 1.1, ro1: 1.6, layer: 2.1, ro2: 2.6, stack: 3.1, sum: 3.6 },
    drum: { face: 0.6, turn: 1.2, slide: 2.0, sum: 3.1 },
    level: { hop: [0.6, 0.45, 4], area: 2.45 },
    net: { box: 0.6, unfold: 1.1, edges: 2.4, pair: [2.9, 0.25, 3] },
  };
  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  // While the kit's self-test looks at every screen it switches fades off (the k-testing class):
  // demonstrations then open finished, as they do with reduced motion.
  const testing = () => document.documentElement.classList.contains('k-testing');

  // ---------- numbers (pure, so the checks can test them) ----------
  const r3 = (v) => Math.round(v * 1000) / 1000;
  // Answers with π are rounded to 2 decimal places.
  const r2 = (v) => Math.round(v * 100) / 100;
  const num = (v) => { const a = r3(v), p = String(Math.abs(a)).split('.'); return (a < 0 ? '−' : '') + p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (p[1] ? '.' + p[1] : ''); };
  const amt = (v, u) => num(v) + ' ' + u;
  const sq = (v) => v * v;
  const boxVol = (b) => b.l * b.w * b.h;
  const cylVol = (d, len) => Math.PI * sq(d / 2) * len;
  // A closed box's faces: three pairs, length × width, length × height and width × height.
  const facesArea = (b) => [b.l * b.w, b.l * b.h, b.w * b.h];
  const surface = (b) => 2 * facesArea(b).reduce((s, a) => s + a, 0);
  // What each slip makes of an answer, as its button reads.
  function slipOpt(d, s) {
    const V = boxVol(TANK), base = TANK.l * TANK.w, liq = base * LIQ;
    if (d.pic === 'tank') return amt(1, 'm');                     // one layer of 1 m cubes only
    if (d.pic === 'million') return s === 'row' ? amt(CM_PER_M, 'cm³') : amt(sq(CM_PER_M), 'cm³');
    if (d.pic === 'litres') return s === 'hundred' ? amt(V * CM_PER_M, 'L') : amt(V * CM_PER_M * CM_PER_M * CM_PER_M, 'L');
    if (d.pic === 'round') return s === 'diam' ? amt(r2(Math.PI * sq(RTANK.d) * RTANK.h), 'm³') : amt(r2(2 * Math.PI * (RTANK.d / 2) * RTANK.h), 'm³');
    if (d.pic === 'liquid') return s === 'full' ? amt(V * L_PER_M3, 'L') : amt(liq, 'L');
    if (d.pic === 'mass') return s === 'divide' ? amt(r2(OIL.rho / OIL.v), 'kg') : amt(OIL.rho * OIL.v * L_PER_M3, 'kg');
    return s === 'half' ? amt(surface(TANK) / 2, 'm²') : amt(V, 'm³');
  }
  // The answer a puzzle wants, worked out by its rule, as its button reads.
  function answerOf(d) {
    if (d.pic === 'tank') return amt(boxVol(TANK) / (TANK.l * TANK.w), 'm');
    if (d.pic === 'million') return amt(CM_PER_M * CM_PER_M * CM_PER_M, 'cm³');
    if (d.pic === 'litres') return amt(boxVol(TANK) * L_PER_M3, 'L');
    if (d.pic === 'round') return amt(r2(cylVol(RTANK.d, RTANK.h)), 'm³');
    if (d.pic === 'liquid') return amt(TANK.l * TANK.w * LIQ * L_PER_M3, 'L');
    if (d.pic === 'mass') return amt(OIL.rho * OIL.v, 'kg');
    return amt(surface(TANK), 'm²');
  }
  // As a screen reader says it.
  const say = (s) => String(s).replace(/(\d),(\d{3})/g, '$1$2').replace(/(\d),(\d{3})/g, '$1$2')
    .replace(/cm³/g, 'cubic centimetres').replace(/m³/g, 'cubic metres').replace(/m²/g, 'square metres')
    .replace(/(\d) cm\b/g, '$1 centimetres').replace(/(\d) m\b/g, '$1 metres').replace(/(\d) L\b/g, '$1 litres').replace(/(\d) kg\b/g, '$1 kilograms')
    .replace(/(^|[^\d.])1 (cubic |square )?(centi)?metres/g, '$11 $2$3metre').replace(/(^|[^\d.])1 litres/g, '$11 litre')
    .replace(/π/g, ' pi ').replace(/²/g, ' squared').replace(/³/g, ' cubed')
    .replace(/×/g, ' times ').replace(/÷/g, ' divided by ').replace(/−/g, ' minus ').replace(/\+/g, ' plus ').replace(/=/g, ' equals ').replace(/[()]/g, ' ').replace(/\s+/g, ' ').trim();

  function blank(i) { return { pick: null, res: null, why: false, v: null, moved: false }; }
  const emptyFor = (i, st) => (STEPS[i].kind === 'drag' ? (st.moved ? '' : PLACE) : st.pick != null ? '' : PICK);
  const isEmpty = (i, st) => !!emptyFor(i, st);
  const isRight = (i, st) => !isEmpty(i, st) && st.pick === STEPS[i].want;
  // A wrong answer's hint names its slip.
  const hintFor = (i, st) => { const d = STEPS[i]; return (d.hints && d.hints[st.pick]) || d.hint; };
  // A step answered right (the timing check draws each one this way), or with a slip.
  function solved(i) { const d = STEPS[i], st = blank(i); st.res = 'right'; st.moved = true; st.pick = d.want; if (d.kind === 'drag') st.v = parseFloat(d.want); return st; }
  function slipped(i, o) { const d = STEPS[i], st = blank(i); st.res = 'wrong'; st.moved = true; st.pick = o; if (d.kind === 'drag') st.v = parseFloat(o); return st; }

  let S = STEPS.map((d, i) => blank(i));
  let finished = false, lastStep = -1, lastDone = false, T = Infinity;   // T: seconds into the current motion
  let motion = null, motionEnd = 0;                                      // what is moving: 'demo' or 'fb'

  // ---------- text with amber key terms (built with K.el, never innerHTML) ----------
  function pieces(el, text) {
    const re = /\*([^*]+)\*/g;
    let at = 0, m;
    while ((m = re.exec(text))) {
      if (m.index > at) el.appendChild(document.createTextNode(text.slice(at, m.index)));
      el.appendChild(K.el('span', { class: 'term' }, m[1]));
      at = m.index + m[0].length;
    }
    if (at < text.length) el.appendChild(document.createTextNode(text.slice(at)));
  }
  // An amount or a sum stays together on one line ("1,000 L", "π × 0.5² × 2 = 1.57 m³",
  // "2 × (6 + 3 + 2) = 22 m²"), with the stop after it; a long one may break only before an equals sign.
  const TOK = '(?:2?π|\\(?\\d[\\d,]*(?:\\.\\d+)?[²³]?\\)?(?: (?:cm³|m³|cm²|m²|cm|m|L|kg)(?![A-Za-z²³]))?)';
  const GLUE = new RegExp('(?<![A-Za-z0-9\'’-])' + TOK + '(?: [=+−×÷] ' + TOK + ')*[.,?!;]?', 'g');
  function write(el, text) {
    el.textContent = '';
    let at = 0, m;
    GLUE.lastIndex = 0;
    while ((m = GLUE.exec(text))) {
      if (m.index > at) pieces(el, text.slice(at, m.index));
      const bits = m[0].length > 18 ? m[0].split(/ (?==)/) : [m[0]];
      bits.forEach((b, k) => {
        if (k) el.appendChild(document.createTextNode(' '));
        if (/ /.test(b)) el.appendChild(K.el('span', { class: 'nw' }, b)); else el.appendChild(document.createTextNode(b));
      });
      at = m.index + m[0].length;
    }
    if (at < text.length) pieces(el, text.slice(at));
  }

  // ---------- controls ----------
  const stepper = K.stepper({ id: 'step', label: 'Step', steps: STEPS.map((d) => d.name), value: 0, compact: true, into: '#prog' });
  const nav = document.getElementById('nav');
  const here = () => stepper.get();

  // Up to three answer buttons; each step fills in its own options.
  const pickBtns = [0, 1, 2].map((k) => K.button({ label: 'Answer ' + (k + 1), secondary: true, into: '#picks', press: () => {
    const i = here(), d = STEPS[i], st = S[i];
    if (finished || d.show || !d.opts || k >= d.opts.length || st.res === 'right') return;
    st.pick = d.opts[k]; st.res = null;
  } }));

  // Check: marks the answer; a right one plays its picture's motion, a wrong one shows its slip.
  const checkBtn = K.button({ label: 'Check', into: '#acts', press: () => {
    const i = here(), d = STEPS[i], st = S[i];
    if (d.show || finished) return;
    if (isEmpty(i, st)) { st.res = 'empty'; return; }
    st.res = isRight(i, st) ? 'right' : 'wrong';
    if (st.res === 'right') play(d.fb, 'fb'); else play(WRONG_DUR, 'fb');
  } });
  const whyBtn = K.button({ label: 'Why?', secondary: true, into: '#acts', press: () => {
    if (STEPS[here()].show || finished) return;
    const st = S[here()]; st.why = !st.why;
  } });
  const replayBtn = K.button({ label: 'Play again', secondary: true, into: '#replay', press: () => {
    const i = here(), d = STEPS[i];
    if (!d.show || finished) return;
    S[i].moved = false; S[i].v = null;
    play(d.dur, 'demo');
  } });
  const backBtn = K.button({ label: 'Back', secondary: true, into: '#nav', press: () => {
    if (finished) { finished = false; return; }
    stepper.set(Math.max(0, here() - 1), true);
  } });
  const nextBtn = K.button({ label: 'Continue', into: '#nav', press: () => {
    const i = here();
    if (finished || (!STEPS[i].show && S[i].res !== 'right')) return;
    if (i < STEPS.length - 1) { stepper.set(i + 1, true); return; }
    finished = true;
    if (typeof K.complete === 'function') K.complete();
  } });
  const againBtn = K.button({ label: 'Start again', secondary: true, into: '#again', press: () => {
    S = STEPS.map((d, i) => blank(i)); finished = false; lastStep = -1; stepper.set(0, true);
  } });

  // One animation plays each demonstration and the motion after an answer, from its start; with
  // reduced motion (and while the self-test looks) it opens finished.
  const anim = K.anim({ button: false, label: 'Demonstration', step: (dt) => {
    if (finished) return false;
    T += dt;
    paint();
    return T < motionEnd;
  } });
  // The kit pauses the motion while the page is hidden (Dan switches app or locks the phone) and
  // resumes it when he comes back; this only settles a motion that had already stopped.
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !anim.playing() && T !== Infinity) { T = Infinity; paint(); } });
  function play(dur, kind) {
    motion = kind;
    if (REDUCE || testing()) { T = Infinity; anim.pause(); paint(); return; }
    motionEnd = dur; T = 0; anim.play();
  }
  // A new screen (or the finish panel) fades in softly: the CSS animation restarts on it.
  function enter(id) {
    if (REDUCE) return;
    const box = document.getElementById(id);
    box.classList.remove('enter');
    void box.offsetWidth;
    box.classList.add('enter');
  }

  // ---------- drawing ----------
  // Solids are drawn in metres: x along, y up, z back, the back drawn up and to the right (KX, KY of a
  // metre for each metre back). Each picture has its own frame: Q units a metre, the front bottom left
  // corner at (ox, by), H tall. The readout sits on the row YNY.
  const YNY = 24, KX = 0.5, KY = 0.3, E = 0.32;      // E: how round ends squash when seen from the side
  const LAY = {
    layers: { Q: 34, ox: 84, by: 246, H: 272 },     // the base of 1 m squares and its layers
    tank: { Q: 56, ox: 58, by: 200, H: 228 },       // the box tank
    tankd: { Q: 48, ox: 60, by: 214, H: 240 },      // the box tank whose top Dan drags, up to 2.5 m deep
    litre: { Q: 150, ox: 62, by: 246, H: 274 },     // a 1 m cube, in litres or cm
    tank5: { Q: 30, ox: 50, by: 200, H: 244 },      // the box tank, small, beside a 1 m cube drawn larger (CUBE5)
    drum: { Q: 76, ox: 72, by: 132, H: 200 },       // the drum on its side: its left end's centre
    round: { Q: 80, ox: 150, by: 236, H: 272 },     // the round tank standing: its base's centre
    level: { Q: 33, ox: 58, by: 200, H: 228 },      // the box tank beside its table
    oil: { Q: 70, ox: 48, by: 196, H: 224 },        // three 1 m cubes of oil
    net: { Q: 34, ox: 170, by: 252, H: 278 },       // the 3 m by 2 m by 1 m box, unfolded about x = ox
    net2: { Q: 30, ox: 170, by: 250, H: 276 },      // the tank, unfolded
  };
  const CUBE5 = { Q: 86, ox: 194, by: 200 };
  const LAY_OF = { layers: 'layers', litre: 'litre', drum: 'drum', level: 'level', net: 'net', tank: 'tankd', million: 'litre', litres: 'tank5', round: 'round', liquid: 'tank', mass: 'oil', sheet: 'net2' };
  const svg = document.getElementById('scene'), art = document.getElementById('art'), hits = document.getElementById('hits');
  let F = LAY.layers, H = F.H;
  // Draw in another frame for a moment (the metre cube beside the tank).
  function within(fr, draw) { const keep = F; F = Object.assign({}, F, fr); try { draw(); } finally { F = keep; } }
  const P3 = (x, y, z) => [F.ox + F.Q * (x + z * KX), F.by - F.Q * (y + z * KY)];
  const gx = (x) => F.ox + F.Q * x;
  const gy = (y) => F.by - F.Q * y;
  let into = null;                                   // where shapes go: the picture, or a part that is arriving
  const add = (node) => (into || art).appendChild(node);
  // How far a part due at t0 has arrived (K.arrive), noting the timetable for the timing check.
  let latest = 0, earliest = Infinity;
  function note(t0, d) { if (t0 + d > latest) latest = t0 + d; if (t0 < earliest) earliest = t0; }
  function arr(t0, d) { d = d == null ? K.SOFT : d; note(t0, d); return K.arrive(T, t0, d); }
  // A steady run from t0 over d seconds, 0 -> 1; grow: the same, eased.
  function lin(t0, d) { note(t0, d); return T === Infinity ? 1 : K.clamp((T - t0) / d, 0, 1); }
  const grow = (t0, d) => K.ease(lin(t0, d == null ? GROW : d));
  // The kth of a counted run of parts [start, gap].
  const nth = (A, k) => A[0] + A[1] * k;
  // A part arriving: drawn into a group faded in to a and risen `rise` units into place (a negative rise
  // drops it from above); nothing before it starts.
  function part(a, rise, draw) {
    if (a <= 0) return;
    const g = add(K.svg('g'));
    K.fade(g, a, rise);
    const keep = into; into = g; draw(); into = keep;
  }
  // A part leaving: faded out as a goes 0 -> 1.
  function leave(a, draw) {
    if (a >= 1) return;
    const g = add(K.svg('g'));
    K.fade(g, 1 - a, 0);
    const keep = into; into = g; draw(); into = keep;
  }
  // One thing giving way to another at arrival a: the first fades out over the first half, and only then
  // the second fades in, so the two never sit over each other.
  function swap(a, from, to, rise) { leave(Math.min(1, a * 2), from); part(Math.max(0, a * 2 - 1), rise == null ? 4 : rise, to); }
  const rect = (cls, x, y, w, h, rx) => add(K.svg('rect', { class: cls, x: r3(x), y: r3(y), width: Math.max(0, r3(w)), height: Math.max(0, r3(h)), rx: rx || 0 }));
  const line = (cls, x1, y1, x2, y2) => add(K.svg('line', { class: cls, x1: r3(x1), y1: r3(y1), x2: r3(x2), y2: r3(y2) }));
  const circle = (cls, cx, cy, r) => add(K.svg('circle', { class: cls, cx: r3(cx), cy: r3(cy), r: r }));
  const path = (cls, d) => add(K.svg('path', { class: cls, d: d }));
  function mtext(x, y, s, cls, anchor, parent) {
    const t = K.svg('text', { class: cls, x: r3(x), y: r3(y), 'text-anchor': anchor || 'middle' });
    t.textContent = String(s);
    return parent ? parent.appendChild(t) : add(t);
  }
  const text = (x, y, s, cls, anchor) => mtext(x, y, s, cls, anchor);
  // The width of a line of text (measured once it can be; estimated while the scene is hidden).
  const widths = {};
  const SIZE = { ro: 20, an: 13, lbl: 13, rou: 13, axv: 13 };
  function tw(s, cls) {
    const key = cls + '|' + s;
    if (widths[key]) return widths[key];
    const t = mtext(0, -50, s, cls, 'start', svg);
    let w = 0;
    try { w = t.getComputedTextLength(); } catch (e) { w = 0; }
    svg.removeChild(t);
    if (w > 0) { widths[key] = w; return w; }
    return String(s).length * (SIZE[cls.split(' ')[0]] || 14) * 0.6;
  }

  // --- solids ---
  const pathOf = (pts) => 'M' + pts.map((p) => r3(p[0]) + ' ' + r3(p[1])).join('L') + 'Z';
  const openOf = (pts) => 'M' + pts.map((p) => r3(p[0]) + ' ' + r3(p[1])).join('L');
  const on3 = (c) => P3(c[0], c[1], c[2]);
  const face = (cls, corners) => path(cls, pathOf(corners.map(on3)));
  function seg3(cls, a, b) { const p = on3(a), q = on3(b); line(cls, p[0], p[1], q[0], q[1]); }
  // A box from (x0, y0, z0) to (x1, y1, z1): its faces' corners.
  function facesOf(b) {
    const x0 = b[0], y0 = b[1], z0 = b[2], x1 = b[3], y1 = b[4], z1 = b[5];
    return { front: [[x0, y0, z0], [x1, y0, z0], [x1, y1, z0], [x0, y1, z0]], top: [[x0, y1, z0], [x1, y1, z0], [x1, y1, z1], [x0, y1, z1]],
      side: [[x1, y0, z0], [x1, y0, z1], [x1, y1, z1], [x1, y1, z0]], bottom: [[x0, y0, z0], [x1, y0, z0], [x1, y0, z1], [x0, y0, z1]] };
  }
  // The whole multiples of s strictly between a0 and a1.
  function cuts(a0, a1, s) { const out = []; for (let k = Math.floor(a0 / s + 1e-9) + 1; k * s < a1 - 1e-9; k++) out.push(k * s); return out; }
  // The lines between unit cubes (every s metres, counted from 0) on a box's three faces seen (its front
  // and top only, if `front`: a cube with another beside it).
  function cubeLines(b, s, cls, front) {
    const x0 = b[0], y0 = b[1], z0 = b[2], x1 = b[3], y1 = b[4], z1 = b[5], d = [];
    const L = (a, c) => { const p = on3(a), q = on3(c); d.push('M' + r3(p[0]) + ' ' + r3(p[1]) + 'L' + r3(q[0]) + ' ' + r3(q[1])); };
    cuts(x0, x1, s).forEach((x) => { L([x, y0, z0], [x, y1, z0]); L([x, y1, z0], [x, y1, z1]); });
    cuts(y0, y1, s).forEach((y) => { L([x0, y, z0], [x1, y, z0]); if (!front) L([x1, y, z0], [x1, y, z1]); });
    cuts(z0, z1, s).forEach((z) => { L([x0, y1, z], [x1, y1, z]); if (!front) L([x1, y0, z], [x1, y1, z]); });
    if (d.length) path(cls || 'gc', d.join(''));
  }
  // The lines between unit squares on a floor at height y.
  function floorLines(b, s, cls) {
    const x0 = b[0], y = b[1], z0 = b[2], x1 = b[3], z1 = b[5], d = [];
    const L = (a, c) => { const p = on3(a), q = on3(c); d.push('M' + r3(p[0]) + ' ' + r3(p[1]) + 'L' + r3(q[0]) + ' ' + r3(q[1])); };
    cuts(x0, x1, s).forEach((x) => L([x, y, z0], [x, y, z1]));
    cuts(z0, z1, s).forEach((z) => L([x0, y, z], [x1, y, z]));
    if (d.length) path(cls || 'gc', d.join(''));
  }
  // A solid box: its three faces seen, tinted (fc), ruled into cubes every s metres (if s), edged.
  function solid(b, fc, s, ec) {
    const f = facesOf(b);
    face(fc, f.front); face(fc + ' ft', f.top); face(fc + ' fs', f.side);
    if (s) cubeLines(b, s);
    [f.front, f.top, f.side].forEach((c) => face(ec || 'shp thin', c));
  }
  // A see-through box (a tank): the three edges behind it dashed, and its outline.
  function behind(b) { const x0 = b[0], y0 = b[1], z0 = b[2], x1 = b[3], y1 = b[4], z1 = b[5]; seg3('hid', [x0, y0, z1], [x1, y0, z1]); seg3('hid', [x0, y0, z0], [x0, y0, z1]); seg3('hid', [x0, y0, z1], [x0, y1, z1]); }
  function outline(b, cls) { const f = facesOf(b); [f.front, f.top, f.side].forEach((c) => face(cls || 'shp', c)); }
  // Points round an ellipse centred (cx, cy) from angle a0 to a1 (0 points right, π/2 down).
  function ell(cx, cy, rx, ry, a0, a1, n) { const out = []; n = n || 36; for (let k = 0; k <= n; k++) { const a = a0 + (a1 - a0) * k / n; out.push([cx + rx * Math.cos(a), cy + ry * Math.sin(a)]); } return out; }
  const oval = (cls, cx, cy, rx, ry) => path(cls, pathOf(ell(cx, cy, rx, ry, 0, 2 * Math.PI, 48).slice(0, -1)));
  const arc = (cls, cx, cy, rx, ry, a0, a1) => path(cls, openOf(ell(cx, cy, rx, ry, a0, a1, 24)));

  // --- labels and the readout ---
  // A length beside a box: under its front edge, left of its front upright edge, or right of its bottom
  // edge going back.
  const below = (x0, x1, s, dy) => text((gx(x0) + gx(x1)) / 2, F.by + (dy || 18), s, 'lbl');
  const leftOf = (y0, y1, s, dx) => text(F.ox - (dx || 8), (gy(y0) + gy(y1)) / 2 + 5, s, 'lbl', 'end');
  function backOf(x, w, s) { const p = P3(x, 0, w / 2); text(p[0] + 10, p[1] + 7, s, 'lbl', 'start'); }
  // A label on a patch of the page (centred on x), so the lines it sits over stay clear of it.
  function plabel(x, y, s, cls) { const w = tw(s, cls); rect('patch', x - w / 2 - 4, y - 13, w + 8, 18, 4); text(x, y, s, cls); }
  // The readout on the row above the picture: what it comes to (big) after the sum that gives it (small).
  function readout2(big, small, warn) {
    const w = warn ? ' warnt' : '';
    text(338, YNY, big, 'ro' + w, 'end');
    if (small) text(338 - tw(big, 'ro') - 8, YNY - 1, small, 'rou' + w, 'end');
  }
  const readoutHidden = (u) => text(338, YNY, '? ' + u, 'ro q', 'end');
  // The part Dan moves: a dot, with a soft ring while it can be moved.
  function handle(p, live) { if (live) circle('ringp', p[0], p[1], 15); circle('pt', p[0], p[1], 6); }
  let gripAt = null;                                 // where the grip sits this frame (on the page), if anywhere

  // --- the demonstrations (SHOW steps), drawn at time T ---
  // Layers of cubes: the base of 1 m squares, tinted, with its area; the layers of 12 cubes drop in one
  // at a time, the readout counting; the sum. Once it has played, Dan drags the top, 1 to 5 layers.
  function demoLayers(i, d, st) {
    const A = AT.layers, moved = st.moved && st.v != null, live = T === Infinity;
    const ba = moved ? 1 : arr(A.base), las = [];
    for (let k = 0; k < BASE.n; k++) las.push(arr(nth(A.lay, k), LAY_T));
    const sa = moved ? 1 : arr(A.sum), h = moved ? st.v : BASE.n, got = moved ? h : las.filter((a) => a >= 0.5).length, area = BASE.l * BASE.w;
    const floor = [0, 0, 0, BASE.l, 0, BASE.w];
    part(ba, 0, () => {
      face('base', facesOf(floor).bottom); floorLines(floor, 1); face('shp thin', facesOf(floor).bottom);
      below(0, BASE.l, amt(BASE.l, 'm')); backOf(BASE.l, BASE.w, amt(BASE.w, 'm'));
    });
    if (moved) solid([0, 0, 0, BASE.l, h, BASE.w], 'cube', 1);
    else las.forEach((a, k) => part(a, -8, () => solid([0, k, 0, BASE.l, k + 1, BASE.w], 'cube', 1)));
    part(sa, 0, () => leftOf(0, h, amt(h, 'm')));
    const counted = () => readout2(amt(got * area, 'm³'), got === 1 ? 'one layer' : got + ' layers of ' + area);
    const total = () => readout2(amt(h * area, 'm³'), area + ' × ' + h + ' =');
    if (moved) total();
    else if (sa > 0) swap(sa, counted, total, 0);
    else if (got) counted();
    else part(ba, 0, () => readout2(amt(area, 'm²'), BASE.l + ' × ' + BASE.w + ' ='));
    gripAt = P3(BASE.l, h, 0);
    part(sa, 0, () => handle(gripAt, live));
    const said = ['A base 4 metres by 3 metres, ruled into 12 one-metre squares.'];
    if (got) said.push(got + (got === 1 ? ' layer' : ' layers') + ' of 12 one-metre cubes ' + (got === 1 ? 'sits' : 'are stacked') + ' on it, ' + say(amt(got * area, 'm³')) + '.');
    if (sa >= 0.5) said.push(area + ' times ' + h + ' equals ' + say(amt(h * area, 'm³')) + '.');
    said.push('The top can be dragged up or down a layer at a time.');
    return said.join(' ');
  }
  // A litre: one 10 cm cube in the corner of a 1 m cube; a row of 10 grows along the bottom edge; it
  // spreads back into a layer of 100; the layers rise to fill it, 1,000. The readout holds each count while
  // the next stage grows, and swaps to the new one as it lands (1 L, 10 L, 100 L, then 10 × 10 × 10 =
  // 1,000 L). The first litre stays picked out.
  function demoLitre(i, d) {
    const A = AT.litre, ca = arr(A.cube), er = grow(A.row), el = grow(A.layer), es = grow(A.stack);
    const r1 = arr(A.ro1), r2a = arr(A.ro2), sa = arr(A.sum);
    const cube = [0, 0, 0, 1, 1, 1], t = 1 / L_EDGE;
    behind(cube);
    cubeLines(cube, t, 'gl2');
    const x1 = t + (1 - t) * er, z1 = t + (1 - t) * el, y1 = t + (1 - t) * es;
    part(ca, 0, () => {
      solid([0, 0, 0, x1, y1, z1], 'cube', t);
      face('one', facesOf([0, 0, 0, t, t, 0]).front);
      leftOf(0, t, '10 cm');
    });
    outline(cube);
    below(0, 1, amt(1, 'm')); leftOf(0, 1, amt(1, 'm')); backOf(1, 1, amt(1, 'm'));
    const one = () => readout2(amt(1, 'L'), 'a 10 cm cube');
    const row = () => readout2(amt(L_EDGE, 'L'), 'one row');
    const layer = () => readout2(amt(L_EDGE * L_EDGE, 'L'), 'one layer, 10 × 10');
    const all = () => readout2(amt(L_PER_M3, 'L'), '10 × 10 × 10 =');
    if (sa > 0) swap(sa, layer, all, 0);
    else if (r2a > 0) swap(r2a, row, layer, 0);
    else if (r1 > 0) swap(r1, one, row, 0);
    else part(ca, 0, one);
    const said = ['A 1 metre cube, ruled into 10 centimetre cubes, 10 along each edge.'];
    if (ca >= 0.5) said.push('A 10 centimetre cube in its front bottom corner is 1 litre.');
    if (er >= 1) said.push('A row of 10 litres runs along the bottom edge.');
    if (el >= 1) said.push('10 rows make a layer of 100 litres.');
    if (es >= 1) said.push('10 layers fill it.');
    if (sa >= 0.5) said.push('10 times 10 times 10 equals 1000 litres in 1 cubic metre.');
