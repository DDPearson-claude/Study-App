<p class="caption">In a right-angled triangle, the squares on the shorter sides add up to the hypotenuse's square. Sizes are example values.</p>

<script>
  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // f: which triangle a step draws (FIGS below); th: its corner, if not a right angle. demo: what a SHOW
  // step plays (dur seconds). A 'pick' puzzle takes one answer, its picture `pic` ('area': unit squares
  // move in; 'len': the squares' areas, then the side; 'spill' and 'gap': unit squares that do not fit);
  // a 'drag' puzzle asks for the top corner to be put at the height `want`. fb: how long the motion after
  // a right answer plays; at: when each part of it arrives, in seconds after Check ([start, gap, count]
  // for parts counted one at a time). slips: which slip gives each wrong answer, and hints: what is said.
  const PICK = 'Tap one of the answers.', PLACE = 'Drag the top corner to its place first.';
  // After a right answer. MOVE: the 4 or 8 cm side's block of unit squares turns into the corner of the
  // longest side's square, then the other side's squares follow in four groups, then the sum. AREAS: one
  // known square's area, the other's, the square found from them, then the side (its root). GRIDA: the
  // hypotenuse's length, then the sum.
  const MOVE = { blk: 0.1, cells: [0.6, 0.2, 4], ro: 1.7 };
  const AREAS = { a1: 0.1, a2: 0.6, fill: 1.1, side: 1.6 };
  const GRIDA = { side: 0.1, ro: 0.6 };
  // After a wrong answer: the slip, in the warning colour.
  const WRONG = { slip: 0.1 }, WRONG_DUR = 0.7;
  // How long the block takes to travel, each group of unit squares, a counted tile, and the corner's swing.
  const BLK_T = 0.8, CELL_T = 0.6, COUNT = 0.3, SWING_T = 1.2, GROUPS = 4;

  // The triangles, in their own units: side p runs from the corner C at angle th (90 unless given) and
  // side q along from C; m turns or flips the whole figure. All the sizes are example values.
  const DEG = Math.PI / 180;
  const turn = (a) => [Math.cos(a * DEG), -Math.sin(a * DEG), Math.sin(a * DEG), Math.cos(a * DEG)];
  const FIGS = {
    f43: { p: 4, q: 3, u: 'cm', cells: true, range: [70, 110] },
    f86: { p: 8, q: 6, u: 'cm', cells: true, at: { p: [0.8] } },
    f125: { p: 12, q: 5, u: 'cm', at: { p: [0.25] } },
    // turned so the hypotenuse lies along the bottom and the right angle points up
    f912: { p: 9, q: 12, u: 'cm', m: turn(180 + Math.atan2(9, 12) / DEG), at: { p: [0.55], q: [0.55] } },
    // the 8 cm and 7 cm sides opened until the third side is 11 cm
    f87: { p: 8, q: 7, u: 'cm', cells: true, c: 11, at: { p: [0.8] } },
    // a shelf bracket: the right angle at the top left, the brace running down to the left
    f2030: { p: 30, q: 20, u: 'cm', m: [1, 0, 0, -1], at: { p: [0.3] } },
    // turned so the hypotenuse stands upright on the left and the right angle points right
    f152: { p: 1.5, q: 2, u: 'm', m: turn(90 + Math.atan2(1.5, 2) / DEG) },
  };
  // at: where along a side its length's badge would rather go (from C, or from A for the third side),
  // so the third side's badge can keep its middle.
  // The corner that makes the third side c long, for a figure given by its three sides.
  FIGS.f87.th = Math.acos((FIGS.f87.p * FIGS.f87.p + FIGS.f87.q * FIGS.f87.q - FIGS.f87.c * FIGS.f87.c) / (2 * FIGS.f87.p * FIGS.f87.q)) / DEG;
  // The corner on the screen where it can be dragged: from 70 to 110 in steps of 5, a right angle at 90.
  const TH = { min: 70, max: 110, by: 5, open: 110 };

  const STEPS = [
    { show: true, demo: 'fit', f: 'f43', dur: 3.9, name: 'Squares on the sides',
      text: 'Draw a square on each side of a right-angled triangle. The 16 and 9 unit squares on the shorter sides move into the longest side\'s square and fill it. That is *Pythagoras\' theorem*.' },
    { kind: 'pick', pic: 'area', f: 'f86', opts: ['196 cm²', '100 cm²', '28 cm²'], want: '100 cm²', slips: { '196 cm²': 'sumsq', '28 cm²': 'diff' }, fb: 2.3, at: MOVE, long: true, name: 'The biggest square',
      task: 'In this right-angled triangle, the squares on the shorter sides cover 64 cm² and 36 cm². How much does the square on the longest side cover?',
      why: 'The pieces of the two smaller squares fill the square on the longest side exactly. So it covers 64 + 36 = 100 cm².',
      hint: 'Not quite. The two smaller squares together fill the biggest one.',
      hints: { '196 cm²': 'Not quite. That squares 8 + 6 = 14, but the longest side is shorter than the other two together. Add the two areas instead.',
        '28 cm²': 'Not quite. That takes 36 from 64. The two smaller squares together fill the biggest one, so add them.' } },
    { show: true, demo: 'root', f: 'f43', dur: 3.3, name: 'The hypotenuse',
      text: 'The longest side, opposite the right angle, is the *hypotenuse*. Its square holds 25 unit squares, 5 along each edge, so the side is √25 = 5 cm.' },
    { kind: 'pick', pic: 'len', find: 'hyp', f: 'f125', opts: ['17 cm', '169 cm', '13 cm'], want: '13 cm', slips: { '17 cm': 'add', '169 cm': 'noroot' }, fb: 2.2, at: AREAS, name: 'Find the hypotenuse',
      task: 'A right-angled triangle\'s shorter sides are 12 cm and 5 cm. How long is its hypotenuse?',
      why: 'Square the shorter sides and add. 144 + 25 = 169 cm² is the hypotenuse\'s square, and the square root undoes the square, so the hypotenuse is √169 = 13 cm.',
      hint: 'Not quite. Square both sides, add, then take the square root.',
      hints: { '17 cm': 'Not quite. That adds the lengths, 12 + 5. Add their squares instead, then take the square root.',
        '169 cm': 'Not quite. 144 + 25 = 169 is the area of the hypotenuse\'s square, in cm². Take its square root for the side.' } },
    { show: true, demo: 'less', f: 'f86', dur: 3.7, name: 'A shorter side',
      text: 'For a shorter side, take away. The hypotenuse\'s square holds 100, so 100 − 36 = 64 are left, an 8 by 8 square. The side is √64 = 8 cm.' },
    { kind: 'pick', pic: 'len', find: 'leg', f: 'f912', opts: ['12 cm', '17.49 cm', '6 cm'], want: '12 cm', slips: { '17.49 cm': 'addsq', '6 cm': 'sublen' }, fb: 2.2, at: AREAS, name: 'Which side?',
      task: 'This right-angled triangle has sides of 15 cm and 9 cm. How long is the third side?',
      why: 'The 15 cm side is opposite the right angle, so it is the hypotenuse. Take away, 225 − 81 = 144 cm², and √144 = 12 cm.',
      hint: 'Not quite. Find the hypotenuse first. It is opposite the right angle.',
      hints: { '17.49 cm': 'Not quite. That adds the squares, as if 15 cm were a shorter side. It is opposite the right angle, so take away instead.',
        '6 cm': 'Not quite. That takes 9 from 15. Take away the squares, 225 − 81, then take the square root.' } },
    { kind: 'drag', pic: 'grid', base: 8, hyp: 10, start: 3, top: 10, want: '6 cm', slips: { '2 cm': 'sublen', '10 cm': 'same' }, fb: 1.3, at: GRIDA, name: 'Make it fit',
      task: 'This triangle\'s base is 8 cm. Drag the top corner so the hypotenuse is 10 cm.',
      why: 'The hypotenuse\'s square is 10² = 100 and the base\'s is 8² = 64, leaving 36 for the upright side. √36 = 6, so the corner goes 6 cm up.',
      hint: 'Not quite. Take the base\'s square, 64, from the hypotenuse\'s, 100, then take the square root.',
      hints: { '2 cm': 'Not quite. That takes 8 from 10. Take away the squares instead, then take the square root.',
        '10 cm': 'Not quite. That makes the upright side 10 cm, but the hypotenuse is opposite the right angle. Take 8² from 10², then take the square root.' } },
    { show: true, demo: 'corner', f: 'f43', dur: 3.7, name: 'Only with a right angle',
      text: 'Pythagoras needs a right angle. Opened wider, the third side grows and the 25 unit squares leave a gap. Drag the dot at the top of the 4 cm side to try.' },
    { kind: 'pick', pic: 'spill', f: 'f43', th: 70, opts: ['5 cm', 'More than 5 cm', 'Less than 5 cm'], want: 'Less than 5 cm', slips: { '5 cm': 'pyth', 'More than 5 cm': 'way' }, fb: 2.3, at: MOVE, name: 'A narrower corner',
      task: 'These 4 cm and 3 cm sides meet at a corner narrower than a right angle. How long is the third side?',
      why: 'Pythagoras only works with a right angle. A narrower corner brings the ends closer, so the third side is less than 5 cm and the 25 unit squares spill over.',
      hint: 'Not quite. Picture the corner closing up from a right angle. Do the ends move apart or together?',
      hints: { '5 cm': 'Not quite. 5 cm needs a right angle. Picture this corner closing up from a right angle. Do its ends move apart or together?',
        'More than 5 cm': 'Not quite. A wider corner pushes the ends apart. This one is narrower than a right angle, so its ends are closer together.' } },
    { kind: 'pick', pic: 'gap', f: 'f87', opts: ['Yes, a right angle', 'No, it is wider', 'No, it is narrower'], want: 'No, it is wider', slips: { 'Yes, a right angle': 'looks', 'No, it is narrower': 'way' }, fb: 2.3, at: MOVE, name: 'A right angle?',
      task: 'A triangle\'s sides are 8 cm, 7 cm and 11 cm. Is the corner between the 8 cm and 7 cm sides a right angle?',
      why: '8² + 7² = 64 + 49 = 113, but 11² = 121 is more. So the corner is wider than a right angle, and the 113 unit squares leave a gap.',
      hint: 'Not quite. Compare 8² + 7² with 11².',
      hints: { 'Yes, a right angle': 'Not quite. It looks close, but 8² + 7² = 113 and 11² = 121. They do not match, so it is not a right angle.',
        'No, it is narrower': 'Not quite. 11² = 121 is more than 113, so the long side is too long for a right angle. A narrower corner would make it shorter.' } },
    { kind: 'pick', pic: 'len', find: 'hyp', f: 'f2030', qfirst: true, opts: ['50 cm', '36.06 cm', '1,300 cm'], want: '36.06 cm', slips: { '50 cm': 'add', '1,300 cm': 'noroot' }, fb: 2.2, at: AREAS, name: 'A shelf bracket',
      task: 'A shelf bracket\'s two arms meet at a right angle and are 20 cm and 30 cm long. How long is the brace between their ends?',
      why: 'The brace is opposite the right angle, so it is the hypotenuse. 20² + 30² = 400 + 900 = 1,300 cm², and √1,300 = 36.06 cm, to 2 decimal places.',
      hint: 'Not quite. Square both arms, add, then take the square root.',
      hints: { '50 cm': 'Not quite. That adds the lengths, 20 + 30. Add their squares, 400 + 900, then take the square root.',
        '1,300 cm': 'Not quite. 400 + 900 = 1,300 is the area of the brace\'s square, in cm². Its square root is the length.' } },
    { kind: 'pick', pic: 'len', find: 'leg', f: 'f152', opts: ['2.92 m', '1 m', '2 m'], want: '2 m', slips: { '2.92 m': 'addsq', '1 m': 'sublen' }, fb: 2.2, at: AREAS, long: true, name: 'One more side',
      task: 'This right-angled triangle has sides of 2.5 m and 1.5 m. How long is the third side?',
      why: 'The 2.5 m side is opposite the right angle, so it is the hypotenuse. Take away, 6.25 − 2.25 = 4 m², and √4 = 2 m.',
      hint: 'Not quite. Find the hypotenuse first. It is opposite the right angle.',
      hints: { '2.92 m': 'Not quite. That adds the squares, as if 2.5 m were a shorter side. It is opposite the right angle, so take away instead.',
        '1 m': 'Not quite. That takes 1.5 from 2.5. Take away the squares, 6.25 − 2.25, then take the square root.' } },
  ];
  const FINISH = 'In a right-angled triangle, the squares on the two shorter sides add up to the square on the hypotenuse, the side opposite the right angle. Square, add or take away, then take the square root. It works only with a right angle.';
  // When each demonstration's parts arrive, in seconds after the screen opens (the screen itself takes
  // FADE to fade in, so nothing starts before it has settled); [start, gap, count] for parts counted one
  // at a time. fit: the 16 unit squares, the 9, the 16 turn into the big square, the 9 follow in four
  // groups, the sum. root: the hypotenuse picked out, the tiles along its edge counted, its length. less:
  // the big square's 100, the 36 go back to the 6 cm side in four groups, the 8 by 8 block that is left
  // moves to the third side, its length. corner: the sum, the corner swings wider, the gap named.
  const FADE = 0.35;
  const AT = {
    fit: { c1: 0.6, c2: 1.1, blk: 1.6, cells: [2.1, 0.2, 4], ro: 3.3 },
    root: { hyp: 0.6, edge: [1.1, 0.25, 5], ro: 2.6 },
    less: { c: 0.6, cells: [1.1, 0.2, 4], blk: 2.2, ro: 3.0 },
    corner: { ro: 0.6, swing: 1.1, gap: 2.6, ring: 3.1 },
  };
  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  // While the kit's self-test looks at every screen it switches fades off (the k-testing class):
  // demonstrations then open finished, as they do with reduced motion.
  const testing = () => document.documentElement.classList.contains('k-testing');

  // ---------- numbers (pure, so the checks can test them) ----------
  const r3 = (v) => Math.round(v * 1000) / 1000;
  // A number as the lesson writes it: at most 2 decimal places, thousands with a comma.
  const num = (v) => { const s = (Math.round(v * 100) / 100).toFixed(2).replace(/\.?0+$/, ''), parts = s.split('.'); return parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (parts[1] ? '.' + parts[1] : ''); };
  const amt = (v, u) => num(v) + ' ' + u;
  const sq2 = (v) => num(v * v);
  // The figure's sides: the two at the corner (p, q) and the third (c), by the rule for a right angle or
  // as given; and what each puzzle's slips make of them.
  const sideC = (f) => (f.c != null ? f.c : Math.sqrt(f.p * f.p + f.q * f.q));
  const unitOf = (d) => (d.kind === 'drag' ? 'cm' : FIGS[d.f].u);
  function answerOf(d) {
    const f = FIGS[d.f] || {}, u = unitOf(d);
    if (d.pic === 'area') return amt(f.p * f.p + f.q * f.q, u + '²');
    if (d.pic === 'len' && d.find === 'hyp') return amt(Math.sqrt(f.p * f.p + f.q * f.q), u);
    if (d.pic === 'len') return amt(Math.sqrt(sideC(f) * sideC(f) - f.p * f.p), u);
    if (d.kind === 'drag') return amt(Math.sqrt(d.hyp * d.hyp - d.base * d.base), u);
    if (d.pic === 'spill') { const t = tri(f, d.th); return t.c < 5 - 1e-9 ? 'Less than 5 cm' : t.c > 5 + 1e-9 ? 'More than 5 cm' : '5 cm'; }
    const t = tri(f);   // gap: is c² equal to p² + q², or bigger (wider), or smaller (narrower)?
    const d2 = t.c * t.c - (f.p * f.p + f.q * f.q);
    return Math.abs(d2) < 1e-9 ? 'Yes, a right angle' : d2 > 0 ? 'No, it is wider' : 'No, it is narrower';
  }
  // sumsq: the sides added, then squared; diff: one area taken from the other; add: the lengths added;
  // noroot: the hypotenuse's square given as its length; addsq: the squares added when a shorter side is
  // missing; sublen: the lengths taken away; same: the upright side made the hypotenuse's length; pyth:
  // 5 cm with no right angle; way: the wrong way round; looks: taken as a right angle by eye.
  function slipOpt(d, s) {
    const f = FIGS[d.f] || {}, u = unitOf(d), c = d.kind === 'drag' ? d.hyp : sideC(f), p = d.kind === 'drag' ? d.base : f.p;
    if (s === 'sumsq') return amt((f.p + f.q) * (f.p + f.q), u + '²');
    if (s === 'diff') return amt(Math.abs(f.p * f.p - f.q * f.q), u + '²');
    if (s === 'add') return amt(f.p + f.q, u);
    if (s === 'noroot') return amt(f.p * f.p + f.q * f.q, u);
    if (s === 'addsq') return amt(Math.sqrt(c * c + p * p), u);
    if (s === 'sublen') return amt(c - p, u);
    if (s === 'same') return amt(d.hyp, u);
    if (s === 'pyth') return '5 cm';
    if (s === 'looks') return 'Yes, a right angle';
    if (d.pic === 'spill') return 'More than 5 cm';
    return 'No, it is narrower';
  }
  // As a screen reader says it.
  const say = (s) => String(s).replace(/√([\d.,]+)/g, 'the square root of $1').replace(/(\d) cm²/g, '$1 square centimetres').replace(/(\d) m²/g, '$1 square metres')
    .replace(/(\d)²/g, '$1 squared').replace(/(\d) cm\b/g, '$1 centimetres').replace(/(\d) m\b/g, '$1 metres').replace(/−/g, ' minus ').replace(/×/g, ' times ')
    .replace(/=/g, ' equals ').replace(/</g, ' is less than ').replace(/(^|[^\d.,])1 (square )?(centi)?metres\b/g, '$11 $2$3metre').replace(/\s+/g, ' ').trim();

  function blank(i) { return { pick: null, res: null, why: false, h: null, moved: false, th: null }; }
  const emptyFor = (i, st) => (STEPS[i].kind === 'drag' ? (st.moved ? '' : PLACE) : st.pick != null ? '' : PICK);
  const isEmpty = (i, st) => !!emptyFor(i, st);

      try { paint(i); } finally { S[i] = keepS; }
      const good = d.show ? latest <= d.dur + 1e-9 && d.dur <= 4.5 && d.dur >= 3 && earliest >= FADE : latest <= d.fb + 1e-9 && d.fb <= 2.5;
      if (!good || d.show) return good;
      return Object.keys(d.slips).every((o) => {
        S[i] = slipped(i, o); latest = 0;
        try { paint(i); } finally { S[i] = keepS; }
        return latest <= WRONG_DUR + 1e-9 && WRONG_DUR <= 1;
      });
    });
    T = keepT; paint();
    // Every start time, a counted run expanded one part per item; counted parts may be 0.2 s apart.
    const spaced = (A) => {
      const ts = [];
      Object.keys(A).forEach((k) => { const v = A[k]; if (Array.isArray(v)) { if (v[1] < 0.2 - 1e-9) ts.push([0, 'x']); for (let n = 0; n < (v[2] || 1); n++) ts.push([v[0] + v[1] * n, k]); } else ts.push([v, k]); });
      ts.sort((a, b) => a[0] - b[0]);
      return ts.every((t, k) => k === 0 || (t[1] === ts[k - 1][1] ? t[0] - ts[k - 1][0] >= 0.2 - 1e-9 : t[0] - ts[k - 1][0] >= 0.45 - 1e-9));
    };
    return ok && Object.keys(AT).every((k) => spaced(AT[k])) && DO.every((i) => spaced(STEPS[i].at));
  });

  K.ready();
</script>
