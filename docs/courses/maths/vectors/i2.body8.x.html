<p class="lead">Most screens show an arrow on a grid, its two parts dashed beside it and written out on the right. The pulls, the ship and the winch rope are made-up examples.</p>

<p class="caption">The side next to the angle takes the cosine. Pythagoras on the parts gives back the size.</p>

<script>
  const RAD = Math.PI / 180;
  const C = (deg) => Math.cos(deg * RAD), Sn = (deg) => Math.sin(deg * RAD);
  // Up to two decimals, as the lesson writes them: 5, 8.66, −25, 0.
  function num(v) { let r = Math.round(v * 100) / 100; if (Math.abs(r) < 1e-9) r = 0; return (r < 0 ? '−' : '') + String(Math.abs(r)); }
  const N = (v, unit) => num(v) + ' ' + unit;
  // Parts written with i, j and k: 3i + 4j, 4i − 2j, 2i + 3j + 6k.
  function expr(v) {
    const us = ['i', 'j', 'k'];
    let s = '';
    v.forEach((c, n) => {
      const r = Math.round(c * 100) / 100;
      if (Math.abs(r) < 1e-9) return;
      const mag = Math.abs(r) === 1 ? '' : num(Math.abs(r));
      s += s ? (r < 0 ? ' − ' : ' + ') + mag + us[n] : (r < 0 ? '−' : '') + mag + us[n];
    });
    return s || '0';
  }
  // One part on its own: 3i, −2j, 6k.
  const term = (c, u) => expr(u === 'i' ? [c, 0, 0] : u === 'j' ? [0, c, 0] : [0, 0, c]);
  const polar = (L, deg) => [L * C(deg), L * Sn(deg)];

  // ---------- the grids: each screen's window onto the squares (x0..x1 across, y0..y1 up, u px a square; px: where the readout starts) ----------
  const G1 = { x0: -3, x1: 6, y0: -3, y1: 5, u: 24 };
  const G2 = { x0: -3, x1: 6, y0: -3.5, y1: 5, u: 22 };
  const G3 = { x0: -1, x1: 5.5, y0: -1.5, y1: 5.5, u: 26, px: 262 };
  const G4 = { x0: -1, x1: 7, y0: -1, y1: 6.5, u: 24 };
  const G6 = { x0: -1, x1: 5, y0: -1, y1: 5, u: 32 };
  const G7 = { x0: -4, x1: 4.5, y0: -5.5, y1: 5, u: 20, px: 246 };
  const G8 = { x0: -1, x1: 7.5, y0: -16.5, y1: 1.5, u: 11, left: 64, px: 256 };
  const G11 = { x0: -1.5, x1: 6, y0: -1.5, y1: 4.5, u: 26 };
  const G12 = { x0: -1, x1: 7.5, y0: -4.8, y1: 3, u: 24 };

  // The winch puzzle's parts, from the rule: east is 50 sin 120°, north is 50 cos 120°.
  const WE = 50 * Sn(120), WNo = 50 * C(120);
  const W_OK = expr([WE, WNo]), W_SWAP = expr([-WNo, -WE]), W_SIGN = expr([WE, -WNo]);

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // pic: what is drawn. dur: a SHOW step's demonstration in seconds. read: its words for the
  // read-through, where its own words ask him to act. ph: the readout's height. A puzzle: task,
  // opts (three answers), want, hints (one per wrong answer), why, pv (each answer's value, where it
  // is drawn), reveal (a label only a right answer draws), fb (seconds of motion after a right and a wrong answer).
  const STEPS = [
    { show: true, name: 'Two parts make the arrow', pic: 'parts', grid: G1, ph: 165, dur: 3.8,
      text: 'Arrow `a` splits into two *components*: 3 across, then 4 up. Nose to tail they end at its tip, so together they are `a`. `i` and `j` are the unit vectors along the axes. So `a = 3i + 4j`. Drag the tip and both parts follow.',
      read: 'Arrow `a` splits into two *components*: 3 across, then 4 up. Nose to tail they end at its tip, so together they are `a`. `i` and `j` are the unit vectors along the axes. So `a = 3i + 4j`. Wherever the tip goes, the dashed parts and the readout follow it.' },
    { kind: 'pick', name: 'Write it with i and j', pic: 'write', grid: G2, ph: 165, fb: [1.7, 1.2],
      task: 'This arrow, `b`, runs 4 across and 2 down. How do you write it with `i` and `j`?',
      opts: [expr([-2, 4]), expr([4, -2]), expr([4, 2])], want: expr([4, -2]), reveal: expr([4, -2]),
      pv: { [expr([-2, 4])]: [-2, 4], [expr([4, -2])]: [4, -2], [expr([4, 2])]: [4, 2] },
      hints: { [expr([-2, 4])]: 'Not quite. That swaps the parts round, so it runs 2 left and 4 up.',
        [expr([4, 2])]: 'Not quite. That climbs 2 up. Down counts as minus.' },
      why: 'The across part goes with `i` and the up part with `j`. Down counts as minus, so `b = 4i − 2j`. As a column it is 4 above −2.' },
    { show: true, name: 'Size and angle give the parts', pic: 'resolve', grid: G3, ph: 200, dur: 3.6,
      text: 'A 10 N pull acts at 30° above the x-axis. The side next to the angle is the size times its cosine: `10 cos 30° = 8.66` N across. The side opposite takes the sine: `10 sin 30° = 5` N up. Slide the angle, and each part stays shorter than the pull until the pull lies along an axis.',
      read: 'A 10 N pull acts at 30° above the x-axis. The side next to the angle is the size times its cosine: `10 cos 30° = 8.66` N across. The side opposite takes the sine: `10 sin 30° = 5` N up. Each part is shorter than the pull, unless the pull lies along an axis.' },
    { kind: 'pick', name: 'A 20 N pull at 60°', pic: 'pull20', grid: G4, ph: 180, fb: [1.8, 1.6],
      task: 'Finding the parts like this is called *resolving*. Resolve a 20 N pull at 60° above the x-axis. What is its across part?',
      opts: [N(20 * Sn(60), 'N'), '20 N', N(20 * C(60), 'N')], want: N(20 * C(60), 'N'), reveal: '20 cos 60° = ' + N(20 * C(60), 'N'),
      pv: { [N(20 * Sn(60), 'N')]: 20 * Sn(60), '20 N': 20, [N(20 * C(60), 'N')]: 20 * C(60) },
      hints: { [N(20 * Sn(60), 'N')]: 'Not quite. That is `20 sin 60°`, the side opposite the angle. The across side sits next to it.',
        '20 N': 'Not quite. A part is only the whole pull when the pull lies along that axis.' },
      why: 'The 60° sits between the pull and the x-axis, so the across side is next to it. Next to the angle takes the cosine: `20 cos 60° = 10` N. The up part is `20 sin 60° = 17.32` N.' },
    { show: true, name: 'Measured from north', pic: 'bearing', grid: G3, ph: 200, dur: 4.0,
      text: 'A *bearing* is measured clockwise from north, up the page. Bearings use three figures. This pull sits 30° above east. East is 090, so 30° back towards north is 060. The north part runs parallel to north, so it meets the arrow at the same 60°. North takes the cosine: `10 cos 60° = 5` N. For any bearing, east is size × sin and north is size × cos. The calculator gives the signs. Switch between the two: only the angle and its labels move.',
      read: 'A *bearing* is measured clockwise from north, up the page. Bearings use three figures. This pull sits 30° above east. East is 090, so 30° back towards north is 060. The north part runs parallel to north, so it meets the arrow at the same 60°. North takes the cosine: `10 cos 60° = 5` N. For any bearing, east is size × sin and north is size × cos. The calculator gives the signs. Either way, only the angle and its labels move.' },
    { kind: 'pick', name: '12 knots on 030', pic: 'ship', grid: G6, ph: 192, fb: [1.8, 1.6],
      task: 'A ship makes 12 knots on a bearing of 030. What is its east part?',
      opts: [N(12 * Sn(30), 'knots'), N(12 * C(30), 'knots'), '12 knots'], want: N(12 * Sn(30), 'knots'), reveal: '12 sin 30° = ' + N(12 * Sn(30), 'knots'),
      pv: { [N(12 * Sn(30), 'knots')]: 12 * Sn(30), [N(12 * C(30), 'knots')]: 12 * C(30), '12 knots': 12 },
      hints: { [N(12 * C(30), 'knots')]: 'Not quite. That is `12 cos 30°`, the north part. A bearing\'s angle sits next to north.',
        '12 knots': 'Not quite. The ship heads partly north, so its east part is shorter than 12 knots.' },
      why: 'The 30° is measured from north, so it sits next to the north side. North takes the cosine: `12 cos 30° = 10.39` knots. East takes the sine: `12 sin 30° = 6` knots.' },
    { show: true, name: 'Back to size and angle', pic: 'back', grid: G7, ph: 190, dur: 4.4,
      text: 'To go back, use Pythagoras: `−3i + 4j` has size `√(3² + 4²) = 5`. The angle comes from the tangent, but check the signs first. A calculator\'s `tan⁻¹(4 ÷ −3)` gives −53.13°, which points right and down. The arrow points left and up, so add 180° to get 126.87°.' },
    { kind: 'pick', name: 'The size of 5i − 12j', pic: 'size', grid: G8, ph: 180, fb: [0.8, 1.8],
      task: 'What is the size of `5i − 12j`?',
      opts: [num(5 + 12), num(Math.sqrt(25 + 144)), num(5 + -12)], want: num(Math.sqrt(25 + 144)), reveal: num(Math.sqrt(25 + 144)),
      hints: { [num(5 + 12)]: 'Not quite. Adding lays the parts in one straight line. They meet at a right angle, so use Pythagoras.',
        [num(5 + -12)]: 'Not quite. A size is a length, so it is never below zero.' },
      why: 'The parts meet at a right angle, so Pythagoras gives the size: `√(25 + 144) = 13`. Adding them gives 17, which is longer than the arrow.' },
    { show: true, name: 'A third axis: k', pic: 'box', box: [2, 3, 6], s: 26, ox: 56, oy: 192, px: 214, ph: 215, dur: 4.2,
      text: 'The flat grid tips back to become the floor. A third axis, z, stands straight up from it, and its unit vector is `k`. The arrow `2i + 3j + 6k` stands in a box whose edges are its parts. Its size is Pythagoras twice: `√(2² + 3²) = √13` across the floor, then `√(13 + 6²) = 7` up to the tip. Drag to turn the box.',
      read: 'The flat grid tips back to become the floor. A third axis, z, stands straight up from it, and its unit vector is `k`. The arrow `2i + 3j + 6k` stands in a box whose edges are its parts. Its size is Pythagoras twice: `√(2² + 3²) = √13` across the floor, then `√(13 + 6²) = 7` up to the tip. Turning the box changes only the view.' },
    { kind: 'pick', name: 'The size of 4i + 4j + 7k', pic: 'box', box: [4, 4, 7], s: 20, ox: 50, oy: 190, px: 214, ph: 215, fb: [1.0, 1.4],
      task: 'What is the size of `4i + 4j + 7k`?',
      opts: [num(4 + 4 + 7), num(Math.hypot(4, 4)), num(Math.sqrt(32 + 49))], want: num(Math.sqrt(32 + 49)), reveal: num(Math.sqrt(32 + 49)),
      hints: { [num(4 + 4 + 7)]: 'Not quite. That walks along the box\'s edges. The arrow takes the straight line, so use Pythagoras.',
        [num(Math.hypot(4, 4))]: 'Not quite. That is only the floor part, `√(4² + 4²)`. The 7 up is left out.' },
      why: 'Across the floor, `4² + 4² = 32`. The 7 up stands at right angles to that floor line. So the size is `√(32 + 7²) = √81 = 9`.' },
    { kind: 'pick', name: 'A ring on one rope', pic: 'ring', grid: G11, ph: 200, fb: [0.8, 1.2],
      task: 'A rope pulls a ring with 10 N at 30°. The pull\'s two parts are drawn dashed. How many pulls does the ring feel?',
      opts: ['3 pulls', '1 pull', '2 pulls'], want: '1 pull', reveal: '1 pull',
      hints: { '2 pulls': 'Not quite. Only the rope touches the ring. The parts describe its one pull along the axes.',
        '3 pulls': 'Not quite. That counts the rope\'s pull and its parts as well. The parts are not extra pulls.' },
      why: 'Only the rope touches the ring, so it feels one pull. Its parts, 8.66 N across and 5 N up, end exactly at the pull\'s tip. Together they are the same pull, described along the axes.' },
    { kind: 'pick', name: 'A winch rope on 120', pic: 'winch', grid: G12, ph: 188, fb: [1.8, 1.4],
      task: 'A winch rope pulls a load with 50 N on a bearing of 120. With `i` east and `j` north, what is the pull?',
      opts: [W_SWAP, W_OK, W_SIGN], want: W_OK, reveal: W_OK,
      pv: { [W_SWAP]: [-WNo, -WE], [W_OK]: [WE, WNo], [W_SIGN]: [WE, -WNo] },
      hints: { [W_SWAP]: 'Not quite. That puts cos on the east side. A bearing\'s angle sits next to north, so north takes cos.',
        [W_SIGN]: 'Not quite. A bearing of 120 points south of east, so the north part is minus.' },
      why: 'East is `50 sin 120° = 43.3` N. North is `50 cos 120° = −25` N, minus because the rope points south of east. So the pull is `43.3i − 25j`.' },
  ];
  const FINISH = 'A vector\'s components are its parts along the axes, written with `i`, `j` and `k`. The part next to the given angle takes the cosine, and the other takes the sine. Pythagoras on the parts gives back the size.';
  // The source the first check restates (the lesson's own).
  const BITESIZE = 'https://www.bbc.co.uk/bitesize/guides/zwncsrd/revision/2';
  const A = [3, 4];                        // arrow a: 3 across, 4 up
  const YAW0 = -30, YAWMIN = -55, YAWMAX = -10, TILT = 28;   // the box's turn and how far the floor is tipped back (degrees)
  const FADE = 0.35;
  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const testing = () => document.documentElement.classList.contains('k-testing');
  const el = (id) => document.getElementById(id);

  // ---------- numbers (pure, so the checks can test them) ----------
  const hyp = (x, y) => Math.hypot(x, y);
  const same = (p, q) => p.length === q.length && p.every((x, n) => K.near(x, q[n], 1e-9));
  // Moves in words: '3 across and 4 up', '2 left and 1 down'.
  function desc(v) {
    const h = v[0] ? num(Math.abs(v[0])) + (v[0] > 0 ? ' across' : ' left') : '', u = v[1] ? num(Math.abs(v[1])) + (v[1] > 0 ? ' up' : ' down') : '';
    return [h, u].filter(Boolean).join(' and ') || 'nowhere';
  }
  function splitExpr(s) {
    const m = Math.max(s.lastIndexOf(' + '), s.lastIndexOf(' − '));
    return m > 0 ? [s.slice(0, m), s.slice(m + 1)] : [s];
  }

  // ---------- each step's state ----------
  // pick, res, why: a puzzle's answer, its result and the Why? note. v: the moves Dan has set by
  // dragging the tip. ang: the angle he has set. from, flip: the way he has chosen to measure the
  // angle. yaw: how far he has turned the box.
  function blank() { return { pick: null, res: null, why: false, v: null, ang: null, from: null, flip: false, yaw: null }; }
  const isRight = (i, st) => st.pick != null && st.pick === STEPS[i].want;
  const hintFor = (i, st) => { const d = STEPS[i]; return (d.hints && d.hints[st.pick]) || 'Not quite. Look again at the picture.'; };
  const solved = (i) => Object.assign(blank(), { pick: STEPS[i].want, res: 'right' });
  const wrongSt = (i, o) => Object.assign(blank(), { pick: o, res: 'wrong' });
  let S = STEPS.map(() => blank());
  let finished = false, lastStep = -1, lastDone = false, T = Infinity;   // T: seconds into the current motion
  let motionEnd = 0;
  let REC = null;                                                        // what the last paint drew, for the checks
  let G = null;                                                          // the geometry of the step being drawn

  // ---------- text with amber key terms and bold vector letters (built with K.el, never innerHTML) ----------
  const VEC = /((?<![A-Za-z])[abijk](?![A-Za-z]))/;
  function vecs(parent, s, inSvg) {
    String(s).split(VEC).forEach((p, k) => {
      if (!p) return;
      if (k % 2) { const cls = /[ijk]/.test(p) ? 'vu' : 'vn'; parent.appendChild(inSvg ? K.svg('tspan', { class: cls }, p) : K.el('span', { class: cls }, p)); return; }
      parent.appendChild(document.createTextNode(p));
    });
  }
  // `maths` stays on one line with its vector letters bold; *a key term* is highlighted.
  function write(node, s) {
    node.textContent = '';
    String(s).split('`').forEach((seg, k) => {
      if (!seg) return;
      if (k % 2) { vecs(node.appendChild(K.el('span', { class: 'nw' })), seg, false); return; }
      const re = /\*([^*]+)\*/g;
      let at = 0, m;
      while ((m = re.exec(seg))) {

      said += ' East is 50 sin 120 degrees, 43.3 N. North is 50 cos 120 degrees, minus 25 N.';
    } else if (pick) {
      const pv = d.pv[pick], e = go(0.1, 1.0);
      vec(P, [pv[0] / 10 * e, pv[1] / 10 * e], 'bad');
      REC.bad++;
      said += ' The pick is drawn in red: it points on a bearing of ' + brg(pv) + ', not 120.';
    }
    vec(P, v, '', { main: true });
    const ra = ok ? arr(1.0) : 1;
    panel([{ t: 'title', s: '50 N' }, { t: 'label', s: 'bearing' }, { t: 'value', s: '120' }].concat(ok ? [{ t: 'label', s: 'i and j', a: ra }, { t: 'expr', s: W_OK, a: ra }] : []));
    if (pick && !ok) foot(['bearing ' + brg(d.pv[pick]) + ',', 'not 120'], 'bad', arr(0.6));
    else foot(['1 square', 'is 10 N']);
    return said;
  };

  // ---------- each step's sizes ----------
  const GEO = new Map();
  function geo(d) {
    if (GEO.has(d)) return GEO.get(d);
    let g;
    if (d.grid) {
      const h = (d.grid.y1 - d.grid.y0) * d.grid.u;
      g = Object.assign({}, d.grid, { left: d.grid.left != null ? d.grid.left : 12, top: 14 });
      g.H = Math.ceil(g.top + Math.max(h, d.ph || 0) + 14);
    } else g = { x0: 0, x1: 0, y0: 0, y1: 0, u: 1, left: 0, top: 14, H: Math.ceil(14 + (d.ph || 215) + 14) };
    g.px = (d.grid && d.grid.px) || d.px || 250;
    g.maxX = g.px - 10;
    GEO.set(d, g);
    return g;
  }

  // ---------- the drags: Dan moves a's tip, or turns the box ----------
  const tipGrip = ui.appendChild(K.svg('circle', { class: 'grip', cx: 0, cy: 0, r: 24, tabindex: -1, role: 'button', 'aria-label': 'Tip of arrow a: drag, or use the arrow keys, to move it' }));
  const turnGrip = ui.appendChild(K.svg('rect', { class: 'turn', x: 0, y: 0, width: 1, height: 1, tabindex: -1, role: 'button', 'aria-label': 'The box: drag sideways, or use the left and right arrow keys, to turn it' }));
  function placeGrips(d, st) {
    const tipOn = d.pic === 'parts' && !finished, turnOn = d.pic === 'box' && !finished;
    tipGrip.style.display = tipOn ? '' : 'none'; tipGrip.setAttribute('tabindex', tipOn ? '0' : '-1');
    turnGrip.style.display = turnOn ? '' : 'none'; turnGrip.setAttribute('tabindex', turnOn ? '0' : '-1');
    if (tipOn) { const v = st.v || A; tipGrip.setAttribute('cx', r3(X(v[0]))); tipGrip.setAttribute('cy', r3(Y(v[1]))); }
    if (turnOn) { turnGrip.setAttribute('width', G.px - 8); turnGrip.setAttribute('height', G.H); }
  }
  function changed(quiet) {
    if (quiet) return;
    if (anim.playing()) anim.pause();
    T = Infinity;
    K.reveal(); K.refresh();
  }
  // The tip lands on a grid point inside the window; the tail stays at the origin.
  function setTip(i, tip, quiet) {
    const g = STEPS[i].grid, st = S[i];
    const v = [K.clamp(Math.round(tip[0]), Math.ceil(g.x0), Math.floor(g.x1)), K.clamp(Math.round(tip[1]), Math.ceil(g.y0), Math.floor(g.y1))];
    if (!v[0] && !v[1]) return false;
    st.v = v;
    changed(quiet);
    return true;
  }
  function setYaw(i, y, quiet) { S[i].yaw = K.clamp(y, YAWMIN, YAWMAX); changed(quiet); }
  function gridAt(e) {
    const ctm = svg.getScreenCTM();
    if (!ctm) return null;
    const q = new DOMPoint(e.clientX, e.clientY).matrixTransform(ctm.inverse());
    return [G.x0 + (q.x - G.left) / G.u, G.y1 - (q.y - G.top) / G.u];
  }
  let held = null;
  const onPic = (pic) => !finished && STEPS[at()].pic === pic;
  tipGrip.addEventListener('pointerdown', (e) => {
    if (!onPic('parts')) return;
    const q = gridAt(e);
    if (!q) return;
    held = { id: e.pointerId, what: 'tip' };
    try { tipGrip.setPointerCapture(e.pointerId); } catch (err) { /* the drag still follows while the pointer stays on the grip */ }
    e.preventDefault();
    setTip(at(), q);
  });
  tipGrip.addEventListener('pointermove', (e) => {
    if (!held || held.id !== e.pointerId || held.what !== 'tip' || !onPic('parts')) return;
    const q = gridAt(e);
    if (q) setTip(at(), q);
  });
  tipGrip.addEventListener('keydown', (e) => {
    if (!onPic('parts')) return;
    const by = { ArrowUp: [0, 1], ArrowDown: [0, -1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] }[e.key];
    if (!by) return;
    e.preventDefault();
    const v = S[at()].v || A;
    setTip(at(), [v[0] + by[0], v[1] + by[1]]);
  });
  turnGrip.addEventListener('pointerdown', (e) => {
    if (!onPic('box')) return;
    held = { id: e.pointerId, what: 'turn', x: e.clientX, yaw: B.yaw / RAD };
    try { turnGrip.setPointerCapture(e.pointerId); } catch (err) { /* the turn still follows while the pointer stays on the box */ }
  });
  turnGrip.addEventListener('pointermove', (e) => {
    if (!held || held.id !== e.pointerId || held.what !== 'turn' || !onPic('box')) return;
    setYaw(at(), held.yaw - (e.clientX - held.x) * 0.4);
  });
  turnGrip.addEventListener('keydown', (e) => {
    if (!onPic('box')) return;
    const by = { ArrowLeft: 5, ArrowRight: -5 }[e.key];
    if (!by) return;
    e.preventDefault();
    setYaw(at(), B.yaw / RAD + by);
  });
  const letGo = (e) => { if (held && held.id === e.pointerId) held = null; };
  [tipGrip, turnGrip].forEach((g) => {
    g.addEventListener('pointerup', letGo);
    g.addEventListener('pointercancel', letGo);
    g.addEventListener('lostpointercapture', () => { held = null; });
  });

  // The scene for a step (the animation calls this every frame).
  function paint(i) {
    if (i == null) i = at();
    const d = STEPS[i], st = S[i];
    G = geo(d);
    art.textContent = '';
    into = null;
    REC = { arrows: [], texts: [], ro: null, main: null, bad: 0, legs: [], cosSide: null, angle: null, tipAngle: null, tip: null, tipPx: null };
    svg.setAttribute('viewBox', '0 0 340 ' + G.H);
    svg.setAttribute('aria-label', DRAW[d.pic](d, st, i));
    placeGrips(d, st);
  }

  write(el('finish'), FINISH);
  K.update((p) => {
    const i = Math.round(p.step), d = STEPS[i], st = S[i];
    if (!anim.playing()) T = Infinity;   // motion that was stopped (the page hidden, a test) shows finished
    // Dan's own angle and switch, told apart from the settings the demonstrations give them.
    const here = i === lastStep && !finished;
    if (p.ang !== angShown) { angShown = p.ang; if (here && d.pic === 'resolve') { st.ang = p.ang; anim.pause(); T = Infinity; } }
    if (p.from !== fromShown) { fromShown = p.from; if (here && d.pic === 'bearing') { st.from = p.from; st.flip = true; play(1.8); } }
    if (i !== lastStep) {
      lastStep = i; enter('stepbox');
      if (d.show) {
        Object.assign(st, { v: null, ang: null, from: null, flip: false, yaw: null });
        if (d.pic === 'resolve') setAng(30);
        if (d.pic === 'bearing') setFrom('x');
        play(d.dur);
      } else { anim.pause(); T = Infinity; }
    }
    if (finished !== lastDone) { lastDone = finished; enter(finished ? 'done' : 'stepbox'); }
    const right = st.res === 'right';
    el('stepbox').hidden = finished;
    el('done').hidden = !finished;
    el('count').textContent = 'Step ' + (i + 1) + ' of ' + STEPS.length;
    const task = el('task');
    task.className = 'task' + (d.show ? ' show' : '');
    write(task, d.show ? d.text : d.task);
    paint(i);
    syncCtl(i);

    el('abox').hidden = finished || !(d.pic === 'resolve' && d.show);
    el('fbox').hidden = finished || !(d.pic === 'bearing' && d.show);
    replayBtn.el.hidden = !d.show || REDUCE;
    el('replay').hidden = replayBtn.el.hidden;
    const opts = d.show ? [] : d.opts || [];
    el('picks').hidden = !opts.length;
    el('picks').classList.toggle('long', opts.some((o) => o.length > 9));
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      b.setLabel(opts[k]);
      b.el.textContent = '';
      vecs(b.el.appendChild(K.el('span')), opts[k], false);   // one span, so the button's gap does not split "43.3i − 25j"
      b.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });

    el('acts').hidden = !!d.show;
    checkBtn.el.hidden = right;
    const fb = el('fb');
    fb.hidden = !!d.show;
    fb.className = 'fb' + (right ? ' right' : st.res === 'wrong' ? ' wrong' : '');
    write(fb, d.show ? '' : right ? 'That\'s it.' : st.res === 'wrong' ? hintFor(i, st) : st.res === 'empty' ? 'Choose one of the answers first.' : '');

    const why = el('why');
    why.hidden = d.show || !st.why;
    write(why, d.show ? '' : d.why);
    whyBtn.setLabel(st.why ? 'Hide why' : 'Why?');

    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !right);
    nextBtn.setLabel(i === STEPS.length - 1 ? 'Finish' : 'Continue');
    nav.hidden = backBtn.el.hidden && nextBtn.el.hidden;
  });

  // ---------- known answers, worked out by hand ----------
  const DO = STEPS.map((d, i) => i).filter((i) => !STEPS[i].show);
  const idx = (name) => STEPS.findIndex((d) => d.name === name);
  // A step painted in the state given (finished, or at t seconds into its motion): what it drew.
  function drawn(i, st, t) {
    const keepS = S[i], keepT = T;
    S[i] = st; T = t == null ? Infinity : t;
    try { paint(i); return REC; } finally { S[i] = keepS; T = keepT; paint(); }
  }
  // The dashed parts run nose to tail from the tail to the tip.
  function noseToTail(r, tip) {
    const L = r.legs, t = tip.concat([0, 0, 0]).slice(0, 3);
    if (!L.length) return false;
    for (let n = 1; n < L.length; n++) if (!same(L[n][0], L[n - 1][1])) return false;
    return same(L[0][0], [0, 0, 0]) && same(L[L.length - 1][1], t);
  }

  K.check('Vector components describe the separate x, y and z values of a vector: the readout\'s column lists arrow a\'s x and y values and the box arrow\'s x, y and z values, the same numbers as their i, j and k parts, and drawn nose to tail those parts end at the tip', () => {
    const r1 = drawn(idx('Two parts make the arrow'), blank()), r9 = drawn(idx('A third axis: k'), blank());
    return r1.ro.col.join() === '3,4' && r1.ro.expr === '3i + 4j' && noseToTail(r1, [3, 4]) &&
      r9.ro.col.join() === '2,3,6' && r9.ro.title === '2i + 3j + 6k' && noseToTail(r9, [2, 3, 6]);
  }, { source: BITESIZE });
  K.check('Dragging the tip sets the parts: for every square the tip can reach, the column and the i and j readout give its across and up moves, and the dashed parts still end at the tip', () => {
    const i = idx('Two parts make the arrow'), g = STEPS[i].grid, keep = S[i];
    let ok = true;
    try {
      for (let x = Math.ceil(g.x0); x <= Math.floor(g.x1); x++) for (let y = Math.ceil(g.y0); y <= Math.floor(g.y1); y++) {
        S[i] = blank();
        const moved = setTip(i, [x, y], true), st = S[i];
        if (!x && !y) { ok = ok && !moved; continue; }
        const r = drawn(i, st);
        ok = ok && moved && same(r.main.v, [x, y]) && r.ro.col.join() === [num(x), num(y)].join() && r.ro.expr === expr([x, y]) && noseToTail(r, [x, y]);
      }
    } finally { S[i] = keep; paint(); }
    return ok;
  });
  K.check('At every whole angle from 0° to 90° the 10 N pull resolves into 10 cos θ across and 10 sin θ up: the readout shows both to two decimal places, the cos label sits on the across side next to the angle, each part is shorter than 10 N unless the pull lies along an axis, and Pythagoras on the parts gives back 10 N', () => {
    const i = idx('Size and angle give the parts');
    for (let t = 0; t <= 90; t++) {
      const r = drawn(i, Object.assign(blank(), { ang: t })), c = 10 * C(t), s = 10 * Sn(t);
      if (r.ro.col.join() !== [num(c), num(s)].join() || r.cosSide !== 'across' || r.ro.expr !== expr([c, s])) return false;
      if (r.texts.indexOf('10 cos ' + t + '°') < 0 || r.texts.indexOf('10 sin ' + t + '°') < 0) return false;
      const along = t === 0 || t === 90;
      if (along ? !(K.near(Math.max(c, s), 10, 1e-9) && K.near(Math.min(c, s), 0, 1e-9)) : !(c < 10 && s < 10)) return false;
      if (!K.near(hyp(c, s), 10, 1e-9)) return false;
    }
    return num(10 * C(30)) === '8.66' && num(10 * Sn(30)) === '5' && num(10 * C(30) + 10 * Sn(30)) === '13.66';
  });
  K.check('Switching the 10 N pull to a bearing moves only the angle and its labels: the arrow, its parts and its column stay the same, the angle reads 30° off the x-axis and then a bearing of 060, the same 60° shows at the tip where the north part meets the arrow, and the cos label moves from the across side to the north side', () => {
    const i = idx('Measured from north');
    const rx = drawn(i, Object.assign(blank(), { from: 'x', flip: true })), rn = drawn(i, Object.assign(blank(), { from: 'n', flip: true }));
    return same(rx.main.v, rn.main.v) && rx.ro.col.join() === rn.ro.col.join() && rx.ro.col.join() === '8.66,5' && JSON.stringify(rx.legs) === JSON.stringify(rn.legs) &&
      rx.cosSide === 'across' && rn.cosSide === 'up' && rx.texts.indexOf('10 cos 30°') >= 0 && rn.texts.indexOf('10 cos 60°') >= 0 &&
      rowIs(rx, 'angle', '30°') && rowIs(rn, 'bearing', '060') && rx.angle === '30°' && rn.angle === '60°' && rx.tipAngle === null && rn.tipAngle === '60°' && 90 - 30 === 60;
  });
  K.check('With a bearing the angle sits next to north, so north takes the cosine: the ship\'s and the winch rope\'s pictures mark the bearing again at the tip, on the north part, and their right answers put cos on that side, giving 12 sin 30° = 6 knots east, and 43.3 N east with −25 N north; the winch\'s wrong picks point on bearings 150 and 060', () => {
    const j = idx('12 knots on 030'), w = idx('A winch rope on 120'), rj = drawn(j, solved(j)), rw = drawn(w, solved(w));
    return rj.cosSide === 'up' && rj.tipAngle === '30°' && rw.tipAngle === '120°' && brg(STEPS[w].pv[W_SWAP]) === '150' && brg(STEPS[w].pv[W_SIGN]) === '060' && brg([WE, WNo]) === '120' && rj.texts.indexOf('12 cos 30°') >= 0 && STEPS[j].want === '6 knots' && rw.cosSide === 'up' && rw.texts.indexOf('50 cos 120°') >= 0 &&
      STEPS[w].want === '43.3i − 25j' && num(WE) === '43.3' && num(WNo) === '−25' && K.near(hyp(WE, WNo), 50, 1e-9);
  });
  K.check('Every number in the puzzles follows from the rule: 20 cos 60° = 10 and 20 sin 60° = 17.32; 12 cos 30° = 10.39; √(25 + 144) = 13 against 5 + 12 = 17 and 5 − 12 = −7; √13 = 3.61 and √49 = 7; √32 = 5.66, 4 + 4 + 7 = 15 and √81 = 9', () =>
    num(20 * C(60)) === '10' && num(20 * Sn(60)) === '17.32' && num(12 * C(30)) === '10.39' && num(Math.sqrt(25 + 144)) === '13' && num(5 + 12) === '17' && num(5 - 12) === '−7' &&
    num(Math.sqrt(13)) === '3.61' && num(Math.sqrt(13 + 36)) === '7' && num(Math.hypot(4, 4)) === '5.66' && num(4 + 4 + 7) === '15' && num(Math.sqrt(32 + 49)) === '9' &&
    STEPS[idx('A 20 N pull at 60°')].want === '10 N' && STEPS[idx('The size of 5i − 12j')].want === '13' && STEPS[idx('The size of 4i + 4j + 7k')].want === '9');
  K.check('A calculator\'s tan⁻¹(4 ÷ −3) gives −53.13°, pointing right and down, the opposite way to −3i + 4j; turned through 180° it lands on the arrow at 126.87°, and Pythagoras gives its size, 5', () => {
    const r = drawn(idx('Back to size and angle'), blank()), calc = r.arrows.find((q) => /calc/.test(q.cls)), t = Math.atan(4 / -3) / RAD, back = polar(5, t + 180);
    return num(t) === '−53.13' && num(t + 180) === '126.87' && !!calc && calc.v[0] > 0 && calc.v[1] < 0 && K.near(back[0], -3, 1e-9) && K.near(back[1], 4, 1e-9) &&
      same(r.main.v, [-3, 4]) && rowIs(r, 'size', '5') && rowIs(r, 'angle', '126.87°');
  });
  K.check('Turning the box changes only the view: at every turn from −55° to −10° its parts still run 2 across, 3 along and 6 up, nose to tail to the tip, the floor line reads 3.61 and the size 7, while the tip moves on the page', () => {
    const i = idx('A third axis: k'), seen = [];
    for (let y = YAWMIN; y <= YAWMAX; y += 5) {
      const r = drawn(i, Object.assign(blank(), { yaw: y }));
      if (r.ro.col.join() !== '2,3,6' || !rowIs(r, 'floor', '3.61') || !rowIs(r, 'size', '7') || !noseToTail(r, [2, 3, 6]) || !same(r.main.v, [2, 3, 6])) return false;
      seen.push(r.tipPx[0]);
    }
    return Math.abs(seen[0] - seen[seen.length - 1]) > 5;
  });
  K.check('Every puzzle offers three different answers with exactly one accepted, gives each wrong one its own hint, and draws a wrong pick in red but a right one without', () =>
    DO.every((i) => {
      const d = STEPS[i], wrong = d.opts.filter((o) => o !== d.want);
      return d.opts.length === 3 && new Set(d.opts).size === 3 && wrong.length === 2 && wrong.every((o) => !!d.hints[o]) && d.hints[wrong[0]] !== d.hints[wrong[1]] &&
        wrong.every((o) => drawn(i, wrongSt(i, o)).bad > 0) && drawn(i, solved(i)).bad === 0;
    }));
  K.check('Before Check no puzzle\'s picture shows its answer, and a right answer shows it', () =>
    DO.every((i) => { const d = STEPS[i]; return drawn(i, blank()).texts.indexOf(d.reveal) < 0 && drawn(i, solved(i)).texts.indexOf(d.reveal) >= 0; }));
  K.check('Every demonstration has finished arriving within 4.5 s of its screen opening, none starting before the 0.35 s screen fade ends; every answer\'s motion within 2.5 s', () => {
    const timed = (i, st, limit) => {
      const keepS = S[i], keepT = T;
      T = Infinity; latest = 0; earliest = Infinity; S[i] = st;
      try { paint(i); } finally { S[i] = keepS; T = keepT; }
      return latest <= limit + 1e-9;
    };
    const ok = STEPS.every((d, i) => {
      if (d.show) { const r = timed(i, blank(), d.dur); return r && d.dur <= 4.5 && d.dur >= 3 && earliest >= FADE; }
      return timed(i, solved(i), d.fb[0]) && d.fb[0] <= 2.5 && d.fb[1] <= 2.5 &&
        d.opts.filter((o) => o !== d.want).every((o) => timed(i, wrongSt(i, o), d.fb[1]));
    });
    paint();
    return ok;
  });

  K.ready();
</script>
