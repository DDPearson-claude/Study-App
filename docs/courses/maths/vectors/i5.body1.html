<p class="lead">Two arrows from one point on a grid, with a light that casts one arrow's shadow onto the other's line. Later the arrows become a rope and a rail, then a voltage and a current. The values are made-up examples.</p>

<p class="caption">The dot product is the shadow's length times the other arrow's length.</p>

<script>
  const RAD = Math.PI / 180;
  // Exact values where the lesson's angles meet them, so 90° gives exactly nothing.
  const EXC = { 0: 1, 60: 0.5, 90: 0, 120: -0.5, 180: -1 }, EXS = { 0: 0, 30: 0.5, 90: 1, 150: 0.5, 180: 0 };
  const has = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
  const cosd = (deg) => (has(EXC, deg) ? EXC[deg] : Math.cos(deg * RAD));
  const sind = (deg) => (has(EXS, deg) ? EXS[deg] : Math.sin(deg * RAD));
  // Up to two decimals, as the lesson writes them: 12, 173.21, −2.5, 0.
  function num(v) { let r = Math.round(v * 100) / 100; if (Math.abs(r) < 1e-9) r = 0; return (r < 0 ? '−' : '') + String(Math.abs(r)); }
  // Parts written with i, j and k: 3i + 4j, 1i − 2j.
  function expr(v) {
    const us = ['i', 'j', 'k'];
    let s = '';
    v.forEach((c, n) => {
      const r = Math.round(c * 100) / 100;
      if (Math.abs(r) < 1e-9) return;
      const mag = num(Math.abs(r));
      s += s ? (r < 0 ? ' − ' : ' + ') + mag + us[n] : (r < 0 ? '−' : '') + mag + us[n];
    });
    return s || '0';
  }
  const add = (p, q) => p.map((x, k) => x + q[k]);
  const sub = (p, q) => p.map((x, k) => x - q[k]);
  const scale = (p, s) => p.map((x) => x * s);
  const hyp = (v) => Math.hypot.apply(null, v);
  const unit = (v) => { const L = hyp(v) || 1; return scale(v, 1 / L); };
  const lerp2 = (a, b, e) => [a[0] + (b[0] - a[0]) * e, a[1] + (b[1] - a[1]) * e];
  const dotv = (p, q) => p.reduce((s, x, k) => s + x * q[k], 0);
  const cross2 = (p, q) => p[0] * q[1] - p[1] * q[0];
  const angleOf = (p, q) => Math.acos(K.clamp(dotv(p, q) / (hyp(p) * hyp(q)), -1, 1)) / RAD;
  // The two workings, as the readout writes them: 5 × 4 × cos 53.13°, and 3 × 4 + 4 × 0.
  const fac = (v, br) => (v < 0 && br ? '(' + num(v) + ')' : num(v));
  const partsText = (p, q) => p.map((x, k) => fac(x, k > 0) + ' × ' + fac(q[k], true)).join(' + ');
  const sizesText = (p, q, th) => num(hyp(p)) + ' × ' + num(hyp(q)) + ' × cos ' + num(th == null ? angleOf(p, q) : th) + '°';

  // ---------- each screen's layout ----------
  // A grid: u px a unit, the origin at (ox, oy), whole units x0..x1 and y0..y1. Labels stay between
  // ly0 and ly1; the readout band starts at hd and has `rows` lines.
  const GA = { kind: 'grid', u: 24, ox: 146, oy: 160, x0: -4, x1: 6, y0: -1, y1: 5, ly0: 32, ly1: 190, hd: 196, rows: 3 };
  const GS = { kind: 'grid', u: 21, ox: 170, oy: 166, x0: -6, x1: 6, y0: -1, y1: 6, ly0: 32, ly1: 192, hd: 198, rows: 3 };
  const GP = { kind: 'grid', u: 24, ox: 38, oy: 160, x0: -1, x1: 5, y0: -1, y1: 5, ly0: 32, ly1: 190, hd: 196, rows: 3 };
  const GQ = { kind: 'grid', u: 26, ox: 170, oy: 118, x0: -3, x1: 3, y0: -3, y1: 3, ly0: 32, ly1: 200, hd: 206, rows: 3 };
  // 3-D: the origin at O, u px a unit, seen from azimuth al and elevation be (a true view, never mirrored).
  const T7 = { kind: 'three', u: 23, O: [262, 186], al: 160, be: 30, tri: [60, 172], ly0: 32, ly1: 204, hd: 210, rows: 4 };
  const T8 = { kind: 'three', u: 40, O: [170, 178], al: 200, be: 30, tri: [60, 172], ly0: 32, ly1: 200, hd: 206, rows: 4 };
  // A rope on a trolley or a crate: the rope's ring at P, fS px a newton, dS px a metre.
  const R9 = { kind: 'rope', P: [150, 140], fS: 0.55, dS: 25, ly0: 32, ly1: 200, hd: 206, rows: 2 };
  const R10 = { kind: 'rope', P: [150, 140], fS: 0.44, dS: 25, ly0: 32, ly1: 200, hd: 206, rows: 3 };
  const R12 = { kind: 'rope', P: [162, 134], fS: 2.2, dS: 40, ly0: 32, ly1: 200, hd: 206, rows: 3 };
  // A voltage and a current from one point: vS px a volt, iS px an amp.
  const PW = { kind: 'power', O: [36, 92], vS: 0.95, iS: 6, ly0: 32, ly1: 192, hd: 198, rows: 2 };

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // pic: what is drawn. dur: a SHOW step's demonstration in seconds. act: what he can do with it,
  // shown under the picture. A puzzle: task, opts (three answers), want, hints (one per wrong
  // answer), why, pv (what a wrong answer is drawn as), reveal (a label only a right answer draws),
  // fb (seconds of motion after a right and a wrong answer).
  const STEPS = [
    { show: true, name: 'The shadow', pic: 'shadow', geo: GA, dur: 4.2,
      text: 'A light shines square onto `b`\'s line, and `a` casts a *shadow* along it. The shadow is 3 long, and `b` is 4 long. Multiply them and you get the *dot product*, `a·b` = 3 × 4 = 12.',
      act: 'Drag the tip of `a` or `b`. The two workings always agree.' },
    { kind: 'pick', name: 'A longer b', pic: 'shadowq', geo: GA, fb: [1.6, 1.8],
      task: 'Now `b` is `6i`, and `a` is still `3i + 4j`. What is `a·b`?',
      opts: ['30', '18', '18i'], want: '18', reveal: '18',
      hints: { '30': 'Not quite. That is 5 × 6, the whole of `a`. Only its shadow along `b` counts.',
        '18i': 'Not quite. A shadow is a length, not an arrow. So `a·b` is a plain number, with no `i`.' },
      why: 'The shadow of `a` on `b`\'s line is still 3 long, and `b` is 6 long. So `a·b` = 3 × 6 = 18. It is a plain number, because a shadow is a length.' },
    { show: true, name: 'Swing it round', pic: 'swing', geo: GS, dur: 4.6,
      text: 'As `a` swings round, its shadow shrinks to a dot at 90°. So two arrows square to each other give `a·b` = 0. Past 90° the shadow falls behind the start and counts as minus.',
      act: 'Drag the tip of `a` round.' },
    { kind: 'pick', name: 'At 120°', pic: 'swingq', geo: GS, fb: [1.8, 1.8],
      task: '`a` is 5 long and `b` is 4 long, with 120° between them. What is `a·b`?',
      opts: ['17.32', '10', '−10'], want: '−10', reveal: '−10',
      hints: { '17.32': 'Not quite. That uses sin, the part square to `b`. The shadow is the side next to the angle, so use cos.',
        '10': 'Not quite. Past 90° the shadow falls behind the start. Keep the minus.' },
      why: 'cos 120° is −0.5. So the shadow is 5 × (−0.5) = −2.5, behind the start. Then `a·b` = −2.5 × 4 = −10. The arrows lean apart, so the answer is negative.' },
    { show: true, name: 'Part by part', pic: 'parts', geo: GP, dur: 4.2,
      text: '`i` lies along its own line, so `i·i` = 1. `j` is square to it and casts no shadow, so `i·j` = 0. Only matching parts are left to multiply, so (`3i + 4j`)·(`4i + 3j`) = 12 + 12 = 24.',
      act: 'Drag either tip, and both workings still agree.' },
    { kind: 'pick', name: 'Square to it', pic: 'square', geo: GQ, fb: [1.8, 1.8],
      task: 'Which arrow is square to `2i + 1j`?',
      opts: ['1i − 2j', '1i + 2j', '−2i − 1j'], want: '1i − 2j', reveal: '0', pv: { '1i − 2j': [1, -2], '1i + 2j': [1, 2], '−2i − 1j': [-2, -1] },
      hints: { '1i + 2j': 'Not quite. Pair the parts. 2 × 1 + 1 × 2 = 4, not 0, so they lean the same way.',
        '−2i − 1j': 'Not quite. That points straight back along it. Its dot product is −4 − 1 = −5.' },
      why: 'Pair the parts. 2 × 1 + 1 × (−2) = 2 − 2 = 0. A dot product of 0 means the two arrows are square to each other.' },
    { show: true, name: 'The angle in 3-D', pic: 'three', geo: T7, dur: 4.2,
      text: 'In 3-D a third pair joins in, along `k`. For `a` = `2i + 3j + 6k` and `b` = `1i + 2j + 2k`, `a·b` = 2 + 6 + 12 = 20. Their sizes are 7 and 3, so cos θ = 20 ÷ 21 and θ = 17.75°.' },
    { kind: 'pick', name: 'Angle between', pic: 'threeq', geo: T8, fb: [1.6, 1.8],
      task: 'What is the angle between `2i + 2j + 1k` and `2i − 1j + 2k`?',
      opts: ['26.39°', '63.61°', '48.19°'], want: '63.61°', reveal: '63.61°', pv: { '26.39°': Math.asin(4 / 9) / RAD, '48.19°': Math.acos(4 / 6) / RAD },
      hints: { '26.39°': 'Not quite. That uses sin⁻¹. The dot product goes with cos, so take cos⁻¹.',
        '48.19°': 'Not quite. That divides by 3 + 3. Divide by the sizes multiplied, 3 × 3 = 9.' },
      why: 'Pair the parts. 4 − 2 + 2 = 4. Each arrow is 3 long, so cos θ = 4 ÷ 9. So θ = cos⁻¹(4 ÷ 9) = 63.61°.' },
    { show: true, name: 'Rope and rail', pic: 'rail', geo: R9, dur: 4.0,
      text: 'A rope pulls a trolley with 200 N, at 30° to its rail. Only the pull along the rail does *work*, and that is the rope\'s shadow, 173.21 N. Over 5 m the work is 200 × 5 × cos 30° = 866.03 J.',
      act: 'Drag the tip of the rope\'s arrow round.' },
    { kind: 'pick', name: 'Pull by parts', pic: 'railq', geo: R10, fb: [1.6, 1.8],
      task: 'A rope pulls a trolley with `150i + 200j` N. The trolley runs 4 m along its rail, in the `i` direction. How much work does the rope do?',
      opts: ['1000 J', '800 J', '600 J'], want: '600 J', reveal: '600 J', pv: { '1000 J': 'whole', '800 J': 'up' },
      hints: { '1000 J': 'Not quite. That is the rope\'s whole 250 N times 4 m. Only the part along the rail counts.',
        '800 J': 'Not quite. That uses the up part, 200 N. It is square to the rail, so it does no work.' },
      why: 'The move is `4i` m. Pair the parts. 150 × 4 + 200 × 0 = 600 J. The up part is square to the move, so it does no work.' },
    { kind: 'pick', name: 'Volts and amps', pic: 'power', geo: PW, fb: [1.6, 1.8],
      task: 'A supply gives 230 V and 23 A, with 36.87° between them. What is the true power?',
      opts: ['4232 W', '5290 W', '3174 W'], want: '4232 W', reveal: '4232 W', pv: { '5290 W': 'whole', '3174 W': 'sin' },
      hints: { '5290 W': 'Not quite. 230 × 23 counts all the current. Only the part in step with the voltage carries power.',
        '3174 W': 'Not quite. That uses sin, the part square to the voltage. True power takes cos.' },
      why: 'cos 36.87° is 0.8. So the true power is 230 × 23 × 0.8 = 4232 W. It has the dot product\'s shape. It is two sizes times the cosine of the angle between them.' },
    { kind: 'pick', name: 'Pulling back', pic: 'crate', geo: R12, fb: [1.8, 1.8],
      task: 'A crate slides 3 m along the deck, in the `i` direction. A rope pulls on it with `−40i + 30j` N. How much work does the rope do?',
      opts: ['120 J', '−120 J', '150 J'], want: '−120 J', reveal: '−120 J', pv: { '120 J': 'flip', '150 J': 'whole' },
      hints: { '120 J': 'Not quite. The rope pulls back against the move. Keep the minus.',
        '150 J': 'Not quite. That is the rope\'s whole 50 N times 3 m. Only the part along the deck counts.' },
      why: 'The move is `3i` m. Pair the parts. −40 × 3 + 30 × 0 = −120 J. The rope pulls against the move, so its work is negative.' },
  ];
  const FINISH = 'The dot product is a plain number. It is one arrow\'s shadow on the other\'s line, times the other\'s length. Work it out as `|a||b|` cos θ, or part by part.';
  // The lesson's sources, each cited only by a check that restates its quote.
  const SRC_SUM = 'https://openstax.org/books/university-physics-volume-1/pages/2-summary';
  const SRC_PROD = 'https://openstax.org/books/university-physics-volume-1/pages/2-4-products-of-vectors';
  const FADE = 0.35;
  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const testing = () => document.documentElement.classList.contains('k-testing');
  const el = (id) => document.getElementById(id);
  const atPic = (pic) => STEPS.findIndex((d) => d.pic === pic);

  // ---------- each step's state ----------
  // pick, res, why: a puzzle's answer, its result and the Why? note. A, B: where he has dragged the
  // tips of a and b. th: the angle he has swung a to. rope: the angle he has swung the rope to.
  function blank() { return { pick: null, res: null, why: false, A: null, B: null, th: null, rope: null }; }
  const isRight = (i, st) => st.pick != null && st.pick === STEPS[i].want;
  const hintFor = (i, st) => { const d = STEPS[i]; return (d.hints && d.hints[st.pick]) || 'Not quite. Look again at the picture.'; };
  const solved = (i) => Object.assign(blank(), { pick: STEPS[i].want, res: 'right' });
  const wrongSt = (i, o) => Object.assign(blank(), { pick: o, res: 'wrong' });
  let S = STEPS.map(() => blank());
  let finished = false, lastStep = -1, lastDone = false, T = Infinity;   // T: seconds into the current motion
  let motionEnd = 0;
  let REC = null;   // what the last paint drew, for the checks
  let G = null;     // the layout of the step being drawn
  let BOX = [], SEG = [];   // what a label must keep clear of: other labels and solid shapes, and lines

  // ---------- text with amber key terms and bold vector letters (built with K.el, never innerHTML) ----------
  const VEC = /((?<![A-Za-z])[abijkFd](?![A-Za-z]))/;
  function vecs(parent, s, inSvg) {
    String(s).split(VEC).forEach((p, k) => {
      if (!p) return;
      if (k % 2) { const cls = /[ijk]/.test(p) ? 'vu' : 'vn'; parent.appendChild(inSvg ? K.svg('tspan', { class: cls }, p) : K.el('span', { class: cls }, p)); return; }
      parent.appendChild(document.createTextNode(p));
    });
  }
  function write(node, s) {
    node.textContent = '';
    // A number keeps its unit on the same line.
    String(s).replace(/([\d`]) (?=(?:N|J|W|V|A|m)(?![\w\/]))/g, '$1 ').split('`').forEach((seg, k) => {
      if (!seg) return;
      if (k % 2) { vecs(node.appendChild(K.el('span', { class: 'nw' })), seg, false); return; }
      const re = /\*([^*]+)\*/g;
      let at = 0, m;
      while ((m = re.exec(seg))) {
        if (m.index > at) node.appendChild(document.createTextNode(seg.slice(at, m.index)));
        node.appendChild(K.el('span', { class: 'term' }, m[1]));
        at = m.index + m[0].length;
      }

  // ---------- 3-D ----------
  function PR(v) {
    const sa = Math.sin(G.al * RAD), ca = Math.cos(G.al * RAD), sb = Math.sin(G.be * RAD), cb = Math.cos(G.be * RAD);
    return [-sa * v[0] + ca * v[1], sb * ca * v[0] + sb * sa * v[1] - cb * v[2]];

  const P3 = (v) => { const q = PR(v); return [G.O[0] + q[0] * G.u, G.O[1] + q[1] * G.u]; };
  function triad(a) {
    const c = G.tri;
    BOX.push([c[0] - 46, c[1] - 46, 92, 72]);
    part(a, 0, () => {
      [['i', [1, 0, 0]], ['j', [0, 1, 0]], ['k', [0, 0, 1]]].forEach((t) => {

  // The plane of A and B: A's direction and the direction square to it, towards B.
  function plane(A, B) { const ua = unit(A); return { ua, e: unit(sub(B, scale(ua, dotv(B, ua)))) }; }
  const inPlane = (pl, L, phi) => add(scale(pl.ua, L * Math.cos(phi * RAD)), scale(pl.e, L * Math.sin(phi * RAD)));

    const d = pts.map((p, k) => (k ? ' L' : 'M') + pt2(p)).join('');

  function scene3(A, B, o) {
    const O = G.O, An = P3(A), Bn = P3(B), pl = plane(A, B), th = angleOf(A, B);

    for (let r = 30 / G.u; r <= Math.min(hyp(A), hyp(B)) * 0.92; r += 4 / G.u) c.push(P3(scale(bis, r)));

  }

  // ---------- the rope, the trolley and the crate ----------

  // Where a line from p along u leaves the picture.

    const ok = st.res === 'right', pick = st.res ? st.pick : null, F = [150, 200], dv = [4, 0];
    ropeScene({ F, dM: 4, kind: 'trolley', base: 1, line: 1, rays: 1, sh: 1, shText: 'shadow 150 N', shl: ok ? arr(0.2) : 0, wedge: 1, wTexts: ['θ'],
      aName: 'F', bName: 'd = 4 m', bNameCls: 'lb' });
    let said = 'A trolley on a rail. A rope pulls it with 150i + 200j N, and it moves 4 m along the rail. Light falls square onto the rail\'s line.';
    const Pp = G.P;
    if (ok) said += ' The rope\'s shadow on it is 150 N, so the work is 150 × 4 = 600 J.';
    else if (pick === '1000 J') { badAlong(Pp, hyp(F) * G.fS, '250 N, all of it'); said += ' The pick lays the whole 250 N pull along the rail, in red.'; }
    else if (pick === '800 J') { badUp([Pp[0] + F[0] * G.fS, Pp[1]], [Pp[0] + F[0] * G.fS, Pp[1] - F[1] * G.fS], '200 N up'); said += ' The pick uses the up part, drawn in red. It is square to the rail.'; }
    band(ok ? [{ l: 'work', s: num(dotv(F, dv)) + ' J', a: arr(0.4) }, { l: '|F||d| cos θ', s: sizesText(F, dv), a: arr(0.6) }, { l: 'F₁d₁ + F₂d₂', s: partsText(F, dv), a: arr(0.8) }]
      : [{ l: 'work', s: '?' }]);
    return said;
  };
  // The puzzle: 230 V and 23 A, 36.87° apart. The current's shadow on the voltage's line is the part in step.
  DRAW.power = (d, st) => {
    const ok = st.res === 'right', pick = st.res ? st.pick : null, cphi = 0.8, sphi = 0.6, O = G.O;
    const Vn = [O[0] + 230 * G.vS, O[1]], In = [O[0] + 23 * cphi * G.iS, O[1] + 23 * sphi * G.iS];
    REC.pw = 230 * 23 * cphi; REC.sU = 23 * cphi;
    keyLight(1, 'V');
    cast({ O, An: In, Bn: Vn, dir: [1, 0], sPx: In[0] - O[0], clip: [8, G.ly0, 332, G.ly1], aName: 'I = 23 A', aNameCls: 'lb', bName: 'V = 230 V', bNameCls: 'lb',
      line: 1, rays: 1, sh: 1, shText: 'in step ' + num(23 * cphi) + ' A', shl: ok ? arr(0.2) : 0, wedge: 1, wTexts: ['φ = ' + num(Math.acos(cphi) / RAD) + '°', 'φ'] });
    let said = 'A voltage arrow, 230 V, and a current arrow, 23 A, start from one point with 36.87° between them. Light falls square onto the voltage\'s line.';
    if (ok) said += ' The current\'s shadow on it, 18.4 A, is the part in step, so the true power is 230 × 18.4 = 4232 W.';
    else if (pick === '5290 W') { badAlong(O, 23 * G.iS, '23 A, all of it'); said += ' The pick lays the whole current along the voltage, in red.'; }
    else if (pick === '3174 W') { badUp([In[0], O[1]], In, num(23 * sphi) + ' A, square to V'); said += ' The pick uses the part square to the voltage, drawn in red.'; }
    band(ok ? [{ l: 'true power', s: num(REC.pw) + ' W', a: arr(0.4) }, { l: 'V I cos φ', s: '230 × 23 × ' + num(cphi), a: arr(0.6) }] : [{ l: 'true power', s: '?' }]);
    return said;
  };
  // The puzzle: a rope pulls back, −40i + 30j N, on a crate sliding 3 m along i.
  DRAW.crate = (d, st) => {
    const ok = st.res === 'right', pick = st.res ? st.pick : null, F = [-40, 30], dv = [3, 0];
    ropeScene({ F, dM: 3, kind: 'crate', base: 1, line: 1, rays: ok ? arr(0.2) : 0, sh: ok ? go(0.3, 0.6) : 0, shText: 'shadow ' + num(F[0]) + ' N', shl: ok ? arr(0.9) : 0,
      wedge: 1, wTexts: ['θ'], aName: 'F', bName: 'd = 3 m', bNameCls: 'lb' });
    let said = 'A crate on a deck moves 3 m along it. A rope pulls back on it with −40i + 30j N.';
    const Pp = G.P;
    if (ok) said += ' Light falls square onto the deck\'s line. The rope\'s shadow falls behind the start, 40 N, and counts as minus, so the work is −40 × 3 = −120 J.';
    else if (pick === '120 J') { badAlong(Pp, -F[0] * G.fS, '40 N, minus lost'); said += ' The pick puts the shadow in front of the crate, in red. It lost the minus.'; }
    else if (pick === '150 J') { badAlong(Pp, hyp(F) * G.fS, '50 N, all of it'); said += ' The pick lays the whole 50 N pull along the move, in red.'; }
    band(ok ? [{ l: 'work', s: num(dotv(F, dv)) + ' J', a: arr(0.6) }, { l: '|F||d| cos θ', s: sizesText(F, dv), a: arr(0.8) }, { l: 'F₁d₁ + F₂d₂', s: partsText(F, dv), a: arr(1.0) }]
      : [{ l: 'work', s: '?' }]);
    return said;
  };

  // ---------- the drags: the tips of a and b, and the rope ----------
  const mkGrip = (lab) => ui.appendChild(K.svg('circle', { class: 'grip', cx: 0, cy: 0, r: 22, tabindex: -1, role: 'button', 'aria-label': lab }));
  const grips = {
    A: mkGrip('The tip of arrow a: drag it, or use the arrow keys, to move it'),
    B: mkGrip('The tip of arrow b: drag it, or use the arrow keys, to move it'),
    R: mkGrip('The tip of the rope\'s arrow: drag it, or use the arrow keys, to swing it round'),
  };
  const GRIP_PIC = { A: { shadow: 1, swing: 1, parts: 1 }, B: { shadow: 1, parts: 1 }, R: { rail: 1 } };
  function placeGrips(d) {
    Object.keys(grips).forEach((k) => {
      const g = grips[k], on = !finished && !!d.show && !!GRIP_PIC[k][d.pic];
      const p = k === 'B' ? REC.Bpx : REC.Apx;
      g.style.display = on && p ? '' : 'none';
      g.setAttribute('tabindex', on ? '0' : '-1');
      if (on && p) { g.setAttribute('cx', r3(p[0])); g.setAttribute('cy', r3(p[1])); }
    });
  }
  function changed() {
    if (anim.playing()) anim.pause();
    T = Infinity;
    K.reveal(); K.refresh();
  }
  function setTip(k, v) {
    const w = [K.clamp(Math.round(v[0]), G.x0, G.x1), K.clamp(Math.round(v[1]), G.y0, G.y1)];
    if (!w[0] && !w[1]) return;
    S[cur()][k] = w; changed();
  }
  const clampAng = (a) => (a < 0 ? (a < -90 ? 180 : 0) : K.clamp(a, 0, 180));
  // A whole number of degrees; a drag lands exactly on 90° (and the rope on 30°) when it comes near.
  function setTh(a, snap) { let t = Math.round(clampAng(a)); if (snap && Math.abs(t - 90) <= 3) t = 90; S[cur()].th = t; changed(); }
  function setRope(a, snap) {
    let t = Math.round(clampAng(a));
    if (snap) { if (Math.abs(t - 30) <= 3) t = 30; else if (Math.abs(t - 90) <= 3) t = 90; }
    S[cur()].rope = t; changed();
  }
  function svgAt(e) {
    const ctm = svg.getScreenCTM();
    if (!ctm) return null;
    const q = new DOMPoint(e.clientX, e.clientY).matrixTransform(ctm.inverse());
    return [q.x, q.y];
  }
  let held = null;
  const onPic = (k) => !finished && !!STEPS[cur()].show && !!GRIP_PIC[k][STEPS[cur()].pic];
  function moveTo(k, q) {
    const d = STEPS[cur()];
    if (d.pic === 'swing') { setTh(Math.atan2(G.oy - q[1], q[0] - G.ox) / RAD, true); return; }
    if (d.pic === 'rail') { setRope(Math.atan2(G.P[1] - q[1], q[0] - G.P[0]) / RAD, true); return; }
    setTip(k, [(q[0] - G.ox) / G.u, (G.oy - q[1]) / G.u]);
  }
  Object.keys(grips).forEach((k) => {
    const g = grips[k];
    g.addEventListener('pointerdown', (e) => {
      if (!onPic(k)) return;
      const q = svgAt(e);
      if (!q) return;
      held = { id: e.pointerId, k };
      try { g.setPointerCapture(e.pointerId); } catch (err) { /* the drag still follows while the pointer stays on the grip */ }
      e.preventDefault();
      moveTo(k, q);
    });
    g.addEventListener('pointermove', (e) => {
      if (!held || held.id !== e.pointerId || held.k !== k || !onPic(k)) return;
      const q = svgAt(e);
      if (q) moveTo(k, q);
    });
    g.addEventListener('pointerup', (e) => { if (held && held.id === e.pointerId) held = null; });
    g.addEventListener('pointercancel', (e) => { if (held && held.id === e.pointerId) held = null; });
    g.addEventListener('lostpointercapture', () => { held = null; });
    g.addEventListener('keydown', (e) => {
      if (!onPic(k)) return;
      const by = { ArrowUp: [0, 1], ArrowDown: [0, -1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] }[e.key];
      if (!by) return;
      e.preventDefault();
      const d = STEPS[cur()], st = S[cur()], turn = 5 * (by[1] || -by[0]);
      if (d.pic === 'swing') { setTh((st.th == null ? 180 : st.th) + turn, false); return; }
      if (d.pic === 'rail') { setRope((st.rope == null ? 30 : st.rope) + turn, false); return; }
      const base = st[k] || (k === 'A' ? [3, 4] : d.pic === 'parts' ? [4, 3] : [4, 0]);
      setTip(k, add(base, by));
    });
  });

  // The scene for a step (the animation calls this every frame).
  function paint(i) {
    if (i == null) i = cur();
    const d = STEPS[i], st = S[i];
    G = d.geo;
    art.textContent = '';
    into = null; BOX = []; SEG = [];
    REC = { texts: [], bad: 0, band: null, dot: null, sU: null, shadowDot: false, F: null, Apx: null, Bpx: null, aV: null, bV: null, th: null, W: null, Fv: null, dv: null, pw: null, wedgeText: null, crowd: 0 };
    svg.setAttribute('viewBox', '0 0 340 ' + (G.hd + 26 + (G.rows - 1) * 28 + 14));
    svg.setAttribute('aria-label', DRAW[d.pic](d, st, i));
    placeGrips(d);
  }

  write(el('finish'), FINISH);
  K.update((p) => {
    const i = Math.round(p.step), d = STEPS[i], st = S[i];
    if (!anim.playing()) T = Infinity;   // motion that was stopped (the page hidden, a test) shows finished
    if (i !== lastStep) {
      lastStep = i; enter('stepbox');
      if (d.show) { Object.assign(st, { A: null, B: null, th: null, rope: null }); play(d.dur); }
      else { anim.pause(); T = Infinity; }
    }
    if (finished !== lastDone) { lastDone = finished; enter(finished ? 'done' : 'stepbox'); }
    const right = st.res === 'right';
    el('stepbox').hidden = finished;
    el('done').hidden = !finished;
    el('count').textContent = 'Step ' + (i + 1) + ' of ' + STEPS.length;
    const task = el('task');
    task.className = 'task' + (d.show ? ' show' : '');
    write(task, d.show ? d.text : d.task);
    paint(i);
    const act = el('act');
    write(act, d.act || '');
    act.hidden = finished || !d.act;
    replayBtn.el.hidden = !d.show || REDUCE;
    el('replay').hidden = replayBtn.el.hidden;
    const opts = d.show ? [] : d.opts || [];
    el('picks').hidden = !opts.length;
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      b.setLabel(opts[k]);
      b.el.textContent = '';
      vecs(b.el.appendChild(K.el('span')), opts[k], false);
      b.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });
    el('acts').hidden = !!d.show;
    checkBtn.el.hidden = right;
    const fb = el('fb');
    fb.hidden = !!d.show;
    fb.className = 'fb' + (right ? ' right' : st.res === 'wrong' ? ' wrong' : '');
    write(fb, d.show ? '' : right ? 'That\'s it.' : st.res === 'wrong' ? hintFor(i, st) : st.res === 'empty' ? 'Choose one of the answers first.' : '');
    const why = el('why');
    why.hidden = d.show || !st.why;
    write(why, d.show ? '' : d.why);
    whyBtn.setLabel(st.why ? 'Hide why' : 'Why?');
    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !right);
    nextBtn.setLabel(i === STEPS.length - 1 ? 'Finish' : 'Continue');
    nav.hidden = backBtn.el.hidden && nextBtn.el.hidden;
  });

  // ---------- known answers, worked out by hand ----------
  const DO = STEPS.map((d, i) => i).filter((i) => !STEPS[i].show);
  // A step painted in the state given (finished, or at t seconds into its motion): what it drew.
  function drawn(i, st, t) {
    const keepS = S[i], keepT = T;
    S[i] = st; T = t == null ? Infinity : t;
    try { paint(i); return REC; } finally { S[i] = keepS; T = keepT; paint(); }
  }
  const atSt = (pic, o) => { const i = atPic(pic); return drawn(i, o === 'solved' ? solved(i) : Object.assign(blank(), o || {})); };

  K.check('The scalar product of two vectors is obtained by multiplying their magnitudes with the cosine of the angle between them: wherever either tip is dragged, the dot product drawn is the two sizes times the cosine of the angle between the drawn arrows, its readout says so, and adding up the parts gives the same number', () => {
    const i = atPic('shadow'), O = [GA.ox, GA.oy];
    const test = (A, B) => {
      const r = drawn(i, Object.assign(blank(), { A, B })), va = sub(r.Apx, O), vb = sub(r.Bpx, O);
      const ang = Math.acos(K.clamp(dotv(va, vb) / (hyp(va) * hyp(vb)), -1, 1)), want = hyp(A) * hyp(B) * Math.cos(ang);
      return K.near(r.dot, want, 1e-6) && K.near(r.dot, A[0] * B[0] + A[1] * B[1], 1e-9) && r.band.main === num(want) &&
        r.band.items[0] === sizesText(A, B) && r.band.items[1] === partsText(A, B);
    };
    for (let x = GA.x0; x <= GA.x1; x++) for (let y = GA.y0; y <= GA.y1; y++) {
      if (!x && !y) continue;
      if (!test([x, y], [4, 0]) || !test([3, 4], [x, y])) return false;
    }
    return true;
  }, { source: SRC_SUM });
  K.check('The dot product is a scalar while the cross product is a vector: every dot product worked out on screen is a plain number with no i, j or k, and the answer written as an arrow is marked wrong and drawn in red', () => {
    const plain = STEPS.every((d, i) => { const r = drawn(i, d.show ? blank() : solved(i)); return !!r.band && r.band.main !== '?' && !/[ijk]/.test(r.band.main); });
    const j = atPic('shadowq'), dq = STEPS[j];
    return plain && dq.want !== '18i' && dq.opts.indexOf('18i') >= 0 && drawn(j, wrongSt(j, '18i')).bad > 0;
  }, { source: SRC_PROD });
  K.check('The scalar product of orthogonal vectors vanishes and the scalar product of antiparallel vectors is negative: arrows square to each other cast only a dot of shadow and give nothing, and arrows pointing opposite ways give a negative number', () => {
    const r90 = atSt('swing', { th: 90 }), r180 = atSt('swing', { th: 180 });
    if (r90.dot !== 0 || !r90.shadowDot || r90.band.main !== '0' || !(r180.dot < 0) || !(r180.sU < 0)) return false;
    const q = atPic('square'), rq = drawn(q, solved(q)), rb = drawn(q, wrongSt(q, '−2i − 1j'));
    if (rq.dot !== 0 || !rq.shadowDot || !(rb.dot < 0)) return false;
    const sq = atSt('shadow', { A: [2, 1], B: [-1, 2] }), op = atSt('shadow', { A: [4, 1], B: [-4, -1] });
    return sq.dot === 0 && sq.shadowDot && op.dot < 0 && op.sU < 0 && !op.shadowDot;
  }, { source: SRC_SUM });
  K.check('The work that a force performs while causing a displacement is the scalar product of the force vector with the displacement vector: at every angle the rope can be swung to, the work drawn is the pull dotted with the move, and so it is for the other ropes', () => {
    const i = atPic('rail');
    for (let th = 0; th <= 180; th += 5) {
      const r = drawn(i, Object.assign(blank(), { rope: th })), want = r.Fv[0] * r.dv[0] + r.Fv[1] * r.dv[1];
      if (!K.near(r.W, want, 1e-9) || !K.near(hyp(r.Fv), 200, 1e-9) || r.band.main !== num(want) + ' J') return false;
    }
    const rq = atSt('railq', 'solved'), rc = atSt('crate', 'solved');
    return K.near(rq.W, dotv([150, 200], [4, 0]), 1e-9) && K.near(rc.W, dotv([-40, 30], [3, 0]), 1e-9) && rq.band.main === num(rq.W) + ' J' && rc.band.main === num(rc.W) + ' J';
  }, { source: SRC_PROD });
  K.check('Every number follows from the rule: shadow 3 and 3 × 4 = 12; 3 × 6 = 18; 20 at 0°, 0 at 90°, −20 at 180°; 5 × 4 × cos 120° = −10; 12 + 12 = 24 at 16.26°; 2 − 2 = 0; 2 + 6 + 12 = 20 and 20 ÷ 21 gives 17.75°; cos⁻¹(4 ÷ 9) = 63.61°; 200 × 5 × cos 30° = 866.03 J with a 173.21 N shadow; 150 × 4 = 600 J; 230 × 23 × 0.8 = 4232 W; −40 × 3 = −120 J; and every wrong answer offered is a slip worked from the same values', () => {
    const hasT = (r, s) => r.texts.indexOf(s) >= 0;
    const B = (r, main, items) => !!r.band && r.band.main === main && items.every((s, k) => r.band.items[k] === s);
    const r1 = atSt('shadow'); if (!B(r1, '12', ['5 × 4 × cos 53.13°', '3 × 4 + 4 × 0']) || !hasT(r1, 'shadow 3')) return false;
    const r2 = atSt('shadowq', 'solved'); if (!B(r2, '18', ['5 × 6 × cos 53.13°', '3 × 6 + 4 × 0']) || !hasT(r2, 'shadow 3')) return false;
    if (atSt('swing', { th: 0 }).band.main !== '20' || !hasT(atSt('swing', { th: 90 }), 'shadow 0')) return false;
    const r3 = atSt('swing'); if (!B(r3, '−20', ['5 × 4 × cos 180°', '−5 × 4 + 0 × 0'])) return false;
    const r4 = atSt('swingq', 'solved'); if (!B(r4, '−10', ['5 × 4 × cos 120°', '−2.5 × 4 + 4.33 × 0']) || !hasT(r4, 'shadow −2.5')) return false;
    const r5 = atSt('parts'); if (!B(r5, '24', ['5 × 5 × cos 16.26°', '3 × 4 + 4 × 3']) || !hasT(r5, 'i·i = 1') || !hasT(r5, 'i·j = 0') || !hasT(r5, 'shadow 4.8')) return false;
    const r6 = atSt('square', 'solved'); if (!B(r6, '0', ['2.24 × 2.24 × cos 90°', '2 × 1 + 1 × (−2)']) || !hasT(r6, 'shadow 0')) return false;
    const r7 = atSt('three'); if (!B(r7, '17.75°', ['2 × 1 + 3 × 2 + 6 × 2 = 20', '7 × 3 = 21', '20 ÷ 21 = 0.95'])) return false;
    const r8 = atSt('threeq', 'solved'); if (!B(r8, '63.61°', ['2 × 2 + 2 × (−1) + 1 × 2 = 4', '3 × 3 = 9', '4 ÷ 9 = 0.44'])) return false;
    const r9 = atSt('rail'); if (!B(r9, '866.03 J', ['200 × 5 × cos 30°']) || !hasT(r9, 'shadow 173.21 N')) return false;
    const r10 = atSt('railq', 'solved'); if (!B(r10, '600 J', ['250 × 4 × cos 53.13°', '150 × 4 + 200 × 0']) || !hasT(r10, 'shadow 150 N')) return false;
    const r11 = atSt('power', 'solved'); if (!B(r11, '4232 W', ['230 × 23 × 0.8']) || !hasT(r11, 'in step 18.4 A')) return false;
    const r12 = atSt('crate', 'solved'); if (!B(r12, '−120 J', ['50 × 3 × cos 143.13°', '−40 × 3 + 30 × 0']) || !hasT(r12, 'shadow −40 N')) return false;
    const o = (pic) => STEPS[atPic(pic)].opts;
    return o('shadowq').indexOf(num(5 * 6)) >= 0 && o('swingq').indexOf(num(20 * sind(120))) >= 0 && o('swingq').indexOf(num(-20 * cosd(120))) >= 0 &&
      o('threeq').indexOf(num(Math.asin(4 / 9) / RAD) + '°') >= 0 && o('threeq').indexOf(num(Math.acos(4 / 6) / RAD) + '°') >= 0 &&
      o('railq').indexOf(num(250 * 4) + ' J') >= 0 && o('railq').indexOf(num(200 * 4) + ' J') >= 0 &&
      o('power').indexOf(num(230 * 23) + ' W') >= 0 && o('power').indexOf(num(230 * 23 * 0.6) + ' W') >= 0 &&
      o('crate').indexOf(num(40 * 3) + ' J') >= 0 && o('crate').indexOf(num(50 * 3) + ' J') >= 0;
  });
  K.check('As a swings from lying along b to pointing back the other way, its shadow on b\'s line shrinks at every step, is only a dot when the two are square, and falls behind the start only once they lean apart', () => {
    const i = atPic('swing');
    let last = Infinity;
    for (let th = 0; th <= 180; th += 2) {
      const r = drawn(i, Object.assign(blank(), { th }));
      if (!(r.sU < last) || r.shadowDot !== (th === 90) || (r.sU < -1e-12) !== (th > 90)) return false;
      last = r.sU;
    }
    return true;
  });
  K.check('Every puzzle offers three different answers with exactly one accepted, gives each wrong one its own hint, and draws a wrong pick in red but a right one without', () =>
    DO.every((i) => {
      const d = STEPS[i], wrong = d.opts.filter((o) => o !== d.want);
      return d.opts.length === 3 && new Set(d.opts).size === 3 && wrong.length === 2 && wrong.every((o) => !!d.hints[o]) && d.hints[wrong[0]] !== d.hints[wrong[1]] &&
        wrong.every((o) => drawn(i, wrongSt(i, o)).bad > 0) && drawn(i, solved(i)).bad === 0;
    }));
  K.check('Before Check no puzzle\'s picture shows its answer, and a right answer shows it', () =>
    DO.every((i) => { const d = STEPS[i]; return drawn(i, blank()).texts.indexOf(d.reveal) < 0 && drawn(i, solved(i)).texts.indexOf(d.reveal) >= 0; }));
  K.check('Every demonstration has finished arriving within 5 s of its screen opening, none starting before the 0.35 s screen fade ends; every answer\'s motion within 2.5 s', () => {
    const timed = (i, st, limit) => {
      const keepS = S[i], keepT = T;
      T = Infinity; latest = 0; earliest = Infinity; S[i] = st;
      try { paint(i); } finally { S[i] = keepS; T = keepT; }
      return latest <= limit + 1e-9;
    };
    const ok = STEPS.every((d, i) => {
      if (d.show) { const r = timed(i, blank(), d.dur); return r && d.dur <= 5 && d.dur >= 3 && earliest >= FADE; }
      return timed(i, solved(i), d.fb[0]) && d.fb[0] <= 2.5 && d.fb[1] <= 2.5 &&
        d.opts.filter((o) => o !== d.want).every((o) => timed(i, wrongSt(i, o), d.fb[1]));
    });
    paint();
    return ok;
  });

  K.ready();
</script>
