<p class="lead">A spanner on a bolt, drawn in 3-D, with a push on its handle. Later the same picture holds a wire carrying a current between two magnet poles. The pushes, currents and fields are example values.</p>

<p class="caption">Each answer is an arrow square to the two arrows that make it. The right-hand rule gives its direction.</p>

<script>
  const RAD = Math.PI / 180;
  // Exact values where the lesson's angles meet them, so 30° gives exactly half and 0° exactly nothing.
  const EXS = { 0: 0, 30: 0.5, 90: 1, 150: 0.5, 180: 0, '-30': -0.5, '-90': -1, '-150': -0.5, '-180': 0 };
  const EXC = { 0: 1, 60: 0.5, 90: 0, 120: -0.5, 180: -1, '-60': 0.5, '-90': 0, '-120': -0.5, '-180': -1 };
  const has = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
  const sind = (deg) => (has(EXS, deg) ? EXS[deg] : Math.sin(deg * RAD));
  const cosd = (deg) => (has(EXC, deg) ? EXC[deg] : Math.cos(deg * RAD));
  // Up to two decimals, as the lesson writes them: 45, 22.5, 38.97, 0.
  function num(v) { let r = Math.round(v * 100) / 100; if (Math.abs(r) < 1e-9) r = 0; return (r < 0 ? '−' : '') + String(Math.abs(r)); }
  const add = (p, q) => p.map((x, k) => x + q[k]);
  const sub = (p, q) => p.map((x, k) => x - q[k]);
  const scale = (p, s) => p.map((x) => x * s);
  const hyp = (v) => Math.hypot.apply(null, v);
  const unit = (v) => { const L = hyp(v) || 1; return scale(v, 1 / L); };
  const lerp2 = (a, b, e) => [a[0] + (b[0] - a[0]) * e, a[1] + (b[1] - a[1]) * e];
  const dotv = (p, q) => p.reduce((s, x, k) => s + x * q[k], 0);
  const cross3 = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];

  // ---------- each screen's layout ----------
  // The spanner: the top of the nut at O; ur px a metre for r, uf px a newton for F, um px a newton metre
  // for the moment arrow. Seen from azimuth al (turned between amin and amax) and elevation be.
  // Labels stay between ly0 and ly1; the readout band starts at hd and has `rows` lines.
  const SP = { kind: 'spanner', O: [92, 132], al: 300, amin: 270, amax: 320, be: 38, ur: 420, uf: 0.55, um: 2.2, ly0: 32, ly1: 244, hd: 248, rows: 2 };
  const SW = Object.assign({}, SP, { ly1: 236, hd: 240, rows: 3, tri: [292, 206] });
  const SQ = Object.assign({}, SP, { tri: [292, 214] });
  // The wire: its middle at O, Lw px long, the poles Pd px either side of it, fz px a newton of force.
  const WI = { kind: 'wire', O: [170, 150], al: 335, amin: 320, amax: 350, be: 38, Lw: 120, Pd: 90, fz: 60, ly0: 32, ly1: 244, hd: 248, rows: 2 };
  const MQ = { kind: 'wire', O: [170, 138], al: 300, amin: 285, amax: 320, be: 38, Lw: 110, Pd: 75, fz: 110, ly0: 32, ly1: 230, hd: 234, rows: 3, tri: [46, 200], triL: 42 };
  // The axes alone, L px long, in a view turned so that k points down the screen.
  const TQ = { kind: 'axes', O: [170, 126], al: 210, be: 38, roll: 180, L: 78, ly0: 32, ly1: 236, hd: 240, rows: 2 };

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // pic: what is drawn. dur: a SHOW step's demonstration in seconds. act: what he can do with it,
  // shown under the picture. A puzzle: task, opts (three answers), want, hints (one per wrong
  // answer), why, reveal (words only a right answer draws), fb (seconds of motion after a right and a wrong answer).
  const STEPS = [
    { show: true, name: 'Push square on', pic: 'push', geo: SP, dur: 4.6,
      text: 'A push `F` of 150 N meets the handle square on, 0.3 m from the bolt. The arrow `r` runs from the bolt to the push. Together they span a shaded parallelogram, with area 0.3 × 150 = 45. That is the moment you already work out, the push times its distance. The *cross product* `r × F` is an arrow of that size, 45 N m. It stands along the bolt, because it is square to both `r` and `F`.',
      act: 'Drag where the push meets the handle, or drag across the picture to turn it.' },
    { kind: 'pick', name: 'Nearer the bolt', pic: 'pushq', geo: SP, fb: [2.0, 1.5],
      task: 'The same 150 N push meets the handle square on, but only 0.2 m from the bolt. What is the moment\'s size?',
      opts: ['45 N m', '30 N m', '750 N m'], want: '30 N m', reveal: '30 N m, out of the nut',
      hints: { '45 N m': 'Not quite. That uses the whole handle. `r` runs only to where you push, 0.2 m out.',
        '750 N m': 'Not quite. That divides. A moment is the push times its distance from the bolt.' },
      why: '`r` runs from the bolt to the push, so it is 0.2 m long. Square on, sin 90° = 1. So the moment is 0.2 × 150 = 30 N m.' },
    { show: true, name: 'Swing the push', pic: 'swing', geo: SP, dur: 4.8,
      text: 'Now the push swings round toward the handle. θ is the angle between `r` and `F`. The part of `F` along the handle points straight through the bolt, so it turns nothing. Only the part square to the handle, `|F|` sin θ, turns it. So the moment\'s size is `|r||F|` sin θ. At 30° it halves to 22.5 N m. Along the handle it is nothing. Past the handle, the arrow flips.',
      act: 'Drag the tip of `F` round, or drag across the picture to turn it.' },
    { kind: 'pick', name: 'At a slant', pic: 'swingq', geo: SP, fb: [2.0, 1.5],
      task: 'A 150 N push meets the handle at 30°, 0.2 m from the bolt. What is the moment\'s size?',
      opts: ['15 N m', '25.98 N m', '30 N m'], want: '15 N m', reveal: '15 N m, out of the nut',
      hints: { '25.98 N m': 'Not quite. That uses cos, the part along the handle. That part turns nothing.',
        '30 N m': 'Not quite. That leaves out the angle. Only the part square to the handle turns the bolt.' },
      why: 'sin 30° is 0.5. So the moment is 0.2 × 150 × 0.5 = 15 N m. Only the part of the push square to the handle turns the bolt.' },
    { show: true, name: 'Which way it points', pic: 'way', geo: SP, dur: 4.4,
      text: 'The *right-hand rule* sets the arrow\'s direction. Curl your right fingers from `r` toward `F`, and your thumb points along `r × F`. Turn anticlockwise, seen from above, and the arrow points out of the nut. That undoes it. Turn clockwise and the arrow points into the nut. That does it up.',
      act: 'Drag the tip of `F` round, or drag across the picture to turn it.' },
    { kind: 'pick', name: 'Undo or do up', pic: 'wayq', geo: SP, fb: [2.0, 1.5],
      task: 'Read the turn this push gives the spanner. Which way does `r × F` point?',
      opts: ['Out of the nut', 'Along the handle', 'Into the nut'], want: 'Into the nut', reveal: '45 N m, into the nut',
      hints: { 'Out of the nut': 'Not quite. Curl your right fingers from `r` toward `F`, and see where your thumb points.',
        'Along the handle': 'Not quite. The arrow is square to both `r` and `F`, so it runs along the bolt.' },
      why: 'Point your fingers along `r` and curl them toward `F`, clockwise from above. Your thumb points down, into the nut. So this push does the nut up.' },
    { show: true, name: 'Swap the order', pic: 'swap', geo: SW, dur: 4.4,
      text: 'Swap the order and the arrow flips, so `F × r` = −(`r × F`). The axes follow the same rule. `i × j` = `k`, but `j × i` = −`k`. Round the cycle, `j × k` = `i` and `k × i` = `j`. An arrow crossed with itself gives 0, since sin 0° = 0.',
      act: 'Drag across the picture to turn it.' },
    { kind: 'pick', name: 'A turned view', pic: 'turnq', geo: TQ, fb: [2.4, 1.5],
      task: 'The view has turned, so `k` points down the screen. Which way does `j × i` point?',
      opts: ['Down the screen', 'Up the screen', 'It is 0'], want: 'Up the screen', reveal: 'j × i = −k',
      hints: { 'Down the screen': 'Not quite. That is `i × j`, which is `k`. Swap the order and the arrow flips.',
        'It is 0': 'Not quite. That is `i·j`, the dot product. Square arrows give the biggest cross product.' },
      why: '`i × j` = `k`, so `j × i` = −`k`, the opposite way. Here `k` points down the screen, so −`k` points up it. Turning the view changes how it looks, not the answer.' },
    { show: true, name: 'A wire between poles', pic: 'wire', geo: WI, dur: 4.2,
      text: 'The same rule gives the force on a wire between magnet poles. Point your fingers along the current and curl them toward the field. Your thumb gives the force. A current `I` of 10 A runs along the wire. Its length in the field, `l`, is 0.2 m. The field `B` is 0.8 T, and θ is the wire\'s angle to it. Lined up, the wire feels no force. Square across, it feels `IlB` sin θ = 10 × 0.2 × 0.8 × sin 90° = 1.6 N.',
      act: 'Drag the end of the wire round, or drag across the picture to turn it.' },
    { kind: 'pick', name: 'Wire at a slant', pic: 'wireq', geo: WI, fb: [2.0, 1.5],
      task: 'Now the wire lies at 30° to the field, with the same 10 A, 0.2 m and 0.8 T. What force does it feel?',
      opts: ['1.39 N', '1.6 N', '0.8 N'], want: '0.8 N', reveal: '0.8 N, up',
      hints: { '1.39 N': 'Not quite. That uses cos. The force goes with sin of the angle between the wire and the field.',
        '1.6 N': 'Not quite. That is the force square on. At 30°, only half of it is left.' },
      why: 'sin 30° is 0.5. So the force is 10 × 0.2 × 0.8 × 0.5 = 0.8 N. It still stands square to both the wire and the field.' },
    { kind: 'pick', name: 'By parts', pic: 'partsq', geo: SQ, fb: [2.0, 1.5],
      task: 'Take `r` = `0.3i` m and `F` = `150j` N. What is `r × F`?',
      opts: ['45k N m', '0 N m', '−45k N m'], want: '45k N m', reveal: '45k N m',
      hints: { '0 N m': 'Not quite. That is `r·F`, the dot product. These arrows are square, so the cross product is at its biggest.',
        '−45k N m': 'Not quite. That is `F × r`. Keep the order, and `i × j` = `k`.' },
      why: 'Multiply the sizes, 0.3 × 150 = 45. Then cross the directions, `i × j` = `k`. So `r × F` = `45k` N m, out of the nut.' },
    { kind: 'pick', name: 'Current along i', pic: 'motorq', geo: MQ, fb: [2.0, 1.5],
      task: 'A current of 4 A runs along `i`, through 0.25 m of wire. The field is 0.5 T along `k`. What force does the wire feel?',
      opts: ['0.5j N', '−0.5j N', '0 N'], want: '−0.5j N', reveal: '−0.5j N',
      hints: { '0.5j N': 'Not quite. Curl from the current, `i`, toward the field, `k`. Your thumb points along −`j`.',
        '0 N': 'Not quite. That is dot-product thinking. The wire is square to the field, so the force is at its biggest.' },
      why: 'The wire is square to the field, so the size is 4 × 0.25 × 0.5 = 0.5 N. For the direction, `k × i` = `j`, so `i × k` = −`j`. The force is `−0.5j` N.' },
  ];
  const FINISH = 'The cross product is an arrow square to both vectors. Its size is `|a||b|` sin θ, and the right-hand rule points it.';
  // The lesson's sources, each cited only by a check that restates its quote.
  const SRC_SUM = 'https://openstax.org/books/university-physics-volume-1/pages/2-summary';
  const SRC_PROD = 'https://openstax.org/books/university-physics-volume-1/pages/2-4-products-of-vectors';
  const SRC_WIRE = 'https://courses.lumenlearning.com/suny-physics/chapter/22-7-magnetic-force-on-a-current-carrying-conductor';
  const SRC_BBC = 'https://www.bbc.co.uk/bitesize/articles/zgr73qt';
  const FADE = 0.35;
  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const testing = () => document.documentElement.classList.contains('k-testing');
  const el = (id) => document.getElementById(id);
  const atPic = (pic) => STEPS.findIndex((d) => d.pic === pic);

  // ---------- each step's state ----------
  // pick, res, why: a puzzle's answer, its result and the Why? note. d: where along the handle he
  // pushes (m). th: the push's angle to the handle (degrees, anticlockwise from above). w: the
  // wire's angle to the field. al: how far he has turned the view.
  function blank() { return { pick: null, res: null, why: false, d: null, th: null, w: null, al: null }; }
  const isRight = (i, st) => st.pick != null && st.pick === STEPS[i].want;
  const hintFor = (i, st) => { const d = STEPS[i]; return (d.hints && d.hints[st.pick]) || 'Not quite. Look again at the picture.'; };
  const solved = (i) => Object.assign(blank(), { pick: STEPS[i].want, res: 'right' });
  const wrongSt = (i, o) => Object.assign(blank(), { pick: o, res: 'wrong' });
  let S = STEPS.map(() => blank());
  let finished = false, lastStep = -1, lastDone = false, T = Infinity;   // T: seconds into the current motion
  let motionEnd = 0;
  let REC = null;   // what the last paint drew, for the checks
  let G = null;     // the layout of the step being drawn
  let V = null;     // its view
  let BOX = [], SEG = [];   // what a label must keep clear of: other labels and solid shapes, and lines

  // ---------- text with amber key terms and bold vector letters (built with K.el, never innerHTML) ----------
  const VEC = /(IlB|(?<![A-Za-z])[abrFijkBlI](?![A-Za-z]))/;
  function vecs(parent, s, inSvg) {
    String(s).split(VEC).forEach((p, k) => {
      if (!p) return;
      if (k % 2) { (p === 'IlB' ? ['I', 'l', 'B'] : [p]).forEach((c) => { const cls = /[ijk]/.test(c) ? 'vu' : /[Il]/.test(c) ? 'vq' : 'vn'; parent.appendChild(inSvg ? K.svg('tspan', { class: cls }, c) : K.el('span', { class: cls }, c)); }); return; }
      parent.appendChild(document.createTextNode(p));
    });
  }
  function write(node, s) {
    node.textContent = '';
    // A number keeps its unit on the same line.
    String(s).replace(/(\d) N m\b/g, '$1\u00a0N\u00a0m').replace(/([\d`]) (?=(?:N|A|T|m)(?![\w\/]))/g, '$1\u00a0').split('`').forEach((seg, k) => {
      if (!seg) return;
      if (k % 2) { vecs(node.appendChild(K.el('span', { class: 'nw' })), seg, false); return; }
      const re = /\*([^*]+)\*/g;
      let at = 0, m;
      while ((m = re.exec(seg))) {
        if (m.index > at) node.appendChild(document.createTextNode(seg.slice(at, m.index)));
        node.appendChild(K.el('span', { class: 'term' }, m[1]));

        const u1 = [foot[0] > rW[0] - 1e-6 ? -8 : 8, 0, 0], u2 = [0, Math.sign(FW[1]) * 8, 0];
        put(K.svg('path', { class: 'ram', d: 'M' + pt2(P3(add(foot, u1))) + ' L' + pt2(P3(add(add(foot, u1), u2))) + ' L' + pt2(P3(add(foot, u2))) }));
      });
    }
    // The angle θ between r's line and F, at the push.
    let wedgeC = null;
    if (o.wedge != null && ang >= 8 && ang <= 172) {
      const pts = [];
      for (let k = 0; k <= 16; k++) { const t = th * k / 16 * RAD; pts.push(P3(add(rW, [22 * Math.cos(t), 22 * Math.sin(t), 0]))); }
      for (let k = 1; k < pts.length; k++) seg(pts[k - 1], pts[k]);
      if (o.wedge > 0) part(o.wedge, 0, () => put(K.svg('path', { class: 'arc', d: 'M' + pts.map(pt2).join(' L') })));
      wedgeC = [];
      for (let D = 34; D <= 112; D += 4) wedgeC.push(P3(add(rW, [D * cosd(th / 2), D * sind(th / 2), 0])));
    }
    if (o.curl != null) curl(o.curl * K.clamp(Math.abs(sind(th)) * 3, 0, 1), Math.sign(th) * (Math.abs(sind(th)) > 1e-9 ? 1 : 0));
    if (eR > 0) pxArrow(O, lerp2(O, Rp, eR), 'vr');
    if (eF > 0) pxArrow(Rp, lerp2(Rp, FTp, eF), 'vf');
    if (o.eM != null && o.eM > 0) {
      if (zero) part(o.eM, 0, () => put(K.svg('circle', { class: 'zero', cx: r3(O[0]), cy: r3(O[1]), r: 5 })));
      else pxArrow(O, lerp2(O, Mp, o.eM), 'vm');
    }
    if (o.eM2 != null && o.eM2 > 0 && !zero) pxArrow(O, lerp2(O, M2p, o.eM2), 'vo');
    if (o.knob === 'P') knob(Rp, o.knobA);
    if (o.knob === 'F') knob(FTp, o.knobA);
    // The names, the most important first.
    if (o.eM != null) {
      const nm = (o.eM >= 1 ? (o.nm == null ? 1 : o.nm) : 0);
      if (zero) label(nm, 'r × F = 0', 'lb', ringCands(O, tw('r × F = 0', 'lb'), 15, 26), { vec: true });
      else { const w = tw('r × F', 'nm'); label(nm * K.clamp(size / 6, 0, 1), 'r × F', 'nm', noseCands(O, Mp, w, 17).concat(besideCands(O, Mp, w, 17, null, 0, [0, 10])), { vec: true }); }
    }
    if (o.eM2 != null && !zero) { const w = tw('F × r', 'nm'); label(o.eM2 >= 1 ? (o.nm2 == null ? 1 : o.nm2) : 0, 'F × r', 'nm', noseCands(O, M2p, w, 17).concat(besideCands(O, M2p, w, 17, null, 0, [0, 10])), { vec: true }); }
    const wf = tw(o.fText, 'lb'), wr = tw(o.rText, 'lb');
    label(eF >= 1 ? (o.nf == null ? 1 : o.nf) : 0, o.fText, 'lb', noseCands(Rp, FTp, wf, 15).concat(besideCands(Rp, FTp, wf, 15, O, 0, [0, 12])), { vec: true });
    label(eR >= 1 ? (o.nr == null ? 1 : o.nr) : 0, o.rText, 'lb', besideCands(O, Rp, wr, 15, FTp, 1, [6, 16]).concat(besideCands(O, Rp, wr, 15, FTp, -1, [0, 12])), { vec: true });
    if (fp && htA > 0) { const w = tw('|F| sin θ', 'sm'); label(htA, '|F| sin θ', 'sm', besideCands(fp, FTp, w, 13, Rp, 1, [0, 10]).concat(besideCands(fp, FTp, w, 13, Rp, -1, [0])), { vec: true }); }
    if (wedgeC) label(o.wedge, o.thText ? 'θ = ' + num(ang) + '°' : 'θ', 'sm ok', wedgeC, { strict: true });
    return { O, Rp, FTp, Mp, rW, FW, FT, Mk, size, ang, d, Fn, zero };
  }
  function momentBand(r, al, hide) {
    band([{ l: 'moment', s: hide ? '?' : mText(r.Mk), a: al[0] },
      { l: '|r||F| sin θ', s: hide ? null : num(r.d) + ' × ' + num(r.Fn) + ' × sin ' + num(r.ang) + '°', a: al[1] }]);
  }
  // A wrong pick drawn as a red arrow from p to q (shifted to one side), with its words.
  function badArrow(p, q, s, shift) {
    const w = tw(s, 'sm bad'), dx = q[0] - p[0], dy = q[1] - p[1], L = Math.hypot(dx, dy) || 1, n = [dy / L * (shift || 0), -dx / L * (shift || 0)];
    const p2 = add(p, n), q2 = add(q, n);
    seg(p2, q2);
    pxArrow(p, lerp2(p, q, go(0.1, 0.8)), 'bad', shift);
    label(arr(0.8), s, 'sm bad', noseCands(p2, q2, w, 13).concat(besideCands(p2, q2, w, 13, null, 0, [0, 10, 20])), { vec: true });
    REC.bad++;
  }
  function badLine(p, q, s) {
    const w = tw(s, 'sm bad');
    seg(p, q);
    ln('badln', p, lerp2(p, q, go(0.1, 0.8)));
    label(arr(0.8), s, 'sm bad', besideCands(p, q, w, 13, null, 0, [4, 14, 24]), { vec: true });
    REC.bad++;
  }
  function badDot(p, s) {
    const w = tw(s, 'sm bad');
    part(arr(0.1), 0, () => put(K.svg('circle', { class: 'zero bad', cx: r3(p[0]), cy: r3(p[1]), r: 6 })));
    label(arr(0.6), s, 'sm bad', ringCands(p, w, 13, 28).concat(ringCands(p, w, 13, 44)), { vec: true });
    REC.bad++;
  }

  // ---------- the wire between two magnet poles ----------
  // o: f (the field's direction), u, v (half sides of a pole face), tag and tagS (where N and S sit on their faces, clear of the field lines),
  // lines (where the field lines run), lW and ang (the wire's direction and its angle to the field),
  // I, Lm, Bt (A, m, T); arrivals base, fl, wire, eI, wedge, eF and the names nI, nB, nF.
  function wireScene(o) {
    const Cp = G.O, f = o.f, Pd = G.Pd, lW = o.lW, ang = o.ang;
    const Fsize = o.I * o.Lm * o.Bt * sind(ang), Fdir = unit(cross3(lW, f)), zero = Fsize < 0.0005;
    const Fp = P3(scale(Fdir, Fsize * G.fz));
    Object.assign(REC, { lW: lW.slice(), BW: scale(f, o.Bt), Fw: scale(Fdir, Fsize), Fsize, zero, ang });
    // The poles: the nearer face is drawn last.
    const Nc = scale(f, -Pd), Sc = scale(f, Pd);
    const face = (c) => [add(add(c, o.u), o.v), add(sub(c, o.u), o.v), sub(sub(c, o.u), o.v), sub(add(c, o.u), o.v)].map(P3);
    const NF = face(Nc), SF = face(Sc);
    [NF, SF].forEach((F) => { for (let k = 0; k < 4; k++) seg(F[k], F[(k + 1) % 4]); });
    const cam = [V.ca * V.cb, V.sa * V.cb, V.sb];
    const nearN = dotv(Nc, cam) > dotv(Sc, cam);
    keyRow([{ sw: 'fl', s: 'field line, from N to S' }], o.base);
    part(o.base, 0, () => (nearN ? [SF, NF] : [NF, SF]).forEach((F) => put(K.svg('path', { class: 'pole', d: poly(F) }))));
    const nP = P3(add(Nc, o.tag)), sP = P3(add(Sc, o.tagS || o.tag));
    BOX.push([nP[0] - 10, nP[1] - 11, 20, 22], [sP[0] - 10, sP[1] - 11, 20, 22]);
    part(o.base, 0, () => { text(nP[0], nP[1] + 6, 'N', 'nm pl'); text(sP[0], sP[1] + 6, 'S', 'nm pl'); });
    // The field, evenly spaced, running from N to S.
    const fls = o.lines.map((off) => [P3(add(Nc, off)), P3(add(Sc, off))]);
    fls.forEach((p) => seg(p[0], p[1]));
    if ((o.fl || 0) > 0) part(o.fl, 0, () => fls.forEach((p) => { ln('fl', p[0], p[1]); head(lerp2(p[0], p[1], 0.82), unit(sub(p[1], p[0])), 'flh', 9); }));
    // The wire, with the current along it.
    const half = G.Lw / 2, A = P3(scale(lW, -half)), Bq = P3(scale(lW, half));
    thick(A, Bq, 5);
    REC.Wpx = Bq;
    if ((o.wire || 0) > 0) part(o.wire, 0, () => ln('wire', A, Bq));
    if ((o.eI || 0) > 0) pxArrow(A, lerp2(A, Bq, o.eI), 'vc');
    // The angle between the wire and the field.
    let wedgeC = null;
    if (o.wedge != null && ang >= 8 && ang <= 172) {
      const e = unit(sub(lW, scale(f, dotv(lW, f)))), pts = [];
      for (let k = 0; k <= 16; k++) { const t = ang * k / 16 * RAD; pts.push(P3(add(scale(f, 24 * Math.cos(t)), scale(e, 24 * Math.sin(t))))); }
      for (let k = 1; k < pts.length; k++) seg(pts[k - 1], pts[k]);
      if (o.wedge > 0) part(o.wedge, 0, () => put(K.svg('path', { class: 'arc', d: 'M' + pts.map(pt2).join(' L') })));
      const bis = unit(add(scale(f, Math.cos(ang / 2 * RAD)), scale(e, Math.sin(ang / 2 * RAD))));
      wedgeC = [];
      for (let D = 30; D <= 66; D += 3) wedgeC.push(P3(scale(bis, D)));
    }
    // The force, square to both.
    if (o.eF != null) {
      if (zero) { if (o.eF > 0) part(o.eF, 0, () => put(K.svg('circle', { class: 'zero', cx: r3(Cp[0]), cy: r3(Cp[1]), r: 5 }))); }
      else { seg(Cp, Fp); if (o.eF > 0) pxArrow(Cp, lerp2(Cp, Fp, o.eFg == null ? 1 : o.eFg), 'vm'); }
    }
    if (o.knob != null) knob(Bq, o.knob);
    if (o.eF != null) {
      if (zero) label(o.nF, 'no force', 'lb', ringCands(Cp, tw('no force', 'lb'), 15, 22), {});
      else { const w = tw(o.fText, 'nm'); label(o.nF * K.clamp(Fsize / 0.15, 0, 1), o.fText, 'nm', noseCands(Cp, Fp, w, 17).concat(besideCands(Cp, Fp, w, 17, null, 0, [0, 10])), { vec: true }); }
    }
    const wi = tw(o.iText, 'lb');
    label((o.eI || 0) >= 1 ? o.nI : 0, o.iText, 'lb', noseCands(A, Bq, wi, 15).concat(besideCands(A, Bq, wi, 15, Fp, 0, [0, 12])), { vec: true });
    const wb = tw(o.bText, 'lb'), last = fls[fls.length - 1], first = fls[0];
    label(o.nB, o.bText, 'lb', besideCands(last[0], last[1], wb, 15, Cp, 1, [0, 12]).concat(besideCands(first[0], first[1], wb, 15, Cp, 1, [0, 12]), noseCands(last[0], last[1], wb, 15)), { vec: true });
    if (wedgeC) label(o.wedge, o.thText ? 'θ = ' + num(ang) + '°' : 'θ', 'sm ok', wedgeC, { strict: true });
    return { Cp, A, Bq, Fp, Fsize, zero, ang };
  }
  const fText = (r) => (r.zero ? '0 N, no force' : num(r.Fsize) + ' N, up');
  function wireBand(r, al, hide) {
    band([{ l: 'force', s: hide ? '?' : fText(r), a: al[0] },
      { l: 'IlB sin θ', s: hide ? null : '10 × 0.2 × 0.8 × sin ' + num(r.ang) + '°', a: al[1] }]);
  }
  // The wire in a field along j, at w degrees to it.
  const wireJ = (w) => ({ f: [0, 1, 0], u: [46, 0, 0], v: [0, 0, 34], tag: [0, 0, 19], lines: [[-38, 0, 0], [0, 0, 0], [38, 0, 0]], lW: [sind(w), cosd(w), 0], ang: w, I: 10, Lm: 0.2, Bt: 0.8,
    iText: 'I = 10 A', bText: 'B = 0.8 T', fText: 'F' });

  // ---------- each picture ----------
  const DRAW = {};
  // 150 N square on, 0.3 m out: 45 N m out of the nut. He drags where the push meets the handle.
  DRAW.push = (d, st) => {
    const intro = st.d == null, ia = (t) => (intro ? arr(t) : 1), ig = (t, du) => (intro ? go(t, du) : 1);
    const dm = st.d == null ? 0.3 : st.d;
    const r = spanner({ d: dm, th: 90, base: ia(0.4), eR: ig(0.8, 0.6), nr: ia(1.4), eF: ig(1.5, 0.6), nf: ia(2.1), para: ia(2.4), eM: ig(2.7, 0.8), nm: ia(3.4),
      knob: 'P', knobA: ia(1.4), rText: 'r = ' + num(dm) + ' m', fText: 'F = 150 N' });
    momentBand(r, [ia(3.5), ia(3.8)]);
    return 'A spanner on a bolt, drawn in 3-D. A push F of 150 N meets the handle square on, ' + num(dm) + ' m from the bolt. The arrow r runs from the bolt to the push, and r and F span a shaded parallelogram of area ' +
      num(r.size) + '. The moment arrow r × F stands along the bolt, pointing out of the nut, with size ' + num(r.size) + ' N m.';
  };
  // The puzzle: the same push, 0.2 m out.
  DRAW.pushq = (d, st) => {
    const ok = st.res === 'right', pick = st.res ? st.pick : null;
    const r = spanner({ d: 0.2, th: 90, base: 1, para: 1, eM: ok ? go(0.2, 0.8) : null, nm: ok ? arr(0.9) : 0, rText: 'r = 0.2 m', fText: 'F = 150 N' });
    let said = 'A spanner on a bolt, drawn in 3-D. A push F of 150 N meets the handle square on, 0.2 m from the bolt, and r and F span a shaded parallelogram.';
    if (ok) said += ' Its area is 0.2 × 150 = 30, so the moment arrow r × F stands out of the nut with size 30 N m.';
    else if (pick === '45 N m') { badArrow(G.O, P3([0.3 * G.ur, 0, 0]), 'the whole handle, 0.3 m', -12); said += ' The pick runs r along the whole handle, drawn in red. But r ends where the push is.'; }
    else if (pick === '750 N m') { badArrow(G.O, [G.O[0], G.ly0 + 4], '750 N m, off the top', 0); said += ' The pick, 750 N m, is drawn in red and runs off the top. Dividing makes it far too big.'; }
    momentBand(r, ok ? [arr(1.0), arr(1.2)] : [1, 0], !ok);
    return said;
  };
  // The push swings from square on to 30°, rests, rests again along the handle, then on past it to 30° the other side.
  DRAW.swing = (d, st) => {
    const intro = st.th == null, ia = (t) => (intro ? arr(t) : 1), ig = (t, du) => (intro ? go(t, du) : 1);
    const th = intro ? 90 - 60 * go(1.7, 0.8) - 30 * go(3.0, 0.6) - 30 * go(4.2, 0.6) : st.th;
    REC.th = th;
    const r = spanner({ d: 0.3, th, base: ia(0.4), eR: ig(0.6, 0.5), nr: ia(1.0), eF: ig(0.8, 0.5), nf: ia(1.2), para: ia(1.1), line: ia(1.2), ht: ia(1.4), wedge: ia(1.4), thText: true,
      eM: ig(1.2, 0.5), nm: ia(1.6), knob: 'F', knobA: ia(1.6), rText: 'r = 0.3 m', fText: 'F = 150 N' });
    momentBand(r, [ia(1.6), ia(1.7)]);
    return 'A spanner on a bolt, drawn in 3-D. A push F of 150 N acts 0.3 m out, at ' + num(r.ang) + '° to the handle. ' +
      (r.zero ? 'It lies along the handle, so the parallelogram is flat and the moment is nothing.'
        : 'Its part square to the handle sets the parallelogram\'s height, so the moment is ' + num(r.size) + ' N m, ' + dirWords(r.Mk) + '.');
  };
  // The puzzle: 150 N at 30°, 0.2 m out.
  DRAW.swingq = (d, st) => {
    const ok = st.res === 'right', pick = st.res ? st.pick : null;
    const r = spanner({ d: 0.2, th: 30, base: 1, para: 1, line: 1, wedge: 1, thText: true, ht: ok ? arr(0.2) : null, eM: ok ? go(0.3, 0.8) : null, nm: ok ? arr(1.0) : 0, rText: 'r = 0.2 m', fText: 'F = 150 N' });
    let said = 'A spanner on a bolt, drawn in 3-D. A push F of 150 N acts 0.2 m out, at 30° to the handle.';
    if (ok) said += ' Only its part square to the handle, half of it, sets the parallelogram\'s height. So the moment is 0.2 × 150 × 0.5 = 15 N m, pointing out of the nut.';
    else if (pick === '25.98 N m') { badLine(r.Rp, P3([r.rW[0] + r.FW[0], 0, 0]), 'the part along the handle'); said += ' The pick uses the part of the push along the handle, drawn in red. That part turns nothing.'; }
    else if (pick === '30 N m') { badArrow(r.Rp, P3(add(r.rW, [0, 150 * G.uf, 0])), 'as if square on', 0); said += ' The pick treats the push as if it were square on, drawn in red.'; }
    momentBand(r, ok ? [arr(1.1), arr(1.3)] : [1, 0], !ok);
    return said;
  };
  // The right-hand rule: anticlockwise points out of the nut, then the push swings over to clockwise.
  DRAW.way = (d, st) => {
    const intro = st.th == null, ia = (t) => (intro ? arr(t) : 1), ig = (t, du) => (intro ? go(t, du) : 1);
    const th = intro ? 90 - 180 * go(2.4, 1.6) : st.th;
    REC.th = th;
    const r = spanner({ d: 0.3, th, base: ia(0.4), eR: ig(0.6, 0.5), nr: ia(1.0), eF: ig(0.8, 0.5), nf: ia(1.2), para: ia(1.1), curl: ia(1.5), eM: ig(1.2, 0.5), nm: ia(1.6),
      knob: 'F', knobA: ia(1.6), rText: 'r', fText: 'F' });
    momentBand(r, [ia(1.7), ia(1.8)]);
    return 'A spanner on a bolt, drawn in 3-D, seen from above. A push F acts at ' + num(r.ang) + '° to the handle. ' +
      (r.zero ? 'It lies along the handle, so there is no turn and no arrow.'
        : 'Curling the right hand\'s fingers from r toward F turns ' + (r.Mk > 0 ? 'anticlockwise, so the thumb and the moment arrow point out of the nut, which undoes it.' : 'clockwise, so the thumb and the moment arrow point into the nut, which does it up.'));
  };
  // The puzzle: a clockwise push.
  DRAW.wayq = (d, st) => {
    const ok = st.res === 'right', pick = st.res ? st.pick : null;
    const r = spanner({ d: 0.3, th: -90, base: 1, para: 1, curl: 1, eM: ok ? go(0.2, 0.8) : null, nm: ok ? arr(0.9) : 0, rText: 'r', fText: 'F' });
    let said = 'A spanner on a bolt, drawn in 3-D, seen from above. The push F turns the spanner clockwise.';
    if (ok) said += ' Curling the right hand\'s fingers from r toward F, the thumb points down. So the moment arrow points into the nut, and this push does it up.';
    else if (pick === 'Out of the nut') { badArrow(G.O, P3([0, 0, 45 * G.um]), 'out of the nut', 0); said += ' The pick points the arrow out of the nut, drawn in red. That is the anticlockwise way.'; }
    else if (pick === 'Along the handle') { badArrow(G.O, P3([45 * G.um, 0, 0]), 'along the handle', 14); said += ' The pick lays the arrow along the handle, drawn in red. But it must be square to both r and F.'; }
    momentBand(r, ok ? [arr(1.0), arr(1.2)] : [1, 0], !ok);
    return said;
  };
  // r × F, then F × r the other way, and the axes.
  DRAW.swap = (d, st) => {
    const r = spanner({ d: 0.3, th: 90, base: arr(0.4), eR: go(0.6, 0.5), nr: arr(1.0), eF: go(0.8, 0.5), nf: arr(1.2), para: arr(1.1), eM: go(1.4, 0.6), nm: arr(2.0), eM2: go(2.4, 0.6), nm2: arr(3.0), rText: 'r', fText: 'F' });
    triad(arr(3.2));
    band([{ l: 'r × F', s: mText(r.Mk), a: arr(3.3) }, { l: 'F × r', s: mText(-r.Mk), a: arr(3.5) }, { l: 'axes', s: 'i × j = k, j × k = i, k × i = j', a: arr(3.7) }]);
    return 'A spanner on a bolt, drawn in 3-D. With r along the handle and F square to it, r × F points out of the nut, 45 N m. F × r is the same size, pointing into the nut. Beside them, the axes i, j and k: i × j = k, j × k = i and k × i = j.';
  };
  // The puzzle: the axes in a view turned so k points down the screen. A right answer draws j × i,
  // then the view turns back.
  DRAW.turnq = (d, st) => {
    const ok = st.res === 'right', pick = st.res ? st.pick : null, e = ok ? go(1.0, 1.4) : 0;
    G.al = 210 + 90 * e; G.roll = 180 * (1 - e); V = view();
    const O = G.O, L = G.L, s = L * 0.62;
    const ax = [['i', [L, 0, 0]], ['j', [0, L, 0]], ['k', [0, 0, L]]].map((t) => ({ n: t[0], p: P3(t[1]) }));
    ax.forEach((a) => seg(O, a.p));
    const mk = P3([0, 0, -L]);
    REC.kDy = ax[2].p[1] - O[1];
    if (ok) { seg(O, mk); REC.ans = [0, 0, -1]; REC.ansDy = mk[1] - O[1]; }
    keyRow([{ sw: 'swf', s: 'the square of i and j' }], 1);
    part(1, 0, () => put(K.svg('path', { class: 'para', d: poly([[0, 0, 0], [s, 0, 0], [s, s, 0], [0, s, 0]].map(P3)) })));
    ax.forEach((a) => pxArrow(O, a.p, 'vi'));
    let said = 'Three arrows, i, j and k, drawn in 3-D from one point, with the square of i and j shaded.';
    if (ok) {
      pxArrow(O, lerp2(O, mk, go(0.2, 0.6)), 'vm');
      const w = tw('j × i = −k', 'lb');
      label(arr(0.6), 'j × i = −k', 'lb', noseCands(O, mk, w, 15).concat(besideCands(O, mk, w, 15, null, 0, [0, 12])), { vec: true });
      said += ' The answer, j × i = −k, is drawn opposite k. The view has turned back, so k points up the screen and j × i points down it.';
    } else {
      said += ' The view is turned, so k points down the screen.';
      if (pick === 'Down the screen') { badArrow(O, ax[2].p, 'down the screen is i × j', 12); said += ' The pick, down the screen, is drawn in red. That is k, which is i × j.'; }

    if (!B(atSt('wire'), '1.6 N, up', ['10 × 0.2 × 0.8 × sin 90°'])) return false;
    if (!B(atSt('wire', { w: 0 }), '0 N, no force', ['10 × 0.2 × 0.8 × sin 0°'])) return false;
    if (!B(atSt('wireq', 'solved'), '0.8 N, up', ['10 × 0.2 × 0.8 × sin 30°'])) return false;
    if (!B(atSt('partsq', 'solved'), '45k N m', ['0.3 × 150 × (i × j) = 45k'])) return false;
    if (!B(atSt('motorq', 'solved'), '−0.5j N', ['4 × 0.25 × 0.5 × sin 90° = 0.5', 'i × k = −j'])) return false;
    const o = (pic) => STEPS[atPic(pic)].opts;
    return o('pushq').indexOf(num(0.3 * 150) + ' N m') >= 0 && o('pushq').indexOf(num(150 / 0.2) + ' N m') >= 0 &&
      o('swingq').indexOf(num(30 * Math.cos(30 * RAD)) + ' N m') >= 0 && o('swingq').indexOf(num(0.2 * 150) + ' N m') >= 0 &&
      o('wireq').indexOf(num(1.6 * Math.cos(30 * RAD)) + ' N') >= 0 && o('wireq').indexOf(num(10 * 0.2 * 0.8) + ' N') >= 0 &&
      o('partsq').indexOf('−' + num(0.3 * 150) + 'k N m') >= 0 && o('motorq').indexOf(num(4 * 0.25 * 0.5) + 'j N') >= 0;
  });
  K.check('As the push swings from square on to along the handle, the moment shrinks at every step, halves at 30° and is nothing along the handle; past it the arrow points into the nut; swapping r and F flips the arrow; and i × j = k, j × k = i, k × i = j, j × i = −k and i × i = 0', () => {
    const i = atPic('swing');
    let last = Infinity;
    for (let th = 90; th >= 0; th -= 2) {
      const r = drawn(i, Object.assign(blank(), { th }));
      if (!(r.size < last) || (th === 0) !== r.zero || (th > 0 && !(r.Mw[2] > 0))) return false;
      last = r.size;
    }
    if (!K.near(atSt('swing', { th: 30 }).size * 2, atSt('swing', { th: 90 }).size, 1e-9) || !(atSt('swing', { th: -30 }).Mw[2] < 0)) return false;
    const s = atSt('swap');
    if (!s.M2 || !K.near(s.M2[2], -s.Mw[2], 1e-9) || !(s.Mw[2] > 0)) return false;
    const I = [1, 0, 0], J = [0, 1, 0], Kz = [0, 0, 1], eq = (a, b) => a.every((x, k) => K.near(x, b[k], 1e-12));
    const tq = atSt('turnq'), ts = atSt('turnq', 'solved');
    return eq(cross3(I, J), Kz) && eq(cross3(J, Kz), I) && eq(cross3(Kz, I), J) && eq(cross3(J, I), [0, 0, -1]) && eq(cross3(I, I), [0, 0, 0]) &&
      tq.kDy > 0 && ts.kDy < 0 && eq(ts.ans, cross3(J, I)) && ts.ansDy > 0;
  });
  K.check('Every puzzle offers three different answers with exactly one accepted, gives each wrong one its own hint, and draws a wrong pick in red but a right one without', () =>
    DO.every((i) => {
      const d = STEPS[i], wrong = d.opts.filter((o) => o !== d.want);
      return d.opts.length === 3 && new Set(d.opts).size === 3 && wrong.length === 2 && wrong.every((o) => !!d.hints[o]) && d.hints[wrong[0]] !== d.hints[wrong[1]] &&
        wrong.every((o) => drawn(i, wrongSt(i, o)).bad > 0) && drawn(i, solved(i)).bad === 0;
    }));
  K.check('Before Check no puzzle\'s picture shows its answer, and a right answer shows it', () =>
    DO.every((i) => { const d = STEPS[i]; return drawn(i, blank()).texts.indexOf(d.reveal) < 0 && drawn(i, solved(i)).texts.indexOf(d.reveal) >= 0; }));
  K.check('Every demonstration has finished arriving within 5 s of its screen opening, none starting before the 0.35 s screen fade ends; every answer\'s motion within 2.5 s', () => {
    const timed = (i, st, limit) => {
      const keepS = S[i], keepT = T;
      T = Infinity; latest = 0; earliest = Infinity; S[i] = st;
      try { paint(i); } finally { S[i] = keepS; T = keepT; }
      return latest <= limit + 1e-9;
    };
    const ok = STEPS.every((d, i) => {
      if (d.show) { const r = timed(i, blank(), d.dur); return r && d.dur <= 5 && d.dur >= 3 && earliest >= FADE; }
      return timed(i, solved(i), d.fb[0]) && d.fb[0] <= 2.5 && d.fb[1] <= 2.5 &&
        d.opts.filter((o) => o !== d.want).every((o) => timed(i, wrongSt(i, o), d.fb[1]));
    });
    paint();
    return ok;
  });

  K.ready();
</script>
