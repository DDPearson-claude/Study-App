<!-- kind: concept -->
<style>
  [hidden] { display: none !important; }
  .pz, .lead, .caption { max-width: 30rem; }
  .pz > * + *, #stepbox > * + * { margin-top: 14px; }
  /* The stepper is the page's step control: its dots are the progress bar; Back and Continue are below. */
  .pz .k-stepper { gap: 0; }
  .pz .k-stepper .k-label, .pz .k-stepper-nav { display: none; }
  .pz .count { margin-top: 10px; }
  .task { font-size: 1.2rem; font-weight: 700; line-height: 1.5; margin-top: 4px; }
  .task.show { font-size: 1.12rem; font-weight: 400; line-height: 1.6; }
  .nw { white-space: nowrap; }
  /* A vector's letter is bold, as in print; AB and BA too. */
  .vn { font-weight: 700; font-style: italic; }
  .vp { font-weight: 700; }
  .scene { display: block; width: 100%; max-width: 22rem; margin-inline: auto; touch-action: pan-y; }
  .scene .gl { stroke: var(--k-line); stroke-width: 1; }
  .scene .ax { stroke: var(--k-strong); stroke-width: 1.5; }
  .scene .sh { stroke: var(--k-accent2); stroke-width: 3.5; stroke-linecap: round; fill: none; }
  .scene .hd { fill: var(--k-accent2); }
  .scene .copy .sh { stroke: var(--k-muted); stroke-width: 2.5; }
  .scene .copy .hd { fill: var(--k-muted); }
  .scene .bad .sh { stroke: var(--k-warn); }
  .scene .bad .hd { fill: var(--k-warn); }
  .scene .leg { stroke: var(--k-accent); stroke-width: 2; stroke-dasharray: 5 4; fill: none; }
  .scene .ra { fill: none; stroke: var(--k-accent); stroke-width: 1.5; }
  .scene .tick { stroke: var(--k-muted); stroke-width: 2; stroke-linecap: round; }
  .scene .ring { fill: none; stroke: var(--k-accent); stroke-width: 1.5; stroke-dasharray: 4 4; }
  .scene .pt { fill: var(--k-ink); }
  .scene .path { fill: none; stroke: var(--k-muted); stroke-width: 1.5; }
  .scene .trail { fill: var(--k-muted); }
  .scene .boat { fill: var(--k-panel); stroke: var(--k-ink); stroke-width: 1.5; }
  .scene .kit { fill: var(--k-sunk); stroke: var(--k-ink); stroke-width: 1.5; }
  .scene .fin { stroke: var(--k-muted); stroke-width: 1.2; }
  .scene .tagbox { fill: var(--k-panel); stroke: var(--k-line); stroke-width: 1; }
  .scene .tagbad { fill: none; stroke: var(--k-warn); stroke-width: 2; }
  .scene .lead-l { stroke: var(--k-muted); stroke-width: 1; }
  /* Every label carries a thin halo of the page colour, so a grid line behind it never cuts its letters. */
  .scene text { paint-order: stroke; stroke: var(--k-bg); stroke-width: 4px; stroke-linejoin: round; }
  .scene .nm { font: 700 17px var(--k-font); fill: var(--k-accent2); }
  .scene .nm.mu { fill: var(--k-muted); }
  .scene .nm.bad { fill: var(--k-warn); }
  .scene .lb { font: 600 15px var(--k-font); fill: var(--k-ink); }
  .scene .lb.ok { fill: var(--k-accent2); }
  .scene .lb.bad { fill: var(--k-warn); }
  .scene .pl { font: 700 16px var(--k-font); fill: var(--k-ink); }
  .scene .sm { font: 600 13px var(--k-font); fill: var(--k-accent); }
  .scene .sm.mu { fill: var(--k-muted); }
  .scene .sm.bad { fill: var(--k-warn); }
  .scene .rt { font: 700 18px var(--k-font); fill: var(--k-accent2); }
  .scene .rk { font: 600 13px var(--k-font); fill: var(--k-accent); letter-spacing: .03em; }
  .scene .rv { font: 700 20px var(--k-font); fill: var(--k-ink); }
  .scene tspan.vn { font-style: italic; font-weight: 700; }
  .scene tspan.vp { font-weight: 700; }
  .scene #art * { pointer-events: none; }
  .scene .grip { fill: var(--k-bg); fill-opacity: 0; stroke: none; cursor: grab; touch-action: none; }
  .scene .grip:active { cursor: grabbing; }
  .scene .grip:focus { outline: none; }
  .scene .grip:focus-visible { stroke: var(--k-accent); stroke-width: 3; }
  #kbox { max-width: 22rem; margin-inline: auto; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  .row .k-btn { flex: 1 1 7rem; }
  .replay { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 10px; }
  .replay .k-btn { flex: 0 0 auto; min-height: 44px; padding-left: 16px; padding-right: 16px; font-size: .95rem; white-space: nowrap; }
  /* Short answers share a row and wrap when they must; longer ones stack one to a row. */
  .picks .k-btn { font-size: 1.15rem; min-height: 56px; flex: 1 1 4.5rem; white-space: nowrap; padding-inline: 6px; }
  .row.picks.long { flex-direction: column; gap: 8px; }
  .picks.long .k-btn { flex: 0 0 auto; width: 100%; min-height: 48px; white-space: normal; }
  .picks .k-btn[aria-pressed="true"] { background: var(--k-accent2); color: var(--k-on-accent2); border-color: var(--k-accent2); }
  .fb { font-weight: 700; min-height: 1.5em; margin-top: 10px; }
  .fb.right { color: var(--k-good); }
  .fb.wrong { color: var(--k-ink); }
  .why { line-height: 1.6; }
  .done { line-height: 1.6; }
  .done strong { color: var(--k-accent2); }
  .done .row { margin-top: 14px; }
  /* Each new screen settles in softly: its words and picture fade in and rise 4 px. */
  #stepbox.enter, #done.enter, #scene.enter { animation: screen-in .35s ease-out both; }
  @keyframes screen-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  html.k-testing #stepbox.enter, html.k-testing #done.enter, html.k-testing #scene.enter { animation: none; }
  @media (prefers-reduced-motion: reduce) {
    #stepbox.enter, #done.enter, #scene.enter { animation: none; }
  }
</style>

<p class="lead">Most screens show an arrow on a grid, with its moves and size beside it. The pump and boat figures are made up to keep the sums simple.</p>

<div class="pz" id="pz">

  <div id="stepbox">
    <p class="k-label count" id="count"></p>
    <p class="task" id="task"></p>

<p class="caption">Same moves, same vector, wherever it is drawn. A number in front multiplies both moves.</p>

<script>
  // ---------- the grids: each screen's window onto the squares (x0..x1 across, y0..y1 up, u px a square) ----------
  const DRAGG = { x0: -2, x1: 7, y0: -2, y1: 6, u: 25, axes: true };
  const FOURG = { x0: -0.5, x1: 14.5, y0: -0.5, y1: 9.5, u: 20 };
  const ABG = { x0: -1, x1: 8, y0: -1, y1: 9, u: 22, axes: true };
  const SCALEG = { x0: -10, x1: 10, y0: -13, y1: 13, u: 11, axes: true };
  const UNITG = { x0: -1, x1: 5, y0: -1, y1: 5, u: 36, axes: true };
  const UNIT2G = { x0: -1.5, x1: 6.5, y0: -1.5, y1: 8.5, u: 24, axes: true };
  const REVG = { x0: -4.5, x1: 4.5, y0: -5.5, y1: 5.5, u: 20, axes: true };

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // pic: what is drawn. dur: a SHOW step's demonstration in seconds. read: its words for the
  // read-through, where its own words ask him to act. A puzzle: task, opts (three answers), want,
  // hints (one per wrong answer), why, pv (each answer's moves, where it is drawn as an arrow),
  // reveal (a label only a right answer draws), fb (seconds of motion after a right and a wrong answer).
  const STEPS = [
    { show: true, name: 'An arrow called a', pic: 'drag', legs: true, ro: true, grid: DRAGG, dur: 4.0,
      text: 'A *vector* is a size with a direction, drawn as an arrow. Arrow `a` runs 3 squares across and 4 up. The two moves meet at a right angle, so Pythagoras gives its length: `√(3² + 4²) = 5`. That length is its size. We write it `|a| = 5`, and books call it the *magnitude*. Drag its tip, and the moves and size change with it.',
      read: 'A *vector* is a size with a direction, drawn as an arrow. Arrow `a` runs 3 squares across and 4 up. The two moves meet at a right angle, so Pythagoras gives its length: `√(3² + 4²) = 5`. That length is its size. We write it `|a| = 5`, and books call it the *magnitude*. Its moves and size change whenever its tip moves.' },
    { kind: 'pick', name: 'Mass or weight', pic: 'pump', fb: [0.8, 0.8],
      task: 'A *scalar* has a size but no direction. This pump has a mass, a temperature and a weight. Which of the three is a vector?',
      opts: ['Its mass', 'Its temperature', 'Its weight'], want: 'Its weight', reveal: 'has a direction',
      hints: { 'Its mass': 'Not quite. 500 kg is a size with no direction, so mass is a scalar.',
        'Its temperature': 'Not quite. 40 °C has no direction either, so it is a scalar.' },
      why: 'Weight is a force pulling the pump down. It has a size and a direction, so it is a vector. The 500 kg mass and the 40 °C temperature are sizes alone, so they are scalars.' },
    { show: true, name: 'Slide it anywhere', pic: 'drag', slide: true, legs: true, ro: true, grid: DRAGG, dur: 3.8,
      text: 'Drag the middle of `a` and it slides across the grid. It still runs 3 across and 4 up, with size 5. Where an arrow sits is not part of it, so it is still `a`.',
      read: 'Arrow `a` has slid to a new place on the grid, and a faint copy stays where it began. It still runs 3 across and 4 up, with size 5. Where an arrow sits is not part of it, so it is still `a`.' },
    { kind: 'pick', name: 'Which one is a?', pic: 'four', grid: FOURG, fb: [2.0, 2.0],
      task: 'Which arrow is the same vector as `a`?',
      opts: ['b', 'c', 'd'], want: 'b', reveal: 'b = a',
      hints: { c: 'Not quite. `c` runs 4 across and 3 up. It has the same size, but it points another way.',
        d: 'Not quite. `d` runs 3 left and 4 down, so it points the opposite way.' },
      why: '`b` runs 3 across and 4 up, just like `a`. The same size and the same direction make the same vector, wherever it sits. `c` and `d` have size 5 too, but they point other ways.' },
    { show: true, name: 'From A to B', pic: 'ab', ro: true, grid: ABG, dur: 3.4,
      text: 'The arrow from point A to point B is the vector `AB`. It runs 3 across and 4 up, the same moves as `a`, so `AB = a`. Going from B back to A covers the same ground the other way. In print a vector\'s name is bold. By hand you underline it.' },
    { kind: 'pick', name: 'Back from B to A', pic: 'ab', ro: true, grid: ABG, fb: [1.8, 1.4],
      task: 'Left and down count as minus. What are the moves of `BA`, from B back to A?',
      opts: ['3 across, 4 up', '4 left, 3 down', '3 left, 4 down'], want: '3 left, 4 down', reveal: 'BA',
      pv: { '3 across, 4 up': [3, 4], '4 left, 3 down': [-4, -3], '3 left, 4 down': [-3, -4] },
      hints: { '3 across, 4 up': 'Not quite. Those are the moves of `AB`. From B they carry on away from A.',
        '4 left, 3 down': 'Not quite. That swaps the two moves, so it misses A.' },
      why: 'From B, 3 left and 4 down lands on A. Those are the moves of `AB` with both signs changed. Moving backwards along a vector makes it negative, so `BA = −AB`.' },
    { show: true, name: 'A number in front', pic: 'scale', ro: true, grid: SCALEG, dur: 4.4,
      text: 'A number in front scales a vector. `2a` is `a` done twice: 6 across and 8 up, size 10. Slide the number down and the arrow shrinks to a dot at 0, then comes out the other way. `a`, `2a` and `−a` lie along one line, so they are parallel.',
      read: 'A number in front scales a vector. `2a` is `a` done twice: 6 across and 8 up, size 10. At 0 the arrow shrinks to a dot, and below 0 it points the other way. `a`, `2a` and `−a` lie along one line, so they are parallel.' },
    { kind: 'pick', name: 'Minus two', pic: 'scale', ro: true, grid: SCALEG, fb: [2.0, 1.7],
      task: 'What are the moves of `−2a`?',
      opts: ['6 left, 8 down', '6 across, 8 up', '1 across, 2 up'], want: '6 left, 8 down', reveal: '−2a',
      pv: { '6 left, 8 down': [-6, -8], '6 across, 8 up': [6, 8], '1 across, 2 up': [1, 2] },
      hints: { '6 across, 8 up': 'Not quite. That is `2a`. The minus turns the arrow round.',
        '1 across, 2 up': 'Not quite. That takes 2 off each move. The 2 multiplies them.' },
      why: '`−2a` multiplies both moves by −2, giving 6 left and 8 down. The minus turns it round. Its size is still 10, never −10, because a length cannot be below zero.' },
    { show: true, name: 'Size 1', pic: 'unit', ro: true, grid: UNITG, dur: 3.2,
      text: 'Divide both moves by the size, 5, and `a` shrinks to length 1 along the same line. That is its *unit vector*: 0.6 across and 0.8 up. It holds the direction alone.' },
    { kind: 'pick', name: 'Unit vector of 2a', pic: 'unit2', ro: true, grid: UNIT2G, fb: [1.7, 1.7],
      task: '`2a` runs 6 across and 8 up, with size 10. What is its unit vector?',
      opts: ['0.43 across, 0.57 up', '1 across, 1 up', '0.6 across, 0.8 up'], want: '0.6 across, 0.8 up', reveal: '2a ÷ 10',
      pv: { '0.43 across, 0.57 up': [6 / 14, 8 / 14], '1 across, 1 up': [1, 1], '0.6 across, 0.8 up': [0.6, 0.8] },
      hints: { '0.43 across, 0.57 up': 'Not quite. Dividing by 6 + 8 = 14 leaves a size of 0.71. Divide by the size, 10.',
        '1 across, 1 up': 'Not quite. Its size is √2, about 1.41, and it points another way.' },
      why: 'Divide both moves by the size, 10, to get 0.6 across and 0.8 up. Its size is `√(0.6² + 0.8²) = 1`. It matches the unit vector of `a`, because `2a` points the same way.' },
    { kind: 'pick', name: 'Round in a circle', pic: 'boat', lap: 4.0, fb: [2.0, 2.0],
      task: 'A boat goes round a circle at a steady 12 knots. What stays the same all the way round?',
      opts: ['Its velocity', 'Its speed', 'Both'], want: 'Its speed', reveal: 'one size: 12 knots',
      hints: { 'Its velocity': 'Not quite. Its arrow turns as it goes, so its velocity keeps changing.',
        Both: 'Not quite. The speed holds, but the direction keeps turning.' },
      why: 'Speed is a size alone, and it stays 12 knots. Velocity is the speed with its direction. The direction turns all the way round, so the velocity keeps changing.' },
    { kind: 'pick', name: 'Turn it round', pic: 'rev', ro: true, grid: REVG, fb: [1.7, 1.7],
      task: 'A boat\'s velocity `v` is 3 m/s east and 4 m/s north. It reverses course at the same speed. What is `−v`?',
      opts: ['−5 m/s', '3 m/s west, 4 m/s south', '3 m/s east, 4 m/s north'], want: '3 m/s west, 4 m/s south', reveal: '−v',
      hints: { '−5 m/s': 'Not quite. That has no direction, and a speed is never below zero.',
        '3 m/s east, 4 m/s north': 'Not quite. That is `v` itself. The minus turns it round.' },
      why: '`−v` changes the sign of both moves: 3 m/s west and 4 m/s south. Its speed is still `√(3² + 4²) = 5` m/s. Only the direction has turned round.' },
  ];
  const FINISH = 'A vector is only its size and its direction, so its arrow can be drawn anywhere. A number in front stretches or shrinks it, and a negative number turns it round.';
  // Sources the checks restate (the lesson's own).
  const KHAN = 'https://www.khanacademy.org/math/precalculus/x9e81a4f98389efdf:vectors/x9e81a4f98389efdf:vec-models/a/vectors-faq';
  const BITESIZE = 'https://www.bbc.co.uk/bitesize/guides/zqvbb9q/revision/1';
  const A = [3, 4];                       // arrow a: 3 across, 4 up
  const PA = [1, 1], PB = [4, 5];         // the points A and B
  // The four arrows of the puzzle: tail, moves, and which side of it the name sits.
  const FOUR = { a: [[0, 0], [3, 4], 1], b: [[1, 5], [3, 4], 1], c: [[10, 0], [4, 3], -1], d: [[8, 5], [-3, -4], 1] };
  const CB = [170, 128], RB = 86, LB = 56; // the boat's circle: centre, radius, and its arrows' length (px)
  const FADE = 0.35;
  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const testing = () => document.documentElement.classList.contains('k-testing');
  const el = (id) => document.getElementById(id);

  // ---------- numbers (pure, so the checks can test them) ----------
  const hyp = (x, y) => Math.hypot(x, y);
  // Up to two decimals, as the lesson writes them: 5, 2.5, 0.71, −1.5.
  function num(v) { let r = Math.round(v * 100) / 100; if (Math.abs(r) < 1e-9) r = 0; return (r < 0 ? '−' : '') + String(Math.abs(r)); }
  // A number in front of a, as a name: a, 2a, −a, ½a, −1.5a, 0a.
  function kName(k) { if (k === 1) return 'a'; if (k === -1) return '−a'; if (k === 0.5) return '½a'; if (k === -0.5) return '−½a'; return num(k) + 'a'; }
  const same = (p, q) => K.near(p[0], q[0], 1e-9) && K.near(p[1], q[1], 1e-9);
  // Moves in words: '3 across and 4 up', '2 left and 1 down'.
  function desc(v) {
    const h = v[0] ? num(Math.abs(v[0])) + (v[0] > 0 ? ' across' : ' left') : '', u = v[1] ? num(Math.abs(v[1])) + (v[1] > 0 ? ' up' : ' down') : '';
    return [h, u].filter(Boolean).join(' and ') || 'nowhere';
  }

  // ---------- each step's state ----------
  // pick, res, why: a puzzle's answer, its result and the Why? note. p, v: on a drag screen, the tail
  // and moves Dan has set (null until he drags). k: the number in front he has set. unit, tog: the
  // Size 1 screen's state after a press of its button.
  function blank() { return { pick: null, res: null, why: false, p: null, v: null, k: null, unit: null, tog: false }; }
  const isRight = (i, st) => st.pick != null && st.pick === STEPS[i].want;
  const hintFor = (i, st) => { const d = STEPS[i]; return (d.hints && d.hints[st.pick]) || 'Not quite. Look again at the picture.'; };
  const solved = (i) => Object.assign(blank(), { pick: STEPS[i].want, res: 'right' });
  const wrongSt = (i, o) => Object.assign(blank(), { pick: o, res: 'wrong' });
  let S = STEPS.map(() => blank());
  let finished = false, lastStep = -1, lastDone = false, T = Infinity;   // T: seconds into the current motion
  let motionEnd = 0;
  let REC = null;                                                        // what the last paint drew, for the checks
  let G = null;                                                          // the geometry of the step being drawn

  // ---------- text with amber key terms and bold vector letters (built with K.el, never innerHTML) ----------
  const VEC = /((?<![A-Za-z])[abcdv](?![A-Za-z])|AB|BA)/;
  function vecs(parent, s, inSvg) {
    String(s).split(VEC).forEach((p, k) => {
      if (!p) return;
      if (k % 2) { const cls = p.length === 2 ? 'vp' : 'vn'; parent.appendChild(inSvg ? K.svg('tspan', { class: cls }, p) : K.el('span', { class: cls }, p)); return; }
      parent.appendChild(document.createTextNode(p));
    });
  }
  // `maths` stays on one line with its vector letters bold; *a key term* is highlighted.
  function write(node, s) {
    node.textContent = '';
    String(s).split('`').forEach((seg, k) => {
      if (!seg) return;
      if (k % 2) { vecs(node.appendChild(K.el('span', { class: 'nw' })), seg, false); return; }
      const re = /\*([^*]+)\*/g;
      let at = 0, m;
      while ((m = re.exec(seg))) {
        if (m.index > at) node.appendChild(document.createTextNode(seg.slice(at, m.index)));
        node.appendChild(K.el('span', { class: 'term' }, m[1]));
        at = m.index + m[0].length;
      }
      if (at < seg.length) node.appendChild(document.createTextNode(seg.slice(at)));
    });
  }

  // ---------- controls ----------
  const stepper = K.stepper({ id: 'step', label: 'Step', steps: STEPS.map((d) => d.name), value: 0, compact: true, into: '#prog' });
  const nav = el('nav');
  const at = () => stepper.get();
  // The number in front of a, on the scale screen only (its box is hidden elsewhere).
  const kCtl = K.control({ id: 'k', label: 'Number in front of a', min: -3, max: 3, step: 0.5, value: 1, fmt: (v) => num(v), into: '#kbox' });
  { const kl = kCtl.el.querySelector('.k-field-label'); if (kl) { kl.textContent = ''; vecs(kl, 'Number in front of a', false); } }
  let kShown = 1;
  function setK(v) { kCtl.set(v, true); kShown = kCtl.get(); }
  // While the demonstration stretches the arrow, the slider follows it.
  function syncK(i) { const d = STEPS[i]; if (d.pic === 'scale' && d.show && S[i].k == null && REC && REC.kNow != null) setK(Math.round(REC.kNow * 2) / 2); }

  // Up to three answer buttons; each step fills in its own options.
  const pickBtns = [0, 1, 2].map((k) => K.button({ label: 'Answer ' + (k + 1), secondary: true, into: '#picks', press: () => {
    const i = at(), d = STEPS[i], st = S[i];
    if (finished || d.show || !d.opts || k >= d.opts.length || st.res === 'right') return;
    const was = st.res === 'wrong';
    st.pick = d.opts[k]; st.res = null;
    if (was) { anim.pause(); T = Infinity; enter('scene'); }
  } }));
  // Check: marks the answer; a right one shows itself on the picture, a wrong one is drawn in red.
  const checkBtn = K.button({ label: 'Check', into: '#acts', press: () => {
    const i = at(), d = STEPS[i], st = S[i];
    if (d.show || finished) return;
    if (st.pick == null) { st.res = 'empty'; return; }
    st.res = isRight(i, st) ? 'right' : 'wrong';
    play(st.res === 'right' ? d.fb[0] : d.fb[1]);
  } });
  const whyBtn = K.button({ label: 'Why?', secondary: true, into: '#acts', press: () => {
    if (STEPS[at()].show || finished) return;
    const st = S[at()]; st.why = !st.why;
  } });
  const replayBtn = K.button({ label: 'Play again', secondary: true, into: '#replay', press: () => {
    const i = at(), d = STEPS[i];
    if (!d.show || finished) return;
    Object.assign(S[i], { p: null, v: null, k: null, unit: null, tog: false });
    if (d.pic === 'scale') setK(1);
    play(d.dur);
  } });
  // The Size 1 screen's button: shrink a to its unit vector, or bring a back.
  const unitShown = (st) => (st.unit == null ? true : st.unit);
  const unitBtn = K.button({ label: 'Back to a', secondary: true, into: '#replay', press: () => {

      r.arrows.every((a) => K.near((a.p[0] - CB[0]) * a.v[0] + (a.p[1] - CB[1]) * a.v[1], 0, 1e-6) && K.near(hyp(a.p[0] - CB[0], a.p[1] - CB[1]), RB, 1e-6));
  });
  K.check('Every demonstration has finished arriving within 4.5 s of its screen opening, none starting before the 0.35 s screen fade ends; every answer\'s motion within 2.5 s', () => {
    const timed = (i, st, limit) => {
      const keepS = S[i], keepT = T;
      T = Infinity; latest = 0; earliest = Infinity; S[i] = st;
      try { paint(i); } finally { S[i] = keepS; T = keepT; }
      return latest <= limit + 1e-9;
    };
    const ok = STEPS.every((d, i) => {
      if (d.show) { const r = timed(i, blank(), d.dur); return r && d.dur <= 4.5 && d.dur >= 3 && earliest >= FADE; }
      const lapOk = !d.lap || (timed(i, blank(), d.lap) && d.lap <= 4.5 && earliest >= FADE);
      return lapOk && timed(i, solved(i), d.fb[0]) && d.fb[0] <= 2.5 && d.fb[1] <= 2.5 &&
        d.opts.filter((o) => o !== d.want).every((o) => timed(i, wrongSt(i, o), d.fb[1]));
    });
    paint();
    return ok;
  });

  K.ready();
</script>
