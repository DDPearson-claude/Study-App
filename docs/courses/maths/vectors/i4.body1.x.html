<p class="caption">To take an arrow away, turn it round and add it nose to tail.</p>

<script>
  const RAD = Math.PI / 180;
  const Cs = (deg) => Math.cos(deg * RAD), Sn = (deg) => Math.sin(deg * RAD);
  // Up to two decimals, as the lesson writes them: 5, 2.65, −2, 0.
  function num(v) { let r = Math.round(v * 100) / 100; if (Math.abs(r) < 1e-9) r = 0; return (r < 0 ? '−' : '') + String(Math.abs(r)); }
  // Parts written with i and j, every number shown: 4i − 1j, 1i + 5j, −6i.
  function expr(v) {
    const us = ['i', 'j'];
    let s = '';
    v.forEach((c, n) => {
      const r = Math.round(c * 100) / 100;
      if (Math.abs(r) < 1e-9) return;
      const mag = num(Math.abs(r));
      s += s ? (r < 0 ? ' − ' : ' + ') + mag + us[n] : (r < 0 ? '−' : '') + mag + us[n];
    });
    return s || '0';
  }
  // One part taken away, as the readout writes it: 5 − 1 = 4, 4 − (−1) = 5.
  const diffText = (a, b) => num(a) + ' − ' + (b < 0 ? '(' + num(b) + ')' : num(b)) + ' = ' + num(a - b);
  const sumText = (a, b) => num(a) + (b < 0 ? ' − ' + num(-b) : ' + ' + num(b)) + ' = ' + num(a + b);
  const kText = (k) => num(k) + ' × AB';
  const add = (p, q) => [p[0] + q[0], p[1] + q[1]];
  const sub = (p, q) => [p[0] - q[0], p[1] - q[1]];
  const neg = (p) => [-p[0], -p[1]];
  const scale = (p, s) => [p[0] * s, p[1] * s];
  const hyp = (v) => Math.hypot(v[0], v[1]);
  const same = (p, q) => !!p && !!q && p.length === q.length && p.every((x, n) => K.near(x, q[n], 1e-9));
  const mid = (pts) => [pts.reduce((s, p) => s + p[0], 0) / pts.length, pts.reduce((s, p) => s + p[1], 0) / pts.length];
  const lerp2 = (a, b, e) => [a[0] + (b[0] - a[0]) * e, a[1] + (b[1] - a[1]) * e];

  // ---------- each screen's layout ----------
  // A grid: u px a unit, the origin at (ox, oy), whole units x0..x1 and y0..y1, the readout band at hd.
  const GS = (o) => Object.assign({ kind: 'grid', ly0: 22 }, o, { ly1: o.hd - 8, H: o.hd + 62 });
  const G_SUB = GS({ u: 28, ox: 52, oy: 168, x0: -1, x1: 6, y0: -2, y1: 5, hd: 236 });
  const G_SUBQ = GS({ u: 18, ox: 58, oy: 116, x0: -1, x1: 7, y0: -6, y1: 5, hd: 242 });
  const G_BUOY = GS({ u: 26, ox: 56, oy: 186, x0: -1, x1: 7, y0: -1, y1: 6, hd: 222 });
  const G_PQ = GS({ u: 20, ox: 86, oy: 90, x0: -2, x1: 10, y0: -5, y1: 3, hd: 204 });
  const G_LINE = GS({ u: 26, ox: 56, oy: 160, x0: -1, x1: 9, y0: -1, y1: 5, hd: 198 });
  const G_LINEQ = GS({ u: 24, ox: 54, oy: 174, x0: -1, x1: 10, y0: -1, y1: 6, hd: 210 });
  // The water: the far bank's edge at top, the near bank's at bot, the boat at (x0, sy), u px for 1 m/s.
  const R7 = { kind: 'river', wet: true, top: 26, bot: 186, x0: 130, sy: 174, u: 24, ly0: 40, ly1: 196, H: 232 };
  const R8 = Object.assign({}, R7, { x0: 180, u: 22 });
  const R12 = Object.assign({}, R7, { x0: 80, u: 18, hd: 236, H: 298 });
  // The open water: sea down to `sea`, a bank below it to `shore`.
  const S9 = { kind: 'sea', wet: true, sea: 196, shore: 224, ly0: 20, ly1: 188, hd: 232, H: 294 };
  const S10 = { kind: 'sea', wet: true, sea: 190, ly0: 20, ly1: 182, hd: 198, H: 260 };
  const S11 = { kind: 'sea', wet: true, sea: 112, ly0: 20, ly1: 106, key: 126, hd: 140, H: 202 };
  const PHI_AIM = -Math.asin(3 / 4) / RAD;   // 48.59° upstream: 4 m/s against a 3 m/s stream
  const PHI8 = -Math.asin(3 / 5) / RAD;      // 36.87° upstream: 5 m/s against a 3 m/s stream
  const MPX = 136 / 40;                       // step 12: px a metre across the 40 m channel

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // pic: what is drawn. dur: a SHOW step's demonstration in seconds. read: its words for the
  // read-through, where its own words ask him to act. A puzzle: task, opts (three answers), want,
  // hints (one per wrong answer), why, pv (what a wrong answer is drawn as), reveal (a label only a
  // right answer draws), fb (seconds of motion after a right and a wrong answer).
  const STEPS = [
    { show: true, name: 'Taking away', pic: 'sub', geo: G_SUB, dur: 4.0,
      text: 'To take `b` away from `a`, turn `b` round and add it nose to tail. With `a` = `5i + 2j` and `b` = `1i + 3j`, that gives `a − b` = `4i − 1j`. Drawn from one tail, the same arrow runs from the nose of `b` to the nose of `a`. Switch to adding to compare.',
      read: 'To take `b` away from `a`, turn `b` round and add it nose to tail. With `a` = `5i + 2j` and `b` = `1i + 3j`, that gives `a − b` = `4i − 1j`. Drawn from one tail, the same arrow runs from the nose of `b` to the nose of `a`. Go out along `b`, then along `a − b`, and you land on `a`.' },
    { kind: 'pick', name: 'Take 2i − 1j from 3i + 4j', pic: 'subq', geo: G_SUBQ, fb: [1.8, 1.8],
      task: 'Here `a` is `3i + 4j` and `b` is `2i − 1j`. What is `a − b`?',
      opts: ['−1i − 5j', '1i + 5j', '5i + 3j'], want: '1i + 5j', reveal: '1i + 5j', pv: { '−1i − 5j': [-1, -5], '5i + 3j': [5, 3] },
      hints: { '−1i − 5j': 'Not quite. That is `b − a`. It is the same size, but points the opposite way.',
        '5i + 3j': 'Not quite. That adds `b`. Turn `b` round first, then add.' },
      why: 'Turned round, `b` is `−2i + 1j`. Across, 3 − 2 = 1. Up, 4 + 1 = 5. So `a − b` is `1i + 5j`. Add `b` back on, and you land on `a`.' },
    { show: true, name: 'Buoy to buoy', pic: 'buoys', geo: G_BUOY, dur: 3.6,
      text: 'A move from one point to another is a *displacement*, where you end minus where you started. Buoy A sits at `1i + 2j` km and buoy B at `6i + 5j` km. So the move AB is `b − a`, which is `5i + 3j` km. Drag buoy B, and the move follows.',
      read: 'A move from one point to another is a *displacement*, where you end minus where you started. Buoy A sits at `1i + 2j` km and buoy B at `6i + 5j` km. So the move AB is `b − a`, which is `5i + 3j` km. Go out along `a`, then along AB, and you land on B.' },
    { kind: 'pick', name: 'From P to Q', pic: 'pq', geo: G_PQ, fb: [1.8, 1.8],
      task: 'P sits at `4i − 1j` and Q at `−2i + 3j`. What is the move PQ?',
      opts: ['6i − 4j', '2i + 2j', '−6i + 4j'], want: '−6i + 4j', reveal: '−6i + 4j', pv: { '6i − 4j': [6, -4], '2i + 2j': [2, 2] },
      hints: { '6i − 4j': 'Not quite. That is the move from Q back to P. End minus start is `q − p`.',
        '2i + 2j': 'Not quite. That adds the two positions. Take P\'s position away from Q\'s.' },
      why: 'End minus start is `q − p`. Across, −2 − 4 = −6. Up, 3 − (−1) = 4. So PQ is `−6i + 4j`.' },
    { show: true, name: 'In line', pic: 'line', geo: G_LINE, dur: 3.8,
      text: 'A, B and C sit at `1i + 1j`, `3i + 2j` and `7i + 4j`. BC is `4i + 2j`, which is 2 × AB, so the two steps point the same way. They also share B, so the three points lie on one line and are *collinear*. Drag C, and see when it stays in line.',
      read: 'A, B and C sit at `1i + 1j`, `3i + 2j` and `7i + 4j`. BC is `4i + 2j`, which is 2 × AB, so the two steps point the same way. They also share B, so the three points lie on one line and are *collinear*. Two copies of AB fit exactly along BC.' },
    { kind: 'pick', name: 'Which point is in line?', pic: 'lineq', geo: G_LINEQ, fb: [1.8, 1.8],
      task: 'A sits at `1i + 1j` and B at `3i + 2j`. Which point lies on the line through A and B?',
      opts: ['9i + 5j', '9i + 4j', '7i + 5j'], want: '9i + 5j', reveal: '9i + 5j', pv: { '9i + 4j': [9, 4], '7i + 5j': [7, 5] },
      hints: { '9i + 4j': 'Not quite. From B that step is `6i + 2j`. Its across part is 3 × 2, but its up part is not 3 × 1.',
        '7i + 5j': 'Not quite. From B that step is `4i + 3j`. It is not a multiple of AB.' },
      why: 'AB is `2i + 1j`. From B to `9i + 5j` is `6i + 3j`, which is 3 × AB. The two steps share B, so the point is on the line.' },
    { show: true, name: 'The boat and the stream', pic: 'river', geo: R7, dur: 4.8,
      text: 'A boat heads straight across at 4 m/s in a 3 m/s stream. Over the ground it moves along the two arrows nose to tail, at 5 m/s, and lands downstream. To land opposite, it aims upstream until its upstream part cancels the stream. Drag the boat\'s arrow, or change the stream.',
      read: 'A boat heads straight across at 4 m/s in a 3 m/s stream. Over the ground it moves along the two arrows nose to tail, at 5 m/s, and lands downstream. To land opposite, it aims upstream until its upstream part cancels the stream. Aimed 48.59° upstream, it crosses at 2.65 m/s and lands on the target.' },
    { kind: 'pick', name: 'Straight across', pic: 'cross', geo: R8, fb: [1.8, 1.8],
      task: 'A boat makes 5 m/s through the water in a 3 m/s stream. It aims upstream to cross straight over. What is its speed across?',
      opts: ['5.83 m/s', '4 m/s', '2 m/s'], want: '4 m/s', reveal: '4 m/s', pv: { '5.83 m/s': Math.hypot(5, 3), '2 m/s': 5 - 3 },
      hints: { '5.83 m/s': 'Not quite. That adds the squares. Here the heading is the long side, so the across part is shorter than 5.',
        '2 m/s': 'Not quite. That takes the sizes away. The arrows meet at a right angle, so use Pythagoras.' },
      why: 'Its upstream part cancels the 3 m/s stream. The heading, 5 m/s, is the long side of a right-angled triangle. So the across part is `√(5² − 3²) = 4` m/s.' },
    { show: true, name: 'Seen from the boat', pic: 'rel', geo: S9, dur: 4.4,
      text: 'You make `6i` knots due east, and a second vessel makes `8j` knots due north. Seen from your boat, your own arrow is turned round and added to everything, so your boat sits still and the bank slides west. The vessel then moves at `8j − 6i`, 10 knots, its *relative velocity*. Switch the view to compare.',
      read: 'You make `6i` knots due east, and a second vessel makes `8j` knots due north. Seen from your boat, your own arrow is turned round and added to everything, so your boat sits still and the bank slides west. The vessel then moves at `8j − 6i`, 10 knots, its *relative velocity*. Your own arrow and its reverse cancel, so your boat stays put.' },
    { kind: 'pick', name: 'Theirs minus yours', pic: 'relq', geo: S10, fb: [2.0, 1.8],
      task: 'You make `4i + 3j` knots and another vessel makes `−2i + 3j` knots. What is its velocity relative to you?',
      opts: ['2i + 6j', '6i', '−6i'], want: '−6i', reveal: '−6i', pv: { '6i': [6, 0], '2i + 6j': [2, 6] },
      hints: { '6i': 'Not quite. That is yours minus theirs. Take your velocity away from theirs.',
        '2i + 6j': 'Not quite. That adds the two velocities. Turn your own arrow round first.' },
      why: 'Theirs minus yours, part by part. Across, −2 − 4 = −6. Up, 3 − 3 = 0. So from your boat it moves at `−6i`, 6 knots due west.' },
    { kind: 'pick', name: 'Head-on', pic: 'headon', geo: S11, fb: [2.0, 1.8],
      task: 'Two vessels meet head-on at 12 knots each. How fast do they close on each other?',
      opts: ['24 knots', '0 knots', '12 knots'], want: '24 knots', reveal: '24 knots', pv: { '0 knots': 0, '12 knots': 12 },
      hints: { '0 knots': 'Not quite. That adds the two velocities, and they cancel. Take yours away from theirs.',
        '12 knots': 'Not quite. That is one vessel alone. Seen from you, it also carries your arrow turned round.' },
      why: 'Say you make `12i` and the other makes `−12i`. Theirs minus yours is `−12i − 12i = −24i`. So it closes on you at 24 knots.' },
    { kind: 'pick', name: 'Pointing at the target', pic: 'drift', geo: R12, fb: [2.4, 1.8],
      task: 'A boat points straight at a target 40 m across. It makes 4 m/s, and the stream runs at 3 m/s. Where does it land?',
      opts: ['On the target', '30 m downstream', '50 m downstream'], want: '30 m downstream', reveal: '30 m', pv: { 'On the target': 0, '50 m downstream': 50 },
      hints: { 'On the target': 'Not quite. The stream carries the boat downstream the whole way across.',
        '50 m downstream': 'Not quite. 50 m is the length of the whole track. The drift is only the stream\'s part.' },
      why: 'Its across part is 4 m/s, so it crosses in 40 ÷ 4 = 10 s. All that time the stream carries it 3 m each second. So it lands 3 × 10 = 30 m downstream. Its track is 50 m long.' },
  ];
  const FINISH = 'Taking a vector away means adding its reverse. A displacement is end minus start. A relative velocity is the other\'s velocity minus yours.';
  // The lesson's sources, each cited only by a check that restates its quote.
  const SRC_SUB = 'https://www.bbc.co.uk/bitesize/guides/zwncsrd/revision/2';
  const SRC_DISP = 'https://openstax.org/books/university-physics-volume-1/pages/3-1-position-displacement-and-average-velocity';
  const SRC_REL = 'https://physicsfundamentals.org/blog/relative-velocity';
  const FADE = 0.35;
  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const testing = () => document.documentElement.classList.contains('k-testing');
  const el = (id) => document.getElementById(id);
  const atPic = (pic) => STEPS.findIndex((d) => d.pic === pic);

  // ---------- each step's state ----------
