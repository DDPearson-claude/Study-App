<p class="lead">A ring pulled by ropes, each pull drawn as an arrow from the ring. Beside it, the same arrows are laid nose to tail. The pulls are made-up examples.</p>

<p class="caption">The resultant is the gap the chain leaves. The equilibrant closes it.</p>

<script>
  const RAD = Math.PI / 180;
  const C = (deg) => Math.cos(deg * RAD), Sn = (deg) => Math.sin(deg * RAD);
  // Up to two decimals, as the lesson writes them: 5, 1.5, −2, 0.
  function num(v) { let r = Math.round(v * 100) / 100; if (Math.abs(r) < 1e-9) r = 0; return (r < 0 ? '−' : '') + String(Math.abs(r)); }
  // A size as the lesson writes it: whole numbers plain, the rest to two places (6, 4.24, 6.40, 0).
  function kn(v) { const r = Math.round(Math.abs(v) * 100) / 100; return Number.isInteger(r) ? String(r) : r.toFixed(2); }
  const KN = (v) => kn(v) + ' kN';
  // Parts written with i and j, every number shown: 4i + 1j, 6i − 2j, −8i.
  function expr(v) {
    const us = ['i', 'j'];
    let s = '';
    v.forEach((c, n) => {
      const r = Math.round(c * 100) / 100;
      if (Math.abs(r) < 1e-9) return;
      const mag = num(Math.abs(r));
      s += s ? (r < 0 ? ' − ' : ' + ') + mag + us[n] : (r < 0 ? '−' : '') + mag + us[n];
    });
    return s || '0';
  }
  // Two parts added, as the readout writes them: 4 + 1 = 5, 3 − 1 = 2.
  const sumText = (a, b) => num(a) + (b < 0 ? ' − ' + num(-b) : ' + ' + num(b)) + ' = ' + num(a + b);
  const add = (p, q) => [p[0] + q[0], p[1] + q[1]];
  const neg = (p) => [-p[0], -p[1]];
  const scale = (p, s) => [p[0] * s, p[1] * s];
  const total = (list) => list.reduce(add, [0, 0]);
  const hyp = (v) => Math.hypot(v[0], v[1]);
  const polar = (L, deg) => [L * C(deg), L * Sn(deg)];
  const same = (p, q) => !!p && !!q && p.length === q.length && p.every((x, n) => K.near(x, q[n], 1e-9));
  const mid = (pts) => [pts.reduce((s, p) => s + p[0], 0) / pts.length, pts.reduce((s, p) => s + p[1], 0) / pts.length];

  // ---------- each screen's layout: kN to drawing units (u px a kN), the ring and the chain's first tail, the drawing's height ----------
  const TWO = { u: 17, ring: [57, 120], start: [172, 120], hd: 150 };
  const AB = { u: 18, ring: [26, 150], start: [176, 150], hd: 178 };
  const AB3 = { u: 18, ring: [30, 150], start: [176, 150], hd: 186 };
  const EQ = { u: 14, ring: [80, 100], start: [186, 140], hd: 172 };
  const BAL = { u: 11, ring: [76, 92], start: [186, 92], hd: 166 };
  const TRI = { u: 18, ring: [78, 104], start: [200, 118], hd: 184 };
  const EWN = { u: 12, ring: [80, 100], start: [190, 128], hd: 184 };
  const THIRD = { u: 8, ring: [76, 96], start: [178, 96], hd: 150 };
  const WHICH = { u: 1, ring: [0, 0], start: [0, 0], hd: 200 };
  const DIRS = [90, 210, 330];   // the three balanced ropes, in degrees from the x-axis
  const ROOT40 = Math.sqrt(40), ROOT8 = Math.sqrt(8);

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // pic: what is drawn. dur: a SHOW step's demonstration in seconds. read: its words for the
  // read-through, where its own words ask him to act. A puzzle: task, opts (three answers), want,
  // hints (one per wrong answer), why, pv (what a wrong answer is drawn as), reveal (a label only a
  // right answer draws), fb (seconds of motion after a right and a wrong answer).
  const STEPS = [
    { show: true, name: 'Two pulls, one gap', pic: 'two', geo: TWO, dur: 4.0,
      text: 'Two ropes pull a ring with 3 kN each. Lay the pulls nose to tail, and the gap from the first tail to the last nose is their sum. That gap is the *resultant*. It reaches 6 kN only when both pull the same way. Slide the angle between them.',
      read: 'Two ropes pull a ring with 3 kN each. Lay the pulls nose to tail, and the gap from the first tail to the last nose is their sum. That gap is the *resultant*. It reaches 6 kN only when both pull the same way. The wider they spread, the shorter the gap.' },
    { kind: 'pick', name: 'Two pulls at 90°', pic: 'two', ang: 90, geo: TWO, fb: [1.6, 1.6],
      task: 'The two 3 kN pulls are now 90° apart. What is the net pull on the ring?',
      opts: ['4.24 kN', '6 kN', '3 kN'], want: '4.24 kN', reveal: '4.24 kN', pv: { '6 kN': 6, '3 kN': 3 },
      hints: { '6 kN': 'Not quite. Sizes add only when the pulls point the same way.',
        '3 kN': 'Not quite. The gap is the long side of a right-angled triangle. It is longer than either pull.' },
      why: 'Nose to tail, the two pulls meet at a right angle. The gap is the long side, so Pythagoras gives it. `√(3² + 3²) = 4.24` kN.' },
    { show: true, name: 'Add the parts', pic: 'parts', geo: AB, dur: 4.4,
      text: 'Pull A is `4i + 1j` kN and pull B is `1i + 3j` kN. Gather the across parts, and they add to 4 + 1 = 5. The up parts add to 1 + 3 = 4. So the resultant is `5i + 4j`, and Pythagoras makes it 6.40 kN. Drag the nose of B, and the sums follow.',
      read: 'Pull A is `4i + 1j` kN and pull B is `1i + 3j` kN. Gather the across parts, and they add to 4 + 1 = 5. The up parts add to 1 + 3 = 4. So the resultant is `5i + 4j`, and Pythagoras makes it 6.40 kN. Whatever B is, its parts join the same two sums.' },
    { kind: 'pick', name: 'Add 2i + 3j and 4i − 1j', pic: 'add', geo: AB3, fb: [1.6, 1.6],
      task: 'Pull A is `2i + 3j` kN and pull B is `4i − 1j` kN. What is the resultant?',
      opts: ['6i + 4j', '8', '6i + 2j'], want: '6i + 2j', reveal: '6i + 2j', pv: { '6i + 4j': [6, 4], '8': 8 },
      hints: { '6i + 4j': 'Not quite. The up part of B is minus 1, so the up parts make 3 − 1.',
        '8': 'Not quite. Across parts and up parts stay apart. Add each kind on its own.' },
      why: 'Across, 2 + 4 = 6. Up, 3 − 1 = 2. So the resultant is `6i + 2j`. Its size is `√(6² + 2²) = 6.32` kN.' },
    { show: true, name: 'Either order', pic: 'order', geo: AB, dur: 4.0,
      text: 'Draw B first and A second, and you reach the same nose. The parts add to the same sums in either order. Together the two chains make a parallelogram. The resultant is its diagonal from the shared tail. Switch between the orders.',
      read: 'Draw B first and A second, and you reach the same nose. The parts add to the same sums in either order. Together the two chains make a parallelogram. The resultant is its diagonal from the shared tail.' },
    { kind: 'pick', name: 'Which drawing is a + b?', pic: 'which', geo: WHICH, fb: [1.6, 1.0],
      task: 'Arrows `a` and `b` start from one point. Which drawing shows `a + b`?',
      opts: ['Drawing 1', 'Drawing 2', 'Drawing 3'], want: 'Drawing 2', reveal: 'a + b',
      hints: { 'Drawing 1': 'Not quite. That line joins the two noses. Slide `b` to start at the nose of `a` and see where it ends.',
        'Drawing 3': 'Not quite. That arrow points back to the tail. Turned round like that, it would cancel the sum.' },
      why: 'Slide `b` so its tail sits on the nose of `a`. Its nose lands on the far corner. So `a + b` runs from the shared tail to that corner, along the diagonal of the parallelogram.' },
    { show: true, name: 'The equilibrant', pic: 'equil', geo: EQ, dur: 4.2,
      text: 'Any gap in the chain is a net pull, which would set the ring moving. To hold it still, add the *equilibrant*. It is the same size as the resultant and points the opposite way. The chain closes, and the needle drops to zero. Tap the button to take it away or add it again.',
      read: 'Any gap in the chain is a net pull, which would set the ring moving. To hold it still, add the *equilibrant*. It is the same size as the resultant and points the opposite way. The chain closes, and the needle drops to zero. Without it, the gap and the needle come back.' },
    { kind: 'pick', name: 'Balance 6i − 2j', pic: 'bal', geo: BAL, fb: [1.8, 1.6],
      task: 'The pulls on a ring add to `6i − 2j` kN. Which extra pull holds it still?',
      opts: ['6i − 2j', '−6i − 2j', '−6i + 2j'], want: '−6i + 2j', reveal: '−6i + 2j', pv: { '6i − 2j': [6, -2], '−6i − 2j': [-6, -2] },
      note: { '6i − 2j': 'gap doubles', '−6i − 2j': 'misses the tail' },
      hints: { '6i − 2j': 'Not quite. That is the resultant again. Adding it would double the gap.',
        '−6i − 2j': 'Not quite. That flips only the `i` part. Flip both signs.' },
      why: 'The equilibrant is the resultant turned round. Flip both signs to get `−6i + 2j`. It has the same size, 6.32 kN, and closes the chain.' },
    { show: true, name: 'Three pulls in balance', pic: 'three', geo: TRI, dur: 3.4,
      text: 'Three ropes pull the ring with 3 kN each, 120° apart. Nose to tail, they close into a triangle, so the needle reads zero. This is the *triangle of forces*. Their sizes add to 9 kN, yet the net pull is nothing. Drag a nose, and the triangle opens.',
      read: 'Three ropes pull the ring with 3 kN each, 120° apart. Nose to tail, they close into a triangle, so the needle reads zero. This is the *triangle of forces*. Their sizes add to 9 kN, yet the net pull is nothing. Change any one pull, and the triangle opens.' },
    { kind: 'pick', name: 'East, west and north', pic: 'ewn', geo: EWN, fb: [1.6, 1.6],
      task: 'Ropes pull a ring with 5 kN east, 5 kN west and 2 kN north. What is the net pull?',
      opts: ['0 kN', '2 kN north', '12 kN'], want: '2 kN north', reveal: '2 kN north',
      hints: { '0 kN': 'Not quite. East and west cancel only along their own line. The north pull is left.',
        '12 kN': 'Not quite. That adds the sizes, but two of the pulls point opposite ways.' },
      why: 'East and west cancel along their line. Only the 2 kN north pull is left. So the chain leaves a gap of 2 kN north.' },
    { kind: 'pick', name: 'Two pulls at 120°', pic: 'two', ang: 120, geo: TWO, fb: [1.6, 1.6],
      task: 'Two 3 kN pulls act 120° apart. What is the net pull?',
      opts: ['6 kN', '3 kN', '4.24 kN'], want: '3 kN', reveal: '1.5i + 2.6j', pv: { '6 kN': 6, '4.24 kN': Math.hypot(3, 3) },
      hints: { '6 kN': 'Not quite. That adds the sizes. The pulls are 120° apart, so the chain bends.',
        '4.24 kN': 'Not quite. Pythagoras needs a right angle. These pulls are 120° apart.' },
      why: 'By parts, across is 3 − 1.5 = 1.5 and up is 0 + 2.6 = 2.6. That makes `√(1.5² + 2.6²) = 3` kN. The chain\'s corner is 60°, so its triangle has three equal sides.' },
    { kind: 'pick', name: 'A third line', pic: 'third', geo: THIRD, fb: [1.8, 1.6],
      task: 'Line A pulls a ring with `6i + 2j` kN and line B with `2i − 2j` kN. `i` points east. What third pull holds the ring still?',
      opts: ['8 kN east', '9.15 kN west', '8 kN west'], want: '8 kN west', reveal: 'equilibrant', pv: { '8 kN east': [8, 0], '9.15 kN west': [-(ROOT40 + ROOT8), 0] },
      hints: { '8 kN east': 'Not quite. That is the resultant itself. The third pull must point the opposite way.',
        '9.15 kN west': 'Not quite. That adds the sizes. The `j` parts cancel, so only the `i` parts count.' },
      why: 'Across, 6 + 2 = 8. Up, 2 − 2 = 0. So the resultant is `8i`, 8 kN east. The equilibrant is `−8i`, 8 kN west.' },
  ];
  const FINISH = 'Vectors add nose to tail, or part by part, to give the resultant. The equilibrant is the equal and opposite pull that closes the chain.';
  // The lesson's sources, each cited only by a check that restates its quote.
  const SRC_RESULTANT = 'https://www.bbc.co.uk/bitesize/guides/zqvbb9q/revision/1';
  const SRC_SIZES = 'https://eng.libretexts.org/Bookshelves/Mechanical_Engineering/Mechanics_Map_(Moore_et_al.)/16%3A_Appendix_1_-_Vector_and_Matrix_Math/16.1%3A_Vectors';
  const SRC_PARTS = 'https://www.bbc.co.uk/bitesize/guides/zwncsrd/revision/2';
  const SRC_EQUIL = 'https://myslu.stlawu.edu/~jmil/physics/labs/103_lab/vectors.pdf';
  const FADE = 0.35;
  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const testing = () => document.documentElement.classList.contains('k-testing');
  const el = (id) => document.getElementById(id);

  // ---------- each step's state ----------
  // pick, res, why: a puzzle's answer, its result and the Why? note. ang: the angle he has set.
  // order, prev: the chains he has chosen to show, and the ones shown before. eq: the equilibrant on
  // or off, once he has pressed its button (flip). b: where he has dragged the nose of B. sizes: the
  // three balanced pulls as he has dragged them.
  function blank() { return { pick: null, res: null, why: false, ang: null, order: null, prev: null, flip: false, eq: null, b: null, sizes: null }; }
  const isRight = (i, st) => st.pick != null && st.pick === STEPS[i].want;
  const hintFor = (i, st) => { const d = STEPS[i]; return (d.hints && d.hints[st.pick]) || 'Not quite. Look again at the picture.'; };
  const solved = (i) => Object.assign(blank(), { pick: STEPS[i].want, res: 'right' });
  const wrongSt = (i, o) => Object.assign(blank(), { pick: o, res: 'wrong' });
  let S = STEPS.map(() => blank());
  let finished = false, lastStep = -1, lastDone = false, T = Infinity;   // T: seconds into the current motion
  let motionEnd = 0;
  let REC = null;   // what the last paint drew, for the checks
  let G = null;     // the layout of the step being drawn

  // ---------- text with amber key terms and bold vector letters (built with K.el, never innerHTML) ----------
  const VEC = /((?<![A-Za-z])[abij](?![A-Za-z]))/;
  function vecs(parent, s, inSvg) {
    String(s).split(VEC).forEach((p, k) => {
      if (!p) return;
      if (k % 2) { const cls = /[ij]/.test(p) ? 'vu' : 'vn'; parent.appendChild(inSvg ? K.svg('tspan', { class: cls }, p) : K.el('span', { class: cls }, p)); return; }
      parent.appendChild(document.createTextNode(p));
    });
  }
  function write(node, s) {
    node.textContent = '';
    String(s).split('`').forEach((seg, k) => {
      if (!seg) return;
      if (k % 2) { vecs(node.appendChild(K.el('span', { class: 'nw' })), seg, false); return; }
      const re = /\*([^*]+)\*/g;
      let at = 0, m;
      while ((m = re.exec(seg))) {
        if (m.index > at) node.appendChild(document.createTextNode(seg.slice(at, m.index)));
        node.appendChild(K.el('span', { class: 'term' }, m[1]));
        at = m.index + m[0].length;
      }
      if (at < seg.length) node.appendChild(document.createTextNode(seg.slice(at)));
    });
  }

  // ---------- controls ----------
  const stepper = K.stepper({ id: 'step', label: 'Step', steps: STEPS.map((d) => d.name), value: 0, compact: true, into: '#prog' });
  const nav = el('nav');
  const at = () => stepper.get();
  // The angle between the two pulls, on the first screen only (its box is hidden elsewhere).
  const angCtl = K.control({ id: 'ang', label: 'Angle between the pulls', min: 0, max: 180, step: 1, value: 120, snap: [0, 90, 120, 180], fmt: (v) => Math.round(v) + '°', into: '#abox' });
  // Which chain to draw, on the order screen only.
  const orderCtl = K.choice({ id: 'order', label: 'Draw the chain', options: [{ value: 'ab', label: 'A then B' }, { value: 'ba', label: 'B then A' }, { value: 'both', label: 'Both' }], value: 'both', into: '#obox' });
  let angShown = angCtl.get(), orderShown = orderCtl.get(), eqLabel = '';

  const pickBtns = [0, 1, 2].map((k) => K.button({ label: 'Answer ' + (k + 1), secondary: true, into: '#picks', press: () => {

  // ---------- drawing ----------
  const svg = el('scene'), art = el('art'), ui = el('ui');

  function part(a, rise, draw) {

  const r3 = (v) => Math.round(v * 1000) / 1000;
  const line = (cls, x1, y1, x2, y2) => put(K.svg('line', { class: cls, x1: r3(x1), y1: r3(y1), x2: r3(x2), y2: r3(y2) }));
  function text(x, y, s, cls, anchor, vec) {

  // kN on the ring's side and on the chain's side to drawing units.
  const R = (v) => [G.ring[0] + v[0] * G.u, G.ring[1] - v[1] * G.u];

  function pxArrow(a, b, cls, shift) {

  }
  // A right angle where two chain arrows meet (u1, u2: unit steps in drawing units).
  function raMark(J, u1, u2) {
    const s = 8;
    put(K.svg('path', { class: 'ra', d: 'M' + r3(J[0] + u1[0] * s) + ' ' + r3(J[1] + u1[1] * s) + ' L' + r3(J[0] + (u1[0] + u2[0]) * s) + ' ' + r3(J[1] + (u1[1] + u2[1]) * s) + ' L' + r3(J[0] + u2[0] * s) + ' ' + r3(J[1] + u2[1] * s) }));

  }

    put(K.svg('path', { class: 'pivot', d: 'M' + 32 + ' ' + (y + 21) + ' L' + 24 + ' ' + (y + 17) + ' L' + 24 + ' ' + (y + 25) + ' Z' }));

  };

    REC.legEnd = REC.legs.length ? REC.legs[REC.legs.length - 1][1] : null;
    part(ia(3.1), 0, () => gapArrow(net, 1, { place: 'nose' }));
    band({ s: KN(size), n: size, a: ia(3.8) }, [{ l: 'across', v: sumText(A[0], B[0]), a: ia(3.3) }, { l: 'up', v: sumText(A[1], B[1]), a: ia(3.5) }]);
    return 'Pull A, ' + expr(A) + ', and pull B, ' + expr(B) + ', on a ring and laid nose to tail. Their across parts, drawn dashed along the bottom, add to ' + num(net[0]) +
      '. Their up parts, dashed up the side, add to ' + num(net[1]) + '. The resultant, ' + expr(net) + ', is ' + KN(size) + '.';
  };
  // The puzzle: 2i + 3j and 4i − 1j.
  DRAW.add = (d, st) => {
    const A = [2, 3], B = [4, -1], net = add(A, B), size = hyp(net), ok = st.res === 'right', pick = st.res ? st.pick : null;
    heads(1);
    const ref = mid([R([0, 0]), R(A), R(B)]);
    ringPull(A, 'p1', 'A', ref, 'up');
    ringPull(B, 'p2', 'B', ref, 'down');
    ringDot();
    needle(net, ok ? go(0.2, 0.8) : 0);
    const cref = mid([Q([0, 0]), Q(A), Q(net)]);
    chainArrow([0, 0], A, 'p1', 'A', cref, 'up');
    chainArrow(A, B, 'p2', 'B', cref, 'up');
    let said = 'Pull A, 2i + 3j, and pull B, 4i − 1j, on a ring and laid nose to tail.';
    if (ok) {
      gapArrow(net, go(0.2, 0.8), { label: expr(net), vec: true, place: 'nose', la: arr(0.9) });
      said += ' The resultant runs from the first tail to the last nose: 6i + 2j, ' + KN(size) + '.';
    } else if (pick) {
      const pv = d.pv[pick], e = go(0.1, 1.0);
      const end = Array.isArray(pv) ? pv : scale(net, pv / size);
      pxArrow(Q([0, 0]), Q(scale(end, e)), 'bad');
      part(arr(1.0), 3, () => noseLabel(Q([0, 0]), Q(end), pick, 'lb bad', true));
      REC.bad++;
      said += ' The pick is drawn in red from the first tail. It ' + (Array.isArray(pv) ? 'ends above the last nose.' : 'runs past the last nose.');
    }
    band({ s: ok ? KN(size) : '?', n: size, a: ok ? arr(0.6) : 1 },
      ok ? [{ l: 'across', v: sumText(A[0], B[0]), a: arr(0.9) }, { l: 'up', v: sumText(A[1], B[1]), a: arr(0.9) }] : [{ l: 'A', v: expr(A) }, { l: 'B', v: expr(B) }]);
    return said;
  };
  // A then B, B then A, or both: the parallelogram.
  DRAW.order = (d, st) => {
    const A = [4, 1], B = [1, 3], net = add(A, B), size = hyp(net), intro = !st.flip;
    const ia = (t) => (intro ? arr(t) : 1);
    const now = orderNow(st), prev = st.prev || now;
    const has = (o, k) => o === 'both' || o === k;
    const fade = (k) => (has(now, k) ? (has(prev, k) ? 1 : arr(0.1)) : (has(prev, k) ? 1 - arr(0.1, 0.4) : 0));
    heads(ia(0.4));
    const ref = mid([R([0, 0]), R(A), R(B)]);
    part(ia(0.4), 0, () => {
      ringPull(A, 'p1', 'A', ref, 'down');
      ringPull(B, 'p2', 'B', ref, 'up');
      ringDot();
      needle(net, intro ? go(1.3, 0.6) : 1);
    });
    const cref = Q(scale(net, 0.5));
    const aAB = intro ? [ia(0.6), ia(0.9)] : [fade('ab'), fade('ab')];
    const aBA = intro ? [arr(2.0), arr(2.5)] : [fade('ba'), fade('ba')];
    part(aAB[0], 0, () => chainArrow([0, 0], A, 'p1', 'A', cref, 'down', 0, 'm'));
    part(aAB[1], 0, () => chainArrow(A, B, 'p2', 'B', cref, 'right', 0, 'm'));
    part(aBA[0], 0, () => chainArrow([0, 0], B, 'p2', 'B', cref, 'left', 0, 'ba'));
    part(aBA[1], 0, () => chainArrow(B, A, 'p1', 'A', cref, 'up', 0, 'ba'));
    part(ia(1.3), 0, () => gapArrow(net, 1, { place: 'nose' }));
    band({ s: KN(size), n: size, a: ia(1.6) }, [{ l: 'resultant', v: expr(net), a: ia(1.6) }]);
    const which = now === 'both' ? 'A then B, and B then A. The two chains make a parallelogram, and the resultant is its diagonal' : now === 'ab' ? 'A then B' : 'B then A';
    return 'Pulls A and B on a ring. Beside it they are laid nose to tail, ' + which + '. Either way the chain ends at ' + expr(net) + ', ' + KN(size) + '.';
  };
  // The puzzle: three drawings of a and b from one point, each with a candidate for a + b.
  DRAW.which = (d, st) => {
    const pick = st.res ? st.pick : null, ok = st.res === 'right';
    const a = [50, -14], b = [14, -52], base = 140;
    REC.cands = [];
    [57, 170, 283].forEach((cx, k) => {
      const T0 = [cx - 32, base], An = [T0[0] + a[0], T0[1] + a[1]], Bn = [T0[0] + b[0], T0[1] + b[1]], F = [An[0] + b[0], An[1] + b[1]];
      line('diag', An[0], An[1], F[0], F[1]);
      line('diag', Bn[0], Bn[1], F[0], F[1]);
      pxArrow(T0, An, 'p1');
      pxArrow(T0, Bn, 'p2');
      text(T0[0] + a[0] / 2 + 3, T0[1] + a[1] / 2 + 21, 'a', 'nm', 'middle', true);
      text(T0[0] + b[0] / 2 - 13, T0[1] + b[1] / 2 + 6, 'b', 'nm', 'middle', true);
      const opt = d.opts[k], chosen = pick === opt, right = ok && opt === d.want, wrong = chosen && !ok;
      const seg = k === 0 ? [An, Bn] : k === 1 ? [T0, F] : [F, T0];
      pxArrow(seg[0], seg[1], right ? 'res' : wrong ? 'bad' : 'cand');
      REC.cands.push({ from: seg[0], to: seg[1] });
      text(cx, base + 36, String(k + 1), 'lb', 'middle');
      if (right) {
        const e = go(0.1, 0.9);
        pxArrow([T0[0] + a[0] * e, T0[1] + a[1] * e], [T0[0] + a[0] * e + b[0], T0[1] + a[1] * e + b[1]], 'p2 slid');
        part(arr(0.9), 3, () => text(F[0] + 8, F[1] - 6, 'a + b', 'lb ok', 'start', true));
      }
      if (wrong) { part(arr(0.4), 3, () => text(cx, base + 54, k === 0 ? 'joins the noses' : 'points back', 'sm bad', 'middle')); REC.bad++; }
    });
    REC.netText = null;
    return 'Three drawings. In each, arrows a and b start from one point, and dashed lines complete their parallelogram. Drawing 1 joins the two noses. Drawing 2 runs from the shared tail to the far corner. Drawing 3 runs from the far corner back to the tail.' +
      (ok ? ' A copy of b slides to the nose of a and ends on the far corner, so drawing 2 is a + b.' : pick ? ' The pick is drawn in red.' : '');
  };
  // The equilibrant of A and B: added, it closes the chain and the needle drops to zero.
  DRAW.equil = (d, st) => {
    const A = [4, 1], B = [1, 3], net = add(A, B), size = hyp(net), eqV = neg(net), intro = !st.flip;
    const ia = (t) => (intro ? arr(t) : 1);
    let eE, nE, vA, vS;
    if (intro) {
      eE = go(2.2, 0.8);
      nE = T < 2.6 ? go(1.2, 0.6) : 1 - go(2.6, 0.8);
      vS = T < 2.65 ? size : 0;
      vA = T < 2.65 ? Math.min(arr(1.6), 1 - arr(2.4, 0.25)) : arr(3.4, 0.4);
    } else {
      const g1 = go(0.1, 0.8), g2 = go(0.4, 0.8);
      eE = st.eq ? g1 : 1 - g1;
      nE = st.eq ? 1 - g2 : g2;
      vS = T < 0.35 ? (st.eq ? size : 0) : (st.eq ? 0 : size);
      vA = T < 0.35 ? 1 - arr(0.1, 0.25) : arr(1.2, 0.4);
    }
    heads(ia(0.4));
    const ref = mid([R([0, 0]), R(A), R(B)]);
    part(ia(0.4), 0, () => {
      ringPull(A, 'p1', 'A', ref, 'down');
      ringPull(B, 'p2', 'B', ref, 'up');
      if (eE > 0) ringEq(eqV, eE);
      ringDot();
      needle(net, nE, eE >= 1 ? [0, 0] : net);
    });
    const cref = mid([Q([0, 0]), Q(A), Q(net)]);
    part(ia(0.6), 0, () => chainArrow([0, 0], A, 'p1', 'A', cref, 'down'));
    part(ia(0.9), 0, () => chainArrow(A, B, 'p2', 'B', cref, 'right'));
    part(ia(1.2) * (1 - eE), 0, () => gapArrow(net, 1, { place: 'nose' }));
    eqChain(net, eqV, eE, 0, intro ? arr(3.0) : arr(0.8), 'up');
    band({ s: KN(vS), n: vS, a: vA }, [{ l: 'resultant', v: expr(net), a: ia(1.6) }, { l: 'equilibrant', v: expr(eqV), a: intro ? arr(3.0) : eE }]);
    const on = eE >= 1;
    return 'Pulls A and B on a ring, laid nose to tail beside it. Their resultant is ' + expr(net) + ', ' + KN(size) + '. ' +
      (on ? 'The equilibrant, ' + expr(eqV) + ', is added as a dashed arrow from the last nose back to the first tail, and as a third pull on the ring. The chain closes, and the needle reads 0 kN.'
        : 'The chain leaves that gap, and the needle on the ring shows the net pull.');
  };
  // The puzzle: the pulls add to 6i − 2j; which extra pull holds the ring?
  DRAW.bal = (d, st) => {
    const Rv = [6, -2], size = hyp(Rv), eqV = neg(Rv), ok = st.res === 'right', pick = st.res ? st.pick : null;
    heads(1);
    const eE = ok ? go(0.2, 0.8) : 0;
    if (eE > 0) ringEq(eqV, eE);
    ringDot();
    needle(Rv, ok ? 1 - go(0.6, 0.8) : 1, ok ? [0, 0] : Rv);
    REC.gap = Rv.slice();
    const ends = pxArrow(Q([0, 0]), Q(Rv), 'res');
    nameAt(ends[0], ends[1], 'resultant', 'lb ok', null, 'up', 0.5);
    let said = 'The pulls on a ring add to 6i − 2j, ' + KN(size) + ', shown by the needle and by the resultant from the first tail.';
    if (ok) {
      eqChain(Rv, eqV, eE, 8, arr(1.0), 'down');
      said += ' The equilibrant, −6i + 2j, runs from its nose back to the first tail and closes the chain. The needle drops to 0 kN.';
    } else if (pick) {
      const pv = d.pv[pick], e = go(0.1, 1.0);
      pxArrow(Q(Rv), Q(add(Rv, scale(pv, e))), 'bad');
      part(arr(1.0), 3, () => noseLabel(Q(Rv), Q(add(Rv, pv)), d.note[pick], 'lb bad'));
      REC.bad++;
      said += ' The pick, ' + pick + ', is drawn in red from the nose. It ' + d.note[pick] + '.';
    }
    const vA = ok ? (T < 1.2 ? 1 - arr(0.6, 0.25) : arr(1.2, 0.4)) : 1, vS = ok && T >= 1.2 ? 0 : size;
    band({ s: KN(vS), n: vS, a: vA }, [{ l: 'resultant', v: expr(Rv) }].concat(ok ? [{ l: 'equilibrant', v: expr(eqV), a: arr(0.8) }] : []));
    return said;
  };
  // Three balanced pulls; Dan drags any nose along its rope.
  DRAW.three = (d, st) => {
    const sizes = st.sizes || [3, 3, 3], intro = !st.sizes;
    const ia = (t) => (intro ? arr(t) : 1);
    const P = DIRS.map((a, k) => polar(sizes[k], a)), net = total(P), size = hyp(net);
    heads(ia(0.4));
    const o = R([0, 0]);
    part(ia(0.4), 0, () => {
      P.forEach((v, k) => ringPull(v, 'p' + (k + 1), KN(sizes[k]), o, ['left', 'down', 'up'][k]));
      ringDot();
      needle(net, 1);
    });
    const order = [2, 0, 1];
    let atp = [0, 0];
    const pts = [Q(atp)];
    order.forEach((k) => { atp = add(atp, P[k]); pts.push(Q(atp)); });
    const cref = mid(pts.slice(0, 3));
    atp = [0, 0];
    order.forEach((k, n) => {
      const p = atp;
      part(ia(1.0 + 0.6 * n), 0, () => chainArrow(p, P[k], 'p' + (k + 1), KN(sizes[k]), cref, 'up'));
      atp = add(atp, P[k]);
    });
    if (size * G.u >= 1) gapArrow(net, 1, { place: 'nose' });
    else REC.gap = net.slice();
    band({ s: KN(size), n: size, a: ia(2.8) }, [{ l: 'sizes added', v: KN(sizes[0] + sizes[1] + sizes[2]), a: ia(2.8) }]);
    return 'Three ropes pull a ring with ' + sizes.map(KN).join(', ') + ', 120 degrees apart. Nose to tail, their arrows ' +
      (size < 0.005 ? 'close into a triangle, and the needle reads 0 kN.' : 'leave a gap of ' + KN(size) + ', and the needle shows that net pull.');
  };
  // The puzzle: 5 kN east, 5 kN west and 2 kN north.
  DRAW.ewn = (d, st) => {
    const E = [5, 0], W = [-5, 0], N = [0, 2], net = total([E, W, N]), size = hyp(net), ok = st.res === 'right', pick = st.res ? st.pick : null;
    heads(1);
    compass('north');
    const o = R([0, 0]);
    ringPull(E, 'p1', '5 kN', o, 'down');
    ringPull(W, 'p2', '5 kN', o, 'down');
    ringPull(N, 'p3', '2 kN', o, 'left');
    ringDot();
    needle(net, ok ? go(0.2, 0.8) : 0);
    const cref = Q([2.5, 1]);

    chainArrow(E, N, 'p3', '2 kN', cref, 'right');
    chainArrow([5, 2], W, 'p2', '5 kN', null, 'down');
    let said = 'Ropes pull a ring with 5 kN east, 5 kN west and 2 kN north. Beside it they are laid nose to tail: east, then north, then west.';
    if (ok) {
      gapArrow(net, go(0.2, 0.8), { place: 'nose', la: arr(0.9) });
      said += ' The gap runs 2 kN north.';
    } else if (pick === '12 kN') {
      const y = Q([0, 0])[1] + 30, x0 = Q([0, 0])[0], e = go(0.1, 1.0);

      REC.bad++;
      said += ' The pick lays all three sizes in one red line, 12 kN, far longer than the gap.';
    } else if (pick === '0 kN') {
      const s = Q([0, 0]);
      part(arr(0.1), 0, () => put(K.svg('circle', { class: 'badc', cx: r3(s[0]), cy: r3(s[1]), r: 7 })));
      part(arr(0.4), 3, () => text(s[0] + 4, s[1] + 44, '0 kN would end here', 'sm bad', 'middle'));
      REC.bad++;
      said += ' A red ring marks where the chain would end for 0 kN. It ends 2 kN higher.';
    }
    band({ s: ok ? KN(size) + ' north' : '?', n: size, a: ok ? arr(0.6) : 1 }, ok ? [{ l: 'sizes added', v: '12 kN', a: arr(0.9) }] : []);
    return said;
  };
  // The puzzle: lines A and B, and the third pull that holds the ring.
  DRAW.third = (d, st) => {
    const A = [6, 2], B = [2, -2], net = add(A, B), eqV = neg(net), ok = st.res === 'right', pick = st.res ? st.pick : null;
    heads(1);
    compass('east');
    const ref = mid([R([0, 0]), R(A), R(B)]);
    const eE = ok ? go(0.2, 0.8) : 0;
    ringPull(A, 'p1', 'A', ref, 'up');
    ringPull(B, 'p2', 'B', ref, 'down');
    if (eE > 0) ringEq(eqV, eE);
    ringDot();
    needle(net, 0, ok && eE >= 1 ? [0, 0] : net);
    const cref = mid([Q([0, 0]), Q(A), Q(net)]);
    chainArrow([0, 0], A, 'p1', 'A', cref, 'up');
    chainArrow(A, B, 'p2', 'B', cref, 'up');
    let said = 'Line A, 6i + 2j, and line B, 2i − 2j, pull a ring. Beside it they are laid nose to tail.';
    if (ok) {
      eqChain(net, eqV, eE, 0, arr(1.0), 'down');
      said += ' The third pull, −8i or 8 kN west, runs from the last nose back to the first tail and closes the chain. The net pull is 0 kN.';
    } else if (pick) {
      const pv = d.pv[pick], e = go(0.1, 1.0);
      const ends = pxArrow(Q(net), Q(add(net, scale(pv, e))), 'bad');
      part(arr(1.0), 3, () => nameAt(Q(net), Q(add(net, pv)), pick, 'lb bad', null, 'down', 0.5));
      REC.bad++;
      said += ' The pick, ' + pick + ', is drawn in red from the last nose. It ' + (pv[0] > 0 ? 'runs away from the first tail.' : 'runs past the first tail.');
    }
    band({ s: ok ? '0 kN' : '?', n: 0, a: ok ? arr(1.0) : 1 },
      ok ? [{ l: 'across', v: sumText(A[0], B[0]), a: arr(0.9) }, { l: 'up', v: sumText(A[1], B[1]), a: arr(0.9) }] : [{ l: 'A', v: expr(A) }, { l: 'B', v: expr(B) }]);
    return said;
  };

  // ---------- the drags: the nose of B, and the three balanced pulls ----------
  const bGrip = ui.appendChild(K.svg('circle', { class: 'grip', cx: 0, cy: 0, r: 22, tabindex: -1, role: 'button', 'aria-label': 'Nose of pull B: drag, or use the arrow keys, to move it' }));
  const tGrips = [0, 1, 2].map((k) => ui.appendChild(K.svg('circle', { class: 'grip', cx: 0, cy: 0, r: 20, tabindex: -1, role: 'button', 'aria-label': 'Nose of pull ' + (k + 1) + ': drag along its rope, or use the arrow keys, to change its size' })));
  function placeGrips(d, st) {
    const bOn = d.pic === 'parts' && !finished, tOn = d.pic === 'three' && !finished;
    bGrip.style.display = bOn ? '' : 'none'; bGrip.setAttribute('tabindex', bOn ? '0' : '-1');
    tGrips.forEach((g) => { g.style.display = tOn ? '' : 'none'; g.setAttribute('tabindex', tOn ? '0' : '-1'); });
    if (bOn) { const p = R(st.b || [1, 3]); bGrip.setAttribute('cx', r3(p[0])); bGrip.setAttribute('cy', r3(p[1])); }
    if (tOn) { const sz = st.sizes || [3, 3, 3]; tGrips.forEach((g, k) => { const p = R(polar(sz[k], DIRS[k])); g.setAttribute('cx', r3(p[0])); g.setAttribute('cy', r3(p[1])); }); }
  }
  function changed(quiet) {
    if (quiet) return;
    if (anim.playing()) anim.pause();
    T = Infinity;
    K.reveal(); K.refresh();
  }
  // B's nose lands on a whole kN, inside its range; B never shrinks to nothing.
  function setB(i, v, quiet) {
    const w = [K.clamp(Math.round(v[0]), -1, 3), K.clamp(Math.round(v[1]), -1, 4)];
    if (!w[0] && !w[1]) return false;
    S[i].b = w;
    changed(quiet);
    return true;
  }
  // A balanced pull's size, in half kN from 1 to 4.
  function setSize(i, k, s, quiet) {
    const sz = (S[i].sizes || [3, 3, 3]).slice();
    sz[k] = K.clamp(Math.round(s * 2) / 2, 1, 4);
    S[i].sizes = sz;
    changed(quiet);
  }
  function ringAt(e) {
    const ctm = svg.getScreenCTM();
    if (!ctm) return null;
    const q = new DOMPoint(e.clientX, e.clientY).matrixTransform(ctm.inverse());
    return [(q.x - G.ring[0]) / G.u, (G.ring[1] - q.y) / G.u];
  }
  let held = null;
  const onPic = (pic) => !finished && STEPS[at()].pic === pic;
  function grab(g, what, k) {
    g.addEventListener('pointerdown', (e) => {
      if (!onPic(what)) return;
      const q = ringAt(e);
      if (!q) return;
      held = { id: e.pointerId, what, k };
      try { g.setPointerCapture(e.pointerId); } catch (err) { /* the drag still follows while the pointer stays on the grip */ }
      e.preventDefault();
      move(q);
    });
    g.addEventListener('pointermove', (e) => {
      if (!held || held.id !== e.pointerId || held.k !== k || !onPic(what)) return;
      const q = ringAt(e);
      if (q) move(q);
    });
    g.addEventListener('pointerup', (e) => { if (held && held.id === e.pointerId) held = null; });
    g.addEventListener('pointercancel', (e) => { if (held && held.id === e.pointerId) held = null; });
    g.addEventListener('lostpointercapture', () => { held = null; });
    function move(q) {
      if (what === 'parts') setB(at(), q);
      else { const u = polar(1, DIRS[k]); setSize(at(), k, q[0] * u[0] + q[1] * u[1]); }
    }
    g.addEventListener('keydown', (e) => {
      if (!onPic(what)) return;
      if (what === 'parts') {
        const by = { ArrowUp: [0, 1], ArrowDown: [0, -1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] }[e.key];
        if (!by) return;
        e.preventDefault();
        const b = S[at()].b || [1, 3];
        setB(at(), [b[0] + by[0], b[1] + by[1]]);
      } else {
        const by = { ArrowUp: 0.5, ArrowRight: 0.5, ArrowDown: -0.5, ArrowLeft: -0.5 }[e.key];
        if (!by) return;
        e.preventDefault();
        const sz = S[at()].sizes || [3, 3, 3];
        setSize(at(), k, sz[k] + by);
      }
    });
  }
  grab(bGrip, 'parts', -1);
  tGrips.forEach((g, k) => grab(g, 'three', k));

  // The scene for a step (the animation calls this every frame).
  function paint(i) {
    if (i == null) i = at();
    const d = STEPS[i], st = S[i];
    G = Object.assign({}, d.geo, { H: d.geo.hd + (d.pic === 'which' ? 10 : 60) });
    art.textContent = '';
    into = null;
    REC = { texts: [], bad: 0, pulls: [], chains: {}, gap: null, net: null, netText: null, netNum: null, items: [], legs: [], legEnd: null, eqRing: null, eqChain: null, angle: null, cands: null };
    svg.setAttribute('viewBox', '0 0 340 ' + G.H);
    svg.setAttribute('aria-label', DRAW[d.pic](d, st, i));
    placeGrips(d, st);
  }

  write(el('finish'), FINISH);
  K.update((p) => {
    const i = Math.round(p.step), d = STEPS[i], st = S[i];
    if (!anim.playing()) T = Infinity;   // motion that was stopped (the page hidden, a test) shows finished
    // Dan's own angle and order, told apart from the settings the demonstrations give them.
    const here = i === lastStep && !finished;
    if (p.ang !== angShown) { angShown = p.ang; if (here && d.pic === 'two' && d.show) { st.ang = p.ang; anim.pause(); T = Infinity; } }
    if (p.order !== orderShown) { orderShown = p.order; if (here && d.pic === 'order') { st.prev = orderNow(st); st.order = p.order; st.flip = true; play(1.0); } }
    if (i !== lastStep) {
      lastStep = i; enter('stepbox');
      if (d.show) {
        Object.assign(st, { ang: null, order: null, prev: null, flip: false, eq: null, b: null, sizes: null });
        play(d.dur);
      } else { anim.pause(); T = Infinity; }
    }
    if (finished !== lastDone) { lastDone = finished; enter(finished ? 'done' : 'stepbox'); }
    const right = st.res === 'right';
    el('stepbox').hidden = finished;
    el('done').hidden = !finished;
    el('count').textContent = 'Step ' + (i + 1) + ' of ' + STEPS.length;
    const task = el('task');
    task.className = 'task' + (d.show ? ' show' : '');
    write(task, d.show ? d.text : d.task);
    paint(i);
    syncCtl(i);

    el('abox').hidden = finished || !(d.pic === 'two' && d.show);
    el('obox').hidden = finished || d.pic !== 'order';
    el('ebox').hidden = finished || d.pic !== 'equil';
    replayBtn.el.hidden = !d.show || REDUCE;
    el('replay').hidden = replayBtn.el.hidden;
    const opts = d.show ? [] : d.opts || [];
    el('picks').hidden = !opts.length;
    el('picks').classList.toggle('long', opts.some((o) => o.length > 9));
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      b.setLabel(opts[k]);
      b.el.textContent = '';
      vecs(b.el.appendChild(K.el('span')), opts[k], false);
      b.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });

    el('acts').hidden = !!d.show;
    checkBtn.el.hidden = right;
    const fb = el('fb');
    fb.hidden = !!d.show;
    fb.className = 'fb' + (right ? ' right' : st.res === 'wrong' ? ' wrong' : '');
    write(fb, d.show ? '' : right ? 'That\'s it.' : st.res === 'wrong' ? hintFor(i, st) : st.res === 'empty' ? 'Choose one of the answers first.' : '');

    const why = el('why');
    why.hidden = d.show || !st.why;
    write(why, d.show ? '' : d.why);
    whyBtn.setLabel(st.why ? 'Hide why' : 'Why?');

    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !right);
    nextBtn.setLabel(i === STEPS.length - 1 ? 'Finish' : 'Continue');
    nav.hidden = backBtn.el.hidden && nextBtn.el.hidden;
  });

  // ---------- known answers, worked out by hand ----------
  const DO = STEPS.map((d, i) => i).filter((i) => !STEPS[i].show);
  const idx = (name) => STEPS.findIndex((d) => d.name === name);
  // A step painted in the state given (finished, or at t seconds into its motion): what it drew.
  function drawn(i, st, t) {
    const keepS = S[i], keepT = T;
    S[i] = st; T = t == null ? Infinity : t;
    try { paint(i); return REC; } finally { S[i] = keepS; T = keepT; paint(); }
  }
  // Every chain runs nose to tail from the first tail; its ends.
  function chainEnds(r) {
    return Object.keys(r.chains).map((id) => {
      let atp = [0, 0];
      for (const c of r.chains[id]) { if (!same(c.p, atp)) return null; atp = add(atp, c.v); }
      return atp;
    });
  }

  K.check('A resultant vector results from adding two or more vectors together: on every ring the needle stands for all its pulls added, every chain runs nose to tail through the same pulls, and the resultant runs from the first tail to where the chain ends', () =>
    STEPS.every((d, i) => {
      if (d.pic === 'which' || d.pic === 'bal') return true;
      const r = drawn(i, d.show ? blank() : solved(i)), sumP = total(r.pulls), eq = r.eqRing || [0, 0], ends = chainEnds(r);
      if (!r.pulls.length || !r.net || !ends.length || ends.some((e) => !e || !same(e, sumP))) return false;
      if (!same(r.net, add(sumP, eq)) || !K.near(r.netNum, hyp(r.net), 1e-9) || r.netText.indexOf(KN(r.netNum)) !== 0) return false;
      return !r.gap || same(r.gap, ends[0]);
    }), { source: SRC_RESULTANT });
  K.check('Vectors cannot be added by simply adding their magnitudes: two equal pulls make a needle as long as their sizes added only when they point the same way, and a shorter one at every other angle', () => {
    const i = idx('Two pulls, one gap');
    for (let a = 0; a <= 180; a++) {
      const r = drawn(i, Object.assign(blank(), { ang: a })), want = 6 * C(a / 2);
      if (!K.near(r.netNum, want, 1e-9) || r.netText !== KN(want)) return false;
      if (a === 0 ? !K.near(r.netNum, 6, 1e-9) : !(r.netNum < 6 - 1e-9)) return false;
    }
    return true;
  }, { source: SRC_SIZES });
  K.check('Two 3 kN pulls read 6, 4.24, 3 and 0 kN at 0°, 90°, 120° and 180°; the 90° and 120° puzzles answer 4.24 kN and 3 kN, and by parts the 120° pulls make 3 − 1.5 = 1.5 across and 2.6 up', () => {
    const i = idx('Two pulls, one gap'), rd = (a) => drawn(i, Object.assign(blank(), { ang: a })).netText;
    const j = idx('Two pulls at 90°'), k = idx('Two pulls at 120°'), rj = drawn(j, solved(j)), rk = drawn(k, solved(k));
    return rd(0) === '6 kN' && rd(90) === '4.24 kN' && rd(120) === '3 kN' && rd(180) === '0 kN' && drawn(i, blank()).netText === '3 kN' &&
      rj.netText === '4.24 kN' && STEPS[j].want === '4.24 kN' && rk.netText === '3 kN' && STEPS[k].want === '3 kN' && rk.items.some((it) => it.v === '1.5i + 2.6j') &&
      num(3 * C(120)) === '−1.5' && num(3 * Sn(120)) === '2.6' && num(3 + 3 * C(120)) === '1.5';
  });
  K.check('Components can be added or subtracted separately: for pulls A and B the readout adds the across parts and the up parts on their own, the gathered parts end where the chain ends, and this holds wherever the nose of B is dragged', () => {
    const i = idx('Add the parts');
    for (let x = -1; x <= 3; x++) for (let y = -1; y <= 4; y++) {
      if (!x && !y) continue;
      const r = drawn(i, Object.assign(blank(), { b: [x, y] })), end = [4 + x, 1 + y];
      if (r.items.length !== 2 || r.items[0].v !== sumText(4, x) || r.items[1].v !== sumText(1, y)) return false;
      if (!same(r.gap, end) || !same(r.legEnd, end) || !K.near(r.netNum, hyp(end), 1e-9)) return false;
      for (let n = 1; n < r.legs.length; n++) if (!same(r.legs[n][0], r.legs[n - 1][1])) return false;
    }
    const a = idx('Add 2i + 3j and 4i − 1j'), t = idx('A third line'), ra = drawn(a, solved(a)), rt = drawn(t, solved(t));
    return ra.items[0].v === sumText(2, 4) && ra.items[1].v === sumText(3, -1) && rt.items[0].v === sumText(6, 2) && rt.items[1].v === sumText(2, -2);
  }, { source: SRC_PARTS });
  K.check('Either order reaches the same nose: B then A ends where A then B does, at 5i + 4j, and drawn together the two chains make a parallelogram whose diagonal from the shared tail is the resultant, 6.40 kN', () => {
    const i = idx('Either order'), ends = (o) => chainEnds(drawn(i, Object.assign(blank(), { flip: true, order: o, prev: o })));
    const ab = ends('ab'), ba = ends('ba'), both = ends('both'), rb = drawn(i, blank());
    return ab.length === 1 && ba.length === 1 && both.length === 2 && same(ab[0], ba[0]) && same(both[0], both[1]) && same(ab[0], [5, 4]) &&
      same(rb.gap, [5, 4]) && rb.netText === '6.40 kN' && !!rb.chains.ba && same(rb.chains.m[0].v, rb.chains.ba[1].v) && same(rb.chains.m[1].v, rb.chains.ba[0].v);
  });
  K.check('The equilibrant has the same magnitude as the resultant but the opposite direction: added, it closes the chain and the needle reads zero; taken away, the gap and the needle come back', () => {
    const i = idx('The equilibrant'), on = drawn(i, blank()), off = drawn(i, Object.assign(blank(), { flip: true, eq: false }));
    const b = idx('Balance 6i − 2j'), t = idx('A third line'), rb = drawn(b, solved(b)), rt = drawn(t, solved(t));
    return same(on.eqRing, [-5, -4]) && same(on.eqChain, [-5, -4]) && on.netText === '0 kN' && !on.gap && same(on.net, [0, 0]) &&
      !off.eqRing && !off.eqChain && same(off.gap, [5, 4]) && off.netText === '6.40 kN' &&
      same(rb.eqChain, [-6, 2]) && rb.netText === '0 kN' && K.near(hyp(rb.eqChain), hyp(rb.gap), 1e-12) &&
      same(rt.eqChain, [-8, 0]) && same(rt.eqRing, [-8, 0]) && rt.netText === '0 kN';
  }, { source: SRC_EQUIL });
  K.check('Every number in the puzzles follows from the rule: √(3² + 3²) = 4.24; √41 = 6.40, √17 = 4.12 and √10 = 3.16; 2 + 4 = 6, 3 − 1 = 2 and √40 = 6.32; 6 + 2 = 8, √8 = 2.83 and 6.32 + 2.83 = 9.15; 5 + 5 + 2 = 12', () =>
    kn(Math.hypot(3, 3)) === '4.24' && kn(Math.sqrt(41)) === '6.40' && kn(Math.sqrt(17)) === '4.12' && kn(Math.sqrt(10)) === '3.16' &&
    sumText(2, 4) === '2 + 4 = 6' && sumText(3, -1) === '3 − 1 = 2' && kn(ROOT40) === '6.32' && sumText(6, 2) === '6 + 2 = 8' && kn(ROOT8) === '2.83' &&
    kn(ROOT40 + ROOT8) === '9.15' && 5 + 5 + 2 === 12 && expr(neg([6, -2])) === '−6i + 2j' && expr(add([2, 3], [4, -1])) === '6i + 2j' &&
    STEPS[idx('A third line')].opts.indexOf(kn(ROOT40 + ROOT8) + ' kN west') >= 0);
  K.check('Three 3 kN pulls 120° apart close their chain into a triangle, so the needle reads 0 kN while their sizes add to 9 kN; changing any one pull opens the chain by exactly the change, along that rope', () => {
    const i = idx('Three pulls in balance'), r = drawn(i, blank());
    if (r.netText !== '0 kN' || r.items[0].v !== '9 kN' || !r.chains.m || r.chains.m.length !== 3) return false;
    for (let k = 0; k < 3; k++) for (let s = 1; s <= 4; s += 0.5) {
      const sz = [3, 3, 3]; sz[k] = s;
      const q = drawn(i, Object.assign(blank(), { sizes: sz }));
      if (!same(q.net, polar(s - 3, DIRS[k])) || !K.near(q.netNum, Math.abs(s - 3), 1e-9)) return false;
    }
    return true;
  });
  K.check('Every puzzle offers three different answers with exactly one accepted, gives each wrong one its own hint, and draws a wrong pick in red but a right one without', () =>
    DO.every((i) => {
      const d = STEPS[i], wrong = d.opts.filter((o) => o !== d.want);
      return d.opts.length === 3 && new Set(d.opts).size === 3 && wrong.length === 2 && wrong.every((o) => !!d.hints[o]) && d.hints[wrong[0]] !== d.hints[wrong[1]] &&
        wrong.every((o) => drawn(i, wrongSt(i, o)).bad > 0) && drawn(i, solved(i)).bad === 0;
    }));
  K.check('Before Check no puzzle\'s picture shows its answer, and a right answer shows it', () =>
    DO.every((i) => { const d = STEPS[i]; return drawn(i, blank()).texts.indexOf(d.reveal) < 0 && drawn(i, solved(i)).texts.indexOf(d.reveal) >= 0; }));
  K.check('Every demonstration has finished arriving within 4.5 s of its screen opening, none starting before the 0.35 s screen fade ends; every answer\'s motion within 2.5 s', () => {
    const timed = (i, st, limit) => {
      const keepS = S[i], keepT = T;
      T = Infinity; latest = 0; earliest = Infinity; S[i] = st;
      try { paint(i); } finally { S[i] = keepS; T = keepT; }
      return latest <= limit + 1e-9;
    };
    const ok = STEPS.every((d, i) => {
      if (d.show) { const r = timed(i, blank(), d.dur); return r && d.dur <= 4.5 && d.dur >= 3 && earliest >= FADE; }
      return timed(i, solved(i), d.fb[0]) && d.fb[0] <= 2.5 && d.fb[1] <= 2.5 &&
        d.opts.filter((o) => o !== d.want).every((o) => timed(i, wrongSt(i, o), d.fb[1]));
    });
    paint();
    return ok;
  });

  K.ready();
</script>
