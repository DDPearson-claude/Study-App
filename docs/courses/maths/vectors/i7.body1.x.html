<p class="caption">The turning arrows are drawn slowed down, since at 50 Hz each turn takes 20 ms.</p>

<script>
  const RAD = Math.PI / 180;
  const Q3 = Math.sqrt(3) / 2, Q2 = Math.SQRT1_2;
  // Exact values at the lesson's angles, so 10 cos 120° is exactly −5.
  const EXC = { 0: 1, 30: Q3, 45: Q2, 60: 0.5, 90: 0, 120: -0.5, 135: -Q2, 150: -Q3, 180: -1, 210: -Q3, 225: -Q2, 240: -0.5, 270: 0, 300: 0.5, 315: Q2, 330: Q3 };
  const EXS = { 0: 0, 30: 0.5, 45: Q2, 60: Q3, 90: 1, 120: Q3, 135: Q2, 150: 0.5, 180: 0, 210: -0.5, 225: -Q2, 240: -Q3, 270: -1, 300: -Q3, 315: -Q2, 330: -0.5 };
  const has = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
  const wrapD = (a) => ((a % 360) + 360) % 360;
  const keyOf = (a) => Math.round(wrapD(a) * 1e6) / 1e6;
  const cosd = (a) => (has(EXC, keyOf(a)) ? EXC[keyOf(a)] : Math.cos(a * RAD));
  const sind = (a) => (has(EXS, keyOf(a)) ? EXS[keyOf(a)] : Math.sin(a * RAD));
  // Up to two decimals: 12, 4.5, −60.
  function num(v) { let r = Math.round(v * 100) / 100; if (Math.abs(r) < 1e-9) r = 0; return (r < 0 ? '−' : '') + String(Math.abs(r)); }
  // As the lesson writes a worked value: exact ones plainly (10, 2.5), rounded ones to two places (5.20, 3.46).
  function fx(v) {
    const r = Math.round(v * 100) / 100;
    if (Math.abs(r) < 1e-9) return '0';
    const s = Math.abs(v - r) < 1e-9 ? String(Math.abs(r)) : Math.abs(r).toFixed(2);
    return (r < 0 ? '−' : '') + s;
  }
  const polar = (r, a, u) => fx(r) + '∠' + num(a) + '°' + (u ? ' ' + u : '');
  const par = (s) => (s.charAt(0) === '−' ? '(' + s + ')' : s);
  const add = (p, q) => [p[0] + q[0], p[1] + q[1]];
  const sub = (p, q) => [p[0] - q[0], p[1] - q[1]];
  const scale = (p, s) => [p[0] * s, p[1] * s];
  const hyp = (v) => Math.hypot(v[0], v[1]);
  const lerp2 = (a, b, e) => [a[0] + (b[0] - a[0]) * e, a[1] + (b[1] - a[1]) * e];
  const dotv = (p, q) => p[0] * q[0] + p[1] * q[1];
  const pol = (r, a) => [r * cosd(a), r * sind(a)];
  // A point on screen from C, for an arrow v (y up) at s px a unit.
  const P = (C, v, s) => [C[0] + v[0] * s, C[1] - v[1] * s];
  // Nose to tail: the sum of the arrows, the same rule for pulls, currents and voltages.
  const chainSum = (vs) => vs.reduce((a, b) => add(a, b), [0, 0]);
  const ANG = [0, -120, 120], PH = ['va', 'vb', 'vc'];

  // ---------- each screen's layout ----------
  const GT = { R: [24, 142], C: [160, 118], r: 40, X0: 214, W: 118, ly0: 32, ly1: 208, h: 216 };
  const GL = { C: [70, 112], rV: 44, rI: 30, X0: 128, W: 200, ly0: 30, ly1: 192, hd: 198, rows: 2 };
  const GA = { F0: [16, 150], C: [160, 118], aS: 11, X0: 216, W: 118, ly0: 32, ly1: 200, hd: 206, rows: 2 };
  const GS4 = { O: [96, 58], s: 12, ly0: 20, ly1: 172, hd: 178, rows: 2 };
  const GF = { C: [66, 112], r1: 44, r3: 30, X0: 128, W: 204, ly0: 32, ly1: 200, hd: 206, rows: 2 };
  const GD = { O: [50, 120], iS: 6, zS: 2, ly0: 30, ly1: 206, hd: 212, rows: 3 };
  const GD8 = Object.assign({}, GD, { zS: 1.2 });
  const GP = { S: [78, 112], s: 6, P0: [188, 84], ly0: 32, ly1: 190, hd: 196, rows: 3 };
  const GV = { O: [70, 130], s: 0.3, ly0: 32, ly1: 206, hd: 212, rows: 3 };
  [GL, GA, GS4, GF, GD, GD8, GP, GV].forEach((g) => { g.h = g.hd + 26 + (g.rows - 1) * 28 + 14; });

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // pic: what is drawn. dur: a SHOW step's demonstration in seconds. act: what he can do with it,
  // shown under the picture. turn: the label of the button that sets the arrows turning; rate: how
  // fast they turn, in ms of the cycle each second. A puzzle: task, opts (three answers), want,
  // hints (one per wrong answer), why, reveal (a label only a right answer draws), fb (seconds of
  // motion after a right and a wrong answer).
  const STEPS = [
    { show: true, name: 'Two arrows', pic: 'turn', geo: GT, dur: 4.8, turn: 'Turn it', rate: 8,
      text: 'A 3 kN pull on a ring stays put, pointing the way its rope runs. Beside it, an arrow turns once a cycle, and its height traces a *sine wave*. Freeze it and you have the *phasor*, the fixed arrow `r∠θ`.',
      act: 'Press Turn it to set the arrow going, and Freeze to stop it.' },
    { kind: 'pick', name: 'How much later', pic: 'lag', geo: GL, fb: [1.8, 1.6],
      task: 'A current is 90° behind the voltage. How much later does the current peak?',
      opts: ['90 ms', '5 ms', '15 ms'], want: '5 ms', reveal: '5 ms',
      hints: { '90 ms': 'Not quite. That reads degrees as milliseconds. 90° is a quarter turn, and a whole turn takes 20 ms.',
        '15 ms': 'Not quite. That is three quarters of a turn. 90° behind is a quarter turn later.' },
      why: 'A whole turn is 360° and takes 20 ms. 90° is a quarter of that. So the current peaks 20 × 90 ÷ 360 = 5 ms after the voltage. The angle measures a delay. Nothing in the cable points that way.' },
    { show: true, name: 'Adding', pic: 'add', geo: GA, dur: 4.8, turn: 'Turn them', rate: 8,
      text: 'Two 3 kN pulls, square to each other, add nose to tail to 4.24 kN. Two 3 A currents a quarter turn apart add the same way, to 4.24 A. They turn together, so the sum\'s height is always their two heights added.',
      act: 'Press Turn them to set the currents going, and Freeze to stop them.' },
    { kind: 'pick', name: 'Two currents', pic: 'sum', geo: GS4, fb: [1.6, 1.4],
      task: '6 A flows in step with the voltage. Another 8 A is a quarter turn behind. What is the total current?',
      opts: ['14 A', '2 A', '10 A'], want: '10 A', reveal: '10 A',
      hints: { '14 A': 'Not quite. That adds the sizes, as if both peaked together. Lay them nose to tail.',
        '2 A': 'Not quite. That is 8 − 6, as if they pulled opposite ways. They are a quarter turn apart.' },
      why: 'Lay them nose to tail. The 8 A runs square to the 6 A. So the total is √(6² + 8²) = 10 A, not 14 A.' },
    { show: true, name: 'Two speeds', pic: 'speeds', geo: GF, dur: 4.3, turn: 'Turn them', rate: 2.5,
      text: 'A 50 Hz arrow and a 150 Hz arrow start together. The faster one turns three times as fast, so the angle between them keeps changing. That is why waves of different frequencies cannot share one phasor diagram.',
      act: 'Press Turn them to run the arrows on, and Freeze to stop them.' },
    { kind: 'pick', name: 'After 5 ms', pic: 'speedsq', geo: GF, fb: [2.4, 2.0],
      task: 'Both arrows start together at 0°. How far apart are they 5 ms later?',
      opts: ['180°', '0°', '90°'], want: '180°', reveal: '180°',
      hints: { '0°': 'Not quite. They start together, but the faster one gains on the slower one.',
        '90°': 'Not quite. 90° is how far the 50 Hz arrow turns. The 150 Hz arrow turns three times as far.' },
      why: 'In 5 ms the 50 Hz arrow makes a quarter turn, 90°. The 150 Hz arrow turns three times as far, 270°. So they are 270° − 90° = 180° apart.' },
    { show: true, name: 'Dividing', pic: 'divide', geo: GD, dur: 4.2,
      text: 'Written as a number, a phasor can be divided. Divide the sizes and take away the angles. So `230∠0° V` ÷ `10∠−30° A` gives an *impedance* of `23∠30° Ω`.',
      act: 'Drag the tip of the current\'s arrow to change the current.' },
    { kind: 'pick', name: 'Divide it', pic: 'divideq', geo: GD8, fb: [1.9, 1.5],
      task: 'Divide `230∠0° V` by `5∠−60° A`. What is the impedance?',
      opts: ['1150∠−60° Ω', '46∠60° Ω', '46∠−60° Ω'], want: '46∠60° Ω', reveal: '46∠60° Ω',
      hints: { '1150∠−60° Ω': 'Not quite. That multiplies. To divide, divide the sizes and take away the angles.',
        '46∠−60° Ω': 'Not quite. The size is right. Now take the angles away: 0° − (−60°) = 60°.' },
      why: 'Divide the sizes: 230 ÷ 5 = 46 Ω. Take away the angles: 0° − (−60°) = 60°. So the impedance is `46∠60° Ω`.' },
    { show: true, name: 'Three phases', pic: 'star', geo: GP, dur: 4.5,
      text: 'Three phase currents leave the star point 120° apart. Nose to tail, three equal 10 A currents close like the ring\'s pulls, so the neutral carries 0 A. Shorten one and the chain falls short, leaving a gap that is the *neutral current*.',
      act: 'Drag the tip of any current along its line.' },
    { kind: 'pick', name: 'One line light', pic: 'starq', geo: GP, L: [10, 10, 4], fb: [1.8, 1.4], pv: { '24 A': 'line', '3 A': 'across' },
      task: 'L1 and L2 carry 10 A each. L3 carries 4 A. What does the neutral carry?',
      opts: ['24 A', '3 A', '6 A'], want: '6 A', reveal: '6 A',
      hints: { '24 A': 'Not quite. That adds the sizes. The currents are 120° apart, so most of them cancel.',
        '3 A': 'Not quite. That is only the across part. Add the up part too, then use Pythagoras.' },
      why: 'Across: 10 − 5 − 2 = 3 A. Up: 0 − 8.66 + 3.46 = −5.20 A. So the neutral carries √(3² + 5.20²) = 6 A, not 24 A.' },
    { kind: 'pick', name: 'All three differ', pic: 'starq2', geo: GP, L: [10, 8, 6], fb: [1.8, 1.4], pv: { '4 A': 'diff', '24 A': 'line' },
      task: 'Now L1 carries 10 A, L2 8 A and L3 6 A. What does the neutral carry?',
      opts: ['3.46 A', '4 A', '24 A'], want: '3.46 A', reveal: '3.46 A',
      hints: { '4 A': 'Not quite. The difference rule only works when two lines match. Here all three differ, so work it by parts.',
        '24 A': 'Not quite. That adds the sizes. Lay the currents nose to tail instead.' },
      why: 'Across: 10 − 4 − 3 = 3 A. Up: 0 − 6.93 + 5.20 = −1.73 A. So the neutral carries √(3² + 1.73²) = 3.46 A.' },
    { kind: 'pick', name: 'Line to line', pic: 'line', geo: GV, fb: [2.0, 1.6],
      task: 'Take `230∠−120° V` away from `230∠0° V`. What is the voltage between the two lines?',
      opts: ['230∠−60° V', '398∠30° V', '460 V'], want: '398∠30° V', reveal: '398∠30° V',
      hints: { '230∠−60° V': 'Not quite. That adds them. To take away, turn the second arrow round, then add.',
        '460 V': 'Not quite. That adds the sizes, as if the arrows lay in line. Turn the second round and lay it nose to tail.' },
      why: 'Turn `230∠−120° V` round to get `230∠60° V`, then add. Across: 230 + 115 = 345 V. Up: 0 + 199.19 = 199.19 V. So the line voltage is √(345² + 199.19²) = 398 V, at 30°.' },
  ];
  const FINISH = 'A phasor adds like a vector. Its angle is a shift in time, and as a number it can be divided.';
  // The lesson's sources, each cited only by a check that restates its quote.
  const SRC1 = 'https://web.eecs.utk.edu/~mjr/ECE202/Labs/Lab%204.pdf';
  const SRC2 = 'https://www.electronics-tutorials.ws/accircuits/phasors.html';
  const SRC3 = 'https://electronics.stackexchange.com/questions/420569/phasor-vs-vector-vs-space-vector';
  const FADE = 0.35;
  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const testing = () => document.documentElement.classList.contains('k-testing');
  const el = (id) => document.getElementById(id);
  const atPic = (pic) => STEPS.findIndex((d) => d.pic === pic);

  // ---------- each step's state ----------
  // pick, res, why: a puzzle's answer, its result and the Why? note. ph: where he froze the turning
  // arrows (ms into the cycle). I: the current he dragged to, [size, angle]. L: the three line
  // currents he dragged to.
  function blank() { return { pick: null, res: null, why: false, ph: null, I: null, L: null }; }
  const isRight = (i, st) => st.pick != null && st.pick === STEPS[i].want;
  const hintFor = (i, st) => { const d = STEPS[i]; return (d.hints && d.hints[st.pick]) || 'Not quite. Look again at the picture.'; };
  const solved = (i) => Object.assign(blank(), { pick: STEPS[i].want, res: 'right' });
  const wrongSt = (i, o) => Object.assign(blank(), { pick: o, res: 'wrong' });
  let S = STEPS.map(() => blank());
  let finished = false, lastStep = -1, lastDone = false, T = Infinity;   // T: seconds into the current motion
  let motionEnd = 0, spin = false;   // spin: the arrows are turning until he freezes them
  let REC = null;   // what the last paint drew, for the checks
  let G = null;     // the layout of the step being drawn
  let BOX = [], SEG = [];   // what a label must keep clear of: other labels and solid shapes, and lines

  // ---------- text with amber key terms (built with K.el, never innerHTML) ----------
  function write(node, s) {
    node.textContent = '';
    // A number keeps its unit on the same line.
    String(s).replace(/(\d) (?=(?:ms|Hz|kN|A|V|Ω)(?![A-Za-z]))/g, '$1 ').split('`').forEach((seg, k) => {
      if (!seg) return;
      if (k % 2) { node.appendChild(K.el('span', { class: 'nw' }, seg)); return; }
      const re = /\*([^*]+)\*/g;
      let at = 0, m;
      while ((m = re.exec(seg))) {
        if (m.index > at) node.appendChild(document.createTextNode(seg.slice(at, m.index)));
        node.appendChild(K.el('span', { class: 'term' }, m[1]));
        at = m.index + m[0].length;
      }
      if (at < seg.length) node.appendChild(document.createTextNode(seg.slice(at)));
    });
  }

  // ---------- controls ----------

      if (!K.near(r.Z[0], 230 / n, 1e-9) || !K.near(r.Z[1], -a, 1e-9)) return false;
      if (!near2(sub(r.Zn, GD.O), [230 / n * GD.zS * Math.cos(-a * RAD), -230 / n * GD.zS * Math.sin(-a * RAD)], 1e-6)) return false;
      if (r.band.main !== fx(230 / n) + '∠' + num(-a) + '° Ω') return false;
    }
    return atSt('divideq', 'solved').band.main === '46∠60° Ω';
  }, { source: SRC3 });
  K.check('The turning arrow\'s shadow on the upright line is its height, and the wave beside it has that same height at the same moment, all the way round; with two currents turning together, the sum\'s height is always the two heights added', () => {
    const i = atPic('turn'), j = atPic('add');

      const q = drawn(j, Object.assign(blank(), { ph }));
      if (!K.near(q.sumY, q.stackY, 1e-6) || !K.near(q.sumY, q.sumWaveY, 1e-6)) return false;
    }
    return true;
  });
  K.check('Three equal currents 120° apart close their chain and leave nothing on the neutral at every size; with two at 10 A, shrinking the third opens a gap as big as the amount it shrank', () => {
    const i = atPic('star');
    for (let n = 0; n <= 12; n++) {
      const r = drawn(i, Object.assign(blank(), { L: [n, n, n] }));
      if (hyp(r.N) > 1e-9 || r.band.main !== '0 A' || !r.closed) return false;
    }
    for (let k = 0; k < 3; k++) for (let n = 0; n <= 10; n++) {
      const L = [10, 10, 10]; L[k] = n;
      if (!K.near(hyp(drawn(i, Object.assign(blank(), { L })).N), 10 - n, 1e-9)) return false;
    }
    return true;
  });
  K.check('Every number follows from the rule: 20 × 90 ÷ 360 = 5 ms; √(3² + 3²) = 4.24 kN and 4.24 A; √(6² + 8²) = 10 A; in 5 ms the arrows turn 90° and 270°, 180° apart; 230 ÷ 10 = 23 at 0° − (−30°) = 30°; 230 ÷ 5 = 46 at 60°; three 10 A currents leave 0 A; 10, 10 and 4 A leave 6 A; 10, 8 and 6 A leave 3.46 A; 230∠0° − 230∠−120° = 398∠30° V; and every wrong answer offered is a slip worked from the same values', () => {
    const B = (r, main, items) => !!r.band && r.band.main === main && items.every((s, k) => r.band.items[k] === s);
    if (!B(atSt('lag', 'solved'), '5 ms', ['20 × 90 ÷ 360'])) return false;
    const ra = atSt('add');
    if (ra.texts.indexOf('4.24 kN') < 0 || ra.band.main !== '√(3² + 3²) = 4.24 A') return false;
    if (!B(atSt('sum', 'solved'), '10 A', ['√(6² + 8²)'])) return false;
    if (!B(atSt('speeds'), '90°', ['45° and 135°'])) return false;
    if (!B(atSt('speedsq', 'solved'), '180°', ['90° and 270°'])) return false;
    if (!B(atSt('divide'), '23∠30° Ω', ['230 ÷ 10 = 23', '0° − (−30°) = 30°'])) return false;
    if (!B(atSt('divideq', 'solved'), '46∠60° Ω', ['230 ÷ 5 = 46', '0° − (−60°) = 60°'])) return false;
    if (!B(atSt('star', { L: [10, 10, 10] }), '0 A', ['10 − 5 − 5 = 0', '0 − 8.66 + 8.66 = 0'])) return false;
    if (!B(atSt('star'), '5 A', ['10 − 2.5 − 5 = 2.5', '0 − 4.33 + 8.66 = 4.33'])) return false;
    if (!B(atSt('starq', 'solved'), '6 A', ['10 − 5 − 2 = 3', '0 − 8.66 + 3.46 = −5.20'])) return false;
    if (!B(atSt('starq2', 'solved'), '3.46 A', ['10 − 4 − 3 = 3', '0 − 6.93 + 5.20 = −1.73'])) return false;
    if (!B(atSt('line', 'solved'), '398∠30° V', ['230 + 115 = 345', '0 + 199.19 = 199.19'])) return false;
    const o = (pic) => STEPS[atPic(pic)].opts;
    return o('lag').indexOf(num(90) + ' ms') >= 0 && o('lag').indexOf(num(20 * 270 / 360) + ' ms') >= 0 &&
      o('sum').indexOf(num(6 + 8) + ' A') >= 0 && o('sum').indexOf(num(8 - 6) + ' A') >= 0 &&
      o('speedsq').indexOf('0°') >= 0 && o('speedsq').indexOf(num(18 * 5) + '°') >= 0 &&
      o('divideq').indexOf(num(230 * 5) + '∠' + num(0 + -60) + '° Ω') >= 0 && o('divideq').indexOf(num(230 / 5) + '∠' + num(-60) + '° Ω') >= 0 &&
      o('starq').indexOf(num(10 + 10 + 4) + ' A') >= 0 && o('starq').indexOf(num(10 - 5 - 2) + ' A') >= 0 &&
      o('starq2').indexOf(num(10 - 6) + ' A') >= 0 && o('starq2').indexOf(num(10 + 8 + 6) + ' A') >= 0 &&
      o('line').indexOf(polar(hyp(add(pol(230, 0), pol(230, -120))), -60, 'V')) >= 0 && o('line').indexOf(num(230 + 230) + ' V') >= 0;
  });
  K.check('Every puzzle offers three different answers with exactly one accepted, gives each wrong one its own hint, and draws a wrong pick in red but a right one without', () =>
    DO.every((i) => {
      const d = STEPS[i], wrong = d.opts.filter((o) => o !== d.want);
      return d.opts.length === 3 && new Set(d.opts).size === 3 && wrong.length === 2 && wrong.every((o) => !!d.hints[o]) && d.hints[wrong[0]] !== d.hints[wrong[1]] &&
        wrong.every((o) => drawn(i, wrongSt(i, o)).bad > 0) && drawn(i, solved(i)).bad === 0;
    }));
  K.check('Before Check no puzzle\'s picture shows its answer, and a right answer shows it', () =>
    DO.every((i) => { const d = STEPS[i]; return drawn(i, blank()).texts.indexOf(d.reveal) < 0 && drawn(i, solved(i)).texts.indexOf(d.reveal) >= 0; }));
  K.check('Every demonstration has finished arriving within 5 s of its screen opening, none starting before the 0.35 s screen fade ends; every answer\'s motion within 2.5 s', () => {
    const timed = (i, st, limit) => {
      const keepS = S[i], keepT = T, keepSpin = spin;
      T = Infinity; latest = 0; earliest = Infinity; S[i] = st; spin = false;
      try { paint(i); } finally { S[i] = keepS; T = keepT; spin = keepSpin; }
      return latest <= limit + 1e-9;
    };
    const ok = STEPS.every((d, i) => {
      if (d.show) { const r = timed(i, blank(), d.dur); return r && d.dur <= 5 && d.dur >= 3 && earliest >= FADE; }
      return timed(i, solved(i), d.fb[0]) && d.fb[0] <= 2.5 && d.fb[1] <= 2.5 &&
        d.opts.filter((o) => o !== d.want).every((o) => timed(i, wrongSt(i, o), d.fb[1]));

    paint();
    return ok;
  });
