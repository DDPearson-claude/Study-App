<p class="caption">An ideal transformer on a 440 V, 60 Hz supply, worked from the turns ratio. Every value is an example.</p>

<script>
  // ================= the rules =================
  const strip = (s) => s.replace(/\[\^\d+\]/g, '');
  const NB = ' ';
  const VS = 440, FQ = 60;                           // the example supply: 440 V rms at 60 Hz
  const SRC_V = 'https://openstax.org/books/university-physics-volume-2/pages/15-6-transformers';
  const SRC_I = 'https://www.appstate.edu/~brian/tec-1023/labs/x-formers.pdf';

  // Volts per turn = 440 ÷ N1; V2 = N2 × that; the peak flux is 440 ÷ (4.44 × 60 × N1), and nothing on the
  // secondary side enters it. With the switch closed I2 = V2 ÷ R, and the primary cancels the secondary's
  // ampere-turns: I1 = N2 × I2 ÷ N1.
  function rule(n1, n2, sw, R) {
    const vpt = VS / n1, v2 = n2 * vpt, phim = VS / (4.44 * FQ * n1);
    const i2 = sw ? v2 / R : 0, i1 = n2 * i2 / n1;
    return { vpt, v2, phim, i2, i1, pin: VS * i1, pout: v2 * i2, at1: n1 * i1, at2: n2 * i2, seen: sw ? VS / i1 : null };
  }
  const N1S = [440, 660, 880, 1100, 1320], N2S = [115, 230, 345, 460, 575, 690, 805, 920];
  const r0 = (v) => String(Math.round(v + 1e-7));
  const fmtV = (v) => { const w = Math.round(v); return Math.abs(v - w) < 0.05 ? String(w) : v.toFixed(1); };
  const fmtVpt = (v) => String(Number(v.toFixed(3)));
  const tagText = (volts, turns) => fmtVpt(volts / turns) + NB + 'V a turn';
  // A bar scale that steps up in round numbers.
  function niceUp(v) {
    if (!(v > 0)) return 1;
    const e = Math.pow(10, Math.floor(Math.log10(v)));
    const m = [1, 1.5, 2, 3, 4, 5, 6, 8, 10].find((k) => k * e >= v - 1e-9);
    return (m || 10) * e;
  }

  // ================= the lesson: SHOW screens demonstrate, DO screens are puzzles =================
  const ramp = (t, t0, dur, a, b) => a + (b - a) * K.clamp((t - t0) / dur, 0, 1);
  const STEPS = [
    { kind: 'typed', name: 'Size of a load', ans: 'size', enter: {},
      answer: 5, decimals: 0, unit: 'Ω', want: '5' + NB + 'Ω',
      slips: [{ value: 7, hint: 'That adds the parts. The size is the square root of 3² + 4².' },
        { value: 25, hint: 'That is 3² + 4². Now take its square root.' }],
      task: 'A load has an impedance of 3 + j4 Ω. What is its size?',
      hint: 'Size = √(3² + 4²).',
      why: '√(9 + 16) = √25 = 5 Ω. You will meet this load again later, seen through a transformer.',
      right: 'Still there.',
      read: 'A load has an impedance of 3 + j4 Ω. What is its size?' },
    { show: true, name: 'Volts follow turns', ctl: ['n2'], enter: {}, end: { n2: 230 }, dur: 4.0,
      demo: (t) => { X.n2 = t < 0.8 ? 230 : t < 1.6 ? 345 : t < 2.6 ? 460 : t < 3.4 ? 345 : 230; },
      text: strip('The volts follow the turns. One iron core carries two windings, with no wire between them. The primary has 880 turns on 440 V. The secondary has 230. The same flux threads every turn of both. So every turn gets the same voltage tick. Here it is 440 ÷ 880 = 0.5 V. The secondary\'s 230 turns add up to 230 × 0.5 = 115 V. Drag the secondary\'s turns, and each one adds another 0.5 V. So V2 ÷ V1 = N2 ÷ N1.[^1]'),
      read: 'Two windings share one core and one flux. On 440 V, the primary\'s 880 turns give 0.5 V per turn. So the secondary\'s 230 turns give 115 V. The volts follow the turns.',
      still: () => setStill() },
    { kind: 'typed', name: 'A 24 V winding', ans: 'n24', enter: {},
      answer: 48, decimals: 0, unit: 'turns', want: '48' + NB + 'turns',
      slips: [{ value: 12, hint: 'That multiplies 24 by 0.5. Each turn gives 0.5 V, so divide.' },
        { value: 37, hint: 'That is 880 ÷ 24. Find the volts per turn first.' }],
      task: 'A primary of 880 turns sits on 440 V. A control circuit needs 24 V. How many turns does its secondary need?',
      hint: 'Volts per turn = 440 ÷ 880. Then divide 24 V by it.',
      why: '440 ÷ 880 = 0.5 V per turn. 24 ÷ 0.5 = 48 turns. Check: 48 turns × 0.5 V = 24 V.',
      read: 'A primary of 880 turns sits on 440 V. A control circuit needs 24 V. How many turns does its secondary need?' },
    { show: true, name: 'Close the switch', ctl: ['sw'], enter: { sw: false }, end: { sw: true }, dur: 3.4,
      demo: (t) => { X.sw = t >= 0.8; },
      text: strip('The primary cancels the secondary\'s *ampere-turns*. Close the load switch. A 5 Ω load on 115 V draws 23 A. The secondary\'s 230 turns now carry 230 × 23 = 5290 ampere-turns. They push against the change that made them. But the flux must still make 440 V in the primary. So it cannot shrink. Instead, the primary draws 5290 ÷ 880 = 6.01 A extra to cancel them. The ampere-turns balance: N1 × I1 = N2 × I2. Fewer turns carry more amps.'),
      read: 'With a 5 Ω load, the secondary\'s 230 turns carry 23 A. That is 5290 ampere-turns. The primary cancels them with 6.01 A through its 880 turns.',
      still: () => setStill() },
    { kind: 'typed', name: 'The 440 V side', ans: 'i440', enter: { sw: true },
      answer: 10.45, decimals: 2, unit: 'A', want: '10.45' + NB + 'A',
      slips: [{ value: 153.04, hint: 'That makes the 115 V side\'s current the smaller. A step-down raises the current, so the 440 V side carries less.' },
        { value: 40, hint: 'The two currents differ by the same ratio as the volts.' }],
      task: 'A 440 V to 115 V transformer supplies 40 A on its 115 V side. What current does its 440 V side take?',
      hint: 'I1 = I2 × 115 ÷ 440.',
      why: 'The volts step down by 440 ÷ 115 = 3.826. So the amps step up by the same. 40 ÷ 3.826 = 10.45 A. Check: 440 × 10.45 and 115 × 40 both come to about 4600 W.',
      read: 'A 440 V to 115 V transformer supplies 40 A on its 115 V side. What current does its 440 V side take?' },
    { show: true, name: 'Power in, power out', ctl: ['R', 'n1', 'n2'], enter: { sw: true }, end: { R: 5, n1: 880, n2: 230 }, dur: 4.4,
      demo: (t) => {
        X.R = t < 3.4 ? Math.round(ramp(t, 0.6, 1, 5, 10)) : Math.round(ramp(t, 3.4, 0.8, 10, 5));
        X.n2 = t < 2.0 ? 230 : t < 2.4 ? 345 : t < 3.0 ? 460 : t < 3.3 ? 345 : 230;
      },
      text: strip('Power in equals power out. Watch the two power bars. Power in is 440 V times 6.01 A. Power out is 115 V times 23 A. Both come to 2645 W. Drag the load or either winding\'s turns, and they stay equal. The volts step down by the *turns ratio*. The amps step up by the same ratio. So volts times amps is the same on both sides. The transformer passes power on. Ideally, it makes none and uses none.[^2]'),
      read: 'Power in is 440 V times 6.01 A. Power out is 115 V times 23 A. Both come to 2645 W, and they stay equal at every setting.',
      still: () => setStill() },
    { kind: 'typed', name: 'A 3 kW heater', ans: 'heat', enter: { sw: true },
      answer: 6.82, decimals: 2, unit: 'A', want: '6.82' + NB + 'A',
      slips: [{ value: 26.09, hint: 'That is the heater\'s own current, at 115 V. The 440 V side takes less.' },
        { value: 0.01, hint: 'That uses 3 W. A kilowatt is 1000 W.' }],
      task: 'A 440 V to 115 V transformer feeds a 3 kW heater on its 115 V side. What current does it take from the 440 V supply?',
      hint: 'Power in equals power out. So I1 = 3000 ÷ 440.',
      why: 'Power in equals power out, which is 3000 W. 3000 ÷ 440 = 6.82 A. The heater itself takes 3000 ÷ 115 = 26.09 A.',
      read: 'A 440 V to 115 V transformer feeds a 3 kW heater on its 115 V side. What current does it take from the 440 V supply?' },
    { show: true, name: 'The flux holds', ctl: ['R', 'n1'], enter: { sw: true, R: 5 }, end: { R: 2 }, dur: 3.6,
      demo: (t) => { X.R = Math.round(ramp(t, 0.8, 1.4, 5, 2)); },
      text: strip('The load does not move the flux. Watch the flux bar as you drag the load. It stays at 1.88 mWb. The flux must still make 440 V in the primary, so it swings the same. The primary cancels every ampere-turn the load adds. So a heavier load does not push the core towards saturation. In this ideal picture, only the supply\'s voltage, its frequency or the primary\'s turns move the flux. Drag the primary to 1100 turns, and the flux falls to 1.50 mWb.'),
      read: 'The flux stays at 1.88 mWb at every load. It moves only with the supply or the primary\'s turns. On 1100 turns, it falls to 1.50 mWb.',
      still: () => setStill() },
    { kind: 'typed', name: 'A heavier load', ans: 'flux', enter: { sw: true, R: 10 }, run: 1.6,
      runFn: (t) => { X.R = Math.round(ramp(t, 0.2, 1.2, 10, 5)); }, runEnd: { R: 5 },
      answer: 1.88, decimals: 2, unit: 'mWb', want: '1.88' + NB + 'mWb',
      slips: [{ value: 3.76, hint: 'That doubles the flux with the load. The primary cancels the extra ampere-turns.' },
        { value: 0.94, hint: 'That halves it. The load does not move the flux either way.' }],
      task: 'With a 10 Ω load, the secondary carries 11.5 A. The flux peaks at 1.88 mWb. You change to a 5 Ω load, and the secondary current doubles to 23 A. What is the peak flux now?',
      hint: 'What sets the flux, the load or the supply?',
      why: 'The supply still holds 440 V at 60 Hz on 880 turns. So the flux stays at 1.88 mWb. The primary\'s current rises from 3.01 A to 6.01 A. That cancels the extra ampere-turns.',
      read: 'With a 10 Ω load, the secondary carries 11.5 A. The flux peaks at 1.88 mWb. A 5 Ω load doubles the secondary current to 23 A. What is the peak flux now?' },
    { show: true, name: 'Seen from the supply', ctl: ['R'], enter: { sw: true, R: 10 }, end: { R: 5 }, dur: 3.6,
      demo: (t) => { X.R = Math.round(ramp(t, 0.8, 1.4, 10, 5)); },
      text: strip('Seen from the supply, the load looks bigger by the turns ratio squared. The supply sees only its own 440 V and the 6.01 A it gives. So the load looks like 440 ÷ 6.01 = 73.2 Ω. The box shows it. On this side, the volts are 3.83 times higher. The amps are 3.83 times lower. So the load looks bigger by the ratio twice over: 5 × (880 ÷ 230)² = 5 × 14.64 = 73.2 Ω. Drag the load, and the box stays at 14.64 times it.'),
      read: 'The 440 V side sees 440 V driving 6.01 A. That looks like 73.2 Ω. It is the 5 Ω load times (880 ÷ 230)², which is 14.64.',
      still: () => setStill() },
    { kind: 'typed', name: 'A 2 Ω load', ans: 'seen', enter: { sw: true, R: 5 }, run: 1.6,
      runFn: (t) => { X.R = Math.round(ramp(t, 0.2, 1.2, 5, 2)); }, runEnd: { R: 2 },
      answer: 29.3, decimals: 1, unit: 'Ω', want: '29.3' + NB + 'Ω',
      slips: [{ value: 7.7, hint: 'That multiplies by the ratio once. Volts and amps each change, so square it.' },
        { value: 0.1, hint: 'That divides. Seen from the higher voltage, the load looks bigger.' }],
      task: 'On the same 880 to 230 turn transformer, the load is 2 Ω. What resistance does the 440 V side see?',
      hint: 'Seen resistance = load × (N1 ÷ N2)².',
      why: '(880 ÷ 230)² = 14.64. So the 440 V side sees 2 × 14.64 = 29.3 Ω. Check: 115 V on 2 Ω draws 57.5 A. The primary takes 57.5 × 230 ÷ 880 = 15.03 A. And 440 ÷ 15.03 = 29.3 Ω.',
      read: 'On the same 880 to 230 turn transformer, the load is 2 Ω. What resistance does the 440 V side see?' },
    { kind: 'pick', name: 'Through the windings', enter: { sw: true },
      opts: ['3 + j4 Ω', '11.5 + j15.3 Ω', '43.9 + j58.6 Ω', '73.2 + j0 Ω'], want: '43.9 + j58.6 Ω',
      task: 'The load on the 115 V side is 3 + j4 Ω. You found its size at the start. The transformer has 880 and 230 turns. What impedance does the 440 V side see?',
      hint: 'From the other side, the load looks bigger by the ratio squared.',
      hints: { '3 + j4 Ω': 'From the other side, the load looks bigger by the ratio squared.',
        '11.5 + j15.3 Ω': 'That scales it by the ratio once. It takes the ratio squared.',
        '73.2 + j0 Ω': '73.2 Ω is its size. Scaling by a plain number keeps its angle.' },
      why: 'The ratio squared, 14.64, is a plain number. It scales both parts: 3 × 14.64 = 43.9 and 4 × 14.64 = 58.6. The size grows from 5 Ω to 73.2 Ω. The angle stays the same. So the power factor is the same from both sides.',
      read: 'A 3 + j4 Ω load sits on the 115 V side of the 880 to 230 turn transformer. What impedance does the 440 V side see?' },
    { kind: 'typed', name: 'A step-up', ans: 'up', enter: { sw: true },
      answer: 9.2, decimals: 1, unit: 'A', want: '9.2' + NB + 'A',
      slips: [{ value: 0.6, hint: 'That has the current rising with the volts. The higher-voltage side carries less, so turn it round.' },
        { value: 2.3, hint: 'The two currents differ by the turns ratio.' }],
      task: 'A small step-up transformer has 200 turns on 115 V. Its secondary has 800 turns and feeds 2.3 A. What current does the primary take?',
      hint: 'N1 × I1 = N2 × I2.',
      why: '800 × 2.3 = 1840 ampere-turns. The primary must cancel them, so it takes 1840 ÷ 200 = 9.2 A. Check the power. The secondary gives 115 × 800 ÷ 200 = 460 V. 460 × 2.3 and 115 × 9.2 both come to 1058 W.',
      read: 'A step-up transformer has 200 turns on 115 V. Its secondary has 800 turns and feeds 2.3 A. What current does the primary take?' },
  ];
  const FINISH = 'Every turn on one core gets the same volts, so the volts follow the turns. The primary cancels the secondary\'s ampere-turns, so the amps go the other way. Power in equals power out. The flux stays where the supply holds it. Seen through the windings, a load scales by the turns ratio squared. Next: the real transformer, and where its watts go.';

  // ================= state =================
  const BASE = { n1: 880, n2: 230, sw: false, R: 5 };
  const X = Object.assign({}, BASE);              // what the picture shows now
  const D = {};                                   // the drawn sizes, easing towards the rule's
  const blank = () => ({ pick: null, res: null, why: false, tries: 0, hint: '' });
  let S = STEPS.map(blank);
  const solved = (st) => !!st && (st.res === 'right' || st.res === 'shown');
  let T = Infinity, motionEnd = 0, scripted = false, lastStep = -1, finished = false, lastDone = false, held = false;
  let REC = { t: {}, bars: {} };
  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const testing = () => document.documentElement.classList.contains('k-testing');
  const quiet = () => REDUCE || testing();
  const el = (id) => document.getElementById(id);
  const idx = (name) => STEPS.findIndex((d) => d.name === name);
  const I_AT = idx('Close the switch'), I_BOX = idx('Seen from the supply');
  // The flux readout and the box keep their answers back until the puzzle that asks for them is checked.
  const hideFlux = (i) => !finished && STEPS[i].ans === 'flux' && !solved(S[i]);
  const hideSeen = (i) => !finished && STEPS[i].ans === 'seen' && !solved(S[i]);

  // ================= the drawn sizes ease towards the rule's =================
  const WC = 134, LMAX = 112, KT = LMAX / 1320;   // the windings' centre, and their drawn length per turn
  const KV = 156 / 920;                            // the voltage columns: px per volt
  function targets() {
    const r = rule(X.n1, X.n2, X.sw, X.R);
    const i2m = r.v2 / 2, i1m = X.n2 * i2m / X.n1;   // the currents on the heaviest load, 2 Ω, set the current scale
    return { l1: KT * X.n1, l2: KT * X.n2, v2: r.v2, i1: r.i1, i2: r.i2, p: r.pin, phim: r.phim,
      cs: niceUp(Math.max(i1m, i2m)), ps: niceUp(r.v2 * r.v2 / 2) };
  }
  function snapD() { Object.assign(D, targets()); }
  function tween(dt) {
    const t = targets(), a = 1 - Math.exp(-dt / 0.2);
    Object.keys(t).forEach((k) => { const e = t[k] - D[k]; D[k] = Math.abs(e) <= 1e-6 * Math.max(1, Math.abs(t[k])) ? t[k] : D[k] + e * a; });
  }
  function settled() { const t = targets(); return Object.keys(t).every((k) => D[k] === t[k]); }
  snapD();

  // ================= text with amber key terms (built with K.el, never innerHTML) =================
  const UNIT_GAP = /(\d) (?=(?:Hz|mWb|Wb|V|A|Ω|W|At|kW|turns)(?![A-Za-z]))/g;
  function write(node, s) {
    node.textContent = '';
    String(s || '').replace(UNIT_GAP, '$1' + NB).split(/\*([^*]+)\*/).forEach((seg, k) => {
      if (!seg) return;
      node.appendChild(k % 2 ? K.el('span', { class: 'term' }, seg) : document.createTextNode(seg));
    });
  }

  // ================= controls =================
  const stepper = K.stepper({ id: 'step', label: 'Screen', steps: STEPS.map((d) => d.name), value: 0, compact: true, into: '#prog' });
  const at = () => K.clamp(Math.round(stepper.get()) || 0, 0, STEPS.length - 1);
  const CTL = {
    n1: K.control({ id: 'n1', label: 'Primary turns, N1', min: 440, max: 1320, step: 220, value: 880, snap: [880, 1100], fmt: (v) => v + NB + 'turns', into: '#c-n1' }),
    n2: K.control({ id: 'n2', label: 'Secondary turns, N2', min: 115, max: 920, step: 115, value: 230, snap: [230, 460], fmt: (v) => v + NB + 'turns', into: '#c-n2' }),
    sw: K.toggle({ id: 'sw', label: 'Load switch closed', value: false, into: '#c-sw' }),
    R: K.control({ id: 'R', label: 'Load', min: 2, max: 20, step: 1, value: 5, snap: [2, 5, 10], fmt: (v) => v + NB + 'Ω', into: '#c-R' }),
  };
  const CTL_IDS = Object.keys(CTL);
  const pushed = {};
  CTL_IDS.forEach((id) => { pushed[id] = CTL[id].get(); });

    every((n1, n2, R) => { const r = rule(n1, n2, true, R); return near(r.i1 / r.i2, r.v2 / VS, 1e-12) && near(r.pin, r.pout, 1e-9 * r.pin) && r0(r.pin) === r0(r.pout); }),
  { source: SRC_I });
  K.check('On 5 Ω the secondary draws 23 A, so 5290 ampere-turns; the primary cancels them with 6.01 A, and 2645 W goes in and out', () => {
    const c = drawn(iClose).t, o = drawn(iClose, null, { sw: false }).t;
    return c.i2 === A_('23.00') && c.i1 === A_('6.01') && c.at1 === AT_('5290') && c.at2 === AT_('5290') && c.pin === W_('2645') && c.pout === W_('2645') &&
      o.i1 === A_('0.00') && o.pin === W_('0') && o.seen === 'Open';
  });
  K.check('The flux holds at 1.88 mWb with the switch open and on 10, 5 or 2 Ω, and falls to 1.50 mWb on 1100 primary turns', () => {
    const f = (x) => drawn(iHolds, null, x).t.flux;
    return f({ sw: false }) === MWB('1.88') && f({ R: 10 }) === MWB('1.88') && f({ R: 5 }) === MWB('1.88') && f({ R: 2 }) === MWB('1.88') && f({ n1: 1100 }) === MWB('1.50');
  });
  K.check('A step-down raises the current: on 880 and 230 turns the secondary current bar is 3.83 times the primary\'s; on 440 and 920 turns it is the shorter', () => {
    const a = drawn(iClose).bars, b = drawn(iPower, null, { n1: 440, n2: 920 }).bars;
    return near(a.i2 / a.i1, 880 / 230, 1e-6) && near(880 / 230, 3.83, 0.005) && b.i2 < b.i1;
  });
  K.check('The 440 V side sees 73.2 Ω on 5 Ω, which is 5 × 14.64, 146.4 Ω on 10 Ω and 29.3 Ω on 2 Ω', () => {
    const s = (x) => drawn(iSeen, null, x).t.seen;
    return s({ R: 5 }) === OHM('73.2') && s({ R: 10 }) === OHM('146.4') && s({ R: 2 }) === OHM('29.3') && near(Math.pow(880 / 230, 2), 14.64, 0.005) &&
      every((n1, n2, R) => near(rule(n1, n2, true, R).seen, R * Math.pow(n1 / n2, 2), 1e-9 * R * Math.pow(n1 / n2, 2)));
  });
  K.check('Each typed answer and slip is worked from its rule: 5 Ω (7, 25), 48 turns (12, 37), 10.45 A (153.04, 40), 6.82 A (26.09, 0.01), 1.88 mWb (3.76, 0.94), 29.3 Ω (7.7, 0.1) and 9.2 A (0.6, 2.3)', () => {
    const sl = (i, v) => STEPS[i].slips.length === v.length && STEPS[i].slips.every((s, k) => near(s.value, v[k], 1e-12));
    const r2 = (v) => Math.round(v * 100) / 100, r1_ = (v) => Math.round(v * 10) / 10, sq = Math.pow(880 / 230, 2);
    const work = near(Math.hypot(3, 4), 5, 1e-12) && 3 + 4 === 7 && 9 + 16 === 25 &&
      near(24 / (440 / 880), 48, 1e-9) && near(24 * 0.5, 12, 1e-9) && Math.round(880 / 24) === 37 &&
      r2(40 * 115 / 440) === 10.45 && r2(40 * 440 / 115) === 153.04 &&
      r2(3000 / 440) === 6.82 && r2(3000 / 115) === 26.09 && r2(3 / 440) === 0.01 &&
      r2(rule(880, 230, true, 5).phim * 1e3) === 1.88 && r2(2 * 1.88) === 3.76 && r2(1.88 / 2) === 0.94 &&
      r1_(2 * sq) === 29.3 && r1_(2 * 880 / 230) === 7.7 && r1_(2 / sq) === 0.1 &&
      near(800 * 2.3 / 200, 9.2, 1e-9) && r1_(2.3 * 200 / 800) === 0.6 && near(115 * 9.2, 460 * 2.3, 1e-9) &&
      r1_(3 * sq) === 43.9 && r1_(4 * sq) === 58.6 && r1_(3 * 880 / 230) === 11.5 && r1_(4 * 880 / 230) === 15.3;
    return work && STEPS[iSize].answer === 5 && STEPS[iN24].answer === 48 && STEPS[iI440].answer === 10.45 && STEPS[iHeat].answer === 6.82 &&
      STEPS[iHeavy].answer === 1.88 && STEPS[iTwo].answer === 29.3 && STEPS[iUp].answer === 9.2 && STEPS[iPick].want === STEPS[iPick].opts[2] &&
      sl(iSize, [7, 25]) && sl(iN24, [12, 37]) && sl(iI440, [153.04, 40]) && sl(iHeat, [26.09, 0.01]) && sl(iHeavy, [3.76, 0.94]) && sl(iTwo, [7.7, 0.1]) && sl(iUp, [0.6, 2.3]);
  });
  K.check('Before a Check the flux and the box show ?; a right Check moves the load from 10 Ω to 5 Ω with the flux at 1.88 mWb, and from 5 Ω to 2 Ω with the box at 29.3 Ω', () => {
    const b = (i) => drawn(i, blank()), s = (i) => drawn(i, solvedSt(i));
    const hb = b(iHeavy), hs = s(iHeavy), tb = b(iTwo), ts = s(iTwo);
    return hb.t.flux === '?' && hb.R === 10 && hs.t.flux === MWB('1.88') && hs.R === 5 && tb.t.seen === '?' && tb.R === 5 && ts.t.seen === OHM('29.3') && ts.R === 2;
  });
  K.check('Every demonstration ends 3 to 4.5 s after its screen opens, and every answer\'s motion within 2.5 s', () =>
    STEPS.every((d) => d.show ? (d.dur >= 3 && d.dur <= 4.5) : (!d.run || d.run <= 2.5)));
  K.ready();
</script>
