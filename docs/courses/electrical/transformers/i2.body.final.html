<p class="caption">The curve and the loop are sketches of one iron, not measured data.</p>

<script>
  // ================= the rules =================
  const strip = (s) => s.replace(/\[\^\d+\]/g, '');
  const NB = ' ', MINUS = '−';
  const MU0 = 4 * Math.PI * 1e-7;                 // the magnetic constant, T m/A
  const N = 200, L = 0.4, AREA = 0.001;           // the example ring: turns, mean path (m), cross-section (m²)
  const BSAT = 1.6, KNEE = 255, SHIFT = 60;       // the sketch iron: its ceiling (T), its knee (A/m), its loop's sideways shift (A/m)
  const AMP = 2, HMAX = 1000, BMAX = 1.8;         // AC swings 2 A each way; the axes run to 1000 A/m and 1.8 T
  const OMEGA = 2 * Math.PI / 4.8;                // one slow AC cycle every 4.8 s
  const SRC1 = 'https://www.rose-hulman.edu/class/ee/HTML/NSF/CCLI_EMD_DUE_0088904/PDFS/lecture_notes_08.pdf';
  const SRC2 = 'https://castellidezza.faculty.polimi.it/wp-content/uploads/fundamentalsMagneticCircuits3.pdf';
  const SRC3 = 'https://www.maec.msu.edu/application/files/3716/4555/7425/Tech_Note_317_Magnetic_Flux_Density.pdf';

  // The sketch iron: B = 1.6 tanh((H − c) ÷ 255) + μ₀ H. c = 0 is the curve; +60 the loop rising, −60 falling.
  const ironB = (H, c) => BSAT * Math.tanh((H - (c || 0)) / KNEE) + MU0 * H;
  // With a gap the push is shared: F = l × H in the iron + B × gap ÷ μ₀. Find the iron's H that balances it.
  function ironAt(F, gapM, c) {
    c = c || 0;
    if (!(gapM > 0)) { const Hi = F / L; return { Hi, B: ironB(Hi, c) }; }
    let lo = -6000, hi = 6000;
    for (let k = 0; k < 64; k++) { const m = (lo + hi) / 2; if (L * m + ironB(m, c) * gapM / MU0 > F) hi = m; else lo = m; }
    const Hi = (lo + hi) / 2;
    return { Hi, B: ironB(Hi, c) };
  }
  // The iron's H for a flux density B on the curve (no gap).
  function hFor(B) { let lo = 0, hi = 6000; for (let k = 0; k < 64; k++) { const m = (lo + hi) / 2; if (ironB(m) > B) hi = m; else lo = m; } return (lo + hi) / 2; }
  const residual = (gapMm) => ironAt(0, gapMm * 1e-3, -SHIFT).B;
  const lossPct = (n) => 100 / (n * n);                  // the thin-sheet rule: loss in step with thickness squared

  // What the ring shows: x the settings, mix 0 air to 1 iron, gapMm the gap.
  function calc(x, mix, gapMm) {
    const g = gapMm * 1e-3;
    let I, c = 0, rising = true;
    if (x.ac) { I = AMP * Math.sin(x.phase); rising = Math.cos(x.phase) > 1e-9; c = rising ? SHIFT : -SHIFT; }
    else I = x.cur;
    const F = N * I, r = ironAt(F, g, c), air = MU0 * F / L;
    return { I, F, Hx: F / L, B: K.lerp(air, r.B, mix), air, share: Math.tanh((r.Hi - c) / KNEE) * mix, rising };
  }

  // Numbers as the lesson writes them.
  function trim(v, dp) {
    const p = Math.pow(10, dp);
    let s = (Math.round(v * p) / p).toFixed(dp);
    if (dp > 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
    return s === '-0' ? '0' : s;
  }
  const fmtF = (v) => { const r = Math.round(v); return (r < 0 ? MINUS : '') + Math.abs(r) + NB + 'At'; };
  function fmtB(v, air) {
    const a = Math.abs(v);
    if (air) { const mT = a * 1e3; if (mT < 5e-5) return '0' + NB + 'mT'; return (v < 0 ? MINUS : '') + mT.toFixed(mT >= 0.05 ? 3 : 4) + NB + 'mT'; }
    return (v < 0 && Math.round(a * 100) > 0 ? MINUS : '') + a.toFixed(2) + NB + 'T';
  }
  // The flux, Φ = B × A: in mWb in iron, in µWb in air (the same digits as B in T and in mT, as A is 0.001 m²).
  function fmtP(v, air) {
    const a = Math.abs(v);
    if (air) { const u = a * 1e6; if (u < 5e-5) return '0' + NB + 'µWb'; return (v < 0 ? MINUS : '') + u.toFixed(u >= 0.05 ? 3 : 4) + NB + 'µWb'; }
    return (v < 0 && Math.round(a * 1e5) > 0 ? MINUS : '') + (a * 1e3).toFixed(2) + NB + 'mWb';
  }
  const fmtLoss = (p) => (p >= 10 ? p.toFixed(0) : p.toFixed(1)) + '%';
  const ease01 = (p) => K.ease(K.clamp(p, 0, 1));
  const r1 = (v) => Math.round(v * 10) / 10;

  // ================= the lesson: SHOW screens demonstrate, DO screens are puzzles =================
  const STEPS = [
    { kind: 'typed', name: 'Still there?', ans: 'xl', enter: { core: 'iron', cur: 0.1 }, run: 0,
      answer: 0, decimals: 2, unit: 'Ω', want: '0' + NB + 'Ω', right: 'Still there.',
      slips: [{ value: 1.26, hint: 'That is 2π × 0.2, its reactance at 1 Hz. On DC the frequency is 0.' },
        { value: 0.2, hint: 'That is the inductance, in henries. Reactance is 2π f L.' }],
      task: 'A coil has an inductance of 0.2 H. What is its reactance on DC, at 0 Hz?',
      hint: 'Use X_L = 2π f L with f = 0.',
      why: 'X_L = 2π × 0 × 0.2 = 0 Ω. A coil pushes back only while its current changes. On DC the winding\'s resistance alone sets a steady current. That current sets up a steady flux. How much flux it buys comes next.',
      read: 'A coil has an inductance of 0.2 H. What is its reactance on DC, at 0 Hz?' },
    { show: true, name: 'Iron or air', ctl: ['core', 'cur'], enter: { core: 'air', cur: 0.1 }, end: { core: 'iron' }, dur: 3.4,
      demo: (t) => { X.core = t < 1.4 ? 'air' : 'iron'; },
      text: strip('Wind 200 turns on a ring and pass 0.1 A. Each turn adds its own field. So the push round the ring is turns × current. That push is the *magnetomotive force*, F = N I, in ampere-turns, At.[^1] Here it is 20 At. It drives flux round the ring, as volts drive current. The ring\'s *reluctance*, S, opposes it, as resistance does. So the flux Φ = F ÷ S.[^4] In air, 20 At buy just 0.063 mT. Now switch the ring to iron. The same push buys 0.31 T, nearly 5000 times as much.[^2]'),
      read: '200 turns carrying 0.1 A push 20 At round the ring. The flux is that push divided by the ring\'s reluctance. In air that buys 0.063 mT. In iron it buys 0.31 T, nearly 5000 times as much.',
      still: () => setStill({ core: 'iron', cur: 0.1 }) },
    { kind: 'pick', name: 'Double the current', enter: { core: 'iron', cur: 1 }, run: 2.0,
      runFn: (t) => { X.cur = 1 + ease01((t - 0.2) / 1.5); X.trail = 1; }, runEnd: { cur: 2, trail: 1 },
      task: 'The dot sits at 1 A, reading 1.54 T. You double the current to 2 A. What does the flux density do?',
      opts: ['It roughly doubles', 'It rises only a little', 'It stops rising at all'], want: 'It rises only a little',
      hint: 'Look at where 1 A sits on the curve.',
      hints: { 'It roughly doubles': 'Doubling holds only on the steep part. At 1 A the curve has already bent over.',
        'It stops rising at all': 'It still rises a little. The curve never goes perfectly flat.' },
      why: 'At 1 A the curve has already bent over and runs nearly flat. Doubling the current buys only 0.06 T more, from 1.54 T to 1.60 T. Twice the current gives just 4% more flux density.',
      read: 'The dot sits at 1 A, reading 1.54 T. You double the current to 2 A. What does the flux density do?' },
    { show: true, name: 'The knee', ctl: ['cur'], enter: { core: 'iron', cur: 0.1, trail: 0.1 }, end: { cur: 2 }, dur: 4.0,
      demo: (t) => { X.cur = 0.1 + 1.9 * ease01((t - 0.4) / 3.2); },
      text: strip('Turn the current up. The dot climbs the iron\'s curve of B against H. H is the push per metre of ring, N I ÷ l. The curve rises steeply, bends at a knee near 0.5 A, then runs nearly flat. The arrows are iron\'s tiny regions, each a small magnet.[^5] The push swings them into line, and their fields add to the coil\'s. Near the knee most are in line, so little is left to swing.[^6] This is *saturation*: more push buys only a little more flux density.[^3]'),
      read: 'The dot climbs the iron\'s curve steeply, bends round a knee near 0.5 A and runs nearly flat. At 0.5 A it reads 1.21 T. At 2 A it reads only 1.60 T, with nearly every arrow in the iron in line.',
      still: () => setStill({ core: 'iron', cur: 2, trail: 0.1 }) },
    { kind: 'typed', name: 'Five thousand times', ans: 'x5k', enter: { core: 'air', cur: 0.05 }, run: 1.4,
      runFn: (t) => { X.core = t >= 0.2 ? 'iron' : 'air'; }, runEnd: { core: 'iron', cur: 0.05 },
      answer: 157, decimals: 0, tolerance: 0.02, accept: [157.08, 157.1], unit: 'mT', want: '157' + NB + 'mT',
      slips: [{ value: 0.0314, hint: 'That is air\'s figure. Iron multiplies it.' },
        { value: 0.157, hint: 'That is in teslas. The box is in millitesla.' },
        { value: 0.00000628, hint: 'That divides by 5000. Iron gives more flux density, not less.' }],
      task: 'In air, 10 ampere-turns on this ring give 0.0314 mT. Take iron as 5000 times air on the steep part of its curve. What flux density does the iron ring reach?',
      hint: 'Multiply air\'s 0.0314 mT by 5000.',
      why: '0.0314 mT × 5000 = 157 mT, which is 0.157 T. Iron\'s reluctance is that much lower. So the same push buys that much more. The drawn curve reads 0.16 T here, as it has barely begun to bend.',
      read: 'In air, 10 ampere-turns on this ring give 0.0314 mT. Take iron as 5000 times air on the steep part of its curve. What flux density does the iron ring reach?' },
    { show: true, name: 'A gap', ctl: ['gap', 'cur'], enter: { core: 'iron', cur: 1, gap: 0 }, end: { gap: 0.25 }, dur: 3.4,
      demo: (t) => { X.gap = t < 1.0 ? 0 : 0.25; },
      text: strip('Cut a 0.25 mm gap in the ring. Air has no small magnets to swing. In the gap, H = B ÷ μ₀. The gap\'s share of the push is that H times its length, B × gap ÷ μ₀. Here that is 199 At for each tesla. The iron below its knee needs about a third as much. So the gap takes most of the push. Air never saturates, so the curve leans over and runs straighter. The flux then keeps in step with the current, so a coil\'s inductance holds steady.'),
      read: 'With a 0.25 mm gap, the curve leans over. At 0.5 A the ring reaches 0.38 T, not 1.21 T. At 1 A it reaches 0.75 T, about twice as much.',
      still: () => setStill({ core: 'iron', gap: 0.25, cur: 1 }) },
    { kind: 'typed', name: 'Half a millimetre', ans: 'gap', pic: 'gapq', enter: { core: 'iron', gap: 0.5 }, run: 1.0,
      answer: 477, decimals: 0, accept: [476, 478], unit: 'At', want: '477' + NB + 'At',
      slips: [{ value: 477465, hint: '0.5 mm is 0.0005 m.' },
        { value: 398, hint: 'That is the push for 1 T. This gap carries 1.2 T.' },
        { value: 199, hint: 'That is a 0.25 mm gap at 1 T. This one is twice as long and carries more.' }],
      task: 'A 0.5 mm gap carries 1.2 T. How many ampere-turns does the gap alone take? Use μ₀ = 4π × 10⁻⁷ T m/A.',
      hint: 'B × gap ÷ μ₀, with the gap in metres.',
      why: '1.2 × 0.0005 ÷ (4π × 10⁻⁷) = 477 At. The iron at 1.2 T needs about 100 At. So half a millimetre of air takes nearly five times the push of the whole iron ring.',
      read: 'A 0.5 mm gap carries 1.2 T. How many ampere-turns does the gap alone take?' },
    { show: true, name: 'Round a loop', ctl: ['ac', 'cur'], swing: true, enter: { core: 'iron', cur: 2, ac: false }, end: { ac: true }, dur: 4.5,
      demo: (t) => { if (t >= 0.6 && !X.ac) { X.ac = true; X.phase = Math.PI / 2; } },
      text: strip('Switch to AC. The current swings to 2 A one way, back through zero, then to 2 A the other way. The dot does not come back down the line it climbed. Some regions stay in line, so the iron holds on to its magnetism.[^5] At zero current, a *residual flux* is left in the core. The mark shows it. This lag is called *hysteresis*. Swinging the regions back costs energy every cycle, and that warms the iron. The loop\'s shaded area sets how much.[^7]'),
      read: 'On AC the dot runs round a loop, not up and down one line. At zero current the core keeps a residual flux density of 0.37 T. The loop\'s shaded area sets the heat left in the iron each cycle.',
      still: () => setStill({ core: 'iron', ac: true, phase: Math.PI }) },
    { kind: 'pick', name: 'Wide or thin', pic: 'loops', run: 1.0,
      task: 'Two equal cores of different irons reach the same peak flux density on AC. Iron A\'s loop is wide. Iron B\'s loop is thin. Which heats up less each cycle?',
      opts: ['Iron A, the wide loop', 'Iron B, the thin loop', 'Neither: they reach the same peak'], want: 'Iron B, the thin loop',
      hint: 'The heat goes with the loop\'s area.',
      hints: { 'Iron A, the wide loop': 'A wide loop encloses more area, and the area sets the heat.',
        'Neither: they reach the same peak': 'The peak sets the loop\'s height. The heat goes with its area.' },
      why: 'Each cycle costs heat, set by the loop\'s area. Both loops are the same height. Iron B\'s loop is thinner, so it encloses less area. So a core wants an iron with a thin loop.',
      read: 'Two equal cores of different irons reach the same peak flux density on AC. Iron A\'s loop is wide. Iron B\'s loop is thin. Which heats up less each cycle?' },
    { show: true, name: 'Eddy currents', pic: 'eddy', ctl: ['sheets'], enter: { sheets: 1 }, end: { sheets: 8 }, dur: 4.2,
      demo: (t) => { X.sheets = t < 0.9 ? 1 : t < 1.9 ? 2 : t < 2.9 ? 4 : 8; },
      text: strip('Here the core is seen cut across. A changing flux makes a voltage round any loop it threads. The iron itself forms such loops, and iron conducts. So currents swirl round inside it. These *eddy currents* heat the core. Now cut it into thin sheets, insulated from each other. Halve the thickness, and the current in each square millimetre halves. The heat goes as that current squared. So the eddy loss falls to a quarter.[^8] Step through the cuts and watch the loss bar fall.'),
      read: 'Seen cut across, a solid core carries large swirling eddy currents. In 8 thin insulated sheets, each loop is small. The eddy loss falls to 1.6% of the solid block\'s.',
      still: () => setStill({ sheets: 8 }) },
    { kind: 'typed', name: 'Thinner sheets', ans: 'eddy', pic: 'eddy', enter: { sheets: 1 }, run: 1.4,
      runFn: (t) => { X.sheets = t >= 0.2 ? 2 : 1; }, runEnd: { sheets: 2 },
      answer: 10, decimals: 0, unit: 'W', want: '10' + NB + 'W',
      slips: [{ value: 20, hint: 'That halves the loss. It goes as the thickness squared.' },
        { value: 80, hint: 'Thinner sheets cut the loss. They do not raise it.' },
        { value: 160, hint: 'That squares the wrong way. Thinner sheets cut the loss.' }],
      task: 'A core\'s eddy loss is 40 W. It is rebuilt from sheets half as thick, at the same flux and frequency. What is its eddy loss now?',
      hint: 'Halve the thickness, and the heat falls to a quarter.',
      why: 'Eddy loss goes as the sheet\'s thickness squared. Half the thickness gives ½ × ½ = ¼ of the loss. So 40 W × ¼ = 10 W. The hysteresis loss does not change, because the loop is the same.',
      read: 'A core\'s eddy loss is 40 W. It is rebuilt from sheets half as thick. What is its eddy loss now?' },
    { kind: 'typed', name: 'Find the knee', ans: 'knee', enter: { core: 'iron', cur: 0.1 }, run: 2.0,
      runFn: (t) => { X.cur = 0.1 + 0.41 * ease01((t - 0.2) / 1.5); X.trail = 0.1; }, runEnd: { cur: 0.51, trail: 0.1 },
      answer: 0.51, decimals: 2, unit: 'A', want: '0.51' + NB + 'A',
      slips: [{ value: 127500, hint: 'That multiplies by the turns. H = N I ÷ l, so I = H × l ÷ N.' },
        { value: 3.19, hint: 'That divides by the length. Multiply H by the length first.' },
        { value: 1.96, hint: 'That is upside down. I = H × l ÷ N.' },
        { value: 0.5, hint: 'Close. Give it to two decimal places.' }],

  // ================= the curve =================

    const r = (I) => drawn(iGap, null, { cur: I, gap: 0.25 }).readouts.B, q = ironAt(200, 0.00025);

      near(L * q.Hi + q.B * 0.00025 / MU0, 200, 1e-6) && drawn(iGap, null, { cur: 1, gap: 0 }).readouts.B === T_('1.54');
  });
  K.check('On AC the dot runs round a loop: at zero current on the way down the core keeps 0.37 T, and on the way up −0.37 T; a wide loop encloses more area than a thin one of the same height', () => {
    const down = drawn(iLoop, null, { phase: Math.PI }), up = drawn(iLoop, null, { phase: 0 }), lp = drawn(iWide, solvedSt(iWide)).loops;
    return down.readouts.B === T_('0.37') && down.readouts.F === '0' + NB + 'At' && up.readouts.B === MINUS + T_('0.37') && down.ring.residual === 'residual 0.37' + NB + 'T' &&
      lp.area[0] > lp.area[1] && lp.area[1] > 0 && near(ironB(HMAX, 150), ironB(HMAX, 25), 0.01) && near(residual(0), 0.3697, 1e-3);

  K.check('Eddy loss goes with sheet thickness squared: Solid, 2, 4 and 8 sheets read 100%, 25%, 6.3% and 1.6%, with one loop in each piece, smaller in thinner sheets', () => {

  K.check('Each typed answer and slip is worked from its rule: 0 Ω (slips 1.26, 0.2), 157 mT (0.0314, 0.157, 0.00000628), 477 At (477 465, 398, 199), 10 W (20, 80, 160) and 0.51 A (127 500, 3.19, 1.96, 0.5)', () => {
    const sl = (i, v) => STEPS[i].slips.length === v.length && STEPS[i].slips.every((s, k) => near(s.value, v[k], 1e-12));
    const work = near(2 * Math.PI * 0 * 0.2, 0, 1e-12) && near(2 * Math.PI * 0.2, 1.26, 0.005) &&
      near(MU0 * 25 * 1e3, 0.0314, 0.00005) && near(0.0314 * 5000, 157, 1e-9) && near(0.0314 / 5000, 0.00000628, 1e-12) && near(ironB(25), 0.16, 0.005) &&
      near(1.2 * 0.0005 / MU0, 477, 0.5) && near(1.2 * 0.5 / MU0, 477465, 1) && near(0.0005 / MU0, 398, 0.5) && near(0.00025 / MU0, 199, 0.5) && near(L * hFor(1.2), 100, 1) &&
      near(40 / 4, 10, 0) && near(KNEE * L / N, 0.51, 1e-12) && near(KNEE * N / L, 127500, 1e-9) && near(KNEE / L / N, 3.19, 0.005) && near(N / (KNEE * L), 1.96, 0.005) && near(KNEE * L / N, 0.5, 0.0101);
    return work && STEPS[iRecall].answer === 0 && STEPS[iX5k].answer === 157 && STEPS[iGapQ].answer === 477 && STEPS[iThin].answer === 10 && STEPS[iFind].answer === 0.51 &&
      sl(iRecall, [1.26, 0.2]) && sl(iX5k, [0.0314, 0.157, 0.00000628]) && sl(iGapQ, [477465, 398, 199]) && sl(iThin, [20, 80, 160]) && sl(iFind, [127500, 3.19, 1.96, 0.5]);
  });
  K.check('Before a Check no puzzle shows its answer, and a right Check shows it: air\'s 0.0314 mT turns to iron\'s 0.16 T, 1.54 T crawls to 1.60 T, the gap\'s push reads 477 At, the loops are shaded, the loss falls to 25%, the dot reaches the knee at 102 At, and the core keeps 0.37 T at zero current', () => {
    const b = (i) => drawn(i, blank()), s = (i) => drawn(i, solvedSt(i));

      b(iDouble).readouts.B === T_('1.54') && s(iDouble).readouts.B === T_('1.60') &&
      b(iGapQ).ring.pills[2] === 'takes ?' + NB + 'At' && s(iGapQ).ring.pills[2] === 'takes 477' + NB + 'At' &&

      b(iFind).readouts.F === '20' + NB + 'At' && s(iFind).readouts.F === '102' + NB + 'At' && s(iFind).readouts.B === T_('1.22') &&
      b(iZero).ring.residual === null && b(iZero).readouts.B === T_('1.60') && s(iZero).ring.residual === 'residual 0.37' + NB + 'T' && s(iZero).readouts.B === T_('0.37');
  });
  K.check('Every demonstration ends 3 to 4.5 s after its screen opens, and every answer\'s motion within 2.5 s', () =>
    STEPS.every((d) => d.show ? (!d.demo || (d.dur >= 3 && d.dur <= 4.5)) : (!d.run || d.run <= 2.5)));

  K.check('Flux is B × A on the 0.001 m² ring: at 1 A the iron reads 1.54 mWb, at 0.1 A 0.31 mWb, and the air ring at 0.1 A 0.063 µWb', () =>
    drawn(iKnee, null, { cur: 1, trail: null }).readouts.P === '1.54' + NB + 'mWb' && drawn(iIron, null, { core: 'iron', cur: 0.1 }).readouts.P === '0.31' + NB + 'mWb' &&
    drawn(iIron, null, { core: 'air', cur: 0.1 }).readouts.P === '0.063' + NB + 'µWb');
