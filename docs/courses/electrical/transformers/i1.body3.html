<p class="caption">Each line drawn is 1 µWb. Near a long straight wire, the density in mT is 0.2 × amps ÷ mm.</p>

<script>
  // ================= the rules =================
  const strip = (s) => s.replace(/\[\^\d+\]/g, '');
  const NB = ' ';
  // Round a long straight wire in air: flux density in mT = 0.2 × current in A ÷ distance in mm.
  const WIRE_K = 0.2;
  const wireB = (amps, mm) => WIRE_K * Math.abs(amps) / mm;
  // A hoop: flux in µWb = density (mT, so × 0.001 for T) × area (m²) × cos of the tilt from square-on.
  const rad = (deg) => deg * Math.PI / 180;
  const fluxOf = (B, area, tilt) => B * 1e-3 * area * Math.cos(rad(tilt)) * 1e6;
  const B_IN = 5;                               // mT inside the coil while the hoop is in it (an example setting)
  const U_B = 8, U_A = 0.003, U_TILT = 60;      // the last hoop puzzle's example field, hoop and tilt
  const SRC1 = 'https://phys.libretexts.org/Bookshelves/University_Physics/Physics_(Boundless)/21%3A_Magnetism/21.1%3A_Magnetism_and_Magnetic_Fields';
  const SRC2 = 'https://labs.phys.utk.edu/mbreinig/phys222core/modules/m4/magnetic%20fields.html';
  const SRC3 = 'https://www.khanacademy.org/science/ap-physics-2/x0e2f5a2c:magnetism-and-electromagnetism';

  // A number as the lesson writes it: no trailing zeros ("0.4", "10", "8.7").
  function trim(v, dp) {
    const p = Math.pow(10, dp);
    let s = (Math.round(v * p) / p).toFixed(dp);
    if (dp > 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
    return s === '-0' ? '0' : s;
  }
  const uWb = (v) => trim(v, 1) + NB + 'µWb';
  const mTx = (v, dp) => trim(v, dp) + NB + 'mT';
  const ease01 = (p) => K.ease(K.clamp(p, 0, 1));
  const r1 = (v) => Math.round(v * 10) / 10;
  const r3 = (v) => Math.round(v * 1000) / 1000;

  // ================= the drawing's sizes =================
  const W = 340, CX = 170, Y0 = 140;
  const H_FIELD = 316, H_HOOP = 282, H_UNI = 282, H_END = 200, FIELD_Y1 = 274;
  // The wire end-on: 2.3 px a millimetre; eight needles 20 mm out; rings drawn from 4.5 to 56 mm.
  const PXMM = 2.3, RING_MM = 20, RMIN = 4.5, RMAX = 56;
  // The loop and the coil, cut through: each turn 110 px across, the coil 150 px long whatever its turns.
  const CA = 55, COIL_L = 150, RC = 7;
  // The coil the hoop sits in: 6 turns, its middle at x = 110, a line every 7 px inside (1 µWb a line).
  const HMID = 110, HFAR = 318, HS = 7, HK = [-11, 10], HROW = 86;
  const HOOP_TURNS = [40, 68, 96, 124, 152, 180];
  // The last hoop puzzle: a line every 9 px; its 0.003 m² hoop is 216 px long (24 lines square-on).
  const U_S = 9, U_K = [-12, 12], U_L = 216;
  // Inside the hoop's coil the lines run straight; past its ends they spread (a sketch), so the density falls.
  function spread(x) { const d = Math.max(0, Math.abs(x - HMID) - 40); return 1 + (d / 97) * (d / 97); }
  function hoopX(pos) { return HMID + (HFAR - HMID) * pos / 100; }
  function densAt(x) { return B_IN / spread(x); }

  // ================= the lesson: SHOW screens demonstrate, DO screens are puzzles =================
  // enter: the picture a screen opens on; end: where its demonstration finishes; ctl: the controls
  // it shows; demo(t): the demonstration at t seconds; run / runFn / runEnd: what a right answer plays.
  const STEPS = [
    { show: true, name: 'Round a wire', ctl: ['cur'], enter: { mode: 'wire', cur: 0 }, end: { cur: 10 }, dur: 3.6, gripAt: 2.7,
      demo: (t) => { X.cur = 10 * ease01((t - 0.4) / 2.0); },
      text: strip('A current makes a *magnetic field*. Here you see a wire end-on. The cross is the tail of the current\'s arrow, going away from you. A dot would be its point, coming towards you. Compass needles round the wire line up in circles centred on it.[^1] Grip the wire in your right hand with your thumb along the current. Your fingers curl the way the field goes. Drag the current down through zero. The rings fade to nothing, then come back turning the other way.'),
      read: 'With the current into the page, the needles line up in clockwise circles centred on the wire. At zero current the wire makes no field. Reverse the current, and the rings turn the other way.',
      still: () => setStill({ mode: 'wire', cur: 10 }) },
    { kind: 'pick', name: 'Above the wire', ask: 'above', enter: { mode: 'wire', cur: 10 }, run: 1.0, slipRun: 0.5,
      task: 'The current flows into the page, away from you. Which way does the needle just above the wire point?',
      opts: ['Towards the wire', 'To the right', 'To the left', 'Away from the wire'], want: 'To the right',
      hint: 'Point your right thumb into the page and follow your fingers.',
      hints: { 'Towards the wire': 'The field runs round the wire in rings. It never points at the wire.',
        'To the left': 'Point your right thumb into the page. Your fingers curl clockwise. Above the wire, they point right.',
        'Away from the wire': 'Rings, not spokes. The needle lies along its ring.' },
      why: 'Point your right thumb along the current, into the page. Your fingers curl clockwise as you look. At the top of a clockwise ring, the field points right. The needle lies along it.',
      read: 'The current flows into the page. Which way does the needle just above the wire point?' },
    { show: true, name: 'A loop, then a coil', ctl: ['mode', 'turns', 'cur'], enter: { mode: 'loop', cur: 0, turns: 6 }, end: { mode: 'coil', cur: 10, turns: 6 }, dur: 3.2, xfade: 2.1,
      demo: (t) => { X.cur = 10 * ease01((t - 0.4) / 1.4); X.mode = t < 2.1 ? 'loop' : 'coil'; },
      text: strip('Switch to a loop, cut through and seen side-on. Its current comes out at the top and goes in at the bottom. Inside the loop, the rings from both sides point the same way, so they add. Add turns to make a coil. The rings join into lines through the middle and round the outside, like a bar magnet\'s field.[^2] Curl your right fingers along the current in the turns. Your thumb points to the north end, where the lines leave. More turns or more current crowd the lines closer.'),
      read: 'Inside a loop, the rings from its two sides add. A coil\'s rings join into a bar magnet\'s field. The lines leave from its north end. More turns or more current crowd them closer.',
      still: () => setStill({ mode: 'coil', turns: 6, cur: 10 }) },
    { kind: 'pick', name: 'Which end?', pic: 'end', run: 2.0,
      task: 'You look at one end of a coil. The current runs round it anticlockwise as you look. Is that end north or south?',
      opts: ['South', 'North', 'Neither: only a bar magnet has poles'], want: 'North',
      hint: 'Curl your right fingers the way the current runs.',
      hints: { 'South': 'Curl your right fingers anticlockwise as you look. Your thumb points at you, out of this end.',
        'Neither: only a bar magnet has poles': 'A coil\'s lines leave one end and go back in at the other, as a bar magnet\'s do.' },
      why: 'Curl your right fingers the way the current runs, anticlockwise as you look. Your thumb points out of the coil towards you. The lines leave that end, so it is north.',
      read: 'You look at one end of a coil. The current runs round it anticlockwise. Is that end north or south?' },
    { show: true, name: 'Flux through a hoop', ctl: ['hoop'], enter: { mode: 'coil', hoop: true, size: 0.002, tilt: 0, pos: 0 }, end: {}, dur: 3.2, hoopAt: 0.4, count: [1.0, 0.17],
      demo: () => {},
      text: strip('Now hold a hoop inside the coil, square-on to the lines. The *flux*, Φ, is how much field threads it.[^3] It is measured in webers, Wb. Say each line drawn stands for 1 µWb, a millionth of a weber. This 0.002 m² hoop catches 10 lines, so 10 µWb. The *flux density*, B, is how crowded the lines are. It is the flux per square metre, square-on, in teslas, T. Here B = 10 µWb ÷ 0.002 m² = 0.005 T, which is 5 mT.'),
      read: 'A 0.002 m² hoop, square-on inside the coil, catches 10 lines. That is 10 µWb. The flux density is 10 µWb ÷ 0.002 m² = 5 mT.',
      still: () => setStill({ mode: 'coil', hoop: true, size: 0.002, tilt: 0, pos: 0 }) },
    { kind: 'typed', name: 'A wider hoop', ans: 'wide', enter: { mode: 'coil', hoop: true, size: 0.002, tilt: 0, pos: 0 }, run: 1.4,
      runFn: (t) => { X.size = 0.002 + 0.002 * ease01((t - 0.2) / 1.0); }, runEnd: { size: 0.004 },
      answer: 20, decimals: 0, unit: 'µWb', want: '20' + NB + 'µWb',
      slips: [{ value: 10, hint: 'The field is the same, but a wider hoop catches more of it. Flux is density times area.' },
        { value: 20000, hint: '5 mT is 0.005 T, not 5 T.' },
        { value: 0.02, hint: 'That is in milliwebers. The box is in microwebers.' }],
      task: 'Swap in a wider hoop, 0.004 m², square-on in the same 5 mT. What flux threads it?',
      hint: 'Multiply the density in teslas by the area in square metres.',
      why: 'Flux is density times area. 0.005 T × 0.004 m² = 0.000' + NB + '02 Wb, which is 20 µWb. Twice the area catches twice the flux at the same density.',
      read: 'A 0.004 m² hoop sits square-on in the same 5 mT. What flux threads it?' },
    { show: true, name: 'Tilt the hoop', ctl: ['tilt', 'pos', 'size'], enter: { mode: 'coil', hoop: true, size: 0.002, tilt: 0, pos: 0 }, end: { tilt: 60 }, dur: 3.0,
      demo: (t) => { X.tilt = 60 * ease01((t - 0.5) / 2.1); },
      text: strip('Tilt the hoop. Its face now shows the lines a smaller area. Fewer lines thread it. At 60°, that area is cos 60° = 0.5 of the hoop. So the flux halves to 5 µWb. Edge-on, at 90°, it catches none. The field has not changed. Its density there is still 5 mT. So flux = B × area × cos of the tilt. Now drag the hoop out past the coil\'s end. The lines spread out there. So the density falls, and the flux falls with it.'),
      read: 'Tilted 60°, the hoop catches 5 µWb, half as much. The density stays 5 mT. Past the coil\'s end, the lines spread, so the density and the flux both fall.',

    { kind: 'pick', name: 'What the field did', enter: { mode: 'coil', hoop: true, size: 0.002, tilt: 60, pos: 0 }, hideDens: true, run: 0.6,

  // ================= state =================

  const X = Object.assign({}, BASE);              // what the picture shows now
  const blank = () => ({ pick: null, res: null, why: false, tries: 0, hint: '' });

  const solved = (st) => !!st && (st.res === 'right' || st.res === 'shown');
  let T = Infinity, motionEnd = 0, scripted = false, lastStep = -1, finished = false, lastDone = false;
  let REC = { said: [] };
  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const testing = () => document.documentElement.classList.contains('k-testing');
  const quiet = () => REDUCE || testing();
  const el = (id) => document.getElementById(id);
  const arr = (t0, dur) => K.arrive(T, t0, dur);

  // ================= text with amber key terms (built with K.el, never innerHTML) =================

  // A screen painted in the state given (finished): what it drew.
  function drawn(i, st, x) {
    const d = STEPS[i], keep = { X: Object.assign({}, X), S: S[i], T, sc: scripted };
    S[i] = st || blank(); T = Infinity; scripted = false;
    Object.assign(X, BASE, d.enter || {}, d.show ? d.end || {} : solved(S[i]) ? d.runEnd || {} : {}, x || {});
    try { paint(i); return REC; }
    finally { Object.assign(X, keep.X); S[i] = keep.S; T = keep.T; scripted = keep.sc; paint(); }
  }
  const iWire = idx('Round a wire'), iAbove = idx('Above the wire'), iCoil = idx('A loop, then a coil'), iEnd = idx('Which end?');
  const iWide = idx('A wider hoop'), iTilt = idx('Tilt the hoop'), iDid = idx('What the field did'), iOut = idx('Out from the wire');
  const iFar = idx('Four times as far'), iUni = idx('A tilted hoop'), iRev = idx('Reverse the current');

  K.check('Compasses placed near a long straight current-carrying wire show field lines forming circular loops centred on the wire: every ring is drawn round the wire, and every needle lies along its ring', () =>
    [10, -10, 20, -20, 3].every((a) => {
      const r = drawn(iWire, null, { cur: a }).wire;
      return r.rings.length > 0 && r.rings.every((c) => c.cx === CX && c.cy === Y0) && r.needles.length === 8 &&
        r.needles.every((q) => Math.abs(Math.cos(q.ang - Math.atan2(q.y - Y0, q.x - CX))) < 1e-9);
    }), { source: SRC1 });
  K.check('The right-hand grip: a current into the page makes clockwise rings, so the needle just above the wire points right; reversed it points left; with no current there are no rings', () => {
    const top = (a) => drawn(iWire, null, { cur: a }).wire.needles.find((q) => q.m === 6);
    const clockwise = drawn(iWire, null, { cur: 10 }).wire.arrows.every((q) => Math.abs(Math.cos(q.dir - Math.atan2(q.y - Y0, q.x - CX) - Math.PI / 2) - 1) < 1e-9);
    return near(Math.cos(top(10).ang), 1, 1e-9) && near(Math.cos(top(-10).ang), -1, 1e-9) && clockwise && drawn(iWire, null, { cur: 0 }).wire.rings.length === 0 &&
      STEPS[iAbove].want === 'To the right';
  });
  K.check('B in mT = 0.2 × A ÷ mm: 20 A gives 0.4 mT at 10 mm, 0.2 mT at 20 mm and 0.1 mT at 40 mm, as the needle\'s readout shows', () => {
    const rd = (mm) => drawn(iOut, null, { dist: mm }).readouts.bNeedle;
    return near(wireB(20, 10), 0.4, 1e-12) && near(wireB(20, 20), 0.2, 1e-12) && near(wireB(20, 40), 0.1, 1e-12) &&
      rd(10) === '0.4' + NB + 'mT' && rd(20) === '0.2' + NB + 'mT' && rd(40) === '0.1' + NB + 'mT';
  });
  K.check('The magnetic field produced by the coil resembles that of a bar magnet: its lines run one way through the middle and back the other way round the outside, leaving from the end marked N', () => {
    const f = (a) => drawn(iCoil, null, { mode: 'coil', turns: 6, cur: a }).field;
    const ok = (r, s) => r.lines.length >= 4 && r.lines.every((l) => l.inDir === s && (l.outDir == null || l.outDir === -s)) && r.lines.some((l) => l.outDir != null) && r.N === (s > 0 ? 'right' : 'left');
    return ok(f(10), 1) && ok(f(-10), -1);
  }, { source: SRC2 });
  K.check('More turns or more current crowd the lines: 10 turns draw more lines than 6, 20 A more than 10 A, and 2 turns fewer; reversing the current keeps their number; inside a loop the rings from both sides point the same way', () => {
    const n = (t, a) => drawn(iCoil, null, { mode: 'coil', turns: t, cur: a }).field.lines.length;
    const loop = drawn(iCoil, null, { mode: 'loop', cur: 10 }).field;
    return n(10, 10) > n(6, 10) && n(6, 20) > n(6, 10) && n(2, 10) < n(6, 10) && n(2, 10) > 0 && n(6, -10) === n(6, 10) &&
      loop.rings.length >= 6 && loop.inside.length > 0 && loop.inside.every((s) => s === 1);
  });
  K.check('Magnetic flux counts the part of the field perpendicular to the hoop\'s area: square-on the hoop catches the most, tilted less, edge-on none, while the field it sits in stays the same', () => {
    const r = [0, 60, 90].map((t) => drawn(iTilt, null, { tilt: t, pos: 0, size: 0.002 }));
    return r[0].hoop.lit === 10 && r[1].hoop.lit === 5 && r[2].hoop.lit === 0 &&
      r[0].readouts.flux === '10' + NB + 'µWb' && r[1].readouts.flux === '5' + NB + 'µWb' && r[2].readouts.flux === '0' + NB + 'µWb' &&
      r.every((q) => q.readouts.dens === '5' + NB + 'mT');
  }, { source: SRC3 });
  K.check('The hoop lights as many lines as its flux in µWb, to the nearest line, for both hoops at every tilt (10 → 5 at 60°, 20 → 10); past the coil\'s end the density and the flux fall', () => {
    const inside = [0.002, 0.004].every((A) => [0, 15, 30, 45, 60, 75, 90].every((t) => { const h = drawn(iTilt, null, { size: A, tilt: t, pos: 0 }).hoop; return h.lit === Math.round(h.flux); }));
    const out = [0, 25, 50, 75, 100].map((p) => drawn(iTilt, null, { size: 0.002, tilt: 0, pos: p }).hoop);
    return inside && out.every((h, k) => !k || (h.B <= out[k - 1].B + 1e-12 && h.flux <= out[k - 1].flux + 1e-12)) && out[4].B < 2.5 && near(out[0].B, 5, 1e-12);
  });
  K.check('Each typed answer and slip is worked from its rule: 20 µWb (slips 10, 20 000 and 0.02), 0.1 mT (slips 0.025, 0.4 and 1.6) and 12 µWb (slips 24, 20.8 and 12 000)', () => {
    const sl = (i) => STEPS[i].slips.map((s) => s.value);
    const wide = near(fluxOf(5, 0.004, 0), 20, 1e-9) && near(fluxOf(5, 0.002, 0), 10, 1e-9) && near(0.005 * 0.004 * 1e9, 20000, 1e-6) && near(fluxOf(5, 0.004, 0) / 1000, 0.02, 1e-12);
    const far = near(wireB(20, 40), 0.1, 1e-12) && near(wireB(20, 10) / 16, 0.025, 1e-12) && near(wireB(20, 10), 0.4, 1e-12) && near(wireB(20, 10) * 4, 1.6, 1e-12);
    const tilt = near(fluxOf(8, 0.003, 60), 12, 1e-9) && near(fluxOf(8, 0.003, 0), 24, 1e-9) && near(24 * Math.sin(rad(60)), 20.8, 0.05) && near(0.008 * 0.003 * 0.5 * 1e9, 12000, 1e-6);
    return wide && far && tilt && STEPS[iWide].answer === 20 && STEPS[iFar].answer === 0.1 && STEPS[iUni].answer === 12 &&
      sl(iWide).join() === '10,20000,0.02' && sl(iFar).join() === '0.025,0.4,1.6' && sl(iUni).join() === '24,20.8,12000';
  });
  K.check('Before a Check no puzzle shows its answer, and a right Check shows it: the needle above the wire points right, the coil\'s end turns to show N, the wider hoop lights 20 lines, the density shows 5 mT, the needle moves to 40 mm, the tilted hoop lights 12 lines, and the reversed coil swaps N and S', () => {
    const b = (i) => drawn(i, blank()), s = (i) => drawn(i, solvedSt(i));
    const above = b(iAbove).wire.arrows.length === 0 && b(iAbove).wire.top === null && near(Math.cos(s(iAbove).wire.top.ang), 1, 1e-9);
    const end = b(iEnd).end.N === null && s(iEnd).end.N === 'near';
    const wide = b(iWide).hoop.lit === 10 && s(iWide).hoop.lit === 20 && s(iWide).readouts.flux === '20' + NB + 'µWb';
    const did = b(iDid).readouts.dens === '?' && s(iDid).readouts.dens === '5' + NB + 'mT' && b(iDid).readouts.flux === '5' + NB + 'µWb';
    const far = b(iFar).wire.drag.mm === 10 && b(iFar).readouts.bNeedle === '0.4' + NB + 'mT' && s(iFar).wire.drag.mm === 40 && s(iFar).readouts.bNeedle === '0.1' + NB + 'mT';
    const uni = b(iUni).uni.lit === 0 && b(iUni).readouts.flux === '?' && s(iUni).uni.lit === 12 && s(iUni).readouts.flux === '12' + NB + 'µWb';
    const rev = b(iRev).field.N === 'right' && s(iRev).field.N === 'left';
    return above && end && wide && did && far && uni && rev;
  });
  K.check('Every demonstration ends 3 to 4.5 s after its screen opens, and every answer\'s motion within 2.5 s', () =>
    STEPS.every((d) => d.show ? (!d.demo || (d.dur >= 3 && d.dur <= 4.5)) : (!d.run || d.run <= 2.5) && (!d.slipRun || d.slipRun <= 2.5)));

  K.ready();
</script>
