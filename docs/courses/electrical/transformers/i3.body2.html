<p class="caption">A sketch of an ideal core, worked from Faraday's law. On AC, time is slowed right down.</p>

<script>
  // ================= the rules =================
  const strip = (s) => s.replace(/\[\^\d+\]/g, '');
  const NB = '\u00a0', MINUS = '−';
  const N1 = 300, N2 = 100, REL = 120000;           // the example windings, and the core's reluctance in At/Wb
  const PER_A = N1 / REL;                            // flux per amp in the primary, N I ÷ reluctance: 0.0025 Wb
  const WIN = 0.1;                                   // the meter's change window, s
  const VS = 440, PHI_OFF = 0.0055;                  // the fixed supply (V rms), and the peak flux held with Fix off (Wb)
  const VDC = 24, RDC = 0.5, IDC = VDC / RDC;        // DC: the charger's volts, the winding's ohms, the settled 48 A
  const ACPK = PHI_OFF * REL / N1;                   // the primary's AC peak current at 60 Hz and 300 turns: 2.2 A
  const CLIMB = 2.2;                                 // the DC climb, drawn as a smooth rise over 2.2 s
  const SLOW = 2.4;                                  // on AC one cycle at 60 Hz takes 2.4 s on screen
  const SPAN = 4, SPAN_AC = 4.8;                     // the traces show the last 4 s (AC: 4.8 s of slowed time)
  const FF = 0.707 / 0.637;                          // the form factor, 1.11
  const SRC1 = 'https://phys.libretexts.org/Courses/University_of_California_Davis/UCD%3A_Physics_9C__Electricity_and_Magnetism/5%3A_Electromagnetism/5.1%3A_Magnetic_Induction';
  const SRC2 = 'https://pages.mtu.edu/~avsergue/EET2233/Lectures/CHAPTER5.pdf';
  const SRC3 = 'https://phys.libretexts.org/Bookshelves/College_Physics/College_Physics_1e_(OpenStax)/23:_Electromagnetic_Induction_AC_Circuits_and_Electrical_Technologies/23.10:_Transformers';

  // AC: with Fix off the peak flux is held at 5.5 mWb and E = 4.44 f N Φm; with Fix on E is held at 440 V and Φm = 440 ÷ (4.44 f N).
  function acOf(f, n, fix) {
    const phim = fix ? VS / (4.44 * f * n) : PHI_OFF;
    return { phim, E: fix ? VS : 4.44 * f * n * phim, ipk: phim * REL / n };
  }
  // DC: the current climbs smoothly to 24 ÷ 0.5 = 48 A. The flux trace is drawn bending flat at the top of its scale.
  const dcI = (t) => IDC * K.ease(K.clamp(t / CLIMB, 0, 1));
  const FSDC = 0.011;
  const dcPhi = (I) => FSDC * Math.tanh(PER_A * I / FSDC);
  const KICK = (() => { let m = 0; for (let k = 0; k <= 440; k++) { const t = k * CLIMB / 400; m = Math.max(m, N2 * (dcPhi(dcI(t)) - dcPhi(dcI(t - WIN))) / WIN); } return m; })();

  // ================= the lesson: SHOW screens demonstrate, DO screens are puzzles =================
  const ramp = (t, t0, dur, a, b) => a + (b - a) * K.clamp((t - t0) / dur, 0, 1);
  const STEPS = [
    { kind: 'pick', name: 'A turning coil', enter: { mode: 'hand', cur: 0 },
      task: 'A coil turns steadily between two magnet poles. Where in its turn is its emf biggest?',
      opts: ['Face-on, with the most flux through it', 'Edge-on, with the flux changing fastest', 'Halfway between the two'],
      want: 'Edge-on, with the flux changing fastest', right: 'Still there.',
      hint: 'The emf follows the change, not the amount.',
      hints: { 'Face-on, with the most flux through it': 'Face-on, the flux is at its most, but it is not changing.',
        'Halfway between the two': 'Halfway, the flux is changing, but not at its fastest.' },
      why: 'Edge-on, no flux passes through it, but the flux is changing fastest. The emf follows the change, not the amount. Now nothing turns. The flux itself will grow and shrink.',
      read: 'A coil turns steadily between two magnet poles. Where in its turn is its emf biggest?' },
    { show: true, name: 'Move the flux', ctl: ['cur'], enter: { mode: 'hand', cur: 0 }, end: { cur: 2 }, dur: 4.0,
      demo: (t) => { X.cur = ramp(t, 0.6, 1, 0, 2); },
      text: strip('Only a changing flux makes a voltage. A primary and a secondary coil share one iron core. No wire joins them. A voltmeter reads the secondary. Drag the primary\'s current. The flux follows, and the meter reads while you move. Move faster, and it reads more. Hold still, and it reads zero, however strong the flux.[^1] Each turn gets an emf set by how fast the flux changes. The turns are in series, so their emfs add: e = N × ΔΦ ÷ Δt. This is *Faraday\'s law*.'),
      read: 'Two coils share one iron core, with no wire between them. The meter on the secondary reads only while the primary\'s current is changing. With the current held at 2 A and 5 mWb in the core, it reads zero.',
      still: () => setStill() },
    { kind: 'typed', name: 'Hold it still', ans: 'hold', enter: { mode: 'hand', cur: 0 },
      pre: (t) => { X.cur = ramp(t, 1, 1, 0, 2); }, preDur: 2, run: 2.0, runFn: () => { X.cur = 2; }, runEnd: { cur: 2 },
      answer: 0, decimals: 2, unit: 'V', want: '0' + NB + 'V',
      slips: [{ value: 0.5, hint: 'That was while the current moved. Now the flux is steady.' },
        { value: 1, hint: 'That doubles the moving reading. A held current changes nothing.' }],
      task: 'You drag the primary\'s current from 0 to 2 A in 1 s. The meter reads 0.5 V while you move. You stop and hold it at 2 A. What does the meter read now?',
      hint: 'Ask what the flux is doing now, not how big it is.',
      why: 'Held at 2 A, the flux sits steady at 5 mWb. It is not changing at all, so no turn gets an emf. A strong field alone makes no voltage.',
      read: 'You drag the primary\'s current from 0 to 2 A in 1 s. The meter reads 0.5 V while you move. You stop and hold it at 2 A. What does the meter read now?' },
    { show: true, name: 'Against the change', ctl: ['lamp', 'cur'], enter: { mode: 'hand', cur: 0, lamp: false }, end: { lamp: true, cur: 1 }, dur: 4.4,
      demo: (t) => { X.lamp = t >= 0.4; X.cur = t < 2.4 ? ramp(t, 0.8, 1, 0, 2) : ramp(t, 2.4, 2, 2, 1); },
      text: strip('The meter takes almost no current, yet it reads. So the emf is there with or without a current. Close the lamp\'s switch, and current flows round the secondary. That current makes its own field, drawn dashed. The field always pushes against the change. Drag the flux up, and it points against the main flux. Let the flux fall, and it points the same way, holding the flux up. If it helped the change, the change would feed itself. That would make energy from nothing. This is *Lenz\'s law*.'),
      read: 'With the lamp\'s switch closed, the secondary\'s own field pushes against the change. It points against a rising flux, and with a falling one.',
      still: () => setStill() },
    { kind: 'pick', name: 'A falling flux', enter: { mode: 'hand', cur: 2, lamp: true }, run: 2.2,
      runFn: (t) => { X.cur = ramp(t, 0.2, 2, 2, 1); }, runEnd: { cur: 1 },
      task: 'The lamp\'s switch is closed. The primary\'s current is falling. The main flux still points up the core, but it is shrinking. Which way does the secondary\'s own field point inside the core?',
      opts: ['Up, the same way as the main flux', 'Down, against the main flux', 'Nowhere: a falling flux makes no field'], want: 'Up, the same way as the main flux',
      hint: 'It fights the change, not the field.',
      hints: { 'Down, against the main flux': 'It fights the change, not the field. The change here is a fall.',
        'Nowhere: a falling flux makes no field': 'A falling flux is still a changing flux, so the lamp still lights.' },
      why: 'The secondary\'s current pushes against the change, and here the change is a fall. So its own field points up, with the main flux, to hold it up. Against the change is not always against the field.',
      read: 'The lamp\'s switch is closed. The primary\'s current is falling. The main flux still points up the core, but it is shrinking. Which way does the secondary\'s own field point?' },
    { show: true, name: 'Switch to AC', ctl: ['mode', 'cur', 'f', 'n'], enter: { mode: 'hand', cur: 0 }, end: { mode: 'ac' }, dur: 3.6, work: true,
      demo: (t) => { if (t >= 0.6) setMode('ac'); },
      text: strip('Switch to AC. The flux swings as a sine, and the emf follows its slope. It peaks as the flux crosses zero, as in the turning coil. Half a cycle lasts 1 ÷ 2f seconds. In that time the flux swings from −Φm to +Φm. Each turn\'s average emf is 2Φm × 2f = 4 f Φm. The *form factor*, 1.11, turns that into rms. For N turns, E = 4.44 f N Φm. Φm is flux density times core area, so this ties a coil\'s volts to its core.[^2]'),
      read: 'On AC the emf wave follows the flux wave\'s slope. It peaks as the flux crosses zero. At 60 Hz, 300 turns and a peak flux of 5.5 mWb, E = 4.44 × 60 × 300 × 0.0055 = 440 V.',
      still: () => setStill() },
    { kind: 'typed', name: 'Volts from flux', ans: 'emf', enter: { mode: 'ac', f: 60, n: 300, fix: false },
      answer: 178, decimals: 0, accept: [177.6], unit: 'V', want: '178' + NB + 'V',
      slips: [{ value: 40, hint: 'That leaves out the 4.44.' },
        { value: 160, hint: 'That is the average. The rms is 1.11 times it.' },
        { value: 251, hint: 'That is the peak. E = 4.44 f N Φm gives the rms.' }],
      task: 'A coil of 200 turns sits on a core whose flux peaks at 4 mWb, at 50 Hz. What rms emf does it give?',
      hint: 'E = 4.44 × f × N × Φm, with Φm in webers.',
      why: '4.44 × 50 × 200 × 0.004 = 177.6, so 178 V rms. The peak is √2 times that, 251 V.',
      read: 'A coil of 200 turns sits on a core whose flux peaks at 4 mWb, at 50 Hz. What rms emf does it give?' },
    { show: true, name: 'Fix the voltage', ctl: ['fix', 'f', 'n'], enter: { mode: 'ac', fix: false, f: 60, n: 300 }, end: { fix: true, n: 330 }, dur: 3.6,
      demo: (t) => { X.fix = t >= 0.6; X.n = t >= 2.0 ? 330 : 300; },
      text: strip('On a fixed supply, the voltage sets the flux. A supply holds the primary at 440 V. The winding\'s resistance is small. So its own emf must almost equal the supply\'s, or a huge current would flow. The flux swings just enough to make it: Φm = V ÷ (4.44 f N). At 60 Hz, 300 turns need 5.5 mWb. The current finds whatever value makes that flux. On 330 turns, each needs less voltage, so the flux falls to 5.0 mWb. At 50 Hz, it rises to 6.6 mWb.'),
      read: 'With the supply held at 440 V, f and N set the flux. At 60 Hz, 300 turns hold 5.5 mWb and 330 turns hold 5.0 mWb. At 50 Hz, 300 turns hold 6.6 mWb.',
      still: () => setStill() },
    { kind: 'typed', name: 'More turns', ans: 'turns', enter: { mode: 'ac', fix: true, f: 60, n: 300 }, run: 1.2,
      runFn: (t) => { X.n = t >= 0.2 ? 330 : 300; }, runEnd: { n: 330 },
      answer: 5.0, decimals: 1, unit: 'mWb', want: '5.0' + NB + 'mWb',
      slips: [{ value: 6.1, hint: 'More turns would push more flux on a fixed current. Here the voltage is fixed.' },
        { value: 5.5, hint: 'The flux does change. Each turn now needs less voltage.' },
        { value: 0.005, hint: 'That is in webers. The box is in mWb.' }],
      task: 'A primary on a fixed 440 V, 60 Hz supply has 300 turns and a peak flux of 5.5 mWb. It is rewound with 10% more turns, 330. What is the peak flux now?',
      hint: 'Φm = 440 ÷ (4.44 × 60 × 330).',
      why: '440 ÷ (4.44 × 60 × 330) = 0.0050 Wb, which is 5.0 mWb. The 440 V is shared over more turns. Each turn needs less emf, so the flux swings less.',
      read: 'A primary on a fixed 440 V, 60 Hz supply has 300 turns and a peak flux of 5.5 mWb. It is rewound with 330 turns. What is the peak flux now?' },
    { show: true, name: 'Switch to DC', ctl: ['mode', 'cur'], enter: { mode: 'hand', cur: 0 }, end: { mode: 'dc' }, dur: 4.0,
      demo: (t) => { if (t >= 0.6) setMode('dc'); },
      text: strip('Switch to DC. Take 24 V from a battery charger, say. The current climbs, and the meter kicks while it climbs. Then the current settles and the flux holds steady. The meter reads zero, and the primary makes no emf of its own. Only the winding\'s resistance holds the current back. Say it is 0.5 Ω. Then 48 A flows, over 20 times the 2.2 A peak on AC. The core saturates, and the winding turns 1152 W into heat. So a transformer cannot change a DC voltage.[^3]'),
      read: 'On 24 V DC the current settles at 48 A. Only the winding\'s 0.5 Ω holds it back. The flux is steady, so the secondary\'s meter reads zero.',
      still: () => setStill() },
    { kind: 'typed', name: 'Steady current', ans: 'dc', enter: { mode: 'dc' }, pre: () => {}, preDur: CLIMB + 1.2,
      answer: 60, decimals: 0, unit: 'A', want: '60' + NB + 'A',
      slips: [{ value: 0, hint: 'A steady current meets no emf from its own coil. Only the resistance holds it back.' },
        { value: 9.6, hint: 'That multiplies. Divide instead: I = V ÷ R.' }],
      task: 'A primary winding has a resistance of 0.4 Ω. It is put across 24 V DC. What steady current flows?',
      hint: 'On DC, only the resistance limits the current.',
      why: '24 ÷ 0.4 = 60 A. The flux is steady, so the winding makes no emf to oppose the supply. On AC that emf would hold the current far lower.',
      read: 'A primary winding has a resistance of 0.4 Ω. It is put across 24 V DC. What steady current flows?' },
    { kind: 'typed', name: 'A steady rise', ans: 'rise', enter: { mode: 'hand', cur: 0 }, run: 0.9,
      runFn: (t) => { X.cur = ramp(t, 0.4, 0.5, 0, 1.2); }, runEnd: { cur: 1.2 },
      answer: 0.6, decimals: 1, unit: 'V', want: '0.6' + NB + 'V',
      slips: [{ value: 0.3, hint: 'That leaves out the time. Divide by 0.5 s.' },
        { value: 0.15, hint: 'That multiplies by the time. Divide by it.' },
        { value: 0.006, hint: 'That leaves out the turns. Each of the 100 adds its share.' }],
      task: 'The flux through a 100-turn secondary rises steadily by 3 mWb in 0.5 s. What emf does it give?',
      hint: 'e = N × ΔΦ ÷ Δt, with ΔΦ in webers.',
      why: 'The flux changes at 0.003 ÷ 0.5 = 0.006 Wb each second. Each turn gets 0.006 V, and 100 turns add up to 0.6 V. A steady rise gives a steady emf.',
      read: 'The flux through a 100-turn secondary rises steadily by 3 mWb in 0.5 s. What emf does it give?' },
    { kind: 'typed', name: 'A lower frequency', ans: 'freq', enter: { mode: 'ac', fix: true, f: 60, n: 300 }, run: 1.2,
      runFn: (t) => { X.f = t >= 0.2 ? 50 : 60; }, runEnd: { f: 50 },
      answer: 6.6, decimals: 1, unit: 'mWb', want: '6.6' + NB + 'mWb',
      slips: [{ value: 4.6, hint: 'f is on the bottom, so a lower frequency gives more flux, not less.' },
        { value: 5.5, hint: 'The flux does change, because f has fallen.' },
        { value: 0.0066, hint: 'That is in webers. The box is in mWb.' }],
      task: 'The 300-turn primary is built for 440 V at 60 Hz. It is put on 440 V at 50 Hz. What is its peak flux now?',
      hint: 'Φm = 440 ÷ (4.44 × 50 × 300).',
      why: '440 ÷ (4.44 × 50 × 300) = 0.0066 Wb, which is 6.6 mWb. Each half cycle lasts longer. So the flux must swing further to make the same volts. That is 20% more flux, closer to the core\'s knee.',
      read: 'The 300-turn primary is built for 440 V at 60 Hz. It is put on 440 V at 50 Hz. What is its peak flux now?' },
  ];
  const FINISH = 'Only a changing flux makes a voltage. Every turn it threads gets the same voltage. The current that voltage drives pushes against the change. On AC, E = 4.44 f N Φm, so a supply\'s voltage fixes the core\'s flux. More turns or a higher frequency mean less flux. On DC nothing changes, so there is nothing to step. Next: two windings, and the turns ratio.';

  // ================= state =================
  const BASE = { mode: 'hand', cur: 0, lamp: false, f: 60, n: 300, fix: false };
  const X = Object.assign({}, BASE);              // what the picture shows now
  const TH0 = 0.3 * Math.PI;                      // where the AC swing starts
  const TM = { clock: 0, hist: [], th: TH0, dcT: 0, lastMove: -99 };   // the picture's own clock and the current's recent past
  const D = { phim: PHI_OFF };                    // the drawn peak flux, easing towards the rule's
  const blank = () => ({ pick: null, res: null, why: false, tries: 0, hint: '' });
  let S = STEPS.map(blank);
  const solved = (st) => !!st && (st.res === 'right' || st.res === 'shown');
  let T = Infinity, motionEnd = 0, scripted = false, lastStep = -1, finished = false, lastDone = false, held = false;
  let REC = { said: [] };
  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const testing = () => document.documentElement.classList.contains('k-testing');
  const quiet = () => REDUCE || testing();
  const el = (id) => document.getElementById(id);

  // ================= time: the current's recent past sets the flux trace and the meter =================
  const curI = () => X.mode === 'dc' ? dcI(TM.dcT) : X.mode === 'hand' ? X.cur : 0;
  const phiOf = (I) => X.mode === 'dc' ? dcPhi(I) : PER_A * I;
  function resetTime() { TM.dcT = 0; const I = curI(); TM.hist = [[TM.clock - 5, I], [TM.clock, I]]; }
  function advance(dt) {
    TM.clock += dt;
    if (X.mode === 'ac') TM.th = (TM.th + dt * 2 * Math.PI * X.f / (60 * SLOW)) % (2 * Math.PI);
    if (X.mode === 'dc') TM.dcT += dt;
    TM.hist.push([TM.clock, curI()]);
    while (TM.hist.length > 2 && TM.hist[1][0] < TM.clock - 4.6) TM.hist.shift();
  }
  function setMode(m) { if (X.mode === m) return; X.mode = m; resetTime(); }
  function Iat(t) {
    const h = TM.hist;
    if (t <= h[0][0]) return h[0][1];
    let lo = 0, hi = h.length - 1;
    if (t >= h[hi][0]) return h[hi][1];
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (h[m][0] <= t) lo = m; else hi = m; }
    const a = h[lo], b = h[hi];
    return b[0] > a[0] ? a[1] + (b[1] - a[1]) * (t - a[0]) / (b[0] - a[0]) : b[1];
  }
  // Faraday's law on the secondary's 100 turns, over the last tenth of a second.
  const meterAt = (t) => N2 * (phiOf(Iat(t)) - phiOf(Iat(t - WIN))) / WIN;
  // Run a motion at once (reduced motion, the self-test, stills and checks): the same steps the animation takes.
  function sim(fn, dur) { const n = Math.max(1, Math.ceil(dur * 30)); for (let k = 1; k <= n; k++) { fn(k * dur / n); advance(dur / n); } }

  const targ = () => acOf(X.f, X.n, X.fix).phim;
  function snapD() { D.phim = targ(); }
  function tween(dt) { const t = targ(), e = t - D.phim; D.phim = Math.abs(e) < 1e-7 ? t : D.phim + e * (1 - Math.exp(-dt / 0.3)); }
  const settled = () => D.phim === targ();

  // ================= text with amber key terms (built with K.el, never innerHTML) =================
  // A number keeps its unit on the same line.
  const UNIT_GAP = /(\d) (?=(?:Hz|mWb|Wb|V|A|Ω|W|s|mm)(?![A-Za-z]))/g;
  function write(node, s) {
    node.textContent = '';
    String(s || '').replace(UNIT_GAP, '$1' + NB).split(/\*([^*]+)\*/).forEach((seg, k) => {
      if (!seg) return;
      node.appendChild(k % 2 ? K.el('span', { class: 'term' }, seg) : document.createTextNode(seg));
    });
  }

  // ================= controls =================
  const stepper = K.stepper({ id: 'step', label: 'Screen', steps: STEPS.map((d) => d.name), value: 0, compact: true, into: '#prog' });
  const at = () => K.clamp(Math.round(stepper.get()) || 0, 0, STEPS.length - 1);
  const signed = (v, dp) => { const s = Math.abs(v).toFixed(dp); return (v < 0 && Number(s) !== 0 ? MINUS : '') + s; };
  const CTL = {
    mode: K.choice({ id: 'mode', label: 'Supply', options: [{ value: 'hand', label: 'Hand' }, { value: 'ac', label: 'AC' }, { value: 'dc', label: 'DC' }], value: 'hand', into: '#c-mode' }),
    cur: K.control({ id: 'cur', label: 'Primary current', min: -2, max: 2, step: 0.05, value: 0, snap: [0, 1.2, 2], fmt: (v) => signed(v, 2) + NB + 'A', into: '#c-cur' }),
    lamp: K.toggle({ id: 'lamp', label: 'Lamp\'s switch closed', value: false, into: '#c-lamp' }),
    fix: K.toggle({ id: 'fix', label: 'Fix the voltage at 440 V', value: false, into: '#c-fix' }),
    f: K.control({ id: 'f', label: 'Frequency, f', min: 40, max: 60, step: 5, value: 60, snap: [50, 60], fmt: (v) => v + NB + 'Hz', into: '#c-f' }),
    n: K.control({ id: 'n', label: 'Primary turns, N', min: 240, max: 360, step: 30, value: 300, snap: [300, 330], fmt: (v) => v + NB + 'turns', into: '#c-n' }),
  };
  const CTL_IDS = Object.keys(CTL);
  const pushed = {};
  CTL_IDS.forEach((id) => { pushed[id] = CTL[id].get(); });
  // The page moves the controls itself during a demonstration (silently, so it is not taken for Dan's move).
  function push() {
    CTL_IDS.forEach((id) => { if (pushed[id] !== X[id]) { CTL[id].set(X[id], true); pushed[id] = CTL[id].get(); } });
  }
  const shownCtl = (d, id) => !finished && !!d.ctl && d.ctl.indexOf(id) >= 0;
  // The current slider works only on Hand; f, N and Fix only on AC. Off, each keeps its place, greyed.
  const usable = (id) => id === 'cur' ? X.mode === 'hand' : (id === 'f' || id === 'n' || id === 'fix') ? X.mode === 'ac' : true;
  const offNow = {};
  function layoutCtl(d) {
    CTL_IDS.forEach((id) => {
      el('c-' + id).hidden = !shownCtl(d, id);
      const off = shownCtl(d, id) && !usable(id);
      if (offNow[id] === off) return;
      offNow[id] = off;
      const box = el('c-' + id);
      box.classList.toggle('off', off);
      box.setAttribute('aria-disabled', off ? 'true' : 'false');
      box.querySelectorAll('input, button').forEach((c) => { c.disabled = off; });
    });
  }

  const vFmt = (dp, unit) => (v) => signed(v, dp) + NB + unit;
  const RO = {
    i: K.readout({ id: 'r-i', label: 'Primary current', fmt: vFmt(2, 'A'), into: '#o-hand' }),
    phi: K.readout({ id: 'r-phi', label: 'Flux', fmt: (v) => { const s = (Math.round(Math.abs(v) * 1e6) / 1e3).toString(); return (v < 0 && s !== '0' ? MINUS : '') + s + NB + 'mWb'; }, into: '#o-hand' }),
    m: K.readout({ id: 'r-m', label: 'Meter', fmt: vFmt(2, 'V'), into: '#o-hand' }),
    E: K.readout({ id: 'r-E', label: 'E, rms', fmt: (v) => Math.round(v) + NB + 'V', into: '#o-ac' }),
    pk: K.readout({ id: 'r-pk', label: 'Peak flux, Φm', fmt: (v) => (v * 1e3).toFixed(1) + NB + 'mWb', into: '#o-ac' }),
    ipk: K.readout({ id: 'r-ipk', label: 'Primary current peak', fmt: (v) => v.toFixed(2) + NB + 'A', into: '#o-ac' }),
    idc: K.readout({ id: 'r-idc', label: 'Primary current', fmt: (v) => Math.round(v) + NB + 'A', into: '#o-dc' }),
    heat: K.readout({ id: 'r-heat', label: 'Winding heat', fmt: (v) => Math.round(v) + NB + 'W', into: '#o-dc' }),
  };

  // Up to three answer buttons; each puzzle fills in its own.
  const pickBtns = [0, 1, 2].map((k) => K.button({ label: 'Answer ' + (k + 1), secondary: true, into: '#picks', press: () => {
    const i = at(), d = STEPS[i], st = S[i];
    if (finished || d.kind !== 'pick' || k >= d.opts.length || solved(st)) return;
    st.pick = d.opts[k]; st.res = null;
  } }));
  // Typed answers: a field each; Check grades it, two misses show the working.
  const ANS = {};
  STEPS.forEach((d, i) => {
    if (d.kind !== 'typed') return;
    const a = K.answer({ id: 'a-' + d.ans, unit: d.unit, answer: d.answer, decimals: d.decimals, tolerance: d.tolerance, accept: d.accept, slips: d.slips, into: '#ans-' + d.ans,
      onCheck: (r) => {
        const st = S[i];
        if (solved(st)) return;
        if (r.state === 'right') { st.res = 'right'; playRun(i, d.run); }
        else if (r.state === 'wrong') {
          st.tries += 1; st.hint = r.hint || d.hint;
          if (st.tries >= 2) { st.res = 'shown'; st.why = true; a.reveal(); playRun(i, d.run); }
          else st.res = 'wrong';
        } else { st.res = r.state; st.hint = ''; }
        K.refresh();
      } });
    ANS[d.ans] = a;
  });
  const checkBtn = K.button({ label: 'Check', into: '#acts', press: () => {
    const i = at(), d = STEPS[i], st = S[i];
    if (finished || d.show || solved(st)) return;
    if (d.kind === 'typed') { ANS[d.ans].check(); return; }
    if (st.pick == null) { st.res = 'empty'; return; }
    st.res = st.pick === d.want ? 'right' : 'wrong';
    if (st.res === 'right') playRun(i, d.run);
  } });
  const whyBtn = K.button({ label: 'Why?', secondary: true, into: '#acts', press: () => {
    const d = STEPS[at()];
    if (d.show || finished) return;
    S[at()].why = !S[at()].why;
  } });
  const replayBtn = K.button({ label: 'Play again', secondary: true, into: '#replay', press: () => {
    if (!STEPS[at()].show || finished) return;
    startDemo(at());
  } });
  const backBtn = K.button({ label: 'Back', secondary: true, into: '#nav', press: () => {
    if (finished) { finished = false; return; }
    stepper.set(Math.max(0, at() - 1), true);
  } });
  const nextBtn = K.button({ label: 'Continue', into: '#nav', press: () => {
    const i = at();
    if (finished || (!STEPS[i].show && !solved(S[i]))) return;
    if (i < STEPS.length - 1) { stepper.set(i + 1, true); return; }
    finished = true; anim.pause(); T = Infinity;
    if (typeof K.complete === 'function') K.complete();
  } });
  K.button({ label: 'Start again', secondary: true, into: '#again', press: () => {
    S = STEPS.map(blank); finished = false; lastStep = -1;
    Object.keys(ANS).forEach((k) => ANS[k].reset());
    stepper.set(0, true);
  } });

  // ================= motion: one animation runs the demonstrations, the answers' motion, AC and the clock =================
  // Hand runs on for a moment after each move, so the trace shows the meter fall back to zero; DC runs until it settles.
  const swinging = () => !quiet() && !held && !finished && X.mode === 'ac';
  const freeRun = () => !quiet() && !held && !finished && ((X.mode === 'hand' && TM.clock - TM.lastMove < 1.6) || (X.mode === 'dc' && TM.dcT < CLIMB + 1.2));
  const needAnim = () => !finished && (T !== Infinity || swinging() || freeRun() || !settled());
  function finishNow(i) {
    if (T === Infinity) return;
    const d = STEPS[i];
    T = Infinity;
    if (scripted) { scripted = false; Object.assign(X, d.end || {}); }
    else if (solved(S[i])) Object.assign(X, d.runEnd || {});
    push();
  }
  const anim = K.anim({ button: false, label: 'Demonstration', step: (dt) => {
    if (finished) return false;
    dt = Math.min(dt, 0.1);
    const i = at(), d = STEPS[i], st = S[i];
    if (T !== Infinity) {
      T += dt;
      const tt = Math.min(T, motionEnd);
      if (scripted) { if (d.demo) d.demo(tt); }
      else if (solved(st) && d.runFn) d.runFn(tt);
    }
    advance(dt);
    if (T !== Infinity && T >= motionEnd) finishNow(i);
    tween(dt);
    push();
    layoutCtl(d);
    paint(i);
    return needAnim();
  } });
  function kick() {
    if (quiet()) { snapD(); return; }
    if (needAnim() && !anim.playing()) anim.play();
  }
  // A screen's state: its opening, then (at once) what came before, its answer's motion or its demonstration.
  function prep(i, solvedNow, showEnd) {
    const d = STEPS[i];
    Object.assign(X, BASE, d.enter || {});
    TM.th = TH0;
    resetTime();
    if (d.show) { if (showEnd && d.demo) sim(d.demo, d.dur); }
    else {
      if (d.pre) sim(d.pre, d.preDur);
      if (solvedNow && d.runFn) sim(d.runFn, d.run);
    }
    if (d.show && showEnd) Object.assign(X, d.end || {});
    else if (!d.show && solvedNow) Object.assign(X, d.runEnd || {});
    TM.lastMove = -99;
    snapD();
  }
  function startDemo(i) {
    const d = STEPS[i];
    anim.pause(); held = false;
    if (d.demo && !quiet()) { prep(i, false, false); scripted = true; motionEnd = d.dur; T = 0; d.demo(0); snapD(); anim.play(); }
    else { scripted = false; T = Infinity; prep(i, false, true); }
    push();
  }
  function playRun(i, dur) {
    const d = STEPS[i];
    anim.pause(); scripted = false; held = false;
    if (quiet() || !dur) {
      T = Infinity;
      if (solved(S[i]) && d.runFn && dur) sim(d.runFn, dur);
      if (solved(S[i])) Object.assign(X, d.runEnd || {});
      push(); snapD(); return;
    }
    T = 0; motionEnd = dur; anim.play();
  }
  function enterStep(i) {
    const d = STEPS[i];
    anim.pause(); T = Infinity; scripted = false; held = false;
    enter('stepbox');
    if (d.show) { startDemo(i); return; }
    prep(i, solved(S[i]), false);
    push();
  }
  // The finished picture a still shows (the read-through), with the controls where its words end.
  function setStill() {
    const i = at();
    anim.pause(); T = Infinity; scripted = false; held = true;
    prep(i, true, true);
    push();
    K.refresh();
  }
  function enter(id) {
    if (REDUCE) return;
    const box = el(id);
    box.classList.remove('enter');
    void box.offsetWidth;
    box.classList.add('enter');
  }
  // Dan's own move of a control this screen shows.
  function setFrom(id, v) {
    if (id === 'mode') { setMode(v); if (quiet() && v === 'dc') sim(() => {}, CLIMB + 1.2); return; }
    if (id === 'cur') {
      const old = X.cur;
      if (quiet()) sim((t) => { X.cur = old + (v - old) * Math.min(1, t); }, 2.5);
      X.cur = v; TM.lastMove = TM.clock;
      return;
    }
    X[id] = v;
  }

  // ================= drawing helpers =================
  const svg = el('scene'), art = el('art');
  const add = (node, par) => (par || art).appendChild(node);
  const r1 = (v) => Math.round(v * 10) / 10;
  const twCache = {};
  function tw(s, cls) {
    const key = (cls || 'lab') + '|' + s;
    if (twCache[key]) return twCache[key];
    let w = 0;
    try { const t = svg.appendChild(K.svg('text', { class: cls || 'lab', x: 0, y: -50 }, s)); w = t.getComputedTextLength(); svg.removeChild(t); } catch (e) { w = 0; }
    if (!(w > 0)) return s.length * 7.6;
    twCache[key] = w;
    return w;
  }
  function pill(cx, y, s, par) {
    const w = tw(s) + 12, h = 20; cx = K.clamp(cx, w / 2 + 2, 338 - w / 2);
    const g = add(K.svg('g'), par);
    g.appendChild(K.svg('rect', { class: 'pill', x: r1(cx - w / 2), y: r1(y - h / 2), width: r1(w), height: h, rx: 6 }));
    g.appendChild(K.svg('text', { class: 'lab', x: r1(cx), y: r1(y + 4.5), 'text-anchor': 'middle' }, s));
    return g;
  }
  function text(par, x, y, s, cls, anchor) { return add(K.svg('text', { class: cls || 'lab', x: r1(x), y: r1(y), 'text-anchor': anchor || 'start' }, s), par); }
  const ptsS = (pts) => pts.map((p) => r1(p[0]) + ',' + r1(p[1])).join(' ');
  const line = (par, cls, x1, y1, x2, y2) => add(K.svg('line', { class: cls, x1: r1(x1), y1: r1(y1), x2: r1(x2), y2: r1(y2) }), par);
  const poly = (par, cls, pts) => add(K.svg('polyline', { class: cls, points: ptsS(pts) }), par);
  // An upright arrow centred at yc: dir +1 points up, −1 down.
  function arrowV(x, yc, len, dir, cls, hcls, hs) {
    const tip = yc - dir * len / 2, tail = yc + dir * len / 2;
    line(null, cls, x, tail, x, tip + dir * hs * 0.9);
    add(K.svg('polygon', { class: hcls, points: ptsS([[x, tip], [x - hs * 0.85, tip + dir * hs * 1.4], [x + hs * 0.85, tip + dir * hs * 1.4]]) }));
  }
  function keyRow(items, y) {
    const sw = 18, gapT = 6, sp = 12;
    const widths = items.map((it) => sw + gapT + tw(it.t, 'key'));
    let x = Math.max(4, (340 - widths.reduce((a, b) => a + b, 0) - sp * (items.length - 1)) / 2);
    items.forEach((it, k) => {
      add(K.svg('line', { class: it.cls + ' sw', x1: r1(x), y1: y - 4.5, x2: r1(x + sw), y2: y - 4.5 }));
      add(K.svg('text', { class: 'key', x: r1(x + sw + gapT), y }, it.t));
      x += widths[k] + sp;
    });
  }

  // ================= what the picture shows now =================
  function stateNow() {
    const a = acOf(X.f, X.n, X.fix);
    if (X.mode === 'ac') {
      const c = Math.cos(TM.th), phi = D.phim * Math.sin(TM.th);
      return { a, phi, I: phi * REL / X.n, meter: null, needle: 0.9 * c, changing: Math.abs(c) > 0.1, dir: Math.sign(c) };
    }
    const I = Iat(TM.clock), m = meterAt(TM.clock), nd = X.mode === 'dc' ? m / KICK : m;
    const changing = X.mode === 'dc' ? Math.abs(nd) > 0.02 : Math.abs(m) >= 0.005;
    return { a, phi: phiOf(I), I, meter: m, needle: K.clamp(nd, -1, 1), changing, dir: changing ? Math.sign(m) : 0 };
  }

  // ================= the ring, its coils, the bars and the traces =================
  const RX = 96, RY = 34, RS = 148, RT = 28;
  const BX0 = 70, BW = 230, BC = BX0 + BW / 2, HALF = BW / 2;
  const PX0 = 44, PX1 = 326, NPT = 120;
  function plot(top, h, scale, ticks, vals, cls, fmtT) {
    const yc = top + h / 2, Y = (v) => yc - K.clamp(v / scale, -1, 1) * h / 2;
    line(null, 'zero', PX0, yc, PX1, yc);
    line(null, 'ax', PX0, top, PX0, top + h);
    text(null, PX0 - 6, yc + 4.5, '0', 'tk', 'end');
    ticks.forEach((v) => { line(null, 'ax', PX0 - 4, Y(v), PX0, Y(v)); text(null, PX0 - 6, Y(v) + 4.5, fmtT(v), 'tk', 'end'); });
    poly(null, cls, vals.map((v, k) => [PX0 + (PX1 - PX0) * k / (vals.length - 1), Y(v)]));
  }
  const tick = (v) => (v < 0 ? MINUS : '') + Math.abs(v);

  function drawScene() {
    const s = stateNow(), m = X.mode, R = { mode: m, s, arrows: { main: 0, chg: 0, sec: 0 }, sat: false, red: false };
    // The coils' names.
    text(null, 48, 24, 'primary', 'lab', 'middle');
    text(null, 48, 40, (m === 'ac' ? X.n : N1) + NB + 'turns', 'lab', 'middle');
    text(null, 292, 24, 'secondary', 'lab', 'middle');
    text(null, 292, 40, N2 + NB + 'turns', 'lab', 'middle');
    // The iron ring.
    add(K.svg('rect', { class: 'iron', x: RX, y: RY, width: RS, height: RS, rx: 18 }));
    add(K.svg('rect', { class: 'hole', x: RX + RT, y: RY + RT, width: RS - 2 * RT, height: RS - 2 * RT, rx: 6 }));
    // The primary: its supply and its turns on the left limb.
    poly(null, 'wire', [[90, 68], [48, 68], [48, 94]]);
    poly(null, 'wire', [[90, 148], [48, 148], [48, 122]]);
    add(K.svg('circle', { class: 'dev', cx: 48, cy: 108, r: 14 }));
    text(null, 48, 113.5, m === 'hand' ? 'I' : m === 'ac' ? '~' : '=', 'ttl', 'middle');
    text(null, 48, 170, m === 'hand' ? 'by hand' : m === 'ac' ? (X.fix ? '440' + NB + 'V AC' : 'AC') : '24' + NB + 'V DC', 'lab', 'middle');
    for (let k = 0; k < 9; k++) add(K.svg('rect', { class: 'turn', x: 89, y: 65 + k * 10, width: 42, height: 6, rx: 3 }));
    // The secondary: its turns on the right limb, a voltmeter and a lamp behind a switch across it.
    for (let k = 0; k < 3; k++) add(K.svg('rect', { class: 'turn', x: 209, y: 119 + k * 15, width: 42, height: 6, rx: 3 }));
    poly(null, 'wire', [[251, 122], [258, 122], [258, 96], [322, 96], [322, 103.4]]);
    poly(null, 'wire', [[251, 152], [258, 152], [258, 176], [322, 176], [322, 155]]);
    line(null, 'wire', 284, 96, 284, 118);
    line(null, 'wire', 284, 154, 284, 176);
    add(K.svg('circle', { class: 'dev', cx: 284, cy: 136, r: 18 }));
    line(null, 'mid', 284, 119, 284, 123);
    const na = s.needle * 50 * Math.PI / 180;
    line(null, 'needle', 284, 146, 284 + 21 * Math.sin(na), 146 - 21 * Math.cos(na));
    add(K.svg('circle', { class: 'pivot', cx: 284, cy: 146, r: 2.6 }));
    text(null, 272, 88, 'meter', 'lab', 'middle');
    const lit = X.lamp ? Math.abs(s.needle) : 0;
    add(K.svg('circle', { class: 'term0', cx: 322, cy: 106, r: 2.6 }));
    add(K.svg('circle', { class: 'term0', cx: 322, cy: 122, r: 2.6 }));
    line(null, 'wire', 322, 122, X.lamp ? 322 : 333, X.lamp ? 106 : 111);
    line(null, 'wire', 322, 124.6, 322, 135);
    if (lit > 0.02) { const h = add(K.svg('circle', { class: 'glow', cx: 322, cy: 145, r: 16 })); h.setAttribute('opacity', Math.round(lit * 60) / 100); }
    add(K.svg('circle', { class: 'dev', cx: 322, cy: 145, r: 10 }));
    if (lit > 0.02) { const g = add(K.svg('circle', { class: 'glow', cx: 322, cy: 145, r: 10 })); g.setAttribute('opacity', Math.round(lit * 100) / 100); }
    line(null, 'wire', 315, 138, 329, 152);
    line(null, 'wire', 329, 138, 315, 152);
    text(null, 322, 88, 'lamp', 'lab', 'middle');
    R.lit = lit;
    // The arrows, on the secondary's limb: the main flux in the core, the way it is changing, the lamp current's own field.
    const FS = m === 'hand' ? 0.006 : 0.011;
    const fr = K.clamp(s.phi / FS, -1, 1);
    if (Math.abs(fr) > 0.04) { arrowV(230, 76, 14 + 42 * Math.abs(fr), Math.sign(fr), 'main', 'mainh', 7); R.arrows.main = Math.sign(fr); }
    if (s.changing) {
      arrowV(205, 90, 28, s.dir, 'chg', 'chgh', 5); R.arrows.chg = s.dir;
      if (X.lamp) { arrowV(188, 90, 34, -s.dir, 'sec', 'sech', 5); R.arrows.sec = -s.dir; }
    }
    // The flux bar (on DC it runs off its scale).
    const fb = m === 'dc' ? PER_A * s.I / FS : s.phi / FS;
    text(null, 62, 214, 'Flux', 'lab', 'end');
    add(K.svg('rect', { class: 'bar', x: BX0, y: 205, width: BW, height: 10, rx: 3 }));
    const fl = K.clamp(fb, -1, 1) * HALF;
    if (Math.abs(fl) > 0.3) add(K.svg('rect', { class: 'bfill', x: r1(Math.min(BC, BC + fl)), y: 205, width: r1(Math.abs(fl)), height: 10 }));
    line(null, 'mid', BC, 202, BC, 218);
    R.sat = m === 'dc' && fb >= 1;
    if (R.sat) { add(K.svg('polygon', { class: 'bfill', points: ptsS([[BX0 + BW + 9, 210], [BX0 + BW + 1, 203], [BX0 + BW + 1, 217]]) })); pill(262, 192, 'Saturated'); }
    if (m === 'ac') { const x = BC + HALF * PHI_OFF / FS; line(null, 'mark', x, 201, x, 219); text(null, x, 197, '5.5' + NB + 'mWb', 'key', 'middle'); }
    // The primary's current bar (on DC it runs red past the 2.2 A it peaks at on AC).
    const CS = m === 'hand' ? 2.5 : 6;
    text(null, 62, 238, 'Current', 'lab', 'end');
    add(K.svg('rect', { class: 'bar', x: BX0, y: 229, width: BW, height: 10, rx: 3 }));
    const ci = K.clamp(s.I / CS, -1, 1) * HALF;
    if (m === 'dc') {
      const xa = BC + HALF * ACPK / CS, blue = Math.min(ci, xa - BC);
      if (blue > 0.3) add(K.svg('rect', { class: 'bfill', x: BC, y: 229, width: r1(blue), height: 10 }));
      R.red = ci > xa - BC + 0.3;
      if (R.red) add(K.svg('rect', { class: 'bwarn', x: r1(xa), y: 229, width: r1(ci - (xa - BC)), height: 10 }));
      if (s.I > CS) add(K.svg('polygon', { class: 'bwarn', points: ptsS([[BX0 + BW + 9, 234], [BX0 + BW + 1, 227], [BX0 + BW + 1, 241]]) }));
      line(null, 'mark', xa, 225, xa, 243);
      text(null, xa, 258, 'AC peak 2.2' + NB + 'A', 'key', 'middle');
    } else if (Math.abs(ci) > 0.3) add(K.svg('rect', { class: 'bfill', x: r1(Math.min(BC, BC + ci)), y: 229, width: r1(Math.abs(ci)), height: 10 }));
    line(null, 'mid', BC, 226, BC, 242);
    // The key to the arrows.
    const items = [{ cls: 'main', t: 'main flux' }, { cls: 'chg', t: 'its change' }];
    if (X.lamp) items.push({ cls: 'sec', t: 'secondary\'s field' });
    keyRow(items, 280);
    R.key = items.map((it) => it.t);
    // The traces against time, now at the right.
    const vf = [], ve = [];
    if (m === 'ac') {
      const w = 2 * Math.PI * X.f / (60 * SLOW), Epk = Math.SQRT2 * 4.44 * X.f * X.n * D.phim;
      for (let k = 0; k < NPT; k++) { const th = TM.th - w * SPAN_AC * (1 - k / (NPT - 1)); vf.push(D.phim * 1e3 * Math.sin(th)); ve.push(Epk * Math.cos(th)); }
    } else {
      for (let k = 0; k < NPT; k++) { const t = TM.clock - SPAN * (1 - k / (NPT - 1)); vf.push(phiOf(Iat(t)) * 1e3); ve.push(meterAt(t)); }
    }
    text(null, 4, 300, 'Flux in the core, Φ (mWb)', 'axt');
    plot(308, 54, m === 'hand' ? 6 : 11, m === 'hand' ? [-5, 5] : [-10, 10], vf, 'tr', tick);
    text(null, 4, 384, m === 'ac' ? 'The primary\'s emf (V)' : m === 'dc' ? 'The meter on the secondary' : 'The meter on the secondary (V)', 'axt');
    plot(392, 54, m === 'hand' ? 1.2 : m === 'ac' ? 800 : KICK * 1.15, m === 'hand' ? [-1, 1] : m === 'ac' ? [-500, 500] : [], ve, 'tr2', tick);
    text(null, PX0, 458, '← earlier', 'key');
    text(null, PX1, 458, 'now', 'key', 'end');
    R.trace = { flux: vf, emf: ve };
    // What it shows, in words (no readout's number).
    const grow = s.dir * (Math.abs(s.phi) > 1e-6 ? Math.sign(s.phi) : s.dir) > 0;
    let said;
    if (m === 'ac') said = 'On AC the flux in the core swings as a sine, and the emf trace follows its slope, peaking as the flux crosses zero.' + (X.fix ? ' The supply is fixed, so the flux swings just far enough to match it.' : '');
    else if (m === 'dc') said = s.changing ? 'On DC the primary\'s current climbs, and the meter kicks while the flux rises.' : 'On DC the primary\'s current has settled far past its AC peak, and the core is saturated. The flux is steady, so the meter reads zero.';
    else said = 'Two coils on one iron ring, with no wire between them. ' + (s.changing ? 'The flux in the core is ' + (grow ? 'growing' : 'shrinking') + ', so the meter on the secondary reads.' : 'The flux in the core is steady, so the meter on the secondary reads zero.');
    if (X.lamp) said += s.changing ? ' The lamp lights, and its current\'s field points ' + (grow ? 'against the main flux.' : 'with the main flux, holding it up.') : ' The lamp\'s switch is closed, but nothing is changing, so the lamp is dark.';
    REC.said.push(said + ' Below, the flux trace and the ' + (m === 'ac' ? 'emf' : 'meter') + ' trace run against time.');
    Object.assign(REC, R);
  }

  // ================= one paint =================
  function paint(i) {
    if (i == null) i = at();
    const d = STEPS[i];
    art.textContent = '';
    REC = { said: [], readouts: {} };
    drawScene();
    svg.setAttribute('aria-label', REC.said.join(' '));
    el('work').hidden = finished || !d.work || X.mode !== 'ac';
    readouts();
  }
  function readouts() {
    const m = X.mode, a = acOf(X.f, X.n, X.fix), s = REC.s;
    el('o-hand').hidden = m !== 'hand';
    el('o-ac').hidden = m !== 'ac';
    el('o-dc').hidden = m !== 'dc';
    if (m === 'hand') { RO.i.set(X.cur); RO.phi.set(PER_A * X.cur); RO.m.set(Math.abs(s.meter) < 0.005 ? 0 : s.meter); }
    else if (m === 'ac') { RO.E.set(a.E); RO.pk.set(a.phim); RO.ipk.set(a.ipk); }
    else { const I = dcI(TM.dcT); RO.idc.set(I); RO.heat.set(I * I * RDC); }
    Object.keys(RO).forEach((k) => { REC.readouts[k] = RO[k].text(); });
  }

  // ================= the page around the picture =================
  write(el('finish'), FINISH);
  ['Half a cycle lasts 1 ÷ 2f, and the flux swings 2Φm in it.', 'Average emf per turn: 2Φm × 2f = 4 f Φm.', 'Form factor: 0.707 ÷ 0.637 = 1.11. So 4 × 1.11 = 4.44.', 'Check: 2π ÷ √2 = 4.443.']
    .forEach((s) => { const p = K.el('p'); write(p, s); el('work').appendChild(p); });
  function layout(i) {
    const d = STEPS[i], st = S[i], sol = solved(st);
    el('stepbox').hidden = finished;
    el('done').hidden = !finished;
    el('count').textContent = 'Screen ' + (i + 1) + ' of ' + STEPS.length;
    const task = el('task');
    task.className = 'task' + (d.show ? ' show' : '');
    write(task, d.show ? d.text : d.task);
    layoutCtl(d);
    replayBtn.el.hidden = !d.show || !d.demo || REDUCE;
    el('replay').hidden = replayBtn.el.hidden;
    const opts = d.kind === 'pick' ? d.opts : [];
    el('picks').hidden = !opts.length;
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      if (b.el.textContent !== opts[k]) b.setLabel(opts[k]);
      b.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });
    el('answers').hidden = d.kind !== 'typed';
    Object.keys(ANS).forEach((key) => { el('ans-' + key).hidden = d.ans !== key; });
    el('acts').hidden = !!d.show;
    checkBtn.el.hidden = sol;
    const fb = el('fb');
    fb.hidden = !!d.show;
    fb.className = 'fb' + (st.res === 'right' ? ' right' : '');
    let say = '';
    if (!d.show) {
      if (st.res === 'right') say = d.right || 'That\'s it.';
      else if (st.res === 'shown') say = 'Here is the working.';
      else if (st.res === 'wrong') say = d.kind === 'typed' ? st.hint : (d.hints && d.hints[st.pick]) || d.hint;
      else if (st.res === 'empty' && d.kind === 'pick') say = 'Pick one of the answers first.';
    }
    write(fb, say);
    const why = el('why');
    why.hidden = d.show || !st.why;
    write(why, d.show ? '' : d.why);
    whyBtn.setLabel(st.why ? 'Hide why' : 'Why?');
    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !sol);
    nextBtn.setLabel(i === STEPS.length - 1 ? 'Finish' : 'Continue');
    el('nav').hidden = backBtn.el.hidden && nextBtn.el.hidden;
  }

  K.update((p) => {
    const i = at(), d = STEPS[i];
    if (i !== lastStep) { lastStep = i; enterStep(i); }
    else {
      let moved = false;
      CTL_IDS.forEach((id) => {
        if (p[id] === pushed[id]) return;
        if (shownCtl(d, id) && usable(id)) {
          if (T !== Infinity) { anim.pause(); T = Infinity; scripted = false; }   // his move ends the demonstration where it stands
          setFrom(id, p[id]); pushed[id] = p[id]; moved = true;
        } else CTL[id].set(pushed[id], true);      // a control this screen does not use stays put
      });
      if (moved) { held = false; push(); }
    }
    if (finished !== lastDone) { lastDone = finished; enter(finished ? 'done' : 'stepbox'); }
    if (quiet()) snapD();
    layout(i);
    paint(i);
    kick();
  });

  // ================= known answers, worked out by hand =================
  const idx = (name) => STEPS.findIndex((d) => d.name === name);
  const near = (a, b, t) => Math.abs(a - b) <= t;
  const solvedSt = (i) => Object.assign(blank(), STEPS[i].kind === 'pick' ? { pick: STEPS[i].want, res: 'right' } : { res: 'right' });
  // A screen painted in the state given (finished), with optional settings and a motion of its own: what it drew.
  function drawn(i, st, x, fn) {
    const keep = { X: Object.assign({}, X), TM: Object.assign({}, TM, { hist: TM.hist.slice() }), D: Object.assign({}, D), S: S[i], T, sc: scripted, held };
    S[i] = st || blank(); T = Infinity; scripted = false; held = true;
    try {
      prep(i, solved(S[i]), true);
      if (x) Object.assign(X, x);
      if (fn) fn();
      snapD();
      paint(i);
      return REC;
    } finally {
      Object.assign(X, keep.X); Object.assign(TM, keep.TM); Object.assign(D, keep.D); S[i] = keep.S; T = keep.T; scripted = keep.sc; held = keep.held; paint();
    }
  }
  const iMove = idx('Move the flux'), iHold = idx('Hold it still'), iAgainst = idx('Against the change'), iFall = idx('A falling flux');
  const iAC = idx('Switch to AC'), iEmf = idx('Volts from flux'), iFix = idx('Fix the voltage'), iTurns = idx('More turns');
  const iDC = idx('Switch to DC'), iSteady = idx('Steady current'), iRise = idx('A steady rise'), iFreq = idx('A lower frequency');
  const V_ = (s) => s + NB + 'V', MWB = (s) => s + NB + 'mWb';

  K.check('With an unchanging flux there is no induced emf: held at 2 A, with 5 mWb in the core, the meter reads 0.00 V, while a drag from 0 to 2 A in 1 s reads 0.50 V', () => {
    const heldAt2 = drawn(iMove), moving = drawn(iHold, blank());
    return heldAt2.readouts.m === V_('0.00') && heldAt2.readouts.phi === MWB('5') && heldAt2.readouts.i === '2.00' + NB + 'A' && moving.readouts.m === V_('0.50') && near(PER_A, 0.0025, 1e-12);
  }, { source: SRC1 });
  K.check('Faster reads more: 0 to 2 A in 0.5 s reads 1.00 V, twice the 1 s drag, and a fall from 2 A to 1 A in 2 s reads the other way, 0.125 V', () => {
    const fast = drawn(iMove, null, null, () => { resetTime(); sim((t) => { X.cur = ramp(t, 0, 0.5, 0, 2); }, 0.5); });
    const fall = drawn(iAgainst);
    return fast.readouts.m === V_('1.00') && near(fall.s.meter, -0.125, 1e-6);
  });
  K.check('The secondary\'s own field always points against the change: against a rising flux, with a falling one, and gone while the flux is still', () => {
    const rise = drawn(iAgainst, null, null, () => { resetTime(); sim((t) => { X.cur = ramp(t, 0, 1.5, 0, 1.5); }, 1.5); });
    const fall = drawn(iAgainst), still = drawn(iFall, blank());
    return rise.arrows.main === 1 && rise.arrows.chg === 1 && rise.arrows.sec === -1 && rise.lit > 0 &&
      fall.arrows.main === 1 && fall.arrows.chg === -1 && fall.arrows.sec === 1 &&
      still.arrows.main === 1 && still.arrows.chg === 0 && still.arrows.sec === 0 && still.lit === 0;
  });
  K.check('E = 4.44 f N Φm gives a definite relation between a coil\'s voltage and its core\'s flux: 60 Hz, 300 turns and 5.5 mWb give 440 V, and 330 turns give 484 V', () => {
    const a = drawn(iAC, null, { f: 60, n: 300, fix: false }).readouts, b = drawn(iAC, null, { f: 60, n: 330, fix: false }).readouts;
    return a.E === V_('440') && a.pk === MWB('5.5') && a.ipk === '2.20' + NB + 'A' && b.E === V_('484');
  }, { source: SRC2 });
  K.check('With the supply fixed at 440 V the flux follows f and N: 5.5 mWb and 2.20 A at 60 Hz and 300 turns, 5.0 mWb and 1.82 A at 330 turns, 6.6 mWb and 2.64 A at 50 Hz, 20% more', () => {
    const r = (f, n) => drawn(iFix, null, { fix: true, f, n }).readouts;
    const a = r(60, 300), b = r(60, 330), c = r(50, 300);
    return a.E === V_('440') && a.pk === MWB('5.5') && a.ipk === '2.20' + NB + 'A' && b.E === V_('440') && b.pk === MWB('5.0') && b.ipk === '1.82' + NB + 'A' &&
      c.pk === MWB('6.6') && c.ipk === '2.64' + NB + 'A' && near(acOf(50, 300, true).phim / acOf(60, 300, true).phim, 1.2, 1e-9);
  });
  K.check('Where 4.44 comes from: the form factor 0.707 ÷ 0.637 is 1.11, 4 × 1.11 = 4.44, and 2π ÷ √2 = 4.443; the emf trace peaks where the flux trace crosses zero', () => {
    const tr = drawn(iAC).trace, k0 = tr.emf.reduce((b, v, k) => (Math.abs(v) > Math.abs(tr.emf[b]) ? k : b), 0);
    return near(FF, 1.11, 0.005) && near(4 * FF, 4.44, 0.005) && near(2 * Math.PI / Math.SQRT2, 4.443, 0.0005) && Math.abs(tr.flux[k0]) < 0.6;
  });
  K.check('A transformer cannot change a DC voltage: on 24 V DC the current settles at 48 A, the flux holds steady and the meter reads 0 V', () => {
    const r = drawn(iDC);
    return r.readouts.idc === '48' + NB + 'A' && near(r.s.meter, 0, 1e-9) && r.arrows.chg === 0 && r.sat && r.red;
  }, { source: SRC3 });
  K.check('On DC the meter kicks only while the current climbs, and the settled winding turns 24 × 48 = 1152 W into heat, with 48 A over 20 times the 2.2 A AC peak', () => {
    const climbing = drawn(iDC, null, null, () => { resetTime(); sim(() => {}, 0.3); }), r = drawn(iDC);
    return climbing.arrows.chg === 1 && climbing.s.needle > 0.02 && r.readouts.heat === '1152' + NB + 'W' && near(VDC * IDC, 1152, 1e-9) && IDC / ACPK > 20 && near(ACPK, 2.2, 1e-12);
  });
  K.check('Each typed answer and slip is worked from its rule: 0 V (0.5, 1), 178 V (40, 160, 251), 5.0 mWb (6.1, 5.5, 0.005), 60 A (0, 9.6), 0.6 V (0.3, 0.15, 0.006) and 6.6 mWb (4.6, 5.5, 0.0066)', () => {
    const sl = (i, v) => STEPS[i].slips.length === v.length && STEPS[i].slips.every((s, k) => near(s.value, v[k], 1e-12));
    const work = near(4.44 * 50 * 200 * 0.004, 177.6, 1e-9) && near(50 * 200 * 0.004, 40, 1e-9) && near(4 * 50 * 200 * 0.004, 160, 1e-9) && near(177.6 * Math.SQRT2, 251, 0.5) &&
      near(acOf(60, 330, true).phim * 1e3, 5.0, 0.05) && near(5.5 * 1.1, 6.1, 0.05) && near(24 / 0.4, 60, 1e-9) && near(24 * 0.4, 9.6, 1e-9) &&
      near(100 * 0.003 / 0.5, 0.6, 1e-9) && near(100 * 0.003, 0.3, 1e-9) && near(100 * 0.003 * 0.5, 0.15, 1e-9) && near(0.003 / 0.5, 0.006, 1e-12) &&
      near(acOf(50, 300, true).phim * 1e3, 6.6, 0.05) && near(5.5 * 50 / 60, 4.6, 0.05) && near(N2 * PER_A * 2, 0.5, 1e-12);
    return work && STEPS[iHold].answer === 0 && STEPS[iEmf].answer === 178 && STEPS[iTurns].answer === 5.0 && STEPS[iSteady].answer === 60 && STEPS[iRise].answer === 0.6 && STEPS[iFreq].answer === 6.6 &&
      sl(iHold, [0.5, 1]) && sl(iEmf, [40, 160, 251]) && sl(iTurns, [6.1, 5.5, 0.005]) && sl(iSteady, [0, 9.6]) && sl(iRise, [0.3, 0.15, 0.006]) && sl(iFreq, [4.6, 5.5, 0.0066]);
  });
  K.check('Before a Check no puzzle shows its answer, and a right Check shows it: the meter falls from 0.50 V to 0.00 V, the falling flux brings the dashed field up, a steady rise reads 0.60 V, and the peak flux moves from 5.5 mWb to 5.0 mWb and to 6.6 mWb', () => {
    const b = (i) => drawn(i, blank()), s = (i) => drawn(i, solvedSt(i));
    return b(iHold).readouts.m === V_('0.50') && s(iHold).readouts.m === V_('0.00') &&
      b(iFall).arrows.sec === 0 && s(iFall).arrows.sec === 1 &&
      b(iRise).readouts.m === V_('0.00') && s(iRise).readouts.m === V_('0.60') &&
      b(iTurns).readouts.pk === MWB('5.5') && s(iTurns).readouts.pk === MWB('5.0') &&
      b(iFreq).readouts.pk === MWB('5.5') && s(iFreq).readouts.pk === MWB('6.6') && b(iSteady).readouts.idc === '48' + NB + 'A';
  });
  K.check('Every demonstration ends 3 to 4.5 s after its screen opens, and every answer\'s motion within 2.5 s', () =>
    STEPS.every((d) => d.show ? (d.dur >= 3 && d.dur <= 4.5) : (!d.run || d.run <= 2.5)));
  K.ready();
</script>
