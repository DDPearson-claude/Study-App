<p class="caption">A 10&#160;kVA, 440&#160;V to 115&#160;V transformer, seen from its 115&#160;V side. Every value is an example.</p>

<script>
  // ================= the rules =================
  const strip = (s) => s.replace(/\[\^\d+\]/g, '');
  const NB = ' ';
  const VS = 115, SR = 10000, IRATED = SR / VS;      // the example: 10 kVA at 115 V, so 86.96 A at full load
  const RSH = 0.8, XSH = 0.6;                        // R% = 0.8 × Z% and X% = 0.6 × Z%: 4% and 3% at 5%
  const SRC1 = 'https://eepower.com/technical-articles/calculating-voltage-regulation-in-transformers';
  const SRC2 = 'https://www.ecmweb.com/basics/article/20897056/basic-short-circuit-current-calculation';
  const SRC3 = 'https://www.rexpowermagnetics.com/knowledge-hub/impedance-in-transformers-key-concepts-and-calculations';
  const PFS = ['0.5 lag', '0.6 lag', '0.8 lag', '1.0', '0.8 lead', '0.6 lead', '0.5 lead'];
  // The load angle: positive lagging, negative leading, 0 at unity.
  const phiOf = (k) => (/lag/.test(k) ? 1 : /lead/.test(k) ? -1 : 0) * Math.acos(parseFloat(k));

  // The drawing's form: the output lies along the axis; from its tip the I × R drop points along the current
  // (at −φ) and the I × X drop a quarter-turn ahead of it; the last tip must sit on the 115 V circle.
  function geom(load, phi, z) {
    const x = load / 100, rp = RSH * z, xp = XSH * z;
    const ir = rp / 100 * VS * x, ix = xp / 100 * VS * x;
    const R = [ir * Math.cos(phi), -ir * Math.sin(phi)];
    const Q = [ix * Math.sin(phi), ix * Math.cos(phi)];
    const dx = R[0] + Q[0], dy = R[1] + Q[1];
    return { x, rp, xp, ir, ix, R, Q, dx, dy, out: Math.sqrt(VS * VS - dy * dy) - dx };
  }
  // The lesson's form: the whole drop d points α = (windings' angle − φ) from the output.
  function rule(load, pfKey, z) {
    const phi = phiOf(pfKey), g = geom(load, phi, z);
    const d = Math.hypot(g.ir, g.ix), alpha = Math.atan2(g.xp, g.rp) - phi;
    const out = Math.sqrt(VS * VS - Math.pow(d * Math.sin(alpha), 2)) - d * Math.cos(alpha);
    return { phi, d, alpha, ir: g.ir, ix: g.ix, out, reg: (VS - out) / VS * 100,
      quick: g.x * (g.rp * Math.cos(phi) + g.xp * Math.sin(phi)), fault: IRATED * 100 / z };
  }
  const one = (v) => { const s = (Math.round(v * 10) / 10).toFixed(1); return /^-0\.0$/.test(s) ? '0.0' : s.replace(/^-/, '−'); };
  const fV = (v) => v.toFixed(2) + NB + 'V';
  const fP = (v) => one(v) + '%';
  const fA = (v) => String(Math.round(v)) + NB + 'A';

  // ================= the lesson: SHOW screens demonstrate, DO screens are puzzles =================
  const ramp = (t, t0, dur, a, b) => a + (b - a) * K.clamp((t - t0) / dur, 0, 1);
  const r5 = (v) => Math.round(v / 5) * 5;
  const h5 = (v) => Math.round(v * 2) / 2;
  const PICK = ['8% gives less drop and less fault current', '4% gives less drop and less fault current',
    '4% gives less drop, 8% less fault current', '8% gives less drop, 4% less fault current'];
  const PRED = ['More than at unity', 'Less than at unity', 'The same as at unity'];
  const STEPS = [
    { kind: 'typed', name: 'Two at right angles', ans: 'tri', pic: 'tri', enter: {},
      answer: 10, decimals: 0, unit: 'V', want: '10' + NB + 'V',
      slips: [{ value: 14, hint: 'That adds them straight. At right angles they add like a triangle\'s sides.' },
        { value: 2, hint: 'That takes one from the other. They are at right angles, not opposed.' }],
      task: 'Two voltages in series: 6 V at 0° and 8 V at 90°. What is their total size?',
      hint: 'Square each, add, then take the root.',
      why: '√(6² + 8²) = √100 = 10 V. The drops inside a transformer add the same way.',
      right: 'Still there.',
      read: 'Two voltages in series are 6 V at 0° and 8 V at 90°. What is their total size?' },
    { show: true, name: 'Loading', ctl: ['load'], ro: [], enter: { load: 0 }, end: { load: 100 }, dur: 4.0,
      demo: (t) => { X.load = r5(ramp(t, 0.6, 2.8, 0, 100)); },
      text: 'Loading shortens the output. Off load there is no load current, so the windings drop almost nothing. The output reaches the 115 V circle. Drag the load up. The current drops a voltage across the windings\' resistance, in line with the current. It drops another across their reactance, a quarter-turn ahead of it. Both sit tip to tail on the output arrow. The supply fixes the circle. So the output must shorten to keep the last tip on it.',
      read: 'Off load the output reaches the 115 V circle. On load, two drops sit tip to tail on the output arrow. One is across the windings\' resistance, the other across their reactance. The last tip stays on the circle, so the output shortens.',
      still: () => setStill() },
    { kind: 'typed', name: 'Full load, unity', ans: 'out', hide: ['out'], ro: ['out'], enter: {},
      answer: 110.35, decimals: 2, unit: 'V', want: '110.35' + NB + 'V',
      slips: [{ value: 106.95, hint: 'That takes both drops straight off. The 3.45 V is at right angles, so it costs little.' },
        { value: 109.25, hint: 'That takes the whole 5.75 V straight off. At unity the drop is not in line with the output.' },
        { value: 110.4, hint: 'That is close. Work the triangle to two decimal places.' }],
      task: 'At full load and unity power factor, the drop has two parts. It is 4.6 V in line with the output and 3.45 V at right angles to it. The supply\'s circle is 115 V. What is the output, to two decimal places?',
      hint: 'Make a right-angled triangle with 115 V as its long side. Its short sides are the output plus 4.6 V, and the 3.45 V across.',
      why: '√(115² − 3.45²) = 114.95 V along the axis. The 3.45 V across costs only 0.05 V. Take off the 4.6 V: 110.35 V.',
      read: 'At full load and unity power factor, the drop is 4.6 V in line with the output and 3.45 V across it. The arrows close on 115 V. What is the output, to two decimal places?' },
    { show: true, name: 'The deepest sag', ctl: ['pf'], ro: ['out', 'reg'], enter: {}, end: { pf: '0.8 lag' }, dur: 3.6,
      demo: (t) => { X.pf = t < 1.2 ? '1.0' : '0.8 lag'; },
      text: 'For this transformer, 0.8 lagging gives the deepest sag. The whole drop points 36.9° ahead of the current. That is the windings\' own angle, set by 3.45 against 4.6. Step the power factor to 0.8 lagging. The current swings back 36.9°, so the drop lines up with the output. The whole 5.75 V comes straight off, leaving 109.25 V. *Voltage regulation* is the sag as a share of the no-load voltage. Here it is 5.75 ÷ 115 = 5.0%.',
      read: 'At 0.8 lagging the drop lines up with the output. The whole 5.75 V comes off, leaving 109.25 V. Regulation is the sag as a share of the no-load voltage: 5.0%.',
      still: () => setStill() },
    { kind: 'typed', name: 'Regulation at unity', ans: 'reg1', hide: ['reg'], ro: ['out', 'reg'], enter: {},
      answer: 4.0, decimals: 1, unit: '%', want: '4.0%',
      slips: [{ value: 4.2, hint: 'That divides by the on-load 110.35 V. Regulation divides by the no-load 115 V.' },
        { value: 5.0, hint: 'That is the figure at 0.8 lagging. At unity the reactance drop points straight across, so it costs almost nothing.' }],
      task: 'At unity power factor the output is 110.35 V. At no load it is 115 V. What is the regulation?',
      hint: '(115 − 110.35) ÷ 115 × 100.',
      why: '4.65 ÷ 115 = 0.040, so 4.0%. It is less than at 0.8 lagging. Here the 3.45 V points across the output.',
      read: 'At unity power factor the output is 110.35 V against 115 V at no load. What is the regulation?' },
    { kind: 'pick', name: 'Predict: leading', enter: {}, ro: ['out'],
      opts: PRED, want: PRED[1],
      task: 'Before you see it, predict. At full load, will 0.8 leading sag more or less than unity?',
      hint: 'Leading swings the current forward, not back. The drop swings forward with it, away from the output.',
      hints: { [PRED[0]]: 'Leading swings the current forward, not back. The drop swings forward with it, away from the output.',
        [PRED[2]]: 'The drop swings with the current. So its part along the output changes too.' },
      why: 'A leading current swings the drop forward, away from the output. Less of the drop then lies along the output. So the output sags less than at unity.',
      read: 'Before you see it, predict. At full load, will 0.8 leading sag more or less than unity?' },
    { show: true, name: 'Leading', ctl: ['pf'], ro: ['out'], enter: {}, end: { pf: '0.5 lead' }, dur: 4.2,
      demo: (t) => { X.pf = t < 0.8 ? '1.0' : t < 2.0 ? '0.8 lead' : t < 3.2 ? '0.6 lead' : '0.5 lead'; },
      text: strip('A leading load raises the output.[^1] Step on to leading. The drop swings forward, so less of it lies along the output. At 0.8 leading the output is 113.26 V. That is a regulation of 1.5%. At 0.6 leading the drop points straight across. Past that it points back against the output. Soon the output passes 115 V to reach the circle. At 0.5 leading it is 115.55 V.'),
      read: 'With a leading load, less of the drop lies along the output, so the output rises. It is 113.26 V at 0.8 leading. Past 0.6 leading the drop points back. At 0.5 leading the output is 115.55 V, above no load.',
      still: () => setStill() },
    { kind: 'typed', name: 'Above no load', ans: 'reg2', hide: ['reg'], ro: ['out', 'reg'], enter: { pf: '0.5 lead' },
      answer: -0.5, decimals: 1, unit: '%', want: '−0.5%',
      slips: [{ value: 0.5, hint: 'The output rose above no load. So no-load minus on-load is negative.' }],
      task: 'At 0.5 leading the output reads 115.55 V. At no load it is 115 V. What is the regulation?',
      hint: '(115 − 115.55) ÷ 115 × 100.',
      why: '−0.55 ÷ 115 = −0.0048, so −0.5%. Negative regulation means the output rose on load.',
      read: 'At 0.5 leading the output is 115.55 V against 115 V at no load. What is the regulation?' },
    { show: true, name: 'A quick rule', ctl: ['pf'], ro: ['out', 'reg', 'quick'], enter: { pf: '0.8 lag' }, end: { pf: '0.8 lead' }, dur: 4.0,
      demo: (t) => { X.pf = t < 1.2 ? '0.8 lag' : t < 2.6 ? '1.0' : '0.8 lead'; },
      text: 'A quick rule counts only the parts of the drops along the output. I × R sits at φ to it, giving IR cos φ. I × X is a quarter-turn further on, giving IX sin φ. As shares, regulation ≈ R% cos φ + X% sin φ. Take sin φ as negative when leading. R% is also the full-load copper loss over the rating, since I²R ÷ VI = IR ÷ V. With R% at 4 and X% at 3, 0.8 leading gives 3.2 − 1.8 = 1.4%.',
      read: 'Regulation ≈ R% cos φ + X% sin φ, the parts of the two drops along the output. Take sin φ as negative when leading. R% is the full-load copper loss as a share of the rating. With R% at 4 and X% at 3, that gives 5.0% at 0.8 lagging and 1.4% at 0.8 leading.',
      still: () => setStill() },
    { kind: 'typed', name: 'Another transformer', ans: 'r9', pic: 'none', enter: {},
      answer: 3.0, decimals: 1, unit: '%', want: '3.0%',
      slips: [{ value: 4.5, hint: 'That adds them straight. Weight R% by cos φ and X% by sin φ.' },
        { value: 3.3, hint: 'That swaps them. R% goes with cos φ, which is 0.8.' },
        { value: -0.6, hint: 'That is the leading figure. Lagging, X% sin φ adds.' }],
      task: 'Another transformer has an R% of 1.5 and an X% of 3. What is its regulation at full load, 0.8 lagging?',
      hint: 'R% × 0.8 + X% × 0.6.',
      why: '1.5 × 0.8 = 1.2 and 3 × 0.6 = 1.8. Together that is 3.0%.',
      read: 'A transformer has an R% of 1.5 and an X% of 3. What is its regulation at full load, 0.8 lagging?' },
    { show: true, name: 'Percentage impedance', ctl: ['z'], ro: ['out', 'reg', 'fault'], enter: { pf: '0.8 lag' }, end: { z: 5 }, dur: 4.4,
      demo: (t) => { X.z = h5(t < 1.7 ? ramp(t, 0.5, 1.0, 5, 2.5) : t < 3.3 ? ramp(t, 1.9, 1.2, 2.5, 8) : ramp(t, 3.4, 0.8, 8, 5)); },
      text: strip('One impedance sets both the sag and the fault current. *Percentage impedance* is the share of rated voltage that drives rated current through a shorted secondary. Last lesson\'s short-circuit test measured it: 22.0 V of 440 V, so 5%. Full voltage on that short drives 100 ÷ 5 = 20 times rated current.[^2] Rated current is 86.96 A. With a stiff supply, a short at the terminals draws 1739 A. Drag the impedance down. The drops shrink and the output holds up, but the fault bar grows.[^3]'),
      read: 'Percentage impedance is the share of rated voltage that drives rated current through a short. Here it is 5%. So with a stiff supply, full voltage drives 20 times rated current, 1739 A. A lower impedance gives less drop and more fault current.',
      still: () => setStill() },
    { kind: 'typed', name: 'A 4% unit', ans: 'fc', pic: 'none', enter: {},
      answer: 4348, decimals: 0, accept: [4350], unit: 'A', want: '4348' + NB + 'A',
      slips: [{ value: 696, hint: 'That multiplies by 4. Divide 100 by the impedance first.' },
        { value: 2174, hint: 'That is the figure for 10 kVA. Find this unit\'s own rated current first.' }],
      task: 'A 20 kVA, 115 V transformer has 4% impedance. What current flows into a dead short at its terminals?',
      hint: 'Rated current = 20,000 ÷ 115. Then multiply by 100 ÷ Z%.',
      why: '20,000 ÷ 115 = 173.91 A rated. 100 ÷ 4 = 25, and 173.91 × 25 = 4348 A. Twice the rating at the same impedance gives twice the fault current.',
      read: 'A 20 kVA, 115 V transformer has 4% impedance. What current flows into a dead short at its terminals?' },
    { kind: 'typed', name: 'Leading, another unit', ans: 'r12', pic: 'none', enter: {},
      answer: -0.8, decimals: 1, unit: '%', want: '−0.8%',
      slips: [{ value: 0.8, hint: 'When leading, sin φ counts as negative. So X% sin φ comes off.' },
        { value: 4.0, hint: 'That is the lagging figure. Leading, X% sin φ comes off.' },
        { value: -2.0, hint: 'That swaps them. R% goes with cos φ, which is 0.8.' }],
      task: 'A transformer has an R% of 2 and an X% of 4. What is its regulation at full load, 0.8 leading?',
      hint: '2 × 0.8 − 4 × 0.6.',
      why: '1.6 − 2.4 = −0.8%. The output rises a little above no load.',
      read: 'A transformer has an R% of 2 and an X% of 4. What is its regulation at full load, 0.8 leading?' },
    { kind: 'pick', name: 'Choosing an impedance', pic: 'none', enter: {},
      opts: PICK, want: PICK[2],
      task: 'A board needs a small volt drop and a low fault current. You can fit a 4% or an 8% transformer of the same rating. Which is true of the two?',
      hint: 'Halving the impedance doubles the fault current.',
      hints: { [PICK[0]]: 'More impedance drops more volts, so the 8% unit sags more.',
        [PICK[1]]: 'Halving the impedance doubles the fault current.',
        [PICK[3]]: 'That is the wrong way round. Less impedance, less drop.' },
      why: 'The 8% unit\'s drop is about twice the 4% unit\'s. Its fault current is about half. One impedance cannot make both small. So you choose by which limit is tighter.',
      read: 'A board needs a small volt drop and a low fault current. You can fit a 4% or an 8% transformer of the same rating. Which is true of the two?' },
  ];
  const FINISH = 'Current through the windings drops a voltage that sits tip to tail on the output. The sag is deepest when the load lags at the windings\' own angle. A leading load can lift the output above no load. Percentage impedance sets both the sag and the fault current. Less of one means more of the other. Next: three-phase transformers and their clock.';

  // ================= state =================
  const BASE = { load: 100, pf: '1.0', z: 5 };
  const X = Object.assign({}, BASE);              // what the picture shows now
  const D = {};                                   // the drawn sizes, easing towards the rule's
  const blank = () => ({ pick: null, res: null, why: false, tries: 0, hint: '' });
  let S = STEPS.map(blank);
  const solved = (st) => !!st && (st.res === 'right' || st.res === 'shown');
  let T = Infinity, motionEnd = 0, scripted = false, lastStep = -1, finished = false, lastDone = false, held = false, VIEW = 0;
  let REC = { t: {} };
  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const testing = () => document.documentElement.classList.contains('k-testing');
  const quiet = () => REDUCE || testing();
  const el = (id) => document.getElementById(id);
  const idx = (name) => STEPS.findIndex((d) => d.name === name);
  // A puzzle's figure stays "?" on screen until that puzzle is checked.
  const hideOut = (i, key) => !finished && !!STEPS[i].hide && STEPS[i].hide.indexOf(key) >= 0 && !solved(S[i]);
  // A regulation a later puzzle asks for stays "?" on the screens before that puzzle.
  const spoils = (i) => !finished && X.load === 100 && X.z === 5 &&
    ((X.pf === '1.0' && i < idx('Regulation at unity')) || (X.pf === '0.5 lead' && i < idx('Above no load')));
  // The fault bar waits for the screen that explains it.
  const barOn = (i) => i >= idx('Percentage impedance');

  // ================= the drawn sizes ease towards the rule's =================
  function targets() {
    return { load: X.load, phi: phiOf(X.pf), z: X.z, fshow: (!barOn(VIEW) || hideOut(VIEW, 'fault')) ? 0 : 1 };
  }
  function snapD() { Object.assign(D, targets()); }
  function tween(dt) {
    const t = targets(), a = 1 - Math.exp(-dt / 0.22);
    Object.keys(t).forEach((k) => { const e = t[k] - D[k]; D[k] = Math.abs(e) <= 1e-6 * Math.max(1, Math.abs(t[k])) ? t[k] : D[k] + e * a; });
  }
  function settled() { const t = targets(); return Object.keys(t).every((k) => D[k] === t[k]); }
  snapD();
