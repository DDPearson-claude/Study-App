<p class="caption">A 10 kVA, 440 V to 115 V transformer, drawn as its 440 V side sees it. Every value is an example.</p>

<script>
  // ================= the rules =================
  const strip = (s) => s.replace(/\[\^\d+\]/g, '');
  const NB = ' ';
  const VR = 440, FQ = 60, N1 = 880, N2 = 230, SR = 10000;      // the example: 10 kVA on a 440 V, 60 Hz supply, 880 and 230 turns
  const FE0 = 100, CU0 = 400, IOC = 0.5, XS = 0.58;              // iron loss at 440 V, copper loss at full load, open-circuit current, leakage reactance
  const IFL = SR / VR;                                           // full-load current on the 440 V side: 22.7 A
  const RS = CU0 / (IFL * IFL);                                  // the windings' resistance seen from 440 V: 0.77 Ω gives 400 W at 22.7 A
  const ZS = Math.hypot(RS, XS);                                 // the series branch's impedance: 0.97 Ω
  const VSC = IFL * ZS;                                          // the short-circuit test's supply: 22.0 V drives 22.7 A through it
  const PHI0 = VR / (4.44 * FQ * N1);                            // the peak flux the 440 V supply holds: 1.88 mWb
  const G = FE0 / (VR * VR), YC = IOC / VR, BC = Math.sqrt(YC * YC - G * G);   // the core's branch: 100 W and 0.5 A at 440 V
  const SRC1 = 'https://downloads.regulations.gov/EERE-2017-BT-TP-0055-0022/attachment_3.pdf';
  const SRC2 = 'https://www.rohde-schwarz.com/ch-en/solutions/electronics-testing/power-electronics-testing/transformer-short-circuit-testing/short-circuit-testing_258719.html';
  const SRC3 = 'https://ecampusontario.pressbooks.pub/electrotechnology/chapter/part-4-transformer-testing';

  // On load the supply holds 440 V, so the core's branch takes 0.5 A and 100 W at every load. The series branch
  // carries the load's current, x × 22.7 A, so its copper loss is I²R = 400 × x². Open circuit: nothing in the
  // series branch. Short circuit: 22.0 V drives 22.7 A through the series branch; the core's branch, on 5% of
  // the voltage, takes 5% of its current, and its iron loss goes with the voltage squared (a sketch).
  function rule(load, pf, test) {
    const x = test === 'load' ? load / 100 : 0;
    const v = test === 'sc' ? VSC : VR;
    const ish = test === 'sc' ? IFL : x * IFL;
    const fe = v * v * G, cu = ish * ish * RS;
    const out = test === 'load' ? SR * x * pf : 0;
    const eff = out > 0 ? 100 * out / (out + fe + cu) : 0;
    const lag = test === 'sc' ? Math.atan2(XS, RS) : Math.acos(pf);         // how far the series branch's current lags
    const isup = Math.hypot(v * G + ish * Math.cos(lag), v * BC + ish * Math.sin(lag));
    return { x, v, ish, icore: v * YC, fe, cu, out, eff, phi: PHI0 * v / VR, isup, watt: out + fe + cu };
  }
  const effAt = (load, pf) => rule(load, pf, 'load').eff;
  const fLoss = (v) => (v > 0 && v < 0.995 ? v.toFixed(2) : v.toFixed(1)) + NB + 'W';
  const fFlux = (phi) => (phi * 1e3).toFixed(2) + NB + 'mWb';
  const fSup = (v) => (Math.abs(v - VR) < 1e-9 ? String(VR) : v.toFixed(1)) + NB + 'V, ' + FQ + NB + 'Hz';

  // ================= the lesson: SHOW screens demonstrate, DO screens are puzzles =================
  const ramp = (t, t0, dur, a, b) => a + (b - a) * K.clamp((t - t0) / dur, 0, 1);
  const r5 = (v) => Math.round(v / 5) * 5;
  const STEPS = [
    { kind: 'typed', name: 'The top of a curve', ans: 'top', enter: {},
      answer: 3, decimals: 0, unit: '', want: '3',
      slips: [{ value: 6, hint: 'That is where the height is back to zero. The top is where the slope is zero.' },
        { value: 9, hint: 'That is the height at the top. The question asks for x.' }],
      task: 'A curve\'s height is y = 6x − x². Its slope is 6 − 2x. At what x does it reach its top?',
      hint: 'At the top the slope is zero. Solve 6 − 2x = 0.',
      why: '6 − 2x = 0 gives x = 3. The height there is 18 − 9 = 9. You find the top of an efficiency curve the same way.',
      right: 'Still there.',
      read: 'The curve y = 6x − x² has slope 6 − 2x. At what x is its top?' },
    { show: true, name: 'Two branches', ctl: ['load'], enter: { load: 100 }, end: { load: 50 }, dur: 4.0,
      demo: (t) => { X.load = r5(t < 2.2 ? ramp(t, 0.6, 1.4, 100, 25) : ramp(t, 2.4, 1.0, 25, 50)); },
      text: strip('A real transformer is the ideal one plus two branches. The ideal one lost nothing. The shunt branch sits across the supply and stands for the core. It takes the small current that magnetises the core. It also takes the *iron loss*, from hysteresis and eddy currents. The series branch sits in line with the load and stands for the windings. Its resistance wastes power as heat. Its reactance stands for leakage: flux that misses the other winding. Drag the load. Only the series branch\'s current changes.'),
      read: 'A real transformer is the ideal one plus two branches. The shunt branch sits across the supply and stands for the core. The series branch sits in line with the load and stands for the windings. Only the series branch\'s current changes with the load.',
      still: () => setStill() },
    { kind: 'typed', name: 'At 75% load', ans: 'cu75', hide: 'cu', enter: { load: 100 }, run: 1.4,
      runFn: (t) => { X.load = r5(ramp(t, 0.2, 1.0, 100, 75)); }, runEnd: { load: 75 },
      answer: 225, decimals: 0, unit: 'W', want: '225' + NB + 'W',
      slips: [{ value: 300, hint: 'That scales it straight with the load. The loss goes with the current squared.' },
        { value: 400, hint: 'That is the full-load figure. At 75% load the current is 0.75 of full.' }],
      task: 'This transformer\'s windings lose 400 W at full load. What do they lose at 75% load?',
      hint: 'Copper loss = 400 × (load fraction)².',
      why: '0.75² = 0.5625. 400 × 0.5625 = 225 W.',
      read: 'This transformer\'s windings lose 400 W at full load. What do they lose at 75% load?' },
    { show: true, name: 'Iron stays put', ctl: ['load'], enter: { load: 100 }, end: { load: 100 }, dur: 4.5,
      demo: (t) => { X.load = r5(t < 2.0 ? ramp(t, 0.6, 1.0, 100, 50) : t < 3.6 ? ramp(t, 2.0, 1.4, 50, 125) : ramp(t, 3.6, 0.8, 125, 100)); },
      text: strip('*Copper loss* grows with the load, but iron loss stays put. Drag the load and watch the two bars. The copper loss is I²R, so it goes with the current squared. Full load gives 400 W. Half load gives a quarter, 100 W. The iron loss stays at 100 W from no load to 125%.[^1] It depends on the flux, and the flux bar stays at 1.88 mWb. The supply\'s voltage holds the flux. The primary cancels the load\'s ampere-turns. So more load means more current, not more flux.'),
      read: 'The copper loss grows with the square of the load. It is 400 W at full load and 100 W at half. The iron loss stays at 100 W, because the supply holds the flux at 1.88 mWb.',
      still: () => setStill() },
    { kind: 'typed', name: 'Iron at full load', ans: 'fe', hide: 'fe', enter: { load: 50 }, run: 1.4,
      runFn: (t) => { X.load = r5(ramp(t, 0.2, 1.0, 50, 100)); }, runEnd: { load: 100 },
      answer: 100, decimals: 0, unit: 'W', want: '100' + NB + 'W',
      slips: [{ value: 400, hint: 'That grows it with the square, like the copper loss. But the iron loss follows the flux.' },
        { value: 200, hint: 'That doubles it with the load. The load does not move the flux.' }],
      task: 'At half load this transformer\'s iron loss is 100 W. The load rises to full. What is its iron loss now?',
      hint: 'What sets the flux, the load or the supply?',
      why: 'The supply still holds the flux at 1.88 mWb. Same flux, same iron loss: 100 W. The copper loss grows from 100 W to 400 W.',
      read: 'At half load this transformer\'s iron loss is 100 W. The load rises to full. What is its iron loss now?' },
    { show: true, name: 'Efficiency', ctl: ['load', 'pf'], enter: { load: 100, pf: 1 }, end: { load: 100, pf: 1 }, dur: 4.0,
      demo: (t) => { X.pf = t >= 1.0 && t < 3.0 ? 0.8 : 1; },
      text: strip('Efficiency is output ÷ input. The input is the output plus both losses. At full load and unity power factor, the load takes 10,000 W. The losses are 100 + 400 = 500 W. So the efficiency is 10,000 ÷ 10,500 = 95.2%. Now switch to 0.8 power factor. The current is the same, so the losses are too. But only 8000 W comes out. So the efficiency falls to 94.1%.'),
      read: 'At full load and unity power factor, 10,000 W comes out and 500 W is lost. That is 95.2%. At 0.8 power factor, only 8000 W comes out for the same losses. That is 94.1%.',
      still: () => setStill() },
    { kind: 'typed', name: 'Half load', ans: 'eff50', hide: 'eff', enter: { load: 100 }, run: 1.4,
      runFn: (t) => { X.load = r5(ramp(t, 0.2, 1.0, 100, 50)); }, runEnd: { load: 50 },
      answer: 96.2, decimals: 1, unit: '%', want: '96.2%',
      slips: [{ value: 90.9, hint: 'That uses the full-load copper loss. At half load it is a quarter of that, 100 W.' },
        { value: 94.3, hint: 'That halves the copper loss. It goes with the square, so it quarters.' }],
      task: 'The same transformer runs at half load, unity power factor. What is its efficiency?',
      hint: 'Output 5000 W. Losses: 100 W iron, plus 400 × 0.5² copper.',
      why: 'Copper loss = 400 × 0.25 = 100 W. So the losses are 200 W in all. 5000 ÷ 5200 = 96.2%. That beats the 95.2% at full load.',
      read: 'The same transformer runs at half load, unity power factor. What is its efficiency?' },
    { show: true, name: 'The peak', ctl: ['load'], enter: { load: 100 }, end: { load: 50 }, dur: 4.0,
      demo: (t) => { X.load = r5(t < 2.2 ? ramp(t, 0.6, 1.4, 100, 20) : ramp(t, 2.4, 1.2, 20, 50)); },
      text: strip('Efficiency peaks at 50% load, where both loss bars read 100 W. Drag the load and watch the dot. Why there? Call the load fraction x. For each watt delivered, the losses go as 100 ÷ x + 400x. The iron part falls as the load grows. The copper part rises. The total is lowest where its slope, 400 − 100 ÷ x², is zero. That needs 400x² = 100. So the copper loss equals the iron loss. Then x = √(100 ÷ 400) = 0.5.'),
      read: 'Efficiency peaks at 50% load, where the copper loss equals the 100 W iron loss. Peak load = √(iron loss ÷ full-load copper loss).',
      still: () => setStill() },
    { kind: 'typed', name: 'Another transformer', ans: 'pk', enter: { load: 50 },
      answer: 40, decimals: 0, unit: '%', want: '40%',
      slips: [{ value: 16, hint: 'That is 64 ÷ 400. Take its square root.' },
        { value: 250, hint: 'That is upside down. Put the iron loss on top.' }],
      task: 'Another transformer has 64 W of iron loss and 400 W of copper loss at full load. At what load is it most efficient?',
      hint: 'Peak load = √(iron loss ÷ full-load copper loss).',
      why: '64 ÷ 400 = 0.16, and √0.16 = 0.4. So the peak is at 40%. Check: 400 × 0.4² = 64 W of copper loss, equal to the iron loss.',
      read: 'A transformer has 64 W of iron loss and 400 W of full-load copper loss. At what load is it most efficient?' },
    { show: true, name: 'Two tests', ctl: ['test'], enter: { test: 'load' }, end: { test: 'sc' }, dur: 4.2,
      demo: (t) => { X.test = t < 0.8 ? 'load' : t < 2.4 ? 'oc' : 'sc'; },
      text: strip('Two tests measure the two losses. The open-circuit test leaves the secondary open. The primary gets its full 440 V. The flux is full, but only a small current flows. So the wattmeter reads the iron loss, 100 W.[^2] The short-circuit test puts a link across the secondary. You raise the voltage from zero until rated current flows. Now the current is full, but the voltage is only 22.0 V. So the wattmeter reads the copper loss, 400 W.[^3]'),
      read: 'With the secondary open at rated voltage, the wattmeter reads the iron loss, 100 W. With it shorted at rated current, on 22.0 V, it reads the copper loss, 400 W.',
      still: () => setStill() },
    { kind: 'typed', name: 'Flux in the test', ans: 'fsc', hide: 'flux', enter: { test: 'sc' },
      answer: 0.09, decimals: 2, accept: [0.094], unit: 'mWb', want: '0.09' + NB + 'mWb',
      slips: [{ value: 1.88, hint: 'Rated current flows, but the voltage sets the flux.' },
        { value: 37.6, hint: 'The voltage is 20 times lower, so the flux is too.' }],
      task: 'The short-circuit test drives 22.7 A with 22.0 V on the primary. At 440 V the flux peaks at 1.88 mWb. What does it peak at in this test?',
      hint: 'The flux follows the voltage. 22.0 V is 5% of 440 V.',
      why: '1.88 × 22.0 ÷ 440 = 0.09 mWb, 5% of normal. So the iron loss almost vanishes. The wattmeter reads the copper loss alone.',
      read: 'At 440 V the flux peaks at 1.88 mWb. What does it peak at in the short-circuit test, on 22.0 V?' },
    { kind: 'typed', name: 'From the two tests', ans: 'eff12', enter: {},
      answer: 96.3, decimals: 1, unit: '%', want: '96.3%',
      slips: [{ value: 97.1, hint: 'That leaves out the iron loss. It is there at every load.' },
        { value: 99.2, hint: 'That leaves out the copper loss. At full load it is the whole 300 W.' }],
      task: 'A 10 kVA transformer\'s open-circuit test reads 80 W. Its short-circuit test at rated current reads 300 W. What is its efficiency at full load, unity power factor?',
      hint: 'Efficiency = 10,000 ÷ (10,000 + 80 + 300).',
      why: 'At full load both losses count. 80 + 300 = 380 W. 10,000 ÷ 10,380 = 96.3%.',
      read: 'A 10 kVA transformer tests at 80 W open circuit and 300 W short circuit. What is its efficiency at full load, unity power factor?' },
    { kind: 'pick', name: 'Setting up the test', enter: {},
      opts: ['Secondary shorted, rated current', 'Secondary shorted, rated voltage', 'Secondary open, rated current', 'Secondary open, rated voltage'],
      want: 'Secondary open, rated voltage',
      task: 'You want to measure a transformer\'s iron loss. How do you set up the test?',
      hint: 'The iron loss follows the flux. The voltage sets the flux. So set the voltage.',
      hints: { 'Secondary shorted, rated current': 'That is the short-circuit test. Its low voltage gives little flux. So it reads the copper loss.',
        'Secondary shorted, rated voltage': 'Full voltage on a shorted secondary is a dead short. Here it would drive 20 times rated current.',
        'Secondary open, rated current': 'The iron loss follows the flux. The voltage sets the flux. So set the voltage.' },
      why: 'The iron loss needs the full flux, and rated voltage gives it. With the secondary open, only a small current flows. So the copper loss is too small to count.',
      read: 'You want to measure a transformer\'s iron loss. How do you set up the test?' },
  ];
  const FINISH = 'The supply holds the flux, so the iron loss barely moves with the load. The copper loss grows with the square of the load. Efficiency peaks where the two are equal. The open-circuit test reads the iron loss. The short-circuit test reads the copper loss. Next: the voltage the series branch drops under load.';

  // ================= state =================
  const BASE = { load: 100, pf: 1, test: 'load' };
  const X = Object.assign({}, BASE);              // what the picture shows now
  const D = {};                                   // the drawn sizes, easing towards the rule's
  const blank = () => ({ pick: null, res: null, why: false, tries: 0, hint: '' });
  let S = STEPS.map(blank);
  const solved = (st) => !!st && (st.res === 'right' || st.res === 'shown');
  let T = Infinity, motionEnd = 0, scripted = false, lastStep = -1, finished = false, lastDone = false, held = false, probing = false, lastMode = 'load';
  let REC = { t: {}, bars: {}, faint: {} };
  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const testing = () => document.documentElement.classList.contains('k-testing');
  const quiet = () => REDUCE || testing();
  const el = (id) => document.getElementById(id);
  const idx = (name) => STEPS.findIndex((d) => d.name === name);
  // A puzzle's figure stays "?" on screen until that puzzle is checked.
  const hideOut = (i, key) => !finished && STEPS[i].hide === key && !solved(S[i]);

  // ================= the drawn sizes ease towards the rule's =================
  function targets() {
    const r = rule(X.load, X.pf, X.test);
    return { load: X.load, pf: X.pf, fe: r.fe, cu: r.cu, phi: r.phi, ish: r.ish, icore: r.icore, isup: r.isup };
  }
  function snapD() { Object.assign(D, targets()); }
  function tween(dt) {
    const t = targets(), a = 1 - Math.exp(-dt / 0.2);
    Object.keys(t).forEach((k) => { const e = t[k] - D[k]; D[k] = Math.abs(e) <= 1e-6 * Math.max(1, Math.abs(t[k])) ? t[k] : D[k] + e * a; });
  }
  function settled() { const t = targets(); return Object.keys(t).every((k) => D[k] === t[k]); }
  snapD();

  // ================= text with amber key terms (built with K.el, never innerHTML) =================
  const UNIT_GAP = /(\d) (?=(?:Hz|mWb|kVA|kW|V|A|Ω|W)(?![A-Za-z]))/g;
  function write(node, s) {
    node.textContent = '';
    String(s || '').replace(UNIT_GAP, '$1' + NB).split(/\*([^*]+)\*/).forEach((seg, k) => {
      if (!seg) return;
      node.appendChild(k % 2 ? K.el('span', { class: 'term' }, seg) : document.createTextNode(seg));
    });
  }

  // ================= controls =================
  const stepper = K.stepper({ id: 'step', label: 'Screen', steps: STEPS.map((d) => d.name), value: 0, compact: true, into: '#prog' });
  const at = () => K.clamp(Math.round(stepper.get()) || 0, 0, STEPS.length - 1);
  const CTL = {
    load: K.control({ id: 'load', label: 'Load', min: 0, max: 125, step: 5, value: 100, snap: [50, 75, 100], fmt: (v) => v + '%', into: '#c-load' }),
    pf: K.choice({ id: 'pf', label: 'Power factor', options: [{ value: 1, label: '1.0' }, { value: 0.8, label: '0.8 lagging' }], value: 1, into: '#c-pf' }),
    test: K.choice({ id: 'test', label: 'Test', options: [{ value: 'load', label: 'On load' }, { value: 'oc', label: 'Open-circuit test' }, { value: 'sc', label: 'Short-circuit test' }], value: 'load', into: '#c-test' }),
  };
  const CTL_IDS = Object.keys(CTL);
  const pushed = {};
  CTL_IDS.forEach((id) => { pushed[id] = CTL[id].get(); });
  // The page moves the controls itself during a demonstration (silently, so it is not taken for Dan's move).
  function push() {
    CTL_IDS.forEach((id) => { if (pushed[id] !== X[id]) { CTL[id].set(X[id], true); pushed[id] = CTL[id].get(); } });
  }
  const shownCtl = (d, id) => !finished && !!d.ctl && d.ctl.indexOf(id) >= 0;
  function layoutCtl(d) { CTL_IDS.forEach((id) => { el('c-' + id).hidden = !shownCtl(d, id); }); }

  // The efficiency curve: off the bottom at light load, a dashed line at its peak, a dot where the load is.
  const plot = K.plot('#plot', {
    x: { min: 0, max: 125, label: 'Load (%)' },
    y: { min: 88, max: 97, label: 'Efficiency (%)' },
    height: 170,
    label: 'Efficiency against load: it climbs steeply from light load, peaks at half load, then falls slowly',
  });

  const RO = {
    load: K.readout({ id: 'r-load', label: 'Load', fmt: (v) => Math.round(v) + '%', into: '#outs' }),
    out: K.readout({ id: 'r-out', label: 'Output', fmt: (v) => (v / 1000).toFixed(1) + NB + 'kW', into: '#outs' }),
