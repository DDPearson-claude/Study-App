<p class="caption" id="cap">Worked from the rule, with straight droop lines and example settings.</p>

<script>
  // ================= the rule =================
  const strip = (s) => String(s || '').replace(/\[\^\d+\]/g, '');
  const NB = ' ';                                 // a no-break space: a number never parts from its unit
  const SRC_CUM = 'https://mart.cummins.com/imagelibrary/data/assetfiles/0056622.pdf';
  const SRC_DS = 'https://dieselship.com/marine-technical-articles/marine-electro-technology/active-reactive-power-sharing-in-a-paralleled-generator-set-kw-kvar';
  const SRC_BG = 'https://www.bengibb.ca/blog/kw-and-kvar-control';
  // Two 504 kW (630 kVA) sets on one 440 V, 60 Hz board.
  const RK = 504, RKVA = 630, F0 = 60, VB = 440;
  const MOT = 0.1 * RK;                                // a set with its fuel cut to nothing is driven as a motor: 50.4 kW (an example)
  // The inset: power = E × V × sin δ ÷ Xs per unit, on 630 kVA. Full power at 90° would be 945 kW.
  const EPU = 2.25, VPU = 1.0, XS = 1.5, PMAX = RKVA * EPU * VPU / XS;
  // The load at 0.8 power factor takes 0.75 kVAr for each kW. Each AVR falls 1 V for each 30 kVAr (an example).
  const PFL = 0.8, QK = Math.sqrt(1 - PFL * PFL) / PFL, KQ = 30, VC = 440;
  const kOf = (dr) => RK / (dr / 100 * F0);          // kW for each hertz below the setting: 210 at 4%
  const rad = (d) => d * Math.PI / 180, deg = (r) => r * 180 / Math.PI;
  const r1 = (v) => Math.round(v * 10) / 10, r2 = (v) => Math.round(v * 100) / 100;
  const sgn = (r, s) => (r < 0 ? '−' : '') + s;
  const fK = (v) => { const r = r1(v); return sgn(r, Number.isInteger(r) ? String(Math.abs(r)) : Math.abs(r).toFixed(1)); };
  const fHz = (v) => sgn(r2(v), Math.abs(r2(v)).toFixed(2));
  const fV1 = (v) => sgn(r1(v), Math.abs(r1(v)).toFixed(1));

  // Droop: each set carries its own k × (its setting − f), from 0 to 504 kW. At 504 it is at full fuel and
  // the frequency can fall further. Below 0 its fuel is cut to nothing: at its own setting it is
  // driven by anything from 0 to 50.4 kW, and above its setting it draws the full 50.4 kW.
  function droopSolve(fa, fb, ka, kb, L) {
    const fs = [fa, fb], ks = [ka, kb], e = 1e-9;
    const P = (j, st, f) => (st === 'lin' ? ks[j] * (fs[j] - f) : st === 'full' ? RK : -MOT);
    const ok = (j, st, f, p) => (st === 'lin' ? p >= -e && p <= RK + e : st === 'full' ? f <= fs[j] - RK / ks[j] + e : st === 'mot' ? f >= fs[j] - e : p >= -MOT - e && p <= e);
    const SS = ['lin', 'full', 'mot', 'edge'];
    for (let x = 0; x < 4; x++) for (let y = 0; y < 4; y++) {
      const a = SS[x], b = SS[y];
      let f, pa, pb;
      if (a === 'edge' && b === 'edge') { if (Math.abs(fa - fb) > e || L > e) continue; f = fa; pa = pb = L / 2; }
      else if (a === 'edge') { f = fa; pb = P(1, b, f); pa = L - pb; }
      else if (b === 'edge') { f = fb; pa = P(0, a, f); pb = L - pa; }
      else {
        const la = a === 'lin', lb = b === 'lin';
        if (!la && !lb) continue;
        const C = (la ? 0 : P(0, a, 0)) + (lb ? 0 : P(1, b, 0));
        f = ((la ? ka * fa : 0) + (lb ? kb * fb : 0) - (L - C)) / ((la ? ka : 0) + (lb ? kb : 0));
        pa = P(0, a, f); pb = P(1, b, f);
      }
      if (ok(0, a, f, pa) && ok(1, b, f, pb)) return { f, pa, pb, st: [a, b] };
    }
    const f = (ka * fa + kb * fb - L) / (ka + kb);
    return { f, pa: ka * (fa - f), pb: kb * (fb - f), st: ['lin', 'lin'] };
  }
  // Isochronous: flat lines. The higher setting holds the board and takes the load plus the other's
  // 50.4 kW, up to 504 kW; past that the frequency falls to the lower setting, which carries the rest.
  function isoSolve(fa, fb, L) {
    if (Math.abs(fa - fb) < 1e-9) return { f: fa, pa: L / 2, pb: L / 2, st: ['flat', 'flat'] };
    const hiA = fa > fb, fh = hiA ? fa : fb, fl = hiA ? fb : fa;
    let f, ph, pl, sh, sl;
    if (L + MOT <= RK + 1e-9) { f = fh; ph = L + MOT; pl = -MOT; sh = 'flat'; sl = 'mot'; }
    else { f = fl; ph = RK; pl = L - RK; sh = 'full'; sl = 'flat'; }
    return hiA ? { f, pa: ph, pb: pl, st: [sh, sl] } : { f, pa: pl, pb: ph, st: [sl, sh] };
  }
  // The whole state: kW from the governors, kVAr from the AVRs (c is how far compensation has trimmed them).
  function model(s) {
    const L = s.load;
    const r = s.gov === 'Isochronous' ? isoSolve(s.fa, s.fb, L) : droopSolve(s.fa, s.fb, kOf(s.da), kOf(s.droop), L);
    let pa = r.pa, d = deg(Math.asin(K.clamp(pa / PMAX, -1, 1))), pu = null;
    // Screen 3 sets the angle itself and works the power as the lesson does: 0.80 per unit of 630 kVA.
    if (s.dset != null) { pu = r2(EPU * VPU * Math.sin(rad(s.dset)) / XS); pa = pu * RKVA; d = s.dset; }
    const Q = QK * L, half = Q / (2 * KQ), vt = VC + half;
    const ea = K.lerp(s.va, vt, s.c), eb = K.lerp(s.vb, vt, s.c);
    const V = (ea + eb) / 2 - half, qa = KQ * (ea - V), qb = KQ * (eb - V);
    return { f: r.f, pa, pb: r.pb, st: r.st, d, pu, Q, V, qa, qb, ea, eb, ix: Math.abs(qa - qb) / 2 * 1000 / (Math.sqrt(3) * VB) };
  }

  // ================= the lesson: SHOW screens demonstrate, DO screens are puzzles =================
  const STEPS = [
    { kind: 'typed', name: 'Real and reactive', ans: 'kw', bare: true, tri: true, right: 'Still there.',
      answer: 80, decimals: 0, unit: 'kW', want: '80' + NB + 'kW',
      slips: [{ value: 60, hint: 'That is the kVAr. kW is kVA × the power factor.' },
        { value: 125, hint: 'That divides by 0.8. Multiply instead.' }],
      task: 'These two sets will share a load of kW and kVAr. A load takes 100 kVA at 0.8 power factor. How many kW does it take?',
      hint: 'kW = kVA × the power factor.',
      why: '100 × 0.8 = 80 kW. The other part is √(100² − 80²) = 60 kVAr. That is the reactive power the field supplies.',
      read: 'These two sets will share a load of kW and kVAr. A load takes 100 kVA at 0.8 power factor. How many kW does it take?' },
    { show: true, name: 'More fuel, wider angle', inset: 'big', enter: { load: 0 },
      demo: [{ at: 0.4, to: 3.4, ramp: { load: [0, 600] } }], dur: 3.6,
      text: 'On a live board, a set\'s rotor is locked in step with the others. So more fuel cannot simply speed it up. Instead it pushes the rotor a few degrees further ahead. The load angle δ grows, and the set sends out more kW. Here the load comes on, and each governor adds fuel as the board slows. A set\'s kW follows its engine\'s output.[^1] At 600 kW, A carries 300 kW at a δ of 18.5°.',
      read: 'On a live board, a set\'s rotor is locked in step with the others. So more fuel cannot simply speed it up. Instead it pushes the rotor a few degrees further ahead. The load angle δ grows, and the set sends out more kW. Here the load comes on, and each governor adds fuel as the board slows. A set\'s kW follows its engine\'s output. At 600 kW, A carries 300 kW at a δ of 18.5°.',
      still: () => setStill() },
    { kind: 'typed', name: 'Power from the angle', ans: 'pu', inset: 'only', enter: { dset: 32.3 }, tiles: ['D', 'PA'], hide: ['PA'],
      answer: 0.80, decimals: 2, unit: '', want: '0.80',
      slips: [{ value: 1.20, hint: 'That is E × sin δ. Divide by Xs too.' },
        { value: 1.27, hint: 'That uses cos δ. Power goes with sin δ.' },
        { value: 1.80, hint: 'That multiplies by Xs. Divide by it.' }],
      task: 'Set A\'s E is 2.25 per unit, V is 1.0 and Xs is 1.5. The load angle is 32.3°. Power = E × V × sin δ ÷ Xs. What power does it send out, in per unit?',
      hint: 'sin 32.3° is 0.534.',
      why: '2.25 × 1.0 × 0.534 ÷ 1.5 = 0.80 per unit. On a 630 kVA set that is 504 kW. That is its full rating.',
      read: 'Set A\'s E is 2.25 per unit, V is 1.0 and Xs is 1.5. The load angle is 32.3°. Power = E × V × sin δ ÷ Xs. What power does it send out, in per unit?' },
    { show: true, name: 'Two droop lines', build: true, dur: 2.9,
      text: 'Two sets share the load through their droop lines. Each runs at 62.4 Hz with no load and 60 Hz at its full 504 kW. So each takes 210 kW for each hertz it falls. A\'s line starts at the left edge and B\'s at the right. The 600 kW load lies between. Both run at the board\'s one frequency, so they settle where the lines cross. That gives 300 kW each, at 62.4 − 300 ÷ 210 = 60.97 Hz. Lowering both settings together would bring the board back to 60 Hz.',
      read: 'Two sets share the load through their droop lines. Each runs at 62.4 Hz with no load and 60 Hz at its full 504 kW. So each takes 210 kW for each hertz it falls. A\'s line starts at the left edge and B\'s at the right. The 600 kW load lies between. Both run at the board\'s one frequency, so they settle where the lines cross. That gives 300 kW each, at 62.4 − 300 ÷ 210 = 60.97 Hz. Lowering both settings together would bring the board back to 60 Hz.',
      still: () => setStill() },
    { kind: 'pick', name: 'A nudge to A', ring: true, run: [{ at: 0.2, to: 1.8, ramp: { fa: [62.4, 62.7] } }], rdur: 1.9,
      opts: ['A takes the whole load', 'The board speeds up 0.3 Hz, and the kW stays put', 'A takes more kW, B less, and the frequency rises a little'],

      read: 'You raise A\'s governor setting by 0.3 Hz, from 62.4 to 62.7 Hz. What happens?' },

      demo: [{ at: 0.4, to: 2.4, ramp: { fa: [62.4, 62.7] } }], dur: 2.6,
      text: 'A\'s extra fuel starts to push the board faster. B\'s governor sees the rise and backs off its fuel. They settle with A on 331.5 kW and B on 268.5 kW. A\'s load angle has grown to 20.5°. The board rose only 0.15 Hz. That is half the nudge. On a set alone, the same nudge would lift the frequency the full 0.3 Hz. It would move no kW. In a big group, the frequency hardly moves at all.[^2] Drag A\'s setting and watch the shares.',

  // ================= drawing helpers =================
  function adder(g) { const f = (tag, attrs, txt) => g.appendChild(txt == null ? K.svg(tag, attrs) : K.svg(tag, attrs, txt)); f.g = g; return f; }
  const f1 = (v) => Math.round(v * 10) / 10;

  }

  // ================= the board, the two lines back to back, and the shares =================

  function readouts(i, M) {

    const tw = { F: fHz(M.f), PA: fK(M.pa), PB: fK(M.pb), D: fV1(M.d) };
    const tq = { V: fV1(M.V), QA: fK(M.qa), QB: fK(M.qb), X: fV1(M.ix) };

    Object.keys(tq).forEach((k) => { if (hid(k)) tq[k] = '?'; RQ[k].set(tq[k]); });
    REC.t = X.view === 'kVAr' ? tq : tw;

  function sayText(i, M) {
    const n = ['A', 'B'];
    if (X.view === 'N') {
      if (D.p > 0.999) return 'Both sets now have 2/3 pitch windings. Neither makes a third harmonic, so no current runs round the neutrals.';
      if (D.p < 0.001) return 'A has a 2/3 pitch winding and B a 5/6 pitch. B\'s third harmonic drives a current round through the linked neutrals.';
      return 'With matching windings, the current round the neutrals dies away.';
    }
    if (X.view === 'kVAr') {
      if (D.c > 0.999) return 'The compensation trims both fields until A and B carry ' + fK(M.Q / 2) + ' kVAr each. No cross current flows.';
      if (D.c > 0.001) return 'The compensation is trimming both fields towards an equal share.';
      if (Math.abs(M.qa - M.qb) < 0.05) return 'The field settings match, so A and B share the load\'s ' + fK(M.Q) + ' kVAr equally.';
      const h = M.qa > M.qb ? 0 : 1, Q = [M.qa, M.qb];
      return n[h] + ' carries ' + fK(Q[h]) + ' kVAr of the load\'s ' + fK(M.Q) + ' kVAr, and ' + n[1 - h] + ' ' + fK(Q[1 - h]) + '. The extra ' +
        fK(Math.abs(Q[0] - Q[1]) / 2) + ' kVAr flows from ' + n[h] + ' into ' + n[1 - h] + ' as a ' + fV1(M.ix) + ' A cross current.';
    }
    const P = [M.pa, M.pb], L = fK(D.load);
    const m = P[0] < -0.05 ? 0 : P[1] < -0.05 ? 1 : -1;
    if (m >= 0) return n[m] + '\'s fuel is cut to nothing, so the board drives it as a motor. ' + n[1 - m] + ' carries the ' + L + ' kW load and ' + n[m] + '\'s draw, here an example ' + fK(-P[m]) + ' kW.';
    const fu = P[0] > RK - 0.05 ? 0 : P[1] > RK - 0.05 ? 1 : -1;
    if (fu >= 0) return n[fu] + ' is at full fuel, 504 kW. ' + n[1 - fu] + ' carries the other ' + fK(P[1 - fu]) + ' kW of the ' + L + ' kW, so the board sits at ' + fHz(M.f) + ' Hz.';
    if (X.gov === 'Isochronous') return 'The two settings match exactly, so here A and B share the ' + L + ' kW equally.';
    const B = ringBase(i);
    if (B && Math.abs(M.pa - B.pa) > 0.05) {
      const df = M.f - B.f;
      return 'A now carries ' + fK(M.pa) + ' kW of the ' + L + ' kW, and B ' + fK(M.pb) + ' kW. ' +
        (Math.abs(df) < 0.005 ? 'The board stayed at ' + fHz(M.f) + ' Hz.' : 'The board ' + (df > 0 ? 'rose' : 'fell') + ' ' + fHz(Math.abs(df)) + ' Hz.');
    }
    if (Math.abs(M.pa - M.pb) < 0.05) return 'The lines cross in the middle, so A and B share the ' + L + ' kW equally, at ' + fHz(M.f) + ' Hz.';
    return 'A carries ' + fK(M.pa) + ' kW of the ' + L + ' kW, and B ' + fK(M.pb) + ' kW. The board runs at ' + fHz(M.f) + ' Hz.';
  }
  function sayRoom(i) {
    const d = STEPS[i];
    if (finished || d.nofig) return false;
    return d.show ? !!(d.ctl && d.ctl.length) : !!(d.ctlSolved && solved(S[i]));
  }
  function sayLine(i, M) {
    const p = el('say'), room = sayRoom(i), s = room ? sayText(i, M) : '';
    p.hidden = !room;
    p.classList.toggle('off', !s);
    if (p.dataset.s !== s) { p.dataset.s = s; write(p, s); }
    REC.say = s;
  }

  // ================= one paint =================
  function paint(i) {
    if (i == null) i = at();
    const M = model(disp());
    REC = { t: {}, M };
    drawScene(i, M);
    drawBig(i, M);
    drawTri(i);
    drawNeu(i);
    readouts(i, M);
    sayLine(i, M);
  }

  // ================= the page around the picture =================
  write(el('finish'), FINISH);
  const setLab = (b, s) => { if (b.el.textContent !== s) b.setLabel(s); };
  function showCtls(i) {
    let any = false;
    CIDS.forEach((id) => { const on = shownCtl(i, id); el('c-' + id).hidden = !on; any = any || on; });
    el('sws').hidden = !any;
  }
  const vis = (id, on) => { const n = el(id); if (on) n.removeAttribute('hidden'); else n.setAttribute('hidden', ''); };
  function layout(i) {
    const d = STEPS[i], st = S[i], sol = solved(st);
    el('stepbox').hidden = finished;
    el('done').hidden = !finished;
    el('count').textContent = 'Screen ' + (i + 1) + ' of ' + STEPS.length;
    const task = el('task');
    task.className = 'task' + (d.show ? ' show' : '');
    write(task, d.show ? d.text : d.task);
    const triOn = !!(d.tri && sol);
    el('figs').hidden = !!d.nofig && !triOn;
    // SVG elements have no .hidden property: the attribute itself is toggled.
    vis('scene', !d.nofig && d.inset !== 'only' && !d.neu);
    vis('neu', !!d.neu);
    vis('big', d.inset === 'big' || d.inset === 'only');
    vis('tri', triOn);
    el('outsW').hidden = !!d.nofig || !!d.bare || X.view !== 'kW';
    el('outsQ').hidden = !!d.nofig || !!d.bare || X.view !== 'kVAr';
    el('cap').hidden = finished || !!d.nofig || !!d.neu;
    showCtls(i);
    replayBtn.el.hidden = !d.show || !(d.demo || d.build) || finished || REDUCE;
    el('replay').hidden = replayBtn.el.hidden;
    const opts = d.kind === 'pick' ? d.opts : [];
    el('picks').hidden = !opts.length;
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      setLab(b, opts[k]);
      b.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });
    el('answers').hidden = d.kind !== 'typed';
    Object.keys(ANS).forEach((key) => { el('ans-' + key).hidden = d.ans !== key; });
    el('acts').hidden = !!d.show;
    checkBtn.el.hidden = sol;
    const fb = el('fb');
    fb.hidden = !!d.show;
    fb.className = 'fb' + (st.res === 'right' ? ' right' : '');
    let say = '';
    if (!d.show) {
      if (st.res === 'right') say = d.right || 'That\'s it.';
      else if (st.res === 'shown') say = 'Here is the working.';
      else if (st.res === 'wrong') say = d.kind === 'typed' ? st.hint : (d.hints && d.hints[st.pick]) || d.hint || '';
      else if (st.res === 'empty') say = d.kind === 'pick' ? 'Pick one of the answers first.' : 'Type your answer first.';
    }
    write(fb, say);
    const why = el('why');
    why.hidden = d.show || !st.why;
    write(why, d.show ? '' : d.why);
    setLab(whyBtn, st.why ? 'Hide why' : 'Why?');
    const cl = el('closing');
    cl.hidden = !(d.close && sol);
    write(cl, d.close || '');
    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !sol);
    setLab(nextBtn, i === STEPS.length - 1 ? 'Finish' : 'Continue');
    el('nav').hidden = backBtn.el.hidden && nextBtn.el.hidden;
  }

  K.update((p) => {
    const i = at();
    if (i !== lastStep) { lastStep = i; enterStep(i); }
    else {
      CIDS.forEach((id) => {
        const v = norm(id, p[id]);
        if (v === pushed[id]) return;
        if (shownCtl(i, id)) { endDemo(); pushed[id] = v; applyCtl(id, v); }
        else CTL[id].set(pushed[id], true);        // a control this screen does not use stays put
      });
      push();
    }
    if (finished !== lastDone) { lastDone = finished; enter(finished ? 'done' : 'stepbox'); }
    layout(i);
    paint(i);
    kick();
  });

  // ================= known answers, worked out by hand =================
  const solvedSt = (i) => Object.assign(blank(), STEPS[i].kind === 'pick' ? { pick: STEPS[i].want, res: 'right' } : { res: 'right' });
  function saveAll() {
    return { X: Object.assign({}, X), D: Object.assign({}, D), W: Object.assign({}, W), T, sc: scripted, rv, fin: finished, S: S.slice(), held, phase };
  }
  function restoreAll(k) {
    Object.assign(X, k.X); Object.assign(D, k.D); W = k.W; T = k.T; scripted = k.sc; rv = k.rv; finished = k.fin; S = k.S; held = k.held; phase = k.phase;
  }
  // A screen in the state given (its demonstration finished, unless opening), and what it drew.
  function drawn(i, st, opening, then) {
    const keep = saveAll();
    S = S.slice(); S[i] = st || blank(); T = Infinity; scripted = false; rv = Infinity; finished = false; held = false;
    try {
      prep(i, !opening);
      if (then) { then(); snapD(); snapW(i); }
      paint(i);
      return Object.assign({}, REC, { t: Object.assign({}, REC.t) });
    } finally { restoreAll(keep); paint(); }
  }
  const tIs = (t, o) => Object.keys(o).every((k) => t[k] === o[k]);
  const mk = (o) => model(Object.assign({}, BASE, { c: 0 }, o));
  const iRec = idx('Real and reactive'), iFuel = idx('More fuel, wider angle'), iPu = idx('Power from the angle'), iTwo = idx('Two droop lines');
  const iNudge = idx('A nudge to A'), iHalf = idx('Half the nudge'), iMore = idx('How much more'), iLess = idx('Less droop'), iFlat = idx('Two flat lines'), iUneq = idx('Unequal droops');
  const iVolt = idx('Voltage and kVAr'), iField = idx('More field on A'), iCross = idx('Cross current'), iNeu = idx('The neutrals'), iPf = idx('A\'s power factor'), iBack = idx('Share it back');

  K.check('At 4% droop a set falls 2.4 Hz across 504 kW, so it takes 210 kW for each hertz; equal 62.4 Hz settings share 600 kW as 300 kW each at 60.97 Hz with δ 18.5° (screens 2 and 4)', () => {
    const a = drawn(iFuel), a0 = drawn(iFuel, null, true), b = drawn(iTwo), want = { F: '60.97', PA: '300', PB: '300', D: '18.5' };
    return K.near(kOf(4), 210, 1e-9) && K.near(0.04 * F0, 2.4, 1e-12) && tIs(a.t, want) && tIs(b.t, want) && a0.t.PA === '0' && a0.t.F === '62.40' && !!b.dot;
  });
  K.check('Raising A\'s setting 0.3 Hz moves 31.5 kW onto A, 331.5 against 268.5 kW with δ 20.5°, and lifts the board only 0.15 Hz, half the nudge, to 61.12 Hz; the old crossing stays marked (screen 6)', () => {
    const r = drawn(iHalf), r0 = drawn(iHalf, null, true), base = baseOf(iHalf);
    return tIs(r.t, { F: '61.12', PA: '331.5', PB: '268.5', D: '20.5' }) && K.near(r.M.f - base.f, 0.15, 1e-9) && K.near(r.M.pa - base.pa, 31.5, 1e-9) &&
      !!r.ring && !r0.ring && r0.t.PA === '300';
  });
  K.check('Screen 5 answered moves A to 62.7 Hz; screen 7 shows ? for A until checked, then A at 62.6 Hz carries 321 kW and B 279 kW at 61.07 Hz', () => {
    const n = drawn(iNudge, solvedSt(iNudge)), a = drawn(iMore), b = drawn(iMore, solvedSt(iMore));
    return tIs(n.t, { PA: '331.5', F: '61.12' }) && !!n.ring && tIs(a.t, { F: '60.97', PA: '?', PB: '300' }) && tIs(b.t, { F: '61.07', PA: '321', PB: '279' }) &&
      K.near(b.M.pa, 210 * (62.6 - b.M.f), 1e-9);
  });
  K.check('At 1% droop a set takes 840 kW for each hertz: the same 0.3 Hz nudge from 60.6 Hz gives 426 and 174 kW at 60.39 Hz, moving 126 kW, four times the 31.5 kW at 4% (screen 8)', () => {
    const r = drawn(iLess), base = baseOf(iLess);
    return K.near(kOf(1), 840, 1e-9) && tIs(r.t, { F: '60.39', PA: '426', PB: '174' }) && K.near(r.M.pa - base.pa, 126, 1e-6) && K.near((r.M.pa - base.pa) / 31.5, 4, 1e-6);
  });
  K.check('Isochronous at 60.1 and 60.0 Hz on 400 kW: hidden until checked, then A carries 450.4 kW at 60.10 Hz and B draws 50.4 kW as a motor, red past its edge; on 600 kW A is at full fuel and the board falls to 60.0 Hz with B on 96 kW', () => {
    const a = drawn(iFlat), b = drawn(iFlat, solvedSt(iFlat)), c = isoSolve(60.1, 60.0, 600);
    return tIs(a.t, { F: '?', PA: '?', PB: '?', D: '?' }) && a.dot === null && tIs(b.t, { F: '60.10', PA: '450.4', PB: '−50.4' }) && b.red[1] && !b.red[0] && !!b.dot &&
      K.near(c.f, 60, 1e-12) && K.near(c.pa, 504, 1e-12) && K.near(c.pb, 96, 1e-9);
  });
  K.check('More fuel to the engine of one set in a group does not raise the frequency as it would alone: the board rises by less than the nudge, and less still with more sets', () => {
    const k = kOf(4), rise = (n) => { const g0 = 62.4 - 600 / (n * k), g1 = (n * 62.4 + 0.3) / n - 600 / (n * k); return g1 - g0; };
    const two = droopSolve(62.7, 62.4, k, k, 600).f - droopSolve(62.4, 62.4, k, k, 600).f;
    return K.near(two, rise(2), 1e-9) && K.near(rise(1), 0.3, 1e-9) && rise(1) > rise(2) && rise(2) > rise(10);
  }, { source: SRC_DS });
  K.check('Real power from a set in parallel is a direct function of its engine\'s output: raising A\'s setting always moves more kW onto A and widens its load angle', () => {
    let prev = null;
    for (let n = 580; n <= 640; n++) {
      const m = mk({ fa: n / 10 });
      if (prev && (m.pa < prev.pa - 1e-9 || m.d < prev.d - 1e-9)) return false;
      prev = m;
    }
    return mk({ fa: 64 }).pa > mk({ fa: 58 }).pa + 300;
  }, { source: SRC_CUM });
  K.check('Raising one set\'s excitation increases its share of the total kVAr and decreases its power factor', () => {
    let prev = null;
    for (let n = 895; n <= 904; n++) {
      const m = mk({ va: n / 2 }), pf = m.pa / Math.hypot(m.pa, m.qa);
      if (prev && !(m.qa > prev.qa && pf < prev.pf)) return false;
      prev = { qa: m.qa, pf };
    }
    return true;
  }, { source: SRC_DS });
  K.check('Speed control shares the kW and voltage control the kVAr: the field settings never move the kW, and the governor settings never move the kVAr', () => {
    const m0 = mk({}), m1 = mk({ va: 455, vb: 440 }), m2 = mk({ fa: 63.5, fb: 61 });
    return m1.pa === m0.pa && m1.pb === m0.pb && K.near(m2.qa, m0.qa, 1e-12) && K.near(m2.qb, m0.qb, 1e-12) && Math.abs(m1.qa - m0.qa) > 50 && Math.abs(m2.pa - m0.pa) > 50;
  }, { source: SRC_BG });
  K.check('Raising A\'s field 2 V lifts the board only 1 V, to 441.0 V: A carries 255 kVAr and B 195, a cross current of 30 000 ÷ (√3 × 440) = 39.4 A; compensation brings 440.0 V, 225 kVAr each and 0.0 A, with each set still on 300 kW (screens 11 and 12)', () => {
    const a = drawn(iField, solvedSt(iField)), b = drawn(iCross), c = drawn(iCross, null, false, () => { X.comp = true; });
    const q = { V: '441.0', QA: '255', QB: '195', X: '39.4' };
    return tIs(a.t, q) && tIs(b.t, q) && tIs(c.t, { V: '440.0', QA: '225', QB: '225', X: '0.0' }) && b.flow === 1 && c.flow === 0 &&
      b.kw[0] === '300' + NB + 'kW' && c.kw[1] === '300' + NB + 'kW' && !!c.ring && !!a.ring;
  });
  K.check('Screen 3: δ 32.3° with E 2.25, V 1.0 and Xs 1.5 gives 2.25 × 1.0 × 0.534 ÷ 1.5 = 0.80 per unit, and 0.80 × 630 kVA = 504 kW; A shows ? until checked', () => {
    const a = drawn(iPu), b = drawn(iPu, solvedSt(iPu));
    return a.t.D === '32.3' && a.t.PA === '?' && b.t.PA === '504' && b.M.pu === 0.8 && r2(EPU * VPU * 0.534 / XS) === 0.8 && Math.round(Math.sin(rad(32.3)) * 1000) / 1000 === 0.534;
  });
  K.check('Screen 10: the 600 kW load at 0.8 takes 600 × 0.75 = 450 kVAr; settings of 447.5 V cross at 440.0 V with 225 kVAr each and no cross current', () => {
    const r = drawn(iVolt);
    return K.near(QK, 0.75, 1e-12) && K.near(r.M.Q, 450, 1e-9) && tIs(r.t, { V: '440.0', QA: '225', QB: '225', X: '0.0' }) && r.flow === 0;
  });
  K.check('Screen 14: A at 62.8 Hz and B at 62.4 Hz carry 342 and 258 kW at 61.17 Hz; moved 0.2 Hz towards each other they carry 300 kW each, still at 61.17 Hz', () => {
    const a = drawn(iBack), b = drawn(iBack, solvedSt(iBack));
    return tIs(a.t, { F: '61.17', PA: '342', PB: '258' }) && tIs(b.t, { F: '61.17', PA: '300', PB: '300' }) && K.near(a.M.f, b.M.f, 1e-9) && K.near((342 - 300) / 210, 0.2, 1e-12) && !!b.ring;
  });
  K.check('With no load, equal settings carry nothing at their setting; a set set well below the other is driven as a motor, drawing 50.4 kW that the other supplies', () => {
    const a = droopSolve(62.4, 62.4, 210, 210, 0), b = droopSolve(64, 58, 210, 210, 0);
    return K.near(a.f, 62.4, 1e-12) && K.near(a.pa, 0, 1e-9) && K.near(b.pb, -50.4, 1e-9) && K.near(b.pa, 50.4, 1e-9) && K.near(b.f, 64 - 50.4 / 210, 1e-9);
  });
  K.check('Screen 1 shows the 80 kW and 60 kVAr triangle once checked; each typed answer and slip is worked from the rule: 80 kW (60, 125), 0.80 (1.20, 1.27, 1.80), 321 kW (342, 300, 279), 0.76 (0.80, 0.84, 0.65) and 0.2 Hz (0.4, 0.1, 42)', () => {
    const t0 = drawn(iRec), t1 = drawn(iRec, solvedSt(iRec));
    const sl = (i, v) => STEPS[i].slips.length === v.length && STEPS[i].slips.every((s, k) => Math.abs(s.value - v[k]) < 1e-12);
    const sn = Math.sin(rad(32.3)), cs = Math.cos(rad(32.3)), kva = Math.hypot(300, 255), kvb = Math.hypot(300, 195);
    const work = K.near(100 * 0.8, 80, 1e-12) && K.near(Math.sqrt(100 * 100 - 80 * 80), 60, 1e-12) && K.near(100 / 0.8, 125, 1e-12) &&
      r2(2.25 * 0.534 / 1.5) === 0.8 && r2(2.25 * sn / 1.5) === 0.8 && r2(2.25 * 0.534) === 1.2 && r2(2.25 * cs / 1.5) === 1.27 && r2(2.25 * 0.534 * 1.5) === 1.8 &&
      K.near(210 * 1.53, 321.3, 1e-9) && Math.round(210 * (62.6 - 60.97)) === 342 && 600 - 321 === 279 &&
      r2(300 / kva) === 0.76 && r2(300 / kvb) === 0.84 && r2(255 / kva) === 0.65 &&
      K.near(42 / 210, 0.2, 1e-12) && K.near(84 / 210, 0.4, 1e-12) && K.near(42 / 210 / 2, 0.1, 1e-12) && 342 - 300 === 42;
    return work && !t0.tri && t1.tri && STEPS[iRec].answer === 80 && STEPS[iPu].answer === 0.8 && STEPS[iMore].answer === 321 && STEPS[iPf].answer === 0.76 && STEPS[iBack].answer === 0.2 &&
      sl(iRec, [60, 125]) && sl(iPu, [1.2, 1.27, 1.8]) && sl(iMore, [342, 300, 279]) && sl(iPf, [0.8, 0.84, 0.65]) && sl(iBack, [0.4, 0.1, 42]);
  });
  K.check('Unequal droops: A at 2% from 61.2 Hz takes 420 kW for each hertz and B at 4% from 62.4 Hz takes 210; at 900 kW they carry 432 and 468 kW at 60.17 Hz, at 300 kW 32 and 268 kW at 61.12 Hz, so A sheds 400 kW and B 200 (screen 9)', () => {
    const a = drawn(iUneq), b = drawn(iUneq, solvedSt(iUneq)), m6 = mk({ da: 2, fa: 61.2, load: 600 });
    return K.near(kOf(2), 420, 1e-9) && tIs(a.t, { F: '60.17', PA: '432', PB: '468' }) && tIs(b.t, { F: '61.12', PA: '32', PB: '268' }) &&
      K.near(a.M.pa - b.M.pa, 400, 1e-6) && K.near(a.M.pb - b.M.pb, 200, 1e-6) && K.near(m6.pa, 232, 1e-6) && K.near(m6.pb, 368, 1e-6) && !!b.ring;
  });
  K.check('The Droop slider moves both sets; with equal droops the shares stay equal at any load', () =>
    [0, 300, 900].every((L) => { const m = mk({ droop: 2, da: 2, load: L }); return K.near(m.pa, m.pb, 1e-9); }));
  K.check('Screen 14: with mixed windings a third-harmonic current runs round the linked neutrals; with both at 2/3 pitch none does', () => {
    const a = drawn(iNeu, null, false, () => { X.pitch = 'Mixed'; }), b = drawn(iNeu);
    return a.nflow === 1 && b.nflow === 0;
  });
  K.check('Screen 11: 1 V for each 30 kVAr is 21 V at 630 kVAr, 4.8% of 440 V', () => K.near(RKVA / KQ, 21, 1e-12) && r1(100 * 21 / VB) === 4.8);
  K.check('Sixteen screens, seven that show and nine to try; the picks put their right answers in different places', () => {
    const pos = [iNudge, iUneq, iFlat, iField].map((i) => STEPS[i].opts.indexOf(STEPS[i].want));
    return STEPS.length === 16 && STEPS.filter((d) => d.show).length === 7 && pos.every((p) => p >= 0) && new Set(pos).size === 3 &&
      iRec === 0 && iBack === STEPS.length - 1 && iCross === 12 && iNeu === 13 && iUneq === 8;
  });
  K.ready();
</script>
