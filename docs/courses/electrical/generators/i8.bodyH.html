<script>
  // ================= the rule =================
  const strip = (s) => String(s || '').replace(/\[\^\d+\]/g, '');
  const NB = ' ';                               // a no-break space: a number never parts from its unit
  const DASH = '–';
  const SRC_INRUSH = 'https://www.cummins.com/sites/default/files/2020-03/PowerHour_Generator%20Set%20Sizing%20Software_Transient%20Performance%20and%20Motor%20Load%20Capabilities%20%281PDH%29.pdf';
  const SRC_AVR = 'https://benshaw.com/hubfs/Benshaw%20Website/Downloads/White-Papers/Benshaw-White-Paper-Starting-Motors-on-GenSets_EN.pdf';
  const SRC_ENGINE = 'https://resources.kohler.com/power/kohler/industrial/pdf/Sizing_Generators_for_Motor_Starting_WP.pdf';
  const SRC_TORQUE = 'https://mart.cummins.com/imagelibrary/data/assetfiles/0056583.pdf';
  const SRC_RECOVER = 'https://www.lerus.com/blog/components-of-the-dynamic-positioning-system-power';
  // One or two 630 kVA sets on a 440 V, 60 Hz board. Sub-transient reactance 0.15 and synchronous 1.5
  // per unit, E at the AVR's field ceiling 2.5, a starting power factor of 0.4 (all example values).
  const SET = 630, XD2 = 0.15, XS = 1.5, ECEIL = 2.5, SPF = 0.4, DIPK = 0.03;
  // Times in seconds from Start: the frequency is lowest at 0.3 s, the AVR pulls with a 1 s time
  // constant, a motor that gets away does so at 3 s, a stall shows at 2 s, the run lasts 4 s and plays at half speed.
  const TLOW = 0.3, TAVR = 1, TRUN = 3, TSTALL = 2, TBACK = 0.5, TEND = 4, PACE = 0.5, TARGET = 0.9, TLOWTILE = 1;
  const METHODS = ['DOL', 'Star-delta', 'Soft starter'];
  const DIV = { 'DOL': 1, 'Star-delta': 3, 'Soft starter': 2 };
  const HOW = { 'DOL': 'direct on line', 'Star-delta': 'star-delta', 'Soft starter': 'on its soft starter' };
  // One start: the kVA the set sees, x = that ÷ (630 kVA × the sets on), the voltage left at once
  // 1 ÷ (1 + 0.15x), the recovered voltage 2.5 ÷ (1 + 1.5x) capped at 100%, torque its square, the
  // real power kVA × 0.4, and a frequency dip of 3% per 100 kW, shared between the sets.
  function begin(kva, method, n, ceil) {
    const sk = kva / DIV[method], x = sk / (SET * n), E = ceil == null ? ECEIL : ceil;
    const v0 = 1 / (1 + XD2 * x), vr = Math.min(1, E / (1 + XS * x));
    const P = sk * SPF, dip = DIPK * P / 100 / n;
    return { kva, method, n, sk, x, v0, vr, tq: vr * vr, P, dip, flo: 60 * (1 - dip), away: vr >= TARGET - 1e-12 };
  }
  const freq = (r, t) => 60 * (1 - r.dip * (t / TLOW) * Math.exp(1 - t / TLOW));
  const pull = (r, t) => r.vr - (r.vr - r.v0) * Math.exp(-t / TAVR);
  const smooth = (u) => u * u * (3 - 2 * u);
  // The voltage drawn: the AVR's pull, times the frequency ÷ 60 (a slower rotor makes less voltage).
  // A motor that gets away draws less current from 3 s, and the voltage returns to 100% over 0.5 s.
  function volt(r, t) {
    const raw = pull(r, t) * freq(r, t) / 60;
    if (!r.away || t <= TRUN) return raw;
    return raw + (1 - raw) * smooth(Math.min(1, (t - TRUN) / TBACK));
  }
  function lowest(r) {
    let lo = Infinity, tl = 0;
    for (let k = 0; k <= 2000; k++) { const t = k * TEND / 2000, v = volt(r, t); if (v < lo) { lo = v; tl = t; } }
    let a = Math.max(0, tl - 0.002), b = Math.min(TEND, tl + 0.002);
    for (let k = 0; k < 50; k++) { const m1 = a + (b - a) / 3, m2 = b - (b - a) / 3; if (volt(r, m1) < volt(r, m2)) b = m2; else a = m1; }
    const tm = (a + b) / 2, vm = volt(r, tm);
    return vm < lo ? { lo: vm, tlo: tm } : { lo, tlo: tl };
  }
  const CACHE = {};
  function run(kva, method, n) {
    const key = kva + '|' + method + '|' + n;
    if (!CACHE[key]) { const r = begin(kva, method, n); Object.assign(r, lowest(r)); CACHE[key] = r; }
    return CACHE[key];
  }
  // The shaft's turns since Start: one that gets away runs up to full speed by 3 s; one that
  // stalls creeps round, then stops at 2 s.
  function turns(r, t) {
    if (r.away) return t <= TRUN ? t * t / (2 * TRUN) : TRUN / 2 + (t - TRUN);
    if (t <= 1) return 0.15 * t * t;
    if (t <= TSTALL) { const u = t - 1; return 0.15 + 0.3 * u - 0.15 * u * u; }
    return 0.3;
  }
  // Rounded half up to one place, as worked by hand: 0.9375 is stored as 0.93749999…, so a hair is added first.
  const r1 = (v) => Math.round(v * 10 + 1e-9) / 10;
  const one = (v) => { const r = r1(v); return Number.isInteger(r) ? String(r) : r.toFixed(1); };
  const pc = (v) => one(v * 100);
  const kv = (v) => one(v).replace(/\B(?=(\d{3})+(?!\d))/g, ',');   // 1200 is written 1,200, as the slider writes it
  const f1 = (v) => Math.round(v * 10) / 10;
  const f2 = (v) => Math.round(v * 100) / 100;
  const rad = (d) => d * Math.PI / 180;

      read: 'A big motor\'s start is a sudden, heavy load. Here it takes 600 kVA from a 630 kVA set. At first, only the small sub-transient reactance holds the current back, say 0.15 per unit. A load drawing the set\'s own 630 kVA at full voltage is 1 per unit. A bigger load is a smaller impedance. So the motor\'s starting impedance is 630 ÷ 600 = 1.05 per unit. The two share the voltage like a divider. The motor keeps 1.05 ÷ (1.05 + 0.15) = 87.5%.',
      still: () => setStill(0.05) },
    { kind: 'pick', name: 'What the AVR does', lit: true, solveRun: {}, ctlSolved: ['start'],
      opts: ['It stops it, so the voltage holds at 100%', 'Nothing at first, then it pulls the voltage back', 'It makes it deeper, by cutting the field'],

      read: 'Now the engine. The start also takes 240 kW of real power, at an example power factor of 0.4. The engine cannot find that at once, so it slows. A slower rotor makes less voltage. So the dip goes deeper, to 83.8%. Then the governor adds fuel, and the speed comes back. The AVR raises the field, and the voltage climbs back to 100%. Once the motor is up to speed, its current falls away.',

    { kind: 'typed', name: 'A bigger motor', ans: 'once9', enter: { kva: 900 }, hide: ['once'], solveRun: { kva: 900 }, ctlSolved: ['start', 'kva'],

  K.check('Fifteen screens, six that show and nine to try; all three picks\' answers are second in their lists', () =>
