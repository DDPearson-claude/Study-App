<p class="caption">A sketch worked from the rule. Each bar's tick marks 100% field. The AVR's return is slowed.</p>

<script>
  // ================= the rule =================
  const strip = (s) => s.replace(/\[\^\d+\]/g, '');
  const NB = ' ';                              // a no-break space: a number never parts from its unit
  const SRC_AGN = 'https://www.stamford-avk.com/sites/stamfordavk/files/AGN124_C.pdf';
  const SRC_MAN = 'https://www.stamford-avk.com/sites/stamfordavk/files/2026-05/S9-HV-Alternators-Installation-Service-and-Maintenance-Manual-English.pdf';
  const SET = 440;                                  // the AVR's set point, V
  const PER = 1;                                    // the drop inside the machine for each 1% of load, V
  // The open-circuit curve: field current (% of the field that makes 440 V with nothing connected) against
  // the voltage made inside. A sketch through these points, straight between them.
  const OCC = [[0, 0], [25, 125], [50, 250], [75, 360], [100, 440], [125, 490], [150, 520], [175, 540], [200, 555]];
  function occ(f) {
    f = K.clamp(f, 0, 200);
    for (let k = 1; k < OCC.length; k++) {
      if (f <= OCC[k][0]) { const a = OCC[k - 1], b = OCC[k]; return a[1] + (b[1] - a[1]) * (f - a[0]) / (b[0] - a[0]); }
    }
    return OCC[OCC.length - 1][1];
  }
  // The curve read backwards: the field that makes v inside.
  function fieldFor(v) {
    v = K.clamp(v, 0, 555);
    for (let k = 1; k < OCC.length; k++) {
      if (v <= OCC[k][1]) { const a = OCC[k - 1], b = OCC[k]; return a[0] + (b[0] - a[0]) * (v - a[1]) / (b[1] - a[1]); }
    }
    return 200;
  }
  const dropOf = (load) => PER * load;
  // The voltage at the board: the curve's voltage at the present field, less the drop the load causes.
  const outOf = (field, load) => Math.max(0, occ(field) - dropOf(load));
  // Where the AVR settles: the field at which the curve gives the set point plus the drop.
  const avrField = (load) => fieldFor(SET + dropOf(load));
  // The AVR's own supply: on Shunt it follows the output; a PMG gives full power while the shaft turns.
  const avrPower = (supply, v) => (supply === 'pmg' ? 1 : K.clamp(v / SET, 0, 1));
  const TAU = 0.55, SNAP = 0.25, HOLD = 1.2;        // the AVR's slowed return (s on screen); how long a change is traced
  const r1 = (v) => Math.round(v * 10) / 10;
  const r2 = (v) => Math.round(v * 100) / 100;

  // ================= the lesson: SHOW screens demonstrate, DO screens are puzzles =================
  const STEPS = [
    { show: true, name: 'The open-circuit curve', mode: 'drag', ctl: ['field'], enter: { load: 0, field: 100, avr: false },
      demo: [{ at: 0.6, to: 3.0, ramp: { field: [100, 200] } }], dur: 3.6,
      text: 'This plot is the *open-circuit curve*. The set turns at a steady 1800 rev/min with nothing connected. So its voltage depends on the field current alone. Drag the field current up and watch the dot. At first the voltage climbs in step with the field. Then the curve bends over at a knee. There the iron saturates, as on a B-H curve. Past the knee, each extra step of field buys less voltage.',
      read: 'The set turns at 1800 rev/min with nothing connected. Its voltage follows the field current along the open-circuit curve. It climbs in step at first. Then it bends over at a knee as the iron saturates.',
      still: () => setStill() },
    { kind: 'typed', name: 'Double the field', ans: 'dbl', enter: { load: 0, field: 100, avr: false }, hide: ['V'],
      run: [{ at: 0.2, to: 1.8, ramp: { field: [100, 200] } }], rdur: 2.4,
      answer: 1.26, decimals: 2, unit: 'times', want: '1.26' + NB + 'times',
      slips: [{ value: 2, hint: 'That holds only on the straight part. Past the knee the flux no longer keeps up with the field.' },
        { value: 0.79, hint: 'That divides the wrong way round. The voltage went up.' }],
      task: 'With nothing connected, the field current doubles from 100% to 200%. The curve marks 440 V at 100% and 555 V at 200%. How many times higher is the voltage now?',
      hint: 'Divide the new voltage by the old one.',
      why: '555 ÷ 440 = 1.26. The field current doubled, but the flux did not. The iron is saturating, so the voltage rose by only 26%.',
      read: 'With nothing connected, the field current doubles from 100% to 200%. The curve marks 440 V at 100% and 555 V at 200%. How many times higher is the voltage now?' },
    { show: true, name: 'The exciter', mode: 'follow', enter: { load: 0, field: 100, avr: true },
      demo: [{ at: 0.4, light: 'feed' }, { at: 1.0, light: 'exf' }, { at: 1.6, light: 'exa' }, { at: 2.2, light: 'dio' }, { at: 2.8, light: 'main' }], dur: 3.6,
      text: 'The main field turns with the shaft. So how does direct current get into it? A brushless set has a second, smaller alternator on the same shaft. This is the *exciter*. Its field is fixed in the stator. Its coils turn on the shaft and make AC. A diode bridge on the shaft turns that AC into DC for the main field. The AVR feeds only the exciter\'s fixed field. So a small current there controls a much bigger one in the main field.',
      read: 'In a brushless set, the AVR feeds the exciter\'s fixed field. The exciter\'s turning coils make AC. A diode bridge on the shaft turns it into DC for the main field. No brushes are needed.',
      still: () => setStill() },
    { kind: 'pick', name: 'What the AVR feeds', enter: { load: 0, field: 100, avr: true },
      run: [{ at: 0.1, light: 'feed' }], rdur: 1.0,
      opts: ['The exciter\'s fixed field', 'The main field on the rotor', 'The main stator\'s output coils'],
      want: 'The exciter\'s fixed field',
      task: 'In a brushless set, which winding does the AVR\'s output feed?',
      hints: { 'The main field on the rotor': 'The main field turns with the shaft. The AVR sits still, so it reaches the main field only through the exciter and the diodes.',
        'The main stator\'s output coils': 'Those coils carry the output. The AVR measures them, but it feeds a field.' },
      why: 'The AVR sits off the shaft. It feeds the exciter\'s fixed field, which needs no brushes. The exciter\'s turning coils and the diodes then carry a much bigger current into the main field.',
      read: 'In a brushless set, which winding does the AVR\'s output feed?' },
    { show: true, name: 'A load pulls it down', mode: 'drag', ctl: ['load'], enter: { load: 0, field: 100, avr: false },
      demo: [{ at: 0.8, to: 1.2, ramp: { load: [0, 50] } }], dur: 3.4,
      text: 'A load pulls the voltage down, and with the field held it stays down. The AVR is off and the field sits at 100%. Drag the load to 50%. The voltage falls from 440 V to 390 V and stays there. The load\'s current drops voltage inside the machine. A transformer\'s output falls on load in much the same way. Nothing has changed the field, so nothing brings the voltage back. Here the drop is drawn as 1 V for each 1% of load.',
      read: 'The AVR is off and the field is held at 100%. A 50% load pulls the voltage down from 440 V to 390 V. It stays there.',
      still: () => setStill() },
    { kind: 'typed', name: 'Field held, more load', ans: 'held', enter: { load: 0, field: 100, avr: false }, hide: ['V'],
      run: [{ at: 0.2, to: 0.7, ramp: { load: [0, 80] } }], rdur: 2.4,
      answer: 360, decimals: 0, unit: 'V', want: '360' + NB + 'V',
      slips: [{ value: 440, hint: 'The field is held, but the load\'s current still drops voltage inside the machine.' },
        { value: 520, hint: 'The drop takes voltage away. It does not add it.' }],
      task: 'The AVR is off and the field is held at 100%. The load goes from 0% to 80%. The drop is 1 V for each 1% of load. What voltage reaches the board?',
      hint: 'Work out the drop, then take it off 440 V.',
      why: '80% of load drops 80 V. The field has not moved, so the curve still gives 440 V inside. So 440 − 80 = 360 V reaches the board. It stays there.',
      read: 'The AVR is off and the field is held at 100%. The load goes from 0% to 80%. The drop is 1 V for each 1% of load. What voltage reaches the board?' },
    { show: true, name: 'The AVR brings it back', mode: 'drag', ctl: ['load', 'avr'], enter: { load: 0, field: 100, avr: false },
      demo: [{ at: 0.5, set: { avr: true } }, { at: 1.1, to: 1.4, ramp: { load: [0, 50] } }], dur: 4.4,
      text: 'With the AVR on, the voltage comes back. Switch it on and drag the load to 50% again. The voltage dips towards 390 V at first. The main field is a big coil, so it cannot change in an instant. The AVR compares the output with its 440 V set point. It is 50 V short, so the AVR raises the exciter\'s field. The main field current climbs to 125%. The dot rides up the curve to 490 V. The board gets 440 V again.',
      read: 'With the AVR on, a 50% load dips the voltage towards 390 V at first. The AVR finds it 50 V short of 440 V. It raises the exciter\'s field. The main field climbs to 125%, and the output returns to 440 V.',
      still: () => setStill() },
    { kind: 'typed', name: 'Full load', ans: 'full', enter: { load: 50, avr: true }, hide: ['F'],
      run: [{ at: 0.2, to: 0.6, ramp: { load: [50, 100] } }], rdur: 3.8,
      answer: 175, decimals: 0, unit: '%', want: '175%',
      slips: [{ value: 150, hint: 'That doubles the 25% the first half of the load took. Past the knee each step of field buys fewer volts.' },
        { value: 200, hint: 'That adds 1% of field for each volt of drop. Read the curve instead.' },
        { value: 125, hint: 'That leaves the field where it was. The AVR must make up the bigger drop.' }],
      task: 'The AVR holds 440 V at 50% load with the field at 125%. The load rises to 100%. The drop is 1 V for each 1% of load. The curve marks 490 V at 125%, 520 V at 150% and 540 V at 175%. What field current does the AVR settle at?',
      hint: 'Find the voltage the set must make inside, then read the curve.',
      why: 'At 100% load the drop is 100 V. So the set must make 440 + 100 = 540 V inside. The curve gives 540 V at 175%. The first half of the load took 25% more field. The second half took 50%. The dot is now climbing past the knee.',
      read: 'The AVR holds 440 V at 50% load with the field at 125%. The load rises to 100%. The drop is 1 V for each 1% of load. The curve marks 490 V at 125%, 520 V at 150% and 540 V at 175%. What field current does the AVR settle at?' },
    { show: true, name: 'Where the AVR gets power', mode: 'supply', ctl: ['supply'], enter: { load: 50, avr: true, supply: 'shunt' },
      demo: [{ at: 0.6, light: 'shunt' }], dur: 3.0,
      text: strip('The AVR needs power of its own. Flip the supply switch to see two common ways. On Shunt, it takes power from the set\'s own output. The set is then self-excited. On PMG, a permanent magnet generator on the same shaft feeds it. That power lasts as long as the shaft turns, whatever the output does. A self-excited set cannot keep up a short-circuit current. It dies away quickly unless the fault is cleared at once.[^1]'),
      read: 'A shunt supply feeds the AVR from the set\'s own output. The set is then self-excited. A permanent magnet generator, or PMG, on the same shaft feeds it for as long as the shaft turns.',
      still: () => setStill() },
    { kind: 'pick', name: 'Through a short circuit', enter: { load: 50, avr: true, supply: 'shunt' }, lit: { shunt: 1 },
      run: [{ at: 0.1, set: { supply: 'pmg' }, light: 'pmg', unlight: 'shunt' }], rdur: 1.2,
      opts: ['Shunt, from the set\'s own output', 'PMG, on the same shaft', 'Either, since the shaft keeps turning'],
      want: 'PMG, on the same shaft',
      task: 'A short circuit on the board pulls the set\'s output voltage close to zero. Which AVR supply can keep the field up?',
      hints: { 'Shunt, from the set\'s own output': 'A shunt supply takes its power from the output. With the output near zero, the AVR has almost no power.',
        'Either, since the shaft keeps turning': 'The shaft turns either way. But only the PMG turns that into power for the AVR.' },
      why: 'The PMG takes its power from the shaft, not from the output. So the AVR can keep the exciter\'s field up through the fault. A shunt-fed AVR loses its power with the output. So the field and the fault current die away.',
      read: 'A short circuit on the board pulls the set\'s output voltage close to zero. Which AVR supply can keep the field up?' },
    { kind: 'typed', name: 'The load trips', ans: 'trip', enter: { load: 50, avr: true }, hide: ['V'],
      run: [{ at: 0.3, set: { load: 0 } }], rdur: 3.4,
      answer: 490, decimals: 0, unit: 'V', want: '490' + NB + 'V',
      slips: [{ value: 440, hint: 'That is after the AVR has acted. The main field cannot change in an instant.' },
        { value: 390, hint: 'A trip takes the drop away, so the voltage jumps up.' }],
      task: 'The AVR holds 440 V at 50% load, so the field sits at 125%. The load trips off. The curve marks 490 V at 125%. What is the voltage in the instant before the AVR acts?',
      hint: 'Read the curve at the field the set has now. Then take off the drop at no load.',
      why: 'The field is still at 125%, so the curve gives 490 V inside. With no load there is no drop. So the output jumps to 490 V. Then the AVR lowers the field until the board reads 440 V again.',
      read: 'The AVR holds 440 V at 50% load, so the field sits at 125%. The load trips off. The curve marks 490 V at 125%. What is the voltage in the instant before the AVR acts?' },
    { kind: 'typed', name: 'A light load', ans: 'light', enter: { load: 0, avr: true }, hide: ['F'],
      run: [{ at: 0.2, to: 0.4, ramp: { load: [0, 20] } }], rdur: 3.0,
      answer: 110, decimals: 0, unit: '%', want: '110%',
      slips: [{ value: 120, hint: 'That adds 1% of field for each volt. On this stretch 25% of field buys 50 V. So each volt needs 0.5%.' },
        { value: 100, hint: 'That leaves the field where it was. The AVR must make up the 20 V drop.' }],
      task: 'The AVR is on and the load is 20%. The drop is 1 V for each 1% of load. The curve runs straight from 440 V at 100% to 490 V at 125%. What field current does the AVR settle at?',
      hint: 'Find the voltage inside first. Then see how far along the straight stretch it sits.',
      why: 'The drop is 20 V, so the set must make 460 V inside. That is 20 V of the 50 V between 100% and 125%. So the field rises 20 ÷ 50 × 25 = 10%, to 110%.',
      close: 'The field sets the voltage, and the AVR sets the field.',
      read: 'The AVR is on and the load is 20%. The drop is 1 V for each 1% of load. The curve runs straight from 440 V at 100% to 490 V at 125%. What field current does the AVR settle at?' },
  ];
  const FINISH = 'The field current sets the voltage along the open-circuit curve, which bends over at the knee. A load drops voltage inside the machine. The AVR measures the output and moves the exciter\'s field until the board reads 440 V again. The field sets the voltage, and the AVR sets the field.';

  // ================= state =================
  const BASE = { load: 0, field: 100, avr: false, supply: 'shunt' };
  const X = Object.assign({}, BASE);
  const LITS = ['feed', 'exf', 'exa', 'dio', 'main', 'shunt', 'pmg'];
  let LIT = {};                                     // the parts lit along a path (1) or not
  const D = {};                                     // the lights as drawn, easing towards LIT
  LITS.forEach((k) => { D[k] = 0; });
  // The trace: the voltage at the board over the last WIN seconds on screen, one sample every DT.
  const WIN = 6, DT = 1 / 30, NS = Math.round(WIN / DT) + 1;
  const sim = { buf: new Array(NS).fill(SET), acc: 0, hold: 0 };
  const out = () => outOf(X.field, X.load);
  const steady = () => !X.avr || X.field === avrField(X.load);
  const blank = () => ({ pick: null, res: null, why: false, tries: 0, hint: '' });
  let S = STEPS.map(blank);
  const solved = (st) => !!st && (st.res === 'right' || st.res === 'shown');
  let T = Infinity, motionEnd = 0, scripted = false, lastStep = -1, finished = false, lastDone = false, noSettle = false;
  let REC = { t: {} };
  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const testing = () => document.documentElement.classList.contains('k-testing');
  const quiet = () => REDUCE || testing();
  const el = (id) => document.getElementById(id);
  const idx = (name) => STEPS.findIndex((d) => d.name === name);
  const hideVal = (i) => !finished && !STEPS[i].show && !solved(S[i]);
  function hiddenSet(i) {
    const d = STEPS[i], on = !finished && !!d.hide && !solved(S[i]), h = {};
    ['L', 'F', 'V'].forEach((k) => { h[k] = on && d.hide.indexOf(k) >= 0; });
    return h;
  }

  // ================= the set running =================
  function sample() { sim.buf.push(out()); sim.buf.shift(); }
  // Time h passes: the trace records the board's voltage, and a running AVR moves the field towards
  // where the curve gives the set point plus the drop. The main field is a big coil, so it moves smoothly.
  function advance(h) {
    if (!(h > 0)) return;
    sim.acc += h;
    while (sim.acc >= DT - 1e-9) { sim.acc -= DT; sample(); }
    if (X.avr) {
      const tg = avrField(X.load), e = tg - X.field;
      X.field = Math.abs(e) < SNAP ? tg : X.field + e * (1 - Math.exp(-h / TAU));
    }
    sim.hold = Math.max(0, sim.hold - h);
  }
  function playScript(sc, t0, t1) {
    if (!sc) return;
    sc.forEach((m) => {
      if (m.to == null && t0 <= m.at && m.at < t1) {
        const v0 = out();
        if (m.set) Object.assign(X, m.set);
        if (m.light) LIT[m.light] = 1;
        if (m.unlight) LIT[m.unlight] = 0;
        if (out() !== v0) sample();               // a sudden change shows on the trace at once
      }
      if (m.ramp && t1 > m.at) {
        const f = K.ease(K.clamp((t1 - m.at) / (m.to - m.at), 0, 1));
        Object.keys(m.ramp).forEach((k) => { const r = m.ramp[k]; X[k] = K.lerp(r[0], r[1], f); });
      }
    });
  }
  function runSync(sc, dur) {
    const h = 1 / 60;
    for (let t = 0; t < dur - 1e-9; t += h) { const t1 = Math.min(t + h, dur); playScript(sc, t, t1); advance(t1 - t); }
  }
  // Let the AVR finish, and the trace run on a little (tests and reduced motion draw it at once).
  function settleNow() {
    const h = 1 / 60;
    let n = 0;
    while ((!steady() || sim.hold > 0) && n++ < 900) advance(h);
    sim.hold = 0;
  }

  // ================= text with amber key terms (built with K.el, never innerHTML) =================
  const UNIT_GAP = /(\d) (?=(?:V|rev\/min|times)(?![A-Za-z]))/g;
  function write(node, s) {
    node.textContent = '';
    String(s || '').replace(UNIT_GAP, '$1' + NB).replace(/rev\/min/g, 'rev/⁠min').replace(/B-H/g, 'B‑H')
      .split(/\*([^*]+)\*/).forEach((seg, k) => {
        if (!seg) return;
        node.appendChild(k % 2 ? K.el('span', { class: 'term' }, seg) : document.createTextNode(seg));
      });
  }

  // ================= controls =================
  const stepper = K.stepper({ id: 'step', label: 'Screen', steps: STEPS.map((d) => d.name), value: 0, compact: true, into: '#prog' });
  const at = () => K.clamp(Math.round(stepper.get()) || 0, 0, STEPS.length - 1);
  const CTL = {
    field: K.control({ id: 'field', label: 'Field current', min: 0, max: 200, step: 5, value: 100, snap: [100, 200], fmt: (v) => v + '%', into: '#c-field' }),
    load: K.control({ id: 'load', label: 'Load', min: 0, max: 100, step: 10, value: 0, snap: [50, 80, 100], fmt: (v) => v + '% of rating', into: '#c-load' }),
    avr: K.toggle({ id: 'avr', label: 'AVR', value: false, into: '#c-avr' }),
    supply: K.choice({ id: 'supply', label: 'AVR supply', options: [{ value: 'shunt', label: 'Shunt' }, { value: 'pmg', label: 'PMG' }], value: 'shunt', into: '#c-supply' }),
  };
  const CIDS = ['field', 'load', 'avr', 'supply'];
  const pushed = {};
  CIDS.forEach((id) => { pushed[id] = CTL[id].get(); });
  // The page moves the controls itself (silently, so it is not taken for Dan's move).
  function push() { CIDS.forEach((id) => { if (pushed[id] !== X[id]) { CTL[id].set(X[id], true); pushed[id] = CTL[id].get(); } }); }
  const shownCtl = (d, id) => !finished && !!d.ctl && d.ctl.indexOf(id) >= 0;

  const RO = {
    L: K.readout({ id: 'r-load', label: 'Load in %', fmt: (v) => String(v), into: '#outs' }),
    F: K.readout({ id: 'r-field', label: 'Field current in %', fmt: (v) => String(v), into: '#outs' }),
    V: K.readout({ id: 'r-volt', label: 'Voltage in V', fmt: (v) => String(v), into: '#outs' }),
  };

  // Up to three answer buttons; each puzzle fills in its own.
  const pickBtns = [0, 1, 2].map((k) => K.button({ label: 'Answer ' + (k + 1), secondary: true, into: '#picks', press: () => {
    const i = at(), d = STEPS[i], st = S[i];
    if (finished || d.kind !== 'pick' || k >= d.opts.length || solved(st)) return;
    st.pick = d.opts[k]; st.res = null;
  } }));
  // Typed answers: a field each; Check grades it, two misses show the working.
  const ANS = {};
  STEPS.forEach((d, i) => {
    if (d.kind !== 'typed') return;
    el('answers').appendChild(K.el('div', { id: 'ans-' + d.ans }));
    const a = K.answer({ id: 'a-' + d.ans, unit: d.unit, answer: d.answer, decimals: d.decimals, slips: d.slips, into: '#ans-' + d.ans,
      onCheck: (r) => {
        const st = S[i];
        if (solved(st)) return;
        if (r.state === 'right') { st.res = 'right'; playRun(i); }
        else if (r.state === 'wrong') {
          st.tries += 1; st.hint = r.hint || d.hint;
          if (st.tries >= 2) { st.res = 'shown'; st.why = true; a.reveal(); playRun(i); }
          else st.res = 'wrong';
        } else { st.res = r.state; st.hint = ''; }
        K.refresh();
      } });
    ANS[d.ans] = a;
  });
  const checkBtn = K.button({ label: 'Check', into: '#acts', press: () => {
    const i = at(), d = STEPS[i], st = S[i];
    if (finished || d.show || solved(st)) return;
    if (d.kind === 'typed') { ANS[d.ans].check(); return; }
    if (st.pick == null) { st.res = 'empty'; return; }
    st.res = st.pick === d.want ? 'right' : 'wrong';
    if (st.res === 'right') playRun(i);
  } });
  const whyBtn = K.button({ label: 'Why?', secondary: true, into: '#acts', press: () => {
    const d = STEPS[at()];
    if (d.show || finished) return;
    S[at()].why = !S[at()].why;
  } });
  const replayBtn = K.button({ label: 'Show me again', secondary: true, into: '#replay', press: () => {
    const d = STEPS[at()];
    if (finished || !d.show) return;
    startDemo(at());
  } });
  const backBtn = K.button({ label: 'Back', secondary: true, into: '#nav', press: () => {
    if (finished) { finished = false; return; }
    stepper.set(Math.max(0, at() - 1), true);
  } });
  const nextBtn = K.button({ label: 'Continue', into: '#nav', press: () => {
    const i = at();
    if (finished || (!STEPS[i].show && !solved(S[i]))) return;
    if (i < STEPS.length - 1) { stepper.set(i + 1, true); return; }
    finished = true; anim.pause(); T = Infinity;
    if (typeof K.complete === 'function') K.complete();
  } });
  K.button({ label: 'Start again', secondary: true, into: '#again', press: () => {
    S = STEPS.map(blank); finished = false; lastStep = -1;
    Object.keys(ANS).forEach((k) => ANS[k].reset());
    stepper.set(0, true);
  } });

  // ================= motion: one animation runs the demonstrations, the answers' motion, the AVR and the lights =================
  function tween(dt) {
    const a = 1 - Math.exp(-dt / 0.13);
    LITS.forEach((k) => { const t = LIT[k] ? 1 : 0, e = t - D[k]; D[k] = Math.abs(e) < 2e-3 ? t : D[k] + e * a; });
  }
  const lightsSettled = () => LITS.every((k) => D[k] === (LIT[k] ? 1 : 0));
  function snapD() { LITS.forEach((k) => { D[k] = LIT[k] ? 1 : 0; }); }
  const needAnim = () => !finished && (T !== Infinity || !steady() || sim.hold > 0 || !lightsSettled());
  const anim = K.anim({ button: false, label: 'Running', step: (dt) => {
    if (finished) return false;
    dt = Math.min(dt, 0.1);
    const i = at(), d = STEPS[i];
    if (T !== Infinity) {
      const t0 = T;
      T = Math.min(T + dt, motionEnd);
      playScript(scripted ? d.demo : d.run, t0, T);
      if (T >= motionEnd) { T = Infinity; scripted = false; }
    }
    advance(dt);
    tween(dt);
    push();
    paint(i);
    return needAnim();
  } });
  function kick() { if (!quiet() && needAnim() && !anim.playing()) anim.play(); }
  function endDemo() { if (T !== Infinity) { T = Infinity; scripted = false; } }
  // A screen's state: its opening, then (at once, when asked) its demonstration's end or its answer's motion.
  function prep(i, solvedNow, showEnd) {
    const d = STEPS[i];
    Object.assign(X, BASE, d.enter || {});
    if (X.avr) X.field = avrField(X.load);        // a running AVR has settled before the screen opens
    LIT = Object.assign({}, d.lit || {});
    sim.buf = new Array(NS).fill(out()); sim.acc = 0; sim.hold = 0;
    if (d.show) { if (showEnd) { runSync(d.demo, d.dur); if (!noSettle) settleNow(); } }
    else if (solvedNow && d.run) { runSync(d.run, d.rdur); if (!noSettle) settleNow(); }
    snapD();
  }
  function startDemo(i) {
    const d = STEPS[i];
    anim.pause();
    if (!quiet()) { prep(i, false, false); scripted = true; T = 0; motionEnd = d.dur; anim.play(); }
    else { scripted = false; T = Infinity; prep(i, false, true); }
    push();
  }
  function playRun(i) {
    const d = STEPS[i];
    anim.pause(); scripted = false; T = Infinity;
    if (!d.run) return;
    if (quiet()) { runSync(d.run, d.rdur); settleNow(); snapD(); push(); return; }
    T = 0; motionEnd = d.rdur; anim.play();
  }
  function enterStep(i) {
    anim.pause(); T = Infinity; scripted = false;
    enter('stepbox');
    if (STEPS[i].show) { startDemo(i); return; }
    prep(i, solved(S[i]), false);
    push();
  }
  // The finished picture a still shows (the read-through), with the controls where its words end.
  function setStill() {
    const i = at();
    anim.pause(); T = Infinity; scripted = false;
    prep(i, solved(S[i]), true);
    push();
    K.refresh();
  }
  function enter(id) {
    if (REDUCE) return;
    const box = el(id);
    box.classList.remove('enter');
    void box.offsetWidth;
    box.classList.add('enter');
  }

  // ================= the set along its shaft =================
  const scSvg = el('scene'), occSvg = el('occ'), trSvg = el('trc');
  function adder(g) { return (tag, attrs, txt) => g.appendChild(txt == null ? K.svg(tag, attrs) : K.svg(tag, attrs, txt)); }
  function drawSet() {
    const g = el('setArt');
    g.textContent = '';
    const a = adder(g), fr = K.clamp(X.field / 200, 0, 1), vo = out(), pw = avrPower(X.supply, vo);
    // The key: a field bar with its 100% tick; the lit path while anything is lit.
    a('rect', { class: 'blk', x: 6, y: 5, width: 24, height: 11 });
    a('rect', { class: 'bar', x: 6.6, y: 5.6, width: 11.4, height: 9.8 });
    a('line', { class: 'tick', x1: 18, y1: 3, x2: 18, y2: 18 });
    a('text', { class: 'lab', x: 36, y: 15 }, 'field current');
    const litMax = Math.max.apply(null, LITS.map((k) => D[k]));
    if (litMax > 0.01) {
      const kg = a('g', { opacity: r2(litMax) });
      kg.appendChild(K.svg('line', { class: 'lit', x1: 160, y1: 10.5, x2: 176, y2: 10.5 }));
      kg.appendChild(K.svg('text', { class: 'lab', x: 182, y: 15 }, 'lit path'));
    }
    // The shaft, turning at a steady speed.
    a('rect', { class: 'shaft', x: 6, y: 77, width: 328, height: 6 });
    a('path', { class: 'rot', d: 'M298 66A8 14 0 1 1 298 94' });
    a('path', { class: 'ink', d: 'M292 94L299 89.5L299 98.5Z' });
    a('text', { class: 'lab', x: 334, y: 60, 'text-anchor': 'end' }, '1800' + NB + 'rev/min');
    // The PMG: a magnet on the shaft inside its own small stator.
    a('rect', { class: 'iron', x: 14, y: 58, width: 28, height: 9 });
    a('rect', { class: 'iron', x: 14, y: 93, width: 28, height: 9 });
    a('rect', { class: 'mag', x: 18, y: 71, width: 20, height: 18 });
    a('text', { class: 'lab', x: 28, y: 51, 'text-anchor': 'middle' }, 'PMG');
    // The exciter: its field fixed in the stator (with its bar), its coils turning on the shaft.
    [54, 94].forEach((y) => {
      a('rect', { class: 'blk', x: 54, y, width: 48, height: 12 });
      if (fr > 0) a('rect', { class: 'bar', x: 54.6, y: y + 0.6, width: r1(46.8 * fr), height: 10.8 });
      a('line', { class: 'tick', x1: 78, y1: y - 2, x2: 78, y2: y + 14 });
    });
    a('rect', { class: 'blk', x: 58, y: 70, width: 40, height: 20 });
    for (let x = 63; x <= 93; x += 5) a('line', { class: 'wind', x1: x, y1: 72, x2: x, y2: 88 });
    a('text', { class: 'lab', x: 78, y: 47, 'text-anchor': 'middle' }, 'Exciter');
    // The diode bridge riding on the shaft, between the exciter's coils and the main field.
    a('line', { class: 'lead', x1: 98, y1: 74, x2: 116, y2: 74 });
    a('rect', { class: 'blk', x: 116, y: 70, width: 26, height: 20 });
    a('path', { class: 'ink', d: 'M123 74V86L132 80Z' });
    a('line', { class: 'lead', x1: 133, y1: 74, x2: 133, y2: 86 });
    a('text', { class: 'lab', x: 129, y: 63, 'text-anchor': 'middle' }, 'Diodes');
    a('line', { class: 'lead', x1: 142, y1: 74, x2: 160, y2: 74 });
    // The main machine: the main field on the rotor (with its bar), the stator around it.
    a('rect', { class: 'iron', x: 156, y: 40, width: 84, height: 18 });
    a('rect', { class: 'iron', x: 156, y: 102, width: 84, height: 18 });
    a('rect', { class: 'blk', x: 160, y: 64, width: 76, height: 32 });
    if (fr > 0) a('rect', { class: 'bar', x: 160.6, y: 64.6, width: r1(74.8 * fr), height: 9.4 });
    a('line', { class: 'tick', x1: 198, y1: 61, x2: 198, y2: 75 });
    a('text', { class: 'lab', x: 198, y: 89, 'text-anchor': 'middle' }, 'Main field');
    a('text', { class: 'lab', x: 198, y: 33, 'text-anchor': 'middle' }, 'Stator');
    // The output: down from the stator to the board's terminals, and on to the load.
    a('path', { class: 'lead', d: 'M226 120V136H268' });
    a('rect', { class: 'blk', x: 268, y: 123, width: 64, height: 26, rx: 4 });
    a('text', { class: 'lab', x: 300, y: 140.5, 'text-anchor': 'middle' }, 'Load');
    // The AVR's leads: it senses the output, takes power from the output (Shunt) or the PMG, and feeds the exciter's field.
    a('path', { class: 'lead', d: 'M226 136V160H92' });
    a('text', { class: 'lab', x: 150, y: 154, 'text-anchor': 'middle' }, 'sense');
    a('path', { class: 'lead', d: 'M246 136V184H92' });
    a('text', { class: 'lab', x: 150, y: 176, 'text-anchor': 'middle' }, 'Shunt');
    a('path', { class: 'lead', d: 'M28 102V140' });
    a('path', { class: 'lead', d: 'M70 106V140' });
    a('circle', { class: 'ink', cx: 226, cy: 136, r: 3 });
    a('circle', { class: 'ink', cx: 246, cy: 136, r: 3 });
    a('rect', { class: 'avr', x: 10, y: 140, width: 82, height: 54, rx: 6 });
    a('text', { class: 'labb', x: 51, y: 159, 'text-anchor': 'middle' }, X.avr ? 'AVR on' : 'AVR off');
    a('text', { class: 'lab', x: 17, y: 183 }, 'power');
    a('rect', { class: 'track', x: 60, y: 174, width: 26, height: 9, rx: 2 });
    if (pw > 0) a('rect', { class: 'pow', x: 60, y: 174, width: r1(26 * pw), height: 9, rx: 2 });
    // The lit path, drawn over the parts it runs through.
    const lit = (k, d) => { if (D[k] > 0.01) a('path', { class: 'lit', d, opacity: r2(D[k]) }); };
    lit('feed', 'M70 140V106');
    lit('exf', 'M54 54h48v12h-48zM54 94h48v12h-48z');
    lit('exa', 'M58 70h40v20h-40z');
    lit('dio', 'M98 74H116M116 70h26v20h-26z');
    lit('main', 'M142 74H160M160 64h76v32h-76z');
    lit('shunt', 'M246 136V184H92');
    lit('pmg', 'M28 102V140');
    REC.lit = Object.assign({}, D);
    REC.pw = pw;
    const rel = X.field > 100.5 ? 'past' : X.field < 99.5 ? 'short of' : 'at';
    const litNames = { feed: 'the AVR\'s lead to the exciter', exf: 'the exciter\'s field', exa: 'the exciter\'s turning coils', dio: 'the diodes', main: 'the main field', shunt: 'the shunt supply from the output', pmg: 'the supply from the PMG' };
    const lits = LITS.filter((k) => D[k] > 0.5).map((k) => litNames[k]);
    scSvg.setAttribute('aria-label', 'A brushless generator set drawn side-on along one shaft turning at 1800 rev/min: the PMG, the exciter with its fixed field and turning coils, the diodes on the shaft, and the main field inside the stator. The output runs to the load. The AVR is ' +
      (X.avr ? 'on' : 'off') + '. It senses the output, takes its power ' + (X.supply === 'pmg' ? 'from the PMG' : 'from the output, by the shunt lead') + ', and feeds the exciter\'s fixed field. The exciter\'s field bars and the main field\'s bar stand ' + rel + ' their 100% ticks.' +
      (lits.length ? ' Lit: ' + lits.join(', ') + '.' : ''));
  }

  // ================= the open-circuit curve and the trace: the same voltage scale =================
  const PX0 = 50, PX1 = 326, PY0 = 182, PYT = 26, KY = (PY0 - PYT) / 600;
  const xF = (f) => PX0 + f / 200 * (PX1 - PX0);
  const yV = (v) => PY0 - v * KY;
  function axes(a) {
    a('line', { class: 'ax', x1: PX0, y1: PY0, x2: PX1, y2: PY0 });
    a('line', { class: 'ax', x1: PX0, y1: PY0, x2: PX0, y2: PYT - 4 });
    [[0, '0'], [200, '200'], [440, '440'], [600, '600' + NB + 'V']].forEach((q) => {
      const y = r1(yV(q[0]));
      a('line', { class: 'ax', x1: PX0 - 4, y1: y, x2: PX0, y2: y });
      a('text', { class: 'lab', x: PX0 - 7, y: r1(y + 4.5), 'text-anchor': 'end' }, q[1]);
    });
  }
  function drawCurve(i) {
    const g = el('occArt');
    g.textContent = '';
    const a = adder(g), y440 = r1(yV(SET));
    a('circle', { class: 'pdot', cx: 56, cy: 9, r: 4.5 });
    a('text', { class: 'lab', x: 65, y: 13.5 }, 'made inside');
    a('circle', { class: 'ring', cx: 168, cy: 9, r: 4.5 });
    a('text', { class: 'lab', x: 177, y: 13.5 }, 'at the board');
    axes(a);
    [0, 50, 100, 150, 200].forEach((f) => { const x = r1(xF(f)); a('line', { class: 'ax', x1: x, y1: PY0, x2: x, y2: PY0 + 5 }); });
    a('text', { class: 'lab', x: PX0, y: 198, 'text-anchor': 'middle' }, '0');
    a('text', { class: 'lab', x: r1(xF(100)), y: 198, 'text-anchor': 'middle' }, '100%');
    a('text', { class: 'lab', x: 332, y: 198, 'text-anchor': 'end' }, '200%');
    a('text', { class: 'lab', x: r1(xF(100)), y: 215, 'text-anchor': 'middle' }, 'field current');
    const ref = a('line', { class: 'ref', x1: PX0, y1: y440, x2: PX1, y2: y440 });
    a('text', { class: 'mut', x: PX0 + 6, y: r1(y440 - 6) }, 'set point');
    const curve = a('polyline', { class: 'occ', points: OCC.map((p) => r1(xF(p[0])) + ',' + r1(yV(p[1]))).join(' ') });
    // The dot at the present field; the drop the load causes, down to the voltage at the board.
    const vi = occ(X.field), vo = out(), dv = vi - vo, x = r1(xF(X.field)), y1 = r1(yV(vi)), y2 = r1(yV(vo));
    let dropLine = null;
    if (dv > 0.5) {
      dropLine = a('line', { class: 'drop', x1: x, y1, x2: x, y2 });
      a('circle', { class: 'ring', cx: x, cy: y2, r: 4.5 });
    }
    const dot = a('circle', { class: 'pdot', cx: x, cy: y1, r: 5 });
    const items = [];
    REC.val = hideVal(i) ? null : Math.round(vi) + NB + 'V';
    REC.drop = dv > 0.5 ? 'drop ' + Math.round(dv) + NB + 'V' : null;
    if (REC.val) items.push({ x: r1(x - 9), y: r1(y1 - 8), text: REC.val, anchor: 'end', class: 'lab' });
    if (REC.drop) items.push({ x, y: r1(y2 + 20), text: REC.drop, class: 'lab' });
    const lg = a('g', {});
    const texts = K.labels(lg, items, { avoid: [curve, ref, dropLine, dot].filter(Boolean) });
    if (REC.drop && texts.length) texts[texts.length - 1].setAttribute('opacity', r2(K.clamp((dv - 2) / 8, 0, 1)));
    occSvg.setAttribute('aria-label', 'The open-circuit curve: the voltage the set makes inside, 0 to 600 V, against the field current, 0 to 200%. It climbs steeply, then bends over at a knee. A dot marks the present field current on the curve' +
      (dv > 0.5 ? ', and a ring below it marks the voltage at the board. The line between them is the drop the load causes inside the machine.' : '. With nothing connected, the board gets all of it.') + ' A dashed line marks the 440 V set point.');
  }
  function drawTrace() {
    const g = el('trArt');
    g.textContent = '';
    const a = adder(g), y440 = r1(yV(SET));
    a('line', { class: 'tr', x1: 50, y1: 9, x2: 68, y2: 9 });
    a('text', { class: 'lab', x: 73, y: 13.5 }, 'voltage at the board');
    a('line', { class: 'ref', x1: 224, y1: 9, x2: 242, y2: 9 });
    a('text', { class: 'lab', x: 247, y: 13.5 }, 'set point');
    axes(a);
    a('line', { class: 'ref', x1: PX0, y1: y440, x2: PX1, y2: y440 });
    a('text', { class: 'lab', x: PX1, y: 198, 'text-anchor': 'end' }, 'time →');
    const pts = sim.buf.map((v, k) => r1(PX0 + k * (PX1 - PX0) / (NS - 1)) + ',' + r1(yV(v))).join(' ');
    a('polyline', { class: 'tr', points: pts });
    const last = sim.buf[NS - 1];
    a('circle', { class: 'pdot', cx: PX1, cy: r1(yV(last)), r: 3.5 });
    const mn = Math.min.apply(null, sim.buf), mx = Math.max.apply(null, sim.buf);
    Object.assign(REC, { min: mn, max: mx, last });
    const where = Math.abs(last - SET) < 0.5 ? 'on the set point' : last < SET ? 'below the set point' : 'above the set point';
    trSvg.setAttribute('aria-label', 'A trace of the voltage at the board against time, newest at the right, with the 440 V set point dashed. It ends ' + where +
      (mx - mn > 1 ? ', after a change a few seconds ago.' : ', running flat.'));
  }

  // ================= one paint =================
  function readouts(i) {
    const h = hiddenSet(i), tx = {
      L: h.L ? '?' : String(Math.round(X.load)),
      F: h.F ? '?' : String(Math.round(X.field)),
      V: h.V ? '?' : String(Math.round(out())) };
    Object.keys(RO).forEach((k) => RO[k].set(tx[k]));
    Object.assign(REC.t, tx);
  }
  function paint(i) {
    if (i == null) i = at();
    REC = { t: {}, field: X.field, load: X.load, avr: X.avr, supply: X.supply, steady: steady() };
    drawSet();
    drawCurve(i);
    drawTrace();
    readouts(i);
  }

  // ================= the page around the picture =================
  write(el('finish'), FINISH);
  const setLab = (b, s) => { if (b.el.textContent !== s) b.setLabel(s); };
  function layout(i) {
    const d = STEPS[i], st = S[i], sol = solved(st);
    el('stepbox').hidden = finished;
    el('done').hidden = !finished;
    el('count').textContent = 'Screen ' + (i + 1) + ' of ' + STEPS.length;
    const task = el('task');
    task.className = 'task' + (d.show ? ' show' : '');
    write(task, d.show ? d.text : d.task);
    CIDS.forEach((id) => { el('c-' + id).hidden = !shownCtl(d, id); });
    el('sws').hidden = el('c-avr').hidden && el('c-supply').hidden;
    replayBtn.el.hidden = !d.show || finished || (REDUCE && d.mode !== 'follow');
    setLab(replayBtn, d.mode === 'follow' ? 'Follow' : 'Show me again');
    el('replay').hidden = replayBtn.el.hidden;
    const opts = d.kind === 'pick' ? d.opts : [];
    el('picks').hidden = !opts.length;
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      setLab(b, opts[k]);
      b.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });
    el('answers').hidden = d.kind !== 'typed';
    Object.keys(ANS).forEach((key) => { el('ans-' + key).hidden = d.ans !== key; });
    el('acts').hidden = !!d.show;
    checkBtn.el.hidden = sol;
    const fb = el('fb');
    fb.hidden = !!d.show;
    fb.className = 'fb' + (st.res === 'right' ? ' right' : '');
    let say = '';
    if (!d.show) {
      if (st.res === 'right') say = 'That\'s it.';
      else if (st.res === 'shown') say = 'Here is the working.';
      else if (st.res === 'wrong') say = d.kind === 'typed' ? st.hint : (d.hints && d.hints[st.pick]) || d.hint || '';
      else if (st.res === 'empty' && d.kind === 'pick') say = 'Pick one of the answers first.';
    }
    write(fb, say);
    const why = el('why');
    why.hidden = d.show || !st.why;
    write(why, d.show ? '' : d.why);
    setLab(whyBtn, st.why ? 'Hide why' : 'Why?');
    const cl = el('closing');
    cl.hidden = !(d.close && sol);
    write(cl, d.close || '');
    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !sol);
    setLab(nextBtn, i === STEPS.length - 1 ? 'Finish' : 'Continue');
    el('nav').hidden = backBtn.el.hidden && nextBtn.el.hidden;
  }

  K.update((p) => {
    const i = at(), d = STEPS[i];
    if (i !== lastStep) { lastStep = i; enterStep(i); }
    else {
      let moved = false;
      CIDS.forEach((id) => {
        if (p[id] === pushed[id]) return;
        if (shownCtl(d, id)) {
          endDemo();
          X[id] = p[id]; pushed[id] = p[id]; moved = true;
          if (id === 'supply') { LIT.shunt = p[id] === 'shunt' ? 1 : 0; LIT.pmg = p[id] === 'pmg' ? 1 : 0; }
        } else CTL[id].set(pushed[id], true);      // a control this screen does not use stays put
      });
      if (moved) { sample(); sim.hold = HOLD; if (quiet()) settleNow(); }
      push();
    }
    if (finished !== lastDone) { lastDone = finished; enter(finished ? 'done' : 'stepbox'); }
    if (quiet()) snapD();
    layout(i);
    paint(i);
    kick();
  });

  // ================= known answers, worked out by hand =================
  const solvedSt = (i) => Object.assign(blank(), STEPS[i].kind === 'pick' ? { pick: STEPS[i].want, res: 'right' } : { res: 'right' });
  // A screen in the state given (finished), with an optional change after: what it drew.
  function drawn(i, st, more) {
    const keep = { X: Object.assign({}, X), LIT: Object.assign({}, LIT), D: Object.assign({}, D), buf: sim.buf.slice(), acc: sim.acc, hold: sim.hold, S: S[i], T, sc: scripted };
    S[i] = st || blank(); T = Infinity; scripted = false;
    try {
      prep(i, solved(S[i]), true);
      if (more) more();
      snapD();
      paint(i);
      return REC;
    } finally {
      Object.assign(X, keep.X); LIT = keep.LIT; Object.assign(D, keep.D); sim.buf = keep.buf; sim.acc = keep.acc; sim.hold = keep.hold;
      S[i] = keep.S; T = keep.T; scripted = keep.sc;
      paint();
    }
  }
  const iCurve = idx('The open-circuit curve'), iDbl = idx('Double the field'), iExc = idx('The exciter'), iFeed = idx('What the AVR feeds');
  const iLoad = idx('A load pulls it down'), iHeld = idx('Field held, more load'), iBack = idx('The AVR brings it back'), iFull = idx('Full load');
  const iSup = idx('Where the AVR gets power'), iSc = idx('Through a short circuit'), iTrip = idx('The load trips'), iLight = idx('A light load');

  K.check('The curve marks 440 V at 100% and 555 V at 200%: doubling the field lifts the voltage only 555 ÷ 440 = 1.26 times', () => {
    const a = drawn(iCurve), b0 = drawn(iDbl), b = drawn(iDbl, solvedSt(iDbl));
    return occ(100) === 440 && occ(200) === 555 && r2(555 / 440) === 1.26 && a.t.L === '0' && a.t.F === '200' && a.t.V === '555' &&
      b0.t.V === '?' && b0.val === null && b.t.V === '555' && b.t.F === '200' && b.val === '555' + NB + 'V';
  });
  K.check('Past the knee each step of field buys less: the first 25% of field makes 125 V, the last 25% only 15 V', () => {
    const s = OCC.slice(1).map((p, k) => (p[1] - OCC[k][1]) / (p[0] - OCC[k][0]));
    return occ(25) - occ(0) === 125 && occ(200) - occ(175) === 15 && s.every((v, k) => k === 0 || v <= s[k - 1]) && occ(0) === 0;
  });
  K.check('With the AVR off and the field held at 100%, a 50% load leaves 390 V at the board and an 80% load 360 V, and the voltage stays there', () => {
    const a = drawn(iLoad), b0 = drawn(iHeld), b = drawn(iHeld, solvedSt(iHeld));
    return a.t.V === '390' && a.t.F === '100' && a.t.L === '50' && Math.abs(a.last - 390) < 1e-9 && Math.abs(a.min - 390) < 1e-9 && a.drop === 'drop 50' + NB + 'V' &&
      b0.t.V === '?' && b.t.V === '360' && b.t.L === '80' && b.drop === 'drop 80' + NB + 'V' && Math.abs(b.last - 360) < 1e-9;
  });
  K.check('With the AVR on, the field settles where the curve gives 440 V plus the drop: 125% at 50% load, 175% at full load, 110% at 20%, with 440 V at the board', () => {
    const a = drawn(iBack), b0 = drawn(iFull), b = drawn(iFull, solvedSt(iFull)), c0 = drawn(iLight), c = drawn(iLight, solvedSt(iLight));
    return a.t.F === '125' && a.t.V === '440' && a.t.L === '50' && b0.t.F === '?' && b.t.F === '175' && b.t.V === '440' && b.t.L === '100' &&
      c0.t.F === '?' && c.t.F === '110' && c.t.V === '440' && c.t.L === '20' && avrField(50) === 125 && avrField(100) === 175 && Math.abs(avrField(20) - 110) < 1e-9;
  });
  K.check('Under the AVR, a 50% load first dips the voltage below 440 V, not as far as 390 V, and then the AVR brings it back to 440 V', () => {
    const a = drawn(iBack);
    return a.avr === true && a.min < 430 && a.min > 390 && Math.abs(a.last - SET) < 1e-9 && a.drop === 'drop 50' + NB + 'V' && a.val === '490' + NB + 'V';
  });
  K.check('When the load trips off, the voltage jumps to 490 V at once; the AVR then brings it back to 440 V with the field at 100%', () => {
    const a0 = drawn(iTrip), a = drawn(iTrip, solvedSt(iTrip));
    return a0.t.V === '?' && a0.val === null && Math.abs(a.max - 490) < 1e-9 && Math.abs(a.last - SET) < 1e-9 && a.t.F === '100' && a.t.L === '0' && a.t.V === '440';
  });
  K.check('The AVR controls the alternator output voltage by automatic adjustment of the exciter stator field strength', () => {
    const loads = K.linspace(0, 100, 11);
    const ok = loads.every((ld) => Math.abs(outOf(avrField(ld), ld) - SET) < 1e-9) && loads.every((ld, k) => k === 0 || avrField(ld) > avrField(loads[k - 1]));
    const a = drawn(iFeed, solvedSt(iFeed));
    return ok && a.lit.feed === 1 && a.lit.main === 0 && STEPS[iFeed].want === STEPS[iFeed].opts[0];
  }, { source: SRC_MAN });
  K.check('Self-excited alternators will not maintain a short-circuit current: with the output near 0, a shunt-fed AVR has no power, while a PMG keeps it supplied', () => {
    const a = drawn(iSc, solvedSt(iSc));
    return avrPower('shunt', 0) === 0 && avrPower('pmg', 0) === 1 && a.supply === 'pmg' && a.lit.pmg === 1 && a.lit.shunt === 0 && STEPS[iSc].want === STEPS[iSc].opts[1];
  }, { source: SRC_AGN });
  K.check('Follow lights the path from the AVR through the exciter and the diodes into the main field; the supply screen lights the shunt lead', () => {
    const a = drawn(iExc), s = drawn(iSup);
    return ['feed', 'exf', 'exa', 'dio', 'main'].every((k) => a.lit[k] === 1) && a.lit.shunt === 0 && s.lit.shunt === 1 && s.lit.pmg === 0 && s.supply === 'shunt' && s.pw === 1;
  });
  K.check('Each typed answer and slip is worked from the rule: 1.26 times (2, 0.79), 360 V (440, 520), 175% (150, 200, 125), 490 V (440, 390) and 110% (120, 100)', () => {
    const sl = (i, v) => STEPS[i].slips.length === v.length && STEPS[i].slips.every((s, k) => Math.abs(s.value - v[k]) < 1e-12);
    const work = r2(occ(200) / occ(100)) === 1.26 && r2(occ(100) / occ(200)) === 0.79 && 200 / 100 === 2 &&
      outOf(100, 80) === 360 && occ(100) + dropOf(80) === 520 && outOf(100, 0) === 440 &&
      avrField(100) === 175 && avrField(50) + 2 * (avrField(50) - 100) === 175 && 100 + 2 * (avrField(50) - 100) === 150 && 100 + dropOf(100) === 200 &&
      outOf(125, 0) === 490 && outOf(125, 50) === 440 && outOf(100, 50) === 390 &&
      Math.abs(avrField(20) - 110) < 1e-9 && 100 + dropOf(20) === 120 && Math.abs((490 - 440) / 25 - 2) < 1e-12;
    return work && STEPS[iDbl].answer === 1.26 && STEPS[iHeld].answer === 360 && STEPS[iFull].answer === 175 && STEPS[iTrip].answer === 490 && STEPS[iLight].answer === 110 &&
      sl(iDbl, [2, 0.79]) && sl(iHeld, [440, 520]) && sl(iFull, [150, 200, 125]) && sl(iTrip, [440, 390]) && sl(iLight, [120, 100]);
  });
  K.check('Every demonstration ends 3 to 4.5 s after its screen opens, and the AVR has settled within each one and within each answer\'s motion', () => {
    noSettle = true;
    try {
      const timing = STEPS.every((d) => (d.show ? d.dur >= 3 && d.dur <= 4.5 : !d.run || d.rdur <= 4));
      const runs = [iDbl, iFeed, iHeld, iFull, iSc, iTrip, iLight].every((i) => drawn(i, solvedSt(i)).steady);
      const demos = [iCurve, iExc, iLoad, iBack, iSup].every((i) => drawn(i).steady);
      return timing && runs && demos;
    } finally { noSettle = false; }
  });
  K.ready();
</script>
