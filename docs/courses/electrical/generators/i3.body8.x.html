<p class="caption">One phase in per unit, from the rule. Resistance is left out, and the field bar follows E. Real iron saturates, so a real V never climbs as high as drawn.</p>

<script>
  // ================= the rule =================
  const strip = (s) => s.replace(/\[\^\d+\]/g, '');
  const NB = ' ';                              // a no-break space: a number never parts from its unit
  const SRC = 'https://abs.cu.edu.tr/Dokumanlar/2017/EEE318/271877548_2_synchronous_machines.pdf';
  const BASEV = 440;                                // 1.0 per unit at the terminals, V
  const DEG = 180 / Math.PI;
  // The five power factors: c is the power factor (the cosine), s the sine of the current's angle,
  // + for a lagging current (drawn below V), − for a leading one (drawn above V).
  const PF = {
    zl: { label: 'Zero pf leading', c: 0, s: -1 },
    ld: { label: '0.8 leading', c: 0.8, s: -0.6 },
    u: { label: 'Unity', c: 1, s: 0 },
    lg: { label: '0.8 lagging', c: 0.8, s: 0.6 },
    zg: { label: 'Zero pf lagging', c: 0, s: 1 },
  };
  const PFK = ['zl', 'ld', 'u', 'lg', 'zg'];
  const ANG = {};
  PFK.forEach((k) => { ANG[k] = Math.atan2(PF[k].s, PF[k].c) * DEG; });
  // The angle's cosine and sine: exact at the five settings, worked out between them while the drawing swings.
  function trig(ph) {
    for (let j = 0; j < PFK.length; j++) if (Math.abs(ph - ANG[PFK[j]]) < 1e-9) return { c: PF[PFK[j]].c, s: PF[PFK[j]].s, k: PFK[j] };
    return { c: Math.cos(ph / DEG), s: Math.sin(ph / DEG), k: null };
  }
  // One phase in per unit, resistance left out. The drop is Xs × I, 90° ahead of the current: its
  // part across V is Xs × I × the power factor, its part along V is Xs × I × the sine (+ lagging).
  // AVR on (a = 1): V is held at 1.0 and E = V + the drop. Only Zero pf leading can ask for a field
  // below zero; there the field sits at zero, E is 0 and V climbs to Xs × I.
  // AVR off (a = 0): the field stays at frz %, so E keeps its length and V = √(E² − across²) − along.
  function solve(load, xs, ph, a, frz) {
    const t = trig(ph), I = load;
    const across = xs * I * t.c, along = xs * I * t.s;
    const below = 1 + along < 0 && (t.k === null || t.k === 'zl');
    const vOn = below ? -along : 1;
    const eOn = Math.hypot(vOn + along, across);
    const e0 = frz / 100;
    const vOff = Math.max(0, Math.sqrt(Math.max(0, e0 * e0 - across * across)) - along);
    const v = a * vOn + (1 - a) * vOff;
    const ex = v + along, ey = across, e = Math.hypot(ex, ey);
    return { I, c: t.c, s: t.s, across, along, v, ex, ey, e, field: a * 100 * eOn + (1 - a) * frz,
      delta: e < 1e-9 ? 0 : Math.atan2(ey, ex) * DEG, floor: a > 0.5 && below };
  }
  const r1 = (v) => Math.round(v * 10) / 10;
  const r2 = (v) => Math.round(v * 100) / 100;
  const tr = (v) => String(r2(v));
  const TAU = 0.12, SETTLE = 1.0;                   // how fast the drawing swings to a new setting (s on screen)
  const ease1 = (v, t, dt, tau, eps) => (Math.abs(t - v) < eps ? t : v + (t - v) * (1 - Math.exp(-dt / tau)));

  // ================= the lesson: SHOW screens demonstrate, DO screens are puzzles =================
  const STEPS = [
    { kind: 'pick', name: 'Still there?', enter: {}, nofig: true, right: 'Still there.',
      opts: ['The leading load draws less current', 'The leading load meets less resistance', 'The angle turns the same drops along or against the output'],
      want: 'The angle turns the same drops along or against the output',
      task: 'A transformer has an R% of 1.5 and an X% of 3. At full load, 0.8 lagging, its output sags 3.0%. At 0.8 leading, the same current lifts its output by 0.6%. Why the difference?',
      hints: { 'The leading load draws less current': 'Both draw full-load current. Only the current\'s angle has changed.',
        'The leading load meets less resistance': 'The windings are the same at both loads, so their drops are the same size. Only their direction moves.' },
      why: 'The windings drop the same size of voltage at both loads. Lagging, the reactance\'s drop lines up with the output and comes straight off: 1.5 × 0.8 + 3 × 0.6 = 3.0%. Leading, it swings round against the output: 1.2 − 1.8 = −0.6%. A generator does the same, through its own reactance.',
      read: 'A transformer has an R% of 1.5 and an X% of 3. At full load, 0.8 lagging, its output sags 3.0%. At 0.8 leading, the same current lifts its output by 0.6%. Why the difference?' },
    { show: true, name: 'One phase', ctl: ['load'], enter: { load: 0 }, ghost: true,
      demo: [{ at: 0.6, to: 3.0, ramp: { load: [0, 1] } }], dur: 3.6,
      text: strip('Each phase works like this small circuit. The field makes a voltage inside, E. 100% field makes 1.0 per unit with nothing connected. On its way out, the current passes through a reactance, Xs. The stator\'s current makes a field of its own, which alters the rotor\'s. Some flux also leaks past. Both make a voltage that grows with the current and runs 90° ahead of it. Together they act like one reactance, the *synchronous reactance*.[^1] With no load, V equals E. Drag the load up and watch E grow past V.'),
      read: 'Each phase works like a voltage inside, E, in series with the synchronous reactance, Xs. 100% field makes 1.0 per unit with nothing connected. Then no current flows and V equals E. On load, the current drops voltage across Xs. Then E and V part.',
      still: () => setStill(false) },
    { kind: 'typed', name: 'The drop in volts', ans: 'drop', enter: {}, hideDrop: true,
      answer: 660, decimals: 0, unit: 'V', want: '660' + NB + 'V',
      slips: [{ value: 6.6, hint: 'That reads 1.5 per unit as 1.5%. Per unit is per cent ÷ 100, so 1.5 per unit is 150%.' },

        { value: 381, hint: 'That is the drop per phase, on 254 V. Per unit reads the same on phase and line bases. The question asks for the line figure, on 440 V.' }],
      task: 'This set\'s Xs is 1.5 per unit. Per unit is a fraction of the set\'s own rating. So 1.0 means 440 V between lines, or rated current. Rated current flows. How big is the drop across Xs, as a line voltage?',
      hint: 'Find the drop in per unit, then multiply by 440 V.',
      why: 'The drop is Xs × I = 1.5 × 1.0 = 1.5 per unit. As a line voltage that is 1.5 × 440 = 660 V. The drop inside is bigger than the voltage at the terminals.',
      read: 'This set\'s Xs is 1.5 per unit. Per unit is a fraction of the set\'s own rating. So 1.0 means 440 V between lines, or rated current. Rated current flows. How big is the drop across Xs, as a line voltage?' },
    { show: true, name: 'The triangle', ctl: ['xs'], enter: {},

        { value: 0.25, hint: 'The drop adds to V to make E. It is not taken off.' },
