<p class="caption" id="cap">Worked from the rule, with example reactances and relay settings. The dial marks the press and the shut.</p>

<script>
  // ================= the rule =================
  const strip = (s) => String(s || '').replace(/\[\^\d+\]/g, '');
  const NB = ' ';                                  // a no-break space: a number never parts from its unit
  const SRC_FOUR = 'https://forumelectrical.com/dg-synchronization-with-step-by-step-procedure';
  const SRC_PSRC = 'https://www.pes-psrc.org/kb/report/119.pdf';
  // The live board: 440 V, 60 Hz, fixed. Each phase is 440 ÷ √3 = 254 V.
  const VB = 440, F0 = 60, VPH = VB / Math.sqrt(3);
  // The breaker shuts 50 ms after the command. Example reactances: the set 0.15, the board 0.10 per unit.
  const TC = 0.05, XS = 0.15, XB = 0.10, XT = XS + XB, FAULT = 1 / XS;
  // The example window: 10° either side of 12, 0.2 Hz of slip, 2% of 440 V = 8.8 V.
  const WA = 10, WS = 0.2, WV = 0.02 * VB, BMAX = 9, EPS = 1e-9;
  const r1 = (v) => Math.round(v * 10) / 10;
  const r2 = (v) => Math.round(v * 100) / 100;
  const rad = (d) => d * Math.PI / 180;
  const wrap = (a) => a - 360 * Math.ceil((a - 180) / 360);         // into (−180°, 180°]
  // The voltage across one pole: the difference of its two phases, φ apart.
  const gap = (vi, phi) => Math.sqrt(Math.max(0, VPH * VPH + vi * vi - 2 * VPH * vi * Math.cos(rad(phi))));
  const phis = (a, swap) => (swap ? [a, a - 120, a + 120] : [a, a, a]);
  const poleVs = (a, v, swap) => phis(a, swap).map((p) => gap(v / Math.sqrt(3), p));
  const advOf = (s) => 360 * s * TC;                                 // degrees the pointer turns while the breaker shuts
  // Which parts of the window a close at angle a misses.
  function outside(a, s, v, swap) {
    const w = [];
    if (Math.abs(a) > WA + EPS) w.push('ang');
    if (Math.abs(s) > WS + EPS) w.push('slip');
    if (Math.abs(v - VB) > WV + EPS) w.push('volt');
    if (swap) w.push('seq');
    return w;
  }
  // A close at angle a: the surge and the shaft torque, per unit on the set's rating.
  function closeAt(a, s, v, swap) {
    const vs = poleVs(a, v, swap), vi = v / Math.sqrt(3);
    return { surge: Math.max.apply(null, vs) / VPH / XT, torque: vi / VPH * Math.sin(rad(Math.min(Math.abs(a), 90))) / XT,
      out: outside(a, s, v, swap), swap: !!swap, v };
  }
  const fmtDeg = (x) => { x = Math.abs(x); if (x >= 9.95) return String(Math.round(x)); const v = r1(x); return Number.isInteger(v) ? String(v) : v.toFixed(1); };
  const angTxt = (a) => (Math.abs(a) < 0.05 ? 'at 12' : 'at ' + fmtDeg(a) + '° ' + (a > 0 ? 'FAST' : 'SLOW'));
  const fmtSec = (x) => { const v = r1(x); return Number.isInteger(v) ? String(v) : v.toFixed(1); };
  const signed = (n) => (n === 0 ? '0' : n < 0 ? '−' + (-n) : String(n));

  // ================= the lesson: SHOW screens demonstrate, DO screens are puzzles =================
  const STEPS = [
    { kind: 'typed', name: 'Still there?', ans: 'rec', nofig: true, right: 'Still there.',
      answer: 0.52, decimals: 2, unit: '', want: '0.52',
      slips: [{ value: 0.5, hint: 'That is sin 30°. Halve the angle first.' },
        { value: 0.26, hint: 'That is sin 15°. Double it.' },
        { value: 1, hint: 'That doubles sin 30°. Halve the angle first.' }],
      task: 'Two transformers sit 30° apart across an open paralleling switch. What fraction of the phase voltage appears across it?',
      hint: 'The gap is 2 sin(θ ÷ 2) of the phase voltage.',
      why: '2 × sin 15° = 2 × 0.259 = 0.52 of the phase voltage.',
      read: 'Two transformers sit 30° apart across an open paralleling switch. What fraction of the phase voltage appears across it?' },
    { show: true, name: 'The gap across a pole', hold: true, enter: { f: 60 }, ang0: 40,
      text: 'A second set runs beside a live board. Its breaker is open. Before it closes, it must match the board in four things: voltage, frequency, phase sequence and phase angle.[^1] Each pole has a board phase on one side and the set\'s same phase on the other. On a 440 V board each phase is 254 V. The thin wave is the difference between them. That is the voltage across the pole. The set\'s wave runs 40° ahead. So the pole sees 2 sin 20° × 254 = 174 V.',
      read: 'A second set runs beside a live board. Its breaker is open. Before it closes, it must match the board in four things: voltage, frequency, phase sequence and phase angle. Each pole has a board phase on one side and the set\'s same phase on the other. On a 440 V board each phase is 254 V. What the pole sees is the difference between them. That is the voltage across the pole. The set\'s wave runs 40° ahead. So the pole sees 2 sin 20° × 254 = 174 V.',
      still: () => setStill() },
    { kind: 'typed', name: 'Sixty degrees', ans: 'sixty', enter: { f: 60 }, ang0: 60, hide: ['P'],
      answer: 254, decimals: 0, unit: 'V', want: '254' + NB + 'V',
      slips: [{ value: 440, hint: 'That uses the full 60°. Halve it first.' },
        { value: 127, hint: 'That is 254 × sin 30°. Double it.' },
        { value: 220, hint: 'That is 254 × sin 60°. Halve the angle first.' }],
      task: 'The set\'s wave runs 60° ahead of the board\'s. Each phase is 254 V. What voltage appears across each pole?',
      hint: 'Use 2 sin(θ ÷ 2) × 254 V.',
      why: '2 × sin 30° × 254 = 2 × 0.5 × 254 = 254 V. That is a whole phase voltage.',
      read: 'The set\'s wave runs 60° ahead of the board\'s. Each phase is 254 V. What voltage appears across each pole?' },
    { show: true, name: 'Slip', ctl: ['f'], enter: { f: 60.2 }, ang0: 0,
      text: 'Now the set runs 0.2 Hz faster than the board. That frequency difference is the [[slip]]. The set\'s waves gain one whole cycle every 1 ÷ 0.2 = 5 s. So the angle creeps round, and the gap swells and shrinks every 5 s. The three lamps glow and go dark together. The dial is a [[synchroscope]]. Its pointer turns once each slip cycle. It turns clockwise when the set runs fast. It stands at 12 when the angle is zero. Drag the speed trim and watch the pointer.',
      read: 'Now the set runs 0.2 Hz faster than the board. That frequency difference is the slip. The set\'s waves gain one whole cycle every 1 ÷ 0.2 = 5 s. So the angle creeps round, and the gap swells and shrinks every 5 s. The three lamps glow and go dark together. The dial is a synchroscope. Its pointer turns once each slip cycle. It turns clockwise when the set runs fast. It stands at 12 when the angle is zero.',
      still: () => setStill(() => { ang = 60; }) },
    { kind: 'typed', name: 'One turn', ans: 'turn', enter: { f: 60.25 }, ang0: 0, hide: ['S'], run: [], rdur: 4, sweep: true, endAng: 0,
      answer: 4, decimals: 0, unit: 's', want: '4' + NB + 's',
      slips: [{ value: 0.25, hint: 'That is the slip. One turn takes 1 ÷ the slip.' },
        { value: 240, hint: 'That is 60 ÷ the slip. Use 1 ÷ the slip.' }],
      task: 'The set runs at 60.25 Hz on a 60 Hz board. How long does the pointer take to go once round?',
      hint: 'Find the slip first.',
      why: 'The slip is 60.25 − 60 = 0.25 Hz. The set gains a quarter of a cycle each second. So a whole cycle takes 1 ÷ 0.25 = 4 s.',
      read: 'The set runs at 60.25 Hz on a 60 Hz board. How long does the pointer take to go once round?' },
    { show: true, name: 'A close out of step', ctl: ['close'], enter: { f: 60.2 }, ang0: 0,
      demo: [{ at: 1.2, close: true }], dur: 1.3,
      text: 'Press Close as the pointer nears 90°, a quarter turn. The breaker shuts and both bars jump into red. Shut at 90°, each pole sees 359 V. Only the reactances of the set and the board limit the surge that gap drives. Here it is 5.7 per unit. The surge also yanks the rotor into step. That puts 4.0 per unit of torque through the shaft and coupling. Shut at 180° and the surge reaches 8.0. That is more than a three-phase fault at the set.[^2]',
      read: 'Suppose the breaker shuts a quarter turn out. Shut at 90°, each pole sees 359 V. Only the reactances of the set and the board limit the surge that gap drives. Here it is 5.7 per unit. The surge also yanks the rotor into step. That puts 4.0 per unit of torque through the shaft and coupling. Shut at 180° and the surge reaches 8.0. That is more than a three-phase fault at the set.',
      still: () => setStill() },
    { kind: 'pick', name: 'Bottom of the dial', enter: { f: 60.05 }, ang0: 180, hide: ['P'], run: [], rdur: 10, endAng: 0,
      opts: ['Yes, the voltages match', 'No, each pole sees about twice the phase voltage', 'Yes, the slip is small'],
      want: 'No, each pole sees about twice the phase voltage',
      task: 'Both voltmeters read 440 V. The pointer is at the bottom of the dial, at 180°. It is turning slowly. Can you close?',
      hints: { 'Yes, the voltages match': 'Voltage is one of four things. The waves are half a cycle apart.',
        'Yes, the slip is small': 'A small slip lets you time the close. But the angle is wrong now.' },
      why: 'At 180° the waves are opposite. Each pole sees 2 × sin 90° × 254 = 508 V. That gives the biggest surge of all. Wait for the pointer to come round to 12.',
      read: 'Both voltmeters read 440 V. The pointer is at the bottom of the dial, at 180°. It is turning slowly. Can you close?' },
    { show: true, name: 'The advance angle', ctl: ['close'], enter: { f: 60.2 }, ang0: -60,
      demo: [{ at: 60 / 72, close: true }], dur: 0.95,
      text: 'A breaker takes a set time to shut after the command. Say 50 ms. At 0.2 Hz slip the pointer turns 360 × 0.2 = 72° a second. In 50 ms it moves 72 × 0.05 = 3.6°. So if you press Close at 12, the breaker shuts 3.6° past it. Instead, send the close 3.6° before 12. That lead is the [[advance angle]].[^3] The dial marks where you pressed and where the breaker shut.',
      read: 'A breaker takes a set time to shut after the command. Say 50 ms. At 0.2 Hz slip the pointer turns 360 × 0.2 = 72° a second. In 50 ms it moves 72 × 0.05 = 3.6°. So if you press Close at 12, the breaker shuts 3.6° past it. Instead, send the close 3.6° before 12. That lead is the advance angle.',
      still: () => setStill() },
    { kind: 'typed', name: 'Late by', ans: 'late', enter: { f: 60.5 }, ang0: -36, run: [{ at: 0.2, close: true }], rdur: 0.3,
      answer: 9, decimals: 0, unit: '°', want: '9°',
      slips: [{ value: 0, hint: 'The breaker takes 50 ms, and the pointer keeps turning.' },
        { value: 18, hint: 'That is for 1 Hz of slip. Multiply by 0.5 Hz too.' },
        { value: 0.025, hint: 'That is in turns. Multiply by 360 for degrees.' },
        { value: 9000, hint: 'Turn 50 ms into seconds first. It is 0.05 s.' }],
      task: 'The set runs 0.5 Hz fast. The breaker takes 50 ms. You press Close just as the pointer passes 12. How many degrees past 12 does the breaker shut?',
      hint: 'Degrees a second = 360 × the slip. Multiply by the closing time in seconds.',
      why: '360 × 0.5 = 180° a second. 180 × 0.05 = 9°. Pressing at 12 lands 9° late. So the close should go 9° early.',
      read: 'The set runs 0.5 Hz fast. The breaker takes 50 ms. You press Close just as the pointer passes 12. How many degrees past 12 does the breaker shut?' },
    { show: true, name: 'Phase sequence', ctl: ['swap'], enter: { f: 60.1, swap: true }, ang0: -40,
      text: 'Swap two of the set\'s phases, B and C. The lamps no longer dim together. One goes dark while the other two blaze. The dark lamp runs round the three in turn. When lamp A is dark, lamps B and C each see 440 V. The pointer turns exactly as before. It compares only phase A on each side. So it cannot see the order of the other two. The wiring fixes the phase sequence. It is the phase rotation you already test.',
      read: 'Suppose two of the set\'s phases, B and C, are swapped. The lamps no longer dim together. One goes dark while the other two blaze. The dark lamp runs round the three in turn. When lamp A is dark, lamps B and C each see 440 V. The pointer turns exactly as before. It compares only phase A on each side. So it cannot see the order of the other two. The wiring fixes the phase sequence. It is the phase rotation you already test.',
      still: () => setStill(() => { ang = 0; }) },
    { kind: 'pick', name: 'Crossed phases', enter: { f: 60.05, swap: true }, ang0: -9, run: [{ at: 0.45, close: true }], rdur: 0.55,
      opts: ['Yes, the pointer is at 12 and turning slowly', 'No, the phase sequence is wrong', 'No, wait until all three lamps are bright'],
      want: 'No, the phase sequence is wrong',
      task: 'The pointer turns slowly through 12. Lamp A is dark, but lamps B and C are bright. Can you close?',
      hints: { 'Yes, the pointer is at 12 and turning slowly': 'The pointer compares phase A only. Look at the other two lamps.',
        'No, wait until all three lamps are bright': 'A bright lamp means a big gap. You want all three dark together.' },
      why: 'With the sequence right, all three lamps go dark together. Here B and C blaze at 440 V while A is dark. So B and C are crossed. Put the wiring right first.',
      read: 'The pointer turns slowly through 12. Lamp A is dark, but lamps B and C are bright. Can you close?' },
    { show: true, name: 'The relay', ctl: ['f', 'relay', 'close'], enter: { f: 60.5, relay: true }, ang0: 0,
      demo: [{ at: 0.6, close: true }, { at: 1.4, to: 2.6, ramp: { f: [60.5, 60.1] } }, { at: 3.0, close: true }], dur: 4.4,
      text: 'Turn the relay on. Now Close only asks. The relay closes only inside its window. Here the window is 10°, 0.2 Hz and 2% of voltage. These are example settings. At 0.5 Hz slip it refuses and says why. Trim the speed to 60.10 Hz and ask again. It waits for the advance angle, 1.8°, and sends the close. The breaker shuts at 12. An automatic synchroniser goes further. It trims the governor and the AVR by moving their set points.[^4]',
      read: 'With a relay in charge, Close only asks. The relay closes only inside its window. Here the window is 10°, 0.2 Hz and 2% of voltage. These are example settings. At 0.5 Hz slip it refuses and says why. At 60.10 Hz it agrees. It waits for the advance angle, 1.8°, and sends the close. The breaker shuts at 12. An automatic synchroniser goes further. It trims the governor and the AVR by moving their set points.',
      still: () => setStill() },
    { kind: 'pick', name: 'Trim before closing', enter: { v: 420, f: 60.4 }, ang0: 120, live: true, ctlSolved: ['f', 'v'],
      run: [{ at: 0.2, to: 2.2, ramp: { v: [420, 440], f: [60.4, 60.1] } }], rdur: 2.3,
      opts: ['Raise the field, and lower the fuel a little', 'Raise the fuel, and lower the field a little', 'Raise the field only, then close as the pointer passes 12'],
      want: 'Raise the field, and lower the fuel a little',
      task: 'The set reads 420 V and 60.40 Hz. The board is 440 V, 60 Hz. What do you trim before closing?',
      hints: { 'Raise the fuel, and lower the field a little': 'More fuel speeds the set up. It is already fast, and its voltage is low.',
        'Raise the field only, then close as the pointer passes 12': 'At 0.4 Hz the pointer turns once every 2.5 s. That is too fast to catch.' },
      why: 'More field raises the voltage towards 440 V. Less fuel slows the set until the pointer turns slowly enough to catch at 12.',
      read: 'The set reads 420 V and 60.40 Hz. The board is 440 V, 60 Hz. What do you trim before closing?' },
    { kind: 'typed', name: 'Advance for 80 ms', ans: 'adv', nofig: true,
      answer: 8.6, decimals: 1, accept: [8.64], unit: '°', want: '8.6°',
      slips: [{ value: 28.8, hint: 'That leaves out the slip. Multiply by 0.3 Hz too.' },
        { value: 0.024, hint: 'That is in turns. Multiply by 360 for degrees.' },
        { value: 8640, hint: 'Turn 80 ms into seconds first. It is 0.08 s.' }],
      task: 'A relay must shut a breaker at 12. The set runs 0.3 Hz fast. The breaker takes 80 ms. How many degrees before 12 does the relay send the close? Give it to one decimal place.',
      hint: '360 × the slip × the closing time in seconds.',
      why: '360 × 0.3 = 108° a second. 108 × 0.08 = 8.64°. To one decimal place that is 8.6°.',
      close: 'Match all four, then close early by the advance angle.',
      read: 'A relay must shut a breaker at 12. The set runs 0.3 Hz fast. The breaker takes 80 ms. How many degrees before 12 does the relay send the close? Give it to one decimal place.' },
  ];
  const FINISH = 'A set closes onto a live board only when it matches the board in four things: voltage, frequency, phase sequence and phase angle. Any mismatch leaves a gap across each pole, and closing on it drives a surge. The [[slip]] turns the angle round, and the [[synchroscope]] shows it. Its dial cannot show the phase sequence. The breaker takes time to shut, so the close goes early by the [[advance angle]].';

  // ================= state =================
  const BASE = { f: 60.2, v: 440, swap: false, relay: false };
  const X = Object.assign({}, BASE);
  const openBrk = () => ({ st: 'open', left: 0, press: null, shut: null, res: null, by: '', adv: 0, age: 1 });
  let ang = 0, brk = openBrk(), rel = null, sweep = 0, sweeping = false, held = false;
  const blank = () => ({ pick: null, res: null, why: false, tries: 0, hint: '' });
  let S = STEPS.map(blank);
  const solved = (st) => !!st && (st.res === 'right' || st.res === 'shown');

  // ================= the set slipping past the board, and the breaker =================

  // ================= text with amber key terms (built with K.el, never innerHTML) =================

  const CTL = {

  const RO = {

    P: K.readout({ id: 'r-p', label: 'Across pole A in' + NB + 'V', fmt: (v) => String(v), into: '#outs' }),

  // Up to three answer buttons; each puzzle fills in its own.

  } }));
  // Typed answers: a field each; Check grades it, two misses show the working.
  const ANS = {};
  STEPS.forEach((d, i) => {

    const a = K.answer({ id: 'a-' + d.ans, unit: d.unit, answer: d.answer, decimals: d.decimals, accept: d.accept, slips: d.slips, into: '#ans-' + d.ans,

  const whyBtn = K.button({ label: 'Why?', secondary: true, into: '#acts', press: () => {

  const replayBtn = K.button({ label: 'Show me again', secondary: true, into: '#replay', press: () => {

  const backBtn = K.button({ label: 'Back', secondary: true, into: '#nav', press: () => {

  // ================= motion: one animation runs the demonstrations, the answers' motion and the slipping set =================

  // ================= the synchroscope and the waves of phase A =================
  const CX = 84, CY = 106, R = 48;

  function head(a, deg, r, sign) {
    const tip = [CX + r * Math.sin(rad(deg)), CY - r * Math.cos(rad(deg))];

  function drawDial() {

    head(a, -64, 60, -1);

    const t0 = pt(0, 48), t1 = pt(0, 57);

    if (brk.press != null) { const m = pt(brk.press, 62); a('circle', { class: 'pmark', cx: m[0], cy: m[1], r: 4 }); }

    const pa = pt(da + 180, 10), pb = pt(da, 42);
    a('line', { class: 'ptr', x1: pa[0], y1: pa[1], x2: pb[0], y2: pb[1] });
    a('circle', { class: 'hub', cx: CX, cy: CY, r: 4.5 });
