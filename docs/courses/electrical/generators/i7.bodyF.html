<p class="caption" id="cap">Worked from the rule, with example settings and smooth sketched decays.</p>

<script>
  // ================= the rule =================
  const strip = (s) => String(s || '').replace(/\[\^\d+\]/g, '');
  const NB = ' ';                                  // a no-break space: a number never parts from its unit
  const SRC_124 = 'https://www.stamford-avk.com/sites/stamfordavk/files/AGN124_C.pdf';
  const ES = 'Engine stops', FL = 'Field lost', SC = 'Short circuit', OV = 'Overload';
  const FK = { 'Engine stops': 'es', 'Field lost': 'fl', 'Short circuit': 'sc', 'Overload': 'ov' };
  // Two 504 kW (630 kVA) sets on one 440 V, 60 Hz board.
  const RK = 504, RKVA = 630, VB = 440;
  const rad = (d) => d * Math.PI / 180, deg = (r) => r * 180 / Math.PI;

  // Engine stops: 400 kW at 0.8 power factor (300 kVAr), shared 200 kW and 150 kVAr each. A's kW falls
  // evenly over 1 s (a sketch) from 200 kW out to 50.4 kW in, 10% of its rating (an example figure).
  // The relay picks up at 25.2 kW in, 5% of the rating, and waits 5 s (example settings).
  const LOAD = 400, QLOAD = 300, MOT = 0.1 * RK, PICK = 0.05 * RK, DELAY = 5, RUN = 1;
  // Screen 3 asks with its own figures: a load L shared equally, and a motoring draw m.
  const pES = (t, L = LOAD, m = MOT) => (t >= RUN ? -m : L / 2 - (L / 2 + m) * t / RUN);
  const T_PICK = (200 + PICK) / (200 + MOT) * RUN;      // 0.9 s
  const T_TRIP = T_PICK + DELAY;                        // 5.9 s
  function es(t, L = LOAD, m = MOT) {
    const tp = (L / 2 + PICK) / (L / 2 + m) * RUN, ql = 0.75 * L;
    const trip = t >= tp + DELAY - 1e-9, picked = t >= tp;
    const pa = trip ? 0 : pES(t, L, m), qa = trip ? 0 : ql / 2;
    return { pa, pb: L - pa, qa, qb: ql - qa, timer: picked ? Math.min(t - tp, DELAY) : 0, picked, trip, load: L };
  }
  // A brief reverse flow just after closing on: 30 kW back for 2 s, against a timer of D seconds.
  // The timer runs while the flow lasts, and resets (quickly, drawn over half a second) once it stops.
  function brief(u, D0) {
    const trip = D0 <= 2 && u >= D0 - 1e-9;
    const tau = trip ? D0 : u <= 2 ? Math.min(u, D0) : Math.max(0, Math.min(2, D0) - 4 * (u - 2));
    return { trip, tau, reach: Math.min(u, 2, D0) };
  }

  // Field lost: V 1.0 and Xs 1.5 per unit. E starts at 1.44 (an example field) and falls 0.8 each
  // second (a sketch). A still sends out 200 kW = 200 ÷ 630 per unit, so sin δ = P × Xs ÷ (E × V).
  // A's kVAr = (E × cos δ − V) ÷ Xs per unit, times 630 kVA. Below 0.48 no angle carries the kW:
  // the rotor slips, δ turning round once a second (a sketch).
  const VPU = 1.0, XS = 1.5, E0 = 1.44, EFALL = 0.8;
  const PPU = 200 / RKVA, ECRIT = PPU * XS / VPU, T_SLIP = (E0 - ECRIT) / EFALL;
  const eOf = (t) => Math.max(0, E0 - EFALL * t);
  function fl(t) {
    const E = eOf(t), slip = t > T_SLIP + 1e-9;
    const d = slip ? 90 + 360 * (t - T_SLIP) : deg(Math.asin(K.clamp(PPU * XS / (Math.max(E, ECRIT) * VPU), -1, 1)));
    const pa = slip ? E * VPU * Math.sin(rad(d)) / XS * RKVA : 200;
    const qa = (E * Math.cos(rad(d)) - VPU) / XS * RKVA;
    return { E, d, slip, pa, pb: LOAD - pa, qa, qb: QLOAD - qa };
  }

  // Short circuit: A alone. Rated current 630 000 ÷ (√3 × 440). Sub-transient 0.15 and transient 0.25
  // per unit, time constants 0.02 s and 0.3 s (example values). Sustained 3 times rated with a PMG
  // (an example), 0 when shunt-fed. The breaker opens once the current has stayed above 2000 A for 0.5 s.
  const IR = RKVA * 1000 / (Math.sqrt(3) * VB);
  const XD2 = 0.15, XD1 = 0.25, TD1 = 0.3, TD2 = 0.02, SUS = { PMG: 3, Shunt: 0 }, BRK = 2000, BDEL = 0.5;
  // Screen 9 asks about a sub-transient reactance of 0.18 instead (X.xd2).
  const xOf = (t, s, x2 = X.xd2) => SUS[s] + (1 / XD1 - SUS[s]) * Math.exp(-t / TD1) + (1 / x2 - 1 / XD1) * Math.exp(-t / TD2);
  function tBelow(s) {
    if (xOf(10, s, XD2) * IR > BRK) return Infinity;
    let lo = 0, hi = 10;
    for (let k = 0; k < 60; k++) { const m = (lo + hi) / 2; if (xOf(m, s, XD2) * IR > BRK) lo = m; else hi = m; }
    return hi;
  }
  const TB = { PMG: tBelow('PMG'), Shunt: tBelow('Shunt') };
  function sc(t, s) {
    const tb = TB[s], tt = tb > BDEL ? BDEL : Infinity;          // above 2000 A from the start
    const opened = t >= tt - 1e-9, cleared = t > tt + 1e-9;
    const x = cleared ? 0 : xOf(t, s);
    return { x, I: x * IR, count: cleared ? BDEL : t < tb ? Math.min(t, BDEL) : 0, opened, cleared, tt };
  }

  // Overload: B trips out at 0 s and A carries the whole load. While A is over 504 kW, preferential
  // trips shed one 30 kW group every 5 s (example settings).
  const GROUP = 30, NG = 3, STEP_T = 5;
  function ov(t, L0) {
    let n = 0;
    for (let k = 1; k <= NG; k++) if (n === k - 1 && t >= k * STEP_T - 1e-9 && L0 - GROUP * (k - 1) > RK + 1e-9) n = k;
    const pa = L0 - GROUP * n;
    return { pa, pb: 0, qa: 0.75 * pa, qb: 0, over: Math.max(0, pa - RK), n };
  }

  function model(s) {
    const f = s.fault;
    if (f === ES) { const r = es(s.es, s.esL, s.esM); return Object.assign({ f, t: s.es, brk: [r.trip, false, false] }, r); }
    if (f === FL) { const r = fl(s.fl); return Object.assign({ f, t: s.fl, brk: [false, false, false] }, r); }
    if (f === SC) { const r = sc(s.sc, s.supply); return Object.assign({ f, t: s.sc, pa: 0, pb: 0, qa: 0, qb: 0, brk: [false, true, r.opened] }, r); }
    const r = ov(s.ov, s.L0);
    return Object.assign({ f, t: s.ov, brk: [false, true, false] }, r);
  }

  // ================= the lesson: SHOW screens demonstrate, DO screens are puzzles =================
  const STEPS = [
    { kind: 'pick', name: 'A motor\'s voltage', nofig: true,
      opts: ['A back-emf, pushing against the supply', 'Nothing, it only takes current', 'Extra current, helping the supply'],
      want: 'A back-emf, pushing against the supply',
      task: 'A DC motor\'s armature turns in its field. What does it make as it turns?',
      hints: { 'Nothing, it only takes current': 'Any coil turning in a field has a voltage made in it.',
        'Extra current, helping the supply': 'Its voltage pushes against the supply, so it holds the current back.' },
      why: 'A motor and a generator are the same machine. Which way the power flows decides which it is.',
      read: 'A DC motor\'s armature turns in its field. What does it make as it turns?' },
    { show: true, name: 'The engine stops', notimer: true, enter: { fault: ES, es: 0 }, ctl: ['time'],
      demo: [{ at: 0.6, to: 3.6, ramp: { es: [0, 2] } }], dur: 3.8,
      text: 'Each fault leaves its own mark on a set\'s meters. Here two sets share 400 kW. Then A\'s engine stops. A\'s rotor is still locked in step with the board. So B drives it round as a motor. A\'s kW arrow turns round, and real power flows into A. That is [[reverse power]]. In this example, A draws 50.4 kW and B carries 450.4 kW. Drag the time cursor to watch it turn.',
      read: 'Each fault leaves its own mark on a set\'s meters. Here two sets share 400 kW. Then A\'s engine stops. A\'s rotor is still locked in step with the board. So B drives it round as a motor. A\'s kW arrow turns round, and real power flows into A. That is reverse power. In this example, A draws 50.4 kW and B carries 450.4 kW.',
      still: () => setStill() },
    { kind: 'typed', name: 'B carries the rest', notimer: true, ans: 'b', enter: { fault: ES, es: 0, esL: 360, esM: 40 }, hide: ['es-b'],
      answer: 400, decimals: 0, unit: 'kW', want: '400' + NB + 'kW',
      slips: [{ value: 360, hint: 'B drives A round too. Add A\'s draw.' },
        { value: 320, hint: 'A\'s draw adds to B\'s load. It does not help it.' },
        { value: 220, hint: 'B carries the whole load, not just A\'s share.' }],
      task: 'Now the two sets share 360 kW equally. A\'s engine stops. A draws 40 kW as a motor. How many kW does B carry now?',
      hint: 'B now feeds the load and A\'s draw.',
      why: '360 + 40 = 400 kW. That is still under B\'s 504 kW rating, so the board stays up.',
      run: [{ at: 0.2, to: 2.2, ramp: { es: [0, 2] } }], rdur: 2.3, ctlSolved: ['time'],
      read: 'Now the two sets share 360 kW equally. A\'s engine stops. A draws 40 kW as a motor. How many kW does B carry now?' },
    { show: true, name: 'The reverse-power relay', enter: { fault: ES, es: 0 }, ctl: ['time'],
      demo: [{ at: 0.4, to: 4.6, ramp: { es: [0, 7] } }], dur: 4.8,
      text: 'A motoring set must come off. Its diesel can gather unburned fuel, a fire and explosion risk.[^1] And B carries A\'s draw, which can overload it. A reverse-power relay picks up once power flows in past its setting. Here that is 25.2 kW, 5% of A\'s rating. Then it waits, here for 5 s. Both are example settings. A brief reverse flow can come and go just after a set closes on. A stopped engine keeps drawing. So once the timer fills, A\'s breaker opens.',
      read: 'A motoring set must come off. Its diesel can gather unburned fuel, a fire and explosion risk. And B carries A\'s draw, which can overload it. A reverse-power relay picks up once power flows in past its setting. Here that is 25.2 kW, 5% of A\'s rating. Then it waits, here for 5 s. Both are example settings. A brief reverse flow can come and go just after a set closes on. A stopped engine keeps drawing. So once the timer fills, A\'s breaker opens.',
      still: () => setStill() },
    { kind: 'pick', name: 'A nuisance trip', only: 'brief', enter: { fault: ES, delay: 1, u: 2 },
      opts: ['Raise the pickup to 60 kW', 'Lengthen the delay, past the 2 s', 'Switch the relay off while closing on'],
      want: 'Lengthen the delay, past the 2 s',
      task: 'The relay picks up at 25.2 kW and waits 1 s. Just after closing on, a set sends 30 kW back for 2 s. Its governor is still picking up load. The relay trips it. Which change stops this trip but still catches a stopped engine?',
      hints: { 'Raise the pickup to 60 kW': 'A stopped engine here draws only 50.4 kW. The relay would never see it.',
        'Switch the relay off while closing on': 'A set that stops just after closing on would go unseen.' },
      why: 'The delay sorts brief flows from lasting ones. A stopped engine draws for as long as it stays on the board. So a longer delay still catches it, and the pickup stays sensitive.',
      run: [{ at: 0, set: { delay: 5, u: 0 } }, { at: 0.5, to: 2.5, ramp: { u: [0, 2] } }, { at: 2.7, to: 3.3, ramp: { u: [2, 2.6] } }], rdur: 3.4,
      read: 'The relay picks up at 25.2 kW and waits 1 s. Just after closing on, a set sends 30 kW back for 2 s. Its governor is still picking up load. The relay trips it. Which change stops this trip but still catches a stopped engine?' },
    { show: true, name: 'The field is lost', enter: { fault: FL, fl: 0 }, ctl: ['time'],
      demo: [{ at: 0.6, to: 3.6, ramp: { fl: [0, 0.8] } }], dur: 3.8,
      text: 'Now A\'s field is lost, and its E shrinks. Its engine still sends out 200 kW. Remember, power = E × V × sin δ ÷ Xs. So as E shrinks, δ must grow to carry the same kW. At E = 0.80, δ is 36.5°. A weak field cannot send kVAr out, so A draws 150 kVAr in. Once E is too small, even 90° cannot pass the 200 kW out. The engine still pushes it in, so the rotor speeds past the board\'s field. It slips a pole.',
      read: 'Now A\'s field is lost, and its E shrinks. Its engine still sends out 200 kW. Remember, power = E × V × sin δ ÷ Xs. So as E shrinks, δ must grow to carry the same kW. At E = 0.80, δ is 36.5°. A weak field cannot send kVAr out, so A draws 150 kVAr in. Once E is too small, even 90° cannot pass the 200 kW out. The engine still pushes it in, so the rotor speeds past the board\'s field. It slips a pole.',
      still: () => setStill() },
    { kind: 'typed', name: 'Where it slips', ans: 'e', enter: { fault: FL, fl: 0 }, hide: ['fl-d'],
      answer: 0.48, decimals: 2, accept: [0.476], unit: '', want: '0.48',
      slips: [{ value: 0.21, hint: 'That divides by Xs. At 90°, sin δ is 1. So E × V ÷ Xs = the power.' },
        { value: 0.317, hint: 'That leaves out Xs.' },
        { value: 1.44, hint: 'That is A\'s E before the field was lost.' }],
      task: 'A sends out 0.317 per unit of power. V is 1.0 and Xs is 1.5. Below what E does δ pass 90°, so that A slips a pole?',
      hint: 'At 90°, sin δ = 1. So E × V ÷ Xs = the power.',
      why: '0.317 × 1.5 ÷ 1.0 = 0.48 per unit. A smaller E cannot carry 200 kW at any angle.',
      run: [{ at: 0.2, to: 2.6, ramp: { fl: [0, T_SLIP] } }], rdur: 2.7, ctlSolved: ['time'],
      read: 'A sends out 0.317 per unit of power. V is 1.0 and Xs is 1.5. Below what E does δ pass 90°, so that A slips a pole?' },
    { show: true, name: 'A short circuit', plain: true, enter: { fault: SC, sc: 0, supply: 'PMG' }, ctl: ['time'],
      demo: [{ at: 0.6, to: 3.6, ramp: { sc: [0, 0.05] } }], dur: 3.8,
      text: 'A short circuit\'s current starts huge and falls with time. At first the rotor\'s windings hold on to their flux, and only a small reactance holds the current back. That grip fades through three periods: sub-transient, transient and sustained. This 630 kVA, 440 V set has a rated current of 826.7 A. Its transient reactance is 0.25 per unit, or 25%. As with a transformer, fault current = rated current × 100 ÷ the percentage impedance. So the transient period starts near 826.7 × 100 ÷ 25 = 3307 A.',
      read: 'A short circuit\'s current starts huge and falls with time. At first the rotor\'s windings hold on to their flux, and only a small reactance holds the current back. That grip fades through three periods: sub-transient, transient and sustained. This 630 kVA, 440 V set has a rated current of 826.7 A. Its transient reactance is 0.25 per unit, or 25%. As with a transformer, fault current = rated current × 100 ÷ the percentage impedance. So the transient period starts near 826.7 × 100 ÷ 25 = 3307 A.',
      still: () => setStill() },
    { kind: 'typed', name: 'The first current', plain: true, trace: true, ans: 'i', enter: { fault: SC, sc: 0, supply: 'PMG', xd2: 0.18 }, hide: ['sc-i', 'sc-x'],
      answer: 4593, decimals: 0, accept: [4596], unit: 'A', want: '4593' + NB + 'A',
      slips: [{ value: 148.8, hint: 'That multiplies by 0.18. Divide instead.' },
        { value: 3307, hint: 'That uses the transient reactance, 0.25.' },
        { value: 826.7, hint: 'That is the rated current. A fault draws many times more.' },
        { value: 5511, hint: 'That is the first current with 0.15. Divide by 0.18.' }],

  // ================= motion: demonstrations and answers' motion =================

    REC.fc = 0;

      if (M.d > 89.95) return 'E has fallen to 0.48, so δ has reached 90°. Below this, no angle can carry the 200 kW.';
      if (M.t < 1e-9) return 'A\'s field has just been lost. E is still ' + M.E.toFixed(2) + ', and δ is ' + M.d.toFixed(1) + '° to carry its 200 kW.';
      return 'E has shrunk to ' + M.E.toFixed(2) + ', so δ has grown to ' + M.d.toFixed(1) + '° to carry the same 200 kW. ' +
        (M.qa > 0.5 ? 'A still sends out ' + fI(M.qa) + ' kVAr.' : M.qa < -0.5 ? 'A now draws ' + fI(-M.qa) + ' kVAr from the board.' : 'A sends out no kVAr now.');
    }
    if (M.f === SC) {
      const I = fI(M.I), x = M.x.toFixed(2);
      if (M.cleared) return 'The current stayed above 2000 A for the full 0.5 s, so the breaker tripped and cleared the fault.';
      if (M.opened) return 'The current is still ' + I + ' A, ' + x + ' times rated. It has stayed above 2000 A for 0.5 s, so the breaker trips now.';
      if (!shownCtl(i, 'supply')) return M.t < 1e-9 ? 'The fault has just struck. The current is ' + I + ' A, ' + x + ' times rated.'
        : 'The current has fallen to ' + I + ' A, ' + x + ' times rated. It has stayed above 2000 A for ' + M.count.toFixed(2) + ' s.';
      if (X.supply === 'PMG') return 'Fed by a PMG, the AVR forces the field. The current is ' + I + ' A, ' + x + ' times rated, and has stayed above 2000 A for ' + M.count.toFixed(2) + ' s.';
      if (M.I > BRK) return 'Fed from the set\'s own output, the AVR\'s supply is collapsing. The current is ' + I + ' A and falling fast.';
      return 'Fed from the set\'s own output, the field has failed. The current is down to ' + I + ' A, under 2000 A, so the breaker\'s count has stopped.';
    }
    if (M.n === 0 && M.over > 0) return 'B has tripped out, so A carries all ' + fK(M.pa) + ' kW, ' + fK(M.over) + ' kW over its rating. The first group goes at 5 s.';
    if (M.over > 0) return WORD[M.n] + (M.n === 1 ? ' group is' : ' groups are') + ' shed. A carries ' + fK(M.pa) + ' kW, still ' + fK(M.over) + ' kW over. The next goes at ' + (STEP_T * (M.n + 1)) + ' s.';
    const left = NG - M.n;
    return WORD[M.n] + (M.n === 1 ? ' group is' : ' groups are') + ' shed, so A carries ' + fK(M.pa) + ' kW, inside its 504 kW rating. ' +
      (left === 0 ? 'All three groups are off.' : left === 1 ? 'The other group stays on.' : 'The other groups stay on.');
  }
  function sayRoom(i) {
    const d = STEPS[i];
    if (finished || d.nofig || d.only) return false;
    return d.show || (solved(S[i]) && !!d.ctlSolved);
  }
  function sayLine(i, M) {
    const p = el('say'), room = sayRoom(i), s = room ? sayText(i, M) : '';
    p.hidden = !room;
    p.classList.toggle('off', !s);
    if (p.dataset.s !== s) { p.dataset.s = s; write(p, s); }
    REC.say = s;
  }

  // ================= one paint =================
  function paint(i) {
    if (i == null) i = at();
    const M = model(X);
    REC = { t: {}, M };
    drawScene(i, M);
    drawPanel(i, M);
    readouts(i, M);
    sayLine(i, M);
  }

  // ================= the page around the picture =================
  write(el('finish'), FINISH);
  const setLab = (b, s) => { if (b.el.textContent !== s) b.setLabel(s); };
  const vis = (id, on) => { const n = el(id); if (on) n.removeAttribute('hidden'); else n.setAttribute('hidden', ''); };
  function showCtls(i) {
    let any = false;
    CIDS.forEach((id) => { const on = shownCtl(i, id); el('c-' + id).hidden = !on; any = any || on; });
    el('sws').hidden = !any;
  }
  function layout(i) {
    const d = STEPS[i], st = S[i], sol = solved(st);
    el('stepbox').hidden = finished;
    el('done').hidden = !finished;
    el('count').textContent = 'Screen ' + (i + 1) + ' of ' + STEPS.length;
    const task = el('task');
    task.className = 'task' + (d.show ? ' show' : '');
    write(task, d.show ? d.text : d.task);
    el('figs').hidden = !!d.nofig;
    // SVG elements have no .hidden property: the attribute itself is toggled.
    vis('scene', !d.nofig && !d.only);
    vis('panel', !!panelMode(i));
    const key = FK[X.fault], outsOn = !d.nofig && !d.only;
    ['es', 'fl', 'sc', 'ov'].forEach((k) => { el('o-' + k).hidden = !outsOn || k !== key; });
    // The Timer tile comes with the relay: hidden while its bar is (screens 2 and 3).
    RO['es-t'].el.hidden = !!d.notimer && !finished;
    el('cap').hidden = finished || !!d.nofig;
    showCtls(i);
    replayBtn.el.hidden = !d.show || !d.demo || finished || REDUCE;
    el('replay').hidden = replayBtn.el.hidden;
    const opts = d.kind === 'pick' ? d.opts : [];
    el('picks').hidden = !opts.length;
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      setLab(b, opts[k]);
      b.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });
    el('answers').hidden = d.kind !== 'typed';
    Object.keys(ANS).forEach((k) => { el('ans-' + k).hidden = d.ans !== k; });
    el('acts').hidden = !!d.show;
    checkBtn.el.hidden = sol;
    const fb = el('fb');
    fb.hidden = !!d.show;
    fb.className = 'fb' + (st.res === 'right' ? ' right' : '');
    let say = '';
    if (!d.show) {
      if (st.res === 'right') say = d.right || 'That\'s it.';
      else if (st.res === 'shown') say = 'Here is the working.';
      else if (st.res === 'wrong') say = d.kind === 'typed' ? st.hint : (d.hints && d.hints[st.pick]) || d.hint || '';
      else if (st.res === 'empty') say = d.kind === 'pick' ? 'Pick one of the answers first.' : 'Type your answer first.';
    }
    write(fb, say);
    const why = el('why');
    why.hidden = d.show || !st.why;
    write(why, d.show ? '' : d.why);
    setLab(whyBtn, st.why ? 'Hide why' : 'Why?');
    const cl = el('closing');
    cl.hidden = !(d.close && sol);
    write(cl, d.close || '');
    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !sol);
    setLab(nextBtn, i === STEPS.length - 1 ? 'Finish' : 'Continue');
    el('nav').hidden = backBtn.el.hidden && nextBtn.el.hidden;
  }

  K.update((p) => {
    const i = at();
    if (i !== lastStep) { lastStep = i; enterStep(i); }
    else {
      CIDS.forEach((id) => {
        const v = norm(id, p[id]);
        if (v === pushed[id]) return;
        if (shownCtl(i, id)) { endDemo(); pushed[id] = v; applyCtl(id, v); }
        else CTL[id].set(pushed[id], true);        // a control this screen does not use stays put
      });
      push();
    }
    if (finished !== lastDone) { lastDone = finished; enter(finished ? 'done' : 'stepbox'); }
    layout(i);
    paint(i);
    kick();
  });

  // ================= known answers, worked out by hand =================
  const solvedSt = (i) => Object.assign(blank(), STEPS[i].kind === 'pick' ? { pick: STEPS[i].want, res: 'right' } : { res: 'right' });
  function saveAll() { return { X: Object.assign({}, X), D: Object.assign({}, D), T, sc: scripted, fin: finished, S: S.slice() }; }
  function restoreAll(k) { Object.assign(X, k.X); Object.assign(D, k.D); T = k.T; scripted = k.sc; finished = k.fin; S = k.S; }
  // A screen in the state given (its demonstration finished, unless opening), and what it drew.
  function drawn(i, st, opening, then) {
    const keep = saveAll();
    S = S.slice(); S[i] = st || blank(); T = Infinity; scripted = false; finished = false;
    try {
      prep(i, !opening);
      if (then) { then(); snapD(); }
      paint(i);
      return Object.assign({}, REC, { t: Object.assign({}, REC.t) });
    } finally { restoreAll(keep); paint(); }
  }
  const tIs = (t, o) => Object.keys(o).every((k) => t[k] === o[k]);
  const iMotor = idx('A motor\'s voltage'), iEng = idx('The engine stops'), iB = idx('B carries the rest'), iRelay = idx('The reverse-power relay');
  const iNuis = idx('A nuisance trip'), iField = idx('The field is lost'), iSlip = idx('Where it slips'), iSC = idx('A short circuit');
  const iFirst = idx('The first current'), iSup = idx('Shunt or PMG'), iShunt = idx('The shunt-fed set'), iOv = idx('Overload');
  const iSteps = idx('How many steps'), iLast = idx('Which protection');

  K.check('Engine stops: A falls from 200 kW out to 50.4 kW in over 1 s; the relay picks up at 25.2 kW in, at 0.9 s, and A\'s breaker opens 5 s later, at 5.9 s', () =>
    K.near(pES(0), 200, 1e-9) && K.near(pES(1), -50.4, 1e-9) && K.near(PICK, 25.2, 1e-9) && K.near(pES(T_PICK), -PICK, 1e-9) &&
    T_PICK.toFixed(1) === '0.9' && T_TRIP.toFixed(1) === '5.9' && !es(5.8).trip && es(5.9).trip);
  K.check('Screen 2 at 2 s: A reads −50.4 kW with its kW arrow red into A, B 450.4 kW, A 150 kVAr; screen 3, sharing 360 kW with A drawing 40 kW, shows ? for B until checked, then 400 at 2 s', () => {
    const r0 = drawn(iEng, null, true), r = drawn(iEng), b0 = drawn(iB), b1 = drawn(iB, solvedSt(iB));
    return tIs(r.t, { 'es-a': '−50.4', 'es-b': '450.4', 'es-q': '150' }) && r.dir.pa === -1 && r.dir.qa === 1 && r0.dir.pa === 1 && r0.t['es-a'] === '200' &&
      r.panel === null && b0.t['es-b'] === '?' && b0.t['es-a'] === '180' && b1.t['es-b'] === '400' && b1.t['es-a'] === '−40';
  });
  K.check('Screen 4 at 7 s: the timer full at 5.0 s, A\'s breaker open, A 0 kW and B 400 kW', () => {
    const r = drawn(iRelay);
    return tIs(r.t, { 'es-a': '0', 'es-b': '400', 'es-t': '5.0' }) && r.brk[0] && !r.brk[1] && r.panel === 'timer' && r.timer === 1 && r.dir.pa === 0;
  });
  K.check('Screen 5: a 1 s delay fills during the 2 s flow and trips; a 5 s delay reaches 2 s, then resets with no trip', () => {
    const a0 = drawn(iNuis), a1 = drawn(iNuis, solvedSt(iNuis));
    return a0.panel === 'brief' && a0.brief.trip && a0.brief.tau === 1 && !a1.brief.trip && a1.brief.tau === 0 && a1.brief.reach === 2;
  });
  K.check('Field lost: E 1.44 carries 200 kW at δ 19.3°; at 0.8 s E is 0.80, δ 36.5°, and A draws 150 kVAr while its kW still flows out', () => {
    const r = drawn(iField);
    return fl(0).d.toFixed(1) === '19.3' && fl(0).qa > 0 && tIs(r.t, { 'fl-a': '200', 'fl-q': '−150', 'fl-e': '0.80', 'fl-d': '36.5' }) &&
      r.dir.qa === -1 && r.dir.pa === 1 && r.panel === 'phasor';
  });
  K.check('0.317 × 1.5 ÷ 1.0 = 0.48: below it δ passes 90°, near 1.2 s; screen 7 shows ? for δ until checked, then E 0.48 and δ 90.0', () => {
    const a0 = drawn(iSlip), a1 = drawn(iSlip, solvedSt(iSlip));
    return K.near(ECRIT, 0.476, 0.0005) && ECRIT.toFixed(2) === '0.48' && T_SLIP.toFixed(1) === '1.2' && a0.t['fl-d'] === '?' && a0.t['fl-e'] === '1.44' &&
      a1.t['fl-e'] === '0.48' && a1.t['fl-d'] === '90.0' && !a1.slip && fl(T_SLIP + 0.01).slip;
  });
  K.check('A loss of excitation in parallel brings pole slipping and oscillation: past 90°, δ keeps turning and A\'s kW swings out and in', () => {
    let out = false, inn = false;
    for (let k = 1; T_SLIP + k / 100 < 1.8; k++) { const m = fl(T_SLIP + k / 100); if (!m.slip) return false; if (m.pa > 1) out = true; if (m.pa < -1) inn = true; }
    return out && inn && !fl(T_SLIP - 0.01).slip && K.near(fl(T_SLIP + 0.25).d, 180, 1e-6);
  });
  K.check('Rated current 630 000 ÷ (√3 × 440) = 826.7 A; the first current 826.7 ÷ 0.15 = 5511 A, 6.67 times; at 0.05 s screen 8 reads 3361 A, 4.07 times', () => {
    const r = drawn(iSC);
    return IR.toFixed(1) === '826.7' && Math.round(xOf(0, 'PMG') * IR) === 5511 && xOf(0, 'PMG').toFixed(2) === '6.67' && Math.round(IR / XD1) === 3307 &&
      tIs(r.t, { 'sc-i': '3361', 'sc-x': '4.07' }) && r.panel === 'plot' && r.curves === 1;
  });
  K.check('Screen 9, with 0.18, hides the curve and shows ? for the current until checked, then 4593 A, 5.56 times rated, at 0 s', () => {
    const a0 = drawn(iFirst), a1 = drawn(iFirst, solvedSt(iFirst));
    return a0.t['sc-i'] === '?' && a0.t['sc-x'] === '?' && a0.curves === 0 && a1.curves === 1 && a1.t['sc-i'] === '4593' && a1.t['sc-x'] === '5.56';
  });
  K.check('Screen 10 at 0.5 s: with a PMG 2636 A, 3.19 times rated, above 2000 A for 0.50 s, and the breaker trips; shunt-fed, 625 A and no trip', () => {
    const p = drawn(iSup), s = drawn(iSup, null, true);
    return tIs(p.t, { 'sc-i': '2636', 'sc-x': '3.19', 'sc-c': '0.50' }) && p.brk[2] && p.trips && p.curves === 2 &&
      s.t['sc-i'] === '625' && s.t['sc-c'] === '0.00' && !s.brk[2] && !s.trips;
  });
  K.check('Screen 11 hides the curves and readouts until checked; once checked the shunt-fed current has died to 118 A at 1 s and the breaker never tripped', () => {
    const a0 = drawn(iShunt), a1 = drawn(iShunt, solvedSt(iShunt));
    return a0.curves === 0 && a0.t['sc-i'] === '?' && a1.curves === 2 && a1.t['sc-i'] === '118' && !a1.brk[2] && !a1.trips;
  });
  K.check('Self-excited alternators do not maintain a short-circuit current: shunt-fed, it decays towards 0, under 2000 A near 0.15 s and 625 A by 0.5 s', () =>
    SUS.Shunt === 0 && TB.Shunt.toFixed(2) === '0.15' && Math.round(xOf(0.5, 'Shunt') * IR) === 625 && xOf(3, 'Shunt') < 0.01, { source: SRC_124 });
  K.check('With a PMG the set sustains its output during a short circuit, so the protection has time to clear the fault: it holds 2480 A, and the breaker trips at 0.5 s', () =>
    Math.round(SUS.PMG * IR) === 2480 && TB.PMG === Infinity && sc(0.5, 'PMG').opened && !sc(0.49, 'PMG').opened && sc(0.51, 'PMG').cleared && !sc(1, 'Shunt').opened, { source: SRC_124 });
  K.check('The fault current runs through sub-transient, transient and sustained periods: from 6.67 times rated it loses its sub-transient part within 0.1 s, then settles on its sustained level', () => {
    const x0 = xOf(0, 'PMG'), x1 = xOf(0.1, 'PMG'), x3 = xOf(3, 'PMG'), r = drawn(iSC);
    return K.near(x0, 1 / XD2, 1e-9) && x1 < 1 / XD1 && x1 > SUS.PMG + 0.5 && K.near(x3, SUS.PMG, 1e-3) && r.periods === 3;
  });
  K.check('Real power flows into the generator when it loses its prime-mover input, and the relay detects it: from 1 s on A draws power, and the relay picks up only once 25.2 kW flows in', () => {
    for (let k = 0; k <= 58; k++) {
      const t = k / 10, m = es(t);
      if (m.picked !== (-pES(t) >= PICK - 1e-9)) return false;
      if (t >= 1 && !(m.pa < 0)) return false;
    }
    return true;
  });
  K.check('Overload: B trips out and A carries 560 kW, 56 over; a 30 kW group goes every 5 s, so at 12 s A carries 500 kW with two groups shed and the third on; from 590 kW three steps bring it to 500 kW at 15 s', () => {
    const r = drawn(iOv), q0 = drawn(iSteps), q1 = drawn(iSteps, solvedSt(iSteps));
    return tIs(r.t, { 'ov-a': '500', 'ov-o': '0', 'ov-g': '2' }) && r.groups.join() === 'true,true,false' && ov(0, 560).over === 56 && ov(5, 560).pa === 530 &&
      q0.t['ov-g'] === '?' && q0.t['ov-o'] === '86' && tIs(q1.t, { 'ov-a': '500', 'ov-o': '0', 'ov-g': '3' }) && q1.groups.every(Boolean) && r.brk[1] && !r.brk[0];
  });
  K.check('Each typed answer and slip is worked from the rule: 400 kW (360, 320, 220), 0.48 (0.21, 0.317, 1.44), 4593 A (148.8, 3307, 826.7, 5511) and 3 steps (2, 2.87, 86)', () => {
    const sl = (i, v) => STEPS[i].slips.length === v.length && STEPS[i].slips.every((s, k) => Math.abs(s.value - v[k]) < 1e-12);
    return 360 + 40 === 400 && 360 - 40 === 320 && 180 + 40 === 220 && es(2, 360, 40).pb === 400 && es(0, 360, 40).pa === 180 &&
      (200 / 630).toFixed(3) === '0.317' && (0.317 * 1.5 / 1.0).toFixed(2) === '0.48' && (0.317 / 1.5).toFixed(2) === '0.21' &&
      Math.round(826.7 / 0.18) === 4593 && Math.round(5.56 * 826.7) === 4596 && (826.7 * 0.18).toFixed(1) === '148.8' && Math.round(826.7 / 0.25) === 3307 && Math.round(826.7 / 0.15) === 5511 &&
      590 - 504 === 86 && (86 / 30).toFixed(2) === '2.87' && Math.ceil(86 / 30) === 3 && 590 - 3 * 30 === 500 && 590 - 2 * 30 === 530 &&
      STEPS[iB].answer === 400 && STEPS[iSlip].answer === 0.48 && STEPS[iFirst].answer === 4593 && STEPS[iSteps].answer === 3 &&
      sl(iB, [360, 320, 220]) && sl(iSlip, [0.21, 0.317, 1.44]) && sl(iFirst, [148.8, 3307, 826.7, 5511]) && sl(iSteps, [2, 2.87, 86]);
  });
  K.check('Screen 14 hides the readouts and the cause until checked, while A\'s kW arrow points out and its kVAr arrow in; once checked, it names the field lost', () => {
    const a0 = drawn(iLast), a1 = drawn(iLast, solvedSt(iLast));
    return tIs(a0.t, { 'fl-a': '?', 'fl-q': '?', 'fl-e': '?', 'fl-d': '?' }) && a0.status[0] === '' && a0.dir.pa === 1 && a0.dir.qa === -1 &&
      a1.status[0] === 'field lost' && a1.t['fl-d'] === '36.5';
  });
  K.check('Holding the full-load E of 2.25 gives 2.25 ÷ 1.5 = 1.5 times rated, 1240 A; holding 3 times rated needs twice that field', () =>
    Math.round(2.25 / XS * IR) === 1240 && K.near(2.25 / XS, 1.5, 1e-12) && K.near(SUS.PMG / (2.25 / XS), 2, 1e-12));
  K.check('Fourteen screens, six that show and eight to try', () =>
    STEPS.length === 14 && STEPS.filter((d) => d.show).length === 6 && STEPS.filter((d) => !d.show).length === 8 &&
    [iMotor, iNuis, iShunt, iLast].map((i) => STEPS[i].opts.indexOf(STEPS[i].want)).join() === '0,1,1,1');
  K.ready();
</script>
