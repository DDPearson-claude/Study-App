<p class="caption">Worked from the rule, slowed three times. A strobe at 1800 rev/min lights the flywheel's mark, so it stands still there.</p>

<script>
  // ================= the rule =================
  const strip = (s) => s.replace(/\[\^\d+\]/g, '');
  const NB = ' ';                              // a no-break space: a number never parts from its unit
  const SRC_DIP = 'https://www.generac.com/globalassets/pdfs/industrial/whitepapers/sizing-considerations-for-comm-and-ind-gens.pdf';
  const SRC_DROOP = 'https://en.wikipedia.org/wiki/Droop_speed_control';
  // The example set: 4 poles (2 pairs), rated 504 kW at 1800 rev/min, 60 Hz, with 20 kg m² on its shaft.
  const PAIRS = 2, PR = 504, J = 20;
  const rpmOf = (f) => 60 * f / PAIRS;                          // rev/min = pole pairs × ... so 30 × the frequency
  const wOf = (f) => rpmOf(f) * 2 * Math.PI / 60;               // rad/s
  const fOfW = (w) => w * 60 / (2 * Math.PI) * PAIRS / 60;      // Hz
  // The governor: 12% fuel for each hertz below its target, a running total growing 12% a second per hertz,
  // the fuel following the demand after a 0.1 s wait with a 0.1 s time constant, from 0% to 110%.
  // Below 0% the engine's own friction drags the shaft, by up to 10% of 504 kW.
  const KP = 12, KI = 12, WAIT = 0.1, TF = 0.1, UMAX = 110, UMIN = -10;
  const SLOW = 3;                                   // time on screen runs three times slower than real
  const SIMH = 0.002, NDEL = Math.round(WAIT / SIMH), GAIN = 1 - Math.exp(-SIMH / TF);
  const SAMP = 0.02, WIN = 6;                       // the trace: a sample every 0.02 s over the last 6 s
  const r1 = (v) => Math.round(v * 10) / 10;
  const r2 = (v) => Math.round(v * 100) / 100;
  // Where the governor aims: the set point, lowered by the droop as the fuel opens.
  const targetOf = (x, u) => x.sp - x.droop * 60 / 100 * Math.max(0, u) / 100;
  // Where the set settles: the fuel equals the load, so the dot sits on its line.
  const lineOf = (x, load) => x.sp - x.droop * 60 / 100 * load / 100;

  // ================= the lesson: SHOW screens demonstrate, DO screens are puzzles =================
  const STEPS = [
    { kind: 'typed', name: 'Still there?', ans: 'rec', nofig: true, right: 'Still there.',
      answer: 25, decimals: 0, unit: 'rad/s²', want: '25' + NB + 'rad/s²',
      slips: [{ value: 100, hint: 'That multiplies. The speed changes at net torque ÷ inertia.' },
        { value: 0.04, hint: 'That is upside down. The torque goes on top.' }],
      task: 'A flywheel of 2 kg m² feels 50 N m of net torque. How fast does its speed rise?',
      hint: 'Net torque = inertia × angular acceleration. Rearrange for the acceleration.',
      why: 'Angular acceleration = net torque ÷ inertia = 50 ÷ 2 = 25 rad/s². It keeps rising at that rate for as long as the torques stay unbalanced.',
      read: 'A flywheel of 2 kg m² feels 50 N m of net torque. How fast does its speed rise?' },
    { show: true, name: 'Two torques', enter: { droop: 0, sp: 60, load: 25 },
      text: 'A set on its own makes whatever power its load draws. The alternator pulls back on the shaft with a torque equal to power ÷ speed. The engine drives it forward. While the two torques match, the speed holds. Any gap goes into or out of the spinning mass, as on a flywheel. The governor keeps them matched. It measures the speed, compares it with its set point and moves the fuel. It is the AVR\'s loop again, with fuel in place of field.',
      read: 'A set on its own makes whatever power its load draws. The alternator pulls back on the shaft with a torque equal to power ÷ speed. The engine drives it forward. While the two torques match, the speed holds. Any gap goes into or out of the spinning mass, as on a flywheel. The governor keeps them matched. It measures the speed, compares it with its set point and moves the fuel. It is the AVR\'s loop again, with fuel in place of field.',
      still: () => setStill() },
    { kind: 'pick', name: 'Predict the dip', enter: { droop: 0, sp: 60, load: 0 },
      run: [{ at: 0.3, set: { load: 25 } }], rdur: 0.4,
      opts: ['It holds at 60 Hz, because the governor adds fuel at once', 'It dips first, then climbs back as the fuel rises', 'It rises, because the governor adds fuel'],
      want: 'It dips first, then climbs back as the fuel rises',
      task: 'The set runs alone at 60 Hz with no load. A load of 25% lands all at once. The governor is working. What does the frequency do?',
      hints: { 'It holds at 60 Hz, because the governor adds fuel at once': 'This governor measures the speed, so it adds fuel only once the speed starts to fall. The engine then takes time to answer.',
        'It rises, because the governor adds fuel': 'The load pulls back on the shaft before any extra fuel arrives. So the speed falls first.' },
      why: 'The load\'s torque arrives at once. The fuel takes time to follow. Until it does, the gap slows the spinning mass. So the frequency dips. Then the fuel catches up and the speed climbs back.',
      read: 'The set runs alone at 60 Hz with no load. A load of 25% lands all at once. The governor is working. What does the frequency do?' },
    { show: true, name: 'A load step', ctl: ['load'], enter: { droop: 0, sp: 60, load: 0 },
      demo: [{ at: 0.6, set: { load: 25 } }], dur: 0.7,
      text: strip('Tap the load up to 25%, 126 kW. The set turns at 1800 rev/min, which is 188.5 rad/s. So the load\'s torque rises by 126 000 ÷ 188.5 = 668 N m at once. The fuel has not moved yet. So the load\'s arrow outgrows the engine\'s. The flywheel slows and the trace dips. This fall is a *frequency dip*.[^1] After 0.1 s the fuel bar starts to rise. The gap closes and the speed climbs back.'),
      read: 'Adding 126 kW at 188.5 rad/s raises the load\'s torque by 668 N m at once. The fuel has not moved yet. So the flywheel slows and the frequency dips. Then the fuel rises and the speed climbs back.',
      still: () => setStill() },
    { kind: 'typed', name: 'How fast it slows', ans: 'slow', enter: { droop: 0, sp: 60, load: 0 }, mark01: true,
      run: [{ at: 0.3, set: { load: 25 } }], rdur: 0.4,
      answer: 33.4, decimals: 1, unit: 'rad/s²', want: '33.4' + NB + 'rad/s²',
      slips: [{ value: 13360, hint: 'That multiplies. The speed changes at torque ÷ inertia.' },
        { value: 0.03, hint: 'That is upside down. The torque goes on top.' },
        { value: 6.3, hint: 'That divides the 126 kW. Use the torque gap, 668 N m.' }],
      task: 'The load\'s torque has jumped by 668 N m. The fuel has not moved yet. The shaft carries 20 kg m². How fast does the set slow?',
      hint: 'It is the flywheel sum from the first screen.',
      why: '668 ÷ 20 = 33.4 rad/s². In the 0.1 s before the fuel moves, the set loses 33.4 × 0.1 = 3.34 rad/s. That is 1.8% of 188.5 rad/s. The frequency follows the speed. So it falls 1.8% too, from 60 to 58.9 Hz.',
      read: 'The load\'s torque has jumped by 668 N m. The fuel has not moved yet. The shaft carries 20 kg m². How fast does the set slow?' },
    { show: true, name: 'Back to 60 Hz', ctl: ['load'], enter: { droop: 0, sp: 60, load: 0 },
      pre: [{ at: 0.3, set: { load: 25 } }], pdur: 0.4,
      text: 'The speed came back to exactly 60.0 Hz. The governor kept adding fuel until the frequency was back at its set point. The fuel now matches the load, 25%. Tap the load up again. Each step dips the trace, and each time it climbs back to 60 Hz. On the graph the dot slides along a flat line. A governor that holds the same speed at any load is called *isochronous*.',
      read: 'The governor kept adding fuel until the frequency was back at its set point, 60.0 Hz. The fuel now matches the load. At every load the dot returns to the same flat line. A governor that holds the same speed at any load is called isochronous.',
      still: () => setStill(stillIso) },
    { kind: 'pick', name: 'What changed', enter: { droop: 0, sp: 60, load: 50 },
      run: [{ at: 0.3, set: { load: 75 } }], rdur: 0.4,
      opts: ['The fuel, now higher to match the bigger load', 'The frequency, now a little lower', 'Nothing, fuel and frequency are back where they were'],
      want: 'The fuel, now higher to match the bigger load',
      task: 'An isochronous set runs at 60 Hz with 50% load. The load steps up to 75%. Once it settles, what has changed?',
      hints: { 'The frequency, now a little lower': 'An isochronous governor keeps adding fuel until the speed is back at its set point.',
        'Nothing, fuel and frequency are back where they were': 'The load is bigger, so the engine must make more power to hold the speed.' },
      why: 'Holding the speed needs the engine\'s torque to match the load\'s. A bigger load needs more torque, so more fuel. The governor brings the frequency back to 60 Hz. The fuel settles at 75%.',
      read: 'An isochronous set runs at 60 Hz with 50% load. The load steps up to 75%. Once it settles, what has changed?' },
    { show: true, name: 'Droop', ctl: ['droop', 'load'], enter: { droop: 0, sp: 62.4, load: 0 },
      demo: [{ at: 0.5, to: 1.7, ramp: { droop: [0, 4] } }, { at: 2.2, set: { load: 25 } }], dur: 2.3,
      text: strip('Drag the droop to 4%. The line tilts down from 62.4 Hz. The governor now lets the speed settle lower as the load grows. *Droop* is the percentage change in speed that takes the governor through its full travel.[^2] With 5% droop, full load runs at 100% speed and no load at 105%.[^3] Here 4% of 60 Hz is 2.4 Hz. So no load sits at 62.4 Hz and full load at 60 Hz. Step the load up and the dot walks down its line.'),
      read: 'With 4% droop the line tilts down from 62.4 Hz at no load to 60 Hz at full load. Droop is the percentage change in speed that takes the governor through its full travel. 4% of 60 Hz is 2.4 Hz. As the load steps up, the dot walks down its line.',
      still: () => setStill(stillDroop) },
    { kind: 'typed', name: 'Half load', ans: 'half', enter: { droop: 4, sp: 62.4, load: 0 }, hide: ['F'],
      run: [{ at: 0.3, set: { load: 50 } }], rdur: 0.4,
      answer: 61.2, decimals: 1, unit: 'Hz', want: '61.2' + NB + 'Hz',
      slips: [{ value: 60, hint: '60 Hz is full load. At half load the line has fallen only half its 2.4 Hz.' },
        { value: 60.4, hint: 'That takes the droop as 4 Hz. 4% of 60 Hz is 2.4 Hz.' },
        { value: 63.6, hint: 'The frequency falls as the load grows. Take the fall off.' }],
      task: 'With 4% droop, this set runs at 62.4 Hz with no load and 60 Hz at full load, 504 kW. What frequency does it settle at with 252 kW?',
      hint: '252 kW is half of 504 kW. So the line has fallen half its 2.4 Hz.',
      why: '252 ÷ 504 = 0.5. The line falls 2.4 Hz from no load to full load. So by half load it has fallen 1.2 Hz. 62.4 − 1.2 = 61.2 Hz.',
      read: 'With 4% droop, this set runs at 62.4 Hz with no load and 60 Hz at full load, 504 kW. What frequency does it settle at with 252 kW?' },
    { show: true, name: 'The set point', ctl: ['sp', 'trip'], enter: { droop: 4, sp: 62.4, load: 50 },
      demo: [{ at: 0.5, to: 1.3, ramp: { sp: [62.4, 63.0] } }, { at: 1.5, to: 2.3, ramp: { sp: [63.0, 62.4] } }, { at: 2.8, trip: true }], dur: 2.9,
      text: 'The set point lifts the whole line without tilting it. Drag it. The dot rides up or down with it at the same load. So the set point picks the load at which the set runs at 60 Hz. Droop has a cost on a set alone. Its frequency moves with its load. Tap Trip. The trace overshoots. Then the dot settles at the top of its line, 62.4 Hz, above 60 Hz.',
      read: 'The set point lifts the whole line without tilting it. So it picks the load at which the set runs at 60 Hz. When all the load trips, the trace overshoots. Then the dot settles at the top of its line, 62.4 Hz, above 60 Hz.',
      still: () => setStill() },
    { kind: 'typed', name: 'Choose a set point', ans: 'sp', enter: { droop: 4, sp: 62.4, load: 75 },
      run: [{ at: 0.3, to: 1.3, ramp: { sp: [62.4, 61.8] } }], rdur: 1.4,
      answer: 61.8, decimals: 1, unit: 'Hz', want: '61.8' + NB + 'Hz',
      slips: [{ value: 62.4, hint: 'That gives 60 Hz at full load. At 75% the line has fallen less.' },
        { value: 58.2, hint: 'The set point is the top of the line. It sits above 60 Hz.' },
        { value: 63, hint: 'That takes the droop as 4 Hz. 4% of 60 Hz is 2.4 Hz.' }],
      task: 'This set has 4% droop. You want it at exactly 60 Hz with 378 kW, 75% of its rating. Its set point is its no-load frequency. What set point do you choose?',
      hint: 'Find how far the line falls by 75% load. Add that to 60 Hz.',
      why: 'The full fall is 2.4 Hz. By 75% load the line has fallen 0.75 × 2.4 = 1.8 Hz. So its top must sit 1.8 Hz above 60 Hz, at 61.8 Hz.',
      read: 'This set has 4% droop. You want it at exactly 60 Hz with 378 kW, 75% of its rating. Its set point is its no-load frequency. What set point do you choose?' },
    { kind: 'pick', name: 'Fault or design?', enter: { droop: 4, sp: 60, load: 100 },
      run: [{ at: 0.3, to: 1.3, ramp: { sp: [60, 62.4] } }], rdur: 1.4,
      opts: ['A fault: the governor cannot hold the speed', 'Design: droop working, with the set point too low', 'A fault: the engine is short of power'],
      want: 'Design: droop working, with the set point too low',
      task: 'A set on 4% droop runs at 60.0 Hz with no load. On full load it settles at 57.6 Hz. Fault or design?',
      hints: { 'A fault: the governor cannot hold the speed': 'Work out the line. 4% of 60 Hz is 2.4 Hz. Full load sits that far below the no-load frequency.',
        'A fault: the engine is short of power': 'The set carries its full load and its speed is steady. The fall matches its droop exactly.' },
      why: '4% of 60 Hz is 2.4 Hz. 60.0 − 2.4 = 57.6 Hz. That is exactly on its line. The governor is doing what it was set to do. Raise the set point to 62.4 Hz and full load lands on 60 Hz.',
      read: 'A set on 4% droop runs at 60.0 Hz with no load. On full load it settles at 57.6 Hz. Fault or design?' },
    { kind: 'typed', name: 'A 50 Hz set', ans: 'fifty', nofig: true,
      answer: 52.5, decimals: 1, unit: 'Hz', want: '52.5' + NB + 'Hz',
      slips: [{ value: 55, hint: 'That takes the droop as 5 Hz. 5% of 50 Hz is 2.5 Hz.' },
        { value: 47.5, hint: 'Losing load sends the dot up its line, not down.' },
        { value: 50, hint: 'That is isochronous. With droop the set settles at the top of its line.' }],
      task: 'Another set makes 50 Hz. It has 5% droop and runs at 50 Hz on full load. All its load trips. What frequency does it settle at?',
      hint: '5% of 50 Hz is the droop in hertz. A trip sends the set to the top of its line.',
      why: '5% of 50 Hz is 2.5 Hz. Full load sits at 50 Hz. So no load sits at 50 + 2.5 = 52.5 Hz. The frequency overshoots first, then settles there.',
      close: 'The governor holds the speed with fuel. Droop sets how far it gives with load.',
      read: 'Another set makes 50 Hz. It has 5% droop and runs at 50 Hz on full load. All its load trips. What frequency does it settle at?' },
  ];
  const FINISH = 'The governor trims the fuel to hold the speed, and so the frequency. A sudden load slows the set first, because the fuel takes time to follow. The torque gap goes into the spinning mass, and the trace dips. Then the fuel catches up. An *isochronous* governor brings the speed back to its set point at any load. With *droop*, the speed settles lower as the load grows, along a line. The droop tilts the line, and the set point lifts it.';

  // ================= state =================
  const BASE = { droop: 0, sp: 60, load: 0 };
  const X = Object.assign({}, BASE);
  const sim = {};
  const blank = () => ({ pick: null, res: null, why: false, tries: 0, hint: '' });
  let S = STEPS.map(blank);
  const solved = (st) => !!st && (st.res === 'right' || st.res === 'shown');
  let T = Infinity, motionEnd = 0, scripted = false, lastStep = -1, finished = false, lastDone = false;
  const ANG0 = 0.9;
  let ang = ANG0, markEl = null;
  let REC = { t: {} };
  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const testing = () => document.documentElement.classList.contains('k-testing');
  const quiet = () => REDUCE || testing();
  const el = (id) => document.getElementById(id);
  const idx = (name) => STEPS.findIndex((d) => d.name === name);

  // ================= the set running =================
  const fNow = () => fOfW(sim.w);
  const fss = () => lineOf(X, X.load);
  function resetSim() {
    const f = fss();
    Object.assign(sim, { t: 0, w: wOf(f), I: X.load, u: X.load, del: new Array(NDEL).fill(X.load), k: 0, acc: 0, sa: 0,
      live: false, ts: [-WIN, 0], fs: [f, f], ev: null, dfdt: 0, since: 99 });
  }
  function sample() {
    sim.ts.push(sim.t); sim.fs.push(fNow());
    while (sim.ts.length > 2 && sim.ts[1] < sim.t - WIN - 0.05) { sim.ts.shift(); sim.fs.shift(); }
  }
  // Settled: on its line, still, the fuel at the load and nothing left in the governor's wait.
  function settledNow() {
    if (sim.since < 0.3 || Math.abs(fNow() - fss()) >= 0.1 || Math.abs(sim.dfdt) >= 0.3 || Math.abs(sim.u - X.load) >= 1) return false;
    for (let j = 0; j < NDEL; j++) if (Math.abs(sim.del[j] - X.load) >= 1) return false;
    return true;
  }
  // One small step of real time: the governor reads the frequency, the fuel follows its demand after the
  // wait, and the torque gap speeds up or slows the spinning mass.
  function step1() {
    const f = fNow(), e = targetOf(X, sim.u) - f;
    let dem = KP * e + sim.I;
    const hi = dem >= UMAX, lo = dem <= UMIN;

    a('line', { class: 'ref', x1: 186, y1: 10, x2: 206, y2: 10 });
    a('text', { class: 'lab', x: 211, y: 14.5 }, '60' + NB + 'Hz');
    a('line', { class: 'ax', x1: TX0, y1: TY0, x2: TX1, y2: TY0 });
    a('line', { class: 'ax', x1: TX0, y1: TY0, x2: TX0, y2: TYT - 4 });
    [54, 60, 66, 72].forEach((f) => {
      const y = r1(yT(f));
      a('line', { class: 'ax', x1: TX0 - 4, y1: y, x2: TX0, y2: y });
      a('text', { class: 'lab', x: TX0 - 7, y: r1(y + 4.5), 'text-anchor': 'end' }, f === 72 ? '72' + NB + 'Hz' : String(f));
    });
    a('text', { class: 'lab', x: TX0, y: 193 }, '6' + NB + 's ago');
    a('text', { class: 'lab', x: TX1, y: 193, 'text-anchor': 'end' }, 'now');
    const ref = a('line', { class: 'ref', x1: TX0, y1: y60, x2: TX1, y2: y60 });
    // The samples in the window, the first one cut at its left edge.
    const t0 = sim.t - WIN, pts = [];
    for (let j = 0; j < sim.ts.length; j++) {
      if (sim.ts[j] < t0) continue;
      if (!pts.length && j > 0) {
        const s = (t0 - sim.ts[j - 1]) / (sim.ts[j] - sim.ts[j - 1]);
        pts.push([TX0, yT(K.lerp(sim.fs[j - 1], sim.fs[j], s))]);
      }
      pts.push([xT(sim.ts[j]), yT(sim.fs[j])]);
    }
    pts.push([TX1, yT(fNow())]);
    const line = a('polyline', { class: 'tr', points: pts.map((p) => r1(p[0]) + ',' + r1(p[1])).join(' ') });
    a('circle', { class: 'pdot', cx: TX1, cy: r1(yT(fNow())), r: 3.5 });
    // The dip (or the overshoot after a trip) the last load step made, named on the trace.
    const items = [], avoid = [line, ref];
    REC.dip = null; REC.m01 = null;
    const ev = sim.ev;
    if (ev && ev.t >= t0) {
      let ex = ev.f0, tx = ev.t;
      const up = !!ev.up;
      for (let j = 0; j < sim.ts.length; j++) {
        if (sim.ts[j] < ev.t) continue;
        if (up ? sim.fs[j] > ex : sim.fs[j] < ex) { ex = sim.fs[j]; tx = sim.ts[j]; }
      }
      if (Math.abs(ex - ev.f0) > 0.5) {
        REC.dip = up ? 'overshoot' : 'dip';
        items.push({ x: r1(xT(tx)), y: r1(up ? yT(ex) - 10 : yT(ex) + 20), text: REC.dip, anchor: 'middle', class: 'lab' });
      }
      // Screen 5's answer: the frequency 0.1 s after the step, marked on the trace.
      if (STEPS[i].mark01 && solved(S[i]) && ev.f01 != null && ev.t + WAIT >= t0) {
        const x = xT(ev.t + WAIT), y = yT(ev.f01);
        avoid.push(a('circle', { class: 'ring', cx: r1(x), cy: r1(y), r: 4.5 }));
        REC.m01 = K.fmt(ev.f01, { decimals: 1 }) + NB + 'Hz at 0.1' + NB + 's';
        items.unshift({ x: r1(x - 9), y: r1(y + 4.5), text: REC.m01, anchor: 'end', class: 'lab' });
      }
    }
    if (items.length) K.labels(a('g', {}), items, { avoid });
    let mn = Infinity, mx = -Infinity;
    for (let j = 0; j < sim.ts.length; j++) if (sim.ts[j] >= t0) { mn = Math.min(mn, sim.fs[j]); mx = Math.max(mx, sim.fs[j]); }
    Object.assign(REC, { trMin: mn, trMax: mx, dips: countDips(t0) });
    el('trc').setAttribute('aria-label', 'Frequency against time over the last 6 s, newest at the right, from 54 to 72 Hz, with 60 Hz dashed. ' +
      (REC.dip === 'dip' ? 'After the last load step it dips, then climbs back.' : REC.dip === 'overshoot' ? 'After the trip it overshoots, then settles.' : mx - mn > 0.3 ? 'It shows a change a few seconds ago.' : 'It runs flat.'));
  }
  // How many separate dips the window shows: each falls below 59.0 Hz after running at 59.5 Hz or more.
  function countDips(t0) {
    let c = 0, armed = true;
    for (let j = 0; j < sim.ts.length; j++) {
      if (sim.ts[j] < t0) continue;
      const f = sim.fs[j];
      if (armed && f < 59) { c++; armed = false; } else if (!armed && f >= 59.5) armed = true;
    }
    return c;
  }

  // ================= one paint =================
  function readouts(i) {
    const d = STEPS[i], f = fNow();
    const hideF = !finished && !!d.hide && d.hide.indexOf('F') >= 0 && !solved(S[i]);
    const tx = { L: String(Math.round(X.load / 100 * PR)), U: String(Math.round(Math.max(0, sim.u))), S: String(Math.round(rpmOf(f))), F: hideF ? '?' : f.toFixed(1) };
    Object.keys(RO).forEach((k) => RO[k].set(tx[k]));
    REC.t = tx;
  }
  function paint(i) {
    if (i == null) i = at();
    REC = { t: {}, load: X.load, droop: X.droop, sp: X.sp, f: fNow(), u: sim.u, live: sim.live };
    drawSet();
    drawDroop();
    drawTrace(i);
    readouts(i);
  }

  // ================= the page around the picture =================
  write(el('finish'), FINISH);
  const setLab = (b, s) => { if (b.el.textContent !== s) b.setLabel(s); };
  function showCtls(i) {
    const d = STEPS[i];
    el('c-load').hidden = !shownCtl(d, 'load');
    el('c-trip').hidden = !shownCtl(d, 'trip');
    el('c-droop').hidden = !shownCtl(d, 'droop');
    el('c-sp').hidden = !shownCtl(d, 'sp');
    el('sws').hidden = el('c-droop').hidden && el('c-sp').hidden;
  }
  function layout(i) {
    const d = STEPS[i], st = S[i], sol = solved(st);
    el('stepbox').hidden = finished;
    el('done').hidden = !finished;
    el('count').textContent = 'Screen ' + (i + 1) + ' of ' + STEPS.length;
    const task = el('task');
    task.className = 'task' + (d.show ? ' show' : '');
    write(task, d.show ? d.text : d.task);
    el('figs').hidden = !!d.nofig;
    showCtls(i);
    replayBtn.el.hidden = !d.show || !d.demo || finished || REDUCE;
    el('replay').hidden = replayBtn.el.hidden;
    const opts = d.kind === 'pick' ? d.opts : [];
    el('picks').hidden = !opts.length;
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      setLab(b, opts[k]);
      b.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });
    el('answers').hidden = d.kind !== 'typed';
    Object.keys(ANS).forEach((key) => { el('ans-' + key).hidden = d.ans !== key; });
    el('acts').hidden = !!d.show;
    checkBtn.el.hidden = sol;
    const fb = el('fb');
    fb.hidden = !!d.show;
    fb.className = 'fb' + (st.res === 'right' ? ' right' : '');
    let say = '';
    if (!d.show) {
      if (st.res === 'right') say = d.right || 'That\'s it.';
      else if (st.res === 'shown') say = 'Here is the working.';
      else if (st.res === 'wrong') say = d.kind === 'typed' ? st.hint : (d.hints && d.hints[st.pick]) || d.hint || '';
      else if (st.res === 'empty') say = d.kind === 'pick' ? 'Pick one of the answers first.' : 'Type your answer first.';
    }
    write(fb, say);
    const why = el('why');
    why.hidden = d.show || !st.why;
    write(why, d.show ? '' : d.why);
    setLab(whyBtn, st.why ? 'Hide why' : 'Why?');
    const cl = el('closing');
    cl.hidden = !(d.close && sol);
    write(cl, d.close || '');
    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !sol);
    setLab(nextBtn, i === STEPS.length - 1 ? 'Finish' : 'Continue');
    el('nav').hidden = backBtn.el.hidden && nextBtn.el.hidden;
  }

  K.update((p) => {
    const i = at(), d = STEPS[i];
    if (i !== lastStep) { lastStep = i; enterStep(i); }
    else {
      CIDS.forEach((id) => {
        const v = norm(id, p[id]);
        if (v === pushed[id]) return;
        if (shownCtl(d, id)) { endDemo(); pushed[id] = v; applyCtl(id, v); }
        else CTL[id].set(id === 'load' ? String(pushed[id]) : pushed[id], true);   // a control this screen does not use stays put
      });
      push();
    }
    if (finished !== lastDone) { lastDone = finished; enter(finished ? 'done' : 'stepbox'); }
    layout(i);
    paint(i);
    kick();
  });

  // ================= known answers, worked out by hand =================
  const solvedSt = (i) => Object.assign(blank(), STEPS[i].kind === 'pick' ? { pick: STEPS[i].want, res: 'right' } : { res: 'right' });
  function saveAll() {
    return { X: Object.assign({}, X), sim: Object.assign({}, sim, { del: sim.del.slice(), ts: sim.ts.slice(), fs: sim.fs.slice(), ev: sim.ev && Object.assign({}, sim.ev) }),
      T, sc: scripted, fin: finished, ang, S: S.slice() };
  }
  function restoreAll(k) {
    Object.assign(X, k.X); Object.assign(sim, k.sim); T = k.T; scripted = k.sc; finished = k.fin; ang = k.ang; S = k.S;
  }
  // A screen in the state given (its demonstration finished, unless opening), and what it drew.
  function drawn(i, st, opening, then) {
    const keep = saveAll();
    S = S.slice(); S[i] = st || blank(); T = Infinity; scripted = false; finished = false;
    try {
      prep(i, !opening);
      if (then) then();
      paint(i);
      return Object.assign({}, REC, { t: Object.assign({}, REC.t) });
    } finally { restoreAll(keep); paint(); }
  }
  // A bare run of the set from a steady state, for the checks: fn gets the set to play with.
  function trial(start, fn) {
    const keep = saveAll();
    try { Object.assign(X, BASE, start); resetSim(); return fn(); } finally { restoreAll(keep); paint(); }
  }
  const iRec = idx('Still there?'), iBal = idx('Two torques'), iPred = idx('Predict the dip'), iStep = idx('A load step'), iSlow = idx('How fast it slows');
  const iIso = idx('Back to 60 Hz'), iWhat = idx('What changed'), iDroop = idx('Droop'), iHalf = idx('Half load'), iSet = idx('The set point');
  const iChoose = idx('Choose a set point'), iFault = idx('Fault or design?'), iFifty = idx('A 50 Hz set');
  const W60 = wOf(60);

  K.check('At 1800 rev/min the set turns at 188.5 rad/s and 60 Hz; at 25% load the torques match at 126 000 ÷ 188.5 = 668 N m, and the tiles read 126 kW, 25%, 1800 rev/min and 60.0 Hz', () => {
    const r = drawn(iBal, null, true);
    return r1(W60) === 188.5 && rpmOf(60) === 1800 && Math.round(126000 / W60) === 668 && K.near(r.te, 126000 / W60, 1e-6) && K.near(r.tl, r.te, 1e-9) &&
      K.near(r.le, r.ll, 1e-9) && r.t.L === '126' && r.t.U === '25' && r.t.S === '1800' && r.t.F === '60.0' && !r.live;
  });
  K.check('A 25% step with the fuel not yet moved slows the set at 668 ÷ 20 = 33.4 rad/s², so 0.1 s later it runs at 58.9 Hz; the dip bottoms out within 1.5 s on screen, then the set climbs back to 60.0 Hz with the fuel at 25%', () => {
    const t = trial({ droop: 0, sp: 60, load: 0 }, () => {
      setLoad(25); step1();
      const a0 = sim.dfdt * Math.PI;
      let mn = Infinity, tm = 0, fuelStill = true;
      while (sim.t < 1.5) { step1(); if (sim.t < WAIT - 1e-9 && sim.u > 0.001) fuelStill = false; if (fNow() < mn) { mn = fNow(); tm = sim.t; } }
      return { a0, f01: sim.ev.f01, mn, tm, fuelStill };
    });
    const r = drawn(iSlow, solvedSt(iSlow)), r0 = drawn(iSlow);
    return K.near(t.a0, -33.4, 0.05) && t.f01.toFixed(1) === '58.9' && t.fuelStill && t.mn < 58.9 && t.tm * SLOW <= 1.5 &&
      r.m01 === '58.9' + NB + 'Hz at 0.1' + NB + 's' && r.dip === 'dip' && r.t.F === '60.0' && r.t.U === '25' && r0.m01 === null && r0.dip === null;
  });
  K.check('Frequency dip is when the engine cannot supply enough power to support the load demand, causing a reduction in engine RPM', () => trial({ droop: 0, sp: 60, load: 0 }, () => {
    setLoad(25);
    let ok = true, n = 0;
    while (sim.live && n++ < 5000) {
      const r0 = rpmOf(fNow()), short = sim.u < X.load - 1, over = sim.u > X.load + 1;
      step1();
      if (!sim.live) break;
      const r1v = rpmOf(fNow());
      if (short && !(r1v < r0)) ok = false;
      if (over && !(r1v > r0)) ok = false;
    }
    return ok && n > 100;
  }), { source: SRC_DIP });
  K.check('Isochronous: every step of the load returns the set to exactly 60.0 Hz with the fuel at the load; the read-through of screen 6 shows three dips, ending at 378 kW, 75%, 1800 rev/min and 60.0 Hz', () => {
    const ok = trial({ droop: 0, sp: 60, load: 0 }, () => LOADS.slice(1).every((v) => { setLoad(v); settleNow(); return !sim.live && K.near(fNow(), 60, 1e-9) && sim.u === v; }));
    const r = drawn(iIso, null, false, stillIso), w = drawn(iWhat, solvedSt(iWhat));
    return ok && r.dips === 3 && r.t.L === '378' && r.t.U === '75' && r.t.S === '1800' && r.t.F === '60.0' && r.line[0] === 60 && r.line[1] === 60 &&
      w.t.U === '75' && w.t.F === '60.0' && STEPS[iWhat].want === STEPS[iWhat].opts[0];
  });
  K.check('Droop is the percentage change in design speed required for 100% governor action: at 4%, full fuel lowers the target 2.4 Hz below its no-fuel 62.4 Hz', () => {
    const x = { droop: 4, sp: 62.4 };
    return K.near(targetOf(x, 0) - targetOf(x, 100), 2.4, 1e-9) && K.near(targetOf(x, 0), 62.4, 1e-9) && K.near(targetOf(x, 100), 60, 1e-9) &&
      K.near(targetOf({ droop: 0, sp: 60 }, 100), 60, 1e-9);
  }, { source: SRC_DROOP });
  K.check('By definition, with 5% droop the full-load speed is 100% and the no-load speed is 105%', () => trial({ droop: 5, sp: 63, load: 100 }, () => {
    const full = fNow();
    setLoad(0); settleNow();
    return K.near(full, 60, 1e-9) && K.near(fNow() / full, 1.05, 1e-9) && !sim.live;
  }), { source: SRC_DROOP });
  K.check('On 4% droop from 62.4 Hz the set settles at 61.2 Hz on 252 kW, 60.6 Hz on 378 kW and 60.0 Hz on 504 kW; 61.8 Hz puts 378 kW on 60.0 Hz; a 60.0 Hz set point gives 57.6 Hz on full load, and 62.4 Hz lifts it to 60.0 Hz', () => {
    const h0 = drawn(iHalf), h = drawn(iHalf, solvedSt(iHalf)), c0 = drawn(iChoose), c = drawn(iChoose, solvedSt(iChoose)), f0 = drawn(iFault), f = drawn(iFault, solvedSt(iFault));
    const full = drawn(iDroop, null, false, stillDroop);
    return h0.t.F === '?' && h0.t.S === '1872' && h.t.F === '61.2' && h.t.L === '252' && h.t.U === '50' && h.onLine &&
      c0.t.F === '60.6' && c.t.F === '60.0' && K.near(c.sp, 61.8, 1e-9) && f0.t.F === '57.6' && f.t.F === '60.0' && K.near(f.sp, 62.4, 1e-9) &&
      full.t.L === '504' && full.t.U === '100' && full.t.S === '1800' && full.t.F === '60.0' && full.line[0] === 62.4 && full.line[1] === 60;
  });
  K.check('A trip from 252 kW on 4% droop overshoots, then settles at the top of the line, 62.4 Hz and 1872 rev/min; even a trip from full load peaks below the trace\'s 72 Hz', () => {
    const r = drawn(iSet);
    const peak = trial({ droop: 4, sp: 62.4, load: 100 }, () => { setLoad(0, 'trip'); let mx = 0; while (sim.live) { step1(); mx = Math.max(mx, fNow()); } return mx; });
    return r.dip === 'overshoot' && r.trMax > 64 && r.t.F === '62.4' && r.t.S === '1872' && r.t.L === '0' && r.t.U === '0' && peak > 66 && peak < 72;
  });
  K.check('The torque arrows are drawn to scale: just after a 25% step the alternator\'s arrow outgrows the engine\'s, and their lengths keep the torques\' ratio', () => trial({ droop: 0, sp: 60, load: 0 }, () => {
    setLoad(25);
    for (let n = 0; n < 75; n++) step1();
    paint(iStep);
    const r = Object.assign({}, REC);
    return r.ll > r.le && r.le > 3 && K.near(r.le / r.ll, r.te / r.tl, 1e-6) && K.near(r.ll, 25 / 100 * PR * 1000 / sim.w * KT, 1e-6);
  }));
  K.check('Each typed answer and slip is worked from the rule: 25 rad/s² (100, 0.04), 33.4 rad/s² (13 360, 0.03, 6.3), 61.2 Hz (60, 60.4, 63.6), 61.8 Hz (62.4, 58.2, 63) and 52.5 Hz (55, 47.5, 50)', () => {
    const sl = (i, v) => STEPS[i].slips.length === v.length && STEPS[i].slips.every((s, k) => Math.abs(s.value - v[k]) < 1e-12);
    const tq = Math.round(126000 / W60);
    const work = 50 / 2 === 25 && 50 * 2 === 100 && 2 / 50 === 0.04 && r1(tq / 20) === 33.4 && tq * 20 === 13360 && r2(20 / tq) === 0.03 && 126 / 20 === 6.3 &&
      r1(33.4 * 0.1 / 188.5 * 100) === 1.8 && r1(60 * (1 - 3.34 / 188.5)) === 58.9 &&
      r1(62.4 - 2.4 * 252 / 504) === 61.2 && r1(62.4 - 4 * 0.5) === 60.4 && r1(62.4 + 1.2) === 63.6 &&
      r1(60 + 0.75 * 2.4) === 61.8 && r1(60 + 2.4) === 62.4 && r1(60 - 1.8) === 58.2 && r1(60 + 0.75 * 4) === 63 &&
      r1(50 + 0.05 * 50) === 52.5 && 50 + 5 === 55 && r1(50 - 2.5) === 47.5 && r1(60 - 2.4) === 57.6;
    return work && STEPS[iRec].answer === 25 && STEPS[iSlow].answer === 33.4 && STEPS[iHalf].answer === 61.2 && STEPS[iChoose].answer === 61.8 && STEPS[iFifty].answer === 52.5 &&
      sl(iRec, [100, 0.04]) && sl(iSlow, [13360, 0.03, 6.3]) && sl(iHalf, [60, 60.4, 63.6]) && sl(iChoose, [62.4, 58.2, 63]) && sl(iFifty, [55, 47.5, 50]) &&
      STEPS[iPred].want === STEPS[iPred].opts[1] && STEPS[iFault].want === STEPS[iFault].opts[1] && STEPS[iRec].right === 'Still there.' && iFifty === STEPS.length - 1;
  });
  K.check('Screen 4\'s demonstration ends with the dip on the trace and the set back at 60.0 Hz on 25% fuel; screen 8\'s ends on its 4% line at 61.8 Hz with 126 kW', () => {
    const a = drawn(iStep), b = drawn(iDroop), p = drawn(iPred, solvedSt(iPred));
    return a.dip === 'dip' && a.t.F === '60.0' && a.t.U === '25' && a.trMin < 58 && b.t.F === '61.8' && b.t.L === '126' && b.onLine && p.dip === 'dip' && p.t.F === '60.0';
  });
  K.ready();
</script>
