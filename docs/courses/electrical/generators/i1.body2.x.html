<p class="caption">A sketch worked from the rule. A drag turns the rotor as if at the set speed.</p>

<script>
  // ================= the rule =================
  const strip = (s) => s.replace(/\[\^\d+\]/g, '');
  const NB = '\u00a0';                          // a no-break space: a number never parts from its unit
  const SRC_60 = 'https://www.aast.edu/pheed/staffadminview/pdf_retreive.php?stafftype=staffcourses&url=45_24985_EE328_2016_1__2_1_lecture7.pdf';
  const SRC_120 = 'https://media.defense.gov/2014/Jun/20/2002655888/-1/-1/1/140620-N-ZZ182-6532.pdf';
  const SRC_ROT = 'http://www.egr.unlv.edu/~eebag/SYNCHRONOUS%20GENERATORS.pdf';
  const RATED = 440, RATED_F = 60;                  // each pole setting: a machine built for 440 V at 60 Hz on full field
  // frequency = pole pairs × rev/min ÷ 60; voltage = 440 × (frequency ÷ 60) × (field current ÷ 100%)
  const freqOf = (poles, rpm) => poles / 2 * rpm / 60;
  const voltsOf = (poles, rpm, field) => RATED * freqOf(poles, rpm) / RATED_F * field / 100;
  const RAD = Math.PI / 180;
  // Each coil's voltage at rotor angle a (degrees, clockwise from coil A). A north pole square in front of a
  // coil gives it the most flux, and the voltage follows how fast that flux changes: zero there, biggest
  // between poles. Coils B and C sit 120° on (in the wave) from A. dir is the way the rotor turns (0: still).
  function emfAt(poles, V, a, dir) {
    const p = poles / 2;
    return [0, 1, 2].map((k) => (dir ? -dir * V * Math.sin((p * a - 120 * k) * RAD) : 0));
  }
  const SLOW = 60, WIN = 60, DTMS = 0.2, NS = Math.round(WIN / DTMS) + 1, AUTO = 15, GAP = 4;
  const turnMs = (rpm) => 60000 / rpm;              // one turn, in ms of real time
  const a0 = (poles) => 360 / poles;                // a south pole square in front of coil A: A's wave about to rise
  const mod360 = (a) => ((a % 360) + 360) % 360;
  const wrap = (d) => ((d % 360) + 540) % 360 - 180;
  const fmtHz = (f) => (Math.abs(f - Math.round(f)) < 1e-9 ? String(Math.round(f)) : f.toFixed(1));
  const r1 = (v) => Math.round(v * 10) / 10;
  const r2 = (v) => Math.round(v * 100) / 100;

  // ================= the lesson: SHOW screens demonstrate, DO screens are puzzles =================
  const STEPS = [
    { show: true, name: 'One turn, one cycle', mode: 'drag', ctl: ['turn'], enter: { poles: 2, rpm: 3600, bc: 0 },
      demo: [{ at: 0.6, to: 4.0, turn: 360 }], dur: 4.4,
      text: strip('A generator set\'s alternator is the simple turning-coil generator, turned inside out. Its coils stay still in the *stator*, the fixed outer ring. The *rotor* turns inside it. Direct current in the rotor\'s winding makes it a magnet, with a north and a south pole. Its field turns with it. Drag the rotor round once. Coil A\'s flux rises as the north pole arrives and falls as it leaves. Then the south pole sends flux through the other way. One turn makes one full cycle.'),
      read: 'The rotor is a magnet with one north and one south pole. It turns inside the fixed stator. As the north pole and then the south pole pass coil A, its trace makes one full cycle. That happens once every turn.',
      still: () => setStill() },
    { kind: 'pick', name: 'A parked pole', enter: { poles: 2, rpm: 0, bc: 0 }, a: 0, blank: true, hide: ['f', 'V'],
      run: [{ at: 0, to: 2.4, spin: true }], rdur: 2.4,
      opts: ['None, because the flux through it is not changing', 'Its biggest, because the flux through it is strongest', 'A steady direct voltage, because the field current is direct'],
      want: 'None, because the flux through it is not changing',
      task: 'The rotor stops with its north pole square in front of coil A. The field current is still on. What voltage does coil A make?',
      hint: 'Voltage comes from the flux changing, not from how much there is. A parked pole changes nothing.',
      hints: { 'Its biggest, because the flux through it is strongest': 'Voltage comes from the flux changing, not from how much there is. A parked pole changes nothing.',
        'A steady direct voltage, because the field current is direct': 'The rotor\'s current is direct. But a coil only gets a voltage while a pole moves past it.' },
      why: 'A coil makes voltage only while the flux through it changes. A parked pole gives coil A plenty of flux, but the flux is steady. So coil A makes nothing until the rotor turns again.',
      read: 'The rotor stops with its north pole square in front of coil A. The field current is still on. What voltage does coil A make?' },
    { show: true, name: 'Three coils, three phases', mode: 'spin', ctl: ['play'], enter: { poles: 2, rpm: 3600, bc: 0 },
      demo: [{ at: 0, to: 0.9, fade: true }, { at: 0.9, to: 3.4, spin: true }], dur: 3.6,
      text: strip('Now add coils B and C. Each sits 120° round the stator from the last. Tap Play. The north pole reaches B a third of a turn after A. It reaches C a third of a turn after that. So the three waves have the same shape, each 120° behind the last. These are the three phases you already know, and here is their cause. Each coil is one phase\'s winding.'),
      read: 'Coils B and C sit 120° round the stator from A and from each other. Each pole reaches them a third of a turn later. So three equal waves build, each 120° behind the one before.',
      still: () => setStill() },
    { kind: 'typed', name: 'B behind A', ans: 'lag', enter: { poles: 2, rpm: 3000 }, blank: true, peaks: true,
      run: [{ at: 0, to: 2.0, spin: true }], rdur: 2.0,
      answer: 6.67, decimals: 2, unit: 'ms', want: '6.67' + NB + 'ms',
      slips: [{ value: 20, hint: 'That is a whole turn. B is only a third of a turn on from A.' },
        { value: 13.33, hint: 'That is two thirds of a turn, from B on round to A. The rotor reaches B first.' },
        { value: 3.33, hint: 'That is a sixth of a turn. 120° is a third of 360°.' }],
      task: 'A 2-pole rotor turns at 3000 rev/min. Coil B sits 120° on from coil A, in the direction the rotor turns. How long after coil A\'s wave peaks does coil B\'s wave peak?',
      hint: 'Work out how long one turn takes. Then take a third of it.',
      why: '3000 rev/min is 3000 ÷ 60 = 50 turns a second. So one turn takes 1 ÷ 50 s, which is 20 ms. Coil B is a third of a turn on. So its wave peaks 20 ÷ 3 = 6.67 ms after A\'s.',
      read: 'A 2-pole rotor turns at 3000 rev/min. Coil B sits 120° on from coil A, in the direction the rotor turns. How long after coil A\'s wave peaks does coil B\'s wave peak?' },
    { show: true, name: 'Two pole pairs', mode: 'drag', ctl: ['turn', 'poles'], enter: { poles: 4, rpm: 1800 },
      demo: [{ at: 0.6, to: 4.0, turn: 360 }], dur: 4.4,
      text: strip('Switch the rotor to 4 poles: north, south, north, south. Drag it round once. Coil A now sees a north and a south go by twice. So it makes two full cycles in one turn. A north and a south together are a *pole pair*. Each pole pair that passes makes one cycle. The stator now carries a set of three coils for each pole pair. That keeps the three phases 120° apart in the wave.'),
      read: 'A 4-pole rotor has two pole pairs. Coil A sees a north and a south go by twice each turn. So it makes two full cycles a turn. The stator carries a set of three coils for each pole pair.',
      still: () => setStill() },
    { kind: 'typed', name: 'Cycles in a turn', ans: 'cyc', enter: { poles: 4, rpm: 1800 }, blank: true,
      run: [{ at: 0, set: { poles: 6, rpm: 1200 }, reset: true }, { at: 0.2, to: 2.8, turn: 360 }], rdur: 3.0,
      answer: 3, decimals: 0, unit: 'cycles', want: '3' + NB + 'cycles',
      slips: [{ value: 6, hint: 'That counts poles. A cycle needs a north and a south, so count pole pairs.' },
        { value: 1, hint: 'One cycle a turn is the 2-pole machine only. Each pole pair gives one cycle.' }],
      task: 'A 6-pole rotor makes one full turn. How many full cycles does coil A make?',
      hint: 'Pair each north pole with a south pole. Then count the pairs.',
      why: '6 poles make 3 pole pairs, each a north and a south. Each pair sweeping past coil A makes one cycle. So one turn makes 3.',
      read: 'A 6-pole rotor makes one full turn. How many full cycles does coil A make?' },
    { show: true, name: 'Speed sets frequency', mode: 'spin', ctl: ['poles', 'rpm', 'play'], enter: { poles: 4, rpm: 1800 },
      demo: [{ at: 0.4, to: 4.0, spin: true }], dur: 4.2,
      text: strip('The rotor turns rev/min ÷ 60 times a second. Each turn gives one cycle for each pole pair. So frequency = pole pairs × rev/min ÷ 60. A 2-pole machine must turn at 3600 rev/min to make 60 Hz.[^1] A 4-pole one needs only 1800 rev/min. The rule is printed two ways. f = P × n ÷ 60 counts P in pole pairs. f = P × N ÷ 120 counts P in poles. Always check which P you have.'),
      read: 'Frequency = pole pairs × rev/min ÷ 60. A 2-pole machine makes 60 Hz at 3600 rev/min. A 4-pole one makes it at 1800 rev/min. The rule is also printed as f = P × N ÷ 120, where P counts poles.',
      still: () => setStill() },
    { kind: 'typed', name: 'A 4-pole set', ans: 'f4', enter: { poles: 4, rpm: 1800 }, blank: true, hide: ['f', 'V'],
      run: [{ at: 0, to: 2.5, spin: true }], rdur: 2.5,
      answer: 60, decimals: 0, unit: 'Hz', want: '60' + NB + 'Hz',
      slips: [{ value: 120, hint: '4 poles are 2 pole pairs. That answer puts poles into the pole-pair form.' },
        { value: 30, hint: 'The form with 120 counts poles, so 4 goes in, not 2.' }],
      task: 'A 4-pole set turns at 1800 rev/min. What frequency does it make?',
      hint: 'Count the pole pairs first.',
      why: '4 poles make 2 pole pairs. So 2 × 1800 ÷ 60 = 60 Hz. The poles form gives 4 × 1800 ÷ 120 = 60 Hz. Both forms agree when P means what each one says.',
      read: 'A 4-pole set turns at 1800 rev/min. What frequency does it make?' },
    { show: true, name: 'Speed or field', mode: 'spin', ctl: ['rpm', 'field', 'play'], enter: { poles: 4, rpm: 1710 },
      demo: [{ at: 0.4, to: 4.0, spin: true }], dur: 4.2,
      text: strip('Each coil\'s voltage follows the transformer rule, E = 4.44 f N Φ. Its turns N were fixed when it was wound. The speed sets f, so it moves the voltage too. The field current sets the flux Φ, so it moves only the voltage. Say a 4-pole set with nothing connected makes 440 V at 60 Hz. Slow it 5%, to 1710 rev/min. It makes 57 Hz and 418 V. Put the speed back and turn the field current down instead. The waves shrink, but they come just as often.'),
      read: 'Take a 4-pole set with nothing connected and the field unchanged. Slowed 5%, from 1800 to 1710 rev/min, its waves get both lower and less frequent: 57 Hz and 418 V. Turning the field current down shrinks the waves but leaves them at 60 Hz.',
      still: () => setStill() },
    { kind: 'pick', name: 'Back to 60 Hz', enter: { poles: 4, rpm: 1740 },
      pre: [{ at: 0, to: 3.8, spin: true }], preDur: 3.8,
      run: [{ at: 0, set: {}, reset: true }, { at: 0.2, to: 1.0, ramp: { rpm: [1740, 1800] } }, { at: 0, to: 3.8, spin: true }], rdur: 3.8,
      opts: ['Speeding up the engine', 'Raising the field current', 'Either one, since both change the waves'],
      want: 'Speeding up the engine',
      task: 'A set running alone on its board reads 58 Hz. What brings it back to 60 Hz?',
      hint: 'Speed moves both. The field current moves the voltage only.',
      hints: { 'Raising the field current': 'The field current changes the flux, and so the height of the waves. Only poles passing more often raises the frequency.',
        'Either one, since both change the waves': 'Speed moves both. The field current moves the voltage only.' },
      why: 'Frequency = pole pairs × rev/min ÷ 60. The field is nowhere in that rule. So only the speed changes the frequency. Speeding up raises the voltage a little too. The field current can then trim that back.',
      read: 'A set running alone on its board reads 58 Hz. What brings it back to 60 Hz?' },
    { kind: 'typed', name: 'A slow 6-pole set', ans: 'v6', enter: { poles: 6, rpm: 1080 }, blank: true, hide: ['pp', 'f', 'V'],
      run: [{ at: 0, to: 2.5, spin: true }], rdur: 2.5,
      answer: 396, decimals: 0, unit: 'V', want: '396' + NB + 'V',
      slips: [{ value: 440, hint: 'The field is unchanged, but the poles now pass less often. So the flux changes more slowly.' },
        { value: 489, hint: 'That ratio is upside down. A lower frequency gives a lower voltage.' },
        { value: 792, hint: '6 poles are 3 pole pairs, not 6.' }],
      task: 'A 6-pole set with nothing connected makes 440 V at 60 Hz. Its engine slows to 1080 rev/min. The field current stays the same. What voltage does it make now?',
      hint: 'Find the new frequency first. Then scale 440 V by it.',
      why: '6 poles are 3 pole pairs. So the frequency is 3 × 1080 ÷ 60 = 54 Hz. With the field unchanged, the voltage falls in step: 440 × 54 ÷ 60 = 396 V.',
      read: 'A 6-pole set with nothing connected makes 440 V at 60 Hz. Its engine slows to 1080 rev/min. The field current stays the same. What voltage does it make now?' },
    { kind: 'typed', name: 'Speed for 50 Hz', ans: 'n50', enter: { poles: 6, rpm: 1000 }, blank: true, hide: ['pp', 'rpm', 'f', 'V'],
      run: [{ at: 0, to: 2.5, spin: true }], rdur: 2.5,
      answer: 1000, decimals: 0, unit: 'rev/min', want: '1000' + NB + 'rev/min',
      slips: [{ value: 500, hint: 'That counts 6 pole pairs. 6 poles are 3 pairs.' },
        { value: 2000, hint: 'The form with 120 counts poles, so 6 goes in, not 3.' }],
      task: 'What speed must a 6-pole alternator turn at to make 50 Hz?',
      hint: 'Turn the rule round: rev/min = frequency × 60 ÷ pole pairs.',
      why: '6 poles are 3 pole pairs. So rev/min = 50 × 60 ÷ 3 = 1000. As a check, 3 × 1000 ÷ 60 = 50 Hz.',
      close: 'Speed sets the frequency. The field current sets the voltage. Next comes the regulator that trims the field.',
      read: 'What speed must a 6-pole alternator turn at to make 50 Hz?' },
  ];
  const FINISH = 'A turning field makes the three phases. Each pole pair that sweeps past a coil makes one cycle. So frequency = pole pairs × rev/min ÷ 60. Speed sets the frequency. The field current sets the voltage. Next comes the regulator that trims the field.';

  // ================= state =================
  const BASE = { poles: 2, rpm: 3600, field: 100, bc: 1 };   // bc: coils B and C in use (0 to 1 while they arrive)
  const X = Object.assign({}, BASE);
  // The machine as it runs: rotor angle, and a triggered sweep of the three coils' voltages over 60 ms of real time.
  const sim = { a: 180, buf: new Array(NS).fill(null), pen: 0, sw: 0, armed: false, armT: 0, prevA: 0, e: [0, 0, 0], still: 1, sweepCg: 0, fresh: false };
  let cg = 0;                                     // counts setting changes, so a fresh sweep is known
  const D = { g: [0, 0, 0], pk: 0 };              // drawn glows and the peak bracket, easing to the rule's
  const blank = () => ({ pick: null, res: null, why: false, tries: 0, hint: '' });
  let S = STEPS.map(blank);
  const solved = (st) => !!st && (st.res === 'right' || st.res === 'shown');
  let T = Infinity, motionEnd = 0, scripted = false, lastStep = -1, finished = false, lastDone = false, playing = false, liveSpin = false;
  let REC = { t: {} };
  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const testing = () => document.documentElement.classList.contains('k-testing');
  const quiet = () => REDUCE || testing();
  const el = (id) => document.getElementById(id);
  const idx = (name) => STEPS.findIndex((d) => d.name === name);
  const hideTrace = (i) => !finished && !!STEPS[i].blank && !solved(S[i]);
  function hiddenSet(i) {
    const d = STEPS[i], on = !finished && !!d.hide && !solved(S[i]), h = {};
    ['pp', 'rpm', 'f', 'V'].forEach((k) => { h[k] = on && d.hide.indexOf(k) >= 0; });
    return h;
  }

  // ================= the machine running =================
  const volts = () => voltsOf(X.poles, X.rpm, X.field);
  function startSweep(e) {
    sim.armed = false; sim.sw = 0; sim.sweepCg = cg; sim.fresh = false;
    if (e) { sim.buf[0] = e; sim.pen = 1; } else sim.pen = 0;
    for (let j = sim.pen; j < Math.min(NS, sim.pen + GAP); j++) sim.buf[j] = null;
  }
  function resetSim(a) { sim.a = a; sim.buf = new Array(NS).fill(null); sim.prevA = 0; sim.e = [0, 0, 0]; sim.still = 1; startSweep(null); }
  // One sample: the pen writes it; at the sweep's end it waits for coil A's wave to rise through zero again.
  function record(e, h) {
    if (sim.armed) {
      sim.armT += h;
      if ((sim.prevA < 0 && e[0] >= 0) || sim.armT >= AUTO) startSweep(e);
    } else {
      sim.sw += h;
      const s = Math.min(NS - 1, Math.round(sim.sw / DTMS));
      for (let j = sim.pen; j <= s; j++) sim.buf[j] = e;
      for (let j = s + 1; j <= Math.min(NS - 1, s + GAP); j++) sim.buf[j] = null;
      sim.pen = Math.max(sim.pen, s + 1);
      if (sim.sw >= WIN - 1e-9) { sim.armed = true; sim.armT = 0; if (sim.sweepCg === cg) sim.fresh = true; }
    }
    sim.prevA = e[0];
  }
  // Real time hMs passes while the rotor turns da degrees.
  function advance(hMs, da) {
    if (!(hMs > 0)) return;
    const n = Math.max(1, Math.ceil(hMs / DTMS - 1e-9)), dir = da > 0 ? 1 : da < 0 ? -1 : 0, V = volts();
    for (let k = 0; k < n; k++) {
      sim.a += da / n;
      sim.e = emfAt(X.poles, V, sim.a, dir);
      record(sim.e, hMs / n);
    }
    sim.a = mod360(sim.a);
    if (dir) sim.still = 0;
  }
  // Spinning: dts seconds on screen are dts ÷ 60 seconds of the machine's time.
  function spin(dts) { const ms = dts * 1000 / SLOW; advance(ms, X.rpm / 60 * 360 * ms / 1000); }
  // A drag: the rotor turns da degrees, taking the time it would take at the set speed.
  function turn(da) { if (!(X.rpm > 0) || !da) return; advance(Math.abs(da) / 360 * turnMs(X.rpm), da); }
  function playScript(sc, t0, t1) {
    if (!sc) return;
    sc.forEach((m) => {

        g.appendChild(K.svg('circle', { class: 'dot', cx: r1(xa), cy: r1(yP), r: 3 }));
        g.appendChild(K.svg('circle', { class: 'dot', cx: r1(xb), cy: r1(yP), r: 3 }));
        g.appendChild(K.svg('text', { class: 'lab', x: r1((xa + xb) / 2), y: r1(yP - 16), 'text-anchor': 'middle' }, lab));
        REC.t.gap = lab;
      }
      said = (vis.length === 3 ? 'Three traces, A, B and C, show each coil\'s voltage' : 'A trace shows coil A\'s voltage') + ' against time over 60 ms, with a dashed line at the height a 440 V wave reaches. ' +
        (!drawnN ? 'Nothing is drawn yet.' : mx === 0 ? 'The traces run flat at zero.' : vis.length === 3 ? 'The three waves have the same shape, each 120° behind the last.' : 'Coil A\'s wave rises and falls as the poles sweep past it.');
    }
    trSvg.setAttribute('aria-label', said);
  }

  // ================= one paint =================
  function readouts(i) {
    const h = hiddenSet(i), tx = {
      pp: h.pp ? '?' : String(X.poles / 2),
      rpm: h.rpm ? '?' : X.rpm + NB + 'rev/min',
      f: h.f ? '?' : fmtHz(freqOf(X.poles, X.rpm)) + NB + 'Hz',
      V: h.V ? '?' : Math.round(volts()) + NB + 'V' };
    Object.keys(RO).forEach((k) => { RO[k].set(tx[k]); });
    Object.assign(REC.t, tx);
  }
  function paint(i) {
    if (i == null) i = at();
    REC = { t: {} };
    drawAlt();
    drawTrace(i);
    readouts(i);
  }

  // ================= the page around the picture =================
  write(el('finish'), FINISH);
  const setLab = (b, s) => { if (b.el.textContent !== s) b.setLabel(s); };
  function layout(i) {
    const d = STEPS[i], st = S[i], sol = solved(st);
    el('stepbox').hidden = finished;
    el('done').hidden = !finished;
    el('count').textContent = 'Screen ' + (i + 1) + ' of ' + STEPS.length;
    const task = el('task');
    task.className = 'task' + (d.show ? ' show' : '');
    write(task, d.show ? d.text : d.task);
    SETS.forEach((id) => { el('c-' + id).hidden = !shownCtl(d, id); });
    altSvg.classList.toggle('nodrag', !shownCtl(d, 'turn'));
    playBtn.el.hidden = !(d.show && d.mode === 'spin') || finished;
    setLab(playBtn, playing ? 'Pause' : 'Play');
    againBtn.el.hidden = !(d.show && d.mode === 'drag') || finished || REDUCE;
    el('replay').hidden = playBtn.el.hidden && againBtn.el.hidden;
    const opts = d.kind === 'pick' ? d.opts : [];
    el('picks').hidden = !opts.length;
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      setLab(b, opts[k]);
      b.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });
    el('answers').hidden = d.kind !== 'typed';
    Object.keys(ANS).forEach((key) => { el('ans-' + key).hidden = d.ans !== key; });
    el('acts').hidden = !!d.show;
    checkBtn.el.hidden = sol;
    const fb = el('fb');
    fb.hidden = !!d.show;
    fb.className = 'fb' + (st.res === 'right' ? ' right' : '');
    let say = '';
    if (!d.show) {
      if (st.res === 'right') say = 'That\'s it.';
      else if (st.res === 'shown') say = 'Here is the working.';
      else if (st.res === 'wrong') say = d.kind === 'typed' ? st.hint : (d.hints && d.hints[st.pick]) || d.hint;
      else if (st.res === 'empty' && d.kind === 'pick') say = 'Pick one of the answers first.';
    }
    write(fb, say);
    const why = el('why');
    why.hidden = d.show || !st.why;
    write(why, d.show ? '' : d.why);
    setLab(whyBtn, st.why ? 'Hide why' : 'Why?');
    const cl = el('closing');
    cl.hidden = !(d.close && sol);
    write(cl, d.close || '');
    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !sol);
    setLab(nextBtn, i === STEPS.length - 1 ? 'Finish' : 'Continue');
    el('nav').hidden = backBtn.el.hidden && nextBtn.el.hidden;
  }

  K.update((p) => {
    const i = at(), d = STEPS[i];
    if (i !== lastStep) { lastStep = i; enterStep(i); }
    else {
      SETS.forEach((id) => {
        if (p[id] === pushed[id]) return;
        if (shownCtl(d, id)) { endDemo(); X[id] = p[id]; pushed[id] = p[id]; onSetting(id); }
        else CTL[id].set(pushed[id], true);      // a control this screen does not use stays put
      });
      if (p.turn !== pushed.turn) {
        if (shownCtl(d, 'turn') && X.rpm > 0) { endDemo(); const da = wrap(p.turn - pushed.turn); pushed.turn = p.turn; turn(da); }
        else CTL.turn.set(pushed.turn, true);
      }
      push();
    }
    if (finished !== lastDone) { lastDone = finished; enter(finished ? 'done' : 'stepbox'); }
    if (quiet()) snapD(i);
    layout(i);
    paint(i);
    kick();
  });

  // ================= known answers, worked out by hand =================
  const solvedSt = (i) => Object.assign(blank(), STEPS[i].kind === 'pick' ? { pick: STEPS[i].want, res: 'right' } : { res: 'right' });
  // A screen in the state given (finished), with optional settings and a step after: what it drew.
  function drawn(i, st, x, more) {
    const keep = { X: Object.assign({}, X), sim: Object.assign({}, sim, { buf: sim.buf.slice(), e: sim.e.slice() }), g: D.g.slice(), pk: D.pk,
      S: S[i], T, sc: scripted, pl: playing, ls: liveSpin, cg };
    S[i] = st || blank(); T = Infinity; scripted = false; playing = false; liveSpin = false;
    try {
      prep(i, solved(S[i]), true);
      if (x) Object.assign(X, x);
      if (more) more();
      snapD(i);
      paint(i);
      return REC;
    } finally {
      Object.assign(X, keep.X); Object.assign(sim, keep.sim); D.g = keep.g; D.pk = keep.pk; S[i] = keep.S;
      T = keep.T; scripted = keep.sc; playing = keep.pl; liveSpin = keep.ls; cg = keep.cg;
      paint();
    }
  }
  const iTurn = idx('One turn, one cycle'), iPark = idx('A parked pole'), iThree = idx('Three coils, three phases'), iLag = idx('B behind A');
  const iPairs = idx('Two pole pairs'), iCyc = idx('Cycles in a turn'), iFreq = idx('Speed sets frequency'), iF4 = idx('A 4-pole set');
  const iField = idx('Speed or field'), iBack = idx('Back to 60 Hz'), iV6 = idx('A slow 6-pole set'), iN50 = idx('Speed for 50 Hz');
  const HZ = (s) => s + NB + 'Hz', V_ = (s) => s + NB + 'V', RPM = (s) => s + NB + 'rev/min';

  K.check('To make 60 Hz, a two-pole machine\'s rotor must turn at 3600 rpm', () => {
    const t = drawn(iFreq, null, { poles: 2, rpm: 3600 }).t;
    return freqOf(2, 3600) === 60 && t.f === HZ('60') && t.pp === '1' && t.rpm === RPM('3600');
  }, { source: SRC_60 });
  K.check('The voltage induced in any one of the three phases is displaced by 120° from the other two', () => {
    const lag = [2, 4, 6].every((poles) => [0, 23, 57, 90, 141, 200, 333].every((a) => {
      const sh = 120 / (poles / 2), e = emfAt(poles, 440, a, 1), b = emfAt(poles, 440, a - sh, 1), c = emfAt(poles, 440, a - 2 * sh, 1);
      return Math.abs(e[1] - b[0]) < 1e-9 && Math.abs(e[2] - c[0]) < 1e-9;
    }));
    const r = drawn(iThree);
    return lag && r.vis === 3 && r.mk.every((m) => m > 400);
  }, { source: SRC_120 });
  K.check('Turning the rotor gives a rotating magnetic field, which induces a 3-phase voltage in the stator winding', () => {
    const r = drawn(iThree);
    return r.mk.every((m) => m > 400) && r.drawnN > 150;
  }, { source: SRC_ROT });
  K.check('One turn of a 2-, 4- or 6-pole rotor draws 1, 2 or 3 cycles on coil A: one for each pole pair', () => {
    const a = drawn(iTurn), b = drawn(iPairs), c = drawn(iCyc, solvedSt(iCyc));
    return a.cycles === 1 && b.cycles === 2 && c.cycles === 3 && a.t.turn === 'one turn: 1 cycle' && b.t.turn === 'one turn: 2 cycles' &&
      c.t.turn === 'one turn: 3 cycles' && c.t.pp === '3' && c.t.f === HZ('60');
  });
  K.check('With the rotor parked, or the field current at 0, every trace runs flat', () => {
    const park = drawn(iPark, solvedSt(iPark)), zero = drawn(iFreq, null, { field: 0 }, sweepNow);
    return park.mx === 0 && park.drawnN > 100 && park.t.f === HZ('0') && park.t.V === V_('0') && zero.mx === 0 && zero.drawnN === NS && zero.t.V === V_('0') && zero.t.f === HZ('60');
  });
  K.check('4 poles at 1800 rev/min on full field read 2 pole pairs, 60 Hz and 440 V; at 1710 rev/min, 57 Hz and 418 V; at half field, 60 Hz and 220 V', () => {
    const a = drawn(iFreq).t, b = drawn(iField).t, c = drawn(iField, null, { rpm: 1800, field: 50 }).t;
    return a.pp === '2' && a.rpm === RPM('1800') && a.f === HZ('60') && a.V === V_('440') && b.rpm === RPM('1710') && b.f === HZ('57') && b.V === V_('418') &&
      c.f === HZ('60') && c.V === V_('220');
  });
  K.check('A right Check on the 58 Hz puzzle slides the speed from 1740 to 1800 rev/min: from 58 Hz and 425 V to 60 Hz and 440 V', () => {
    const a = drawn(iBack).t, b = drawn(iBack, solvedSt(iBack)).t;
    return a.rpm === RPM('1740') && a.f === HZ('58') && a.V === V_('425') && b.rpm === RPM('1800') && b.f === HZ('60') && b.V === V_('440');
  });
  K.check('On a 2-pole rotor at 3000 rev/min, coil B\'s wave peaks 20 ÷ 3 = 6.67 ms after coil A\'s, marked once checked', () => {
    const a = drawn(iLag), b = drawn(iLag, solvedSt(iLag));
    return a.q === true && !a.t.gap && b.t.gap === '6.67' + NB + 'ms' && b.t.f === HZ('50') && b.q === false;
  });
  K.check('Before a Check the answer stays hidden; after it the readouts show 60 Hz, then 54 Hz and 396 V, then 1000 rev/min at 50 Hz', () => {
    const f0 = drawn(iF4), f1 = drawn(iF4, solvedSt(iF4)).t, v0 = drawn(iV6), v1 = drawn(iV6, solvedSt(iV6)).t, n0 = drawn(iN50), n1 = drawn(iN50, solvedSt(iN50)).t;
    return f0.q && f0.t.f === '?' && f0.t.V === '?' && f1.f === HZ('60') && f1.V === V_('440') && v0.q && v0.t.V === '?' && v0.t.pp === '?' && v1.f === HZ('54') && v1.V === V_('396') &&
      n0.q && n0.t.rpm === '?' && n0.t.f === '?' && n1.rpm === RPM('1000') && n1.f === HZ('50') && n1.pp === '3';
  });
  K.check('Each typed answer and slip is worked from its rule: 6.67 ms (20, 13.33, 3.33), 3 cycles (6, 1), 60 Hz (120, 30), 396 V (440, 489, 792) and 1000 rev/min (500, 2000)', () => {
    const sl = (i, v) => STEPS[i].slips.length === v.length && STEPS[i].slips.every((s, k) => Math.abs(s.value - v[k]) < 1e-12);
    const R = Math.round;
    const work = r2(turnMs(3000) / 3) === 6.67 && turnMs(3000) === 20 && r2(turnMs(3000) * 2 / 3) === 13.33 && r2(turnMs(3000) / 6) === 3.33 &&
      6 / 2 === 3 && freqOf(4, 1800) === 60 && 4 * 1800 / 60 === 120 && 2 * 1800 / 120 === 30 &&
      freqOf(6, 1080) === 54 && R(voltsOf(6, 1080, 100)) === 396 && R(440 * 60 / 54) === 489 && R(440 * (6 * 1080 / 60) / 60) === 792 &&
      50 * 60 / 3 === 1000 && 50 * 60 / 6 === 500 && 50 * 120 / 3 === 2000 && freqOf(6, 1000) === 50;
    return work && STEPS[iLag].answer === 6.67 && STEPS[iCyc].answer === 3 && STEPS[iF4].answer === 60 && STEPS[iV6].answer === 396 && STEPS[iN50].answer === 1000 &&
      sl(iLag, [20, 13.33, 3.33]) && sl(iCyc, [6, 1]) && sl(iF4, [120, 30]) && sl(iV6, [440, 489, 792]) && sl(iN50, [500, 2000]) &&
      STEPS[iPark].want === STEPS[iPark].opts[0] && STEPS[iBack].want === STEPS[iBack].opts[0];
  });
  K.check('At 1800 rev/min one turn takes 2 s on screen; every demonstration ends 3 to 4.5 s after its screen opens, and every answer\'s motion within 4 s', () =>
    Math.abs(turnMs(1800) * SLOW / 1000 - 2) < 1e-9 && STEPS.every((d) => (d.show ? d.dur >= 3 && d.dur <= 4.5 : !d.run || d.rdur <= 4)));
  K.ready();
</script>
