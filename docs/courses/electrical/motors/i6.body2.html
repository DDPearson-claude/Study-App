  .fig .emfh { fill: var(--k-accent); }

  .fig .dl { stroke: var(--k-warn); stroke-width: 1.5; stroke-dasharray: 5 4; }

  .fig .tq { fill: none; stroke: var(--k-accent); stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }

  .fig .dotS { fill: var(--k-accent2); stroke: var(--k-panel); stroke-width: 2; }

  .fig .dotT { fill: var(--k-accent); stroke: var(--k-panel); stroke-width: 1.5; }

  .fig .hdl { fill: var(--k-strong); }
  .fig .lock { fill: var(--k-warn); }
  .fig .shk { fill: none; stroke: var(--k-strong); stroke-width: 3; }

  .fig .term { fill: var(--k-bg); stroke: var(--k-ink); stroke-width: 1.6; }
  .picks { display: flex; flex-direction: column; gap: 10px; }
  .picks .k-btn { width: 100%; min-height: 56px; height: auto; font-size: 1.02rem; line-height: 1.35; white-space: normal; text-align: left; padding: 10px 14px; }
  .picks .k-btn.is-right { border-color: var(--k-good); color: var(--k-good); box-shadow: inset 0 0 0 1px var(--k-good); }
  .picks .k-btn.is-wrong { border-color: var(--k-warn); color: var(--k-warn); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }

  .fb.bad { box-shadow: inset 4px 0 0 var(--k-warn); }
  .fb > * + * { margin-top: 6px; }
  .fb .v { font-weight: 700; font-size: 1.05rem; }
  .fb.ok .v { color: var(--k-good); }
  .fb .ans { font-weight: 700; }
  #stepbox.enter { animation: screen-in .35s ease-out both; }
  .fb { animation: fade-in .25s ease-out both; }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes screen-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  html.k-testing .fb, html.k-testing #stepbox.enter { animation: none; }
  @media (prefers-reduced-motion: reduce) { #stepbox.enter, .fb { animation: none; } }

<script>
  const el = (id) => document.getElementById(id);
  const DEG = Math.PI / 180;
  const REDUCE = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  const PEG8 = 'https://ecampusontario.pressbooks.pub/electrotechnology/chapter/part-8-dc-motor-starters';
  const RH = 'https://www.rose-hulman.edu/class/ee/HTML/NSF/CCLI_EMD_DUE_0088904/PDFS/lecture_notes_25.pdf';
  const AAST = 'https://aast.edu/pheed/staffadminview/pdf_retreive.php?stafftype=staffcourses&url=45_24985_EE328_2016_1__2_1_Lecture3.pdf';

  // ---------- the rule ----------
  // An ideal series motor, per unit: no saturation, no resistance, no friction. 1.00 is full load.
  // Field = current. Torque = field × current = current². Speed = 1 ÷ field = 1 ÷ current,
  // because the back-emf goes with field × speed and stays equal to the supply.
  const IMIN = 0.25, IMAX = 1, DANGER = 3;   // the red line at 3.00 is an example, not a maker's limit
  const rule = (I) => ({ field: I, torque: I * I, speed: 1 / I });
  const VS = 260, RA = 0.4;                  // the starting case: 260 V across a 0.4 Ω armature
  const REV = 0.2;                           // the drawing turns 0.2 times a second per unit of speed: slowed right down

  const two = (v) => (Math.round(v * 100 + 1e-9) / 100).toFixed(2);
  const whole = (v) => String(Math.round(v + 1e-9));
  const N = { full: two(1), tHalf: two(rule(0.5).torque), sHalf: two(rule(0.5).speed), tQtr: two(rule(0.25).torque), sQtr: two(rule(0.25).speed),
    line: two(DANGER), cross: two(1 / DANGER), start: whole(VS / RA) };
  const workLine = (I) => { const r = rule(I); return 'At ' + two(I) + ': field ' + two(r.field) + ', torque ' + two(I) + ' × ' + two(I) + ' = ' + two(r.torque) + ', speed 1 ÷ ' + two(I) + ' = ' + two(r.speed) + '.'; };
  const WORK = [workLine(1), workLine(0.5), workLine(0.25), 'The speed crosses the red line near ' + N.cross + ', a third of full-load current.'];

  // ---------- the lesson's words ----------
  const blk = (t, s) => ({ t: t, s: s });
  const HOW = [
    blk('p', 'The field winding is in series with the armature. So one current flows through both. The field is a few turns of thick wire. It has to carry that full current.'),
    blk('p', 'A turning armature is a generator too. It makes a *back-emf* that opposes the supply. A stronger field or a faster spin makes more of it.'),
    blk('p', 'At standstill there is none, so the starting current is large. More current means a stronger field and much more torque.'),
  ];
  const PLAY_TASK = 'Drag the load current down and watch the field, the torque and the speed.';
  const PRE = 'Assume an ideal series motor, with no saturation and no resistance. ' + N.full + ' is full load. The field grows with the current. So torque goes with current squared. ' +
    'A weaker field must spin faster to make the same back-emf. So speed goes with one over the current. The red line at ' + N.line + ' is an example, not a maker\'s limit.';
  const PLAY_READ = 'At full load the field, torque and speed all read ' + N.full + '. At half the current the field halves. The torque falls to a quarter, ' + N.tHalf + '. ' +
    'The speed doubles to ' + N.sHalf + '. At a quarter of the current the torque is only ' + N.tQtr + ' and the speed is ' + N.sQtr + ', deep in the red. ' +
    'The speed crosses the example danger line near a third of full-load current.';
  const BEHAVE = [
    blk('row', 'Starting torque: Very high. Torque goes with current squared until the iron saturates. After that, it goes with current alone.'),
    blk('row', 'Speed: Poor regulation. It changes a lot with load. With no load it climbs dangerously.'),
    blk('row', 'Starting current: At standstill only the resistance limits it. A ' + VS + ' V motor with a ' + RA + ' Ω armature would take ' + N.start + ' A, about twelve times full load. So it starts through a starting resistance.'),
    blk('row', 'Reversing: Swap the field leads or the armature leads, not both. Swapping the supply leads leaves it turning the same way.'),
  ];
  const USE = [
    blk('row', 'Used for: Crane hoists, lifts and large excavators, where big starting torque matters. Also traction, such as railway locomotives.'),
    blk('row', 'At sea: In 1907 the US Navy used series motors on boat cranes, for their starting torque.'),
    blk('row', 'Coupling: Couple it directly or through gears. Then the load is far less likely to come off. Never use a belt, which can break.'),
    blk('row', 'Protection: It must have overspeed protection. Its starter has a no-load release that lets go if the current falls.'),
  ];
  const FAULTS = [
    blk('safe', 'Safety first: Isolate, lock off and prove dead before you touch the motor or its starter.'),
    blk('row', 'It races: The load came off. Find out why, and check the overspeed trip.'),
    blk('row', 'Sparking: Worn brushes or a pitted commutator. Poor contact makes them spark.'),
    blk('row', 'Will not start: Look for an open field, a lead to earth, or poor brush contact.'),
    blk('row', 'Tests: Megger the windings to frame. Measure the armature and field resistance.'),
  ];
  const words = (list) => list.map((b) => b.s.replace(/\*/g, '')).join('\n\n');
  const C1 = 'It slows and stops: it has nothing to drive', C2 = 'It speeds up a little, then holds a steady speed', C3 = 'Its speed climbs and keeps climbing';
  const F1 = 'The field winding has gone open circuit', F2 = 'The belt drive: it let the load come off', F3 = 'The brushes are worn';

  // ---------- the lesson: SHOW steps teach, DO steps ask ----------
  const STEPS = [
    { show: true, name: 'How it works', label: 'How it works', blocks: HOW, text: words(HOW) },
    { show: true, name: 'One current: field, torque, speed', label: 'One current: field, torque, speed', text: PLAY_TASK + '\n\n' + PRE, read: PLAY_READ, still: () => stillAt(0.25) },
    { name: 'Check', label: 'Check on the cause',
      task: 'A hoist is lifting on a DC series motor. The coupling shears and the load comes off. What does the motor do?',
      opts: [C1, C2, C3], want: C3,
      why: 'With no load it speeds up, and the current falls. Less current means a weaker field. A weaker field must spin faster to make the same back-emf. So it speeds up again, and keeps climbing. That is *runaway*. It is why the motor must have overspeed protection.',
      slips: ['It still has its supply. With no load the current falls and the field weakens. A weaker field means more speed, not less.',
        'That is how an induction motor behaves, held just under synchronous speed. A series motor has no such speed. Its field weakens with the current, so it keeps speeding up.', ''] },
    { show: true, name: 'How it behaves', label: 'How it behaves', blocks: BEHAVE, text: words(BEHAVE) },
    { show: true, name: 'Where it is used', label: 'Where it is used, and its limits', blocks: USE, text: words(USE) },
    { show: true, name: 'Faults and tests', label: 'Faults and tests', blocks: FAULTS, text: words(FAULTS) },
    { name: 'Find the fault', label: 'Find the fault',
      task: 'A DC series motor drives a ventilation fan through a belt. The belt snaps, and the motor races until its overspeed trip stops it. What is the fault?',
      opts: [F1, F2, F3], want: F2,
      why: 'With the belt gone there was no load. The current fell, the field weakened and the speed climbed. The fix is a direct or geared drive, not a new belt.',
      slips: ['In a series motor the field carries the armature current. Open it and no current flows, so the motor stops. It cannot race.', '',
        'Worn brushes cause sparking and poor contact. They make a motor weak or slow to start, not race.'] },
    { kind: 'summary', name: 'Keep this', label: 'Keep this' },
  ];
  const iHow = 0, iPic = 1, iChk = 2, iBeh = 3, iUse = 4, iFlt = 5, iFind = 6, iK = 7;
  const S = STEPS.map(() => ({ res: null, pick: null, fb: null }));
  let lastStep = -1, finished = false;

  // Text with key terms (*term*) highlighted in amber (the <mark> element), built with K.el, never innerHTML.
  function addText(node, s) {
    String(s || '').split(/(\*[^*]+\*)/).forEach((b) => {
      if (!b) return;
      if (b.length > 2 && b.charAt(0) === '*' && b.charAt(b.length - 1) === '*') node.appendChild(K.el('mark', null, b.slice(1, -1)));
      else node.appendChild(document.createTextNode(b));
    });
    return node;
  }
  function write(node, s) { node.textContent = ''; return addText(node, s); }
  function blocks(node, list) {
    node.textContent = '';
    list.forEach((b, k) => {
      if (k) node.appendChild(document.createTextNode(' '));
      let e;
      if (b.t === 'row' || b.t === 'safe') {
        const cut = b.s.indexOf(': ');
        e = K.el('p', { class: b.t === 'safe' ? 'warn-note' : 'card' }, K.el('b', null, b.s.slice(0, cut + 1)), ' ');
        addText(e, b.s.slice(cut + 2));
      } else e = addText(K.el('p'), b.s);
      node.appendChild(e);
    });
  }

  // ---------- drawing helpers ----------
  function ad(g, tag, attrs, text) { const n = K.svg(tag, attrs); if (text != null) n.textContent = text; g.appendChild(n); return n; }
  function txt(g, x, y, s, cls, anchor) { return ad(g, 'text', { x: x, y: y, class: cls || 'lb', 'text-anchor': anchor || 'start' }, s); }
  const f1 = (v) => (+v).toFixed(1);
  const humps = (x, y, n) => { let d = 'M' + x + ' ' + y; for (let j = 0; j < n; j++) d += 'a6 6 0 0 1 12 0'; return d; };
  function arrow(g, x1, y1, x2, y2, lc, hc) {
    const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L, bx = x2 - 9 * ux, by = y2 - 9 * uy;
    ad(g, 'line', { x1: x1, y1: y1, x2: f1(bx), y2: f1(by), class: lc });
    ad(g, 'polygon', { points: [x2, y2, bx - 5 * uy, by + 5 * ux, bx + 5 * uy, by - 5 * ux].map(f1).join(' '), class: hc });
  }
  // A spur gear: n teeth on a pitch circle of radius r, each tooth h above and below it. Tooth 0 points along +x.
  function gearD(n, r, h) {
    const P = 2 * Math.PI * r / n, rt = r + h, rr = r - h, a1 = 0.15 * P / rt, a0 = 0.3 * P / rr;
    let d = '';
    for (let k = 0; k < n; k++) {
      const c = 2 * Math.PI * k / n;
      [[rr, c - a0], [rt, c - a1], [rt, c + a1], [rr, c + a0]].forEach((q) => { d += (d ? 'L' : 'M') + f1(q[0] * Math.cos(q[1])) + ' ' + f1(q[0] * Math.sin(q[1])); });
    }
    return d + 'Z';
  }
  // The armature end-on: its body and eight slots (the slots group turns).
  function armature(g, cx, cy, r) {
    ad(g, 'circle', { cx: cx, cy: cy, r: r, class: 'arm' });
    const sl = ad(g, 'g', { transform: 'translate(' + cx + ' ' + cy + ')' });
    for (let j = 0; j < 8; j++) ad(sl, 'rect', { x: -2, y: -(r - 2), width: 4, height: 6, rx: 1, class: 'slot', transform: 'rotate(' + (j * 45) + ')' });
    return sl;
  }

  // How it works: the supply, the series field and the armature in one loop.
  function buildHw(g) {
    ad(g, 'path', { d: 'M30 40V100M30 112V184H236V148M30 40H74M134 40H236V76', class: 'w' });
    ad(g, 'path', { d: 'M16 100H44', class: 'plt' });
    ad(g, 'path', { d: 'M23 112H37', class: 'plt2' });
    txt(g, 42, 140, 'DC supply');
    ad(g, 'path', { d: humps(74, 40, 5), class: 'coilF' });
    txt(g, 104, 20, 'series field', 'lb', 'middle');
    txt(g, 44, 64, 'a few turns of thick wire');
    ad(g, 'polygon', { points: '196 40 186 35 186 45', class: 'ia' });
    ad(g, 'polygon', { points: '134 184 144 179 144 189', class: 'ia' });
    txt(g, 132, 206, 'the same current through both', 'lb', 'middle');
    armature(g, 236, 112, 28);
    ad(g, 'rect', { x: 230, y: 76, width: 12, height: 8, rx: 1.5, class: 'brush' });
    ad(g, 'rect', { x: 230, y: 140, width: 12, height: 8, rx: 1.5, class: 'brush' });
    txt(g, 200, 116, 'armature', 'lb', 'end');
    const pol = (a, r) => [236 + r * Math.cos(a * DEG), 112 + r * Math.sin(a * DEG)];
    ad(g, 'path', { d: 'M' + pol(-30, 38).map(f1).join(' ') + 'A38 38 0 0 1 ' + pol(30, 38).map(f1).join(' '), class: 'turn' });
    ad(g, 'polygon', { points: pol(42, 38).concat(pol(30, 32.5), pol(30, 43.5)).map(f1).join(' '), class: 'ia' });
    txt(g, 262, 166, 'turning');
    arrow(g, 300, 144, 300, 88, 'emf', 'emfh');
    txt(g, 300, 76, 'back-emf', 'lb', 'middle');
    g.setAttribute('aria-label', 'One loop: a DC supply, then the series field, drawn as a few turns of thick wire, then the armature between its two brushes. ' +
      'Arrows on the wires show the same current through both. A curved arrow shows the armature turning. Beside it, an arrow labelled back-emf points against the current the supply drives through it.');
  }

  // The plot: torque and speed, per unit, against load current, from the rule.
  const PX = (I) => 52 + (I - IMIN) * 360, PY = (v) => 200 - 40 * v;
  function curve(fn) { let d = ''; for (let k = 0; k <= 75; k++) { const I = IMIN + k * 0.01; d += (d ? 'L' : 'M') + f1(PX(I)) + ' ' + f1(PY(fn(I))); } return d; }
  function buildPlot(g) {
    [1, 2, 3, 4].forEach((v) => ad(g, 'line', { x1: 52, y1: PY(v), x2: 322, y2: PY(v), class: 'grid' }));
    ad(g, 'rect', { x: 52, y: PY(4), width: 270, height: PY(DANGER) - PY(4), class: 'band' });
    ad(g, 'line', { x1: 52, y1: PY(DANGER), x2: 322, y2: PY(DANGER), class: 'dl' });
    txt(g, 318, PY(DANGER) - 12, 'example danger line, not a maker\'s', 'wt', 'end');
    ad(g, 'path', { d: 'M52 36V200H322', class: 'ax' });
    [0, 1, 2, 3, 4].forEach((v) => txt(g, 44, PY(v) + 4.5, v ? two(v) : '0', 'lb', 'end'));
    [0.25, 0.5, 0.75, 1].forEach((I) => { ad(g, 'line', { x1: PX(I), y1: 200, x2: PX(I), y2: 205, class: 'ax' }); txt(g, PX(I), 220, two(I), 'lb', 'middle'); });
    txt(g, 4, 16, 'Torque and speed, per unit', 'hd');
    txt(g, 187, 242, 'Load current, per unit', 'hd', 'middle');
    ad(g, 'path', { d: curve((I) => rule(I).speed), class: 'sp' });
    ad(g, 'path', { d: curve((I) => rule(I).torque), class: 'tq' });
    txt(g, f1(PX(0.56) + 6), f1(PY(rule(0.56).speed) - 12), 'speed');
    txt(g, f1(PX(0.42)), f1(PY(rule(0.42).torque) - 18), 'torque');   // above the torque curve, where no guide line crosses it
  }

  // How it behaves: the same two curves, no slider.
  function buildBeh(g) {
    buildPlot(g);
    txt(g, 336, 262, 'sketch from the ideal rule', 'mu', 'end');
    g.setAttribute('aria-label', 'A sketch from the ideal rule: torque and speed, per unit, against load current from ' + two(IMIN) + ' to ' + two(IMAX) + '. ' +
      'Torque rises as the current squared. Speed falls as one over the current, climbing into a red band above ' + N.line + ' at light load.');
  }

  // Where it is used: the motor end-on, a pinion on its shaft driving the drum's gear, a load on the rope.
  function buildUse(g) {
    ad(g, 'rect', { x: 20, y: 26, width: 96, height: 96, rx: 16, class: 'body' });
    ad(g, 'rect', { x: 28, y: 122, width: 80, height: 8, rx: 2, class: 'body' });
    ad(g, 'path', { d: gearD(24, 36, 3.5), class: 'gear', transform: 'translate(116 74) rotate(7.5)' });
    ad(g, 'path', { d: gearD(8, 12, 3.5), class: 'gear', transform: 'translate(68 74)' });
    ad(g, 'circle', { cx: 68, cy: 74, r: 3, class: 'hub' });
    ad(g, 'circle', { cx: 116, cy: 74, r: 20, class: 'drum' });
    ad(g, 'circle', { cx: 116, cy: 74, r: 3, class: 'hub' });
    ad(g, 'line', { x1: 136, y1: 74, x2: 136, y2: 128, class: 'rope' });
    ad(g, 'rect', { x: 124, y: 128, width: 24, height: 20, rx: 2, class: 'body' });
    txt(g, 154, 143, 'load');
    txt(g, 68, 150, 'series motor', 'lb', 'middle');
    txt(g, 172, 30, 'geared, never belted', 'hd');
    ad(g, 'line', { x1: 168, y1: 58, x2: 153, y2: 62, class: 'ldr' });
    txt(g, 172, 62, 'gears');
    ad(g, 'line', { x1: 168, y1: 92, x2: 135, y2: 81, class: 'ldr' });
    txt(g, 172, 96, 'hoist drum');
    g.setAttribute('aria-label', 'Geared, never belted: the series motor end-on, with a small gear on its shaft meshing with a large gear on the hoist drum. A load hangs from the drum\'s rope.');
  }

  // Faults and tests: the isolator open, locked and tagged; a megger from the windings to the frame; the brushes on the commutator.
  function buildFlt(g) {
    txt(g, 56, 16, 'isolator: open', 'lb', 'middle');
    ad(g, 'rect', { x: 16, y: 24, width: 80, height: 60, rx: 6, class: 'body' });
    ad(g, 'path', { d: 'M0 44H30M0 68H30M30 44L54 32M30 68L54 56M66 44H112M66 68H112', class: 'w' });
    [[30, 44], [30, 68], [66, 44], [66, 68]].forEach((q) => ad(g, 'circle', { cx: q[0], cy: q[1], r: 3, class: 'jn' }));
    ad(g, 'rect', { x: 48, y: 84, width: 16, height: 8, rx: 2, class: 'hdl' });
    ad(g, 'path', { d: 'M51 104V98a5 5 0 0 1 10 0V104', class: 'shk' });
    ad(g, 'rect', { x: 49, y: 103, width: 14, height: 14, rx: 3, class: 'lock' });
    ad(g, 'path', { d: 'M63 110L72 115', class: 'w' });
    ad(g, 'polygon', { points: '74 112 92 112 92 134 70 134 70 116', class: 'tag' });
    ad(g, 'circle', { cx: 75, cy: 117, r: 1.6, class: 'jn' });
    txt(g, 98, 120, 'locked off');
    txt(g, 98, 136, 'and tagged');
    ad(g, 'rect', { x: 178, y: 22, width: 58, height: 36, rx: 6, class: 'body' });
    txt(g, 207, 45, 'megger', 'lb', 'middle');
    ad(g, 'rect', { x: 266, y: 52, width: 64, height: 56, rx: 10, class: 'body' });
    ad(g, 'rect', { x: 280, y: 40, width: 28, height: 12, rx: 2, class: 'term' });
    txt(g, 294, 32, 'windings', 'lb', 'middle');
    txt(g, 298, 86, 'frame', 'lb', 'middle');
    ad(g, 'path', { d: 'M236 30H252V46H280M236 50H246V80H266', class: 'w' });
    [[280, 46], [266, 80]].forEach((q) => ad(g, 'circle', { cx: q[0], cy: q[1], r: 2.6, class: 'jn' }));
    ad(g, 'circle', { cx: 262, cy: 152, r: 20, class: 'drum' });
    for (let j = 0; j < 8; j++) { const a = j * 45 * DEG; ad(g, 'line', { x1: f1(262 + 8 * Math.cos(a)), y1: f1(152 + 8 * Math.sin(a)), x2: f1(262 + 20 * Math.cos(a)), y2: f1(152 + 20 * Math.sin(a)), class: 'w' }); }
    ad(g, 'circle', { cx: 262, cy: 152, r: 8, class: 'drum' });
    ad(g, 'rect', { x: 232, y: 146, width: 10, height: 12, rx: 1.5, class: 'brush' });
    ad(g, 'rect', { x: 282, y: 146, width: 10, height: 12, rx: 1.5, class: 'brush' });
    ad(g, 'path', { d: 'M220 152H232M292 152H304', class: 'w' });
    txt(g, 237, 136, 'brushes', 'lb', 'middle');
    txt(g, 262, 190, 'commutator', 'lb', 'middle');
    g.setAttribute('aria-label', 'The isolator is open, locked off and tagged. A megger is connected from the motor\'s windings to its frame. ' +
      'Below, the two brushes press on the commutator.');
  }

  buildHw(el('hw'));
  buildBeh(el('beh'));
  buildUse(el('use'));
  buildFlt(el('flt'));

  // ---------- the live picture: the loop, the field bar, the gears and the drum ----------
  const AX = 176, AY = 104, GX = 216, GY = 104;   // pinion 8 teeth on the armature's shaft, gear 24 teeth on the drum's: one turn of the drum for three of the armature
  const M = {};
  (function () {
    const g = el('mot');
    ad(g, 'path', { d: 'M26 34V92M26 104V176H176V138M26 34H70M130 34H176V70', class: 'w' });
    ad(g, 'path', { d: 'M12 92H40', class: 'plt' });
    ad(g, 'path', { d: 'M19 104H33', class: 'plt2' });
    txt(g, 38, 136, 'DC supply');
    ad(g, 'path', { d: humps(70, 34, 5), class: 'coilF' });
    txt(g, 100, 14, 'series field', 'lb', 'middle');
    ad(g, 'rect', { x: 70, y: 46, width: 60, height: 10, rx: 2, class: 'barO' });
    M.bar = ad(g, 'rect', { x: 70, y: 46, width: 60, height: 10, rx: 2, class: 'barF' });
    txt(g, 136, 55, 'field');
    ad(g, 'polygon', { points: '162 34 152 29 152 39', class: 'ia' });
    ad(g, 'polygon', { points: '104 176 114 171 114 181', class: 'ia' });
    txt(g, 8, 198, 'the same current through both');
    M.slots = armature(g, AX, AY, 26);
    ad(g, 'rect', { x: 170, y: 70, width: 12, height: 8, rx: 1.5, class: 'brush' });
    ad(g, 'rect', { x: 170, y: 130, width: 12, height: 8, rx: 1.5, class: 'brush' });
    txt(g, 144, 108, 'armature', 'lb', 'end');
    M.gear = ad(g, 'path', { d: gearD(24, 30, 3), class: 'gear', transform: 'translate(' + GX + ' ' + GY + ') rotate(7.5)' });
    M.pin = ad(g, 'path', { d: gearD(8, 10, 3), class: 'gear', transform: 'translate(' + AX + ' ' + AY + ')' });
    ad(g, 'circle', { cx: AX, cy: AY, r: 2.5, class: 'hub' });
    ad(g, 'circle', { cx: GX, cy: GY, r: 15, class: 'drum' });
    M.spoke = ad(g, 'line', { x1: 0, y1: 0, x2: 0, y2: -12, class: 'w', transform: 'translate(' + GX + ' ' + GY + ')' });
    ad(g, 'circle', { cx: GX, cy: GY, r: 2.5, class: 'hub' });
    ad(g, 'line', { x1: GX + 15, y1: GY, x2: GX + 15, y2: 160, class: 'rope' });
    ad(g, 'rect', { x: GX + 3, y: 160, width: 24, height: 20, rx: 2, class: 'body' });
    txt(g, GX + 33, 175, 'load');
    ad(g, 'line', { x1: 251, y1: 72, x2: 238, y2: 82, class: 'ldr' });
    txt(g, 254, 76, 'gears');
    ad(g, 'line', { x1: 251, y1: 124, x2: 229, y2: 111, class: 'ldr' });
    txt(g, 254, 128, 'hoist drum');
    g.setAttribute('aria-label', 'The series motor\'s loop, small: a DC supply, the series field and the armature, the same current through both. ' +
      'A bar beside the field shows its strength. The armature turns, slowed right down, and drives the hoist drum through a pair of gears. A load hangs on the drum\'s rope.');
  })();
  (function () {
    const g = el('plot');
    buildPlot(g);
    M.guide = ad(g, 'line', { x1: 0, y1: 200, x2: 0, y2: 200, class: 'gd' });
    M.dS = ad(g, 'circle', { cx: 0, cy: 0, r: 7, class: 'dotS' });
    M.dT = ad(g, 'circle', { cx: 0, cy: 0, r: 4.5, class: 'dotT' });
    g.setAttribute('aria-label', 'Torque and speed, per unit, against load current from ' + two(IMIN) + ' to ' + two(IMAX) + '. Torque rises as the current squared. ' +
      'Speed falls as one over the current. A red band above ' + N.line + ' marks an example danger line, not a maker\'s. A dot on each curve marks the load current chosen.');
  })();

  const SPIN = { th: 0, s: 1 };
  function paintSpin() {
    const th = SPIN.th;
    M.slots.setAttribute('transform', 'translate(' + AX + ' ' + AY + ') rotate(' + f1(th) + ')');
    M.pin.setAttribute('transform', 'translate(' + AX + ' ' + AY + ') rotate(' + f1(th) + ')');
    M.gear.setAttribute('transform', 'translate(' + GX + ' ' + GY + ') rotate(' + f1(7.5 - th / 3) + ')');
    M.spoke.setAttribute('transform', 'translate(' + GX + ' ' + GY + ') rotate(' + f1(-th / 3) + ')');
  }

  // ---------- controls and readouts ----------
  const stepper = K.stepper({ id: 'step', label: 'Lesson', steps: STEPS.map((d) => d.name), value: 0, compact: true, into: '#prog' });
  const at = () => K.clamp(Math.round(stepper.get()) || 0, 0, STEPS.length - 1);
  const loadCtl = K.control({ id: 'load', label: 'Load current, per unit', hint: '1.00 is full-load current', min: IMIN, max: IMAX, step: 0.05, value: 1,
    fmt: (v) => two(v), snap: [0.25, 0.5, 1], into: '#ctl' });
  const loadOf = (p) => K.clamp(Math.round((+(p && p.load != null ? p.load : 1) || 1) * 20) / 20, IMIN, IMAX);
  const RD = {
    f: K.readout({ id: 'rdField', label: 'Field, per unit', fmt: (v) => two(v), into: '#outs' }),
    t: K.readout({ id: 'rdTorque', label: 'Torque, per unit', fmt: (v) => two(v), into: '#outs' }),
    s: K.readout({ id: 'rdSpeed', label: 'Speed, per unit', fmt: (v) => two(v), into: '#outs' }),
  };
  K.model((p) => { const r = rule(loadOf(p)); return { field: r.field, torque: r.torque, speed: r.speed }; });

  el('pre').textContent = PRE;
  el('work').appendChild(K.el('p', { class: 'wh' }, 'Worked from the rule'));
  WORK.forEach((s) => el('work').appendChild(K.el('p', { class: 'wl' }, s)));

  function sayFor(I) {
    const r = rule(I);
    if (I >= 0.999) return 'At full-load current the field, the torque and the speed all read ' + two(1) + '.';
    let s = 'At ' + two(I) + ' of full-load current the field is ' + two(r.field) + '. The torque falls faster, to ' + two(r.torque) + ', because it goes with the current squared. ' +
      'The weaker field must spin faster to make the same back-emf, so the speed rises to ' + two(r.speed) + '.';
    if (r.speed > DANGER) s += ' That is past the example danger line. Take the load off and it keeps climbing: runaway.';
    return s;
  }
  function paintLive(I) {
    const r = rule(I), hot = r.speed > DANGER;
    M.bar.setAttribute('width', f1(60 * r.field));
    const x = f1(PX(I));
    M.guide.setAttribute('x1', x); M.guide.setAttribute('x2', x); M.guide.setAttribute('y2', f1(PY(r.torque)));   // from the axis to the torque dot only
    M.dS.setAttribute('cx', x); M.dS.setAttribute('cy', f1(PY(r.speed)));
    M.dS.classList.toggle('hot', hot);
    M.dT.setAttribute('cx', x); M.dT.setAttribute('cy', f1(PY(r.torque)));
    RD.f.set(r.field); RD.t.set(r.torque); RD.s.set(r.speed);
    RD.s.el.classList.toggle('hot', hot);
    el('say').textContent = sayFor(I);
    SPIN.s = r.speed;
  }

  let seenI = null, held = false;
  const spin = K.anim({ button: false, label: 'The armature turning', step: (dt) => {
    if (at() !== iPic || held || REDUCE) return false;
    SPIN.th = (SPIN.th + 360 * REV * SPIN.s * dt) % 1080;   // 1080° keeps the pinion and the gear (a third as fast) in mesh
    paintSpin();
    return true;
  } });
  // The read-through's picture: the load current at its lowest, the gears held still.
  function stillAt(I) {
    loadCtl.set(I);
    SPIN.th = 30;
    held = true;
    spin.pause();
    K.refresh();
    seenI = I;
    paintSpin();
  }

  // ---------- picks: one go, then the answer and its reason ----------
  const pickBtns = [0, 1, 2].map((k) => K.button({ label: 'Answer ' + (k + 1), secondary: true, into: '#picks', press: () => pick(k) }));
  function pick(k) {
    const i = at(), d = STEPS[i], st = S[i];
    if (!d.opts || k >= d.opts.length || st.res) return;
    st.pick = d.opts[k];
    if (st.pick === d.want) { st.res = 'right'; st.fb = { ok: true, v: 'Right.', p: d.why }; }
    else { st.res = 'wrong'; st.fb = { ok: false, v: 'Not quite.', p0: d.slips[k], ans: d.want + '.', p: d.why }; }
    K.refresh();
  }
  function paintFb(f) {
    const fb = el('fb');
    fb.textContent = '';
    fb.hidden = !f;
    if (!f) return;
    fb.className = 'fb ' + (f.ok ? 'ok' : 'bad');
    fb.appendChild(K.el('p', { class: 'v' }, f.v));
    if (f.p0) fb.appendChild(addText(K.el('p'), f.p0));
    if (f.ans) fb.appendChild(K.el('p', { class: 'ans' }, 'The answer: ' + f.ans));
    if (f.p) fb.appendChild(addText(K.el('p'), f.p));
  }

  // ---------- Keep this ----------
  K.summary({ into: '#keep' });
  K.button({ label: 'Finish the lesson', into: '#fin', press: () => {
    if (at() !== iK) return;
    finished = true;
    if (typeof K.complete === 'function') K.complete();
    K.refresh();
  } });

  // ---------- nav ----------
  const backBtn = K.button({ label: 'Back', secondary: true, into: '#nav', press: () => { if (at() > 0) stepper.set(at() - 1); } });
  const nextBtn = K.button({ label: 'Continue', into: '#nav', press: () => { const i = at(); if (canGo(i) && i < iK) stepper.set(i + 1); } });
  function canGo(i) { const d = STEPS[i]; return d.show ? true : d.opts ? !!S[i].res : false; }
  function enter() { const b = el('stepbox'); b.classList.remove('enter'); void b.offsetWidth; b.classList.add('enter'); }

  const ON = { hwW: [iHow], behW: [iBeh], useW: [iUse], fltW: [iFlt], pre: [iPic], live: [iPic], picks: [iChk, iFind], keep: [iK], fin: [iK] };

  K.update((p) => {
    const i = at(), d = STEPS[i], st = S[i];
    if (i !== lastStep) { if (lastStep !== -1) enter(); lastStep = i; }
    Object.keys(ON).forEach((id) => { el(id).hidden = ON[id].indexOf(i) < 0; });
    el('count').textContent = 'Step ' + (i + 1) + ' of ' + STEPS.length + ' · ' + d.label;

    const task = el('task');
    task.className = 'task' + (d.show ? ' show' : '') + (i === iPic ? ' ask' : '');
    if (i === iPic) write(task, PLAY_TASK);
    else if (d.show) blocks(task, d.blocks);
    else if (d.kind) task.textContent = '';
    else write(task, d.task);
    task.hidden = !task.textContent;
    const sub = el('sub');
    sub.textContent = i === iK ? 'One card to come back to on a real job.' : '';
    sub.hidden = !sub.textContent;

    // the picture: a new load current moves the field bar, the dots and the readouts, and sets the armature's pace
    const I = loadOf(p);
    if (I !== seenI) { if (seenI !== null) held = false; seenI = I; }
    paintLive(I);
    paintSpin();
    if (i === iPic && !held && !REDUCE && !spin.playing()) spin.play();

    const opts = d.opts || [];
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      b.setLabel(opts[k]);
      b.el.classList.toggle('is-right', !!st.res && opts[k] === d.want);
      b.el.classList.toggle('is-wrong', st.res === 'wrong' && opts[k] === st.pick);
      b.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });
    paintFb(st.fb);

    el('donefb').textContent = finished && i === iK ? 'Lesson finished. Back is there whenever you want another look.' : '';
    el('donefb').hidden = !el('donefb').textContent;
    backBtn.el.hidden = i === 0;
    nextBtn.el.hidden = i === iK || !canGo(i);
    el('nav').hidden = backBtn.el.hidden && nextBtn.el.hidden;
  });

  // ---------- known answers, worked out by hand ----------
  K.check('Full load gives field, torque and speed 1.00; half the current gives 0.50, 0.25 and 2.00; a quarter gives 0.25, 0.06 and 4.00; the speed crosses 3.00 near 0.33, so 0.30 is past it at 3.33 and 0.35 under it at 2.86', () => {
    const a = K.at({ load: 1 }), b = K.at({ load: 0.5 }), c = K.at({ load: 0.25 }), d = K.at({ load: 0.3 }), e = K.at({ load: 0.35 });
    return two(a.field) === '1.00' && two(a.torque) === '1.00' && two(a.speed) === '1.00' &&
      two(b.field) === '0.50' && two(b.torque) === '0.25' && two(b.speed) === '2.00' &&
      two(c.field) === '0.25' && two(c.torque) === '0.06' && two(c.speed) === '4.00' &&
      N.cross === '0.33' && d.speed > DANGER && two(d.speed) === '3.33' && e.speed < DANGER && two(e.speed) === '2.86' &&
      WORK[1] === 'At 0.50: field 0.50, torque 0.50 × 0.50 = 0.25, speed 1 ÷ 0.50 = 2.00.' && WORK[2] === 'At 0.25: field 0.25, torque 0.25 × 0.25 = 0.06, speed 1 ÷ 0.25 = 4.00.';
  });
  K.check('As the load current falls the field falls with it, the torque falls faster than the field, and the speed always rises; field × speed stays 1.00, so the back-emf stays equal to the supply', () => {
    for (let k = 0; k < 15; k++) {
      const hi = K.at({ load: 1 - 0.05 * k }), lo = K.at({ load: 1 - 0.05 * (k + 1) });
      if (!(lo.field < hi.field && lo.torque / hi.torque < lo.field / hi.field && lo.speed > hi.speed)) return false;
      if (!K.near(lo.field * lo.speed, 1, 1e-9)) return false;
    }
    return true;
  });
  K.check('The developed torque is proportional to the square of the armature current: double the current, four times the torque', () =>
    K.near(K.at({ load: 1 }).torque / K.at({ load: 0.5 }).torque, 4, 1e-9), { source: RH });
  K.check('For a series motor the speed is inversely proportional to the armature current: half the current, twice the speed', () =>
    K.near(K.at({ load: 0.5 }).speed / K.at({ load: 1 }).speed, 2, 1e-9), { source: AAST });
  K.check('A motor with an armature resistance of 0.4 ohms on a 260 V DC supply would draw 650 A at start', () =>
    K.near(VS / RA, 650, 1e-9) && N.start === '650', { source: PEG8 });

  K.ready();
</script>
