<p class="caption">The string, its readings and its test times are an example, not measured data.</p>

<script>
  // ---------- the rule ----------
  const MEG = 'https://res.cloudinary.com/iwh/image/upload/q_auto,g_center/assets/1/7/Megger_Battery_Testing_Guide.pdf';
  const VERT = 'https://www.vertiv.com/48dfb9/globalassets/documents/battcon-static-assets/2010/the-inspection-is-complete.-what-are-you-doing-with-the-data.pdf';
  const EPRI = 'https://www.vertiv.com/48de51/globalassets/documents/battcon-static-assets/2002/internal-ohmic-measurements-and-their-relationship-to-battery-capacity---epris-ongoing-technology-evaluation.pdf';
  const BU201 = 'https://www.batteryuniversity.com/article/bu-201-how-does-the-lead-acid-battery-work/';
  const NC = 24, FLAG = 17, NQ = 24, FLAT = 10, CLIMB = 0.02, WOB = 0.004, MEAN = 0.5, SD = 0.02;
  // Example baselines at commissioning (mΩ). The 23 healthy cells run from 0.46 to 0.54, averaging 0.50 with an SD of 0.02. Cell 17 starts at 0.50.
  const B0 = [null, 0.51, 0.485, 0.52, 0.495, 0.54, 0.48, 0.50, 0.515, 0.49, 0.46, 0.525, 0.50, 0.485, 0.51, 0.47, 0.505, 0.50, 0.48, 0.53, 0.49, 0.515, 0.475, 0.52, 0.50];
  const HEALTHY = [];
  for (let c = 1; c <= NC; c++) if (c !== FLAG) HEALTHY.push(c);
  const avg = (v) => v.reduce((a, b) => a + b, 0) / v.length;
  const sdv = (v, m) => Math.sqrt(v.reduce((a, b) => a + (b - m) * (b - m), 0) / v.length);
  // A fixed wobble for each cell and quarter, between −1 and 1 (the same every time the page loads).
  function wob(c, q) { let h = Math.imul(c, 374761393) ^ Math.imul(q + 7, 668265263); h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return ((h >>> 0) % 20001) / 10000 - 1; }
  // RD[c][q]: cell c's impedance at quarter q; quarter 0 is its baseline. The healthy cells wobble about their baselines, set back each
  // quarter so that together they keep a mean of 0.50 and an SD of 0.02. Cell 17 wobbles for ten quarters, then climbs 0.02 mΩ a quarter.
  const RD = [null];
  for (let c = 1; c <= NC; c++) RD.push([B0[c]]);
  for (let q = 1; q <= NQ; q++) {
    const raw = HEALTHY.map((c) => B0[c] + WOB * wob(c, q)), m = avg(raw), s = sdv(raw, m);
    HEALTHY.forEach((c, k) => { RD[c][q] = MEAN + (raw[k] - m) * SD / s; });
    RD[FLAG][q] = q < FLAT ? B0[FLAG] + 0.8 * WOB * wob(FLAG, q) : B0[FLAG] + CLIMB * (q - FLAT);
  }
  const qi = (q) => K.clamp(Math.floor((+q || 0) + 1e-9), 0, NQ);
  const ci = (c) => K.clamp(Math.round(+c || FLAG), 1, NC);
  // Rise from its own baseline: (reading − baseline) ÷ baseline × 100.
  const riseOf = (c, q) => (RD[c][q] - B0[c]) / B0[c] * 100;
  // The least-squares line through its last 4 readings, in mΩ a quarter.
  function slopeOf(c, q) {
    const a = Math.max(0, q - 3), n = q - a + 1;
    if (n < 2) return 0;
    const mx = (a + q) / 2;
    let my = 0;
    for (let k = a; k <= q; k++) my += RD[c][k];
    my /= n;
    let num = 0, den = 0;
    for (let k = a; k <= q; k++) { num += (k - mx) * (RD[c][k] - my); den += (k - mx) * (k - mx); }
    return num / den;
  }
  // SDs from the string's mean: (reading − mean of the other 23) ÷ their SD.
  function zOf(c, q) {
    const o = [];
    for (let k = 1; k <= NC; k++) if (k !== c) o.push(RD[k][q]);
    const m = avg(o);
    return (RD[c][q] - m) / sdv(o, m);
  }
  function modelOf(p) { const c = ci(p.cell), q = qi(p.q); return { riseFromBase: riseOf(c, q), slope: slopeOf(c, q), sdFromMean: zOf(c, q) }; }
  // The range of the other cells' readings, for each tapped cell and quarter.
  const RNG = [null];
  for (let c = 1; c <= NC; c++) {
    const r = [];
    for (let q = 0; q <= NQ; q++) {
      let lo = Infinity, hi = -Infinity;
      for (let k = 1; k <= NC; k++) if (k !== c) { lo = Math.min(lo, RD[k][q]); hi = Math.max(hi, RD[k][q]); }
      r.push([lo, hi]);
    }
    RNG.push(r);
  }
  // The three lines, each set on the tapped cell's own baseline (the 150% line takes the baseline as nominal).
  const LINES = {
    maker: { name: '20% line', label: '20% line', lo: 1.2, hi: 1.2, kind: 'line' },
    guide: { name: '30 to 50% band', label: '30 to 50% band', lo: 1.3, hi: 1.5, kind: 'band' },
    study: { name: '150% line', label: '150% of nominal', lo: 1.5, hi: 1.5, kind: 'dash' },
  };
  const pastLine = (c, q, key) => RD[c][q] >= B0[c] * LINES[key].lo - 1e-9;
  function crossAt(c, key) { for (let q = 0; q <= NQ; q++) if (pastLine(c, q, key)) return q; return null; }
  // The capacity test: a 200 Ah string at the 10-hour rate runs at 20 A, and capacity is the hours run ÷ 10 × 100.
  const RATED = 200, RATE_H = 10, IT = RATED / RATE_H, LINE80 = 0.8 * RATE_H, H_NEW = 9.7, H_FALL = 0.38;
  const hoursAt = (q) => (q <= FLAT ? H_NEW : H_NEW - H_FALL * (q - FLAT));
  const capOf = (h) => h / RATE_H * 100;
  const NB = ' ';
  const r1 = (v) => Math.round(v * 10) / 10, r2 = (v) => Math.round(v * 100) / 100;
  const ez = (x) => K.ease(K.clamp(x, 0, 1));
  const mo = (v) => K.fmt(v, { decimals: 2 }) + ' mΩ';
  const hr = (v) => K.fmt(v, { decimals: 1 });
  const pc = (v) => K.fmt(v, { decimals: 0 });
  const FAULT = { below: 'sulphation', low: 'stratification', high: 'grid corrosion', vrla: 'dry-out' };

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  const W1 = 'Here is a string of 24 cells. Each cell is read for impedance every quarter. Its first reading, at commissioning, is its *baseline*. ' +
    'Cells differ from new, here from 0.46 to 0.54 mΩ. So one reading on its own says little about a cell\'s health. Most resistance-based testers predict health little better than tossing a coin. ' +
    'Plot each cell against its own baseline instead. Here cell 17 sits flat on its 0.50 mΩ baseline at quarter 8.';
  const W3 = 'As the quarters run on, cell 17 stays flat for ten quarters. It wobbles a little like the rest. Then it turns upward by 0.02 mΩ a quarter and keeps going. ' +
    'A steady climb one way is *drift*, not noise. The fitted slope through its last four readings rises from about zero to 0.020 mΩ a quarter. ' +
    'By quarter 15 cell 17 reads 0.60 mΩ. That is 20% above its own baseline, and 5 SDs from the string\'s mean.';
  const W5 = 'How big a rise matters is argued. One test-set maker links a 20% rise in flooded cells to about 80% capacity. That line sits at 0.60 mΩ. ' +
    'A service guide gives a 30 to 50% rise as an example of concern. That band runs from 0.65 to 0.75 mΩ. ' +
    'An industry study found most cells below 80% capacity at 150% of nominal. Taking the baseline as nominal, that line sits at 0.75 mΩ. ' +
    'Cell 17 reaches them at quarters 15, 18 and 23. Here the 20% line is drawn.';
  const W7 = 'A *capacity test* decides. The example string is rated 200 Ah at the 10-hour rate, so it is discharged at 20 A. The clock runs until the string reaches its end voltage. ' +
    'At a fixed current, ampere-hours are amps × hours. So capacity is the hours run ÷ 10 hours. The replacement line is 80%, at 8 hours. ' +
    'The weakest cell sets how long the string lasts. At quarter 15 the clock stops at 7.8 hours. That is 78%, short of the line.';
  const W9 = 'The trend says which cell. The test says how much it has lost. The charging record says why. ' +
    'Keep a cell short of full charge, and soft sulphate hardens into crystals on the negative plate. Leave it at low charge with shallow cycles, and the acid sinks and starves the tops of the plates. ' +
    'Float it too high for too long, and the positive grid softens and sheds. Charge a valve-regulated cell too hard, and it vents its gas and dries out. Here the cell shows *sulphation*.';
  const W11 = 'Each fault leaves a different job. Sulphation can be reversed if it is caught in time. An equalising charge mixes stratified acid by gassing. ' +
    'Both cures are an *equalising charge*. That is a deliberate overcharge of the whole string. Grid corrosion is permanent. ' +
    'A valve-regulated cell cannot be topped up, so dry-out stays. So the earlier the trend finds a cell, the gentler the cure. Here each fault carries its tag.';
  const O0_N = 'Noise, because readings always wobble', O0_D = 'Drift, because a run of six one way is rare by chance', O0_7 = 'Neither, until a seventh reading is in';
  const O2_B = 'B, because it reads highest', O2_N = 'Neither, because both sit near the string\'s average', O2_A = 'A, because it has risen about 15% from its own baseline';
  const O6_R = 'Replace it, because it is past 20%', O6_T = 'Book a capacity test, because the rise only flags the cell', O6_L = 'Leave it, because it is under 30%';
  const O8_R = '85%, so replace it, because it has lost 15%', O8_A = 'Too close to call, so test it again', O8_K = '85% of rated capacity, above the 80% line, so keep it and keep trending';
  const O10_S = 'Sulphation on the negative plates', O10_C = 'Corrosion of the positive grid', O10_D = 'Dry-out';
  const O12_Y = 'Yes, no cell stands out', O12_N = 'No, the whole string has drifted, so test its capacity', O12_30 = 'Yes, 25% is under the 30% line';
  const O13_N = 'Only 0.06 mΩ out, so it is normal', O13_R = '3 SDs out, so replace it', O13_C = '3 SDs out, rare by chance, so check its own trend';
  const O14_D = 'Dry-out, and an equalise would make it worse', O14_S = 'Sulphation, and an equalise will clear it', O14_T = 'Stratification, and an equalise will mix it';
  const RO3 = ['riseFromBase', 'slope', 'sdFromMean'];
  const STEPS = [
    { name: 'Drift or noise', pic: 'run6', enter: { ef: 0 }, end: { ef: 1 },
      run: { dur: 1.9, go: (u) => { X.ef = u; } },
      task: 'One cell\'s quarterly readings rise six times in a row. Is that drift or noise?',
      opts: [O0_N, O0_D, O0_7], want: O0_D, right: 'Still there: a run of six one way points to a cause.',
      hint: 'Not quite. Think about how often chance alone gives six rises in a row.',
      hints: { [O0_N]: 'Not quite. Noise goes up and down at random, so six rises in a row is unlikely.', [O0_7]: 'Not quite. Six in a row is already the usual signal.' },
      why: 'Noise goes up and down at random. Each new reading is about as likely to fall as to rise. So six rises in a row seldom happens by chance. A run of six one way is the usual signal that something is pushing the readings.' },
    { show: true, name: 'Its own baseline', pic: 'trend', rack: true, ro: RO3, ctl: ['q', 'cell'], enter: { q: 0, cell: FLAG }, end: { q: 8 }, still: { q: 8, cell: FLAG }, dur: 3.6,
      play: (t) => { X.q = 8 * ez((t - 0.4) / 3.0); },
      text: W1 + ' Tap a cell to plot its readings.', read: W1 },
    { name: 'Which cell to watch', pic: 'ab', enter: { ef: 0 }, end: { ef: 1 },
      run: { dur: 1.4, go: (u) => { X.ef = u; } },
      task: 'Cell A was commissioned at 0.46 mΩ and now reads 0.53 mΩ. Cell B started at 0.54 mΩ and still reads 0.54 mΩ. The string averages 0.50 mΩ. Which cell should you watch?',
      opts: [O2_B, O2_N, O2_A], want: O2_A, right: 'That\'s it: A has moved 0.07 mΩ from where it started. B has not moved.',
      hint: 'Not quite. Compare each cell with its own first reading.',
      hints: { [O2_B]: 'Not quite. B has read 0.54 mΩ since it was new. That is just how it was made.', [O2_N]: 'Not quite. The average hides a change. Each cell\'s own baseline shows it.' },
      why: 'Judge each cell against its own first reading. A started at 0.46 mΩ and now reads 0.53 mΩ. That is 0.07 mΩ up, about 15%. B has read 0.54 mΩ since it was new. That is just how it was made. So A is the cell to watch.' },
    { show: true, name: 'The turn upward', pic: 'trend', rack: true, ro: RO3, ctl: ['q', 'cell'], enter: { q: 8, cell: FLAG }, end: { q: 15 }, still: { q: 15, cell: FLAG }, dur: 4.2,
      play: (t) => { X.q = 8 + 7 * ez((t - 0.4) / 3.4); },
      text: W3 + ' Drag the quarters, or tap another cell, to try it.', read: W3 },
    { name: 'How far it has risen', pic: 'trend', ro: ['riseFromBase'], hide: ['riseFromBase'], enter: { q: 15, cell: FLAG, rb: 0 }, end: { rb: 1 },
      run: { dur: 1.6, go: (u) => { X.rb = ez(u / 0.8); } },
      task: 'A cell\'s baseline was 0.50 mΩ, and it now reads 0.60 mΩ. How far has it risen from its baseline?',
      opts: ['20%', '120%', '0.10%'], want: '20%', right: 'That\'s it: 0.10 ÷ 0.50 = 0.2, a 20% rise.',
      hint: 'Not quite. Divide the rise by the baseline.',
      hints: { '120%': 'Not quite. That is the new reading as a share of the baseline. The rise is only the extra.', '0.10%': 'Not quite. 0.10 is the rise in mΩ. Divide it by the baseline.' },
      why: 'The rise is the reading take away the baseline, so 0.60 − 0.50 = 0.10 mΩ. Divide that by the baseline. 0.10 ÷ 0.50 = 0.2, and 0.2 is 20%.' },
    { show: true, name: 'Where to draw the line', pic: 'trend', rack: true, lines: true, ro: RO3, ctl: ['q', 'cell', 'line'],
      enter: { q: 15, cell: FLAG, line: 'study', line2: null, lf: 0 }, end: { q: 24, line: 'maker', line2: 'guide', lf: 1 }, still: { q: 24, cell: FLAG, line: 'maker', line2: null, lf: 1 }, dur: 4.4,
      play: (t) => {
        X.q = 15 + 9 * ez((t - 0.3) / 1.9);
        if (t < 2.4) { X.line = 'study'; X.line2 = null; X.lf = ez((t - 0.3) / 0.6); }
        else if (t < 3.4) { X.line = 'guide'; X.line2 = 'study'; X.lf = ez((t - 2.4) / 0.6); }
        else { X.line = 'maker'; X.line2 = 'guide'; X.lf = ez((t - 3.4) / 0.6); }
      },
      text: W5 + ' Pick a line, or drag the quarters, to try it.', read: W5 },
    { name: 'Flag or replace', pic: 'decide', enter: { ef: 0 }, end: { ef: 1 },
      run: { dur: 1.4, go: (u) => { X.ef = u; } },
      task: 'A cell has risen 25% from its baseline, and its trend still climbs. What should you do?',
      opts: [O6_R, O6_T, O6_L], want: O6_T, right: 'That\'s it: the trend points, and the test decides.',
      hint: 'Not quite. Think about what a rise in impedance can and cannot tell you.',
      hints: { [O6_R]: 'Not quite. A rise in impedance says where to look, not how much capacity is gone.', [O6_L]: 'Not quite. Another line already flags it. And the trend is still climbing.' },
      why: 'The lines disagree, and 25% is past one and short of another. Either way, a rise in impedance says where to look. It does not say how much capacity is gone. A capacity test measures that, so book one.' },
    { show: true, name: 'The test decides', pic: 'test', ctl: ['q'], test: true, enter: { q: 15, cell: FLAG, th: 0, sf: 0 }, end: { th: hoursAt(15), sf: 1 }, still: { q: 15, th: hoursAt(15), sf: 1 }, dur: 3.8,
      play: (t) => { X.th = hoursAt(15) * K.clamp((t - 0.3) / 2.6, 0, 1); X.sf = ez((t - 3.1) / 0.6); },
      text: W7 + ' Run the test, or drag the quarter, to try it.', read: W7 },
    { name: 'Reading the test', pic: 'test', enter: { tsc: 'given', th: 8.5, sf: 1, ef: 0 }, end: { ef: 1 },
      run: { dur: 1.4, go: (u) => { X.ef = u; } },

  const FINISH = 'Trend each cell against its own baseline. Treat a steady climb as a flag. Let a capacity test against the 80% line decide.';
  const HIST_SAY = {

    low: 'This cell sat at low charge with shallow cycles, so the dense acid has sunk and the tops of the plates go short.',
    high: 'This cell floated too high for too long, so its positive grid has corroded faster, softened and shed lead.',

  };
  const TAGS = [['below', 'Sulphation', 'Can be reversed if caught in time', 'cv'], ['low', 'Stratification', 'An equalising charge mixes the acid', 'cv'],

  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

  const el = (id) => document.getElementById(id);

  // ---------- state ----------
  function blank() { return { pick: null, res: null, why: false }; }
  let S = STEPS.map(blank);
  const X0 = { q: 8, cell: FLAG, line: 'maker', line2: null, lf: 1, cf: 1, hist: 'below', f: 1, th: 0, sf: 0, ef: 1, rb: 0, tg: 3.4, tsc: '', ph: 0 };
  const X = {};

  const CTL = {

  const ctlOn = (d, k) => !!(d.ctl && d.ctl.indexOf(k) >= 0);

  // A puzzle's answer stays a "?" in its readout until Check says it is right.

  // ---------- motion: one animation runs each demonstration, each answer's motion, and what follows Dan's own moves ----------
  // After Dan moves something, the picture eases to its new state: a new cell's line fades in, a new line fades in
  // over the old one, a fault forms, and the test clock runs at 3 hours a second.
  function settle(dt, d) {
    let busy = false;
    const go = (k, sec) => { if (X[k] < 1) { X[k] = Math.min(1, X[k] + dt / sec); busy = true; } };
    go('cf', 0.5); go('lf', 0.6);
    if (d.pic === 'cell') go('f', 1.6);
    if (d.pic === 'test') {
      const H = hoursAt(qi(X.q));

  }
  function settled(d) { X.cf = 1; X.lf = 1; if (d.pic === 'cell') X.f = 1; if (d.pic === 'test') { X.th = hoursAt(qi(X.q)); X.sf = 1; } }
  const unsettled = (d) => !!d.show && (X.cf < 1 || X.lf < 1 || (d.pic === 'cell' && X.f < 1) || (d.pic === 'test' && (X.th < hoursAt(qi(X.q)) - 1e-9 || X.sf < 1)));
  const motionEnd = (d, st) => (d.show ? (scripted ? d.dur : 0) : st.res === 'right' ? d.run.dur : 0);
  const anim = K.anim({ button: false, label: 'Demonstration', step: (dt) => {

    if (running) d.run.go(Math.min(1, T / d.run.dur));

    if (!scripted && !running && d.show) busy = settle(dt, d);

  const pending = () => T !== Infinity || unsettled(STEPS[at()]);
  // A motion that was stopped (the page hidden, a test) shows finished.

  // ---------- drawing ----------

  function part(a, fn) { if (a <= 0.001) return; const g = add(K.svg('g')); K.fade(g, Math.min(1, a), 0); const keep = into; into = g; fn(); into = keep; }
  function arrow(x1, y1, x2, y2) {

    S_('path', { class: 'arr', d: 'M' + r1(x1) + ' ' + r1(y1) + 'L' + r1(bx) + ' ' + r1(by) });
    S_('path', { class: 'arrh', d: 'M' + r1(x2) + ' ' + r1(y2) + 'L' + r1(bx - 4.5 * uy) + ' ' + r1(by + 4.5 * ux) + 'L' + r1(bx + 4.5 * uy) + ' ' + r1(by - 4.5 * ux) + 'Z' });
  }

  // Seven quarterly readings of one cell, each above the last.
  function drawRun6() {
    const V = [0, 0.8, 1.9, 2.6, 3.8, 4.7, 5.6], px = (k) => 60 + 40 * k, py = (v) => 124 - 15 * v;

  // The tapped cell's readings against its own baseline, with the other cells' range behind it.
  function drawLine(key, a, b, yI, avoid) {
    if (a <= 0.001) return;
    part(a, () => {
      const L = LINES[key];
      if (L.kind === 'band') {
        const y1 = yI(b * L.hi), y0 = yI(b * L.lo);
        S_('rect', { class: 'bandf', x: 50, y: r1(y1), width: 276, height: r1(y0 - y1) });
        avoid.push(S_('path', { class: 'bande', d: 'M50 ' + r1(y1) + 'H326M50 ' + r1(y0) + 'H326' }));

      } else {
        const y = yI(b * L.lo);
        avoid.push(S_('path', { class: 'thr' + (L.kind === 'dash' ? ' dash' : ''), d: 'M50 ' + r1(y) + 'H326' }));
        txt(56, y - 6, L.label, null, 'start');

  function drawTrend(d, st) {
    const c = X.cell, b = B0[c], qd = K.clamp(X.q, 0, NQ), q = qi(qd), cf = K.clamp(X.cf, 0, 1);
    const xQ = (v) => 50 + v * 11.5, yI = (v) => 44 + (0.84 - v) * 380;
    REC.cell = c; REC.q = q; REC.reading = RD[c][q];
    // key
    S_('path', { class: 'cl', d: 'M4 10H22' }); txt(27, 14.5, 'cell ' + c, null, 'start');
    S_('path', { class: 'bl', d: 'M150 10H168' }); txt(173, 14.5, 'its baseline', null, 'start');
    S_('rect', { class: 'pack', x: 4, y: 21, width: 18, height: 12, rx: 2 }); txt(27, 31.5, 'other cells\' range', null, 'start');
    S_('path', { class: 'fit', d: 'M154 27H164' }); txt(173, 31.5, 'fitted slope', null, 'start');
    // axes
    S_('path', { class: 'axis', d: 'M50 40V196H326' });
    [0.5, 0.6, 0.7, 0.8].forEach((v) => { const y = r1(yI(v)); S_('path', { class: 'tick', d: 'M45 ' + y + 'H50' }); txt(43, y + 4.5, v.toFixed(2), 'lbm', 'end'); });
    for (let k = 0; k <= NQ; k += 4) { const x = r1(xQ(k)); S_('path', { class: 'tick', d: 'M' + x + ' 196V201' }); txt(x, 214, String(k), 'lbm'); }
    rot(10, 118, 'impedance, mΩ');
    txt(188, 232, 'quarters since commissioning', 'lbm');
    // the quarters read so far (the last one partly, while the quarters run on)
    const ts = [];
    for (let k = 0; k <= Math.floor(qd + 1e-9); k++) ts.push(k);
    if (qd - ts[ts.length - 1] > 1e-6) ts.push(qd);
    const lerpAt = (fn, t) => { const k0 = Math.floor(t + 1e-9), f = t - k0; return k0 >= NQ || f < 1e-9 ? fn(k0) : K.lerp(fn(k0), fn(k0 + 1), f); };
    const lo = (k) => RNG[c][k][0], hi = (k) => RNG[c][k][1], rd = (k) => RD[c][k];
    if (ts.length === 1) S_('rect', { class: 'pack', x: 46, y: r1(yI(hi(0))), width: 8, height: r1(yI(lo(0)) - yI(hi(0))) });
    else {
      let p = '';
      ts.forEach((t, j) => { p += (j ? 'L' : 'M') + r1(xQ(t)) + ' ' + r1(yI(lerpAt(hi, t))); });
      ts.slice().reverse().forEach((t) => { p += 'L' + r1(xQ(t)) + ' ' + r1(yI(lerpAt(lo, t))); });
      S_('path', { class: 'pack', d: p + 'Z' });
    }
    const avoid = [];
    avoid.push(S_('path', { class: 'bl', d: 'M50 ' + r1(yI(b)) + 'H326' }));
    // the line picked (one at a time; the last one fades out as the new one fades in)
    REC.line = d.lines ? X.line : null;
    if (d.lines) {
      if (X.line2 && X.line2 !== X.line) drawLine(X.line2, 1 - X.lf, b, yI, avoid);
      drawLine(X.line, X.lf, b, yI, avoid);
    }
    part(cf, () => {
      if (q >= 1) {
        const a0 = Math.max(0, q - 3), sl = slopeOf(c, q), mx = (a0 + q) / 2;
        let my = 0;
        for (let k = a0; k <= q; k++) my += rd(k);
        my /= q - a0 + 1;
        avoid.push(S_('path', { class: 'fit', d: 'M' + r1(xQ(a0)) + ' ' + r1(yI(my + sl * (a0 - mx))) + 'L' + r1(xQ(q)) + ' ' + r1(yI(my + sl * (q - mx))) }));
      }
      let p = '';
      ts.forEach((t, j) => { p += (j ? 'L' : 'M') + r1(xQ(t)) + ' ' + r1(yI(lerpAt(rd, t))); });
      avoid.push(S_('path', { class: 'cl', d: p + (ts.length === 1 ? 'h0.01' : '') }));
      for (let k = 0; k <= Math.min(NQ, Math.ceil(qd)); k++) {
        const a = K.clamp((qd - k + 0.3) / 0.3, 0, 1);

  // The capacity test: the string's volts fall as the clock runs, until they reach the end voltage.
  function drawTest(d) {
    const given = X.tsc === 'given', q = qi(X.q);
    const H = given ? 8.5 : hoursAt(q), th = K.clamp(X.th, 0, H);
    const xh = (h) => 40 + h * 28, yv = (s) => 58 + 34 * s + 58 * Math.pow(s, 7);
    txt(170, 16, given ? 'String rated for 10 hours at 20 A' : RATED + ' Ah string discharged at ' + IT + ' A', 'ttl');
    S_('path', { class: 'axis', d: 'M40 40V168H320' });
    txt(46, 36, 'string volts', 'lbm', 'start');
    [0, 2, 4, 6, 8, 10].forEach((h) => { S_('path', { class: 'tick', d: 'M' + xh(h) + ' 168V173' }); txt(xh(h), 186, h === 10 ? '10 h' : String(h), 'lbm'); });
    S_('path', { class: 'endv', d: 'M40 150H320' });
    txt(46, 163, 'end voltage', 'lbm', 'start');
    S_('path', { class: 'thr', d: 'M' + xh(LINE80) + ' 40V168' });
    txt(xh(LINE80), 34, '80% line', null);
    if (th > 0.001) {
      let p = '';
      for (let k = 0; k <= 48; k++) { const t = th * k / 48; p += (k ? 'L' : 'M') + r1(xh(t)) + ' ' + r1(yv(t / H)); }
      S_('path', { class: 'volts', d: p });
    }
    S_('circle', { class: 'dot', cx: r1(xh(th)), cy: r1(yv(th / H)), r: 4 });
    // the clock
    const cx = 56, cy = 216, ang = th / 12 * 2 * Math.PI;
    S_('rect', { class: 'post', x: cx - 3, y: cy - 23, width: 6, height: 6, rx: 1 });
    S_('circle', { class: 'watch', cx, cy, r: 16 });
    [0, 1, 2, 3].forEach((k) => { const a = k * Math.PI / 2; S_('path', { class: 'tick', d: 'M' + r1(cx + 12 * Math.sin(a)) + ' ' + r1(cy - 12 * Math.cos(a)) + 'L' + r1(cx + 15 * Math.sin(a)) + ' ' + r1(cy - 15 * Math.cos(a)) }); });
    S_('path', { class: 'hand', d: 'M' + cx + ' ' + cy + 'L' + r1(cx + 10 * Math.sin(ang)) + ' ' + r1(cy - 10 * Math.cos(ang)) });
    txt(84, 212, hr(th) + ' h', 'q', 'start');
    const pct = capOf(H), short = H < LINE80 - 1e-9;
    const stop = given ? hr(H) + ' ÷ 10 = ' + pc(pct) + '%, above the line' : pc(pct) + '%, ' + (short ? 'short of the 80% line' : 'above the 80% line');
    const a = given ? ez(X.ef / 0.8) : K.clamp(X.sf, 0, 1);

    if (a > 0.001) part(a, () => txt(84, 231, stop, short ? 'wl' : 'cv', 'start'));
    REC.H = H; REC.th = th; REC.stop = a >= 0.5 ? stop : '';
    return 'A capacity test. The string\'s voltage falls as a clock runs, until it reaches the end voltage. A line marks 8 hours, 80% of the rated 10. ' +
      'The clock reads ' + hr(th) + ' hours' + (th >= H - 1e-9 ? ' and has stopped.' : '.') + (REC.stop ? ' ' + stop + '.' : '');
  }

  // A cell cut away: its plates, its acid (or, valve-regulated, its soaked mat), and the fault its charging made.
  function drawJar(hist, f, ph, mini) {
    const M = mini ? 2.6 : 1, vr = hist === 'vrla', out = { crystals: 0, flakes: 0, bubbles: 0, dry: 0, strat: 0 };
    if (!vr) {
      const sf = hist === 'low' ? f : 0;
      out.strat = sf;
      for (let k = 0; k < 8; k++) {
        const op = K.clamp(0.55 + sf * 0.45 * (k / 7 * 2 - 1), 0.12, 1);
        S_('rect', { class: 'acid', x: 72, y: r1(74 + k * 19.5), width: 196, height: 20, opacity: r2(op) });
      }
    } else {
      for (let r = 0; r < 8; r++) for (let cc = 0; cc < 6; cc++) {
        const th = 0.1 + r / 7 * 1.1 + ((cc * 7 + r * 3) % 6) / 6 * 0.2;
        if (f > th) { out.dry++; continue; }
        S_('rect', { class: 'mat', x: r1(112 + cc * 19.33), y: r1(88 + r * 15.5), width: 19.8, height: 16 });
      }
      S_('rect', { class: 'matb', x: 112, y: 88, width: 116, height: 124 });
    }
    // positive plate: paste on a lead grid, which thins and sheds when it corrodes
    const cor = hist === 'high' ? f : 0;
    S_('rect', { class: 'plp', x: 92, y: 86, width: 18, height: 128, rx: 1, opacity: r2(1 - 0.55 * cor) });
    let gp = 'M98 86V214M104 86V214';
    for (let y = 102; y < 214; y += 16) gp += 'M92 ' + y + 'H110';
    S_('path', { class: 'grid', d: gp, 'stroke-width': r2(1.4 * (1 - 0.6 * cor)), 'stroke-dasharray': cor > 0.05 ? r1(14 - 8 * cor) + ' ' + r1(2 + 6 * cor) : null });
    for (let j = 0; j < 12; j++) {
      const a = ez((cor - j / 13) / 0.08);
      if (a <= 0.001) continue;
      if (a >= 0.5) out.flakes++;
      part(a, () => S_('rect', { class: 'flake', x: r1(80 + ((j * 17) % 42)), y: r1(224 - (j % 3) * 3.4 - (mini ? 6 : 0)), width: 5 * M, height: 2.6 * M }));
    }
    // negative plate, with hard sulphate crystals when it is kept short of charge
    S_('rect', { class: 'pln', x: 230, y: 86, width: 18, height: 128, rx: 1 });
    if (hist === 'below') for (let j = 0; j < 16; j++) {
      const a = ez((f - j / 20) / 0.18);
      if (a <= 0.001) continue;
      if (a >= 0.5) out.crystals++;
      const s = (2.6 + 2.4 * a) * M, x = j % 2 ? 251 : 227, y = 92 + ((j * 47) % 116);
      part(a, () => S_('path', { class: 'xtal', d: 'M' + x + ' ' + r1(y - s) + 'L' + r1(x + s) + ' ' + y + 'L' + x + ' ' + r1(y + s) + 'L' + r1(x - s) + ' ' + y + 'Z' }));
    }
    // the jar, lid, terminals and the vent (or valve)
    S_('path', { class: 'wire', d: 'M100 46V86M240 46V86' });
    S_('rect', { class: 'jar', x: 70, y: 58, width: 200, height: 172, rx: 6 });
    S_('rect', { class: 'lid', x: 64, y: 46, width: 212, height: 12, rx: 3 });
    S_('rect', { class: 'post', x: 92, y: 34, width: 16, height: 12, rx: 2 });
    S_('rect', { class: 'post', x: 232, y: 34, width: 16, height: 12, rx: 2 });
    S_('rect', { class: 'post', x: 163, y: 38, width: 14, height: 8, rx: 2 });
    // gas from a cell charged too hard: up beside the plates, across to the valve and out
    if (vr && f > 0.01) {
      for (let j = 0; j < 8; j++) {
        const u = ((ph * 0.32 + j / 8) % 1 + 1) % 1, a = Math.min(f * 1.5, 1) * Math.sin(Math.PI * u);
        if (a < 0.05) continue;
        const x0 = j % 2 ? 224 : 116;
        let x, y;
        if (u < 0.6) { x = x0; y = 205 - (u / 0.6) * 130; }
        else if (u < 0.85) { const v = (u - 0.6) / 0.25; x = K.lerp(x0, 170, v); y = 75 - v * 33; }
        else { const v = (u - 0.85) / 0.15; x = 170; y = 42 - v * 16; }
        out.bubbles++;
        S_('circle', { class: 'bub', cx: r1(x), cy: r1(y), r: 2.8 * M, opacity: r2(a) });
      }
    }
    return out;
  }
  function drawCell(d) {
    const f = K.clamp(X.f, 0, 1), h = X.hist;

    S_('path', { class: 'mean', d: qs.map((q, j) => (j ? 'L' : 'M') + xQ(q) + ' ' + r1(yv(MEAN * sc(q)))).join('') });

  }

  function sayFor(d) {
    if (d.pic === 'cell') return HIST_SAY[X.hist];
    if (d.pic === 'test') {
      const q = qi(X.q), H = hoursAt(q), th = Math.min(X.th, H);
      if (th < H - 1e-9) return 'The string is discharging at ' + IT + ' A, and the clock has run ' + hr(th) + ' hours.';
      return 'At quarter ' + q + ', the string runs ' + hr(H) + ' hours to its end voltage. That is ' + pc(capOf(H)) + '% of its rating, ' + (H < LINE80 - 1e-9 ? 'short of the 80% line.' : 'above the 80% line.');
    }
    const c = X.cell, q = qi(X.q), r = RD[c][q], b = B0[c], nq = (n) => n + (n === 1 ? ' quarter' : ' quarters');
    if (c !== FLAG) {
      const where = b >= 0.54 - 1e-9 ? ', the highest in the string,' : b <= 0.46 + 1e-9 ? ', the lowest in the string,' : '';
      return 'Cell ' + c + ' started at ' + mo(b) + where + ' and still sits flat on its own baseline.' + (d.lines ? ' It stays well short of the ' + LINES[X.line].name + '.' : '');
    }
    if (q === 0) return 'Cell 17 has just had its first reading, ' + mo(r) + '. That is its baseline.';
    if (q <= FLAT) return 'Cell 17 has sat on its ' + mo(b) + ' baseline for ' + nq(q) + ', wobbling a little like the rest.';
    if (!d.lines) return 'Cell 17 has climbed for ' + nq(q - FLAT) + ' and reads ' + mo(r) + '. A steady climb one way is drift, not noise.';
    const L = LINES[X.line], qc = crossAt(c, X.line);
    if (qc != null && qc <= q) return 'Cell 17 ' + (L.kind === 'band' ? 'entered the ' : 'crossed the ') + L.name + ' at quarter ' + qc + ', and reads ' + mo(r) + ' at quarter ' + q + '.';
    return 'Cell 17 reads ' + mo(r) + ' at quarter ' + q + ', short of the ' + L.name + ' so far.';
  }

  const PICS = { run6: [drawRun6, 160], trend: [drawTrend, 238], ab: [drawAB, 210], decide: [drawDecide, 222], test: [drawTest, 240], cell: [drawCell, 254], tags: [drawTags, 264], together: [drawTogether, 240], odd: [drawOdd, 160] };
  function paint(i) {
    if (i == null) i = at();
    const d = STEPS[i], st = S[i];
    art.textContent = ''; into = null;
    REC = { pic: d.pic };
    const pic = PICS[d.pic];
    svg.setAttribute('viewBox', '0 0 340 ' + pic[1]);
    const said = pic[0](d, st);
    svg.setAttribute('aria-label', said);
    if (d.rack) drawRack(d);
    if (d.ctl) { el('say').textContent = ''; glue(el('say'), sayFor(d)); }
  }

  // ---------- words: *a key term* is highlighted ----------
  // A number stays on one line with its unit (a no-wrap span, so the words read the same).
  const UNIT = /(\d+(?:\.\d+)? (?:mΩ|Ah|A|SDs?|hours?|h|quarters?)(?![A-Za-z]))/;
  function glue(node, s) { String(s).split(UNIT).forEach((seg, k) => { if (seg) node.appendChild(k % 2 ? K.el('span', { class: 'nw' }, seg) : document.createTextNode(seg)); }); return node; }
  function write(node, s) {
    node.textContent = '';
    String(s).split(/\*([^*]+)\*/).forEach((seg, k) => { if (seg) node.appendChild(k % 2 ? K.el('span', { class: 'term' }, seg) : glue(document.createDocumentFragment(), seg)); });
  }
  write(el('finish'), FINISH);
  function layout(i, d, st) {
    const key = [i, st.res, st.pick, st.why, finished].join('|');
    if (key === laidOut) return;
    laidOut = key;
    const right = st.res === 'right';
    el('stepbox').hidden = finished;
    el('done').hidden = !finished;
    el('count').textContent = 'Step ' + (i + 1) + ' of ' + STEPS.length;
    const task = el('task');
    task.className = 'task' + (d.show ? ' show' : '');
    write(task, d.show ? d.text : d.task);
    rack.hidden = !d.rack;
    SHOWN.forEach((k) => { el('c-' + k).hidden = !ctlOn(d, k); });
    el('c-test').hidden = !d.test;
    el('say').hidden = !d.ctl;
    const rs = d.ro || [];
    Object.keys(R).forEach((k) => { R[k].el.hidden = rs.indexOf(k) < 0; });
    el('outs').hidden = !rs.length;
    replayBtn.el.hidden = !d.show || REDUCE;
    el('replay').hidden = replayBtn.el.hidden;
    const opts = d.show ? [] : d.opts;
    el('picks').hidden = !opts.length;
    el('picks').classList.toggle('long', opts.some((o) => o.length > 12));
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      b.setLabel(opts[k]);
      b.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });
    el('acts').hidden = !!d.show;
    checkBtn.el.hidden = right;
    const fb = el('fb');
    fb.hidden = !!d.show;
    fb.className = 'fb' + (right ? ' right' : '');
    fb.textContent = d.show ? '' : right ? (d.right || 'That\'s it.') : st.res === 'wrong' ? ((d.hints && d.hints[st.pick]) || d.hint) : st.res === 'empty' ? 'Choose one of the answers first.' : '';
    const why = el('why');
    why.hidden = d.show || !st.why;
    write(why, d.show ? '' : d.why);
    whyBtn.setLabel(st.why ? 'Hide why' : 'Why?');
    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !right);
    nextBtn.setLabel(i === STEPS.length - 1 ? 'Finish' : 'Continue');
    el('nav').hidden = backBtn.el.hidden && nextBtn.el.hidden;
  }

  // Tapping a tile picks that cell (a drag across the tiles moves along them).
  K.drag(rack, { control: 'cell', toValue: (x, y) => K.clamp(Math.floor((y - 4) / 34), 0, 2) * 8 + K.clamp(Math.floor((x - 10) / 40), 0, 7) + 1 });

  K.update((p) => {
    const i = at(), d = STEPS[i], st = S[i];
    if (!anim.playing() && pending()) { const j = lastStep < 0 ? i : lastStep; finishNow(STEPS[j], S[j]); }
    if (i !== lastStep) { lastStep = i; enterStep(i); }
    else {
      // Only the controls this screen shows move its picture; a hidden one is set back silently.
      const mv = {}; let any = false, bad = false;
      Object.keys(pushed).forEach((k) => { if (p[k] !== pushed[k]) { if (ctlOn(d, k)) { mv[k] = true; any = true; } else bad = true; } });
      Object.keys(pushed).forEach((k) => { pushed[k] = p[k]; });
      if (any) {
        if (scripted) { scripted = false; anim.pause(); setX(d.end || {}); }
        T = Infinity;
        if (mv.q) { X.q = qi(p.q); if (d.pic === 'test') { X.th = 0; X.sf = 0; } }
        if (mv.cell && ci(p.cell) !== X.cell) { X.cell = ci(p.cell); X.cf = 0; }
        if (mv.line && p.line !== X.line) { X.line2 = X.line; X.line = p.line; X.lf = 0; }
        if (mv.hist && p.hist !== X.hist) { X.hist = p.hist; X.f = 0; }
        startSettle(d);
      }
      if (bad || any) push();
    }
    if (finished !== lastDone) { lastDone = finished; laidOut = ''; enter(finished ? 'done' : 'stepbox'); }
    layout(i, d, st);
    outs();
    paint(i);
  });

  // ---------- known answers, worked out by hand ----------
  const idx = (name) => STEPS.findIndex((d) => d.name === name);
  const solved = (d) => Object.assign(blank(), { pick: d.want, res: 'right' });
  // A step painted in the state given: what it draws.
  function drawn(i, st, x) {
    const keep = { X: copyX(), S: S[i], T, sc: scripted };
    S[i] = st || blank(); T = Infinity; scripted = false;
    setX(X0); setX(STEPS[i].enter || {}); setX(x || {});
    try {
      paint(i);
      return Object.assign({}, REC, { texts: Array.from(art.querySelectorAll('text')).map((n) => n.textContent) });
    } finally {
      setX(keep.X); S[i] = keep.S; T = keep.T; scripted = keep.sc;
      paint();
    }
  }
  function after(fn) { const keep = copyX(); try { setX(X0); fn(); return copyX(); } finally { setX(keep); } }
  const iD0 = idx('Drift or noise'), iS1 = idx('Its own baseline'), iD2 = idx('Which cell to watch'), iS3 = idx('The turn upward'), iD4 = idx('How far it has risen');
  const iS5 = idx('Where to draw the line'), iD6 = idx('Flag or replace'), iS7 = idx('The test decides'), iD8 = idx('Reading the test'), iS9 = idx('What the charging did');
  const iD10 = idx('Float set low'), iS11 = idx('What can still be done'), iD12 = idx('All together'), iD13 = idx('How unusual'), iD14 = idx('Boosted for weeks');
  const fin = (i) => drawn(i, solved(STEPS[i]), STEPS[i].end);
  const M_ = (o) => K.at(Object.assign({ step: iS3, q: 8, cell: FLAG, line: 'maker', hist: 'below' }, o));

  K.check('The healthy example cells start from 0.46 to 0.54 mΩ, and at every quarter the 23 beside cell 17 average 0.50 mΩ with an SD of 0.02 mΩ, each within 0.005 mΩ of its baseline', () => {
    const bs = HEALTHY.map((c) => B0[c]);
    if (Math.min(...bs) !== 0.46 || Math.max(...bs) !== 0.54) return false;
    for (let q = 0; q <= NQ; q++) {
      const v = HEALTHY.map((c) => RD[c][q]), m = avg(v);
      if (!K.near(m, 0.5, 1e-9) || !K.near(sdv(v, m), 0.02, 1e-9)) return false;
      if (HEALTHY.some((c) => Math.abs(RD[c][q] - B0[c]) > 0.005 + 1e-12)) return false;
    }
    return true;
  });
  K.check('Cell 17 stays within 0.005 mΩ of its 0.50 mΩ baseline for ten quarters, then climbs 0.02 mΩ a quarter: 0.60 mΩ at quarter 15 and 0.78 mΩ at quarter 24', () => {
    for (let q = 0; q <= FLAT; q++) if (Math.abs(RD[FLAG][q] - 0.5) > 0.005) return false;
    for (let q = FLAT + 1; q <= NQ; q++) if (!K.near(RD[FLAG][q] - RD[FLAG][q - 1], 0.02, 1e-12)) return false;
    return RD[FLAG][0] === 0.5 && RD[FLAG][FLAT] === 0.5 && K.near(RD[FLAG][15], 0.6, 1e-12) && K.near(RD[FLAG][24], 0.78, 1e-12) &&
      drawn(iS3, null, { q: 15 }).texts0 === '0.60 mΩ' && drawn(iS1, null, { q: 8 }).texts0 === '0.50 mΩ';
  });
  K.check('At quarter 15 cell 17 has risen (0.60 − 0.50) ÷ 0.50 = 20% from its baseline, its fitted slope is 0.020 mΩ a quarter, and it sits (0.60 − 0.50) ÷ 0.02 = 5.0 SDs from the other 23', () => {
    const a = M_({ q: 15 });
    return K.near(a.riseFromBase, 20, 1e-9) && K.near(a.slope, 0.02, 1e-9) && K.near(a.sdFromMean, 5, 1e-9) &&
      K.near(M_({ q: 24 }).riseFromBase, 56, 1e-9) && K.near(M_({ q: 0 }).riseFromBase, 0, 1e-12) && M_({ q: 0 }).slope === 0;
  });
  K.check('The fitted slope stays near zero while cell 17 is flat and reaches 0.020 mΩ a quarter once its last four readings lie on the climb. A healthy cell never moves 2% from its own baseline or 2.5 SDs from the rest', () => {
    for (let q = 0; q <= FLAT; q++) if (Math.abs(slopeOf(FLAG, q)) >= 0.003) return false;
    if (!K.near(slopeOf(FLAG, 14), 0.02, 1e-9) || !(slopeOf(FLAG, 12) > 0.005 && slopeOf(FLAG, 12) < 0.02)) return false;
    return HEALTHY.every((c) => { for (let q = 0; q <= NQ; q++) if (Math.abs(riseOf(c, q)) >= 2 || Math.abs(zOf(c, q)) >= 2.5) return false; return true; });
  });
  K.check('One maker finds a 20 percent increase in impedance for flooded lead-acid generally goes with 80% capacity: on cell 17 that line is 0.60 mΩ, first reached at quarter 15', () => {
    const a = drawn(iS5, null, { q: 15, line: 'maker', line2: null, lf: 1 }), b = drawn(iS5, null, { q: 14, line: 'maker', line2: null, lf: 1 });
    return K.near(B0[FLAG] * 1.2, 0.6, 1e-12) && crossAt(FLAG, 'maker') === 15 && a.flagged.join() === '17' && b.flagged.length === 0 && a.texts.indexOf('20% line') >= 0;
  }, { source: MEG });
  K.check('Deviations of 30% to 50% from baseline are given as an example of cause for concern: on cell 17 that band runs from 0.65 to 0.75 mΩ, entered at quarter 18', () =>
    K.near(B0[FLAG] * 1.3, 0.65, 1e-12) && K.near(B0[FLAG] * 1.5, 0.75, 1e-12) && crossAt(FLAG, 'guide') === 18 &&
    drawn(iS5, null, { q: 18, line: 'guide', line2: null, lf: 1 }).flagged.join() === '17' && drawn(iS5, null, { q: 17, line: 'guide', line2: null, lf: 1 }).flagged.length === 0, { source: VERT });
  K.check('Most cells had less than 80 percent capacity once impedance reached 150 percent of nominal: taking the baseline as nominal, that is 0.75 mΩ on cell 17, reached at quarter 23', () =>
    K.near(B0[FLAG] * 1.5, 0.75, 1e-12) && crossAt(FLAG, 'study') === 23 && drawn(iS5, null, { q: 23, line: 'study', line2: null, lf: 1 }).texts.indexOf('150% of nominal') >= 0, { source: EPRI });
  K.check('Two IEEE standards recommend replacing a battery below 80% of its rated capacity: on a 10-hour test at 200 Ah ÷ 10 h = 20 A that line falls at 8 hours, so 7.8 hours (78%) falls short and 8.5 hours (85%) does not', () =>
    K.near(LINE80, 8, 1e-12) && K.near(IT, 20, 1e-12) && K.near(hoursAt(15), 7.8, 1e-9) && pc(capOf(hoursAt(15))) === '78' && hoursAt(15) < LINE80 &&
    K.near(capOf(8.5), 85, 1e-9) && 8.5 > LINE80, { source: MEG });
  K.check('The test time holds at 9.7 hours (97%) up to quarter 10, then falls 0.38 hours a quarter, and the drawn clock stops at 7.8 hours at quarter 15, short of the line', () => {
    const a = drawn(iS7, null, { q: 15, th: hoursAt(15), sf: 1 }), b = drawn(iS7, null, { q: 8, th: hoursAt(8), sf: 1 }), c = drawn(iS7, null, { q: 15, th: 3, sf: 0 });
    return hoursAt(0) === 9.7 && hoursAt(FLAT) === 9.7 && K.near(hoursAt(11), 9.32, 1e-9) && K.near(capOf(9.7), 97, 1e-9) &&
      a.stop === '78%, short of the 80% line' && K.near(a.th, 7.8, 1e-9) && b.stop === '97%, above the 80% line' && c.stop === '' && a.texts.indexOf('7.8 h') >= 0;
  });
  K.check('Each charging history draws its own fault: crystals on the negative plate, acid sunk to the bottom, a thinning grid shedding lead, and gas leaving a drying valve-regulated cell', () => {
    const a = drawn(iS9, null, { hist: 'below', f: 1 }), b = drawn(iS9, null, { hist: 'low', f: 1 }), c = drawn(iS9, null, { hist: 'high', f: 1 }), e = drawn(iS9, null, { hist: 'vrla', f: 1 });
    return a.crystals >= 12 && a.flakes === 0 && a.strat === 0 && b.strat === 1 && b.crystals === 0 && c.flakes >= 10 && c.crystals === 0 &&
      e.bubbles > 0 && e.dry >= 20 && a.bubbles === 0 && drawn(iS9, null, { hist: 'below', f: 0 }).crystals === 0 && a.fault === 'sulphation' && e.fault === 'dry-out';
  });
  K.check('Sulphation can be reversed if serviced in time, but corrosion is permanent: the tags say so, and all four show at the end of their screen', () => {
    const t = drawn(iS11, null, { tg: 3.4 }), s = drawn(iS11, null, { tg: 0 });
    return t.tags === 4 && s.tags === 0 && t.texts.indexOf('Can be reversed if caught in time') >= 0 && t.texts.indexOf('Permanent') >= 0;
  }, { source: BU201 });
  K.check('The puzzles\' arithmetic: 0.07 ÷ 0.46 is about 15%; 0.10 ÷ 0.50 is 20%, not 120% or 0.10%; 0.06 ÷ 0.02 is 3 SDs; and a string that ages together keeps cell 9 at 0.3 SD', () =>
    Math.round(0.07 / 0.46 * 100) === 15 && K.near(0.53 - 0.46, 0.07, 1e-12) && K.near((0.6 - 0.5) / 0.5 * 100, 20, 1e-9) && K.near(0.6 / 0.5 * 100, 120, 1e-9) &&
    K.near((0.56 - 0.5) / 0.02, 3, 1e-9) && K.near(drawn(iD12).z9, 0.3, 1e-9) && STEPS[iD4].want === '20%');
  K.check('Each puzzle accepts only its right answer, and nothing in its picture gives the answer before Check', () => {
    const ok = STEPS.every((d) => d.show || (d.opts.length === 3 && new Set(d.opts).size === 3 && d.opts.indexOf(d.want) >= 0));
    const wants = STEPS.filter((d) => !d.show).map((d) => d.opts.indexOf(d.want));
    return ok && new Set(wants).size === 3 && drawn(iD0).chev === 0 && fin(iD0).chev === 6 && !drawn(iD2).moved && fin(iD2).moved && !drawn(iD4).rb && fin(iD4).rb &&
      !drawn(iD6).box && fin(iD6).box && drawn(iD8).stop === '' && fin(iD8).stop.indexOf('85%') >= 0 && drawn(iD10).crystals === 0 && fin(iD10).crystals >= 12 &&
      !drawn(iD12).own && fin(iD12).own && !drawn(iD13).sds && fin(iD13).sds && drawn(iD14).bubbles === 0 && fin(iD14).bubbles > 0 && STEPS[iD4].hide.indexOf('riseFromBase') >= 0;
  });
  K.check('Fifteen screens: puzzles and demonstrations take turns, three mixed puzzles end it, and no demonstration says more than about 90 words', () =>
    STEPS.length === 15 && STEPS.every((d, k) => !!d.show === ([1, 3, 5, 7, 9, 11].indexOf(k) >= 0)) && STEPS.every((d) => !d.show || d.read.split(/\s+/).length <= 92));
  K.check('Every demonstration settles within 4.4 s and ends where its screen says, and every answer\'s motion settles within 2.5 s', () => {
    const keys = ['q', 'cell', 'line', 'line2', 'lf', 'cf', 'hist', 'f', 'th', 'sf', 'ef', 'rb', 'tg', 'tsc'];
    const same = (s, f) => keys.every((k) => (typeof s[k] === 'number' && typeof f[k] === 'number' ? K.near(s[k], f[k], 1e-9) : s[k] === f[k]));
    return STEPS.every((d) => {
      if (!d.show) return d.run.dur <= 2.5 && same(after(() => { setX(d.enter || {}); d.run.go(1); }), after(() => { setX(d.enter || {}); setX(d.end || {}); }));
      return d.dur <= 4.4 && same(after(() => { setX(d.enter || {}); d.play(d.dur); }), after(() => { setX(d.enter || {}); setX(d.end || {}); }));
    });
  });

  K.ready();
</script>
