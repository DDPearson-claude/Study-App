<p class="caption">The 12 V block and the 480 V string are real. The cable, the device and the other cases are examples.</p>

<script>
  // ---------- the rule ----------
  const RANGE = 'https://www.enersys.com/493bb4/globalassets/documents/product-documentation/powersafe/v-tt/emea/en-v-rs-013.pdf';
  const VERTIV = 'https://www.vertiv.com/48dfcf/globalassets/documents/battcon-static-assets/2003/calculated-vs.-actual-short-circuit-currents-for-vrla-batteries.pdf';
  const BU303 = 'http://www.batteryuniversity.com/article/bu-303-confusion-with-voltages';
  const BU203 = 'https://batteryuniversity.com/article/bu-203-nickel-based-batteries';
  const BU204 = 'https://batteryuniversity.com/article/bu-204-how-do-lithium-batteries-work';
  const MEGGER = 'https://res.cloudinary.com/iwh/image/upload/q_auto,g_center/assets/1/7/Megger_Battery_Testing_Guide.pdf';
  const NC = 6, VC = 2.1, VB = NC * VC;                  // the block: six cells at 2.1 V give 12.6 V open circuit
  const VNOM = 12, RB = 6.95, MAKER = 1814;              // its nominal volts, its internal resistance (mΩ), the maker's short-circuit current (A)
  const RCORE = 0.5, RPM = 2 * RCORE;                    // example cable: 0.5 mΩ a metre each core, both cores in the loop: 1 mΩ a metre of route
  const DEV = 1000;                                      // example device: breaks 1 kA
  const VBIG = 480, RBIG1 = 0.160, RBIG2 = 0.028, RBIG = (RBIG1 + RBIG2) * 1000;   // the real 480 V string's loop (mΩ)
  const SOC_LO = 60, KEEP = 0.92;                        // sketch: 92% of the full-charge fault at 60% charge, in a straight line
  const T_FULL = 5, T_END = 20;                          // sketch: full current by 5 ms, trace to 20 ms
  const N48 = 24, R48 = 1.5, RL48 = 0.1;                 // example 48 V string: 24 cells of 1.5 mΩ, links of 0.1 mΩ
  const V48 = N48 * VC, RC48 = N48 * R48, RLK48 = (N48 - 1) * RL48;
  const NE = 12, VE = NE * VC, RE = 14, DE = 2;          // example 24 V emergency battery: 12 cells, 14 mΩ with links, fault 2 m down
  const PFC = 3;                                         // recall: prospective fault current, kA
  const VLA = 2, VNI = 1.2, VLI = 3.6, VT = 24;          // cell voltages, and the 24 V target
  const NB = ' ';
  const share = (soc) => 1 - (1 - KEEP) * (100 - soc) / (100 - SOC_LO);
  const cellsFor = (v) => Math.ceil(VT / v - 1e-9);
  const q1 = (v) => Math.round(v * 10) / 10;
  const ez = (x) => K.ease(K.clamp(x, 0, 1));
  const fI = (v) => String(Math.round(v));
  const fR = (v) => v.toFixed(2);
  const nM = (v) => { const r = Math.round(v * 2) / 2; return r % 1 ? r.toFixed(1) : String(r); };

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  const W1 = 'A real 12 V block holds six cells in one case. Each cell is an emf behind a small resistance. Together they read 12.6 V open circuit, with 6.95 mΩ inside. ' +
    'Short the terminals, and that resistance alone holds the current back. So the *short-circuit current* is the open-circuit voltage ÷ the internal resistance. ' +
    'Here that is 12.6 ÷ 0.00695 = 1813 A. The maker lists 1814 A for this block. That is far above the device\'s 1 kA. With the fault across the terminals, 1813 A flows.';
  const W3 = 'With the fault further down the cable, both cores join the loop, out and back. So the current is the voltage ÷ (the battery\'s resistance + the outside resistance). ' +
    'The battery\'s milliohms are fixed. Only the loop outside can add more. Each core has 0.5 mΩ a metre, so each metre adds 1 mΩ. ' +
    'At 5 m the loop is 6.95 + 5 = 11.95 mΩ. So 12.6 ÷ 0.01195 = 1054 A flows, still above the device\'s 1 kA.';
  const W5 = 'The same rule works for a real 480 V string. The cells\' resistance and the links between them set the most a battery can drive. This string\'s loop adds up to 0.160 + 0.028 Ω. ' +
    'So the rule predicts 480 ÷ 0.188 = 2553 A, about 2550 A. A real test on that string measured 2530 A. ' +
    'A shorted battery can give 100 to 1000 times its normal discharge current. Here the big string drives 2553 A.';
  const W7 = 'Let the charge fall from 100% to 60%, and the fault current barely moves. A cell\'s rested voltage falls only a little as its charge goes. The milliohms stay milliohms. ' +
    'In tests on real batteries, the current stayed above 90% of its full-charge value at about 60% charge. So a part-discharged battery can still give nearly its full fault. ' +
    'In this sketch, the block still drives 1668 A at 60% charge.';
  const W9 = 'The trace shows the current from the moment of the fault. A battery has little inductance, so a short acts like a fault through a plain resistor. ' +
    'The current reaches its full value within 5 to 10 ms. The cells cannot be switched off either. Their exposed metal is always live. ' +
    'Switching off the charger and the loads stops their currents. The cells keep their voltage.';
  const W11 = 'Other chemistries obey the same fault rule, but their cells differ. Lithium-ion brings a new hazard, *thermal runaway*. ' +
    'A cell\'s own heat speeds its reactions, and they make more heat. The card sets all three side by side.';
  const O0_RATED = 'At least its rated current', O0_3K = 'At least 3 kA, the most it may have to break there', O0_CABLE = 'At least the cable\'s current rating';
  const O2_BIG = 'Up to about 1800 A, held back only by the block\'s milliohms and the spanner', O2_LOW = 'Very little, because 12 V is too low to push much current', O2_AH = 'About 70 A, the block\'s ampere-hour rating';
  const O8_60 = 'Yes: it falls to about 60% of the full-charge fault', O8_90 = 'No: its fault current is still over 90% of the full-charge value', O8_EN = 'Yes: a part-charged battery holds too little energy for a big current';
  const O10_MAIN = 'Open the battery\'s main switch, and then the cells are dead', O10_ONE = 'Nothing, because each link spans only one cell\'s 2.1 V', O10_OFF = 'Switch off the circuits on the battery, and keep metal tools off its top';
  const O12_NONE = 'Nothing about the charge, because the electrolyte is not used up in the reaction', O12_SAME = 'The charge, read the same way as lead-acid', O12_LOW = 'The charge, on a lower scale';
  const O13_LOW = 'Yes: about 1.6 A, far below 1 kA', O13_NO = 'No: about 1575 A, above 1 kA', O13_PART = 'Yes: at 60% charge, about 945 A, below 1 kA';
  const O14_12 = '12 cells, checked with a hydrometer', O14_20 = '20 cells, and no hydrometer', O14_7 = '7 cells, and no hydrometer';
  const HIDE = ['faultCurrent', 'loopResistance'];
  const fade = (u) => { X.bf = ez(u / 0.8); };
  const STEPS = [
    { name: 'Breaking capacity', pic: 'recall', enter: { rf: 0 }, end: { rf: 1 },
      run: { dur: 1.6, go: (u) => { X.rf = ez(u / 0.8); } },
      task: 'A protective device sits where the prospective fault current is 3 kA. What must its breaking capacity be?',
      opts: [O0_RATED, O0_3K, O0_CABLE], want: O0_3K, right: 'Still there: a device must break the biggest fault it can see where it sits.',
      hint: 'Not quite. Think about the biggest current it may have to interrupt.',
      hints: { [O0_RATED]: 'Not quite. That sets when it trips on overload, not what it can safely break.', [O0_CABLE]: 'Not quite. That is what the cable carries all day, far below a fault.' },
      why: 'Breaking capacity is the biggest current a device can safely interrupt. A fault just past it can draw the prospective fault current, 3 kA here. So the device must break at least 3 kA. Its rated current and the cable\'s rating are about everyday load, far smaller.' },
    { show: true, name: 'A short at the terminals', pic: 'fault', enter: { d: 0, on: 0 }, end: { on: 1 }, still: { d: 0 }, dur: 3.0,
      play: (t) => { X.on = ez((t - 0.5) / 2.0); },
      text: W1, read: W1 },
    { name: 'A spanner across it', pic: 'fault', tool: 'spanner', enter: { d: 0, bf: 0 }, end: { bf: 1 }, hide: HIDE,
      run: { dur: 1.6, go: fade },
      task: 'You lay a steel spanner across the terminals of the same 12 V block. What flows?',
      opts: [O2_BIG, O2_LOW, O2_AH], want: O2_BIG, right: 'That\'s it: 12.6 V across a few milliohms is well over a thousand amps.',
      hint: 'Not quite. Think about what holds the current back.',
      hints: { [O2_LOW]: 'Not quite. Your body\'s resistance is high, so 12 V drives little current through you. A spanner\'s resistance is tiny.', [O2_AH]: 'Not quite. Ampere-hours say how long a battery lasts, not how hard it can push.' },
      why: 'The spanner joins the terminals with almost no resistance. So the block\'s own 6.95 mΩ is nearly all that holds the current back. 12.6 ÷ 0.00695 is about 1800 A. A low voltage only means a small current through a high resistance, like your body. That current makes the spanner very hot very quickly. It can explode in a shower of molten metal, which burns and can light hydrogen.' },
    { show: true, name: 'Down the cable', pic: 'fault', ctl: ['d'], enter: { d: 0 }, end: { d: 5 }, still: { d: 5 }, dur: 4.0,
      play: (t) => { X.d = 5 * ez((t - 0.6) / 3.0); },
      text: W3 + ' Drag the fault, or its slider, to try it.', read: W3 },
    { name: 'Ten metres down', pic: 'fault', enter: { d: 10, bf: 0 }, end: { bf: 1 }, hide: HIDE,
      run: { dur: 1.6, go: fade },
      task: 'A fault happens 10 m down the same cable. What is the fault current?',
      opts: ['1260 A', '1813 A', '743 A'], want: '743 A', right: 'That\'s it: 12.6 ÷ (0.00695 + 0.010) = 743 A.',
      hint: 'Not quite. Add the battery\'s resistance and the cable\'s.',
      hints: { '1260 A': 'Not quite. That is 12.6 ÷ 0.010, the cable alone. The battery\'s 6.95 mΩ is in the loop too.', '1813 A': 'Not quite. That is the fault at the terminals, before the cable adds its 10 mΩ.' },
      why: 'Ten metres of route puts both cores in the loop, out and back. At 0.5 mΩ a metre each, they add 10 mΩ. The loop is 6.95 + 10 = 16.95 mΩ. So the current is 12.6 ÷ 0.01695 = 743 A. That is now below the device\'s 1 kA.' },
    { show: true, name: 'A big string', pic: 'fault', ctl: ['big'], enter: { d: 0, big: false, mix: 0 }, end: { big: true, mix: 1 }, still: { big: true }, dur: 3.2,
      play: (t) => { X.mix = ez((t - 1.0) / 1.2); X.big = X.mix >= 0.5; },
      text: W5 + ' Switch the big string on and off to compare.', read: W5 },
    { name: 'A 48 V string', pic: 's48', enter: { sf: 0 }, end: { sf: 1 },
      run: { dur: 1.6, go: (u) => { X.sf = ez(u / 0.8); } },
      task: 'A 48 V string has 24 cells at 2.1 V, each with 1.5 mΩ inside. Its 23 links between cells add 0.1 mΩ each. These are example values. What flows in a fault across its terminals?',
      opts: ['1316 A', '1400 A', '33600 A'], want: '1316 A', right: 'That\'s it: 50.4 V ÷ (36 + 2.3) mΩ = 1316 A.',
      hint: 'Not quite. Add every resistance the one current passes.',
      hints: { '1400 A': 'Not quite. The links carry the fault current too, so their 2.3 mΩ belongs in the loop.', '33600 A': 'Not quite. In a string, one current flows through every cell. So the cells\' resistances add.' },
      why: 'One current flows through every cell, so the resistances add. The cells give 24 × 1.5 = 36 mΩ. The links add 23 × 0.1 = 2.3 mΩ. The open-circuit voltage is 24 × 2.1 = 50.4 V. So the current is 50.4 ÷ 0.0383 = 1316 A.' },
    { show: true, name: 'Running down', pic: 'fault', band: true, ctl: ['soc'], enter: { d: 0, soc: 100 }, end: { soc: 60 }, still: { soc: 60 }, dur: 4.0,
      play: (t) => { X.soc = 100 - 40 * ez((t - 0.6) / 3.0); },
      text: W7 + ' Drag the charge left to try it.', read: W7 },
    { name: 'Run down to 60%', pic: 'fault', band: true, enter: { d: 0, soc: 60, bf: 0 }, end: { bf: 1 }, hide: HIDE,
      run: { dur: 1.6, go: fade },
      task: 'A UPS battery has run down to about 60% charge. Someone says a short on it now would be small. Are they right?',
      opts: [O8_60, O8_90, O8_EN], want: O8_90, right: 'That\'s it: the volts barely fall and the milliohms stay, so the current stays high.',
      hint: 'Not quite. Think about what sets the current.',
      hints: { [O8_60]: 'Not quite. The current follows the voltage, not the charge left. The voltage barely falls.', [O8_EN]: 'Not quite. Energy sets how long it could keep going, not how many amps flow at once.' },
      why: 'The fault current is the voltage ÷ the loop resistance. As the charge falls, the rested voltage drops only a little. The milliohms stay milliohms. So the current hardly changes. In tests it stayed above 90% of its full-charge value at about 60% charge.' },
    { show: true, name: 'At once, and always live', pic: 'trace', ctl: ['d'], enter: { d: 0, tm: 0 }, end: { tm: T_END }, still: { d: 0 }, dur: 4.0,
      play: (t) => { X.tm = T_END * K.clamp((t - 0.4) / 3.4, 0, 1); },
      text: W9 + ' Drag the fault along the cable, and the trace follows.', read: W9 },
    { name: 'A loose link', pic: 'link', enter: { lf: 0 }, end: { lf: 1 },
      run: { dur: 1.8, go: (u) => { X.lf = ez(u / 0.85); } },
      task: 'You must remake a loose link between two cells in a live string. What comes first?',
      opts: [O10_MAIN, O10_ONE, O10_OFF], want: O10_OFF, right: 'That\'s it: switch off all circuits before connecting or disconnecting, and rest no metal on a battery.',
      hint: 'Not quite. Think about what a switch can and cannot make dead.',
      hints: { [O10_MAIN]: 'Not quite. A switch stops current in the circuits, but the cells keep their voltage.', [O10_ONE]: 'Not quite. Your spanner can bridge more than one cell. Even one cell can drive over a thousand amps through metal.' },
      why: 'Switching off the circuits stops the charger\'s and the loads\' currents. It does not make the cells dead. Their exposed metal is always live. So keep tools off the top, where a spanner could bridge two terminals. Use insulated tools, and work on one connection at a time.' },
    { show: true, name: 'Other chemistries', pic: 'chem', enter: { cf: 0 }, end: { cf: 3 }, dur: 3.0,
      play: (t) => { X.cf = 3 * K.clamp((t - 0.3) / 2.1, 0, 1); },
      text: W11, read: W11 },
    { name: 'Nickel-cadmium charge', pic: 'hydro', enter: { hf: 0 }, end: { hf: 1 },
      run: { dur: 1.6, go: (u) => { X.hf = ez(u / 0.8); } },
      task: 'A nickel-cadmium battery needs its charge checked, and a hydrometer is to hand. What will the hydrometer tell you?',
      opts: [O12_NONE, O12_SAME, O12_LOW], want: O12_NONE, right: 'That\'s it: the alkali carries the current but is not used up, so its strength stays put.',
      hint: 'Not quite. Think about whether the liquid changes as the cell discharges.',
      hints: { [O12_SAME]: 'Not quite. Lead-acid\'s acid is used up on discharge. That change is what a hydrometer reads.', [O12_LOW]: 'Not quite. Any scale needs a reading that changes with charge. This one does not.' },
      why: 'In a lead-acid cell, the acid takes part in the reaction. Discharge uses it up, so the liquid thins and the float sinks. A nickel-cadmium cell\'s potassium hydroxide only carries the current. Its strength stays the same at any charge. So the float reads the same, full or part charged.' },
    { name: 'Can it clear it?', pic: 'fault', src: 'em24', enter: { d: DE, bf: 0 }, end: { bf: 1 }, hide: HIDE,
      run: { dur: 1.6, go: fade },
      task: 'A 24 V emergency battery has 12 lead-acid cells at 2.1 V and 14 mΩ in total, links included. A fault 2 m down its cable adds 2 mΩ. The device there can break 1 kA. These are example values. Can the device clear the fault?',
      opts: [O13_LOW, O13_NO, O13_PART], want: O13_NO, right: 'That\'s it: 25.2 V across 16 mΩ is 1575 A, more than the device can break.',
      hint: 'Not quite. Work out the voltage and the whole loop first.',
      hints: { [O13_LOW]: 'Not quite. 16 mΩ is 0.016 Ω, so the current is a thousand times bigger.', [O13_PART]: 'Not quite. At 60% charge it would still give over 90% of that, not 60%.' },
      why: 'Twelve cells at 2.1 V give 25.2 V. The loop is the battery\'s 14 mΩ plus the cable\'s 2 mΩ, which makes 16 mΩ. So the current is 25.2 ÷ 0.016 = 1575 A. A device that breaks only 1 kA cannot clear it safely.' },
    { name: 'A lithium-ion pack', pic: 'li', enter: { lc: 0 }, end: { lc: 1 },
      run: { dur: 2.0, go: (u) => { X.lc = K.clamp(u / 0.85, 0, 1); } },
      task: 'A pack of 3.60 V lithium-ion cells is to replace that 24 V lead-acid battery. How many cells in series does it need, and can a hydrometer check its charge?',
      opts: [O14_12, O14_20, O14_7], want: O14_7, right: 'That\'s it: 7 × 3.60 V = 25.2 V, and its cells are sealed.',
      hint: 'Not quite. Divide 24 V by the volts of one cell, and round up.',
      hints: { [O14_12]: 'Not quite. That count suits lead-acid\'s 2 V a cell.', [O14_20]: 'Not quite. That count suits nickel-cadmium\'s 1.20 V a cell.' },
      why: 'Each lithium-ion cell gives 3.60 V. Six would fall short of 24 V, so it takes 7, which make 25.2 V. Its cells are sealed, so there is no liquid to draw off. A hydrometer has nothing to read.' },
  ];
  const I13 = STEPS.findIndex((d) => d.src === 'em24');
  const FINISH = 'A large battery is an emf behind a few milliohms. So it drives thousands of amps into a short, even part discharged, and its cells are always live.';
  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const testing = () => document.documentElement.classList.contains('k-testing');
  const quiet = () => REDUCE || testing();
  const el = (id) => document.getElementById(id);

  // The fault current: the source's open-circuit voltage ÷ (its resistance + the cable out and back).
  function srcOf(p) { return p.step === I13 ? 'em' : p.big ? 'big' : 'block'; }
  function loopOf(p) { const s = srcOf(p); return s === 'big' ? RBIG : (s === 'em' ? RE : RB) + RPM * p.d; }   // mΩ; the big string's fault rests at 0 m
  function modelOf(p) {
    const s = srcOf(p), R = loopOf(p), V = s === 'big' ? VBIG : s === 'em' ? VE : VB;
    return { faultCurrent: V / (R / 1000) * share(p.soc), loopResistance: R };
  }

  // ---------- state ----------
  function blank() { return { pick: null, res: null, why: false }; }
  let S = STEPS.map(blank);
  const BASE = { d: 0, soc: 100, big: false, mix: 0, on: 1, bf: 1, tm: T_END, rf: 1, sf: 1, lf: 1, hf: 1, lc: 1, cf: 3, ph: 0 };
  const X = {};
  const setX = (o) => Object.assign(X, o);
  const copyX = () => Object.assign({}, X);
  setX(BASE);
  let T = Infinity, scripted = false, lastStep = -1, finished = false, lastDone = false;
  let REC = {}, laidOut = '', drift = 0;
  const DRIFT = 1.6;

  // ---------- controls ----------
  const stepper = K.stepper({ id: 'step', label: 'Screen', steps: STEPS.map((d) => d.name), value: 0, compact: true, into: '#prog' });
  const at = () => K.clamp(Math.round(stepper.get()) || 0, 0, STEPS.length - 1);
  const CTL = {
    d: K.control({ id: 'd', label: 'Fault distance', min: 0, max: 20, step: 0.5, value: 0, fmt: (v) => nM(v) + NB + 'm', snap: [0, 5, 10], into: '#c-d' }),
    soc: K.control({ id: 'soc', label: 'Charge left', min: SOC_LO, max: 100, step: 5, value: 100, fmt: (v) => Math.round(v) + '%', snap: [60, 100], into: '#c-soc' }),
    big: K.toggle({ id: 'big', label: 'Big string', value: false, into: '#c-big' }),
  };
  const CKEYS = ['d', 'soc', 'big'];
  const KEYS = { d: () => Math.round(X.d * 2) / 2, soc: () => Math.round(X.soc / 5) * 5, big: () => !!X.big };
  const pushed = {};
  Object.keys(CTL).forEach((k) => { pushed[k] = CTL[k].get(); });
  // The page moves the controls itself during a demonstration (silently, so it is not taken for Dan's move).
  function push() { Object.keys(KEYS).forEach((k) => { const v = KEYS[k](); if (pushed[k] !== v) { CTL[k].set(v, true); pushed[k] = CTL[k].get(); } }); }
  const paramsX = () => ({ step: at(), d: X.d, soc: X.soc, big: X.big });
  const ctlOn = (d, k) => !!(d.ctl && d.ctl.indexOf(k) >= 0);

  K.model(modelOf);

  // A puzzle's answer stays a "?" in its readout until Check says it is right.
  function hid(id) { const d = STEPS[at()]; return !!(d && !d.show && d.hide && d.hide.indexOf(id) >= 0 && S[at()].res !== 'right'); }
  const R = {
    faultCurrent: K.readout({ id: 'faultCurrent', label: 'Fault current', decimals: 0, fmt: (v) => (hid('faultCurrent') ? '?' : fI(v) + NB + 'A'), into: '#outs' }),
    loopResistance: K.readout({ id: 'loopResistance', label: 'Loop resistance', decimals: 2, fmt: (v) => (hid('loopResistance') ? '?' : fR(v) + NB + 'mΩ'), into: '#outs' }),
  };
  function outs() { const o = modelOf(paramsX()); R.faultCurrent.set(o.faultCurrent); R.loopResistance.set(o.loopResistance); }

  const pickBtns = [0, 1, 2].map((k) => K.button({ label: 'Answer ' + (k + 1), secondary: true, into: '#picks', press: () => {
    const i = at(), d = STEPS[i], st = S[i];
    if (finished || d.show || k >= d.opts.length || st.res === 'right') return;
    st.pick = d.opts[k]; st.res = null;
  } }));
  const checkBtn = K.button({ label: 'Check', into: '#acts', press: () => {
    const i = at(), d = STEPS[i], st = S[i];
    if (finished || d.show || st.res === 'right') return;
    if (st.pick == null) { st.res = 'empty'; return; }
    st.res = st.pick === d.want ? 'right' : 'wrong';
    if (st.res !== 'right') { T = Infinity; return; }
    if (quiet()) { T = Infinity; setX(d.end || {}); push(); }
    else { T = 0; anim.play(); }
  } });
  const whyBtn = K.button({ label: 'Why?', secondary: true, into: '#acts', press: () => {
    const d = STEPS[at()];
    if (d.show || finished) return;

  } });
  const replayBtn = K.button({ label: 'Play again', secondary: true, into: '#replay', press: () => {
    if (!STEPS[at()].show || finished) return;

  } });
  const backBtn = K.button({ label: 'Back', secondary: true, into: '#nav', press: () => {
    if (finished) { finished = false; return; }

  } });
  const nextBtn = K.button({ label: 'Continue', into: '#nav', press: () => {
    const i = at();
    if (finished || (!STEPS[i].show && S[i].res !== 'right')) return;
    if (i < STEPS.length - 1) { stepper.set(i + 1, true); return; }
    finished = true; anim.pause();
    if (typeof K.complete === 'function') K.complete();
  } });
  K.button({ label: 'Start again', secondary: true, into: '#again', press: () => {
    S = STEPS.map(blank); finished = false; lastStep = -1; stepper.set(0, true);
  } });

  // ---------- motion: one animation runs each demonstration, each answer's motion, and the flow after Dan's own moves ----------
  const motionEnd = (d, st) => (d.show ? (scripted ? d.dur : 0) : st.res === 'right' ? d.run.dur : 0);
  const approach = (v, to, s) => (Math.abs(to - v) <= s ? to : v + Math.sign(to - v) * s);
  const anim = K.anim({ button: false, label: 'Demonstration', step: (dt) => {
    if (finished) return false;
    const i = at(), d = STEPS[i], st = S[i];
    T += dt;
    X.ph += dt;
    if (scripted) { d.play(Math.min(T, d.dur)); if (T >= d.dur) scripted = false; }
    const running = !d.show && st.res === 'right' && T < d.run.dur + dt;
    if (running) d.run.go(Math.min(1, T / d.run.dur));
    let busy = false;
    if (!scripted && !running) {
      X.mix = approach(X.mix, X.big ? 1 : 0, dt / 0.8);
      if (drift > 0) { drift = Math.max(0, drift - dt); busy = drift > 0; }

  } });
  const pending = () => T !== Infinity || drift > 0;
  // A motion that was stopped (the page hidden, a test) shows finished.
  function finishNow(d, st) {

    drift = 0; T = Infinity; push();
  }
  function startDrift() {

  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !anim.playing() && pending()) { finishNow(STEPS[at()], S[at()]); outs(); paint(); } });
  function enter(id) {
    if (REDUCE) return;
    const box = el(id);
    box.classList.remove('enter'); void box.offsetWidth; box.classList.add('enter');
  }
  function enterStep(i) {

    setX(BASE); setX(d.enter || {});
    drift = 0;
    if (!d.show && st.res === 'right') setX(d.end || {});
    if (d.show && !quiet()) { scripted = true; T = 0; d.play(0); push(); anim.play(); }

  // ---------- drawing ----------
  const svg = el('scene'), art = el('art'), grab = el('grab');

  const add = (n) => (into || art).appendChild(n);
  const S_ = (tag, a) => add(K.svg(tag, a));
  function txt(x, y, s, cls, anchor) {

    if (cls) a.class = cls;

  }
  function part(a, fn) { if (a <= 0.001) return; const g = add(K.svg('g')); K.fade(g, Math.min(1, a), 0); const keep = into; into = g; fn(); into = keep; }
  function chevrons(runs, I) {
    let n = 0;
    runs.forEach((r) => {
      const vert = r.x1 === r.x2, len = vert ? Math.abs(r.y2 - r.y1) : Math.abs(r.x2 - r.x1);

      const m = Math.max(1, Math.floor(len / 26));

        S_('path', { class: 'flow', d: 'M-3.5 -4.5L1.5 0L-3.5 4.5', opacity: r1(0.35 + 0.65 * Math.sin(Math.PI * u)), transform: 'translate(' + r1(x) + ' ' + r1(y) + ') rotate(' + rot + ')' });

  }

  // The battery: its cells drawn in series in one case, each an emf behind a small resistance.
  const TY = 46, BY = 136, RY = (k) => TY + 18 * k, X0 = 160, PXM = 8.5;
  const BX = (I) => 8 + I * 0.108;                     // the bar: 324 units for 3000 A
  function drawCase(kind) {
    const n = kind === 'block' ? 1 : kind === 'em' ? 2 : 3;
    const rows = kind === 'big' ? [0, 1, 4, 5] : [0, 1, 2, 3, 4, 5];
    txt(56, 20, kind === 'block' ? VNOM + ' V block' : kind === 'em' ? VT + ' V battery' : VBIG + ' V string', 'ttl');
    S_('rect', { class: 'case', x: 6, y: 30, width: 100, height: 122, rx: 6 });

    [[1, 2], [3, 4]].forEach(([a, b]) => { if (rows.indexOf(a) >= 0 && rows.indexOf(b) >= 0) p += 'M96 ' + RY(a) + 'V' + RY(b); });

        S_('line', { class: 'plate', x1: r1(shortAt), y1: y - 4, x2: r1(shortAt), y2: y + 4, 'stroke-width': 3.5 });
        S_('rect', { class: 'res', x: r1(sx + 0.5 * seg), y: y - 3.5, width: r1(0.38 * seg), height: 7, rx: 1 });
      }
    });
    let l1, l2;
    if (kind === 'block') { const s = Math.round(X.soc / 5) * 5; l1 = s >= 100 ? VB.toFixed(1) + ' V' : 'charge left ' + s + '%'; l2 = RB + ' mΩ inside'; }
    else if (kind === 'em') { l1 = VE.toFixed(1) + ' V'; l2 = RE + ' mΩ in all'; }
    else { l1 = VBIG + ' V'; l2 = RBIG1.toFixed(3) + ' + ' + RBIG2.toFixed(3) + ' Ω'; }
    txt(56, 170, l1);
    txt(56, 186, l2, 'lbm');
  }

  function drawFault(d, st) {
    const trace = d.pic === 'trace', spanner = d.tool === 'spanner', kind = d.src === 'em24' ? 'em' : 'block';
    const mix = kind === 'em' ? 0 : X.mix;

    if (mix > 0.001) part(mix, () => drawCase('big'));
    const dd = X.big ? 0 : X.d;

    txt(116, TY - 11, '+', 'sg');
    txt(116, BY + 21, '−', 'sg');
    let runs;
    if (spanner) {

      S_('circle', { class: 'ring', cx: 121, cy: TY, r: 4 });
      S_('circle', { class: 'ring', cx: 121, cy: BY, r: 4 });

    } else {
      S_('path', { class: 'core', d: 'M112 ' + TY + 'H122M154 ' + TY + 'H334M112 ' + BY + 'H334' });
      S_('rect', { class: 'devbox', x: 122, y: TY - 9, width: 32, height: 18, rx: 3 });
      txt(138, 74, 'device', 'lbm');
      txt(247, 160, 'cores: ' + RCORE + ' mΩ a metre', 'lbm');
      if (linkA > 0.001) part(linkA, () => {
        S_('line', { class: 'fl', x1: r1(xf), y1: TY, x2: r1(xf), y2: BY });
        if (xf < 290) txt(xf + 8, 92, 'fault', 'wl', 'start'); else txt(xf - 8, 92, 'fault', 'wl', 'end');
      });

      S_('path', { class: 'brace', d: 'M' + X0 + ' 106V114H' + r1(Math.max(X0 + 0.5, xf)) + 'V106' });
      if (w >= 44) txt(X0 + w / 2, 126, nM(dd) + ' m');
      else if (xf < 290) txt(xf + 8, 126, nM(dd) + ' m', null, 'start');
      else txt(xf - 8, 126, nM(dd) + ' m', null, 'end');
      runs = [{ x1: 158, y1: TY, x2: xf - 5, y2: TY }, { x1: xf, y1: TY + 8, x2: xf, y2: BY - 8 }, { x1: xf - 5, y1: BY, x2: 116, y2: BY }];

      S_('circle', { class: 'head', cx: r1(xT(tm)), cy: r1(yI(Iat(tm))), r: 4 });
      if (tm > T_FULL) part(K.clamp((tm - T_FULL) / 2, 0, 1), () => txt(116, hot ? yI(I) - 7 : yI(I) + 16, 'fault current', 'cv', 'start'));
      S_('path', { class: 'amb', d: 'M40 306V310H' + xT(T_FULL) + 'V306' });
      txt(xT(T_FULL / 2) + 18, 324, 'sketch: full by ' + T_FULL + ' ms', 'lbm');
      txt(322, 324, T_END + ' ms', 'lbm', 'end');
      REC.trace = Iat(tm); REC.traceFullAt5 = K.near(Iat(T_FULL), I, 1e-9) && K.near(Iat(T_END), I, 1e-9) && Iat(2.5) < I;

      ' The fault current bar runs ' + (hot ? 'past' : 'short of') + ' the device\'s 1 kA line.';
    return who + ', each cell an emf behind a small resistance. ' + where + then;
  }

  // Recall: a device where the prospective fault current is 3 kA.

  }

  // The example 48 V string: 24 cells in series, 23 links, a fault across its terminals.
  function drawS48() {
    const a = X.sf, cx = (i) => 40 + 24 * i, I = V48 / ((RC48 + RLK48) / 1000);
    txt(176, 22, N48 + ' cells, ' + R48 + ' mΩ each');
    [44, 100].forEach((y) => {
      for (let i = 0; i < 12; i++) S_('rect', { class: 'cell', x: cx(i), y: y - 11, width: 18, height: 22, rx: 2 });

  // ---------- words: *a key term* is highlighted ----------

    else {

    }

  // ---------- known answers, worked out by hand ----------
  const idx = (name) => STEPS.findIndex((d) => d.name === name);
  const solved = (d) => Object.assign(blank(), { pick: d.want, res: 'right' });
  // A step painted in the state given: what it draws.
  function drawn(i, st, x) {
    const keep = { X: copyX(), S: S[i], T, sc: scripted };

  const iD0 = idx('Breaking capacity'), iS1 = idx('A short at the terminals'), iD2 = idx('A spanner across it'), iS3 = idx('Down the cable'), iD4 = idx('Ten metres down');
  const iS5 = idx('A big string'), iD6 = idx('A 48 V string'), iS7 = idx('Running down'), iD8 = idx('Run down to 60%'), iS9 = idx('At once, and always live');

  const M_ = (o) => K.at(Object.assign({ step: iS3, d: 0, soc: 100, big: false }, o));

  K.check('The maker lists 1814 A short-circuit current and 6.95 mΩ for its 12 V 70 Ah block: six cells give 12.6 ÷ 0.00695 = 1813 A, within 1 A of it', () =>
    K.near(VB, 12.6, 1e-9) && Math.round(M_({ d: 0 }).faultCurrent) === 1813 && Math.abs(Math.round(M_({ d: 0 }).faultCurrent) - MAKER) <= 1, { source: RANGE });
  K.check('A charged, rested lead-acid cell reads 2.1 V open circuit: six make the block\'s 12.6 V and twelve make 25.2 V', () =>
    K.near(NC * 2.1, 12.6, 1e-9) && K.near(NE * 2.1, 25.2, 1e-9) && drawn(iS1, null, { on: 1 }).texts.indexOf('12.6 V') >= 0, { source: BU303 });
  K.check('A battery\'s short-circuit current is estimated by dividing its open-circuit voltage by its internal resistance: with the fault at the terminals the loop is the block\'s 6.95 mΩ alone', () =>
    K.near(M_({ d: 0 }).loopResistance, 6.95, 1e-9) && K.near(M_({ d: 0 }).faultCurrent, 12.6 / 0.00695, 1e-6), { source: VERTIV });
  K.check('The cable adds 1 mΩ a metre of route: 5 m gives 11.95 mΩ and 1054 A, still above 1 kA; 10 m gives 743 A, below it; the cable alone at 10 m would give 1260 A; the current falls with every half metre', () => {

  });
  K.check('About 2550 A was predicted for a 480 V string from 480 V ÷ (0.160 + 0.028) Ω, against 2530 A measured: the big string shows 2553 A and 188 mΩ, wherever the fault slider sits', () =>
    Math.round(M_({ big: true }).faultCurrent) === 2553 && K.near(M_({ big: true }).loopResistance, 188, 1e-9) && K.near(M_({ big: true, d: 12 }).faultCurrent, M_({ big: true }).faultCurrent, 1e-9) &&

  K.check('Short-circuit current exceeded 90% of nominal even at about 60% charge: the sketch keeps 92%, so 1668 A of 1813 A at 60%, falling in a straight line', () => {
    const f = M_({ d: 0 }).faultCurrent, a = M_({ soc: 60 }).faultCurrent, m = M_({ soc: 80 }).faultCurrent, g = drawn(iS7, null, { soc: 60 });
    return Math.round(a) === 1668 && a > 0.9 * f && K.near(a / f, 0.92, 1e-9) && K.near(m, (a + f) / 2, 1e-6) && g.band && a > g.band[0] && a < g.band[1];

  K.check('Steady maximum current was reached within 5 to 10 ms: the sketched trace starts at 0, is full by 5 ms and stays flat to 20 ms', () => {

  K.check('Fifteen screens: demonstrations and puzzles take turns, three mixed puzzles end it, and no demonstration says more than about 90 words', () =>
    STEPS.length === 15 && STEPS.every((d, k) => !!d.show === ([1, 3, 5, 7, 9, 11].indexOf(k) >= 0)) && STEPS.every((d) => !d.show || d.read.split(/\s+/).length <= 92) && I13 === 13);
  K.check('Every demonstration settles within 4.6 s and ends where its screen says, and every answer\'s motion settles within 2.5 s', () => {
    const keys = ['d', 'soc', 'big', 'mix', 'on', 'bf', 'tm', 'rf', 'sf', 'lf', 'hf', 'lc', 'cf'];
    const same = (s, f) => keys.every((k) => (typeof s[k] === 'number' && typeof f[k] === 'number' ? K.near(s[k], f[k], 1e-9) : s[k] === f[k]));
    return STEPS.every((d) => {
      if (!d.show) return d.run.dur <= 2.5 && same(after(() => { setX(d.enter || {}); d.run.go(1); }), after(() => { setX(d.enter || {}); setX(d.end || {}); }));
      return d.dur <= 4.6 && same(after(() => { setX(d.enter || {}); d.play(d.dur); }), after(() => { setX(d.enter || {}); setX(d.end || {}); }));
    });
  });

  K.ready();
</script>
