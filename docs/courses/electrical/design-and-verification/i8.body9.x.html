<style>

  .pz .count { margin-top: 10px; }
  .task { font-size: 1.2rem; font-weight: 700; line-height: 1.45; }
  .task.show { font-size: 1.06rem; font-weight: 400; line-height: 1.6; }
  .task > p + p, .assume > p + p, .note > p + p { margin-top: 10px; }
  .sub { font-size: .95rem; color: var(--k-muted); line-height: 1.5; }
  .sub.ask { font-size: 1rem; font-weight: 700; color: var(--k-ink); }

  .ctl { display: grid; gap: 12px; }
  .scene { display: block; width: 100%; }
  .scene .lb { font: 600 13px var(--k-font); fill: var(--k-ink); }
  .scene .hd { font: 700 14px var(--k-font); fill: var(--k-ink); }
  .scene .tk { font: 400 13px var(--k-font); fill: var(--k-muted); }
  .scene .st { font: 600 13px var(--k-font); fill: var(--k-muted); }
  .scene .st.bad { fill: var(--k-warn); }
  .scene .box { fill: var(--k-bg); stroke: var(--k-strong); stroke-width: 1.5; }
  .scene .wire { fill: none; stroke: var(--k-ink); stroke-width: 2.5; stroke-linecap: round; }
  .scene .sine { fill: none; stroke: var(--k-ink); stroke-width: 1.8; stroke-linecap: round; }
  .scene .cir { fill: none; stroke: var(--k-accent2); stroke-width: 3.5; stroke-linecap: round; }
  .scene .lamp { fill: var(--k-bg); stroke: var(--k-accent2); stroke-width: 2.4; }
  .scene .lampx { stroke: var(--k-accent2); stroke-width: 2; stroke-linecap: round; }
  .scene .track { fill: var(--k-sunk); }
  .scene .up { fill: var(--k-fill3); stroke: var(--k-strong); stroke-width: 1; }
  .scene .add { fill: var(--k-accent2); }
  .scene .add.bad { fill: var(--k-warn); }
  .scene .lim { stroke: var(--k-ink); stroke-width: 2; stroke-dasharray: 5 4; }
  .scene .brk { stroke: var(--k-bg); stroke-width: 3; }
  .scene .bld { fill: none; stroke: var(--k-line); stroke-width: 1.5; stroke-dasharray: 6 4; }
  .scene .fig { font: 700 13px var(--k-font); fill: var(--k-ink); }
  .scene .fig.wait { fill: var(--k-muted); font-weight: 600; }
  #plan .sub + .sub { margin-top: 4px; }
  .cl { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 10px; }
  .cl li { display: grid; grid-template-columns: 1.4rem 1fr; gap: 10px; align-items: start; line-height: 1.45; }
  .cl .bx { width: 1.15rem; height: 1.15rem; margin-top: .15rem; border: 2px solid var(--k-strong); border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; color: var(--k-accent2); }
  .cl .bx svg { width: 100%; height: 100%; }
  .cl .met { display: block; margin-top: 2px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .w { font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.5; }
  .wl { padding: 10px 12px; border-radius: 10px; background: var(--k-panel); border: 1px solid var(--k-line); line-height: 1.5; }
  .wl .w { margin-top: 8px; }
  .wl .sub { margin-top: 10px; }
  .picks { display: flex; flex-direction: column; gap: 10px; }
  .picks .k-btn { width: 100%; min-height: 56px; height: auto; font-size: 1.02rem; line-height: 1.35; white-space: normal; text-align: left; justify-content: flex-start; padding: 10px 14px; }
  .picks .k-btn.is-right { border-color: var(--k-good); color: var(--k-good); box-shadow: inset 0 0 0 1px var(--k-good); }
  .picks .k-btn.is-wrong { border-color: var(--k-warn); color: var(--k-warn); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  .row .k-btn { flex: 1 1 9rem; min-height: 48px; }
  .fb { padding: 12px 14px; border-radius: 12px; background: var(--k-panel); border: 1.5px solid var(--k-line); line-height: 1.5; }
  .fb.ok { box-shadow: inset 4px 0 0 var(--k-good); }
  .fb.bad { box-shadow: inset 4px 0 0 var(--k-warn); }
  .fb > * + * { margin-top: 6px; }
  .fb .v { font-weight: 700; font-size: 1.05rem; }
  .fb.ok .v { color: var(--k-good); }
  .fb .sl { font-size: .95rem; color: var(--k-muted); }
  .why { line-height: 1.6; }
  #stepbox.enter, .wl .w.enter, .fade { animation: screen-in .35s ease-out both; }
  @keyframes screen-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  html.k-testing #stepbox.enter, html.k-testing .wl .w.enter, html.k-testing .fade { animation: none; }
  @media (prefers-reduced-motion: reduce) { #stepbox.enter, .wl .w.enter, .fade { animation: none; } }

<p class="caption" id="cap">Each line is worked from the rounded figures shown before it.</p>

<script>
  // ---------- rounding, the rule, and the course's figures ----------
  const r1 = (x) => Math.round(x * 10 + 1e-7) / 10;
  const r2 = (x) => Math.round(x * 100 + 1e-7) / 100;
  const r3 = (x) => Math.round(x * 1000 + 1e-6) / 1000;
  const down1 = (x) => Math.floor(x * 10 + 1e-7) / 10;      // a maximum is rounded down
  const f1 = (x) => r1(x).toFixed(1), f2 = (x) => r2(x).toFixed(2), f3 = (x) => r3(x).toFixed(3);
  const F = (id) => K.figure(id);
  const el = (id) => document.getElementById(id);
  const R3 = Math.sqrt(3);
  // Non-breaking spaces inside formulas, between a number and its unit, and in 'type C'.
  const nb = (s) => String(s == null ? '' : s)
    .replace(/ ([×÷]) /g, ' $1 ')
    .replace(/ = (?=[√kI])/g, ' = ')
    .replace(/ = /g, ' = ')
    .replace(/(\d) (?=(?:kA|mm²|mΩ\/m|mV\/A\/m|A²s|°C|Ω|A|V|s|m)(?![A-Za-z]))/g, '$1 ')
    .replace(/\btype ([BCD])\b/g, 'type $1');
  // A figure's working without the comparison after it ("… = 0.392 Ω ≤ 2.19 Ω (C10)" -> "… = 0.392 Ω").
  const cut = (s) => String(s || '').split(/ [≤≥] /)[0];
  const named = (w, names) => String(w || '').split('; ').map((x, k) => (names[k] || '') + x);
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

  const U0 = F('g.U0').value, UL = F('g.UL').value, ZE = F('g.Ze').value, M = F('g.mult.90ts').value;
  const K90 = F('g.k.cu90').value, KST = F('p.k.steel').value, T = F('g.t.thermal').value;
  const RCORE = F('g.swa4.line').value, RARM = F('g.swa4.armourR').value, AARM = F('g.swa4.armour').value;
  const PFC = F('g.pfc').value, ICN = F('p.icn.mcb').value;
  const VD15 = F('g.vd.1p5.1ph').value, IT15 = F('g.it.1p5.1ph').value, ITSWA = F('g.it.swa4.E').value, VDSWA = F('g.vd.swa4').value;
  const ZC10 = F('g.zmax.C10').value, ZC6 = F('g.zmax.C6').value, VERT = F('p.vert').value, H3 = F('p.h3.fluo').value;
  const PLAN = F('l8.submain.plan').value, I7 = F('l2.c7').value, I1 = F('l2.c1').value, AMB = F('g.ambient').value;
  const EAST = 11.2, SOUTH = 5.8;                      // the submain's route on plan, scaled from the drawing
  const CMIN = 0.95, CMAX = 1.1, R15 = 24.2, VD2C = 12, F4AA = 0.86, IN_SUB = 10, IN_C = 6, CPC = 1.5, K70 = 115;
  const C7PLAN = 20.8, C1PLAN = 17.3;                 // on plan from DBL2, scaled from the drawing
  const MOHM = r3(R15 * M);                           // 30.976 mΩ a metre, hot
  const LIM = r2(0.03 * U0), LIM3 = r2(0.03 * UL), LIM5 = r2(0.05 * U0);

  const fR = F('l8.recall'), fR1 = F('l8.recall.slip1'), fR2 = F('l8.recall.slip2');
  const fOpen = F('l8.why.open'), fZmax = F('l8.why.zsmax'), fC7d = F('l8.why.c7drop'), fC1d = F('l8.why.c1drop'), fStill = F('l8.why.still');
  const fC = F('l8.check'), fC1 = F('l8.check.slip1'), fC2 = F('l8.check.slip2');
  const f3b = F('3b'), f3f = F('3f');
  const f3g = F('3g'), f3g1 = F('3g.slip1'), f3g2 = F('3g.slip2'), f3g3 = F('3g.slip3');
  const fGimin = F('l8.A.3g.imin'), fGimax = F('l8.A.3g.imax'), fArm = F('l8.A.armour'), fArmM = F('l8.A.armourMDB');
  const f3h = F('3h'), f3h1 = F('3h.slip1'), f3h2 = F('3h.slip2'), f3h3 = F('3h.slip3'), fPct = F('l8.A.3h.pct'), fC1t = F('l8.A.c1');
  const f3i = F('3i'), f3i1 = F('3i.slip1'), f3i2 = F('3i.slip2'), f3i3 = F('3i.slip3'), fIimin = F('l8.A.3i.imin');
  const f3j = F('3j'), f3j1 = F('3j.slip1'), f3j2 = F('3j.slip2'), f3j3 = F('3j.slip3'), fJimax = F('l8.A.3j.imax'), fNear = F('l8.A.3j.near');
  const fCh = F('l8.A.changed'), fCh1 = F('l8.A.changed.slip1'), fCh2 = F('l8.A.changed.slip2'), fCh3 = F('l8.A.changed.slip3');

  // The why: a board with Zs 0.40 Ω whose submain hands on 1.00 V; each line from the rounded one before.
  const ZB = 0.40, SHARE = 1.00;
  function whyAt(L, I) {
    const cvd = r2(VD15 * I * L / 1000), cr = r3(MOHM * L / 1000);
    return { cvd, vd: r2(SHARE + cvd), cr, zs: r3(ZB + cr) };
  }
  const LZ = down1((ZC6 - ZB) * 1000 / MOHM);                   // where Zs reaches 3.64 Ω, either load
  const ldOf = (I) => down1((LIM - SHARE) * 1000 / (VD15 * I)); // where the drop reaches 6.90 V
  const STILL = whyAt(45, I1);

  // The recall and the check.
  const RC = { ze: 0.10, sub: 0.30, cir: 0.50 };
  RC.board = r2(RC.ze + RC.sub); RC.end = r2(RC.board + RC.cir); RC.noSub = r2(RC.ze + RC.cir); RC.noZe = r2(RC.sub + RC.cir);
  const CK = { sub: 6.00, cir: 4.00 };
  CK.share = r2(CK.sub / R3); CK.total = r2(CK.share + CK.cir); CK.plain = r2(CK.sub + CK.cir);

  // The worked example: the DBL2 submain.
  const SUB = { len: r1(PLAN + VERT + VERT), ib: f3b.value };
  SUB.it = r2(IN_SUB / (1.00 * 1 * 1 * F4AA)); SUB.iz = r2(ITSWA * F4AA);
  SUB.vd = r2(VDSWA * SUB.ib * SUB.len / 1000); SUB.vd1 = r2(SUB.vd / R3); SUB.vdalt = r2(VD2C * SUB.ib * SUB.len / 1000);
  // Section A, worked here by the rule and checked against the case file below.
  const iOf = (c, zs) => r2(U0 * c / zs);
  const sOf = (i, t, k) => r2(Math.sqrt(i * i * t) / k);
  const A3G = { r: r3((RCORE + RARM) * M * SUB.len / 1000) };
  A3G.zs = r3(ZE + A3G.r); A3G.imin = iOf(CMIN, A3G.zs); A3G.imax = iOf(CMAX, A3G.zs); A3G.s = sOf(A3G.imax, T, KST);
  A3G.mdbI = iOf(CMAX, ZE); A3G.mdbS = sOf(A3G.mdbI, T, KST);
  A3G.plan = r3(ZE + r3((RCORE + RARM) * M * PLAN / 1000)); A3G.cold = r3(ZE + r3((RCORE + RARM) * SUB.len / 1000));
  const C7 = { len: r1(C7PLAN + VERT + VERT) };
  C7.vd = r2(VD15 * I7 * C7.len / 1000); C7.r = r3(R15 * M * C7.len / 1000);
  const C1 = { len: r1(C1PLAN + VERT + VERT) };
  C1.vd = r2(VD15 * I1 * C1.len / 1000); C1.total = r2(SUB.vd1 + C1.vd);
  const A3H = { total: r2(SUB.vd1 + C7.vd) };
  A3H.pct = r2(A3H.total / U0 * 100); A3H.noRoot = r2(SUB.vd + C7.vd);
  A3H.plan = r2(r2(r2(VDSWA * SUB.ib * PLAN / 1000) / R3) + r2(VD15 * I7 * C7PLAN / 1000));
  const A3I = { zs: r3(A3G.zs + C7.r) };
  A3I.imin = iOf(CMIN, A3I.zs); A3I.fromZe = r3(ZE + C7.r); A3I.cold = r3(A3G.zs + r3(R15 * C7.len / 1000));
  const A3J = { imax: iOf(CMAX, A3I.zs) };
  A3J.s = sOf(A3J.imax, T, K90); A3J.cmin = sOf(A3I.imin, T, K90); A3J.k70 = sOf(A3J.imax, T, K70); A3J.slow = sOf(A3J.imax, 0.4, K90);
  A3J.near = sOf(A3G.imax, T, K90);
  const CH = { zb: 0.45, share: 2.50, i: 3.50 };
  CH.mvm = r2(VD15 * CH.i); CH.mv = r2((LIM - CH.share) * 1000); CH.ld = down1(CH.mv / CH.mvm); CH.ldn = r1(CH.mv / CH.mvm);
  CH.lz = down1((ZC6 - CH.zb) * 1000 / MOHM); CH.ans = Math.min(CH.ld, CH.lz);
  CH.noShare = down1(LIM * 1000 / CH.mvm); CH.five = down1((LIM5 - CH.share) * 1000 / CH.mvm);

  // ---------- the lesson's words ----------
  const RECALL_TASK = 'A lighting circuit runs from a sub-board. Ze at the origin is ' + f2(RC.ze) + " Ω. The submain's R1+R2 is " + f2(RC.sub) + " Ω. The circuit's own R1+R2 is " + f2(RC.cir) + ' Ω. What is Zs at the far end of the circuit?';
  const O_NOSUB = fR1.text + ': Ze + the circuit', O_ALL = fR.text + ': Ze + the submain + the circuit', O_NOZE = fR2.text + ': the submain + the circuit';
  const RECALL_W = ['Zs at the sub-board = ' + f2(RC.ze) + ' + ' + f2(RC.sub) + ' = ' + f2(RC.board) + ' Ω', 'Zs at the far end = ' + f2(RC.board) + ' + ' + f2(RC.cir) + ' = ' + fR.text];
  const RECALL_WHY = 'A fault at the far end drives current back through every cable to the supply, so every one of them is in the loop.';
  const FOR_TEXT = 'The design ends at the last luminaire, but it starts at the intake. A fault at the far end flows back through the circuit, the submain and the supply. The voltage drops along all of them too. So every check at the far end carries everything upstream with it.\n\nDesign the submain first, then the circuit, and carry each result forward.';
  const CHECKLIST = [
    'Every length of the run, not just the route on plan.',
    'Ib ≤ In ≤ Iz for each cable.',
    'Every voltage drop from the intake to the end.',
    'A three-phase drop turned into its single-phase share.',
    "Zs at the end against the device's maximum.",
    'The thermal constraints, with SWA armour as the cpc justified by calculation.',
    'Breaking capacity at each device.',
  ];
  const MET = [
    F('l8.sub.len').text + ' and ' + F('l8.c7.len').text + '.',
    f2(SUB.ib) + ' ≤ ' + IN_SUB + ' ≤ ' + f2(SUB.iz) + ' A and ' + f2(I7) + ' ≤ ' + IN_C + ' ≤ ' + IT15 + ' A.',
    f3h.text + ' against ' + f2(LIM) + ' V.',
    F('l8.sub.vd').text + ' counted as ' + F('l8.sub.vd1').text + '.',
    f3g.text + ' against ' + f2(ZC10) + ' Ω, ' + f3i.text + ' against ' + f2(ZC6) + ' Ω.',
    'Armour needs ' + fArmM.text + ' at the MDB end and ' + fArm.text + ' at DBL2, of ' + AARM + ' mm². The cpc needs ' + fNear.text + ' at the DBL2 end and ' + f3j.text + ' at the far end, of ' + CPC + ' mm².',
    ICN + ' kA against ' + PFC + ' kA.',
  ];
  const WHY_TEXT = 'Take a sub-board where Zs is ' + f2(ZB) + ' Ω and the submain adds ' + f2(SHARE) + ' V to a single-phase circuit. These two figures are chosen for the picture. The circuit is 1.5 mm² 90 °C thermosetting singles with a 1.5 mm² cpc, on a 6 A type C breaker.';
  const WHY_READ = 'At ' + f2(I7) + ' A the Zs bar is the first to cross its line, near ' + fZmax.text + '. At ' + f2(I1) + ' A the drop bar crosses first, near ' + fC1d.text + '. At 45.0 m and ' + f2(I1) + ' A the drop is ' + fStill.text + ', past its line. Zs is ' + f3(STILL.zs) + ' Ω, still inside.';
  const BESIDE = 'Each metre of the circuit adds to both bars. It adds ' + VD15 + ' mV for every amp it carries, so the drop grows with the load. It adds ' + R15 + ' × ' + M + ' = ' + f3(MOHM) + ' mΩ to the fault loop, whatever the load. The load in service makes no difference to Zs.\n\nSo on this board a light load runs out of Zs first. A heavy one runs out of voltage first. Both start from what the board hands on.';
  const UNDER = 'The longest circuit is not always the worst. Check every long or heavily loaded circuit against both limits.';
  const CHK_TASK = 'A three-phase submain drops ' + f2(CK.sub) + ' V. A single-phase lighting circuit from its board drops ' + f2(CK.cir) + ' V. The supply is ' + U0 + ' V single-phase and ' + UL + ' V three-phase. Does the lighting circuit meet its voltage drop limit?';
  const C_NOSUB = 'Yes: ' + fC1.text + ' is under ' + f2(LIM) + ' V', C_3PH = 'Yes: ' + fC2.text + ' is under ' + f2(LIM3) + ' V';
  const C_RIGHT = 'No: ' + f2(CK.share) + ' + ' + f2(CK.cir) + ' = ' + fC.text + ', over ' + f2(LIM) + ' V';
  const CHK_WHY = "The submain's " + f2(CK.sub) + ' V is the drop between lines. A single-phase circuit sees only the line-to-neutral part: ' + f2(CK.sub) + ' ÷ √3 = ' + f2(CK.share) + " V. Add the circuit's " + f2(CK.cir) + ' V: ' + fC.text + '. Lighting is allowed 3% of ' + U0 + ' V, ' + f2(LIM) + ' V. So it fails.';
  const WK_TEXT = 'Assume the submain is four-core 4 mm² 90 °C thermosetting SWA cable, alone on a perforated tray in the ceiling void. A 10 A type C breaker at the MDB protects it. Both are practice choices. The lighting currents rest on assumed power factors.\n\nThe route is ' + f1(PLAN) + ' m on plan. Take ' + VERT + ' m at each end for the runs up into the ceiling void and down to the board. Measure those on a real job.';
  const WK_READ = 'The submain runs ' + f1(SUB.len) + ' m with its vertical runs. It needs an It of ' + f2(SUB.it) + ' A. The 4 mm² cable carries ' + ITSWA + ' A. It drops ' + f2(SUB.vd) + ' V, which is ' + f2(SUB.vd1) + ' V on a single-phase circuit.';
  const FROM_WK = 'From the worked example: the submain runs ' + F('l8.sub.len').text + ' with its vertical runs. It drops ' + F('l8.sub.vd').text + ' three-phase, which is ' + F('l8.sub.vd1').text + ' on a single-phase circuit.';
  const AS_3G = FROM_WK + ' It is four-core 4 mm² SWA on a 10 A type C breaker, and its armour is the cpc.\n\nEach core is ' + RCORE + ' mΩ/m and the armour is ' + RARM + ' mΩ/m, both at 20 °C. Use the ' + M + ' multiplier on both.';
  const SCEN_TITLE = 'Your showroom: the supply and DBL2';
  const SCEN_TEXT = 'A newly built car showroom, on a ' + U0 + '/' + UL + ' V three-phase four-wire TN-C-S supply. Ze is ' + ZE + ' Ω and the prospective fault current is ' + PFC + ' kA. The building is at ' + AMB + " °C. A four-core SWA submain runs from the MDB in the plant room to DBL2, the lighting board in the tools and warranty store. DBL2's circuits include C7, for the foyer lights and the walkway bollards.";
  const Q3G = '(g) Determine the earth fault loop impedance at DBL2, using every length of the submain.';

    return node;

  function enter() { const b = el('stepbox'); b.classList.remove('enter'); void b.offsetWidth; b.classList.add('enter'); }

  function paintFb(f) {

  // ---------- nav ----------
  const backBtn = K.button({ label: 'Back', secondary: true, into: '#nav', press: () => { if (at() > 0) stepper.set(at() - 1); } });
  const nextBtn = K.button({ label: 'Continue', into: '#nav', press: () => { const i = at(); if (canGo(i) && i < iK) stepper.set(i + 1); } });
  function canGo(i) {

  K.model((p) => {

  const ON = { scen: [i3G, i3H, i3I, i3J], plan: [i3G, i3H, i3I, i3J], carryA: [i3G], carryB: [i3H], carryC: [i3I], carryD: [i3J], assume: [i3G, i3H, i3I, i3J, iCh],

  // ---------- known answers, worked out by hand ----------
  const near = (a, b) => K.near(a, b, 1e-9);

  K.check('Part 3g: 0.292 Ω and 0.392 Ω; slips 0.348, 0.328 and 0.292 Ω; 557.40 A and 645.41 A; 4.44 mm² of armour, under the plan length\'s 5.00 mm²; 2530 A and 17.39 mm² at the MDB end', () =>
    near(A3G.r, F('l8.sub.r12').value) && near(A3G.zs, f3g.value) && near(A3G.plan, f3g1.value) && near(A3G.cold, f3g2.value) && near(A3G.r, f3g3.value) &&
    near(A3G.imin, fGimin.value) && near(A3G.imax, fGimax.value) && near(A3G.s, fArm.value) && A3G.s < f3f.value && near(A3G.mdbI, 2530) && near(A3G.mdbS, fArmM.value));
  K.check('Part 3h: 23.8 m, 0.89 V and 1.84 V, 0.80% of 230 V; slips 2.53, 0.89 and 1.59 V; C1 over 20.3 m drops 3.08 V, 4.03 V from the intake', () =>
    near(C7.len, F('l8.c7.len').value) && near(C7.vd, F('l8.c7.vd').value) && near(A3H.total, f3h.value) && near(A3H.pct, fPct.value) &&
    near(A3H.noRoot, f3h1.value) && near(C7.vd, f3h2.value) && near(A3H.plan, f3h3.value) && near(C1.len, 20.3) && near(C1.vd, 3.08) && near(C1.total, fC1t.value) && C1.vd > C7.vd);
  K.check('Part 3i: 0.737 Ω and 1.129 Ω; slips 0.837, 0.968 and 0.737 Ω; 193.53 A, past 60 A', () =>
    near(C7.r, F('l8.c7.r12').value) && near(A3I.zs, f3i.value) && near(A3I.fromZe, f3i1.value) && near(A3I.cold, f3i2.value) && near(C7.r, f3i3.value) &&

  K.check('Part 3j: 224.09 A and 0.50 mm²; slips 0.43, 0.62 and 0.99 mm²; 1.43 mm² for a fault at the DBL2 end', () =>
    near(A3J.imax, fJimax.value) && near(A3J.s, f3j.value) && near(A3J.cmin, f3j1.value) && near(A3J.k70, f3j2.value) && near(A3J.slow, f3j3.value) && near(A3J.near, fNear.value) && A3J.near < CPC);
  K.check('Changed numbers: 4400 ÷ 108.5 = 40.55, rounded down to 40.5 m (40.6 m to the nearest); Zs allows 102.9 m; slips 63.5 and 82.9 m', () =>
    near(CH.mvm, 108.5) && near(CH.mv, 4400) && near(CH.ld, 40.5) && near(CH.ldn, 40.6) && near(CH.lz, fCh1.value) && near(CH.ans, fCh.value) &&

  K.check('Type B and C breakers to BS EN 60898 up to 63 A come rated 3000, 4500, 6000 and 10000 A', () => ICN * 1000 === 6000 && ICN > PFC,
    { source: 'https://www.beama.org.uk/static/2a6f44a3-2e72-4870-870fb0958c63c470/BEAMA-Guide-Low-Voltage-Circuit-breaker-Standards.pdf' });
