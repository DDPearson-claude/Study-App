<p class="caption" id="cap">Each line is worked from the rounded figures shown before it.</p>

<script>
  // ---------- rounding, the rule, and the course's figures ----------
  const r2 = (x) => Math.round(x * 100 + 1e-7) / 100;
  const r3 = (x) => Math.round(x * 1000 + 1e-6) / 1000;
  const f2 = (x) => r2(x).toFixed(2);
  const f3 = (x) => r3(x).toFixed(3);
  const f0 = (x) => String(Math.round(x));
  const F = (id) => K.figure(id);
  const el = (id) => document.getElementById(id);

  const UO = F('g.U0').value, ZE = F('g.Ze').value, ZDB = F('p.ZsDBP2').value, M90 = F('g.mult.90ts').value;
  const K90 = F('g.k.cu90').value, KST = F('p.k.steel').value, T = F('g.t.thermal').value;
  const RCORE = F('g.swa4.line').value, RARM = F('g.swa4.armourR').value, AARM = F('g.swa4.armour').value, SC1 = F('g.swa4.sc1s').value;
  const PFC = F('g.pfc').value, ICN = F('p.icn.mcb').value, R25 = F('g.r1r2.2p5').value, R4 = F('g.r1r2.4').value;
  const CMIN = 0.95, CMAX = 1.1, K70 = 115, CPC = 1.5, ZS0 = 0.646, ZS43 = 0.43, IA16 = 80;
  const KS2 = K70 * K70 * CPC * CPC;                // 29756.25 A²s: what 1.5 mm² can take
  const SB = 3.6;                                   // the bar's full length, in mm²

  // The rule: I = 230 × C ÷ Zs; heat = I² × t; S = √(I² × t) ÷ k; t = k² × S² ÷ I². Each from the rounded figure before it.
  const iOf = (c, zs) => r2(UO * c / zs);
  const sOf = (i, t, k) => r2(Math.sqrt(i * i * t) / k);
  const tOf = (k, s, i) => r2(k * k * s * s / (i * i));
  const over = (i) => i * i * T > KS2 + 1e-9;

  const fRc = F('l7.recall'), fRc1 = F('l7.recall.slip1'), fRc2 = F('l7.recall.slip2');
  const fBud = F('l7.why.budget'), fWmax = F('l7.why.cmax'), fWheat = F('l7.why.heat'), fWours = F('l7.worked.ours');
  const f43min = F('l7.why.43min'), f43max = F('l7.why.43max'), fXmax = F('l7.why.crossmax'), fXmin = F('l7.why.crossmin');
  const fPefc = F('l6.worked.pefc'), fHzs = F('l6.worked.zs'), fSmin646 = F('l7.worked.smin646');
  const fChk = F('l7.check'), fChk1 = F('l7.check.slip1'), fChk2 = F('l7.check.slip2');
  const fZeln = F('l7.worked.zeln'), fR1rn = F('l7.worked.r1rn'), fZsln = F('l7.worked.zsln'), fIsmin = F('l7.worked.iscmin'), fIsmax = F('l7.worked.iscmax'), fTsc = F('l7.worked.t');
  const f2a = F('2a'), f2b = F('2b'), f2c = F('2c'), f2cI = F('l7.A.2c.imax'), f2c1 = F('2c.slip1'), f2c2 = F('2c.slip2'), f2c3 = F('2c.slip3');
  const fAtM = F('l6.A.atMotor'), fLeg = F('l7.A.leg');
  const f2e = F('2e'), f2e1 = F('2e.slip1'), f2e2 = F('2e.slip2'), f2e3 = F('2e.slip3');
  const f3r = F('l7.A.3f.r12'), f3z = F('l7.A.3f.zs'), f3imin = F('l7.A.3f.imin'), f3imax = F('l7.A.3f.imax'), f3f = F('3f');
  const f3f1 = F('3f.slip1'), f3f2 = F('3f.slip2'), f3f3 = F('3f.slip3'), f3rat = F('l7.A.3f.rating');
  const fCh = F('l7.A.changed'), fCh1 = F('l7.A.changed.slip1'), fCh2 = F('l7.A.changed.slip2'), fCh3 = F('l7.A.changed.slip3');

  // The figures each screen quotes, worked here by the rule.
  const RZ = 0.5, RC = { right: iOf(CMAX, RZ), cmin: iOf(CMIN, RZ), none: r2(UO / RZ) };
  const CZ = 0.38, CI = iOf(CMAX, CZ), CImin = iOf(CMIN, CZ);
  const CK = { right: sOf(CI, T, K70), slow: sOf(CI, 0.4, K70), cmin: sOf(CImin, T, K70) };
  const H = { imin: iOf(CMIN, ZS0), imax: iOf(CMAX, ZS0) };
  H.s = sOf(H.imax, T, K70);
  const SC = { pscc: 300, len: 25, rcbo: 100 };
  SC.ze = r3(UO / SC.pscc); SC.r = r3(R25 * M90 * SC.len / 1000); SC.zs = r3(SC.ze + SC.r);
  SC.imin = iOf(CMIN, SC.zs); SC.imax = iOf(CMAX, SC.zs); SC.t = tOf(K90, 2.5, SC.imax);
  const IA25 = 10 * 25, IA10 = 10 * 10;
  const A2c = { i: iOf(CMAX, f2a.value) }; A2c.s = sOf(A2c.i, T, K90); A2c.acc = sOf(iOf(CMAX, 0.37), T, K90);
  const LEG = { i: iOf(CMAX, fAtM.value) }; LEG.s = sOf(LEG.i, T, K90);
  const A3 = { len: 17.0 };
  A3.r = r3((RCORE + RARM) * M90 * A3.len / 1000); A3.zs = r3(ZE + A3.r); A3.imin = iOf(CMIN, A3.zs); A3.imax = iOf(CMAX, A3.zs); A3.s = sOf(A3.imax, T, KST);
  A3.acc = r2(Math.sqrt(Math.pow(UO * CMAX / (ZE + (RCORE + RARM) * M90 * A3.len / 1000), 2) * T) / KST);
  A3.cold = iOf(CMAX, r3(ZE + r3((RCORE + RARM) * A3.len / 1000)));
  A3.rate = r2(SC1 * Math.sqrt(1 / T));
  const CH = { pscc: 500, len: 30, s: 4, ia: 160 };
  CH.ze = r3(UO / CH.pscc); CH.r = r3(R4 * M90 * CH.len / 1000); CH.zs = r3(CH.ze + CH.r);
  CH.imin = iOf(CMIN, CH.zs); CH.imax = iOf(CMAX, CH.zs); CH.t = tOf(K90, CH.s, CH.imax);
  CH.coldI = iOf(CMAX, r3(CH.ze + r3(R4 * CH.len / 1000)));

  // ---------- the lesson's words ----------
  const ZT = (z) => z.toFixed(2);
  const O_MIN = f2(RC.cmin) + ' A: ' + UO + ' × ' + CMIN + ' ÷ ' + ZT(RZ), O_MAX = f2(RC.right) + ' A: ' + UO + ' × ' + CMAX + ' ÷ ' + ZT(RZ), O_NONE = f2(RC.none) + ' A: ' + UO + ' ÷ ' + ZT(RZ);
  const RECALL_WORK = UO + ' × ' + CMAX + ' ÷ ' + ZT(RZ) + ' = ' + fRc.text;
  const C_RIGHT = f2(CK.right) + ' mm²: the Cmax current for 0.1 s', C_SLOW = f2(CK.slow) + ' mm²: the Cmax current for 0.4 s', C_MIN = f2(CK.cmin) + ' mm²: the Cmin current for 0.1 s';
  const FOR_TEXT = 'A fault current heats every conductor it flows through until the device opens. A fault that clears quickly gives the heat no time to leave. Copper that gets too hot damages its insulation.\n\nSo three checks follow Zs. The cpc must take the heat of an earth fault. The live conductors must take the heat of a short circuit. And each device must be able to break the biggest fault where it sits. The exception is a device covered by one upstream.';
  const WHY_TEXT = 'Take the immersion heater from lesson 6. Its cpc is 1.5 mm² in 70 °C thermoplastic cable, so k is ' + K70 + '. A 16 A type B breaker protects it. It opens within 0.1 s once the fault current reaches ' + IA16 + ' A.';
  const CHK_TASK = 'A 32 A type C breaker protects a circuit with Zs ' + ZT(CZ) + ' Ω. Its cpc is 2.5 mm² in 70 °C thermoplastic cable, so k is ' + K70 + '. It is a final circuit, so 0.4 s is allowed. At the Cmax current, ' + f2(CI) + ' A, the breaker opens within 0.1 s. What is the smallest cpc that copes?';
  const WK_TEXT = 'Two examples, worked a line at a time. The first is the heater\'s cpc from lesson 6. The second is a short circuit on the live conductors.';
  const ZD = ZDB.toFixed(2);
  const AS_2C = 'The motor circuit\'s cpc is 2.5 mm². It runs in the same conduit as the 90 °C thermosetting singles, so k is ' + K90 + '. Take Zs at DBP2 as ' + ZD + ' Ω for practice. Zs at the starter is then ' + f2a.text + '.';
  const Q2C = '(c) Determine, for the motor circuit, whether the copper circuit protective conductor satisfies the thermal constraints under fault conditions.';
  const AS_2E = 'Every device must break the biggest fault current where it sits. That current is IPF, the larger of the earth fault current and the short-circuit current. The device\'s breaking capacity, Icn, is marked on it, usually in a small box. The rule is IPF ≤ Icn.\n\nAssume the showroom\'s stated ' + PFC + ' kA is a fault across all three lines at the origin. That is the biggest fault there.';
  const Q2E = '(e) Determine the least rated short-circuit breaking capacity (Icn) for the circuit-breakers in the MDB.';
  const AS_3F = 'Assume the DBL2 submain is four-core 4 mm² 90 °C thermosetting XLPE/SWA cable, ' + A3.len.toFixed(1) + ' m on plan. A 10 A type C breaker at the MDB protects it. The armour is its cpc. Treat the cable size and the breaker as practice values. Lesson 8 sizes them properly.\n\nEach core is ' + RCORE + ' mΩ/m and the armour ' + RARM + ' mΩ/m, both at 20 °C. The armour area is ' + AARM + ' mm². Use the ' + M90 + ' multiplier on both. The armour runs a little cooler than the cores, so this overstates its resistance a little. That is safe for Zs. It does trim the fault current slightly, but ' + AARM + ' mm² leaves plenty of room for that.\n\nTake k for the steel armour as ' + KST + ' for practice. On a real job, read k from Table 54.4.\n\nSWA armour can be the cpc if a calculation justifies it. This is that calculation.';
  const Q3F = '(f) Determine the minimum cross-sectional area the armour needs to serve as the DBL2 submain\'s cpc.';
  const AS_CH = 'A single-phase circuit is wired in 4 mm² twin and earth, 90 °C thermosetting, ' + CH.len + ' m long. A 32 A type B breaker protects it, opening within 0.1 s once the current reaches ' + CH.ia + ' A. The short-circuit current at the origin is ' + CH.pscc + ' A. Use ' + R4 + ' mΩ/m for the line and neutral together, and the ' + M90 + ' multiplier.';
  const Q_CH = 'Determine whether the breaker protects the live conductors in a short circuit.';

  const STEPS = [
    { name: 'Do you still have it?', label: 'Do you still have it?',
      task: 'A circuit\'s Zs is ' + ZT(RZ) + ' Ω. Which fault current do you put into S = √(I²t) ÷ k to check its cpc can take the heat?',
      opts: [O_MIN, O_MAX, O_NONE], want: O_MAX, why: RECALL_WORK + '. The supply can rise to 253 V, and more current means more heat.' },
    { show: true, name: 'What it is for', label: 'What it is for', text: FOR_TEXT },
    { show: true, name: 'The why', label: 'The why: the heat a cpc can take', text: WHY_TEXT,
      read: 'At ' + fHzs.text + ' the Cmax current is ' + fWmax.text + '. The cpc needs ' + fWours.text + ', so 1.5 mm² holds. At ' + ZT(ZS43) + ' Ω the Cmin current asks for ' + f43min.text + ', a pass. The Cmax current asks for ' + f43max.text + ', a fail.',
      still: { zs: ZS43 } },
    { name: 'Check', label: 'Check', task: CHK_TASK, opts: [C_RIGHT, C_SLOW, C_MIN], want: C_RIGHT,
      why: 't is how long the device takes at that current. √(' + f2(CI) + '² × 0.1) ÷ ' + K70 + ' = ' + f2(CK.right) + ' mm², so the 2.5 mm² cpc holds.' },
    { show: true, name: 'Worked example', label: 'Worked example', text: WK_TEXT,
      read: 'The heater\'s Cmax current is ' + f2(H.imax) + ' A. Its cpc needs ' + f2(H.s) + ' mm², under the 1.5 mm² fitted. In the short circuit the greatest current is ' + f2(SC.imax) + ' A. The 2.5 mm² conductors can carry it for ' + f2(SC.t) + ' s, far longer than the 0.1 s the RCBO takes.',
      still: () => { lines = WCOUNT; K.refresh(); } },
    { name: 'Section A 2(c)', label: 'Section A · Question 2', assume: AS_2C, part: Q2C, first: 'First, the minimum cpc size.',
      task: AS_2C + ' ' + Q2C + ' First, the minimum cpc size.', want: f2c.text, why: f2c.work },
    { name: 'Section A 2(e)', label: 'Section A · Question 2', assume: AS_2E, part: Q2E,
      task: AS_2E.replace('\n\n', ' ') + ' ' + Q2E, want: f2e.text, why: f2e.work },
    { name: 'Section A 3(f)', label: 'Section A · Question 3', assume: AS_3F, part: Q3F,
      task: AS_3F.split('\n\n').join(' ') + ' ' + Q3F, want: f3f.text, why: f3f.work },
    { kind: 'written', written: 'b1', name: 'Section B', label: 'Section B · Short answer', task: 'A short written answer, in your own words.' },
    { name: 'Changed numbers', label: 'Section A · Changed numbers', assume: AS_CH, part: Q_CH, first: 'First, how long can they carry the greatest short-circuit current?',
      task: AS_CH + ' ' + Q_CH + ' First, how long can they carry the greatest short-circuit current?', want: fCh.text, why: fCh.work },
    { kind: 'summary', name: 'Keep this', label: 'Keep this' },
  ];
  const iR = 0, iFor = 1, iWhy = 2, iChk = 3, iWk = 4, i2c = 5, i2e = 6, i3f = 7, iB1 = 8, iCh = 9, iK = 10;
  const S = STEPS.map(() => ({ res: null, pick: null, tries: 0, shown: false, fb: null }));
  const WORKING = [iWhy, iChk, iWk, i2c, i2e, i3f, iCh];
  const TERMS = { [iWhy]: [], [i2e]: ['IPF', 'Icn'], [i3f]: [], [iFor]: [] };
  let lastStep = -1, finished = false, lines = 0;

  // Words with key terms in amber (the <mark> element), built with K.el, never innerHTML.
  function write(node, s, terms) {
    node.textContent = '';
    let rest = String(s || '');
    const list = terms || [];
    while (rest) {
      let at = -1, hit = null;
      list.forEach((t) => { const k = rest.indexOf(t); if (k >= 0 && (at < 0 || k < at)) { at = k; hit = t; } });
      if (at < 0) { node.appendChild(document.createTextNode(rest)); break; }
      if (at > 0) node.appendChild(document.createTextNode(rest.slice(0, at)));
      node.appendChild(K.el('mark', null, hit));
      list.splice(list.indexOf(hit), 1);
      rest = rest.slice(at + hit.length);
    }
    return node;
  }
  function paras(node, s, terms) {
    node.textContent = '';
    const list = (terms || []).slice();
    String(s || '').split('\n\n').forEach((t) => { if (t) node.appendChild(write(K.el('p'), t, list)); });
  }
  const named = (w, names) => String(w || '').split('; ').map((x, k) => (names[k] || '') + x);

  // ---------- controls ----------
  const stepper = K.stepper({ id: 'step', label: 'Lesson', steps: STEPS.map((d) => d.name), value: 0, compact: true, into: '#prog' });
  const at = () => K.clamp(Math.round(stepper.get()) || 0, 0, STEPS.length - 1);
  K.control({ id: 'zs', label: 'Zs of the circuit', min: 0.2, max: 1, step: 0.002, value: ZS0,
    fmt: (v) => f3(v) + ' Ω', snap: [ZS0, 0.464, 0.46, ZS43, 0.4], into: '#ctl' });
  K.readout({ id: 'icmin', label: 'Fault current at Cmin', unit: 'A', decimals: 2, into: '#outs' });
  K.readout({ id: 'icmax', label: 'Fault current at Cmax', unit: 'A', decimals: 2, into: '#outs' });
  K.readout({ id: 's', label: 'Smallest cpc, at Cmax', unit: 'mm²', decimals: 2, into: '#outs' });

  // The picture: the heat a fault puts in during the breaker's 0.1 s, against what 1.5 mm² can take.
  const heatFn = (i) => i * i * T;
  const plot = K.plot('#plot', {
    x: { min: 0, max: 1300, label: 'Fault current (A)' },
    y: { min: 0, max: 170000, label: 'Heat put in, I²t (A²s)' },
    height: 280, legend: true,
    series: [{ fn: heatFn, label: 'Heat put in during 0.1 s: I² × 0.1' }, { fn: () => KS2, label: 'What 1.5 mm² can take: k²S²', color: 'ink', dash: true, width: 1.75 }],
    label: 'The heat a fault puts into the cpc, rising with the square of the fault current, against the level line of what 1.5 mm² can take',
  });

  // Picks: one tap answers.
  const pickBtns = [0, 1, 2].map((k) => K.button({ label: 'Answer ' + (k + 1), secondary: true, into: '#picks', press: () => pick(k) }));
  function pick(k) {
    const i = at(), d = STEPS[i], st = S[i];
    if (!d.opts || k >= d.opts.length) return;
    if (i === iR) {
      if (st.res) return;     // a recall gets one go
      st.pick = d.opts[k];
      if (st.pick === d.want) {
        st.res = 'right';
        st.fb = { ok: true, v: 'Still there.', w: [RECALL_WORK],
          p: 'The supply can rise to 253 V. More voltage pushes more current round the same loop, and more current means more heat.',
          xs: [fRc1.text + ' is the Cmin current. That one is for whether the breaker opens in time.', fRc2.text + ' leaves out Cmax. It misses the rise to 253 V.'] };
      } else {
        st.res = 'wrong';
        st.fb = { ok: false, v: 'Not quite.',
          p0: st.pick === O_MIN ? 'That is Cmin. It gives the smallest current. That one decides whether the breaker opens in time. The heat check wants the largest.'
            : 'The supply can rise to 253 V. Cmax, ' + CMAX + ', allows for that. The heat check wants the largest current.',
          w: ['The working: ' + RECALL_WORK], p: 'Continue, and the refresh starts from here.' };
      }
    } else if (i === iChk) {
      if (st.res === 'right') return;
      st.pick = d.opts[k];
      if (st.pick === d.want) { st.res = 'right'; st.fb = { ok: true, v: 'That\'s it.', p0: d.why }; }
      else if (st.pick === C_SLOW) { st.res = 'wrong'; st.fb = { ok: false, v: 'Not quite.', p0: '0.4 s is the longest time allowed, not how long the breaker takes. Using it fails a cpc that is fine.' }; }
      else { st.res = 'wrong'; st.fb = { ok: false, v: 'Not quite.', p0: 'That is the Cmin current, ' + f2(CImin) + ' A. It is the smaller current. So it puts in less heat than the fault can.' }; }
    }
    K.refresh();
  }

    near(CI, 665.79) && near(CK.right, fChk.value) && near(CK.slow, fChk1.value) && near(CImin, 575) && near(CK.cmin, fChk2.value));
  K.check('The short circuit: 0.767 Ω, 0.474 Ω, 1.241 Ω, 176.07 A, 203.87 A and 3.08 s', () =>
    near(SC.ze, fZeln.value) && near(SC.r, fR1rn.value) && near(SC.zs, fZsln.value) && near(SC.imin, fIsmin.value) && near(SC.imax, fIsmax.value) && near(SC.t, fTsc.value));
  K.check('Part 2c: 691.26 A and 1.53 mm²; 1.51 mm² from 0.37 Ω; slips 1.32, 3.06 and 1.90 mm²; the leg 551.20 A and 1.22 mm²', () =>
    near(A2c.i, f2cI.value) && near(A2c.s, f2c.value) && near(A2c.acc, 1.51) && near(sOf(f2b.value, T, K90), f2c1.value) && near(sOf(A2c.i, 0.4, K90), f2c2.value) &&
    near(sOf(A2c.i, T, K70), f2c3.value) && near(LEG.i, 551.2) && near(LEG.s, fLeg.value));
  K.check('Part 2e: 4.6 kA; one line to earth gives 2.30, 2.53 and 2.19 kA', () =>
    near(PFC, f2e.value) && near(r2(UO / ZE / 1000), f2e1.value) && near(r2(UO * CMAX / ZE / 1000), f2e2.value) && near(r2(UO * CMIN / ZE / 1000), f2e3.value));
  K.check('Part 3f: 0.248 Ω, 0.348 Ω, 627.87 A, 727.01 A and 5.00 mm²; 4.99 mm² unrounded; slips 1.61, 4.32 and 5.92 mm²; 3.16 kA', () =>
    near(A3.r, f3r.value) && near(A3.zs, f3z.value) && near(A3.imin, f3imin.value) && near(A3.imax, f3imax.value) && near(A3.s, f3f.value) && near(A3.acc, 4.99) &&
    near(sOf(A3.imax, T, K90), f3f1.value) && near(sOf(A3.imin, T, KST), f3f2.value) && near(sOf(A3.cold, T, KST), f3f3.value) && near(A3.rate, f3rat.value));
  K.check('Changed numbers: 0.814 Ω, 268.43 A, 310.81 A and 3.39 s; slips 4.54, 0.85 and 2.78 s', () =>
    near(CH.zs, 0.814) && near(CH.imin, 268.43) && near(CH.imax, 310.81) && near(CH.t, fCh.value) && near(tOf(K90, CH.s, CH.imin), fCh1.value) &&
    near(r2(K90 * K90 * CH.s / (CH.imax * CH.imax)), fCh2.value) && near(tOf(K90, CH.s, CH.coldI), fCh3.value));
  K.check('Every slip lies outside its answer\'s accepted figures', () => Object.keys(SPEC).every((k) => {
    const sp = SPEC[k];
    return sp.slips.every((s) => Math.abs(s.value - sp.fig.value) > 0.01 && sp.accept.every((x) => Math.abs(s.value - x) > 0.01));
  }));
  K.check('For a low voltage supply under the ESQCR, Cmin is 0.95', () => CMIN === 0.95,
    { source: 'https://electrical.theiet.org/media/1442/maximum-zs-values.pdf' });
  K.check('For 90 °C thermosetting insulation the final temperature is 250 °C, and k is 143', () => K90 === 143,
    { source: 'https://electrical.theiet.org/media/3023/wiring-matters-issue-93-november-2022.pdf' });
  K.check('Steel wire armour on 90 °C XLPE cable has a k of 46', () => KST === 46,
    { source: 'https://tmuk.org/free-adiabatic-equation-calculator-cpc-sizer/' });
  K.check('Type B and C breakers to BS EN 60898 up to 63 A come rated 3000, 4500, 6000 and 10000 A', () => ICN * 1000 === 6000 && [3000, 4500, 6000, 10000].indexOf(4500) >= 0,
    { source: 'https://www.beama.org.uk/static/2a6f44a3-2e72-4870-870fb0958c63c470/BEAMA-Guide-Low-Voltage-Circuit-breaker-Standards.pdf' });
  K.check('The three-phase fault is approximated by doubling the line-to-neutral figure: 2 × 230 ÷ 0.1 = 4600 A', () => near(2 * UO / ZE / 1000, PFC),
    { source: 'https://engx.theiet.org/f/wiring-and-regulations/29667/ipf-3ph-simultaneous-fault' });

  K.ready();
</script>
