<p class="caption" id="cap">Each line is worked from the rounded figures shown before it.</p>

<script>
  // ---------- rounding, and the course's figures ----------
  const r2 = (x) => Math.round(x * 100 + 1e-7) / 100;
  const r3 = (x) => Math.round(x * 1000 + 1e-6) / 1000;
  const f1 = (x) => (Math.round(x * 10 + 1e-7) / 10).toFixed(1);
  const f2 = (x) => r2(x).toFixed(2);
  const f3 = (x) => r3(x).toFixed(3);
  const F = (id) => K.figure(id);
  const el = (id) => document.getElementById(id);

  // The case file's givens and practice values.
  const UO = F('g.U0').value, ZE = F('g.Ze').value, ZDB = F('p.ZsDBP2').value, ZMAX = F('g.zmax.C25').value;
  const M90 = F('g.mult.90ts').value, LEG = F('p.legLen').value;
  const MPM = { '2.5': F('g.r1r2.2p5').value, '4': F('g.r1r2.4').value, '6': F('g.r1r2.6').value };
  const CMIN = 0.95, CMAX = 1.1, M70 = 1.2, IN = 25, IA = 10 * IN, ILO = 5 * IN, RUN = 11.4, IMAX = 1500;
  const RCD = { 30: 1667, 100: 500 };              // Table 41.5, ohms
  const Z87 = ZMAX.toFixed(2), ZD = ZDB.toFixed(2);

  // The rule: R1+R2 = mΩ/m × multiplier × length ÷ 1000; Zs = Zs at DBP2 + R1+R2; fault current = 230 × 0.95 ÷ Zs.
  // Each line is worked from the rounded figure before it.
  function loop(len, size, hot) {
    const L = Math.round((+len || 0) * 10) / 10;
    const m = MPM[String(size)] || MPM['2.5'];
    const r12 = r3(m * (hot ? M90 : 1) * L / 1000);
    const zs = r3(ZDB + r12);
    return { r12, zs, ifl: r2(UO * CMIN / zs) };
  }
  // The longest run within the maximum Zs, rounded down.
  const longest = (m, mult) => Math.floor((ZMAX - ZDB) * 1000 / r2(m * mult) * 10 + 1e-7) / 10;

  const fR = F('l6.recall'), fR1 = F('l6.recall.slip1'), fR2 = F('l6.recall.slip2');
  const fHot = F('l6.check.hot'), fCold = F('l6.check.cold');
  const f38 = F('l6.why.38'), f50 = F('l6.why.50'), f504 = F('l6.why.50.4');
  const fMax = F('l6.A.maxRun'), fMax4 = F('l6.why.max4'), fMax6 = F('l6.why.max6');
  const fZm = F('l6.maxzs.C25'), fTB = F('l6.typeB25');
  const fWr = F('l6.worked.r12'), fWz = F('l6.worked.zs'), fWi = F('l6.worked.pefc'), fOrg = F('l6.showroom.pefc');
  const f2a = F('2a'), f2b = F('2b'), fLeg = F('l6.A.atMotor');
  const f2a1 = F('2a.slip1'), f2a2 = F('2a.slip2'), f2a3 = F('2a.slip3'), f2b1 = F('2b.slip1'), f2b2 = F('2b.slip2');
  const fCh = F('l6.A.changed'), fCh1 = F('l6.A.changed.slip1'), fCh2 = F('l6.A.changed.slip2'), fCh3 = F('l6.A.changed.slip3'), fChF = F('l6.A.changed.fix');

  // The figures each screen quotes, worked by the rule.
  const A0 = loop(RUN, '2.5', true);
  const C40h = loop(40, '2.5', true), C40c = loop(40, '2.5', false), GAP = r3(C40h.zs - C40c.zs);
  const W50 = loop(50, '2.5', true), W504 = loop(50, '4', true);
  const MAX25 = longest(MPM['2.5'], M90);
  const ZRULE = r3(UO * CMIN / IA), ZB25 = r3(UO * CMIN / ILO);
  const ZR = 7.28;                                 // a 6 A type B's maximum Zs (Table 41.3)
  const RC = { right: r2(UO * CMIN / ZR), noC: r2(UO / ZR), cmax: r2(UO * CMAX / ZR) };
  const RECALL_WORK = UO + ' × ' + CMIN + ' ÷ ' + ZR + ' = ' + f2(RC.right) + ' A';
  // The heater worked example: 3 kW on 15 m of 1.5 mm² 70 °C singles, Ze 0.21 Ω, a 16 A type B.
  const WH = { mpm: 24.2, mult: 1.2, len: 15, ze: 0.21, zmax: 2.73, ia: 80 };
  const wR12 = r3(WH.mpm * WH.mult * WH.len / 1000), wZs = r3(WH.ze + wR12), wI = r2(UO * CMIN / wZs), oI = r2(UO * CMIN / ZE);
  // Section A: the starter-to-motor leg, and the changed-numbers circuit.
  const legR = r3(WH.mpm * M90 * LEG / 1000), atMotor = r3(A0.zs + legR);
  const ZUN = Math.round((ZDB + MPM['2.5'] * M90 * RUN / 1000) * 1e5) / 1e5;  // Zs before rounding, to 5 places: 0.36625 Ω
  const CH = { len: 52, zb: 0.35 };
  const chR = r3(MPM['4'] * M70 * CH.len / 1000), chZ = r3(CH.zb + chR);
  const chFixR = r3(MPM['6'] * M70 * CH.len / 1000), chFixZ = r3(CH.zb + chFixR);

  // ---------- the lesson: SHOW steps teach, DO steps ask ----------
  const O_NOC = f2(RC.noC) + ' A: ' + UO + ' ÷ ' + ZR, O_RIGHT = f2(RC.right) + ' A: ' + UO + ' × ' + CMIN + ' ÷ ' + ZR, O_CMAX = f2(RC.cmax) + ' A: ' + UO + ' × ' + CMAX + ' ÷ ' + ZR;
  const O_HOT = f3(C40h.zs) + ' Ω: the limit assumes conductors at working temperature';
  const O_COLD = f3(C40c.zs) + ' Ω: the cable is installed at 20 °C';
  const O_EITHER = 'Either: the gap is only rounding';
  const ASSUME_WHY = 'Assume the motor is fed from DBP2 through the 25 A type C breaker from lesson 3. The cable to the starter is a 2.5 mm² line with a 2.5 mm² cpc, 90 °C thermosetting singles in conduit. Take Zs at DBP2 as ' + ZD + ' Ω for practice. On a real job, measure it or work it out from the submain\'s design.';
  const ASSUME_A = 'Assume these for the motor circuit. DBP2 to the starter is ' + f1(RUN) + ' m on plan. That is approximate. A real design adds the vertical runs. The cable is a 2.5 mm² line with a 2.5 mm² cpc, 90 °C thermosetting singles in conduit. Zs at DBP2 is the practice ' + ZD + ' Ω. Use ' + MPM['2.5'] + ' mΩ/m and a multiplier of ' + M90 + '.';
  const Q2A = '(a) Determine, for the motor circuit, the total earth fault loop impedance (Zs) at the starter.';
  const Q2B = '(b) Determine if the value of earth fault loop impedance is acceptable.';
  const CH_Q = 'A single-phase circuit is wired in 70 °C thermoplastic singles in conduit: a 4 mm² line and a 4 mm² cpc, ' + CH.len + ' m long. A 25 A type C breaker to BS EN 60898 protects it. Its maximum Zs is ' + Z87 + ' Ω. Zs at its board is ' + CH.zb.toFixed(2) + ' Ω. Determine the total earth fault loop impedance, and whether it is acceptable.';
  const WK_TEXT = 'A 3 kW immersion heater on ' + WH.len + ' m of 1.5 mm² 70 °C thermoplastic singles in conduit. Ze is ' + WH.ze + ' Ω. A 16 A type B breaker protects it, on a TN-S supply. It is a final circuit under 32 A, so it has 0.4 s.';
  const HIGH_TEXT = 'Stretch the motor\'s run to 50 m. Zs is ' + f3(W50.zs) + ' Ω, over ' + Z87 + ' Ω. The fault current is ' + f2(W50.ifl) + ' A, under ' + IA + ' A. Zs at DBP2 is still the practice ' + ZD + ' Ω. There are four ways out.';

  const STEPS = [
    { name: 'Do you still have it?', label: 'Do you still have it?',
      task: 'A lighting circuit has a 6 A type B breaker. Its maximum Zs is ' + ZR + ' Ω. At that Zs, how much earth fault current does the design count on?',
      opts: [O_NOC, O_RIGHT, O_CMAX], want: O_RIGHT, why: RECALL_WORK + ', the breaker\'s Ia of 30 A.',
      read: RECALL_WORK + ', the breaker\'s Ia. The maximum Zs is the one that still lets Ia flow at the lowest supply voltage.' },
    { show: true, name: 'What it is for', label: 'What it is for',
      text: 'By now the circuit works. Now ask whether it disconnects on an *earth fault*. It must do so fast enough to protect anyone touching metalwork that has gone live.\n\nThe fault current runs round a loop. It goes out on the line conductor, back on the cpc, and home through the supply. The loop\'s impedance is *Zs = Ze + (R1+R2)*. The lower Zs is, the more current flows. Enough current opens the device within the time allowed.',
      read: 'Zs = Ze + (R1+R2) must not exceed the device\'s maximum. Then the fault current opens it within 0.4 s for final circuits up to 32 A, or 5 s for distribution circuits.' },
    { show: true, name: 'The why', label: 'The why: the fault loop, metre by metre', text: ASSUME_WHY,
      read: 'At ' + f1(RUN) + ' m, Zs is ' + f3(A0.zs) + ' Ω and the fault current ' + f2(A0.ifl) + ' A. Near ' + f1(MAX25) + ' m, Zs reaches ' + Z87 + ' Ω and the current falls to about ' + IA + ' A. At 50 m, 4 mm² brings Zs back to ' + f3(W504.zs) + ' Ω.' },
    { name: 'Check', label: 'Check',
      task: 'The same 2.5 mm² run is now 40 m long. Zs at DBP2 is still the practice ' + ZD + ' Ω. One designer works R1+R2 hot and gets Zs ' + f3(C40h.zs) + ' Ω, a fail. Another leaves out the multiplier and gets ' + f3(C40c.zs) + ' Ω, a pass. Which figure do you compare with ' + Z87 + ' Ω?',
      opts: [O_HOT, O_COLD, O_EITHER], want: O_HOT,
      why: 'The milliohm figures are for copper at 20 °C. The maximum Zs values assume conductors at working temperature. The multiplier brings R1+R2 up to that.',
      read: 'Compare the hot figure, ' + f3(C40h.zs) + ' Ω, with ' + Z87 + ' Ω. At 40 m the run fails.' },
    { show: true, name: 'When Zs is too high', label: 'When Zs is too high', text: HIGH_TEXT,
      read: 'At 50 m, Zs is ' + f3(W50.zs) + ' Ω and fails. 4 mm² brings it to ' + f3(W504.zs) + ' Ω. An RCD needs far less earth path. Supplementary bonding is the route where the time cannot be met.' },
    { show: true, name: 'Worked example', label: 'Worked example', text: WK_TEXT,
      read: 'R1+R2 is ' + f3(wR12) + ' Ω. Zs is ' + f3(wZs) + ' Ω, within ' + WH.zmax + ' Ω. The fault current is ' + f2(wI) + ' A, over the Ia of ' + WH.ia + ' A. So it opens within 0.1 s.' },
    { name: 'Section A 2(a)', label: 'Section A · Question 2', part: Q2A, task: ASSUME_A + ' ' + Q2A,
      want: f2a.text, why: f2a.work,
      read: 'R1+R2 = ' + MPM['2.5'] + ' × ' + M90 + ' × ' + f1(RUN) + ' ÷ 1000 = ' + f3(A0.r12) + ' Ω. Zs = ' + ZDB.toFixed(3) + ' + ' + f3(A0.r12) + ' = ' + f2a.text + ', taking the practice ' + ZD + ' Ω at DBP2.' },
    { name: 'Section A 2(b)', label: 'Section A · Question 2', part: Q2B, task: Q2B,
      want: f2b.text, why: f2b.work,
      read: UO + ' × ' + CMIN + ' ÷ ' + f3(f2a.value) + ' = ' + f2b.text + ', over ' + IA + ' A. ' + f2a.text + ' is within ' + Z87 + ' Ω, so it is acceptable.' },
    { kind: 'written', written: 'b1', name: 'Section B (1)', label: 'Section B · Short answer', task: 'A short written answer, in your own words.' },
    { kind: 'written', written: 'b2', name: 'Section B (2)', label: 'Section B · Short answer', task: 'A short written answer, in your own words.' },
    { name: 'Changed numbers', label: 'Section A · Changed numbers', part: CH_Q, task: CH_Q,
      want: fCh.text, why: fCh.work,
      read: MPM['4'] + ' × ' + M70.toFixed(2) + ' × ' + CH.len + ' ÷ 1000 = ' + f3(chR) + ' Ω. Zs is ' + fCh.text + ', over ' + Z87 + ' Ω, so it is too high. 6 mm² gives ' + f3(chFixZ) + ' Ω.' },
    { kind: 'summary', name: 'Keep this', label: 'Keep this' },
  ];
  const iR = 0, iFor = 1, iWhy = 2, iChk = 3, iHigh = 4, iWk = 5, iA = 6, iB = 7, iB1 = 8, iB2 = 9, iCh = 10, iK = 11;
  const S = STEPS.map(() => ({ res: null, pick: null, tries: 0, shown: false, fb: null }));
  const WORKING = [iR, iWhy, iChk, iHigh, iWk, iA, iB, iCh];
  let lastStep = -1, finished = false, lines = 0;
  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

  // Text with key terms (*term*) highlighted in amber (the <mark> element), built with K.el, never innerHTML.
  function write(node, s) {
    node.textContent = '';
    String(s || '').split(/(\*[^*]+\*)/).forEach((b) => {
      if (!b) return;
      if (b.length > 2 && b.charAt(0) === '*' && b.charAt(b.length - 1) === '*') node.appendChild(K.el('mark', null, b.slice(1, -1)));
      else node.appendChild(document.createTextNode(b));
    });
    return node;
  }
  function paras(node, s) {
    node.textContent = '';
    String(s || '').split('\n\n').forEach((t) => { if (t) node.appendChild(write(K.el('p'), t)); });
  }
  const workLines = (w) => String(w || '').split('; ');

  // ---------- controls ----------
  const stepper = K.stepper({ id: 'step', label: 'Lesson', steps: STEPS.map((d) => d.name), value: 0, compact: true, into: '#prog' });
  const at = () => K.clamp(Math.round(stepper.get()) || 0, 0, STEPS.length - 1);
  const ctlLen = K.control({ id: 'len', label: 'Run length', hint: 'DBP2 to the starter', min: 0, max: 100, step: 0.2, value: RUN,
    fmt: (v) => f1(v) + ' m', snap: [RUN, 37.8, 38, 40, 50], into: '#ctl' });
  K.choice({ id: 'size', label: 'Line and cpc', options: [{ value: '2.5', label: '2.5 mm²' }, { value: '4', label: '4 mm²' }, { value: '6', label: '6 mm²' }], value: '2.5', into: '#ctl' });
  K.toggle({ id: 'hot', label: 'Worked hot, × ' + M90, value: true, into: '#ctl' });

  // The current flows round the loop, faster the more of it there is.
  let flowEl = null, flowOff = 0;
  const flow = K.anim({ button: false, label: 'Current round the loop', step: (dt) => {
    if (at() !== iWhy || REDUCE) return false;
    const o = K.outputs() || {};
    flowOff = (flowOff - dt * Math.max(6, (+o.ifl || 0) * 0.05)) % 160;
    if (flowEl) flowEl.setAttribute('stroke-dashoffset', flowOff.toFixed(1));
  } });

  // Picks: one tap answers.
  const pickBtns = [0, 1, 2].map((k) => K.button({ label: 'Answer ' + (k + 1), secondary: true, into: '#picks', press: () => pick(k) }));
  function pick(k) {
    const i = at(), d = STEPS[i], st = S[i];
    if (!d.opts || k >= d.opts.length) return;
    if (i === iR) {
      if (st.res) return;     // a recall gets one go
      st.pick = d.opts[k];
      const slips = [f2(RC.noC) + ' A leaves out Cmin.', f2(RC.cmax) + ' A uses Cmax, ' + CMAX + ', in its place.'];
      if (st.pick === d.want) {
        st.res = 'right';
        st.fb = { ok: true, v: 'Still there.', w: [RECALL_WORK],
          p: 'That is the breaker\'s *Ia* of 30 A. The maximum Zs is simply the Zs that still lets Ia flow at the lowest supply voltage.', xs: slips };
      } else {
        st.res = 'wrong';
        st.fb = st.pick === O_NOC
          ? { ok: false, v: 'You left out Cmin.', p0: 'The supply can sag to 218.5 V, so the fault current is worked at ' + CMIN + ' of ' + UO + ' V.',
            w: ['The working: ' + RECALL_WORK], p: 'That is the breaker\'s *Ia* of 30 A. Continue, and the refresh starts from here.' }
          : { ok: false, v: 'That is Cmax, ' + CMAX + '.', p0: 'It gives the largest current. You need that for conductor heating, in lesson 7. Whether the breaker opens in time is judged on the smallest current.',
            w: ['The working: ' + RECALL_WORK], p: 'That is the breaker\'s *Ia* of 30 A. Continue, and the refresh starts from here.' };
      }
    } else if (i === iChk) {
      if (st.res === 'right') return;
      st.pick = d.opts[k];
      if (st.pick === d.want) { st.res = 'right'; st.fb = { ok: true, v: 'That\'s it.', p0: d.why }; }

      if (k >= opts.length) return;
      b.setLabel(opts[k]);
      const done = st.res === 'right' || (i === iR && st.res === 'wrong');
      b.el.classList.toggle('is-right', done && opts[k] === d.want);
      b.el.classList.toggle('is-wrong', st.res === 'wrong' && opts[k] === st.pick);
      b.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });

    // The worked example's lines.
    wlines.forEach((w, k) => { w.hidden = k >= lines; });
    cutNote.hidden = lines < wlines.length;
    nextLine.el.hidden = lines >= wlines.length;
    if (i === iWk) el('workedgo').hidden = lines >= wlines.length;

    // Check, the feedback, and what follows a finished typed answer.
    const typed = !!ANS[i], typedDone = typed && (st.res === 'right' || st.shown);
    checkBtn.el.hidden = !typed || typedDone;
    el('acts').hidden = checkBtn.el.hidden;
    paintFb(st.fb);
    const after = el('after');
    after.textContent = typedDone && SPEC[i].after ? SPEC[i].after : '';
    after.hidden = !after.textContent;
    el('go').hidden = !(i === iR && st.res === 'right');

    el('donefb').textContent = finished && i === iK ? 'Lesson finished. Back is there whenever you want another look.' : '';
    el('donefb').hidden = !el('donefb').textContent;

    backBtn.el.hidden = i === 0;
    nextBtn.el.hidden = i === iK || !canGo(i) || (i === iR && st.res === 'right');
    el('nav').hidden = backBtn.el.hidden && nextBtn.el.hidden;
  });

  // ---------- known answers, worked out by hand ----------
  const near = (a, b) => K.near(a, b, 1e-9);
  K.check('At 11.4 m of 2.5 mm², worked hot: R1+R2 0.216 Ω, Zs 0.366 Ω and 596.99 A, as parts 2a and 2b work it', () => {
    const o = K.at({ len: RUN, size: '2.5', hot: true }); return near(o.r12, 0.216) && near(o.zs, f2a.value) && near(o.ifl, f2b.value);
  });
  K.check('Near 37.9 m the run meets the limit: 0.867 Ω and 252.02 A at 37.8 m, 0.871 Ω and 250.86 A at 38.0 m', () => {
    const a = K.at({ len: 37.8, size: '2.5', hot: true }), b = K.at({ len: 38, size: '2.5', hot: true });
    return near(a.zs, 0.867) && near(a.ifl, 252.02) && a.zs <= ZMAX && near(b.zs, f38.value) && near(b.ifl, 250.86) && b.zs > ZMAX && near(MAX25, fMax.value);
  });
  K.check('At 50 m: 2.5 mm² gives 1.098 Ω and 199.00 A, 4 mm² gives 0.740 Ω and 295.27 A', () => {
    const a = K.at({ len: 50, size: '2.5', hot: true }), b = K.at({ len: 50, size: '4', hot: true });
    return near(a.r12, 0.948) && near(a.zs, f50.value) && near(a.ifl, 199) && near(b.r12, 0.59) && near(b.zs, f504.value) && near(b.ifl, 295.27);
  });
  K.check('At 40 m: worked hot 0.909 Ω and 240.37 A, cold 0.743 Ω and 294.08 A, a gap of 0.166 Ω', () => {
    const h = K.at({ len: 40, size: '2.5', hot: true }), c = K.at({ len: 40, size: '2.5', hot: false });
    return near(h.zs, fHot.value) && near(h.ifl, 240.37) && near(c.r12, 0.593) && near(c.zs, fCold.value) && near(c.ifl, 294.08) && near(GAP, 0.166);
  });
  K.check('Longest runs within 0.87 Ω: 37.9 m in 2.5 mm², 61.0 m in 4 mm², 91.3 m in 6 mm²', () =>
    near(longest(MPM['2.5'], M90), fMax.value) && near(longest(MPM['4'], M90), fMax4.value) && near(longest(MPM['6'], M90), fMax6.value));
  K.check('Every metre adds: Zs never falls and the fault current never rises as the run lengthens', () => {
    for (const s of ['2.5', '4', '6']) for (const h of [true, false]) {
      let prev = null;
      for (let L = 0; L <= 100; L += 0.2) {
        const o = loop(L, s, h);
        if (prev && (o.zs < prev.zs || o.ifl > prev.ifl)) return false;
        prev = o;
      }
    }
    return true;
  });
  K.check('No run at all: Zs is the 0.15 Ω at DBP2, and 1456.67 A flows, inside the 1500 A axis', () => {
    const o = K.at({ len: 0 }); return near(o.zs, ZDB) && near(o.ifl, 1456.67) && o.ifl < IMAX;
  });
  K.check('Maximum Zs from the rule: 230 × 0.95 ÷ 250 = 0.874 Ω for the 25 A type C, 230 × 0.95 ÷ 125 = 1.748 Ω for a 25 A type B', () =>
    near(ZRULE, fZm.value) && near(ZB25, fTB.value));
  K.check('The recall: 230 × 0.95 ÷ 7.28 = 30.01 A; 31.59 A without Cmin, 34.75 A with Cmax', () =>
    near(RC.right, fR.value) && near(RC.noC, fR1.value) && near(RC.cmax, fR2.value));
  K.check('The heater: 0.436 Ω, 0.646 Ω and 338.24 A; the showroom origin 2185.00 A', () =>
    near(wR12, fWr.value) && near(wZs, fWz.value) && near(wI, fWi.value) && near(oI, fOrg.value));
  K.check('Section A slips and the changed numbers come out as the case file works them', () =>
    near(r3(ZDB + r3(MPM['2.5'] * RUN / 1000)), f2a1.value) && near(r3(ZE + A0.r12), f2a2.value) && near(r3(ZDB + r3(MPM['2.5'] * M70 * RUN / 1000)), f2a3.value) &&
    near(r2(UO / f2a.value), f2b1.value) && near(r2(UO * CMAX / f2a.value), f2b2.value) && near(r2(UO * CMIN / ZUN), 596.59) && near(atMotor, fLeg.value) &&
    near(chZ, fCh.value) && near(r3(CH.zb + r3(MPM['4'] * CH.len / 1000)), fCh1.value) && near(r3(CH.zb + r3(MPM['4'] * M90 * CH.len / 1000)), fCh2.value) &&
    near(chR, fCh3.value) && near(chFixZ, fChF.value));
  K.check('Every slip lies outside its answer\'s accepted figures', () => Object.keys(SPEC).every((k) => {
    const sp = SPEC[k], tol = 0.5 * Math.pow(10, -sp.dp);
    return sp.slips.every((s) => Math.abs(s.value - sp.fig.value) > tol * 2 && sp.accept.every((x) => Math.abs(s.value - x) > tol * 2));
  }));
  K.check('For a low voltage supply under the ESQCR, Cmin is 0.95', () => CMIN === 0.95,
    { source: 'https://electrical.theiet.org/media/1442/maximum-zs-values.pdf' });
  K.check('Table 41.3 gives a C25 breaker a maximum Zs of 0.87 Ω', () => near(ZMAX, 0.87),
    { source: 'https://www.elec-mate.com/guides/maximum-zs-values-bs-7671' });
  K.check('Table 41.5 gives 1667 Ω for a 30 mA device and 500 Ω for a 100 mA device', () => RCD[30] === 1667 && RCD[100] === 500,
    { source: 'https://www.elec-mate.com/guides/maximum-zs-values-bs-7671' });

  K.ready();
</script>
