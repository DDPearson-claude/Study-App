<p class="caption" id="cap">Figures from your slides, your assignment and your copy of BS 7671; practice values marked; each line worked from the rounded figures before it.</p>

<script>
  // ---------- the rule, and the course's figures ----------
  // Half up to 2 places, as the course rounds (each line worked from the rounded figures shown).
  const r2 = (x) => Math.round(x * 100 + 1e-7) / 100;
  const f2 = (x) => r2(x).toFixed(2);
  const rp = (x) => Math.round(x * 1e6) / 1e6;
  const F = (id) => K.figure(id);
  const el = (id) => document.getElementById(id);
  const R3 = Math.sqrt(3);

  // Your slides' heater circuit (p.26, 27): In 16 A; the room all along (Ca), the trunking (Cg), the wall (Ci).
  const IN = 16, CA = 0.94, CG = 0.8, CI = 0.88;
  // The run's three sections: the factors acting in each divide In to give the It it needs.
  function factorsOf(k, ins) {
    const a = [['Ca', CA]];
    if (k === 1) { a.push(['Cg', CG]); if (ins) a.push(['Ci', CI]); }
    if (k === 2) a.push(['Ci', CI]);
    return a;
  }
  function itOf(k, ins) {
    const fs = factorsOf(k, ins);
    if (fs.length === 1) return r2(IN / fs[0][1]);
    if (fs.length === 2) return r2(IN / rp(fs[0][1] * fs[1][1]));
    return r2(IN / (fs[0][1] * fs[1][1] * fs[2][1]));
  }
  function workOf(k, ins) {
    const fs = factorsOf(k, ins), it = itOf(k, ins), vals = fs.map((f) => f[1]);
    if (fs.length === 1) return ['Ca ' + CA, IN + ' ÷ ' + CA + ' = ' + f2(it) + ' A'];
    if (fs.length === 2) { const p = rp(vals[0] * vals[1]); return [vals.join(' × ') + ' = ' + p, IN + ' ÷ ' + p + ' = ' + f2(it) + ' A']; }
    return [IN + ' ÷ (' + vals.join(' × ') + ') = ' + f2(it) + ' A'];
  }
  function worstOf(ins) { const v = [0, 1, 2].map((k) => itOf(k, ins)); return v.indexOf(Math.max.apply(null, v)); }

  // Overload (your slides p.30 to 32): a 10 A device and the 1.0 mm² twin and earth, Iz 13 A.
  // Most devices' I2 is 1.45 In; a BS 3036 fuse's can be up to 2 In, so Cf = 0.725 (1.45 ÷ 2).
  const DEV_IN = 10, CAB_IZ = 13, CF = 0.725, FF = 2;
  function overloadOf(dev, cf) {
    const fuse = dev === 'fuse';
    const i2 = fuse ? r2(FF * DEV_IN) : r2(1.45 * DEV_IN);
    const iz = fuse && cf ? r2(DEV_IN / CF) : CAB_IZ;
    const lim = r2(1.45 * iz);
    return { i2, iz, lim, pass: i2 <= lim + 1e-9 };
  }

  const fR = F('l3.recall'), fRci = F('l3.recall.ci'), fRs = F('l3.recall.slip'), fClip = F('l3.sections.clipped');
  const fI2 = F('l3.overload.i2'), fLim = F('l3.overload.lim'), fFuse = F('l3.overload.fusei2'), fFF = F('l3.overload.ff');
  const fIt = F('l3.overload.it'), fMeet = F('l3.overload.check'), fChk = F('l3.check');
  const f1a = F('1a'), f1b = F('1b'), f1c = F('1c'), fStart = F('l3.A.start');
  const fTB = F('l3.A.tripB'), fTC = F('l3.A.tripC'), fTD = F('l3.A.tripD');
  const fCirc = F('l3.A.circuits'), f1d = F('1d'), f1e = F('1e'), f1f = F('1f'), fIz = F('l3.A.iz'), fRelay = F('l3.A.relay');
  const fCh = F('l3.practice.cf'), fAmb = F('g.ambient');
  const OUT_ONLY = r2(11000 / (R3 * 400));      // lesson 1's output-only current, 15.88 A
  const RATINGS = [16, 20, 25, 32];              // On-Site Guide p.145, the ratings near Ib
  const COL5 = [[1, 15], [1.5, 20]];             // Table 4E1A column 5 (your copy p.458): mm², A
  // The case file's accepted range, figure by figure (min to max, 0.01 A apart).
  function acceptOf(f) {
    const a = f.accept || (K.caseFile && (K.caseFile.figures || []).filter((x) => x.id === f.id).map((x) => x.accept)[0]);
    if (!a || a.min == null) return [];
    const out = [];
    for (let v = Math.round(a.min * 100); v <= Math.round(a.max * 100); v++) { const x = v / 100; if (Math.abs(x - f.value) > 0.004) out.push(x); }
    return out;
  }

  // ---------- the lesson: SHOW steps teach, DO steps ask ----------
  const E5 = 'Table 4E1A, column 5: Method B, 3 or 4 cables', E4 = 'Table 4E1A, column 4: Method B, 2 cables', E3 = 'Table 4E1A, column 3: Method A';
  const STEPS = [
    { name: 'Do you still have it?', label: 'Do you still have it?',
      task: "Your slides' heater circuit (p.26, 27): In 16 A, in a warm room all along the run (Ca 0.94). The cable is clipped direct, then runs in trunking with another circuit (Cg 0.8), then leaves the trunking to pass through a cavity wall with 50 mm of thermal insulation (Ci 0.88). What tabulated current It must the cable have?",
      opts: [fRci.text, fR.text, fRs.text], want: fR.text, why: fR.work + ', the worse of the two places.',
      read: 'It is ' + fR.text + ', the worse of the two places; all three multiplied gives ' + fRs.text + '.' },
    { show: true, name: 'What it is for', label: 'What it is for',
      text: 'The *device* protects the *cable*, so the device is chosen from the load, and the cable from the device.',
      read: 'Ib ≤ In ≤ Iz: the device at least the design current, the cable where it runs at least the device; and the current that finally operates the device, I2, no more than 1.45 Iz.' },
    { show: true, name: 'The why: the run in sections', label: 'The why · Sections',
      text: 'Anything that makes the cable artificially warm needs a *rating factor* (your slides p.24): Ca for the ambient, Cg for grouping, Ci for insulation. Each means the cable reaches its limit at a lower current, so the factors divide In to give the *It* the table must show (p.25).',
      read: 'The trunking section sets the cable at ' + fR.text + '; only where all three act in one place is it ' + fRs.text + '.' },
    { show: true, name: 'The why: overload', label: 'The why · Overload',
      text: "*I2* is the current causing effective operation of the device; most devices have an I2 of 1.45 times In (your slides p.30). How long that takes, the sources differ: a maker's catalogue gives its type B breakers from 6 to 63 A, like its C and D, operation within 1 hour at 1.45 In, its conventional time; your slides say it can take 10,000 s, about 2.8 hours (p.30). The design does not hang on the time: the cable must carry I2 for as long as the device takes, so *I2 ≤ 1.45 Iz*, a factor that keeps small overloads from deteriorating the cable.",
      read: "A 10 A breaker's " + fI2.text + " is within the 13 A cable's " + fLim.text + '; a 10 A rewireable fuse reaches ' + fFuse.text + ' and needs a cable with Iz of ' + fIt.text + '.' },
    { name: 'Check', label: 'Check',
      task: 'Seven circuits are bunched in one trunking. Four will each carry not more than 30% of their grouped rating. For the Cg of the other three, what is the fewest circuits you may count?',
      opts: ['7 circuits', '3 circuits', '2 circuits'], want: '3 circuits',
      why: 'The four may be ignored (Table 4C1 note 9). Each of the other three counts itself and the other two, and three circuits bunched take 0.70 (Table 4C1 item 1): ' + fChk.work + '.',
      read: 'Three circuits count, Cg 0.70.' },
    { show: true, name: 'Worked example', label: 'Worked example',
      text: "Your slides' own working, a line at a time. Work each line yourself first, then show it and check yours against it.",
      read: "Your slides' heater circuit needs " + fR.text + ' in the trunking and ' + fRci.text + ' in the wall, so 2.5 mm² on Reference Method B; their 10 A breaker\'s ' + fI2.text + ' sits within the 13 A cable\'s ' + fLim.text + '.' },
    { name: 'Section A (c)', label: 'Section A · Question 1', part: '(c) Determine the smallest standard rating of the circuit-breaker at DBP2 for the motor circuit.',
      task: "Your showroom's motor, its design current " + f1a.text + ' from part (a). (c) Determine the smallest standard rating of the circuit-breaker at DBP2 for the motor circuit.',
      want: f1c.text, why: f1c.work,
      read: f1c.text + ", type C (the course's choice); the relay at " + f1b.text + " guards the motor's cables against overload." },
    { name: 'Section A (d)', label: 'Section A · Question 1', part: '(d) Taking Ca as 1.00, determine the minimum tabulated current-carrying capacity, It, of the starter-to-motor cables.',
      task: 'The six starter-to-motor singles, the relay set at ' + f1b.text + '. (d) Taking Ca as 1.00, determine the minimum tabulated current-carrying capacity, It, of the starter-to-motor cables.',
      want: f1d.text, why: f1d.work, read: 'It ≥ ' + f1d.work + '.' },
    { name: 'Section A (e) and (f)', label: 'Section A · Question 1', part: '(f) Determine the minimum CSA of the starter-to-motor cables.',
      task: 'The same cables, It ' + f1d.text + ' from part (d). (e) State the table and the column. (f) Determine the minimum CSA of the starter-to-motor cables.',
      want: f1f.text, why: f1f.work, read: 'Table 4E1A, column 5; ' + f1f.text + ', Iz ' + fIz.text + '.' },
    { kind: 'written', written: 'b1', name: 'Section B', label: 'Section B · Short answer',
      task: 'A short written answer, in your own words.' },
    { name: 'Changed numbers', label: 'Section A · Changed numbers',
      part: 'An older circuit is protected by a 15 A semi-enclosed (rewireable) fuse to BS 3036, and no other rating factor applies. Determine the minimum tabulated current-carrying capacity, It, of its cable.',
      task: 'An older circuit is protected by a 15 A semi-enclosed (rewireable) fuse to BS 3036, and no other rating factor applies. Determine the minimum tabulated current-carrying capacity, It, of its cable.',
      want: fCh.text, why: fCh.work, read: 'It ≥ ' + fCh.work + '.' },
    { kind: 'summary', name: 'Keep this', label: 'Keep this' },
  ];
  const S = STEPS.map(() => ({ res: null, pres: null, ppick: null, pfb: null, tries: 0, shown: false, why: false, fb: null, tp: null, tpick: null, tpfb: null }));
  const iC = 6, iD = 7, iEF = 8, iW = 9, iCh = 10, iK = 11;
  const WORKING = [2, 3, 5, iC, iD, iEF, iCh];      // the screens with working, where the caption belongs
  let lastStep = -1, finished = false, lines = 0, selSec = 1;
  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

  // Text with key terms (*term*) highlighted in amber (the <mark> element), built with K.el, never innerHTML.
  function write(node, s) {
    node.textContent = '';
    String(s || '').split(/(\*[^*]+\*)/).forEach((b) => {
      if (!b) return;
      if (b.length > 2 && b.charAt(0) === '*' && b.charAt(b.length - 1) === '*') node.appendChild(K.el('mark', null, b.slice(1, -1)));
      else node.appendChild(document.createTextNode(b));
    });
  }
  // Every wording laid out in one place, only wording k seen (see .held).
  function held(node, wordings, k) {
    node.textContent = '';
    const box = K.el('div', { class: 'held' });
    wordings.forEach((parts, j) => {
      const s = K.el('span', j === k ? null : { class: 'ghost', 'aria-hidden': 'true' });
      parts.forEach((x) => s.appendChild(typeof x === 'string' ? document.createTextNode(x) : x));
      box.appendChild(s);
    });
    node.appendChild(box);
  }

  // ---------- controls ----------
  const stepper = K.stepper({ id: 'step', label: 'Lesson', steps: STEPS.map((d) => d.name), value: 0, compact: true, into: '#prog' });
  const at = () => K.clamp(Math.round(stepper.get()) || 0, 0, STEPS.length - 1);
  const insT = K.toggle({ id: 'ins', label: 'Insulation inside the trunking too', value: false, into: '#ctl3' });
  const devC = K.choice({ id: 'dev', label: 'Device', options: [{ value: 'breaker', label: '10 A type B breaker' }, { value: 'fuse', label: '10 A rewireable fuse' }], value: 'breaker', into: '#ctl4' });
  const cfT = K.toggle({ id: 'cf', label: 'Apply Cf = 0.725', hint: 'For the rewireable fuse', value: false, into: '#ctl4' });
  const shown = { dev: devC.get(), cf: cfT.get() };

  // The overload marks glide to where the rule puts them; on arriving at that screen a short
  // demonstration chooses the fuse, then applies Cf, so the fuse's I2 passes the cable's 1.45 Iz
  // in red and then the cable's marks rise to meet it.
  const GLIDE = 0.9;
  const glide = { from: null, to: null, t: GLIDE };
  let said = { dev: 'breaker', cf: false };   // what the words say: changed only when the marks arrive
  function posNow() {
    if (!glide.to) return null;
    const e = K.ease(K.clamp(glide.t / GLIDE, 0, 1));
    return { i2: K.lerp(glide.from.i2, glide.to.i2, e), iz: K.lerp(glide.from.iz, glide.to.iz, e), lim: K.lerp(glide.from.lim, glide.to.lim, e) };
  }
  function snapTo(o) { glide.from = o; glide.to = o; glide.t = GLIDE; }
  let demoT = 0, demoOn = false;
  const DEMO_END = 4.2;
  const demoAt = (t) => ({ dev: t < 1 ? 'breaker' : 'fuse', cf: t >= 2.6 });
  const anim = K.anim({ button: false, label: 'The overload marks', step: (dt) => {
    if (demoOn) {
      demoT += dt;
      const d = demoAt(demoT);
      if (devC.get() !== d.dev || cfT.get() !== d.cf) { devC.set(d.dev, true); cfT.set(d.cf, true); shown.dev = d.dev; shown.cf = d.cf; }
      if (demoT >= DEMO_END) demoOn = false;
    }
    glide.t += dt;
    K.refresh();
    if (!demoOn && glide.t >= GLIDE) return false;
  } });
  function aimAt(o) {
    if (glide.to && glide.to.i2 === o.i2 && glide.to.iz === o.iz && glide.to.lim === o.lim) return;
    const p = posNow() || o;
    glide.from = p; glide.to = o; glide.t = REDUCE ? GLIDE : 0;
    if (!REDUCE && !anim.playing()) anim.play();
  }
  function startDemo() {
    demoOn = false;
    const end = demoAt(DEMO_END), d0 = REDUCE ? end : demoAt(0);
    devC.set(d0.dev, true); cfT.set(d0.cf, true); shown.dev = d0.dev; shown.cf = d0.cf;
    snapTo(overloadOf(d0.dev, d0.cf));
    if (REDUCE) return;
    demoT = 0; demoOn = true;
    if (!anim.playing()) anim.play();
  }
  function stopDemo() { demoOn = false; }
  const replayBtn = K.button({ label: 'Replay', secondary: true, into: '#replay', press: () => { if (at() === 3) { startDemo(); K.refresh(); } } });

  // ---------- picks: one tap answers ----------
  const PK = {
    0: { opts: STEPS[0].opts, want: STEPS[0].want, once: true },
    4: { opts: STEPS[4].opts, want: STEPS[4].want,
      right: { ok: true, v: "That's it: three circuits.", w: fChk.work },
      hints: { '7 circuits': 'Counting all seven is allowed, and cautious, but note 9 lets the four light ones go: you may count fewer.',

    if (f.w) node.appendChild(K.el('p', { class: 'w' }, f.w));
    if (f.p) { const p = K.el('p'); write(p, f.p); node.appendChild(p); }
  }

  // ---------- nav ----------
  const backBtn = K.button({ label: 'Back', secondary: true, into: '#nav', press: () => { if (at() > 0) stepper.set(at() - 1); } });
  const nextBtn = K.button({ label: 'Continue', into: '#nav', press: () => { const i = at(); if (canGo(i) && i < iK) stepper.set(i + 1); } });
  const typedDone = (i) => !!ANS[i] && (S[i].res === 'right' || S[i].shown);
  function canGo(i) {
    const d = STEPS[i], st = S[i];
    if (d.show) return true;
    if (i === 0) return st.pres === 'wrong';
    if (i === 4) return st.pres === 'right';
    if (i === iD || i === iEF) return st.pres === 'right' && typedDone(i);
    if (i === iC) return typedDone(i) && st.tp === 'right';
    if (ANS[i]) return typedDone(i);
    if (i === iW) return !!(wB && wB.answered && wB.answered());
    return false;
  }

  K.model((p) => {
    const o = overloadOf(p.dev, !!p.cf);
    return { clip: itOf(0, !!p.ins), trunk: itOf(1, !!p.ins), wall: itOf(2, !!p.ins), worst: worstOf(!!p.ins), i2: o.i2, iz: o.iz, lim: o.lim, pass: o.pass ? 1 : 0 };
  });

  const ON = { scen: [iC, iD, iEF], carry6: [iC], carry7: [iD], carry8: [iEF], given: [iC, iD], wrap: [2, 3], status: [3], ctl3: [2], ctl4: [3], replay: [3],
    secwork: [2], say: [2, 3], notes2: [2], notes3: [3], rule1: [1], warn2: [1], worked: [5], workedgo: [5], pq: [iD, iEF], picks: [0, 4, iD, iEF], pacts: [4],
    mid: [iD], aq: [iC, iD, iEF, iCh], aqsub: [iEF], 'ans-1c': [iC], 'ans-1d': [iD], 'ans-1f': [iEF], 'ans-ch': [iCh], wr: [iW], keep: [iK], fin: [iK] };
  const HEADS = ['Clipped direct: only the warm room acts here.', 'In trunking with another circuit: the warm room and the grouping act together.', "Through the wall's insulation: the warm room and the insulation act together."];

  K.update(() => {
    const i = at(), d = STEPS[i], st = S[i];
    if (i !== lastStep) {
      if (lastStep !== -1) enter();
      lastStep = i;
      if (i === 3) startDemo(); else stopDemo();
      if (i === iC) scen.el.open = true; else if (i === iD || i === iEF) scen.el.open = false;
    }
    if (i === 3) {
      const dv = devC.get(), cv = cfT.get();
      if (dv !== shown.dev || cv !== shown.cf) { stopDemo(); shown.dev = dv; shown.cf = cv; }
    } else { shown.dev = devC.get(); shown.cf = cfT.get(); }
    Object.keys(ON).forEach((id) => { el(id).hidden = ON[id].indexOf(i) < 0; });
    el('cap').hidden = WORKING.indexOf(i) < 0;

    el('count').textContent = 'Step ' + (i + 1) + ' of ' + STEPS.length + ' · ' + d.label;
    const task = el('task');
    task.className = 'task' + (d.show ? ' show' : '');
    write(task, d.show ? d.text : i === 0 || i === 4 || d.kind === 'written' ? d.task : '');
    task.hidden = !task.textContent;
    const sub = el('sub');
    sub.textContent = i === 2 ? "Your slides' heater circuit (p.26), In 16 A, drawn as its route in three sections. Tap a section to read its working."
      : i === 3 ? "Your slides' 10 A circuit and its 1.0 mm² twin and earth (p.30, 31), on one current line. Choose the device, then apply Cf" + (REDUCE ? '.' : ', or Replay.')
      : i === iCh ? 'A City & Guilds Section A shape, with new numbers.' : i === iK ? 'One card to come back to on a real job.' : '';
    sub.hidden = !sub.textContent;
    el('given').textContent = i === iC ? 'Given: the standard ratings near it, 16, 20, 25 and 32 A (On-Site Guide p.145).'
      : i === iD ? 'Given: the room at ' + fAmb.text + " (pack p.3). Six 90 °C thermosetting singles run from the starter to the motor, sized on the delta running conditions (pack p.4), in one conduit on the consultation bay's wall, clear of insulation (the course's assumption: Ci and Cf are 1)." : '';

    // The picture for this screen.
    svg.textContent = '';
    if (i === 2) {
      const ins = insT.get();
      drawSections(ins);
      const box = el('secwork');
      box.textContent = '';
      box.appendChild(K.el('p', null, K.el('b', null, selSec === 1 && ins ? 'In trunking, insulated too: all three act together here.' : HEADS[selSec])));
      workOf(selSec, ins).forEach((t) => box.appendChild(K.el('p', { class: 'w' }, t)));
      held(el('say'), [
        ['The trunking needs the most, ' + f2(itOf(1, false)) + ' A: there the warm room starts the cable warmer and the other circuit stops it shedding its heat, so it sets the cable. The wall needs ' + f2(itOf(2, false)) + ' A and the clipped part ' + f2(itOf(0, false)) + ' A.'],
        ['With insulation inside the trunking too, all three act in one place, so the trunking needs ' + f2(itOf(1, true)) + ' A: the one place where multiplying all three is right.'],
      ], ins ? 1 : 0);
    } else if (i === 3) {
      const dv0 = devC.get(), cv0 = cfT.get(), o0 = overloadOf(dv0, cv0);
      aimAt(o0);
      if (REDUCE || glide.t >= GLIDE) said = { dev: dv0, cf: cv0 };
      const dv = said.dev, cv = said.cf, o = overloadOf(dv, cv);
      drawOverload(dv, cv, o, posNow() || o0);
      const fuse = dv === 'fuse';
      const k = !fuse ? (cv ? 3 : 0) : cv ? 2 : 1;
      const ob = overloadOf('breaker', false), of = overloadOf('fuse', false), oc = overloadOf('fuse', true);
      held(el('say'), [
        ['A 10 A breaker can let ' + f2(ob.i2) + ' A flow before it opens, and the 13 A cable can take ' + f2(ob.lim) + ' A for that long, so the cable lasts.'],
        ['A 10 A rewireable fuse can let ' + f2(of.i2) + ' A flow before it opens, past the ' + f2(of.lim) + ' A the 13 A cable can take, so the cable could run hot for as long as the fuse takes.'],
        ["Dividing the fuse's 10 A by Cf asks for a cable with Iz " + f2(oc.iz) + ' A, whose 1.45 Iz, ' + f2(oc.lim) + " A, meets the fuse's " + f2(oc.i2) + ' A: the 13 A cable is too small behind this fuse.'],
        ["Cf is only for a rewireable fuse: the breaker's " + f2(ob.i2) + " A is already within the 13 A cable's " + f2(ob.lim) + ' A, so nothing changes.'],
      ], k);
      held(el('status'), [
        ['Passes'],
        [K.el('span', { class: 'bad' }, 'Fails: the cable could carry ' + f2(of.i2) + ' A until the fuse opens')],
        ['Passes with Iz ' + f2(oc.iz) + ' A: the 13 A cable is too small behind this fuse'],
      ], !fuse ? 0 : cv ? 2 : 1);
    }
    replayBtn.el.hidden = REDUCE;
    if (REDUCE) el('replay').hidden = true;

    // Picks.
    const pk = PK[i], opts = pk ? pk.opts : [];
    el('pq').textContent = (pk && pk.q) || '';
    if (!el('pq').textContent) el('pq').hidden = true;
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      b.setLabel(opts[k]);
      const done = st.pres === 'right' || (pk.once && st.pres === 'wrong');
      b.el.classList.toggle('is-right', done && opts[k] === pk.want);
      b.el.classList.toggle('is-wrong', st.pres === 'wrong' && opts[k] === st.ppick);
      b.el.setAttribute('aria-pressed', st.ppick === opts[k] ? 'true' : 'false');
    });
    paintFb(el('pfb'), pk ? st.pfb : null);
    whyBtn.setLabel(st.why ? 'Hide why' : 'Why?');
    const why = el('why');
    why.hidden = i !== 4 || !st.why;
    write(why, i === 4 ? d.why : '');
    el('go').hidden = !(i === 0 && st.pres === 'right');

    // Section A words around the typed answers.
    el('mid').textContent = i === iD ? 'Ca, a practice value: Table 4B1 is for ambients other than 30 °C, and its first row, 25 °C, gives 1.02 for 90 °C thermosetting. The course takes 1.00 at 20 °C, which takes no credit for the cool room: read the real treatment from your copy of Table 4B1.' : '';
    write(el('aq'), d.part || '');
    el('aqsub').textContent = i === iEF ? (S[iEF].pres === 'right' ? 'Read column 5 in your copy (p.458).' : 'Read the column from (e) in your copy (p.458).') : '';

    // Check and its feedback.
    const typed = !!ANS[i];
    checkBtn.el.hidden = !typed || typedDone(i);
    el('acts').hidden = checkBtn.el.hidden;
    paintFb(el('fb'), typed ? st.fb : null);
    el('more6').hidden = !(i === iC && typedDone(iC));
    const tOn = i === iC && typedDone(iC), sc = S[iC];
    el('tq').hidden = !tOn; el('tpicks').hidden = !tOn;
    tBtns.forEach((b, k) => { b.el.classList.toggle('is-right', sc.tp === 'right' && k === 1); b.el.classList.toggle('is-wrong', sc.tp === 'wrong' && k === sc.tpick); b.el.setAttribute('aria-pressed', sc.tpick === k ? 'true' : 'false'); });
    paintFb(el('tfb'), tOn ? sc.tpfb : null);
    el('more6b').hidden = !(tOn && sc.tp === 'right');
    el('more8').hidden = !(i === iEF && typedDone(iEF));

    // The worked example's lines.
    wlines.forEach((w, k) => { w.hidden = k >= lines; });
    cutNote.hidden = lines < wlines.length;
    nextLine.el.hidden = lines >= wlines.length;
    if (i === 5) el('workedgo').hidden = lines >= wlines.length;

    el('donefb').textContent = finished && i === iK ? 'Lesson finished. Back is there whenever you want another look.' : '';
    el('donefb').hidden = !el('donefb').textContent;
    el('foot').textContent = i === iC || i === iD || i === iEF ? "Shaped like a City & Guilds 2396 Section A question, on your own assignment's motor (pack p.4)." : '';
    el('foot').hidden = !el('foot').textContent;

    backBtn.el.hidden = i === 0;
    nextBtn.el.hidden = i === iK || !canGo(i) || (i === 0 && st.pres === 'right');
    el('nav').hidden = backBtn.el.hidden && nextBtn.el.hidden;
  });

  // ---------- known answers, worked out by hand ----------
  const near = (a, b) => K.near(a, b, 1e-9);
  K.check("The sections give the case file's figures: clipped 17.02 A, trunking 21.28 A, wall 19.34 A; all three in one place 24.18 A", () => {
    const a = K.at({ ins: false }), b = K.at({ ins: true });
    return near(a.clip, fClip.value) && near(a.trunk, fR.value) && near(a.wall, fRci.value) && near(b.trunk, fRs.value) && near(b.wall, fRci.value) && near(b.clip, fClip.value);
  });
  K.check('The trunking sets the cable either way, and insulating it too only raises what it needs', () => {
    const a = K.at({ ins: false }), b = K.at({ ins: true });
    return a.worst === 1 && b.worst === 1 && b.trunk > a.trunk && a.trunk > a.wall && a.wall > a.clip;
  });
  K.check("Overload: the breaker's 14.50 A within 18.85 A; the fuse's 20.00 A past it; with Cf, Iz 13.79 A and 1.45 Iz 20.00 A meet it", () => {
    const b = K.at({ dev: 'breaker', cf: false }), f = K.at({ dev: 'fuse', cf: false }), c = K.at({ dev: 'fuse', cf: true }), bc = K.at({ dev: 'breaker', cf: true });
    return near(b.i2, fI2.value) && near(b.lim, fLim.value) && b.pass === 1 && near(f.i2, fFuse.value) && f.pass === 0 &&
      near(c.iz, fIt.value) && near(c.lim, fMeet.value) && near(c.i2, c.lim) && c.pass === 1 && near(bc.i2, b.i2) && near(bc.lim, b.lim);
  });
  K.check('Cf is 1.45 ÷ 2: for any rating from 5 to 63 A, the cable Cf asks for has a 1.45 Iz within 0.01 A of twice In', () => {
    if (!near(1.45 / FF, CF) || !near(FF, fFF.value)) return false;
    for (let n = 5; n <= 63; n++) if (Math.abs(r2(1.45 * r2(n / CF)) - 2 * n) > 0.0101) return false;
    return true;
  });
  K.check('The current I2 that operates the device should not exceed 1.45 times Iz: 1.45 × 13 = 18.85 A, above the breaker\'s 14.50 A', () => near(r2(1.45 * CAB_IZ), fLim.value) && fI2.value <= fLim.value,
    { source: 'https://professional-electrician.com/technical/requirements-protection-overload' });
  K.check('A BS 3036 fuse meets it where In does not exceed 0.725 times Iz: a 10 A fuse needs Iz of 13.79 A', () => K.near(DEV_IN / fIt.value, CF, 0.0005) && near(r2(DEV_IN / CF), fIt.value),
    { source: 'https://professional-electrician.com/technical/requirements-protection-overload' });
  K.check('The check: seven bunched, four lightly loaded, three counted', () => near(7 - 4, fChk.value));
  K.check('The worked example: 0.752 and 0.8272 give 21.28 and 19.34 A; 10 × 1.45 = 14.50 A; 13 × 1.45 = 18.85 A', () =>
    near(P1, 0.752) && near(P2, 0.8272) && near(r2(IN / P1), fR.value) && near(r2(IN / P2), fRci.value) && near(r2(1.45 * DEV_IN), fI2.value) && near(r2(1.45 * CAB_IZ), fLim.value));
  K.check('1(c): 25 A is the smallest of 16, 20, 25 and 32 A not below 23.08 A; the practice start, 2.7 × 23.08 = 62.32 A, sits below type C\'s 125 to 250 A', () =>
    RATINGS.filter((x) => x >= f1a.value)[0] === f1c.value && near(r2(2.7 * f1a.value), fStart.value) &&
    fTB.value === 3 * 25 + ' to ' + 5 * 25 && fTC.value === 5 * 25 + ' to ' + 10 * 25 && fTD.value === 10 * 25 + ' to ' + 20 * 25 && 5 * f1c.value > fStart.value &&
    near(OUT_ONLY, 15.88) && F('1c.slip1').value < f1a.value && F('1c.slip2').value < f1a.value);
  K.check('The type: all three clear the practice start of 62.32 A, B by least; C, the course\'s choice, is the middle', () =>
    3 * f1c.value > fStart.value && 3 * f1c.value < 5 * f1c.value && 5 * f1c.value < 10 * f1c.value && TYPES[1][0] === 'C' && TFB[1].ok && !TFB[0].ok && !TFB[2].ok);
  K.check('1(d) to 1(f): 6 ÷ 3 = 2 circuits; 13.33 ÷ (1.00 × 0.80) = 16.66 A; 1.5 mm² (20 A) the smallest in column 5 that passes; Iz 16.00 A; 1.45 × 16.00 = 23.20 A', () =>
    near(6 / 3, fCirc.value) && near(r2(f1b.value / (1 * 0.8)), f1d.value) && COL5.filter((c) => c[1] >= f1d.value)[0][0] === f1f.value &&
    near(r2(20 * 1 * 0.8), fIz.value) && near(r2(1.45 * fIz.value), fRelay.value) && fIz.value >= f1b.value &&
    near(r2(f1b.value / 1), F('1d.slip1').value) && near(r2(f1a.value / 0.8), F('1d.slip3').value) && near(r2(25 / 0.8), F('1d.slip4').value) && near(r2(f1b.value / rp(1.02 * 0.8)), F('1d.slip5').value));
  K.check('Changed numbers: 15 ÷ 0.725 = 20.69 A; its slips 15.00, 10.88 and 21.75 A', () =>
    near(r2(15 / CF), fCh.value) && near(15, F('l3.practice.cf.slip1').value) && near(r2(15 * CF), F('l3.practice.cf.slip2').value) && near(r2(1.45 * 15), F('l3.practice.cf.slip3').value));
  K.check('Every typed answer takes its own figure and refuses each of its slips', () => Object.keys(SPEC).every((k) => {
    const sp = SPEC[k], spec = { answer: sp.fig.value, decimals: sp.decimals, accept: sp.accept, slips: sp.slips, unit: sp.unit };
    return K.answer.grade(String(sp.fig.value), spec).state === 'right' && sp.slips.every((s) => K.answer.grade(String(s.value), spec).state === 'wrong');
  }));
  K.check('The demonstration opens on the breaker and settles on the fuse with Cf applied', () => {
    const a = demoAt(0), b = demoAt(DEMO_END); return a.dev === 'breaker' && a.cf === false && b.dev === 'fuse' && b.cf === true;
  });

  K.ready();
</script>
