<p class="caption" id="cap">Practice values are marked. Each line is worked from the rounded figure before it.</p>

<script>
  // ---------- the rule, and the course's figures ----------
  // Half up to 2 places, as the course rounds (each line worked from the rounded figure shown).
  const r2 = (x) => Math.round(x * 100 + 1e-7) / 100;
  const a2 = (v) => r2(v).toFixed(2) + ' A';
  const F = (id) => K.figure(id);
  const el = (id) => document.getElementById(id);
  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

  // A lighting circuit's current: fluorescent tube watts × 1.25 for the ballast, ÷ (230 × 0.96);
  // LED watts ÷ (230 × 0.95). 1.25, 0.96 and 0.95 are the course's practice values (step 6).
  const U0 = 230, BALLAST = 1.25, PF_FL = 0.96, PF_LED = 0.95, PF_OTHER = 0.9;
  const DFL = r2(U0 * PF_FL), DLED = r2(U0 * PF_LED);
  const MOD_W = 4 * 36, TWIN_W = 2 * 58, LED_W = 26, BOL_W = 18, SPOT_W = 2 * 35, COL_W = 70;
  const flAmps = (w) => r2(r2(w * BALLAST) / DFL);
  const ledAmps = (w) => r2(w / DLED);
  // The neutral: three currents a third of a cycle apart, at about the same power factor.
  const inOf = (a, b, c) => r2(Math.sqrt(Math.max(0, a * a + b * b + c * c - a * b - b * c - c * a)));

  // DBL2's seven lighting circuits, the course's own split (assumption a.dbl2circuits).
  const CIRC = [
    { n: 'C1', name: 'Consultation', feeds: 'consultation bay', what: '6 modular', W: 6 * MOD_W, fl: true, fid: 'l2.c1' },
    { n: 'C2', name: 'Toilets W', feeds: 'uni-sex and female toilets', what: '5 modular', W: 5 * MOD_W, fl: true, fid: 'l2.c2' },
    { n: 'C3', name: 'Toilets E and tea', feeds: 'cleaner, male toilets and tea bay', what: '7 modular', W: 7 * MOD_W, fl: true, fid: 'l2.c3' },
    { n: 'C4', name: 'Stores', feeds: 'the two stores', what: '4 twin', W: 4 * TWIN_W, fl: true, fid: 'l2.c4' },
    { n: 'C5', name: 'Showroom E', feeds: 'showroom east', what: '28 LED', W: 28 * LED_W, fl: false, fid: 'l2.c5' },
    { n: 'C6', name: 'Reception', feeds: 'service reception', what: '21 LED', W: 21 * LED_W, fl: false, fid: 'l2.c6' },
    { n: 'C7', name: 'Foyer', feeds: 'foyer', what: '6 LED and 6 bollards', W: 6 * LED_W + 6 * BOL_W, fl: false, fid: 'l2.c7' },
  ];
  const AMPS = CIRC.map((c) => (c.fl ? flAmps(c.W) : ledAmps(c.W)));
  const TOTAL = r2(AMPS.reduce((s, v) => s + v, 0));
  const ALL1 = [0, 0, 0, 0, 0, 0, 0];
  const SPLIT = [0, 2, 1, 2, 0, 1, 2];          // L1: C1, C5; L2: C3, C6; L3: C2, C4, C7
  const sumsOf = (ph) => { const s = [0, 0, 0]; ph.forEach((p, k) => { s[p] += AMPS[k]; }); return s.map(r2); };
  const loadOf = (ph) => { const s = sumsOf(ph); return { s, n: inOf(s[0], s[1], s[2]) }; };
  // Moves that take one arrangement to another, a card at a time, in circuit order.
  const planMoves = (from, to) => from.map((p, k) => [k, to[k]]).filter((m) => from[m[0]] !== m[1]);

  // Section A: DBL2's share, counted on the lighting drawing; the whole installation (question 10).
  const N_LED = 55, N_MOD = 18, N_TWIN = 4, N_BOL = 6;
  const SOCK_N = 8, SOCK_A = 32, DP_N = 3, DP_A = 20, ROT_A = 32, EV_N = 4, EV_A = 32;
  const std = (n, a) => r2(a + 0.5 * (n - 1) * a);                 // standard circuits: 100% + 50% of every other
  const heat = (big, n, a) => r2(big + 0.75 * n * a);               // heating and power: 100% + 75% of the rest
  const dbl1 = r2(flAmps(16 * MOD_W + 12 * TWIN_W) + ledAmps(103 * LED_W + 6 * BOL_W) + r2((9 * SPOT_W + 6 * COL_W) / r2(U0 * PF_OTHER)));
  const f1a = F('1a');
  const mdOf = (light) => { const tot = r2(light + std(SOCK_N, SOCK_A) + heat(ROT_A, DP_N, DP_A) + EV_N * EV_A), per = r2(tot / 3); return { tot, per, ans: r2(per + f1a.value) }; };
  const LIGHT = r2(TOTAL + dbl1);
  const CH = { n: 5, a: 32, light: 18 };
  const chOf = (lf) => r2(std(CH.n, CH.a) + r2(lf * CH.light));

  const fAll = F('l2.neutral.allL1'), fTot = F('l2.dbl2.total'), fN = F('l2.neutral'), fL2 = F('l2.L2'), fL3 = F('l2.L3');
  const fK = F('l2.check'), fK1 = F('l2.check.slip1'), fK2 = F('l2.check.slip2');
  const fDv = F('l2.worked.diversity'), fI660 = F('l2.worked.ib660'), fI1000 = F('l2.worked.ib1000'), fFl = F('l2.worked.fluo'), fLed = F('l2.worked.led');
  const f3a = F('3a'), f3b = F('3b'), f3c = F('3c'), fCh = F('l2.A.changed');
  const fD1 = F('l2.dbl1'), fML = F('l2.md.light'), fMS = F('l2.md.sock'), fMF = F('l2.md.fixed'), fME = F('l2.md.ev');
  // The accepted range is the case file's (its accept min to max), centred on the course's figure.
  const caseAccept = (id) => { const f = ((K.caseFile && K.caseFile.figures) || []).filter((x) => x && x.id === id)[0]; return f && f.accept; };
  const tolOf = (id, f) => { const a = caseAccept(id); return a ? r2(Math.max(f.value - a.min, a.max - f.value)) : 0.005; };

  // ---------- the lesson: SHOW steps teach, DO steps ask ----------
  const R_OPTS = ['Yes: BS 7671 sets the percentages', 'No: it is guidance, used where common sense allows', 'Yes, wherever the On-Site Guide gives a percentage'];
  const GUIDANCE = 'The percentages come only from the On-Site Guide. So they are guidance, and you do not have to apply them.';
  const CH_Q = 'A small office has a single-phase board. It feeds five 32 A socket circuits, arranged as standard circuits, and lighting with a total current demand of 18.00 A. Use the allowances for small shops, stores and offices: standard circuits at 100% of the largest plus 50% of every other, and lighting at 90%. Determine its maximum demand.';
  const STEPS = [
    { name: 'Do you still have it?', label: 'Do you still have it?',
      task: 'There is a diversity percentage for lighting circuits. Is diversity a rule you must apply?',
      opts: R_OPTS, want: R_OPTS[1], why: GUIDANCE },
    { show: true, name: 'What it is for', label: 'What it is for',
      text: '*Maximum demand* is the largest current an installation draws at any one time. You size the supply and each submain from it. Regulation 311.1 lets you work it out for the whole installation or for one part, so each board gets its own figure. Question 10 of the assignment asks for it. You may make informed assumptions where you need to. It links to question 1b, on balancing the loads.' },
    { show: true, name: 'The why', label: 'The why',
      text: 'Each of DBL2\'s lighting circuits runs between one line and the neutral. Equal currents on L1, L2 and L3 cancel in the neutral, but unequal ones do not. So the *neutral* carries the imbalance, and the *heaviest phase* sets what the supply must carry.',
      read: 'Put all seven of DBL2\'s lighting circuits on L1, and the neutral carries ' + fAll.text + ', as much as L1. Share them out over the three phases, and it carries just ' + fN.text + ', harmonics aside. The heaviest phase is then ' + f3b.text + '.',
      // The read-through's still: the cards shared out over the three phases, as the sentence ends.
      still: () => runTo(SPLIT) },
    { name: 'Check', label: 'Check',
      task: 'A board\'s lighting circuits carry 10 A on L1, 10 A on L2 and 4 A on L3, at about the same power factor. What does the neutral carry?',
      opts: [fK1.text, fK.text, fK2.text], want: fK.text,
      why: 'The 4 A on each phase cancels. That leaves 6 A on L1 and 6 A on L2, a third of a cycle apart, and those add to 6 A. By the rule: ' + fK.work + '.',
      hints: { [fK1.text]: 'Not quite: you added them as if they were in step. They are a third of a cycle apart, so they partly cancel.',
        [fK2.text]: 'Not quite. Only equal currents cancel completely, and these are not equal.' } },
    { show: true, name: 'Diversity', label: 'Diversity, as common sense',
      text: 'Not every load runs flat out at once, so a building draws less than its connected load. *Diversity* means designing with common sense rather than for the maximum.' },
    { show: true, name: 'Worked example', label: 'Worked example',
      text: 'First a lighting circuit with diversity, then one of each kind of fitting on the drawing\'s key. Work each step yourself first. Then show it and check yours against it.',
      read: 'First a lighting circuit with diversity, then one of each kind of fitting on the drawing\'s key, a step at a time.' },
    { name: 'Section A (a)', label: 'Section A · Question 3', part: '(a) Determine the connected lighting load of DBL2, from the key\'s wattages.',
      task: 'DBL2 feeds 55 LED 26 W, 18 modular 4 × 36 W, 4 twin 58 W and 6 walkway bollards 18 W. Take each twin as two tubes. (a) Determine the connected lighting load of DBL2, from the key\'s wattages.',
      want: f3a.text, why: f3a.work },
    { name: 'Section A (b)', label: 'Section A · Question 3', part: '(b) Determine the current on L1.',
      task: 'DBL2\'s seven lighting circuits are shared as L1: C1 and C5, L2: C3 and C6, and L3: C2, C4 and C7. (b) Determine the current on L1.',
      want: f3b.text, why: f3b.work },
    { name: 'Section A (c)', label: 'Section A · Question 3', part: '(c) Determine the maximum demand of the installation, per phase.',
      task: 'Take the showroom\'s lighting at 100%, eight 32 A socket circuits as standard circuits, the fixed points as heating and power, four 32 A EV outlets with no diversity, and the motor\'s ' + f1a.text + '. (c) Determine the maximum demand of the installation, per phase.',
      want: f3c.text, why: f3c.work },
    { kind: 'written', written: 'b1', name: 'Section B', label: 'Section B · Short answer',
      task: 'A short written answer, in your own words.' },
    { name: 'Changed numbers', label: 'Section A · Changed numbers', part: CH_Q, task: CH_Q, want: fCh.text, why: fCh.work },
    { kind: 'summary', name: 'Keep this', label: 'Keep this' },
  ];
  const S = STEPS.map(() => ({ res: null, pick: null, tries: 0, shown: false, why: false, fb: null }));
  const iY = 2, iChk = 3, iWk = 5, iA = 6, iB = 7, iC = 8, iW = 9, iCh = 10, iK = 11;
  const WORKING = [iY, iChk, iWk, iA, iB, iC, iCh];      // the screens with working, where the caption belongs
  let lastStep = -1, finished = false, lines = 0;

  // Text with key terms (*term*) highlighted in amber (the <mark> element), built with K.el, never innerHTML.
  function write(node, s) {
    node.textContent = '';
    String(s || '').split(/(\*[^*]+\*)/).forEach((b) => {
      if (!b) return;
      if (b.length > 2 && b.charAt(0) === '*' && b.charAt(b.length - 1) === '*') node.appendChild(K.el('mark', null, b.slice(1, -1)));
      else node.appendChild(document.createTextNode(b));
    });
    return node;
  }
  const para = (s, cls) => write(K.el('p', cls ? { class: cls } : null), s);

  // ---------- controls ----------
  const stepper = K.stepper({ id: 'step', label: 'Lesson', steps: STEPS.map((d) => d.name), value: 0, compact: true, into: '#prog' });
  const at = () => K.clamp(Math.round(stepper.get()) || 0, 0, STEPS.length - 1);

  // ---------- the why: seven circuit cards on three phases, and the four currents ----------
  const PH = ALL1.slice();
  const lanesEl = el('lanes');
  const LANES = [0, 1, 2].map((p) => {
    const drop = K.el('div', { class: 'drop' });
    const lane = K.el('div', { class: 'lane', role: 'group', 'aria-label': 'L' + (p + 1) }, K.el('p', { class: 'lh' }, 'L' + (p + 1)), drop);
    lanesEl.appendChild(lane);
    return { lane, drop };
  });
  const cards = CIRC.map((c, k) => {
    const b = K.el('button', { class: 'card', type: 'button' },
      K.el('span', { class: 'ct' }, K.el('b', null, c.n), K.el('span', { class: 'ca' }, a2(AMPS[k]))),
      K.el('span', { class: 'cn' }, c.name));
    b.addEventListener('click', () => onTap(k));
    b.addEventListener('pointerdown', (e) => onDown(k, e));
    b.addEventListener('pointermove', (e) => onMove(k, e));
    b.addEventListener('pointerup', (e) => onUp(k, e, false));
    b.addEventListener('pointercancel', (e) => onUp(k, e, true));
    return b;
  });
  function placeCards() {
    const f = document.activeElement;
    LANES.forEach((L, p) => cards.forEach((c, k) => { if (PH[k] === p) L.drop.appendChild(c); }));
    cards.forEach((c) => { c.style.transform = ''; });
    if (cards.indexOf(f) >= 0) f.focus({ preventScroll: true });
  }
  placeCards();

  // One clock for the motion: cards glide to their new phase, the bars ease to their new lengths.
  let T = 0, queue = [], bFrom = [0, 0, 0, 0], bTo = [0, 0, 0, 0], bt0 = 0, bdur = 0;
  const fl = new Map();
  const FLY = 0.45, GAP = 0.6, EASE_BARS = 0.5, ARRIVE = 1.2;
  const targets = () => { const o = loadOf(PH); return [o.s[0], o.s[1], o.s[2], o.n]; };
  const shownBars = () => { const p = bdur > 0 ? K.ease(K.clamp((T - bt0) / bdur, 0, 1)) : 1; return bFrom.map((f, k) => f + (bTo[k] - f) * p); };
  function retarget(dur) { bFrom = shownBars(); bTo = targets(); bt0 = T; bdur = REDUCE ? 0 : dur; }
  function moveCard(k, to) {
    if (PH[k] === to) return;
    const first = cards.map((c) => c.getBoundingClientRect());
    PH[k] = to;
    placeCards();
    if (!REDUCE) cards.forEach((c, j) => {
      const r = c.getBoundingClientRect(), dx = first[j].left - r.left, dy = first[j].top - r.top;
      if (Math.abs(dx) + Math.abs(dy) > 0.5) { fl.set(j, { dx, dy, t0: T }); c.classList.add('fly'); }
    });
    retarget(EASE_BARS);
    K.refresh();
  }
  function settleBack(k) {
    const c = cards[k], r0 = c.getBoundingClientRect();
    c.style.transform = '';
    const r1 = c.getBoundingClientRect();
    if (!REDUCE && Math.abs(r0.left - r1.left) + Math.abs(r0.top - r1.top) > 0.5) { fl.set(k, { dx: r0.left - r1.left, dy: r0.top - r1.top, t0: T }); c.classList.add('fly'); }
  }
  function paintFlights() {
    fl.forEach((f, k) => {
      const p = K.clamp((T - f.t0) / FLY, 0, 1), e = 1 - K.ease(p);
      cards[k].style.transform = p >= 1 ? '' : 'translate(' + (f.dx * e).toFixed(1) + 'px, ' + (f.dy * e).toFixed(1) + 'px)';
      if (p >= 1) { fl.delete(k); cards[k].classList.remove('fly'); }
    });
  }
  const busy = () => queue.length > 0 || fl.size > 0 || T < bt0 + bdur;
  const anim = K.anim({ button: false, label: 'Moving the circuits', step: (dt) => {
    T += dt;
    while (queue.length && queue[0].at <= T) { const q = queue.shift(); moveCard(q.k, q.to); }
    paintFlights();
    drawBars();
    if (!busy()) return false;
  } });
  function kick() { if (REDUCE) { settleAll(); K.refresh(); return; } if (!anim.playing()) anim.play(); }
  function settleAll() {

  const backBtn = K.button({ label: 'Back', secondary: true, into: '#nav', press: () => { if (at() > 0) stepper.set(at() - 1); } });
  const nextBtn = K.button({ label: 'Continue', into: '#nav', press: () => { const i = at(); if (canGo(i) && i < iK) stepper.set(i + 1); } });
  function canGo(i) {
    const d = STEPS[i], st = S[i];
    if (d.show) return true;
    if (i === 0) return st.res === 'wrong';
    if (i === iChk) return st.res === 'right';
    if (ANS[i]) return st.res === 'right' || st.shown;
    if (i === iW) return !!(wB && wB.answered && wB.answered());
    return false;
  }

  K.model(() => ({}));

  const ON = { scen: [iA, iB, iC], share: [iA], carry1: [iB], carry2: [iC], circ: [iB], given: [iC], warn1: [1],
    barwrap: [iY], lanes: [iY], moves: [iY], say: [iY], ro: [iY], rule1: [iY], divb: [4], worked: [iWk], workedgo: [iWk],
    picks: [0, iChk], 'ans-3a': [iA], 'ans-3b': [iB], 'ans-3c': [iC], 'ans-ch': [iCh], wr: [iW], keep: [iK], fin: [iK] };

  K.update(() => {
    const i = at(), d = STEPS[i], st = S[i];
    if (i !== lastStep) {
      if (lastStep !== -1) enter();
      if (lastStep === iY) { anim.pause(); settleAll(); }
      if (i === iY) { settleAll(); bFrom = [0, 0, 0, 0]; bt0 = T; bdur = REDUCE ? 0 : ARRIVE; if (!REDUCE) anim.play(); }
      if (i >= iA && i <= iC) scen.el.open = i === iA;
      lastStep = i;
    }
    Object.keys(ON).forEach((id) => { el(id).hidden = ON[id].indexOf(i) < 0; });
    el('cap').hidden = WORKING.indexOf(i) < 0;

    el('count').textContent = 'Step ' + (i + 1) + ' of ' + STEPS.length + ' · ' + d.label;
    const task = el('task');
    task.className = 'task' + (d.show ? ' show' : '');
    write(task, d.show ? d.text : d.part || (d.kind ? '' : d.task));
    task.hidden = !task.textContent;
    const sub = el('sub');
    sub.textContent = i === iY ? 'Drag a card to another phase, or tap it to move it on.'
      : i === iCh ? 'A Section A question with new numbers.' : i === iK ? 'One card to come back to on a real job.' : '';
    sub.hidden = !sub.textContent;
    if (i === iY) paintWhy();

    // Picks.
    const opts = d.opts || [];
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      b.setLabel(opts[k]);
      const done = st.res === 'right' || (i === 0 && st.res === 'wrong');
      b.el.classList.toggle('is-right', done && opts[k] === d.want);
      b.el.classList.toggle('is-wrong', st.res === 'wrong' && opts[k] === st.pick);
      b.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });

    // The worked example's steps.
    wlines.forEach((w, k) => { w.hidden = k >= lines; });
    wEnd.hidden = lines < wlines.length;
    nextLine.el.hidden = lines >= wlines.length;
    if (i === iWk) el('workedgo').hidden = lines >= wlines.length;

    // Check and Why?
    const typed = !!ANS[i], typedDone = typed && (st.res === 'right' || st.shown);
    checkBtn.el.hidden = !typed || typedDone;
    whyBtn.el.hidden = i !== iChk;
    whyBtn.setLabel(st.why ? 'Hide why' : 'Why?');
    el('acts').hidden = checkBtn.el.hidden && whyBtn.el.hidden;
    paintFb(st.fb);
    const why = el('why');
    why.hidden = i !== iChk || !st.why;
    write(why, i === iChk ? d.why : '');
    el('go').hidden = !(i === 0 && st.res === 'right');

    el('donefb').textContent = finished && i === iK ? 'Lesson finished. Back is there whenever you want another look.' : '';
    el('donefb').hidden = !el('donefb').textContent;
    el('foot').textContent = i === 1 ? 'A figure with diversity is an estimate, and it may occasionally be exceeded.'
      : i === iY ? 'The card currents use practice values for ballast loss and power factor, from step 6.'
      : i >= iA && i <= iC ? 'A Section A style question, worked on the showroom drawings.' : '';
    el('foot').hidden = !el('foot').textContent;

    backBtn.el.hidden = i === 0;
    nextBtn.el.hidden = i === iK || !canGo(i) || (i === 0 && st.res === 'right');
    el('nav').hidden = backBtn.el.hidden && nextBtn.el.hidden;
  });

  // ---------- known answers, worked out by hand ----------
  const near = (a, b) => K.near(a, b, 1e-9);
  const OW = 'https://www.owelectric.co.uk/posts/maximum-demand-and-diversity-shops-household-offices-businesses';
  const FLUO = 'https://www.electrical-installation.org/enwiki/Fluorescent_lamps';
  K.check('The rule gives the case file\'s seven circuit currents: 4.89, 4.08, 5.71, 2.63, 3.33, 2.50 and 1.21 A', () =>
    near(DFL, 220.8) && near(DLED, 218.5) && CIRC.every((c, k) => near(AMPS[k], F(c.fid).value)));
  K.check('All seven on L1: L1 and the neutral both carry 24.35 A, the whole board', () => {
    const o = loadOf(ALL1); return near(o.s[0], fTot.value) && near(o.s[1], 0) && near(o.s[2], 0) && near(o.n, fAll.value) && near(TOTAL, fTot.value);
  });
  K.check('Shared out: 8.22, 8.21 and 7.92 A on the phases, 0.30 A in the neutral', () => {
    const o = loadOf(SPLIT); return near(o.s[0], f3b.value) && near(o.s[1], fL2.value) && near(o.s[2], fL3.value) && near(o.n, fN.value);
  });
  K.check('Three equal currents leave nothing in the neutral; one phase alone sends it all back', () => near(inOf(5, 5, 5), 0) && near(inOf(7, 0, 0), 7) && near(inOf(0, 3.5, 0), 3.5));
  K.check('Whatever the arrangement, the neutral never carries more than the heaviest phase', () => {
    for (let m = 0; m < 2187; m++) {
      const ph = [], x = { v: m };
      for (let k = 0; k < 7; k++) { ph.push(x.v % 3); x.v = Math.floor(x.v / 3); }
      const o = loadOf(ph);
      if (o.n > Math.max(o.s[0], o.s[1], o.s[2]) + 1e-9) return false;
    }
    return true;
  });
  K.check('Sharing out from all on L1 takes five moves, one card at a time, and ends on the split', () => {
    const ph = ALL1.slice(), mv = planMoves(ph, SPLIT); mv.forEach((m) => { ph[m[0]] = m[1]; });
    return mv.length === 5 && ph.join() === SPLIT.join() && planMoves(SPLIT, SPLIT).length === 0;
  });
  K.check('The check: 10, 10 and 4 A leave 6.00 A in the neutral; added, 24.00 A', () =>
    near(inOf(10, 10, 4), fK.value) && near(10 + 10 + 4, fK1.value) && near(fK2.value, 0));
  K.check('The worked example: 660 W, 2.87 A against 4.35 A; 180 W and 0.82 A for a modular fitting; 0.12 A for an LED', () =>
    near(r2(1000 * 0.66), fDv.value) && near(r2(660 / U0), fI660.value) && near(r2(1000 / U0), fI1000.value) &&
    near(r2(MOD_W * BALLAST), 180) && near(flAmps(MOD_W), fFl.value) && near(ledAmps(LED_W), fLed.value));
  K.check('3(a): 1430 + 2592 + 464 + 108 = 4594 W; its slips 2650, 4486 and 4362 W', () => {
    const led = N_LED * LED_W, mod = N_MOD * MOD_W, tw = N_TWIN * TWIN_W, bol = N_BOL * BOL_W;
    return led === 1430 && mod === 2592 && tw === 464 && bol === 108 && near(led + mod + tw + bol, f3a.value) &&
      near(led + N_MOD * 36 + tw + bol, F('3a.slip1').value) && near(led + mod + N_TWIN * 58 + bol, F('3a.slip2').value) && near(led + mod + tw, F('3a.slip3').value) &&
      near(CIRC.reduce((s, c) => s + c.W, 0), f3a.value);
  });
  K.check('3(b): 4.89 + 3.33 = 8.22 A; its slips 7.24, 7.87, 10.09 and 24.35 A', () =>
    near(r2(AMPS[0] + AMPS[4]), f3b.value) && near(r2(r2(CIRC[0].W / DFL) + AMPS[4]), F('3b.slip1').value) &&
    near(r2(r2(r2(CIRC[0].W * BALLAST) / U0) + r2(CIRC[4].W / U0)), F('3b.slip2').value) &&
    near(r2(r2(CIRC[0].W * 1.8 / U0) + AMPS[4]), F('3b.slip3').value) && near(TOTAL, F('3b.slip4').value));
  K.check('3(c): 63.09 + 144.00 + 77.00 + 128.00 = 412.09 A; ÷ 3 = 137.36 A; + 23.08 = 160.44 A, and its slips', () => {
    const m = mdOf(LIGHT), nd = r2(r2(r2(LIGHT + SOCK_N * SOCK_A + ROT_A + DP_N * DP_A + EV_N * EV_A) / 3) + f1a.value);
    return near(dbl1, fD1.value) && near(LIGHT, fML.value) && near(std(SOCK_N, SOCK_A), fMS.value) && near(heat(ROT_A, DP_N, DP_A), fMF.value) &&
      near(EV_N * EV_A, fME.value) && near(m.tot, F('l2.md.single').value) && near(m.per, F('l2.md.perphase').value) && near(m.ans, f3c.value) &&
      near(nd, F('3c.slip1').value) && near(m.per, F('3c.slip2').value) && near(r2(m.per + r2(f1a.value / 3)), F('3c.slip3').value) &&
      near(r2(m.tot + f1a.value), F('3c.slip4').value) && near(mdOf(r2(0.9 * LIGHT)).ans, F('3c.slip5').value);
  });
  K.check('Changed numbers: 96.00 + 16.20 = 112.20 A; slips 178.00, 114.00 and 96.20 A', () =>
    near(chOf(0.9), fCh.value) && near(CH.n * CH.a + CH.light, F('l2.A.changed.slip1').value) && near(chOf(1), F('l2.A.changed.slip2').value) &&
    near(r2(0.5 * CH.n * CH.a + r2(0.9 * CH.light)), F('l2.A.changed.slip3').value));
  K.check('Every slip lies outside its answer\'s accepted range', () => Object.keys(SPEC).every((k) => {
    const sp = SPEC[k], tol = sp.tolerance != null ? sp.tolerance : 0.005;
    return sp.slips.every((s) => Math.abs(s.value - sp.fig.value) > tol + 0.005);
  }));
  K.check('Lighting in a shop: 90% of the total current demand', () => near(chOf(0.9) - std(CH.n, CH.a), 16.2), { source: OW });
  K.check('Standard circuits: 100% of the largest circuit + 50% of every other', () => near(std(2, 10), 15) && near(std(SOCK_N, SOCK_A), fMS.value), { source: OW });
  K.check('Heating and power: 100% of the largest appliance + 75% of the remaining', () => near(heat(10, 2, 4), 16) && near(heat(ROT_A, DP_N, DP_A), fMF.value), { source: OW });
  K.check('If no power-loss value is given for the ballast, 25% of the tube watts may be used', () => near(BALLAST, 1.25) && near(r2(144 * BALLAST), 180), { source: FLUO });
  K.check('cos φ = 0.96 for an electronic ballast', () => near(PF_FL, 0.96) && near(DFL, 220.8), { source: FLUO });

  K.ready();
</script>
