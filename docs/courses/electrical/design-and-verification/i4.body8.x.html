<p class="caption" id="cap">Figures from your slides, assignment and BS 7671; practice values marked; each worked from the rounded figures before it.</p>

<script>
  // ---------- the rule, and the course's figures ----------
  const RT2 = Math.SQRT2;
  // Half up to 2 places, as the course rounds (each line worked from the rounded figure shown).
  const r2 = (x) => Math.round(x * 100 + 1e-7) / 100;
  const f2 = (x) => r2(x).toFixed(2);
  const F = (id) => K.figure(id);
  const el = (id) => document.getElementById(id);

  const IL = 150;                       // A in each line: your slides' example (p.35)
  const EDGES = [0, 15, 33, 45, 50];    // Table 4Aa's row edges (slides p.34); the slider stops at 50%
  const FAC = [1, 0.86, 0.86, 1];
  const FAC_T = ['1.0', '0.86', '0.86', '1.0'];
  // On a row's edge the lower row, as the IET's answer reads "exceeding 33 %".
  const rowOf = (hp) => (hp <= 15 ? 0 : hp <= 33 ? 1 : hp <= 45 ? 2 : 3);
  const ibnOf = (hp, il) => r2(3 * hp / 100 * il);                    // Ibn = 3 × h × IL
  const setsOf = (hp, il) => (rowOf(hp) >= 2 ? ibnOf(hp, il) : il);   // the current that sets the cable
  const designOf = (hp, il) => r2(setsOf(hp, il) / FAC[rowOf(hp)]);   // ÷ Table 4Aa's factor

  // The picture: each line is a fundamental plus a third harmonic, its rms held at IL,
  // so as the third harmonic's share h grows the fundamental's shrinks (√(1 − h²) of IL).
  const SHIFT = 2 * Math.PI / 3;        // 120° between the lines' fundamentals
  function parts(hp) { const h = hp / 100; return { a1: RT2 * IL * Math.sqrt(1 - h * h), a3: RT2 * IL * h }; }
  const lineAt = (k, deg, hp) => { const p = parts(hp), t = deg * Math.PI / 180 - k * SHIFT; return p.a1 * Math.sin(t) - p.a3 * Math.sin(3 * t); };
  const rippleAt = (k, deg, hp) => { const p = parts(hp), t = deg * Math.PI / 180 - k * SHIFT; return -p.a3 * Math.sin(3 * t); };
  const neutralAt = (deg, hp) => lineAt(0, deg, hp) + lineAt(1, deg, hp) + lineAt(2, deg, hp);
  function rmsOf(fn) { let s = 0; const N = 3600; for (let j = 0; j < N; j++) { const v = fn(j * 360 / N); s += v * v; } return Math.sqrt(s / N); }

  const fR = F('l4.recall'), fR1 = F('l4.recall.slip1'), fR2 = F('l4.recall.slip2');
  const fC = F('l4.check'), fC1 = F('l4.check.slip1'), fC2 = F('l4.check.slip2');
  const fW = F('l4.worked.ibn'), fIt = F('l4.worked.it'), fProd = F('l4.worked.cacg'), fIz = F('l4.worked.iz');
  const f3a = F('3a'), f3b = F('3b'), f3d = F('3d'), f3e = F('3e');
  const fI35 = F('l4.A.ibn35'), fE35 = F('l4.A.eq35');
  const fCh = F('l4.A.changed'), fChN = F('l4.A.changed.ibn');
  const RC = { il: 60, h: 35 };          // the recall's load
  const CHK = { il: 100, h: 50 };        // the check's circuit
  const H_SR = 20;                       // the course's practice third harmonic for DBL2's lighting, %
  const CH = { il: 37, h: 40 };          // the changed-numbers circuit, the Schneider guide's own
  const pcOf = (hp) => Math.round(3 * hp);   // the neutral as a % of the line, 3 × h

  // The worked example (slides p.35, 36), each line from the rounded figure before it.
  const CA = 0.94, CG = 0.65, IN = 160, TAB = 346;
  const CACG = Math.round(CA * CG * 1000) / 1000;            // 0.611
  const PROD = Math.round(CACG * 0.86 * 1e5) / 1e5;          // 0.52546
  const IT = r2(IN / PROD), IZ = r2(TAB * PROD), IBN_W = ibnOf(35, IL);

  // ---------- the lesson: SHOW steps teach, DO steps ask ----------
  const CH_Q = 'A three-phase four-wire circuit carries ' + CH.il + ' A in each line, and the maker\'s data gives a third harmonic of ' + CH.h + '%. Determine the current its cable must be chosen to carry once Table 4Aa\'s factor is applied.';
  const Q3D = '(d) Using your slides\' rule and the heaviest line current, determine the neutral current of DBL2\'s submain.';
  const Q3E = '(e) Determine the current DBL2\'s submain cable must be chosen to carry once Table 4Aa\'s factor is applied.';
  const STEPS = [
    { name: 'Do you still have it?', label: 'Do you still have it?',
      task: 'A balanced three-phase load on a four-wire supply draws ' + RC.il + ' A in each line. Its maker states a third harmonic of ' + RC.h + '% of the line current. What current flows in the neutral?',
      opts: [fR1.text, fR2.text, fR.text], want: fR.text, why: fR.work,
      read: 'The neutral carries ' + fR.work + '.' },
    { show: true, name: 'What it is for', label: 'What it is for',
      text: 'A three-phase circuit is normally designed on its line current. Some circuits, supplying rectifiers, variable-speed motor drives or fluorescent lighting banks, draw currents that are not sinusoidal (your slides p.33), and then the circuit may need designing on the *neutral current*, not the line current (p.34). The On-Site Guide asks the same of a discharge-lighting final circuit: it must carry its *harmonic currents* as well as the lamps\' current (OSG p.136).' },
    { show: true, name: 'The why', label: 'The why',
      text: 'Each line current is drawn as two parts: a wave at the supply frequency, the *fundamental*, and a smaller wave at three times that frequency, the *third harmonic*.',
      read: 'At 0% the neutral carries ' + fR1.text + '; it passes the ' + IL + ' A line near a third, and at 35% carries ' + fW.work + '.' },
    { show: true, name: 'Which current, which factor', label: 'Which current, which factor',
      text: 'The current tables are worked for three loaded conductors (the Schneider guide). A neutral carrying harmonic current is a *fourth loaded conductor* in the same cable or conduit: BS 7671 counts it as one where the third harmonic and its multiples pass 15% (Regulation 523.6.1, as NICEIC words it). A neutral carrying only the lines\' imbalance is offset by less heat in a line; harmonic current gets no such offset (NICEIC).',
      read: 'Up to 33%, the line current sets the cable (factor 1.0 to 15%, 0.86 above); over 33%, the neutral current (0.86 to 45%, 1.0 above).' },
    { name: 'Check', label: 'Check',
      task: 'A three-phase four-wire circuit carries ' + CHK.il + ' A in each line, and the maker\'s data gives a third harmonic of ' + CHK.h + '%. What current must its cable be chosen to carry, the current that sets it divided by Table 4Aa\'s factor?',
      opts: [fC2.text, fC.text, fC1.text], want: fC.text,
      why: 'Ibn = 3 × 0.50 × ' + CHK.il + ' = ' + fC.text + ', over 45%: the neutral current with a factor of 1.0 (your slides p.34), so ' + fC.text + '.',
      hints: { [fC1.text]: 'Not quite. ' + fC1.work + ' keeps the 0.86, which belongs to the 33 to 45% row; above 45% the lines are not fully loaded, so the factor is 1.0.',
        [fC2.text]: 'Not quite. ' + fC2.work + ' is the 15 to 33% row. At 50% the neutral carries ' + pcOf(CHK.h) + '% of the line, and the cable is selected on it.' },
      read: 'Ibn = 3 × 0.50 × ' + CHK.il + ' = ' + fC.text + ', over 45%, factor 1.0: ' + fC.text + '.' },
    { show: true, name: 'Worked example', label: 'Worked example',
      text: 'Your slides\' example (p.35, 36), a line at each press. Work each step yourself first, then press Show the next step and check yours against it.',
      read: 'Your slides\' example (p.35, 36): Ibn = ' + fW.text + ' is Ib; In ' + IN + ' A; It ≥ ' + fIt.work + '; 240 mm², Iz ' + fIz.text + '.' },
    { name: 'Section A (d)', label: 'Section A · Question 3', part: Q3D,
      task: 'Your showroom\'s DBL2 submain, three-phase and four-wire, on a practice third harmonic of ' + H_SR + '%. ' + Q3D,
      want: f3d.text, why: f3d.work, read: 'Ibn = ' + f3d.work + ' (on a practice ' + H_SR + '%).' },
    { name: 'Section A (e)', label: 'Section A · Question 3', part: Q3E,
      task: 'The same submain, its neutral current ' + f3d.text + ' from part (d). ' + Q3E,
      want: f3e.text, why: f3e.work, read: H_SR + '% is the 15 to 33% row: ' + f3e.work + ' (on a practice ' + H_SR + '%).' },
    { kind: 'written', written: 'b1', name: 'Section B', label: 'Section B · Short answer',
      task: 'A short written answer, in your own words.' },
    { name: 'Changed numbers', label: 'Section A · Changed numbers', part: CH_Q, task: CH_Q,
      want: fCh.text, why: fCh.work, read: fCh.work + '.' },
    { kind: 'summary', name: 'Keep this', label: 'Keep this' },
  ];
  const S = STEPS.map(() => ({ res: null, pick: null, tries: 0, shown: false, why: false, fb: null }));
  const iWhy = 2, iRows = 3, iChk = 4, iWk = 5, iD = 6, iE = 7, iW = 8, iCh = 9, iK = 10;
  const WORKING = [iWhy, iRows, iChk, iWk, iD, iE, iCh];   // the screens with working, where the caption belongs
  let lastStep = -1, finished = false, lines = 0, selRow = 0, rowTapped = false;
  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

  // Text with key terms (*term*) highlighted in amber (the <mark> element), built with K.el, never innerHTML.
  function write(node, s) {
    node.textContent = '';
    String(s || '').split(/(\*[^*]+\*)/).forEach((b) => {
      if (!b) return;
      if (b.length > 2 && b.charAt(0) === '*' && b.charAt(b.length - 1) === '*') node.appendChild(K.el('mark', null, b.slice(1, -1)));
      else node.appendChild(document.createTextNode(b));
    });
  }
  // Every wording laid out in one place, only wording k seen (see .held).
  function held(node, wordings, k) {
    node.textContent = '';
    const box = K.el('div', { class: 'held' });
    wordings.forEach((ws, j) => {
      const s = K.el('span', j === k ? null : { class: 'ghost', 'aria-hidden': 'true' });
      ws.forEach((x) => s.appendChild(typeof x === 'string' ? document.createTextNode(x) : x));
      box.appendChild(s);
    });
    node.appendChild(box);
  }

  // ---------- controls ----------
  const stepper = K.stepper({ id: 'step', label: 'Lesson', steps: STEPS.map((d) => d.name), value: 0, compact: true, into: '#prog' });
  const at = () => K.clamp(Math.round(stepper.get()) || 0, 0, STEPS.length - 1);
  const ctlH = K.control({ id: 'h', label: 'Third harmonic', hint: 'As a share of the line current', min: 0, max: 50, step: 1, value: 0,
    fmt: (v) => Math.round(v) + '%', snap: [15, 20, 33, 34, 35, 45], into: '#ctl' });
  const strip = K.svg('svg', { class: 'strip', viewBox: '0 0 340 64', width: '100%', role: 'img', 'aria-label': '' });
  el('ctl').appendChild(strip);
  let shownH = ctlH.get();

  // The demonstration on The why: the third harmonic glides up from 0% to your slides' 35%,
  // so the ripples grow in step and the neutral climbs past the line.
  let demoT = 0, demoOn = false, demoSeen = false;
  const DEMO_END = 3.6;
  const demoAt = (t) => Math.round(35 * K.ease(K.clamp((t - 0.6) / 2.8, 0, 1)));
  function setQuiet(v) { ctlH.set(v, true); shownH = ctlH.get(); }
  const anim = K.anim({ button: false, label: 'Demonstration', step: (dt) => {
    demoT += dt;
    setQuiet(demoAt(demoT));
    K.refresh();
    if (demoT >= DEMO_END) { demoOn = false; return false; }
  } });
  function startDemo() {
    demoT = 0;
    if (REDUCE) { setQuiet(demoAt(DEMO_END)); demoOn = false; return; }
    setQuiet(demoAt(0)); demoOn = true; anim.pause(); anim.play();
  }
  function stopDemo() { if (demoOn) { demoOn = false; anim.pause(); } }
  const replayBtn = K.button({ label: 'Replay', secondary: true, into: '#replay', press: () => { if (at() === iWhy) startDemo(); } });

  K.readout({ id: 'ibn', label: 'Neutral current, Ibn', unit: 'A', decimals: 2, into: '#outs' });
  K.readout({ id: 'sets', label: 'Current that sets the cable', into: '#outs' });
  K.readout({ id: 'fac', label: 'Table 4Aa factor', into: '#outs' });

  // Picks: one tap answers.
  const pickBtns = [0, 1, 2].map((k) => K.button({ label: 'Answer ' + (k + 1), secondary: true, into: '#picks', press: () => pick(k) }));
  function pick(k) {
    const i = at(), d = STEPS[i], st = S[i];
    if (!d.opts || k >= d.opts.length) return;
    if (i === 0) {
      if (st.res) return;     // a recall gets one go
      st.pick = d.opts[k];
      if (st.pick === d.want) {
        st.res = 'right';
        st.fb = { ok: true, v: 'Still there.', w: fR.work, p: 'So the neutral current, not the line current, sets the cable (your slides p.34): 35% is row 3 of Table 4Aa, the neutral current with a factor of 0.86. The slips: ' + fR1.text + ' is true of the fundamentals alone, which cancel; ' + fR2.text + ' is one line\'s third harmonic, 0.35 × ' + RC.il + ', and the three lines\' third harmonics add.' };
      } else {
        st.res = 'wrong';
        st.fb = st.pick === fR1.text
          ? { ok: false, v: 'The usual slip: the fundamentals alone.', p0: 'A balanced load\'s fundamentals do cancel in the neutral (your slides p.33), but *third harmonic* currents are additive there (IET Wiring Matters).', w: 'The working: ' + fR.work, p: 'Continue, and the refresh starts from here.' }
          : { ok: false, v: 'The usual slip: one line only.', p0: fR2.text + ' is one line\'s third harmonic. The neutral carries the sum of the three lines\' third harmonic content (IET Wiring Matters), three times it.', w: 'The working: ' + fR.work, p: 'Continue, and the refresh starts from here.' };
      }
    } else if (i === iChk) {
      if (st.res === 'right') return;
      st.pick = d.opts[k];
      if (st.pick === d.want) { st.res = 'right'; st.fb = { ok: true, v: 'That\'s it.', w: d.why }; }
      else { st.res = 'wrong'; st.fb = { ok: false, v: d.hints[st.pick] || 'Not quite.' }; }
    }
  }
  const whyBtn = K.button({ label: 'Why?', secondary: true, into: '#acts', press: () => { if (at() === iChk) S[iChk].why = !S[iChk].why; } });

  // Recall right: on to the why, or straight to the practice.
  K.button({ label: 'Refresh the why', into: '#go', press: () => { if (at() === 0 && S[0].res === 'right') stepper.set(1); } });
  K.button({ label: 'Skip to the practice', secondary: true, into: '#go', press: () => { if (at() === 0 && S[0].res === 'right') stepper.set(iD); } });

  // ---------- Table 4Aa's rows, tapped to read each one's line ----------
  const ROW_LABELS = ['0 to 15%: line current, factor 1.0', '15 to 33%: line current, factor 0.86', '33 to 45%: neutral current, factor 0.86', 'Over 45%: neutral current, factor 1.0'];
  const ROW_WHY = [
    'Row 1, 0 to 15%: up to 15%, BS 7671 does not count the neutral as a *loaded conductor* (Regulation 523.6.1, as NICEIC words it), so the line current and a factor of 1.0 stand (your slides p.34).',
    'Row 2, 15 to 33%: the neutral is now a loaded conductor, but the line is still the larger, so the line current is Ib. The 0.86 is a *rating factor*, heat the table did not allow for (lesson 3), here the fourth loaded conductor\'s.',
    'Row 3, 33 to 45%: the neutral is now the larger, so the cable is selected on the *neutral current* (the Schneider guide; the IET\'s answer reads "exceeding 33 %"), still with 0.86.',
    'Row 4, over 45%: by 45% the neutral carries ' + pcOf(45) + '% of the line, and with the cable sized on it the three lines are not fully loaded (the Schneider guide), so the factor goes back to 1.0.',
  ];
  const rowBtns = ROW_LABELS.map((t, k) => K.button({ label: t, secondary: true, into: '#rows4', press: () => { if (at() === iRows) { selRow = k; rowTapped = true; } } }));

  // ---------- Section A: typed answers on the course's figures ----------
  const scen = K.scenario({ into: '#scen', open: true });
  K.carried({ parts: ['3a', '3b', '3c'], into: '#carryD' });
  K.carried({ parts: ['3a', '3b', '3c', '3d'], into: '#carryE' });
  const differs = (r, f) => r.value != null && Math.abs(r.value - f.value) > 0.004;
  const GUIDE = 'The Schneider guide works the same circuit and prints 51.6 A, to one place.';
  const SPEC = {
    [iD]: { id: '3d', fig: f3d, accept: [], lead: '',
      slips: [
