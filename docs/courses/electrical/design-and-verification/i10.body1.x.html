  .picks .k-btn.is-right { border-color: var(--k-good); color: var(--k-good); box-shadow: inset 0 0 0 1px var(--k-good); }

<p class="caption" id="cap">Each line is worked from the rounded figures shown before it.</p>

<script>
  // ---------- rounding, and the course's figures ----------
  const r2 = (x) => Math.round(x * 100 + 1e-7) / 100;
  const r3 = (x) => Math.round(x * 1000 + 1e-6) / 1000;
  const down1 = (x) => Math.floor(x * 10 + 1e-7) / 10;
  const f2 = (x) => r2(x).toFixed(2), f3 = (x) => r3(x).toFixed(3);
  const F = (id) => K.figure(id);
  const el = (id) => document.getElementById(id);
  const NB = ' ';
  // Non-breaking spaces before operators, between a number and its unit, and in 'type C'.
  const nb = (s) => String(s == null ? '' : s)
    .replace(/ ([×÷+=]) /g, NB + '$1 ')
    .replace(/(\d) (?=\d{3}\b)/g, '$1' + NB)
    .replace(/(\d) (?=(?:mm²|mΩ\/m|mV\/A\/m|°C|Ω|kW|kA|A|V|m|s)(?![A-Za-z²]))/g, '$1' + NB)
    .replace(/\btype ([BCD])\b/g, 'type' + NB + '$1');
  const seg = (f) => String((f && f.work) || '').split('; ');
  const cut = (s, at) => String(s).split(at)[0];
  const num = (v) => { const x = Math.round(v * 100) / 100; return String(x); };

  // The lathe job.
  const P = F('g.lathe.P'), PF = F('g.lathe.pf'), EFF = F('g.lathe.eff'), fRun = F('g.lathe.L'), AMB = F('g.lathe.amb');
  const UPf = F('g.lathe.up'), fZdb = F('g.lathe.zdb'), fZe = F('g.lathe.ze'), fIpf = F('g.lathe.ipf');
  const CA = F('g.ca.25.90'), CG = F('g.cg.3'), IT4 = F('g.4e1a.4.c5'), IT25 = F('g.4e1a.25.c5'), MV4 = F('g.4e1b.4.c6');
  const RUN = fRun.value, ZDB = fZdb.value, UP = UPf.value;
  const MULT = F('g.mult.90ts').value, ZMAX = F('g.zmax.C25').value, IA = F('g.ia.C25').value, K143 = F('g.k.cu90').value;
  const U0 = F('g.U0').value, UL = 400, CMIN = 0.95, CMAX = 1.1, T01 = 0.1, IN = F('5b').value;
  const VMIN = r2(U0 * CMIN), VMAX = r2(U0 * CMAX);           // 218.5 V and 253 V
  const RPM = { '1.5': F('g.r12.4_15').value, '2.5': F('g.r12.4_25').value, '4': F('g.r1r2.4').value };
  const CPCS = [1.5, 2.5, 4];
  const ZMAX_T = f2(ZMAX) + ' Ω';

  // The rule: the lathe's loop and the heat its cpc must take.
  function loopAt(c, L) {
    const per = RPM[String(c)];
    const r12 = r3(per * MULT * L / 1000);
    const zs = r3(ZDB + r12);
    const imin = r2(VMIN / zs), imax = r2(VMAX / zs);
    const worked = imax >= IA;
    const s = worked ? r2(Math.sqrt(imax * imax * T01) / K143) : 0;
    const lmax = down1((ZMAX - ZDB) * 1000 / r2(per * MULT));
    return { r12, zs, imin, imax, worked: worked ? 1 : 0, s, lmax };
  }
  const cpcOf = (p) => (RPM[String(+p.cpc)] ? +p.cpc : 4);
  const lenOf = (p) => K.clamp(Math.round((p.len == null ? RUN : +p.len) * 2) / 2, 10, 40);
  const fmtL = (v) => { const x = Math.round(v * 2) / 2; return Number.isInteger(x) ? String(x) : x.toFixed(1); };

  // Recall, why and check figures.
  const fRecR = F('l10.recall.r44'), fRecZ = F('l10.recall.zs44'), fR25 = F('l10.r12.25');
  const fWhy15 = F('l10.why.15'), fWhy4 = F('l10.why.4'), fL15 = F('l10.lmax15'), fL25 = F('l10.lmax25'), fL4 = F('l10.lmax4');
  const fChk = F('l10.check'), fChk1 = F('l10.check.slip1'), fChk2 = F('l10.check.slip2');
  const CKL = 32, CK = loopAt(2.5, CKL);

  // The worked example: steel armour as the cpc.
  const K1 = F('g.k1.cu90').value, K2 = F('g.k2.steel90').value;
  const A6 = F('g.swa6.4c.armour').value, A25_4 = F('g.swa25.4c.armour').value, A25_5 = F('g.swa25.5c.armour').value;
  const RA = F('g.swa25.5c.armourR').value, RC = F('g.r.25').value, TF = F('p.swa.t').value;
  const SW = { ze: 0.06, run6: 40, run25: 26 };
  SW.needA = r2(K1 * 6 / K2); SW.needB = r2(K1 * 16 / K2);
  SW.r2 = r3(1 / (1 / RC + 1 / RA)); SW.r12 = r3((RC + SW.r2) * MULT * SW.run25 / 1000); SW.zs = r3(SW.ze + SW.r12);
  SW.imax = r2(VMAX / SW.zs); SW.sa = r2(Math.sqrt(SW.imax * SW.imax * TF) / K2); SW.sc = r2(Math.sqrt(SW.imax * SW.imax * TF) / K1);

  // Section A, question 5.
  const f5a = F('5a'), f5b = F('5b'), f5c = F('5c'), f5d = F('5d'), f5e = F('5e'), f5f = F('5f'), f5g = F('5g'), f5h = F('5h');
  const fU = F('l10.U'), fFac = F('l10.f'), fVd = F('l10.vd'), fImin = F('l10.imin'), fImax = F('l10.imax');
  const A = {};
  A.U = r2(UL * (1 - UP / 100)); A.s3 = r2(Math.sqrt(3) * A.U); A.pf = r2(A.s3 * PF.value); A.eff = r2(A.pf * EFF.value / 100);
  A.ib = r2(P.value * 1000 / A.eff);
  A.ib173 = r2(P.value * 1000 / r2(r2(r2(1.73 * A.U) * PF.value) * EFF.value / 100));
  A.f = r3(CA.value * CG.value); A.it = r2(IN / A.f); A.iz = r2(IT4.value * A.f);
  A.up = r2(UL * UP / 100); A.vd = r2(MV4.value * A.ib * RUN / 1000); A.vt = r2(A.up + A.vd); A.vlim = r2(UL * 0.05);
  A.vt217 = r2(A.up + r2(MV4.value * 21.7 * RUN / 1000)); A.vt2177 = r2(A.up + r2(MV4.value * A.ib173 * RUN / 1000));
  const LA = loopAt(2.5, RUN);
  A.r12 = LA.r12; A.zs = LA.zs; A.imin = LA.imin; A.imax = LA.imax; A.s = LA.s;
  // Changed numbers: a 40 A distribution circuit.
  const fCh = F('l10.changed');
  const CH = { In: 40, board: 63, run: 26, load: 32, amb: 35, lim: 6 };
  CH.ca = F('g.ca.35.70').value; CH.f = r3(CH.ca * CG.value); CH.it = r2(CH.In / CH.f);
  CH.t10 = F('g.4d1a.10.c5').value; CH.t16 = F('g.4d1a.16.c5').value; CH.mv = F('g.4d1b.16.c6').value;
  CH.vd = r2(CH.mv * CH.load * CH.run / 1000);

  // ---------- the lesson's words ----------
  const REC_TASK = 'A motor circuit runs ' + fRun.text + ' in 4 mm² singles with a 4 mm² cpc. Zs is ' + fZdb.text + ' at its board and ' + fRecZ.text + ' at the motor. The client wants the cpc cut to 2.5 mm². Which checks must you work again?';
  const O_RIGHT = "Zs against the breaker's maximum, and the heat check", O_HEAT = 'Only the heat check', O_RATE = 'The current rating and the voltage drop';
  const REC_W = 'R1+R2 = ' + fR25.work;
  const REC_P = 'So Zs rises from ' + fRecZ.text + ' to ' + f5g.text + ", which must stay within the breaker's maximum. The thinner cpc must still take the fault's heat. The cpc carries no load current, so the rating and the drop stay as they were.";
  const FOR_TEXT = "One whole job in one pass, on a circuit unlike the showroom's. A lathe motor is fed from a board that sits below 400 V. Its cable shares trunking with two other circuits.\n\nThen a question every designer meets. Can the cpc be smaller than Table 54.7's size? Yes, if two checks still pass. Zs must stay within the breaker's maximum. And the cpc must take the fault's heat.";
  const WHY_TEXT = "The lathe's circuit from DB2: a line conductor and a cpc running to the motor. The loop has two parts. Zs at DB2 is a fixed " + fZdb.text + ". The circuit's R1+R2 grows with the run, and with a thinner cpc.";
  const WHY_READ = 'At ' + fRun.text + ' the 2.5 mm² cpc gives Zs ' + f5g.text + ', within ' + ZMAX_T + '. It needs only ' + f5h.text + ' for the heat. The 1.5 mm² cpc gives ' + fWhy15.text + ' and fails on Zs.';
  const BESIDE = 'R1+R2 = mΩ/m × ' + f2(MULT) + ' × length ÷ 1000. Zs = ' + ZDB + ' + R1+R2.\n\n'
    + 'The maximum, ' + ZMAX_T + ', is ' + VMIN + ' ÷ ' + IA + ' = ' + f3(VMIN / IA) + ' Ω, which the table rounds down.\n\n'
    + 'Fault current at Cmin = ' + VMIN + ' ÷ Zs, at Cmax = ' + VMAX + ' ÷ Zs. Least cpc = √(I² × ' + T01 + ') ÷ ' + K143 + ', with I at Cmax.\n\n'
    + 'For the 4 mm² line, mΩ/m is ' + RPM['1.5'] + ' with a 1.5 mm² cpc, ' + RPM['2.5'] + ' with 2.5 mm² and ' + RPM['4'] + ' with 4 mm². Below ' + IA + ' A at Cmax, the breaker may not open within ' + T01 + ' s. Then the heat is not worked.';
  const UNDER = 'A thinner cpc adds resistance, so Zs rises and the fault current falls. Less current heats the cpc less, while the breaker still trips at once. So the heat check gets easier as the breaker check gets harder.\n\n'
    + 'On the lathe the loop, not the heat, sets the smallest cpc. The 2.5 mm² cpc allows up to ' + fL25.text + ', the 4 mm² up to ' + fL4.text + '.';
  const CHK_TASK = 'Keep the 2.5 mm² cpc. The lathe moves, and the run becomes ' + CKL + ' m. Is the circuit still acceptable?';
  const C_RIGHT = 'No: Zs is ' + f3(CK.zs) + ' Ω, over ' + ZMAX_T, C_HEAT = 'Yes: the cpc needs only ' + f2(CK.s) + ' mm² for the heat', C_R12 = 'Yes: R1+R2 is ' + f3(CK.r12) + ' Ω, within ' + ZMAX_T;
  const CHK_WHY = 'R1+R2 = ' + RPM['2.5'] + ' × ' + f2(MULT) + ' × ' + CKL + ' ÷ 1000 = ' + f3(CK.r12) + ' Ω. Zs = ' + ZDB + ' + ' + f3(CK.r12) + ' = ' + f3(CK.zs) + ' Ω, over ' + ZMAX_T + '. The longest run with 2.5 mm² is ' + fL25.text + '. Go back to the 4 mm² cpc, good to ' + fL4.text + '.';
  const WK_TEXT = "Steel armour can be the cpc, if a calculation shows it is enough. Steel's k is far lower than copper's. So it needs more area.\n\nTake k1 = " + K1 + ' for the copper cores and k2 = ' + K2 + ' for the steel. ' + K2 + ' is a practice value. On a real job, check it in Table 54.4.';
  const WK_READ = 'Both four-core cables have more armour than Table 54.7 asks. With the core and the armour in parallel, Zs is ' + f3(SW.zs) + ' Ω. Each path alone takes the heat.';
  const SCEN_TITLE = 'The lathe at DB2';
  const SCEN_TEXT = 'A workshop on a 400 V three-phase TN-C-S supply, Ze ' + fZe.text + ', prospective fault current ' + fIpf.text + ' at the origin. DB2 is fed by a distribution circuit that drops ' + UPf.text + '. Zs at DB2 is ' + fZdb.text + '. From DB2, a circuit feeds a ' + P.text + ' three-phase lathe motor, power factor ' + PF.text + ' and efficiency ' + EFF.text + ' at full load. It runs ' + fRun.text + ' in 90 °C thermosetting singles in trunking on a wall, with two other loaded circuits, at ' + AMB.text + '. Protection is a type C circuit-breaker to BS EN 60898.';
  const AS_5A = "Assume the lathe's terminals and the breaker allow the cable to run at 90 °C.\n\nUse " + fZdb.text + ' for Zs at DB2, even if you have 0.97 Ω written down. At 0.97 Ω no 25 A type C could pass.';
  const Q5A = '(a) Determine the design current of the lathe circuit.';
  const SHOWN_B = '(b) The next standard rating above ' + f5a.text + ' is ' + f5b.text + ', type C.';
  const AS_5C = 'Ca is ' + CA.text + ' for 90 °C thermosetting cable at ' + AMB.text + '. It is above 1 because the tables are set at 30 °C. A cooler room takes heat away faster.\n\nCg is ' + CG.text + ' for three circuits in the trunking.';
  const Q5C = '(c) Determine the minimum tabulated current-carrying capacity, It.';
  const Q5E = '(e) Determine the voltage drop from the intake to the lathe, and state whether it complies.';
  const SHOWN_F = "(f) Table 54.7: a copper cpc with a line of 16 mm² or less is the line's size, so " + f5f.text + '.';
  const AS_5G = 'The client asks for a 2.5 mm² cpc to save copper.';
  const Q5G = '(g) Determine Zs at the lathe with a 2.5 mm² cpc, and state whether the circuit meets the requirements for automatic disconnection.';
  const Q5H = '(h) Determine the minimum csa of the cpc for thermal constraints, and state whether 2.5 mm² is adequate.';
  const AS_CH = 'A ' + CH.In + ' A BS 88-2 fuse-switch feeds a ' + CH.board + ' A TP&N workshop board through a ' + CH.run + ' m distribution circuit. After diversity it carries ' + CH.load + ' A per phase. It is 70 °C thermoplastic singles in trunking with two other circuits, at ' + CH.amb + ' °C. The drop must not exceed ' + CH.lim + ' V.';
  const Q_CH = 'Determine the minimum tabulated current-carrying capacity, It.';

  const W5A = ['U at DB2 = ' + fU.work].concat(seg(f5a).map((t, k, a) => (k === a.length - 1 ? 'Ib = ' : '') + t));
  const W5C = ['Factors together = ' + fFac.work, 'It = ' + f5c.work];
  const W5E = ['Upstream = ' + seg(f5e)[0], 'The lathe circuit, at ' + MV4.text + ' for 4 mm² three-phase: ' + fVd.work, 'Total = ' + cut(seg(f5e)[1], ' ≤')];
  const W5G = ['R1+R2 = ' + fR25.work, 'Zs = ' + cut(f5g.work, ' ≤')];
  const W5H = ['Fault current at Cmax = ' + U0 + ' × ' + CMAX + ' ÷ ' + f3(A.zs) + ' = ' + f2(A.imax) + ' A', 'That is past ' + IA + ' A, so the breaker opens within ' + T01 + ' s. Take t = ' + T01 + ' s.',
    'k = ' + K143 + ' for a copper cpc bunched with 90 °C thermosetting cables.', 'S = ' + cut(f5h.work, ' ≤')];
  const WCH = ['Ca = ' + CH.ca + ' at ' + CH.amb + ' °C, Cg = ' + CG.text, 'Factors together = ' + CH.ca + ' × ' + CG.text + ' = ' + f3(CH.f), 'It = ' + CH.In + ' ÷ ' + f3(CH.f) + ' = ' + f2(CH.it) + ' A'];

  const STEPS = [
    { name: 'Do you still have it?', label: 'Do you still have it?', task: REC_TASK,
      opts: [O_RIGHT, O_HEAT, O_RATE], want: O_RIGHT, why: REC_W + '. ' + REC_P },
    { show: true, name: 'What it is for', label: 'What it is for', text: FOR_TEXT },
    { show: true, name: 'The why', label: 'The why: which check sets the smallest cpc', text: WHY_TEXT, read: WHY_READ, still: { cpc: 2.5, len: RUN } },
    { name: 'Check', label: 'Check', task: CHK_TASK, opts: [C_RIGHT, C_HEAT, C_R12], want: C_RIGHT, why: CHK_WHY },
    { show: true, name: 'Worked example', label: 'Worked example: steel armour as the cpc', text: WK_TEXT, read: WK_READ,
      still: () => { lines = WCOUNT; K.refresh(); } },
    { name: 'Section A 5(a)', label: 'Section A · Question 5', assume: AS_5A, part: Q5A,
      task: AS_5A.split('\n\n').join(' ') + ' ' + Q5A, want: f5a.text, why: W5A.join('. ') },
    { name: 'Section A 5(b) and (c)', label: 'Section A · Question 5', shown: SHOWN_B, assume: AS_5C, part: Q5C,
      task: SHOWN_B + ' ' + AS_5C.split('\n\n').join(' ') + ' ' + Q5C, want: f5c.text, why: W5C.join('. ') },
    { name: 'Section A 5(e)', label: 'Section A · Question 5', part: Q5E, task: Q5E, want: f5e.text, why: W5E.join('. ') },
    { name: 'Section A 5(f) and (g)', label: 'Section A · Question 5', shown: SHOWN_F, assume: AS_5G, part: Q5G,
      task: SHOWN_F + ' ' + AS_5G + ' ' + Q5G, want: f5g.text, why: W5G.join('. ') },
    { name: 'Section A 5(h)', label: 'Section A · Question 5', part: Q5H, task: Q5H, want: f5h.text, why: W5H.join(' ') },
    { kind: 'written', written: 'b1', name: 'Section B', label: 'Section B · Short answer', task: 'A short written answer, in your own words.' },
    { name: 'Changed numbers', label: 'Section A · Changed numbers', assume: AS_CH, part: Q_CH,
      task: AS_CH + ' ' + Q_CH, want: fCh.text, why: WCH.join('. ') },
    { kind: 'summary', name: 'Keep this', label: 'Keep this' },
  ];

  function write(node, s, terms) {

    while (rest) {
      let at = -1, hit = null;
      list.forEach((t) => { const k = rest.indexOf(t); if (k >= 0 && (at < 0 || k < at)) { at = k; hit = t; } });
      if (at < 0) { node.appendChild(document.createTextNode(nb(rest))); break; }
      if (at > 0) node.appendChild(document.createTextNode(nb(rest.slice(0, at))));
      node.appendChild(K.el('mark', null, nb(hit)));
      list.splice(list.indexOf(hit), 1);
      rest = rest.slice(at + hit.length);
    }
    return node;
  }

    fitT.textContent = nb(c + ' mm² fitted');
    // Words.
    const lead = 'With a ' + c + ' mm² cpc over ' + fmtL(L) + ' m, Zs is ' + f3(o.zs) + ' Ω';
    let s;
    if (!o.worked) s = lead + ', well past the ' + ZMAX_T + ' line. Even at Cmax the fault current stays under ' + IA + ' A. So the breaker may not open within ' + T01 + ' s, and the heat is not worked.';
    else if (over) s = lead + ', past the ' + ZMAX_T + ' line, so the breaker may not open in time. Yet the heat needs only ' + f2(o.s) + ' mm². The loop fails first.';
    else s = lead + ', inside the ' + ZMAX_T + ' line. The heat needs only ' + f2(o.s) + ' mm² of the ' + c + ' mm² fitted. Both checks pass.';
    el('say').textContent = nb(s);
    svg.setAttribute('aria-label', "The lathe's circuit from DB2 with a " + c + ' mm² cpc over ' + fmtL(L) + ' m. The loop bar shows Zs ' + f3(o.zs) + ' Ω, '
      + (over ? 'past' : 'inside') + ' the ' + ZMAX_T + ' line. ' + (o.worked ? 'The heat bar shows ' + f2(o.s) + ' mm² needed, against ' + c + ' mm² fitted.' : 'The heat is not worked.'));
  }

  function enter() { const b = el('stepbox'); b.classList.remove('enter'); void b.offsetWidth; b.classList.add('enter'); }
  // Feedback and after notes fade in as the step does, whenever they change.
  const faded = {};
  function fade(node, key) {
    if (node.hidden) { faded[node.id] = ''; return; }
    if (faded[node.id] === key) return;
    faded[node.id] = key;
    node.classList.remove('fade'); void node.offsetWidth; node.classList.add('fade');
  }
  function paintFb(f) {
    const fb = el('fb');
    fb.textContent = '';
    fb.hidden = !f;
    if (!f) return;
    fb.className = 'fb ' + (f.ok ? 'ok' : 'bad');
    fb.appendChild(K.el('p', { class: 'v' }, f.v));
    if (f.p0) fb.appendChild(K.el('p', null, nb(f.p0)));
    (f.w || []).forEach((t) => fb.appendChild(K.el('p', { class: 'w' }, nb(t))));
    if (f.p) fb.appendChild(K.el('p', null, nb(f.p)));
  }

  // ---------- nav ----------
  const backBtn = K.button({ label: 'Back', secondary: true, into: '#nav', press: () => { if (at() > 0) stepper.set(at() - 1); } });
  const nextBtn = K.button({ label: 'Continue', into: '#nav', press: () => { const i = at(); if (canGo(i) && i < iK) stepper.set(i + 1); } });
  function canGo(i) {
    const d = STEPS[i], st = S[i];
    if (d.show) return true;
    if (i === iR) return st.res === 'wrong';
    if (i === iChk) return st.res === 'right';
    if (ANS[i]) return st.res === 'right' || st.shown;
    if (i === iB1) return !!(wB1 && wB1.answered && wB1.answered());
    return false;
  }

  K.model((p) => {
    const w = loopAt(cpcOf(p), lenOf(p));
    return { imin: w.imin, lmax: w.lmax, zs: w.zs, r12: w.r12, imax: w.imax, worked: w.worked, s: w.s };
  });

  const ON = { scen: [i5A, i5C, i5E, i5G, i5H], carry1: [i5C], carry2: [i5E], carry3: [i5G], carry4: [i5H], shown: [i5C, i5G], assume: [i5A, i5C, i5G, iCh],
    warn2: [iFor], wrap: [iWhy], ctl: [iWhy], outs: [iWhy], say: [iWhy], beside: [iWhy], under: [iWhy],
    worked: [iWk], workedgo: [iWk], picks: [iR, iChk],
    'ans-5a': [i5A], 'ans-5c': [i5C], 'ans-5e': [i5E], 'ans-5g': [i5G], 'ans-5h': [i5H], 'ans-ch': [iCh], wr1: [iB1], keep: [iK], fin: [iK] };

  K.update((p, o) => {
    const i = at(), d = STEPS[i], st = S[i];
    if (i !== lastStep) { if (lastStep !== -1) enter(); lastStep = i; if (i >= i5A && i <= i5H) scen.el.open = i === i5A; }
    Object.keys(ON).forEach((id) => { el(id).hidden = ON[id].indexOf(i) < 0; });
    el('cap').hidden = WORKING.indexOf(i) < 0;

    el('count').textContent = 'Step ' + (i + 1) + ' of ' + STEPS.length + ' · ' + d.label;
    const sh = el('shown');
    sh.textContent = '';
    if (d.shown) sh.appendChild(K.el('p', { class: 'w' }, nb(d.shown)));
    paras(el('assume'), d.assume || '');
    const task = el('task');
    task.className = 'task' + (d.show ? ' show' : '');
    if (d.show) paras(task, d.text, TERMS[i]);
    else write(task, d.part || (d.kind ? '' : d.task));
    task.hidden = !task.textContent;
    const sub = el('sub');
    const asks = i === iWhy || i === iWk;
    sub.className = 'sub' + (asks ? ' ask' : '');
    sub.textContent = i === iWhy ? 'Pick a thinner cpc, then drag the length.'
      : i === iWk ? 'Work each step yourself first, then press Show.'
      : i === i5E ? nb('Give the drop in V. Whether it complies follows.')
      : i === i5G ? nb('Give Zs in Ω. Whether it complies follows.')
      : i === i5H ? nb('Give the area in mm². Whether it is adequate follows.')
      : i === iB1 ? markLine('b1')
      : i === iCh ? nb('Same method, new numbers. Give It in A.')
      : i === iK ? 'One card to come back to on a real job.' : '';
    sub.hidden = !sub.textContent;

    drawWhy(p, o);

    // Picks.
    const opts = d.opts || [];
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      b.setLabel(nb(opts[k]));
      const done = st.res === 'right' || (i === iR && st.res === 'wrong');
      b.el.classList.toggle('is-right', done && opts[k] === d.want);
      b.el.classList.toggle('is-wrong', st.res === 'wrong' && opts[k] === st.pick);
      b.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });

    // The worked example's blocks, and the note once they are all shown.
    wblocks.forEach((w, k) => { w.hidden = k >= lines; });
    wnote.hidden = lines < WCOUNT;
    nextLine.el.hidden = lines >= WCOUNT;
    if (i === iWk) el('workedgo').hidden = lines >= WCOUNT;

    // Check, the feedback, and what follows a finished typed answer.
    const typed = !!ANS[i], typedDone = typed && (st.res === 'right' || st.shown);
    checkBtn.el.hidden = !typed || typedDone;
    el('acts').hidden = checkBtn.el.hidden;
    paintFb(st.fb);
    const after = el('after');
    paras(after, typedDone ? SPEC[i].after : '', typedDone ? SPEC[i].terms : null);
    after.hidden = !after.textContent;
    el('go').hidden = !(i === iR && st.res === 'right');
    [['fb', JSON.stringify(st.fb)], ['after', i + after.textContent], ['go', String(i)]].forEach(([id, key]) => fade(el(id), key));

    el('donefb').textContent = finished && i === iK ? 'Lesson finished. Back is there whenever you want another look.' : '';
    el('donefb').hidden = !el('donefb').textContent;

    backBtn.el.hidden = i === 0;
    nextBtn.el.hidden = i === iK || !canGo(i) || (i === iR && st.res === 'right');
    el('nav').hidden = backBtn.el.hidden && nextBtn.el.hidden;
  });

  // ---------- known answers, worked out by hand ----------
  const near = (a, b) => K.near(a, b, 1e-9);
  K.check('At 27 m: 4 mm² gives Zs 0.719 Ω and needs 0.78 mm²; 2.5 mm² gives 0.415 and 0.815 Ω and needs 0.69 mm²', () => {
    const a = K.at({ cpc: 4, len: 27 }), b = K.at({ cpc: 2.5, len: 27 });
    return near(a.zs, fRecZ.value) && near(a.s, fWhy4.value) && near(b.r12, fR25.value) && near(b.zs, f5g.value) && near(b.s, f5h.value) && b.zs <= ZMAX;
  });
  K.check('At 27 m the 1.5 mm² cpc crosses the line at 0.977 Ω, with 223.64 A at Cmin, yet the heat needs only 0.57 mm²', () => {
    const o = K.at({ cpc: 1.5, len: 27 });
    return near(o.zs, fWhy15.value) && o.zs > ZMAX && near(o.imin, 223.64) && o.imin < IA && o.worked === 1 && near(o.s, 0.57);
  });
  K.check('Longest runs: 21.9 m with 1.5 mm², 30.5 m with 2.5 mm², 39.8 m with 4 mm²', () =>
    near(K.at({ cpc: 1.5 }).lmax, fL15.value) && near(K.at({ cpc: 2.5 }).lmax, fL25.value) && near(K.at({ cpc: 4 }).lmax, fL4.value)
    && K.at({ cpc: 2.5, len: 30.5 }).zs <= ZMAX && K.at({ cpc: 2.5, len: 31 }).zs > ZMAX);
  K.check('Zs rises with the run and with a thinner cpc, while the heat needed falls as long as the breaker trips within 0.1 s', () => {
    for (let k = 0; k < CPCS.length; k++) {
      let prev = null;
      for (let L = 10; L <= 40; L += 0.5) {
        const o = K.at({ cpc: CPCS[k], len: L });
        if (k > 0 && !(K.at({ cpc: CPCS[k - 1], len: L }).zs > o.zs)) return false;
        if (prev && (o.zs < prev.zs || (o.worked && prev.worked && o.s > prev.s))) return false;
        prev = o;
      }
    }
    return true;
  });
  K.check('Past 1.012 Ω the Cmax current falls under 250 A, and the heat is not worked (1.5 mm² at 40 m)', () => {
    const o = K.at({ cpc: 1.5, len: 40 });
    return o.zs > VMAX / IA && o.imax < IA && o.worked === 0 && K.at({ cpc: 1.5, len: 28.5 }).worked === 1;
  });
  K.check('The recall: 0.319 and 0.719 Ω with the 4 mm² cpc. The check at 32 m: 0.492 Ω, 0.892 Ω, and 0.63 mm² for the heat', () =>
    near(loopAt(4, RUN).r12, fRecR.value) && near(CK.r12, fChk2.value) && near(CK.zs, fChk.value) && near(CK.s, fChk1.value) && CK.zs > ZMAX);
  K.check('The armour: 18.65 and 49.74 mm² needed; 0.518 mΩ/m, 0.041 Ω, Zs 0.101 Ω, 2504.95 A; 17.22 and 5.54 mm²', () =>
    near(SW.needA, F('l10.swa.a').value) && near(SW.needB, F('l10.swa.b').value) && near(SW.r2, F('l10.swa.par').value) &&
    near(SW.r12, F('l10.swa.r12').value) && near(SW.zs, F('l10.swa.zs').value) && near(SW.imax, F('l10.swa.imax').value) &&
    near(SW.sa, F('l10.swa.sa').value) && near(SW.sc, F('l10.swa.sc').value) && SW.needA < A6 && SW.needB < A25_4 && SW.sa < A25_5 && SW.sc < 25);
  K.check('Parts 5a to 5e: 388 V, 21.74 A (21.77 A with 1.73), 0.714, 35.01 A, 26.42 A, 12.00 + 5.87 = 17.87 V within 20.00 V', () =>
    near(A.U, fU.value) && near(A.ib, f5a.value) && near(A.ib173, 21.77) && A.ib > F('5b.slip1').value && near(IN, 25) && near(A.f, fFac.value) &&
    near(A.it, f5c.value) && near(A.iz, 26.42) && A.iz >= IN && IT25.value < A.it && IT4.value >= A.it &&
    near(A.vd, fVd.value) && near(A.vt, f5e.value) && near(A.vt217, 17.86) && near(A.vt2177, 17.88) && A.vt <= A.vlim);
  K.check('Parts 5g and 5h: Zs 0.815 Ω, 268.10 A at Cmin, 310.43 A at Cmax, 0.69 mm² for the heat', () =>
    near(A.zs, f5g.value) && near(A.imin, fImin.value) && near(A.imax, fImax.value) && near(A.s, f5h.value) && A.imin >= IA);
  K.check('Changed numbers: 0.658, It 60.79 A, 16 mm² at 68 A, drop 2.00 V within 6 V', () =>
    near(CH.f, 0.658) && near(CH.it, fCh.value) && CH.t10 < CH.it && CH.t16 >= CH.it && near(CH.vd, 2) && CH.vd <= CH.lim);
  K.check('Every slip lies outside its answer\'s accepted figures', () => Object.keys(SPEC).every((k) => {
    const sp = SPEC[k], tol = 0.5 * Math.pow(10, -sp.decimals);
    return sp.slips.every((s) => Math.abs(s.value - sp.fig.value) > tol && sp.accept.every((x) => Math.abs(s.value - x) > tol));
  }));
  K.check('Table 41.3: a 25 A type C circuit-breaker has a maximum Zs of 0.87 Ω', () => ZMAX === 0.87,
    { source: 'https://www.elec-mate.com/guides/maximum-zs-values-bs-7671' });
  K.check('For a supply to ESQCR, Cmin is 0.95', () => CMIN === 0.95 && near(VMIN, 218.5),
    { source: 'https://electrical.theiet.org/media/1442/maximum-zs-values.pdf' });
  K.check('A type C breaker trips within 0.1 s at 10 × In', () => near(10 * IN, IA) && T01 === 0.1,
    { source: 'https://library.e.abb.com/public/887c88977d614f32854aca99b37ed120/B_EPBP_Cat_2018_01_MCBs.pdf?x-sign=NqUifdEQY53bQHaDL42gCLBSlPkD+BWA/sbmhMd4Zi1NBVYG2l94faT0rjFOoWKj' });
  K.check('Above 16 mm², up to 35 mm², Table 54.7 gives (k1 ÷ k2) × 16', () => near(SW.needB, r2(K1 / K2 * 16)),
    { source: 'https://goldbergkabel.com/blogs/technical-resources/protective-conductor-adiabatic-equation-ss-638' });
  K.check('BS 5467 cables: 25 mm² cores 0.727 mΩ/m, armour 70 mm² four-core and 88 mm² at 1.8 mΩ/m five-core; 6 mm² four-core armour 36 mm²', () =>
    RC === 0.727 && A25_4 === 70 && A25_5 === 88 && RA === 1.8 && A6 === 36,
    { source: 'https://uk.prysmian.com/sites/default/files/atoms/files/BS5467.pdf' });
  K.check('The upstream device rating is at most the rated current of the assembly', () => CH.In <= CH.board,
    { source: 'https://assets.sc.hager.com/uk/-/media/project/hagerdeep/united-kingdom/hager/b2b-uk/support/bitesize-guide-amd4.pdf' });

  K.ready();
</script>
