  .sub { font-size: .95rem; color: var(--k-muted); line-height: 1.5; }
  .pic { display: block; width: 100%; }

  .ctl { display: grid; gap: 8px; }

     so the sentence keeps its space and nothing below it jumps as it changes. */

  .held > span { grid-area: 1 / 1; }
  .held > .ghost { visibility: hidden; }
  .rule1 { display: grid; gap: 4px; padding: 12px 14px; border-radius: 12px; background: var(--k-panel); border: 1px solid var(--k-line); }
  .rule1 .eq { font-size: 1.1rem; font-weight: 800; line-height: 1.4; }
  .frac { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: .95rem; font-weight: 700; line-height: 1.4; }
  .frac .fr { display: inline-flex; flex-direction: column; text-align: center; min-width: 0; }

  .picks { display: flex; flex-direction: column; gap: 10px; }
  .picks .k-btn { width: 100%; min-height: 56px; font-size: 1.05rem; white-space: normal; text-align: left; justify-content: flex-start; line-height: 1.35; padding: 10px 14px; }
  .picks .k-btn.is-right { border-color: var(--k-good); color: var(--k-good); box-shadow: inset 0 0 0 1px var(--k-good); }
  .picks .k-btn.is-wrong { border-color: var(--k-warn); color: var(--k-warn); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  .row .k-btn { flex: 1 1 9rem; min-height: 48px; }
  .fb { padding: 12px 14px; border-radius: 12px; background: var(--k-panel); border: 1.5px solid var(--k-line); line-height: 1.5; }
  .fb.ok { box-shadow: inset 4px 0 0 var(--k-good); }
  .fb.bad { box-shadow: inset 4px 0 0 var(--k-warn); }
  .fb > * + * { margin-top: 6px; }
  .fb .v { font-weight: 700; font-size: 1.05rem; }
  .fb.ok .v { color: var(--k-good); }
  .why { line-height: 1.6; }
  .fold { padding: 4px 14px 12px; border-radius: 12px; background: var(--k-panel); border: 1px solid var(--k-line); line-height: 1.55; }
  .fold summary { min-height: 44px; display: flex; align-items: center; font-weight: 700; cursor: pointer; }
  .fold > p + p { margin-top: 8px; }
  .foot { font-size: .92rem; color: var(--k-muted); line-height: 1.5; }
  #stepbox.enter, .wl .w.enter { animation: screen-in .35s ease-out both; }
  @keyframes screen-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  html.k-testing #stepbox.enter, html.k-testing .wl .w.enter { animation: none; }
  @media (prefers-reduced-motion: reduce) { #stepbox.enter, .wl .w.enter { animation: none; } }
  /* The carried-forward panel: each figure on its own line under its label, so a long figure
     ("Table 4E1A, column 5") wraps instead of squeezing the label into a sliver. */
  #carry .k-carried { grid-template-columns: minmax(0, 1fr); }
  #carry .k-cr { grid-template-columns: 2rem minmax(0, 1fr) 24px; row-gap: 2px; }
  #carry .k-cr-value { grid-column: 2; grid-row: 2; white-space: normal; }

<p class="caption" id="cap">Practice values are marked. Each line is worked from the rounded figures before it.</p>

<script>
  // ---------- the rule, and the course's figures ----------
  const RT3 = Math.sqrt(3);
  // Half up to 2 (or 4) places, as the course rounds: each line worked from the rounded figure shown.
  const r2 = (x) => Math.round(x * 100 + 1e-7) / 100;
  const r4 = (x) => Math.round(x * 1e4 + 1e-7) / 1e4;
  const f2 = (x) => r2(x).toFixed(2);
  const F = (id) => K.figure(id);
  const el = (id) => document.getElementById(id);
  // VD = mV/A/m × Ib × L ÷ 1000 (your slides p.38, 39)
  const vdOf = (mv, ib, L) => r2(mv * ib * L / 1000);
  // Ct as a reader quoted BS 7671 (myElectrical), each line from the rounded figure before it.
  function ctOf(ib, it, ca, cg, tp) {
    const base = r4(ca * ca * cg * cg), q = r4((ib / it) * (ib / it)), d = r4(base - q), m = r2(d * (tp - 30));
    const frac = r4((230 + tp - m) / (230 + tp));
    return { base, q, d, m, frac, ct: r2(frac) };
  }

  const UN1 = 230, UN3 = 400;
  const LIM = r2(UN1 * 0.05), LIM3 = r2(UN3 * 0.05);   // 5% of 230 V and of 400 V (your slides p.38)
  const IBH = r2(3000 / UN1);                           // the slides' 3 kW heater (p.42)
  const SUB = r2(10 / RT3);                             // a 10 V three-phase submain drop as single-phase
  const VB = r2(UN1 - SUB);                             // the voltage at the board
  const LH = 85;                                        // the slides' heater circuit, m
  const CAH = F('g.heater.Ca').value;                   // Ca at 35 °C
  const MV6 = F('g.heater.vd6').value, MV4 = F('g.heater.vd4').value, IT6 = F('g.heater.it6').value, IT4 = F('g.heater.it4').value;
  const CABLES = {
    '1.5': { name: '1.5 mm²', mv: 29, it: 17.5 },       // slides p.42; Table 4D1A, your copy p.448, column 4
    '4': { name: '4.0 mm²', mv: MV4, it: IT4 },
    '6': { name: '6.0 mm²', mv: MV6, it: IT6 },
  };
  Object.keys(CABLES).forEach((k) => {
    const c = CABLES[k];
    c.drop = vdOf(c.mv, IBH, LH);
    c.c = ctOf(IBH, c.it, CAH, 1, 70);
    c.dct = r2(c.drop * c.c.ct);
  });
  const MAXMV = Math.floor(LIM * 1000 / (IBH * LH) * 100) / 100;   // rounded down
  const vdcOf = (L) => vdOf(MV6, IBH, L);
  const totOf = (L) => r2(SUB + vdcOf(L));

  // r, x and z for 25 mm² 90 °C singles in conduit, three-phase (Table 4E1B, your copy p.459).
  const R25 = 1.6, X25 = 0.27, Z25 = 1.65;
  const pfR = (v) => Math.round(v * 100) / 100;
  const sinOf = (pf) => r2(Math.sqrt(Math.max(0, 1 - pf * pf)));
  const dpmOf = (pf) => r2(r2(R25 * pf) + r2(X25 * sinOf(pf)));
  const underZ = (pf) => Math.round((1 - dpmOf(pf) / Z25) * 100);

  // The recall, the check and the worked example (case file l5.*).
  const RC = { u: 395, sub: 10, rad: 9.8 }, RC_T = Math.round((10 + 9.8) * 10) / 10;
  const CK = { c: 7.2, s: 9.0 };
  const fR = F('l5.recall'), fC = F('l5.check'), fC1 = F('l5.check.slip1');
  const fW85 = F('l5.worked.85'), fWmax = F('l5.worked.max'), fW4 = F('l5.worked.4'), fW6 = F('l5.worked.6');
  const fCt15 = F('l5.ct.15'), fCt4 = F('l5.ct.4'), fCt6 = F('l5.ct.6'), fPf = F('l5.pf.08');

  // Section A, question 1 (g), on the showroom's motor.
  const f1a = F('1a'), f1b = F('1b'), f1f = F('1f'), f1g = F('1g');
  const fDb = F('l5.A.1g.dbp2'), fLeg = F('l5.A.1g.leg'), fPct = F('l5.A.1g.pct'), fAlt = F('l5.A.1g.alt'), fCtG = F('l5.A.1g.ct');
  const MV25 = F('g.vd.2p5').value, MV15 = F('g.vd.1p5.1ph').value, IT25 = F('g.it.2p5').value, IT15 = F('g.it.1p5').value;
  const SUBD = F('p.submain').value, LEG = F('p.legLen').value, CA_SR = F('p.Ca').value;
  const RUN = 11.4;                 // DBP2 to the motor on plan, the course's own (a.motorRun)
  const CG_LEG = 0.8;               // the six singles grouped (lesson 3)
  const LEG_ALT = r2(fLeg.value * RT3);
  const ctDb = ctOf(f1a.value, IT25, CA_SR, 1, 90), ctLeg = ctOf(f1b.value, IT15, CA_SR, CG_LEG, 90);
  const DB_CT = r2(fDb.value * ctDb.ct), LEG_CT = r2(fLeg.value * ctLeg.ct);

  // Section A, changed numbers.
  const CH = { L: 32, ib: 9, mv: MV15, sub: 7.5 };
  const fCh = F('l5.A.changed');
  const CH_C = vdOf(CH.mv, CH.ib, CH.L), CH_S = r2(CH.sub / RT3);

  // ---------- the lesson: SHOW steps teach, DO steps ask ----------
  const O0 = ['No: ' + RC_T + ' V is over 5% of 395 V, ' + fR.text, 'Yes: ' + RC_T + ' V is inside 5% of 400 V, ' + f2(LIM3) + ' V', 'Yes: the radial\'s ' + RC.rad + ' V is inside the limit on its own'];
  const O3 = [fC1.text + ': the submain\'s drop ÷ √3 first, so it complies', fC.text + ', inside ' + f2(LIM3) + ' V: it complies', fC.text + ', over ' + f2(LIM) + ' V: it does not comply'];
  const RWORK = RC.sub + ' + ' + RC.rad + ' = ' + RC_T + ' V. It is three-phase throughout, so there is no ÷ √3. ' + fR.work + '.';
  const Q1G = '(g) Determine the actual voltage drop of the motor circuit, from the intake to the motor.';
  const CH_Q = 'A single-phase power circuit, ' + CH.L + ' m of 1.5 mm² 90 °C singles in conduit (' + CH.mv + ' mV/A/m), Ib ' + CH.ib + ' A, is fed from a sub-board whose three-phase submain drops ' + CH.sub + ' V. No supply voltage is given. Determine the total voltage drop from the origin.';
  const STEPS = [
    { name: 'Do you still have it?', label: 'Do you still have it?',
      task: '“A supply is given as 395 V. A submain feeding a second board has a calculated voltage drop of 10 V, and a radial power circuit from that board 9.8 V. Does the circuit comply?” The example is three-phase throughout.',
      opts: O0, want: O0[0], read: RC.sub + ' + ' + RC.rad + ' = ' + RC_T + ' V. That is over 5% of the given 395 V, ' + fR.text + ', so it does not comply.' },
    { show: true, name: 'What it is for', label: 'What it is for',
      text: 'The cable\'s resistance uses up some of the supply\'s voltage on the way. The load gets what is left: the *voltage drop*. On a public supply, Table 4Ab limits it. Lighting may drop up to 3%: 6.9 V single-phase and 12 V three-phase. Other circuits may drop up to 5%: 11.5 V and 20 V. The limit runs from the *origin* to the most distant point of the circuit. BS 7671 takes the percentages of the nominal voltage. In your assessments, take them of the supply voltage when one is given. That is the stricter test when the supply is below nominal.',
      read: 'Each drop is mV/A/m × Ib × L ÷ 1000. Keep the total from the origin to the far end within 3% for lighting or 5% for other circuits.' },
    { show: true, name: 'The why', label: 'The why',
      text: 'This screen puts two examples together. A submain drops 10 V, taken here as three-phase. From its board, a single-phase circuit feeds a 3 kW heater: ' + f2(IBH) + ' A in 6.0 mm², ' + MV6 + ' mV/A/m (Table 4D1B, column 3).',
      read: 'At ' + LH + ' m the heater circuit drops ' + f2(vdcOf(LH)) + ' V. With the submain\'s ' + f2(SUB) + ' V the total is ' + f2(totOf(LH)) + ' V, over ' + f2(LIM) + ' V. The total reaches the limit near 60 m.' },
    { name: 'Check', label: 'Check',
      task: 'A three-phase motor circuit has a calculated voltage drop of ' + CK.c + ' V. Its board is fed by a three-phase submain with a calculated drop of ' + CK.s.toFixed(1) + ' V. No supply voltage is given. What is the total, and does it comply?',
      opts: O3, want: O3[1],
      why: fC.work.replace(' ≤ ', ', inside ') + '. It is three-phase all the way, so judge it against 5% of 400 V.',
      hints: { [O3[0]]: 'Not quite. The ÷ √3 is for a three-phase submain feeding a single-phase circuit. This load is three-phase.',
        [O3[2]]: 'Not quite. ' + f2(LIM) + ' V is 5% of 230 V. A three-phase circuit takes 5% of the three-phase voltage.' },
      read: fC.work.replace(' ≤ ', ', inside ') + '.' },
    { show: true, name: 'Worked example', label: 'Worked example',
      text: 'A 3 kW heater on 70 °C thermoplastic singles, at 35 °C, Reference Method B, ' + LH + ' m. Work each step yourself first, then press Show the next step to check it.',
      read: '1.5 mm² (' + fW85.text + ') and 4.0 mm² (' + fW4.text + ') fail. 6.0 mm² (' + fW6.text + ') passes. The most that can pass is ' + fWmax.text + '.' },
    { show: true, name: 'A lightly loaded cable', label: 'The why, refined',
      text: 'Appendix 4\'s mV/A/m assume the conductor is at its *maximum operating temperature*, 70 °C or 90 °C. It reaches that only at full load. Current heats a conductor, which raises its resistance and so the drop. At lower loads its temperature and resistance are lower. *Ct* corrects the drop for this.',
      read: 'In 4.0 mm² the heater circuit drops ' + fW4.text + ', over ' + f2(LIM) + ' V. With Ct ' + CABLES['4'].c.ct.toFixed(2) + ' it drops ' + fCt4.text + ', inside.' },
    { show: true, name: 'A known power factor', label: 'The why, refined',
      text: 'From 25 mm² up, the tables give *r*, *x* and *z*. With no known power factor, z is acceptable. With one, use r and x.',
      read: 'At power factor 0.8, 1.60 × 0.8 + 0.27 × 0.6 = ' + fPf.text + ', against z\'s ' + Z25.toFixed(2) + '.' },
    { name: 'Section A (g)', label: 'Section A · Question 1', part: Q1G, task: Q1G,
      want: f1g.text, why: f1g.work, read: 'What is the actual drop of the motor circuit, from the intake to the motor? Use the practice values. Is it inside ' + f2(LIM3) + ' V?' },
    { kind: 'written', written: 'b1', name: 'Section B', label: 'Section B · Short answer',
      task: 'A short written answer, in your own words.' },
    { name: 'Changed numbers', label: 'Section A · Changed numbers', part: CH_Q, task: CH_Q,
      want: fCh.text, why: fCh.work, read: 'A single-phase power circuit runs ' + CH.L + ' m in 1.5 mm² singles at ' + CH.mv + ' mV/A/m. It carries ' + CH.ib + ' A. Its sub-board\'s three-phase submain drops ' + CH.sub + ' V. No supply voltage is given. What is the total drop from the origin, and is it within the limit?' },
    { kind: 'summary', name: 'Keep this', label: 'Keep this' },
  ];
  const S = STEPS.map(() => ({ res: null, pick: null, tries: 0, shown: false, why: false, fb: null }));
  const iFor = 1, iWhy = 2, iChk = 3, iWk = 4, iCt = 5, iPf = 6, iA = 7, iW = 8, iCh = 9, iK = 10;
  const WORKING = [iWhy, iChk, iWk, iCt, iPf, iA, iCh];   // the screens with working, where the caption belongs
  let lastStep = -1, finished = false, lines = 0;

  // Text with key terms (*term*) highlighted in amber (the <mark> element), built with K.el, never innerHTML.
  function write(node, s) {
    node.textContent = '';
    String(s || '').split(/(\*[^*]+\*)/).forEach((b) => {
      if (!b) return;
      if (b.length > 2 && b.charAt(0) === '*' && b.charAt(b.length - 1) === '*') node.appendChild(K.el('mark', null, b.slice(1, -1)));
      else node.appendChild(document.createTextNode(b));
    });
  }
  // Every wording laid out in one place, only wording k seen (see .held).
  function held(node, wordings, k) {
    node.textContent = '';
    const box = K.el('div', { class: 'held' });
    wordings.forEach((s, j) => box.appendChild(K.el('span', j === k ? null : { class: 'ghost', 'aria-hidden': 'true' }, s)));
    node.appendChild(box);
  }

  // ---------- controls ----------
  const stepper = K.stepper({ id: 'step', label: 'Lesson', steps: STEPS.map((d) => d.name), value: 0, compact: true, into: '#prog' });
  const at = () => K.clamp(Math.round(stepper.get()) || 0, 0, STEPS.length - 1);
  K.control({ id: 'len', label: 'Heater circuit length', min: 0, max: 120, step: 5, value: LH, unit: 'm', snap: [60, 65], into: '#ctlLen' });
  K.choice({ id: 'cable', label: 'Cable', options: [{ value: '1.5', label: '1.5 mm²' }, { value: '4', label: '4.0 mm²' }, { value: '6', label: '6.0 mm²' }], value: '6', into: '#ctlCt' });
  K.toggle({ id: 'ct', label: 'Apply Ct', value: false, into: '#ctlCt' });
  K.control({ id: 'pf', label: 'Power factor', min: 0.5, max: 1, step: 0.05, value: 0.8, fmt: (v) => pfR(v).toFixed(2), snap: [0.5, 0.8, 1], into: '#ctlPf' });

  K.readout({ id: 'vdc', label: 'Heater circuit\'s drop', unit: 'V', decimals: 2, into: '#outsLen' });
  K.readout({ id: 'tot', label: 'Total from the origin', unit: 'V', decimals: 2, into: '#outsLen' });
  K.readout({ id: 'lim', label: 'Limit', unit: 'V', decimals: 2, into: '#outsLen' });
  K.readout({ id: 'share', label: 'Ib ÷ It', decimals: 2, into: '#outsCt' });
  K.readout({ id: 'ct', label: 'Ct', into: '#outsCt' });
  K.readout({ id: 'vd', label: 'Heater circuit\'s drop', unit: 'V', decimals: 2, into: '#outsCt' });
  K.readout({ id: 'sinphi', label: 'sin φ', decimals: 2, into: '#outsPf' });
  K.readout({ id: 'dpm', label: 'Drop per amp per metre', unit: 'mV/A/m', decimals: 2, into: '#outsPf' });

  // Picks: one tap answers.
  const pickBtns = [0, 1, 2].map((k) => K.button({ label: 'Answer ' + (k + 1), secondary: true, into: '#picks', press: () => pick(k) }));
  function pick(k) {
    const i = at(), d = STEPS[i], st = S[i];
    if (!d.opts || k >= d.opts.length) return;
    if (i === 0) {
      if (st.res) return;     // a recall gets one go
      st.pick = d.opts[k];

  function geo(pf) {
    const c = pf, s = Math.sqrt(Math.max(0, 1 - pf * pf));
    const A = { x: PO.x + PS * R25 * c, y: PO.y + PS * R25 * s };
    const B = { x: A.x + PS * X25 * s, y: A.y - PS * X25 * c };
    return { c, s, A, B };
  }
  function arrow(svg, x1, y1, x2, y2, cl, hcl) {
    const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L, h = 9, w = 5;
    const bx = x2 - ux * h, by = y2 - uy * h;
    sv(svg, 'line', { x1: fx(x1), y1: fx(y1), x2: fx(bx), y2: fx(by), class: cl });
    sv(svg, 'path', { d: 'M' + fx(x2) + ' ' + fx(y2) + ' L' + fx(bx - uy * w) + ' ' + fx(by + ux * w) + ' L' + fx(bx + uy * w) + ' ' + fx(by - ux * w) + ' Z', class: hcl });
  }
  function drawPf(pf) {

      sv(s, 'text', { x: fx(PO.x + 56 * Math.cos(a)), y: fx(PO.y + 56 * Math.sin(a) + 4.5), class: 'lb', 'text-anchor': 'middle' }, 'φ');

    if (g.A.y - PO.y > 1) sv(s, 'line', { x1: fx(g.A.x), y1: fx(g.A.y), x2: fx(g.A.x), y2: PO.y, class: 'gd' });
    if (Math.abs(g.B.y - PO.y) > 1) sv(s, 'line', { x1: fx(g.B.x), y1: fx(g.B.y), x2: fx(g.B.x), y2: PO.y, class: 'gd' });
    sv(s, 'line', { x1: PO.x, y1: PO.y, x2: fx(g.A.x), y2: PO.y, class: 'sr' });
    if (g.B.x - g.A.x > 0.5) sv(s, 'line', { x1: fx(g.A.x), y1: PO.y, x2: fx(g.B.x), y2: PO.y, class: 'sx' });
    arrow(s, PO.x, PO.y, g.A.x, g.A.y, 'ra', 'rah');
    arrow(s, g.A.x, g.A.y, g.B.x, g.B.y, 'xa', 'xah');
    const zx = PO.x + PS * Z25;
    sv(s, 'line', { x1: fx(zx), y1: PO.y - 8, x2: fx(zx), y2: PO.y + 8, class: 'vl' });
    sv(s, 'text', { x: fx(zx + 5), y: PO.y - 9, class: 'lb' }, 'z ' + Z25.toFixed(2));
    // The key, inside the drawing.
    [[2, 302, 'vl', 'Load\'s voltage'], [146, 302, 'il', 'Current'], [2, 322, 'ra', 'r drop'], [146, 322, 'xa', 'x drop'], [2, 342, 'za', 'z']].forEach((k) => {
      sv(s, 'line', { x1: k[0], y1: k[1], x2: k[0] + 20, y2: k[1], class: k[2] });
      sv(s, 'text', { x: k[0] + 26, y: k[1] + 4.5, class: 'lb' }, k[3]);
    });
    sv(s, 'line', { x1: 146, y1: 342, x2: 156, y2: 342, class: 'sr' });
    sv(s, 'line', { x1: 156, y1: 342, x2: 166, y2: 342, class: 'sx' });
    sv(s, 'text', { x: 172, y: 346.5, class: 'lb' }, 'Shadows on the voltage');
    s.setAttribute('aria-label', 'The r drop along the current and the x drop at right angles to it, a quarter-cycle ahead; z joins their ends. The load\'s voltage runs across the top' +
      (g.s > 0.01 ? ', the current at the angle φ below it; each drop\'s shadow along the voltage is marked on it, ending short of z' : ', in step with the current; the r drop lies along it'));
  }

  function enter() { const b = el('stepbox'); b.classList.remove('enter'); void b.offsetWidth; b.classList.add('enter'); }
  function paintFb(f) {
    const fb = el('fb');
    fb.textContent = '';
    fb.hidden = !f;
    if (!f) return;
    fb.className = 'fb ' + (f.ok ? 'ok' : 'bad');
    fb.appendChild(K.el('p', { class: 'v' }, f.v));
    if (f.p0) { const p = K.el('p'); write(p, f.p0); fb.appendChild(p); }
    if (f.w) fb.appendChild(K.el('p', { class: 'w' }, f.w));
    if (f.p) { const p = K.el('p'); write(p, f.p); fb.appendChild(p); }
  }

  // ---------- nav ----------
  const backBtn = K.button({ label: 'Back', secondary: true, into: '#nav', press: () => { if (at() > 0) stepper.set(at() - 1); } });
  const nextBtn = K.button({ label: 'Continue', into: '#nav', press: () => { const i = at(); if (canGo(i) && i < iK) stepper.set(i + 1); } });
  function canGo(i) {
    const d = STEPS[i], st = S[i];
    if (d.show) return true;
    if (i === 0) return st.res === 'wrong';
    if (i === iChk) return st.res === 'right';
    if (ANS[i]) return st.res === 'right' || st.shown;
    if (i === iW) return !!(wB && wB.answered && wB.answered());
    return false;
  }

  K.model((p) => {
    const L = p.len, c = CABLES[String(p.cable)] || CABLES['6'], on = !!p.ct, pf = pfR(p.pf);
    return { vdc: vdcOf(L), tot: totOf(L), lim: LIM, share: r2(IBH / c.it), ct: on ? c.c.ct.toFixed(2) : 'Not applied', vd: on ? c.dct : c.drop,
      sinphi: sinOf(pf), dpm: dpmOf(pf) };
  });

  const ON = { scen: [iA], carry: [iA], given: [iA], legNote: [iA], vdRule: [iFor], warn1: [iFor],
    pathWrap: [iWhy], ctlLen: [iWhy], outsLen: [iWhy], whyNote: [iWhy],
    ctWrap: [iCt], ctlCt: [iCt], outsCt: [iCt], ctRule: [iCt], ctHeat: [iCt], debated: [iCt],
    pfWrap: [iPf], ctlPf: [iPf], outsPf: [iPf], pfRule: [iPf], pfWhy: [iPf], say: [iWhy, iCt, iPf],
    worked: [iWk], workedgo: [iWk], picks: [0, iChk], 'ans-1g': [iA], 'ans-ch': [iCh], wr: [iW], keep: [iK], fin: [iK] };

  const ctSay = (k, on) => {
    const c = CABLES[k], ct = c.c.ct.toFixed(2);
    if (k === '1.5') return on ? 'Near its rating, ' + c.name + ' runs almost as hot as the table assumes. Ct ' + ct + ' takes its drop only from ' + f2(c.drop) + ' V to ' + f2(c.dct) + ' V, still far over the ' + f2(LIM) + ' V limit.'
      : c.name + ' carries ' + f2(IBH) + ' A of its ' + c.it + ' A, near its rating. By the table it drops ' + f2(c.drop) + ' V, nearly three times the ' + f2(LIM) + ' V limit.';
    if (k === '4') return on ? 'Well under its rating, ' + c.name + ' runs cooler than the table assumes. Ct ' + ct + ' brings its drop from ' + f2(c.drop) + ' V to ' + f2(c.dct) + ' V, under ' + f2(LIM) + ' V. So a smaller cable than 6.0 mm² passes.'
      : c.name + ' carries ' + f2(IBH) + ' A of its ' + c.it + ' A. By the table it drops ' + f2(c.drop) + ' V, just over the ' + f2(LIM) + ' V limit.';
    return on ? 'Running cool, ' + c.name + ' drops ' + f2(c.dct) + ' V with Ct ' + ct + '. It passed already at ' + f2(c.drop) + ' V, so Ct is not needed here.'
      : c.name + ' carries ' + f2(IBH) + ' A of its ' + c.it + ' A. By the table it drops ' + f2(c.drop) + ' V, inside the ' + f2(LIM) + ' V limit.';
  };

  K.update((p) => {
    const i = at(), d = STEPS[i], st = S[i];
    if (i !== lastStep) {
      if (lastStep !== -1) enter();
      lastStep = i;
      if (scen && scen.el) scen.el.open = i === iA;
    }
    Object.keys(ON).forEach((id) => { el(id).hidden = ON[id].indexOf(i) < 0; });
    el('cap').hidden = WORKING.indexOf(i) < 0;

    el('count').textContent = 'Step ' + (i + 1) + ' of ' + STEPS.length + ' · ' + d.label;
    const task = el('task');
    task.className = 'task' + (d.show ? ' show' : '');
    write(task, d.show ? d.text : d.part || (d.kind ? '' : d.task));
    task.hidden = !task.textContent;
    const sub = el('sub');
    sub.textContent = i === iWhy ? 'No supply voltage is given, so the origin is the nominal ' + UN1 + ' V. Drag the heater, or use the length slider.'
      : i === iCt ? 'The same heater, ' + f2(IBH) + ' A on ' + LH + ' m. Choose a cable, and switch Ct on and off.'
      : i === iPf ? '25 mm² 90 °C singles in conduit, three-phase: r 1.60, x 0.27 and z ' + Z25.toFixed(2) + ' mV/A/m (Table 4E1B). Drag the power factor. The showroom motor\'s is 0.8.'
      : i === iCh ? 'The same kind of question, with new numbers.' : i === iK ? 'One card to come back to on a real job.' : '';
    sub.hidden = !sub.textContent;

    // The pictures.
    drawPath(p.len);
    if (i === iWhy) {
      const L = p.len, a = vdcOf(L), t = totOf(L), vh = r2(UN1 - t);
      held(el('say'), [
        'With no heater circuit the heater sits at the board and loses only the submain\'s ' + f2(SUB) + ' V, inside the ' + f2(LIM) + ' V limit.',
        'The heater circuit drops ' + f2(a) + ' V. With the submain\'s ' + f2(SUB) + ' V, the heater has lost ' + f2(t) + ' V from the origin, inside the ' + f2(LIM) + ' V limit.',
        'The heater circuit drops ' + f2(a) + ' V, inside the limit on its own. But with the submain\'s ' + f2(SUB) + ' V, the heater has lost ' + f2(t) + ' V from the origin. That is over ' + f2(LIM) + ' V, so its ' + f2(vh) + ' V falls below ' + f2(UN1 - LIM) + ' V.',
      ], L === 0 ? 0 : t <= LIM ? 1 : 2);
    } else if (i === iCt) {
      const k = String(p.cable), on = !!p.ct;
      drawCt(k, on);
      const ws = [];
      ['1.5', '4', '6'].forEach((c) => { ws.push(ctSay(c, false)); ws.push(ctSay(c, true)); });
      held(el('say'), ws, ['1.5', '4', '6'].indexOf(k) * 2 + (on ? 1 : 0));
    } else if (i === iPf) {
      const pf = pfR(p.pf);
      drawPf(pf);
      held(el('say'), [
        'At power factor 1.00 the current is in step with the voltage. The whole r drop lies along it, and none of the x drop: ' + f2(dpmOf(1)) + ' mV/A/m, just under z\'s ' + Z25.toFixed(2) + '.',
        'At power factor ' + pf.toFixed(2) + ', the r drop\'s shadow along the voltage is ' + f2(R25 * pf) + ' and the x drop\'s is ' + f2(X25 * sinOf(pf)) + '. Together that is ' + f2(dpmOf(pf)) + ' mV/A/m, about ' + underZ(pf) + '% under z\'s ' + Z25.toFixed(2) + '.',
      ], pf >= 1 ? 0 : 1);
    }

    // Picks.
    const opts = d.opts || [];
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      b.setLabel(opts[k]);
      const done = st.res === 'right' || (i === 0 && st.res === 'wrong');
      b.el.classList.toggle('is-right', done && opts[k] === d.want);
      b.el.classList.toggle('is-wrong', st.res === 'wrong' && opts[k] === st.pick);
      b.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });

    // The worked example's lines.
    wlines.forEach((w, k) => { w.hidden = k >= lines; });
    cutNote.hidden = lines < 2;
    nextLine.el.hidden = lines >= wlines.length;
    if (i === iWk) el('workedgo').hidden = lines >= wlines.length;

    // Check and Why?
    const typed = !!ANS[i], typedDone = typed && (st.res === 'right' || st.shown);
    checkBtn.el.hidden = !typed || typedDone;
    whyBtn.el.hidden = i !== iChk || !st.pick;
    whyBtn.setLabel(st.why ? 'Hide why' : 'Why?');
    el('acts').hidden = checkBtn.el.hidden && whyBtn.el.hidden;
    paintFb(st.fb);
    const why = el('why');
    why.hidden = i !== iChk || !st.why;
    write(why, i === iChk ? d.why : '');
    el('ctFold').hidden = !(i === iA && (S[iA].res === 'right' || S[iA].shown));
    el('go').hidden = !(i === 0 && st.res === 'right');

    el('donefb').textContent = finished && i === iK ? 'Lesson finished. Back is there whenever you want another look.' : '';
    el('donefb').hidden = !el('donefb').textContent;
    el('foot').textContent = i === iA ? 'Set out like a City & Guilds 2396 Section A question, on the showroom motor.' : '';
    el('foot').hidden = !el('foot').textContent;

    backBtn.el.hidden = i === 0;
    nextBtn.el.hidden = i === iK || !canGo(i) || (i === 0 && st.res === 'right');
    el('nav').hidden = backBtn.el.hidden && nextBtn.el.hidden;
  });

  // ---------- known answers, worked out by hand ----------
  const near = (a, b) => K.near(a, b, 1e-9);
  K.check('The heater circuit drops 5.71, 6.19, 8.09 and 11.42 V at 60, 65, 85 and 120 m; with the submain the totals at 60, 65 and 85 m are 11.48, 11.96 and 13.86 V, as the case file works them', () =>
    near(K.at({ len: 60 }).vdc, 5.71) && near(K.at({ len: 60 }).tot, F('l5.path.60').value) && near(K.at({ len: 65 }).vdc, 6.19) &&
    near(K.at({ len: 65 }).tot, F('l5.path.65').value) && near(K.at({ len: 85 }).vdc, fW6.value) && near(K.at({ len: 85 }).tot, 13.86) &&
    near(K.at({ len: 120 }).vdc, F('l5.path.120').value));
  K.check('The total rises with every 5 m and passes the 11.50 V limit between 60 and 65 m (60.1 m); the heater circuit alone stays inside it to 120 m', () => {
    for (let L = 0; L < 120; L += 5) if (!(K.at({ len: L + 5 }).tot > K.at({ len: L }).tot)) return false;
    const most = Math.floor(r2(LIM - SUB) * 1000 / r2(MV6 * IBH) * 10) / 10;
    return K.at({ len: 60 }).tot <= LIM && K.at({ len: 65 }).tot > LIM && K.at({ len: 120 }).vdc <= LIM && near(most, F('l5.path.max').value);
  });
  K.check('The limit applies from the origin of the installation to the most distant point of the circuit: the heater\'s total is the submain\'s drop plus its own', () =>
    [0, 30, 85, 120].every((L) => near(K.at({ len: L }).tot, r2(SUB + K.at({ len: L }).vdc))),
  { source: 'https://www.totalskills.co.uk/guides/volt-drop-calculations' });
  K.check('The submain\'s 10 V ÷ √3 is 5.77 V, leaving 224.23 V at the board and 216.14 V at the heater at 85 m; 5% of 230 V and of 400 V are 11.50 and 20.00 V', () =>
    near(SUB, F('l5.worked.root3').value) && near(VB, F('l5.path.board').value) && near(r2(UN1 - totOf(85)), 216.14) && near(LIM, F('l5.limits').value) && near(LIM3, 20));
  K.check('At 0 m the heater sits at the board, and at 120 m it stays inside the drawing', () => near(hxOf(0) - 7, BX1) && hxOf(120) + 7 <= 338);
  K.check('Ct = (230 + tp − (Ca² Cg² − Ib²/It²)(tp − 30)) ÷ (230 + tp): a cable at full load with no other factors gets no correction', () =>
    near(ctOf(20, 20, 1, 1, 70).frac, 1) && near(ctOf(20, 20, 1, 1, 90).frac, 1),
  { source: 'https://myelectrical.com/notes/entryid/182/cable-sizing-tool' });
  K.check('The slides\' heater with Ct: 1.5 mm² 0.9562 and 30.85 V, 4.0 mm² 0.9043 and 10.97 V, 6.0 mm² 0.8957 and 7.28 V, as the case file works them', () =>
    near(r4(CAH * CAH), 0.8836) && near(C15.c.frac, 0.9562) && C15.c.ct === 0.96 && near(C15.dct, fCt15.value) && near(C4.c.q, 0.1661) && near(C4.c.frac, 0.9043) &&
    near(C4.dct, fCt4.value) && near(C6.c.frac, 0.8957) && near(C6.dct, fCt6.value) &&
    near(K.at({ cable: '4', ct: true }).vd, fCt4.value) && near(K.at({ cable: '4', ct: false }).vd, fW4.value) && K.at({ cable: '6', ct: true }).ct === '0.90');
  K.check('Ct takes 4.0 mm² from over 11.50 V to under it, while 1.5 mm² still fails and 6.0 mm² passes without it', () =>
    K.at({ cable: '4', ct: false }).vd > LIM && K.at({ cable: '4', ct: true }).vd <= LIM && K.at({ cable: '1.5', ct: true }).vd > LIM && K.at({ cable: '6', ct: false }).vd <= LIM);
  K.check('With a known power factor the drop per amp per metre is r × cos φ + x × sin φ', () =>
    near(K.at({ pf: 0.8 }).dpm, fPf.value) && near(K.at({ pf: 0.8 }).sinphi, 0.6) && near(K.at({ pf: 1 }).dpm, 1.6) && near(K.at({ pf: 0.5 }).dpm, 1.03) && near(K.at({ pf: 0.5 }).sinphi, 0.87),
  { source: 'https://ecalpro.com/docs/voltage-drop-calculation-guide' });
  K.check('At every power factor the drop per amp per metre stays under z, 1.65: about 13% under it at 0.8', () => {
    for (let k = 50; k <= 100; k += 5) if (!(K.at({ pf: k / 100 }).dpm < Z25)) return false;
    return underZ(0.8) === 13 && /1\.60/.test(F('g.rx25').text) && /0\.27/.test(F('g.rx25').text) && /1\.65/.test(F('g.rx25').text);
  });
  K.check('The drawn tip of z casts a shadow along the voltage of r × cos φ + x × sin φ', () =>
    [0.5, 0.8, 1].every((pf) => { const g = geo(pf); return K.near((g.B.x - PO.x) / PS, R25 * pf + X25 * Math.sqrt(1 - pf * pf), 1e-9) && K.near(g.B.y, PO.y + PS * (R25 * g.s - X25 * g.c), 1e-9); }));
  K.check('The worked example: 13.04 A, 32.14 V, at most 10.37 mV/A/m, 12.19 V and 8.09 V, as the case file works them', () =>
    near(IBH, 13.04) && near(C15.drop, fW85.value) && near(MAXMV, fWmax.value) && near(C4.drop, fW4.value) && near(C6.drop, fW6.value) && MV4 > MAXMV && MV6 <= MAXMV);
  K.check('The recall and the check: 19.8 V against 19.75 V; 16.20 V, and the slip 12.40 V, as the case file works them', () =>
    near(RC_T, 19.8) && near(r2(RC.u * 0.05), fR.value) && RC_T > fR.value && near(r2(CK.c + CK.s), fC.value) && near(r2(CK.c + r2(CK.s / RT3)), fC1.value) && fC.value <= LIM3 && fC.value > LIM);
  K.check('Part (g) from the rule: 4.00 + 4.21 + 1.24 = 9.45 V (2.36%); the other reading 10.36 V; slips 5.45, 8.21 and 7.76 V; with Ct 3.96 + 1.19, 9.15 V', () => {
    const db = vdOf(MV25, f1a.value, RUN), leg = vdOf(MV15, f1b.value, LEG), tot = r2(SUBD + db + leg);
    return near(db, fDb.value) && near(leg, fLeg.value) && near(tot, f1g.value) && near(r2(tot / UN3 * 100), fPct.value) &&
      near(r2(SUBD + db + LEG_ALT), fAlt.value) && near(vdOf(MV15, f1a.value, LEG), LEG_ALT) &&
      near(r2(db + leg), F('l5.A.1g.slip1').value) && near(r2(SUBD + db), F('l5.A.1g.slip2').value) && near(r2(r2(SUBD / RT3) + db + leg), F('l5.A.1g.slip3').value) &&
      ctDb.ct === 0.94 && ctLeg.ct === 0.96 && near(r2(SUBD + DB_CT + LEG_CT), fCtG.value) && tot <= LIM3;
  });
  K.check('Changed numbers: 8.93 + 4.33 = 13.26 V (13.27 V with √3 as 1.73); slips 16.43, 21.92 and 8.93 V', () =>
    near(CH_C, F('l5.A.changed.slip3').value) && near(r2(CH_S + CH_C), fCh.value) && near(SPEC[iCh].accept[0], 13.27) &&
    near(r2(CH.sub + CH_C), F('l5.A.changed.slip1').value) && near(r2(r2(CH.sub * RT3) + CH_C), F('l5.A.changed.slip2').value) && CH_C <= LIM && r2(CH_S + CH_C) > LIM);
  K.check('Every slip lies outside its answer\'s accepted range', () => Object.keys(SPEC).every((k) => {
    const sp = SPEC[k];
    return sp.slips.every((s) => Math.abs(s.value - sp.fig.value) > 0.01 && sp.accept.every((x) => Math.abs(s.value - x) > 0.01));
  }));

  K.ready();
</script>
