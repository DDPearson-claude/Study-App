<title>Design sheet: immersion heater</title>
<!-- Mockup for docs/courses/electrical/design-and-verification/format/design.md. The design sheet mid-job: his own circuit, one row open with its table prompt, rule and working. Change the length or the CSA and every row below re-works.
     Self-contained: no external files. Styled with the app's D4 tokens (app/src/css/80-d4.css). -->
<style>
/* D4 "Claude's notes" tokens and components, copied from app/src/css/00-tokens.css, 10-base.css,
   50-lesson.css and 80-d4.css (light mode). Self-contained: the font stacks fall back to system
   fonts when Barlow is not installed. */
:root {
  --bg: #FAFAF8; --surface: #FFFFFF; --sunk: #F2F3F4; --ink: #1D1F22; --muted: #5F6670;
  --heading: #1D1F22; --teal: #0B6A70; --teal-tint: #E1F1F1; --amber: #FFF3D1; --hl: #F8DC8A;
  --red: #9F3038; --red-tint: #F8ECEC; --green: #2E7D4F; --green-tint: #E5F1E9;
  --line: #E1E4E7; --line-strong: #A9AFB6; --on-heading: #FFFFFF;
  --shadow: 0 1px 2px rgba(29, 31, 34, .05), 0 6px 18px rgba(29, 31, 34, .08);
  --edge: #1D1F22; --dot: #D9D9D4; --due: #EBA81E; --due-ink: #8F6200; --due-tint: #FBEFD2;
  --step: #B8647A; --pin: #E7D5DB;
  --sans: "Barlow", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --cond: "Barlow Semi Condensed", "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r-sm: 10px; --r: 14px; --r-lg: 16px;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; color: var(--ink); font: 400 16px/1.55 var(--sans); -webkit-font-smoothing: antialiased;
  background-color: var(--bg);
  background-image: radial-gradient(var(--dot) 1px, transparent 1.3px); background-size: 16px 16px;
}
h1, h2, h3 { margin: 0; color: var(--heading); line-height: 1.22; letter-spacing: -.01em; text-wrap: balance; }
h1 { font-size: 28px; font-weight: 700; }
h2 { font-size: 20px; font-weight: 700; }
h3 { font-size: 17px; font-weight: 700; }
p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }
.visually-hidden { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* page column */
.view { max-width: 720px; margin: 0 auto; padding: 0 16px 120px; }

/* the focus bar: outlined back button, where you are in mono, Aa */
.fbar {
  position: sticky; top: 0; z-index: 10; display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; gap: 12px;
  min-height: 60px; margin: 0 -16px; padding: 8px 16px; background: var(--bg); border-bottom: 1px solid var(--line);
}
.ibtn {
  display: inline-grid; place-items: center; width: 44px; height: 44px; border: 2px solid var(--edge); border-radius: 12px;
  background: var(--surface); color: var(--ink); text-decoration: none; font: 600 17px/1 var(--sans); cursor: pointer;
}
.ibtn svg { width: 22px; height: 22px; }
.crumb { min-width: 0; font: 500 13px/1.3 var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumb b { font-weight: 500; color: var(--ink); }

/* type helpers */
.eyebrow { font: 600 12.5px/1.4 var(--cond); letter-spacing: .09em; text-transform: uppercase; color: var(--teal); }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.mono { font-family: var(--mono); }
mark.term {
  color: inherit; font-weight: 600; padding: 0 .12em; margin: 0 -.04em; border-radius: 3px;
  background: linear-gradient(180deg, transparent 50%, var(--hl) 50%, var(--hl) 92%, transparent 92%);
}
.cite { font: 600 12px/1 var(--cond); letter-spacing: .02em; color: var(--teal); background: var(--teal-tint); border-radius: 4px; padding: 3px 5px; white-space: nowrap; }

/* surfaces */
.card { background: var(--surface); border: 2px solid var(--edge); border-radius: var(--r-lg); padding: 16px; }
.panel { background: var(--sunk); border-radius: 8px; padding: 12px 14px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.stack-sm { display: flex; flex-direction: column; gap: 8px; }

/* buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 12px 20px;
  border: 0; border-radius: 14px; background: var(--ink); color: var(--on-heading); font: 700 16px/1.2 var(--sans);
  text-decoration: none; text-align: center; cursor: pointer;
}
.btn.secondary { background: var(--surface); color: var(--ink); border: 2px solid var(--edge); }
.btn.wide { width: 100%; }
.btn svg { width: 20px; height: 20px; flex: none; }
.linkish { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0; border: 0; background: none; color: var(--ink);
  font: 700 15px/1.3 var(--sans); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.chip { display: inline-flex; align-items: center; min-height: 44px; padding: 8px 14px; border-radius: 999px; border: 1.5px solid var(--edge);
  background: var(--surface); color: var(--ink); font: 600 14px/1.3 var(--sans); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.seg { display: inline-flex; gap: 4px; padding: 4px; border-radius: 12px; background: var(--sunk); }
.seg button { min-height: 40px; padding: 6px 14px; border: 0; border-radius: 9px; background: none; color: var(--ink); font: 600 15px/1 var(--sans); cursor: pointer; }
.seg button[aria-checked="true"] { background: var(--ink); color: var(--bg); }

/* Claude's notes */
.note-by { display: flex; align-items: center; gap: 8px; min-height: 26px; }
.note-av { flex: none; display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--edge); background: var(--pin); }
.note-av svg { width: 14px; height: 14px; }
.note-av.is-app { background: var(--surface); }
.note-name { font: 600 14px/1.3 var(--sans); color: var(--muted); }
.note-ctx { font: 500 13px/1.3 var(--cond); color: var(--muted); }

/* marks: ink tick (a check met), red cross (fails), amber dot (needs your value), green (finished only) */
.mk { flex: none; display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; }
.mk svg { width: 15px; height: 15px; }
.mk.ok { border: 2px solid var(--ink); color: var(--ink); }
.mk.fail { background: var(--red); color: #fff; }
.mk.need { background: var(--due-tint); border: 2px solid var(--due); }
.mk.need::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--due-ink); }
.mk.hold { border: 2px dashed var(--line-strong); }
.mk.val { border: 2px solid transparent; }
.mk.done { background: var(--green); color: #fff; }

</style>
</head>
<body>
<style>
/* The design sheet */
.sheet-view { padding-bottom: 104px; }
.sv-grid { display: block; }
.sv-rail, .sv-detail { display: none; }
.sv-head { display: flex; flex-direction: column; gap: 4px; padding: 18px 0 12px; }
.sv-head h1 { font-size: 26px; }
.sv-sub { font: 500 13px/1.4 var(--mono); color: var(--muted); }
.sv-keys { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.key { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-height: 56px; padding: 8px 12px; text-align: left;
  border: 1.5px solid var(--line-strong); border-radius: 12px; background: var(--surface); cursor: pointer; }
.key-l { font: 600 12px/1.3 var(--cond); letter-spacing: .06em; text-transform: uppercase; color: var(--teal); }
.key-l em { font-style: normal; color: var(--ink); background: var(--teal-tint); border-radius: 4px; padding: 0 4px; letter-spacing: .02em; text-transform: none; }
.key-v { font: 600 15px/1.3 var(--sans); color: var(--ink); }
.key.is-changed { border: 2px solid var(--edge); }
.sv-status { display: flex; flex-direction: column; gap: 6px; margin: 14px 0 10px; }
.sv-status p { font: 500 14px/1.4 var(--sans); color: var(--muted); }
.sv-status .red { color: var(--red); font-weight: 700; }
.segs { display: flex; gap: 4px; }
.segs i { flex: 1; height: 7px; border-radius: 4px; background: var(--sunk); }
.segs .seg-ok { background: var(--ink); }
.segs .seg-fail { background: var(--red); }
.segs .seg-need { background: var(--due); }
.segs .seg-hold { background: none; box-shadow: inset 0 0 0 1.5px var(--line-strong); }

.sv-rows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.sr { border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); scroll-margin-top: 70px; }
.sr.is-open { border: 2px solid var(--edge); }
.sr.is-fail { border: 2px solid var(--red); }
.sr.is-need { border-left: 6px solid var(--due); }
.sr.is-hold { background: transparent; border-style: dashed; border-color: var(--line-strong); }
.sr-head { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto 26px; align-items: center; gap: 8px; width: 100%; min-height: 54px;
  padding: 6px 10px 6px 6px; border: 0; background: none; text-align: left; cursor: pointer; border-radius: 12px; }
.sr-n { display: inline-grid; place-items: center; min-width: 40px; height: 28px; padding: 0 4px; border-radius: 7px; background: var(--sunk);
  font: 500 12px/1 var(--mono); color: var(--ink); white-space: nowrap; }
.sr-name { font: 600 16px/1.25 var(--sans); color: var(--ink); }
.sr-sym { font: 500 13px/1 var(--mono); color: var(--muted); }
.sr-val { font: 600 15px/1.2 var(--mono); color: var(--ink); white-space: nowrap; }
.sr.is-hold .sr-name, .sr.is-hold .sr-val { color: var(--muted); }
.sr.is-fail .sr-val { color: var(--red); }
.sr-body { display: flex; flex-direction: column; gap: 12px; padding: 4px 14px 14px; }
.sr-where { margin-top: -2px; }
.sr-in { display: flex; flex-direction: column; gap: 0; margin: 0; border-top: 1px solid var(--line); }
.sr-in > div { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 40px; border-bottom: 1px solid var(--line); }
.sr-in dt { font-size: 14px; color: var(--muted); }
.sr-in dd { margin: 0; font: 600 14.5px/1.3 var(--sans); text-align: right; }
.needv { color: var(--due-ink); font-weight: 600; }
.edit { display: inline-flex; align-items: center; gap: 6px; }
.edit input { width: 76px; min-height: 44px; padding: 6px 10px; border: 2px solid var(--edge); border-radius: 10px; font: 600 16px/1 var(--mono); text-align: right; background: var(--surface); }
.tv { display: flex; flex-direction: column; gap: 6px; padding: 12px; border-radius: 10px; background: var(--sunk); }
.tv.is-need { background: var(--due-tint); box-shadow: inset 0 0 0 1.5px var(--due); }
.tv-src { color: var(--teal); }
.tv.is-need .tv-src { color: var(--due-ink); }
.tv-where { font-size: 14.5px; line-height: 1.4; }
.tv-what { display: flex; flex-direction: column; gap: 6px; font: 600 14px/1.3 var(--sans); }
.tv-in { display: flex; align-items: center; gap: 8px; }
.tv-in input { width: 120px; min-height: 48px; padding: 8px 12px; border: 2px solid var(--edge); border-radius: 12px; background: var(--surface); font: 600 18px/1 var(--mono); }
.tv-in input::placeholder { font: 500 15px/1 var(--sans); color: var(--muted); }
.tv-in span { font: 600 15px/1 var(--mono); color: var(--muted); }
.tv-note { font-size: 13px; color: var(--muted); }
.sr-pick { display: flex; flex-direction: column; gap: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.sr-pick .chip { min-width: 52px; justify-content: center; font-family: var(--mono); font-weight: 500; }
.sr-rule, .sr-work { display: flex; flex-direction: column; gap: 4px; }
.sr-rule p { font: 600 15px/1.45 var(--sans); }
.sr-work { padding: 10px 12px; border-radius: 8px; background: var(--sunk); }
.sr-work p { font: 500 14px/1.5 var(--mono); overflow-wrap: anywhere; }
.sr-verdict { display: flex; align-items: center; gap: 8px; font: 700 16px/1.3 var(--sans); }
.sr-verdict.is-fail { color: var(--red); }
.sr-why { font-size: 15px; line-height: 1.45; }
.sr-links { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 12px; }
.sr-links .linkish svg { width: 18px; height: 18px; }
.loop { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 10px; background: var(--red-tint); }
.loop-svg { width: 100%; height: auto; }
.loop-svg text { font: 600 12.5px/1 var(--sans); fill: var(--ink); }
.loop-svg text.b { font-size: 12px; }
.loop-svg text.r { fill: var(--red); font-size: 13px; font-weight: 700; }
.loop-text { font-size: 15px; color: var(--red); }
.loop-help { font-size: 14.5px; line-height: 1.45; }
.loop .chip { font-size: 14px; }
.sv-honest { margin-top: 18px; font-size: 13px; line-height: 1.45; color: var(--muted); }
.sv-bar { position: fixed; left: 10px; right: 10px; bottom: 10px; z-index: 12; display: grid; grid-template-columns: 52px minmax(0, 1fr) 52px auto; align-items: center; gap: 6px;
  padding: 5px; border: 2px solid var(--edge); border-radius: 18px; background: var(--surface); box-shadow: var(--shadow); }
.bar-btn { display: grid; place-items: center; width: 52px; height: 52px; border: 0; border-radius: 13px; background: var(--sunk); color: var(--ink); cursor: pointer; }
.bar-btn svg { width: 24px; height: 24px; }
.bar-mid { display: flex; flex-direction: column; align-items: center; min-width: 0; }
.bar-where { font: 500 12px/1.3 var(--mono); color: var(--muted); }
.bar-name { font: 700 15px/1.3 var(--sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.bar-sum { display: inline-grid; place-items: center; height: 52px; padding: 0 14px; border-radius: 13px; background: var(--ink); color: var(--on-heading); font: 700 15px/1 var(--sans); text-decoration: none; }

/* laptop: the rail, the rows, the open row beside them */
@media (min-width: 1000px) {
  .sheet-view { max-width: 1240px; padding-bottom: 40px; }
  .sv-grid { display: grid; grid-template-columns: 262px minmax(0, 1fr) 420px; gap: 24px; align-items: start; }
  .sv-rail { display: block; position: sticky; top: 76px; padding-top: 18px; }
  .sv-rail .eyebrow { margin-bottom: 8px; }
  .rail-svg { width: 256px; height: auto; display: block; }
  .rail-svg .rn { cursor: pointer; }
  .rail-svg .rn-n { font: 500 11px/1 var(--mono); fill: var(--muted); }
  .rail-svg .rn-t { font: 600 13px/1 var(--sans); fill: var(--ink); }
  .rail-svg .rn-t.is-hold { fill: var(--muted); }
  .rail-svg .arc { fill: none; stroke-width: 2; }
  .rail-svg .arc.is-red { stroke: var(--red); stroke-width: 2.4; }
  .rail-svg .arc.is-quiet { stroke: var(--line-strong); }
  .rail-svg .arc.is-added { stroke: var(--line-strong); stroke-dasharray: 4 3; }
  .rail-svg .is-red-head { fill: var(--red); } .rail-svg .is-quiet-head, .rail-svg .is-added-head { fill: var(--line-strong); }
  .rail-svg .arcl { font: 600 10px/1 var(--cond); fill: var(--muted); letter-spacing: .04em; }
  .rail-svg .arcl.is-red { fill: var(--red); }
  .rail-key { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; font: 500 12px/1.3 var(--cond); color: var(--muted); }
  .rail-key i { display: inline-block; width: 16px; height: 0; margin-right: 5px; vertical-align: middle; border-top: 2px solid var(--line-strong); }
  .rail-key .k-red { border-color: var(--red); } .rail-key .k-a { border-top-style: dashed; }
  .sv-rows .sr-body { display: none; }
  .sr.is-open { background: var(--surface); box-shadow: inset 5px 0 0 var(--ink); }
  .sv-detail { display: block; position: sticky; top: 76px; margin-top: 18px; padding: 16px 18px 6px; border: 2px solid var(--edge); border-radius: var(--r-lg); background: var(--surface); max-height: calc(100vh - 96px); overflow: auto; }
  .sd-head { display: grid; grid-template-columns: auto minmax(0, 1fr) 26px; align-items: center; gap: 10px; padding-bottom: 6px; }
  .sd-head h2 { font-size: 21px; }
  .sv-detail .sr-body { padding: 4px 0 12px; }
  .sv-bar { display: none; }
}

.stepper { display: grid; grid-template-columns: 52px minmax(0, 1fr) 52px; align-items: center; gap: 8px; }
.st-btn { width: 52px; height: 52px; border: 2px solid var(--edge); border-radius: 13px; background: var(--surface); font: 600 26px/1 var(--sans); color: var(--ink); cursor: pointer; }
.st-btn[disabled] { border-color: var(--line); color: var(--line-strong); }
.st-val { text-align: center; font: 600 20px/1 var(--mono); }

.sv-note { font-size: 13px; color: var(--muted); }
</style>

<script>
/* The design sheet, mockup engine. Each row is worked from the figures shown in the rows above it
   (rounded as shown), so every working line can be checked by hand on a calculator.
   Table values are never built in: each one is a value Dan types from his own copy. In this mockup
   the "typed" values are the figures printed in his course slides, cited by page. */
var DV = (function () {
  function rd(x, d) { var p = Math.pow(10, d); return Math.round(x * p + 1e-9) / p; }
  function f(x, d) { return rd(x, d).toFixed(d); }
  function n(x) { return String(x); }
  var SIZES = [1, 1.5, 2.5, 4, 6, 10, 16];
  function sz(x) { return x >= 10 ? String(x) : x.toFixed(1); }

  function compute(J) {
    var rows = [], waitFrom = null, needFrom = null;
    function push(r) { rows.push(r); return r; }
    function tv(spec) { spec.kind = 'table'; return spec; }

    // 1 Design current
    var Ib = rd(J.P / (J.U0 * J.pf * J.eff), 2);
    push({ id: 'ib', n: '1', where: 'Flowchart step 1', name: 'Design current', short: 'Design current', sym: 'Ib', value: f(Ib, 2) + ' A', state: 'val',
      inputs: [{ label: 'Load (output)', v: J.P + ' W' }, { label: 'Voltage at the board', v: J.U0 + ' V' }, { label: 'Power factor', v: n(J.pf) }, { label: 'Efficiency', v: n(J.eff) }],
      rule: 'Ib = P ÷ (U × eff × pf)', work: [J.P + ' ÷ (' + J.U0 + ' × ' + J.eff + ' × ' + J.pf + ') = ' + f(Ib, 2) + ' A'],
      cite: 'slides p.12', why: 'The cable carries what the load draws from the supply, so Ib follows the input, not the output.' });

    // 2 Device
    var okIn = Ib <= J.In;
    push({ id: 'in', n: '2', where: 'Flowchart step 2', name: 'Protective device', sym: 'In', value: J.In + ' A', state: okIn ? 'ok' : 'fail', check: true,
      inputs: [{ label: 'Device', v: J.dev }, { label: 'Rating In', v: J.In + ' A' }],
      rule: 'Ib ≤ In', work: [f(Ib, 2) + ' A ≤ ' + J.In + ' A'], verdict: okIn ? 'Met' : 'Fails: choose a larger In',
      cite: 'Reg 433.1.1, slides p.22', why: 'The device must carry the normal load without opening.' });

    // 3-4 Rating factors
    var prod = J.Ca * J.Cg * J.Ci, It = rd(J.In / prod, 2);
    push({ id: 'ct', n: '3–4', where: 'Flowchart steps 3–4', name: 'Rating factors', sym: 'It', value: f(It, 2) + ' A', state: 'val',
      inputs: [tv({ what: 'Ca, ambient ' + J.amb + ' °C', table: 'Table 4B1', col: '70 °C thermoplastic', row: J.amb + ' °C row', v: J.Ca, cite: 'slides p.26' }),
        { label: 'Cg, grouping', v: J.Cg + ' (no other circuits)' }, { label: 'Ci, insulation', v: J.Ci + ' (none on the run)' }],
      rule: 'It ≥ In ÷ (Ca × Cg × Ci), only the factors that act together', work: [J.In + ' ÷ (' + J.Ca + ' × ' + J.Cg + ' × ' + J.Ci + ') = ' + f(It, 2) + ' A'],
      cite: 'slides p.25', why: 'Each factor is heat the table did not allow for, so it raises the rating you need.' });

    // 5 Reference method
    push({ id: 'rm', n: '5', where: 'Flowchart step 5', name: 'Reference method', sym: '', value: J.method, state: 'val',
      inputs: [{ label: 'Installed', v: J.install }, { label: 'Method', v: 'Reference Method ' + J.method + ' (Table 4A2)' }],
      rule: 'Design to the method with the lowest rating anywhere on the run', work: ['One method along the whole run: ' + J.method],
      cite: 'slides p.23, 28', why: 'The cable is only as good as its hottest stretch.' });

    // 6 Conductor
    var itab = J.itab[J.csa], cond = push({ id: 'cs', n: '6', where: 'Flowchart step 6', name: 'Conductor', sym: 'Iz', value: sz(J.csa) + ' mm²', check: true, csaPick: true,
      inputs: [tv({ what: 'Current-carrying capacity It(tab)', table: 'Table 4D1A', col: 'Reference Method ' + J.method + ', 2 cables single-phase', row: sz(J.csa) + ' mm² row', v: itab, unit: 'A', cite: itab != null ? J.itabCite[J.csa] : '' })],
      rule: 'It(tab) ≥ It, then Iz = It(tab) × factors ≥ In', cite: 'flowchart step 6', why: 'Pick the smallest cable whose rating covers It.' });

      Iz = rd(itab * prod, 2);

      rule: 'I2 ≤ 1.45 × Iz, with I2 = 1.45 × In for most devices', cite: 'slides p.30, 32',

    if (Iz == null) { ovl.state = 'hold'; ovl.value = '–'; ovl.work = ['Waits for step 6']; }
    else {
      var I2 = rd(1.45 * J.In, 2), lim = rd(1.45 * Iz, 2), okO = I2 <= lim;

        '<text x="14" y="' + (y + 19.5) + '" class="rn-n">' + r.n + '</text><text x="58" y="' + (y + 19.5) + '" class="rn-t' + (r.state === 'hold' ? ' is-hold' : '') + '">' + esc(r.short || r.name) + '</text>' +
        (r.state === 'ok' ? '<path d="M174 ' + (y + 15) + ' l3.5 3.5 6.5-7" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>' : '') +
        (r.state === 'fail' ? '<path d="M175 ' + (y + 10) + ' l9 9 m0 -9 l-9 9" stroke="var(--red)" stroke-width="2.4" stroke-linecap="round"/>' : '') +
        '</g>';
      if (i < rows.length - 1) out += '<path d="M40 ' + (y + 30) + ' V' + (y + gap) + '" stroke="var(--line-strong)" stroke-width="1.5"/>';
    });
    var vdFail = s.rows[idx.vd].state === 'fail';
    out += arc('vd', 'cs', 222, vdFail ? 'is-red' : 'is-quiet', 'step 8 → 6');
    out += arc('ad', 'cp', 236, 'is-quiet', 'step 20 → 9');
    out += arc('zs', 'cp', 210, 'is-added', '');
    return '<svg class="rail-svg" viewBox="0 0 256 ' + h + '" role="img" aria-label="Your flowchart, step by step, with its loops">' +
      '<defs>' + ['is-red', 'is-quiet', 'is-added'].map(function (c) { return '<marker id="ra-' + c + '" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 8 4 0 8Z" class="' + c + '-head"/></marker>'; }).join('') + '</defs>' + out + '</svg>';
  }
  function render() {
    var s = DV.compute(J), rows = s.rows;
    var segs = rows.filter(function (r) { return r.check; }).map(function (r) { return '<i class="seg-' + r.state + '"></i>'; }).join('');
    var bits = [s.met + ' of ' + s.total + ' checks met'];
    if (s.fails) bits.push('<b class="red">' + s.fails + ' fails</b>');
    if (s.waiting) bits.push(s.waiting + ' waiting' + (s.rows.some(function (r) { return r.state === 'need'; }) ? ' for your values' : ''));
    var h = '';
    h += '<div class="sv-grid"><aside class="sv-rail"><p class="eyebrow">Your flowchart</p>' + railSvg(s) +
      '<p class="rail-key"><span><i class="k-red"></i>loop in use</span><span><i class="k-q"></i>flowchart loop</span><span><i class="k-a"></i>added loop</span></p></aside>';
    h += '<main class="sv-main">';
    h += '<div class="sv-head"><p class="eyebrow">' + esc(C.eyebrow) + '</p><h1>' + esc(C.title) + '</h1><p class="sv-sub">' + esc(C.sub) + '</p></div>';
    h += '<div class="sv-keys">' + C.keys(J).map(function (k) { return '<button class="key' + (k.changed ? ' is-changed' : '') + '" data-open="' + k.open + '"><span class="key-l">' + esc(k.l) + (k.changed ? ' <em>changed</em>' : '') + '</span><span class="key-v">' + esc(k.v) + '</span></button>'; }).join('') + '</div>';
    h += '<div class="sv-status"><div class="segs" aria-hidden="true">' + segs + '</div><p>' + bits.join(' · ') + '</p></div>';
    h += '<ol class="sv-rows">' + rows.map(function (r) {
      var isOpen = r.id === open;
      return '<li class="sr is-' + r.state + (isOpen ? ' is-open' : '') + '" id="row-' + r.id + '"><button class="sr-head" data-open="' + r.id + '" aria-expanded="' + isOpen + '">' +
        '<span class="sr-n">' + r.n + '</span><span class="sr-name">' + esc(r.name) + (r.sym ? ' <span class="sr-sym">' + esc(r.sym) + '</span>' : '') + '</span>' +
        '<span class="sr-val">' + esc(r.value) + '</span>' + mark(r.state) + '</button>' + (isOpen ? body(r) : '') + '</li>';
    }).join('') + '</ol>';
    h += '<p class="sv-honest">Rules as taught in your course: BS 7671:2018+A2:2022. An aid to your own design, not a substitute for the regulations or your sign-off.</p>';
    h += '</main>';
    var cur = rows.filter(function (r) { return r.id === open; })[0];
    h += '<section class="sv-detail" aria-label="The open row">' + (cur ? '<div class="sd-head"><span class="sr-n">' + cur.n + '</span><h2>' + esc(cur.name) + (cur.sym ? ' <span class="sr-sym">' + esc(cur.sym) + '</span>' : '') + '</h2>' + mark(cur.state) + '</div>' + body(cur) : '') + '</section></div>';
    var i = rows.map(function (r) { return r.id; }).indexOf(open);
    h += '<nav class="sv-bar" aria-label="Rows"><button class="bar-btn" data-step="-1" aria-label="Previous row">' + ICON.back + '</button>' +
      '<span class="bar-mid"><span class="bar-where">' + (cur ? (cur.n === '+' ? 'added check' : 'step ' + cur.n) : rows.length + ' rows') + '</span><span class="bar-name">' + esc(cur ? cur.name : 'Tap a row') + '</span></span>' +
      '<button class="bar-btn" data-step="1" aria-label="Next row">' + ICON.chev + '</button><a class="bar-sum" href="site.html">Summary</a></nav>';
    root.innerHTML = h;
  }
  root.addEventListener('click', function (e) {
    var t = e.target.closest('[data-open],[data-csa],[data-step]'); if (!t) return;
    if (t.dataset.csa) { J.csa = +t.dataset.csa; J.cpc = J.csa; if (C.onCsa) C.onCsa(J); }
    else if (t.dataset.step) { var ids = DV.compute(J).rows.map(function (r) { return r.id; }); var i = ids.indexOf(open) + (+t.dataset.step); if (i >= 0 && i < ids.length) open = ids[i]; }
    else open = open === t.dataset.open && !window.matchMedia('(min-width: 1000px)').matches ? null : t.dataset.open;
    render();
  });
  root.addEventListener('change', function (e) { if (e.target.dataset.edit === 'L') { J.L = +e.target.value || J.L; render(); } });
  window.sheetSet = function (k, v) { J[k] = v; if (k === 'csa') J.cpc = v; render(); };
  window.sheetOpen = function (id) { open = id; render(); };
  render();
})();

</script>
</body>
</html>
