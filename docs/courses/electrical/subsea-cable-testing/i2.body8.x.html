<style>
  [hidden] { display: none !important; }
  .pz, .caption { max-width: 30rem; margin-inline: auto; }
  .pz > * + *, #stepbox > * + * { margin-top: 14px; }
  #prog .k-label, #prog .k-stepper-nav { display: none; }

  .task { font-size: 1.2rem; font-weight: 700; line-height: 1.45; }
  .task.show { font-size: 1.06rem; font-weight: 400; line-height: 1.6; }
  .task > p + p, .why > p + p, .assume > p + p, .pre > p + p { margin-top: 10px; }
  .sub { font-size: .95rem; color: var(--k-muted); line-height: 1.5; }

  .scene .core { stroke: var(--k-strong); stroke-width: 5; stroke-linecap: round; }

  .scene .plead { stroke: var(--k-muted); stroke-width: 2; fill: none; }

  .scene .clamp { fill: var(--k-strong); }

  .scene .node { fill: var(--k-bg); stroke: var(--k-strong); stroke-width: 1.5; }
  .scene .brk { stroke: var(--k-amber-line); stroke-width: 2.5; fill: none; }
  .scene .chev { stroke: var(--k-bg); stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .scene .lc { stroke: var(--k-strong); stroke-width: 2.5; fill: none; stroke-linejoin: round; }
  .scene .lit .lc { stroke: var(--k-accent2); stroke-width: 5; }
  .scene .dim .lc { stroke: var(--k-muted); stroke-width: 2; }
  .scene .le { stroke: var(--k-strong); stroke-width: 2; fill: none; }
  .scene .dim .le { stroke: var(--k-muted); }
  .scene .tdot { fill: var(--k-accent2); }
  .scene .dim .tdot { fill: var(--k-muted); }
  .scene .band { fill: var(--k-fill3); }
  .scene .bar1 { fill: var(--k-sunk); stroke: var(--k-strong); stroke-width: 1.5; }
  .scene .bar2 { fill: var(--k-fill1); stroke: var(--k-accent2); stroke-width: 1.5; }
  .scene .bar2.out { stroke: var(--k-warn); stroke-width: 2.5; }
  .scene .tube { fill: var(--k-panel); stroke: var(--k-strong); stroke-width: 1.5; }
  .scene .merc { fill: var(--k-accent2); }
  .scene .axis { stroke: var(--k-strong); stroke-width: 1.5; fill: none; }
  .forms { padding: 10px 12px; border-radius: 10px; background: var(--k-panel); border: 1px solid var(--k-line); }
  .forms p { font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.6; }
  .forms .lt { padding: 0 3px; border-radius: 4px; }
  .forms .lt.on { background: var(--k-hl); font-weight: 800; }
  .corr { font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.5; }
  .wl { padding: 10px 12px; border-radius: 10px; background: var(--k-panel); border: 1px solid var(--k-line); line-height: 1.5; }
  .wl .line + .line, .wl .line + .sub, .wl .sub + .sub { margin-top: 10px; }
  .w { font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.5; }
  .picks { display: flex; flex-direction: column; gap: 10px; }
  .picks .k-btn { width: 100%; min-height: 56px; height: auto; font-size: 1.02rem; line-height: 1.35; white-space: normal; text-align: left; justify-content: flex-start; padding: 10px 14px; }
  .picks .k-btn.is-right { border-color: var(--k-good); color: var(--k-good); box-shadow: inset 0 0 0 1px var(--k-good); }
  .picks .k-btn.is-wrong { border-color: var(--k-warn); color: var(--k-warn); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  .row .k-btn { flex: 1 1 9rem; min-height: 48px; }
  .fb { padding: 12px 14px; border-radius: 12px; background: var(--k-panel); border: 1.5px solid var(--k-line); line-height: 1.5; }
  .fb.ok { box-shadow: inset 4px 0 0 var(--k-good); }
  .fb.bad { box-shadow: inset 4px 0 0 var(--k-warn); }
  .fb > * + * { margin-top: 6px; }
  .fb .v { font-weight: 700; font-size: 1.05rem; }
  .fb.ok .v { color: var(--k-good); }
  #stepbox.enter, .wl .line.enter, .fade { animation: screen-in .35s ease-out both; }
  @keyframes screen-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  html.k-testing #stepbox.enter, html.k-testing .wl .line.enter, html.k-testing .fade { animation: none; }
  @media (prefers-reduced-motion: reduce) { #stepbox.enter, .wl .line.enter, .fade { animation: none; } }
</style>

<p class="caption" id="cap">Each line is worked from the rounded figures shown before it.</p>

<script>
  // ---------- rounding, helpers and the course's figures ----------
  const r2 = (x) => Math.round(x * 100 + 1e-7) / 100;
  const r3 = (x) => Math.round(x * 1000 + 1e-6) / 1000;
  const f2 = (x) => r2(x).toFixed(2);
  const F = (id) => K.figure(id);
  const el = (id) => document.getElementById(id);
  const NB = ' ';
  // Non-breaking spaces: before an operator, and between a number and its unit.
  const nb = (s) => String(s == null ? '' : s)
    .replace(/ ([×÷+=−]) /g, NB + '$1 ')
    .replace(/(\d) (?=(?:mΩ|°C|km|Ω|m)(?![A-Za-z]))/g, '$1' + NB);
  const vis = (e, on) => { if (on) e.removeAttribute('display'); else e.setAttribute('display', 'none'); };
  function txt(parent, x, y, s, cls, anchor) {
    const t = parent.appendChild(K.svg('text', { x: x, y: y, class: cls || 'lb', 'text-anchor': anchor || 'start' }));
    t.textContent = s;
    return t;
  }

  const fA = F('n.wexA'), fB = F('n.wexB'), fC = F('n.wexC');
  const fRec = F('l2.recall'), fS1 = F('l2.recall.slip1'), fS2 = F('l2.recall.slip2');
  const fW2 = F('l2.wex.L2'), fW3 = F('l2.wex.L3'), fWk = F('l2.wex.check'), fG1 = F('l2.wex.gap1'), fG2 = F('l2.wex.gap2');
  const fLA = F('p.loopA'), fLB = F('p.loopB'), fLC = F('p.loopC');
  const LOOP = fLA.value, LEAD = F('p.leadR').value, CONT = F('p.contactR').value;
  const fTwo = F('l2.twoWire'), fTwoP = F('l2.twoWire.pct'), fOn = F('l2.onClamps'), fOnP = F('l2.onClamps.pct');
  const LOWR = F('n.lowR').value, TOL = F('n.tol').value, fLen = F('p.len');
  const fF1 = F('p.fac1'), fF2 = F('p.fac2'), fF3 = F('p.fac3'), TEMP = F('p.temp').value, FAC1 = fF1.value;
  const fK = F('l2.k'), fCold = F('l2.cold.L1'), fColdP = F('l2.cold.pct'), fBand = F('l2.band');
  const f2a = F('2a'), f2b = F('2b'), f2c = F('2c'), fL1 = F('l2.L1'), fL3 = F('l2.L3');
  const fChg = F('l2.changed'), fChgK = F('l2.changed.check');
  const UNIT_R = f2a.unit;
  const ALPHA = 0.00393, ALPHA_ROUND = 0.004;
  // The changed-numbers cable's loops, practice values.
  const CH = { A: 120.40, B: 121.10, C: 120.90 };
  const P_SHORT = 5, P_LONG = 30;

  // The rules.
  const MEAS = ['Two wires', 'P on the C clamps', 'P inside the C clamps'];
  const mi = (v) => K.clamp(Math.round(+v || 0), 0, 2);
  const tv = (v) => { const t = Math.round(+v); return isFinite(t) ? K.clamp(t, 4, 30) : 20; };
  const meterAt = (m) => r2(LOOP + (m === 0 ? 2 * LEAD : 0) + (m <= 1 ? 2 * CONT : 0));
  const aboveAt = (m) => r2((meterAt(m) - LOOP) / LOOP * 100);
  const kAt = (t) => 1 + ALPHA * (t - 20);
  const k5 = (t) => Math.round(kAt(t) * 1e5) / 1e5;
  const readAt = (t) => r2(FAC1 * kAt(t));
  const devAt = (t) => r2(ALPHA * 100 * (t - 20));
  const L1of = (a, b, c) => (a + c - b) / 2, L2of = (a, b, c) => (b + a - c) / 2, L3of = (a, b, c) => (c + b - a) / 2;
  const contAt = (far, core) => far === core;

  // ---------- the lesson's words ----------
  const R_TASK = 'Three loop readings on one cable: L1 to L2, A = ' + fA.text + '. L2 to L3, B = ' + fB.text + '. L3 to L1, C = ' + fC.text + '. What is L1?';
  const R_WORK = 'L1 = (A + C − B) ÷ 2 = ' + fRec.work;
  const R_SLIPS = fS1.text + " comes from L2's formula, and " + fS2.text + ' is half of loop A.';
  const R_W1 = "That comes from L2's formula, (B + A − C) ÷ 2. For L1, add A and C, the two loops that hold L1, then take away B.";
  const R_W3 = 'That is half of loop A. It is right only if L1 and L2 are equal. Use all three loops.';
  const FOR_TEXT = 'Phase ID makes sure L1, L2 and L3 are identified, labelled and terminated in the right order. Core resistance proves each conductor end to end, its joints and terminations included. Corrected to 20 °C, each core should be within ' + TOL + '% of its factory value.';
  const ASSUME = 'Assume this order. Every core starts earthed at both ends, with a technician at each end. Each core is tested in turn to the screen, from both ends.\n\n'
    + 'The far end keeps one core joined to the screen. Under control, it lifts the other two earths. Your end lifts its earths and tests each core to the screen. Only the joined core reads continuity. Then the earths go back on. The two ends then swap jobs and repeat.\n\n'
    + 'The colours are red L1, yellow L2 and blue L3.';
  const WARN_FOR = 'Phases terminated in the wrong order can give a short when the cable is energised. A poor joint or termination goes unseen.';
  const PCOL = ['red', 'yellow', 'blue'];
  const PH_READ = 'With L1 joined to the screen at B01, only L1 reads continuity at the OSS. So the core marked red at one end is the core marked red at the other.';
  const WHY_TEXT = 'Low resistance usually means under ' + LOWR + ' Ω. Down there, the test leads and their contacts can add a big share of what you read.\n\n'
    + "A meter works out resistance as the voltage it sees divided by the current it sends. On two wires, the same leads do both jobs. The current runs through each lead and each contact, and each drops a little voltage. The meter adds those drops to the core's own.\n\n"
    + 'Four wires split the jobs. The C leads carry the current, but the meter does not measure across them. The meter measures the voltage on the P leads, but almost no current flows in them. So neither the P leads nor their contacts drop any voltage worth counting. The reading is whatever carries the current between the two P points.';
  const NOTE_W = 'Loop A of String B is two cores linked at B01, drawn as one resistor. The loop, lead and contact values are practice values.';
  const UNDER_W = 'P on the C clamps still reads ' + fOnP.text + ' high. That is far more than the ' + TOL + '% a core is allowed.';
  const WHY_READ = 'Two wires read ' + fTwo.text + ', ' + fTwoP.text + ' high. Both leads and both contacts carry the current inside the measured stretch. '
    + 'P probes clipped on the C clamps leave the leads out, but the contacts still add ' + fOnP.text + '. P probes inside the C clamps, facing each other, read the loop alone: ' + fLA.text + '.';
  const C_TASK = 'You measure loop A, ' + fLA.text + ', with four wires. Then you swap all four ' + P_SHORT + ' m leads for ' + P_LONG + ' m ones, so the meter can sit further back. What does the reading do?';
  const C_O1 = 'It rises by the extra lead resistance', C_O2 = 'It stays at ' + fLA.text, C_O3 = 'It rises by the extra C lead resistance only';
  const C_RIGHT = 'Almost no current flows in the P leads, so ' + P_LONG + ' m of P lead drops almost no voltage. The C leads carry the current, but the meter does not measure across them. So the reading holds.';
  const C_W1 = 'That is a two-wire meter. The P leads carry almost no current, and the meter does not measure across the C leads.';
  const C_W3 = 'The C leads carry the current, but the meter does not measure across them. So their extra length does not join the reading.';
  const LOOP_TEXT = 'Your leads cannot reach both ends of a ' + fLen.text + ' core. So the far end links two cores, and you read the loop they make. Each loop is two cores in series: A = L1 + L2, B = L2 + L3 and C = L1 + L3.\n\n'
    + 'Add A and C, and you have L1 twice, plus L2 and L3 once each. Take B away, and L2 and L3 cancel. So L1 = (A + C − B) ÷ 2. L2 = (B + A − C) ÷ 2 and L3 = (C + B − A) ÷ 2 follow the same way.\n\n'
    + 'Add all three loops and every core appears twice. So A + B + C = 2 × (L1 + L2 + L3), a quick check on your sums.\n\n'
    + 'The link at B01 and its contacts sit between your P points in every loop. Four wires at the OSS cannot leave them out. So each core you work out carries half the link. Fit it short, firm and clean.';
  const NOTE_L = "String B's " + fLen.text + ' is a practice value.';
  const LOOP_READ = 'Loop A links L1 and L2 at B01, so it reads L1 + L2. Loop B reads L2 + L3, and loop C reads L1 + L3. So L1 = (A + C − B) ÷ 2, L2 = (B + A − C) ÷ 2 and L3 = (C + B − A) ÷ 2. With the worked example\'s readings, A + B + C = ' + f2(fA.value + fB.value + fC.value) + ' ' + fA.unit + ', twice the three cores together.';
  const wkLoops = 'A = ' + f2(fA.value) + ', B = ' + f2(fB.value) + ' and C = ' + f2(fC.value) + ' ' + fA.unit;
  const chkAt = fWk.work.indexOf(fWk.text);
  const WK4a = fWk.work.slice(0, chkAt + fWk.text.length);
  const WK4b = fWk.work.slice(chkAt + fWk.text.length).replace(/^\s*=\s*/, '') + ' = ' + fWk.text;
  const WL = [
    { w: 'L1 = ' + fRec.work + '.' },
    { w: 'L2 = ' + fW2.work + '.' },
    { w: 'L3 = ' + fW3.work + '.' },
    { w: 'Check: ' + WK4a + '.', w2: 'And ' + WK4b + '.' },
  ];
  const WK_NOTE = 'Name each result by its core, never by a loop letter.';
  const WK_GAP = 'L3 reads ' + fG1.text + ' above L1 and ' + fG2.text + ' above L2. Three cores of one cable have the same size and length, so they should read close together. Find out why before you submit a gap like this.';
  const WK_READ = 'The loops read ' + wkLoops + '. L1 = ' + fRec.text + ', L2 = ' + fW2.text + ' and L3 = ' + fW3.text + '. They add to ' + fWk.text + ', half of A + B + C. '
    + 'L3 sits ' + fG1.text + ' above L1 and ' + fG2.text + ' above L2. Explain a gap like that before you submit.';
  const COLD_TEXT = "Copper's resistance rises as it warms, by " + ALPHA + ' of its 20 °C value for each degree. That is about ' + (ALPHA_ROUND * 100) + '% per °C. Factory values are given at 20 °C. So a cable on the seabed at ' + TEMP + ' °C reads low, even when it is sound.\n\n'
    + 'Correct the reading to 20 °C before you compare it: R20 = R_t ÷ (1 + ' + ALPHA + ' × (t − 20)).';
  const NOTE_T = "L1's certificate value, " + fF1.text + ', is a practice value.';
  const COLD_READ = "L1's factory value is " + fF1.text + ' at 20 °C. At ' + TEMP + ' °C the same sound core reads ' + fCold.text + ', ' + f2(Math.abs(fColdP.value)) + '% low and outside ' + TOL + '%. '

    && near(r2((f2a.value - fF2.value) / fF2.value * 100), F('2c.slip').value) && near(r2((fF2.value - f2b.value) / fF2.value * 100), F('2c.slip2').value)
    && f2c.value < TOL && near(F('l2.L1.dev').value, 0) && near(F('l2.L3.dev').value, 0) && near(r2(fL3.value / k5(TEMP)), fF3.value));
  K.check('Changed numbers: L3 = 60.80 mΩ, slips 121.60 and 60.10 mΩ; the three cores, 60.10 + 60.30 + 60.80, make 181.20 mΩ', () =>
    near(r2(L3of(CH.A, CH.B, CH.C)), fChg.value) && near(CH_SUM, F('l2.changed.slip').value) && near(r2(L1of(CH.A, CH.B, CH.C)), F('l2.changed.slip2').value)
    && near(r2((CH.A + CH.B + CH.C) / 2), fChgK.value) && near(r2(F('l2.changed.slip2').value + CH_L2 + fChg.value), fChgK.value));
  K.check('Every slip lies outside its answer\'s accepted figures', () => Object.keys(SPEC).every((k) => {
    const sp = SPEC[k], tol = 0.005;
    return sp.slips.every((s) => Math.abs(s.value - sp.fig.value) > tol && sp.accept.every((x) => Math.abs(s.value - x) > tol));
  }));
  K.check('The measured value is between the potential connections: with the P probes inside the C clamps it is the loop alone', () =>
    near(K.at({ meas: 2 }).meter, LOOP) && K.at({ meas: 1 }).meter > LOOP,
    { source: 'https://www.seaward.com/gb/support/resistance/faqs/76198-kelvin-bridges' });
  K.check('Since no current flows in the P leads, the P contacts produce no voltage: the reading holds whatever the P leads are', () =>
    near(K.at({ meas: 2 }).meter, LOOP) && near(K.at({ meas: 1 }).meter, LOOP + 2 * CONT),
    { source: 'https://res.cloudinary.com/iwh/image/upload/q_auto%2Cg_center/assets/1/26/Documents/Megger/DLRO10/dlro10_doc_4.pdf' });
  K.check('The temperature coefficient of standard copper is 0.00393 at 20 °C', () => ALPHA === 0.00393 && near(kAt(20), 1, 1e-12),
    { source: 'https://nvlpubs.nist.gov/nistpubs/Legacy/hb/nbshandbook100.pdf' });
  K.check('Low resistance is generally considered under 1 Ω', () => LOWR === 1 && LOOP / 1000 < LOWR, { source: 'material:notes#p2' });
  K.check('Measured resistance should be within 2% of factory values', () => TOL === 2, { source: 'material:notes#p3' });

  K.ready();
</script>
