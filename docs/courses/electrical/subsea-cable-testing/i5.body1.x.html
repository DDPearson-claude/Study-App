<p class="caption" id="cap">Each line is worked from the rounded figures shown before it.</p>

<script>
  // ---------- rounding, helpers and the course's figures ----------
  const r1 = (x) => Math.round(x * 10 + 1e-7) / 10;
  const r2 = (x) => Math.round(x * 100 + 1e-7) / 100;
  const r3 = (x) => Math.round(x * 1000 + 1e-7) / 1000;
  const f1 = (x) => r1(x).toFixed(1);
  const f2 = (x) => r2(x).toFixed(2);
  const f3 = (x) => r3(x).toFixed(3);
  const F = (id) => K.figure(id);
  const el = (id) => document.getElementById(id);
  const NB = '\u00a0';
  // Non-breaking spaces: before an operator, inside "76 000", and between a number and its unit.
  const nb = (s) => String(s == null ? '' : s)
    .replace(/ ([×÷+=−]) /g, NB + '$1 ')
    .replace(/(\d) (?=\d{3}(?!\d))/g, '$1' + NB)
    .replace(/(\d) (?=(?:kVA|kV|mA|µF|km|Hz|min|Ω|s|A)(?![A-Za-z]))/g, '$1' + NB);
  const num = (s, re) => { const m = re.exec(String(s || '')); return m ? +m[1] : NaN; };
  const vis = (e, on) => { if (on) e.removeAttribute('display'); else e.setAttribute('display', 'none'); };
  const fx = (v) => (+v).toFixed(1);
  function txt(parent, x, y, s, cls, anchor) {
    const t = parent.appendChild(K.svg('text', { x: fx(x), y: fx(y), class: cls || 'lb', 'text-anchor': anchor || 'start' }));
    t.textContent = s;
    return t;
  }
  const WORDS = ['no', 'one', 'two', 'three', 'four', 'five', 'six', 'seven'];

  // String B's core and the test, from the case file.
  const fC = F('1a'), C_F = fC.value * 1e-6;
  const CKM = F('t.C66').value, fLen = F('p.len'), LEN = fLen.value, U0 = F('p.U0').value;
  const f5a = F('5a'), VT = f5a.value, V_V = VT * 1000;
  const MULT = num(f5a.work, /^([\d.]+)\s*×/), ULL = num(F('5a.slip').work, /×\s*([\d.]+)/);
  const fPeak = F('l5.peak'), PK = num(F('t.vlfPeak').text, /×\s*([\d.]+)/);
  const fRatio = F('l5.ratio'), RATIO = fRatio.value;
  const F50 = num(fRatio.work, /^([\d.]+)/), F01 = num(fRatio.work, /÷\s*([\d.]+)/);
  const fCyc1 = F('l5.cycle01'), fCycles = F('l5.cycles');
  // The practice set's rating, read from its own line ("0.75 µF at 0.1 Hz, ...").
  const SET = [];
  String(F('t.vlfSet').text).replace(/([\d.]+) µF at ([\d.]+) Hz/g, (m, c, f) => { SET.push({ C: +c, f: +f }); return m; });
  const SETPK = num(F('p.vlfSet').text, /(\d+) kV peak/);
  const fMax1 = F('l5.maxLen'), fMax2 = F('l5.maxLen05');
  const U0EX = F('n.u0ex').value;
  const fLo = F('l5.recall.lo'), fHi = F('l5.recall.hi'), fS1 = F('l5.recall.slip1'), fS1h = F('l5.recall.slip1hi');
  const ULLEX = num(fS1.work, /×\s*([\d.]+)/), MLO = num(fLo.work, /^([\d.]+)/), MHI = num(fHi.work, /^([\d.]+)/);
  const T60 = F('n.vlf60').value, T30 = F('n.vlf30').value;
  const L2MIN = num(F('p.vlfL2').text, /minute (\d+)/), fRf = F('p.Rf');
  const fRngLo = F('l5.range.lo'), fRngHi = F('l5.range.hi');
  const f5b = F('5b'), f5c = F('5c'), fKva01 = F('l5.kva01'), fKva50 = F('l5.kva50');
  const fHalf = F('l5.check.half'), fDbl = F('l5.check.slip');
  const fChg = F('l5.changed'), fChgC = F('l5.changed.C'), CH_L = num(fChgC.work, /×\s*([\d.]+)/);
  const IRV = F('p.irV').value;
  // From the lesson's sources: a resonant test above 36 kV at 10 to 500 Hz; IEEE levels; terminations above 35 kV.
  const RES_KV = 36, RES_LO = 10, RES_HI = 500, IEEE_LO = 2, IEEE_HI = 3, IEEE_MAINT = 75, TERM_KV = 35;

  // The rule: I = 2πfCV. The set supplies V × I, worked from the current as printed.
  const Iof = (f) => 2 * Math.PI * f * C_F * V_V;
  const shownI = (I) => (I >= 1 ? r2(I) : r2(I * 1000) / 1000);
  const fmtI = (I) => (I >= 1 ? f2(I) + ' A' : f2(I * 1000) + ' mA');
  const fmtKVA = (v) => (v >= 100 ? f1(v) : f2(v)) + ' kVA';
  const lenOf = (v) => { const L = Math.round(+v * 10) / 10; return isFinite(L) ? K.clamp(L, 0.5, 8) : LEN; };
  const setFor = (C) => { for (const s of SET) if (r3(C) <= s.C + 1e-9) return s; return null; };
  const cycles = (f) => Math.round(f * fCyc1.value);
  const cycLabel = (f) => (cycles(f) === 1 ? '1 cycle' : cycles(f) + ' cycles') + ' in ' + fCyc1.text;

  // ---------- the lesson's words ----------
  const O1 = U0EX + ' to ' + ULLEX + ' kV', O2 = fLo.value + ' to ' + fHi.value + ' kV', O3 = fS1.value + ' to ' + fS1h.value + ' kV';
  const R_TASK = 'A cable is rated ' + U0EX + '/' + ULLEX + ' kV. Take the VLF test voltage as ' + MLO + ' to ' + MHI + ' U0. What range is that?';
  const R_WORK = 'U0 is the voltage from each core to earth, the first number in ' + U0EX + '/' + ULLEX + ' kV. ' + fLo.work + ', and ' + fHi.work + '.';
  const R_SLIPS = 'The ' + O3 + ' answer uses ' + ULLEX + ' kV, the voltage between cores. The ' + O1 + ' answer is the rating itself, with no overvoltage.';
  const R_W1 = "That is the cable's own rating. The test goes above it, to " + MLO + ' to ' + MHI + ' times U0.';
  const R_W3 = 'That uses ' + ULLEX + ' kV, the voltage between cores. U0 is the voltage to earth, ' + U0EX + ' kV.';

  const FOR_TEXT = 'The VLF test is a pressure test. It holds an AC overvoltage on the insulation for a set time. The IR test checked the XLPE at ' + IRV + ' kV d.c. '
    + 'This test stresses it above its working voltage. It runs before the cable is energised.\n\n'
    + 'Take a defect big enough to be excited at the test voltage. Small discharges spark inside it. These are partial discharges. They start an electrical tree. '
    + 'That is a set of fine breakdown channels that branch out through the XLPE. The tree grows until the core breaks down, during the test. Smaller defects are not affected. '
    + 'So a pass means the core held the voltage for the full time with no breakdown. That gives a high chance the insulation is sound. It does not prove there are no defects at all.\n\n'
    + 'Not every spec uses VLF. Above ' + RES_KV + " kV, a submarine cable's spec may ask for an AC test at " + RES_LO + ' to ' + RES_HI + " Hz, from a resonant test set. The client's spec decides.";
  const WARN_FOR = 'Skip it, and a defect the test would have found stays in the cable. It is still there when the cable is switched on.';

  const WHY_F = "Each core is a capacitor, as in lesson 1. Conductor and screen are the plates. String B's core is " + fC.text + '. '
    + 'To hold an AC voltage on it, the test set fills it with charge, empties it, and fills it the other way, every cycle. That flow of charge is the charging current. '
    + 'The charge in each cycle is set by the capacitance and the voltage. The frequency sets how often it flows. One cycle at ' + F01 + ' Hz takes ' + fCyc1.text + '. '
    + 'In those ' + fCyc1.text + ', ' + F50 + ' Hz runs ' + fCycles.work + ' cycles. So at ' + F50 + ' Hz the set moves the same charge ' + RATIO + ' times as often, and the current is ' + RATIO + ' times bigger.\n\n'
    + 'That is the reactance at work. Xc = 1 ÷ 2πfC, so dropping f from ' + F50 + ' Hz to ' + F01 + ' Hz raises Xc ' + fRatio.work + ' times. '
    + 'The current is I = V ÷ Xc = 2πfCV, so it falls ' + RATIO + ' times. The power the set supplies, V × I, falls with it.';
  const READ_F = 'At ' + F50 + ' Hz one core of String B needs ' + f5c.text + ' at ' + VT + ' kV. The set supplies ' + fKva50.text + '. Each step down cuts the current in proportion. '
    + 'At ' + F01 + ' Hz the same voltage needs ' + f5b.text + ' and ' + fKva01.text + '. That is ' + RATIO + ' times less, because the core is filled and emptied ' + RATIO + ' times less often.';

  const WHY_L = 'A VLF set is rated by the capacitance it can drive at each frequency. Take a set that drives ' + SET[0].C + ' µF at ' + SET[0].f + ' Hz, '
    + SET[1].C + ' µF at ' + SET[1].f + ' Hz and ' + SET[2].C + ' µF at ' + SET[2].f + ' Hz, up to ' + SETPK + ' kV peak. It is a practice set, modelled on a real one. '
    + 'Use the rating of the set in front of you. The set can only supply so much current. Halve the frequency and each microfarad takes half the current. '
    + 'So the same set drives twice the capacitance.\n\n'
    + "A core's capacitance grows with its length. So a long cable may need a lower frequency, a lower voltage, or both. " + F01 + ' Hz is the standard. '
    + 'Go lower only when the cable is too big a load for the set at ' + F01 + " Hz. Don't lower the frequency when you don't need to. The recommended test times are for " + F01 + ' Hz.';
  const READ_L = "String B's " + fLen.text + ' core is ' + fC.text + ". That is inside the set's " + SET[0].C + ' µF, so it tests at ' + SET[0].f + ' Hz. '
    + 'Past about ' + fMax1.text + ' a core is too big for the set at ' + SET[0].f + ' Hz, so it drops to ' + SET[1].f + ' Hz. Past about ' + fMax2.text + ' it drops to '
    + SET[2].f + ' Hz. At 8.0 km the core is ' + F('l5.pic.C8').text + '.';
  const DC_HEAD = 'Why not DC?';
  const DC_TEXT = 'Once a cable is charged, DC needs almost no current. But DC can leave space charge in XLPE. That is charge trapped in the insulation itself. '
    + 'That can speed up water trees in healthy XLPE. DC withstand tests on XLPE cable are now discouraged. VLF reverses the polarity every cycle. That cuts the build-up. '
    + 'It is still a compromise. ' + F01 + ' Hz does not stress the XLPE exactly as ' + F50 + ' Hz will in service.';

  const C_TASK = "You test String B's core at the same " + VT + ' kV, but drop the set from ' + F01 + ' Hz to ' + SET[1].f + ' Hz. What does the charging current do?';
  const C_O1 = 'It halves, to ' + fHalf.text, C_O2 = 'It doubles, to ' + fDbl.text, C_O3 = 'It stays at ' + f5b.text;
  const C_RIGHT = 'Half the frequency doubles Xc. The current is V ÷ Xc, so it halves: ' + fHalf.work + '. That is why the set drives twice the capacitance at ' + SET[1].f + ' Hz.';
  const C_W2 = 'A lower frequency gives a higher reactance, not a lower one. The core is filled and emptied half as often, so it takes half the current.';
  const C_W3 = 'The charge in each cycle stays the same, but the cycles come half as often. So the current halves.';

  const WK_HEAD = 'A new cable rated ' + U0EX + '/' + ULLEX + ' kV, tested for installation.';
  const WL = [
    { w: 'Before you start: identify, isolate, prove dead, secure and earth. Disconnect the circuit, with no monitoring equipment left on it. Restrict access at both ends. Use only the maker\'s test leads.' },
    { w: 'U0 is the rated voltage from each core to earth or screen. In ' + U0EX + '/' + ULLEX + ' kV it is the first number: U0 = ' + U0EX + ' kV.' },
    { w: 'Lowest level: ' + MLO + ' × U0 = ' + fLo.work + '.', calc: true },
    { w: 'Highest level: ' + MHI + ' × U0 = ' + fHi.work + '. So the range is ' + f1(fLo.value) + ' to ' + fHi.text + " rms. The client's spec picks the level.", calc: true },
    { w: 'A new cable on installation: ' + F01 + ' Hz for ' + T60 + ' minutes. A simple withstand on aged cable would run ' + T30 + ' minutes.' },
    { w: 'It passes if the core holds the voltage for the full ' + T60 + ' minutes with no breakdown.' },
    { w: 'End of test: wait for the display to show discharged. Then apply the discharge stick, then the hook straight after it, then the hand earth. '
      + 'Earths go on core and screen at both ends, and stay on. Charge held in the XLPE can bring the voltage back for minutes or hours after the first discharge. '
      + 'Prove there is no voltage before anyone touches the cable.' },
  ];
  const WK_NOTE = 'Specs differ on the range. ' + MLO + ' to ' + MHI + ' U0 is common practice. IEEE levels for installation and acceptance run from under ' + IEEE_LO
    + ' U0 up to ' + IEEE_HI + ' U0. IEEE maintenance tests run at about ' + IEEE_MAINT + "% of acceptance. The client's spec sets the level on the job. "
    + 'String B is ' + U0 + '/' + ULL + ' kV, so U0 = ' + U0 + ' kV. For String B, ' + MLO + ' to ' + MHI + ' U0 is ' + f1(fRngLo.value) + ' to ' + fRngHi.text + '.';
  const WK_READ = 'On a ' + U0EX + '/' + ULLEX + ' kV cable, U0 is ' + U0EX + ' kV. So ' + MLO + ' to ' + MHI + ' U0 is ' + f1(fLo.value) + ' to ' + fHi.text + ' rms. '
    + "A new cable holds the spec's level at " + F01 + ' Hz for ' + T60 + ' minutes. It passes if there is no breakdown. '
    + 'Then discharge it in order: display, discharge stick, hook, hand earth. Earths then go on core and screen at both ends, and stay on.';

  const PRE_5A = "Assume the client asks for the VLF test on all three cores, despite L2's failed sheath test. On a real job you would stop and report L2 first. "
    + 'The spec asks for ' + MULT + ' U0 as a sine wave at ' + F01 + ' Hz. It runs for ' + T60 + ' minutes on each core in turn. String B is rated ' + U0 + '/' + ULL + ' kV. These are practice values.';
  const Q5A = "(a) Determine the VLF test voltage for String B's cores.";
  const Q5B = '(b) Determine the charging current one core draws at ' + F01 + ' Hz.';
  const Q5C = '(c) Determine the charging current the same core would draw in a ' + F50 + ' Hz test at ' + VT + ' kV.';
  const RES_TEXT = 'L1 and L3 hold ' + VT + ' kV for the full ' + T60 + ' minutes. L2 breaks down at minute ' + L2MIN + '. These are practice values. '
    + 'Each core is discharged and earthed after its test.\n\nAfterwards L2 reads ' + fRf.text + ' from core to screen. It is the same core that had the flat PI. '
    + 'Its sheath would not hold either. Record it. The next job is to find where the fault is.';
  const Q_CH = 'Another core of the same cable type runs ' + f2(CH_L) + ' km. It is tested at ' + VT + ' kV and ' + F01 + ' Hz. Determine its charging current.';

  let lines = 0, lastStep = -1, finished = false, treeG = 0, treeKey = '';
  const STEPS = [
    { name: 'Do you still have it?', label: 'Do you still have it?', task: R_TASK, opts: [O1, O2, O3], want: O2, why: R_WORK + ' ' + R_SLIPS },
    { show: true, name: 'What it is for', label: 'What it is for', text: FOR_TEXT, terms: ['pressure test', 'partial discharges', 'electrical tree'],
      still: () => { treeG = 1; drawTree(); } },
    { show: true, name: 'The why: 0.1 Hz', label: 'The why: ' + F01 + ' Hz', text: WHY_F, terms: ['charging current'],
      read: WHY_F.replace('\n\n', ' ') + ' ' + READ_F, still: () => { fCtl.set(String(F01)); K.refresh(); } },
    { show: true, name: 'The why: long cables and the set', label: 'The why: long cables and the set', text: WHY_L, terms: ['rated by the capacitance'],

            st.fb = { ok: false, v: 'Here is the working.', p0: r.hint || '', w: sp.work() };
            a.reveal();
          } else { st.res = 'wrong'; st.fb = { ok: false, v: 'Not quite. One more go.', p0: r.hint || sp.hint }; }
        } else { st.res = r.state; st.fb = null; }
        K.refresh();
      } });
    ANS[i] = a;
  });
  const checkBtn = K.button({ label: 'Check', into: '#acts', press: () => { const a = ANS[at()]; if (a) a.check(); } });

  // ---------- Section B and Keep this ----------
  function markLine(id) {
    const w = K.lesson && K.lesson.written && K.lesson.written[id];
    const n = w && Array.isArray(w.points) ? w.points.length : 0, need = w ? +w.need : 0;
    return n && need ? 'You write the answer. It is marked against ' + (WORDS[n] || n) + ' points, and any ' + (WORDS[need] || need) + ' make a full answer. You get one more go, then the model answer.'
      : 'You write the answer, in your own words. You get one more go, then the model answer.';
  }
  const wB1 = K.written({ id: 'b1', into: '#wr1', onMark: () => K.refresh() });
  el('wr1').addEventListener('click', () => K.refresh());
  K.summary({ into: '#keep' });
  (function () {
    const tw = document.createTreeWalker(el('keep'), NodeFilter.SHOW_TEXT), ns = [];
    while (tw.nextNode()) ns.push(tw.currentNode);
    ns.forEach((n) => { n.nodeValue = nb(n.nodeValue); });
  })();
  K.button({ label: 'Finish the lesson', into: '#fin', press: () => {
    if (at() !== iK) return;
    finished = true;
    if (typeof K.complete === 'function') K.complete();
    K.refresh();
  } });

  // ---------- the worked example, a line at each press ----------
  const wbox = K.el('div', { class: 'wl' });
  const wl = WL.map((x, k) => {
    const box = K.el('div', { class: 'line' });
    box.appendChild(K.el('span', { class: 'n' }, String(k + 1)));
    box.appendChild(write(K.el('p', { class: x.calc ? 'w' : '' }), x.w));
    wbox.appendChild(box);
    return box;
  });
  const wnote = wbox.appendChild(K.el('p', { class: 'sub' }, nb(WK_NOTE)));
  el('worked').appendChild(wbox);
  const nextLine = K.button({ label: 'Show', into: '#workedgo', press: () => {
    if (at() !== iWk || lines >= wl.length) return;
    const w = wl[lines]; lines += 1;
    w.classList.remove('enter'); void w.offsetWidth; w.classList.add('enter');
    K.refresh();
  } });

  // ---------- fixed words on their screens ----------
  el('warnFor').appendChild(K.el('p', { class: 'wh' }, 'If it is skipped'));
  el('warnFor').appendChild(K.el('p', null, nb(WARN_FOR)));
  el('titF').textContent = nb('Voltage on one core: ' + VT + ' kV rms at every frequency');
  el('capF').textContent = nb("String B's " + fC.text + ' core and ' + VT + ' kV are practice values.');
  el('dcNote').appendChild(K.el('p', { class: 'wh' }, DC_HEAD));
  el('dcNote').appendChild(write(K.el('p'), DC_TEXT, ['space charge']));
  el('capL').textContent = nb("The set and String B's " + fLen.text + ' are practice values. ' + CKM + ' µF per km is a typical figure.');
  paras(el('resNote'), RES_TEXT);

  function enter() { const b = el('stepbox'); b.classList.remove('enter'); void b.offsetWidth; b.classList.add('enter'); }
  const faded = {};
  function fade(node, key) {
    if (node.hidden) { faded[node.id] = ''; return; }
    if (faded[node.id] === key) return;
    faded[node.id] = key;
    node.classList.remove('fade'); void node.offsetWidth; node.classList.add('fade');
  }
  function paintFb(f) {
    const fb = el('fb');
    fb.textContent = '';
    fb.hidden = !f;
    if (!f) return;
    fb.className = 'fb ' + (f.ok ? 'ok' : 'bad');
    fb.appendChild(K.el('p', { class: 'v' }, f.v));
    if (f.p0) fb.appendChild(write(K.el('p'), f.p0));
    (f.w || []).forEach((t) => fb.appendChild(write(K.el('p', { class: 'w' }), t)));
    if (f.p) fb.appendChild(write(K.el('p'), f.p));
  }

  // ---------- nav ----------
  const backBtn = K.button({ label: 'Back', secondary: true, into: '#nav', press: () => { if (at() > 0) stepper.set(at() - 1); } });
  const nextBtn = K.button({ label: 'Continue', into: '#nav', press: () => { const i = at(); if (canGo(i) && i < iK) stepper.set(i + 1); } });
  function canGo(i) {
    const d = STEPS[i], st = S[i];
    if (d.show) return true;
    if (i === iR) return st.res === 'wrong';
    if (i === iChk) return st.res === 'right';
    if (ANS[i]) return st.res === 'right' || st.shown;
    if (i === iB1) return !!(wB1 && wB1.answered && wB1.answered());
    return false;
  }

  const ON = { scen: [i5A], carry5a: [i5A], carry5b: [i5B], carry5c: [i5C], pre: [i5A],
    wrapT: [iFor], warnFor: [iFor],
    wrapF: [iF], ctlF: [iF], outsF: [iF], sayF: [iF], capF: [iF],
    wrapL: [iL], ctlL: [iL], outsL: [iL], sayL: [iL], dcNote: [iL], capL: [iL],
    worked: [iWk], workedgo: [iWk], picks: [iR, iChk],
    'ans-5a': [i5A], 'ans-5b': [i5B], 'ans-5c': [i5C], 'ans-ch': [iCh], wr1: [iB1], keep: [iK], fin: [iK] };
  const ASK = {
    [iF]: 'Step the frequency down from ' + F50 + ' Hz to ' + F01 + ' Hz.',
    [iL]: 'Drag the length from ' + fLen.text + ' out to 8.0 km.',
    [iWk]: 'Work each line yourself first, then press Show.',
  };
  const CARRY = { [i5A]: car5a, [i5B]: car5b, [i5C]: car5c };

  K.update((p, o) => {
    const i = at(), d = STEPS[i], st = S[i];
    if (i !== lastStep) {
      if (lastStep !== -1) enter();
      lastStep = i;
      if (i === i5A) scen.el.open = true;
      if (CARRY[i] && typeof CARRY[i].refresh === 'function') { try { CARRY[i].refresh(); } catch (e) { /* the panel keeps its last state */ } }
    }
    Object.keys(ON).forEach((id) => { el(id).hidden = ON[id].indexOf(i) < 0; });
    el('cap').hidden = WORKING.indexOf(i) < 0;

    el('count').textContent = 'Step ' + (i + 1) + ' of ' + STEPS.length + ' · ' + d.label;
    paras(el('pre'), d.pre || '');
    const task = el('task');
    task.className = 'task' + (d.show ? ' show' : '');
    if (d.show) paras(task, d.text, d.terms);
    else write(task, d.part || (d.kind ? '' : d.task));
    task.hidden = !task.textContent;
    const sub = el('sub');
    sub.className = 'sub' + (ASK[i] ? ' ask' : '');
    sub.textContent = nb(ASK[i] ? ASK[i]
      : i === i5A ? 'Give it in kV, to 1 place.'
      : i === i5B ? 'Give it in mA, to 2 places.'
      : i === i5C ? 'Give it in A, to 2 places.'
      : i === iCh ? 'Same method, new numbers. These are practice values. Give it in mA, to 2 places.'
      : i === iB1 ? markLine('b1')
      : i === iK ? 'One card to come back to on a real job.' : '');
    sub.hidden = !sub.textContent;

    drawFreq(p, o);
    drawLen(p, o);
    const tk = i === iFor ? 'T' : '';
    if (tk && tk !== treeKey) { treeG = 0; drawTree(); if (!anim.playing()) anim.play(); }
    treeKey = tk;

    const opts = d.opts || [];
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      b.setLabel(nb(opts[k]));
      const done = st.res === 'right' || (i === iR && st.res === 'wrong');
      b.el.classList.toggle('is-right', done && opts[k] === d.want);
      b.el.classList.toggle('is-wrong', st.res === 'wrong' && opts[k] === st.pick);
      b.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });

    wl.forEach((w, k) => { w.hidden = k >= lines; });
    wnote.hidden = lines < wl.length;
    nextLine.el.hidden = lines >= wl.length;
    if (i === iWk) el('workedgo').hidden = lines >= wl.length;

    const typed = !!ANS[i], typedDone = typed && (st.res === 'right' || st.shown);
    checkBtn.el.hidden = !typed || typedDone;
    el('acts').hidden = checkBtn.el.hidden;
    paintFb(st.fb);
    const after = el('after');
    paras(after, typedDone ? SPEC[i].after : '');
    after.hidden = !after.textContent;
    el('resNote').hidden = !(i === i5C && typedDone);
    el('wrapR').hidden = el('resNote').hidden;
    el('go').hidden = !(i === iR && st.res === 'right');
    [['fb', JSON.stringify(st.fb)], ['after', i + after.textContent], ['resNote', String(i)], ['wrapR', String(i)], ['go', String(i)]].forEach(([id, key]) => fade(el(id), key));

    el('donefb').textContent = finished && i === iK ? 'Lesson finished. Back is there whenever you want another look.' : '';
    el('donefb').hidden = !el('donefb').textContent;

    backBtn.el.hidden = i === 0;
    nextBtn.el.hidden = i === iK || !canGo(i) || (i === iR && st.res === 'right');
    el('nav').hidden = backBtn.el.hidden && nextBtn.el.hidden;
  });

  // ---------- known answers, worked out by hand ----------
  const near = (a, b, t) => K.near(a, b, t == null ? 1e-6 : t);
  const A = (f) => K.at({ f: String(f) });
  K.check('At 76 kV one core takes 12.61 A at 50 Hz, 2.52 A at 10 Hz, 252.13 mA at 1 Hz and 25.21 mA at 0.1 Hz; the set supplies 958.4, 191.5, 19.16 and 1.92 kVA', () =>
    fmtI(A(F50).I) === f5c.text && fmtI(A(10).I) === F('l5.pic.I10').text && fmtI(A(1).I) === F('l5.pic.I1').text && fmtI(A(F01).I) === f5b.text
    && fmtKVA(A(F50).kva) === fKva50.text && fmtKVA(A(10).kva) === F('l5.pic.kva10').text && fmtKVA(A(1).kva) === F('l5.pic.kva1').text && fmtKVA(A(F01).kva) === fKva01.text);
  K.check('Stepping 50 Hz down to 0.1 Hz cuts the current exactly 500 times, and each step down cuts it in proportion', () =>
    near(A(F50).I / A(F01).I, RATIO, 1e-9) && near(F50 / F01, RATIO) && near(A(10).I / A(1).I, 10, 1e-9) && A(F50).I > A(10).I && A(10).I > A(1).I && A(1).I > A(F01).I);
  K.check('Halving 0.1 Hz to 0.05 Hz halves 25.21 mA to 12.61 mA; doubling it would give 50.42 mA', () =>
    near(r2(f5b.value / 2), fHalf.value) && near(r2(f5b.value * 2), fDbl.value) && near(r2(Iof(SET[1].f) * 1000), fHalf.value, 0.011) && near(SET[1].f * 2, F01));
  K.check('Core capacitance 0.110 µF at 0.5 km, 0.528 at 2.40, 1.100 at 5.0 and 1.760 at 8.0 km; the set uses 0.1, 0.1, 0.05 and 0.02 Hz', () => {
    const L = (x) => K.at({ L: x });
    return f3(L(0.5).C) + ' µF' === F('l5.pic.C0.5').text && f3(L(LEN).C) + ' µF' === fC.text && f3(L(5).C) + ' µF' === F('l5.pic.C5').text && f3(L(8).C) + ' µF' === F('l5.pic.C8').text
      && L(0.5).fs === SET[0].f && L(LEN).fs === SET[0].f && L(5).fs === SET[1].f && L(8).fs === SET[2].f;
  });
  K.check('The set reaches its 0.1 Hz rating at 3.41 km and its 0.05 Hz rating at 6.82 km', () => {
    const L = (x) => K.at({ L: x }).fs;
    return near(r2(SET[0].C / CKM), fMax1.value) && near(r2(SET[1].C / CKM), fMax2.value)
      && L(3.4) === SET[0].f && L(3.5) === SET[1].f && L(6.8) === SET[1].f && L(6.9) === SET[2].f;
  });
  K.check('Recall 18.0 to 30.0 kV on a 12/20 kV cable (30 to 50 with 20 kV); String B 57.0 to 95.0 kV; 5(a) 2 × 38 = 76.0 kV rms, 107.5 kV peak', () =>
    near(r1(MLO * U0EX), fLo.value) && near(r1(MHI * U0EX), fHi.value) && near(r1(MLO * ULLEX), fS1.value) && near(r1(MHI * ULLEX), fS1h.value)
    && near(r1(MLO * U0), fRngLo.value) && near(r1(MHI * U0), fRngHi.value) && near(r1(MULT * U0), f5a.value) && near(r1(VT * PK), fPeak.value)
    && fPeak.value < SETPK);
  K.check('5(b) 25.21 mA and 1.92 kVA; 5(c) 12.61 A and 958.4 kVA; changed numbers 0.682 µF and 32.57 mA', () =>
    near(r2(Iof(F01) * 1000), f5b.value) && near(r2(VT * f5b.value / 1000), fKva01.value) && near(r2(Iof(F50)), f5c.value) && near(r1(VT * f5c.value), fKva50.value)
    && near(r3(CKM * CH_L), fChgC.value) && near(r2(2 * Math.PI * F01 * fChgC.value * 1e-6 * V_V * 1000), fChg.value) && fChgC.value <= SET[0].C);
  K.check('Each slip is its own working: 132.0, 38.0 and 107.5 kV; 4.01, 35.66 and 75.63 mA; 2.01 and 6.30 A; 5.18 mA', () =>
    near(r1(MULT * ULL), F('5a.slip').value) && near(U0, F('5a.slip2').value) && near(fPeak.value, F('5a.slip3').value)
    && near(r2(F01 * C_F * V_V * 1000), F('5b.slip').value) && near(r2(2 * Math.PI * F01 * C_F * fPeak.value * 1e6), F('5b.slip2').value)
    && near(r2(3 * f5b.value), F('5b.slip3').value) && near(r2(F50 * C_F * V_V), F('5c.slip').value)
    && near(r2(2 * Math.PI * F50 * C_F * U0 * 1000), F('5c.slip2').value) && near(r2(F01 * fChgC.value * 1e-6 * V_V * 1000), F('l5.changed.slip').value));
  K.check('In service at 38 kV and 50 Hz the rule gives 2.63 A per km, against 2.6 A/km in the cable table', () =>
    near(2 * Math.PI * F50 * CKM * 1e-6 * U0 * 1000, F('t.Ich66').value, 0.05));
  K.check('The time line shows 1 cycle in 10 s at 0.1 Hz, 10 at 1 Hz, 100 at 10 Hz and 500 at 50 Hz', () =>
    cycLabel(F01) === '1 cycle in 10 s' && cycles(1) === 10 && cycles(10) === 100 && cycles(F50) === fCycles.value && near(fCyc1.value, 1 / F01));
  K.check('VLF-200CMF: 0 to 200 kVac peak, 0.75 µF at 0.10 Hz to 3.75 µF at 0.02 Hz', () =>
    SETPK === 200 && SET.length === 3 && SET[0].C === 0.75 && SET[0].f === 0.1 && SET[2].C === 3.75 && SET[2].f === 0.02,
    { source: 'https://hvinc.com/wp-content/uploads/2024/05/HV-Cable-Testing-VLF-Models-11.23-revA-May-2024.pdf' });
  K.check('The recommended minimum time for an installation or acceptance withstand test on new cable is 60 min at 0.1 Hz', () => T60 === 60 && F01 === 0.1,
    { source: 'https://hvinc.com/wp-content/uploads/2024/02/IEEE-test-voltages.pdf' });
  K.check('Terminations may need to be added to avoid flashover on installation tests of cables rated above 35 kV', () => TERM_KV === 35,
    { source: 'https://hvinc.com/wp-content/uploads/2024/02/IEEE-test-voltages.pdf' });
  K.check('Installation and acceptance levels run from less than 2 U0 to 3 U0', () => IEEE_LO === 2 && IEEE_HI === 3,
    { source: 'https://hvinc.com/vlf-cable-test-voltage-ieee-standard' });
  K.check('For cables over 36 kV, IEC 63026 asks for a test frequency of 10 to 500 Hz for commissioning', () => RES_KV === 36 && RES_LO === 10 && RES_HI === 500,
    { source: 'https://www.hvuk.co.uk/l/offshore-resonant-test-system-for-66-kv-inter-array-cables' });
  K.check("Every slip lies outside its answer's accepted figures", () => Object.keys(SPEC).every((k) => {
    const sp = SPEC[k], tol = 0.05;
    return sp.slips.every((s) => Math.abs(s.value - sp.fig.value) > tol && sp.accept.every((x) => Math.abs(s.value - x) > tol));
  }));

  K.ready();
</script>
