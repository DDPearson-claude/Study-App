<p class="caption" id="cap">Each line is worked from the rounded figures shown before it.</p>

<script>
  // ---------- rounding, helpers and the course's figures ----------
  const r1 = (x) => Math.round(x * 10 + 1e-7) / 10;
  const r2 = (x) => Math.round(x * 100 + 1e-7) / 100;
  const f1 = (x) => r1(x).toFixed(1);
  const f2 = (x) => r2(x).toFixed(2);
  const F = (id) => K.figure(id);
  const el = (id) => document.getElementById(id);
  const NB = '\u00a0';
  // Non-breaking spaces: before an operator, and between a number and its unit.
  const nb = (s) => String(s == null ? '' : s)
    .replace(/ ([×÷+=−]) /g, NB + '$1 ')
    .replace(/(\d) (?=(?:GΩ|MΩ|nA|µF|mC|kV|°C|min|J|s)(?![A-Za-z]))/g, '$1' + NB);
  const vis = (e, on) => { if (on) e.removeAttribute('display'); else e.setAttribute('display', 'none'); };
  function txt(parent, x, y, s, cls, anchor) {
    const t = parent.appendChild(K.svg('text', { x: x, y: y, class: cls || 'lb', 'text-anchor': anchor || 'start' }));
    t.textContent = s;
    return t;
  }
  const WORDS = ['no', 'one', 'two', 'three', 'four', 'five', 'six', 'seven'];

  const fRec = F('l3.recall'), fS1 = F('l3.recall.slip1'), fS2 = F('l3.recall.slip2');
  const f3a = F('3a'), f3b = F('3b'), f3c = F('3c');
  const fL1D = F('l3.L1.DAR'), fL2D = F('l3.L2.DAR'), fL3P = F('l3.L3.PI'), fL3D = F('l3.L3.DAR');
  const fQ = F('l3.charge'), fE = F('l3.energy'), fC1 = F('1a');
  const fChg = F('l3.changed'), fX = F('l3.check.X'), fY = F('l3.check.Y');
  const fV = F('p.irV'), fCrit = F('p.irCrit'), fPiT = F('p.piTime'), fTemp = F('p.temp');
  const IR = {
    1: ['p.ir1.30s', 'p.ir1.1m', 'p.ir1.10m'].map(F),
    2: ['p.ir2.30s', 'p.ir2.1m', 'p.ir2.10m'].map(F),
    3: ['p.ir3.30s', 'p.ir3.1m', 'p.ir3.10m'].map(F),
  };
  const KV = fV.value, VOLTS = KV * 1000, CRIT = fCrit.value, TAU = F('p.irTau').value, TAUC = F('p.irTauC').value;
  const FIVE = F('n.discharge').value, PIMIN = fPiT.value, TEMP = fTemp.value;
  // Practice values: the recall core, the check's two cores and the changed-numbers core.
  const RC = { r1: 2.0, r10: 6.0 }, CX = { r1: 3.00, x10: 3.20, y10: 9.00 }, CH = { r1: 8.0, r10: 9.6 };
  // Bands from the notes, and a maker's figures for good insulation.
  const PI_EDGE = [1, 2, 4], DAR_EDGE = [1.25, 1.6], MAKER_PI = 2.0, MAKER_DAR = 1.4, IEEE_MOHM = 5000, OLD = 4;
  const piBand = (v) => v < PI_EDGE[0] ? 'poor' : v < PI_EDGE[1] ? 'questionable' : v <= PI_EDGE[2] ? 'okay' : 'good';
  const piRange = (v) => v < 1 ? 'below 1' : v < 2 ? '1 to 2' : v <= 4 ? '2 to 4' : 'above 4';
  const darBand = (v) => v < DAR_EDGE[0] ? 'inadequate' : v <= DAR_EDGE[1] ? 'satisfactory' : 'excellent';

  // ---------- the sketch's rule: 1 ÷ R = 1 ÷ R∞ + 0.061 × e^(−t ÷ 70 s), R in GΩ ----------
  const ABS = 0.061, RINF = [64, 10, 2.4], NAMES = ['Dry', 'Damp', 'Wet'];
  const Rof = (t, ri) => 1 / (1 / ri + ABS * Math.exp(-t / TAU));
  const leakOf = (ri) => VOLTS / ri;                                   // nA, with R in GΩ
  const absOf = (t) => VOLTS * ABS * Math.exp(-t / TAU);                // nA
  const chgOf = (t) => fC1.value * VOLTS / TAUC * 1000 * Math.exp(-t / TAUC);   // nA: C × V ÷ τ
  // A reading under 10 GΩ is shown to 2 places, one at 10 GΩ or more to 1 place.
  const fmtR = (v) => (v < 10 ? r2(v).toFixed(2) : r1(v).toFixed(1));
  const shownR = (v) => +fmtR(v);
  const si = (v) => K.clamp(Math.round(+v || 0), 0, 2);
  const tv = (v) => { const t = Math.round(+v); return isFinite(t) ? K.clamp(t, 0, 40) : 20; };
  const R20_1 = shownR(Rof(60, RINF[0])), R20_10 = shownR(Rof(600, RINF[0]));
  const factorAt = (t) => Math.pow(2, (20 - t) / 10);
  const setOf = (s) => {
    const ri = RINF[s], a = Rof(30, ri), b = Rof(60, ri), c = Rof(600, ri);
    return { a, b, c, dar: r2(shownR(b) / shownR(a)), pi: r2(shownR(c) / shownR(b)), leak: leakOf(ri) };
  };
  const DRY = setOf(0), DAMP = setOf(1), WET = setOf(2);

  // ---------- the lesson's words ----------
  const O1 = fS1.text + ', ' + piBand(fS1.value), O2 = fRec.text + ', ' + piBand(fRec.value), O3 = fS2.value.toFixed(1) + ', ' + piBand(fS2.value);
  const R_TASK = 'One core reads ' + f1(RC.r1) + ' GΩ at 1 minute and ' + f1(RC.r10) + ' GΩ at 10 minutes. What is its PI, and how does it rate?';
  const R_WORK = 'PI = R10 ÷ R1 = ' + fRec.work.split(',')[0] + '. That sits in the ' + piRange(fRec.value) + ' band, ' + piBand(fRec.value) + '.';
  const R_SLIPS = fS1.text + ' is the ratio upside down, and ' + fS2.value.toFixed(1) + ' is how far the reading rose.';
  const R_W1 = 'That is the ratio upside down, ' + fS1.work.split(' = ')[0] + ". Put the 10-minute reading on top. A healthy core's PI comes out above 1.";
  const R_W3 = 'That is the rise, ' + fS2.work.split(' = ')[0] + ' GΩ. PI is a ratio. Divide the 10-minute reading by the 1-minute reading.';
  const FOR_TEXT = 'The IR test puts a steady d.c. voltage between a core and its screen. The tester measures the tiny current that gets through the XLPE and shows it as a resistance. '
    + 'It answers one question: is the insulation dry and clean, at low stress? It runs after core resistance and before the sheath test. '
    + 'On String B it runs at ' + fV.text + ". That is the client's choice, and a practice value here.";
  const WARN_FOR = 'Damp or dirty insulation goes on to the high-voltage tests unseen. So does a core that passes on one reading but leaks steadily.';
  const WHY_TEXT = 'The current the tester sees has three parts. A charging current fills the cable\'s capacitance and dies away in seconds. '
    + 'An absorption current flows while the insulation slowly polarises. Charge inside the plastic shifts into line with the field, and that slow shift is a current. It dies away over minutes. '
    + 'A leakage current runs through the insulation and stays.\n\n'
    + 'The tester shows voltage ÷ current. So as the first two die away, the reading climbs. Water or dirt adds leakage, and leakage does not die away. It swamps the absorption, so the reading hardly climbs.';
  const NOTE_C = 'One core at ' + KV + ' kV for 10 minutes. On both graphs, each mark up the side is ten times the last.';
  const WHY_READ = 'The dry core climbs from ' + fmtR(DRY.a) + ' GΩ at 30 s to ' + fmtR(DRY.c) + ' GΩ at 10 minutes, a PI of ' + f2(DRY.pi) + '. '
    + 'In the wet core, a steady ' + Math.round(WET.leak) + ' nA of leakage swamps the absorption. It reads ' + fmtR(WET.a) + ', ' + fmtR(WET.b) + ' and ' + fmtR(WET.c) + ' GΩ, a PI of ' + f2(WET.pi) + '. '
    + 'Both clear ' + CRIT + ' GΩ at 1 minute. Only the climb tells them apart.';
  const TEMP_TEXT = 'A single reading swings with temperature. As a rule of thumb, insulation resistance halves for every 10 °C rise and doubles for every 10 °C fall. '
    + "So a reading on a warm day can look worse than last month's, with nothing wrong. "
    + 'PI and DAR take two readings close together, on the same cable, at the same temperature. Warmth pulls both down together, so the ratio barely moves.';
  const NOTE_T = 'The dry core from the last screen. Assume it was read at 20 °C, where it reads ' + f1(R20_1) + ' and ' + f1(R20_10) + ' GΩ.';
  const TEMP_READ = 'At 20 °C the core reads ' + f1(R20_1) + ' GΩ at 1 minute. At 40 °C the same sound core reads ' + f1(R20_1 * factorAt(40)) + ' GΩ, a quarter as much. '
    + 'Its PI stays at ' + f2(R20_10 / R20_1) + ' the whole way.';
  const C_TASK = 'Two cores of one cable both read ' + f2(CX.r1) + " GΩ at 1 minute, well over the client's " + CRIT + ' GΩ. At 10 minutes, core X reads ' + f2(CX.x10)
    + ' GΩ and core Y reads ' + f2(CX.y10) + ' GΩ. Which core has a steady leakage, such as moisture?';
  const C_O1 = 'Core X', C_O2 = 'Core Y', C_O3 = 'Neither: both pass ' + CRIT + ' GΩ';
  const C_RIGHT = "X's reading hardly climbs. PI = " + fX.work + '. A steady leakage current carries most of its current, and leakage does not die away. '
    + 'Y climbs to a PI of ' + fY.work + ', as its absorption current dies.';
  const C_W2 = "Y's reading changed the most, and that is the healthy sign. Its absorption current died away and left only a small leakage.";
  const C_W3 = "Both pass on one reading. But X's flat curve points to a steady leakage that one reading cannot show.";
  const DIS_TEXT = 'When the test stops, the core is a charged capacitor. One core of String B has ' + fC1.text + '. At ' + KV + ' kV it holds Q = C × V = ' + fQ.work + '. '
    + 'Its energy is E = ½ × C × V² = ' + fE.work + '. Part of the charge has soaked into the insulation. It seeps back out after the core has been discharged, and can bring the voltage back.\n\n'
    + "Never improvise the order. Check the tester's display shows discharged. Then the discharge stick, then the hook stick, then the hand earth. Earth the core and the screen at both ends.\n\n"
    + 'Keep it discharging and earthed for at least ' + WORDS[FIVE] + ' times as long as the test voltage was on. After a 1-minute test, that is at least ' + (FIVE * 1) + ' minutes. '
    + 'Some older guidance says ' + WORDS[OLD] + ' times. Use ' + WORDS[FIVE] + '. Then leave the earths on until the next test needs them.';
  const WK_HEAD = 'L3 at ' + KV + ' kV reads ' + IR[3][0].text + ' at 30 s, ' + IR[3][1].text + ' at 1 minute and ' + IR[3][2].text + ' at 10 minutes. These are practice values.';
  const cap1 = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  const WL = [
    { w: 'DAR = R60s ÷ R30s = ' + fL3D.work + '. ' + cap1(darBand(fL3D.value)) + ': 1.25 to 1.6.' },
    { w: 'PI = R10 ÷ R1 = ' + fL3P.work + '. ' + cap1(piBand(fL3P.value)) + ': ' + piRange(fL3P.value) + '.' },
    { w: 'The voltage held for the full ' + PIMIN + ' minutes, and ' + IR[3][1].text + " beats the client's " + CRIT + ' GΩ. L3 passes.' },
  ];
  const WK_NOTES = [
    'The DAR comes out lower than the PI. Its two readings are only 30 s apart, so it sees less of the climb.',
    'Makers draw the bands in other places. Some call a PI of ' + MAKER_PI.toFixed(1) + ' or more good, and a DAR of ' + MAKER_DAR.toFixed(1) + " or more. On those bands, L3's PI counts as good, but its DAR of "
      + fL3D.text + " falls short. The client's test spec decides pass or fail.",
    'One more caution. L3 reads a very high ' + IR[3][1].text + ' at 1 minute. IEEE 43 does not recommend PI as an assessment tool when the 1-minute reading, corrected to 40 °C, is above '
      + IEEE_MOHM + " MΩ. It was written for rotating machines, not cables. So take it as a caution here, not a rule. Read a very high core's PI as a guide. Set it beside the other two cores.",
  ];
  const WK_READ = "L3's DAR is " + fL3D.work + ', ' + darBand(fL3D.value) + '. Its PI is ' + fL3P.work + ', ' + piBand(fL3P.value) + '. It held the voltage for ' + PIMIN
    + " minutes and beats the client's " + CRIT + ' GΩ. So it passes.';
  const TEST_TEXT = 'Each core of String B is tested in turn at ' + fV.text + ', core to screen, for ' + PIMIN + ' minutes. The client asks for ' + fCrit.text + '. These are practice values. '
    + 'L1 reads ' + IR[1][0].text + ' at 30 s, ' + IR[1][1].text + ' at 1 minute and ' + IR[1][2].text + ' at 10 minutes.';
  const Q3A = '(a) Determine the polarisation index of core L1.';
  const L2_TEXT = 'L2 reads ' + IR[2][0].text + ' at 30 s, ' + IR[2][1].text + ' at 1 minute and ' + IR[2][2].text + ' at 10 minutes.';
  const Q3B = '(b) Determine the polarisation index of core L2.';
  const C3_PRE = "L2's PI test held " + KV + ' kV for ' + PIMIN + ' minutes.';
  const Q3C = '(c) Determine the least time L2 must then stay discharged and earthed.';
  const Q_CH = "Another cable's core reads " + f1(CH.r1) + ' GΩ at 1 minute and ' + f1(CH.r10) + ' GΩ at 10 minutes. Determine its PI.';
  const CH_WORK = 'PI = R10 ÷ R1 = ' + fChg.work.split(',')[0];

  let lines = 0, lastStep = -1, finished = false, stillMode = false;
  const STEPS = [
    { name: 'Do you still have it?', label: 'Do you still have it?', task: R_TASK, opts: [O1, O2, O3], want: O2, why: R_WORK + ' ' + R_SLIPS },
    { show: true, name: 'What it is for', label: 'What it is for', text: FOR_TEXT, terms: ['IR test'] },
    { show: true, name: 'The why: three currents', label: 'The why: three currents', text: WHY_TEXT, terms: ['charging current', 'absorption current', 'leakage current'],
      read: WHY_TEXT.replace('\n\n', ' ') + ' ' + WHY_READ, still: () => { stillMode = true; insCtl.set(2); K.refresh(); endMotion(); } },
    { show: true, name: 'A ratio ignores the weather', label: 'The why: a ratio ignores the weather', text: TEMP_TEXT, terms: ['halves for every 10 °C rise'],
      read: TEMP_TEXT + ' ' + TEMP_READ, still: { temp: 40 } },
    { name: 'Check', label: 'Check', task: C_TASK, opts: [C_O1, C_O2, C_O3], want: C_O1, why: C_RIGHT },

  const anim = K.anim({ button: false, label: 'Time', step: (dt) => {
    const i = at(), d = Math.min(dt, 0.1);
    if (i === iFor) { flowT += d; flowLeft -= d; drawArrows(); return flowLeft > 0; }
    if (i === iWhy) {
      if (sweepPos < 600) sweepPos = Math.min(600, sweepPos + d * 150); else fadeT += d;
      drawCursor(K.params());
      return fadeT < 0.6;
    }
    return false;
  } });

  // ---------- picks: one tap answers ----------
  const pickBtns = [0, 1, 2].map((k) => K.button({ label: 'Answer ' + (k + 1), secondary: true, into: '#picks', press: () => pick(k) }));
  function pick(k) {
    const i = at(), d = STEPS[i], st = S[i];
    if (!d.opts || k >= d.opts.length) return;
    if (i === iR) {
      if (st.res) return;     // a recall gets one go
      st.pick = d.opts[k];
      if (st.pick === d.want) { st.res = 'right'; st.fb = { ok: true, v: 'Still there.', w: [R_WORK], p: R_SLIPS }; }
      else { st.res = 'wrong'; st.fb = { ok: false, v: 'Not quite.', p0: st.pick === O1 ? R_W1 : R_W3, w: [R_WORK] }; }
    } else if (i === iChk) {
      if (st.res === 'right') return;
      st.pick = d.opts[k];
      if (st.pick === d.want) { st.res = 'right'; st.fb = { ok: true, v: "That's it.", p0: C_RIGHT }; }
      else { st.res = 'wrong'; st.fb = { ok: false, v: 'Not quite.', p0: st.pick === C_O2 ? C_W2 : C_W3 }; }
    }
    K.refresh();
  }
  K.button({ label: 'Refresh the why', into: '#go', press: () => { if (at() === iR && S[iR].res === 'right') stepper.set(iFor); } });
  K.button({ label: 'Skip to the practice', secondary: true, into: '#go', press: () => { if (at() === iR && S[iR].res === 'right') stepper.set(i3A); } });

  // ---------- Section A: typed answers on the course's figures ----------
  const scen = K.scenario({ into: '#scen', open: true });
  K.carried({ parts: ['3a'], into: '#carry3b' });
  K.carried({ parts: ['3a', '3b'], into: '#carry3c' });
  const UPSIDE = 'That is the ratio upside down. Put the 10-minute reading on top.', RISE = 'That is the rise in GΩ. PI is a ratio, so divide.';
  const DARSLIP = (who, f) => 'That is ' + who + "'s DAR, " + f.work.split(' = ')[0] + '. PI uses the 1-minute and 10-minute readings.';
  const SPEC = {
    [i3A]: { id: '3a', fig: f3a, dec: 2, accept: [], work: () => ['PI = R10 ÷ R1', '= ' + f3a.work],
      slips: [{ value: F('3a.slip').value, hint: UPSIDE }, { value: fL1D.value, hint: DARSLIP('L1', fL1D) }, { value: F('3a.slip2').value, hint: RISE }],
      hint: "Not quite. Divide L1's 10-minute reading by its 1-minute reading.",
      after: f3a.text + ' sits in ' + piRange(f3a.value) + ', ' + piBand(f3a.value) + ". L1's DAR is " + fL1D.work + ', ' + darBand(fL1D.value) + '. L3 works out at a PI of ' + fL3P.text + '.' },
    [i3B]: { id: '3b', fig: f3b, dec: 2, accept: [], work: () => ['PI = R10 ÷ R1', '= ' + f3b.work],
      slips: [{ value: F('3b.slip').value, hint: UPSIDE }, { value: fL2D.value, hint: DARSLIP('L2', fL2D) }, { value: F('3b.slip2').value, hint: RISE }],
      hint: "Not quite. Divide L2's 10-minute reading by its 1-minute reading.",
      after: f3b.text + ' sits in ' + piRange(f3b.value) + ', ' + piBand(f3b.value) + ". L2's DAR is " + fL2D.work + ', ' + darBand(fL2D.value) + '. Yet its 1-minute reading of '
        + IR[2][1].text + " beats the client's " + CRIT + ' GΩ. On that reading alone, L2 would have gone through. Its flat curve says a steady leakage carries most of its current. '
        + 'Record it, and find out why before you submit. The sheath test comes next.' },
    [i3C]: { id: '3c', fig: f3c, dec: 0, accept: [], work: () => ['Discharge time = ' + FIVE + ' × the time the voltage was on', '= ' + f3c.work],
      slips: [{ value: F('3c.slip').value, hint: 'That is how long the test ran. Allow five times that.' }, { value: F('3c.slip2').value, hint: 'That is four times, an older rule. Allow five times.' }],
      hint: 'Not quite. Allow five times as long as the voltage was on.',
      after: "Keep the earths on L2's core and screen at both ends for at least " + f3c.value + ' minutes. Leave them on until the next test needs them.' },
    [iCh]: { id: 'l3.changed', fig: fChg, dec: 2, accept: [], work: () => [CH_WORK],
      slips: [{ value: F('l3.changed.slip').value, hint: UPSIDE }, { value: F('l3.changed.slip2').value, hint: RISE }],
      hint: 'Not quite. Divide the 10-minute reading by the 1-minute reading.',
      after: fChg.text + ' sits in ' + piRange(fChg.value) + ', ' + piBand(fChg.value) + '. Find out why before you submit it.' },
  };
  const BOX = { [i3A]: '#ans-3a', [i3B]: '#ans-3b', [i3C]: '#ans-3c', [iCh]: '#ans-ch' };
  const ANS = {};
  Object.keys(SPEC).forEach((key) => {
    const i = +key, sp = SPEC[i];
    const a = K.answer({ id: sp.id, unit: sp.fig.unit || '', answer: sp.fig.value, decimals: sp.dec, accept: sp.accept, slips: sp.slips, into: BOX[i],
      onCheck: (r) => {
        const st = S[i];
        if (st.shown) return;
        if (r.state === 'right') {
          st.res = 'right';
          st.fb = { ok: true, v: 'Right.', w: sp.work() };
        } else if (r.state === 'wrong') {
          st.tries += 1;
          if (st.tries >= 2) {
            st.shown = true; st.res = 'shown';
            st.fb = { ok: false, v: 'Here is the working.', p0: r.hint || '', w: sp.work() };
            a.reveal();
          } else { st.res = 'wrong'; st.fb = { ok: false, v: 'Not quite. One more go.', p0: r.hint || sp.hint }; }
        } else { st.res = r.state; st.fb = null; }
        K.refresh();
      } });
    ANS[i] = a;
  });
  const checkBtn = K.button({ label: 'Check', into: '#acts', press: () => { const a = ANS[at()]; if (a) a.check(); } });

  // ---------- Section B and Keep this ----------
  function markLine(id) {
    const w = K.lesson && K.lesson.written && K.lesson.written[id];
    const n = w && Array.isArray(w.points) ? w.points.length : 0, need = w ? +w.need : 0;
    return n && need ? 'You write the answer. It is marked against ' + (WORDS[n] || n) + ' points, and any ' + (WORDS[need] || need) + ' make a full answer. You get one more go, then the model answer.'
      : 'You write the answer, in your own words. You get one more go, then the model answer.';
  }
  const wB1 = K.written({ id: 'b1', into: '#wr1', onMark: () => K.refresh() });
  el('wr1').addEventListener('click', () => K.refresh());
  K.summary({ into: '#keep' });
  (function () {
    const tw = document.createTreeWalker(el('keep'), NodeFilter.SHOW_TEXT), ns = [];
    while (tw.nextNode()) ns.push(tw.currentNode);
    ns.forEach((n) => { n.nodeValue = nb(n.nodeValue); });
  })();
  K.button({ label: 'Finish the lesson', into: '#fin', press: () => {
    if (at() !== iK) return;
    finished = true;
    if (typeof K.complete === 'function') K.complete();
    K.refresh();
  } });

  // ---------- the worked example, a line at each press ----------
  const wbox = K.el('div', { class: 'wl' });
  const wl = WL.map((x) => { const box = K.el('div', { class: 'line' }); box.appendChild(write(K.el('p', { class: 'w' }), x.w)); wbox.appendChild(box); return box; });
  const wnotes = WK_NOTES.map((t) => wbox.appendChild(K.el('p', { class: 'sub' }, nb(t))));
  el('worked').appendChild(wbox);
  const nextLine = K.button({ label: 'Show', into: '#workedgo', press: () => {
    if (at() !== iWk || lines >= wl.length) return;
    const w = wl[lines]; lines += 1;
    w.classList.remove('enter'); void w.offsetWidth; w.classList.add('enter');
    K.refresh();
  } });

  // ---------- fixed words on their screens ----------
  el('warnFor').appendChild(K.el('p', { class: 'wh' }, 'If it is skipped'));
  el('warnFor').appendChild(K.el('p', null, nb(WARN_FOR)));
  el('noteC').textContent = nb(NOTE_C);
  el('noteT').textContent = nb(NOTE_T);

  function enter() { const b = el('stepbox'); b.classList.remove('enter'); void b.offsetWidth; b.classList.add('enter'); }
  const faded = {};
  function fade(node, key) {
    if (node.hidden) { faded[node.id] = ''; return; }
    if (faded[node.id] === key) return;
    faded[node.id] = key;
    node.classList.remove('fade'); void node.offsetWidth; node.classList.add('fade');
  }
  function paintFb(f) {
    const fb = el('fb');
    fb.textContent = '';
    fb.hidden = !f;
    if (!f) return;
    fb.className = 'fb ' + (f.ok ? 'ok' : 'bad');
    fb.appendChild(K.el('p', { class: 'v' }, f.v));
    if (f.p0) fb.appendChild(write(K.el('p'), f.p0));
    (f.w || []).forEach((t) => fb.appendChild(write(K.el('p', { class: 'w' }), t)));
    if (f.p) fb.appendChild(write(K.el('p'), f.p));
  }

  // ---------- nav ----------
  const backBtn = K.button({ label: 'Back', secondary: true, into: '#nav', press: () => { if (at() > 0) stepper.set(at() - 1); } });
  const nextBtn = K.button({ label: 'Continue', into: '#nav', press: () => { const i = at(); if (canGo(i) && i < iK) stepper.set(i + 1); } });
  function canGo(i) {
    const d = STEPS[i], st = S[i];
    if (d.show) return true;
    if (i === iR) return st.res === 'wrong';
    if (i === iChk) return st.res === 'right';
    if (ANS[i]) return st.res === 'right' || st.shown;
    if (i === iB1) return !!(wB1 && wB1.answered && wB1.answered());
    return false;
  }

  const ON = { scen: [i3A, i3B, i3C], carry3b: [i3B], carry3c: [i3C], pre: [i3A, i3B, i3C],
    wrapX: [iFor], warnFor: [iFor],
    noteC: [iWhy], wrapC: [iWhy], ctlC: [iWhy], outsC: [iWhy], outsC2: [iWhy], refC: [iWhy], sayC: [iWhy], capC: [iWhy],
    noteT: [iTemp], wrapT: [iTemp], ctlT: [iTemp], outsT: [iTemp], sayT: [iTemp], disc: [iDis],
    worked: [iWk], workedgo: [iWk], picks: [iR, iChk],
    'ans-3a': [i3A], 'ans-3b': [i3B], 'ans-3c': [i3C], 'ans-ch': [iCh], wr1: [iB1], keep: [iK], fin: [iK] };
  const ASK = {
    [iWhy]: 'Step from Dry to Wet.',
    [iTemp]: 'Drag the temperature from 20 °C up to 40 °C.',
    [iWk]: 'Work each line yourself first, then press Show.',
  };

  K.update((p) => {
    const i = at(), d = STEPS[i], st = S[i];
    if (i !== lastStep) { if (lastStep !== -1) enter(); lastStep = i; if (i === i3A || i === i3B || i === i3C) scen.el.open = i === i3A; }
    Object.keys(ON).forEach((id) => { el(id).hidden = ON[id].indexOf(i) < 0; });
    el('cap').hidden = WORKING.indexOf(i) < 0;

    el('count').textContent = 'Step ' + (i + 1) + ' of ' + STEPS.length + ' · ' + d.label;
    paras(el('pre'), d.pre || '');
    const task = el('task');
    task.className = 'task' + (d.show ? ' show' : '');
    if (d.show) paras(task, d.text, d.terms);
    else write(task, d.part || (d.kind ? '' : d.task));
    task.hidden = !task.textContent;
    const sub = el('sub');
    sub.className = 'sub' + (ASK[i] ? ' ask' : '');
    sub.textContent = nb(ASK[i] ? ASK[i]
      : i === i3A || i === i3B || i === iCh ? (i === iCh ? 'Same method, new numbers. These are practice values. ' : '') + 'Give it to 2 places. A ratio has no unit.'
      : i === i3C ? 'Give it in minutes.'
      : i === iDis ? KV + ' kV and ' + fC1.text + ' are practice values.'
      : i === iB1 ? markLine('b1')
      : i === iK ? 'One card to come back to on a real job.' : '');
    sub.hidden = !sub.textContent;

    drawCurves(p);
    drawTemp(p);
    el('refC').hidden = el('refC').hidden || !el('refC').textContent;
    const fk = i === iFor ? 'F' : i === iWhy ? 'W' + si(p.ins) : '';
    if (fk && fk !== flowKey && !stillMode) {
      if (i === iFor) flowLeft = 4; else { sweepPos = 0; fadeT = 0; }
      if (!anim.playing()) anim.play();
    }
    flowKey = fk;

    // Picks.
    const opts = d.opts || [];
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      b.setLabel(nb(opts[k]));
      const done = st.res === 'right' || (i === iR && st.res === 'wrong');
      b.el.classList.toggle('is-right', done && opts[k] === d.want);
      b.el.classList.toggle('is-wrong', st.res === 'wrong' && opts[k] === st.pick);
      b.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });

    // The worked example's lines, and the notes once they are all shown.
    wl.forEach((w, k) => { w.hidden = k >= lines; });
    wnotes.forEach((n) => { n.hidden = lines < wl.length; });
    nextLine.el.hidden = lines >= wl.length;
    if (i === iWk) el('workedgo').hidden = lines >= wl.length;

    // Check, the feedback, and what follows a finished typed answer.
    const typed = !!ANS[i], typedDone = typed && (st.res === 'right' || st.shown);
    checkBtn.el.hidden = !typed || typedDone;
    el('acts').hidden = checkBtn.el.hidden;
    paintFb(st.fb);
    const after = el('after');
    paras(after, typedDone ? SPEC[i].after : '');
    after.hidden = !after.textContent;
    el('go').hidden = !(i === iR && st.res === 'right');
    [['fb', JSON.stringify(st.fb)], ['after', i + after.textContent], ['go', String(i)]].forEach(([id, key]) => fade(el(id), key));

    el('donefb').textContent = finished && i === iK ? 'Lesson finished. Back is there whenever you want another look.' : '';
    el('donefb').hidden = !el('donefb').textContent;

    backBtn.el.hidden = i === 0;
    nextBtn.el.hidden = i === iK || !canGo(i) || (i === iR && st.res === 'right');
    el('nav').hidden = backBtn.el.hidden && nextBtn.el.hidden;
  });

  // ---------- known answers, worked out by hand ----------
  const near = (a, b, t) => K.near(a, b, t == null ? 1e-6 : t);
  K.check('Dry 18.1, 24.1, 64.0 GΩ (DAR 1.33, PI 2.66); damp 7.16, 7.94, 10.00 (1.11, 1.26); wet 2.19, 2.26, 2.40 (1.03, 1.06)', () =>
    [[DRY, '18.1', '24.1', '64.0', 1.33, 2.66], [DAMP, '7.16', '7.94', '10.00', 1.11, 1.26], [WET, '2.19', '2.26', '2.40', 1.03, 1.06]].every((q) =>
      fmtR(q[0].a) === q[1] && fmtR(q[0].b) === q[2] && fmtR(q[0].c) === q[3] && near(q[0].dar, q[4]) && near(q[0].pi, q[5]))
    && near(K.at({ ins: 2 }).pi, 1.06) && near(K.at({ ins: 0 }).dar, 1.33));
  K.check('Leakage 78, 500 and 2083 nA; absorption 199 nA at 30 s, 129 nA at 1 minute and under 0.1 nA at 10 minutes', () =>
    Math.round(DRY.leak) === 78 && Math.round(DAMP.leak) === 500 && Math.round(WET.leak) === 2083
    && Math.round(absOf(30)) === 199 && Math.round(absOf(60)) === 129 && absOf(600) < 0.1);
  K.check('Every setting clears 1 GΩ at 1 minute, and each wetter setting gives a lower DAR and PI', () =>
    [0, 1, 2].every((s) => K.at({ ins: s }).r60 > CRIT) && K.at({ ins: 0 }).pi > K.at({ ins: 1 }).pi && K.at({ ins: 1 }).pi > K.at({ ins: 2 }).pi
    && K.at({ ins: 0 }).dar > K.at({ ins: 1 }).dar && K.at({ ins: 1 }).dar > K.at({ ins: 2 }).dar);
  K.check('A sound core reads 96.4 and 256.0 GΩ at 0 °C, 42.0 and 111.4 at 12 °C, 6.0 and 16.0 at 40 °C, and its PI is 2.66 at every temperature', () => {
    for (let t = 0; t <= 40; t++) if (!near(K.at({ temp: t }).piT, 2.66)) return false;
    const T = (t) => K.at({ temp: t });
    return f1(T(0).r1t) === '96.4' && f1(T(0).r10t) === '256.0' && f1(T(10).r1t) === '48.2' && f1(T(12).r1t) === '42.0' && f1(T(12).r10t) === '111.4'
      && f1(T(30).r1t) === '12.1' && f1(T(30).r10t) === '32.0' && f1(T(40).r1t) === '6.0' && f1(T(40).r10t) === '16.0';
  });
  K.check('Recall 3.00 (slips 0.33 and 4.0); check X 1.07 and Y 3.00; L1 PI 2.58, DAR 1.33; L2 PI 1.09, DAR 1.05; L3 PI 2.61, DAR 1.31; changed numbers 1.20', () => {
    const v = (i, k) => IR[i][k].value;
    return near(r2(RC.r10 / RC.r1), fRec.value) && near(r2(RC.r1 / RC.r10), fS1.value) && near(RC.r10 - RC.r1, fS2.value)
      && near(r2(CX.x10 / CX.r1), fX.value) && near(r2(CX.y10 / CX.r1), fY.value)
      && near(r2(v(1, 2) / v(1, 1)), f3a.value) && near(r2(v(1, 1) / v(1, 0)), fL1D.value) && near(r2(v(1, 1) / v(1, 2)), F('3a.slip').value) && near(v(1, 2) - v(1, 1), F('3a.slip2').value)
      && near(r2(v(2, 2) / v(2, 1)), f3b.value) && near(r2(v(2, 1) / v(2, 0)), fL2D.value) && near(r2(v(2, 1) / v(2, 2)), F('3b.slip').value) && near(r2(v(2, 2) - v(2, 1)), F('3b.slip2').value)
      && near(r2(v(3, 2) / v(3, 1)), fL3P.value) && near(r2(v(3, 1) / v(3, 0)), fL3D.value)
      && near(r2(CH.r10 / CH.r1), fChg.value) && near(r2(CH.r1 / CH.r10), F('l3.changed.slip').value) && near(r1(CH.r10 - CH.r1), F('l3.changed.slip2').value);
  });
  K.check('One core of 0.528 µF at 5 kV holds 2.64 mC and 6.60 J; 3(c) is 5 × 10 = 50 min, with slips 10 and 40 min', () =>
    near(fC1.value * 1e-6 * VOLTS * 1000, fQ.value) && near(0.5 * fC1.value * 1e-6 * VOLTS * VOLTS, fE.value)
    && near(FIVE * PIMIN, f3c.value) && near(PIMIN, F('3c.slip').value) && near(OLD * PIMIN, F('3c.slip2').value));
  K.check('The charging current falls under 10 000 nA within 15 s, long before the first reading at 30 s', () => chgOf(15) < 10000 && chgOf(0) > 10000);
  K.check('Every slip lies outside its answer\'s accepted figures', () => Object.keys(SPEC).every((k) => {
    const sp = SPEC[k], tol = sp.dec ? 0.005 : 0.5;
    return sp.slips.every((s) => Math.abs(s.value - sp.fig.value) > tol && sp.accept.every((x) => Math.abs(s.value - x) > tol));
  }));
  K.check('For every 10 °C increase in temperature, halve the resistance; for every 10 °C decrease, double it', () =>
    near(K.at({ temp: 30 }).r1t, K.at({ temp: 20 }).r1t / 2) && near(K.at({ temp: 10 }).r10t, K.at({ temp: 20 }).r10t * 2),
    { source: 'https://www.megger.com/en-us/blog/august-2019/can-we-beat-the-heat-%281%29' });
  K.check('After a 10-minute PI test, allow the unit to discharge for 50 minutes', () => near(FIVE * PIMIN, 50) && near(f3c.value, 50),
    { source: 'https://res.cloudinary.com/iwh/image/upload/q_auto%2Cg_center/assets/1/26/Megger_-_Testing_Above_1kV_Insulation_Guide.pdf' });
  K.check('DAR: under 1.25 inadequate, 1.25 to 1.6 satisfactory, over 1.6 excellent', () =>
    darBand(1.24) === 'inadequate' && darBand(1.25) === 'satisfactory' && darBand(1.6) === 'satisfactory' && darBand(1.61) === 'excellent', { source: 'material:notes#p9' });
  K.check('PI: under 1 poor, 1 to 2 questionable, 2 to 4 okay, over 4 good', () =>
    piBand(0.99) === 'poor' && piBand(1) === 'questionable' && piBand(1.99) === 'questionable' && piBand(2) === 'okay' && piBand(4) === 'okay' && piBand(4.01) === 'good',
    { source: 'material:notes#p9' });
  K.check('If the insulation is in good condition, the PI will be 2.0 or higher: L3\'s 2.61 clears it', () => MAKER_PI === 2 && fL3P.value >= MAKER_PI,
    { source: 'https://www.megger.com/en/et-online/june-2019/q-a-insulation-resistance-testing' });
  K.check('Typically the DAR will be 1.4 or higher in good condition: L3\'s 1.31 falls short', () => MAKER_DAR === 1.4 && fL3D.value < MAKER_DAR,
    { source: 'https://www.megger.com/en/et-online/june-2019/q-a-insulation-resistance-testing' });
  K.check('The PI test is not recommended as an assessment tool above 5000 MΩ at 1 minute: L3 reads 23 000 MΩ', () => IEEE_MOHM === 5000 && IR[3][1].value * 1000 > IEEE_MOHM,
    { source: 'https://www.aemc.com/userfiles/files/resources/webinars/Insulation_Testing_Quick_Reference_Guide.pdf' });

  K.ready();
</script>
