  .scene .l-xlpe { fill: var(--k-panel); stroke: var(--k-strong); stroke-width: .6; }
  .scene .l-scr { fill: var(--k-muted); stroke: var(--k-strong); stroke-width: .6; }
  .scene .l-foil { fill: var(--k-line); stroke: var(--k-strong); stroke-width: .6; }
  .scene .l-over { fill: var(--k-fill3); stroke: var(--k-strong); stroke-width: .6; }
  .scene circle.lit { fill: var(--k-fill2); stroke: var(--k-amber-line); stroke-width: 1.2; }
  .scene .lead { stroke: var(--k-muted); stroke-width: 1; }

  .picks { display: flex; flex-direction: column; gap: 10px; }

  .picks .k-btn.is-right { border-color: var(--k-good); color: var(--k-good); box-shadow: inset 0 0 0 1px var(--k-good); }

  .fb { padding: 12px 14px; border-radius: 12px; background: var(--k-panel); border: 1.5px solid var(--k-line); line-height: 1.5; }
  .fb.ok { box-shadow: inset 4px 0 0 var(--k-good); }
  .fb.bad { box-shadow: inset 4px 0 0 var(--k-warn); }
  .fb > * + * { margin-top: 6px; }
  .fb .v { font-weight: 700; font-size: 1.05rem; }

  #stepbox.enter, .wl .line.enter, .fade { animation: screen-in .35s ease-out both; }
  @keyframes screen-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) { #stepbox.enter, .wl .line.enter, .fade { animation: none; } }

<p class="caption" id="cap">Each line is worked from the rounded figures shown before it.</p>

<script>
  // ---------- rounding, the rule, and the course's figures ----------
  const r2 = (x) => Math.round(x * 100 + 1e-7) / 100;
  const r3 = (x) => Math.round(x * 1000 + 1e-6) / 1000;
  const f2 = (x) => r2(x).toFixed(2), f3 = (x) => r3(x).toFixed(3);
  const F = (id) => K.figure(id);
  const el = (id) => document.getElementById(id);
  const NB = ' ';
  // Non-breaking spaces: before an operator, inside 10 000, and between a number and its unit.
  const nb = (s) => String(s == null ? '' : s)
    .replace(/ ([×÷+=]) /g, NB + '$1 ')
    .replace(/(\d) (?=\d{3}(?!\d))/g, '$1' + NB)
    .replace(/(\d) (?=(?:µF|mA|kV|km|Hz|J|V|Ω|A)(?![A-Za-z]))/g, '$1' + NB);
  const k10 = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  const vis = (e, on) => { if (on) e.removeAttribute('display'); else e.setAttribute('display', 'none'); };
  const clamp01 = (x) => K.clamp(x, 0, 1);

  const fRec = F('l1.recall'), fWC = F('l1.wex.C'), fWE = F('l1.wex.E'), fWH = F('l1.wex.half');
  const f1a = F('1a'), f1b = F('1b'), fIch = F('l1.Ich'), fIchC = F('l1.Ich.check');
  const fCh = F('l1.changed'), fChE = F('l1.changed.E');
  const CPK = F('t.C66').value, ICH = F('t.Ich66').value, U0 = F('p.U0').value, LEN = F('p.len').value, VPK = F('p.induce').value;
  const BODY = F('n.body').value, FATAL = F('n.fatal').value;
  const V55 = 55, HZ = 50, WLEN = 0.8, LCH = 1.8, CREEP_SHARE = 0.35;
  // C = C per km × length (3 places); worst case off at the peak, E = ½ × C × (√2 × U0)² = C × U0² (2 places).
  const capAt = (len) => r3(CPK * len);
  const energyAt = (C) => r2(C * 1e-6 * Math.pow(U0 * 1000, 2));
  const halfAt = (C) => r2(0.5 * C * 1e-6 * Math.pow(U0 * 1000, 2));
  const root2At = (C) => r2(0.5 * C * 1e-6 * Math.pow(1.414 * U0 * 1000, 2));
  const snapKm = (v) => K.clamp(Math.round((+v || 0) * 5) / 5, 0.4, 2.4);

  // ---------- the lesson's words ----------
  const R_TASK = "String A is live in the same corridor. String B's cable from B01 to the OSS is isolated, and you have proved it dead at the OSS end. What must happen before anyone touches its cores?";
  const R_O1 = 'Nothing more: it has been proved dead', R_O2 = 'Discharge it, then apply earths at both ends', R_O3 = 'Open the isolator at B01 as well, then start';
  const R_WORK = 'Proved dead means no voltage at that moment. The core is still a capacitor, and String A can still induce a voltage on it. Discharging empties it. Earths at both ends hold it at earth while you work. The whole sequence is Identify, Isolated, Proved dead, Secured, Earthed.';
  const R_W1 = 'Proved dead is a snapshot. The core can still hold charge, regain it from its insulation, or pick it up from String A. It is safe to touch only once it is discharged and earthed.';
  const R_W3 = 'Isolating stops energy from the system. It does not stop String A inducing a voltage, or charge creeping back out of the insulation.';
  const FOR_TEXT = 'Every test after this one assumes a cable that cannot hurt you. Each test set also charges the cable. So the same discipline comes back at the end of every test.';
  const FIVE = [['Identify', 'the test points are known.'], ['Isolated', 'every energy source is disconnected.'], ['Proved dead', 'no voltage is verified.'],
    ['Secured', 'it is locked off and access is controlled.'], ['Earthed', 'earths are applied.']];
  const WARN1 = 'Four main things set how badly a shock hurts: voltage, resistance, path and duration. At ' + V55 + ' V your body is about ' + k10(BODY) + ' Ω. So ' + V55 + ' V drives ' + fRec.text + '. ' + FATAL + " mA or more is potentially fatal. Your body's resistance falls as the voltage rises. So a charged HV core drives far more current than that sum suggests.";
  const ARMOUR = 'In a three-core subsea cable, armour wraps all three cores. Some designs add a lead sheath.';
  const FOR_READ = "From the middle out, the core's layers are conductor, inner semi-con, XLPE, outer semi-con, metal screen, aluminium foil and oversheath. Core resistance checks the conductor. IR and VLF check the XLPE between conductor and screen. The sheath test checks the oversheath, screen to earth. TDR uses conductor and screen as a pair.";
  const WHY_TEXT = 'The conductor and the screen are two metal plates, with the XLPE between them. So every core is a capacitor. Capacitance grows with the area of the plates, so it grows with length. This cable has about ' + CPK + ' µF per km in each core.\n\n'
    + 'A charged core keeps its charge after it is disconnected. Its charge is Q = C × V. The energy it holds is E = ½ × C × V². An earth lets the charge flow away. A test also soaks charge into the insulation itself. That comes back out slowly. So a core earthed for a moment can build a voltage again.';
  const UNDER2 = 'Take the worst case in service: a core switched off at the peak of U0. U0 is its voltage between conductor and screen. The peak is √2 × U0, so E = ½ × C × (√2 × U0)² = C × U0².\n\nTake U0 as ' + U0 + ' kV, a practice value for String B.';
  const WHY_READ = 'A ' + f2(1) + ' km core holds ' + f3(capAt(1)) + ' µF. Switched off at the peak of U0, ' + U0 + ' kV, it could hold ' + f2(energyAt(capAt(1))) + ' J. A longer core holds more. An earth drains it to zero. Lift the earth too soon and some charge creeps back from the insulation.';
  const CREEP_LINE = 'It has recharged from the insulation. Earth it again and leave the earth on.';
  const C_TASK = 'A cable with no live neighbours has just had an insulation resistance test. You earth it for a moment, then lift the earth to connect the next lead. What can its core do?';
  const C_O1 = 'Stay at zero: the earth emptied it', C_O2 = 'Build a voltage again from charge in the insulation', C_O3 = 'Recharge only if its far end is still connected';
  const C_RIGHT = 'The earth empties the conductor quickly. Charge soaked into the insulation comes out slowly and builds a voltage again. So re-earth it, and keep the earth on until the next lead is connected.';
  const C_W1 = 'The earth empties the conductor, not the insulation. Its charge comes back out after the earth is lifted.';
  const C_W3 = 'Nothing outside is needed. The charge comes back out of the insulation itself.';
  const IND_TEXT = "String A runs live in the same corridor. Its load current sets up a magnetic field. Where the cables run side by side, that field induces a voltage along String B's core. It works the way a transformer's primary drives its secondary. No connection is needed.\n\n"
    + "The voltage grows with String A's current, how close the cables run and how far they run together. String A's voltage does not set it. The earthed screen keeps String A's electric field away from the core. So the magnetic coupling is the one that matters here.\n\n"
    + 'The induced voltage stands between the two ends of the core. Earth one end, and all of it appears at the other. Earth both ends, and it drives a current round through the earths instead.';
  const UNDER4 = 'Take ' + VPK + ' V per km as a practice value for String A at full load. It only gives the picture a number.';
  const WARN4 = 'A fault or switching on String A can push this far higher without warning. Earth both ends before anyone works on the cable.';
  const IND_READ = 'With only the OSS end earthed, the B01 end sits at the induced voltage. That is ' + Math.round(VPK * LEN) + ' V over ' + f2(LEN) + ' km, at the practice ' + VPK + ' V per km. Earth both ends and both are held at earth. A current circulates through the earths instead.';
  const WL = [
    { w: 'Your body at ' + V55 + ' V: I = V ÷ R = ' + fRec.work, post: 'That is under ' + FATAL + ' mA. But the ' + k10(BODY) + " Ω holds only near " + V55 + " V. At HV your body's resistance is lower." },
    { pre: 'Take a ' + f2(WLEN) + ' km core of this cable, a practice length.', w: 'C = ' + fWC.work },
    { pre: 'Its worst case, switched off at the peak of U0:', w: 'E = C × U0² = ' + fWE.work },
  ];
  const WK_NOTE = 'Leave out the peak and you get ½ × C × U0² = ' + fWH.text + ', half the worst case.';
  const WK_READ = 'At ' + V55 + ' V your body takes ' + V55 + ' ÷ ' + k10(BODY) + ' = ' + fRec.text + '. That is under ' + FATAL + ' mA, but the figure holds only near ' + V55 + ' V. A ' + f2(WLEN) + ' km core holds ' + fWC.work + '. At the peak of U0, ' + U0 + ' kV, it could hold ' + fWE.work + '.';
  const Q1A = '(a) Determine the capacitance of one core of String B, from B01 to the OSS.';
  const NOTE_1A = 'Take ' + CPK + " µF per km, a typical figure for this cable. On a real job, use the cable's own data sheet.";
  const AS_1B = 'Once String B is in service, it will be switched off for maintenance.';
  const Q1B = '(b) Determine the most energy one core could hold if it were switched off at the peak of its phase voltage. Take U0 as ' + U0 + ' kV, a practice value.';
  const Q_CH = 'Another core of the same cable runs ' + f2(LCH) + ' km. Take U0 as ' + U0 + ' kV. Determine the most energy it could hold if it were switched off at the peak of U0.';

  let lines = 0, chip = null, lastStep = -1, finished = false;
  const STEPS = [
    { name: 'Do you still have it?', label: 'Do you still have it?', task: R_TASK, opts: [R_O1, R_O2, R_O3], want: R_O2, why: R_WORK },
    { show: true, name: 'What it is for', label: 'What it is for', text: FOR_TEXT, read: FOR_READ,
      still: () => { chip = 'all'; K.refresh(); } },
    { show: true, name: 'The why', label: 'The why: a capacitor kilometres long', text: WHY_TEXT, terms: ['a capacitor', 'soaks charge into the insulation'], read: WHY_READ,
      still: () => creptStill() },
    { name: 'Check', label: 'Check', task: C_TASK, opts: [C_O1, C_O2, C_O3], want: C_O2, why: C_RIGHT },
    { show: true, name: 'The live string beside it', label: 'The live string beside it', text: IND_TEXT, terms: ['induces a voltage'], read: IND_READ,
      still: { run: 2.4, earths: 'OSS end only' } },
    { show: true, name: 'Worked example', label: 'Worked example: your body, then a core', text: '', read: WK_READ,
      still: () => { lines = WL.length; K.refresh(); } },
    { name: 'Section A 1(a)', label: 'Section A · Question 1', part: Q1A, task: Q1A + ' ' + NOTE_1A, want: f1a.text, why: 'C = ' + f1a.work },

  // Words with key terms in amber (the <mark> element), built with K.el, never innerHTML.
  function write(node, s, terms) {

      if (st.res === 'right') return;
      st.pick = d.opts[k];
      if (st.pick === d.want) { st.res = 'right'; st.fb = { ok: true, v: "That's it.", p0: C_RIGHT }; }
      else { st.res = 'wrong'; st.fb = { ok: false, v: 'Not quite.', p0: st.pick === C_O1 ? C_W1 : C_W3 }; }
    }
    K.refresh();
  }
  K.button({ label: 'Refresh the why', into: '#go', press: () => { if (at() === iR && S[iR].res === 'right') stepper.set(iFor); } });
  K.button({ label: 'Skip to the practice', secondary: true, into: '#go', press: () => { if (at() === iR && S[iR].res === 'right') stepper.set(i1A); } });

  // ---------- Section A: typed answers on the course's figures ----------
  const scen = K.scenario({ into: '#scen', open: true });
  K.carried({ parts: ['1a'], into: '#carry1b' });
  const C1A = capAt(LEN), CCH = capAt(LCH);
  const SPEC = {
    [i1A]: { id: '1a', fig: f1a, unit: 'µF', decimals: 3, accept: [],
      work: () => ['C = ' + f1a.work],
      slips: [
        { value: F('1a.slip3').value, hint: 'That is all three cores. Each core has its own screen, so each is a capacitor of its own.' },
        { value: CPK, hint: 'That is one km. Multiply by the ' + f2(LEN) + ' km run.' },
        { value: F('1a.slipDiv').value, hint: "Multiply the per-km figure by the length. Don't divide." },
      ],
      hint: 'Not quite. Multiply the per-km figure by the length of the run.',
      after: 'It agrees with the charging current. In service at ' + HZ + ' Hz, ' + fIch.work + ". This cable's charging current is typically " + ICH + ' A per km. ' + fIchC.work + '.' },
    [i1B]: { id: '1b', fig: f1b, unit: 'J', decimals: 2, accept: [root2At(C1A)],
      work: () => ['E = ½ × C × (√2 × U0)² = C × U0²', 'E = ' + f1b.work],
      slips: [
        { value: F('1b.slip').value, hint: 'That is ½ × C × U0². The peak is √2 × U0, and squaring √2 doubles the energy.' },
        { value: F('1b.slip2').value, hint: 'You left out the half in ½ × C × V².' },
      ],
      hint: 'Not quite. Use E = C × U0², with C in farads and U0 in volts.',
      after: 'That much energy can sit on a core that has been switched off and isolated. That is why the core is discharged and earthed before anyone touches it.' },
    [iCh]: { id: 'l1.changed.E', fig: fChE, unit: 'J', decimals: 2, accept: [root2At(CCH)],
      work: () => ['C = ' + fCh.work, 'E = ' + fChE.work],
      slips: [
        { value: F('l1.changed.slip1').value, hint: 'That leaves out the peak. Use C × U0².' },
        { value: F('l1.changed.slip2').value, hint: 'You left out the half.' },
        { value: f1b.value, hint: "That is String B's " + f2(LEN) + ' km. This core is ' + f2(LCH) + ' km.' },
      ],
      hint: 'Not quite. Work out C for this length first, then E = C × U0².',
      after: 'A shorter core has less capacitance, so it stores less. The discipline is the same.' },
  };
  const BOX = { [i1A]: '#ans-1a', [i1B]: '#ans-1b', [iCh]: '#ans-ch' };
  const ANS = {};
  Object.keys(SPEC).forEach((key) => {
    const i = +key, sp = SPEC[i];
    const a = K.answer({ id: sp.id, unit: sp.unit, answer: sp.fig.value, decimals: sp.decimals, accept: sp.accept, slips: sp.slips, into: BOX[i],
      onCheck: (r) => {
        const st = S[i];
        if (st.shown) return;
        if (r.state === 'right') {
          st.res = 'right';
          st.fb = { ok: true, v: 'Right.', w: sp.work(), p: r.accepted != null ? 'That rounds √2 to 1.414 first. Worked as C × U0², it is ' + sp.fig.text + '.' : '' };
        } else if (r.state === 'wrong') {
          st.tries += 1;
          if (st.tries >= 2) {
            st.shown = true; st.res = 'shown';
            st.fb = { ok: false, v: 'Here is the working.', p0: r.hint || '', w: sp.work() };
            a.reveal();
          } else { st.res = 'wrong'; st.fb = { ok: false, v: 'Not quite. One more go.', p0: r.hint || sp.hint }; }
        } else { st.res = r.state; st.fb = null; }
        K.refresh();
      } });
    ANS[i] = a;
  });
  const checkBtn = K.button({ label: 'Check', into: '#acts', press: () => { const a = ANS[at()]; if (a) a.check(); } });

  // ---------- Section B and Keep this ----------
  const WORDS = ['no', 'one', 'two', 'three', 'four', 'five', 'six', 'seven'];
  function markLine(id) {
    const w = K.lesson && K.lesson.written && K.lesson.written[id];
    const n = w && Array.isArray(w.points) ? w.points.length : 0, need = w ? +w.need : 0;
    return n && need ? 'You write the answer. It is marked against ' + (WORDS[n] || n) + ' points, and any ' + (WORDS[need] || need) + ' make a full answer. You get one more go, then the model answer.'
      : 'You write the answer, in your own words. You get one more go, then the model answer.';
  }
  const wB1 = K.written({ id: 'b1', into: '#wr1', onMark: () => K.refresh() });
  el('wr1').addEventListener('click', () => K.refresh());
  K.summary({ into: '#keep' });
  (function () {
    const tw = document.createTreeWalker(el('keep'), NodeFilter.SHOW_TEXT), ns = [];
    while (tw.nextNode()) ns.push(tw.currentNode);
    ns.forEach((n) => { n.nodeValue = nb(n.nodeValue); });
  })();
  K.button({ label: 'Finish the lesson', into: '#fin', press: () => {
    if (at() !== iK) return;
    finished = true;
    if (typeof K.complete === 'function') K.complete();
    K.refresh();
  } });

  // ---------- the worked example, a line at each press ----------
  const wbox = K.el('div', { class: 'wl' }, K.el('p', { class: 'k-label' }, 'Your body, then a ' + f2(WLEN) + ' km core'));
  const wl = WL.map((x) => {
    const box = K.el('div', { class: 'line' });
    if (x.pre) box.appendChild(K.el('p', null, nb(x.pre)));
    box.appendChild(K.el('p', { class: 'w' }, nb(x.w)));
    if (x.post) box.appendChild(K.el('p', { class: 'sub' }, nb(x.post)));
    wbox.appendChild(box);
    return box;
  });
  const wnote = K.el('p', { class: 'sub' }, nb(WK_NOTE));
  wbox.appendChild(wnote);
  el('worked').appendChild(wbox);
  const nextLine = K.button({ label: 'Show', into: '#workedgo', press: () => {
    if (at() !== iWk || lines >= wl.length) return;
    const w = wl[lines]; lines += 1;
    w.classList.remove('enter'); void w.offsetWidth; w.classList.add('enter');
    K.refresh();
  } });

  // ---------- fixed words on their screens ----------
  (function fixed() {
    FIVE.forEach(([h, t]) => el('five').appendChild(K.el('li', null, K.el('b', null, h), ': ' + t)));
    el('warn1').appendChild(K.el('p', { class: 'wh' }, 'If it is skipped'));
    el('warn1').appendChild(K.el('p', null, nb(WARN1)));
    el('armour').textContent = ARMOUR;
    el('qnote').textContent = nb(NOTE_1A);
    paras(el('under2'), UNDER2, ['the peak of U0']);
    paras(el('under4'), UNDER4);
    el('warn4').appendChild(K.el('p', null, WARN4));
  })();

  function enter() { const b = el('stepbox'); b.classList.remove('enter'); void b.offsetWidth; b.classList.add('enter'); }
  const faded = {};
  function fade(node, key) {
    if (node.hidden) { faded[node.id] = ''; return; }
    if (faded[node.id] === key) return;
    faded[node.id] = key;
    node.classList.remove('fade'); void node.offsetWidth; node.classList.add('fade');
  }
  function paintFb(f) {
    const fb = el('fb');
    fb.textContent = '';
    fb.hidden = !f;
    if (!f) return;
    fb.className = 'fb ' + (f.ok ? 'ok' : 'bad');
    fb.appendChild(K.el('p', { class: 'v' }, f.v));
    if (f.p0) fb.appendChild(K.el('p', null, nb(f.p0)));
    (f.w || []).forEach((t) => fb.appendChild(K.el('p', { class: 'w' }, nb(t))));
    if (f.p) fb.appendChild(K.el('p', null, nb(f.p)));
  }

  // ---------- nav ----------
  const backBtn = K.button({ label: 'Back', secondary: true, into: '#nav', press: () => { if (at() > 0) stepper.set(at() - 1); } });
  const nextBtn = K.button({ label: 'Continue', into: '#nav', press: () => { const i = at(); if (canGo(i) && i < iK) stepper.set(i + 1); } });
  function canGo(i) {
    const d = STEPS[i], st = S[i];
    if (d.show) return true;
    if (i === iR) return st.res === 'wrong';
    if (i === iChk) return st.res === 'right';
    if (ANS[i]) return st.res === 'right' || st.shown;
    if (i === iB1) return !!(wB1 && wB1.answered && wB1.answered());
    return false;
  }

  const ON = { scen: [i1A, i1B], carry1b: [i1B], assume: [i1B], qnote: [i1A],
    five: [iFor], warn1: [iFor], wrap1: [iFor], armour: [iFor], chips: [iFor], chipline: [iFor],
    wrap2: [iWhy], ctl2: [iWhy], ctl2b: [iWhy], ctl2c: [iWhy], outs2: [iWhy], say2: [iWhy], creep: [iWhy], under2: [iWhy],
    wrap4: [iInd], ctl4: [iInd], outs4: [iInd], say4: [iInd], under4: [iInd], warn4: [iInd],
    worked: [iWk], workedgo: [iWk], picks: [iR, iChk],
    'ans-1a': [i1A], 'ans-1b': [i1B], 'ans-ch': [iCh], wr1: [iB1], keep: [iK], fin: [iK] };

  K.update((p) => {
    const i = at(), d = STEPS[i], st = S[i];
    if (i !== lastStep) { if (lastStep !== -1) enter(); lastStep = i; if (i === i1A || i === i1B) scen.el.open = i === i1A; }
    Object.keys(ON).forEach((id) => { el(id).hidden = ON[id].indexOf(i) < 0; });
    el('cap').hidden = WORKING.indexOf(i) < 0;

    el('count').textContent = 'Step ' + (i + 1) + ' of ' + STEPS.length + ' · ' + d.label;
    paras(el('assume'), d.assume || '');
    const task = el('task');
    task.className = 'task' + (d.show ? ' show' : '');
    if (d.show) paras(task, d.text, d.terms);
    else write(task, d.part || (d.kind ? '' : d.task));
    task.hidden = !task.textContent;
    const sub = el('sub');
    sub.className = 'sub' + (i === iFor || i === iWhy || i === iInd || i === iWk ? ' ask' : '');
    sub.textContent = i === iFor ? 'Tap a test to light its layer.'
      : i === iWhy ? 'Press Switch off at the peak, close the earth, then open it again.'
      : i === iInd ? 'Drag the run shorter, then earth both ends.'
      : i === iWk ? 'Work each line yourself first, then press Show.'
      : i === i1A ? nb('Give it in µF, to 3 places.')
      : i === i1B ? 'Give it in joules.'
      : i === iB1 ? markLine('b1')
      : i === iCh ? 'Same method, new numbers. Give it in joules.'
      : i === iK ? 'One card to come back to on a real job.' : '';
    sub.hidden = !sub.textContent;

    drawXsec();
    drawCore(p);
    drawLine(p);
    if (i === iWhy && busy(sim, !!p.earth) && !coreAnim.playing()) coreAnim.play();
    if (i === iInd && !flowAnim.playing()) flowAnim.play();

    // Picks.
    const opts = d.opts || [];
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      b.setLabel(nb(opts[k]));
      const done = st.res === 'right' || (i === iR && st.res === 'wrong');
      b.el.classList.toggle('is-right', done && opts[k] === d.want);
      b.el.classList.toggle('is-wrong', st.res === 'wrong' && opts[k] === st.pick);
      b.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });

    // The worked example's lines, and the note once they are all shown.
    wl.forEach((w, k) => { w.hidden = k >= lines; });
    wnote.hidden = lines < wl.length;
    nextLine.el.hidden = lines >= wl.length;
    if (i === iWk) el('workedgo').hidden = lines >= wl.length;

    // Check, the feedback, and what follows a finished typed answer.
    const typed = !!ANS[i], typedDone = typed && (st.res === 'right' || st.shown);
    checkBtn.el.hidden = !typed || typedDone;
    el('acts').hidden = checkBtn.el.hidden;
    paintFb(st.fb);
    const after = el('after');
    paras(after, typedDone ? SPEC[i].after : '');
    after.hidden = !after.textContent;
    el('go').hidden = !(i === iR && st.res === 'right');
    [['fb', JSON.stringify(st.fb)], ['after', i + after.textContent], ['go', String(i)]].forEach(([id, key]) => fade(el(id), key));

    el('donefb').textContent = finished && i === iK ? 'Lesson finished. Back is there whenever you want another look.' : '';
    el('donefb').hidden = !el('donefb').textContent;

    backBtn.el.hidden = i === 0;
    nextBtn.el.hidden = i === iK || !canGo(i) || (i === iR && st.res === 'right');
    el('nav').hidden = backBtn.el.hidden && nextBtn.el.hidden;
  });

  // ---------- known answers, worked out by hand ----------
  const near = (a, b, t) => K.near(a, b, t == null ? 1e-9 : t);
  K.check('At 1.00 km a core holds 0.220 µF, and off at the peak of 38 kV, 317.68 J', () => {
    const o = K.at({ len: 1 });
    return near(o.C, 0.22) && near(o.E, 317.68) && near(o.E, F('l1.perkm').value);
  });
  K.check('At 0.40 km: 0.088 µF and 127.07 J. Over the whole 2.40 km: 0.528 µF and 762.43 J, parts 1a and 1b', () => {
    const a = K.at({ len: 0.4 }), b = K.at({ len: 2.4 });
    return near(a.C, 0.088) && near(a.E, 127.07) && near(b.C, f1a.value) && near(b.E, f1b.value) && near(C1A, f1a.value);
  });
  K.check('Capacitance and energy rise with every step in length, and twice the length holds twice the capacitance', () => {
    let prev = -1;
    for (let k = 2; k <= 12; k++) { const o = K.at({ len: k / 5 }); if (!(o.E > prev)) return false; prev = o.E; }
    return near(K.at({ len: 2.4 }).C, 2 * K.at({ len: 1.2 }).C);
  });
  K.check('Off at the peak, ½ × C × (√2 × U0)² equals C × U0², twice ½ × C × U0²', () => {
    const C = 0.528e-6, U = 38000;
    return near(0.5 * C * Math.pow(Math.SQRT2 * U, 2), C * U * U, 1e-6) && near(f1b.value, 2 * F('1b.slip').value, 0.02);
  });
  K.check('One end earthed: 96 V at the B01 end over 2.40 km, 16 V over 0.40 km. Both ends earthed: 0 V', () =>
    near(K.at({ run: 2.4, earths: 'OSS end only' }).V, F('l1.induced').value) && near(K.at({ run: 0.4 }).V, F('l1.induced.short').value)
    && K.at({ run: 2.4, earths: 'Both ends' }).V === 0 && K.at({ run: 0.4, earths: 'Both ends' }).V === 0);
  K.check('Earthed then lifted at once, the core creeps back up from the XLPE. Left earthed long enough, it stays at zero', () => {
    const go = (s, secs, earth) => { for (let t = 0; t < secs; t += 1 / 30) tick(s, 1 / 30, earth); };
    const a = freshSim(); charge(a); go(a, 2, false); const full = plateLevel(a) + creepLevel(a, 5);
    go(a, 2.5, true); const low = plateLevel(a) + creepLevel(a, 5);
    go(a, 5, false); const back = plateLevel(a) + creepLevel(a, 5);
    const b = freshSim(); charge(b); go(b, 2, false); go(b, 12, true); go(b, 5, false);
    const stay = plateLevel(b) + creepLevel(b, 5);
    return near(full, 1) && low < 1e-9 && back > 0.15 && back <= CREEP_SHARE && stay < 1e-9;
  });
  K.check('The worked example: 5.50 mA at 55 V, under 50 mA; 0.176 µF and 254.14 J at 0.80 km; 127.07 J with the peak left out', () =>
    near(r2(V55 / BODY * 1000), fRec.value) && fRec.value < FATAL && near(capAt(WLEN), fWC.value) && near(energyAt(capAt(WLEN)), fWE.value) && near(halfAt(capAt(WLEN)), fWH.value));
  K.check('The charging current agrees: 2π × 50 × 0.528 µF × 38 kV = 6.30 A, and 2.6 × 2.40 = 6.24 A', () =>
    near(r2(2 * Math.PI * HZ * f1a.value * 1e-6 * U0 * 1000), fIch.value) && near(r2(ICH * LEN), fIchC.value));
  K.check('Slips: 1.584 µF for three cores, 10.91 for 2.40 ÷ 0.22, 381.22 J and 1524.86 J. Changed numbers: 0.396 µF and 571.82 J, slips 285.91 J and 1143.65 J', () =>
    near(r3(3 * C1A), F('1a.slip3').value) && near(r2(LEN / CPK), F('1a.slipDiv').value) && near(halfAt(C1A), F('1b.slip').value) && near(r2(2 * energyAt(C1A)), F('1b.slip2').value, 0.011)
    && near(CCH, fCh.value) && near(energyAt(CCH), fChE.value) && near(halfAt(CCH), F('l1.changed.slip1').value) && near(r2(2 * energyAt(CCH)), F('l1.changed.slip2').value, 0.011));
  K.check('Every slip lies outside its answer\'s accepted figures', () => Object.keys(SPEC).every((k) => {
    const sp = SPEC[k], tol = 0.5 * Math.pow(10, -sp.decimals);
    return sp.slips.every((s) => Math.abs(s.value - sp.fig.value) > tol && sp.accept.every((x) => Math.abs(s.value - x) > tol));
  }));
  K.check('The 240 mm² row of the 66 kV three-core table: 0.22 µF per km and 2.6 A per km', () => CPK === 0.22 && ICH === 2.6,
    { source: 'https://new.abb.com/docs/default-source/ewea-doc/xlpe-submarine-cable-systems-2gm5007.pdf' });
  K.check('The induced voltage depends on the source current, the distance between the systems and the length of parallelism', () =>
    K.at({ run: 2.4 }).V > K.at({ run: 1.2 }).V && K.at({ run: 1.2 }).V > K.at({ run: 0.4 }).V,
    { source: 'https://electra.cigre.org/310-june-2020/technical-brochures/guidelines-for-safe-work-on-cable-systems-under-induced-voltages-or-currents.html' });
  K.check('Body natural resistance about 10,000 Ω at 55 V', () => BODY === 10000 && V55 === 55, { source: 'material:notes#p1' });

  K.ready();
</script>
