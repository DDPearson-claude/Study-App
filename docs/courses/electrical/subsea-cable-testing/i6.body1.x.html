<p class="caption" id="cap">Each line is worked from the rounded figures shown before it.</p>

<script>
  // ---------- rounding, helpers and the course's figures ----------
  const rnd = (x, d) => { const k = Math.pow(10, d); return Math.sign(x) * Math.round(Math.abs(x) * k + 1e-7) / k; };
  const r1 = (x) => rnd(x, 1), r2 = (x) => rnd(x, 2), r3 = (x) => rnd(x, 3);
  const f1 = (x) => r1(x).toFixed(1);
  const f2 = (x) => r2(x).toFixed(2);
  const sg2 = (x) => { const v = r2(x); return (v < 0 ? '−' : '') + Math.abs(v).toFixed(2); };
  const F = (id) => K.figure(id);
  const el = (id) => document.getElementById(id);
  const NB = ' ';
  // Non-breaking spaces: before an operator, and between a number and its unit.
  const nb = (s) => String(s == null ? '' : s)
    .replace(/ ([×÷+=−]) /g, NB + '$1 ')
    .replace(/(\d) (?=(?:m\/µs|µs|µF|kV|km|Ω|m|V)(?![A-Za-z]))/g, '$1' + NB);
  const str = (s, re) => { const m = re.exec(String(s || '')); return m ? m[1] : ''; };
  const fx = (v) => (+v).toFixed(1);
  function txt(parent, x, y, s, cls, anchor) {
    const t = parent.appendChild(K.svg('text', { x: fx(x), y: fx(y), class: cls || 'lb', 'text-anchor': anchor || 'start' }));
    t.textContent = s;
    return t;
  }
  const WORDS = ['no', 'one', 'two', 'three', 'four', 'five', 'six', 'seven'];

  // String B and L2's test, from the case file.
  const fLen = F('p.len'), LEN_KM = fLen.value, LEN_M = Math.round(LEN_KM * 1000);
  const fJoint = F('p.joint'), JOINT = fJoint.value;
  const fTEnd = F('p.tEnd'), T_END = fTEnd.value, T_END_S = str(fTEnd.text, /^([\d.]+)/);
  const fTFault = F('p.tFault'), T_FAULT = fTFault.value;
  const fRf = F('p.Rf'), RF0 = fRf.value;
  const fZ0 = F('p.Z0'), Z0 = fZ0.value;
  const CKM = F('t.C66').value;
  const C_S = str(F('t.c').text, /^([\d.]+)/), C_LIGHT = +C_S;
  const XLm = /([\d.]+) to ([\d.]+) \(([\d.]+) to ([\d.]+)/.exec(String(F('t.vfXLPE').text)) || [];
  const VF_LO = +XLm[1], VF_HI = +XLm[2], V_LO = +XLm[3], V_HI = +XLm[4];
  const PULSE_V = F('n.tdrPulse').value, LIMIT = F('n.tdrLimit').value;
  const W = F('p.pulseW').value, JR = F('p.jointRipple').value;
  const f6a = F('6a'), V_B = f6a.value, f6b = F('6b'), f6c = F('6c');
  const fVF = F('l6.VF'), fV2 = F('l6.v2'), fJt = F('l6.joint.t'), fAcc = F('l6.acc'), fB01 = F('l6.B01.t'), fBoth = F('l6.both');
  const ZONE = +str(fAcc.work, /^([\d.]+)/);
  const fRatio = F('l6.ratio');
  const fRec = F('l6.recall'), fRs1 = F('l6.recall.slip1'), fRs2 = F('l6.recall.slip2');
  const R_T = str(fRec.work, /^([\d.]+)/), R_V = str(fRec.work, /×\s*([\d.]+)/), R_VH = str(fRs2.work, /×\s*([\d.]+)/);
  const fWex = F('l6.wex'), WEX_F = +str(fWex.work, /^([\d.]+)/), WEX_L = +str(fWex.work, /×\s*([\d.]+)/);
  const WEX_PCT = Math.round(WEX_F * 100), WEX_KM = WEX_L / 1000;
  const fChg = F('l6.changed'), CH_T = str(fChg.work, /^([\d.]+)/), CH_V = str(fChg.work, /×\s*([\d.]+)/);
  const fS6b = F('6b.slip'), V_DEF = +str(fS6b.work, /×\s*([\d.]+)/);
  // The picture's ranges, from the lesson: 0 to 30 µs, 1 to 1000 Ω, 152 to 188 m/µs.
  const T_AX = 30, RF_MAX = 1000, V_MIN = 152, V_MAX = 188, D_AX = 2800;

  // ---------- the rule ----------
  // The fault sits across the line, in parallel with the cable beyond it.
  const zAt = (rf) => rf * Z0 / (rf + Z0);
  const rhoAt = (rf) => -Z0 / (2 * rf + Z0);
  const passAt = (rf) => 1 + rhoAt(rf);
  // The end and the joint come back through the fault twice: (1 + ρ) × (1 + ρ) of their height.
  const endH = (far, rf) => (far === 'open' ? 1 : -1) * Math.pow(passAt(rf), 2);
  const distAt = (t, v) => t * v / 2;
  const T_J = 2 * JOINT / V_B;
  const hump = (t, t0, w) => (t > t0 && t < t0 + w ? Math.pow(Math.sin(Math.PI * (t - t0) / w), 2) : 0);
  function traceAt(t, far, rf) {
    const r = rhoAt(rf), p2 = Math.pow(1 + r, 2);
    return hump(t, 0, W) + r * hump(t, T_FAULT, W)
      + JR * p2 * (hump(t, T_J, W / 2) - hump(t, T_J + W / 2, W / 2)) + endH(far, rf) * hump(t, T_END, W);
  }
  const fmtZ = (v) => (v < 1 ? f2(v) : f1(v)) + ' Ω';
  const fmtM = (v) => f1(v) + ' m';

  // ---------- the lesson's words ----------
  const O1 = fRs2.text, O2 = fRec.text, O3 = fRs1.text;
  const R_TASK = 'A reflection comes back after ' + R_T + ' µs. The velocity is set at ' + R_V + ' m/µs. How far away is the reflection?';
  const R_WORK = 'L = t × v ÷ 2 = ' + fRec.work + '.';
  const R_HALF = 'The time covers the trip there and back, so you halve it.';
  const R_SLIPS = 'The ' + O3 + ' answer leaves out the ÷ 2. The ' + O1 + ' answer puts in half the velocity and then halves again.';
  const R_W1 = 'That uses ' + R_VH + ', half the velocity, and then halves again. Some sets ask for the velocity as v/2. The formula takes the whole v.';
  const R_W3 = 'That leaves out the ÷ 2. The pulse goes out and comes back, so the time covers the distance twice.';

  const FOR_TEXT = "A TDR sends a short pulse down a core and its screen, and times what comes back. It needs two conductors running side by side. "
    + "Here they are the core and its own screen. From the echoes it gives the cable's length, where its joints are, and where a low-resistance fault, "
    + 'a break or water is. It draws a map of the cable.\n\n'
    + "The map recorded at commissioning is the cable's fingerprint. Later traces are compared with it. "
    + 'A joint shows on a trace much like a small fault, so its place must be known in advance.\n\n'
    + 'The TDR goes on a dead cable only. The cable is isolated, discharged and earthed at both ends, as for every test. '
    + 'There is a technician at each end. The pulse is a low voltage, a fixed ' + PULSE_V + ' V on some sets. The level depends on the set.';
  const WARN_FOR = 'Skip it, and all you know is that L2 has a fault somewhere in ' + fLen.text + ' of cable on the seabed.';

  const WHY_R = 'The pulse sees the cable as an impedance of its own. The cable\'s inductance and capacitance per metre set it. '
    + 'That is the characteristic impedance, Z0. While Z0 stays the same, the pulse runs on and nothing comes back. '
    + 'Where the impedance changes, part of the pulse reflects. The share that comes back is ρ = (Z load − Z0) ÷ (Z load + Z0). '
    + 'An open end is an infinite impedance, so ρ = +1. The whole pulse comes back the right way up. '
    + 'A short is zero impedance, so ρ = −1. The whole pulse comes back upside down.\n\n'
    + 'So a reflection pointing up means the impedance rose. One pointing down means it fell. '
    + "At a joint the cable's build changes for a short length. The impedance changes and then changes back. "
    + 'So a joint shows as a small up then a small down.\n\n'
    + 'A fault from core to screen sits across the line. At the fault the pulse sees two paths in parallel: the fault, and the cable beyond it. '
    + 'Two resistances in parallel give less than either. So the impedance falls, and the reflection points down. '
    + "Call the fault's resistance Rf. Put the parallel pair into the rule, and it becomes ρ = −Z0 ÷ (2 Rf + Z0). "
    + 'The higher Rf, the less it pulls the impedance down. So the dip is smaller. '
    + "Take String B's Z0 as " + fZ0.text + ". It is worked from the cable's velocity and its " + CKM + ' µF/km. So it is a practice value. '
    + 'On a real cable, get it from the maker or measure it.';
  const READ_R = 'With the far end linked, the end of the cable shows as a downward peak, like a short. Open it, and the end flips to an upward peak. '
    + "The fault's dip at " + fTFault.text + ' points down either way. So the reflection that flips is the end. '
    + "As the fault resistance rises, the impedance at the fault climbs back towards the cable's " + fZ0.text + '. So its dip shrinks. '
    + 'It is ' + f2(-rhoAt(RF0)) + ' of the pulse at ' + RF0 + ' Ω, ' + f2(-rhoAt(LIMIT)) + ' at ' + LIMIT + ' Ω and ' + f2(-rhoAt(RF_MAX)) + ' at ' + RF_MAX + ' Ω. '
    + 'At ' + RF_MAX + ' Ω the trace looks like healthy cable.';
  const SHAPES = [
    { d: 'M6 26H40L46 40L52 26C64 26 66 12 80 12C94 12 96 26 108 26H134', t: 'Down then a broad hump: a T joint.' },
    { d: 'M6 26H36L42 10L48 26H70L76 42L82 26H134', t: 'Up then a dip: a bridge tap.' },
    { d: 'M6 26H58L62 6L66 46L70 26H134', t: 'A sharp up-down spike: a wet splice.' },
    { d: 'M6 26H50L54 22L58 31L62 19L66 33L70 21L74 30L78 18L82 34L86 23L90 29L94 20L98 32L102 24L106 30L110 22L114 31L118 25L122 29L126 24L130 28L134 26',
      t: 'A ragged, noisy tail: water getting in.' },
  ];
  const LIM_TEXT = 'TDR finds faults under about ' + LIMIT + ' Ω. Above that, a low-voltage pulse will likely not see the fault. '
    + 'A high-resistance fault needs other methods. One is arc reflection. A high-voltage surge strikes an arc at the fault. '
    + 'The arc shows on the trace like a short. That is HV work, with its own kit and procedure.';

  const WHY_V = 'The TDR measures time. It turns time into distance with the velocity you give it. '
    + 'The pulse goes out and comes back. So the time covers the distance twice: L = t × v ÷ 2.\n\n'
    + 'The velocity is often given as a velocity factor, VF = v ÷ c. Here c is the speed of light, ' + C_S + ' m/µs. '
    + "The velocity factor is 1 ÷ the square root of the insulation's relative permittivity. So the insulation sets the velocity, not the copper. "
    + 'Power XLPE typically runs at ' + VF_LO + ' to ' + VF_HI + ', which is ' + V_LO + ' to ' + V_HI + ' m/µs. '
    + 'Cables differ. So a typical figure is only a starting point.\n\n'
    + 'Every distance is its time × v ÷ 2. So a wrong velocity stretches all of them by the same fraction. '
    + 'It never moves one reflection past another. So set the velocity on a length you know. '
    + "Open the far end, read the end's time, and move the velocity until the end reads the known length.";
  const READ_V = 'At the default ' + V_DEF + ' m/µs, the end reads ' + fmtM(distAt(T_END, V_DEF)) + '. That is short of the known ' + LEN_M + ' m. '
    + 'The fault reads ' + fmtM(distAt(T_FAULT, V_DEF)) + '. The whole trace stretches as the velocity rises. '
    + 'At ' + V_B + ' m/µs the end reads ' + fmtM(distAt(T_END, V_B)) + '. That is the known length, to within the rounding of ' + fTEnd.text + '. '
    + 'The fault then reads ' + fmtM(distAt(T_FAULT, V_B)) + '. It stays ' + fRatio.text + ' of the way along at every setting.';

  const C_TASK = "From the OSS, L2's trace shows a downward peak at " + fTFault.text + '. It stays down when the far end is opened. What is it?';
  const C_O1 = 'The end of the cable', C_O2 = 'A low-resistance fault from core to screen', C_O3 = 'The field joint';
  const C_RIGHT = 'It points down, so the impedance fell there. It did not flip when the far end opened, so it is not the end. '
    + 'The joint at ' + fJoint.text + ' would show at ' + fJt.work + ', as a small up then down.';
  const C_W1 = 'The end flips when you open the far end. This peak stayed down, so it is somewhere along the cable.';
  const C_W3 = "A joint shows as a small up then a small down, not a deep dip. String B's joint is at " + fJoint.text + ', so it would show at ' + fJt.text + '.';

  const WK_HEAD = 'A ' + WEX_KM + ' km cable, with the velocity set ' + WEX_PCT + '% too high.';
  const WL = [
    { w: 'Set up on the dead cable. It is isolated, discharged and earthed at both ends. Lift the earth from the core under test at your end, under control. '
      + 'Red lead to the conductor, black to the screen.' },
    { w: 'First test with the far end linked, conductor to screen or to earth. Then the far end lifts the link, under control. '
      + 'Test again with it open. The reflection that flips is the end.' },
    { w: 'The rule: L = t × v ÷ 2. Each distance goes up in step with v.', calc: true },
    { w: 'So a velocity ' + WEX_PCT + '% high makes every distance read ' + WEX_PCT + '% long.', calc: true },
    { w: 'At the far end of a ' + WEX_KM + ' km cable: ' + fWex.work + ' out.', calc: true },
    { w: 'The cure: set v on the known length. With the far end open, v = 2L ÷ t.', calc: true },
    { w: 'When you finish, put the earths back on at both ends.' },
  ];
  const WK_READ = 'On a ' + WEX_KM + ' km cable, a velocity set ' + WEX_PCT + '% high puts the far end ' + fWex.work + ' out. '
    + 'Every other distance is ' + WEX_PCT + '% out too. Setting v on the known length removes the error, using v = 2L ÷ t.';

  const PRE_6A = 'L2 broke down in the VLF test and now reads ' + fRf.text + ' from core to screen. Every core is discharged and earthed at both ends. '
    + 'You connect a TDR at the OSS end. On L1, a healthy core, with the far end at B01 open, the end shows at ' + fTEnd.text + '. '
    + 'The route record gives the length as ' + fLen.text + '. These are practice values.';
  const Q6A = '(a) Determine the velocity of the pulse in String B.';
  const PRE_6B = 'Back on L2, test with the far end linked and then open. A downward peak stays at ' + fTFault.text + '.';
  const Q6B = '(b) Determine the distance to the fault from the OSS.';
  const Q6C = '(c) Determine the distance to the fault from B01.';
  const Q_CH = 'Another cable. Its velocity is ' + CH_V + ' m/µs, found on a known length. A downward peak shows at ' + CH_T + ' µs. Determine the distance to it.';
  const AFTER_6C = 'Now test from B01. The fault should show at ' + fB01.work + '. The two distances should add up to the length: ' + fBoth.work + ". "
    + "If they don't, the velocity is most likely wrong.\n\n"
    + 'When the tests are done, put the earths back on at both ends. Record L2: a low-resistance fault from core to screen, ' + f6b.text + ' from the OSS. '
    + 'The next test, LIRA, checks it from both ends.';

  let lines = 0, lastStep = -1, finished = false, pulseT = 0, pulseKey = '';
  const STEPS = [
    { name: 'Do you still have it?', label: 'Do you still have it?', task: R_TASK, opts: [O1, O2, O3], want: O2, why: R_WORK + ' ' + R_HALF + ' ' + R_SLIPS },
    { show: true, name: 'What it is for', label: 'What it is for', text: FOR_TEXT, terms: ['fingerprint'],
      still: () => { pulseT = PULSE_END; drawPulse(); } },
    { show: true, name: 'The why: up and down', label: 'The why: up and down', text: WHY_R, terms: ['characteristic impedance'],

      slips: [{ value: f6b.value, hint: 'That is the distance from the OSS. Take it from the length.' },
        { value: F('6c.slip').value, hint: 'That starts from ' + fS6b.text + ", the default velocity's distance. Use " + f6b.text + ' from (b).' }],
      hint: 'Not quite. Take the distance from the OSS away from the length.',
      after: AFTER_6C },
    [iCh]: { id: 'l6.changed', fig: fChg, dec: 1, accept: [], work: () => ['L = t × v ÷ 2', '= ' + fChg.work],
      slips: [{ value: F('l6.changed.slip').value, hint: NO_HALF },
        { value: F('l6.changed.slip2').value, hint: 'That uses ' + V_DEF + " m/µs. Use this cable's " + CH_V + ' m/µs.' }],
      hint: "Not quite. Use L = t × v ÷ 2, with this cable's velocity.",
      after: CH_V + ' m/µs is a velocity factor of ' + CH_V + ' ÷ ' + C_S + ' = ' + f2(+CH_V / C_LIGHT) + '. That is inside the typical range for XLPE.' },
  };
  const BOX = { [i6A]: '#ans-6a', [i6B]: '#ans-6b', [i6C]: '#ans-6c', [iCh]: '#ans-ch' };
  const ANS = {};
  Object.keys(SPEC).forEach((key) => {
    const i = +key, sp = SPEC[i];
    const a = K.answer({ id: sp.id, unit: sp.fig.unit || '', answer: sp.fig.value, decimals: sp.dec, accept: sp.accept, slips: sp.slips, into: BOX[i],
      onCheck: (r) => {
        const st = S[i];
        if (st.shown) return;
        if (r.state === 'right') {
          st.res = 'right';
          st.fb = { ok: true, v: 'Right.', w: sp.work() };
        } else if (r.state === 'wrong') {
          st.tries += 1;
          if (st.tries >= 2) {
            st.shown = true; st.res = 'shown';
            st.fb = { ok: false, v: 'Here is the working.', p0: r.hint || '', w: sp.work() };
            a.reveal();
          } else { st.res = 'wrong'; st.fb = { ok: false, v: 'Not quite. One more go.', p0: r.hint || sp.hint }; }
        } else { st.res = r.state; st.fb = null; }
        K.refresh();
      } });
    ANS[i] = a;
  });
  const checkBtn = K.button({ label: 'Check', into: '#acts', press: () => { const a = ANS[at()]; if (a) a.check(); } });

  // ---------- Section B and Keep this ----------
  function markLine(id) {
    const w = K.lesson && K.lesson.written && K.lesson.written[id];
    const n = w && Array.isArray(w.points) ? w.points.length : 0, need = w ? +w.need : 0;
    return n && need ? 'You write the answer. It is marked against ' + (WORDS[n] || n) + ' points, and any ' + (WORDS[need] || need) + ' make a full answer. You get one more go, then the model answer.'
      : 'You write the answer, in your own words. You get one more go, then the model answer.';
  }
  const wB1 = K.written({ id: 'b1', into: '#wr1', onMark: () => K.refresh() });
  el('wr1').addEventListener('click', () => K.refresh());
  K.summary({ into: '#keep' });
  (function () {
    const tw = document.createTreeWalker(el('keep'), NodeFilter.SHOW_TEXT), ns = [];
    while (tw.nextNode()) ns.push(tw.currentNode);
    ns.forEach((n) => { n.nodeValue = nb(n.nodeValue); });
  })();
  K.button({ label: 'Finish the lesson', into: '#fin', press: () => {
    if (at() !== iK) return;
    finished = true;
    if (typeof K.complete === 'function') K.complete();
    K.refresh();
  } });

  // ---------- the worked example, a line at each press ----------
  const wbox = K.el('div', { class: 'wl' });
  const wl = WL.map((x, k) => {
    const box = K.el('div', { class: 'line' });
    box.appendChild(K.el('span', { class: 'n' }, String(k + 1)));
    box.appendChild(write(K.el('p', { class: x.calc ? 'w' : '' }), x.w));
    wbox.appendChild(box);
    return box;
  });
  el('worked').appendChild(wbox);
  const nextLine = K.button({ label: 'Show', into: '#workedgo', press: () => {
    if (at() !== iWk || lines >= wl.length) return;
    const w = wl[lines]; lines += 1;
    w.classList.remove('enter'); void w.offsetWidth; w.classList.add('enter');
    K.refresh();
  } });

  // ---------- fixed words on their screens ----------
  el('warnFor').appendChild(K.el('p', { class: 'wh' }, 'If it is skipped'));
  el('warnFor').appendChild(K.el('p', null, nb(WARN_FOR)));
  el('capM').textContent = nb("String B's " + fLen.text + ' and its joint at ' + fJoint.text + ' are practice values.');
  el('titR').textContent = "L2's trace from the OSS";
  el('capR').textContent = nb("String B's " + fZ0.text + " and L2's " + fRf.text + " are practice values. The joint's ripple size is chosen for the picture.");
  el('titV').textContent = "L2's trace, far end open, against distance";
  el('ratioV').textContent = nb('The fault always sits ' + fRatio.text + ' of the way to the end: ' + fRatio.work + '.');
  el('capV').textContent = nb("String B's times and length are practice values. " + V_DEF + ' m/µs stands for a default left set.');

  function enter() { const b = el('stepbox'); b.classList.remove('enter'); void b.offsetWidth; b.classList.add('enter'); }
  const faded = {};
  function fade(node, key) {
    if (node.hidden) { faded[node.id] = ''; return; }
    if (faded[node.id] === key) return;
    faded[node.id] = key;
    node.classList.remove('fade'); void node.offsetWidth; node.classList.add('fade');
  }
  function paintFb(f) {
    const fb = el('fb');
    fb.textContent = '';
    fb.hidden = !f;
    if (!f) return;
    fb.className = 'fb ' + (f.ok ? 'ok' : 'bad');
    fb.appendChild(K.el('p', { class: 'v' }, f.v));
    if (f.p0) fb.appendChild(write(K.el('p'), f.p0));
    (f.w || []).forEach((t) => fb.appendChild(write(K.el('p', { class: 'w' }), t)));
    if (f.p) fb.appendChild(write(K.el('p'), f.p));
  }

  // ---------- nav ----------
  const backBtn = K.button({ label: 'Back', secondary: true, into: '#nav', press: () => { if (at() > 0) stepper.set(at() - 1); } });
  const nextBtn = K.button({ label: 'Continue', into: '#nav', press: () => { const i = at(); if (canGo(i) && i < iK) stepper.set(i + 1); } });
  function canGo(i) {
    const d = STEPS[i], st = S[i];
    if (d.show) return true;
    if (i === iR) return st.res === 'wrong';
    if (i === iChk) return st.res === 'right';
    if (ANS[i]) return st.res === 'right' || st.shown;
    if (i === iB1) return !!(wB1 && wB1.answered && wB1.answered());
    return false;
  }

  const ON = { scen: [i6A], carry6a: [i6A], carry6b: [i6B], carry6c: [i6C], pre: [i6A, i6B],
    wrapM: [iFor], warnFor: [iFor], capM: [iFor],
    wrapR: [iUp], ctlR: [iUp], outsR: [iUp], sayR: [iUp], shapes: [iUp], limNote: [iUp], capR: [iUp],
    wrapV: [iV], ctlV: [iV], outsV: [iV], ratioV: [iV], sayV: [iV], capV: [iV],
    worked: [iWk], workedgo: [iWk], picks: [iR, iChk],
    'ans-6a': [i6A], 'ans-6b': [i6B], 'ans-6c': [i6C], 'ans-ch': [iCh], wr1: [iB1], keep: [iK], fin: [iK] };
  const ASK = {
    [iUp]: 'Switch the far end from linked to open. Then drag the fault resistance from ' + RF0 + ' Ω up to ' + RF_MAX + ' Ω.',
    [iV]: 'Drag the velocity until the end lands on the known ' + LEN_M + ' m.',
    [iWk]: 'Work each line yourself first, then press Show.',
  };
  const CARRY = { [i6A]: car6a, [i6B]: car6b, [i6C]: car6c };

  K.update((p, o) => {
    const i = at(), d = STEPS[i], st = S[i];
    if (i !== lastStep) {
      if (lastStep !== -1) enter();
      lastStep = i;
      if (i === i6A) scen.el.open = true;
      if (CARRY[i] && typeof CARRY[i].refresh === 'function') { try { CARRY[i].refresh(); } catch (e) { /* the panel keeps its last state */ } }
    }
    Object.keys(ON).forEach((id) => { el(id).hidden = ON[id].indexOf(i) < 0; });
    el('cap').hidden = WORKING.indexOf(i) < 0;

    el('count').textContent = 'Step ' + (i + 1) + ' of ' + STEPS.length + ' · ' + d.label;
    paras(el('pre'), d.pre || '');
    const task = el('task');
    task.className = 'task' + (d.show ? ' show' : '');
    if (d.show) paras(task, d.text, d.terms);
    else write(task, d.part || (d.kind ? '' : d.task));
    task.hidden = !task.textContent;
    const sub = el('sub');
    sub.className = 'sub' + (ASK[i] ? ' ask' : '');
    sub.textContent = nb(ASK[i] ? ASK[i]
      : i === iChk ? "String B's figures are practice values."
      : i === i6A ? 'Give it in m/µs, to 1 place.'
      : i === i6B || i === i6C ? 'Give it in m, to 1 place.'
      : i === iCh ? 'Same method, new numbers. These are practice values. Give it in m, to 1 place.'
      : i === iB1 ? markLine('b1')
      : i === iK ? 'One card to come back to on a real job.' : '');
    sub.hidden = !sub.textContent;

    drawTrace(p, o);
    drawVel(p, o);
    const pk = i === iFor ? 'P' : '';
    if (pk && pk !== pulseKey) { pulseT = 0; drawPulse(); if (!anim.playing()) anim.play(); }
    pulseKey = pk;

    const opts = d.opts || [];
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      b.setLabel(nb(opts[k]));
      const done = st.res === 'right' || (i === iR && st.res === 'wrong');
      b.el.classList.toggle('is-right', done && opts[k] === d.want);
      b.el.classList.toggle('is-wrong', st.res === 'wrong' && opts[k] === st.pick);
      b.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });

    wl.forEach((w, k) => { w.hidden = k >= lines; });
    nextLine.el.hidden = lines >= wl.length;
    if (i === iWk) el('workedgo').hidden = lines >= wl.length;

    const typed = !!ANS[i], typedDone = typed && (st.res === 'right' || st.shown);
    checkBtn.el.hidden = !typed || typedDone;
    el('acts').hidden = checkBtn.el.hidden;
    paintFb(st.fb);
    const after = el('after');
    paras(after, typedDone ? SPEC[i].after : '');
    after.hidden = !after.textContent;
    el('wrapF').hidden = !(i === i6C && typedDone);
    el('go').hidden = !(i === iR && st.res === 'right');
    [['fb', JSON.stringify(st.fb)], ['after', i + after.textContent], ['wrapF', String(i)], ['go', String(i)]].forEach(([id, key]) => fade(el(id), key));

    el('donefb').textContent = finished && i === iK ? 'Lesson finished. Back is there whenever you want another look.' : '';
    el('donefb').hidden = !el('donefb').textContent;

    backBtn.el.hidden = i === 0;
    nextBtn.el.hidden = i === iK || !canGo(i) || (i === iR && st.res === 'right');
    el('nav').hidden = backBtn.el.hidden && nextBtn.el.hidden;
  });

  // ---------- known answers, worked out by hand ----------
  const near = (a, b, t) => K.near(a, b, t == null ? 1e-6 : t);
  const AR = (rf) => K.at({ rf: rf }), AV = (v) => K.at({ v: v });
  K.check('Rf 1, 35, 100 and 1000 Ω give 0.96, 15.3, 21.3 and 26.4 Ω at the fault; ρ −0.93, −0.28, −0.12 and −0.01; 0.07, 0.72, 0.88 and 0.99 get past', () =>
    fmtZ(AR(1).zf) === '0.96 Ω' && fmtZ(AR(35).zf) === '15.3 Ω' && fmtZ(AR(100).zf) === '21.3 Ω' && fmtZ(AR(1000).zf) === '26.4 Ω'
    && near(r2(AR(1).rho), F('l6.rho1').value) && near(r2(AR(RF0).rho), F('l6.rho35').value) && near(r2(AR(100).rho), F('l6.rho100').value)
    && near(r2(AR(1000).rho), F('l6.rho1000').value) && sg2(AR(35).rho) === '−0.28'
    && f2(AR(1).pass) === '0.07' && near(r2(AR(RF0).pass), F('l6.pass').value) && f2(AR(100).pass) === '0.88' && f2(AR(1000).pass) === '0.99');
  K.check('Behind the 35 Ω fault the end comes back at 0.72 × 0.72 = 0.52 of its full height', () =>
    near(r2(Math.abs(endH('open', RF0))), F('l6.endamp').value) && near(r2(r2(passAt(RF0)) * r2(passAt(RF0))), F('l6.endamp').value));
  K.check("Opening the far end flips the end from down to up; the fault's dip stays down at every resistance", () =>
    [1, RF0, LIMIT, RF_MAX].every((rf) => endH('linked', rf) < 0 && endH('open', rf) > 0 && rhoAt(rf) < 0
      && traceAt(T_FAULT + W / 2, 'linked', rf) < 0 && traceAt(T_FAULT + W / 2, 'open', rf) < 0
      && traceAt(T_END + W / 2, 'linked', rf) < 0 && traceAt(T_END + W / 2, 'open', rf) > 0));
  K.check('The dip shrinks as the fault resistance rises, and the impedance climbs towards 27.1 Ω', () => {
    for (let rf = 1; rf < RF_MAX; rf++) if (!(Math.abs(rhoAt(rf + 1)) < Math.abs(rhoAt(rf)) && zAt(rf + 1) > zAt(rf) && zAt(rf + 1) < Z0)) return false;
    return near(rhoAt(0), -1) && near(zAt(1e12), Z0, 1e-6);
  });
  K.check("String B's 27.1 Ω is 1 ÷ (v × C) at 168.0 m/µs and 0.22 µF/km", () => near(r1(1 / (V_B * 1e6 * CKM * 1e-9)), Z0));
  K.check('At 152, 160, 168 and 188 m/µs the end reads 2171.3, 2285.6, 2399.9 and 2685.6 m; the fault 868.7, 914.4, 960.1 and 1074.4 m; VF 0.51, 0.53, 0.56 and 0.63', () =>
    fmtM(AV(152).Lend) === '2171.3 m' && fmtM(AV(160).Lend) === '2285.6 m' && fmtM(AV(168).Lend) === '2399.9 m' && fmtM(AV(188).Lend) === '2685.6 m'
    && fmtM(AV(152).Lfault) === '868.7 m' && fmtM(AV(160).Lfault) === fS6b.text && fmtM(AV(168).Lfault) === f6b.text && fmtM(AV(188).Lfault) === '1074.4 m'
    && f2(AV(152).vf) === '0.51' && f2(AV(160).vf) === '0.53' && f2(AV(168).vf) === fVF.text && f2(AV(188).vf) === '0.63');
  K.check('The fault sits 0.40 of the way to the end at every velocity', () => {
    for (let v = V_MIN; v <= V_MAX; v += 2) if (!near(r2(AV(v).Lfault / AV(v).Lend), fRatio.value)) return false;
    return true;
  });
  K.check('Recall: 20.0 × 160 ÷ 2 = 1600 m; slips 3200 m and 800 m. Worked example: 0.05 × 2000 = 100 m', () =>
    near(r1(+R_T * +R_V / 2), fRec.value) && near(r1(+R_T * +R_V), fRs1.value) && near(r1(+R_T * +R_VH / 2), fRs2.value) && near(+R_VH * 2, +R_V)
    && near(r1(WEX_F * WEX_L), fWex.value));
  K.check('6(a) 168.0 m/µs; 6(b) 960.1 m (960.2 unrounded); 6(c) 1439.9 m (1439.8 unrounded); changed numbers 1290.0 m', () =>
    near(r1(2 * LEN_M / T_END), f6a.value) && near(r1(T_FAULT * V_B / 2), f6b.value) && near(r1(LEN_M - f6b.value), f6c.value)
    && raw6b === 960.2 && raw6c === 1439.8 && near(r1(+CH_T * +CH_V / 2), fChg.value));
  K.check('Joint at 19.29 µs, B01 at 17.14 µs, VF 0.56, v/2 84.0, zone 24.0 m either side', () =>
    near(r2(2 * JOINT / V_B), fJt.value) && near(r2(2 * f6c.value / V_B), fB01.value) && near(r2(V_B / C_LIGHT), fVF.value)
    && near(r1(V_B / 2), fV2.value) && near(r1(ZONE * LEN_M), fAcc.value) && near(r1(f6b.value + f6c.value), fBoth.value));
  K.check('Each slip is its own working: 84.0 and 0.168; 914.4, 1920.2 and 480.1; 1485.6; 2580.0 and 1200.0', () =>
    near(r1(LEN_M / T_END), F('6a.slip').value) && near(r3(2 * LEN_KM / T_END), F('6a.slip2').value)
    && near(r1(T_FAULT * V_DEF / 2), fS6b.value) && near(r1(T_FAULT * V_B), F('6b.slip2').value) && near(r1(T_FAULT * (V_B / 2) / 2), F('6b.slip3').value)
    && near(r1(LEN_M - fS6b.value), F('6c.slip').value) && near(r1(+CH_T * +CH_V), F('l6.changed.slip').value)
    && near(r1(+CH_T * V_DEF / 2), F('l6.changed.slip2').value));
  K.check('A fault of higher resistance, over 100 Ω, a low-voltage pulse will likely not see', () => LIMIT === 100,
    { source: 'https://www.megger.com/en-ca/applications/cables/cable-fault-location' });
  K.check('Power XLPE: velocity factor 0.54 to 0.62, 162 to 186 m/µs', () =>
    VF_LO === 0.54 && VF_HI === 0.62 && V_LO === 162 && V_HI === 186 && Math.round(VF_LO * C_LIGHT) === V_LO && Math.round(VF_HI * C_LIGHT) === V_HI,
    { source: 'https://portalvhds963slh4m3fqg2.blob.core.windows.net/megger-products/TDR_AN58_EN_V02.pdf' });
  K.check('Measured from both ends, the combined answer should equal the expected length of the cable', () => near(f6b.value + f6c.value, LEN_M, 1e-6),
    { source: 'https://www.instrumart.com/assets/Megger-TDR500-3-Manual.pdf' });
  K.check("Every slip lies outside its answer's accepted figures", () => Object.keys(SPEC).every((k) => {
    const sp = SPEC[k], tol = 0.05;
    return sp.slips.every((s) => Math.abs(s.value - sp.fig.value) > tol && sp.accept.every((x) => Math.abs(s.value - x) > tol));
  }));

  K.ready();
</script>
