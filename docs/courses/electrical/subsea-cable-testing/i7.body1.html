<p class="caption" id="cap">Each line is worked from the rounded figures shown before it.</p>

<script>
  // ---------- rounding, helpers and the course's figures ----------
  const rnd = (x, d) => { const k = Math.pow(10, d); return Math.sign(x) * Math.round(Math.abs(x) * k + 1e-7) / k; };
  const r1 = (x) => rnd(x, 1), r2 = (x) => rnd(x, 2);
  const f1 = (x) => r1(x).toFixed(1);
  const f2 = (x) => r2(x).toFixed(2);
  const F = (id) => K.figure(id);
  const el = (id) => document.getElementById(id);
  const NB = ' ';
  // Non-breaking spaces: before an operator, inside a number's thousands, and between a number and its unit.
  const nb = (s) => String(s == null ? '' : s)
    .replace(/ ([×÷+=−]) /g, NB + '$1 ')
    .replace(/(\d) (?=\d{3}\b)/g, '$1' + NB)
    .replace(/(\d) (?=(?:m\/µs|µs|µF|kV|km|kHz|MHz|Hz|GΩ|Ω|dB|°C|m|V)(?![A-Za-z]))/g, '$1' + NB);
  const str = (s, re) => { const m = re.exec(String(s || '')); return m ? m[1] : ''; };
  const fx = (v) => (+v).toFixed(1);
  function txt(parent, x, y, s, cls, anchor) {
    const t = parent.appendChild(K.svg('text', { x: fx(x), y: fx(y), class: cls || 'lb', 'text-anchor': anchor || 'start' }));
    t.textContent = s;
    return t;
  }
  const WORDS = ['no', 'one', 'two', 'three', 'four', 'five', 'six', 'seven'];
  const kHz1 = (v) => (typeof v === 'number' && isFinite(v) ? f1(v) + ' kHz' : '—');

  // String B, L2 and its tests, from the case file.
  const fLen = F('p.len'), LEN_KM = fLen.value, LEN_M = Math.round(LEN_KM * 1000);
  const fJoint = F('p.joint'), JOINT = fJoint.value;
  const fTF = F('p.tFault');
  const fZ0 = F('p.Z0'), Z0 = fZ0.value;
  const f6b = F('6b'), V_B = F('6a').value, V_B_S = V_B.toFixed(1), VS = V_B * 1e6;
  const fOSS = F('p.liraOSS'), SPOT_OSS = fOSS.value, SPOT_B01 = F('p.liraB01').value;
  const DNS = F('p.dnormScale').text;
  const DN = +String(str(DNS, /reads ([−-]?\d+) dB/)).replace('−', '-');
  const G_LO = +str(DNS, /under (\d+) dB/), R_HI = +str(DNS, /above (\d+) dB/);
  const F_MAX_S = str(F('p.liraSweep').text, /to ([\d.]+) MHz/), F_MAX = +F_MAX_S * 1e6;
  const ONLINE = F('n.liraOnline').value;
  const ACC_PCT = +str(F('t.liraAcc').text, /([\d.]+)%/);
  const f7a = F('7a'), f7b = F('7b'), fLenChk = F('l7.lenCheck'), fSpread = F('l7.spread'), fAcc = F('l7.accuracy');
  const fRipO = F('l7.rippleOSS'), fWt = F('l7.wex.t'), fWx = F('l7.wex.x'), fWd = F('l7.wex.diff');
  const RIP_HZ = str(fWt.work, /÷ ([\d ]+) =/), RIP_N = +RIP_HZ.replace(/ /g, '');
  const fChg = F('l7.changed'), CH_V = +str(fChg.work, /^([\d.]+)/), CH_DF_HZ = +str(fChg.work, /\(2 × ([\d ]+)\)/).replace(/ /g, '');
  const CH_DF = (CH_DF_HZ / 1000).toFixed(1);
  const V_DEF = +str(F('7a.slip2').work, /^([\d.]+)/);
  const W7B = String(f7b.work).split(';')[0];
  const ABOUT = Math.round(f6b.value / 10) * 10;
  // The picture's ranges, from the lesson: 1.20 to 4.80 km, a change from 100 to 2300 m, a close-up of 0 to 150 kHz.
  const L_MIN = 1.2, L_MAX = 4.8, X_MIN = 100, X_MAX = 2300, CU_MAX = 150e3;

  // ---------- the rule ----------
  // Resonances of a line open at the far end: dips every v ÷ 2L, the first where a quarter wavelength fits.
  const spacing = (Lm) => VS / (2 * Lm) / 1000;
  const firstDip = (Lm) => VS / (4 * Lm) / 1000;
  // A change x metres along: an echo after 2x ÷ v, which ripples the spectrum every v ÷ 2x.
  const roundTrip = (x) => 2 * x / V_B;
  const ripple = (x) => VS / (2 * x) / 1000;
  // The drawn spectrum: |Z0 coth(γL)| with a little loss growing as √f to round it off (a sketch).
  const KL = 0.03, RIPA = 0.4;
  function zOpen(f, Lm) {
    if (!(f > 0)) return 1e6;
    const b = 2 * Math.PI * f * Lm / VS, a = KL * Math.sqrt(b);
    const den = Math.cosh(2 * a) - Math.cos(2 * b), num = Math.hypot(Math.sinh(2 * a), Math.sin(2 * b));
    return den > 1e-12 ? Z0 * num / den : 1e6;
  }
  const zMatched = () => Z0;
  const band = (dn) => (Math.abs(dn) < G_LO ? 'g' : Math.abs(dn) <= R_HI ? 'a' : 'r');
  const BAND_WORD = { g: 'mild', a: 'intermediate', r: 'significant' };
  const BAND_FILL = { g: 'var(--k-good)', a: 'var(--k-amber-line)', r: 'var(--k-warn)' };
  const dnTxt = (v) => (v > 0 ? '+' : '−') + Math.abs(v) + ' dB';

  // ---------- the lesson's words ----------
  const R_TASK = 'A LIRA spot signature shows a spot with a negative DNORM, in red. What could it be?';
  const O1 = 'A bend, or a break in the shield', O2 = 'Water getting in, or heat or mechanical damage: significant', O3 = 'Water getting in, or heat or mechanical damage: mild';
  const R_WORK = 'Negative points to water getting in, heat damage or mechanical damage. Positive points to bends and breaks in the shield. Red means significant, amber intermediate and green mild.';
  const R_W1 = 'Bends and shield breaks give a positive DNORM. Negative points to water, heat or mechanical damage.';
  const R_W3 = 'The type is right. But red means significant. Green is mild and amber intermediate.';

  const FOR_TEXT = 'LIRA sends a sweep of small sine waves into one pair of conductors at one end. It records the cable\'s impedance at each frequency. '
    + 'From that record, it finds where the impedance changes between any two metal conductors. That can be a core and its screen, two cores, or a core and the armour. '
    + 'It gives the length, the joints, and where water or dirt has got in. Each wave runs to the far end and back to the set. So it needs only one end.\n\n'
    + 'It is used around loadout, during installation, at commissioning, and in service at set intervals. The commissioning record is the cable\'s baseline. '
    + 'LIRA gives no pass or fail. You compare each test with the baseline. So always keep the raw trace data.\n\n'
    + 'String B is tested dead. Both ends are earthed and discharged first, so no energy is stored in the cable. '
    + 'Some systems also monitor energised cables, up to ' + ONLINE + ' kV, through sensors that do not touch the core.';
  const WARN_FOR = "Skip it, and there is no baseline to compare with in later years. And L2's fault rests on one test, from one end.";

  const WHY_S = 'Take one core and its screen, with the far end open. At low frequency the pair is just a capacitor. Its reactance is 1 ÷ 2πfC. '
    + 'It starts high and falls as the frequency rises. As the frequency climbs, each wave reaches the far end and comes back. '
    + 'Where a quarter wavelength fits the cable, the trip there and back is half a wavelength. So the wave arrives back upside down against the one going in. '
    + 'The two cancel at the test end. The cable looks like a short, and the impedance dips. '
    + 'Where half a wavelength fits, the round trip is a whole wavelength. The wave arrives back in step. The cable looks like an open, and the impedance peaks. '
    + 'Each extra half wavelength repeats the pattern. So the dips come every v ÷ 2L, where v is the velocity and L the length. '
    + 'A longer cable fits more half wavelengths into the same band. So its resonances crowd together.\n\n'
    + "This record of impedance against frequency is the cable's impedance spectrum. "
    + 'An end matched exactly to the cable soaks up every wave, so nothing comes back and there are no resonances.';
  const READ_S = 'At ' + LEN_KM.toFixed(2) + ' km the dips sit ' + kHz1(spacing(LEN_M)) + ' apart. The first is at ' + kHz1(firstDip(LEN_M)) + '. '
    + 'At ' + L_MIN.toFixed(2) + ' km they spread to ' + F('l7.pic.df12').text + ' apart. At ' + L_MAX.toFixed(2) + ' km they crowd to ' + F('l7.pic.df48').text + '. '
    + 'With the end matched, no wave comes back. So the line goes flat at ' + fZ0.text + '.';

  const WHY_P = 'Now give the core a short length of damaged insulation. Water raises the permittivity, so the capacitance there rises. '
    + 'The impedance is the square root of L ÷ C per metre. So it falls. A little of each wave reflects from that spot, as a TDR pulse does. '
    + "Call the spot's distance x. The echo comes back after a round trip of 2x ÷ v. The echo is late. "
    + 'So it slips in and out of step with the main signal as the frequency rises. In step, it adds. Out of step, it takes away. '
    + 'So it puts a small ripple on the spectrum. It comes back in step each time the frequency rises by 1 ÷ round trip. That is v ÷ 2x. '
    + "So a nearer spot makes a wider ripple. LIRA's software turns each ripple back into a round trip. "
    + 'Then it turns each round trip into a place with the TDR rule again, L = t × v ÷ 2. The result is the spot signature. '
    + 'It lays the cable out by distance, with its end, its joints and any spots. '
    + 'The software works on the phase of the impedance. The phase can show small changes better.';
  const WHY_P2 = 'Each spot is graded by DNORM. Its sign follows the type of change. Negative means water, heat or mechanical damage. '
    + 'Positive means bends and shield breaks. Its colour gives the severity. Green is mild, amber intermediate and red significant.\n\n'
    + 'The bands here are practice values. On a real job they are a software or client setting.';
  const READ_P = 'At ' + SPOT_OSS + ' m the round trip is ' + F('l7.pic.t961').text + ". That is close to TDR's " + fTF.text + '. '
    + 'The ripple repeats every ' + fRipO.text + '. At ' + X_MIN + ' m the arrow is short. The ripple is wide, every ' + F('l7.pic.r100').text + '. '
    + 'At ' + X_MAX + ' m it tightens to every ' + F('l7.pic.r2300').text + '. The spot follows the change along the cable. '
    + 'Switched to a shield break, the bar flips above the line in the same place.';

  const C_TASK = "From the OSS, a second spot shows nearer the set than L2's spot at " + SPOT_OSS + ' m. How does its ripple in the spectrum compare?';
  const C_O1 = 'Wider: more kHz between its crests', C_O2 = 'Tighter: fewer kHz between its crests', C_O3 = "The same: the cable's length sets it";
  const C_RIGHT = 'The echo from a nearer spot comes back sooner. The ripple repeats every v ÷ 2x. So a smaller x gives a wider ripple. '
    + 'At ' + X_MIN + ' m it repeats every ' + F('l7.pic.r100').text + ', against ' + fRipO.text + ' at ' + SPOT_OSS + ' m.';
  const C_W2 = "That is a spot farther away. A nearer spot's echo comes back sooner. So its ripple is wider.";
  const C_W3 = 'The length sets the resonances, every v ÷ 2L. Each spot adds its own ripple, every v ÷ 2x. Its own distance sets it.';

  const WK_HEAD = 'Take these practice values. LIRA runs from the OSS on L2. The software finds a ripple that repeats every ' + fRipO.text + '. Where is the change that makes it?';
  const WL = [
    { w: 'Set up on the dead cable. Both ends are earthed and discharged. Lift the earths on L2 at your end under control. '
      + 'Connect the leads as the test specification says. Here that is core to screen.' },
    { w: 'The rule: a ripple that repeats every Δ in frequency comes from an echo with a round trip of 1 ÷ Δ.', calc: true },
    { w: 't = 1 ÷ ' + RIP_HZ + ' Hz = ' + fWt.text + '.', calc: true },
    { w: 'Then the TDR rule: L = t × v ÷ 2.', calc: true },
    { w: 'L = ' + fWx.work + ' from the OSS.', calc: true },
    { w: 'TDR put the fault at ' + f6b.text + '. The two agree within ' + fWd.text + '.' },
    { w: 'When you finish, put the earths back on at both ends.' },
  ];
  const WK_READ = 'A ripple every ' + fRipO.text + ' means an echo with a round trip of ' + fWt.text + '. At ' + V_B_S + ' m/µs, that is '
    + fWx.work + ' from the OSS. That is within ' + fWd.text + " of TDR's " + f6b.text + '.';

  const PRE_7A = 'Take these practice values. Every core is discharged and earthed at both ends. A LIRA set goes on L2 at the OSS end, core to screen. '
    + 'The far end at B01 is open. The sweep runs from 0 to ' + F_MAX_S + ' MHz.';
  const Q7A = "(a) Determine the spacing of the resonances in L2's impedance spectrum.";
  const PRE_7B = "From the OSS, L2's spot signature shows one spot at " + SPOT_OSS + ' m, DNORM negative and red. '
    + 'The B01 team then tests L2 from their end. Their spot is at ' + SPOT_B01 + ' m, also negative and red.';
  const Q7B = '(b) Determine where the B01 reading puts the spot, measured from the OSS.';
  const Q_CH = 'Another cable, open at the far end. Its velocity is ' + CH_V + ' m/µs, and its resonances are ' + CH_DF + ' kHz apart. Determine its length.';
  const AFTER_7B = 'Three readings point to one place: ' + SPOT_OSS + ' m, ' + f7b.text + " and TDR's " + f6b.text + '. '
    + 'The two LIRA readings are ' + fSpread.text + ' apart. LIRA can place a spot within ' + ACC_PCT + '% of the length. On String B, that is ' + fAcc.work + '. '
    + 'Testing from both ends gives the best sensitivity. Two ends that agree confirm the place.\n\n'
    + 'Negative and red means a significant change, the kind that water, heat or mechanical damage makes. '
    + 'L1 and L3 show the end and the joint, but no spots. Keep their traces as their baseline. '
    + 'Record L2: one significant negative spot about ' + ABOUT + ' m from the OSS.';

  const JOB = [
    ['Core resistance', F('2c').text + ' at 20 °C, inside ' + F('n.tol').value + '%.'],
    ['IR at ' + F('p.irV').value + ' kV', F('p.ir2.1m').text + " at 1 minute passes the client's " + F('p.irCrit').value + ' GΩ. But PI ' + F('3b').text + ' and DAR ' + F('l3.L2.DAR').text + ' show a flat curve.'],
    ['Sheath', 'Tripped at ' + str(F('p.sheathL2').text, /at ([\d.]+ kV)/) + ', where L1 and L3 held ' + F('4a').text + '.'],
    ['VLF at ' + F('5a').text + ', ' + str(F('n.vlfF').text, /^([\d.]+ Hz)/), 'Broke down at minute ' + str(F('p.vlfL2').text, /minute (\d+)/) + ', then read ' + F('p.Rf').text + ' core to screen.'],
    ['TDR from the OSS', 'A downward peak at ' + f6b.text + '.'],
    ['LIRA from both ends', 'One negative red spot, ' + SPOT_OSS + ' m and ' + f7b.text + ' from the OSS.'],
  ];
  const JOB_TEXT = 'Gentle, low-voltage checks come first. The withstand test, which can break a weak cable down, comes near the end. '
    + 'The LIRA baseline comes last, so it records each healthy core as it goes into service. '

    near(r1(VS / LEN_M / 1000), F('7a.slip').value) && near(r1(VS / (4 * LEN_M) / 1000), F('7a.slip3').value) && near(r1(V_DEF * 1e6 / (2 * LEN_M) / 1000), F('7a.slip2').value)
    && near(SPOT_B01, F('7b.slip').value) && near(LEN_M + SPOT_B01, F('7b.slip2').value)
    && near(CH_V * 1e6 / CH_DF_HZ, F('l7.changed.slip').value) && near(CH_V * 1e6 / (4 * CH_DF_HZ), F('l7.changed.slip2').value));
  K.check('Within 0.5% of the length is 12 m on String B', () => near(ACC_PCT / 100 * LEN_M, fAcc.value));
  K.check("Every slip lies outside its answer's accepted figures", () => Object.keys(SPEC).every((k) => {
    const sp = SPEC[k], tol = 0.5;
    return sp.slips.every((s) => Math.abs(s.value - sp.fig.value) > tol && sp.accept.every((x) => Math.abs(s.value - x) > tol));
  }));

  K.ready();
</script>
