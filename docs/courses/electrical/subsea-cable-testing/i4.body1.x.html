<p class="caption" id="cap">Each line is worked from the rounded figures shown before it.</p>

<script>
  // ---------- rounding, helpers and the course's figures ----------
  const r1 = (x) => Math.round(x * 10 + 1e-7) / 10;
  const r2 = (x) => Math.round(x * 100 + 1e-7) / 100;
  const f1 = (x) => r1(x).toFixed(1);
  const f2 = (x) => r2(x).toFixed(2);
  const F = (id) => K.figure(id);
  const el = (id) => document.getElementById(id);
  const NB = ' ';
  // Non-breaking spaces: before an operator, and between a number and its unit.
  const nb = (s) => String(s == null ? '' : s)
    .replace(/ ([×÷+=−]) /g, NB + '$1 ')
    .replace(/(\d) (?=(?:kV\/mm|kV|mm|min|s)(?![A-Za-z]))/g, '$1' + NB);
  const vis = (e, on) => { if (on) e.removeAttribute('display'); else e.setAttribute('display', 'none'); };
  const fx = (v) => (+v).toFixed(1);
  function txt(parent, x, y, s, cls, anchor) {
    const t = parent.appendChild(K.svg('text', { x: fx(x), y: fx(y), class: cls || 'lb', 'text-anchor': anchor || 'start' }));
    t.textContent = s;
    return t;
  }
  const WORDS = ['no', 'one', 'two', 'three', 'four', 'five', 'six', 'seven'];

  // The rule: 4 kV d.c. per millimetre of specified thickness, at most 10 kV, for 1 minute.
  const RATE = 4, CAP = 10, MIN = 1;
  // The factory routine test on a new sheath (kV per mm), and one offshore spec's flat level (kV).
  const FACT = 8, FLAT = 10;
  const Vof = (t) => Math.min(RATE * t, CAP);
  const tv = (v) => { const t = Math.round(+v * 10) / 10; return isFinite(t) ? K.clamp(t, 1, 4) : 2.2; };
  const nLines = (E) => Math.max(2, Math.round(2 * E));       // two field lines for every kV/mm

  const fT = F('p.sheathT'), T_B = fT.value;
  const fCapT = F('l4.capT'), CAPT = fCapT.value;
  const FIVE = F('n.discharge').value;
  const fRec = F('l4.recall'), fRS1 = F('l4.recall.slip1'), fRS2 = F('l4.recall.slip2');
  const fP = F('l4.check.thin'), fPs = F('l4.check.thinS'), fQ = F('l4.check.thick'), fQs = F('l4.check.thickS');
  const fWex = F('l4.wex'), fEarth = F('l4.earth');
  const f4a = F('4a'), fS4a = F('l4.stress4a'), f3b = F('3b');
  const fL2s = F('l4.stressL2'), fL2 = F('p.sheathL2');
  const fChg = F('l4.changed'), fChgS = F('l4.changed.stress');
  // Practice thicknesses, read from each figure's own working ("4 × 1.8 = 7.2 kV").
  const tOf = (f) => { const m = /×\s*([\d.]+)/.exec(f.work || ''); return m ? +m[1] : NaN; };
  const REC_T = tOf(fRec), P_T = tOf(fP), Q_T = tOf(fQ), WEX_T = tOf(fWex), CH_T = tOf(fChg);
  // L2's trip, from the case: the voltage from its stress working, the time from the result.
  const TRIP_KV = +((/^([\d.]+)/.exec(fL2s.work || '') || [0, NaN])[1]);
  const TRIP_S = +((/after (\d+) s/.exec(String(fL2.text || '')) || [0, NaN])[1]);

  // ---------- the lesson's words ----------
  const forMin = MIN + ' minute';
  const O1 = fRS2.text + ' for ' + forMin, O2 = fRec.text + ' for ' + forMin, O3 = fRS1.text + ' for ' + forMin;
  const R_TASK = "A core's oversheath is " + f1(REC_T) + ' mm thick. What d.c. voltage does the sheath test put across it, and for how long?';
  const R_WORK = 'V = ' + RATE + ' kV per mm × thickness = ' + fRec.work.split(',')[0] + '. That is under the ' + CAP + ' kV cap, so ' + fRec.text + ' d.c., held for ' + forMin + '.';
  const R_SLIPS = fRS2.text + ' leaves out the thickness. ' + fRS1.text + ' is the cap, which only applies above ' + fCapT.text + '.';
  const R_W1 = 'That is the rate for one millimetre. Multiply it by the thickness: ' + RATE + ' × ' + f1(REC_T) + '.';
  const R_W3 = 'That is the cap. It only applies when ' + RATE + ' × the thickness goes over ' + CAP + ' kV, above ' + fCapT.text + '. Here ' + fRec.work.split(',')[0] + '.';

  const FOR_TEXT = "Each core's oversheath is the plastic layer outside its screen and foil. Its job is to keep water away from the insulation. "
    + 'The sheath test checks it on its own. It puts a d.c. voltage across the sheath, from the screen inside to a conductor on its outer face. '
    + 'It runs after the IR test and before VLF. It looks for damage done while the cable was laid.';
  const WARN_FOR = 'A hole in the sheath does not fail the cable on day one. It lets water in. Under the working voltage, that water can slowly grow water trees in the XLPE until the insulation fails. '
    + 'Sheath faults can cost the whole cable.';
  const TREE1 = 'water trees:', TREE2 = 'months or years later';

  const WHY_TEXT = 'The sheath test is an insulation test on the sheath alone. The screen inside is one electrode. '
    + "A conductor on the sheath's outer face is the other, the outer electrode. Plastic breaks down when the field across it gets too strong. "
    + 'That field is the voltage per millimetre of thickness. Put the same voltage across a thin sheath and a thick one. The thin one takes far more stress.\n\n'
    + 'So the rule scales the voltage with the thickness. It sets ' + RATE + ' kV d.c. per millimetre, at most ' + CAP + ' kV, for ' + forMin + '. '
    + 'Use the thickness specified on the data sheet. Every sheath up to ' + fCapT.text + ' gets the same ' + RATE + ' kV per mm. '
    + 'Above ' + fCapT.text + ' the cap holds the voltage at ' + CAP + ' kV, so a thicker sheath sees less.';
  const WHY_MORE = 'In the factory, the d.c. test on a new sheath uses ' + FACT + ' kV per mm. The site test is half that. Not every spec uses the per-millimetre rule. '
    + 'One offshore cable spec asks for a flat ' + FLAT + ' kV d.c. for ' + forMin + " on an insulating sheath. The client's test spec sets the level on the job.";
  const WHY_READ = 'Up to ' + fCapT.text + ' the voltage rises ' + RATE + ' kV for every millimetre, and the stress stays at ' + f2(RATE) + " kV/mm. String B's " + fT.text
    + ' sheath takes ' + f1(Vof(T_B)) + ' kV. From ' + fCapT.text + ' the voltage stays at the ' + CAP + ' kV cap. So the stress falls, down to ' + f2(Vof(4) / 4) + ' kV/mm at 4.0 mm.';

  const LINK_TEXT = 'The test must stress the sheath and nothing else. So the conductor, the foil and the screen are linked together at both ends. '
    + "The foil sits right under the sheath. Once linked, it carries the full test voltage onto the sheath's inner face. "
    + 'The conductor is at the same voltage, so the XLPE between conductor and screen has nothing across it.\n\n'
    + 'The negative lead goes to the linked screen. The positive lead goes to the outer electrode. That is the same way round as the IR test: positive on the outside. '
    + 'The outer electrode must reach the whole length of the sheath, so the whole sheath is tested. Which one you use depends on the sheath.';
  const INS_TEXT = 'A plain plastic sheath has no conductor on its face. The earth around the cable is the outer electrode, so the positive goes to an earth rod.';
  const SEMI_TEXT = 'A semi-conductive sheath has a thin conducting skin on its outer face, the whole length of the cable. That skin is the outer electrode. '
    + 'The positive reaches it through a roll spring wound round the sheath.';
  const NOTE_L = "Assume String B's core sheaths are semi-conductive. On a job, read the sheath type off the data sheet.";
  const LINK_READ = 'On an insulating sheath the positive goes to an earth rod. On a semi-conductive sheath it goes through a roll spring to the sheath\'s conducting skin. '
    + 'Either way the negative is on the linked screen. The sheath takes the ' + f4a.text + ' and the XLPE takes none.';

  const vP = Vof(P_T), vQ = Vof(Q_T);
  const C_TASK = 'Cable P has a ' + f1(P_T) + ' mm sheath and cable Q a ' + f1(Q_T) + ' mm sheath. Each is tested at its own correct voltage. Which sheath takes the higher stress per millimetre?';
  const C_O1 = 'P, the ' + f1(P_T) + ' mm sheath', C_O2 = 'Q, the ' + f1(Q_T) + ' mm sheath', C_O3 = 'Both the same, ' + RATE + ' kV per mm';
  const Q_RAW = RATE + ' × ' + f1(Q_T) + ' = ' + f1(RATE * Q_T) + ' kV';
  const C_RIGHT = 'P takes ' + fP.work.split(',')[0] + '. That gives ' + fPs.work.replace(' kV/mm', '') + ' kV/mm. Q works out at ' + Q_RAW + '. That is over the cap, so it gets '
    + fQ.text + '. That gives ' + f1(vQ) + ' ÷ ' + f1(Q_T) + ' = ' + fQs.text + '. The cap leaves a thick sheath less stressed.';
  const C_W2 = 'Q gets the higher voltage, ' + fQ.text + ' against ' + fP.text + '. But stress is voltage per millimetre: ' + f1(vQ) + ' ÷ ' + f1(Q_T) + ' = ' + fQs.text
    + ", against P's " + f2(fPs.value) + '.';
  const C_W3 = 'That holds only up to ' + fCapT.text + '. Q works out at ' + Q_RAW + '. That is over the cap, so it gets ' + fQ.text + ', which is ' + fQs.text + '.';

  const WK_HEAD = 'A cable with insulating core sheaths, ' + f1(WEX_T) + ' mm thick by its data sheet. A practice value.';
  const WL = [
    { w: 'Earth the screen and the conductor at both ends.' },
    { w: 'Link foil, screen and conductor together at both ends.' },
    { w: 'Negative lead to the linked screen. Positive lead to the earth rod.' },
    { w: 'Tell the far end. Lift the earths under control, with access restricted at both ends.' },
    { w: 'V = ' + fWex.work.split(',')[0] + ' d.c., under the ' + CAP + ' kV cap. Hold it for ' + forMin + '.', calc: true },
    { w: 'It passes if the sheath holds ' + fWex.text + ' for the full minute with no breakdown.' },
    { w: 'Discharge in the same order as after the IR test: the display shows discharged, then the discharge stick, the hook stick and the hand earth. '
      + 'Earth the screen and the core at both ends. Keep them earthed for at least ' + FIVE + ' × the ' + forMin + ' the voltage was on, so at least ' + fEarth.value + ' minutes.' },
  ];
  const WK_NOTE = 'Put the screen earths back on at both ends before the cable is energised. Screens have been left unearthed after sheath tests, then energised that way for days. '
    + 'The last line matters as much as the test. The sheath holds charge, just as the core does.';
  const WK_READ = 'On a ' + f1(WEX_T) + ' mm insulating sheath, first earth both ends. Link foil, screen and conductor at both ends. Put the negative on the screen and the positive on the earth rod. '
    + 'Then lift the earths under control. Hold ' + fWex.work.split(',')[0] + ' d.c. for ' + forMin + '. It passes with no breakdown. Then discharge in the usual order. '
    + 'Keep the screen and the core earthed for at least ' + fEarth.value + ' minutes. Put the screen earths back before the cable is energised.';

  const PRE_4A = "Each core's oversheath is semi-conductive, " + fT.text + ' thick by the data sheet. These are practice values. Each core is tested in turn. '
    + 'Conductor, foil and screen are linked at both ends. The negative goes to the screen, and the positive goes through the roll spring.';
  const Q4A = "(a) Determine the d.c. test voltage for String B's core sheaths.";

  const RES_P1 = 'L1 and L3 each hold ' + f4a.text + ' for the full minute. On L2, the test set trips at ' + f1(TRIP_KV) + ' kV after ' + TRIP_S + ' s. These are practice values.';
  const RES_P2 = f1(TRIP_KV) + ' kV across ' + fT.text + ' is ' + fL2s.work + ". L2's sheath broke down far below the " + RATE + ' kV/mm it should hold, so L2 fails.';
  const RES_P3 = "Set that beside L2's flat PI of " + f3b.text + '. The PI pointed to a steady leakage in the insulation. Now the sheath will not hold, so water may have a way in. '
    + 'Record it, and find out why before you submit. On a real job you stop here and report. Each core is discharged after its test. '
    + 'Its screen and core then stay earthed for at least ' + fEarth.value + ' minutes.';

  const Q_CH = "Another cable's core sheath is " + f1(CH_T) + ' mm thick. Determine its sheath test voltage.';

  let lines = 0, lastStep = -1, finished = false;
  const STEPS = [
    { name: 'Do you still have it?', label: 'Do you still have it?', task: R_TASK, opts: [O1, O2, O3], want: O2, why: R_WORK + ' ' + R_SLIPS },
    { show: true, name: 'What it is for', label: 'What it is for', text: FOR_TEXT, terms: ['oversheath'] },
    { show: true, name: 'The why: volts per millimetre', label: 'The why: volts per millimetre', text: WHY_TEXT, terms: ['outer electrode', 'voltage per millimetre'],
      read: WHY_TEXT.replace('\n\n', ' ') + ' ' + WHY_READ + ' ' + WHY_MORE, still: { t: 4 } },
    { show: true, name: 'What to link, and where the leads go', label: 'The why: what to link, and where the leads go', text: LINK_TEXT, terms: ['linked together at both ends'],
      read: LINK_TEXT.replace('\n\n', ' ') + ' ' + LINK_READ + ' ' + NOTE_L, still: () => { typeCtl.set('semi'); K.refresh(); } },
    { name: 'Check', label: 'Check', task: C_TASK, opts: [C_O1, C_O2, C_O3], want: C_O1, why: C_RIGHT },
    { show: true, name: 'Worked example', label: 'Worked example', text: WK_HEAD, read: WK_HEAD + ' ' + WK_READ, still: () => { lines = WL.length; K.refresh(); } },
    { name: 'Section A 4(a)', label: 'Section A · Question 4', pre: PRE_4A, part: Q4A, task: PRE_4A + ' ' + Q4A, want: f4a.text,
      why: 'V = ' + RATE + ' kV/mm × thickness = ' + f4a.work.split(',')[0] + '.' },
    { show: true, name: "String B's results", label: "Section A · String B's results", text: RES_P1 + '\n\n' + RES_P2, read: RES_P1 + ' ' + RES_P2 + ' ' + RES_P3 },
    { kind: 'written', written: 'b1', name: 'Section B', label: 'Section B · Short answer', task: 'A short written answer, in your own words.' },
    { name: 'Changed numbers', label: 'Section A · Changed numbers', part: Q_CH, task: Q_CH, want: fChg.text, why: fChg.work + '.' },
    { kind: 'summary', name: 'Keep this', label: 'Keep this' },
  ];
  const iR = 0, iFor = 1, iWhy = 2, iLink = 3, iChk = 4, iWk = 5, i4A = 6, iRes = 7, iB1 = 8, iCh = 9, iK = 10;
  const S = STEPS.map(() => ({ res: null, pick: null, tries: 0, shown: false, fb: null }));
  const WORKING = [iWk, i4A, iRes, iCh];

  // Words with key terms in amber (the <mark> element), built with K.el, never innerHTML.
  function write(node, s, terms) {
    node.textContent = '';
    let rest = String(s || '');
    const list = (terms || []).slice();
    while (rest) {
      let at0 = -1, hit = null;
      list.forEach((t) => { const k = rest.indexOf(t); if (k >= 0 && (at0 < 0 || k < at0)) { at0 = k; hit = t; } });
      if (at0 < 0) { node.appendChild(document.createTextNode(nb(rest))); break; }
      if (at0 > 0) node.appendChild(document.createTextNode(nb(rest.slice(0, at0))));

      : 'You write the answer, in your own words. You get one more go, then the model answer.';
  }
  const wB1 = K.written({ id: 'b1', into: '#wr1', onMark: () => K.refresh() });
  el('wr1').addEventListener('click', () => K.refresh());
  K.summary({ into: '#keep' });
  (function () {
    const tw = document.createTreeWalker(el('keep'), NodeFilter.SHOW_TEXT), ns = [];
    while (tw.nextNode()) ns.push(tw.currentNode);
    ns.forEach((n) => { n.nodeValue = nb(n.nodeValue); });
  })();
  K.button({ label: 'Finish the lesson', into: '#fin', press: () => {
    if (at() !== iK) return;
    finished = true;
    if (typeof K.complete === 'function') K.complete();
    K.refresh();
  } });

  // ---------- the worked example, a line at each press ----------
  const wbox = K.el('div', { class: 'wl' });
  const wl = WL.map((x, k) => {
    const box = K.el('div', { class: 'line' });
    box.appendChild(K.el('span', { class: 'n' }, String(k + 1)));
    box.appendChild(write(K.el('p', { class: x.calc ? 'w' : '' }), x.w));
    wbox.appendChild(box);
    return box;
  });
  const wnote = wbox.appendChild(K.el('p', { class: 'sub' }, nb(WK_NOTE)));
  el('worked').appendChild(wbox);
  const nextLine = K.button({ label: 'Show', into: '#workedgo', press: () => {
    if (at() !== iWk || lines >= wl.length) return;
    const w = wl[lines]; lines += 1;
    w.classList.remove('enter'); void w.offsetWidth; w.classList.add('enter');
    K.refresh();
  } });

  // ---------- fixed words on their screens ----------
  el('warnFor').appendChild(K.el('p', { class: 'wh' }, 'If it is skipped'));
  el('warnFor').appendChild(K.el('p', null, nb(WARN_FOR)));
  paras(el('moreV'), WHY_MORE);
  el('capV').textContent = nb('The rule: ' + RATE + ' kV d.c. per millimetre, at most ' + CAP + " kV. String B's " + fT.text + ' is a practice value.');
  el('noteL').textContent = nb(NOTE_L);
  paras(el('resNote'), RES_P3);

  function enter() { const b = el('stepbox'); b.classList.remove('enter'); void b.offsetWidth; b.classList.add('enter'); }
  const faded = {};
  function fade(node, key) {
    if (node.hidden) { faded[node.id] = ''; return; }
    if (faded[node.id] === key) return;
    faded[node.id] = key;
    node.classList.remove('fade'); void node.offsetWidth; node.classList.add('fade');
  }
  function paintFb(f) {
    const fb = el('fb');
    fb.textContent = '';
    fb.hidden = !f;
    if (!f) return;
    fb.className = 'fb ' + (f.ok ? 'ok' : 'bad');
    fb.appendChild(K.el('p', { class: 'v' }, f.v));
    if (f.p0) fb.appendChild(write(K.el('p'), f.p0));
    (f.w || []).forEach((t) => fb.appendChild(write(K.el('p', { class: 'w' }), t)));
    if (f.p) fb.appendChild(write(K.el('p'), f.p));
  }

  // ---------- nav ----------
  const backBtn = K.button({ label: 'Back', secondary: true, into: '#nav', press: () => { if (at() > 0) stepper.set(at() - 1); } });
  const nextBtn = K.button({ label: 'Continue', into: '#nav', press: () => { const i = at(); if (canGo(i) && i < iK) stepper.set(i + 1); } });
  function canGo(i) {
    const d = STEPS[i], st = S[i];
    if (d.show) return true;
    if (i === iR) return st.res === 'wrong';
    if (i === iChk) return st.res === 'right';
    if (ANS[i]) return st.res === 'right' || st.shown;
    if (i === iB1) return !!(wB1 && wB1.answered && wB1.answered());
    return false;
  }

  const ON = { scen: [i4A], carry4a: [i4A], pre: [i4A],
    wrapX: [iFor], warnFor: [iFor],
    wrapV: [iWhy], ctlV: [iWhy], outsV: [iWhy], sayV: [iWhy], moreV: [iWhy], capV: [iWhy],
    wrapL: [iLink], ctlL: [iLink], sayL: [iLink], outsL: [iLink], noteL: [iLink],
    worked: [iWk], workedgo: [iWk], picks: [iR, iChk],
    'ans-4a': [i4A], 'ans-ch': [iCh], wrapR: [iRes], resNote: [iRes], wr1: [iB1], keep: [iK], fin: [iK] };
  const ASK = {
    [iWhy]: 'Drag the thickness from ' + fT.text + ' up to 4.0 mm.',
    [iLink]: 'Switch between the two sheath types.',
    [iWk]: 'Work each line yourself first, then press Show.',
  };

  K.update((p) => {
    const i = at(), d = STEPS[i], st = S[i];
    if (i !== lastStep) { if (lastStep !== -1) enter(); lastStep = i; if (i === i4A) scen.el.open = true; }
    Object.keys(ON).forEach((id) => { el(id).hidden = ON[id].indexOf(i) < 0; });
    el('cap').hidden = WORKING.indexOf(i) < 0;

    el('count').textContent = 'Step ' + (i + 1) + ' of ' + STEPS.length + ' · ' + d.label;
    paras(el('pre'), d.pre || '');
    const task = el('task');
    task.className = 'task' + (d.show ? ' show' : '');
    if (d.show) paras(task, d.text, d.terms);
    else write(task, d.part || (d.kind ? '' : d.task));
    task.hidden = !task.textContent;
    const sub = el('sub');
    sub.className = 'sub' + (ASK[i] ? ' ask' : '');
    sub.textContent = nb(ASK[i] ? ASK[i]
      : i === i4A ? 'Give it in kV, to 1 place.'
      : i === iCh ? 'Same method, new numbers. These are practice values. Give it in kV, to 1 place.'
      : i === iB1 ? markLine('b1')
      : i === iK ? 'One card to come back to on a real job.' : '');
    sub.hidden = !sub.textContent;

    drawVolts(p);
    drawLong(p);
    const fk = i === iFor ? 'F' : '';
    if (fk && fk !== flowKey) { flowLeft = 4; if (!anim.playing()) anim.play(); }
    flowKey = fk;

    // Picks.
    const opts = d.opts || [];
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      b.setLabel(nb(opts[k]));
      const done = st.res === 'right' || (i === iR && st.res === 'wrong');
      b.el.classList.toggle('is-right', done && opts[k] === d.want);
      b.el.classList.toggle('is-wrong', st.res === 'wrong' && opts[k] === st.pick);
      b.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });

    // The worked example's lines, and the note once they are all shown.
    wl.forEach((w, k) => { w.hidden = k >= lines; });
    wnote.hidden = lines < wl.length;
    nextLine.el.hidden = lines >= wl.length;
    if (i === iWk) el('workedgo').hidden = lines >= wl.length;

    // Check, the feedback, and what follows a finished typed answer.
    const typed = !!ANS[i], typedDone = typed && (st.res === 'right' || st.shown);
    checkBtn.el.hidden = !typed || typedDone;
    el('acts').hidden = checkBtn.el.hidden;
    paintFb(st.fb);
    const after = el('after');
    paras(after, typedDone ? SPEC[i].after : '');
    after.hidden = !after.textContent;
    el('go').hidden = !(i === iR && st.res === 'right');
    [['fb', JSON.stringify(st.fb)], ['after', i + after.textContent], ['go', String(i)]].forEach(([id, key]) => fade(el(id), key));

    el('donefb').textContent = finished && i === iK ? 'Lesson finished. Back is there whenever you want another look.' : '';
    el('donefb').hidden = !el('donefb').textContent;

    backBtn.el.hidden = i === 0;
    nextBtn.el.hidden = i === iK || !canGo(i) || (i === iR && st.res === 'right');
    el('nav').hidden = backBtn.el.hidden && nextBtn.el.hidden;
  });

  // ---------- known answers, worked out by hand ----------
  const near = (a, b, t) => K.near(a, b, t == null ? 1e-6 : t);
  const IEC = 'https://standards.iteh.ai/catalog/standards/iec/aacabf76-da34-460c-aece-fd3e29ad1988/iec-60229-2007';
  K.check('Test voltage 4.0 kV at 1.0 mm, 8.8 at 2.2, 10.0 at 2.5, 3.0 and 4.0 mm; stress 4.00, 4.00, 4.00, 3.33 and 2.50 kV/mm', () => {
    const A = (t) => K.at({ t: t });
    return f1(A(1).V) === '4.0' && f1(A(2.2).V) === '8.8' && f1(A(2.5).V) === '10.0' && f1(A(3).V) === '10.0' && f1(A(4).V) === '10.0'
      && f2(A(1).E) === '4.00' && f2(A(2.2).E) === '4.00' && f2(A(2.5).E) === '4.00' && f2(A(3).E) === '3.33' && f2(A(4).E) === '2.50';
  });
  K.check('The voltage rises with thickness up to 2.5 mm, then stays at 10 kV while the stress falls', () => {
    for (let k = 10; k < 40; k++) {
      const a = K.at({ t: k / 10 }), b = K.at({ t: (k + 1) / 10 });
      if (k < 25 && !(b.V > a.V && near(a.E, RATE) && near(b.E, RATE))) return false;
      if (k >= 25 && !(near(b.V, CAP) && b.E < a.E)) return false;
    }
    return near(CAPT, CAP / RATE);
  });
  K.check('A d.c. voltage of 4 kV per millimetre of specified oversheath thickness, with a maximum of 10 kV d.c., for 1 min', () =>
    RATE === 4 && CAP === 10 && MIN === 1 && near(Vof(2), 8) && near(Vof(3), 10), { source: IEC });
  K.check('In the factory, a d.c. voltage of 8 kV per millimetre of specified nominal oversheath thickness for 1 min: 17.6 kV on 2.2 mm', () =>
    FACT === 8 && near(r1(FACT * T_B), F('4a.slip3').value) && near(FACT, 2 * RATE), { source: IEC });
  K.check('An insulating outer sheath gets a 10 kV d.c. test for 1 minute between cable sheath and earth', () => FLAT === 10 && MIN === 1,
    { source: 'https://cms.eirgrid.ie/sites/default/files/publications/OCDS-GFS-00-001-R2-Submarine-Cables-Functional-Specification.pdf' });
  K.check('Earth the screens after an insulation resistance test on a sheath for at least 5 minutes', () => near(fEarth.value, 5) && FIVE * MIN >= 5,
    { source: 'https://www.nexans.co.nz/en/dam/jcr:f1babdb7-b5d7-40aa-9780-92a90e341bd3/Section%20Four.pdf' });
  K.check('Water trees grow relatively slowly over a period of months or years', () => TREE2 === 'months or years later',
    { source: 'https://repository.gatech.edu/server/api/core/bitstreams/fb791a4d-a217-43bf-8f1a-c7d9874ad539/content' });
  K.check('Recall 8.0 kV on 2.0 mm (slips 4.0 and 10.0); check P 6.0 kV and 4.00 kV/mm, Q 14.0 by the rate, so 10.0 kV and 2.86 kV/mm; worked example 7.2 kV on 1.8 mm', () =>
    near(REC_T, 2) && near(r1(Vof(REC_T)), fRec.value) && near(RATE, fRS2.value) && near(CAP, fRS1.value)
    && near(P_T, 1.5) && near(r1(vP), fP.value) && near(r2(vP / P_T), fPs.value)
    && near(Q_T, 3.5) && near(r1(RATE * Q_T), 14) && near(r1(vQ), fQ.value) && near(r2(vQ / Q_T), fQs.value)
    && near(WEX_T, 1.8) && near(r1(Vof(WEX_T)), fWex.value) && near(FIVE * MIN, fEarth.value));
  K.check("4(a): 4 × 2.2 = 8.8 kV and 4.00 kV/mm; L2's trip at 3.2 kV after 20 s is 1.45 kV/mm; changed numbers 3.0 mm: 12.0 by the rate, so 10.0 kV and 3.33 kV/mm", () =>
    near(r1(Vof(T_B)), f4a.value) && near(r2(Vof(T_B) / T_B), fS4a.value) && near(TRIP_KV, 3.2) && TRIP_S === 20 && near(r2(TRIP_KV / T_B), fL2s.value)
    && near(CH_T, 3) && near(r1(RATE * CH_T), F('l4.changed.slip').value) && near(r1(Vof(CH_T)), fChg.value) && near(r2(Vof(CH_T) / CH_T), fChgS.value)
    && near(K.at({ sheath: 'semi' }).vSh, f4a.value) && near(K.at({ sheath: 'ins' }).vSh, f4a.value));
  K.check('With conductor, foil and screen linked, the XLPE has 0.0 kV across it on both sheath types', () =>
    K.at({ sheath: 'ins' }).vX === 0 && K.at({ sheath: 'semi' }).vX === 0);
  K.check('Field lines: 8 at 4.00 kV/mm, 7 at 3.33, 5 at 2.50 kV/mm', () =>
    nLines(K.at({ t: 2.2 }).E) === 8 && nLines(K.at({ t: 3 }).E) === 7 && nLines(K.at({ t: 4 }).E) === 5);
  K.check("Every slip lies outside its answer's accepted figures", () => Object.keys(SPEC).every((k) => {
    const sp = SPEC[k], tol = 0.05;
    return sp.slips.every((s) => Math.abs(s.value - sp.fig.value) > tol && sp.accept.every((x) => Math.abs(s.value - x) > tol));
  }));

  K.ready();
</script>
