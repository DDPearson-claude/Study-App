<script>
  // ---------- the rule ----------
  // Between off and on the switch acts like a resistor in series with the load: at a setting s it
  // takes 600 × (1 − s) volts, never below its 2 V drop fully on. The current is the rest of the
  // supply over the load, and the heat in the switch is its voltage times its current.
  const VS = 600, R = 30, VON = 2, RTH = 0.5, TAIR = 40, TJMAX = 150, TTOP = 200, TE = 0.5e-6, LH = 10e-3, VF = 0.7, VTOP = 1000;
  const PTOP = (TTOP - TAIR) / RTH;            // the heat that takes the junction to the top of the thermometer
  const SHED = (TJMAX - TAIR) / RTH;           // what the heat sink can shed
  const INF1 = 'https://www.infineon.com/assets/row/public/documents/faq/igbt-power-losses-calculation-using-the-data-sheet-parameters.pdf';
  const AAC = 'https://www.allaboutcircuits.com/textbook/semiconductors/chpt-3/introduction-to-diodes-and-rectifiers/';
  const INF6 = 'https://www.infineon.com/assets/row/public/documents/24/42/infineon-an2011-05-igbt-modules-explanation-applicationnotes-en.pdf';
  const fx = (v, d) => (Math.abs(v) < 0.5 * Math.pow(10, -d) ? 0 : v).toFixed(d).replace('-', '−');
  const vsw = (s) => Math.max(VON, VS * (1 - s));
  const amps = (s) => (VS - vsw(s)) / R;
  const watts = (s) => vsw(s) * amps(s);
  const ION = amps(1);
  // Each edge sweeps straight through the hump, which averages a sixth of 600 V × 20 A.
  const EEDGE = VS * (VS / R) / 6 * TE;        // joules per edge
  const P_ON = 0.5 * VON * ION;                // on half the time
  const pEdges = (fk) => 2 * EEDGE * fk * 1000;
  const pSwitch = (fk) => P_ON + pEdges(fk);
  const tj = (P) => TAIR + RTH * P;
  const TAU = LH / R;                          // seconds
  // The coil's current round the diode after opening (t in seconds), with the diode's drop.
  const coilI = (t) => Math.max(0, (ION + VF / R) * Math.exp(-t / TAU) - VF / R);
  const DEVN = { bjt: 'BJT', mosfet: 'MOSFET', igbt: 'IGBT' };
  const DEVA = { bjt: 'a BJT', mosfet: 'a MOSFET', igbt: 'an IGBT' };
  const LEAD = { bjt: 'base', mosfet: 'gate', igbt: 'gate' };
  const LEADC = { bjt: 'Base', mosfet: 'Gate', igbt: 'Gate' };

  // Every number the words show, worked out from the rule (a check compares them with the lesson's).
  const N = {
    vs: String(VS), r: String(R), on2: fx(VON, 0), i20: fx(VS / R, 0), ion: fx(ION, 1), p40: fx(watts(1), 0),
    vh: fx(vsw(0.5), 0), ih: fx(amps(0.5), 0), ih1: fx(amps(0.5), 1), ph: fx(watts(0.5), 0), r4: fx(4 * R, 0),
    rise40: fx(RTH * watts(1), 0), tj40: fx(tj(watts(1)), 0), rise3k: fx(RTH * watts(0.5), 0),
    room: fx(TJMAX - TAIR, 0), shed: fx(SHED, 0), wrong55: fx((TJMAX - TAIR) * RTH, 0), wrong300: fx(TJMAX / RTH, 0),
    x13: Math.floor(watts(0.5) / SHED), hump: fx(VS * (VS / R) / 6, 0),
    e1: fx(EEDGE * 1000, 0), e2: fx(2 * EEDGE * 1000, 0), pe10: fx(pEdges(10), 0), pon: fx(P_ON, 0), pt10: fx(pSwitch(10), 0),
    tj10: fx(tj(pSwitch(10)), 0), pe20: fx(pEdges(20), 0), pt20: fx(pSwitch(20), 0), tj20: fx(tj(pSwitch(20)), 0), pe5: fx(pEdges(5), 0),
    vavg: fx(Math.round(0.5 * (VS - VON) / 10) * 10, 0), ratio: fx(watts(0.5) / pSwitch(10), 0),
    vd: fx(VS + VF, 0), tau: fx(TAU * 1000, 2),
    v90: fx(vsw(0.9), 0), i90: fx(amps(0.9), 0), p90: fx(watts(0.9), 0), x5: fx(watts(0.9) / SHED, 0),
  };

  // ---------- the lesson: SHOW screens demonstrate, DO screens are puzzles ----------
  // set: where the controls open; play: the demonstration as the screen opens; coil: the coil screens;
  // ans.set: what a right Check moves the controls to; shows: labels that appear only after a right Check.
  const STEPS = [
    { show: true, name: 'The switch', set: { dev: 'igbt', mode: 'steady', gate: 100 },
      text: `A transistor is a switch you work with a small signal on a third lead. The heat in a switch is the voltage across it times the current through it. Here one feeds a ${N.r} Ω load from ${N.vs} V DC. That is close to a 440 V drive's DC link. Fully off, the whole ${N.vs} V sits across it. But almost no current flows. Fully on, about ${N.i20} A flows, with only about ${N.on2} V across it. So fully on, it makes about ${N.on2} × ${N.i20} = ${N.p40} W.`,
      read: `Fully on, the readouts show ${N.on2} V across the switch, a current of ${N.ion} A and ${N.p40} W of heat.`,
      still: { dev: 'igbt', gate: 100 } },
    { name: 'Off', set: { gate: 0 }, outs: 'after', hideGauge: true, hidePlot: true, ans: {},
      task: `The gate is off, and ${N.vs} V sits across the switch. How much heat does it make?`,
      opts: [`The most of any setting, from the full ${N.vs} V`, 'Almost none, as almost no current flows', `About ${N.p40} W, the same as fully on`],
      want: 'Almost none, as almost no current flows',
      hints: { [`The most of any setting, from the full ${N.vs} V`]: 'Heat is volts times amps. How many amps flow when it is off?',
        [`About ${N.p40} W, the same as fully on`]: `Fully on, ${N.on2} V meets ${N.i20} A. What current meets the ${N.vs} V when it is off?` },
      why: `Almost none. Heat is the voltage times the current. Off, only a tiny leakage current flows. So ${N.vs} V times almost nothing is almost nothing. The picture draws that leakage as zero.` },
    { show: true, name: 'Half on', set: { gate: 100 }, play: { id: 'gate', from: 100, to: 50 },
      text: `Between off and on, the transistor acts like a resistor in series with the load. Drag the gate to half on, 50%. The switch now takes half the supply, ${N.vh} V. Half the current flows, ${N.ih} A. Both are large at once. So the switch makes ${N.vh} × ${N.ih} = ${N.ph} W. The plot shows the heat against the gate setting. It is a hump. At each end, the voltage or the current is near zero. In the middle, neither is.`,
      read: `At half on, across the switch reads ${N.vh} V, the current ${N.ih1} A and the heat ${N.ph} W. The plot's dot sits on top of the hump. The hump falls to ${N.p40} W fully on and to zero off.`,
      still: { gate: 50 } },
    { name: 'The hottest setting', set: { gate: 100 }, outs: 'before', hidePlot: true, ans: {},
      task: 'Which gate setting makes the switch hottest?',
      opts: ['Fully on, with the most current', 'Fully off, with the most voltage', 'Half on'],
      want: 'Half on',
      hints: { 'Fully on, with the most current': 'Fully on, how much voltage is across the switch?',
        'Fully off, with the most voltage': 'Fully off, how much current flows?' },
      why: `Half on. There ${N.vh} V meets ${N.ih} A, which is ${N.ph} W. Fully on, ${N.i20} A meets only ${N.on2} V. Fully off, ${N.vs} V meets almost no current. So half on is no safe middle. It is the hottest place to leave this switch.` },
    { show: true, name: 'Heat into temperature', set: { gate: 100 }, play: { id: 'gate', from: 100, to: 50 },
      text: `The heat has to leave through a heat sink. Its *thermal resistance* says how far the *junction*, the silicon inside, rises above the air for each watt. Say ${RTH} °C per watt, with the air at ${TAIR} °C. Fully on, ${N.p40} W lifts the junction ${N.p40} × ${RTH} = ${N.rise40} °C, to ${N.tj40} °C. Half on, ${N.ph} W would lift it ${N.rise3k} °C. Say this transistor is rated to ${TJMAX} °C. It fails long before that.`,
      read: `Fully on, the thermometer reads ${N.tj40} °C. At half on, it runs off the top in red.`,
      still: { gate: 50 } },
    { name: 'What the sink can shed', set: { gate: 100 }, outs: 'before', ans: {}, shows: [`${N.shed} W`],
      task: `The junction may reach ${TJMAX} °C. The air is at ${TAIR} °C. How much heat can this heat sink shed?`,
      opts: [`About ${N.shed} W`, `About ${N.wrong300} W`, `About ${N.wrong55} W`],
      want: `About ${N.shed} W`,
      hints: { [`About ${N.wrong300} W`]: `Count the rise from the air at ${TAIR} °C, not from zero.`,
        [`About ${N.wrong55} W`]: `Each watt adds ${RTH} °C. So divide the rise by ${RTH}. Don't multiply.` },
      why: `About ${N.shed} W. The junction may rise ${TJMAX} − ${TAIR} = ${N.room} °C. Each watt lifts it ${RTH} °C. So ${N.room} ÷ ${RTH} = ${N.shed} W. Fully on, ${N.p40} W is well inside that. Half on, ${N.ph} W is more than thirteen times too much.` },
    { show: true, name: 'Three devices, one job', set: { dev: 'bjt', gate: 50 }, play: 'devs',
      text: `Three kinds of power transistor do this job. A *BJT*, a bipolar transistor, needs a steady current into its base to stay on. A *MOSFET* turns on with a voltage on its gate. Its gate draws almost no current except while it changes over. An *IGBT* puts a MOSFET's gate in charge of a bipolar output. It suits high voltages and currents. Pick each one at half on. The heat stays at ${N.ph} W. The circuit sets the voltage and the current. The device does not.`,
      read: `At half on, the heat reads ${N.ph} W with each device picked. Only the symbol and the name of its control lead change.`,
      still: { dev: 'igbt', gate: 50 } },
    { name: 'Swap the device', set: { dev: 'igbt', gate: 50 }, outs: 'before', ans: { set: { dev: 'mosfet' } }, shows: ['MOSFET'],
      task: 'You swap the IGBT for a MOSFET and leave it half on. What happens to the heat?',
      opts: ['It falls a long way, as the gate takes no steady current', `It stays at about ${N.ph} W`, 'It falls to nothing, as a MOSFET is a better switch'],
      want: `It stays at about ${N.ph} W`,
      hints: { 'It falls a long way, as the gate takes no steady current': 'The gate\'s current is tiny either way. Which voltage and current make the heat?',
        'It falls to nothing, as a MOSFET is a better switch': `Half on, any of these switches takes ${N.vh} V and passes ${N.ih} A here.` },
      why: `It stays at about ${N.ph} W. Half on, the switch still takes ${N.vh} V and passes ${N.ih} A. That is ${N.vh} × ${N.ih} = ${N.ph} W, whatever the device. The gate drive changes what the control circuit must supply. It does not change the heat in the switch's main path.` },
    { show: true, name: 'The edges', set: { mode: 'switch', f: 10 }, play: 'cursor',
      text: `Flipping the switch fully on and off makes far less heat. It is on half the time. The load still averages about ${N.vavg} V. No switch changes over instantly. Say each edge takes 0.5 µs. During it, the switch sweeps through half on. So each edge costs a burst of heat, about ${N.e1} mJ. This *switching loss* is the energy per switching times the frequency. Two edges a cycle at 10 kHz make ${N.pe10} W. The on half adds ${N.pon} W. The total is about ${N.pt10} W, not ${N.ph} W.`,
      read: `In switching mode at 10 kHz, the heat bar splits into ${N.pon} W on and ${N.pe10} W in the edges. The heat reads ${N.pt10} W, and the thermometer ${N.tj10} °C.`,
      still: { mode: 'switch', f: 10 } },
    { name: 'Twice the frequency', set: { mode: 'switch', f: 10 }, outs: 'before', ans: { set: { f: 20 } }, shows: [`edges ${N.pe20} W`],
      task: 'You raise the frequency to 20 kHz. What do the edges make now?',
      opts: [`About ${N.pe10} W, as each edge costs the same`, `About ${N.pe5} W, as each cycle is shorter`, `About ${N.pe20} W`],
      want: `About ${N.pe20} W`,
      hints: { [`About ${N.pe10} W, as each edge costs the same`]: 'Each edge costs the same. How many edges come each second now?',
        [`About ${N.pe5} W, as each cycle is shorter`]: 'A shorter cycle means more edges each second, not fewer.' },
      why: `About ${N.pe20} W. Each cycle costs about ${N.e2} mJ, ${N.e1} mJ an edge. At 20,000 cycles a second, that is ${N.e2} mJ × 20,000 = ${N.pe20} W. The on part stays at ${N.pon} W. So the switch makes ${N.pt20} W in all. The junction reaches ${N.tj20} °C.` },
    { show: true, name: 'The coil kicks back', coil: true, set: { load: 'coil', diode: false, gate: 100 }, play: 'open',
      text: `A coil keeps its current going, as v = L di/dt says. Many loads are coils, such as contactors and motor windings. Open the switch, and the coil's current has nowhere to go. The switch tries to stop it in about 0.5 µs. So di/dt is huge. The coil's voltage spikes far above the supply, across the switch. A diode across the coil gives the current a path round. It is fitted to block the supply. Through this *freewheeling diode*, the coil sees only its drop, about ${VF} V.`,
      read: `With no diode, opening the switch sends its voltage up in a red spike off the top of the scale. With the diode ticked, the switch's voltage steps to about ${N.vd} V. The coil's current then dies away round the diode.`,
      still: () => finishOpen(true) },
    { name: 'No diode', coil: true, set: { load: 'coil', diode: false, gate: 100 }, ans: { open: true }, shows: ['spike'],
      task: 'The switch opens on the coil with no diode. What voltage does the switch see?',
      opts: [`A spike far above ${N.vs} V`, `${N.vs} V, the supply`, 'Zero, as the current stops'],
      want: `A spike far above ${N.vs} V`,
      hints: { [`${N.vs} V, the supply`]: 'The coil\'s current can\'t stop at once on its own. What does v = L di/dt give for a sudden stop?',
        'Zero, as the current stops': 'A sudden stop in a coil\'s current is what makes its voltage jump.' },
      why: `A spike far above ${N.vs} V. The switch tries to force the coil's current from ${N.ion} A to zero in about 0.5 µs. So di/dt is huge, and so is L di/dt. That voltage adds to the supply across the switch. It can break the switch down. With the diode, the switch sees only about ${N.vd} V.` },
    { name: 'The coolest way', set: { dev: 'igbt', mode: 'steady', gate: 50 }, outs: 'after', hideGauge: true, hidePlot: true,
      ans: { set: { mode: 'switch', f: 10 }, cursor: true }, shows: [`edges ${N.pe10} W`],
      task: `You want the load to average ${N.vavg} V from the ${N.vs} V supply. Which way keeps the IGBT coolest?`,
      opts: ['Hold the gate at half on', `Either way, as the load gets ${N.vavg} V both ways`, 'Flip it fully on and off, on half the time'],
      want: 'Flip it fully on and off, on half the time',
      hints: { 'Hold the gate at half on': `Half on, the IGBT takes ${N.vh} V and passes ${N.ih} A. What heat is that?`,
        [`Either way, as the load gets ${N.vavg} V both ways`]: 'The load\'s average is the same. Compare the heat in the switch.' },
      why: `Flip it. At 10 kHz, it makes about ${N.pt10} W: ${N.pon} W on and ${N.pe10} W in its edges. Held half on, it makes ${N.ph} W. The load averages about ${N.vavg} V both ways. But the switch's heat differs by about ${N.ratio} times.` },

    for (let g = 0; g <= 100; g += 5) if (g !== 50 && !(K.at({ mode: 'steady', gate: g }).heat < h.heat)) return false;
    return true;
  });
  K.check('The heat rises all the way from off to half on, and the hump is the same either side of half on', () => {
    for (let g = 5; g <= 50; g += 5) if (!(watts(g / 100) > watts((g - 5) / 100))) return false;
    for (let g = 5; g < 50; g += 5) if (!K.near(watts(g / 100), watts(1 - g / 100), 1e-6)) return false;
    return true;
  });
  K.check('At 90% the switch takes 60 V and passes 18 A: 60 × 18 = 1080 W, about five times the 220 W the heat sink can shed', () => {
    const a = K.at({ mode: 'steady', gate: 90 });
    return fx(a.vSwitch, 0) === '60' && fx(a.current, 1) === '18.0' && fx(a.heat, 0) === '1080' && N.x5 === '5' && N.shed === '220';
  });
  K.check('The junction reads 40 + 0.5 × the heat: 60 °C fully on, while 3000 W would lift it 1500 °C. A rise of 150 − 40 = 110 °C lets the sink shed 110 ÷ 0.5 = 220 W', () =>
    N.tj40 === '60' && N.rise40 === '20' && N.rise3k === '1500' && N.room === '110' && K.near(SHED, 220, 1e-9) && K.near(tj(SHED), TJMAX, 1e-9) && N.x13 === 13);
  K.check('The switching losses are the product of switching energies and the switching frequency: 2 mJ a cycle makes 20 W at 10 kHz and 40 W at 20 kHz', () =>
    K.near(pEdges(10), 20, 1e-9) && K.near(pEdges(20), 40, 1e-9) && K.near(2 * EEDGE, 2e-3, 1e-15) &&
    K.near(K.at({ mode: 'switch', f: 20 }).heat - K.at({ mode: 'switch', f: 10 }).heat, 20, 1e-9), { source: INF1 });
  K.check('An edge sweeps straight through the hump, which averages a sixth of 600 V × 20 A = 2000 W, so 0.5 µs costs 1 mJ', () => {
    let a = 0;
    const n = 6000;
    for (let j = 0; j < n; j++) { const x = VS * (j + 0.5) / n; a += x * (VS - x) / R / n; }
    return K.near(a, 2000, 0.01) && K.near(EEDGE, 1e-3, 1e-12) && N.hump === '2000' && N.e1 === '1' && N.e2 === '2';
  });
  K.check('Switching at 10 kHz: 20 W on and 20 W in the edges, 40 W in all, with the junction at 60 °C. At 20 kHz: 60 W in all and 70 °C', () =>
    fx(K.at({ mode: 'switch', f: 10 }).heat, 0) === '40' && N.pon === '20' && N.pe10 === '20' && N.tj10 === '60' &&
    fx(K.at({ mode: 'switch', f: 20 }).heat, 0) === '60' && N.pt20 === '60' && N.tj20 === '70');
  K.check('The IGBT should not be operated in linear mode, as this causes excessive conduction losses: held half on it makes 3000 W, about 75 times the 40 W it makes switching at 10 kHz', () =>
    K.near(K.at({ dev: 'igbt', mode: 'steady', gate: 50 }).heat / K.at({ dev: 'igbt', mode: 'switch', f: 10 }).heat, 75, 0.5) && N.ratio === '75', { source: INF6 });
  K.check('Silicon diodes have a forward voltage of approximately 0.7 volts, so with the freewheeling diode the open switch sees 600 + 0.7, about 601 V', () =>
    N.vd === '601' && drawnAt(10, { load: 'coil', diode: true }, false).texts.indexOf('601 V') >= 0, { source: AAC });
  K.check('Round the diode, the coil\'s current dies away with a time constant of L ÷ R = 10 mH ÷ 30 Ω, about 0.33 ms', () => {
    const r = coilI(TAU) / coilI(0);
    return N.tau === '0.33' && K.near(coilI(0), ION, 1e-9) && r > 0.36 && r < 0.37 && coilI(0.01) === 0;
  });
  K.check('With no diode, opening the switch on the coil sends its voltage off the top of the 1000 V scale. With the diode, or with a resistor, it does not', () =>
    drawnAt(10, { load: 'coil', diode: false }).spike && !drawnAt(10, { load: 'coil', diode: true }).spike && !drawnAt(10, { load: 'res' }).spike);
  K.check('A BJT, a MOSFET and an IGBT each make 3000 W half on. Only the symbol and the name of the control lead change', () =>
    ['bjt', 'mosfet', 'igbt'].every((x) => K.near(K.at({ dev: x, mode: 'steady', gate: 50 }).heat, 3000, 1e-6)) &&
    drawnAt(6, { dev: 'bjt' }).texts.indexOf('base drive') >= 0 && drawnAt(6, { dev: 'mosfet' }).texts.indexOf('gate drive') >= 0);
  K.check('The thermometer reads 60 °C fully on. Half on it passes 150 °C and runs off the top, and so does the heat bar', () => {
    const a = drawnAt(4, { gate: 100 }), b = drawnAt(4, { gate: 50 });
    return a.texts.indexOf(N.tj40 + ' °C') >= 0 && !a.thermHot && !a.thermOff && !a.barOff && b.thermHot && b.thermOff && b.barOff;

  K.check('Each puzzle offers three answers and accepts only its right one, every wrong answer has its own hint, and the picture keeps the answer hidden until a right Check', () =>
    DO.every((i) => {

  K.check('Each demonstration ends within 4.5 s of its screen opening, and a right answer shows within 3 s of Check', () =>
    DEMO + FADE <= 4.5 && ANS + K.SOFT <= 3);
  K.check('Every number in the words comes from the rule: 20, 19.9, 40, 300, 10, 3000, 120, 60, 1500, 110, 220, 55, 1 and 2 mJ, 20, 40, 60, 70, 75, 601, 0.33, 18 and 1080', () =>
    N.i20 === '20' && N.ion === '19.9' && N.p40 === '40' && N.vh === '300' && N.ih === '10' && N.ih1 === '10.0' && N.ph === '3000' && N.r4 === '120' &&
    N.tj40 === '60' && N.rise3k === '1500' && N.room === '110' && N.shed === '220' && N.wrong55 === '55' && N.wrong300 === '300' && N.e1 === '1' &&
    N.e2 === '2' && N.pe10 === '20' && N.pon === '20' && N.pt10 === '40' && N.pe20 === '40' && N.pt20 === '60' && N.tj20 === '70' && N.pe5 === '10' &&
    N.vavg === '300' && N.ratio === '75' && N.vd === '601' && N.tau === '0.33' && N.v90 === '60' && N.i90 === '18' && N.p90 === '1080');

  K.ready();
