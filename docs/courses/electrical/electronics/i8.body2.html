<style>

  /* Harmonics: the dashed ideal block, the solid sum of sines, the newest sine alone. */

  .fig .newh { fill: none; stroke: var(--k-accent); stroke-width: 1.6; }
  .fig .brk { fill: none; stroke: var(--k-ink); stroke-width: 1.4; }
  .fig .slot { stroke: var(--k-muted); stroke-width: 1.5; }
  .fig .bar { fill: var(--k-accent2); }
  .fig .gapbg { fill: var(--k-bg); }
  .fig .rng { fill: var(--k-fill3); stroke: var(--k-muted); stroke-width: 1.2; }

  /* The DC link after isolation. */

  .fig .cvA { stroke: var(--k-cat1); }
  .fig .cvB { stroke: var(--k-cat2); }
  .fig .cv.sel { stroke-width: 3.2; }
  .fig .mk { stroke-width: 1.6; stroke-dasharray: 2 3; }
  .fig .guide { stroke: var(--k-muted); stroke-width: 1.2; stroke-dasharray: 3 3; }
  .fig .dot { fill: var(--k-accent2); stroke: var(--k-bg); stroke-width: 2; }
  /* The circuit: thin wires, the paths that carry current bold. */
  .fig .wire { fill: none; stroke: var(--k-strong); stroke-width: 2; stroke-linejoin: round; }
  .fig .wire.on { stroke: var(--k-accent2); stroke-width: 3.5; }
  .fig .wire.hot { stroke: var(--k-warn); stroke-width: 3.5; }
  .fig .wire.flt { stroke: var(--k-warn); stroke-width: 2; }
  .fig .dev { fill: var(--k-panel); stroke: var(--k-ink); stroke-width: 2; }
  .fig .fbox { fill: none; stroke: var(--k-muted); stroke-width: 1.4; stroke-dasharray: 4 3; }
  .fig .fuse { fill: var(--k-panel); stroke: var(--k-ink); stroke-width: 1.5; }
  .fig .fuse.blown { stroke: var(--k-warn); stroke-width: 2; }
  .fig .rcd { fill: none; stroke: var(--k-ink); stroke-width: 2; }
  .fig .earth { stroke: var(--k-strong); stroke-width: 3; }
  .fig .jn { fill: var(--k-ink); }
  .fig .jn.w { fill: var(--k-warn); }
  .fig .lamp { fill: var(--k-panel); stroke: var(--k-ink); stroke-width: 1.5; }
  .fig .lamp.lit { fill: var(--k-warn); stroke: var(--k-warn); }
  .fig .tagbg { fill: var(--k-fill2); }

  /* Phasors: each capacitor's current, the same laid end to end, and their sum. */
  .fig .ph { stroke: var(--k-ink); stroke-width: 2; }
  .fig .phh { fill: var(--k-ink); }
  .fig .ch { stroke: var(--k-muted); stroke-width: 1.4; stroke-dasharray: 4 3; }
  .fig .chh { fill: var(--k-muted); }
  .fig .sm { stroke: var(--k-accent2); stroke-width: 3.5; }
  .fig .sm.hot { stroke: var(--k-warn); }
  .fig .smh { fill: var(--k-accent2); }
  .fig .smh.hot { fill: var(--k-warn); }
  .fig .zc { fill: none; stroke: var(--k-accent2); stroke-width: 2; }

<script>
  // ---------- the rules ----------
  const PI = Math.PI, D2R = PI / 180;
  const SRC = {
    imd: 'https://industrialmonitordirect.com/blogs/knowledgebase/vfd-input-transformer-grounding-ungrounded-secondary-design',
    ei: 'https://www.electricalindia.in/harmonics-in-power-system-2',
    abs: 'https://ww2.eagle.org/content/dam/eagle/rules-and-guides/current/conventional_ocean_service/150_ctrlofharmonicsinelecpowersystems/electrical-harmonics-gn.pdf',
    idc: 'https://www.idc-online.com/technical_references/pdfs/electrical_engineering/Harmonic_Sources_from_Industrial_Loads_I.pdf',
    gamry: 'https://www.gamry.com/application-notes/EIS/total-harmonic-distortion',
    ieee: 'https://ewh.ieee.org/r3/nashville/events/2005/Harmonics_MCPQG_IEEE_2005.pdf',
    tdk: 'https://www.tdk-electronics.tdk.com/download/3107180/7f30b0110a521bb506ace36f0c56af5c/pdf-technical-information.pdf',
    abb: 'https://library.e.abb.com/public/9fbb4caf4e7b4bf7970839b083ba5396/EN_Drive_systems_grounding_and_cabling_REF_D_A4.pdf?x-sign=3SuYnT4patNrek9eD4F4v49jpMcUC0PsAumf%2Bd3ip%2Bf30Y78wR1WZlqqtMyHTOtx',
  };
  const fx = (v, d) => (Math.abs(v) < 0.5 * Math.pow(10, -d) ? 0 : v).toFixed(d).replace('-', '−');
  const fxt = (v, d) => fx(v, d).replace(/\.0+$/, '');
  const ORDN = (h) => h + (h % 10 === 1 && h % 100 !== 11 ? 'st' : h % 10 === 2 && h % 100 !== 12 ? 'nd' : h % 10 === 3 && h % 100 !== 13 ? 'rd' : 'th');

  // Harmonics. One line's current in ideal blocks of height 1: forward from 30° to 150°, back from 210° to 330°.
  // Each line sits in two of the six 60° diode pairs each way, so it conducts 120° and rests 60°.
  const EDGES = [30, 150, 210, 330];
  const block = (deg) => { const a = ((deg % 360) + 360) % 360; return a > EDGES[0] && a < EDGES[1] ? 1 : a > EDGES[2] && a < EDGES[3] ? -1 : 0; };
  // Its exact Fourier sine for order h: (1/π) × the integral of the block × sin(hθ) over one cycle.
  const coefRaw = (h) => (Math.cos(h * PI / 6) - Math.cos(5 * h * PI / 6) - Math.cos(7 * h * PI / 6) + Math.cos(11 * h * PI / 6)) / (PI * h);
  const COEF = {};
  const coef = (h) => (COEF[h] != null ? COEF[h] : (COEF[h] = Math.abs(coefRaw(h)) < 1e-9 ? 0 : coefRaw(h)));
  const B1 = coef(1);                              // 2√3 ÷ π = 1.10
  const ORD = [];                                  // the orders the block holds below 20, from the rule
  for (let h = 1; h < 20; h++) if (coef(h) !== 0) ORD.push(h);
  const share = (h) => Math.abs(coef(h) / B1);     // each harmonic as a share of the fundamental, 1/h
  const EVERY = 7;
  const SINES = ['Fundamental only', 'Up to the 5th', 'Up to the 7th', 'Up to the 11th', 'Up to the 13th', 'Up to the 17th', 'Up to the 19th', 'Every harmonic'];
  // Every harmonic: the block's rms² is 2/3 (it flows for 240° of 360°), the fundamental's B1² ÷ 2.
  const THD_ALL = Math.sqrt((2 / 3 - B1 * B1 / 2) / (B1 * B1 / 2));
  function thdOf(k) {
    k = K.clamp(Math.round(+k) || 0, 0, EVERY);
    if (k >= EVERY) return 100 * THD_ALL;
    let s = 0;
    for (let j = 1; j <= k; j++) s += share(ORD[j]) * share(ORD[j]);
    return 100 * Math.sqrt(s);
  }
  // g is the setting drawn; it sits between two settings while a sine ticks on.
  function thdAt(g) {
    const n = Math.floor(g + 1e-9), f = g - n;
    if (n >= EVERY || f < 1e-6) return thdOf(n);
    const a = thdOf(n), w = K.ease(f);
    if (n + 1 >= EVERY) return a + w * (thdOf(EVERY) - a);
    const b = w * share(ORD[n + 1]);
    return 100 * Math.sqrt((a / 100) * (a / 100) + b * b);
  }
  function partial(deg, n) {
    let s = 0;
    const th = deg * D2R;
    for (let j = 0; j <= n && j < ORD.length; j++) s += coef(ORD[j]) * Math.sin(ORD[j] * th);
    return s;
  }
  function sumAt(deg, g) {
    const n = Math.floor(g + 1e-9), f = g - n;
    if (n >= EVERY) return block(deg);
    const a = partial(deg, n);
    if (f < 1e-6) return a;
    const b = n + 1 >= EVERY ? block(deg) : partial(deg, n + 1);
    return a + K.ease(f) * (b - a);
  }
  const RANGES = [{ n: 6, lo: 25, hi: 40 }, { n: 12, lo: 9, hi: 11 }, { n: 18, lo: 3, hi: 4 }];   // current THD of real drives [6]

  // After isolation: the link drains through the bleed resistor, V = 540 × e^(−t ÷ RC).
  const V0 = 1.35 * 400, RB = 27e3, CAP = { A: 2200e-6, B: 6600e-6 };
  const rc = (d) => RB * CAP[d === 'B' ? 'B' : 'A'];
  const linkAt = (d, min) => V0 * Math.exp(-Math.max(0, +min || 0) * 60 / rc(d));

  // Leakage: three 100 nF capacitors, line to a point bonded to earth, on a 230/400 V, 50 Hz supply.
  const FS = 50, CF = 100e-9, XC = 1 / (2 * PI * FS * CF), VLE = 230, VLL = 400;
  const IC = VLE / XC * 1000, IF = VLL / XC * 1000;   // mA through each capacitor: line to earth, then line to line
  const CASES = [{ id: 'bal', label: 'Earthed, balanced' }, { id: 'lost', label: 'Earthed, a phase lost' }, { id: 'ins', label: 'Insulated, healthy' },
    { id: 'fault', label: 'Insulated, L1 earth fault' }, { id: 'out', label: 'Insulated, fault, filter out' }];
  const CASE_IDS = CASES.map((c) => c.id);
  const caseOf = (v) => (CASE_IDS.indexOf(v) >= 0 ? v : 'bal');
  const caseLabel = (v) => CASES[CASE_IDS.indexOf(caseOf(v))].label;
  const pol = (m, deg) => [m * Math.cos(deg * D2R), m * Math.sin(deg * D2R)];
  // Each capacitor's current as a phasor in mA (drawn angles, 120° apart; with L1 at earth, L2 and L3 see 400 V, 60° apart).
  function vecs(c) {
    switch (caseOf(c)) {
      case 'bal': case 'ins': return [pol(IC, -90), pol(IC, 30), pol(IC, 150)];
      case 'lost': return [[0, 0], pol(IC, 30), pol(IC, 150)];
      case 'fault': return [[0, 0], pol(IF, 60), pol(IF, 120)];
      default: return [[0, 0], [0, 0], [0, 0]];
    }
  }
  // Is there a way back through earth? Earthed: the star point. Insulated: only through a fault, and only with the filter in.
  const PATH = { bal: true, lost: true, ins: false, fault: true, out: false };
  const vsum = (V) => V.reduce((s, q) => [s[0] + q[0], s[1] + q[1]], [0, 0]);
  function earthOf(c) {
    c = caseOf(c);
    if (!PATH[c]) return 0;
    const s = vsum(vecs(c)), m = Math.hypot(s[0], s[1]);
    return m < 1e-6 ? 0 : m;
  }

  // Every number the words show, worked out from the rules (a check compares them with the lesson's).
  const N = (() => {
    const n = {}, s5 = share(5), s7 = share(7);
    n.b1 = fx(B1, 2);
    n.sh = ORD.map((h) => fxt(100 * share(h), 1));
    n.thd = [0, 1, 2, 3, 4, 5, 6, 7].map((k) => fx(thdOf(k), 0));
    n.p12 = fx(60 * s5, 0); n.p300 = String(5 * 60); n.p250 = String(5 * 50);
    n.h9 = String(9 * 50); n.h10 = String(10 * 50); n.h11 = String(11 * 50);
    n.add34 = fx(100 * (s5 + s7), 0); n.sq6 = fx(100 * (s5 * s5 + s7 * s7), 0);
    n.f20 = fx(s5, 2); n.f143 = fx(s7, 3); n.sq = fx(s5 * s5 + s7 * s7, 4); n.r25 = fx(Math.sqrt(s5 * s5 + s7 * s7), 2);
    n.v0 = fx(V0, 0); n.rcA = fx(rc('A'), 0); n.rcB = fx(rc('B'), 0);
    n.mA = fx(rc('A') / 60, 0); n.mB = fx(rc('B') / 60, 0);
    n.w5 = fx(5 * rc('A') / 60, 0); n.w15 = fx(5 * rc('B') / 60, 0);
    n.v3 = fx(linkAt('A', +n.w5), 0); n.v3b = fx(linkAt('B', +n.w15), 0); n.b100 = fx(linkAt('B', +n.w5), 0);
    n.s300 = String(+n.w5 * 60); n.cx = fx(CAP.B / CAP.A, 0);
    n.xc = fx(XC / 1000, 1); n.ic = fx(IC, 1); n.lost = fx(earthOf('lost'), 1); n.i3s = fx(3 * +fx(IC, 1), 1);
    n.ifl = fx(IF, 1); n.fault = fx(earthOf('fault'), 1);
    return n;
  })();

  // ---------- the lesson: SHOW screens demonstrate, DO screens are puzzles ----------
  // card: h (harmonics), d (after isolation), e (leakage); set: where its controls open; play: the demonstration;
  // ans.set: what a right Check moves; shows: words that appear only after a right Check; outs 'after': readout hidden till then.
  const STEPS = [
    { show: true, card: 'h', name: 'Blocks from sines', set: { sines: 0, freq: 50 }, play: { sines: [0, 2], dur: 2.4 },
      text: `A six-pulse bridge with a large coil in its DC link draws a steady current. Each line carries it in blocks. It flows forward for 120°, rests for 60°, then flows back for 120°. The supply voltage is a sine, but this current is not. Any wave that repeats each cycle is a sum of sines. They run at whole multiples of the supply frequency. These are its *harmonics*. In ideal blocks, harmonic h is 1/h as tall as the fundamental. Add them, and the corners square up.`,
      read: `With the fundamental, 5th and 7th added, the solid sum follows the dashed block. It still ripples at the corners.`,
      still: () => pinStill({ sines: 2, freq: 50 }) },
    { card: 'h', name: 'The 5th at 60 Hz', set: { sines: 2, freq: 50 }, outs: 'after', ans: { set: { freq: 60, sines: 1 } },
      task: `A drive on a 60 Hz supply draws a 60 A fundamental, in ideal blocks. What does its 5th harmonic carry?`,
      opts: [`${N.p12} A at ${N.p300} Hz`, `${N.p12} A at ${N.p250} Hz`, `60 A at ${N.p300} Hz`], want: `${N.p12} A at ${N.p300} Hz`,
      hints: { [`${N.p12} A at ${N.p250} Hz`]: `That is the 5th of 50 Hz. This supply runs at 60 Hz.`, [`60 A at ${N.p300} Hz`]: `Each harmonic is 1/h as tall as the fundamental.` },
      why: `${N.p12} A at ${N.p300} Hz. The 5th runs at 5 × 60 = ${N.p300} Hz. In ideal blocks it is 1/5 of the fundamental, 60 ÷ 5 = ${N.p12} A. Real drives roughly follow this rule.`,
      shows: [N.p300] },
    { show: true, card: 'h', name: 'The gaps', set: { sines: 7, freq: 50 },
      text: `Look at the spectrum. A balanced bridge's bars stand only at the 5th, 7th, 11th, 13th, 17th and 19th. That is 6n ± 1. There is no even harmonic, because the backward block mirrors the forward one. There is no multiple of 3 either. Remember triplens adding in a neutral? A triplen would be in step in all three lines. A bridge's three lines have no neutral to return it. The two biggest are the 5th and the 7th.`,
      read: `The spectrum has bars at 5, 7, 11, 13, 17 and 19. The slots at the even orders and the multiples of 3 stand empty.`,
      still: () => pinStill({ sines: 7, freq: 50 }) },
    { card: 'h', name: 'Which can it draw?', set: { sines: 7, freq: 50 }, ans: {}, flag: 'ring',
      task: `Which of these could a six-pulse bridge draw from a 50 Hz supply?`,
      opts: [`The 9th, at ${N.h9} Hz`, `The 11th, at ${N.h11} Hz`, `The 10th, at ${N.h10} Hz`], want: `The 11th, at ${N.h11} Hz`,
      hints: { [`The 9th, at ${N.h9} Hz`]: `9 is a multiple of 3. Where would it return?`, [`The 10th, at ${N.h10} Hz`]: `An even harmonic needs halves that differ. These mirror.` },
      why: `The 11th, since 11 = 6 × 2 − 1. The 9th would be in step in all three lines. There is no neutral to carry it. The 10th is even, but the block's halves mirror each other.` },
    { show: true, card: 'h', name: 'One number, THD', set: { sines: 0, freq: 50 }, play: { sines: [0, 7], dur: 3.9 },
      text: `*Total harmonic distortion*, THD, puts one number on the harmonics. It is their combined rms over the fundamental's rms. Sines of different frequencies add as squares. So THD = √(I5² + I7² + …) ÷ I1. Perfect blocks give ${N.thd[7]}%. Real six-pulse drives often draw 25% to 40%. Twelve-pulse rectifiers draw far less, 9% to 11%. Eighteen-pulse ones draw 3% to 4%.`,
      read: `As the sines are added, THD climbs from 0% to ${N.thd[7]}%. Beside it, the bar for real 6-pulse drives reads 25% to 40%. The 12-pulse bar reads 9% to 11%, and the 18-pulse bar 3% to 4%.`,
      still: () => pinStill({ sines: 7, freq: 50 }) },
    { card: 'h', name: 'Two harmonics', set: { sines: 2, freq: 50 }, outs: 'after', ans: {}, flag: 'sumBar',
      task: `Only the 5th and 7th are present, at 1/5 and 1/7 of the fundamental. What is the THD?`,
      opts: [`About ${N.add34}%, the two added`, `About ${N.sq6}%, their squares added`, `About ${N.thd[2]}%`], want: `About ${N.thd[2]}%`,
      hints: { [`About ${N.add34}%, the two added`]: `Different frequencies do not add straight. They add as squares.`, [`About ${N.sq6}%, their squares added`]: `You added the squares. Now take the root.` },
      why: `About ${N.thd[2]}%. The 5th is ${N.sh[1]}% and the 7th ${N.sh[2]}%. Two sines of different frequencies multiply to an average of zero. So only their squares add. √(${N.f20}² + ${N.f143}²) = √${N.sq}, about ${N.r25}.` },
    { show: true, card: 'd', name: 'Charge after isolation', set: { drive: 'A', t: 0 }, play: { t: [0, 5], dur: 3.6 },
      text: `Isolation stops the supply. It does not empty the DC link. A *bleed resistor* across the link drains it. The voltage falls on the RC curve, V = ${N.v0} × e^(−t ÷ RC). Drive A has 2200 µF and 27 kΩ. Its RC is about ${N.mA} minute. In ${N.w5} minutes, about five time constants, it falls to about ${N.v3} V. Drive B has three times the capacitance. So it takes three times as long, about ${N.w15} minutes. Each drive has its own wait.`,
      read: `Drive A's link falls from ${N.v0} V to about ${N.v3} V at ${N.w5} minutes. Drive B's curve is still near ${N.b100} V there. It reaches about ${N.v3b} V near ${N.w15} minutes.`,
      still: () => pinStill({ drive: 'A', t: 5 }) },
    { card: 'd', name: 'Drive B at 5 minutes', set: { drive: 'B', t: 5 }, outs: 'after', ans: {},
      task: `Drive B is isolated, and its display is dark. You have waited ${N.w5} minutes, drive A's time. What is its link at?`,
      opts: [`Nothing, as the display is dark`, `About ${N.v3} V, like drive A`, `About ${N.b100} V`], want: `About ${N.b100} V`,
      hints: { 'Nothing, as the display is dark': `The display runs from a control supply. The link drains on its own curve.`, [`About ${N.v3} V, like drive A`]: `Drive B's time constant is three times drive A's.` },

    K.near(B1, 2 * Math.sqrt(3) / PI, 1e-12) && N.b1 === '1.10' && [1, 5, 7, 11, 13, 17, 19].every((h) => K.near(bNum(h), coef(h), 2e-4)));
  K.check('As a rough rule of thumb, a harmonic current is the fundamental divided by the harmonic number: 60 A carries 12 A at the 5th, and the block\'s bars read 20%, 14.3%, 9.1%, 7.7%, 5.9% and 5.3%', () =>
    ORD.slice(1).every((h) => K.near(share(h), 1 / h, 1e-9)) && N.p12 === '12' && N.sh.slice(1).join(',') === '20,14.3,9.1,7.7,5.9,5.3', { source: SRC.ei });
  K.check('The characteristic harmonics of a six-pulse bridge are h = 6n ± 1, that is 5, 7, 11, 13, 17, 19: the block has sines at these orders below 20 and no others', () => {
    if (ORD.join(',') !== '1,5,7,11,13,17,19') return false;
    for (let h = 2; h < 20; h++) if (ORD.indexOf(h) < 0 && Math.abs(bNum(h)) > 1e-4) return false;
    return ORD.slice(1).every((h) => (h + 1) % 6 === 0 || (h - 1) % 6 === 0);
  }, { source: SRC.abs });
  K.check('The two largest harmonic currents for the six-pulse drive are the fifth and seventh', () => {
    const s = ORD.slice(1).sort((a, b) => share(b) - share(a));
    return s[0] === 5 && s[1] === 7;
  }, { source: SRC.idc });
  K.check('THD is the rms of the harmonics over the rms of the fundamental: for the whole block that is 31%, and adding up every sine\'s square to the 20,001st agrees', () => {
    const ms = mean((deg) => block(deg) * block(deg), 36000), f2 = B1 * B1 / 2;
    let s = 0;
    for (let h = 3; h <= 20001; h += 2) { const b = coefRaw(h); if (Math.abs(b) > 1e-9) s += b * b / 2; }
    return K.near(ms, 2 / 3, 1e-6) && K.near(100 * Math.sqrt((ms - f2) / f2), 100 * THD_ALL, 0.01) && K.near(100 * Math.sqrt(s / f2), 100 * THD_ALL, 0.05) && N.thd[7] === '31';
  }, { source: SRC.gamry });
  K.check('As the sines are added, THD reads 0%, 20%, 25%, 26%, 27%, 28%, 28% and 31%, and never falls', () => {
    const t = [0, 1, 2, 3, 4, 5, 6, 7].map((k) => K.at({ sines: k }).thd);
    return t.map((x) => fx(x, 0)).join(',') === '0,20,25,26,27,28,28,31' && t.every((x, k) => k === 0 || x > t[k - 1]);
  });
  K.check('A 6-pulse converter draws 25% to 40% current THD, a 12-pulse one 9% to 11% and an 18-pulse one 3% to 4%: the ideal block\'s 31% sits inside the 6-pulse range', () =>
    RANGES.map((r) => r.n + ':' + r.lo + '-' + r.hi).join(',') === '6:25-40,12:9-11,18:3-4' && 100 * THD_ALL > 25 && 100 * THD_ALL < 40, { source: SRC.ieee });
  K.check('The 50 Hz bars sit at 250, 350, 550, 650, 850 and 950 Hz, and the 60 Hz ones at 300, 420, 660, 780, 1020 and 1140 Hz', () => {
    const a = drawnAt(2, { freq: 50 }).texts, b = drawnAt(2, { freq: 60 }).texts;
    return ['250', '350', '550', '650', '850', '950'].every((s) => a.indexOf(s) >= 0) && ['300', '420', '660', '780', '1020', '1140'].every((s) => b.indexOf(s) >= 0) &&
      a.indexOf('300') < 0 && b.indexOf('250') < 0;
  });
  K.check('With every harmonic the sum is the block itself; with fewer it ripples about the block, less with each sine added', () => {
    const err = (n) => mean((deg) => (partial(deg, n) - block(deg)) ** 2, 7200);
    let ok = true;
    for (let deg = 1; deg < 360; deg += 7) if (sumAt(deg, EVERY) !== block(deg)) ok = false;
    for (let n = 1; n < EVERY; n++) if (!(err(n) < err(n - 1))) ok = false;
    return ok && Math.abs(partial(90, 6) - 1) < 0.1 && err(6) > 1e-3;
  });
  K.check('The DC bus voltage ramps to approximately 1.35 × the line-to-line voltage: 1.35 × 400 V = 540 V, where both links start', () =>
    N.v0 === '540' && K.near(K.at({ drive: 'A', t: 0 }).linkV, 540, 1e-9) && K.near(K.at({ drive: 'B', t: 0 }).linkV, 540, 1e-9), { source: SRC.imd });
  K.check('On V = 540 × e^(−t ÷ RC), drive A\'s RC is 59 s and B\'s 178 s; A reads about 3 V at 5 minutes, B about 100 V then and about 3 V at 15 minutes', () =>
    N.rcA === '59' && N.rcB === '178' && fx(K.at({ drive: 'A', t: 5 }).linkV, 0) === '3' && fx(K.at({ drive: 'B', t: 5 }).linkV, 0) === '100' &&
    fx(K.at({ drive: 'B', t: 15 }).linkV, 0) === '3' && N.w5 === '5' && N.w15 === '15' && N.mA === '1' && N.mB === '3');
  K.check('Each link only falls with time, and drive B, with three times the capacitance, always holds more', () => {
    let pa_ = Infinity, pb = Infinity;
    for (let t = 0; t <= 20; t += 0.5) {
      const a = K.at({ drive: 'A', t }).linkV, b = K.at({ drive: 'B', t }).linkV;
      if (!(a < pa_) || !(b < pb) || (t > 0 && !(b > a))) return false;
      pa_ = a; pb = b;
    }
    return N.cx === '3';
  });
  K.check('X_C = 1 ÷ (2π × 50 × 100 nF) = 31.8 kΩ, so each capacitor passes 230 ÷ 31.8 kΩ = 7.2 mA; the earth current reads 0, 7.2, 0, 21.8 and 0 mA in the five cases', () =>
    N.xc === '31.8' && N.ic === '7.2' && N.ifl === '12.6' && N.i3s === '21.6' && CASE_IDS.map((c) => fx(K.at({ case: c }).earthI, 1)).join(',') === '0.0,7.2,0.0,21.8,0.0');
  K.check('Two equal currents 120° apart add to one of the same size; two 60° apart add to √3 times one', () =>
    K.near(earthOf('lost'), IC, 1e-9) && K.near(earthOf('fault'), Math.sqrt(3) * IF, 1e-9) && earthOf('bal') === 0);
  K.check('During a first earth fault on an insulated supply no notable return current path is produced: with the filter out, the L1 fault draws 0 mA', () =>
    K.at({ case: 'out' }).earthI === 0 && K.at({ case: 'ins' }).earthI === 0, { source: SRC.tdk });
  K.check('Drive EMC filters are not suitable for IT (ungrounded) systems, so disconnect these filters: every insulated case labels the filter, and with it in, an L1 fault draws 21.8 mA', () =>
    ['ins', 'fault', 'out'].every((c) => drawnAt(10, { case: c }).tag === 1) && ['bal', 'lost'].every((c) => drawnAt(10, { case: c }).tag === 0) &&
    fx(K.at({ case: 'fault' }).earthI, 1) === '21.8', { source: SRC.abb });
  K.check('Each puzzle offers three answers and accepts only its right one, every wrong answer has its own hint, and what a right Check reveals is not shown before it', () =>
    DO.every((i) => {
      const d = STEPS[i];
      if (d.opts.length !== 3 || d.opts.indexOf(d.want) < 0 || d.opts.some((o) => o !== d.want && !d.hints[o])) return false;
      const b = drawnAt(i, null, false), bt = b.texts.slice(), bf = { ring: b.ring, sumBar: b.sumBar, tag: b.tag, typeB: b.typeB };
      const a = drawnAt(i, null, true);
      const shows = (d.shows || []).every((s) => bt.indexOf(s) < 0 && a.texts.indexOf(s) >= 0);
      const flag = !d.flag || (!bf[d.flag === 'tagLit' ? 'tag' : d.flag] && !!a[d.flag === 'tagLit' ? 'tag' : d.flag]);
      return shows && flag;
    }));
  K.check('Each demonstration ends within 4.5 s of its screen opening, and a right answer shows within 3 s of Check', () =>
    STEPS.filter((d) => d.show && d.play).every((d) => FADE + demoLen(d.play) <= 4.5) && MORPH + K.SOFT <= 3 && 1 / RATE + K.SOFT <= 3 && 0.1 + K.SOFT <= 3);
  K.check('Every number in the words comes from the rules: 1.10, 20, 14.3, 25, 31, 12, 300, 550, 34, 6, 0.0604, 540, 59, 178, 3, 100, 31.8, 7.2, 21.6, 12.6 and 21.8', () =>
    N.b1 === '1.10' && N.sh[1] === '20' && N.sh[2] === '14.3' && N.thd[2] === '25' && N.thd[7] === '31' && N.p12 === '12' && N.p300 === '300' && N.p250 === '250' &&
    N.h9 === '450' && N.h10 === '500' && N.h11 === '550' && N.add34 === '34' && N.sq6 === '6' && N.f20 === '0.20' && N.f143 === '0.143' && N.sq === '0.0604' &&
    N.r25 === '0.25' && N.v0 === '540' && N.v3 === '3' && N.v3b === '3' && N.b100 === '100' && N.s300 === '300' && N.xc === '31.8' && N.ic === '7.2' &&
    N.lost === '7.2' && N.i3s === '21.6' && N.ifl === '12.6' && N.fault === '21.8');

  K.ready();
</script>
