<script>
  // ---------- the rule ----------
  const VLL = 400, K135 = 1.35, VDC = K135 * VLL, MID = VDC / 2;
  const RW = 5, LMH = 20, LW = LMH / 1000, TAU = LW / RW;
  const AXMS = 40, AX = AXMS / 1000, LAGUS = 5, LAG = LAGUS * 1e-6, DTA = 25e-6, WARM = 0.024;
  const SQ3 = Math.sqrt(3), SQ2 = Math.SQRT2;
  const rad = (d) => d * Math.PI / 180;
  const sgn = (x) => (x > 0 ? 1 : x < 0 ? -1 : 0);
  const PH = { leg: [0], h: [0], three: [0, -120, -240] };
  const dOf = (m, deg) => 0.5 + 0.5 * m * Math.sin(rad(deg));
  function avgAt(mode, m, deg) {
    if (mode === 'leg') return dOf(m, deg) * VDC;
    if (mode === 'h') return (2 * dOf(m, deg) - 1) * VDC;
    return (dOf(m, deg) - dOf(m, deg - 120)) * VDC;
  }
  const peakOf = (mode, m) => (mode === 'leg' ? MID + MID * m : mode === 'h' ? m * VDC : m * SQ3 * MID);
  const rmsOf = (mode, m) => (mode === 'leg' ? m * MID / SQ2 : mode === 'h' ? m * VDC / SQ2 : m * SQ3 * MID / SQ2);
  const lossOf = (tdUs, fcK) => 2 * tdUs * 1e-6 * fcK * 1000 * VDC;
  const zOf = (f) => { const x = 2 * Math.PI * f * LW; return { z: Math.hypot(RW, x), psi: Math.atan2(x, RW) }; };
  // The carrier has a trough (−1) at every k × Tc and a peak (+1) halfway between. A leg's top switch
  // is on while its reference is above the carrier: from tk − aL to tk + aR around each trough.
  function pulse(rf, k, Tc) {
    const tk = k * Tc;
    let aL = (rf(tk) + 1) * Tc / 4, aR = aL;
    for (let n = 0; n < 3; n++) { aL = (rf(tk - aL) + 1) * Tc / 4; aR = (rf(tk + aR) + 1) * Tc / 4; }
    return [tk - aL, tk + aR];
  }
  // A leg's switching edges between t0 and t1: [time, top switch on after it].
  function legEdges(rf, Tc, t0, t1) {
    const out = [];
    for (let k = Math.floor(t0 / Tc) - 1; k <= Math.ceil(t1 / Tc) + 1; k++) {
      const pu = pulse(rf, k, Tc);
      if (pu[1] - pu[0] < 1e-12) continue;
      const last = out[out.length - 1];
      if (last && !last[1] && pu[0] - last[0] < 1e-12) out.pop(); else out.push([pu[0], true]);
      out.push([pu[1], false]);
    }
    return out.filter((e) => e[0] > t0 && e[0] < t1);
  }
  // The motor: L di/dt = v − R i per winding, stepped exactly. Three things are stepped. The switched
  // current without dead time, and its smooth average, give the sawtooth (their difference). The
  // average with each gap's loss against the current (stalling at zero while the loss outweighs the
  // drive) gives what the sawtooth rides on.
  const SIMS = new Map();
  function simulate(mode, m, f, fcK, tdUs) {
    const key = [mode, m, f, fcK, tdUs].join('|');
    if (SIMS.has(key)) return SIMS.get(key);
    const Tc = 1 / (fcK * 1000), td = tdUs * 1e-6, w = 2 * Math.PI * f, three = mode === 'three', nP = three ? 3 : 1;
    const phs = PH[mode], rfs = phs.map((ph) => { const q = rad(ph); return (t) => m * Math.sin(w * t + q); });
    const t0 = -Math.ceil(WARM / Tc) * Tc, t1 = AX + Tc;
    const E = rfs.map((rf) => legEdges(rf, Tc, t0, t1));
    const ini = E.map((es, j) => (es.length ? !es[0][1] : rfs[j](t0) > 0));
    const S = { mode, m, f, fcK, tdUs, td, Tc, w, three, nP, rfs, E, ini, t0, t1, pts: [], draw: [], maxI: 0 };
    if (mode !== 'leg') {
      const zp = zOf(f), amp = (three ? MID : VDC) * m / zp.z;
      const i0 = () => phs.map((ph) => amp * Math.sin(w * t0 + rad(ph) - zp.psi));
      // 1. switched, no dead time
      const ev = [];
      E.forEach((es, j) => es.forEach((e) => ev.push([e[0], j, e[1]])));
      ev.sort((a, b) => a[0] - b[0]);
      const top = ini.slice();
      let cur = i0(), t = t0;
      const sw = [[t0].concat(cur)];
      for (let q = 0; q <= ev.length; q++) {
        const tn = q < ev.length ? ev[q][0] : t1;
        if (tn > t) {
          const e = Math.exp(-(tn - t) / TAU);
          let vn;
          if (!three) vn = [top[0] ? VDC : -VDC];
          else { const v = top.map((x) => (x ? VDC : 0)), s = (v[0] + v[1] + v[2]) / 3; vn = v.map((x) => x - s); }
          cur = cur.map((i, j) => vn[j] / RW + (i - vn[j] / RW) * e);
          t = tn; sw.push([t].concat(cur));
        }
        if (q < ev.length) top[ev[q][1]] = ev[q][2];
      }
      // 2. the averages, without and with the dead time's loss
      const one = td * fcK * 1000 * VDC, nG = Math.ceil((t1 - t0) / DTA), e1 = Math.exp(-DTA / TAU);
      const a0 = [], aD = [], c0 = i0(), cD = i0(), v = [0, 0, 0], vd = [0, 0, 0];
      for (let j = 0; j < nP; j++) { a0.push(new Float64Array(nG + 2)); aD.push(new Float64Array(nG + 2)); }
      for (let n = 0; n <= nG + 1; n++) {
        for (let j = 0; j < nP; j++) { a0[j][n] = c0[j]; aD[j][n] = cD[j]; }
        const tm = t0 + (n + 0.5) * DTA;
        if (!three) {
          const va = rfs[0](tm) * VDC, i = cD[0];
          c0[0] = va / RW + (c0[0] - va / RW) * e1;
          let s = sgn(i);
          if (!s && Math.abs(va) > 2 * one) s = sgn(va);
          if (!s) cD[0] = 0;
          else { const ve = va - 2 * one * s; let ni = ve / RW + (i - ve / RW) * e1; if (sgn(ni) === -s) ni = 0; cD[0] = ni; }
        } else {
          let s0 = 0, sd = 0;
          for (let j = 0; j < 3; j++) { v[j] = (0.5 + 0.5 * rfs[j](tm)) * VDC; vd[j] = v[j] - one * sgn(cD[j]); s0 += v[j] / 3; sd += vd[j] / 3; }
          for (let j = 0; j < 3; j++) {
            const vn = v[j] - s0, vdn = vd[j] - sd;
            c0[j] = vn / RW + (c0[j] - vn / RW) * e1;
            cD[j] = vdn / RW + (cD[j] - vdn / RW) * e1;
          }
        }
      }
      const gi = (arr, tt, j) => { const x = (tt - t0) / DTA, n = Math.max(0, Math.min(nG, Math.floor(x))), u = x - n, r = arr[j]; return r[n] + (r[n + 1] - r[n]) * u; };
      let k = 0;
      const swAt = (tt, j) => {
        while (k < sw.length - 2 && sw[k + 1][0] <= tt) k++;
        while (k > 0 && sw[k][0] > tt) k--;
        const a = sw[k], b = sw[k + 1];
        return b[0] - a[0] < 1e-15 ? b[j + 1] : a[j + 1] + (b[j + 1] - a[j + 1]) * (tt - a[0]) / (b[0] - a[0]);
      };
      S.iAvg = (j, tt) => gi(aD, tt, j);
      // 3. the current as drawn, at every switching edge and every 100 µs, from one carrier cycle before 0
      const times = [];
      let g = 4 * Math.ceil((-Tc - t0) / DTA / 4);
      sw.forEach((p) => {
        while (t0 + g * DTA < p[0] && g <= nG) { times.push(t0 + g * DTA); g += 4; }
        if (p[0] >= -Tc) times.push(p[0]);
      });
      k = 0;
      for (let q = 0; q < times.length; q++) {
        const tt = times[q];
        if (tt < -Tc || tt > t1) continue;
        const row = [tt];
        for (let j = 0; j < nP; j++) row.push(gi(aD, tt, j) + swAt(tt, j) - gi(a0, tt, j));
        S.pts.push(row);
        if (tt >= 0 && tt <= AX) S.maxI = Math.max(S.maxI, Math.abs(row[1]));
      }
      for (let tt = 0; tt <= AX + 1e-12; tt += 2e-4) S.draw.push([tt, gi(aD, tt, 0)]);
    }
    if (SIMS.size > 24) SIMS.delete(SIMS.keys().next().value);
    SIMS.set(key, S);
    return S;
  }
  // The current drawn at time t (phase j), from the stepped points.
  function iNow(S, t, j) {
    const P = S.pts, c = (j || 0) + 1;
    if (!P.length) return 0;
    let lo = 0, hi = P.length - 1;
    if (t <= P[0][0]) return P[0][c];
    if (t >= P[hi][0]) return P[hi][c];
    while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (P[mid][0] <= t) lo = mid; else hi = mid; }
    const a = P[lo], b = P[hi];
    return b[0] - a[0] < 1e-15 ? b[c] : a[c] + (b[c] - a[c]) * (t - a[0]) / (b[0] - a[0]);
  }
  // The current's direction at t, in leg j (the smooth average's sign); past the stepped time, its
  // steady sine.
  function iDir(S, j, t) {
    if (S.mode === 'leg') return 0;
    if (t <= S.t1 - DTA) return sgn(S.iAvg(j, t));
    const zp = zOf(S.f);
    return sgn(Math.sin(S.w * t + rad(PH[S.mode][j]) - zp.psi));
  }
  // A leg's states over [ta, tb]: [from, to, 'T' | 'B' | 'G'], with a gap of dead time after each edge.
  function legLine(S, j, ta, tb, gaps) {
    const es = S.E[j], td = gaps ? S.td : 0, out = [];
    let st = S.ini[j] ? 'T' : 'B', t = S.t0;
    for (let n = 0; n <= es.length; n++) {
      const te = n < es.length ? es[n][0] : S.t1;
      if (te > t) out.push([t, te, st]);
      if (n === es.length) break;
      const nx = n + 1 < es.length ? es[n + 1][0] : S.t1, ge = Math.min(te + td, nx);
      if (td > 0 && ge > te) { out.push([te, ge, 'G']); t = ge; } else t = te;
      st = es[n][1] ? 'T' : 'B';
    }
    return out.filter((s) => s[1] > ta && s[0] < tb).map((s) => [Math.max(s[0], ta), Math.min(s[1], tb), s[2]]);
  }
  // A leg's voltage in a state: in a gap, a diode carries the current on (out of the leg: the lower one, 0 V).
  function legV(S, j, s, t, flip) {
    if (s[2] === 'T') return VDC;
    if (s[2] === 'B') return 0;
    const d = iDir(S, j, (s[0] + s[1]) / 2) * (flip ? -1 : 1);
    return d > 0 ? 0 : d < 0 ? VDC : null;
  }
  // The output as drawn: [from, to, volts] over [ta, tb].
  function voltSegs(S, ta, tb) {
    if (S.mode === 'leg') return legLine(S, 0, ta, tb, false).map((s) => [s[0], s[1], s[2] === 'T' ? VDC : 0]);
    if (S.mode === 'h') {
      return legLine(S, 0, ta, tb, true).map((s) => {
        if (s[2] !== 'G') return [s[0], s[1], s[2] === 'T' ? VDC : -VDC];
        const d = iDir(S, 0, (s[0] + s[1]) / 2);
        return [s[0], s[1], d > 0 ? -VDC : d < 0 ? VDC : 0];
      });
    }
    const A = legLine(S, 0, ta, tb, true), B = legLine(S, 1, ta, tb, true), out = [];
    let p = 0, q = 0;
    while (p < A.length && q < B.length) {
      const a = A[p], b = B[q], x = Math.max(a[0], b[0]), y = Math.min(a[1], b[1]);
      if (y > x) {
        const va = legV(S, 0, [x, y, a[2]]), vb = legV(S, 1, [x, y, b[2]]);
        out.push([x, y, (va == null ? MID : va) - (vb == null ? MID : vb)]);
      }
      if (a[1] <= b[1]) p++; else q++;
    }
    return out;
  }
  // A leg's state at one moment: 'T' (top on), 'B' (bottom on) or 'G' (both off, in the dead time).
  function legStateAt(S, j, t, gaps) {
    const rf = S.rfs[j], Tc = S.Tc, td = gaps ? S.td : 0, k = Math.round(t / Tc), ev = [];
    [k - 1, k, k + 1].forEach((kk) => {
      const pu = pulse(rf, kk, Tc);
      if (pu[1] - pu[0] < 1e-12) return;
      const last = ev[ev.length - 1];
      if (last && !last[1] && pu[0] - last[0] < 1e-12) ev.pop(); else ev.push([pu[0], true]);
      ev.push([pu[1], false]);
    });
    let last = null;
    ev.forEach((e) => { if (e[0] <= t) last = e; });
    const top = last ? last[1] : ev.length ? !ev[0][1] : rf(t) > 0;
    if (last && t < last[0] + td) return 'G';
    return top ? 'T' : 'B';
  }
  // ---------- sources, rounding, and every number the words use ----------
  const SRC = {
    vfd: 'https://industrialmonitordirect.com/blogs/knowledgebase/vfd-input-transformer-grounding-ungrounded-secondary-design',
    ti: 'https://www.ti.com/jp/lit/ug/jaju378/jaju378.pdf?ts=1792734350380',
    mchp: 'https://developerhelp.microchip.com/xwiki/bin/view/applications/motors/control-algorithms/zsm/pwm',
    inf: 'https://www.newweb-qa2.infineon.com/assets/row/public/documents/60/42/Infineon-Deadtime_calculation_for_IGBT_modules-ApplicationNotes-v01_10-EN.pdf',
    malta: 'https://www.um.edu.mt/library/oar/bitstream/123456789/27427/1/Compensation_techniques_for_non-linearities_in_H-bridge_inverters_2016.pdf',
    eaton: 'https://www.eaton.com/content/dam/eaton/products/backup-power-ups-surge-it-power-distribution/backup-power-ups/eaton-ups-fundamentals-handbook-en-us-2025.pdf',
    abb: 'https://new.abb.com/power-converters-inverters/grid-interconnections/shore-to-ship-converters/acs6080sfc',
  };
  const fx = (v, d) => (Math.abs(v) < 0.5 * Math.pow(10, -d) ? 0 : v).toFixed(d).replace('-', '−');
  const kz = (v) => (Math.abs(v - Math.round(v)) < 1e-9 ? String(Math.round(v)) : String(+v.toFixed(1)));
  const MODES = ['leg', 'h', 'three'];
  const MODEN = { leg: 'One leg', h: 'H-bridge', three: 'Three legs' };
  const N = {
    vdc: fx(VDC, 0), mid: fx(MID, 0), vpf: fx(VLL / 50, 0), v25: fx(VLL / 50 * 25, 0), x2: fx(2 * VLL, 0),
    dLo: fx(100 * dOf(0.6, 270), 0), dHi: fx(100 * dOf(0.6, 90), 0), aLo: fx(avgAt('leg', 0.6, 270), 0), aHi: fx(avgAt('leg', 0.6, 90), 0),
    rest: fx(100 - 100 * dOf(0.6, 90), 0), d80f: fx(dOf(0.6, 90), 1), d50f: fx(dOf(0.6, 0), 1),

  // ---------- the lesson: SHOW screens demonstrate, DO screens are puzzles ----------

  const STEPS = [

      task: 'At the cursor the reference crosses zero, halfway up the triangle. For what share of each switching cycle is the top switch on?',

        'All of it, 100%': 'The triangle rises above the reference for part of each cycle. How much?' },

    { show: true, name: 'The H-bridge', set: { mode: 'h', depth: 60 }, ctl: ['mode', 'depth'], zoom: true, play: { id: 'depth', from: 0, to: 60, dur: 2.6 },
      text: `One leg's average never goes below 0 V. So add a second leg, run as the mirror of the first. Put the motor winding between their outputs. One diagonal pair of switches gives the winding +${N.vdc} V. The other diagonal gives it −${N.vdc} V. Both legs share the same ${N.mid} V middle, so it cancels. What is left is a sine centred on zero: AC. Its peak is the depth times ${N.vdc} V. Here that is ${N.pk60} V.`,

      why: `${N.w270} V. The first leg averages ${N.d75f} × ${N.vdc} = ${N.a405} V. The mirror leg averages ${N.d25f} × ${N.vdc} = ${N.a135} V. The winding sits between them, so it sees ${N.a405} − ${N.a135} = ${N.w270} V.` },
    { show: true, name: 'The winding smooths it', set: { mode: 'h', depth: 100, fc: 3 }, ctl: ['fc'], play: { id: 'fc', from: 1, to: 3, dur: 3 },
      text: 'The winding has inductance. A coil keeps its current going. It changes that current only as fast as its voltage allows. Each pulse is too short to swing the current far. So the current follows the pulses\' average, a near-sine. A small sawtooth rides on it at each switching edge. The motor filters the pulses into a sine current. Raise the carrier frequency, and each pulse is shorter. The sawtooth shrinks, and the sine stays.',

  const FINISH = 'Duty cycles that follow a sine give pulses whose average, and a motor\'s current, follow that sine. The reference\'s frequency sets the output frequency. Its depth sets the voltage, from the same fixed link.';

    { name: ['Online', 'UPS'], blocks: [['Supply', 'mains failed'], ['Rectifier'], ['DC link and', 'battery'], ['Inverter'], ['Load']] },

  const testing = () => document.documentElement.classList.contains('k-testing');

  // ---------- state ----------
  const blank = () => ({ pick: null, res: null, why: false });

  let finished = false, lastStep = -1, lastDone = false, pinning = false, SW = [], BASEI = 0, REC = null;

  const SLIDERS = ['depth', 'fref', 'fc', 'dead', 'cursor'];
  const STEPOF = { depth: 5, fref: 5, fc: 0.5, dead: 5, cursor: 5 };
  const BASE = { mode: 'h', depth: 60, fref: 50, fc: 1, dead: 20, cursor: 90 };

  const modeOf = (p) => (MODES.indexOf(p.mode) >= 0 ? p.mode : 'h');

  const fcOf = (p) => K.clamp(snapV('fc', +p.fc || 1), 0.5, 3);

  const visIds = (d) => (d.show ? d.ctl || [] : []);
  const nb = (t) => t.replace(/(\d) (?=(?:V|A|W|µs|kHz|Hz|ms|mH|Ω)(?![A-Za-z]))/g, '$1 ');

  // ---------- words with amber key terms (built with K.el, never innerHTML) ----------
  function write(node, s) {

    while ((m = re.exec(s))) {
      if (m.index > at) node.appendChild(document.createTextNode(s.slice(at, m.index)));
      node.appendChild(K.el('span', { class: 'term' }, m[1]));
      at = m.index + m[0].length;

  // ---------- controls ----------

  const pickBtns = [0, 1, 2].map((k) => K.button({ label: 'Answer ' + (k + 1), secondary: true, into: '#picks', press: () => {

  // ---------- motion: a control swept as a screen opens, or as a right answer lands ----------

  function enter(id) {

  // ---------- drawing helpers ----------
  let into = null, labInto = null;

  const ln = (x1, y1, x2, y2, cls) => add(K.svg('line', { class: cls, x1: r2(x1), y1: r2(y1), x2: r2(x2), y2: r2(y2) }));

      else if (it[0] === 'brk') pa('M' + r2(x + 5) + ' ' + (y - 11) + 'h6v12h-6', it[1]);
      else box(x + 2, y - 10, 12, 11, it[1], 2);
      tx(x + 22, y, it[2], 'lab', 'start');
      x += 22 + ws[k] + 14;

  const outsShown = (v) => !v.card && (v.show || v.d.outs !== 'after' || v.right);
  function layout(i, d, st, v) {
    const right = st.res === 'right';
    el('stepbox').hidden = finished;
    el('done').hidden = !finished;
    el('count').textContent = 'Step ' + (i + 1) + ' of ' + STEPS.length + ' · ' + d.name;
    const task = el('task');
    task.className = 'task say' + (d.show ? ' show' : '');
    write(task, nb(d.show ? d.text : d.task));
    const vis = visIds(d), has = (id) => vis.indexOf(id) >= 0;
    modeCtl.el.hidden = !has('mode'); el('sw').hidden = !has('mode');
    SLIDERS.forEach((id) => { CTL[id].el.hidden = !has(id); });
    el('ctl').hidden = !SLIDERS.some(has);
    el('scene').toggleAttribute('hidden', v.card); el('wave').toggleAttribute('hidden', v.card);
    el('zoom').toggleAttribute('hidden', !v.zoom); el('card').toggleAttribute('hidden', !v.card);
    showEl('outs', outsShown(v));
    rRms.el.hidden = v.mode === 'leg';
    el('say').hidden = !d.show;
    el('say').textContent = d.show ? nb(sayFor(v)) : '';
    el('setting').hidden = !!d.show || v.card;
    el('setting').textContent = d.show || v.card ? '' : nb(settingFor(v));
    const opts = d.show ? [] : d.opts;
    el('picks').hidden = !opts.length;
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      b.setLabel(nb(opts[k]));
      b.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });
    el('acts').hidden = !!d.show;
    checkBtn.el.hidden = right;
    const fb = el('fb');
    fb.hidden = !!d.show;
    fb.className = 'fb say' + (right ? ' right' : '');
    fb.textContent = d.show ? '' : right ? 'That\'s it.' : st.res === 'wrong' ? nb(d.hints[st.pick] || '') : st.res === 'empty' ? 'Pick an answer first.' : '';
    const why = el('why');
    why.hidden = !!d.show || !st.why;
    if (!d.show) write(why, nb(d.why));
    whyBtn.setLabel(st.why ? 'Hide why' : 'Why?');
    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !right);
    nextBtn.setLabel(i === STEPS.length - 1 ? 'Finish' : 'Continue');
    el('nav').hidden = backBtn.el.hidden && nextBtn.el.hidden;
  }
  function outsNow(v, o) {
    const hide = v.right ? [] : v.d.hide || [];
    [[rTop, 'topOn'], [rAvg, 'avgNow'], [rRms, 'outRms']].forEach((q) => {
      const r = q[0], id = q[1];
      if (o && typeof o[id] === 'number' && isFinite(o[id])) r.set(o[id]);
      const val = r.el.querySelector('.k-readout-value');
      if (!val) return;
      if (hide.indexOf(id) >= 0) { val.textContent = '?'; val.classList.add('k-wait'); } else val.classList.remove('k-wait');
    });
  }
  write(el('finish'), FINISH);

  function enterStep(i) {
    lastStep = i; enter('stepbox'); SW = [];
    const d = STEPS[i], right = ST[i].res === 'right', q = setupOf(i, right);
    IDS.forEach((id) => CTL[id].set(q[id], true));
    BASEI = scaleFor(i, right);
    if (d.show && d.play && !calm()) startSweep([{ id: d.play.id, from: d.play.from, to: d.play.to }], d.play.dur, FADE);
  }
  const differs = (a, b) => (typeof b === 'number' ? !K.near(+a, b, 1e-6) : String(a) !== String(b));
  K.update((p, o) => {
    const i = at(), d = STEPS[i], st = ST[i];
    if (i !== lastStep) { enterStep(i); K.refresh(); return; }
    if (!motion.playing() && SW.length) { settle(); K.refresh(); return; }
    SW = SW.filter((s) => !differs(p[s.id], s.last));   // Dan took hold of that slider
    if (!pinning) {
      // A puzzle keeps its own setting; a demonstration keeps the controls it does not show.
      const q = setupOf(i, st.res === 'right'), vis = visIds(d);
      let fix = false;
      IDS.forEach((id) => {
        if (vis.indexOf(id) >= 0 || SW.some((s) => s.id === id)) return;
        if (differs(p[id], q[id])) { CTL[id].set(q[id], true); fix = true; }
      });
      if (fix) { pinning = true; K.refresh(); pinning = false; return; }
    }
    if (finished !== lastDone) { lastDone = finished; enter(finished ? 'done' : 'stepbox'); }
    const R = render(i, p, st);
    layout(i, d, st, R.v);
    outsNow(R.v, o);
  });

  // ---------- known answers, worked out by hand ----------
  const DO = STEPS.map((d, i) => i).filter((i) => !STEPS[i].show);
  function drawnAt(i, over, right) {
    const keep = SW, kb = BASEI;
    SW = [];
    try {
      const q = Object.assign({}, setupOf(i, !!right), over || {});
      BASEI = scaleFor(i, !!right);
      return render(i, q, right ? solved(i) : blank());
    } finally { SW = keep; BASEI = kb; redraw(); }
  }
  const atP = (o) => K.at(Object.assign({ mode: 'h', depth: 60, fref: 50, fc: 1, dead: 20, cursor: 90 }, o));
  const r0 = (a, b) => fx(a, 0) === b;
  // The sawtooth: in each carrier cycle, the current less the straight line between its ends, top to bottom.
  function ripple(S) {
    const Tc = S.Tc;
    let best = 0;
    for (let k = Math.ceil(0.01 / Tc); (k + 1) * Tc <= AX; k++) {
      const ta = k * Tc - Tc / 2, tb = ta + Tc, ia = iNow(S, ta), ib = iNow(S, tb);
      let mx = 0, mn = 0;
      S.pts.forEach((p) => { if (p[0] > ta && p[0] < tb) { const r = p[1] - (ia + (ib - ia) * (p[0] - ta) / Tc); mx = Math.max(mx, r); mn = Math.min(mn, r); } });
      best = Math.max(best, mx - mn);
    }
    return best;
  }
  // How far the current strays from its best-fitting sine over the last 20 ms, as a share of that sine.
  function fitRes(S) {
    const n = 800, a0 = 0.02, a1 = 0.04, xs = [];
    let a = 0, b = 0;
    for (let k = 0; k < n; k++) { const t = a0 + (k + 0.5) * (a1 - a0) / n, i = iNow(S, t); xs.push([t, i]); a += i * Math.sin(S.w * t); b += i * Math.cos(S.w * t); }
    a *= 2 / n; b *= 2 / n;
    const amp = Math.hypot(a, b);
    let mx = 0;
    xs.forEach((q) => { mx = Math.max(mx, Math.abs(q[1] - a * Math.sin(S.w * q[0]) - b * Math.cos(S.w * q[0]))); });
    return mx / amp;
  }
  function stallShare(S) { let z = 0; const n = 2000; for (let q = 0; q < n; q++) if (S.iAvg(0, (q + 0.5) * AX / n) === 0) z++; return z / n; }
  // The drawn pulses' average over each carrier cycle, less the dashed line, while the current stays above 4 A.
  function lossM(S) {
    const Tc = S.Tc, segs = voltSegs(S, -Tc, AX + Tc), out = [];
    for (let k = 1; (k + 0.5) * Tc <= AX; k++) {
      const ta = (k - 0.5) * Tc, tb = ta + Tc;
      let mn = Infinity;
      for (let q = 0; q <= 20; q++) mn = Math.min(mn, S.iAvg(0, ta + q * Tc / 20));
      if (mn < 4) continue;
      let s = 0;
      segs.forEach((g) => { const x = Math.max(g[0], ta), y = Math.min(g[1], tb); if (y > x) s += g[2] * (y - x); });
      out.push(s / Tc - avgAt(S.mode, S.m, 360 * S.f * k * Tc));
    }
    return out.length ? out.reduce((p, q) => p + q, 0) / out.length : NaN;
  }

  K.check('A three-phase bridge gives a DC bus of approximately 1.35 × the line voltage: 1.35 × 400 V = 540 V, the link drawn here', () =>
    K.near(VDC, 1.35 * 400, 1e-9) && N.vdc === '540' && N.mid === '270', { source: SRC.vfd });
  K.check('One leg averages D × 540 V. At 60% depth D runs from 20% to 80%: 108 V at the trough, 270 V at the zero and 432 V at the peak', () => {
    const a = atP({ mode: 'leg', cursor: 270 }), b = atP({ mode: 'leg', cursor: 0 }), c = atP({ mode: 'leg', cursor: 90 });
    return r0(a.topOn, '20') && r0(a.avgNow, '108') && r0(b.topOn, '50') && r0(b.avgNow, '270') && r0(c.topOn, '80') && r0(c.avgNow, '432');
  });
  K.check('The amplitude of the phase voltage is determined by the duty cycle: each switching cycle\'s pulses are on for D of it, so they average D times the link, at every depth', () => {
    for (const dep of [0, 0.3, 0.6, 1]) {
      const S = simulate('leg', dep, 50, 1, 20);
      for (let k = 1; k < 40; k++) { const pu = pulse(S.rfs[0], k, S.Tc); if (Math.abs((pu[1] - pu[0]) / S.Tc - dOf(dep, 360 * 50 * k * S.Tc)) > 0.01) return false; }
    }
    return true;
  }, { source: SRC.ti });
  K.check('H-bridge: the winding averages (2D − 1) × 540 V. At 50% depth and 90°, D is 75% and it sees 405 − 135 = 270 V, 191 V rms. At 60%, a 324 V peak and 229 V rms. At full depth, 382 V rms', () => {
    const a = atP({ depth: 50 });
    return r0(a.topOn, '75') && r0(a.avgNow, '270') && r0(a.outRms, '191') && r0(atP({}).avgNow, '324') && r0(atP({}).outRms, '229') && r0(atP({ depth: 100 }).outRms, '382') && N.a405 === '405' && N.a135 === '135';
  });
  K.check('Sine-triangle PWM works for three sine waves 120° out of phase: the three legs\' references are drawn 120° apart, against one carrier', () => {
    const r = drawnAt(9);
    return r.refs === 3 && r.tris === 1 && PH.three[1] === -120 && PH.three[2] === -240;
  }, { source: SRC.mchp });
  K.check('Three legs: between lines the average peaks at √3 × 270 = 468 V at full depth, 331 V rms. At 60% depth, 198 V rms', () =>
    r0(peakOf('three', 1), '468') && r0(atP({ mode: 'three', depth: 100, cursor: 60 }).avgNow, '468') && r0(atP({ mode: 'three', depth: 100 }).outRms, '331') && r0(atP({ mode: 'three', depth: 60 }).outRms, '198'));
  K.check('The motor filters the supplied current into a near-sine wave: with the fastest carrier, the drawn line current stays close to a sine', () =>
    fitRes(simulate('three', 1, 50, 3, 20)) < 0.08, { source: SRC.ti });
  K.check('The sawtooth falls in proportion as the carrier rises: at 3 kHz it is about a third as tall as at 1 kHz, while the current stays a 50 Hz near-sine', () => {
    const a = simulate('h', 1, 50, 1, 20), b = simulate('h', 1, 50, 3, 20), r = ripple(b) / ripple(a);
    return r > 0.28 && r < 0.4 && fitRes(a) < 0.15 && fitRes(b) < 0.1;
  });
  K.check('One IGBT is always turned off first and the other turned on after the dead time, preventing a bridge shoot-through: only a dead time shorter than the turn-off lag draws one', () => {
    const a = drawnAt(11, { dead: 0 }), b = drawnAt(11, { dead: 5 }), c = drawnAt(11, { dead: 20 });
    return a.shoot && a.bands > 0 && !b.shoot && !c.shoot && c.gaps > 0;
  }, { source: SRC.inf });
  K.check('Each gap costs the winding 2 × dead time × carrier frequency × 540 V against the current: about 22 V at 20 µs and 1 kHz, 108 V at 100 µs. The drawn pulses lose that much', () =>
    N.loss20 === '22' && N.loss100 === '108' && K.near(lossM(simulate('h', 0.6, 50, 1, 100)), -108, 3) && K.near(lossM(simulate('h', 0.6, 50, 1, 20)), -21.6, 1.5));
  K.check('The dead time causes distortion in the output current, so the smaller the dead time the better: with the longest gap the drawn current stalls near each zero, and with a short one it does not', () =>
    stallShare(simulate('h', 0.3, 50, 1, 100)) > 0.15 && stallShare(simulate('h', 0.3, 50, 1, 20)) < 0.01, { source: SRC.malta });
  K.check('Double conversion provides zero transfer time to battery: on the card the UPS inverter feeds the load all the time, from the DC link that holds the battery', () => {
    const c = CHAINS[0].blocks.map((b) => b.join(' ')), r = drawnAt(13, null, true), w = drawnAt(13, null, false);
    return c[2].indexOf('battery') >= 0 && c[3] === 'Inverter' && c[4] === 'Load' && r.lit.join('|') === [c[2], c[3], c[4]].join('|') && !w.lit.length && r.card && !r.zoom;
  }, { source: SRC.eaton });
  K.check('Static conversion of the 50/60 Hz port grid power to match the 60/50 Hz vessel network: the shore chain runs from a 50 Hz port grid through rectifier, DC link and inverter to a 60 Hz vessel network', () => {
    const c = CHAINS[2].blocks.map((b) => b.join(' '));
    return c[0] === '50 Hz port grid' && c[1] === 'Rectifier' && c[2] === 'DC link' && c[3] === 'Inverter' && c[4] === '60 Hz vessel network';
  }, { source: SRC.abb });
  K.check('Every number in the words comes from the rule: 540, 270, 8, 200, 800, 20, 80, 108, 432, 0.8, 0.5, 324, 229, 75, 25, 0.75, 0.25, 405, 135, 191, 382, 468, 331, 0.60, 60, 198, 22 and 108', () =>
    N.vdc === '540' && N.mid === '270' && N.vpf === '8' && N.v25 === '200' && N.x2 === '800' && N.dLo === '20' && N.dHi === '80' && N.rest === '20' && N.aLo === '108' && N.aHi === '432' &&
    N.d80f === '0.8' && N.d50f === '0.5' && N.pk60 === '324' && N.rms60 === '229' && N.d75 === '75' && N.d25 === '25' && N.d75f === '0.75' && N.d25f === '0.25' &&
    N.a405 === '405' && N.a135 === '135' && N.w270 === '270' && N.rms50 === '191' && N.rms100 === '382' && N.pk3 === '468' && N.rms3 === '331' && N.depf === '0.60' &&
    N.dep === '60' && N.rms3at60 === '198' && N.loss20 === '22' && N.loss100 === '108' && N.pk30 === '162');
  K.check('Each puzzle offers three answers and accepts only its right one, every wrong answer has its own hint, and hidden numbers appear only after a right Check', () =>
    DO.every((i) => {
      const d = STEPS[i];
      if (d.opts.length !== 3 || d.opts.filter((o) => o === d.want).length !== 1 || d.opts.some((o) => o !== d.want && !d.hints[o])) return false;
      const a = view(i, setupOf(i, false), blank()), b = view(i, setupOf(i, true), solved(i));
      if (d.outs === 'after' && !(!outsShown(a) && outsShown(b))) return false;
      if (d.zoom === 'after' && !(!a.zoom && b.zoom)) return false;
      return true;
    }));
  K.check('Each demonstration ends within 4.5 s of its screen opening, and a right answer shows within 3 s of Check', () =>
    STEPS.every((d) => !d.play || FADE + d.play.dur <= 4.5) && ANS_SW + 0.1 <= 3);
  K.check('From the same 540 V link, a smaller depth narrows the pulses near the peak and shrinks the average sine: in the H-bridge at 90°, on for 80% at 60% depth and 65% at 30%, with peaks of 324 V and 162 V', () => {
    const a = simulate('h', 0.6, 50, 1, 20), b = simulate('h', 0.3, 50, 1, 20), pa_ = pulse(a.rfs[0], 5, a.Tc), pb = pulse(b.rfs[0], 5, b.Tc);
    return r0(atP({}).topOn, '80') && r0(atP({ depth: 30 }).topOn, '65') && r0(peakOf('h', 0.6), '324') && r0(peakOf('h', 0.3), '162') && pb[1] - pb[0] < pa_[1] - pa_[0];
  });

  K.ready();
</script>
