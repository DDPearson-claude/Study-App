<script>
  // ---------- the rule: ideal diodes, a supply with no resistance while the bus runs, a steady load ----------
  // While the rectified hump is above the bus, the diodes conduct and the bus rides the hump. The
  // capacitor's current is C dv/dt, so the supply gives the load current plus that. The diodes stop
  // where the hump falls faster than I ÷ C. Then the load drains the capacitor alone: the bus falls
  // in a straight line at I ÷ C until the next hump catches it. The ripple rule is I ÷ (f × C).
  const SQ2 = Math.SQRT2, W = 2 * Math.PI * 50, RS = 1, RP = 100, NP = 4;
  const ETUT = 'https://www.electronics-tutorials.ws/diode/diode_6.html';
  const IMD = 'https://industrialmonitordirect.com/blogs/knowledgebase/vfd-input-transformer-grounding-ungrounded-secondary-design';
  const EATON = 'https://www.eaton.com/content/dam/eaton/products/medium-voltage-power-distribution-control-systems/motor-control/literature/applications/eaton-sc9000-soft-mag-pre-charge-system-application-paper-ap02004en.pdf';
  const fx = (v, d) => (Math.abs(v) < 0.5 * Math.pow(10, -d) ? 0 : v).toFixed(d).replace('-', '−');
  const PK = (v) => v * SQ2, K135 = 3 * SQ2 / Math.PI;
  // A bridge on 230 V gives humps 100 times a second; a six-pulse bridge on 400 V gives 300.
  // th0 is the supply angle at the start of the window, a valley of the humps.
  const SPS = { 230: { sup: 230, Vp: PK(230), P: Math.PI, f: 100, th0: 0 }, 400: { sup: 400, Vp: PK(400), P: Math.PI / 3, f: 300, th0: Math.PI / 6 } };
  const SP = (s) => SPS[+s === 400 ? 400 : 230];
  const rule = (sp, I, C) => I / (sp.f * C);           // C in farads
  const SSC = new Map();
  // The steady bus over one ripple period, in supply angle from a valley: the diodes conduct from on to off.
  function ss(sp, I, C) {
    const key = sp.sup + '|' + I + '|' + C;
    if (SSC.has(key)) return SSC.get(key);
    const Vp = sp.Vp, P = sp.P, k = I / C;
    let r;
    if (!(I > 0)) r = { flat: true, I: 0, C, k: 0, on: P / 2, off: P / 2, von: Vp, voff: Vp, avg: Vp, ipk: 0, dip: 0 };
    else {
      const off = P / 2 + Math.asin(Math.min(1, k / (Vp * W))), voff = Vp * Math.cos(off - P / 2);
      const g = (q) => Vp * Math.cos(q - P / 2) - (voff - k * (q + P - off) / W);
      let lo = 0, hi = P / 2;
      if (g(0) >= 0) hi = 0;
      for (let n = 0; n < 60; n++) { const m = (lo + hi) / 2; if (g(m) < 0) lo = m; else hi = m; }
      const on = (lo + hi) / 2, von = Vp * Math.cos(on - P / 2);
      const area = Vp * (Math.sin(off - P / 2) - Math.sin(on - P / 2)) + (voff + von) / 2 * (P + on - off);
      r = { flat: false, I, C, k, on, off, von, voff, avg: area / P, ipk: I - C * Vp * W * Math.sin(on - P / 2), dip: Vp - von };
    }
    if (SSC.size > 400) SSC.clear();
    SSC.set(key, r);
    return r;
  }
  const wrapP = (sp, ph) => ((ph % sp.P) + sp.P) % sp.P;
  function busAt(sp, s, ph) {
    if (s.flat) return sp.Vp;
    const q = wrapP(sp, ph);
    if (q >= s.on && q <= s.off) return sp.Vp * Math.cos(q - sp.P / 2);
    return s.voff - s.k * (q > s.off ? q - s.off : q + sp.P - s.off) / W;
  }
  function supAt(sp, s, ph) {
    if (s.flat) return 0;
    const q = wrapP(sp, ph);
    return q >= s.on && q <= s.off ? Math.max(0, s.I - s.C * sp.Vp * W * Math.sin(q - sp.P / 2)) : 0;
  }
  // Switch-on, drawn as if fed from steady DC at the peak: through 1 Ω straight on, or through 100 Ω
  // until five time constants have passed, when the contactor closes across the resistor.
  const swT = (C) => ({ tp: RP * C, t1: RS * C, tc: 5 * RP * C, ax: 0.6 * Math.max(1, Math.ceil(C * 1000 - 1e-9)) });
  function soBus(Vp, C, pre, t) {
    if (t <= 0) return 0;
    const z = swT(C);
    if (!pre) return Vp * (1 - Math.exp(-t / z.t1));
    if (t < z.tc) return Vp * (1 - Math.exp(-t / z.tp));
    return Vp - Vp * Math.exp(-5) * Math.exp(-(t - z.tc) / z.t1);
  }
  function soCur(Vp, C, pre, t) {
    if (t < 0) return 0;
    const z = swT(C);
    if (!pre) return Vp / RS * Math.exp(-t / z.t1);
    if (t < z.tc) return Vp / RP * Math.exp(-t / z.tp);
    return Vp * Math.exp(-5) / RS * Math.exp(-(t - z.tc) / z.t1);
  }

  // Every number the words show, worked out from the rule (a check compares them with the lesson's).
  const S230 = SP(230), S400 = SP(400), s2A = ss(S230, 2, 1e-3), s4A = ss(S230, 4, 1e-3);
  const N = {
    pk: fx(S230.Vp, 0), pk400: fx(S400.Vp, 0), hav: fx(2 / Math.PI * S230.Vp, 0),
    fall: fx(2 / 1e-3 / 1000, 0), f100: String(S230.f), f300: String(S400.f), T10: fx(1000 / S230.f, 0),
    r20: fx(rule(S230, 2, 1e-3), 0), r200: fx(2 / 1e-3 / 1000 * 100, 0), d18: fx(s2A.dip, 0),
    r10: fx(rule(S230, 2, 2e-3), 0), r40: fx(rule(S230, 4, 1e-3), 0), a2: fx(s2A.avg, 0), a4: fx(s4A.avg, 0),
    k135: fx(K135, 2), s400: fx(K135 * 400, 0),
    i0: fx(S230.Vp / RS, 0), t5off: fx(5 * RS * 1e-3 * 1000, 0), tau: fx(RP * 1e-3, 1), t5: fx(5 * RP * 1e-3, 1),
    p63: fx(100 * (1 - Math.exp(-1)), 0), p993: fx(100 * (1 - Math.exp(-5)), 1), i3: fx(S230.Vp / RP, 0),
    gap: fx(S230.Vp * Math.exp(-5), 0), blip: fx(S230.Vp * Math.exp(-5) / RS, 0),
    c4000: fx(4 / (S230.f * 10) * 1e6, 0), c4f: fx(4 / (S230.f * 10), 3),
    r17: fx(rule(S400, 5, 1e-3), 0), r50: fx(rule(S230, 5, 1e-3), 0),
  };

  // ---------- the lesson: SHOW screens demonstrate, DO screens are puzzles ----------
  // set: where the controls open; play: the demonstration as the screen opens; so: the switch-on picture;
  // ans.set: what a right Check moves the controls to; shows: words that appear only after a right Check.
  const STEPS = [
    { show: true, name: 'The reservoir', set: { supply: 230, C: 1000, I: 2 }, play: 'cursor',
      text: `A *smoothing capacitor* turns a bridge's humps into smoother DC. Take a bridge rectifier on 230 V. Its humps peak at ${N.pk} V. Put a capacitor across the load. Its voltage is the *DC bus*. Near each peak, the hump rises above the capacitor's voltage. The diodes conduct, and the capacitor fills. After the peak, the hump falls away faster than the capacitor drains. So the diodes are pushed backwards and block. The capacitor alone feeds the load until the next peak.`,
      read: `The bold bus rides just under the tops of the pale humps. It rises with each hump near its peak and slopes gently down between them.`,
      still: { supply: 230, C: 1000, I: 2 } },
    { name: 'No load', set: { supply: 230, C: 1000, I: 0 }, hideBus: true, ans: {}, idle: 'load off',
      task: `The load is switched off. What voltage does the capacitor settle at?`,
      opts: [`About ${N.hav} V, the average of the humps`, `${N.pk} V, the peak of the humps`, `Above ${N.pk} V, as the capacitor adds its own`],
      want: `${N.pk} V, the peak of the humps`,
      hints: { [`About ${N.hav} V, the average of the humps`]: `With no load, what drains the capacitor between peaks?`,
        [`Above ${N.pk} V, as the capacitor adds its own`]: `It only fills while the hump is above it. What happens when it reaches the top?` },
      why: `It settles at ${N.pk} V, the peak. Each peak fills the capacitor until it matches the top of the hump. Then the diodes block. With no load, nothing drains it, so it stays there. It fills only from the supply, so it never passes the peak. A smoothing capacitor adds no voltage of its own.`,
      shows: [`${N.pk} V`] },
    { show: true, name: 'The drain', set: { supply: 230, C: 1000, I: 2 }, play: 'cursor',
      text: `Between peaks the load drains the capacitor. The capacitor's law, i = C dv/dt, says how fast. Here i is the load current and C the capacitance. So the voltage falls at I ÷ C volts each second. A 2 A load on 1000 µF falls ${N.fall} V every millisecond. Near the next peak the hump catches up. The diodes conduct, and the capacitor refills. All the charge drained since the last peak goes back in that short gulp. So each gulp runs at several times the load current.`,
      read: `The bus slopes down in straight lines between peaks and climbs back near each one. The supply current trace sits at zero except for a narrow spike at each refill.`,
      still: { supply: 230, C: 1000, I: 2 } },
    { name: 'How far it falls', set: { supply: 230, C: 1000, I: 2 }, ans: {}, outs: 'after',
      task: `The bus falls ${N.fall} V every millisecond. The humps come ${N.f100} times a second. Roughly how far does the bus fall between refills?`,
      opts: [`About ${N.fall} V`, `About ${N.r200} V`, `About ${N.r20} V`], want: `About ${N.r20} V`,
      hints: { [`About ${N.fall} V`]: `That is one millisecond's fall. How long is the gap between humps?`,
        [`About ${N.r200} V`]: `${N.f100} humps a second leaves ${N.T10} ms between them, not 100 ms.` },
      why: `About ${N.r20} V. The humps come every ${N.T10} ms. The bus falls for about that long, at ${N.fall} V a millisecond. That dip is the *ripple*. The refill starts a little before each peak. So the drawn dip is a little smaller, about ${N.d18} V.`,
      shows: [`dip ${N.d18} V`] },
    { show: true, name: 'The ripple rule', set: { supply: 230, C: 1000, I: 2 }, play: { id: 'C', from: 1000, to: 2000 },
      text: `The ripple is about I ÷ (f × C). The bus falls at I ÷ C for about one ripple period, 1 ÷ f. Here f is the ripple frequency, ${N.f100} Hz for a bridge on 50 Hz. The rule runs a little high. That errs on the safe side. Drag the capacitance from 1000 to 2000 µF. The fall is half as steep, so the ripple halves to ${N.r10} V.`,
      read: `At 1000 µF the ripple readout shows ${N.r20} V. At 2000 µF it shows ${N.r10} V, and the slopes between peaks are half as steep.`,
      still: { supply: 230, C: 2000, I: 2 } },
    { name: 'Double the load', set: { supply: 230, C: 1000, I: 2 }, ans: { set: { I: 4 } }, outs: 'before',
      task: `The load doubles to 4 A. The capacitor stays the same. What happens to the ripple?`,
      opts: [`It doubles, to about ${N.r40} V`, `It stays at ${N.r20} V, as the capacitor sets it`, `It halves, to about ${N.r10} V`],
      want: `It doubles, to about ${N.r40} V`,
      hints: { [`It stays at ${N.r20} V, as the capacitor sets it`]: `The capacitor is the same, but what drains it has doubled.`,
        [`It halves, to about ${N.r10} V`]: `More load makes a steeper fall, not a gentler one.` },
      why: `It doubles, to about ${N.r40} V. The bus falls at I ÷ C. Twice the current drains it twice as fast. So in the same ${N.T10} ms it falls twice as far. The capacitor does not set the ripple alone. The load and the ripple frequency set it too.` },
    { show: true, name: 'Light load, heavy load', set: { supply: 230, C: 1000, I: 0 }, play: { id: 'I', from: 0, to: 4 }, avgRef: true,
      text: `Drag the load and watch the bus average fall. At 0 A it sits at the ${N.pk} V peak. At 2 A it reads about ${N.a2} V. At 4 A it reads about ${N.a4} V. With no capacitor it would sit at the humps' own average, ${N.hav} V. So a smoothed bus sits between the two, near the peak at light load. A drive's six-pulse bridge feeds a bank of capacitors the same way. That bank is the *DC link*. It is the store between rectifier and inverter.`,
      read: `On 230 V the bus average reads ${N.pk} V at 0 A, about ${N.a2} V at 2 A and about ${N.a4} V at 4 A.`,
      still: { supply: 230, C: 1000, I: 4 } },
    { name: 'An idle drive', set: { supply: 400, C: 1000, I: 0 }, hideBus: true, ans: { set: { I: 0 } }, idle: 'motor stopped', outs: 'after',
      task: `A 400 V drive stands idle, with its motor stopped. What does its DC link read?`,
      opts: [`About ${N.s400} V, ${N.k135} × 400`, `About 400 V, the line voltage`, `About ${N.pk400} V, the peak`], want: `About ${N.pk400} V, the peak`,
      hints: { [`About ${N.s400} V, ${N.k135} × 400`]: `That is the average with no capacitor. Here nothing drains the capacitor.`,
        'About 400 V, the line voltage': `The capacitor fills to the peak of the line-to-line voltage.` },
      why: `About ${N.pk400} V, the peak. With no load, the capacitor fills to the peak and stays there. On 400 V that is 400 × √2 = ${N.pk400} V. Under load it sags towards about ${N.k135} times the line voltage, ${N.s400} V. Both figures are right, each at its own load.`,
      shows: [`${N.pk400} V`] },
    { show: true, name: 'Switch on', set: { supply: 230, C: 1000, I: 0, pre: false }, so: true, play: 'switch',
      text: `The supply sees an empty capacitor as a short circuit. Press Switch on with the capacitor empty. By i = C dv/dt, its voltage rises only as fast as current fills it. So at the first instant it still holds 0 V while current pours in. Say the supply and wiring have 1 Ω. Switch on at the ${N.pk} V peak. All ${N.pk} V falls across that 1 Ω, so ${N.i0} A flows. It dies away in five time constants of 1 Ω × 1000 µF, about ${N.t5off} ms.`,
      read: `With precharge off, the current trace leaps to ${N.i0} A in red at switch-on and falls back within about ${N.t5off} ms. The bus jumps almost straight to ${N.pk} V.`,
      still: () => finishSwitch(false) },
    { name: 'Five time constants', set: { supply: 230, C: 1000, I: 0, pre: true }, so: true, ans: {}, outs: 'after', rightFb: 'Still there.',
      task: `Precharge puts a 100 Ω resistor in the way. With 1000 µF, the time constant R × C is ${N.tau} s. When is the capacitor about full?`,
      opts: [`After ${N.tau} s, one time constant`, `After about ${N.t5} s, five time constants`, `Never, as the curve only levels off`],
      want: `After about ${N.t5} s, five time constants`,
      hints: { [`After ${N.tau} s, one time constant`]: `After one time constant it has closed only ${N.p63}% of the gap.`,
        'Never, as the curve only levels off': `It never quite arrives. How close is it after five time constants?` },
      why: `After about ${N.t5} s, five time constants. Each time constant closes ${N.p63}% of the gap that is left. After five, only e^−5 of the gap is left, under 1%. So the capacitor is about ${N.p993}% full.`,
      shows: ['contactor closes'] },
    { show: true, name: 'Precharge', set: { supply: 230, C: 1000, I: 0, pre: true }, so: true, play: 'switch',
      text: `*Precharge* fills the capacitor through a resistor first. Now the first current is ${N.pk} V ÷ 100 Ω. That is about ${N.i3} A instead of ${N.i0} A. The bus climbs the charging curve. After five time constants, ${N.t5} s here, only about ${N.gap} V of the gap is left. Then a contactor closes across the resistor. The last ${N.gap} V through 1 Ω gives about ${N.blip} A. Now the load can run, with nothing in its way.`,
      read: `With precharge on, the bus climbs a smooth curve to near ${N.pk} V over ${N.t5} s. The current starts at about ${N.i3} A and falls away. The contactor closes at ${N.t5} s with only a small blip of current.`,
      still: () => finishSwitch(true) },
    { name: 'Keep the ripple', set: { supply: 230, C: 2000, I: 2 }, ans: { set: { I: 4, C: 4000 } }, outs: 'before',
      task: `The load grows to 4 A. What capacitance keeps the ripple at ${N.r10} V?`,
      opts: [`2000 µF, as the capacitor sets the ripple`, `1000 µF`, `${N.c4000} µF`], want: `${N.c4000} µF`,
      hints: { '2000 µF, as the capacitor sets the ripple': `Twice the load drains twice as fast.`,
        '1000 µF': `A smaller capacitor falls faster, not slower.` },
      why: `${N.c4000} µF. The ripple is I ÷ (f × C). Double I and the ripple doubles. Double C as well and it halves back. Check: 4 ÷ (${N.f100} × ${N.c4f}) = ${N.r10} V.` },
    { name: 'Six-pulse ripple', set: { supply: 400, C: 1000, I: 5 }, ans: { set: { C: 1000, I: 5 } }, outs: 'after',
      task: `A six-pulse drive runs from 400 V, 50 Hz. Its DC link has 1000 µF, and the load takes 5 A. Roughly what ripple does the rule give?`,

    if (!FLOW || REDUCE) return;
    FLOW.forEach((f) => {
      for (let s = (PH * f.speed) % 22; s < f.len; s += 22) {
        let k = 1;
        while (k < f.lens.length - 1 && f.lens[k] < s) k++;
        const a = f.pts[k - 1], b = f.pts[k], u = (s - f.lens[k - 1]) / Math.max(1e-9, f.lens[k] - f.lens[k - 1]);
        dotsG.appendChild(K.svg('circle', { class: 'flowdot', cx: r2(K.lerp(a[0], b[0], u)), cy: r2(K.lerp(a[1], b[1], u)), r: 2.2 }));

  // ---------- the graph ----------
  const X0 = 46, X1 = 330, YP = 56, YZ = 204, YCT = 240, YCZ = 290, IMAX = 120;
  function keyRow(y, items) {
    const ws = items.map((it) => tw(it[1], 'lab'));
    const total = items.reduce((t, it, k) => t + 22 + ws[k], 0) + 14 * (items.length - 1);
    let x = Math.max(4, (340 - total) / 2);
    items.forEach((it, k) => { ln(x, y - 4.5, x + 16, y - 4.5, it[0]); tx(x + 22, y, it[1], 'lab', 'start'); x += 22 + ws[k] + 14; });
  }
  const PALE = {};
  function paleD(sp, gx, gy) {
    if (PALE[sp.sup]) return PALE[sp.sup];
    let d = '';
    for (let k = 0; k < NP; k++) for (let j = 0; j <= 36; j++) { const q = sp.P * j / 36; d += (k || j ? 'L' : 'M') + r2(gx(k * sp.P + q)) + ' ' + r2(gy(sp.Vp * Math.cos(q - sp.P / 2))); }

  }
  function busD(sp, s, gx, gy, kk) {
    const pts = [], push = (ph) => pts.push(r2(gx(ph)) + ' ' + r2(gy(kk * busAt(sp, s, ph))));
    push(0);
    if (!s.flat) for (let n = 0; n < NP; n++) { const b = n * sp.P; push(b + s.on); for (let j = 1; j <= 16; j++) push(b + s.on + (s.off - s.on) * j / 16); }

  function curD(sp, s, gx, iy) {
    const pts = [[gx(0), iy(0)]];

      const b = n * sp.P;
      pts.push([gx(b + s.on), iy(0)]);
      for (let j = 0; j <= 16; j++) { const ph = b + s.on + (s.off - s.on) * j / 16; pts.push([gx(ph), iy(supAt(sp, s, ph))]); }

  function peakLabel(v, Vp) {

  function drawRun(v) {
    const sp = v.sp, s = v.s, P = sp.P, Vp = sp.Vp, span = NP * P;
    const gx = (ph) => X0 + ph / span * (X1 - X0), gy = (x) => YZ - x * (YZ - YP) / Vp;
    const iy = (a) => YCZ - Math.min(a, IMAX) * (YCZ - YCT) / IMAX;

    if (v.d.avgRef) items.push(['avg', 'no capacitor']);
    keyRow(14, items);

    peakLabel(v, Vp);
    if (v.d.avgRef) { const ha = 2 / Math.PI * Vp; ln(X0, gy(ha), X1, gy(ha), 'avg'); tx(42, gy(ha) + 4, fx(ha, 0) + ' V', 'lab m say', 'end'); }

    if (v.busK > 0) { pa(busD(sp, s, gx, gy, v.busK), 'bus'); REC.bus = true; }
    // The dip, marked between the peak and the bus's lowest point.
    if (!s.flat && s.dip >= 0.5 && v.busK >= 1 && v.reveal > 0) part(v.reveal, 0, () => {
      const xm = gx(3 * P + s.on), yb = gy(s.von), lab = 'dip ' + fx(s.dip, 0) + ' V', w = tw(lab, 'lab');
      ln(xm, YP, xm, yb, 'brk'); ln(xm - 4, YP, xm + 4, YP, 'brk'); ln(xm - 4, yb, xm + 4, yb, 'brk');
      tx(K.clamp(xm, X0 + w / 2, 336 - w / 2), YP - 8, lab, 'lab say');
      REC.dip = lab;
    });
    // The supply current below, on the same time axis.
    tx(X1, YCT - 10, 'supply current', 'lab t', 'end');
    ln(X0, YCT, X0, YCZ, 'ax'); ln(X0, YCZ, X1, YCZ, 'ax');
    tx(42, YCT + 4, IMAX + ' A', 'lab m say', 'end'); tx(42, YCZ + 4, '0', 'lab m', 'end');
    pa(curD(sp, s, gx, iy), 'icur');
    const ticks = [];
    for (let k = 0; k <= NP; k++) { const x = gx(k * P), ms = k * 1000 / sp.f; ln(x, YCZ, x, YCZ + 4, 'ax'); if (Math.abs(ms - Math.round(ms)) < 1e-9) ticks.push([x, Math.round(ms)]); }

      ln(xc, YP, xc, YZ, 'cur'); ci(xc, gy(busAt(sp, s, v.ph)), 4.5, 'odot');

  }
  function drawSwitch(v) {
    const sp = v.sp, Vp = sp.Vp, z = v.z, t0 = -z.ax / 30, span = z.ax - t0;

      for (let j = 0; j <= 160; j++) ts.push(z.ax * j / 160);
      const tt = ts.filter((t) => t <= v.tnow).sort((a, b) => a - b);
      tt.push(v.tnow);
      let bd = 'M' + r2(gx(t0)) + ' ' + r2(gy(0));
      tt.forEach((t) => { bd += 'L' + r2(gx(t)) + ' ' + r2(gy(soBus(Vp, v.C, v.pre, t))); });
      let cd = 'M' + r2(gx(t0)) + ' ' + r2(iy(0)) + 'L' + r2(gx(0)) + ' ' + r2(iy(0)), tcDone = false;

        cd += 'L' + r2(gx(t)) + ' ' + r2(iy(soCur(Vp, v.C, v.pre, t)));
      });

      pa(cd, v.pre ? 'icur' : 'icur hot');

        // The first current runs off the top of the graph.
        const xs = gx(0);
        pa('M' + r2(xs) + ' ' + (YCT - 11) + ' l-5 9 h10 z', 'headw');
        tx(xs + 8, YCT + 12, fx(Vp / RS, 0) + ' A', 'lab w say', 'start');

      }

  // ---------- one screen drawn in its state ----------
  function render(i, p, st) {
    REC = { texts: [], state: '', bus: false, dip: '', marker: false, hot: false, v: null };
    latest = 0; earliest = Infinity;
    const v = view(i, p, st);

  }
  function paint() {
    const i = at(), R = render(i, K.params(), S[i]);

  }

  // ---------- what Dan reads under the picture ----------
  const fallTxt = (I, C) => { const f = I / C / 1000; return f >= 10 ? fx(f, 0) : f >= 1 ? fx(f, 1).replace(/\.0$/, '') : fx(f, 2); };

    if (v.sw) {

      if (!v.pre) return 'An empty capacitor meets the supply through only 1 Ω, so the first current is ' + fx(v.sp.Vp / RS, 0) + ' A. The capacitor is full within about ' + fx(5 * v.z.t1 * 1000, 0) + ' ms.';
      return v.tnow < v.z.tc ? 'The resistor holds the first current to about ' + fx(v.sp.Vp / RP, 0) + ' A, and the bus climbs the charging curve.'

    }

    if (v.state === 'fill') return 'The hump is above the bus, so the diodes conduct and the capacitor fills in a short gulp.';
    return 'The diodes block, and the load drains the capacitor at ' + fallTxt(v.I, v.C) + ' V each millisecond. The bus dips about ' + fx(v.s.dip, 0) + ' V before the next gulp.';

  function enterStep(i) {

  K.check('On 230 V the humps peak at 230 × √2 = 325 V. With no capacitor they average 0.637 × 325 = 207 V', () =>

  K.check('The rule I ÷ (f × C): 2 A on 1000 µF gives 20 V, 4 A gives 40 V, 2000 µF gives 10 V, and 4 A on 4000 µF gives 10 V again', () =>
    [[2, 1000, 20], [4, 1000, 40], [2, 2000, 10], [4, 4000, 10]].every((q) => K.near(K.at({ supply: 230, I: q[0], C: q[1] }).ripple, q[2], 1e-9)));
  K.check('The rule\'s ripple is a straight line through zero in the load current: each 0.5 A adds the same amount', () => {

    return fx(K.at({ I: 2 }).busAvg, 0) === N.a2 && fx(K.at({ I: 4 }).busAvg, 0) === N.a4 && N.a2 === '317' && N.a4 === '309';
