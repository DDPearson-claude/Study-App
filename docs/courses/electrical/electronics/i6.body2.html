<script>
  // ---------- the rule ----------
  // A 48 V battery feeds a load that draws a steady 10 A through a 100 µH inductor. The switch is on for
  // D of each cycle T = 1 ÷ f. While on, the inductor sees its on height (Buck: Vin − Vout, Boost: Vin)
  // and its current climbs at that ÷ L. While off, it sees its off depth (Buck: Vout, Boost: Vout − Vin)
  // the other way round, and its current falls. The output settles where the two areas match:
  // (Vin − Vout) × D = Vout × (1 − D) in Buck, Vin × D = (Vout − Vin) × (1 − D) in Boost.
  const VIN = 48, IL = 10, LUH = 100, VRUN = 40, HOLD = 20, DBMAX = 75, GMAX = 80;
  const GUIDE = [20, 40];
  const TAU = 0.4, EPS = 0.05;
  const ALLPCB = 'https://www.allpcb.com/allelectrohub/how-to-calculate-buck-converter-duty-cycle';
  const TIBUCK = 'https://www.ti.com/lit/an/slva477b/slva477b.pdf?ts=1786269682384';
  const TIBOOST = 'https://www.ti.com/download/trng/docs/seminar/Topic_3_Lynch.pdf';
  const TISTEP = 'https://e2e.ti.com/cfs-file/__key/communityserver-discussions-components-files/196/3678.snva731.pdf';
  const ADI = 'https://www.analog.com/en/resources/technical-articles/dc-to-dc-buck-converter-tutorial.html';
  const fx = (v, d) => (Math.abs(v) < 0.5 * Math.pow(10, -d) ? 0 : v).toFixed(d).replace('-', '−');
  const f1 = (v) => { const r = Math.round(v * 10) / 10; return Math.abs(r - Math.round(r)) < 1e-9 ? fx(r, 0) : fx(r, 1); };
  const MODES = ['buck', 'boost'];
  const MODEN = { buck: 'Buck', boost: 'Boost' };
  const vBuck = (d) => VIN * d / 100;
  const vBoost = (d) => VIN / (1 - d / 100);
  const vT = (m, d) => (m === 'boost' ? vBoost(d) : vBuck(d));
  const hOnOf = (m, v) => (m === 'boost' ? VIN : VIN - v);
  const hOffOf = (m, v) => (m === 'boost' ? v - VIN : v);
  const Tus = (f) => 1000 / f;
  const riseOf = (m, d, f, v) => hOnOf(m, v) * (d / 100) * Tus(f) / LUH;
  const fallOf = (m, d, f, v) => hOffOf(m, v) * (1 - d / 100) * Tus(f) / LUH;
  const iAvgOf = (m, v) => (m === 'boost' ? v * IL / VIN : IL);
  const iBatOf = (v) => v * IL / VIN;
  const rippleOf = (m, d, f, v) => 100 * riseOf(m, d, f, v) / iAvgOf(m, v);
  // Three cycles of the inductor's current, starting where its mean over them is the average current.
  function wave(m, d, f, v) {
    const D = d / 100, rise = riseOf(m, d, f, v), fall = fallOf(m, d, f, v), net = rise - fall, iav = iAvgOf(m, v);
    const meanC = D * rise / 2 + (1 - D) * (rise - fall / 2);
    return { m, d, D, f, v, hOn: hOnOf(m, v), hOff: hOffOf(m, v), rise, fall, net, iav, i0: iav - net - meanC };
  }
  function iAt(w, u) {
    const k = Math.max(0, Math.min(2, Math.floor(u))), ph = u - k, b = w.i0 + k * w.net;
    return ph <= w.D ? b + w.rise * ph / w.D : b + w.rise - w.fall * (ph - w.D) / (1 - w.D);
  }
  const vAt = (w, u) => { const ph = u - Math.max(0, Math.min(2, Math.floor(u))); return ph < w.D ? w.hOn : -w.hOff; };

  // Every number the words show, worked out from the rule (a check compares them with the lesson's).
  const N = {
    b50: fx(vBuck(50), 0), b25: fx(vBuck(25), 0), drop: fx(VIN - vBuck(50), 0), on25: fx(VIN - vBuck(25), 0), on20: fx(VIN - HOLD, 0), hold: fx(HOLD, 0),
    heat: fx((VIN - vBuck(50)) * IL, 0), heatAll: fx(VIN * IL, 0),
    ib50: fx(iBatOf(vBuck(50)), 0), ib25: fx(iBatOf(vBuck(25)), 1), x4: fx(IL * VIN / vBuck(25), 0), p25: fx(vBuck(25) * IL, 0), res: fx((VIN - vBuck(25)) * IL, 0),
    on50t: f1(Tus(50) * 0.5), T25: f1(Tus(25)), on25t: f1(Tus(25) * 0.5),
    r50: fx(riseOf('buck', 50, 50, vBuck(50)), 1), rp50: fx(rippleOf('buck', 50, 50, vBuck(50)), 0),
    r100: fx(riseOf('buck', 50, 100, vBuck(50)), 1), rp100: fx(rippleOf('buck', 50, 100, vBuck(50)), 0),
    r25: fx(riseOf('buck', 50, 25, vBuck(50)), 1), rp25: fx(rippleOf('buck', 50, 25, vBuck(50)), 0),
    u50: fx(vBoost(50), 0), off50: fx(vBoost(50) - VIN, 0), u75: fx(vBoost(75), 0), x4V: fx(4 * VIN, 0), off75: fx(vBoost(75) - VIN, 0),
    area75: fx(VIN * 0.75, 0), area75b: fx((vBoost(75) - VIN) * 0.25, 0),
    iu50: fx(iBatOf(vBoost(50)), 0), pu50: fx(vBoost(50) * IL, 0), iu75: fx(iBatOf(vBoost(75)), 0),
    ru50: fx(riseOf('boost', 50, 50, vBoost(50)), 1), rpu50: fx(rippleOf('boost', 50, 50, vBoost(50)), 0),
    dB: fx(100 * (1 - VIN / (4 * VIN)), 0), dWrong: fx(100 * VIN / (4 * VIN), 0),
    d40: fx(100 * vBuck(50) / VRUN, 0), d40f: fx(vBuck(50) / VRUN, 1), half40: fx(VRUN * 0.5, 0), dw: fx(100 - 100 * vBuck(50) / VRUN, 0),
  };

  // ---------- the lesson: SHOW screens demonstrate, DO screens are puzzles ----------
  // set: where the picture opens (d is the duty cycle in %, f the frequency in kHz, time the cursor in
  // hundredths of a cycle, 300 = the end; hold stops the output there until a right Check). ctl: what a
  // demonstration lets Dan move; play: its motion as the screen opens. outs 'after' hides the readouts
  // until a right Check; hideB hides the battery current; ans: what a right Check changes.
  const STEPS = [
    { name: 'Heat in a transistor', set: { mode: 'buck', d: 50 }, outs: 'after', ans: {},
      task: `You need ${N.b50} V at ${IL} A from a ${VIN} V battery. A transistor held part on drops the other ${N.drop} V. How much heat does it make?`,
      opts: ['Next to nothing, as it is a transistor', `About ${N.heat} W`, `About ${N.heatAll} W`],
      want: `About ${N.heat} W`,
      hints: { 'Next to nothing, as it is a transistor': `Part on, it has ${N.drop} V across it and ${IL} A through it.`,
        [`About ${N.heatAll} W`]: 'Only half the battery\'s voltage is across the transistor.' },
      why: `About ${N.heat} W, as much as the load gets. Part on, the transistor has ${N.drop} V across it and ${IL} A through it. A switch kept fully on or fully off wastes little heat. So chop the battery instead, and smooth what comes out.` },
    { show: true, name: 'Chop it', set: { mode: 'buck', d: 50 }, ctl: ['time', 'play'], play: 'cursor',
      text: `A *buck converter* is a switching transistor followed by a diode, an inductor and a capacitor. Here a ${VIN} V battery feeds a load that draws ${IL} A. While the switch is on, current flows from the battery through the inductor to the load. When the switch opens, the inductor keeps its current going through the diode. That is the freewheeling diode again. The share of each cycle the switch is on is the *duty cycle*, D. Play it at D = 50%.`,
      read: 'With D at 50%, the switch carries the current for the first half of each cycle. The diode carries it for the second half. The inductor\'s current keeps flowing all through the cycle.',
      still: { mode: 'buck', duty: 50, freq: 50, time: 175 } },
    { name: 'Across the inductor', set: { mode: 'buck', d: 50, time: 125 }, ans: { lit: true },
      task: `The switch is on. The battery is ${VIN} V and the output ${N.b50} V. What voltage is across the inductor?`,
      opts: [`${VIN} V, the whole battery`, '0 V, as current flows freely', `${N.drop} V, the difference`],
      want: `${N.drop} V, the difference`,
      hints: { [`${VIN} V, the whole battery`]: 'The inductor\'s far end sits at the output, not at 0 V.',
        '0 V, as current flows freely': 'Its current is climbing. A coil\'s current changes only with a voltage across it.' },
      why: `${N.drop} V. One end sees the battery's ${VIN} V through the switch. The other end sits at the output's ${N.b50} V. That ${N.drop} V across it makes its current climb steadily, as v = L di/dt says.` },
    { show: true, name: 'Two areas', set: { mode: 'buck', d: 50 }, ctl: ['time', 'play'], play: 'cursor',
      text: 'The upper plot is the voltage across the inductor. While the switch is on, it is the battery less the output, so the current climbs. While it is off, the diode holds the inductor\'s input end near 0 V. So the inductor sees the output voltage the other way round, and the current falls. Each shaded area is a voltage times a time. In steady running the current ends each cycle where it began. So the two areas must be equal. The average voltage across the inductor is zero.',
      read: `With D at 50%, the output sits at ${N.b50} V. The area above the line is ${N.drop} V for half the cycle. It equals the area below, ${N.b50} V for the other half. The current ramps up and back down to where it started.`,
      still: { mode: 'buck', duty: 50, freq: 50, time: 300 } },
    { name: 'Too low', set: { mode: 'buck', d: 50, hold: HOLD }, ans: { release: true },
      task: `The output has reached only ${N.hold} V, with D at 50%. What happens next?`,
      opts: ['The area below is bigger, so the output falls', 'The area above is bigger, so the current climbs and the output rises', 'Nothing, as the areas already balance'],
      want: 'The area above is bigger, so the current climbs and the output rises',
      hints: { 'The area below is bigger, so the output falls': `Above the line: ${VIN} − ${N.hold} = ${N.on20} V for half the cycle. Below: ${N.hold} V for half. Which is bigger?`,
        'Nothing, as the areas already balance': `Compare ${N.on20} V and ${N.hold} V, each for half the cycle.` },
      why: `The area above is bigger, ${N.on20} V against ${N.hold} V, each for half the cycle. So the current climbs a little more each cycle than it falls. The extra current charges the capacitor, and the output rises. That shrinks the area above and grows the one below. It stops at ${N.b50} V, where they balance.` },
    { show: true, name: 'The rule', set: { mode: 'buck', d: 50 }, ctl: ['duty'], play: { id: 'duty', from: 50, to: 25, dur: 1.4 },
      text: `Equal areas give the rule. The area above is (Vin − Vout) × D. The area below is Vout × (1 − D). Set them equal and multiply out. The Vout × D on each side cancels. That leaves Vout = D × Vin. So 50% of ${VIN} V gives ${N.b50} V, and 25% gives ${N.b25} V. Drag D, and the output moves until the areas match again.`,
      read: `With D at 25%, the output has settled at ${N.b25} V. The area above is ${N.on25} V for a quarter of the cycle. It matches the area below, ${N.b25} V for three quarters.`,
      still: { mode: 'buck', duty: 25, freq: 50, time: 300 } },
    { name: 'From the battery', set: { mode: 'buck', d: 25 }, hideB: true, ans: {},
      task: `The load still draws ${IL} A. What average current does the ${VIN} V battery supply?`,
      opts: [`About ${IL} A, the same as the load`, `About ${N.x4} A`, `About ${N.ib25} A`],
      want: `About ${N.ib25} A`,
      hints: { [`About ${IL} A, the same as the load`]: 'That is what a series resistor would take. When does the battery give current here?',
        [`About ${N.x4} A`]: 'A buck lowers the voltage. Does the battery need more current than the load, or less?' },
      why: `About ${N.ib25} A. The battery gives current only while the switch is on, ${IL} A for a quarter of each cycle. That averages ${N.ib25} A, or ${N.p25} W from ${VIN} V. The load gets ${N.b25} V × ${IL} A, also ${N.p25} W. A series resistor would take the full ${IL} A and burn ${N.res} W.` },
    { show: true, name: 'Ripple', set: { mode: 'buck', d: 50, f: 50 }, ctl: ['freq'], play: { id: 'freq', from: 50, to: 100, dur: 3 },
      text: `The lower plot is the inductor's current. It ramps up and down around the load's ${IL} A. While on, it climbs at (Vin − Vout) ÷ L amps a second. Each cycle it climbs (Vin − Vout) × D ÷ (f × L). Here ${N.drop} V across ${LUH} µH for ${N.on50t} µs gives ${N.r50} A, ${N.rp50}% of ${IL} A. A good first estimate is ${GUIDE[0]}% to ${GUIDE[1]}% of the output current. The capacitor takes the ripple, so the load sees near-steady DC. Raise the frequency, and the ripple shrinks.`,
      read: `At 100 kHz the current ramps half as far each way, ${N.r100} A in all. The ripple reads ${N.rp100}%. The output stays at ${N.b50} V.`,
      still: { mode: 'buck', duty: 50, freq: 100, time: 300 } },
    { name: 'Slower switching', set: { mode: 'buck', d: 50, f: 50 }, ans: { sweep: { id: 'freq', from: 50, to: 25 }, set: { f: 25 } },
      task: 'The switching frequency drops to 25 kHz. What is the ripple now?',
      opts: [`${N.r100} A, ${N.rp100}% of the load`, `${N.r25} A, ${N.rp25}% of the load`, `${N.r50} A, as the frequency does not matter`],
      want: `${N.r25} A, ${N.rp25}% of the load`,
      hints: { [`${N.r100} A, ${N.rp100}% of the load`]: 'At a lower frequency each on-time is longer. Does the current climb further, or less far?',
        [`${N.r50} A, as the frequency does not matter`]: `The on-time is now ${N.on25t} µs, not ${N.on50t} µs.` },
      why: `${N.r25} A. At 25 kHz each cycle lasts ${N.T25} µs, so the switch is on for ${N.on25t} µs. ${N.drop} V across ${LUH} µH for twice as long climbs twice as far. That is ${N.rp25}% of ${IL} A, above the ${GUIDE[0]}% to ${GUIDE[1]}% guide. A higher frequency or a bigger inductor brings it back.` },
    { show: true, name: 'Boost', set: { mode: 'boost', d: 50 }, ctl: ['mode', 'duty'], play: { vo: VIN },
      text: `Flip the picker to Boost. The same parts are rearranged. The inductor now comes straight off the battery. The switch shorts its far end to 0 V. While on, the inductor sees the whole ${VIN} V and stores energy. When off, it drives its current through the diode into an output above the battery. The areas still balance: Vin × D = (Vout − Vin) × (1 − D). So Vout = Vin ÷ (1 − D), ${N.u50} V at 50%.`,
      read: `In Boost at 50%, the area above is ${VIN} V for half the cycle. It matches the area below, ${N.off50} V for the other half. The output reads ${N.u50} V.`,
      still: { mode: 'boost', dutyB: 50, freq: 50, time: 300 } },
    { name: 'Boost from the battery', set: { mode: 'boost', d: 50 }, hideB: true, hideI: true, ans: {},
      task: `This boost gives ${N.u50} V to a load drawing ${IL} A. What average current does the ${VIN} V battery supply?`,
      opts: [`About ${N.ib50} A, as in the buck`, `About ${IL} A, the same as the load`, `About ${N.iu50} A`],
      want: `About ${N.iu50} A`,
      hints: { [`About ${IL} A, the same as the load`]: `Compare the power: ${N.u50} V × ${IL} A out, but ${VIN} V × ${IL} A in.`,
        [`About ${N.ib50} A, as in the buck`]: 'A boost raises the voltage. Where must the extra power come from?' },
      why: `About ${N.iu50} A. The load takes ${N.u50} V × ${IL} A = ${N.pu50} W. With little lost, the battery must supply that too. ${N.pu50} W ÷ ${VIN} V = ${N.iu50} A. A boost trades current for voltage. It does not make energy.` },
    { name: 'Four times', set: { mode: 'boost', d: 50 }, ans: { set: { d: 75 } },
      task: `The boost must give ${N.x4V} V from the ${VIN} V battery. What duty cycle?`,
      opts: [`${N.dWrong}%`, `${N.dB}%`, 'None, as no chopper gives four times its input'],
      want: `${N.dB}%`,
      hints: { [`${N.dWrong}%`]: 'That is the buck way round. In a boost, 1 − D = Vin ÷ Vout.',

      why: `${N.dB}%. Four times the battery needs 1 − D = ¼, so D = 0.75. Check the areas. Above the line is ${VIN} V for three quarters of the cycle. Below is ${N.off75} V for a quarter. Both come to ${N.area75}. The battery current is now ${N.iu75} A for the load's ${IL} A.` },
