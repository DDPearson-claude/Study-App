<div class="pz" id="pz">

    <svg class="fig" id="graph" viewBox="0 0 340 196" width="100%" role="img" aria-label=""><g id="gart"></g><rect class="grab" id="grab" x="30" y="36" width="304" height="160"/></svg>
    <p class="gnote">One supply cycle, 0° to 360°. The numbers are worked out, not measured.</p>

<script>
  // ---------- the rule: ideal diodes, a perfect sine, a resistor load ----------
  // A diode conducts while the circuit pushes it forward and blocks while it is pushed backwards.
  // Half-wave: the supply in the positive half, 0 in the negative. Bridge: the size of the supply.
  // Six-pulse: the largest line-to-line voltage. Average so far = area under the output ÷ time so far.
  const SQ2 = Math.SQRT2, D2R = Math.PI / 180, TAU3 = 2 * Math.PI / 3;
  const AAC = 'https://www.allaboutcircuits.com/textbook/semiconductors/chpt-3/rectifier-circuits/';
  const ETUT = 'https://www.electronics-tutorials.ws/diode/diode_6.html';
  const AACD = 'https://www.allaboutcircuits.com/textbook/semiconductors/chpt-3/introduction-to-diodes-and-rectifiers/';
  const fx = (v, d) => (Math.abs(v) < 0.5 * Math.pow(10, -d) ? 0 : v).toFixed(d).replace('-', '−');
  const PK = (r) => r * SQ2, K135 = 3 * SQ2 / Math.PI;
  // Every number the words show, worked out from the rule (a check compares them with the lesson's).
  const N = {
    pk: fx(PK(230), 0), hw: fx(PK(230) / Math.PI, 0), br: fx(2 * PK(230) / Math.PI, 0),
    r318: fx(1 / Math.PI, 3), r637: fx(2 / Math.PI, 3), pk115: fx(PK(115), 0),
    pk400: fx(PK(400), 0), pk440: fx(PK(440), 0), cos30: fx(Math.cos(Math.PI / 6), 3),
    dip: fx(PK(400) * Math.cos(Math.PI / 6), 0), half400: fx(PK(400) / 2, 0),
    r955: fx(3 / Math.PI, 3), k135: fx(K135, 2), s400: fx(K135 * 400, 0), s440: fx(K135 * 440, 0),
    drop: fx(2 * 0.7, 1), pct: fx(2 * 0.7 / 12 * 100, 0), rip: String(2 * 50), rip6: String(6 * 50),
  };

  // ---------- the lesson: SHOW screens demonstrate, DO screens are puzzles ----------
  // kind/line/at: the bench this screen opens on; dur: a demonstration sweep; ans: what a right
  // Check runs the bench to; shows: words that appear on the picture only after a right Check.
  const STEPS = [
    { show: true, name: 'One diode', kind: 'half',
      text: `Start with one diode in series with a resistor load on 230 V. The supply peaks at ${N.pk} V. Drag the time cursor through one cycle. In the positive half the diode conducts, and the load gets the hump. In the negative half the diode blocks. The load gets nothing, and the diode holds the supply. A *rectifier* turns AC into current that flows one way. This one is a *half-wave rectifier*. It throws half of every cycle away.`,
      read: `With the cursor at the end of the cycle, the output shows one hump in the positive half. In the negative half it is a flat line. The arrow through the load shows only during the hump.`,
      still: { kind: 'half', cursor: 360 } },
    { name: 'The average at the end', kind: 'half', at: 180, avgNum: true, ans: { to: 360 },
      task: `What will the average read at 360°, the end of the cycle?`,
      opts: [`${N.br} V, as nothing is added`, `About ${N.hw} V`, `0 V, as the second half is empty`], want: `About ${N.hw} V`,
      hints: { [`${N.br} V, as nothing is added`]: `The average is area ÷ length. The flat half adds length.`,
        '0 V, as the second half is empty': `The hump's area is still there. Only the length grows.` },
      why: `The flat half adds no area but doubles the length. So the average halves, to about ${N.hw} V. That is ${N.r318} of the ${N.pk} V peak, the peak ÷ π.`,
      shows: [`average: ${N.hw} V`] },
    { show: true, name: 'Four diodes', kind: 'bridge',
      text: `Now use four diodes in a diamond, a *bridge*. The supply joins two opposite corners, and the load joins the other two. Drag through the positive half. D1 and D2 conduct, and current flows down through the load. Now drag through the negative half. The supply's other wire is the high one now. D3 and D4 conduct, and D1 and D2 block. Watch the arrow through the load. Whatever the polarity of the input, the current through the load flows the same way.`,
      read: `In the positive half, D1 and D2 are bold. In the negative half, D3 and D4 are bold. Both times the arrow through the load points down.`,
      still: { kind: 'bridge', cursor: 270 } },
    { name: 'Which way now?', kind: 'bridge', at: 270, hidePath: true,
      task: `Which way does current flow through the load now?`,
      opts: [`Up, as the supply has reversed`, `None, as only D1 and D2 ever conduct`, `Down, the same way as in the positive half`],
      want: `Down, the same way as in the positive half`,
      hints: { 'Up, as the supply has reversed': `The supply has reversed, but D3 and D4 now carry it. Follow them to the top of the load.`,
        'None, as only D1 and D2 ever conduct': `D1 and D2 block in this half. Look at the other pair.` },
      why: `In the negative half, the supply's other wire is the high one. D3 takes the current to the top of the load. D4 returns it from the bottom. So it flows down, as before. Each pair conducts while the other blocks.`,
      shows: ['current'] },
    { show: true, name: 'Twice the average', kind: 'bridge', dur: 3.6,
      text: `The bridge turns the negative half into a second hump. The length of a cycle stays the same, but the area doubles. So the average doubles too. With no diode losses it is ${N.r637} of the peak. That is the half-cycle average you already know. On 230 V it is about ${N.br} V. The humps now come twice a cycle. So the output rises and falls ${N.rip} times a second on a 50 Hz supply. That rise and fall is called *ripple*.`,
      read: `Over a whole cycle the bridge shows two humps. Its average line settles at ${N.br} V, twice the half-wave's ${N.hw} V.`,
      still: { kind: 'bridge', cursor: 360 } },
    { name: 'What the diodes take', kind: 'bridge', at: 90, rings: true,
      task: `A bridge feeds a battery charger whose output is about 12 V. How much voltage do its diodes take?`,
      opts: [`About ${N.drop} V, near ${N.pct}% of the output`, `About 0.7 V`, `None, as conducting diodes are closed switches`],
      want: `About ${N.drop} V, near ${N.pct}% of the output`,
      hints: { 'About 0.7 V': `Count the bold diodes in the current's path at any moment.`,
        'None, as conducting diodes are closed switches': `A conducting silicon diode still holds about 0.7 V.` },
      why: `At every moment the current passes through two diodes in series. Each holds about 0.7 V. So the bridge takes about ${N.drop} V. On a ${N.br} V output that is under 1%. On 12 V it is about ${N.pct}%.` },
    { show: true, name: 'The probe', kind: 'bridge', probe: true,
      text: `While D1 conducts, the probe reads almost nothing. In the negative half, D3 and D4 conduct. They join D1 straight across the supply. So D1 holds the whole supply voltage, the wrong way round. Drag through the negative half and watch the probe's trace. It peaks at ${N.pk} V at 270°. So every diode in a 230 V bridge needs a *peak inverse voltage* above ${N.pk} V, not above 230 V.`,
      read: `The probe's trace sits on zero while D1 conducts. In the negative half it climbs to ${N.pk} V at 270° and falls back to zero at 360°.`,
      still: { kind: 'bridge', cursor: 360 } },
    { name: 'A 115 V bridge', kind: 'bridge', rms: 115, probe: true, at: 90, ans: { to: 360 },
      task: `A bridge runs from a 115 V single-phase supply. What reverse voltage must each diode withstand?`,
      opts: [`115 V, the supply's rms`, `None, as a blocked diode carries no current`, `About ${N.pk115} V, the supply's peak`],
      want: `About ${N.pk115} V, the supply's peak`,
      hints: { "115 V, the supply's rms": `The supply passes 115 V on its way up. Work out its peak.`,
        'None, as a blocked diode carries no current': `No current flows through it. But the conducting pair joins it straight across the supply.` },
      why: `While a diode blocks, the conducting pair joins it straight across the supply. So it holds the whole supply the wrong way round. At the peak that is 115 × √2 = ${N.pk115} V. Its peak inverse voltage must be above that.`,
      shows: [`peak ${N.pk115} V`] },
    { show: true, name: 'Six diodes', kind: 'six', line: 400,
      text: `A three-phase bridge uses six diodes. Each line has an upper diode to the positive rail and a lower diode from the negative rail. The positive rail can sit no lower than the highest line. So that line's upper diode conducts. The others are pushed backwards. Likewise the lowest line holds the negative rail. So the load gets the largest line-to-line voltage of that moment. Drag the cursor. The largest changes every 60°. So each pair conducts for 60°, and the output has six pulses a cycle.`,
      read: `The six line-to-line waves are drawn pale. The output rides their tops. The bold pair changes every 60°. The arrow through the load points down throughout.`,
      still: { kind: 'six', line: 400, cursor: 360 } },
    { name: 'How low it dips', kind: 'six', line: 400, at: 0, dips: true, ans: { to: 360 },
      task: `On 400 V the line-to-line peak is ${N.pk400} V. Each top of the output runs from 30° before a peak to 30° after it. How low does the output dip?`,
      opts: [`0 V, between pulses`, `About ${N.dip} V`, `About ${N.half400} V, half the peak`], want: `About ${N.dip} V`,
      hints: { '0 V, between pulses': `The next top takes over before this one falls far. Look where the pale waves cross.`,
        [`About ${N.half400} V, half the peak`]: `The handover comes only 30° from the peak. What is cos 30°?` },
      why: `Each top is a slice of a cosine, from −30° to +30°. At its edges it has fallen to cos 30° = ${N.cos30} of the peak. So the output dips only to ${N.cos30} × ${N.pk400} = ${N.dip} V.`,
      shows: [`dips to ${N.dip} V`] },
    { show: true, name: 'Where 1.35 comes from', kind: 'six', line: 400, dur: 3.6,
      text: `Take area ÷ length over one 60° top. In volts times radians, the area under that cosine slice is the peak × 2 sin 30°. That is just the peak. The length is 60°, or π ÷ 3. So the average is 3 ÷ π of the peak, about ${N.r955}. The peak is √2 times the line voltage. So the average is 3√2 ÷ π, about ${N.k135} times the line voltage. On 400 V that is ${N.s400} V. Six pulses a cycle make ${N.rip6} Hz ripple on 50 Hz.`,
      read: `On 400 V the average line settles at ${N.s400} V, close under the ${N.pk400} V tops.`,
      still: { kind: 'six', line: 400, cursor: 360 } },
    { name: 'One diode fails', kind: 'bridge', open: 'd3', at: 0, avgNum: true, ans: { to: 360 },
      task: `One diode in a 230 V, 50 Hz bridge fails open. What does the load get now?`,
      opts: [`Half-wave: about ${N.hw} V average, 50 humps a second`, `The same ${N.br} V, as three diodes remain`, `Nothing at all`],
      want: `Half-wave: about ${N.hw} V average, 50 humps a second`,
      hints: { [`The same ${N.br} V, as three diodes remain`]: `Follow the half whose pair has lost a diode. Can current get through?`,
        'Nothing at all': `The other pair is still whole. Its half still gets through.` },
      why: `The pair with the open diode can no longer carry its half. The other pair still carries its half. So the bridge works as a half-wave rectifier. The average falls to about ${N.hw} V. The humps come 50 times a second.`,
      shows: [`average: ${N.hw} V`, 'now a half-wave'] },
    { name: 'Six-pulse on 440 V', kind: 'six', line: 400, at: 0, avgNum: true, ans: { to: 360, line: 440 },
      task: `A six-pulse rectifier runs from 440 V into a resistor. What average DC does the load get?`,
      opts: [`About ${N.pk440} V`, `440 V`, `About ${N.s440} V`], want: `About ${N.s440} V`,
      hints: { [`About ${N.pk440} V`]: `That is the peak of the tops. The output dips between them. So the average sits a little lower.`,
        '440 V': `The output rides the tops, and they sit well above the line voltage.` },
      why: `The average is ${N.k135} times the line voltage. That gives ${N.k135} × 440 = ${N.s440} V. The tops reach 440 × √2 = ${N.pk440} V. The dips between them pull the average a little below that.`,
      shows: [`average: ${N.s440} V`] },
  ];
  const FINISH = 'Diodes in a bridge steer both halves of the AC the same way through the load, so the output is DC that pulses.';
  const FADE = 0.35, ANS = 2.0;
  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const testing = () => document.documentElement.classList.contains('k-testing');
  const el = (id) => document.getElementById(id);

  // ---------- the model ----------
  const stepOf = (p) => K.clamp(Math.round(+p.step) || 0, 0, STEPS.length - 1);
  function cfg(p) {
    const d = STEPS[stepOf(p)];
    return { kind: ['half', 'bridge', 'six'].indexOf(p.kind) >= 0 ? p.kind : 'half', rms: d.rms || 230, line: +p.line === 440 ? 440 : 400, open: d.open || '' };
  }
  // The bench at one moment: the output, which diodes conduct, and the reverse voltage on the probed diode.
  function sample(c, th) {
    const r = th * D2R;
    if (c.kind === 'six') {
      const vp = c.line * SQ2 / Math.sqrt(3), ph = [0, 1, 2].map((k) => vp * Math.sin(r - k * TAU3));
      let u = 0, l = 0;
      for (let k = 1; k < 3; k++) { if (ph[k] > ph[u] + 1e-9) u = k; if (ph[k] < ph[l] - 1e-9) l = k; }
      return { v: ph, out: ph[u] - ph[l], u, l, on: ['u' + u, 'l' + l], probe: ph[u] - ph[0], half: 1 };
    }
    const vp = c.rms * SQ2, v = vp * Math.sin(r), e = vp * 1e-9;
    const half = v > e ? 1 : v < -e ? -1 : 0, probe = half < 0 ? -v : 0;
    if (c.kind === 'half') return { v, out: half > 0 ? v : 0, on: half > 0 ? ['d1'] : [], probe, half };
    const pair = half > 0 ? ['d1', 'd2'] : half < 0 ? ['d3', 'd4'] : [], ok = pair.length > 0 && pair.indexOf(c.open) < 0;
    return { v, out: ok ? Math.abs(v) : 0, on: ok ? pair : [], probe, half };
  }
  const keyOf = (c) => c.kind + c.rms + '|' + c.line + c.open;
  const outAt = (c, t) => sample(c, t).out;
  const CUM = new Map(), PPK = new Map();
  function cum(c) {     // area under the output from 0° to each whole degree (Simpson's rule per degree)
    const k = keyOf(c);
    let a = CUM.get(k);
    if (a) return a;
    a = [0];
    for (let j = 0; j < 360; j++) a.push(a[j] + (outAt(c, j) + 4 * outAt(c, j + 0.5) + outAt(c, j + 1)) / 6);
    CUM.set(k, a);
    return a;
  }
  function avgAt(c, th) {
    th = K.clamp(+th || 0, 0, 360);
    if (th < 1e-6) return outAt(c, 0);
    const j = Math.floor(th), h = th - j;
    let s = cum(c)[j];
    if (h > 0) s += h * (outAt(c, j) + 4 * outAt(c, j + h / 2) + outAt(c, th)) / 6;
    return s / th;
  }
  function probePeak(c) {
    const k = keyOf(c);
    if (PPK.has(k)) return PPK.get(k);
    let best = { v: -1, at: 0 };
    for (let t = 0; t <= 360; t++) { const q = sample(c, t).probe; if (q > best.v + 1e-9) best = { v: q, at: t }; }
    PPK.set(k, best);
    return best;
  }

  // ---------- state ----------
  const blank = () => ({ pick: null, res: null, why: false });
  const solved = (i) => ({ pick: STEPS[i].want, res: 'right', why: false });
  let S = STEPS.map(() => blank());
  let finished = false, lastStep = -1, lastDone = false;
  let T = Infinity, motionEnd = 0, SW = null, PH = 0, FLOW = null, REC = null;
  const setupOf = (i, right) => {
    const d = STEPS[i], a = right && d.ans;
    return { step: i, kind: d.kind, line: a && a.line ? a.line : d.line || 400, cursor: a ? a.to : d.at || 0 };
  };

  // ---------- words with amber key terms (built with K.el, never innerHTML) ----------
  function write(node, s) {
    node.textContent = '';
    const re = /\*([^*]+)\*/g;
    let at = 0, m;
    while ((m = re.exec(s))) {
      if (m.index > at) node.appendChild(document.createTextNode(s.slice(at, m.index)));
      node.appendChild(K.el('span', { class: 'term' }, m[1]));
      at = m.index + m[0].length;
    }
    if (at < s.length) node.appendChild(document.createTextNode(s.slice(at)));
    return node;
  }

  // ---------- controls ----------
  const stepper = K.stepper({ id: 'step', label: 'Step', steps: STEPS.map((d) => d.name), value: 0, compact: true, into: '#prog' });
  const at = () => K.clamp(Math.round(stepper.get()) || 0, 0, STEPS.length - 1);
  const kindCtl = K.choice({ id: 'kind', label: 'Rectifier', options: [{ value: 'half', label: 'Half-wave' }, { value: 'bridge', label: 'Bridge' }, { value: 'six', label: 'Six-pulse' }], value: 'half', into: '#sw' });
  const lineCtl = K.choice({ id: 'line', label: 'Line voltage', options: [{ value: 400, label: '400 V' }, { value: 440, label: '440 V' }], value: 400, into: '#sw' });
  const curCtl = K.control({ id: 'cursor', label: 'Time cursor', min: 0, max: 360, step: 1, value: 0, fmt: (v) => Math.round(v) + '°',
    snap: [180, 270, 360], hint: 'Or drag along the graph', into: '#ctl' });
  const playBtn = K.button({ label: 'Play', secondary: true, into: '#ctl', press: () => {
    if (finished || !STEPS[at()].show) return;
    if (SW && SW.play) { SW = null; return; }
    const from = curCtl.get() >= 360 ? 0 : curCtl.get();
    sweep(from, 360, (360 - from) / 90, false, 0);
  } });
  K.readout({ id: 'outNow', label: 'Output now', unit: 'V', decimals: 0, into: '#outs' });
  K.readout({ id: 'avgSoFar', label: 'Average so far', unit: 'V', decimals: 0, into: '#outs' });
  const rProbe = K.readout({ id: 'probe', label: 'Probe on the diode', unit: 'V', decimals: 0, into: '#outs' });
  K.model((p) => {

      : 'Wire B is the high one, so D1 is pushed backwards and blocks. The load gets nothing, and D1 holds the supply.';
    else t = s.half > 0 ? 'Wire A is the high one. D1 and D2 conduct, and current flows down through the load.'
      : 'Wire B is the high one. D3 and D4 conduct, and current still flows down through the load.';
    if (v.probe && s.probe > 0.5) t += c.kind === 'six' ? ' L1\'s upper diode blocks, and the probe shows the voltage it holds.' : c.kind === 'bridge' ? ' D1 blocks, and the probe shows it holding the supply the wrong way round.' : ' The probe shows D1 holding the supply the wrong way round.';
    if (v.th >= 360) t += ' Over the whole cycle, the average is ' + (c.kind === 'six' ? fx(v.avg / c.line, 2) + ' times the line voltage.' : fx(v.avg / v.peak, 3) + ' of the peak.');
    return t;
  }
  function layout(i, d, st, p) {
    const right = st.res === 'right';
    el('stepbox').hidden = finished;
    el('done').hidden = !finished;
    el('count').textContent = 'Step ' + (i + 1) + ' of ' + STEPS.length + ' · ' + d.name;
    const task = el('task');
    task.className = 'task' + (d.show ? ' show' : '');
    write(task, d.show ? d.text : d.task);
    el('sw').hidden = !d.show; lineCtl.el.hidden = p.kind !== 'six';
    el('ctl').hidden = !d.show; el('outs').hidden = !d.show; rProbe.el.hidden = !d.probe;
    el('say').hidden = !d.show;
    el('say').textContent = d.show ? sayFor(view(i, p, st)) : '';
    grab.style.pointerEvents = d.show ? '' : 'none';
    playBtn.setLabel(SW && SW.play ? 'Pause' : 'Play');
    const opts = d.show ? [] : d.opts;
    el('picks').hidden = !opts.length;
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      b.setLabel(opts[k]);
      b.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });
    el('acts').hidden = !!d.show;
    checkBtn.el.hidden = right;
    const fb = el('fb');
    fb.hidden = !!d.show;
    fb.className = 'fb' + (right ? ' right' : '');
    fb.textContent = d.show ? '' : right ? 'That\'s it.' : st.res === 'wrong' ? d.hints[st.pick] || '' : st.res === 'empty' ? 'Pick an answer first.' : '';
    const why = el('why');
    why.hidden = !!d.show || !st.why;
    if (!d.show) write(why, d.why);
    whyBtn.setLabel(st.why ? 'Hide why' : 'Why?');
    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !right);
    nextBtn.setLabel(i === STEPS.length - 1 ? 'Finish' : 'Continue');
    el('nav').hidden = backBtn.el.hidden && nextBtn.el.hidden;
  }
  write(el('finish'), FINISH);
  K.drag('#grab', { control: 'cursor', toValue: (x) => (STEPS[at()].show ? K.clamp(Math.round((x - X0) / (X1 - X0) * 360), 0, 360) : curCtl.get()) });
  K.update((p) => {
    const i = at(), d = STEPS[i], st = S[i];
    if (!motion.playing()) { T = Infinity; SW = null; }
    if (i !== lastStep) {
      // A new screen opens on its own bench: its rectifier, line voltage and cursor.
      lastStep = i; enter('stepbox'); SW = null; T = Infinity;
      const q = setupOf(i, st.res === 'right');
      kindCtl.set(q.kind, true); lineCtl.set(q.line, true); curCtl.set(q.cursor, true);
      if (d.show && d.dur) { sweep(0, 360, d.dur, true, FADE); if (SW) { T = 0; motionEnd = d.dur + FADE; } }
      K.refresh();
      return;
    }
    if (SW && Math.round(+p.cursor) !== SW.last) SW = null;    // Dan took hold of the cursor
    if (finished !== lastDone) { lastDone = finished; enter(finished ? 'done' : 'stepbox'); }
    layout(i, d, st, p);
    render(i, p, st);
    dots();
    kick();
  });

  // ---------- known answers, worked out by hand ----------
  const DO = STEPS.map((d, i) => i).filter((i) => !STEPS[i].show);
  const cOf = (kind, extra) => Object.assign({ kind, rms: 230, line: 400, open: '' }, extra || {});
  function drawnAt(i, over, right) {
    const keepT = T;
    T = Infinity;
    try { return render(i, Object.assign({}, K.params(), setupOf(i, !!right), over || {}), right ? solved(i) : blank()); }
    finally { T = keepT; paint(); }
  }
  K.check(`On 230 V the supply peaks at 230 × √2 = 325 V. The half-wave averages 207 V over its hump, and 325 ÷ π = 104 V over the whole cycle, 0.318 of the peak`, () => {
    const a = K.at({ kind: 'half', cursor: 180 }).avgSoFar, b = K.at({ kind: 'half', cursor: 360 }).avgSoFar;
    return N.pk === '325' && fx(a, 0) === '207' && fx(b, 0) === '104' && K.near(b / PK(230), 1 / Math.PI, 1e-7) && fx(b / PK(230), 3) === '0.318';
  });
  K.check('The full-wave average is 2 × 0.318 = 0.637 of the peak voltage, assuming no diode losses: the bridge averages 207 V on 230 V, twice the half-wave', () => {
    const b = K.at({ kind: 'bridge', cursor: 360 }).avgSoFar, h = K.at({ kind: 'half', cursor: 360 }).avgSoFar;
    return K.near(b / PK(230), 0.637, 5e-4) && K.near(b, 2 * h, 1e-6) && fx(b, 0) === N.br;
  }, { source: ETUT });
  K.check('Regardless of the polarity of the input, the current flows in the same direction through the load: D1 and D2 carry the positive half, D3 and D4 the negative, and the output never goes below zero', () => {
    const c = cOf('bridge');
    for (let t = 1; t < 360; t++) {
      if (t === 180) continue;
      const s = sample(c, t);
      if (!(s.out > 0) || s.on.join() !== (t < 180 ? 'd1,d2' : 'd3,d4')) return false;
    }
    return true;
  }, { source: AAC });
  K.check('The ripple frequency is twice the supply frequency: the bridge output has two humps a cycle, 100 a second on a 50 Hz supply', () => {
    const c = cOf('bridge');
    let n = 0;
    for (let t = 1; t < 360; t++) { const a = outAt(c, t - 1), b = outAt(c, t), d = outAt(c, t + 1); if (b > a && b >= d) n++; }
    return n === 2 && String(n * 50) === N.rip;
  }, { source: ETUT });
  K.check('The probe on D1 reads 0 while D1 conducts, and peaks at 270°: 325 V in a 230 V bridge, and 115 × √2 = 163 V in a 115 V one', () => {
    const a = K.at({ kind: 'bridge', cursor: 90 }).probe, b = K.at({ kind: 'bridge', cursor: 270 }).probe, q = K.at({ step: 7, kind: 'bridge', cursor: 270 }).probe;
    return a === 0 && fx(b, 0) === N.pk && fx(q, 0) === N.pk115 && probePeak(cOf('bridge')).at === 270;
  });
  K.check('Six-pulse on 400 V: the output dips to cos 30° × 566 = 490 V and averages 3√2 ÷ π × 400 = 540 V; on 440 V it averages 594 V under 622 V tops', () => {
    const c = cOf('six');
    let lo = Infinity, hi = 0;
    for (let t = 0; t <= 360; t++) { const o = outAt(c, t); lo = Math.min(lo, o); hi = Math.max(hi, o); }
    const a = K.at({ kind: 'six', line: 400, cursor: 360 }).avgSoFar, b = K.at({ kind: 'six', line: 440, cursor: 360 }).avgSoFar;
    return fx(lo, 0) === N.dip && fx(hi, 0) === N.pk400 && fx(a, 0) === N.s400 && fx(b, 0) === N.s440 && K.near(a / PK(400), 3 / Math.PI, 1e-6) && fx(PK(440), 0) === N.pk440;
  });
  K.check('In the six-pulse the output is the largest line-to-line voltage, the conducting pair changes six times a cycle (every 60°), and the probe on L1\'s upper diode peaks at the 566 V line-to-line peak', () => {
    const c = cOf('six');
    let n = 0;
    for (let t = 1; t < 360; t++) if (sample(c, t - 0.5).on.join() !== sample(c, t + 0.5).on.join()) n++;
    const big = [0, 17, 45, 100, 222, 300].every((t) => { const ph = sample(c, t).v; return K.near(outAt(c, t), Math.max.apply(null, ph) - Math.min.apply(null, ph), 1e-9); });
    return n === 6 && big && fx(probePeak(c).v, 0) === N.pk400;
  });
  K.check('With D3 open the bridge works as a half-wave: nothing in the negative half, and a 104 V average', () =>
    K.at({ step: 11, kind: 'bridge', cursor: 270 }).outNow === 0 && fx(K.at({ step: 11, kind: 'bridge', cursor: 360 }).avgSoFar, 0) === N.hw);
  K.check('Silicon diodes have a forward voltage of approximately 0.7 volts: two in the current\'s path take 1.4 V, about 12% of a 12 V output and under 1% of 207 V', () =>
    N.drop === '1.4' && N.pct === '12' && 1.4 / +N.br < 0.01, { source: AACD });
  K.check('Every number in the words comes from the rule: 325, 104, 207, 0.318, 0.637, 163, 566, 622, 0.866, 490, 283, 0.955, 1.35, 540, 594, 100 Hz and 300 Hz', () =>
    N.pk === '325' && N.hw === '104' && N.br === '207' && N.r318 === '0.318' && N.r637 === '0.637' && N.pk115 === '163' && N.pk400 === '566' &&
    N.pk440 === '622' && N.cos30 === '0.866' && N.dip === '490' && N.half400 === '283' && N.r955 === '0.955' && N.k135 === '1.35' &&
    N.s400 === '540' && N.s440 === '594' && N.rip === '100' && N.rip6 === '300');
  K.check('The drawing makes the conducting diodes bold and draws the arrow through the load, pointing down, only while current flows', () => {
    const a = drawnAt(2, { cursor: 90 }), b = drawnAt(2, { cursor: 270 }), z = drawnAt(2, { cursor: 180 }), h = drawnAt(0, { cursor: 270 }), s = drawnAt(8, { cursor: 45 });
    return a.arrow && b.arrow && !z.arrow && !h.arrow && s.arrow && a.on.join() === 'd1,d2' && b.on.join() === 'd3,d4' && s.on.length === 2;
  });
  K.check('Each puzzle offers three answers and accepts only its right one, every wrong answer has its own hint, and nothing in the picture shows the answer before Check', () =>
    DO.every((i) => {
      const d = STEPS[i];
      if (d.opts.length !== 3 || d.opts.indexOf(d.want) < 0 || d.opts.some((o) => o !== d.want && !d.hints[o])) return false;
      const before = drawnAt(i, null, false), bt = before.texts.slice(), br = before.rings, ba = before.arrow;
      const after = drawnAt(i, null, true);
      const shows = (d.shows || []).every((s) => bt.indexOf(s) < 0 && after.texts.indexOf(s) >= 0);
      return shows && (!d.rings || (br === 0 && after.rings === 2)) && (!d.hidePath || (!ba && after.arrow));
    }));
  K.check('Each demonstration sweep ends within 4.5 s of its screen opening, and a right answer shows within 3 s of Check', () =>
    STEPS.every((d) => !d.dur || d.dur + FADE <= 4.5) && ANS + K.SOFT <= 3);

  K.ready();
</script>
