<p class="caption">Example values: a 440 V, 60 Hz board, 3 MΩ a feeder and a 10 mA pulse.</p>

<script>
  // ---------- the rule ----------
  // A 440 V, 60 Hz insulated board with eight feeders. Each healthy feeder's insulation is 3 MΩ; the
  // monitor reads every connected path to the hull in parallel: 3,000 ÷ n kΩ for n feeders, 0 kΩ while the
  // solid fault is connected. The fault is in F6's pump motor, connected only while F6 is closed and the
  // pump runs (its contactor lifts the motor off when it stops). With the fault connected the hull sits at
  // L1, so a healthy feeder's clamp reads three times one line's healthy charging current, ω × C × 254 V;
  // the faulty feeder's clamp reads all the others added together. The injected pulse flows only through
  // the fault: 10 mA on the faulty feeder's path, 0 mA elsewhere.
  const VL = 440, R3 = 1.732, VPH = VL / R3, W = 2 * Math.PI * 60;
  const IH = W * 1e-6 * VPH * 1000;      // mA a line for each µF, healthy: about 96
  const PER = 3 * IH;                    // a healthy feeder's clamp for each µF a line, fault connected: about 287
  const CAP = [2, 0.05, 0.05, 0.05, 0.05, 0.05, 0.05, 0.05];
  const RF = 3000, ALARM = 100 * VL / 1000, PULSE = 10, TEST_V = 500, CABLE_OK = 200, F6 = 5;
  const effPump = (s) => s.pump && s.tool !== 'dead';
  const faultOn = (s) => (s.fault === 6 ? !s.op[F6] && effPump(s) : !s.op[0]);
  const nClosed = (s) => s.op.filter((o) => !o).length;
  // A partial fault (rf kΩ, screen 2) sits in parallel with the other closed feeders' insulation.
  const monitorK = (s) => (faultOn(s) ? (s.rf ? 1 / (1 / s.rf + (nClosed(s) - 1) / RF) : 0) : nClosed(s) ? RF / nClosed(s) : Infinity);
  function clampMA(s, i, mode) {
    if (s.op[i]) return 0;
    const on = faultOn(s), F = s.fault - 1;
    if (mode === 'inject') return on && i === F ? PULSE : 0;
    if (!on) return 0;
    if (i !== F) return PER * CAP[i];
    let sum = 0;
    for (let j = 0; j < 8; j++) if (j !== F && !s.op[j]) sum += PER * CAP[j];
    return sum;
  }
  // The sub-board's clamps: 0 its incoming supply, then Fan, Pump, Heater, Lighting. The fault's current
  // comes home through the incoming supply and the Pump circuit only.
  const subMA = (s, k, mode) => (s.fault === 6 && (k === 0 || k === 2) ? clampMA(s, F6, mode) : 0);
  const fmtMA = (v) => {
    if (v === 0) return '0 mA';
    const r = v < 20 ? Math.round(v * 10) / 10 : Math.round(v);
    return K.fmt(r, { decimals: r % 1 ? 1 : 0 }) + ' mA';
  };
  const fmtK = (v) => (v === Infinity ? 'Off scale' : v > 0 && v < 100 ? K.fmt(Math.round(v * 10) / 10, { decimals: 1 }) + ' kΩ' : K.fmt(Math.round(v), { decimals: 0 }) + ' kΩ');
  const testerText = (x) => (x === 'cable' ? 'Over ' + CABLE_OK + ' MΩ' : K.fmt(0, { decimals: 2 }) + ' MΩ');
  const dialF = (v) => (v === Infinity ? 1 : v / (v + 30));

  // A state: tool, op (breakers open), pump, fault (6 or 1), ring (a rung tile), sub (F6's sub-board open), across.
  function P(o) {
    o = o || {};
    const list = o.open || [];
    const s = { tool: o.tool || 'open', op: [], pump: o.pump !== false, fault: o.fault || 6, rf: o.rf || 0, ring: o.ring == null ? -1 : o.ring, sub: !!o.sub, across: o.across || 'whole' };
    for (let i = 0; i < 8; i++) s.op.push(list.indexOf(i + 1) >= 0);
    return s;
  }
  const clone = (s) => Object.assign({}, s, { op: s.op.slice() });
  function apply(s, ch) {
    const n = clone(s);
    Object.keys(ch).forEach((k) => {
      if (k === 'open') for (let i = 0; i < 8; i++) n.op[i] = ch.open.indexOf(i + 1) >= 0;
      else if (k === 'op') n.op = ch.op.slice();
      else n[k] = ch[k];
    });
    return n;
  }

  // ---------- the lesson: SHOW screens demonstrate, DO screens are puzzles ----------
  const strip = (s) => s.replace(/\[\^\d+\]/g, '');
  const ORDER = ['Isolate the circuit and lock it off', 'Prove it dead', 'Disconnect the electronics and any monitor on it', 'Test at 500 V DC, cores joined, to earth', 'Split at the terminal box and test each part'];
  const SHUF = [3, 1, 4, 0, 2];
  const sortRight = (o) => o.join() === '0,1,2,3,4';
  const STEPS = [
    { show: true, name: 'Open one at a time', from: P(), acts: [[0.4, { open: [3] }], [1.4, { open: [] }], [2.2, { open: [6] }]],
      text: `The monitor cannot say which feeder holds the fault. It reads all eight feeders in parallel. The solid fault has almost no resistance. The dial reads 0 kΩ, below its 44 kΩ line. So you open feeders one at a time, with permission and essential services covered.[^1] Open a healthy feeder and the fault stays connected, so the dial stays at 0 kΩ. Open F6 and the fault goes with it. The dial jumps to 429 kΩ: the other seven feeders' 3 MΩ in parallel.`,
      read: `The monitor reads 0 kΩ, below its 44 kΩ alarm line. With a healthy feeder open, it still reads 0 kΩ. With F6 open, it reads 429 kΩ.` },
    { name: 'A jump, not a nudge', before: P({ rf: 20 }), after: P({ rf: 20, open: [3] }),
      task: `Say the fault were 20 kΩ instead of solid. The monitor reads 19.1 kΩ. You open F3 and it reads 19.2 kΩ. What does that tell you?`,
      opts: ['F3 holds the fault, as the reading rose', 'F3 is healthy. Only its own 3 MΩ left the total', 'The fault is shared between F3 and F6'], want: 'F3 is healthy. Only its own 3 MΩ left the total',
      hints: { 'F3 holds the fault, as the reading rose': `Opening the faulty feeder would lift the dial to hundreds of kilohms. A rise of 0.1 kΩ is too small.`,
        'The fault is shared between F3 and F6': `One fault on one feeder sets the reading. F3 took off only its own healthy insulation.` },
      why: `The 20 kΩ fault is by far the lowest path, so it sets the total. Taking off one healthy 3 MΩ path barely changes it. Look for a jump, not a nudge.` },
    { show: true, name: 'The fault that vanished', from: P(), acts: [[0.5, { open: [3], pump: false }], [2.2, { open: [] }]], stillPic: P({ open: [3], pump: false }),
      text: `F6 feeds a fresh-water pump on a pressure switch. The fault is in the pump's motor. Open F3 just as the pump stops. The dial jumps to 429 kΩ, and F3 looks guilty. But the pump's contactor has lifted the faulty motor off the system. Close F3 and the dial reads 375 kΩ, with all eight feeders healthy. When the pump restarts, the alarm returns. The fault vanished with its load.[^2]`,
      read: `F3 opens just as F6's pump stops. The dial reads 429 kΩ, though F3 is healthy. The faulty motor is off the system while its contactor is open.` },
    { name: 'Recovered, then healthy', before: P(), after: P({ pump: false }),
      task: `You open F5 and the dial recovers to 429 kΩ. You close F5 again, and the dial reads 375 kΩ. What should you suspect?`,
      opts: ['F5 holds the fault', 'A faulty load switched off as you opened F5', 'The fault has cleared for good'], want: 'A faulty load switched off as you opened F5',
      hints: { 'F5 holds the fault': `If F5 held the fault, closing it would bring the alarm back.`,
        'The fault has cleared for good': `The dial recovered at the very moment you opened F5. Look for something that stopped then.` },
      why: `If F5 held the fault, closing it should have brought the alarm back. It did not. So a load left the system at that moment. A pump stopping on its pressure switch is one example. Note what was running, and wait for the alarm to return.` },
    { show: true, name: 'A clamp on every feeder', from: P(), acts: [[0.4, { tool: 'clamp' }]],
      text: `Now hunt without switching anything off. A leakage clamp goes round all three cores of a feeder, like an RCD's toroid. Load current goes out and back through it and cancels. The clamp reads only current that returns through the hull. With the hull moved to L1, each clamp's charging currents no longer cancel. F1, a long run with 2 µF a line, reads 575 mA. The short feeders read 14.4 mA each. F6 carries all their current home through its fault, and reads 661 mA.`,
      read: `At 60 Hz, every feeder's clamp reads current. The long feeder F1 reads 575 mA, and each short feeder reads 14.4 mA. The faulty feeder F6 reads 661 mA.` },
    { name: 'The biggest reading', before: P(), after: P({ tool: 'clamp', ring: 0 }),
      task: `You clamp F1 first, at 60 Hz. It reads 575 mA, far more than the short feeders you have tried. Is F1 the faulty one?`,
      opts: ['Yes, the biggest reading so far is the fault', 'Not proven. A long healthy feeder passes that much', 'No, a faulty feeder\'s clamp reads 0 mA'], want: 'Not proven. A long healthy feeder passes that much',
      hints: { 'Yes, the biggest reading so far is the fault': `Once the hull shifts, every feeder's capacitance passes current. A long feeder has a lot of capacitance.`,
        'No, a faulty feeder\'s clamp reads 0 mA': `The faulty feeder carries the other feeders' charging current home. So its clamp reads plenty.` },
      why: `At 60 Hz a clamp reads charging current as well as fault current. F6 reads only 86 mA more than F1. A real clamp also picks up a little from load current and unequal cables. A partial fault shrinks every reading too. So a short faulty feeder is hard to tell from a long healthy one by size alone.[^3]` },
    { show: true, name: 'The slow pulse', from: P({ tool: 'clamp' }), acts: [[0.4, { tool: 'inject' }]],
      text: `A fault locator removes that doubt. It joins the live cores to the hull for a moment, through a current limit. Say it sends 10 mA. The pulse flows out on the cores, through the fault, and back through the hull to the locator.[^4] Its clamp reads only the pulse, not the 60 Hz charging current. The pulse is slow, so the cables' capacitance passes next to none of it. F6's clamp shows 10 mA. The other seven show 0 mA.`,
      read: `With a 10 mA pulse injected, only F6's clamp shows it. The locator's clamp reads the pulse alone, so the other seven show 0 mA.` },
    { name: 'Down to the circuit', before: P({ tool: 'inject', ring: 5 }), after: P({ tool: 'inject', ring: 5, sub: true }),
      task: `The pulse shows on F6. F6 feeds a sub-board with four circuits: Fan, Pump, Heater and Lighting. What will the clamps on those four circuits show?`,
      opts: ['10 mA on one circuit, nothing on the rest', '2.5 mA on each of the four', '10 mA on all four'], want: '10 mA on one circuit, nothing on the rest',
      hints: { '2.5 mA on each of the four': `The pulse has one way home, through the fault. It does not split itself among the healthy circuits.`,
        '10 mA on all four': `A healthy circuit gives the slow pulse next to no path to the hull.` },
      why: `Nearly all the pulse follows the fault's path. At the sub-board, the incoming clamp and the Pump circuit's clamp show 10 mA. The other three show nothing. So the fault lies on the pump circuit.` },
    { show: true, name: 'Test it dead', from: P({ tool: 'inject', ring: 5, sub: true }), acts: [[0.4, { tool: 'dead', across: 'whole' }], [1.8, { across: 'cable' }], [3.0, { across: 'motor' }]],
      text: `The pulse has led you to the pump circuit. Now test it dead. Isolate it, lock it off and prove it dead. Disconnect anything the test could damage or skew.[^5] Here that is the pump's electronic starter. Test at 500 V DC, all three cores joined, to earth. It reads 0.00 MΩ. Split at the motor's terminal box. The cable reads over 200 MΩ. The motor reads 0.00 MΩ, so the fault is in its winding.`,
      read: `The isolated pump circuit reads 0.00 MΩ to earth at 500 V DC. Split at the terminal box, the cable reads over 200 MΩ. The motor reads 0.00 MΩ.` },
    { name: 'What the monitor cannot see', before: P({ pump: false }), after: P({ pump: false }),
      task: `The monitor reads 375 kΩ, well above its 44 kΩ alarm line. F6's pump is stopped, its contactor open. Does the monitor prove the pump's insulation healthy?`,
      opts: ['Yes, the monitor reads the whole system', 'No. It cannot see a load that is switched off', 'Yes, if the earth lamps are equal too'], want: 'No. It cannot see a load that is switched off',
      hints: { 'Yes, the monitor reads the whole system': `A load whose contactor is open is off the system. The monitor's voltage never reaches it.`,
        'Yes, if the earth lamps are equal too': `Earth lamps watch only the live system too.` },
      why: `A monitor reads only what is connected. A switched-off load is out of its reach.[^6] To prove the pump, test it dead, or run it and watch the monitor.` },
    { kind: 'order', name: 'The dead test in order', before: P({ tool: 'inject', ring: 5, sub: true }), after: P({ tool: 'dead', across: 'whole' }),
      task: `Put the steps for the pump circuit's dead test in order.`,
      want: ORDER.map((t, k) => (k + 1) + '. ' + t + '.').join(' '),
      hint: `Nothing is touched until the circuit is proven dead. Electronics come off before any test voltage.`,
      why: `Isolation and proof come first, for your safety. The electronics come off next, so the test voltage cannot damage them or skew the reading. Then test the whole circuit, and split it to find which part holds the fault.` },
    { name: 'A fault on the long feeder', before: P({ tool: 'clamp' }), after: P({ tool: 'clamp', fault: 1, ring: 0 }),
      task: `Suppose the solid fault were on F1, the long feeder, instead of F6. What would F1's clamp read at 60 Hz?`,
      opts: ['575 mA, as before', '101 mA, the other seven feeders\' charging current', '0 mA, as its own capacitance is shorted'], want: '101 mA, the other seven feeders\' charging current',
      hints: { '575 mA, as before': `A faulty feeder's clamp reads the other feeders' current, coming home through its fault.`,
        '0 mA, as its own capacitance is shorted': `Its own capacitance no longer counts. The other seven feeders' current still comes home through it.` },
      why: `The faulty feeder carries every other feeder's charging current home. Seven short feeders of 0.05 µF a line make 0.35 µF. That passes 0.35 × 287 = 101 mA. So faulty F1 reads less than healthy F1 did. A feeder's reading at 60 Hz depends on the rest of the board, not on whether it is faulty.` },
  ];
  const runAll = (d) => d.acts.reduce((s, a) => apply(s, a[1]), d.from);
  STEPS.forEach((d, i) => {
    if (d.show) { const s = d.stillPic || runAll(d); d.still = () => setPic(s); return; }
    d.read = d.task;
    d.still = d.kind === 'order' ? () => { S[i].order = [0, 1, 2, 3, 4]; S[i].res = 'right'; sel = -1; setPic(d.after); } : () => setPic(d.after);
  });
  const FINISH = 'Find the fault live, by opening feeders or by following the slow pulse. Then isolate that circuit and test it dead.';
  const PICK = 'Choose an answer first.';
  const SRC1 = 'https://marineinsight360.com/blogs/ship-earthing-systems-protect-ships';
  const SRC2 = 'https://www.benderinc.com/fileadmin/content/BenderGroup/Documents/Article/en/Harbours_and_Vessels_6.12.20_compressed.pdf';
  const SRC3 = 'https://download.se.com/files?amp&p_Doc_Ref=ECT178';
  const SRC4 = 'https://www.bender.de/en/know-how/technology/it-system/insulation-fault-location-the-concept';
  const SRC7 = 'http://www.iqytechnicalcollege.com/gl_i-1-3_e.pdf';
  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const testing = () => document.documentElement.classList.contains('k-testing');

  // ---------- what the picture shows, and how it moves there ----------
  // Every part eases toward its target; a word or number that changes fades out, then the new one fades in.

    if (s.tool === 'clamp' || s.tool === 'inject') {
      const mode = s.tool === 'inject' ? 'inject' : 'clamp';
      a += (mode === 'inject' ? 'With the pulse injected, the clamps read ' : 'At 60 Hz the clamps read ') + s.op.map((o, i) => 'F' + (i + 1) + ' ' + fmtMA(clampMA(s, i, mode))).join(', ') + '.';
      if (s.sub && s.fault === 6) a += ' On F6\'s sub-board: incoming ' + fmtMA(subMA(s, 0, mode)) + ', ' + SNAME.map((nm, k) => nm + ' ' + fmtMA(subMA(s, k + 1, mode))).join(', ') + '.';
    }
    if (s.tool === 'dead') a += 'The pump circuit is isolated and locked off, its starter disconnected, with the tester across the ' + (s.across === 'whole' ? 'whole circuit.' : s.across === 'cable' ? 'cable only.' : 'motor only.');
    return a;
  }

  // ---------- state ----------
  function blank() { return { pick: null, res: null, why: false, order: SHUF.slice() }; }
  let S = STEPS.map(() => blank());
  let cur = P(), D = mkD(), TL = { acts: [], i: 0 }, T = 0, lastChange = 0, REC = null;
  let finished = false, lastStep = -1, lastDone = false, sel = -1, drag = null;
  setT(D, cur, false); snapD(D);

  const stepper = K.stepper({ id: 'step', label: 'Screen', steps: STEPS.map((d) => d.name), value: 0, compact: true, into: '#prog' });
  const at = () => stepper.get();
  const live = () => !finished && !!STEPS[at()].show;
  const toolCtl = K.choice({ id: 'tool', label: 'Tool', options: [{ value: 'open', label: 'Open feeders' }, { value: 'clamp', label: 'Clamp at 60 Hz' }, { value: 'inject', label: 'Inject and clamp' }, { value: 'dead', label: 'Test dead' }], value: 'open', into: '#toolctl' });
  const pumpCtl = K.toggle({ id: 'pump', label: 'Pump running', value: true, into: '#pumpctl' });
  const acrossCtl = K.choice({ id: 'across', label: 'Test across', options: [{ value: 'whole', label: 'Whole circuit' }, { value: 'cable', label: 'Cable only' }, { value: 'motor', label: 'Motor only' }], value: 'whole', into: '#acrossctl' });
  const mon = K.readout({ id: 'mon', label: 'Monitor', into: '#outs' });
  const tst = K.readout({ id: 'tst', label: 'Tester', into: '#outs' });
  // A demonstration may play while its picture is still below the words on a phone: Replay runs it again.
  K.button({ label: 'Replay', secondary: true, into: '#replay', press: () => { if (live()) startDemo(STEPS[at()]); } });
  function syncCtls() {
    toolCtl.set(cur.tool, true); pumpCtl.set(cur.pump, true); acrossCtl.set(cur.across, true);
    el('pumpctl').classList.toggle('off', cur.tool === 'dead');
    el('acrossctl').classList.toggle('off', cur.tool !== 'dead');
  }

  function paint() {
    REC = scene();
    mon.set(REC.mon);
    tst.set(REC.tester);
    svg.setAttribute('aria-label', ariaOf(cur));
    svg.classList.toggle('tappable', live() && cur.tool !== 'dead');
  }

  // One animation plays the timeline of a demonstration and eases every part; with reduced motion (and
  // while the self-test looks) everything lands at once.
  const anim = K.anim({ button: false, label: 'The hunt', step: (dt) => {
    if (finished) return false;
    dt = Math.min(dt, 0.1);
    T += dt;
    while (TL.i < TL.acts.length && T >= TL.acts[TL.i][0]) applyAct(TL.acts[TL.i++][1]);
    const moving = T < 0 || stepD(D, dt);
    if (D.v.spin > 0.005) ang += dt * 5 * D.v.spin;
    if (D.v.pulse > 0.005 || D.v.chg > 0.005) dash -= dt * 26;
    paint();
    const flowing = (D.v.spin > 0.005 || D.v.pulse > 0.005 || D.v.chg > 0.005) && T - lastChange < 2;
    return moving || TL.i < TL.acts.length || flowing;
  } });
  function applyAct(ch) {
    const was = cur.tool;
    cur = apply(cur, ch);
    setT(D, cur, cur.tool !== was);
    lastChange = T;
    syncCtls();
  }
  function finishNow() {
    while (TL.i < TL.acts.length) applyAct(TL.acts[TL.i++][1]);
    snapD(D); anim.pause(); paint();
  }
  function go(t0) {
    T = t0; lastChange = Math.max(0, t0);
    if (REDUCE || testing()) { finishNow(); return; }
    anim.play();
  }
  // Move the picture on from wherever it is now.
  function moveTo(s) {
    const was = cur.tool;
    cur = clone(s); TL = { acts: [], i: 0 };
    setT(D, cur, cur.tool !== was);
    syncCtls();
    go(0);
  }
  const retarget = (ch) => moveTo(apply(cur, ch));
  function setState(s) { cur = clone(s); TL = { acts: [], i: 0 }; setT(D, cur, false); snapD(D); anim.pause(); syncCtls(); paint(); }
  function setPic(s) { setState(s); K.refresh(); }
  function startDemo(d) {
    cur = clone(d.from); TL = { acts: d.acts, i: 0 };
    setT(D, cur, false); snapD(D); syncCtls();
    go(-0.4);
  }

  // Tapping a tile: in Open feeders it opens or closes the breaker; with a clamp it rings the tile, and F6 opens its sub-board.
  function tap(i) {
    if (!live()) return;
    if (cur.tool === 'open') { const op = cur.op.slice(); op[i] = !op[i]; retarget({ op }); }
    else if (cur.tool === 'clamp' || cur.tool === 'inject') { const ch = { ring: i }; if (i === F6 && cur.fault === 6) ch.sub = true; retarget(ch); }
  }
  for (let i = 0; i < 8; i++) {
    const r = K.svg('rect', { class: 'hit', x: TX[i % 4], y: TY[i >> 2], width: TW, height: TH, rx: 6, tabindex: '0', role: 'button', 'aria-label': 'F' + (i + 1) });
    r.addEventListener('click', () => tap(i));
    r.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tap(i); } });
    hits.appendChild(r);
  }

  // ---------- the sorter ----------
  const sorter = el('sorter');
  const sortLive = () => !finished && STEPS[at()].kind === 'order' && S[at()].res !== 'right';
  const midY = (x) => { const b = x.getBoundingClientRect(); return b.top + b.height / 2; };
  function renumber() { Array.from(sorter.children).forEach((li, p) => { li.querySelector('.n').textContent = String(p + 1); }); }
  const items = ORDER.map((t, k) => {
    const li = K.el('li', { tabindex: '0', dataset: { k: String(k) } }, K.el('span', { class: 'n' }), K.el('span', { class: 'tx' }, t), K.el('span', { class: 'grip', 'aria-hidden': 'true' }, '↕'));
    li.addEventListener('pointerdown', (e) => {
      if (!sortLive() || (e.pointerType === 'mouse' && e.button !== 0)) return;
      drag = { k, li, y0: e.clientY, grab: e.clientY - li.getBoundingClientRect().top, moved: false };
      try { li.setPointerCapture(e.pointerId); } catch (err) { /* capture is a nicety */ }
    });
    li.addEventListener('pointermove', (e) => {
      if (!drag || drag.li !== li) return;
      if (!drag.moved) { if (Math.abs(e.clientY - drag.y0) < 6) return; drag.moved = true; li.classList.add('drag'); sel = -1; }
      e.preventDefault();
      for (let n = 0; n < 5; n++) {
        const pv = li.previousElementSibling, nx = li.nextElementSibling;
        if (pv && e.clientY < midY(pv)) sorter.insertBefore(pv, li.nextSibling);
        else if (nx && e.clientY > midY(nx)) sorter.insertBefore(nx, li);
        else break;
      }
      li.style.transform = '';
      const top = li.getBoundingClientRect().top;
      li.style.transform = 'translateY(' + (e.clientY - drag.grab - top).toFixed(1) + 'px)';
      renumber();
    });
    const end = (e) => {
      if (!drag || drag.li !== li) return;
      const d0 = drag;
      drag = null;
      li.style.transform = '';
      li.classList.remove('drag');
      const st = S[at()];
      if (d0.moved) st.order = Array.from(sorter.children).map((x) => +x.dataset.k);
      else if (e.type === 'pointerup') {
        if (sel < 0) sel = k;
        else if (sel === k) sel = -1;
        else { const a = st.order.indexOf(sel), b = st.order.indexOf(k); st.order[a] = k; st.order[b] = sel; sel = -1; }
      }
      st.res = null;
      K.refresh();
    };
    li.addEventListener('pointerup', end);
    li.addEventListener('pointercancel', end);
    li.addEventListener('keydown', (e) => {
      const dir = e.key === 'ArrowUp' ? -1 : e.key === 'ArrowDown' ? 1 : 0;
      if (!dir || !sortLive()) return;
      e.preventDefault();
      const st = S[at()], a = st.order.indexOf(k), b = a + dir;
      if (b < 0 || b > 4) return;
      st.order[a] = st.order[b]; st.order[b] = k; st.res = null;
      K.refresh();
      li.focus();
    });
    return li;
  });
  function drawSorter(st) {
    const locked = st.res === 'right';
    sorter.classList.toggle('locked', locked);
    if (drag) return;
    if (Array.from(sorter.children).map((x) => x.dataset.k).join() !== st.order.join()) st.order.forEach((k) => sorter.appendChild(items[k]));
    st.order.forEach((k, p) => {
      const li = items[k];
      li.querySelector('.n').textContent = String(p + 1);
      li.classList.toggle('sel', sel === k && !locked);
      li.setAttribute('aria-label', 'Step ' + (p + 1) + ': ' + ORDER[k]);
    });
  }

  // ---------- answers and navigation ----------
  const pickBtns = [0, 1, 2].map((k) => K.button({ label: 'Answer ' + (k + 1), secondary: true, into: '#picks', press: () => {
    const i = at(), d = STEPS[i], st = S[i];
    if (finished || d.show || !d.opts || k >= d.opts.length || st.res === 'right') return;
    st.pick = d.opts[k]; st.res = null;
  } }));
  const checkBtn = K.button({ label: 'Check', into: '#acts', press: () => {
    const i = at(), d = STEPS[i], st = S[i];
    if (finished || d.show || st.res === 'right') return;
    if (d.kind === 'order') st.res = sortRight(st.order) ? 'right' : 'wrong';
    else if (st.pick == null) { st.res = 'empty'; return; }
    else st.res = st.pick === d.want ? 'right' : 'wrong';
    if (st.res !== 'right') return;
    sel = -1;
    moveTo(d.after);
  } });
  const whyBtn = K.button({ label: 'Why?', secondary: true, into: '#acts', press: () => {
    if (finished || STEPS[at()].show) return;
    const st = S[at()]; st.why = !st.why;
  } });
  const backBtn = K.button({ label: 'Back', secondary: true, into: '#nav', press: () => {
    if (finished) { finished = false; return; }
    stepper.set(Math.max(0, at() - 1), true);
  } });
  const nextBtn = K.button({ label: 'Continue', into: '#nav', press: () => {
    const i = at();
    if (finished || (!STEPS[i].show && S[i].res !== 'right')) return;
    if (i < STEPS.length - 1) { stepper.set(i + 1, true); return; }
    finished = true; anim.pause();
    if (typeof K.complete === 'function') K.complete();
  } });
  K.button({ label: 'Start again', secondary: true, into: '#again', press: () => {
    S = STEPS.map(() => blank()); finished = false; lastStep = -1; sel = -1; stepper.set(0, true);
  } });

  function enter(id) {
    if (REDUCE) return;
    const box = el(id);
    box.classList.remove('enter');
    void box.offsetWidth;
    box.classList.add('enter');
  }

  el('finish').textContent = FINISH;
  K.update((p) => {
    if (!anim.playing()) finishNow();   // motion that was stopped (the page hidden, a test) shows finished
    const i = Math.round(p.step), d = STEPS[i], st = S[i];
    if (i !== lastStep) {
      lastStep = i; sel = -1; enter('stepbox');
      if (d.show) startDemo(d);
      else setState(st.res === 'right' ? d.after : d.before);
    } else if (p.tool !== cur.tool || p.pump !== cur.pump || p.across !== cur.across) {
      if (live()) retarget({ tool: p.tool, pump: p.pump, across: p.across });
      else syncCtls();   // off the screens that show them, the controls keep the picture's setting
    }
    if (finished !== lastDone) { lastDone = finished; enter(finished ? 'done' : 'stepbox'); }
    const right = st.res === 'right', order = d.kind === 'order';
    el('stepbox').hidden = finished;
    el('done').hidden = !finished;
    el('count').textContent = 'Step ' + (i + 1) + ' of ' + STEPS.length;
    const task = el('task');
    task.className = 'task' + (d.show ? ' show' : '');
    task.textContent = strip(d.show ? d.text : d.task);
    el('ctls').hidden = !d.show;
    const opts = d.show || order ? [] : d.opts;
    el('picks').hidden = !opts.length;
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      b.setLabel(opts[k]);
      b.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });
    el('sorter').hidden = !order;
    el('sorthint').hidden = !order || right;
    if (order) drawSorter(st);
    el('acts').hidden = !!d.show;
    checkBtn.el.hidden = right;
    whyBtn.setLabel(st.why ? 'Hide why' : 'Why?');
    const fb = el('fb');
    fb.hidden = !!d.show || !st.res;
    fb.className = 'fb' + (right ? ' right' : '');
    fb.textContent = d.show ? '' : right ? 'That\'s it.' : st.res === 'wrong' ? (order ? d.hint : d.hints[st.pick] || 'Not quite.') : st.res === 'empty' ? PICK : '';
    const why = el('why');
    why.hidden = !!d.show || !st.why;
    why.textContent = d.show ? '' : strip(d.why);
    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !right);
    nextBtn.setLabel(i === STEPS.length - 1 ? 'Finish' : 'Continue');
    el('nav').hidden = backBtn.el.hidden && nextBtn.el.hidden;
    paint();
  });

  // ---------- known answers, worked out by hand ----------
  function drawn(s) {
    const keep = [cur, D, TL, T];
    cur = clone(s); D = mkD(); setT(D, cur, false); snapD(D); TL = { acts: [], i: 0 };
    try { paint(); return REC; } finally { cur = keep[0]; D = keep[1]; TL = keep[2]; T = keep[3]; paint(); }
  }
  // A demonstration run on its own clock: the time from its screen opening until every part has settled.
  function demoTime(d) {
    const X = mkD();
    let s = clone(d.from), t = -0.4, k = 0, last = 0;
    setT(X, s, false); snapD(X);
    for (let n = 0; n < 600; n++) {
      t += 1 / 60;
      while (k < d.acts.length && t >= d.acts[k][0]) { const was = s.tool; s = apply(s, d.acts[k][1]); setT(X, s, s.tool !== was); k++; }
      const moving = t < 0 || stepD(X, 1 / 60);
      if (moving || k < d.acts.length) last = t; else break;
    }
    return last + 0.4;
  }

  K.check('Twelve screens: five that show and seven puzzles, alternating to the ninth and ending on three mixed puzzles', () =>
    STEPS.length === 12 && STEPS.filter((d) => d.show).length === 5 && STEPS.slice(0, 9).every((d, i) => !!d.show === (i % 2 === 0)) && STEPS.slice(9).every((d) => !d.show));
  K.check('Isolating circuits one at a time until the reading recovers: with any healthy feeder open the monitor still reads 0 kΩ; with F6 open it recovers to 3,000 ÷ 7 = 429 kΩ, above the 100 × 440 = 44 kΩ alarm line', () => {
    const all = drawn(P()), f6 = drawn(P({ open: [6] }));
    return ALARM === 44 && all.mon === '0 kΩ' && all.lamp && [1, 2, 3, 4, 5, 7, 8].every((n) => drawn(P({ open: [n] })).mon === '0 kΩ') && f6.mon === '429 kΩ' && !f6.lamp;
  }, { source: SRC1 });
  K.check('The fault can disappear because the faulty load is switched off: with the pump stopped the monitor reads 3,000 ÷ 8 = 375 kΩ, and 429 kΩ with healthy F3 open, its lamp out', () => {
    const a = drawn(P({ pump: false })), b = drawn(P({ pump: false, open: [3] })), c = drawn(P());
    return a.mon === '375 kΩ' && !a.lamp && b.mon === '429 kΩ' && !b.lamp && c.mon === '0 kΩ' && c.lamp;
  }, { source: SRC2 });
  K.check('At 60 Hz: 440 ÷ 1.732 = 254 V and ω = 377 give 96 mA a line for each µF, 287 mA once the hull shifts; F1 reads 575 mA, each short feeder 14.4 mA, F6 661 mA', () => {
    const r = drawn(P({ tool: 'clamp' }));
    return Math.round(VPH) === 254 && Math.round(W) === 377 && Math.round(IH) === 96 && Math.round(PER) === 287 &&
      r.tiles[0] === '575 mA' && r.tiles[F6] === '661 mA' && [1, 2, 3, 4, 6, 7].every((i) => r.tiles[i] === '14.4 mA');
  });
  K.check('The earth current of a short faulty feeder is hard to tell from that of a long capacitive feeder: faulty F6 reads only 86 mA more than healthy F1', () => {
    const s = P({ tool: 'clamp' }), a = clampMA(s, F6, 'clamp'), b = clampMA(s, 0, 'clamp');
    const r = drawn(s), q = drawn(P({ tool: 'inject' }));
    return a > b && Math.round(a - b) === 86 && Math.round(a) === 661 && Math.round(b) === 575 && r.chg === 1 && r.key === 'Clamp, 60 Hz' && q.chg === 0 && q.key === 'Clamp, pulse only';
  }, { source: SRC3 });
  K.check('The test pulse flows via the live conductors, the fault and earth back to the device: F6, the sub-board incoming and Pump read 10 mA, every other clamp 0 mA', () => {
    const r = drawn(P({ tool: 'inject', sub: true, ring: 5 }));
    return r.tiles.every((t, i) => t === (i === F6 ? '10 mA' : '0 mA')) && r.subShown && r.subs.join() === ['10 mA', '0 mA', '10 mA', '0 mA', '0 mA'].join() && r.pulse === 1;
  }, { source: SRC4 });
  K.check('With the fault off the system (the pump stopped, or F6 open), every clamp reads 0 mA at 60 Hz and with the pulse, and no pulse path is drawn', () =>
    [P({ tool: 'clamp', pump: false }), P({ tool: 'inject', pump: false, sub: true }), P({ tool: 'clamp', open: [6] }), P({ tool: 'inject', open: [6] })]
      .every((s) => { const r = drawn(s); return r.tiles.every((t) => t === '0 mA') && r.subs.every((t) => t === '0 mA') && r.pulse === 0; }));
  K.check('With the solid fault on F1 instead, F1 reads the other seven feeders\' 7 × 0.05 = 0.35 µF a line × 287 = 101 mA, and each short feeder 14.4 mA', () => {
    const r = drawn(STEPS[11].after);
    return K.near(7 * 0.05, 0.35, 1e-12) && r.tiles[0] === '101 mA' && r.tiles.slice(1).every((t) => t === '14.4 mA') && r.spark1 === 1 && r.spark6 === 0 && r.mon === '0 kΩ';
  });
  K.check('Insulation resistance is measured at a DC voltage of at least 500 V: at 500 V the whole circuit and the motor read 0.00 MΩ, the cable over 200 MΩ, with the pump circuit off the system', () => {
    const t = (x) => drawn(P({ tool: 'dead', across: x }));
    return TEST_V >= 500 && t('whole').tester === '0.00 MΩ' && t('motor').tester === '0.00 MΩ' && t('cable').tester === 'Over 200 MΩ' && t('whole').dead && t('whole').mon === '375 kΩ';
  }, { source: SRC7 });
  K.check('Partial faults, from paths in parallel: 20 kΩ beside seven 3 MΩ feeders reads 19.1 kΩ, 19.2 kΩ with F3 open; 15 kΩ beside four 1 MΩ feeders (250 kΩ) reads 14.2 kΩ, beside three (333 kΩ) 14.4 kΩ', () => {
    const par = (list) => 1 / list.reduce((a, x) => a + 1 / x, 0), r1 = (x) => Math.round(x * 10) / 10;
    return r1(par([20].concat(Array(7).fill(3000)))) === 19.1 && r1(par([20].concat(Array(6).fill(3000)))) === 19.2 &&
      Math.round(1000 / 4) === 250 && Math.round(1000 / 3) === 333 && r1(par([15, 250])) === 14.2 && r1(par([15, 1000 / 3])) === 14.4;
  });
  K.check('Before an answer, no puzzle\'s picture shows its result', () => {
    const b = (i) => drawn(STEPS[i].before), a = (i) => drawn(STEPS[i].after);
    return b(1).mon === '19.1 kΩ' && b(1).lamp && a(1).mon === '19.2 kΩ' && b(9).mon === '375 kΩ' && b(3).mon === '0 kΩ' && a(3).mon === '375 kΩ' &&
      b(5).tiles.every((t) => !/mA/.test(t)) && a(5).tiles[0] === '575 mA' &&
      !b(7).subShown && a(7).subShown && !b(10).dead && a(10).dead &&
      b(11).tiles[0] === '575 mA' && a(11).tiles[0] === '101 mA';
  });
  K.check('The dead-test sorter takes only the right order: isolate, prove dead, disconnect the electronics, test, then split', () =>
    sortRight([0, 1, 2, 3, 4]) && !sortRight(SHUF) && !sortRight([1, 0, 2, 3, 4]) && !sortRight([0, 1, 3, 2, 4]) && new Set(SHUF).size === 5);
  K.check('Each demonstration settles within 5 s of its screen opening, and opening F6 lifts the needle past the alarm line within 1 s', () => {
    const okDemo = STEPS.every((d) => !d.show || demoTime(d) <= 5);
    const X = mkD();
    setT(X, P(), false); snapD(X); setT(X, P({ open: [6] }), false);
    let t = 0;
    while (t < 1 && X.v.needle <= dialF(ALARM)) { stepD(X, 1 / 60); t += 1 / 60; }
    return okDemo && X.v.needle > dialF(ALARM) && t < 1;
  });

  K.ready();
</script>
