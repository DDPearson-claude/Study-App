<p class="caption">Example values: 440 V at 60 Hz, 1 µF a line of cable, ten drives, a 1,000 Ω body.</p>

<script>
  // ---------- the rules ----------
  // The ladder. Each line sits 440 ÷ 1.732 = 254 V from earth, with a peak of 254 × 1.414 = 359 V ("1 times").
  // L1's voltage to the hull is the star point's held voltage plus L1's own swing of 359 V either side.
  // The first strike lands at L1's peak and leaves the star point held 1 times out, opposite L1's swing.
  // Each later strike lands at L1's next peak, P times out: the star point jumps P across and rings past
  // by a share of that jump (all of it with No losses, half with Some, none with Heavy). The arc goes out
  // at the top of the ring, so the new held voltage is (1 + share) × P minus the old one.
  const VLINE = 440, ROOT3 = 1.732, ROOT2 = 1.414, HZ = 60;
  const VPH = Math.round(VLINE / ROOT3);            // 254 V
  const PK = Math.round(VPH * ROOT2);               // 359 V, the normal peak
  const SOLID = Math.round(VLINE * ROOT2);          // 622 V, the line voltage's peak: a solid fault's healthy lines
  const OMEGA = 2 * Math.PI * HZ;                   // 377 rad/s
  const VIEWS = ['Arc ladder', 'Drive on IT', 'Touch'];
  const KEY = { 'Arc ladder': 'arc', 'Drive on IT': 'drv', 'Touch': 'tch' };
  const LOSSES = ['No losses', 'Some losses', 'Heavy losses'];
  const SHARE = { 'No losses': 1, 'Some losses': 0.5, 'Heavy losses': 0 };
  const MAXN = 3, END = 2.5, RD = 0.08;             // most strikes; the plot's length in cycles; the ring, drawn slowed over 0.08 of a cycle
  const TS = [0.25, 0.75, 1.25];                    // L1's peaks, where strikes 1, 2 and 3 land
  const e1 = (t) => Math.sin(2 * Math.PI * t);      // L1's own swing about the star point, in normal peaks
  // The star point's held voltage after each strike, in normal peaks (signed: it alternates sides).
  function rungs(r, count) {
    const h = [0];
    for (let k = 1; k <= count; k++) { const tg = k % 2 ? -1 : 1; h.push(tg + (k === 1 ? 0 : r) * (tg - h[k - 1])); }
    return h;
  }
  // The star point at time t (cycles): steady, then at each strike a quick swing (the ring) to its new held value.
  function starAt(t, n, h) {
    let k = 0;
    while (k < n && TS[k] <= t + 1e-12) k++;
    if (!k) return 0;
    const s = (t - TS[k - 1]) / RD;
    return s >= 1 ? h[k] : h[k - 1] + (h[k] - h[k - 1]) * (1 - Math.cos(Math.PI * Math.max(0, s))) / 2;
  }
  // What has happened by time tp: the star point's held voltage and L1's highest peak, in normal peaks.
  function arcNumbers(n, r, tp) {
    const h = rungs(r, MAXN);
    let held = 0, best = 0, at = null;
    for (let k = 1; k <= n; k++) if (TS[k - 1] + RD <= tp + 1e-9) held = Math.abs(h[k]);
    const see = (t) => {
      if (t > tp + 1e-9 || t > END + 1e-9) return;
      const u = starAt(t, n, h) + e1(t);
      if (Math.abs(u) > best + 1e-6) { best = Math.abs(u); at = [t, u]; }
    };
    see(0.25);
    for (let k = 1; k <= n; k++) see(TS[k - 1]);
    if (n) see(TS[n - 1] + 0.5);
    return { held, best, at };
  }
  const canStrike = (s) => s.n < MAXN;
  // The drives. A solid first fault passes 3 × ω × C × 254 V, with C the capacitance a line.
  const CCABLE = 1, CFILT = 0.1, NDRV = 10, TAU = 0.3;
  const capOf = (f) => CCABLE + (f === 'In' ? NDRV * CFILT : 0);
  const faultmA = (c) => 3 * OMEGA * c * 1e-6 * VPH * 1000;
  // Touch. Healthy, the body current returns through all three lines' capacitance in parallel (3 µF).
  // With a solid fault on L1 the hull sits at L1: touching L1 gives nothing, touching L2 gives 440 V.
  const BODY = 1000, SAFE = 50;
  const XC3 = 1 / (OMEGA * 3 * CCABLE * 1e-6);      // 884 Ω
  function touchOf(fault, line) {
    if (fault === 'Solid') return line === 'L1' ? { v: 0, i: 0 } : { v: VLINE, i: VLINE / BODY * 1000 };
    const i = VPH / Math.hypot(BODY, XC3);
    return { v: i * BODY, i: i * 1000 };
  }
  const fV = (v) => K.fmt(Math.round(v), { decimals: 0 }) + ' V';
  const fmA = (v) => K.fmt(Math.round(v), { decimals: 0 }) + ' mA';
  const fmtTimes = (u) => { const v = Math.round(u * 10) / 10; return K.fmt(v, { decimals: Number.isInteger(v) ? 0 : 1 }); };

  // ---------- the lesson: SHOW screens demonstrate, DO screens are puzzles ----------
  const DEF = { view: VIEWS[0], arc: { loss: LOSSES[0], n: 0, tp: END, qh: false, qp: false }, drv: { filters: 'In', monitor: 'Made for drives', q: false }, tch: { fault: 'None', touch: 'L1', q: false } };
  const clone = (c) => JSON.parse(JSON.stringify(c));
  const make = (view, key) => (o) => { const c = clone(DEF); c.view = view; Object.assign(c[key], o || {}); return c; };
  const A = make(VIEWS[0], 'arc'), D = make(VIEWS[1], 'drv'), Tc = make(VIEWS[2], 'tch');
  const OUT1 = TS[0] + RD + 0.05, OUT2 = TS[1] + RD + 0.05;   // just after the arc has gone out
  const strip = (s) => s.replace(/\[\^\d+\]/g, '');
  const STEPS = [
    { show: true, name: 'The arc goes out at a peak', pic: A({ n: 1 }), demo: A({ n: 0 }),
      text: `An arcing fault strikes, goes out and strikes again. Say a chafed L1 cable arcs to the hull at L1's peak. While the arc burns, it acts as a solid fault, so the triangle shifts. The arc carries the system's charging current. That current leads the voltage by 90°, so it is zero when the voltage peaks. The arc goes out there.[^1] That leaves the star point a full peak, 359 V, from the hull. The charge has no quick way off, so it stays held there.`,
      read: `The arc struck once at L1's peak and went out at a current zero. The dashed line shows the star point held 359 V from the hull.` },
    { kind: 'pick', name: 'Once the arc is out', before: A({ n: 1, tp: OUT1, qh: true, qp: true }), after: A({ n: 1 }),
      task: `The arc has just gone out at a current zero. What does the star point's voltage to the hull do now?`,
      opts: ['It falls back to 0 V, as the fault has gone', 'It stays near 359 V, held by the charge on the capacitance', 'It swings at 60 Hz about the hull, as before the fault'],
      want: 'It stays near 359 V, held by the charge on the capacitance',
      hints: { 'It falls back to 0 V, as the fault has gone': `Something must carry the charge away. With the arc out, there is no quick path.`,
        'It swings at 60 Hz about the hull, as before the fault': `The capacitance now holds a charge. The arc that put it there has gone.` },
      why: `The arc went out as the capacitance reached its peak. The charge has no quick way off, only slow leakage. So the star point stays near 359 V. L1 swings about it.` },
    { show: true, name: 'The gap restrikes', pic: A({ n: 2 }), demo: A({ n: 1 }),
      text: `L1 still swings 359 V either side of the star point. Half a cycle on, L1 is 718 V from the hull, twice its normal peak. Then the gap restrikes. To pull L1 to the hull, the star point must jump 718 V. The jump is sudden, so the capacitance and the supply's inductance ring like a struck bell. With no losses, the star point rings past by as much again. The arc goes out at the top of the ring. Then L1 peaks at 4 times normal.[^2]`,
      read: `With no losses and two strikes, L1 peaks at 718 V, then 1,436 V. The star point is held at 359 V, then 1,077 V.` },
    { kind: 'pick', name: 'The next peak', before: A({ n: 2, tp: OUT2, qp: true }), after: A({ n: 3 }),
      task: `There are no losses. After the second strike, the star point is held at 1,077 V. That is three times the normal peak of 359 V. How high does L1 peak half a cycle later?`,
      opts: ['1,077 V, the voltage the star point holds', '1,436 V, the held voltage plus L1\'s own swing', '718 V, twice the normal peak'],
      want: '1,436 V, the held voltage plus L1\'s own swing',
      hints: { '1,077 V, the voltage the star point holds': `L1 swings 359 V either side of the star point. Add that swing.`,
        '718 V, twice the normal peak': `That was the first rung. The star point is now three times as far out.` },
      why: `L1's far peak is 1,077 + 359 = 1,436 V, 4 times normal. With no losses, the climb goes on until a weak part fails. A starter coil or a motor winding often goes first.[^3]` },
    { show: true, name: 'Losses damp the ring', pic: A({ n: 3, loss: LOSSES[1] }), demo: A({ n: 0, loss: LOSSES[1] }),
      text: `Losses damp the ring. The insulation loses a little energy each time it charges. The ring charges it thousands of times a second. With Some losses, the star point rings past by half the jump. The peaks go 2, 3, then 3.5 times normal, and level off. Ships' cables lose far more at these frequencies.[^4] So people still argue whether the climb happens at sea at all. Faults on 480 V systems have reached 1,200 V to earth.[^5]`,
      read: `With Some losses and three strikes, L1 peaks at 718 V, 1,077 V, then 1,257 V. The climb is levelling off.` },
    { kind: 'pick', name: 'Heavy losses', before: A({ n: 0, loss: LOSSES[2] }), after: A({ n: 3, loss: LOSSES[2] }),
      task: `Heavy losses damp the ring completely. The star point never rings past. The arc restrikes at every peak. How high does L1 get?`,
      opts: ['359 V, its normal peak, as the losses stop any rise', '718 V, twice its normal peak, and no higher', 'It still climbs, only more slowly'],
      want: '718 V, twice its normal peak, and no higher',
      hints: { '359 V, its normal peak, as the losses stop any rise': `The first strike still leaves the star point held 359 V out. L1 swings past it.`,
        'It still climbs, only more slowly': `With no overshoot, each restrike lands the star point 359 V out on the other side.` },
      why: `The first strike holds the star point 359 V out, so L1 reaches 718 V. Each restrike only flips it to 359 V on the other side. 718 V is a little above the 622 V peak that a solid fault puts on the healthy lines.` },
    { show: true, name: 'Filters on an insulated supply', pic: D({ filters: 'Out' }), demo: D({ filters: 'In' }),
      text: `A drive's EMC filter has capacitors from each line to the hull. On an insulated supply, they tie the system to earth.[^6] Ten drives at 0.1 µF a line add 1 µF a line to the cable's 1 µF. That doubles the capacitance. A solid first fault passes 575 mA, not 287 mA. The monitor takes twice as long to settle. So on an insulated supply you disconnect each filter and its varistor.[^7] In return, the drive may no longer meet its EMC standard.[^8]`,
      read: `With the filters in, a solid first fault passes 575 mA. The monitor settles twice as slowly. With them out, the fault passes 287 mA, and the EMC tag is red.` },
    { kind: 'pick', name: 'A reading that jumps', before: D({ filters: 'Out', monitor: 'Plain DC', q: true }), after: D({ filters: 'Out', monitor: 'Made for drives' }),
      task: `A new drive's filter is out, as it should be on an insulated supply. Yet the monitor's reading jumps about whenever the drive runs. What do you check first?`,
      opts: ['Put the filter back in to steady the reading', 'That the monitor is made for supplies that feed drives', 'Nothing, as a monitor cannot see through a drive'],
      want: 'That the monitor is made for supplies that feed drives',
      hints: { 'Put the filter back in to steady the reading': `The filter ties the supply to the hull. That is why it came out.`,
        'Nothing, as a monitor cannot see through a drive': `The monitor reads everything joined to the supply, including the drive's DC side.` },
      why: `A drive's rectifier joins its DC side to the supply. DC leaking from there distorts a plain monitor's reading.[^9] So use a monitor made for non-linear loads.[^10]` },
    { show: true, name: 'Touching a floating supply', pic: Tc({ fault: 'Solid', touch: 'L2' }), demo: Tc({ fault: 'None', touch: 'L2' }),
      text: `A floating supply is not safe to touch. A monitor in alarm means a line may already be joined to the hull. Then the system behaves like an earthed one.[^11] Here a solid fault holds the hull at L1. Stand on the hull and touch L2, and you hold the full 440 V. That drives about 440 mA through a 1,000 Ω body. Only a touch voltage below 50 V AC is counted safe, and less in wet places.[^12]`,
      read: `With a solid fault on L1, a person on the hull touching L2 holds 440 V. About 440 mA flows through a 1,000 Ω body.` },
    { kind: 'pick', name: 'A healthy reading', before: Tc({ fault: 'None', touch: 'L1', q: true }), after: Tc({ fault: 'None', touch: 'L1' }),
      task: `The monitor reads 2 MΩ, with no alarm. The cables have 1 µF a line. You stand on the hull and touch L1. What flows through a 1,000 Ω body?`,
      opts: ['Next to nothing, as no fault completes the circuit', 'About 190 mA, back through the cables\' capacitance', 'About 440 mA, with the full line voltage across you'],
      want: 'About 190 mA, back through the cables\' capacitance',
      hints: { 'Next to nothing, as no fault completes the circuit': `Every cable is a capacitor to the hull you stand on. That is a path for AC.`,
        'About 440 mA, with the full line voltage across you': `With no fault, L1 sits only 254 V from the hull. The capacitance also limits the current.` },
      why: `The monitor reads resistance with DC or a very slow AC, so the capacitance barely shows. But the capacitance passes AC and closes the loop through you. About 190 mA flows. A healthy reading is no reason to touch.` },
    { kind: 'pick', name: 'Two sides of the argument', before: A({ n: 0 }), after: [A({ n: 3 }), A({ n: 3, loss: LOSSES[2] })],
      task: `One side says an arcing fault can pump an insulated supply's voltage up. The other says this is not a problem on ships. What does each case rest on?`,
      opts: ['The first on voltages measured on 480 V systems, the second on ships\' heavier losses', 'The first on theory alone, the second on measurements at sea', 'Both on the same measurements, read differently'],
      want: 'The first on voltages measured on 480 V systems, the second on ships\' heavier losses',
      hints: { 'The first on theory alone, the second on measurements at sea': `The 1,200 V readings were measured. The marine case rests on how hard ships damp the ring.`,
        'Both on the same measurements, read differently': `One side measured voltages on 480 V systems. The other worked out how hard marine losses damp the ring.` },
      why: `Engineers measured 1,200 V or more on 480 V systems.[^5] The marine case is that ships' heavy losses damp the ring.[^13] On the Losses picker, light losses let the ladder climb. Heavy losses stop it. People still argue where a real ship sits.` },
    { kind: 'pick', name: 'What the filter gave', before: D({ filters: 'In' }), after: D({ filters: 'Out' }),
      task: `You disconnect a drive's EMC filter so it suits an insulated supply. What have you given up?`,
      opts: ['Nothing, as the filter matters only on earthed supplies', 'Its full EMC performance, so more switching noise can reach nearby equipment', 'The drive\'s protection against earth faults'],
      want: 'Its full EMC performance, so more switching noise can reach nearby equipment',
      hints: { 'Nothing, as the filter matters only on earthed supplies': `The filter keeps the drive's high-frequency noise in, on any supply.`,
        'The drive\'s protection against earth faults': `The filter is there for interference, not for earth-fault protection.` },
      why: `Without the filter, the drive may no longer meet its EMC standard.[^8] In return, the supply stays floating, with less capacitance to the hull.` },
  ];
  const finalOf = (d) => { const a = [].concat(d.after); return a[a.length - 1]; };
  STEPS.forEach((d) => { if (d.show) d.still = () => setPic(d.pic); else d.read = d.task; });
  const FINISH = 'Each restrike can leave the star point further out, unless losses damp the ring. Drive filters and a floating supply bring dangers of their own.';
  const PICK = 'Choose an answer first.';
  const EATON_T = 'https://www.eaton.com/content/dam/eaton/markets/healthcare/knowledge-center/white-paper/transient-overvoltages-on-ungrounded-systems-from-intermittent-ground-faults.pdf';
  const IMAREST = 'https://library.imarest.org/record/2202/files/2229.pdf';
  const ABB380 = 'https://library.e.abb.com/public/2a86caefc9a646d6ba6be02a51401d7c/EN_ACS380_HW_H.pdf?x-sign=uVI95WUGnnSLwIKdHN0mtCica4cmiO2sqwtZQFRUbE3KUcBDVJ7Anb9IZ0mfA4b6';
  const BENDER_TA = 'https://fournais-bender.dk/storage/TechnAspects-IT-systems.pdf';
  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const testing = () => document.documentElement.classList.contains('k-testing');

  // ---------- drawing helpers ----------
  const el = (id) => document.getElementById(id);
  function put(parent, tag, attrs, text) { const n = K.svg(tag, attrs); if (text != null) n.textContent = text; parent.appendChild(n); return n; }
  const lab = (g, x, y, text, cls, anchor) => put(g, 'text', { x, y, class: 'lab' + (cls ? ' ' + cls : ''), 'text-anchor': anchor || 'start' }, text);
  const n1 = (v) => +v.toFixed(1);

    const s11 = seg('arc', A({}).arc, A({ n: 3 }).arc, true).end + seg('arc', A({ n: 3 }).arc, A({ n: 3, loss: LOSSES[2] }).arc, true).end;
    const lm = seg('arc', A({ n: 3 }).arc, A({ n: 3, loss: LOSSES[1] }).arc, false).end;
    const dm = seg('drv', D({}).drv, D({ filters: 'Out' }).drv, false).dl;
    const tm = seg('tch', Tc({}).tch, Tc({ fault: 'Solid' }).tch, false).d;
    const m = seg('arc', A({ n: 1 }).arc, A({ n: 2 }).arc, true), mid = arcVisAt(m, m.wait + m.dur / 2);
    return one <= 3.5 && s11 <= 5 && lm <= 0.35 && dm <= 0.35 && tm <= 0.35 && mid.tp > TS[1] && mid.tp < END;
  });
  K.check('Three strikes at most: after the third, Strike greys out until Reset', () =>
    canStrike(A({ n: 0 }).arc) && canStrike(A({ n: 2 }).arc) && !canStrike(A({ n: 3 }).arc));

  K.ready();
</script>
