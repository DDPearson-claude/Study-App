<p class="caption">The loads and their readings are example values; the arrows are drawn to scale, frozen at one instant.</p>

<script>
  // ---------- the rule ----------
  // Three windings 120° apart each make 230 V (the phase voltage). Each phase is an arrow; the
  // voltage between two lines is one arrow minus the other, |V1 − V2| = √3 × 230 = 398.4 V, turned
  // 30° from V1. Each load is 23 Ω at a power factor of 0.8, so its current is V ÷ 23, φ = acos 0.8
  // = 36.9° behind its own voltage. Star: I_ph = 230 ÷ 23 = 10 A = I_L; the neutral carries the
  // three currents added as arrows. Delta: each load has V_L across it, I_ph = 398.4 ÷ 23 = 17.32 A,
  // and L1 carries I(L1–L2) − I(L3–L1), √3 × 17.32 = 30 A. Power: 3 V_ph I_ph cos φ = √3 V_L I_L cos φ.
  const DEG = Math.PI / 180, R3 = Math.sqrt(3);
  const VPH = 230, ZL = 23, PF = 0.8;              // UK mains phase voltage; the example loads
  const PHI = Math.acos(PF) / DEG;                 // 36.87°
  const VLL = VPH * R3;                            // 398.37 V
  const IS = VPH / ZL;                             // 10 A, star
  const ID = VLL / ZL;                             // 17.32 A, delta, each load
  const ILD = ID * R3;                             // 30 A, delta, each line
  const BV = 400, BI = 20, BPF = 0.85;             // the board's readings (an example)
  const MI = 26, MW = MI / R3;                     // the motor's clamp reading (an example) and its windings
  const VSH = 254, IDO = 12, PK = Math.SQRT2;      // screen 2's supply, a winding, and screen 8's loads, each (examples); peak ÷ rms
  const MAIN = { z: ZL, pf: PF }, HEAT = { z: VPH / 2.5, pf: 1 };   // the example loads; screen 10's heaters, 2.5 A each in star (an example)
  const TH = [0, -120, 120];                       // L1, L2, L3: each a third of a turn behind the last
  const KV = 0.23, KIS = 5, KID = 2.8;             // drawing units per volt, per amp (star), per amp (delta)

  // The circuit, in drawing units: the lines' heights, the neutral's, the supply's star point, the
  // windings' ends, the load corners, the loads' star point, the neutral's turn and the meters.
  const YL = [78, 124, 170], YN = 198, SP = [48, 124], EW = [[104, 78], [104, 124], [104, 170]];
  const CN = [[318, 78], [262, 124], [318, 170]], LP = [299, 124], NX = 326, CLX = 214, CNX = 190, UX = 250;
  const VM_PH = { c: [34, 62], a: [104, 78], b: [48, 124] }, VM_L = { c: [150, 101], a: [150, 78], b: [150, 124] };

  function num(v, dp) {
    dp = dp == null ? 2 : dp;
    const m = Math.pow(10, dp);
    let r = Math.round(v * m) / m;
    if (r === 0) r = 0;
    let s = r.toFixed(dp);
    if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
    return s.replace('-', '−');
  }
  function fx(v, dp) {
    const m = Math.pow(10, dp);
    let r = Math.round(v * m) / m;
    if (r === 0) r = 0;
    return r.toFixed(dp).replace('-', '−');
  }
  // Watts as the lesson writes them: 5520 W, 16,560 W.
  function watts(v) {
    const r = Math.round(v), s = String(r);
    return (r >= 10000 ? s.replace(/\B(?=(\d{3})+(?!\d))/g, ',') : s) + ' W';
  }
  const mix = (a, b, t) => (t >= 1 ? b : t <= 0 ? a : a + (b - a) * t);
  const pol = (r, deg) => [r * Math.cos(deg * DEG), -r * Math.sin(deg * DEG)];   // an arrow, drawn (y down)
  const vadd = (a, b) => [a[0] + b[0], a[1] + b[1]];
  const vsub = (a, b) => [a[0] - b[0], a[1] - b[1]];
  const vlen = (a) => Math.hypot(a[0], a[1]);
  const vang = (a) => Math.atan2(-a[1], a[0]) / DEG;
  const vmix = (a, b, t) => [mix(a[0], b[0], t), mix(a[1], b[1], t)];
  const dip = (cv) => [cv < 0.5 ? 1 - 2 * cv : 0, cv > 0.5 ? 2 * cv - 1 : 0];   // star's words fade out, then delta's in
  // The three star currents added as arrows: what the neutral carries.
  const neutralOf = (l3) => [IS, IS, l3].reduce((s, I, k) => vadd(s, pol(I, TH[k] - PHI)), [0, 0]);
  // The power both ways for a connection of the example loads.
  // Each readout is worked from the factors it shows, so it can be checked by hand; P is the exact power.
  function powerOf(conn, ld) {
    ld = ld || MAIN;
    const d = conn === 'delta', Vp = d ? VLL : VPH, Ip = Vp / ld.z, IL = d ? Ip * R3 : Ip, pf = ld.pf;
    const sh = (v, dp) => Number(num(v, dp));
    return { Vp, Ip, IL, pf, P: 3 * Vp * Ip * pf, Pp: 3 * sh(Vp, 1) * sh(Ip, 2) * pf, Pl: R3 * sh(VLL, 1) * sh(IL, 2) * pf };
  }
  const phStr = (w) => '3 × ' + num(w.Vp, 1) + ' × ' + num(w.Ip, 2) + ' × ' + num(w.pf, 2) + ' = ' + watts(w.Pp);
  const lnStr = (w) => '√3 × ' + num(VLL, 1) + ' × ' + num(w.IL, 2) + ' × ' + num(w.pf, 2) + ' = ' + watts(w.Pl);
  const grp = (v) => { const r = Math.round(v), t = String(r); return r >= 10000 ? t.replace(/\B(?=(\d{3})+(?!\d))/g, ',') : t; };
  const CL = (v) => 'I_L = ' + v + ' A';
  const VL_LAB = 'V_L = ' + fx(VLL, 1) + ' V';

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  const STEPS = [
    { show: true, key: 'starV', name: 'Star: where you measure', card: 'main', dur: 4.2,
      text: 'Three windings a third of a turn apart make three voltages 120° apart, 230 V each. The supply is in *star*: one end of every winding meets at the star point, and lines L1, L2 and L3 run from the free ends to three loads, joined the same way. Across one winding the voltmeter reads the *phase voltage*, 230 V. Between L1 and L2 it reads L1\'s arrow minus L2\'s, √3, about 1.732, times as long: 230 × 1.732 = 398.4 V, the *line voltage*.' },
    { key: 'lineV', name: 'Between two lines', card: 'main', vph: VSH, rdur: 2.1,
      task: 'Say a supply makes 254 V a winding, in star. What does the voltmeter between L1 and L2 read?',
      opts: ['508 V', '440 V', '254 V'], want: '440 V',
      hint: 'Not quite. Think about which way you pass through each winding.',
      hints: { '508 V': 'Not quite. The two phases peak a third of a cycle apart, and the meter reads their difference, not their sum.',
        '254 V': 'Not quite. That is across one winding, line to star point.' },
      why: 'Going from L2 to L1 you pass back down L2\'s winding and up L1\'s, so the meter reads L1\'s arrow minus L2\'s. To take an arrow away, turn it half round and add it. L2\'s arrow, turned round, sits on the tip of L1\'s, and the arrow closing them is √3, about 1.732, times as long, turned 30° from L1\'s. So 254 × 1.732 = 439.9 V, about 440 V, the line voltage most ships run. 508 V adds the two as plain numbers, as if they peaked together.' },
    { show: true, key: 'starI', name: 'Star: the currents', card: 'main', dur: 3.8,
      text: 'Now the currents. Each line runs straight into one winding and one load, with nothing branching off, so the *line current* is the phase current. Each load is 23 Ω at a power factor of 0.8, so each phase carries 230 ÷ 23 = 10 A, 36.9° behind its own voltage. At the star point the three currents meet and go back along the *neutral*, which carries all three added as arrows.' },
    { key: 'neutral', name: 'The neutral', card: 'main', rdur: 2.0,
      task: 'Three 10 A phase currents meet at the star point. What does the neutral carry?',
      opts: ['30 A', '10 A', '0 A'], want: '0 A',
      hint: 'Not quite. Add them as arrows, tip to tail.',
      hints: { '30 A': 'Not quite. The three currents peak at different moments, so they add as arrows, not as numbers.',
        '10 A': 'Not quite. Lay them tip to tail: the last tip lands back on the first tail.' },
      why: 'Laid tip to tail, three equal arrows 120° apart close a triangle. The last tip lands back on the first tail, so their sum is nothing: at every instant, what flows out along one line flows back along the other two. A balanced load leaves the neutral carrying nothing, so a load that is always balanced can be fed by the three lines alone. Most ships\' main supply is just that: three phases on three wires, with no neutral conductor.' },
    { show: true, key: 'unbal', name: 'Unbalance', card: 'main', free: 'l3', dur: 3.8,
      text: 'The slider is yours now: L3\'s load current. L1 and L2 stay at 10 A. As L3 falls, the triangle stops closing and the neutral\'s arrow grows across the gap. Each phase still shares an equal part, L3\'s current, which cancels as before. What is left is L1\'s and L2\'s extra, two equal arrows 120° apart, whose sum is one arrow just as long. So the neutral carries 10 A minus L3\'s current: 4 A with L3 at 6 A, and 10 A with L3 off.' },
    { key: 'n5', name: '10, 10 and 7', card: 'main', free: 'l3', freeAfter: true, l3: 7, rdur: 2.1,
      task: 'L1 and L2 carry 10 A, and L3 carries 7 A. What does the neutral carry?',
      opts: ['3 A', '27 A', '0 A'], want: '3 A',
      hint: 'Not quite. Find the equal part first.',
      hints: { '27 A': 'Not quite. They are 120° apart, so most of them cancel.',
        '0 A': 'Not quite. Only equal currents cancel completely.' },
      why: 'The equal part, 7 A in each phase, closes a triangle and cancels. What is left is L1\'s and L2\'s extra 3 A, two equal arrows 120° apart, whose sum is one 3 A arrow. So the neutral carries 3 A, not 27 A. That cancelling holds for sine-wave currents; currents with harmonics at three times the supply frequency add in the neutral instead.' },
    { show: true, key: 'delta', name: 'Delta', card: 'main', conn: 'delta', dur: 4.2,
      text: 'The switch now joins the same loads in *delta*. The supply stays in star, so from here phase means one load. Each load sits between two lines, in a ring, with no star point and no neutral, so it has the line voltage across it, 398.4 V, and draws 398.4 ÷ 23 = 17.32 A. At L1\'s corner, L1 brings the current of the load that starts there, less the current the other load delivers back. That is the difference of two phase currents 120° apart, the same subtraction as before, now on the currents: 17.32 × 1.732 = 30.0 A.' },
    { key: 'deltaI', name: 'Delta: the line current', card: 'main', conn: 'delta', id: IDO, sub: 'other loads, 12 A each, power factor 0.8', rdur: 2.0,
      task: 'Other loads in delta each draw 12 A. What does the clamp on L1 read?',
      opts: ['24 A', '12 A', '20.8 A'], want: '20.8 A',
      hint: 'Not quite. Two loads meet at L1\'s corner.',
      hints: { '24 A': 'Not quite. They are 120° apart, and L1 carries their difference.',
        '12 A': 'Not quite. That is star\'s rule; in delta two loads meet at every line.' },
      why: 'L1\'s corner joins two loads. L1 brings the current of the load that starts there, less the current of the load that ends there: two 12 A phase currents 120° apart. Turn the second half round and lay it on the tip of the first, and the arrow closing them is √3 times as long, 12 × 1.732 = 20.8 A. The √3 has moved from the voltage to the current. 24 A adds them as plain numbers, as if they peaked together.' },
    { show: true, key: 'power', name: 'Power, either way', card: 'main', free: 'conn', dur: 3.2,
      text: 'Each load takes V_ph × I_ph × cos φ, lesson 8\'s true power, so three take 3 × V_ph × I_ph × cos φ. In star, V_ph = V_L ÷ √3 and I_ph = I_L. In delta, V_ph = V_L and I_ph = I_L ÷ √3. Either way one √3 divides into the 3 and leaves √3 × V_L × I_L × cos φ, so the two readouts always agree. Flip the switch and watch both: 5520 W in star, 16,561 W in delta.' },
    { key: 'p3', name: 'Heaters, star to delta', card: 'main', free: 'conn', freeAfter: true, ld: HEAT, sub: 'heaters, 92 Ω each, power factor 1', rdur: 2.1,
      task: 'Three heaters take 1725 W in star, 2.5 A each. Joined in delta on the same supply, what do they take?',
      opts: ['1725 W', '5175 W', '2988 W'], want: '5175 W',
      hint: 'Not quite. Follow the voltage across one heater.',
      hints: { '1725 W': 'Not quite. The heaters are the same, but the voltage across each is not.',
        '2988 W': 'Not quite. The current through each rises by √3 too.' },
      why: 'In delta each heater has √3 times the voltage across it, 398.4 V instead of 230 V, so it draws √3 times the current, 4.33 A instead of 2.5 A. Its power goes with both, so it rises √3 × √3 = 3 times: 3 × 1725 = 5175 W. Fixed loads such as heaters, moved from star to delta on the same supply, take three times the power.' },
    { key: 'board', name: 'Mixed: a board', card: 'board', conn: 'unknown', rdur: 1.8,
      task: 'Mixed. A board reads 400 V between lines. A balanced load draws 20 A a line at a power factor of 0.85, and you cannot see how it is joined. What apparent power, in volt-amps, do its cables carry?',
      opts: ['11.8 kVA', '13.9 kVA', '24.0 kVA'], want: '13.9 kVA',
      hint: 'Not quite. Which formula takes line values, and does apparent power take cos φ?',
      hints: { '11.8 kVA': 'Not quite. That is the true power, the cos φ share; apparent power leaves cos φ out.',
        '24.0 kVA': 'Not quite. 3 goes with phase values; with line values the factor is √3.' },
      why: 'Apparent power is volts times amps with the angle left out, lesson 8\'s volt-amps. With line values, three phases\' worth is √3 × V_L × I_L, whatever the connection: √3 × 400 × 20 = 13,856 VA, about 13.9 kVA. Only the cos φ share arrives as watts: 13,856 × 0.85 = 11,778 W, about 11.8 kW.' },
    { key: 'motor', name: 'Mixed: a delta motor', card: 'motor', conn: 'delta', rdur: 2.0,
      task: 'Mixed. A motor\'s windings are joined in delta, and the clamp reads 26 A on one line. What current flows in each winding?',
      opts: ['26 A', '45.0 A', '15.0 A'], want: '15.0 A',
      hint: 'Not quite. In delta, where does the √3 go?',
      hints: { '26 A': 'Not quite. 26 A is in the line; in delta each line feeds two windings.',
        '45.0 A': 'Not quite. In delta the line carries more than the winding, not less.' },
      why: 'In delta each line joins two windings and carries the difference of their currents, √3 times one of them. So each winding carries the line current ÷ √3: 26 ÷ 1.732 = 15.0 A. Two 15.0 A arrows 120° apart differ by an arrow 26 A long.' },
    { key: 'peak', name: 'Mixed: the peak', card: 'peak', conn: 'unknown', rdur: 1.8,
      task: 'Mixed. The meter reads 400 V between two lines. Like the 230 V on a label, that is rms. What peak voltage does the insulation between them see?',
      opts: ['693 V', '400 V', '566 V'], want: '566 V',
      hint: 'Not quite. Which factor goes from rms to peak?',
      hints: { '693 V': 'Not quite. √3 turns a phase voltage into a line voltage; from rms to peak a sine needs √2.',
        '400 V': 'Not quite. 400 V is the rms; the wave swings higher.' },
      why: '400 V is rms, as lesson 2 showed for the 230 V label, and a sine peaks at √2, about 1.414, times its rms: 400 × 1.414 = 566 V. The connection does not matter here. √3 goes from phase to line; √2 goes from rms to peak. Choose the tool by what you are changing.' },
  ];
  const FINISH = 'The √3 comes from subtracting two equal arrows 120° apart: it lands on the voltage in star and on the current in delta. For a generator, star gives the same power with less line current, and delta copes better if a winding fails. A motor\'s windings are joined in star or delta too, and the courses after this one take three-phase on to transformers, ships\' systems and motors.';
  // Sources the checks restate (the lesson's own).
  const L13B = 'https://engineering.louisville.edu/raise/ECE252/L13B.htm';
  const ENA = 'https://www.energynetworks.org/industry/engineering-and-technical-programmes/statutory-voltage-limits';
  const KUPH10 = 'http://www.ibiblio.org/kuphaldt/electricCircuits/AC/AC_10.html';
  const OSU = 'https://web.engr.oregonstate.edu/~webbky/ENGR202_files/SECTION%207%20Three%20Phase%20Circuit%20Fundamentals.pdf';
  const HYPER = 'http://www.hyperphysics.gsu.edu/hbase/electric/powerac.html';

  const PICK = 'Tap one of the answers.';
  const FADE = 0.35;
  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const testing = () => document.documentElement.classList.contains('k-testing');
  const el = (id) => document.getElementById(id);

  // ---------- each step's state ----------
  // pick, res ('right', 'wrong' or 'empty' once checked), why: the puzzle. l3, conn: what Dan has set
  // on a screen with a free control (null: the screen's own).
  function blank() { return { pick: null, res: null, why: false, l3: null, conn: null }; }
  let S = STEPS.map(() => blank());
  let finished = false, lastStep = -1, lastDone = false, T = Infinity, MODE = 'demo', motionEnd = 0;
  let REC = {}, BOX = [];
  const isRight = (i, st) => st.pick != null && st.pick === STEPS[i].want;
  const hintFor = (i, st) => { const d = STEPS[i]; return (d.hints && d.hints[st.pick]) || d.hint; };

  // Text with highlighted key terms (*term*), and V_ph, I_ph, V_L, I_L set with a lowered part, built with K.el.
  function write(node, s) {
    node.textContent = '';
    String(s || '').split(/(\*[^*]+\*|[VI]_(?:ph|L))/).forEach((b) => {
      if (!b) return;
      if (/^[VI]_(ph|L)$/.test(b)) node.append(b.charAt(0), K.el('sub', {}, b.slice(2)));
      else if (b.charAt(0) === '*' && b.length > 2 && b.charAt(b.length - 1) === '*') node.appendChild(K.el('mark', {}, b.slice(1, -1)));
      else node.appendChild(document.createTextNode(b));
    });
  }

  // ---------- controls ----------
  const stepper = K.stepper({ id: 'step', label: 'Step', steps: STEPS.map((d) => d.name), value: 0, compact: true, into: '#prog' });
  const at = () => stepper.get();

  // ---------- the arrows ----------
  function drawPanel(p, top) {

      if (!(a > 0.001) || Math.hypot(e[0] - s0[0], e[1] - s0[1]) < 0.5) return;
      items.push({ s: s0, e, cls, hcls, a, lab, lcls });
      if (name === 'copy') { ph.copyA = a; ph.copyCls = cls; }
      if (name && a >= 0.999) { ph.arrows[name] = [(e[0] - s0[0]) / k, (e[1] - s0[1]) / k]; ph.starts[name] = [(s0[0] - O[0]) / k, (s0[1] - O[1]) / k]; }
    };

      put('bold', O, P(O, vsub(v[0], v[1]), KV), 'aB', 'hB', p.boldA, 'L1 − L2', 'nv', KV);

    } else if (p.type === 'i') {
      O = [140, top + 72]; bottom = top + 138;
      TH.forEach((t) => put(null, O, P(O, pol(VPH, t), KV), 'vref', 'vrefh', 1, null, null, KV));
      const I = [pol(IS, -PHI), pol(IS, -120 - PHI), pol(p.l3, 120 - PHI)];
      const st = [O, vmix(O, P(O, I[0], KIS), p.lay), vmix(O, P(O, vadd(I[0], I[1]), KIS), p.lay)];
      st.forEach((s0, k) => put('L' + (k + 1), s0, P(s0, I[k], KIS), 'a' + (k + 1), 'h' + (k + 1), p.aI[k], 'L' + (k + 1), 'lb', KIS));

  // ---------- the working and the power readouts ----------
  function drawRows(rows, y) {
    rows.forEach((r) => {
      y += 22; const yy = y;
      r.forEach((v) => { if (v[1] > 0.001) part(v[1], 0, () => text(8, yy, v[0], 'wk', 'start')); if (v[1] >= 0.999) REC.rows.push(v[0]); });
    });

  function drawBoxes(b, y) {

        { head: 'times cos φ, the share that arrives as watts', slots: [[['? W', 1 - b.ta], [grp(VA) + ' × ' + num(BPF, 2) + ' = ' + watts(Wt), b.ta]]] }];

  }

  function drawScreen(d, st, i) {
    const s = stateOf(i, st);
    Object.assign(REC, { key: d.key, cv: s.cv, l3: s.l3, rows: [], boxes: [], pw: null });
    BOX = [];

  }

  function paint(i) {
    if (i == null) i = at();
    const d = STEPS[i], st = S[i];
    art.textContent = '';
    into = null;
    REC = {};
    const out = drawScreen(d, st, i);

  // ---------- the model: line voltage, line current (L1) and neutral current ----------
  function modelOf(p) {
    const d = STEPS[K.clamp(Math.round(Number(p.step)) || 0, 0, STEPS.length - 1)];
    if (d.card === 'board' || d.card === 'peak') return { lineVolts: BV, lineAmps: BI, neutralAmps: 0 };
    if (d.card === 'motor') return { lineVolts: BV, lineAmps: MI, neutralAmps: 0 };
    let conn = d.conn === 'delta' ? 'delta' : 'star';
    if (d.free === 'conn') conn = p.conn === 'delta' ? 'delta' : 'star';
    let l3 = d.l3 != null ? d.l3 : IS;
    if (d.free === 'l3') { const v = Number(p.l3); l3 = K.clamp(isFinite(v) ? v : IS, 0, IS); }
    const ld = d.ld || MAIN;
    if (d.vph) return { lineVolts: d.vph * R3, lineAmps: d.vph / ld.z, neutralAmps: 0 };
    if (conn === 'delta') return { lineVolts: VLL, lineAmps: (d.id || VLL / ld.z) * R3, neutralAmps: 0 };

  }
  K.model(modelOf);

  write(el('finish'), FINISH);
  K.update((p) => {
    const i = Math.round(p.step), d = STEPS[i], st = S[i];
    if (!anim.playing() && !waiting) T = Infinity;
    if (i !== lastStep) {
      lastStep = i; enter('stepbox');
      shown.l3 = p.l3; shown.conn = p.conn;
      if (d.show) { st.l3 = null; st.conn = null; play('demo', d.dur); }
      else { waiting = false; anim.pause(); T = Infinity; MODE = 'answer'; }
    } else {
      // Dan moved the free control: the motion stops where it ends, and that setting is his.
      ['l3', 'conn'].forEach((key) => {
        if (p[key] === shown[key]) return;
        shown[key] = p[key];
        if (d.free === key && !finished && (!d.freeAfter || st.res === 'right')) {
          stopMotion();
          st[key] = key === 'l3' ? K.clamp(Number(p[key]), 0, 10) : (p[key] === 'delta' ? 'delta' : 'star');
        }
      });
    }
    if (finished !== lastDone) { lastDone = finished; enter(finished ? 'done' : 'stepbox'); }
    const right = st.res === 'right';
    el('stepbox').hidden = finished;
    el('done').hidden = !finished;
    el('count').textContent = 'Step ' + (i + 1) + ' of ' + STEPS.length;
    const task = el('task');
    task.className = 'task' + (d.show ? ' show' : '');
    write(task, d.show ? d.text : d.task);
    paint(i);

    replayBtn.el.hidden = !d.show || REDUCE;
    el('replay').hidden = replayBtn.el.hidden;
    const fOn = !finished && d.free && (!d.freeAfter || right) ? d.free : '';
    CTL.l3.el.hidden = fOn !== 'l3';
    CTL.conn.el.hidden = fOn !== 'conn';
    el('ctl').hidden = !fOn;
    const opts = d.show ? [] : d.opts || [];
    el('picks').hidden = !opts.length;
    el('picks').classList.toggle('long', opts.some((o) => o.length > 7));
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      b.setLabel(opts[k]);
      b.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });
    el('acts').hidden = !!d.show;
    checkBtn.el.hidden = right;
    const fb = el('fb');
    fb.hidden = !!d.show;
    fb.className = 'fb' + (right ? ' right' : st.res === 'wrong' ? ' wrong' : '');
    write(fb, d.show ? '' : right ? 'That\'s it.' : st.res === 'wrong' ? hintFor(i, st) : st.res === 'empty' ? PICK : '');
    const why = el('why');
    why.hidden = d.show || !st.why;
    write(why, d.show ? '' : d.why);
    whyBtn.setLabel(st.why ? 'Hide why' : 'Why?');
    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !right);
    nextBtn.setLabel(i === STEPS.length - 1 ? 'Finish' : 'Continue');
    el('nav').hidden = backBtn.el.hidden && nextBtn.el.hidden;
  });

  // ---------- known answers, worked out by hand ----------
  const DO = STEPS.map((d, i) => i).filter((i) => !STEPS[i].show);
  const solvedSt = (i) => Object.assign(blank(), { pick: STEPS[i].want, res: 'right' });
  const wrongSt = (i, o) => Object.assign(blank(), { pick: o, res: 'wrong' });
  const idx = (key) => STEPS.findIndex((d) => d.key === key);
  const near = (a, b, tol) => typeof a === 'number' && typeof b === 'number' && Math.abs(a - b) <= tol;
  function drawn(i, st, mode, t) {
    const keepS = S[i], keepT = T, keepM = MODE;
    S[i] = st; T = t == null ? Infinity : t; MODE = mode || (STEPS[i].show ? 'demo' : 'answer');
    try {
      paint(i);
      return Object.assign({}, REC);
    } finally { S[i] = keepS; T = keepT; MODE = keepM; paint(); }
  }
  const settledOf = (i) => drawn(i, STEPS[i].show ? blank() : solvedSt(i));
  const withL3 = (v) => Object.assign(blank(), { l3: v });
  const withConn = (c) => Object.assign(blank(), { conn: c });
  const has = (g, s) => g.rows.indexOf(s) >= 0;
  const angBetween = (a, b) => Math.abs(((vang(a) - vang(b)) % 360 + 540) % 360 - 180);
  const S_STARV = idx('starV'), S_LINEV = idx('lineV'), S_STARI = idx('starI'), S_NEUT = idx('neutral'), S_UNB = idx('unbal'), S_N5 = idx('n5');
  const S_DELTA = idx('delta'), S_DELTAI = idx('deltaI'), S_POW = idx('power'), S_P3 = idx('p3'), S_BOARD = idx('board'), S_MOTOR = idx('motor'), S_PEAK = idx('peak');
  // A readout 'a × b × c = N W' worked by hand from the factors it shows (√3 as itself) gives N.
  const byHand = (t) => { const m = /^(?:\w+: )?(.+) = ([\d,]+(?:\.\d+)?) (W|VA)$/.exec(t); if (!m) return false;
    const v = m[1].split(' × ').reduce((p, f) => p * (f === '√3' ? R3 : Number(f.replace(/,/g, ''))), 1); return Math.round(v) === Number(m[2].replace(/,/g, '')); };

  K.check('For a three-phase generator, three coils of wire are placed at angles of 120° to each other: the three phase voltage arrows are drawn equal, 230 V each, 120° apart, and so are the three 10 A star currents', () => {
    const g = settledOf(S_STARV).ph.arrows, h = settledOf(S_STARI).ph.arrows;
    const eq = (A, n, v) => ['L1', 'L2', 'L3'].every((k) => !!A[k] && near(vlen(A[k]), v, 1e-9)) &&
      near(angBetween(A.L1, A.L2), 120, 1e-9) && near(angBetween(A.L2, A.L3), 120, 1e-9) && near(angBetween(A.L3, A.L1), 120, 1e-9);
    return eq(g, 3, 230) && eq(h, 3, 10);
  }, { source: L13B });
  K.check('UK mains electricity operates at a nominal voltage of 230V: the voltmeter across one winding reads V_ph = 230 V, and every star current drawn is 230 ÷ 23 = 10 A', () => {
    const g0 = drawn(S_STARV, blank(), 'demo', 0), h = settledOf(S_STARI);
    return !!g0.vm && g0.vm.lab === 'V_ph = 230 V' && near(g0.vm.pos, 0, 1e-12) && has(h, 'each phase: 230 ÷ 23 = 10 A') && near(vlen(h.ph.arrows.L1), VPH / ZL, 1e-9);
  }, { source: ENA });
  K.check('In balanced Y circuits, line voltage is equal to phase voltage times the square root of 3, while line current is equal to phase current: the bold arrow is 1.732 times a phase arrow, landing on the voltmeter\'s 398.4 V between L1 and L2, and the clamp on L1 reads the 10 A each phase carries', () => {
    const g = settledOf(S_STARV), h = settledOf(S_STARI), m = K.at({ step: S_STARV }), n = K.at({ step: S_STARI });
    return near(vlen(g.ph.arrows.bold) / vlen(g.ph.arrows.L1), R3, 1e-9) && fx(vlen(g.ph.arrows.bold), 1) === '398.4' && g.vm.lab === 'V_L = 398.4 V' && near(g.vm.pos, 1, 1e-12) &&
      near(m.lineVolts, vlen(g.ph.arrows.bold), 1e-9) && h.cl === 'I_L = 10 A' && near(n.lineAmps, vlen(h.ph.arrows.L1), 1e-9);
  }, { source: KUPH10 });
  K.check('The line voltage can be found by taking the phasor sum of the voltage in two phases of the source: the bold arrow closes L1\'s arrow and L2\'s turned half round, laid on L1\'s tip, and is turned 30° from L1\'s', () => {
    const g = settledOf(S_LINEV).ph, A = g.arrows, c = A.copy, s0 = g.starts.copy;
    return !!c && !!A.bold && near(s0[0], A.L1[0], 1e-9) && near(s0[1], A.L1[1], 1e-9) && near(c[0], -A.L2[0], 1e-9) && near(c[1], -A.L2[1], 1e-9) &&
      near(A.bold[0], A.L1[0] + c[0], 1e-9) && near(A.bold[1], A.L1[1] + c[1], 1e-9) && near(vang(A.bold) - vang(A.L1), 30, 1e-9);
  }, { source: L13B });
  K.check('The neutral conductor carries no current in a balanced three-phase network: three 10 A currents laid tip to tail close a triangle, so no neutral arrow is left and the neutral clamp reads 0.0 A', () => {
    const g = settledOf(S_NEUT), A = g.ph.arrows, st = g.ph.starts;
    const end3 = [st.L3[0] + A.L3[0], st.L3[1] + A.L3[1]];
    return g.cn === 'neutral 0.0 A' && near(st.L2[0], A.L1[0], 1e-9) && near(st.L2[1], A.L1[1], 1e-9) && near(vlen(end3), 0, 1e-9) && !A.neutral &&
      near(K.at({ step: S_NEUT }).neutralAmps, 0, 1e-9);
  }, { source: OSU });
  K.check('Unbalance: at every L3 current from 0 to 10 A the neutral arrow closes the gap and is 10 A minus L3\'s current (4.0 A at 6 A, 3.0 A at 7 A, 10.0 A with L3 off), and the clamp and the model agree', () => {
    for (let v = 0; v <= 10; v += 0.5) {
      const g = drawn(S_UNB, withL3(v)), N = IS - v, A = g.ph.arrows, nl = A.neutral ? vlen(A.neutral) : 0;
      if (!(near(nl, N, 1e-9) && g.cn === 'neutral ' + fx(N, 1) + ' A' && near(K.at({ step: S_UNB, l3: v }).neutralAmps, N, 1e-9))) return false;
      if (A.neutral && A.L3) { const e = [g.ph.starts.L3[0] + A.L3[0], g.ph.starts.L3[1] + A.L3[1]]; if (!(near(e[0], A.neutral[0], 1e-9) && near(e[1], A.neutral[1], 1e-9))) return false; }
    }
    return settledOf(S_UNB).cn === 'neutral 4.0 A' && drawn(S_UNB, withL3(0)).cn === 'neutral 10.0 A' && settledOf(S_N5).cn === 'neutral 3.0 A' &&
      near(K.at({ step: S_N5, l3: 7 }).neutralAmps, 3, 1e-9);
  });
  K.check('P T = √3 V L I L cosθ where cosθ is the power factor: in star and in delta the readout 3 × V_ph × I_ph × cos φ equals √3 × V_L × I_L × cos φ (5520 W and 16,561 W; the heaters 1725 W and 5175 W), every readout worked from the factors it shows; on the board √3 × 400 × 20 = 13,856 VA, of which 11,778 W at 0.85', () => {
    const s0 = drawn(S_POW, withConn('star')), s1 = drawn(S_POW, withConn('delta')), h0 = drawn(S_P3, Object.assign(solvedSt(S_P3), { conn: 'star' })), h1 = settledOf(S_P3), b = settledOf(S_BOARD);
    const both = (g, a, c) => g.boxes.indexOf(a) >= 0 && g.boxes.indexOf(c) >= 0;
    return both(s0, '3 × 230 × 10 × 0.8 = 5520 W', '√3 × 398.4 × 10 × 0.8 = 5520 W') && both(s1, '3 × 398.4 × 17.32 × 0.8 = 16,561 W', '√3 × 398.4 × 30 × 0.8 = 16,561 W') &&
      both(h0, '3 × 230 × 2.5 × 1 = 1725 W', '√3 × 398.4 × 2.5 × 1 = 1725 W') && both(h1, '3 × 398.4 × 4.33 × 1 = 5175 W', '√3 × 398.4 × 7.5 × 1 = 5175 W') &&
      near(s1.pw.P / s0.pw.P, 3, 1e-9) && near(powerOf('delta', HEAT).P / powerOf('star', HEAT).P, 3, 1e-9) &&
      both(b, '√3 × 400 × 20 = 13,856 VA', '13,856 × 0.85 = 11,778 W') &&
      [s0, s1, h0, h1, b].every((g) => g.boxes.length >= 2 && g.boxes.every(byHand));
  }, { source: L13B });
  K.check('The average power can be expressed as P avg = VI cosφ: one load\'s drawn voltage and current are each √3 times longer in delta, the angle between them stays 36.9°, and V_ph × I_ph × cos φ goes from 1840 W to 5520 W, a third of each readout', () => {
    const a = drawn(S_POW, withConn('star')).ph.arrows, b = drawn(S_POW, withConn('delta')).ph.arrows;
    const p = (A) => vlen(A.V) * vlen(A.I) * Math.cos(angBetween(A.V, A.I) * DEG);
    return near(vlen(b.V) / vlen(a.V), R3, 1e-9) && near(vlen(b.I) / vlen(a.I), R3, 1e-9) && near(angBetween(a.V, a.I), PHI, 1e-9) && near(angBetween(b.V, b.I), PHI, 1e-9) &&
      fx(PHI, 1) === '36.9' && near(p(a), 1840, 1e-6) && near(p(b), 5520, 1e-6) && near(3 * p(a), powerOf('star').P, 1e-6) && near(3 * p(b), powerOf('delta').P, 1e-6);
  }, { source: HYPER });
  K.check('Delta: L1\'s bold arrow is load L1–L2\'s current minus load L3–L1\'s, 17.32 × √3 = 30.0 A and 12 × √3 = 20.8 A, which the clamp on L1 reads; and for the motor two 15.0 A winding currents differ by the clamp\'s 26 A', () => {
    const g = settledOf(S_DELTAI), A = g.ph.arrows, h = settledOf(S_DELTA), H = h.ph.arrows, m = settledOf(S_MOTOR), M = m.ph.arrows;
    return !!A.bold && near(A.bold[0], A.a[0] - A.c[0], 1e-9) && near(A.bold[1], A.a[1] - A.c[1], 1e-9) && near(vlen(A.a), IDO, 1e-9) &&
      fx(vlen(A.bold), 1) === '20.8' && g.cl === 'I_L = 20.8 A' && near(K.at({ step: S_DELTAI }).lineAmps, vlen(A.bold), 1e-9) && has(g, 'L1: 12 × 1.732 = 20.8 A') &&
      !!H.bold && near(H.bold[0], H.a[0] - H.c[0], 1e-9) && fx(vlen(H.a), 2) === '17.32' && fx(vlen(H.bold), 1) === '30.0' && h.cl === 'I_L = 30.0 A' &&
      near(K.at({ step: S_DELTA }).lineAmps, vlen(H.bold), 1e-9) && has(h, 'L1: 17.32 × 1.732 = 30.0 A') && has(h, 'each load: 398.4 ÷ 23 = 17.32 A') &&
      !!M.a && !!M.c && near(vlen(M.a), MW, 1e-9) && near(M.bold[0], M.a[0] - M.c[0], 1e-9) && near(M.bold[1], M.a[1] - M.c[1], 1e-9) && near(vlen(M.bold), 26, 1e-9) &&
      m.cl === 'I_L = 26 A' && has(m, 'each winding: 26 ÷ 1.732 = 15.0 A');
  });
  K.check('A sine peaks at √2 times its rms: the 400 V rms line voltage is drawn with its rms level at 400 V and, after a right answer, a peak arrow of 400 × 1.414 = 566 V', () => {
    const g = settledOf(S_PEAK), A = g.ph.arrows;
    return g.ph.rms === 400 && !!A.peak && near(vlen(A.peak), BV * PK, 1e-9) && fx(vlen(A.peak), 0) === '566' && has(g, 'peak: 400 × 1.414 = 566 V') && g.vm.lab === 'V_L = 400 V';
  });
  K.check('Known answers and slips: 398.4 V; 254 V a winding gives 439.9 V, about 440 V, and the slip 508 V; 30 A added as numbers; 3 A and the slip 27 A; 17.32 A and 30.0 A; 20.8 A and the slip 24 A; 1725 W, 5175 W and the slip 2988 W; 13.9 kVA and the slips 11.8 kVA and 24.0 kVA; 15.0 A and the slip 45.0 A; 566 V and the slip 693 V', () => {
    return fx(VLL, 1) === '398.4' && fx(VSH * R3, 1) === '439.9' && fx(VSH * 1.732, 1) === '439.9' && fx(VSH * R3, 0) === '440' && 2 * VSH === 508 && 3 * IS === 30 &&
      IS - 7 === 3 && IS + IS + 7 === 27 && fx(ID, 2) === '17.32' && fx(ILD, 1) === '30.0' && fx(17.32 * 1.732, 1) === '30.0' &&
      fx(IDO * R3, 1) === '20.8' && fx(IDO * 1.732, 1) === '20.8' && 2 * IDO === 24 && near(HEAT.z, 92, 1e-9) &&
      near(powerOf('star', HEAT).P, 1725, 1e-9) && near(powerOf('delta', HEAT).P, 5175, 1e-6) && fx(1725 * R3, 0) === '2988' && fx(1725 * 1.732, 0) === '2988' &&
      fx(R3 * BV * BI / 1000, 1) === '13.9' && fx(R3 * BV * BI * BPF / 1000, 1) === '11.8' && fx(3 * BV * BI / 1000, 1) === '24.0' &&
      fx(MI / R3, 1) === '15.0' && fx(MI * R3, 1) === '45.0' && fx(26 / 1.732, 1) === '15.0' &&
      fx(BV * PK, 0) === '566' && fx(BV * 1.414, 0) === '566' && fx(BV * R3, 0) === '693' && fx(VPH * 1.732, 1) === '398.4';
  });
  K.check('Each puzzle accepts only its right answer; before an answer its picture hides what is asked, and a right answer draws it', () => {
    const PRE = {
      lineV: (g) => !!g.vm && g.vm.lab === 'V_L = ? V' && !g.ph.arrows.bold && !g.ph.arrows.copy && !g.ph.copyA && has(g, 'line: L1 − L2 = ?') && has(g, 'phase: across one winding, V_ph = 254 V'),
      neutral: (g) => g.cn === 'neutral ? A' && near(vlen(g.ph.starts.L2), 0, 1e-9) && has(g, 'neutral: the three added as arrows = ?'),
      n5: (g) => g.cn === 'neutral ? A' && !g.ph.arrows.neutral && near(vlen(g.ph.starts.L2), 0, 1e-9) && has(g, 'L1 10 A · L2 10 A · L3 7 A'),
      deltaI: (g) => g.cl === 'I_L = ? A' && !g.ph.arrows.bold && has(g, 'L1: load L1–L2 less load L3–L1 = ?'),
      p3: (g) => near(g.cv, 0, 1e-12) && g.boxes.indexOf('3 × 230 × 2.5 × 1 = 1725 W') >= 0 && g.boxes.every((b) => b.indexOf('5175') < 0) && has(g, 'in delta: ? W'),
      board: (g) => g.boxes.length === 2 && g.boxes[0] === '? VA' && g.boxes[1] === '? W',
      peak: (g) => !g.ph.arrows.peak && has(g, 'rms 400 V; peak = ?'),
      motor: (g) => !g.ph.arrows.a && !g.ph.arrows.c && near(vlen(g.ph.arrows.bold), 26, 1e-9) && has(g, 'each winding = ?'),
    };
    const POST = {
      lineV: (g) => g.vm.lab === 'V_L = 439.9 V' && !!g.ph.arrows.bold && near(vlen(g.ph.arrows.bold), VSH * R3, 1e-9) && has(g, 'line: L1 − L2 = 254 × 1.732 = 439.9 V'),
      neutral: (g) => g.cn === 'neutral 0.0 A' && has(g, 'tip to tail they close: nothing is left'),
      n5: (g) => g.cn === 'neutral 3.0 A' && !!g.ph.arrows.neutral && near(vlen(g.ph.arrows.neutral), 3, 1e-9) && has(g, 'L1\'s and L2\'s extra 3 A is left'),
      deltaI: (g) => g.cl === 'I_L = 20.8 A' && !!g.ph.arrows.bold && has(g, 'L1: 12 × 1.732 = 20.8 A'),
      p3: (g) => near(g.cv, 1, 1e-12) && g.boxes.indexOf('3 × 398.4 × 4.33 × 1 = 5175 W') >= 0 && g.cl === 'I_L = 7.5 A' && has(g, '5175 ÷ 1725 = 3, which is √3 × √3'),
      board: (g) => g.boxes.length === 2 && g.boxes.indexOf('√3 × 400 × 20 = 13,856 VA') >= 0 && g.boxes.indexOf('13,856 × 0.85 = 11,778 W') >= 0,
      peak: (g) => !!g.ph.arrows.peak && has(g, 'peak: 400 × 1.414 = 566 V'),
      motor: (g) => !!g.ph.arrows.a && !!g.ph.arrows.c && !!g.ph.arrows.copy && has(g, 'each winding: 26 ÷ 1.732 = 15.0 A'),
    };
    const only = DO.every((i) => { const d = STEPS[i]; return d.opts.indexOf(d.want) >= 0 && d.opts.every((o) => isRight(i, Object.assign(blank(), { pick: o })) === (o === d.want)); });
    const hidden = DO.every((i) => !!PRE[STEPS[i].key] && PRE[STEPS[i].key](drawn(i, blank())) === true);
    const shownOk = DO.every((i) => !!POST[STEPS[i].key] && POST[STEPS[i].key](settledOf(i)) === true);
    const wrongStill = DO.every((i) => STEPS[i].opts.filter((o) => o !== STEPS[i].want).every((o) => PRE[STEPS[i].key](drawn(i, wrongSt(i, o))) === true));
    return only && hidden && shownOk && wrongStill;
  });
  K.check('Every demonstration has finished arriving within 4.5 s of its screen opening, none starting before the 0.35 s screen fade ends; every answer\'s motion, right or wrong, within 2.5 s', () => {
    const keepT = T, keepM = MODE;
    const timed = (i, st, mode, limit) => {
      const keepS = S[i];
      T = Infinity; MODE = mode; latest = 0; earliest = Infinity; S[i] = st;
      try { paint(i); } finally { S[i] = keepS; }
      return latest <= limit + 1e-9;
    };
    const ok = STEPS.every((d, i) => {
      if (d.show) { const r = timed(i, blank(), 'demo', d.dur); return r && d.dur >= 3 && d.dur <= 4.5 && earliest >= FADE; }
      return timed(i, solvedSt(i), 'answer', d.rdur) && d.rdur <= 2.5 && d.opts.filter((o) => o !== d.want).every((o) => timed(i, wrongSt(i, o), 'answer', 0.8));
    });
    T = keepT; MODE = keepM; paint();
    return ok;
  });

  K.ready();
</script>
