<p class="caption">The loads and their readings are example values; the arrows are drawn to scale, frozen at one instant.</p>

<script>
  // ---------- the rule ----------
  // Three windings 120° apart each make 230 V (the phase voltage). Each phase is an arrow; the
  // voltage between two lines is one arrow minus the other, |V1 − V2| = √3 × 230 = 398.4 V, turned
  // 30° from V1. Each load is 23 Ω at a power factor of 0.8, so its current is V ÷ 23, φ = acos 0.8
  // = 36.9° behind its own voltage. Star: I_ph = 230 ÷ 23 = 10 A = I_L; the neutral carries the
  // three currents added as arrows. Delta: each load has V_L across it, I_ph = 398.4 ÷ 23 = 17.32 A,
  // and L1 carries I(L1–L2) − I(L3–L1), √3 × 17.32 = 30 A. Power: 3 V_ph I_ph cos φ = √3 V_L I_L cos φ.
  const DEG = Math.PI / 180, R3 = Math.sqrt(3);
  const VPH = 230, ZL = 23, PF = 0.8;              // UK mains phase voltage; the example loads
  const PHI = Math.acos(PF) / DEG;                 // 36.87°
  const VLL = VPH * R3;                            // 398.37 V
  const IS = VPH / ZL;                             // 10 A, star
  const ID = VLL / ZL;                             // 17.32 A, delta, each load
  const ILD = ID * R3;                             // 30 A, delta, each line
  const BV = 400, BI = 20, BPF = 0.85;             // the board's readings (an example)
  const MI = 26, MW = MI / R3;                     // the motor's clamp reading (an example) and its windings
  const TH = [0, -120, 120];                       // L1, L2, L3: each a third of a turn behind the last
  const KV = 0.23, KIS = 5, KID = 2.8;             // drawing units per volt, per amp (star), per amp (delta)

  // The circuit, in drawing units: the lines' heights, the neutral's, the supply's star point, the
  // windings' ends, the load corners, the loads' star point, the neutral's turn and the meters.
  const YL = [78, 124, 170], YN = 198, SP = [30, 124], EW = [[86, 78], [86, 124], [86, 170]];
  const CN = [[318, 78], [262, 124], [318, 170]], LP = [299, 124], NX = 326, CLX = 214, CNX = 190, UX = 250;
  const VM_PH = { c: [34, 62], a: [86, 78], b: [30, 124] }, VM_L = { c: [150, 101], a: [150, 78], b: [150, 124] };

  function num(v, dp) {
    dp = dp == null ? 2 : dp;
    const m = Math.pow(10, dp);
    let r = Math.round(v * m) / m;
    if (r === 0) r = 0;
    let s = r.toFixed(dp);
    if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
    return s.replace('-', '−');
  }
  function fx(v, dp) {
    const m = Math.pow(10, dp);
    let r = Math.round(v * m) / m;
    if (r === 0) r = 0;
    return r.toFixed(dp).replace('-', '−');
  }
  // Watts as the lesson writes them: 5520 W, 16,560 W.
  function watts(v) {
    const r = Math.round(v), s = String(r);
    return (r >= 10000 ? s.replace(/\B(?=(\d{3})+(?!\d))/g, ',') : s) + ' W';
  }
  const mix = (a, b, t) => (t >= 1 ? b : t <= 0 ? a : a + (b - a) * t);
  const pol = (r, deg) => [r * Math.cos(deg * DEG), -r * Math.sin(deg * DEG)];   // an arrow, drawn (y down)
  const vadd = (a, b) => [a[0] + b[0], a[1] + b[1]];
  const vsub = (a, b) => [a[0] - b[0], a[1] - b[1]];
  const vlen = (a) => Math.hypot(a[0], a[1]);
  const vang = (a) => Math.atan2(-a[1], a[0]) / DEG;
  const vmix = (a, b, t) => [mix(a[0], b[0], t), mix(a[1], b[1], t)];
  const dip = (cv) => [cv < 0.5 ? 1 - 2 * cv : 0, cv > 0.5 ? 2 * cv - 1 : 0];   // star's words fade out, then delta's in
  // The three star currents added as arrows: what the neutral carries.
  const neutralOf = (l3) => [IS, IS, l3].reduce((s, I, k) => vadd(s, pol(I, TH[k] - PHI)), [0, 0]);
  // The power both ways for a connection of the example loads.
  function powerOf(conn) {
    const d = conn === 'delta', Vp = d ? VLL : VPH, Ip = d ? ID : IS, IL = d ? ILD : IS;
    return { Vp, Ip, IL, Pp: 3 * Vp * Ip * PF, Pl: R3 * VLL * IL * PF };
  }
  const phStr = (w) => '3 × ' + num(w.Vp, 1) + ' × ' + num(w.Ip, 2) + ' × ' + num(PF, 2) + ' = ' + watts(w.Pp);
  const lnStr = (w) => '√3 × ' + num(VLL, 1) + ' × ' + num(w.IL, 2) + ' × ' + num(PF, 2) + ' = ' + watts(w.Pl);
  const VL_LAB = 'V_L = ' + fx(VLL, 1) + ' V';

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  const STEPS = [
    { show: true, key: 'starV', name: 'Star: where you measure', card: 'main', dur: 4.2,
      text: 'Three windings set a third of a turn apart make three equal voltages, 120° apart, 230 V each. In *star*, one end of every winding meets at the star point, and the lines L1, L2 and L3 run from the free ends to three equal loads. Across one winding, line to star point, the voltmeter reads the *phase voltage*, 230 V. Between L1 and L2 it reads more. Going from L2 to L1 you pass back down L2\'s winding and up L1\'s, so it reads L1\'s arrow minus L2\'s. That arrow is √3, about 1.732, times as long: 230 × 1.732 = 398.4 V, the *line voltage*.' },
    { key: 'lineV', name: 'Between two lines', card: 'main', rdur: 2.1,
      task: 'The voltmeter sits between L1 and L2. What does it read?',
      opts: ['460 V', '398.4 V', '230 V'], want: '398.4 V',
      hint: 'Not quite. Think about which way you pass through each winding.',
      hints: { '460 V': 'Not quite. The two phases peak a third of a cycle apart, and the meter reads their difference, not their sum.',
        '230 V': 'Not quite. That is across one winding, line to star point.' },
      why: 'Going from L2 to L1 you pass back down L2\'s winding and up L1\'s, so the meter reads L1\'s arrow minus L2\'s. To take an arrow away, turn it half round and add it. L2\'s arrow, turned round, sits on the tip of L1\'s, and the arrow closing them is √3, about 1.732, times as long, turned 30° from L1\'s. So 230 × 1.732 = 398.4 V, which the trade rounds to the 400 V of a UK three-phase board. 460 V adds the two as plain numbers, as if they peaked together.' },
    { show: true, key: 'starI', name: 'Star: the currents', card: 'main', dur: 3.8,
      text: 'Now the currents. Each line runs straight into one winding and one load, with nothing branching off, so the *line current* is the phase current. Each load is 23 Ω at a power factor of 0.8, so each phase carries 230 ÷ 23 = 10 A, 36.9° behind its own voltage. At the star point the three currents meet and go back along the *neutral*, which carries all three added as arrows.' },
    { key: 'neutral', name: 'The neutral', card: 'main', rdur: 2.0,
      task: 'Three 10 A phase currents meet at the star point. What does the neutral carry?',
      opts: ['30 A', '10 A', '0 A'], want: '0 A',
      hint: 'Not quite. Add them as arrows, tip to tail.',
      hints: { '30 A': 'Not quite. The three currents peak at different moments, so they add as arrows, not as numbers.',
        '10 A': 'Not quite. Lay them tip to tail: the last tip lands back on the first tail.' },
      why: 'Laid tip to tail, three equal arrows 120° apart close a triangle. The last tip lands back on the first tail, so their sum is nothing: at every instant, what flows out along one line flows back along the other two. A balanced load leaves the neutral carrying nothing, so a load that is always balanced can be fed by the three lines alone.' },
    { show: true, key: 'unbal', name: 'Unbalance', card: 'main', free: 'l3', dur: 3.8,
      text: 'The slider is yours now: L3\'s load current. L1 and L2 stay at 10 A. As L3 falls, the triangle stops closing and the neutral\'s arrow grows across the gap. Each phase still shares an equal part, L3\'s current, which cancels as before. What is left is L1\'s and L2\'s extra, two equal arrows 120° apart, whose sum is one arrow just as long. So the neutral carries 10 A minus L3\'s current: 4 A with L3 at 6 A, and 10 A with L3 off.' },
    { key: 'n5', name: '10, 10 and 5', card: 'main', free: 'l3', freeAfter: true, l3: 5, rdur: 2.1,
      task: 'L1 and L2 carry 10 A, and L3 carries 5 A. What does the neutral carry?',
      opts: ['5 A', '25 A', '0 A'], want: '5 A',
      hint: 'Not quite. Find the equal part first.',
      hints: { '25 A': 'Not quite. They are 120° apart, so most of them cancel.',
        '0 A': 'Not quite. Only equal currents cancel completely.' },
      why: 'The equal part, 5 A in each phase, closes a triangle and cancels. What is left is L1\'s and L2\'s extra 5 A, two equal arrows 120° apart, whose sum is one 5 A arrow. So the neutral carries 5 A, not 25 A. That cancelling holds for sine-wave currents; currents with harmonics at three times the supply frequency add in the neutral instead.' },
    { show: true, key: 'delta', name: 'Delta', card: 'main', conn: 'delta', dur: 4.2,
      text: 'The switch now joins the same loads in *delta*, on the same supply. Each load sits between two lines, in a ring, with no star point and no neutral. So each has the line voltage across it, 398.4 V, and draws 398.4 ÷ 23 = 17.32 A. At L1\'s corner, L1 brings the current of the load that starts there, less the current the other load delivers back into that corner. That is the difference of two phase currents 120° apart, the same subtraction as before, now on the currents: 17.32 × 1.732 = 30.0 A.' },
    { key: 'deltaI', name: 'Delta: the line current', card: 'main', conn: 'delta', rdur: 2.0,
      task: 'In delta, each load draws 17.32 A. What does the clamp on L1 read?',
      opts: ['34.6 A', '17.32 A', '30.0 A'], want: '30.0 A',
      hint: 'Not quite. Two loads meet at L1\'s corner.',
      hints: { '34.6 A': 'Not quite. They are 120° apart, and L1 carries their difference.',
        '17.32 A': 'Not quite. That is star\'s rule; in delta two loads meet at every line.' },
      why: 'L1\'s corner joins two loads. L1 brings the current of the load that starts there, less the current of the load that ends there: two phase currents 120° apart. Turn the second half round and lay it on the tip of the first, and the arrow closing them is √3 times as long, 17.32 × 1.732 = 30.0 A. The √3 has moved from the voltage to the current. 34.6 A adds them as plain numbers, as if they peaked together.' },
    { show: true, key: 'power', name: 'Power, either way', card: 'main', free: 'conn', dur: 3.2,
      text: 'Each load takes V_ph × I_ph × cos φ, lesson 8\'s true power, so three take 3 × V_ph × I_ph × cos φ. In star, V_ph = V_L ÷ √3 and I_ph = I_L. In delta, V_ph = V_L and I_ph = I_L ÷ √3. Either way one √3 divides into the 3 and leaves √3 × V_L × I_L × cos φ, so the two readouts always agree. Flip the switch and watch both: 5520 W in star, 16,560 W in delta.' },
    { key: 'p3', name: 'Star to delta', card: 'main', free: 'conn', freeAfter: true, rdur: 2.1,
      task: 'In star these loads take 5.52 kW. Joined in delta on the same supply, what do they take?',
      opts: ['5.52 kW', '16.56 kW', '9.56 kW'], want: '16.56 kW',
      hint: 'Not quite. Follow the voltage across one load.',
      hints: { '5.52 kW': 'Not quite. The loads are the same, but the voltage across each is not.',
        '9.56 kW': 'Not quite. The current through each rises by √3 too.' },
      why: 'In delta each load has √3 times the voltage across it, 398.4 V instead of 230 V, so it draws √3 times the current, 17.32 A instead of 10 A. Its power goes with both, so it rises √3 × √3 = 3 times: 3 × 5.52 = 16.56 kW. Fixed loads such as heaters, moved from star to delta on the same supply, take three times the power.' },
    { key: 'board', name: 'Mixed: a board', card: 'board', conn: 'unknown', rdur: 1.8,
      task: 'Mixed. A board reads 400 V between lines. A balanced load draws 20 A a line at a power factor of 0.85, and you cannot see how it is joined. What power does it take?',
      opts: ['11.8 kW', '20.4 kW', '6.8 kW'], want: '11.8 kW',
      hint: 'Not quite. Which formula takes line values?',
      hints: { '20.4 kW': 'Not quite. 3 goes with phase values; with line values the factor is √3.',
        '6.8 kW': 'Not quite. That is the single-phase formula on line values; three phases need the √3.' },
      why: 'Line readings give the power without your knowing the connection: √3 × 400 × 20 × 0.85 = 11,778 W, about 11.8 kW. Check it both ways. In star each load has 400 ÷ 1.732 = 230.9 V and carries 20 A, and 3 × 230.9 × 20 × 0.85 gives the same. In delta each has 400 V and carries 20 ÷ 1.732 = 11.55 A, and 3 × 400 × 11.55 × 0.85 gives the same again.' },
    { key: 'motor', name: 'Mixed: a delta motor', card: 'motor', conn: 'delta', rdur: 2.0,
      task: 'Mixed. A motor\'s windings are joined in delta, and the clamp reads 26 A on one line. What current flows in each winding?',
      opts: ['26 A', '45.0 A', '15.0 A'], want: '15.0 A',
      hint: 'Not quite. In delta, where does the √3 go?',
      hints: { '26 A': 'Not quite. That is star\'s rule.',
        '45.0 A': 'Not quite. In delta the line carries more than the winding, not less.' },
      why: 'In delta each line joins two windings and carries the difference of their currents, √3 times one of them. So each winding carries the line current ÷ √3: 26 ÷ 1.732 = 15.0 A. Two 15.0 A arrows 120° apart differ by an arrow 26 A long.' },
  ];
  const FINISH = 'The √3 comes from subtracting two equal arrows 120° apart: it lands on the voltage in star and on the current in delta. A motor\'s windings are joined in star or delta too, and the courses after this one take three-phase on to transformers, ships\' systems and motors.';
  // Sources the checks restate (the lesson's own).
  const L13B = 'https://engineering.louisville.edu/raise/ECE252/L13B.htm';
  const ENA = 'https://www.energynetworks.org/industry/engineering-and-technical-programmes/statutory-voltage-limits';
  const KUPH10 = 'http://www.ibiblio.org/kuphaldt/electricCircuits/AC/AC_10.html';
  const OSU = 'https://web.engr.oregonstate.edu/~webbky/ENGR202_files/SECTION%207%20Three%20Phase%20Circuit%20Fundamentals.pdf';
  const HYPER = 'http://www.hyperphysics.gsu.edu/hbase/electric/powerac.html';

  const PICK = 'Tap one of the answers.';
  const FADE = 0.35;
  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const testing = () => document.documentElement.classList.contains('k-testing');
  const el = (id) => document.getElementById(id);

  // ---------- each step's state ----------
  // pick, res ('right', 'wrong' or 'empty' once checked), why: the puzzle. l3, conn: what Dan has set
  // on a screen with a free control (null: the screen's own).
  function blank() { return { pick: null, res: null, why: false, l3: null, conn: null }; }
  let S = STEPS.map(() => blank());
  let finished = false, lastStep = -1, lastDone = false, T = Infinity, MODE = 'demo', motionEnd = 0;
  let REC = {}, BOX = [];
  const isRight = (i, st) => st.pick != null && st.pick === STEPS[i].want;
  const hintFor = (i, st) => { const d = STEPS[i]; return (d.hints && d.hints[st.pick]) || d.hint; };

  // Text with highlighted key terms (*term*), and V_ph, I_ph, V_L, I_L set with a lowered part, built with K.el.
  function write(node, s) {
    node.textContent = '';
    String(s || '').split(/(\*[^*]+\*|[VI]_(?:ph|L))/).forEach((b) => {
      if (!b) return;
      if (/^[VI]_(ph|L)$/.test(b)) node.append(b.charAt(0), K.el('sub', {}, b.slice(2)));
      else if (b.charAt(0) === '*' && b.length > 2 && b.charAt(b.length - 1) === '*') node.appendChild(K.el('mark', {}, b.slice(1, -1)));
      else node.appendChild(document.createTextNode(b));
    });
  }

  // ---------- controls ----------
  const stepper = K.stepper({ id: 'step', label: 'Step', steps: STEPS.map((d) => d.name), value: 0, compact: true, into: '#prog' });
  const at = () => stepper.get();
  const pickBtns = [0, 1, 2].map((k) => K.button({ label: 'Answer ' + (k + 1), secondary: true, into: '#picks', press: () => {
    const i = at(), d = STEPS[i], st = S[i];
    if (finished || d.show || !d.opts || k >= d.opts.length || st.res === 'right') return;
    const was = st.res === 'wrong';
    st.pick = d.opts[k]; st.res = null;
    if (was) { anim.pause(); T = Infinity; }
  } }));
  const checkBtn = K.button({ label: 'Check', into: '#acts', press: () => {
    const i = at(), d = STEPS[i], st = S[i];
    if (d.show || finished) return;
    if (st.pick == null) { st.res = 'empty'; return; }
    st.res = isRight(i, st) ? 'right' : 'wrong';
    play('answer', st.res === 'right' ? d.rdur : 0.8);
  } });
  const whyBtn = K.button({ label: 'Why?', secondary: true, into: '#acts', press: () => {
    if (STEPS[at()].show || finished) return;
    const st = S[at()]; st.why = !st.why;
  } });
  const replayBtn = K.button({ label: 'Replay', secondary: true, into: '#replay', press: () => {
    const d = STEPS[at()], st = S[at()];
    if (!d.show || finished) return;
    st.l3 = null; st.conn = null;
    play('demo', d.dur);
  } });
  const backBtn = K.button({ label: 'Back', secondary: true, into: '#nav', press: () => {
    if (finished) { finished = false; return; }
    stepper.set(Math.max(0, at() - 1), true);
  } });
  const nextBtn = K.button({ label: 'Continue', into: '#nav', press: () => {
    const i = at();
    if (finished || (!STEPS[i].show && S[i].res !== 'right')) return;
    if (i < STEPS.length - 1) { stepper.set(i + 1, true); return; }
    finished = true;
    if (typeof K.complete === 'function') K.complete();
  } });
  K.button({ label: 'Start again', secondary: true, into: '#again', press: () => {

  } });

      });

    if (s.vm != null) {

    }

  // ---------- the arrows ----------
  function drawPanel(p, top) {
    REC.ph = null;
    if (!p) return top;
    const items = [], arcs = [];
    let O = [0, 0], bottom = top, askAt = null;
    const ph = { type: p.type, arrows: {}, starts: {} };
    const P = (o, v, k) => [o[0] + v[0] * k, o[1] + v[1] * k];
    const put = (name, s0, e, cls, hcls, a, lab, lcls, k) => {
      if (!(a > 0.001) || Math.hypot(e[0] - s0[0], e[1] - s0[1]) < 0.5) return;
      items.push({ s: s0, e, cls, hcls, a, lab, lcls });
      if (name && a >= 0.999) { ph.arrows[name] = [(e[0] - s0[0]) / k, (e[1] - s0[1]) / k]; ph.starts[name] = [(s0[0] - O[0]) / k, (s0[1] - O[1]) / k]; }
    };
    if (p.type === 'v') {
      O = [120, top + 70]; bottom = top + 136;
      const v = TH.map((t) => pol(VPH, t)), tip1 = P(O, v[0], KV);
      put('L1', O, tip1, 'a1', 'h1', 1, 'L1', 'lb', KV);
      put('L2', O, P(O, v[1], KV), 'a2', 'h2', 1, 'L2', 'lb', KV);
      put('L3', O, P(O, v[2], KV), 'a3', 'h3', 1, 'L3', 'lb', KV);
      if (p.copyA > 0.001) { const cs = vmix(O, tip1, p.slide); put('copy', cs, P(cs, pol(VPH, -120 + 180 * p.rot), KV), 'c2', 'h2', p.copyA, null, null, KV); }
      put('bold', O, P(O, vsub(v[0], v[1]), KV), 'aB', 'hB', p.boldA, 'L1 − L2', 'nv', KV);
      if (p.ask) askAt = P(O, vsub(v[0], v[1]), KV * 0.55);
    } else if (p.type === 'i') {
      O = [140, top + 72]; bottom = top + 138;
      TH.forEach((t) => put(null, O, P(O, pol(VPH, t), KV), 'vref', 'vrefh', 1, null, null, KV));
      const I = [pol(IS, -PHI), pol(IS, -120 - PHI), pol(p.l3, 120 - PHI)];
      const st = [O, vmix(O, P(O, I[0], KIS), p.lay), vmix(O, P(O, vadd(I[0], I[1]), KIS), p.lay)];
      st.forEach((s0, k) => put('L' + (k + 1), s0, P(s0, I[k], KIS), 'a' + (k + 1), 'h' + (k + 1), p.aI[k], 'L' + (k + 1), 'lb', KIS));
      arcs.push({ r: 20, a0: 0, a1: -PHI, a: p.phiA, lab: 'φ' });
      const N = vadd(vadd(I[0], I[1]), I[2]);
      if (p.lay >= 0.999 && vlen(N) > 0.05) put('neutral', O, P(O, N, KIS), 'aB', 'hB', p.nA, 'neutral', 'nv', KIS);
    } else if (p.type === 'd') {
      O = [130, top + 68]; bottom = top + 134;
      const a = pol(ID, 30 - PHI), b = pol(ID, -90 - PHI), c = pol(ID, 150 - PHI), tipA = P(O, a, KID);
      put('a', O, tipA, 'a1', 'h1', p.aI, 'load L1–L2', 'lb', KID);
      put('b', O, P(O, b, KID), 'a2', 'h2', p.aI, 'load L2–L3', 'lb', KID);
      put('c', O, P(O, c, KID), 'a3', 'h3', p.aI, 'load L3–L1', 'lb', KID);
      if (p.copyA > 0.001) { const cs = vmix(O, tipA, p.slide); put('copy', cs, P(cs, pol(ID, 150 - PHI + 180 * p.rot), KID), 'c3', 'h3', p.copyA, null, null, KID); }
      put('bold', O, P(O, vsub(a, c), KID), 'aB', 'hB', p.boldA, 'line L1', 'nv', KID);
      if (p.ask) askAt = P(O, vsub(a, c), KID * 0.55);
    } else if (p.type === 'p') {
      O = [96, top + 18]; bottom = top + 66;
      text(8, O[1] + 5, 'one load', 'tk', 'start');
      put('V', O, P(O, pol(mix(VPH, VLL, p.cv), 0), KV), 'a1', 'h1', 1, 'V_ph', 'lb', KV);
      put('I', O, P(O, pol(mix(IS, ID, p.cv), -PHI), KID), 'a2', 'h2', 1, 'I_ph', 'lb', KID);
      arcs.push({ r: 16, a0: 0, a1: -PHI, a: 1, lab: 'φ' });
    } else if (p.type === 'm') {
      O = [120, top + 60]; bottom = top + 116;
      const w12 = pol(MW, 0), w31 = pol(MW, 120), tipA = P(O, w12, KID);
      put('bold', O, P(O, vsub(w12, w31), KID), 'aB', 'hB', 1, 'line L1', 'nv', KID);
      put('a', O, tipA, 'a1', 'h1', p.aW[0], 'winding 1–2', 'lb', KID);
      put('c', O, P(O, w31, KID), 'a3', 'h3', p.aW[1], 'winding 3–1', 'lb', KID);
      if (p.copyA > 0.001) { const cs = vmix(O, tipA, p.slide); put('copy', cs, P(cs, pol(MW, 120 + 180 * p.rot), KID), 'c3', 'h3', p.copyA, null, null, KID); }
      if (p.ask) askAt = P(O, w31, KID * 0.5);
    }
    // Everything a name must keep clear of: the shafts, the heads and the arcs.
    const segs = [];
    items.forEach((it) => {
      segs.push([it.s[0], it.s[1], it.e[0], it.e[1]]);
      const h = headOf(it.s[0], it.s[1], it.e[0], it.e[1]);

    });
    const arcPt = (r, ang) => [O[0] + r * Math.cos(ang * DEG), O[1] - r * Math.sin(ang * DEG)];
    arcs.forEach((ac) => { if (ac.a > 0.001) for (let j = 0; j < 8; j++) { const p0 = arcPt(ac.r, ac.a0 + (ac.a1 - ac.a0) * j / 8), p1 = arcPt(ac.r, ac.a0 + (ac.a1 - ac.a0) * (j + 1) / 8); segs.push([p0[0], p0[1], p1[0], p1[1]]); } });
    items.forEach((it) => part(it.a, 0, () => arrow(it.cls, it.hcls, it.s[0], it.s[1], it.e[0], it.e[1])));
    if (askAt) askMark(askAt);
    arcs.forEach((ac) => {
      if (!(ac.a > 0.001)) return;
      const p0 = arcPt(ac.r, ac.a0), p1 = arcPt(ac.r, ac.a1);
      part(ac.a, 0, () => path('arc', 'M' + R2(p0[0]) + ' ' + R2(p0[1]) + 'A' + ac.r + ' ' + ac.r + ' 0 0 ' + (ac.a1 > ac.a0 ? 0 : 1) + ' ' + R2(p1[0]) + ' ' + R2(p1[1])));
      // The angle's name inside its wedge, beyond the arc, only where the wedge has room.
      const mid = (ac.a0 + ac.a1) / 2, w = tw(ac.lab, 'lb');
      for (let r = ac.r + 8; r <= ac.r + 40; r += 2) {
        const c = arcPt(r, mid), b = [c[0] - w / 2, c[1] - 7, c[0] + w / 2, c[1] + 8];
        if (clearOf(b, segs) && apart(b)) { BOX.push(b); part(ac.a, 0, () => text(c[0], c[1] + 4.5, ac.lab, 'lb', 'middle')); break; }
      }
    });
    items.forEach((it) => {
      if (!it.lab) return;
      const f = spotFor(it.lab, it.lcls, candsFor(it.s, it.e), segs, top);
      BOX.push(f.b);
      part(it.a, 0, () => text(f.c[0], f.c[1], it.lab, it.lcls, f.c[2]));
    });
    ph.O = O;
    REC.ph = ph;
    return bottom;
  }

  // ---------- the working and the power readouts ----------
  function drawRows(rows, y) {
    rows.forEach((r) => {
      y += 22; const yy = y;
      r.forEach((v) => { if (v[1] > 0.001) part(v[1], 0, () => text(8, yy, v[0], 'wk', 'start')); if (v[1] >= 0.999) REC.rows.push(v[0]); });

  function drawBoxes(b, y) {
    if (!b) return y;

    if (b.kind === 'main') {
      const [a0, a1] = dip(b.cv), ws = powerOf('star'), wd = powerOf('delta');
      REC.pw = b.cv >= 0.5 ? wd : ws;
      boxes = [{ head: '3 × V_ph × I_ph × cos φ', slots: [[[phStr(ws), a0], [phStr(wd), a1]]] },
        { head: '√3 × V_L × I_L × cos φ', slots: [[[lnStr(ws), a0], [lnStr(wd), a1]]] }];
    } else {
      const Pl = R3 * BV * BI * BPF, Vs = BV / R3, Id = BI / R3;

      boxes = [{ head: '√3 × V_L × I_L × cos φ', slots: [[['? W', 1 - b.la], ['√3 × ' + num(BV, 1) + ' × ' + num(BI, 2) + ' × ' + num(BPF, 2) + ' = ' + watts(Pl), b.la]]] },
        { head: '3 × V_ph × I_ph × cos φ', slots: [[['? W', 1 - b.sa], ['star: 3 × ' + num(Vs, 1) + ' × ' + num(BI, 2) + ' × ' + num(BPF, 2) + ' = ' + watts(REC.pw.star), b.sa]],
          [['delta: 3 × ' + num(BV, 1) + ' × ' + num(Id, 2) + ' × ' + num(BPF, 2) + ' = ' + watts(REC.pw.delta), b.da]]] }];

        text(16, y0 + 19, bx.head, 'tk', 'start');
        bx.slots.forEach((sl, j) => sl.forEach((v) => { if (v[1] > 0.001) part(v[1], 0, () => text(16, y0 + 39 + 19 * j, v[0], 'wk', 'start')); }));
      });

  }

  function drawScreen(d, st, i) {
    const s = stateOf(i, st);

    BOX = [];
    let y = drawCircuit(d, s);
    y = drawPanel(s.ph, y + 4);
    y = drawRows(s.rows, y);
    y = drawBoxes(s.boxes, y);
    const items = [];
    if (s.cl.length || s.cn.length) items.push({ sw: swRing, label: 'clamp meter' });
    if (s.ph && (s.ph.type === 'v' || s.ph.type === 'd' || s.ph.type === 'm')) items.push({ sw: swLine(s.ph.type === 'v' ? 'c2' : 'c3'), label: 'an arrow turned half round' });
    if (s.ph && s.ph.type === 'i') items.push({ sw: swLine('vref'), label: 'phase voltages' });
    if (items.length) y = keyRows(items, y + 26);

  function paint(i) {
    if (i == null) i = at();

    into = null;
    REC = {};

  }

  // ---------- the model: line voltage, line current (L1) and neutral current ----------
  function modelOf(p) {
    const d = STEPS[K.clamp(Math.round(Number(p.step)) || 0, 0, STEPS.length - 1)];
    if (d.card === 'board') return { lineVolts: BV, lineAmps: BI, neutralAmps: 0 };

    if (conn === 'delta') return { lineVolts: VLL, lineAmps: ILD, neutralAmps: 0 };
    return { lineVolts: VLL, lineAmps: IS, neutralAmps: vlen(neutralOf(l3)) };

  K.model(modelOf);

  write(el('finish'), FINISH);
  K.update((p) => {
    const i = Math.round(p.step), d = STEPS[i], st = S[i];
    if (!anim.playing() && !waiting) T = Infinity;

  });

  // ---------- known answers, worked out by hand ----------
  const DO = STEPS.map((d, i) => i).filter((i) => !STEPS[i].show);
  const solvedSt = (i) => Object.assign(blank(), { pick: STEPS[i].want, res: 'right' });
  const wrongSt = (i, o) => Object.assign(blank(), { pick: o, res: 'wrong' });
  const idx = (key) => STEPS.findIndex((d) => d.key === key);
  const near = (a, b, tol) => typeof a === 'number' && typeof b === 'number' && Math.abs(a - b) <= tol;
  function drawn(i, st, mode, t) {
    const keepS = S[i], keepT = T, keepM = MODE;
    S[i] = st; T = t == null ? Infinity : t; MODE = mode || (STEPS[i].show ? 'demo' : 'answer');

      return Object.assign({}, REC);
    } finally { S[i] = keepS; T = keepT; MODE = keepM; paint(); }
  }
  const settledOf = (i) => drawn(i, STEPS[i].show ? blank() : solvedSt(i));
  const withL3 = (v) => Object.assign(blank(), { l3: v });
  const withConn = (c) => Object.assign(blank(), { conn: c });
  const has = (g, s) => g.rows.indexOf(s) >= 0;
  const angBetween = (a, b) => Math.abs(((vang(a) - vang(b)) % 360 + 540) % 360 - 180);
  const S_STARV = idx('starV'), S_LINEV = idx('lineV'), S_STARI = idx('starI'), S_NEUT = idx('neutral'), S_UNB = idx('unbal'), S_N5 = idx('n5');
  const S_DELTA = idx('delta'), S_DELTAI = idx('deltaI'), S_POW = idx('power'), S_P3 = idx('p3'), S_BOARD = idx('board'), S_MOTOR = idx('motor');

  K.check('For a three-phase generator, three coils of wire are placed at angles of 120° to each other: the three phase voltage arrows are drawn equal, 230 V each, 120° apart, and so are the three 10 A star currents', () => {
    const g = settledOf(S_STARV).ph.arrows, h = settledOf(S_STARI).ph.arrows;
    const eq = (A, n, v) => ['L1', 'L2', 'L3'].every((k) => !!A[k] && near(vlen(A[k]), v, 1e-9)) &&
      near(angBetween(A.L1, A.L2), 120, 1e-9) && near(angBetween(A.L2, A.L3), 120, 1e-9) && near(angBetween(A.L3, A.L1), 120, 1e-9);
    return eq(g, 3, 230) && eq(h, 3, 10);
  }, { source: L13B });
  K.check('UK mains electricity operates at a nominal voltage of 230V: the voltmeter across one winding reads V_ph = 230 V, and every star current drawn is 230 ÷ 23 = 10 A', () => {
    const g0 = drawn(S_STARV, blank(), 'demo', 0), h = settledOf(S_STARI);
    return !!g0.vm && g0.vm.lab === 'V_ph = 230 V' && near(g0.vm.pos, 0, 1e-12) && has(h, 'each phase: 230 ÷ 23 = 10 A') && near(vlen(h.ph.arrows.L1), VPH / ZL, 1e-9);
  }, { source: ENA });
  K.check('In balanced Y circuits, line voltage is equal to phase voltage times the square root of 3, while line current is equal to phase current: the bold arrow is 1.732 times a phase arrow, landing on the voltmeter\'s 398.4 V between L1 and L2, and the clamp on L1 reads the 10.00 A each phase carries', () => {
    const g = settledOf(S_STARV), h = settledOf(S_STARI), m = K.at({ step: S_STARV }), n = K.at({ step: S_STARI });

      near(m.lineVolts, vlen(g.ph.arrows.bold), 1e-9) && h.cl === 'I_L = 10.00 A' && near(n.lineAmps, vlen(h.ph.arrows.L1), 1e-9);
  }, { source: KUPH10 });
  K.check('The line voltage can be found by taking the phasor sum of the voltage in two phases of the source: the bold arrow closes L1\'s arrow and L2\'s turned half round, laid on L1\'s tip, and is turned 30° from L1\'s', () => {
    const g = settledOf(S_LINEV).ph, A = g.arrows, c = A.copy, s0 = g.starts.copy;
    return !!c && !!A.bold && near(s0[0], A.L1[0], 1e-9) && near(s0[1], A.L1[1], 1e-9) && near(c[0], -A.L2[0], 1e-9) && near(c[1], -A.L2[1], 1e-9) &&
      near(A.bold[0], A.L1[0] + c[0], 1e-9) && near(A.bold[1], A.L1[1] + c[1], 1e-9) && near(vang(A.bold) - vang(A.L1), 30, 1e-9);
  }, { source: L13B });
  K.check('The neutral conductor carries no current in a balanced three-phase network: three 10 A currents laid tip to tail close a triangle, so no neutral arrow is left and the neutral clamp reads 0.0 A', () => {
    const g = settledOf(S_NEUT), A = g.ph.arrows, st = g.ph.starts;
    const end3 = [st.L3[0] + A.L3[0], st.L3[1] + A.L3[1]];
    return g.cn === 'neutral 0.0 A' && near(st.L2[0], A.L1[0], 1e-9) && near(st.L2[1], A.L1[1], 1e-9) && near(vlen(end3), 0, 1e-9) && !A.neutral &&
      near(K.at({ step: S_NEUT }).neutralAmps, 0, 1e-9);
  }, { source: OSU });
  K.check('Unbalance: at every L3 current from 0 to 10 A the neutral arrow closes the gap and is 10 A minus L3\'s current (4.0 A at 6 A, 5.0 A at 5 A, 10.0 A with L3 off), and the clamp and the model agree', () => {
    for (let v = 0; v <= 10; v += 0.5) {
      const g = drawn(S_UNB, withL3(v)), N = IS - v, A = g.ph.arrows, nl = A.neutral ? vlen(A.neutral) : 0;
      if (!(near(nl, N, 1e-9) && g.cn === 'neutral ' + fx(N, 1) + ' A' && near(K.at({ step: S_UNB, l3: v }).neutralAmps, N, 1e-9))) return false;
      if (A.neutral && A.L3) { const e = [g.ph.starts.L3[0] + A.L3[0], g.ph.starts.L3[1] + A.L3[1]]; if (!(near(e[0], A.neutral[0], 1e-9) && near(e[1], A.neutral[1], 1e-9))) return false; }
    }
    return settledOf(S_UNB).cn === 'neutral 4.0 A' && drawn(S_UNB, withL3(0)).cn === 'neutral 10.0 A' && settledOf(S_N5).cn === 'neutral 5.0 A' &&
      near(K.at({ step: S_N5, l3: 5 }).neutralAmps, 5, 1e-9);
  });
  K.check('P T = √3 V L I L cosθ where cosθ is the power factor: in star and in delta the readout 3 × V_ph × I_ph × cos φ equals √3 × V_L × I_L × cos φ (5520 W and 16,560 W), and on the board both ways give 11,778 W', () => {
    const s0 = drawn(S_POW, withConn('star')), s1 = drawn(S_POW, withConn('delta')), b = settledOf(S_BOARD);
    const both = (g, a, c) => g.boxes.indexOf(a) >= 0 && g.boxes.indexOf(c) >= 0;
    return both(s0, '3 × 230 × 10 × 0.8 = 5520 W', '√3 × 398.4 × 10 × 0.8 = 5520 W') && both(s1, '3 × 398.4 × 17.32 × 0.8 = 16,560 W', '√3 × 398.4 × 30 × 0.8 = 16,560 W') &&
      near(s0.pw.Pp, s0.pw.Pl, 1e-6) && near(s1.pw.Pp, s1.pw.Pl, 1e-6) && near(s1.pw.Pl / s0.pw.Pl, 3, 1e-9) &&
      b.boxes.indexOf('√3 × 400 × 20 × 0.85 = 11,778 W') >= 0 && b.boxes.indexOf('star: 3 × 230.9 × 20 × 0.85 = 11,778 W') >= 0 && b.boxes.indexOf('delta: 3 × 400 × 11.55 × 0.85 = 11,778 W') >= 0 &&
      near(b.pw.star, b.pw.line, 1e-6) && near(b.pw.delta, b.pw.line, 1e-6);
  }, { source: L13B });
  K.check('The average power can be expressed as P avg = VI cosφ: one load\'s drawn voltage and current are each √3 times longer in delta, the angle between them stays 36.9°, and V_ph × I_ph × cos φ goes from 1840 W to 5520 W, a third of each readout', () => {
    const a = drawn(S_POW, withConn('star')).ph.arrows, b = drawn(S_POW, withConn('delta')).ph.arrows;
    const p = (A) => vlen(A.V) * vlen(A.I) * Math.cos(angBetween(A.V, A.I) * DEG);
    return near(vlen(b.V) / vlen(a.V), R3, 1e-9) && near(vlen(b.I) / vlen(a.I), R3, 1e-9) && near(angBetween(a.V, a.I), PHI, 1e-9) && near(angBetween(b.V, b.I), PHI, 1e-9) &&
      fx(PHI, 1) === '36.9' && near(p(a), 1840, 1e-6) && near(p(b), 5520, 1e-6) && near(3 * p(a), powerOf('star').Pp, 1e-6) && near(3 * p(b), powerOf('delta').Pp, 1e-6);
  }, { source: HYPER });
  K.check('Delta: L1\'s bold arrow is load L1–L2\'s current minus load L3–L1\'s, 17.32 × √3 = 30.00 A, which the clamp on L1 reads; and for the motor two 15.0 A winding currents differ by the clamp\'s 26 A', () => {
    const g = settledOf(S_DELTAI), A = g.ph.arrows, h = settledOf(S_DELTA), m = settledOf(S_MOTOR), M = m.ph.arrows;
    return !!A.bold && near(A.bold[0], A.a[0] - A.c[0], 1e-9) && near(A.bold[1], A.a[1] - A.c[1], 1e-9) && near(vlen(A.a), ID, 1e-9) && fx(vlen(A.a), 2) === '17.32' &&
      fx(vlen(A.bold), 2) === '30.00' && g.cl === 'I_L = 30.00 A' && h.cl === 'I_L = 30.00 A' && near(K.at({ step: S_DELTAI }).lineAmps, vlen(A.bold), 1e-9) &&
      has(g, 'L1: 17.32 × 1.732 = 30.00 A') && has(h, 'each load: 398.4 ÷ 23 = 17.32 A') &&
      !!M.a && !!M.c && near(vlen(M.a), MW, 1e-9) && near(M.bold[0], M.a[0] - M.c[0], 1e-9) && near(M.bold[1], M.a[1] - M.c[1], 1e-9) && near(vlen(M.bold), 26, 1e-9) &&
      m.cl === 'I_L = 26.00 A' && has(m, 'each winding: 26 ÷ 1.732 = 15.0 A');
  });
  K.check('Known answers and slips: 398.4 V and the slip 460 V; 30 A and 25 A added as numbers; 17.32 A, 30.0 A and the slip 34.6 A; 5.52 kW, 16.56 kW and the slip 9.56 kW; 11.8 kW and the slips 20.4 kW and 6.8 kW; 15.0 A and the slip 45.0 A', () => {
    return fx(VLL, 1) === '398.4' && 2 * VPH === 460 && 3 * IS === 30 && IS + IS + 5 === 25 && fx(ID, 2) === '17.32' && fx(ILD, 1) === '30.0' && fx(2 * ID, 1) === '34.6' &&
      fx(powerOf('star').Pp / 1000, 2) === '5.52' && fx(powerOf('delta').Pp / 1000, 2) === '16.56' && fx(powerOf('star').Pp * R3 / 1000, 2) === '9.56' &&
      fx(R3 * BV * BI * BPF / 1000, 1) === '11.8' && fx(3 * BV * BI * BPF / 1000, 1) === '20.4' && fx(BV * BI * BPF / 1000, 1) === '6.8' &&
      fx(MI / R3, 1) === '15.0' && fx(MI * R3, 1) === '45.0' && fx(VPH * 1.732, 1) === '398.4' && fx(17.32 * 1.732, 2) === '30.00' && fx(26 / 1.732, 1) === '15.0';
  });
  K.check('Each puzzle accepts only its right answer; before an answer its picture hides what is asked, and a right answer draws it', () => {
    const PRE = {
      lineV: (g) => !!g.vm && g.vm.lab === 'V_L = ? V' && !g.ph.arrows.bold && !g.ph.arrows.copy && has(g, 'line: L1 − L2 = ?'),
      neutral: (g) => g.cn === 'neutral ? A' && near(vlen(g.ph.starts.L2), 0, 1e-9) && has(g, 'neutral: the three added as arrows = ?'),
      n5: (g) => g.cn === 'neutral ? A' && !g.ph.arrows.neutral && near(vlen(g.ph.starts.L2), 0, 1e-9) && has(g, 'L1 10 A · L2 10 A · L3 5 A'),
      deltaI: (g) => g.cl === 'I_L = ? A' && !g.ph.arrows.bold && has(g, 'L1: load L1–L2 less load L3–L1 = ?'),
      p3: (g) => near(g.cv, 0, 1e-12) && g.boxes.indexOf('3 × 230 × 10 × 0.8 = 5520 W') >= 0 && g.boxes.every((b) => b.indexOf('16,560') < 0) && has(g, 'in delta: ? W'),
      board: (g) => g.boxes.length === 2 && g.boxes.every((b) => b === '? W'),
      motor: (g) => !g.ph.arrows.a && !g.ph.arrows.c && near(vlen(g.ph.arrows.bold), 26, 1e-9) && has(g, 'each winding = ?'),
    };
    const POST = {
      lineV: (g) => g.vm.lab === 'V_L = 398.4 V' && !!g.ph.arrows.bold && has(g, 'line: L1 − L2 = 230 × 1.732 = 398.4 V'),
      neutral: (g) => g.cn === 'neutral 0.0 A' && has(g, 'tip to tail they close: nothing is left'),
      n5: (g) => g.cn === 'neutral 5.0 A' && !!g.ph.arrows.neutral && near(vlen(g.ph.arrows.neutral), 5, 1e-9) && has(g, 'L1\'s and L2\'s extra 5 A is left'),
      deltaI: (g) => g.cl === 'I_L = 30.00 A' && !!g.ph.arrows.bold && has(g, 'L1: 17.32 × 1.732 = 30.00 A'),
      p3: (g) => near(g.cv, 1, 1e-12) && g.boxes.indexOf('3 × 398.4 × 17.32 × 0.8 = 16,560 W') >= 0 && g.cl === 'I_L = 30.00 A' && has(g, '16,560 ÷ 5520 = 3, which is √3 × √3'),
      board: (g) => g.boxes.length === 3 && g.boxes.indexOf('√3 × 400 × 20 × 0.85 = 11,778 W') >= 0,
      motor: (g) => !!g.ph.arrows.a && !!g.ph.arrows.c && !!g.ph.arrows.copy && has(g, 'each winding: 26 ÷ 1.732 = 15.0 A'),
    };
    const only = DO.every((i) => { const d = STEPS[i]; return d.opts.indexOf(d.want) >= 0 && d.opts.every((o) => isRight(i, Object.assign(blank(), { pick: o })) === (o === d.want)); });
    const hidden = DO.every((i) => !!PRE[STEPS[i].key] && PRE[STEPS[i].key](drawn(i, blank())) === true);
    const shownOk = DO.every((i) => !!POST[STEPS[i].key] && POST[STEPS[i].key](settledOf(i)) === true);
    const wrongStill = DO.every((i) => STEPS[i].opts.filter((o) => o !== STEPS[i].want).every((o) => PRE[STEPS[i].key](drawn(i, wrongSt(i, o))) === true));
    return only && hidden && shownOk && wrongStill;
  });
  K.check('Every demonstration has finished arriving within 4.5 s of its screen opening, none starting before the 0.35 s screen fade ends; every answer\'s motion, right or wrong, within 2.5 s', () => {
    const keepT = T, keepM = MODE;
    const timed = (i, st, mode, limit) => {
      const keepS = S[i];
      T = Infinity; MODE = mode; latest = 0; earliest = Infinity; S[i] = st;
      try { paint(i); } finally { S[i] = keepS; }
      return latest <= limit + 1e-9;
    };
    const ok = STEPS.every((d, i) => {
      if (d.show) { const r = timed(i, blank(), 'demo', d.dur); return r && d.dur >= 3 && d.dur <= 4.5 && earliest >= FADE; }
      return timed(i, solvedSt(i), 'answer', d.rdur) && d.rdur <= 2.5 && d.opts.filter((o) => o !== d.want).every((o) => timed(i, wrongSt(i, o), 'answer', 0.8));
    });
    T = keepT; MODE = keepM; paint();
    return ok;
  });

  K.ready();
</script>
