<style>

  .tgrip { position: absolute; touch-action: pan-y; cursor: ew-resize; border-radius: 8px; }

  .scene .avg { fill: none; stroke: var(--pow); stroke-width: 1.8; stroke-dasharray: 6 4; }
  .scene .bad { fill: none; stroke: var(--k-warn); stroke-width: 2.2; stroke-dasharray: 6 4; stroke-linejoin: round; }

  .scene .cur { stroke: var(--k-accent2); stroke-width: 1.6; }

  .scene .dv { fill: var(--k-ink); stroke: var(--k-bg); stroke-width: 1.5; }
  .scene .dc { fill: var(--k-accent); stroke: var(--k-bg); stroke-width: 1.5; }
  .scene .dp { fill: var(--pow); stroke: var(--k-bg); stroke-width: 2; }
  .scene .dbad { fill: var(--k-warn); stroke: var(--k-bg); stroke-width: 2; }
  .scene .pen { fill: var(--pow); stroke: var(--k-bg); stroke-width: 2; }
  .scene .ring { fill: var(--k-bg); stroke: var(--k-accent2); stroke-width: 2; }

  .scene .tt { font: 600 14px var(--k-font); fill: var(--k-ink); }
  .scene .tk { font: 400 13px var(--k-font); fill: var(--k-muted); }
  .scene .tkc { font: 400 13px var(--k-font); fill: var(--k-accent); }
  .scene .ax { font: 600 13px var(--k-font); fill: var(--k-ink); }
  .scene .axc { font: 600 13px var(--k-font); fill: var(--k-accent); }
  .scene .wk { font: 500 13px var(--k-font); fill: var(--k-ink); }
  .scene .wk.em { font-weight: 700; fill: var(--pow); }
  .scene .ky { font: 400 13px var(--k-font); fill: var(--k-ink); }
  .scene .q { font: 700 14px var(--k-font); fill: var(--k-ink); }
  .scene #art * { pointer-events: none; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  .row .k-btn { flex: 1 1 7rem; }
  .replay { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 10px; }
  .replay .k-btn { flex: 0 0 auto; min-height: 44px; padding-left: 16px; padding-right: 16px; font-size: .95rem; white-space: nowrap; }
  /* The answers stay on one row, each label whole; longer ones stack one to a row. */
  .row.picks { flex-wrap: nowrap; }
  .picks .k-btn { font-size: 1.05rem; min-height: 56px; flex: 1 1 0; min-width: 0; white-space: nowrap; padding-inline: 6px; }

  .fb { font-weight: 700; min-height: 1.5em; margin-top: 10px; }

  html.k-testing #stepbox.enter, html.k-testing #done.enter { animation: none; }
  @media (prefers-reduced-motion: reduce) {
    #stepbox.enter, #done.enter { animation: none; }

<p class="caption">Elements, peaks and meter readings are example values; the power at each instant is the voltage × the current.</p>

<script>
  // ---------- the rule ----------
  // A resistor's current is its voltage ÷ its resistance at every instant, so the two waves keep step.
  // The power at an instant is that instant's voltage × that instant's current. For a sine it averages
  // half its top, which is the rms voltage × the rms current.
  const TAU = 2 * Math.PI, SPAN = 40, NS = 400, MORPH = 0.9, RT2 = Math.SQRT2;
  // Each card: a resistance R (Ω), a voltage peak Vp (V), a supply frequency f (Hz), and the graph
  // scales (Vax, Iax, Pax: what the half-height of each graph stands for). idp: decimals of the
  // current's peak tick. The mains heater is 230² ÷ 1000 = 52.9 Ω; the clamp-meter heater 230 ÷ 10 = 23 Ω;
  // the ship heater 440 ÷ 10 = 44 Ω; the 'tops' heater is sized so its humps top out at 3000 W.
  const CARDS = {
    test: { R: 10, Vp: 100, f: 50, Vax: 120, Iax: 20, Pax: 1200, idp: 0, title: (f) => '10 Ω element, 100 V peak, ' + f + ' Hz' },
    mains: { R: 230 * 230 / 1000, Vp: 230 * RT2, f: 50, Vax: 400, Iax: 12, Pax: 2400, idp: 2, title: () => '1 kW heater, 52.9 Ω, on 230 V mains' },
    clamp: { R: 230 / 10, Vp: 230 * RT2, f: 50, Vax: 400, Iax: 28, Pax: 5500, idp: 1, title: () => 'a clamp meter reads 10 A on a 230 V heater' },
    tops: { R: 2 * 230 * 230 / 3000, Vp: 230 * RT2, f: 50, Pax: 3600, compact: true, title: () => 'a heater\'s power humps, tops at 3000 W' },
    ship: { R: 440 / 10, Vp: 440 * RT2, f: 60, Vax: 750, Iax: 28, Pax: 10500, idp: 1, kw: true, title: () => 'a heater on 440 V at 60 Hz, drawing 10 A' },
  };
  // The waves on a card at frequency f (t in ms): voltage, current = voltage ÷ R, power = voltage × current.
  function waves(c, f) {
    const v = (t) => c.Vp * Math.sin(TAU * f * t / 1000);
    const i = (t) => v(t) / c.R;
    return { v, i, p: (t) => v(t) * i(t) };
  }
  // A number as the lesson writes it: at most dp decimals, no trailing zeros, a true minus sign.
  function num(v, dp) {
    dp = dp == null ? 2 : dp;
    const m = Math.pow(10, dp);
    let r = Math.round(v * m) / m;
    if (r === 0) r = 0;
    let s = r.toFixed(dp);
    if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
    return s.replace('-', '−');
  }
  // A reading with exactly dp decimals (the readouts' rounding), a true minus sign.
  function fx(v, dp) {
    const m = Math.pow(10, dp);
    let r = Math.round(v * m) / m;
    if (r === 0) r = 0;
    return r.toFixed(dp).replace('-', '−');
  }
  const mix = (a, b, t) => (t >= 1 ? b : t <= 0 ? a : a + (b - a) * t);
  const pwr = (c, w) => (c.kw ? num(w / 1000, 1) + ' kW' : num(w, 0) + ' W');
  const pwTick = (c, w) => (c.kw ? num(w / 1000, 1) : num(w, 0));

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // cur: 'live' (Dan drags the time cursor) or 'park' (fixed at t ms); sweep: the cursor's
  // demonstration moves [start s, seconds, from ms, to ms]; trace: how much of the power wave is drawn
  // ('reach': as far as the cursor has been; 'sweep': behind the sweep, then the next cycle).
  // part: a puzzle shows the power only up to this time; hidePow: the power is hidden until a right
  // answer. avg: the dashed average ('show', or 'ask' until a right answer); count: the humps-a-second
  // row; slips: what each wrong pick claims, drawn in red (a dot, a flat line or a wave).
  const STEPS = [
    { show: true, name: 'The power scrubber', card: 'test', cur: 'live', t: 5, trace: 'reach', dur: 3.4,
      sweep: [[0.4, 1.6, 5, 10], [2.4, 1.0, 10, 5]],
      text: 'The heater test\'s 10 Ω element on a 100 V peak, so its current peaks at 100 ÷ 10 = 10 A. The voltage and the dashed current top out together: they are *in phase*. Below is the *instantaneous power*, volts × amps as on DC, at each instant. Drag the time cursor and watch the dot ride it.' },
    { name: 'At the bottom', card: 'test', cur: 'park', t: 15, part: 10, rdur: 1.8,
      slips: { '−1000 W': { dot: -1000 }, '0 W': { dot: 0 } },
      task: 'The cursor is parked at 15 ms, the bottom of the cycle: −100 V and −10 A. What power does the element take at that instant?',
      opts: ['1000 W', '−1000 W', '0 W'], want: '1000 W',
      why: 'The power at an instant is that instant\'s voltage × its current: −100 × −10 = +1000 W, because a minus times a minus is a plus. The element heats whichever way the current flows, just as at the top of the wave. The power is zero only where both waves cross zero, at 0, 10 and 20 ms.',
      hint: 'Not quite. Multiply the two readings, signs and all.',
      hints: { '−1000 W': 'Not quite. Both readings are negative here. What is a minus times a minus?',
        '0 W': 'Not quite. The power is zero only where the waves cross zero. Here they are at their biggest.' } },
    { show: true, name: 'Two humps a cycle', card: 'test', cur: 'live', t: 20, trace: 'sweep', sweep: [[0.4, 2.0, 0, 20]],
      brackets: true, count: 'show', dur: 3.6, tl: { next: 2.5, b1: 1.4, b2: 2.4, count: 3.0 },
      text: 'Now the cursor sweeps one whole cycle, 20 ms, leaving a trace. While the voltage is forward the power rises to 1000 W and falls back: one hump, 10 ms long. While it is backward both readings are negative, and a minus times a minus is a plus: a second hump, just the same. So the power pulses at double the supply\'s frequency, two humps a cycle, 100 a second on 50 Hz.' },
    { name: 'On board ship', card: 'test', f: 60, hidePow: true, count: 'ask', rdur: 2.0,
      slips: { '60': { wave: 1 }, '240': { wave: 4 } },
      task: '60 Hz is the most common frequency on board ship. How many power humps a second does this element give there?',
      opts: ['60', '240', '120'], want: '120',
      why: 'Every cycle has a forward half and a backward half, and each gives a hump: 2 humps a cycle × 60 cycles a second = 120 humps a second. 60 would be one hump a cycle, as if the backward half gave nothing. 240 doubles twice.',
      hint: 'Not quite. Count the humps in one cycle, then the cycles in a second.',
      hints: { '60': 'Not quite. That is the supply\'s own frequency. Each cycle has a forward and a backward half.',
        '240': 'Not quite. That doubles twice. Each cycle gives two humps, not four.' } },
    { show: true, name: 'The average', card: 'test', cur: 'live', t: 5, avg: 'show', fold: true, derive: true, dur: 3.8,
      tl: { avg: 0.5, cap: 1.0, fold: [1.6, 1.2], r1: 2.6, r2: 2.9, rr: 3.2 },
      text: 'So how much heat does the element give on average? Its power is 100 sin × 10 sin = 1000 sin², 1000 W × the sine squared. Remember Calculus fundamentals\' fold: the top of each hump fits exactly into the dip beside it, so the humps average half their top, 500 W, the *average power*. The rms values give it straight away: each is 0.707 of its peak, and 70.7 V × 7.07 A is about 500 W, because 0.707 is 1 ÷ √2, and 1 ÷ √2 squared is a half.' },
    { name: 'Averaging first', card: 'test', avg: 'ask', each0: true, rdur: 1.0,
      slips: { '0 W': { line: 0 }, '1000 W': { line: 1000 } },
      task: 'Over a whole cycle the voltage averages 0 V and the current 0 A. What power does the element average?',
      opts: ['0 W', '500 W', '1000 W'], want: '500 W',
      why: 'It is the product that has to be averaged, and the product never goes below zero: humps from 0 to 1000 W, averaging half their top, 500 W, which is 70.7 V × 7.07 A. Averaging the voltage and the current first lets each backward half cancel its forward half, but in the product the backward half heats the element just as well, because a minus times a minus is a plus. 1000 W is only the top of each hump, for an instant.',
      hint: 'Not quite. Average the power itself, the humps on the lower graph.',
      hints: { '0 W': 'Not quite. That multiplies the averages. Average the product instead: it never goes below zero.',
        '1000 W': 'Not quite. The power reaches 1000 W only at the top of each hump.' } },
    { show: true, name: 'A mains heater', card: 'mains', cur: 'live', t: 5, grow: [0.4, 1.8], avg: 'show', dur: 3.2, tl: { avg: 2.3, rr: 2.6 },
      text: 'Now the mains card: a 1 kW heater on 230 V mains is 230² ÷ 1000 = 52.9 Ω, drawing 230 ÷ 52.9 = 4.35 A. Its voltage peaks at 325 V and its current at 4.35 × √2 = 6.15 A. The dashed average sits at 230 V × 4.35 A = 1000 W, and the humps reach twice that, 2000 W, about 325 × 6.15, for an instant each.' },
    { name: 'The clamp meter', card: 'clamp', hidePow: true, avg: 'ask', rdur: 2.0,
      slips: { '4600 W, tops 9200 W': { line: 4600 }, '1150 W, tops 2300 W': { line: 1150 } },
      task: 'A clamp meter reads 10 A on a heater at 230 V. What is its average power, and how high do its humps reach?',
      opts: ['4600 W, tops 9200 W', '1150 W, tops 2300 W', '2300 W, tops 4600 W'], want: '2300 W, tops 4600 W',
      why: 'The clamp meter shows an rms value (lesson 2), and the 230 V is rms too, so multiply them: 230 V × 10 A = 2300 W, the average. The humps top out at twice that, 4600 W, for an instant each: the peaks, about 325 V × 14.1 A. Taking 4600 W as the average puts the heat at the tops; halving 2300 W halves once too often, because the rms values already allow for the humps.',
      hint: 'Not quite. Ask which values the meter and the 230 V label give, then where the tops sit.',
      hints: { '4600 W, tops 9200 W': 'Not quite. 4600 W multiplies the peaks: that is the top of each hump, not the average.',
        '1150 W, tops 2300 W': 'Not quite. The rms product, 2300 W, is already the average. The tops are twice it.' } },
    { show: true, name: 'A faster supply', card: 'test', f: 50, fsel: true, morph: [0.8, 60, 1.4], cur: 'live', t: 5, avg: 'show', count: 'show', dur: 3.0,
      text: 'Watch the supply switch to 60 Hz, the most common frequency on board ship. The humps crowd closer, 120 a second, but their tops stay at 1000 W and the average at 500 W, because a resistor\'s current follows its voltage at each instant, whatever the frequency. Now switch back and forth between 50 Hz and 60 Hz, and drag the cursor.' },
    { name: 'From the tops', card: 'tops', avg: 'ask', rdur: 1.0,
      slips: { '3000 W': { line: 3000 }, '2120 W': { line: 2120 } },
      task: 'A heater\'s power humps top out at 3000 W. What is its average power?',
      opts: ['1500 W', '3000 W', '2120 W'], want: '1500 W',
      why: 'For a sine, the tops of the humps fit into their dips, so the humps average half their top: 3000 ÷ 2 = 1500 W. 3000 W is reached only for an instant. 2120 W uses 0.707 once on the power, but 0.707 belongs to the voltage and to the current; the power takes it twice, and 0.707 × 0.707 is a half.',
      hint: 'Not quite. Think of the humps\' tops filling their dips.',
      hints: { '3000 W': 'Not quite. The power touches 3000 W only at the top of each hump.',
        '2120 W': 'Not quite. 0.707 is for a voltage or a current. The power takes it twice.' } },
    { name: 'Mixed: the shape of the power', card: 'test', hidePow: true, rdur: 1.6,
      slips: { 'It goes below zero on the backward half': { wave: 'signed' }, 'It stays steady at 500 W': { line: 500 } },
      task: 'Mixed. Which is true of the 10 Ω element\'s power?',
      opts: ['It goes below zero on the backward half', 'It reaches zero twice each cycle and never goes below it', 'It stays steady at 500 W'],
      want: 'It reaches zero twice each cycle and never goes below it',
      why: 'The power is the voltage × the current. Both cross zero together twice a cycle, so the power touches zero there. On the backward half both are negative, so their product is positive. 500 W is its average, not a steady value: it swings between 0 and 1000 W.',
      hint: 'Not quite. Multiply the two waves at a few instants.',
      hints: { 'It goes below zero on the backward half': 'Not quite. On the backward half both are negative. What is a minus times a minus?',
        'It stays steady at 500 W': 'Not quite. 500 W is the average. At each instant the power swings between 0 and 1000 W.' } },
    { name: 'Mixed: a ship heater', card: 'ship', hidePow: true, avg: 'ask', count: 'ask', rdur: 2.0,
      slips: { '8.8 kW, 120 humps a second': { line: 8800 }, '4.4 kW, 60 humps a second': { wave: 1 } },
      task: 'Mixed. A heater element across 440 V at 60 Hz draws 10 A. What is its power?',
      opts: ['8.8 kW, 120 humps a second', '4.4 kW, 60 humps a second', '4.4 kW, 120 humps a second'], want: '4.4 kW, 120 humps a second',
      why: 'Rms volts × rms amps: 440 × 10 = 4400 W, 4.4 kW, in humps that come twice a cycle, 2 × 60 = 120 a second. The peaks, about 622 V and 14.1 A, multiply to 8.8 kW, the top of each hump, twice the heat. 60 a second would be one hump a cycle.',
      hint: 'Not quite. Multiply the rms values, and count two humps a cycle.',
      hints: { '8.8 kW, 120 humps a second': 'Not quite. That multiplies the peaks: the top of each hump, not the average.',
        '4.4 kW, 60 humps a second': 'Not quite. The power humps come twice a cycle, forward and backward.' } },
  ];
  const FINISH = 'A resistor\'s voltage and current keep step, so its power, their product at each instant, never goes below zero: on the backward half both are negative, and a minus times a minus is a plus. It pulses twice a cycle, 100 times a second on 50 Hz and 120 on 60 Hz, and averages half its top, the rms volts × the rms amps: 230 V × 10 A = 2300 W on a heater. The dot stays above the line here because the waves keep step. Lessons 4 and 5 put in a coil and a capacitor, which pull the current out of step, and there it dips below. Next, Inductance: the coil that pushes back.';
  // Sources the checks restate (the lesson's own).
  const OS = 'https://openstax.org/books/university-physics-volume-2/pages/15-2-simple-ac-circuits';
  const KUPH11 = 'http://www.ibiblio.org/kuphaldt/electricCircuits/AC/AC_11.html';
  const KUPH1 = 'https://www.ibiblio.org/kuphaldt/electricCircuits/AC/AC_1.html';
  const UMASS = 'https://openbooks.library.umass.edu/funee/chapter/2-8';
  const ENA = 'https://www.energynetworks.org/industry/engineering-and-technical-programmes/statutory-voltage-limits';
  const WJEC = 'https://masterymind.co.uk/subjects/physics-a-level/wjec/a-level/alternating-currents';
  const SHIP = 'http://www.iqytechnicalcollege.com/JEE129-MarineElectricalSystems.pdf';

  const PICK = 'Tap one of the answers.';
  const FADE = 0.35;
  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const testing = () => document.documentElement.classList.contains('k-testing');
  const el = (id) => document.getElementById(id);

  // ---------- each step's state ----------
  // pick, res ('right', 'wrong' or 'empty' once checked), why: the puzzle. t: the cursor time Dan has
  // set (null: the demonstration's); reach: how far the cursor has been; f: the frequency he switched
  // to, ff: the one before it.
  function blank() { return { pick: null, res: null, why: false, t: null, reach: 0, f: null, ff: null }; }
  let S = STEPS.map(() => blank());
  let finished = false, lastStep = -1, lastDone = false, T = Infinity, MODE = 'demo', motionEnd = 0;
  let REC = {}, VBH = 400, curF = 50;
  const isRight = (i, st) => st.pick != null && st.pick === STEPS[i].want;
  const hintFor = (i, st) => { const d = STEPS[i]; return (d.hints && d.hints[st.pick]) || d.hint; };

  // Text with highlighted key terms (*term*), built with K.el, never innerHTML.
  function write(node, s) {
    node.textContent = '';
    s = String(s || '');
    const re = /\*([^*]+)\*/g;
    let from = 0, m;
    while ((m = re.exec(s))) {
      if (m.index > from) node.appendChild(document.createTextNode(s.slice(from, m.index)));
      node.appendChild(K.el('span', { class: 'mark' }, m[1]));
      from = m.index + m[0].length;
    }
    if (from < s.length) node.appendChild(document.createTextNode(s.slice(from)));
  }

  // ---------- controls ----------
  const stepper = K.stepper({ id: 'step', label: 'Step', steps: STEPS.map((d) => d.name), value: 0, compact: true, into: '#prog' });
  const at = () => stepper.get();
  const pickBtns = [0, 1, 2].map((k) => K.button({ label: 'Answer ' + (k + 1), secondary: true, into: '#picks', press: () => {
    const i = at(), d = STEPS[i], st = S[i];
    if (finished || d.show || !d.opts || k >= d.opts.length || st.res === 'right') return;
    const was = st.res === 'wrong';
    st.pick = d.opts[k]; st.res = null;
    if (was) { anim.pause(); T = Infinity; }
  } }));
  const checkBtn = K.button({ label: 'Check', into: '#acts', press: () => {
    const i = at(), d = STEPS[i], st = S[i];
    if (d.show || finished) return;
    if (st.pick == null) { st.res = 'empty'; return; }
    st.res = isRight(i, st) ? 'right' : 'wrong';
    play('answer', st.res === 'right' ? d.rdur : 0.8);
  } });
  const whyBtn = K.button({ label: 'Why?', secondary: true, into: '#acts', press: () => {
    if (STEPS[at()].show || finished) return;
    const st = S[at()]; st.why = !st.why;
  } });
  // Replay plays the screen's demonstration again from its start.

  const nextBtn = K.button({ label: 'Continue', into: '#nav', press: () => {

  K.button({ label: 'Start again', secondary: true, into: '#again', press: () => {

  } });
  // The time cursor and the supply switch, shown only on the screens that free them.
  const ctlT = K.control({ id: 't', label: 'Time cursor', min: 0, max: SPAN, step: 0.1, value: 5, unit: 'ms', fmt: (v) => fx(v, 1) + ' ms', snap: [5, 10, 15, 20], into: '#ctl' });
  const ctlF = K.choice({ id: 'f', label: 'Supply', options: [{ value: '50', label: '50 Hz' }, { value: '60', label: '60 Hz' }], value: '50', into: '#ctl' });
  const shown = { t: ctlT.get(), f: ctlF.get() };
  // The controls set to what the picture shows (quietly: this is not Dan moving them).
  function syncT(v) { if (v == null) return; if (Math.abs(ctlT.get() - v) > 1e-9) ctlT.set(v, true); shown.t = ctlT.get(); }
  function syncF(f) { const s = String(f); if (String(ctlF.get()) !== s) ctlF.set(s, true); shown.f = ctlF.get(); }

  // One animation plays each demonstration, a frequency switch and the motion after an answer; with
  // reduced motion (and while the self-test looks) everything opens finished.
  const anim = K.anim({ button: false, label: 'Demonstration', step: (dt) => {
    if (finished) return false;
    T += dt;
    paint();
    return T < motionEnd;
  } });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !anim.playing() && !waiting && T !== Infinity) { T = Infinity; paint(); } });
  // A demonstration waits until most of its picture is in view, so on a phone it does not play out
  // while Dan is still reading the words above it.
  let seen = true, waiting = false, waitDur = 0;
  if (typeof IntersectionObserver === 'function') {
    seen = false;
    new IntersectionObserver((es) => {
      const e = es[es.length - 1];
      seen = e.isIntersecting && (e.intersectionRatio >= 0.6 || e.intersectionRect.height >= 0.6 * (window.innerHeight || 1));

  function play(mode, dur) {

    if (mode === 'demo' && !seen) { waiting = true; waitDur = dur; T = 0; anim.pause(); paint(); return; }
    motionEnd = dur; T = 0; anim.play();
  }
  // Dan takes over: whatever was moving shows finished.

  function arr(t0, dd) {

  function tFromX(clientX) {
    const r = svg.getBoundingClientRect();
    if (!r.width) return null;
    const x = (clientX - r.left) / r.width * 340;
    return K.clamp((x - X0) / (X1 - X0) * SPAN, 0, SPAN);
  }
  function setT(v) {
    if (v == null || !isFinite(v)) return;
    if (typeof ctlT.drag === 'function') ctlT.drag(v); else ctlT.set(Math.round(v * 10) / 10);
    K.reveal();
  }
  // A sideways drag scrubs; a tap jumps the cursor there; an up-down swipe scrolls the page.
  let held = null, slid = false;
  grip.addEventListener('pointerdown', (e) => {
    if (!liveOn()) return;
    held = e.pointerId; slid = false;
    try { grip.setPointerCapture(e.pointerId); } catch (err) { /* the drag still follows the pointer while it stays on the graphs */ }
    if (e.pointerType === 'mouse') { e.preventDefault(); slid = true; setT(tFromX(e.clientX)); }
  });
  grip.addEventListener('pointermove', (e) => { if (held !== e.pointerId || !liveOn()) return; slid = true; setT(tFromX(e.clientX)); });
  grip.addEventListener('pointerup', (e) => {
    if (held === e.pointerId && !slid && liveOn()) setT(tFromX(e.clientX));
    if (held === e.pointerId) held = null;
  });
  grip.addEventListener('pointercancel', (e) => { if (held === e.pointerId) held = null; });
  grip.addEventListener('lostpointercapture', () => { held = null; });
  grip.addEventListener('keydown', (e) => {
    if (!liveOn()) return;
    const by = { ArrowUp: 0.5, ArrowRight: 0.5, ArrowDown: -0.5, ArrowLeft: -0.5 }[e.key];
    if (by == null) return;
    e.preventDefault();
    ctlT.set(K.clamp(Math.round((ctlT.get() + by) * 10) / 10, 0, SPAN));
  });

  // The scene for a step (the animation calls this every frame).
  function paint(i) {
    if (i == null) i = at();
    const d = STEPS[i], st = S[i];
    art.textContent = '';
    into = null;
    REC = {};
    const out = drawCard(d, st);
    VBH = Math.ceil(out.h);
    svg.setAttribute('viewBox', '0 0 340 ' + VBH);
    svg.setAttribute('aria-label', out.said);
    if (i === at()) {
      if (d.trace === 'reach') st.reach = Math.max(st.reach || 0, REC.upto || 0);
      curF = REC.f;
      placeGrip(d);
      if (d.cur === 'live' && !finished && REC.tc != null) syncT(REC.tc);
      if (d.fsel && !finished) syncF(REC.f);
    }
  }

  // ---------- the model: the readings at the screen's cursor ----------
  function modelOf(p) {
    const d = STEPS[K.clamp(Math.round(p.step), 0, STEPS.length - 1)], c = CARDS[d.card];
    const f = d.fsel ? (String(p.f) === '60' ? 60 : 50) : d.f || c.f;
    const t = d.cur === 'live' ? p.t : d.t != null ? d.t : 5;
    const W = waves(c, f), v = W.v(t), a = W.i(t);
    return { volts: v, amps: a, watts: v * a };
  }
  K.model(modelOf);

  write(el('finish'), FINISH);
  K.update((p) => {
    const i = Math.round(p.step), d = STEPS[i], st = S[i];
    if (!anim.playing() && !waiting) T = Infinity;   // motion that was stopped (the page hidden, a test) shows finished
    if (i !== lastStep) {
      lastStep = i; enter('stepbox');
      shown.t = p.t; shown.f = p.f;
      if (d.show) { Object.assign(st, { t: null, reach: 0, f: null, ff: null }); play('demo', d.dur); }
      else { waiting = false; anim.pause(); T = Infinity; MODE = 'answer'; }
    } else {
      // Dan moved the cursor: the demonstration stops where it ends, and the cursor is his.
      if (p.t !== shown.t) {
        shown.t = p.t;
        if (d.cur === 'live' && !finished) { stopMotion(); st.t = p.t; }
      }
      // Dan switched the supply: the waves squeeze or stretch to the new frequency.
      if (String(p.f) !== String(shown.f)) {
        shown.f = p.f;
        const nf = String(p.f) === '60' ? 60 : 50;
        if (d.fsel && !finished && nf !== curF) { st.ff = curF; st.f = nf; play('morph', MORPH + 0.85); }
        else if (d.fsel && !finished) { st.f = nf; st.ff = null; }
      }
    }
    if (finished !== lastDone) { lastDone = finished; enter(finished ? 'done' : 'stepbox'); }
    const right = st.res === 'right';
    el('stepbox').hidden = finished;
    el('done').hidden = !finished;
    el('count').textContent = 'Step ' + (i + 1) + ' of ' + STEPS.length;
    const task = el('task');
    task.className = 'task' + (d.show ? ' show' : '');
    write(task, d.show ? d.text : d.task);
    paint(i);

    replayBtn.el.hidden = !d.show || REDUCE;
    el('replay').hidden = replayBtn.el.hidden;
    const tOn = !finished && d.cur === 'live', fOn = !finished && !!d.fsel;
    ctlT.el.hidden = !tOn;
    ctlF.el.hidden = !fOn;
    el('ctl').hidden = !tOn && !fOn;
    const opts = d.show ? [] : d.opts || [];
    el('picks').hidden = !opts.length;
    el('picks').classList.toggle('long', opts.some((o) => o.length > 6));
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      b.setLabel(opts[k]);
      b.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });
    el('acts').hidden = !!d.show;
    checkBtn.el.hidden = right;
    const fb = el('fb');
    fb.hidden = !!d.show;
    fb.className = 'fb' + (right ? ' right' : st.res === 'wrong' ? ' wrong' : '');
    write(fb, d.show ? '' : right ? 'That\'s it.' : st.res === 'wrong' ? hintFor(i, st) : st.res === 'empty' ? PICK : '');
    const why = el('why');
    why.hidden = d.show || !st.why;
    write(why, d.show ? '' : d.why);
    whyBtn.setLabel(st.why ? 'Hide why' : 'Why?');
    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !right);
    nextBtn.setLabel(i === STEPS.length - 1 ? 'Finish' : 'Continue');
    el('nav').hidden = backBtn.el.hidden && nextBtn.el.hidden;
  });

  // ---------- known answers, worked out by hand ----------
  const DO = STEPS.map((d, i) => i).filter((i) => !STEPS[i].show);
  const solvedSt = (i) => Object.assign(blank(), { pick: STEPS[i].want, res: 'right' });
  const wrongSt = (i, o) => Object.assign(blank(), { pick: o, res: 'wrong' });
  const idx = (name) => STEPS.findIndex((d) => d.name === name);
  const near = (a, b, tol) => Math.abs(a - b) <= tol;
  // A step painted in the state given, finished: what it draws.
  function drawn(i, st, mode) {
    const keepS = S[i], keepT = T, keepM = MODE;
    S[i] = st; T = Infinity; MODE = mode || (STEPS[i].show ? 'demo' : 'answer');
    try {
      paint(i);
      return Object.assign({}, REC, { texts: Array.from(art.querySelectorAll('text')).map((n) => n.textContent) });
    } finally { S[i] = keepS; T = keepT; MODE = keepM; paint(); }
  }
  const settledOf = (i) => drawn(i, STEPS[i].show ? blank() : solvedSt(i));
  // The times of a drawn trace's tops (sign 1) or bottoms (sign −1).
  function peaks(data, sign) {
    const out = [];
    for (let j = 1; j < data.length - 1; j++) {
      const a = sign * data[j - 1][1], b = sign * data[j][1], c = sign * data[j + 1][1];
      if (b > a && b >= c) out.push(data[j][0]);
    }
    return out;
  }

  K.check('Both curves reach their maxima and minima at the same times, that is, the current through and the voltage across the resistor are in phase: on every card the drawn current is the drawn voltage ÷ the resistance at each instant, and its tops and bottoms fall at the voltage\'s', () =>
    STEPS.every((d, i) => {
      if (CARDS[d.card].compact) return true;
      const g = settledOf(i);
      if (!g.wv || !g.cu || g.wv.length !== g.cu.length || g.wv.length < 300) return false;
      const okI = g.wv.every((q, j) => near(g.cu[j][0], q[0], 1e-12) && near(g.cu[j][1], q[1] / g.R, 1e-9 * Math.max(1, Math.abs(q[1]))));
      const same = (a, b) => a.length === b.length && a.every((t, j) => near(t, b[j], 1e-9));
      return okI && peaks(g.wv, 1).length >= 2 && same(peaks(g.wv, 1), peaks(g.cu, 1)) && same(peaks(g.wv, -1), peaks(g.cu, -1));
    }), { source: OS });
  K.check('The waveform for power is always positive, never negative for this resistive circuit: on every screen each drawn point of the power wave is the drawn voltage × the drawn current at that instant, and none is below zero', () =>
    STEPS.every((d, i) => {
      const g = settledOf(i), c = CARDS[d.card];
      if (!g.pw || g.pw.length < 100) return false;
      if (!g.pw.every((q) => q[1] >= -1e-9 * g.top)) return false;
      if (c.compact) return g.pw.every((q) => near(q[1], g.top * Math.pow(Math.sin(TAU * c.f * q[0] / 1000), 2), 1e-9 * g.top));
      return g.pw.every((q, j) => near(q[0], g.wv[j][0], 1e-12) && near(q[1], g.wv[j][1] * g.cu[j][1], 1e-9 * g.top));
    }), { source: KUPH11 });
  K.check('The waveform for power is not at the same frequency as the voltage or current; its frequency is double that of either: the drawn power wave has a hump at every top and every bottom of the voltage, two a cycle, shown as 100 humps a second on 50 Hz and 120 on 60 Hz', () =>
    [['Two humps a cycle', 50], ['A faster supply', 60], ['On board ship', 60]].every((q) => {
      const g = settledOf(idx(q[0]));
      if (!g.wv || !g.pw) return false;
      const vt = peaks(g.wv, 1).concat(peaks(g.wv, -1)).sort((a, b) => a - b), pt = peaks(g.pw, 1);
      return g.f === q[1] && vt.length >= 4 && vt.length === pt.length && vt.every((t, j) => near(t, pt[j], 1e-9)) &&
        g.texts.indexOf('2 humps a cycle × ' + q[1] + ' Hz = ' + 2 * q[1] + ' humps a second') >= 0;
    }), { source: KUPH11 });
  K.check('The product of the RMS voltage and RMS current is equal to the average power: on the 10 Ω, mains, clamp-meter and ship cards the dashed average sits at the mean of the drawn power wave over whole humps, and the row under it multiplies the rms values to that figure: 500 W, 1000 W, 2300 W and 4.4 kW', () =>
    [['The average', 'Vrms × Irms = 70.7 V × 7.07 A = 500 W'], ['A mains heater', 'Vrms × Irms = 230 V × 4.35 A = 1000 W'],
      ['The clamp meter', 'Vrms × Irms = 230 V × 10 A = 2300 W'], ['Mixed: a ship heater', 'Vrms × Irms = 440 V × 10 A = 4.4 kW']].every((q) => {
      const g = settledOf(idx(q[0]));
      if (!g.pw || g.avg == null) return false;
      const hump = 1000 / (2 * g.f);
      let n = Math.floor(SPAN / hump + 1e-9);
      while (n > 0 && Math.abs(n * hump * 10 - Math.round(n * hump * 10)) > 1e-6) n--;
      const end = Math.round(n * hump * 10) / 10;
      let area = 0;
      for (let j = 1; j < g.pw.length && g.pw[j][0] <= end + 1e-9; j++) area += (g.pw[j - 1][1] + g.pw[j][1]) / 2 * (g.pw[j][0] - g.pw[j - 1][0]);
      return n >= 2 && near(area / end, g.avg, 2e-3 * g.avg) && near(g.Vr * g.Ir, g.avg, 1e-9 * g.avg) && g.texts.indexOf(q[1]) >= 0;
    }), { source: UMASS });
  K.check('For a sine wave, the RMS value is approximately 0.707 of its peak value: on the 10 Ω card the rows read Vrms = 0.707 × 100 V = 70.7 V and Irms = 0.707 × 10 A = 7.07 A', () => {
    const g = settledOf(idx('The average'));
    return near(1 / RT2, 0.707, 5e-4) && num(100 * 0.707, 1) === num(100 / RT2, 1) && num(10 * 0.707, 2) === num(10 / RT2, 2) &&
      g.texts.indexOf('Vrms = 0.707 × 100 V = 70.7 V') >= 0 && g.texts.indexOf('Irms = 0.707 × 10 A = 7.07 A') >= 0;
  }, { source: KUPH1 });
  K.check('UK mains voltage is 230 V RMS, so the peak voltage is about 325 V (230 × √2): on the mains card the voltage wave reaches 325 V at the top of each cycle and −325 V at the bottom', () => {
    const g = settledOf(idx('A mains heater'));
    let hi = -Infinity, lo = Infinity;
    g.wv.forEach((q) => { hi = Math.max(hi, q[1]); lo = Math.min(lo, q[1]); });
    return near(hi, 230 * RT2, 0.01) && near(lo, -230 * RT2, 0.01) && g.texts.indexOf('325') >= 0 && g.texts.indexOf('−325') >= 0;
  }, { source: WJEC });
  K.check('UK mains electricity operates at a nominal voltage of 230V: the 1 kW mains heater is 230² ÷ 1000 = 52.9 Ω and draws 230 ÷ 52.9 = 4.35 A, its power humps reaching 2000 W and averaging 1000 W', () => {
    const g = settledOf(idx('A mains heater'));
    let hi = 0;
    g.pw.forEach((q) => { hi = Math.max(hi, q[1]); });
    return near(CARDS.mains.R, 52.9, 1e-9) && near(g.Vr, 230, 1e-9) && num(g.Ir, 2) === '4.35' && near(hi, 2000, 1e-6) && near(g.avg, 1000, 1e-9) &&
      g.texts.indexOf('1 kW heater, 52.9 Ω, on 230 V mains') >= 0 && g.texts.indexOf('2000') >= 0;
  }, { source: ENA });
  K.check('60 Hz is the most common frequency adopted for use on board ship: the ship screens run at 60 Hz, and once answered show 2 humps a cycle × 60 Hz = 120 humps a second', () =>
    ['On board ship', 'Mixed: a ship heater'].every((n) => { const g = settledOf(idx(n)); return g.f === 60 && g.texts.indexOf('2 humps a cycle × 60 Hz = 120 humps a second') >= 0; }),
  { source: SHIP });
  K.check('The majority of ships have a 3 phase, 3 wire, 440V insulated neutral system: the ship heater runs at 440 V rms, its wave peaking at 440 × √2 = 622 V, and drawing 10 A it averages 440 × 10 = 4.4 kW', () => {
    const g = settledOf(idx('Mixed: a ship heater'));
    let hi = -Infinity;
    g.wv.forEach((q) => { hi = Math.max(hi, q[1]); });
    return near(g.Vr, 440, 1e-9) && near(g.Ir, 10, 1e-9) && near(g.avg, 4400, 1e-6) && g.texts.indexOf('622') >= 0 && hi <= 440 * RT2 + 1e-9 && hi > 440 * RT2 * 0.999;
  }, { source: SHIP });
  K.check('The scrubber multiplies: at 5 ms 100 V × 10 A = 1000 W; at 10 ms both are 0, so the power is 0; at 15 ms −100 V × −10 A = +1000 W', () => {
    const a = K.at({ step: 0, t: 5 }), b = K.at({ step: 0, t: 10 }), c = K.at({ step: idx('At the bottom') });
    return near(a.volts, 100, 1e-9) && near(a.amps, 10, 1e-9) && near(a.watts, 1000, 1e-9) && near(b.volts, 0, 1e-9) && near(b.watts, 0, 1e-9) &&
      near(c.volts, -100, 1e-9) && near(c.amps, -10, 1e-9) && near(c.watts, 1000, 1e-9);
  });
  K.check('The fold: the top of a hump above the 500 W average, moved on half a hump (5 ms) and turned over, lies exactly along the dip beside it', () => {
    const W = waves(CARDS.test, 50);
    for (let j = 0; j <= 100; j++) { const t = 2.5 + j * 0.05; if (!near(1000 - W.p(t), W.p(t + 5), 1e-9)) return false; }
    const g = settledOf(idx('The average'));
    return !!g.cap && g.cap.length > 20 && g.cap.every((q) => q[0] >= 7.5 - 1e-9 && q[0] <= 12.5 + 1e-9 && near(q[1], W.p(q[0]), 1e-9));
  });
  K.check('Each puzzle accepts only its right answer; before an answer its picture hides what is asked (the power there, the power wave, the average or the humps a second), and each wrong pick draws what it claims, in red', () => {
    const only = DO.every((i) => { const d = STEPS[i]; return d.opts.indexOf(d.want) >= 0 && d.opts.every((o) => isRight(i, Object.assign(blank(), { pick: o })) === (o === d.want)); });
    const hidden = DO.every((i) => {
      const d = STEPS[i], g = drawn(i, blank());
      return (d.part == null || (!g.dotShown && !!g.pw && g.pw[g.pw.length - 1][0] <= d.part + 1e-9 && g.texts.indexOf('?') >= 0)) &&
        (!d.hidePow || g.pw === null) && (d.avg !== 'ask' || (g.avg === null && g.texts.indexOf('average power: ?') >= 0)) &&
        (d.count !== 'ask' || g.texts.indexOf('on ' + g.f + ' Hz: ? humps a second') >= 0);
    });
    const slips = DO.every((i) => STEPS[i].opts.filter((o) => o !== STEPS[i].want).every((o) => {
      const s = STEPS[i].slips[o], g = drawn(i, wrongSt(i, o));
      return !!s && g.slip === s;
    }));
    return only && hidden && slips;
  });
  K.check('Every demonstration has finished arriving within 4.5 s of its screen opening, none starting before the 0.35 s screen fade ends; every answer\'s motion, right or wrong, within 2.5 s', () => {
    const keepT = T, keepM = MODE;
    const timed = (i, st, mode, limit) => {
      const keepS = S[i];
      T = Infinity; MODE = mode; latest = 0; earliest = Infinity; S[i] = st;
      try { paint(i); } finally { S[i] = keepS; }
      return latest <= limit + 1e-9;
    };
    const ok = STEPS.every((d, i) => {
      if (d.show) { const r = timed(i, blank(), 'demo', d.dur); return r && d.dur >= 3 && d.dur <= 4.5 && earliest >= FADE; }
      return timed(i, solvedSt(i), 'answer', d.rdur) && d.rdur <= 2.5 && d.opts.filter((o) => o !== d.want).every((o) => timed(i, wrongSt(i, o), 'answer', 0.8));
    });
    T = keepT; MODE = keepM; paint();
    return ok;
  });

  K.ready();
</script>
