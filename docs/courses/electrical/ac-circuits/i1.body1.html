<p class="lead">A coil of wire, an example 10 cm square, turning between two magnet poles, seen end-on, with its flux and emf traced against time.</p>

<div class="pz" id="pz">

  <div id="stepbox">
    <p class="k-label count" id="count"></p>
    <p class="task" id="task"></p>
    <svg class="scene" id="scene" viewBox="0 0 340 300" width="100%" role="img" aria-label=""><g id="art"></g><g id="ui"></g></svg>

<p class="caption">Each emf is worked out from the coil's turns of wire, field, area and turns a second.</p>

<script>
  // ---------- the rule ----------
  // A coil of N turns of wire, each of area AREA, in a field of B teslas, turning f times a second.
  // Its angle θ from face-on is 2πft. The flux through it is its face-on amount × cos θ, and its
  // emf, minus how fast the flux through all its turns changes, is N × B × A × 2πf × sin θ.
  const AREA = 0.01, TAU = 2 * Math.PI, WIN = 2;          // m² (an example 10 cm square), a turn in radians, the graphs' 2 s
  const peakOf = (N, B, f) => N * B * AREA * TAU * f;
  const shareOf = (f, t) => Math.cos(TAU * f * t);
  const emfOf = (pk, f, t) => pk * Math.sin(TAU * f * t);
  // A number as the lesson writes it: at most dp decimals, no trailing zeros, a true minus sign.
  function num(v, dp) {
    dp = dp == null ? 2 : dp;
    const m = Math.pow(10, dp);
    let r = Math.round(v * m) / m;
    if (r === 0) r = 0;
    let s = r.toFixed(dp);
    if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
    return s.replace('-', '−');
  }
  const V = (v, dp) => num(v, dp) + ' V';
  const P1 = peakOf(100, 0.5, 1), P2 = peakOf(100, 0.5, 2);   // 3.14 V and 6.28 V

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  // pic 'coil': the magnets and the coil on the left, the flux trace on the right; with emf, the
  // lamp on the left and the emf trace under the flux trace. A SHOW step's tl is its timetable in
  // seconds from when the screen opens; tEnd is where its spin stops (s), and live lets Dan drag.
  // A DO step's coil sits at `at` seconds; hide lists what stays hidden until a right answer
  // (grow draws that trace in, move turns the coil from, to, over seconds).
  // pic 'wave': emf against time alone, full width: a base wave, the answer's wave and each slip's.
  const STEPS = [
    { show: true, name: 'Flux through the coil', pic: 'coil', live: true, f: 1, N: 100, B: 0.5, tEnd: 1.375,
      dur: 3.4, tl: { mag: 0.4, coil: 0.9, band: 1.3, flux: 1.3, spin: 1.9 },
      text: 'Two magnet poles face each other, and their field runs straight across from north to south. A coil of wire turns between them, seen end-on, so it shows as a line with a wire at each end. The shaded band is the field passing through the coil, its *flux*. Face-on the coil catches the most, edge-on none, and past edge-on the field passes through from the other side. The trace shows the flux as a share of its face-on amount. Drag the ringed wire round.' },
    { name: 'Edge-on', pic: 'coil', f: 1, N: 100, B: 0.5, at: 0.25, tag: 'edge-on', hide: ['flux'], grow: 'flux', growDur: 1.0,
      penLab: 'flux 0', labAt: 1.2, rdur: 1.8,
      ghosts: { 'The most': [0, 'face-on'], 'Half': [60, '60° from face-on'] },
      task: 'The coil is edge-on to the field. How much flux passes through it?',
      opts: ['The most', 'None', 'Half'], want: 'None',
      why: 'Edge-on, the coil\'s face lies along the field lines, so they all slip past and none passes through. Its flux is zero. Face-on it catches the most, and turned 60° from face-on, half.',
      hint: 'Not quite. Look at which way the coil\'s face points.',
      hints: { 'The most': 'Not quite. The most passes through face-on, square to the field.',
        'Half': 'Not quite. Half passes through 60° from face-on. Edge-on, the field lines all slip past.' } },
    { show: true, name: 'The emf', pic: 'coil', live: true, emf: true, slope: true, f: 1, N: 100, B: 0.5, tEnd: 1.25, emax: 4,
      dur: 3.2, tl: { mag: 0.4, emf: 0.9, lamp: 1.4, spin: 1.9 },
      text: 'Now the coil spins steadily. A changing flux makes a push round the coil, its *emf*, traced below in volts, and the lamp shows the current it drives. The emf is zero where the flux trace is at its top or bottom. It peaks where the flux crosses zero at its steepest, and the short line riding the flux trace shows that slope.' },
    { name: 'Where it peaks', pic: 'coil', emf: true, slope: true, f: 1, N: 100, B: 0.5, at: 1, emax: 4,
      hide: ['emf', 'slope', 'push', 'lamp', 'now'], move: [1, 1.25, 1.0], ansTag: 'edge-on', labAt: 1.0, rdur: 1.6,
      task: 'The coil turns steadily. Where in its turn is the emf biggest?',
      opts: ['Face-on', 'Halfway between', 'Edge-on'], want: 'Edge-on',
      why: 'The emf follows how fast the flux changes, not how much there is. Edge-on, the flux crosses zero at its steepest, so the emf peaks. Face-on, the flux is at its most and for that instant not changing, like a ball at the top of its throw, so the emf is zero.',
      hint: 'Not quite. Find where the flux trace is steepest.',
      hints: { 'Face-on': 'Not quite. Face-on the flux is at its most, but for that instant it is not changing.',
        'Halfway between': 'Not quite. At 45° the flux is changing, but fastest where it crosses zero, edge-on.' } },
    { show: true, name: 'Why a sine', pic: 'coil', live: true, emf: true, arm: true, f: 1, N: 100, B: 0.5, tEnd: 1.25, emax: 4,
      dur: 3.2, tl: { mag: 0.4, arm: 0.9, speed: 1.4, spin: 1.9 },
      text: 'Why a sine? Take the ringed wire as the arm in From circle to wave, at angle θ from face-on. The flux share is the height of its shadow, cos θ. The wire moves round at a steady speed, and only the part of that speed across the field lines changes the flux, its speed × sin θ. So the emf goes as sin θ. From face-on to face-on the flux falls from its most one way to its most the other, one change, so the push keeps its direction. As the coil passes face-on the push reverses, and the lamp\'s current with it.' },
    { name: 'What reverses', pic: 'coil', emf: true, f: 1, N: 100, B: 0.5, at: 7 / 6, emax: 4, move: [7 / 6, 5 / 3, 1.8], rdur: 2.0,
      task: 'Something reverses every half turn, as the coil passes face-on. What is it?',
      opts: ['The field between the poles', 'The push and the current', 'Nothing, the current just stops'], want: 'The push and the current',
      why: 'As the coil passes face-on, the flux stops falling and starts rising, so the push reverses, and the lamp\'s current reverses with it. The magnets\' field never changes. Current driven to and fro like this is *alternating current*.',
      hint: 'Not quite. Watch the marks on the wires and the lamp\'s arrow.',
      hints: { 'The field between the poles': 'Not quite. The magnets\' field stays put. The coil\'s turning makes the change.',
        'Nothing, the current just stops': 'Not quite. The emf is zero only for an instant, face-on, and then it pushes the other way.' } },
    { show: true, name: 'Faster', pic: 'coil', live: true, emf: true, sliders: ['f'], f: 2, N: 100, B: 0.5, tEnd: 1.125, emax: 16,
      ghost: { f: 1, N: 100, B: 0.5, label: '1 turn a second' }, period: true, work: true,
      dur: 3.1, tl: { mag: 0.4, ghost: 0.9, work: 1.3, spin: 1.9 },
      text: 'Turn the coil faster and its flux changes faster, so the push is bigger. At 2 turns a second the peak doubles to 6.28 V, and each wave takes half as long, 0.5 s. The dashed wave is the coil at 1 turn a second. Slide the speed, and the height and the period change together.' },
    { name: 'Twice as fast', pic: 'wave', win: 2, ticks: ['1 s', '2 s'], emax: 8, period: true, rdur: 1.8,
      base: { pk: P1, f: 1, label: V(P1) + ' peak, 1 turn a second' }, ans: { pk: P2, f: 2, label: V(P2) + ' peak, 2 turns a second' },
      slips: { 'Halves the period only': { pk: P1, f: 2 }, 'Doubles the peak only': { pk: P2, f: 1 } },
      task: 'The coil turns twice as fast, 2 turns a second instead of 1. What happens to its emf?',
      opts: ['Halves the period only', 'Doubles the peak only', 'Doubles the peak, halves the period'], want: 'Doubles the peak, halves the period',
      why: 'Twice as fast, the flux changes twice as fast, so the peak doubles to 6.28 V. Each turn takes half as long, so the period halves to 0.5 s. Speed changes both together.',
      hint: 'Not quite. Think about the height and the period.',
      hints: { 'Halves the period only': 'Not quite. The flux also changes twice as fast, so the push is bigger too.',
        'Doubles the peak only': 'Not quite. Each turn also takes half as long, so each wave does too.' } },
    { show: true, name: 'Turns and field', pic: 'coil', live: true, emf: true, sliders: ['N', 'B'], f: 1, N: 100, Nend: 200, B: 0.5, tEnd: 1.25, emax: 16,
      ghost: { f: 1, N: 100, B: 0.5, label: '100 turns, 0.5 T' }, period: true, work: true,
      dur: 3.9, tl: { mag: 0.4, ghost: 0.9, work: 1.3, spin: 1.7, ramp: 3.05 },
      text: 'Each turn of wire adds its own push, and a stronger field gives more flux to change, so both scale the peak. Neither changes how fast the coil turns, so the period stays at 1 s. With 200 turns of wire the peak doubles to 6.28 V. The dashed wave is the coil with 100 turns at 0.5 T.' },
    { name: 'Three times the turns', pic: 'wave', win: 2, ticks: ['1 turn', '2 turns'], emax: 40, rdur: 1.8,
      base: { pk: 12, f: 1, label: '12 V peak' }, ans: { pk: 36, f: 1, label: '36 V peak' },
      slips: { '36 V, a third of the period': { pk: 36, f: 3 }, '4 V': { pk: 4, f: 1 } },
      task: 'A coil gives 12 V peak. It is rewound with three times the turns of wire, at the same field and speed. What does it give?',
      opts: ['36 V, same period', '4 V', '36 V, a third of the period'], want: '36 V, same period',
      why: 'Each turn of wire adds its own push, so three times the turns gives 3 × 12 = 36 V. The speed is the same, so each wave takes as long as before.',
      hint: 'Not quite. Ask what more turns change, and what they leave alone.',
      hints: { '36 V, a third of the period': 'Not quite. The speed is unchanged, so the period is too.',
        '4 V': 'Not quite. More turns add more push, so multiply by 3.' } },
    { name: '30° past face-on', pic: 'coil', emf: true, tunit: 'turn', f: 1, peak: 20, at: 13 / 12, emax: 25, tag: '30° past face-on', wedge: true,
      hide: ['emf', 'lamp', 'now'], grow: 'emf', growDur: 0.9, rev: 0.9, penLab: '10 V', labAt: 1.0, rdur: 1.6,
      marks: { '17.3 V': 20 * Math.cos(Math.PI / 6), '0 V': 0 },
      task: 'Mixed. This coil peaks at 20 V, and it is 30° past face-on. What is its emf now?',
      opts: ['17.3 V', '10 V', '0 V'], want: '10 V',
      why: 'The emf goes as the sine of the angle from face-on, so it is 20 × sin 30° = 10 V. The cosine gives 17.3 V, which is the shape of the flux, not the emf.',
      hint: 'Not quite. The emf goes with the sine of the angle from face-on.',
      hints: { '17.3 V': 'Not quite. 20 × cos 30° follows the flux. The emf goes with the sine.',
        '0 V': 'Not quite. The emf is zero only face-on. At 30° the flux is already changing.' } },
    { name: '60 Hz at sea', pic: 'wave', win: 40, ticks: ['20 ms', '40 ms'], emax: 140, rdur: 1.8,
      base: { pk: 100, f: 0.05, label: '100 V peak, 50 Hz' }, ans: { pk: 120, f: 0.06, label: '120 V peak, 60 Hz' },
      slips: { '100 V': { pk: 100, f: 0.06 }, '83.3 V': { pk: 100 * 50 / 60, f: 0.06 } },
      task: 'Mixed. This simple coil gives 100 V peak at 50 turns a second, a 50 Hz wave. To make 60 Hz it turns 60 times a second, with the same field. What is its peak?',
      opts: ['100 V', '83.3 V', '120 V'], want: '120 V',
      why: 'The peak follows how fast the flux changes, so turning 60 times a second instead of 50 gives 100 × 60 ÷ 50 = 120 V, at 60 Hz. 60 Hz is the most common frequency on board ship. A real generator adjusts its field to hold its voltage, which Three-phase power systems at sea takes up.',
      hint: 'Not quite. Speed scales the peak as well as the frequency.',
      hints: { '100 V': 'Not quite. With the field held, a faster turn changes the flux faster, so the peak rises too.',
        '83.3 V': 'Not quite. That ratio is upside down. Faster gives more, × 60 ÷ 50.' } },
  ];
  const FINISH = 'A coil turned steadily in a magnetic field makes a sine-wave emf. It peaks edge-on, where the flux is zero but changing fastest, and reverses each time the coil passes face-on. Speed scales the peak and the frequency together, while turns and field scale the peak alone. Next, Rms: what the 230 V on a label means for a wave that never stands still.';
  // Sources the checks restate (the lesson's own).
  const OPENSTAX_F = 'https://openstax.org/books/university-physics-volume-2/pages/13-1-faradays-law';
  const OPENSTAX_G = 'https://openstax.org/books/college-physics-2e/pages/23-5-electric-generators';
  const MSU = 'https://web.pa.msu.edu/courses/2000fall/phy232/lectures/induction/rotatingcoil.html';
  const SHIP = 'http://www.iqytechnicalcollege.com/JEE129-MarineElectricalSystems.pdf';

  const PICK = 'Tap one of the answers.';
  const FADE = 0.35;
  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const testing = () => document.documentElement.classList.contains('k-testing');
  const el = (id) => document.getElementById(id);

  // ---------- each step's state ----------
  // pick, res ('right', 'wrong' or 'empty' once checked), why: the puzzle. t: the time Dan has
  // dragged the coil to (null: the demonstration's); spin: he pressed Spin; f, N, B: his sliders.
  function blank() { return { pick: null, res: null, why: false, t: null, spin: false, f: null, N: null, B: null }; }
  let S = STEPS.map(() => blank());
  let finished = false, lastStep = -1, lastDone = false, T = Infinity, MODE = 'demo', motionEnd = 0, paused = false;
  let REC = {};                                     // what the last paint drew, for the checks
  const isRight = (i, st) => st.pick != null && st.pick === STEPS[i].want;
  const hintFor = (i, st) => { const d = STEPS[i]; return (d.hints && d.hints[st.pick]) || d.hint; };

  // Text with highlighted key terms (*term*), built with K.el, never innerHTML.
  function write(node, s) {
    node.textContent = '';
    s = String(s || '');
    const re = /\*([^*]+)\*/g;
    let from = 0, m;
    while ((m = re.exec(s))) {
      if (m.index > from) node.appendChild(document.createTextNode(s.slice(from, m.index)));
      node.appendChild(K.el('span', { class: 'term' }, m[1]));
      from = m.index + m[0].length;
    }
    if (from < s.length) node.appendChild(document.createTextNode(s.slice(from)));
  }

  // ---------- controls ----------
  const stepper = K.stepper({ id: 'step', label: 'Step', steps: STEPS.map((d) => d.name), value: 0, compact: true, into: '#prog' });
  const at = () => stepper.get();
  const pickBtns = [0, 1, 2].map((k) => K.button({ label: 'Answer ' + (k + 1), secondary: true, into: '#picks', press: () => {
    const i = at(), d = STEPS[i], st = S[i];
    if (finished || d.show || !d.opts || k >= d.opts.length || st.res === 'right') return;
    const was = st.res === 'wrong';
    st.pick = d.opts[k]; st.res = null;
    if (was) { anim.pause(); T = Infinity; }
  } }));
  const checkBtn = K.button({ label: 'Check', into: '#acts', press: () => {
    const i = at(), d = STEPS[i], st = S[i];
    if (d.show || finished) return;
    if (st.pick == null) { st.res = 'empty'; return; }
    st.res = isRight(i, st) ? 'right' : 'wrong';
    play('answer', st.res === 'right' ? d.rdur : 0.8);
  } });
  const whyBtn = K.button({ label: 'Why?', secondary: true, into: '#acts', press: () => {
    if (STEPS[at()].show || finished) return;
    const st = S[at()]; st.why = !st.why;
  } });
  // Spin sets the coil turning from the start of the graphs at the speed shown; it pauses and carries on.

  // ---------- the wave picture: emf against time, full width ----------

  // ---------- dragging the coil round by its ringed wire ----------

  K.check('Every demonstration has finished arriving within 4.5 s of its screen opening, none starting before the 0.35 s screen fade ends; every answer\'s motion, right or wrong, within 2.5 s', () => {
    const keepT = T, keepM = MODE;
    const timed = (i, st, mode, limit) => {
      const keepS = S[i];
      T = Infinity; MODE = mode; latest = 0; earliest = Infinity; S[i] = st;
      try { paint(i); } finally { S[i] = keepS; }
      return latest <= limit + 1e-9;
    };
    const ok = STEPS.every((d, i) => {
      if (d.show) { const r = timed(i, blank(), 'demo', d.dur); return r && d.dur >= 3 && d.dur <= 4.5 && earliest >= FADE; }
      return timed(i, solvedSt(i), 'answer', d.rdur) && d.rdur <= 2.5 && d.opts.filter((o) => o !== d.want).every((o) => timed(i, wrongSt(i, o), 'answer', 0.8));
    });
    T = keepT; MODE = keepM; paint();
    return ok;
  });

  K.ready();
</script>
