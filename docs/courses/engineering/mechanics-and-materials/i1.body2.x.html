<p class="lead">A ring pulled three ways, an example 1000 kg load on a two-leg sling, and a crate on a level deck. The other loads and pushes are examples too.</p>

<div class="pz" id="pz">

<p class="caption">Each leg's tension is half the weight divided by sin θ, where θ is its angle from the horizontal.</p>

<script>
  // ---------- the rules ----------
  const D2R = Math.PI / 180;
  const GN = 9.81;                                        // newtons per kilogram
  const kNof = (kg) => kg * GN / 1000;                    // a mass's weight in kN
  const W1 = kNof(1000);                                  // the example load: 9.81 kN
  const HALF = W1 / 2;                                    // each leg's vertical share
  const thOf = (a) => 90 - a / 2;                         // a leg's angle from the horizontal, θ, for a° between the legs
  const factorOf = (a) => 1 / Math.sin(thOf(a) * D2R);    // the load angle factor, 1 ÷ sin θ
  const legOf = (a, w) => (w == null ? W1 : w) / 2 * factorOf(a);
  const SAFE = 8;                                         // example: what one leg can safely take, kN
  const GRIP = 300;                                       // example: the most friction the deck can give, N
  const RING = 3;                                         // example: each ring pull, kN
  const ringNeed = (sep) => 2 * RING * Math.cos(sep / 2 * D2R);   // the one pull that balances two RING pulls sep° apart
  const frictionOf = (push) => Math.min(Math.max(0, push), GRIP);
  const SRC = {
    oep: 'https://open-exam-prep.com/study-guides/bcsp-asp/mathematical-calculations-safety-math-noise-rigging-flow-and-radiation/rigging-load-calculations-and-sling-angle-effects',
    ihsa: 'https://www.ihsa.ca/PDFs/Products/Id/DS033.pdf',
    newton: 'https://openstax.org/books/university-physics-volume-1/pages/5-2-newtons-first-law',
    two: 'https://open-exam-prep.com/study-guides/nccco-rigger-level-2/balanced-forces/two-leg-tension',
    doe: 'https://www.energy.gov/sites/prod/files/2014/01/f6/HoistingRigging_Fundamentals.pdf',
    hse: 'https://www.hse.gov.uk/work-equipment-machinery/lift-equipment.htm',
  };
  const fx = (v, d) => (Math.abs(v) < 0.5 * Math.pow(10, -d) ? 0 : v).toFixed(d).replace('-', '−');

  // Every number the words show, worked out from the rules (a check compares them with the lesson's).
  const N = (() => {
    const n = {}, mW = kNof(2000);
    n.W = fx(W1, 2); n.half = fx(HALF, 3);
    n.t30 = fx(legOf(30), 2); n.t60 = fx(legOf(60), 2); n.t90 = fx(legOf(90), 2); n.t120 = fx(legOf(120), 2); n.t150 = fx(legOf(150), 2);
    n.side120 = fx(legOf(120) * Math.cos(thOf(120) * D2R), 2);
    n.f60 = fx(factorOf(60), 3); n.f90 = fx(factorOf(90), 3); n.f120 = fx(factorOf(120), 3);
    n.sin30 = fx(Math.sin(30 * D2R), 1);
    n.mW = fx(mW, 2); n.mHalf = fx(mW / 2, 2); n.mT = fx(legOf(90, mW), 2); n.mWhole = fx(mW * factorOf(90), 2);
    n.ring = fx(ringNeed(120), 0); n.ring60 = fx(ringNeed(60), 1); n.ringSum = fx(2 * RING, 0);
    n.wire2 = fx(2 * legOf(120), 2);
    n.pct60 = fx(100 * (factorOf(60) - 1), 0);
    return n;
  })();

  // ---------- the lesson: SHOW screens demonstrate, DO screens are puzzles ----------
  // scene: ring, sling or crate. set: where the controls open. slider: the control shown. play: a
  // demonstration sweeping that control ([seconds, value] keys); arrive: forces arriving one by one.
  // hookF: the forces on the hook; parts: each leg's dashed vertical and sideways parts; theta: the
  // label on θ's arc; limit: the 8 kN safe mark; poly: the forces laid nose to tail (hook or load).
  // ask: what a puzzle asks for; val: the value each answer stands for, drawn when it is checked.
  const STEPS = [
    { kind: 'pick', scene: 'ring', name: 'A ring pulled three ways', ask: 'ring',
      task: `Two ropes pull on a ring with ${N.ring} kN each, 120° apart. What single pull holds the ring still?`,
      opts: [`${N.ring} kN`, `${N.ringSum} kN`, `${N.ring60} kN`], want: `${N.ring} kN`, val: [ringNeed(120), 2 * RING, ringNeed(60)],
      hints: { [`${N.ringSum} kN`]: 'Not quite. Pulls at an angle do not add like plain numbers. Lay them nose to tail.',
        [`${N.ring60} kN`]: 'Not quite. That balances two pulls 60° apart. These are 120° apart.' },
      why: `Lay the two ${N.ring} kN pulls nose to tail. The second turns 120° from the first, so they make two sides of a triangle with three equal sides. The side that closes it is also ${N.ring} kN, pointing straight down. So a ${N.ring} kN pull down holds the ring still.` },
    { show: true, scene: 'sling', name: 'Free the hook', set: { ang: 60 }, hookF: true, poly: 'hook', arrive: true, outs: ['legTension'],
      text: 'Pick one part and draw every force on it. That drawing is a *free-body diagram*. Each force has a giver. The giver touches the part, or acts from a distance, as the Earth does on a weight. Take the crane hook. The crane wire pulls it up. Each sling leg pulls it down along its own line. The hook stays still, so these three pulls add to nothing. Laid nose to tail, they close a triangle.' },
    { kind: 'pick', scene: 'sling', name: 'Forces on the load', set: { ang: 60 }, freed: true, poly: 'load', ask: 'load',
      task: 'Now free the load instead. Which forces act on it?',
      opts: ['Its weight and the two leg pulls', 'Its weight alone', 'Its weight, the leg pulls and the wire\'s pull'], want: 'Its weight and the two leg pulls',
      sets: ['wl', 'w', 'wlx'],
      hints: { 'Its weight alone': 'Not quite. Then nothing would hold it up. What touches the load?',
        'Its weight, the leg pulls and the wire\'s pull': 'Not quite. The wire touches the hook, not the load.' },
      why: 'A force on the load needs a giver that touches it, or acts from a distance. The Earth gives its weight. The two legs touch it where they hook on, and each pulls along its own line. The wire touches only the hook. So the load\'s diagram has three forces, and they close a triangle.' },
    { show: true, scene: 'sling', name: 'Spread the legs', set: { ang: 60 }, slider: 'ang', hookF: true, parts: true, theta: 'θ', poly: 'hook',
      play: { id: 'ang', keys: [[0.4, 60], [2.2, 140], [4.0, 60]] }, outs: ['legTension', 'angleFromHorizontal'],
      text: `Each leg pulls the hook down and the load up, along its own line. Only its vertical part holds the load up. The two legs share the load equally, so each vertical part is half of it, ${N.half} kN. Their sideways parts are equal and opposite, so they cancel. Call each leg's angle from the horizontal θ. As the legs spread, each leg leans further over. So its pull must grow to keep the same vertical part. Drag the hook, or use the slider, to spread them.`,
      read: `As the legs spread, each leg's pull grows. Its vertical part stays at ${N.half} kN, half the load, and its sideways part grows. At 60° between the legs, each leg pulls ${N.t60} kN.`,
      still: { ang: 60 } },
    { kind: 'pick', scene: 'sling', name: 'Legs at 120°', set: { ang: 120 }, hookF: true, parts: true, theta: 'θ', poly: 'hook', ask: 'legs',
      task: 'The legs now have 120° between them. What does each leg pull?',
      opts: [`${N.half} kN`, `${N.t60} kN`, `${N.t120} kN`], want: `${N.t120} kN`, val: [HALF, legOf(60), legOf(120)],
      hints: { [`${N.half} kN`]: 'Not quite. That is half the load. It is right only for legs hanging straight down.',
        [`${N.t60} kN`]: 'Not quite. 60° is each leg\'s angle from the vertical. Use its angle from the horizontal.' },
      why: `Each leg is 30° from the horizontal, and sin 30° is ${N.sin30}. So each leg pulls ${N.half} ÷ ${N.sin30} = ${N.t120} kN, the whole load. Of that pull, ${N.side120} kN is sideways. The triangle has three equal sides, just like the ring.` },
    { show: true, scene: 'sling', name: 'The load angle factor', set: { ang: 60 }, slider: 'ang', hookF: true, parts: true, theta: 'θ', poly: 'hook', factorSay: true,
      play: { id: 'ang', keys: [[0.4, 60], [3.2, 120]] }, outs: ['legTension'],
      text: `Each leg's tension is half the load times one number, 1 ÷ sin θ. That number is the *load angle factor*. It is ${N.f60} at 60° from the horizontal, ${N.f90} at 45° and ${N.f120} at 30°. So 60° adds about ${N.pct60}% to each leg's half. At 30°, each leg carries the whole load, and the triangle has three equal sides. Keep each leg well above 30° from the horizontal.`,
      still: { ang: 120 } },
    { kind: 'pick', scene: 'sling', name: 'A 2000 kg motor', set: { ang: 90 }, mass: 2000, motor: true, hookF: true, parts: true, theta: '45°', poly: 'hook', ask: 'legs',
      task: `A 2000 kg motor weighs ${N.mW} kN. It hangs on a two-leg sling, each leg 45° from the horizontal. What does each leg pull?`,
      opts: [`${N.mHalf} kN`, `${N.mT} kN`, `${N.mWhole} kN`], want: `${N.mT} kN`, val: [kNof(2000) / 2, legOf(90, kNof(2000)), kNof(2000) * factorOf(90)],
      hints: { [`${N.mHalf} kN`]: 'Not quite. That is half the weight, right only for legs hanging straight down. Times it by the factor.',
        [`${N.mWhole} kN`]: 'Not quite. Each leg holds up only half the weight.' },
      why: `Each leg holds up half the weight, ${N.mHalf} kN. At 45° from the horizontal, the load angle factor is ${N.f90}. So each leg pulls ${N.mHalf} × ${N.f90} = ${N.mT} kN.` },
    { show: true, scene: 'sling', name: 'No weaker, more load', set: { ang: 90 }, slider: 'ang', hookF: true, theta: 'θ', poly: 'hook', limit: true,
      play: { id: 'ang', keys: [[0.4, 90], [3.0, 120]] }, outs: ['angleFactor', 'angleFromHorizontal'],
      text: `Say one leg can safely take 8 kN. A wide angle does not make it weaker. Its strength stays the same while its load grows. At 90° between the legs, each leg carries ${N.t90} kN, so it is fine. At 120°, the same leg carries ${N.t120} kN and is overloaded. So the angle alone can overload a sling.`,
      still: { ang: 120 } },
    { kind: 'pick', scene: 'sling', name: 'Why overloaded?', set: { ang: 120 }, hookF: true, theta: 'θ', poly: 'hook', limit: true, ask: 'why',
      task: 'At 120° between the legs, that 8 kN leg is overloaded. Why?',
      opts: ['The angle weakened the leg', 'The angle raised the leg\'s load', 'The load got heavier'], want: 'The angle raised the leg\'s load', marks: ['strength', 'load', 'weight'],
      hints: { 'The angle weakened the leg': 'Not quite. The leg is just as strong at any angle.',
        'The load got heavier': `Not quite. The load still weighs ${N.W} kN.` },
      why: `The leg's strength stays at 8 kN at any angle. Only its vertical part holds the load up, and that must stay ${N.half} kN. Leaning 30° from the horizontal, the leg must pull ${N.t120} kN to give it. So its load passes its limit.` },
    { show: true, scene: 'crate', name: 'Friction has a giver', set: { push: 0 }, slider: 'push',
      play: { id: 'push', keys: [[0.4, 0], [3.0, 200]] },
      text: 'Friction is a force with a giver too. Push a crate along a level deck, and the deck grips its base. That grip holds it back along the deck. While the crate stays still, the grip matches the push exactly. It can do so up to the most the surfaces can give, here 300 N. Push harder than that, and the crate slides.',
      read: 'The push grows to 200 N, and friction grows to match it, so the crate stays still. The deck could give up to 300 N.',
      still: { push: 200 } },
    { kind: 'pick', scene: 'crate', name: 'A crate that stays put', set: { push: 150 }, push: 150, ask: 'friction',
      task: 'A crate stays put under a 150 N push. The deck could grip with up to 300 N. What friction acts on the crate?',
      opts: ['0 N', '150 N', '300 N'], want: '150 N', val: [0, 150, 300],
      hints: { '0 N': 'Not quite. Then the push would be left over, and the crate would slide.',
        '300 N': 'Not quite. That is the most the deck can give. Friction only matches the push.' },
      why: 'The crate stays still, so the forces along the deck add to nothing. The push is 150 N forward, so friction is 150 N back. The deck could give up to 300 N, but it gives only what it must.' },
    { kind: 'pick', scene: 'sling', name: 'Read the chart right', set: { ang: 120 }, hookF: true, parts: true, theta: 'θ', poly: 'hook', ask: 'factor',
      task: 'A chart gives the load angle factor by each leg\'s angle from the horizontal. Your legs each sit 60° from the vertical. Which factor do you read?',
      opts: [N.f60, N.f90, N.f120], want: N.f120, val: [factorOf(60), factorOf(90), factorOf(120)],
      hints: { [N.f60]: 'Not quite. That is for 60° from the horizontal. Yours are 60° from the vertical.',
        [N.f90]: 'Not quite. That is for 45°. Find each leg\'s angle from the horizontal first.' },
      why: `60° from the vertical is 90° − 60° = 30° from the horizontal. The factor at 30° is ${N.f120}. So each leg carries the whole load, not ${N.pct60}% more than half.` },
    { kind: 'pick', scene: 'sling', name: 'The crane wire', set: { ang: 120 }, hookF: true, theta: 'θ', poly: 'hook', ask: 'wire',
      task: `With 120° between the legs, each leg pulls ${N.t120} kN. What does the crane wire pull?`,
      opts: [`${N.half} kN`, `${N.W} kN`, `${N.wire2} kN`], want: `${N.W} kN`, val: [HALF, W1, 2 * legOf(120)],
      hints: { [`${N.half} kN`]: 'Not quite. That is one leg\'s vertical part. The wire holds up both.',
        [`${N.wire2} kN`]: 'Not quite. That adds both leg pulls. Their sideways parts cancel.' },
      why: `Free the hook. Each leg pulls it down with a vertical part of ${N.half} kN. Their sideways parts cancel. So the wire pulls up ${N.half} + ${N.half} = ${N.W} kN, just the load.` },
  ];
  const FINISH = 'Free one part, draw every force on it, and make them balance. Each sling leg holds the load up with its vertical part only. So each leg pulls half the load times 1 ÷ sin θ, and spreading the legs raises it.';
  const FADE = 0.35, ANS = 2.3;
  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const testing = () => document.documentElement.classList.contains('k-testing');
  const calm = () => REDUCE || testing();
  const el = (id) => document.getElementById(id);
  const idx = (name) => STEPS.findIndex((d) => d.name === name);

  // ---------- state ----------
  const blank = () => ({ pick: null, res: null, why: false });
  let S = STEPS.map(() => blank());
  let finished = false, lastStep = -1, lastDone = false;
  let T = Infinity, motionEnd = 0;          // seconds since the screen opened (a demonstration) or since Check
  let SW = null;                            // a demonstration's sweep of one control
  let AV = 60, PV = 0;                      // the angle between the legs and the push, as drawn
  const BASE = { ang: 60, push: 0 };
  const setupOf = (i) => Object.assign({}, BASE, STEPS[i].set || {});
  const setV = (id, v) => { if (id === 'ang') AV = v; else PV = v; };
  const snapTo = (id, v) => (id === 'ang' ? K.clamp(Math.round(v / 2) * 2, 30, 150) : K.clamp(Math.round(v / 10) * 10, 0, 400));

  // ---------- words with amber key terms (built with K.el, never innerHTML) ----------
  function write(node, s) {
    node.textContent = '';
    const re = /\*([^*]+)\*/g;
    let from = 0, m;
    while ((m = re.exec(s))) {
      if (m.index > from) node.appendChild(document.createTextNode(s.slice(from, m.index)));
      node.appendChild(K.el('span', { class: 'term' }, m[1]));
      from = m.index + m[0].length;
    }
    if (from < s.length) node.appendChild(document.createTextNode(s.slice(from)));
  }

  // ---------- controls ----------
  const stepper = K.stepper({ id: 'step', label: 'Screen', steps: STEPS.map((d) => d.name), value: 0, compact: true, into: '#prog' });
  const at = () => K.clamp(Math.round(stepper.get()) || 0, 0, STEPS.length - 1);
  const angCtl = K.control({ id: 'ang', label: 'Angle between the legs', min: 30, max: 150, step: 2, value: 60, unit: '°', snap: [60, 90, 120], into: '#c-ang' });
  const pushCtl = K.control({ id: 'push', label: 'Push on the crate', min: 0, max: 400, step: 10, value: 0, unit: 'N', snap: [150, 200, 300], into: '#c-push' });
  const CTL = { ang: angCtl, push: pushCtl };
  const RO = [
    K.readout({ id: 'legTension', label: 'Each leg\'s tension', unit: 'kN', decimals: 2, into: '#outs' }),
    K.readout({ id: 'angleFactor', label: 'Load angle factor', decimals: 3, into: '#outs' }),
    K.readout({ id: 'angleFromHorizontal', label: 'Leg angle from horizontal', unit: '°', decimals: 0, into: '#outs' }),
  ];
  const RID = ['legTension', 'angleFactor', 'angleFromHorizontal'];
  K.model((p) => {
    const a = +p.ang, th = thOf(a);
    return { legTension: legOf(a), angleFactor: factorOf(a), angleFromHorizontal: th };
  });

  const pickBtns = [0, 1, 2].map((k) => K.button({ label: 'Answer ' + (k + 1), secondary: true, into: '#picks', press: () => {
    const i = at(), d = STEPS[i], st = S[i];
    if (finished || d.show || k >= d.opts.length || st.res === 'right') return;
    st.pick = d.opts[k]; st.res = null; T = Infinity;
  } }));
  const checkBtn = K.button({ label: 'Check', into: '#acts', press: () => {
    const i = at(), d = STEPS[i], st = S[i];
    if (d.show || finished || st.res === 'right') return;
    if (st.pick == null) { st.res = 'empty'; return; }
    st.res = st.pick === d.want ? 'right' : 'wrong';
    if (calm()) { T = Infinity; return; }
    T = 0; motionEnd = ANS; play();
  } });
  const whyBtn = K.button({ label: 'Why?', secondary: true, into: '#acts', press: () => {
    if (STEPS[at()].show || finished) return;
    const st = S[at()]; st.why = !st.why;
  } });
  const backBtn = K.button({ label: 'Back', secondary: true, into: '#nav', press: () => {
    if (finished) { finished = false; return; }
    stepper.set(Math.max(0, at() - 1), true);
  } });
  const nextBtn = K.button({ label: 'Continue', into: '#nav', press: () => {
    const i = at();

  // ---------- the crate: a push and the deck's grip, side by side ----------
  const DY = 126, CWD = 60, CHT = 50, CL0 = 214, PY = 86, FY = 119, PXN = 0.25;
  function drawCrate(d, st) {
    const t = tlOf(d, st), k = st.pick != null && d.opts ? d.opts.indexOf(st.pick) : -1, ans = answeredOf(st) && k >= 0;
    const push = d.ask === 'friction' ? d.push : PV;
    const fr = d.ask === 'friction' ? (ans ? d.val[k] : null) : frictionOf(push);
    const slides = d.ask !== 'friction' && push > GRIP + 1e-9;
    const off = slides ? K.clamp((push - GRIP) / 100, 0, 1) * 40 : 0, cl = CL0 + off;
    box(8, DY, 324, 10, 'deckf'); ln(8, DY, 332, DY, 'deck av');
    box(cl, DY - CHT, CWD, CHT, 'crate av', 2);
    ln(cl + 7, DY - CHT + 7, cl + CWD - 7, DY - 7, 'plank'); ln(cl + CWD - 7, DY - CHT + 7, cl + 7, DY - 7, 'plank');
    // the most the deck can grip, dashed along friction's course
    const gx = cl - GRIP * PXN;
    ln(cl, FY, gx, FY, 'ref av'); ln(gx, FY - 4, gx, FY + 4, 'ref av');
    const pl = push * PXN, fl = fr == null ? null : fr * PXN, aP = d.ask === 'friction' ? vis(t.pick) : 1;
    REC.pushPx = pl; REC.frPx = fl; REC.slides = slides;
    if (pl > 0.5) {
      const extra = fl != null && pl > fl + 0.5 ? pl - fl : 0;
      if (extra > 0) part(aP, () => ln(cl - pl, PY, cl - pl + extra, PY, 'ar-hot av'));
      arrow(cl - pl + extra, PY, cl, PY, 'ink');
      lab(cl - 6, PY - 11, 'push ' + Math.round(push) + ' N', '', 'end');
    }
    if (fl == null) lab(cl - 16, FY - 9, '?', '', 'end');
    else {
      const extra = fl > pl + 0.5 ? fl - pl : 0;
      part(aP, () => {
        if (extra > 0) { if (pl > 0.5) ln(cl, FY, cl - pl, FY, 'ar-ink av'); arrow(cl - pl, FY, cl - fl, FY, 'hot'); }
        else if (fl > 0.5) arrow(cl, FY, cl - fl, FY, 'ink');
      });
      lab(cl - 6, FY - 9, 'friction ' + Math.round(fr) + ' N', extra > 0 || (d.ask === 'friction' && fl < 0.5) ? 'w' : '', 'end', aP);
    }
    if (slides) lab(cl + CWD / 2, DY - CHT - 22, 'slides', '', 'middle');
    if (d.ask === 'friction' && ans) {
      const net = push - fr;
      lab(cl + CWD / 2, DY - CHT - 22,Math.abs(net) < 1e-9 ? 'balanced' : net > 0 ? 'would slide' : 'would slide back', Math.abs(net) < 1e-9 ? 'm' : 'w', 'middle', vis(t.gap));
      REC.gapKN = Math.abs(net) / 1000;
    }
    // the key
    ln(14, 160, 32, 160, 'ref'); tx(38, 164.5, 'most grip 300 N', 'lab m', 'start');
    ln(170, 160, 188, 160, 'ar-hot'); tx(194, 164.5, 'left over', 'lab m', 'start');
    return 'A crate on a level deck, with a push of ' + Math.round(push) + ' N from one side' +
      (fr == null ? '. The friction on it is the question.' : ' and friction of ' + Math.round(fr) + ' N from the deck along its base' + (slides ? '. The crate slides.' : '.'));
  }

  // ---------- one picture for the step now ----------
  function render(i, st) {
    const d = STEPS[i];
    art.textContent = ''; into = null; LAB = [];
    REC = { texts: [], legPx: null, legKN: null, wirePx: null, wireKN: null, weightPx: null, gapKN: null, hot: false, limitPx: null, over: null,
      hookY: null, vertPx: null, sidePx: null, pushPx: null, frPx: null, slides: false, pullPx: null, theta: false, mark: null };
    const H = d.scene === 'ring' ? 222 : d.scene === 'crate' ? 172 : 322;
    fig.setAttribute('viewBox', '0 0 340 ' + H);
    const words = d.scene === 'ring' ? drawRing(d, st) : d.scene === 'crate' ? drawCrate(d, st) : drawSling(d, st);
    flushLabels();
    fig.setAttribute('aria-label', words);
    const live = !finished && i === at() && d.show && d.slider === 'ang' && REC.hookY != null;
    grip.style.display = live ? '' : 'none';
    if (live) { grip.setAttribute('cx', CX); grip.setAttribute('cy', r2(REC.hookY)); }
    fig.classList.toggle('drag', live);
    return REC;
  }

  // ---------- Dan drags the hook: up closes the legs, down spreads them ----------
  const dragging = () => !finished && STEPS[at()].show && STEPS[at()].slider === 'ang';
  function angFrom(e) {
    const m = fig.getScreenCTM();
    if (!m) return null;
    const q = new DOMPoint(e.clientX, e.clientY).matrixTransform(m.inverse());
    const th = Math.atan2(Math.max(1, YP - q.y), PL) / D2R;
    return snapTo('ang', 180 - 2 * th);
  }
  let held = null;
  grip.addEventListener('pointerdown', (e) => {
    if (!dragging()) return;
    held = e.pointerId;
    try { grip.setPointerCapture(e.pointerId); } catch (err) { /* the drag still follows while the pointer stays on the hook */ }
    e.preventDefault();
    K.reveal();
    const v = angFrom(e);
    if (v != null) angCtl.set(v);
  });
  grip.addEventListener('pointermove', (e) => {
    if (held !== e.pointerId || !dragging()) return;
    e.preventDefault();
    const v = angFrom(e);
    if (v != null && v !== +angCtl.get()) angCtl.set(v);
  });
  const letGo = (e) => { if (held === e.pointerId) held = null; };
  grip.addEventListener('pointerup', letGo);
  grip.addEventListener('pointercancel', letGo);
  grip.addEventListener('lostpointercapture', () => { held = null; });

  // ---------- the words under the picture ----------
  function sayFor(d, p, o) {
    if (d.scene === 'crate') {
      const q = Math.round(+p.push);
      if (q === 0) return 'With no push, the deck needs no grip, so friction is 0 N.';
      if (q <= GRIP) return 'The crate stays still. Friction matches the ' + q + ' N push exactly.';
      return 'The deck can grip with at most ' + GRIP + ' N. The other ' + (q - GRIP) + ' N of the ' + q + ' N push is left over, so the crate slides.';
    }
    const a = Math.round(+p.ang), tt = fx(o.legTension, 2), th = fx(o.angleFromHorizontal, 0);
    if (d.arrive) return 'The wire pulls the hook up with ' + N.W + ' kN. Each leg pulls it down with ' + tt + ' kN, and the three pulls close a triangle.';
    if (d.limit) return o.legTension > SAFE
      ? 'With ' + a + '° between the legs, each leg pulls ' + tt + ' kN, over its safe 8 kN. The leg is no weaker, but its load is bigger.'
      : 'With ' + a + '° between the legs, each leg pulls ' + tt + ' kN, within its safe 8 kN.';
    let s;
    if (a < 120) s = 'With ' + a + '° between the legs, each leg is ' + th + '° from the horizontal and pulls ' + tt + ' kN. Its vertical part is still ' + N.half + ' kN, half the load.';
    else if (a === 120) s = 'With 120° between the legs, each leg is 30° from the horizontal and pulls ' + tt + ' kN, the whole load.';
    else s = 'With ' + a + '° between the legs, each leg pulls ' + tt + ' kN, more than the whole ' + N.W + ' kN load. Only ' + N.half + ' kN of it holds the load up.';
    if (d.factorSay) s += ' The load angle factor is ' + fx(o.angleFactor, 3) + '.';
    return s;
  }
  function layout(i, d, st, p, o) {
    const right = st.res === 'right';
    el('stepbox').hidden = finished;
    el('done').hidden = !finished;
    el('count').textContent = 'Step ' + (i + 1) + ' of ' + STEPS.length + ' · ' + d.name;
    const task = el('task');
    task.className = 'task' + (d.show ? ' show' : '');
    write(task, d.show ? d.text : d.task);
    el('c-ang').hidden = !(d.show && d.slider === 'ang');
    el('c-push').hidden = !(d.show && d.slider === 'push');
    const outs = d.show ? d.outs || [] : [];
    el('outs').hidden = !outs.length;
    RO.forEach((r, k) => { r.el.hidden = outs.indexOf(RID[k]) < 0; });
    el('say').hidden = !d.show;
    el('say').textContent = d.show ? sayFor(d, p, o) : '';
    const opts = d.show ? [] : d.opts;
    el('picks').hidden = !opts.length;
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      b.setLabel(opts[k]);
      b.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });
    el('acts').hidden = !!d.show;
    el('replay').hidden = finished || !(d.show && (d.play || d.arrive)) || REDUCE;
    checkBtn.el.hidden = right;
    const fb = el('fb');
    fb.hidden = !!d.show;
    fb.className = 'fb' + (right ? ' right' : '');
    fb.textContent = d.show ? '' : right ? 'That\'s it.' : st.res === 'wrong' ? d.hints[st.pick] || '' : st.res === 'empty' ? 'Pick an answer first.' : '';
    const why = el('why');
    why.hidden = !!d.show || !st.why;
    if (!d.show) write(why, d.why);
    whyBtn.setLabel(st.why ? 'Hide why' : 'Why?');
    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !right);
    nextBtn.setLabel(i === STEPS.length - 1 ? 'Finish' : 'Continue');
    el('nav').hidden = backBtn.el.hidden && nextBtn.el.hidden;
  }

  write(el('finish'), FINISH);
  K.update((p, o) => {
    const i = at(), d = STEPS[i], st = S[i];
    if (!motion.playing() && (SW || T !== Infinity)) { settle(); K.refresh(); return; }
    if (i !== lastStep) { enterStep(i); K.refresh(); return; }
    // Dan took hold of the control a demonstration was moving.
    if (SW && Math.round(+p[SW.id]) !== SW.last) SW = null;
    // A control this screen does not show keeps the screen's own setting.
    const q = setupOf(i);
    let fix = false;
    ['ang', 'push'].forEach((id) => {
      if (d.show && d.slider === id) return;
      if (+p[id] !== q[id]) { CTL[id].set(q[id], true); fix = true; }
    });
    if (fix) { K.refresh(); return; }
    if (!SW) { AV = +p.ang; PV = +p.push; }
    if (finished !== lastDone) { lastDone = finished; enter(finished ? 'done' : 'stepbox'); }
    render(i, st);
    layout(i, d, st, p, o);
  });

  // ---------- known answers, worked out by hand ----------
  const DO = STEPS.map((d, i) => i).filter((i) => !STEPS[i].show);
  function drawnAt(i, st, over) {
    const keep = { T, AV, PV, SW };
    T = Infinity; SW = null;
    const q = Object.assign(setupOf(i), over || {});
    AV = q.ang; PV = q.push;
    try { return render(i, st || blank()); }
    finally { T = keep.T; AV = keep.AV; PV = keep.PV; SW = keep.SW; render(at(), S[at()]); }
  }
  const answer = (i, o) => ({ pick: o, res: o === STEPS[i].want ? 'right' : 'wrong', why: false });
  const ANGS = [30, 60, 90, 120, 150];
  K.check('Each leg pulls half the load ÷ sin θ: 5.08, 5.66, 6.94, 9.81 and 18.95 kN at 30°, 60°, 90°, 120° and 150° between the legs, where θ is 75°, 60°, 45°, 30° and 15°', () =>
    [['5.08', 75], ['5.66', 60], ['6.94', 45], ['9.81', 30], ['18.95', 15]].every((r, k) => {
      const o = K.at({ ang: ANGS[k] });
      return fx(o.legTension, 2) === r[0] && K.near(o.angleFromHorizontal, r[1], 1e-9) && K.near(o.angleFactor * Math.sin(r[1] * D2R), 1, 1e-12);
    }));
  K.check('Load Angle Factors (1.000 at 90, 1.155 at 60, 1.414 at 45, 2.000 at 30 degrees) let you scale leg tension quickly: the page\'s factor gives the same four', () =>
    fx(K.at({ ang: 0 }).angleFactor, 3) === '1.000' && fx(K.at({ ang: 60 }).angleFactor, 3) === '1.155' && fx(K.at({ ang: 90 }).angleFactor, 3) === '1.414' &&
    fx(K.at({ ang: 120 }).angleFactor, 3) === '2.000', { source: SRC.oep });
  K.check('The vertical component of each tension is T sin θ, with θ from the horizontal: at every setting it is half the load, and the drawn vertical part keeps the same length', () => {
    for (let a = 30; a <= 150; a += 2) { const o = K.at({ ang: a }); if (!K.near(o.legTension * Math.sin(o.angleFromHorizontal * D2R), HALF, 1e-9)) return false; }
    const i = idx('Spread the legs');
    return [40, 60, 90, 120, 150].every((a) => K.near(drawnAt(i, blank(), { ang: a }).vertPx, WPX / 2, 1e-6));
  }, { source: SRC.two });
  K.check('The load in the legs of a sling increases as the angle between the legs increases: each step of the slider raises it, and the drawn leg arrow grows with it', () => {
    for (let a = 30; a < 150; a += 2) if (!(K.at({ ang: a + 2 }).legTension > K.at({ ang: a }).legTension)) return false;
    const i = idx('Spread the legs'), L = ANGS.map((a) => drawnAt(i, blank(), { ang: a }).legPx);
    return L.every((x, k) => k === 0 || x > L[k - 1]);
  }, { source: SRC.hse });
  K.check('There is no change in the tensile strength of the sling leg: its safe mark sits at the same place along the leg at every angle, and only the leg\'s pull passes it', () => {
    const i = idx('No weaker, more load'), r = [60, 90, 120, 150].map((a) => drawnAt(i, blank(), { ang: a }));
    return r.every((x) => K.near(x.limitPx, SAFE * WPX / W1, 1e-9)) && r[0].over === false && r[1].over === false && r[2].over === true && r[3].over === true;
  }, { source: SRC.doe });
  K.check('Sling angles approaching 30° are extremely hazardous: the leg arrows turn to the warning colour only once each leg is below 30° from the horizontal, where it carries more than the whole load', () => {
    const i = idx('Spread the legs');
    return [30, 60, 90, 120].every((a) => !drawnAt(i, blank(), { ang: a }).hot) && [124, 150].every((a) => drawnAt(i, blank(), { ang: a }).hot) && K.at({ ang: 124 }).legTension > W1;
  }, { source: SRC.ihsa });
  K.check('A body at rest remains at rest unless acted on by a net external force: every right answer\'s forces close with no gap, every wrong one leaves a gap, and every demonstration\'s triangle closes', () =>
    DO.every((i) => {
      const d = STEPS[i];
      if (d.ask === 'why') return true;
      return d.opts.every((o) => { const r = drawnAt(i, answer(i, o)); return o === d.want ? r.gapKN != null && r.gapKN < 1e-6 : r.gapKN > 1e-6; });
    }) && STEPS.filter((d) => d.show && d.poly).every((d) => ANGS.every((a) => drawnAt(STEPS.indexOf(d), blank(), { ang: a }).gapKN < 1e-6)), { source: SRC.newton });
  K.check('The worked numbers: two 3 kN pulls 120° apart need 3 kN (5.2 kN if 60° apart); at 120° each leg pulls 9.81 kN, 8.50 kN of it sideways; a 2000 kg motor weighs 19.62 kN, so 13.87 kN a leg at 45°; 60° adds 15%', () =>
    N.ring === '3' && N.ring60 === '5.2' && N.ringSum === '6' && N.t60 === '5.66' && N.t90 === '6.94' && N.t120 === '9.81' && N.side120 === '8.50' && N.half === '4.905' &&
    N.mW === '19.62' && N.mHalf === '9.81' && N.mT === '13.87' && N.mWhole === '27.75' && N.f60 === '1.155' && N.f90 === '1.414' && N.f120 === '2.000' &&
    N.wire2 === '19.62' && N.pct60 === '15' && N.sin30 === '0.5' && N.W === '9.81');
  K.check('Friction matches the push up to 300 N, then holds at 300 N while the crate slides; while it stays still, the push and friction arrows are the same length', () => {
    const i = idx('Friction has a giver');
    const still = [0, 150, 200, 300].every((q) => { const r = drawnAt(i, blank(), { push: q }); return K.near(r.frPx, r.pushPx, 1e-9) && !r.slides; });
    const r4 = drawnAt(i, blank(), { push: 400 });
    return still && r4.slides && K.near(r4.frPx, GRIP * PXN, 1e-9) && frictionOf(150) === 150 && frictionOf(350) === GRIP;
  });
  K.check('The hook sits PL × tan θ above the lifting points, so it drops as the legs spread, as on a shorter sling', () => {
    const i = idx('Spread the legs'), h = ANGS.map((a) => drawnAt(i, blank(), { ang: a }).hookY);
    return h.every((y, k) => K.near(YP - y, PL * Math.tan(thOf(ANGS[k]) * D2R), 1e-6) && (k === 0 || y > h[k - 1]));
  });
  K.check('Each puzzle offers three answers and accepts only its right one, every wrong answer has its own hint, and its picture shows no answer before Check', () =>
    DO.every((i) => {
      const d = STEPS[i];
      if (d.opts.length !== 3 || d.opts.indexOf(d.want) < 0 || d.opts.some((o) => o !== d.want && !d.hints[o])) return false;
      const r = drawnAt(i, blank());
      return (d.ask === 'why' || r.gapKN == null) && (d.ask === 'ring' || r.texts.indexOf(d.want) < 0) &&
        (d.ask !== 'legs' && d.ask !== 'factor' || r.legPx == null) && (d.ask !== 'wire' || r.wirePx == null) &&
        (d.ask !== 'ring' || r.pullPx == null) && (d.ask !== 'friction' || r.frPx == null);
    }));
  K.check('Every demonstration starts after the screen\'s fade and ends within 4.5 s of its screen opening; an answer is drawn within 3 s of Check', () =>
    STEPS.filter((d) => d.show).every((d) => demoStart(d) >= FADE && demoEnd(d) <= 4.5) && 1.5 + K.SOFT <= ANS && ANS <= 3);

  K.ready();
</script>
