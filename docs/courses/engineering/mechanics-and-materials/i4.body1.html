<p class="lead" id="lead">A crane trolley on a level rail, with an example mass of 2000&nbsp;kg and an example 100&nbsp;N of friction while it moves. The other trolleys, speeds and times are examples too.</p>

<p class="caption" id="cap">Net force = mass × acceleration, so the force graph follows the slope of the speed graph, not its height.</p>

<script>
  // ---------- the rules ----------
  const M = 2000, FR = 100, TMAX = 16;     // the example trolley's mass, its example friction while it moves, the time axis
  const SRC = {
    first: 'https://openstax.org/books/university-physics-volume-1/pages/5-2-newtons-first-law',
    steady: 'https://openstax.org/books/physics/pages/4-2-newtons-first-law-of-motion-inertia',
    second: 'https://openstax.org/books/university-physics-volume-1/pages/5-3-newtons-second-law',
  };
  const nf = (v, dp) => { const k = Math.pow(10, dp == null ? 3 : dp), r = Math.round(v * k) / k; return (Math.abs(r) < 1e-9 ? '0' : String(r)).replace('-', '−'); };
  const near = (a, b, tol) => Math.abs(a - b) < (tol == null ? 1e-6 : tol);
  const fmtD = (d) => nf(d, 1);                       // distances, to 0.1 m everywhere

  // A run is four straight parts: speeding up from rest, running steady, braking, at rest. With the
  // push taken away after speeding up, friction alone slows it (or, with no friction, nothing does).
  function norm(q) {
    const top = K.clamp(Math.round(+q.top * 10) / 10, 0.1, 1);
    const tA = K.clamp(Math.round(+q.upEnd * 2) / 2, 1, 6);
    const tB = K.clamp(Math.round(+q.brakeStart * 2) / 2, tA, 15);
    const tC = K.clamp(Math.round(+q.brakeEnd * 2) / 2, tB + 1, Math.min(TMAX, tB + 6));
    return { top, upEnd: tA, brakeStart: tB, brakeEnd: tC, friction: !!q.friction, coast: !!q.coast };
  }
  function runOf(q) {
    const v = q.top, tA = q.upEnd, fr = q.friction ? FR : 0;
    let s = [{ t0: 0, t1: tA, v0: 0, a: v / tA, kind: 'up' }];
    if (!q.coast) {
      s.push({ t0: tA, t1: q.brakeStart, v0: v, a: 0, kind: 'steady' });
      s.push({ t0: q.brakeStart, t1: q.brakeEnd, v0: v, a: -v / (q.brakeEnd - q.brakeStart), kind: 'brake' });
      s.push({ t0: q.brakeEnd, t1: TMAX, v0: 0, a: 0, kind: 'rest' });
    } else if (fr) {
      const tS = Math.min(TMAX, tA + v * M / fr);
      s.push({ t0: tA, t1: tS, v0: v, a: -fr / M, kind: 'coast' });
      if (tS < TMAX) s.push({ t0: tS, t1: TMAX, v0: 0, a: 0, kind: 'rest' });
    } else s.push({ t0: tA, t1: TMAX, v0: v, a: 0, kind: 'coast' });
    s = s.filter((g) => g.t1 > g.t0 + 1e-9);
    let d = 0;
    s.forEach((g) => { g.d0 = d; const T = g.t1 - g.t0; d += g.v0 * T + 0.5 * g.a * T * T; });
    const moving = s.filter((g) => g.kind !== 'rest');
    return { segs: s, fr, total: d, end: moving.length ? moving[moving.length - 1].t1 : TMAX };
  }
  // The trolley at time t: its speed, acceleration, net force, distance, and the forces along the rail.
  function stateAt(run, t) {
    t = K.clamp(+t, 0, TMAX);
    let g = run.segs[run.segs.length - 1];
    for (let k = 0; k < run.segs.length; k++) if (t < run.segs[k].t1 - 1e-9) { g = run.segs[k]; break; }
    const u = t - g.t0, v = Math.max(0, g.v0 + g.a * u), a = g.a, net = M * a;
    const dist = g.d0 + g.v0 * u + 0.5 * g.a * u * u;
    const fric = g.kind === 'rest' ? 0 : run.fr;
    let drive = 0, brake = 0;
    if (g.kind === 'up') drive = net + fric;
    else if (g.kind === 'steady') drive = fric;
    else if (g.kind === 'brake') { const need = -net; if (need >= fric) brake = need - fric; else drive = fric - need; }
    return { v, a, net, dist, fric, drive, brake, kind: g.kind };
  }
  const forcePts = (run) => run.segs.reduce((o, g) => o.concat([[g.t0, M * g.a], [g.t1, M * g.a]]), []);
  function linePts(run, tEnd, tFrom) {
    const out = [], from = tFrom || 0;
    run.segs.forEach((g) => {
      if (g.t1 <= from + 1e-9 || g.t0 >= tEnd - 1e-9) return;
      const a = Math.max(g.t0, from), b = Math.min(g.t1, tEnd);
      if (!out.length) out.push([a, Math.max(0, g.v0 + g.a * (a - g.t0))]);
      out.push([b, Math.max(0, g.v0 + g.a * (b - g.t0))]);
    });
    if (!out.length) out.push([from, 0]);
    return out;
  }
  const forceRange = (run) => (run.segs.every((g) => Math.abs(M * g.a) <= 1000 + 1e-9) ? 1000 : 2000);

  // Couple up: trolley A, 2000 kg at 0.5 m/s, meets trolley B, 2000 kg at rest; the buffers press
  // with a steady 1000 N on each for 0.5 s; no friction. u is seconds since A set off (contact at 1.2 s).
  const CPPM = 100, CXA = 50, CXB = 190, CC = 1.2, CP = 0.5, CF = 1000;
  function coupleAt(u) {
    u = K.clamp(u, 0, 3);
    const aR = CF / M;
    let vA, vB, xA, xB;
    if (u <= CC) { vA = 0.5; vB = 0; xA = CXA + 0.5 * u * CPPM; xB = CXB; }
    else if (u <= CC + CP) { const s = u - CC; vA = 0.5 - aR * s; vB = aR * s; xA = CXA + 0.5 * CC * CPPM + (0.5 * s - 0.5 * aR * s * s) * CPPM; xB = CXB + 0.5 * aR * s * s * CPPM; }
    else { const s = u - CC - CP; vA = 0.5 - aR * CP; vB = aR * CP; xA = CXA + 0.5 * CC * CPPM + (0.5 * CP - 0.5 * aR * CP * CP) * CPPM + vA * s * CPPM; xB = CXB + 0.5 * aR * CP * CP * CPPM + vB * s * CPPM; }
    return { vA, vB, xA, xB, pA: M * vA, pB: M * vB };
  }

  // Every number the words show, worked out from the rules (a check compares them with the lesson's).
  const N = (() => {
    const n = {};
    n.a1 = nf(0.5 / 2); n.s1 = nf(0.5 * 2 * 0.5); n.s2 = nf(0.5 * 4); n.s12 = nf(0.5 * 2 * 0.5 + 0.5 * 4);
    n.p2 = nf(0.6 / 3); n.p2w = nf(3 / 0.6); n.p2a = nf(0.5 * 3 * 0.6);
    n.r3 = nf(0.5 * 2); n.t3 = nf(0.5 * 0.25 * 2 * 2); n.s3 = nf(0.5 * 2 + 0.5 * 0.25 * 2 * 2); n.v3 = nf(0.5 + 0.25 * 2);
    n.p4 = nf(0.5 * 4 * 0.4); n.p4k = nf(0.4 * 4); n.p4s = nf(0.4 / 4); n.p4v = nf(0.4 / 2);
    n.dec = nf(FR / M); n.tStop = nf(0.5 / (FR / M)); n.dStop = nf(0.5 * 0.5 * (0.5 / (FR / M)));
    n.F1 = nf(M * 0.25); n.drive = nf(M * 0.25 + FR); n.brake = nf(M * 0.25 - FR);
    n.p8n = nf(600 - FR); n.p8 = nf((600 - FR) / M); n.p8w = nf(600 / M); n.p8x = nf((600 + FR) / M); n.p8xF = nf(600 + FR);
    n.imp = nf(500 * 2); n.mom = nf(M * 0.5); n.p10 = nf(1500 * 0.4); n.p10w = nf(1500 / 0.4);
    n.cF = nf(M * (0.5 - 0.25) / CP); n.cTot = nf(M * 0.5); n.cEach = nf(M * 0.25); n.cV = nf(M * 0.5 / (2 * M)); n.cPair = nf(2 * M); n.p12h = nf(1000 / 2);
    n.p13m = nf(1000 * 0.8); n.p13 = nf(1000 * 0.8 / 4000); n.p13h = nf(0.8 / 2); n.p13w = nf(4000 * 0.4); n.p13k = nf(4000 * 0.8);
    n.p14d = nf(0.8 - 0.2); n.p14a = nf((0.8 - 0.2) / 4); n.p14 = nf(M * (0.8 - 0.2) / 4); n.p14e = nf(M * 0.8 / 4); n.p14n = nf(M * (0.8 - 0.2));
    n.safe = nf(M * 0.5 / 0.5);
    return n;
  })();

  // ---------- the lesson: SHOW screens demonstrate, DO screens are puzzles ----------
  // live: the trolley under its graphs, run by the time control; ctl: the settings Dan can change there;
  // vis: the controls shown; drag: the speed graph's corners can be dragged; force: the net force graph
  // and the arrows on the trolley; demo: how the screen plays as it opens. marks: what each answer draws.
  const STEPS = [
    { show: true, live: true, scene: 'run', name: 'Slope and area', ctl: ['time', 'top', 'upEnd', 'brakeStart', 'brakeEnd'], vis: ['time'], drag: true,
      outs: ['speed', 'accel'], demo: { keys: [[0.4, 0], [3.4, 6]] }, rate: 2,
      text: `A 2000 kg crane trolley speeds up from rest to 0.5 m/s in 2 s. The *slope* of its speed line is its *acceleration*. Here that is 0.5 ÷ 2 = ${N.a1} m/s². The area under the line is the distance covered. The first part is a triangle, ½ × 2 × 0.5 = ${N.s1} m. The steady part adds 0.5 × 4 = ${N.s2} m. Drag a corner of the graph and press Play.`,
      read: `A 2000 kg crane trolley speeds up from rest to 0.5 m/s in 2 s. The slope of its speed line is its acceleration. Here that is 0.5 ÷ 2 = ${N.a1} m/s². The area under the line is the distance covered. The first part is a triangle, ½ × 2 × 0.5 = ${N.s1} m. The steady part adds 0.5 × 4 = ${N.s2} m. So by 6 s it has gone ${N.s12} m.`,
      still: { time: 6 } },
    { kind: 'pick', scene: 'slopeP', name: 'Find the slope',
      task: 'A trolley speeds up steadily from rest to 0.6 m/s in 3 s. What is its acceleration?',
      opts: [`${N.p2} m/s²`, `${N.p2w} m/s²`, `${N.p2a} m`], want: `${N.p2} m/s²`, marks: ['slope', 'steep', 'area'],
      hints: { [`${N.p2w} m/s²`]: 'Not quite. That is the time ÷ the speed. Divide the change in speed by the time.',
        [`${N.p2a} m`]: 'Not quite. That is the area under the line, which is a distance. The acceleration is the slope.' },
      why: `The slope is the rise in speed over the time it took. The speed rises by 0.6 m/s in 3 s. So the acceleration is 0.6 ÷ 3 = ${N.p2} m/s². Each second, it gains ${N.p2} m/s.` },
    { show: true, scene: 'split', name: 'Split the area', arrive: 'split',
      text: `When the speed doesn't start at zero, split the area. This line rises from 0.5 to ${N.v3} m/s in 2 s, at 0.25 m/s². Underneath is a rectangle, 0.5 × 2 = ${N.r3} m. That is how far the start speed alone would carry it. On top is a triangle, ½ × 0.25 × 2² = ${N.t3} m. That is the extra from speeding up. So it covers ${N.s3} m in all.` },
    { kind: 'pick', scene: 'brakeP', name: 'Braking distance',
      task: 'A trolley at 0.4 m/s brakes steadily to rest in 4 s. How far does it go while braking?',
      opts: [`${N.p4k} m`, `${N.p4s} m`, `${N.p4} m`], want: `${N.p4} m`, marks: ['kept', 'slope', 'area'],
      hints: { [`${N.p4k} m`]: 'Not quite. That is 0.4 × 4, as if it kept its speed. Its speed falls to zero.',
        [`${N.p4s} m`]: 'Not quite. That is the speed ÷ the time, the slope. The distance is the area.' },
      why: `The distance is the area under the speed line. Here that area is a triangle, 4 s wide and 0.4 m/s tall. So it is ½ × 4 × 0.4 = ${N.p4} m. That is the average speed, ${N.p4v} m/s, for 4 s.` },
    { show: true, live: true, scene: 'run', name: 'Take the push away', set: { coast: true }, ctl: ['time', 'friction', 'coast'], vis: ['fric', 'push'], force: true, coastScene: true,
      outs: ['speed', 'accel', 'netForce'], demo: { flip: true }, rate: 4,
      text: `Here the drive's push is taken away once the trolley is at speed. The lower graph is the *net force*: every force along the rail, added up. With friction on, friction is the only force left. That is 100 N backwards, so the speed falls at 100 ÷ 2000 = ${N.dec} m/s². The trolley stops ${N.tStop} s and ${N.dStop} m later. With friction off, nothing acts along the rail. The net force is zero, and it rolls on at 0.5 m/s.`,
      still: { friction: false, time: 16 } },
    { kind: 'pick', scene: 'steadyP', name: 'Running steady',
      task: 'The trolley runs steady at 0.5 m/s along a level rail. Which is true?',
      opts: ['The push must be bigger than friction to keep it moving', 'The push equals friction, so the net force is zero', 'No force acts on it at all'],
      want: 'The push equals friction, so the net force is zero', marks: ['bigger', 'equal', 'none'],
      hints: { 'The push must be bigger than friction to keep it moving': 'Not quite. A bigger push would leave a net force, and the trolley would speed up.',
        'No force acts on it at all': 'Not quite. Friction still holds it back with 100 N. The drive pushes 100 N forward to match.' },
      why: 'Its speed is steady, so its acceleration is zero. So the net force is zero too. Friction holds it back with 100 N. The drive pushes forward with exactly 100 N. The two cancel. It needs no net force to keep moving.' },
    { show: true, live: true, scene: 'run', name: 'The net force graph', ctl: ['time', 'top', 'upEnd', 'brakeStart', 'brakeEnd'], vis: ['time'], drag: true, force: true,
      outs: ['speed', 'accel', 'netForce'], demo: { keys: [[0.4, 0], [4.4, 8]] }, rate: 2,
      text: `Here is the whole run with its net force graph. Net force = mass × acceleration. So this graph follows the speed line's slope, not its height. Speeding up at 0.25 m/s² takes 2000 × 0.25 = ${N.F1} N. The drive gives ${N.drive} N, as friction takes 100 N. Running steady takes no net force, whatever the speed. Braking takes ${N.F1} N the other way. Drag a corner and watch the force graph.`,
      read: `Here is the whole run with its net force graph. Net force = mass × acceleration. So this graph follows the speed line's slope, not its height. Speeding up at 0.25 m/s² takes 2000 × 0.25 = ${N.F1} N. The drive gives ${N.drive} N, as friction takes 100 N. Running steady takes no net force, whatever the speed. Braking takes ${N.F1} N the other way. The force graph steps up only while the speed rises, and down only while it falls.`,
      still: { time: 1 } },
    { kind: 'pick', scene: 'pushP', name: 'Push against friction',
      task: 'The 2000 kg trolley\'s drive pushes 600 N. Friction holds it back with 100 N. What is its acceleration?',
      opts: [`${N.p8w} m/s²`, `${N.p8} m/s²`, `${N.p8x} m/s²`], want: `${N.p8} m/s²`, marks: ['alone', 'net', 'added'],
      hints: { [`${N.p8w} m/s²`]: 'Not quite. That uses the push alone. Take friction away first.',
        [`${N.p8x} m/s²`]: 'Not quite. That adds friction to the push. Friction acts the other way, so take it away.' },
      why: `Add the forces along the rail. 600 N forward and 100 N back leave ${N.p8n} N forward. That is the net force. So the acceleration is ${N.p8n} ÷ 2000 = ${N.p8} m/s².` },
    { show: true, scene: 'impulse', name: 'Impulse and momentum', arrive: 'impulse',

  K.check('The worked numbers: 0.25 m/s², 0.5 m and 2 m; 0.2, 5 and 0.9; 1 m, 0.5 m and 1.5 m; 0.8, 1.6 and 0.1 m; 500, 600 and 400 N; 0.25, 0.3 and 0.35 m/s²; 1000 N s and 1000 kg m/s; 600 and 3750; 500 N; 0.2, 0.4 and 0.8 m/s; 300, 400 and 1200 N', () =>
    N.a1 === '0.25' && N.s1 === '0.5' && N.s2 === '2' && N.p2 === '0.2' && N.p2w === '5' && N.p2a === '0.9' && N.v3 === '1' &&
    N.p4 === '0.8' && N.p4k === '1.6' && N.p4s === '0.1' && N.F1 === '500' && N.p8 === '0.25' && N.p8w === '0.3' && N.p8x === '0.35' &&
    N.imp === '1000' && N.mom === '1000' && N.p10 === '600' && N.p10w === '3750' && N.p12h === '500' && N.p13 === '0.2' && N.p13h === '0.4' &&
    N.p13m === '800' && N.p14 === '300' && N.p14e === '400' && N.p14n === '1200' && N.p14a === '0.15' && N.safe === '2000');
  K.check('Each puzzle offers three answers and accepts only its right one, every wrong answer has its own hint, nothing is marked before Check, and once checked only the right answer is drawn without red', () =>
    DO.every((i) => {
      const d = STEPS[i];
      if (d.opts.length !== 3 || d.opts.indexOf(d.want) < 0 || d.opts.some((o) => o !== d.want && !d.hints[o])) return false;
      const b = drawnAt(i, blank());
      if (b.ans || b.hot) return false;
      return d.opts.every((o) => { const r = drawnAt(i, answer(i, o)); return r.ans && (o === d.want ? r.bal === true && r.hot === 0 : r.bal === false && r.hot > 0); });
    }));
  K.check('Every demonstration starts after the screen\'s fade and ends within 5 s of its screen opening; an answer is drawn within 3 s of Check', () =>
    STEPS.filter((d) => d.show).every((d) => demoStart(d) >= FADE && demoEnd(d) > demoStart(d) && demoEnd(d) <= 5) && ANS <= 3);

  K.ready();
