<p class="caption" id="cap">The motor is an example. The gears turn 50 times slower than real, but the readouts give real speeds.</p>

<script>
  // ---------- the rules ----------
  const TAU = 2 * Math.PI, DEG = Math.PI / 180;
  const P_IN = 11000, N_IN = 1450, MM = 4, SLOW = 50, Z2P = 20, Z2W = 60, PSI = 45 * DEG;
  const SRC = {
    ratio: 'https://eng.libretexts.org/Bookshelves/Mechanical_Engineering/Mechanics_Map_(Moore_2nd_Edition)/12:_Rigid_Body_Kinematics/12.04:_Belt-_and_Gear-Driven_Systems',
    rads: 'https://pages.mtu.edu/~wjendres/ProductRealization1Course/DC_Motor_Calculations.pdf',
    trade: 'https://uomustansiriyah.edu.iq/media/lectures/5/5_2021_12_11!08_32_40_PM.pdf',
    align: 'https://www.energy.gov/sites/prod/files/2014/04/f15/importance_motor_shaft_motor_systemts4.pdf',
  };
  const radOf = (n) => n * TAU / 60;                 // rev/min -> rad/s
  const W_IN = radOf(N_IN);                          // the motor: 1450 rev/min is 151.8 rad/s
  const T_IN = P_IN / W_IN;                          // 11,000 W ÷ 151.8 rad/s = 72.4 N m
  const ratioOf = (zIn, zOut) => zOut / zIn;         // the driven gear's teeth ÷ the driving gear's
  // The train: the speed divides by the ratio, the torque multiplies by it and by the efficiency,
  // and the power out is the power in × the efficiency (each pair losing its own share).
  function train(zp, zw, eff, pair2) {
    const ratio = ratioOf(zp, zw) * (pair2 ? ratioOf(Z2P, Z2W) : 1), e = Math.pow(eff, pair2 ? 2 : 1);
    return { ratio, e, n: N_IN / ratio, T: T_IN * ratio * e, P: P_IN * e / 1000, loss: P_IN * (1 - e) };
  }
  const rimV = (zp) => W_IN * zp * MM / 2000;        // m/s at the mesh: the motor's ω × the pinion's radius
  // A driven gear's angle when its driver is at thA, meshing in direction psi from the driver:
  // the teeth sit in each other's gaps and their pitch circles roll without slipping.
  const drivenAt = (thA, zA, zB, psi) => psi + Math.PI + Math.PI / zB - (zA / zB) * (thA - psi);

  // Numbers as the lesson writes them: fixed decimals, commas from 10,000 up.
  function fx(v, dp) {
    const k = Math.pow(10, dp), r = Math.round(Math.abs(v) * k + 1e-7) / k;
    const parts = r.toFixed(dp).split('.');
    let a = parts[0];
    if (a.length > 4) a = a.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (v < 0 && r > 0 ? '−' : '') + a + (parts[1] ? '.' + parts[1] : '');
  }
  const nf = (v, dp) => { const s = fx(v, dp == null ? 2 : dp); return s.indexOf('.') < 0 ? s : s.replace(/0+$/, '').replace(/\.$/, ''); };
  const spdTxt = (n) => fx(n, n < 99.95 ? 1 : 0);    // the pump shaft's speed, as its readout shows it

  // Every number the words show, worked out from the rules.
  const OPEN = train(20, 100, 0.95, false), COMP = train(20, 100, 0.95, true);
  const N = {
    W: fx(W_IN, 1), T: fx(T_IN, 1), v: fx(rimV(20), 1), F: fx(T_IN / 0.04, 0), T100: fx(T_IN * 5, 0),
    T95: fx(OPEN.T, 0), P95: fx(OPEN.P, 2), L95: fx(OPEN.loss, 0), n5: fx(N_IN / 5, 0),
    nC: fx(COMP.n, 1), PC: fx(COMP.P, 2), TC: fx(COMP.T, 0),
    q2: fx(N_IN / 3, 0), q2x: fx(N_IN * 3, 0),
    q4: fx(20 * 3, 0), q4x: fx(20 / 3, 1),
    q6: fx(15 * 0.96, 1), q6x: fx(15 * 4, 0),
    q8: fx(1440 / (4 * 6), 0), q8x: fx(1440 / (4 + 6), 0), q8f: fx(1440 / 4, 0),
    q10: fx(1450 * 100 / 250, 0), q10x: fx(1450 * 250 / 100, 0),
    q12n: fx(960 / 4, 0), q12w: fx(radOf(240), 2), q12: fx(4000 / radOf(240), 0), q12mw: fx(radOf(960), 1), q12m: fx(4000 / radOf(960), 1), q12r: fx(4000 / 240, 1),
  };
  // A SHOW screen's words for reading, where its last sentence asks for a move.
  const readAs = (t, end) => t.replace(/ (Drag|Slide|Switch)[^.]*\.$/, '') + ' ' + end;

  // ---------- the lesson: SHOW screens demonstrate, DO screens are puzzles ----------
  const T1 = `The motor's 20-tooth *pinion* meshes with a 100-tooth *wheel* on the pump's shaft. Each pinion tooth that passes the dot pushes one wheel tooth past. So both gears' teeth move at the same speed there. The pinion turns five times to pass all 100 teeth. So the wheel turns five times slower: 1450 rev/min in, ${N.n5} rev/min out. The *gear ratio* is the driven gear's teeth ÷ the driving gear's teeth. Here that is 100 ÷ 20 = 5. Drag either gear's rim to change its teeth.`;
  const T3 = `Torque goes the other way. The reason lies at the mesh. The pinion's teeth sit 0.04 m from its centre. So the motor's ${N.T} N m pushes them with ${N.T} ÷ 0.04 = ${N.F} N. That push acts on the wheel's tooth, and it pushes back just as hard. But the wheel's tooth sits 0.2 m from its centre, five times as far out. So the wheel's torque is ${N.F} × 0.2 = ${N.T100} N m. That is five times the motor's. Here nothing is lost to friction.`;
  const T5 = `Power is torque × angular speed, with the speed in rad/s. Five times the torque at a fifth of the speed is the same power. So a gearbox cannot make power. Friction turns a little of it into heat. At 100% efficiency the full 11 kW passes through. At an example 95%, ${N.L95} W is lost at the mesh. The pump gets ${N.P95} kW. Its torque drops from ${N.T100} N m to ${N.T95} N m. Slide the efficiency to try others.`;
  const T7 = `Two pairs in a row make a *compound gear train*. A second 20-tooth pinion sits on the wheel's shaft. It drives a 60-tooth wheel, a ratio of 3. The pump moves onto that last shaft. The ratios multiply: 5 × 3 = 15. So the pump shaft turns at 1450 ÷ 15 = ${N.nC} rev/min. Each pair loses its own share of the power. At 95% each, about 90% gets through. The pump shaft carries ${N.TC} N m. Switch Second pair off to compare.`;
  const T9 = `A *belt* works the same way. If it does not slip, it moves at the speed of both pulley rims. So a belt's ratio is the driven pulley's diameter ÷ the driving pulley's diameter. Here that is 400 ÷ 80 = 5, the same as the gears. An open belt turns both pulleys the same way. Two gears meshing on their outsides turn opposite ways. Switch Belt off to compare.`;
  const T11 = `The slow shaft carries almost five times the torque for the same power. So it is usually the thicker one. Its coupling must carry that torque too. A coupling's two shafts must have their centre lines in one straight line, within a small tolerance. Shafts that meet at an angle, or sit parallel but offset, have *misalignment*. It causes vibration, noise and heat. It also wears out bearings, couplings and shafts early.`;
  const rpm = (s) => s + ' rev/min', nm = (s) => s + ' N m', kw = (s) => s + ' kW';
  const AL = ['Parallel misalignment', 'Nothing: the shafts are parallel', 'Angular misalignment'];
  const STEPS = [
    { show: true, rig: 'pair', name: 'The gear pair', text: T1,
      read: readAs(T1, 'More teeth on the wheel make the pump shaft turn slower and push harder.') },
    { kind: 'pick', pic: 'ratioQ', name: 'Wheel speed',
      task: 'A 15-tooth pinion turns at 1450 rev/min. It drives a 45-tooth wheel. How fast does the wheel turn?',
      opts: [rpm(N.q2), rpm(N.q2x), rpm('1450')], order: [1, 0, 2], want: rpm(N.q2),
      nv: { [rpm(N.q2)]: N_IN / 3, [rpm(N.q2x)]: N_IN * 3, [rpm('1450')]: N_IN },
      hints: { [rpm(N.q2x)]: 'Not quite. That multiplies by the ratio. The bigger gear turns slower, so divide.',
        [rpm('1450')]: 'Not quite. The pinion must turn three times to pass all 45 teeth. So the wheel turns slower.' },
      why: `The ratio is 45 ÷ 15 = 3. The pinion must turn three times to pass all 45 of the wheel's teeth. So the wheel turns at 1450 ÷ 3 = ${N.q2} rev/min.`,
      qw: [],
      ow: { [rpm(N.q2)]: ['45 ÷ 15 = 3', `1450 ÷ 3 = ${N.q2} rev/min`], [rpm(N.q2x)]: [`1450 × 3 = ${N.q2x}: times the ratio, not ÷`],
        [rpm('1450')]: ['1450: as if the gears kept the speed'] } },
    { show: true, pic: 'push', name: 'The push at the mesh', text: T3 },
    { kind: 'pick', pic: 'torqueQ', name: 'Wheel torque',
      task: 'The same 15 and 45-tooth pair has 20 N m on its pinion. Nothing is lost to friction. What torque does the wheel\'s shaft carry?',
      opts: [nm(N.q4), nm(N.q4x), nm('20')], order: [1, 2, 0], want: nm(N.q4),
      tv: { [nm(N.q4)]: 60, [nm(N.q4x)]: 20 / 3, [nm('20')]: 20 },
      hints: { [nm(N.q4x)]: 'Not quite. That divides the torque by the ratio. The wheel turns slower and pushes harder.',
        [nm('20')]: 'Not quite. The wheel\'s teeth sit three times as far out. The same push there gives three times the torque.' },
      why: `The ratio is 45 ÷ 15 = 3. The wheel's teeth sit three times as far from its centre as the pinion's. The same push at the mesh gives three times the torque: 20 × 3 = ${N.q4} N m.`,
      qw: [],
      ow: { [nm(N.q4)]: ['45 ÷ 15 = 3', `20 × 3 = ${N.q4} N m`], [nm(N.q4x)]: [`20 ÷ 3 = ${N.q4x}: divided, not ×`], [nm('20')]: ['20 N m: passed through unchanged'] } },
    { show: true, rig: 'power', name: 'Power passes through', set: { eff: 100 }, still: { eff: 95 }, text: T5,
      read: readAs(T5, 'A lower efficiency turns more of the power into heat.') },
    { kind: 'pick', pic: 'powerQ', name: 'Power out',
      task: '15 kW goes into a 4 : 1 gearbox. Its efficiency is 96%. How much power reaches the output shaft?',
      opts: [kw(N.q6), kw(N.q6x), kw('15')], order: [1, 0, 2], want: kw(N.q6),
      kv: { [kw(N.q6)]: 15 * 0.96, [kw(N.q6x)]: 60, [kw('15')]: 15 },
      hints: { [kw(N.q6x)]: 'Not quite. That multiplies the power by the ratio. A gearbox cannot make power.',
        [kw('15')]: 'Not quite. Friction turns a little of the power into heat. Take off the loss.' },
      why: `A gearbox trades speed for torque, but it cannot make power. The power out is the power in × the efficiency: 15 × 0.96 = ${N.q6} kW. The rest turns to heat.`,
      qw: [],
      ow: { [kw(N.q6)]: [`15 × 0.96 = ${N.q6} kW`], [kw(N.q6x)]: [`15 × 4 = ${N.q6x} kW: power is not multiplied`], [kw('15')]: ['15 kW: the loss left out'] } },
    { show: true, rig: 'pair2', name: 'A second pair', set: { pair2: true }, text: T7,
      read: readAs(T7, 'With one pair only, the ratio is 5.') },
    { kind: 'pick', pic: 'compoundQ', name: 'Two pairs',
      task: 'A motor at 1440 rev/min drives a 4 : 1 pair, then a 6 : 1 pair. How fast does the output shaft turn?',
      opts: [rpm(N.q8), rpm(N.q8x), rpm(N.q8f)], order: [1, 0, 2], want: rpm(N.q8),
      hints: { [rpm(N.q8x)]: 'Not quite. That adds the ratios. In a compound train they multiply.',
        [rpm(N.q8f)]: 'Not quite. That counts only the first pair. The second pair slows it six times more.' },
      why: `The ratios multiply: 4 × 6 = 24. So the output turns at 1440 ÷ 24 = ${N.q8} rev/min. Pair by pair, 1440 ÷ 4 = ${N.q8f}, then ${N.q8f} ÷ 6 = ${N.q8}.`,
      qw: [],
      ow: { [rpm(N.q8)]: ['4 × 6 = 24', `1440 ÷ 24 = ${N.q8} rev/min`], [rpm(N.q8x)]: ['4 + 6 = 10: added, not multiplied', `1440 ÷ 10 = ${N.q8x} rev/min`],
        [rpm(N.q8f)]: [`1440 ÷ 4 = ${N.q8f}: the second pair left out`] } },
    { show: true, rig: 'belt', name: 'A belt', set: { belt: true }, text: T9,
      read: readAs(T9, 'Gears give the same ratio, but turn the pump shaft the other way.') },
    { kind: 'pick', pic: 'beltQ', name: 'Belt speed',
      task: 'A 100 mm motor pulley turns at 1450 rev/min. A belt drives a 250 mm fan pulley. How fast does the fan turn?',
      opts: [rpm(N.q10), rpm(N.q10x), rpm('1450')], order: [1, 0, 2], want: rpm(N.q10),
      nv: { [rpm(N.q10)]: 580, [rpm(N.q10x)]: 3625, [rpm('1450')]: 1450 },
      hints: { [rpm(N.q10x)]: 'Not quite. That turns the ratio upside down. The bigger pulley turns slower.',
        [rpm('1450')]: 'Not quite. The belt moves at both rims\' speed. The bigger pulley needs more belt for each turn, so it turns slower.' },
      why: `The belt moves at the speed of both pulley rims. The ratio is 250 ÷ 100 = 2.5. So the fan turns at 1450 ÷ 2.5 = ${N.q10} rev/min.`,
      qw: [],
      ow: { [rpm(N.q10)]: ['250 ÷ 100 = 2.5', `1450 ÷ 2.5 = ${N.q10} rev/min`], [rpm(N.q10x)]: [`1450 × 250 ÷ 100 = ${N.q10x}: upside down`],
        [rpm('1450')]: ['1450: as if the belt kept the speed'] } },
    { show: true, pic: 'align', name: 'Lining up shafts', text: T11 },
    { kind: 'pick', pic: 'drumQ', name: 'Winch drum',
      task: 'A 4 kW motor at 960 rev/min drives a winch drum through a 4 : 1 gearbox. Nothing is lost to friction. What torque does the drum shaft carry?',
      opts: [nm(N.q12), nm(N.q12m), nm(N.q12r)], order: [1, 0, 2], want: nm(N.q12),
      tv: { [nm(N.q12)]: 4000 / radOf(240), [nm(N.q12m)]: 4000 / radOf(960), [nm(N.q12r)]: 4000 / 240 },
      hints: { [nm(N.q12m)]: 'Not quite. That is the motor\'s own torque. The gearbox multiplies it by 4.',
        [nm(N.q12r)]: 'Not quite. That leaves the speed in rev/min. Change it to rad/s first.' },
      why: `The drum turns at 960 ÷ 4 = ${N.q12n} rev/min. That is ${N.q12n} × 2π ÷ 60 = ${N.q12w} rad/s. Torque is power ÷ angular speed. So the drum carries 4000 ÷ ${N.q12w} = ${N.q12} N m.`,
      qw: [],
      ow: { [nm(N.q12)]: [`960 ÷ 4 = ${N.q12n} rev/min = ${N.q12w} rad/s`, `4000 ÷ ${N.q12w} = ${N.q12} N m`],
        [nm(N.q12m)]: [`960 rev/min = ${N.q12mw} rad/s`, `4000 ÷ ${N.q12mw} = ${N.q12m}: the motor's own`], [nm(N.q12r)]: [`4000 ÷ ${N.q12n} = ${N.q12r}: still in rev/min`] } },
    { kind: 'pick', pic: 'alignQ', name: 'A hot coupling',
      task: 'A pump\'s coupling and bearings run hot after a refit. A check finds the two shafts parallel, but one sits 0.5 mm higher. What is wrong?',
      opts: AL, order: [1, 0, 2], want: AL[0],
      hints: { [AL[1]]: 'Not quite. Parallel is not enough. The two centre lines must be one line.',
        [AL[2]]: 'Not quite. Angular misalignment is shafts meeting at an angle. These are parallel but offset.' },
      why: 'The centre lines must lie in one straight line. Here they are parallel but 0.5 mm apart. That is parallel misalignment. It brings vibration, noise and heat, and wears out bearings and couplings early.',
      qw: [],
      ow: { [AL[0]]: ['Parallel, but 0.5 mm apart', 'Two centre lines, not one'], [AL[1]]: ['Parallel, yet still two lines'], [AL[2]]: ['No angle: the lines are parallel'] } },
  ];
  const FINISH = 'A gear pair divides the speed by its ratio and multiplies the torque by it. The power passes through, less a small loss. Ratios in a row multiply. A coupling\'s shafts must lie in one straight line.';
  const ANS = 1.6;
  const optsOf = (d) => (d.order ? d.order.map((k) => d.opts[k]) : d.opts);
  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const testing = () => document.documentElement.classList.contains('k-testing');
  const calm = () => REDUCE || testing();
  const el = (id) => document.getElementById(id);
  const iOf = (k, v) => STEPS.findIndex((d) => d[k] === v);

  // ---------- drawing helpers ----------

      bt.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });
    el('acts').hidden = !!d.show;
    el('replay').hidden = finished || !replays(d) || REDUCE;
    checkBtn.el.hidden = right;
    const fb = el('fb');
    fb.hidden = !!d.show;
    fb.className = 'fb say' + (right ? ' right' : '');
    fb.textContent = d.show ? '' : right ? 'That\'s it.' : st.res === 'wrong' ? (d.hints[st.pick] || '') : st.res === 'empty' ? 'Pick an answer first.' : '';
    const why = el('why');
    why.hidden = !!d.show || !st.why;
    if (!d.show) write(why, d.why);
    whyBtn.setLabel(st.why ? 'Hide why' : 'Why?');
    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !right);
    nextBtn.setLabel(i === STEPS.length - 1 ? 'Finish' : 'Continue');
    el('nav').hidden = backBtn.el.hidden && nextBtn.el.hidden;
  }

  write(el('finish'), FINISH);
  K.update((p) => {
    const i = at(), d = STEPS[i], st = S[i];
    if (i !== lastStep) { enterStep(i); K.refresh(); return; }
    // a demonstration that was stopped (the page hidden, a test) shows finished
    if (T !== Infinity && !anim.playing()) { T = Infinity; settle(); K.refresh(); return; }
    // the efficiency slider moved by hand during the glide: the hand wins
    if (MOT && MOT.kind === 'eff' && Math.round(+p.eff) !== effSet) { T = Infinity; MOT = null; effSet = Math.round(+p.eff); }
    // a switch flipped: the new parts arrive
    if (d.rig === 'pair2' || d.rig === 'belt') {
      const on = !!p[d.rig];
      if (on !== lastTog) { lastTog = on; if (!calm()) { MOT = { kind: 'swap' }; T = 0; END = 1.0; anim.play(); } }
    }
    if (finished !== lastDone) { lastDone = finished; enter(finished ? 'done' : 'stepbox'); }
    render(i, p);
    layout(i, d, st, p);
  });

  // ---------- known answers, worked out by hand ----------
  const DO = STEPS.map((d, i) => i).filter((i) => !STEPS[i].show);
  const answer = (i, o) => ({ pick: o, res: o === STEPS[i].want ? 'right' : 'wrong', why: false });
  const near = (a, b, tol) => K.near(a, b, tol);
  const words = (s) => String(s).split(/\s+/).filter((w) => /[A-Za-z0-9]/.test(w)).length;
  // A screen drawn in a given state, finished; returns what it drew.
  function drawn(i, st, over) {
    const keep = { S: S[i], T, MOT };
    S[i] = st; T = Infinity; MOT = null;
    try { return render(i, Object.assign({ step: i }, setupOf(i), over || {})); }
    finally { S[i] = keep.S; T = keep.T; MOT = keep.MOT; render(at(), K.params()); }
  }

  K.check('The gear ratio is the input\'s angular speed ÷ the output\'s: 1450 ÷ 290 = 5 for the opening pair, and 1450 ÷ 96.7 = 15 with the second pair', () => {
    const o = K.at({ step: I_PAIR }), c = K.at({ step: I_P2, pair2: true });
    return near(o.outSpeed, 290, 1e-9) && near(N_IN / o.outSpeed, 5, 1e-12) && near(N_IN / c.outSpeed, 15, 1e-12) && spdTxt(c.outSpeed) === '96.7';
  }, { source: SRC.ratio });
  K.check('A belt that does not slip moves at the speed of both pulley rims: 6.1 m/s round the 80 mm pulley at 151.8 rad/s and round the 400 mm pulley at 30.4 rad/s', () => {
    const o = K.at({ step: I_BELT, belt: true }), w = radOf(o.outSpeed);
    return near(W_IN * 0.04, w * 0.2, 1e-9) && fx(w, 1) === '30.4' && N.v === '6.1' && N.W === '151.8' &&
      [[12, 120], [40, 12], [25, 60]].every(([zp, zw]) => near(W_IN * zp * MM / 2000, radOf(K.at({ step: I_BELT, belt: true, zp, zw }).outSpeed) * zw * MM / 2000, 1e-9));
  }, { source: SRC.ratio });
  K.check('Rotational power needs the speed in rad/s: 11 kW at 151.8 rad/s is 72.4 N m, and the drum\'s 4000 W at 25.13 rad/s is 159 N m, where 4000 ÷ 240 would give 16.7', () =>
    N.T === '72.4' && N.q12w === '25.13' && N.q12 === '159' && N.q12r === '16.7' && near(T_IN * W_IN, 11000, 1e-9), { source: SRC.rads });
  K.check('Speed reduced, torque increased, and the power out smaller than the power in: torque × speed out is the power out at every tooth count, and below 100% it is under 11 kW', () => {
    const Z = [[12, 12], [12, 120], [20, 100], [40, 12], [33, 47]];
    return Z.every(([zp, zw]) => {
      const o = K.at({ step: I_PAIR, zp, zw, eff: 100 }), q = K.at({ step: I_PAIR, zp, zw, eff: 90 });
      return near(o.outTorque * radOf(o.outSpeed), 11000, 1e-6) && near(q.outTorque * radOf(q.outSpeed), q.powerOut * 1000, 1e-6) &&
        (zp === zw ? near(o.outTorque, T_IN, 1e-9) : (o.outSpeed < N_IN) === (o.outTorque > T_IN)) && q.powerOut < 11;
    });
  }, { source: SRC.trade });
  K.check('The opening pair: 5 : 1 gives 290 rev/min and, at 95%, 344 N m and 10.45 kW with 550 W lost; the teeth meet at 6.1 m/s and push with 1811 N, giving 362 N m with no loss', () => {
    const o = K.at({ step: I_PAIR }), full = K.at({ step: I_POW, eff: 100 });
    return fx(o.outSpeed, 0) === '290' && fx(o.outTorque, 0) === '344' && fx(o.powerOut, 2) === '10.45' && N.L95 === '550' &&
      N.F === '1811' && fx(full.outTorque, 0) === '362' && fx(full.powerOut, 2) === '11.00';
  });
  K.check('Two pairs: 5 × 3 = 15 gives 96.7 rev/min, 9.93 kW (about 90%) and 981 N m at 95% each, and the last shaft turns the same way as the motor', () => {
    const c = K.at({ step: I_P2, pair2: true }), th = (t) => drivenAt(drivenAt(t, 20, 100, 0), Z2P, Z2W, PSI);
    return spdTxt(c.outSpeed) === '96.7' && fx(c.powerOut, 2) === '9.93' && fx(c.outTorque, 0) === '981' && fx(COMP.e * 100, 0) === '90' &&
      drivenAt(1, 20, 100, 0) < drivenAt(0, 20, 100, 0) && th(1) > th(0);
  });
  K.check('Equal teeth pass the speed and torque through less the loss; a wheel smaller than the pinion speeds the pump shaft up and cuts its torque', () => {
    const e = K.at({ step: I_PAIR, zp: 30, zw: 30 }), u = K.at({ step: I_PAIR, zp: 40, zw: 20 });
    return near(e.outSpeed, N_IN, 1e-9) && near(e.outTorque, T_IN * 0.95, 1e-9) && near(u.outSpeed, 2900, 1e-9) && u.outTorque < T_IN;
  });
  K.check('Both gears\' teeth move at the same speed at the mesh: the drawn wheel turns by the pinion\'s teeth ÷ its own, at every tooth count', () =>
    [[12, 120], [20, 100], [40, 12], [17, 63]].every(([zp, zw]) => near((drivenAt(0, zp, zw, 0) - drivenAt(1, zp, zw, 0)) * zw, zp, 1e-9) &&
      near(rimV(zp), radOf(train(zp, zw, 1, false).n) * zw * MM / 2000, 1e-9)));
  K.check('Every puzzle answer is worked from its rule: 483 rev/min, 60 N m, 14.4 kW, 60 rev/min, 580 rev/min and 159 N m, with the wrong picks 4350, 6.7, 60 kW, 144, 360, 3625, 39.8 and 16.7', () => {
    const w = (n) => STEPS[iOf('pic', n)].want;
    return w('ratioQ') === '483 rev/min' && w('torqueQ') === '60 N m' && w('powerQ') === '14.4 kW' && w('compoundQ') === '60 rev/min' && w('beltQ') === '580 rev/min' && w('drumQ') === '159 N m' &&
      N.q2x === '4350' && N.q4x === '6.7' && N.q6x === '60' && N.q8x === '144' && N.q8f === '360' && N.q10x === '3625' && N.q12m === '39.8' && N.q12r === '16.7' && N.q12mw === '100.5';
  });
  K.check('Misalignment brings heat to couplings and bearings: the hot pump with parallel shafts 0.5 mm apart has parallel misalignment', () => STEPS[I_AQ].want === AL[0] && STEPS[I_AQ].opts.length === 3, { source: SRC.align });
  K.check('Each puzzle offers three answers and accepts only its right one; every wrong answer has its own hint and its working drawn in red, and nothing is marked before Check', () =>
    DO.every((i) => {
      const d = STEPS[i];
      if (d.opts.length !== 3 || d.opts.indexOf(d.want) < 0) return false;
      if (drawn(i, blank()).wk.some((x) => x.ans)) return false;
      if (!drawn(i, answer(i, d.want)).wk.some((x) => x.ans && !x.bad)) return false;
      return d.opts.filter((o) => o !== d.want).every((o) => !!d.hints[o] && drawn(i, answer(i, o)).wk.some((x) => x.ans && x.bad));
    }));
  K.check('Every demonstration ends within 4 s of its screen opening, and every answer is drawn within 2.5 s of Check', () => {
    const keep = { T, MOT };
    try {
      return STEPS.every((d, i) => {
        if (d.show) {
          const plan = demoPlan(d);
          T = Infinity; MOT = null; latest = 0;
          render(i, Object.assign({ step: i }, setupOf(i)));
          return plan.end <= 4 && latest <= Math.max(plan.end, 1);
        }
        return d.opts.every((o) => {
          const keepS = S[i];
          T = Infinity; MOT = null; latest = 0; S[i] = answer(i, o);
          try { render(i, Object.assign({ step: i }, setupOf(i))); } finally { S[i] = keepS; }
          return latest <= 2.5 && ANS <= 2.5;
        });
      });
    } finally { T = keep.T; MOT = keep.MOT; render(at(), K.params()); }
  });
  K.check('Every screen that shows an idea says it in 90 words or fewer', () => STEPS.every((d) => !d.show || (words(d.text) <= 90 && (!d.read || words(d.read) <= 90))));

  K.ready();
</script>
