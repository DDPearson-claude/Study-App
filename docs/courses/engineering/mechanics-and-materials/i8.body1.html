<p class="caption" id="cap">An example rotor, turning 20 times slower than real, with its shake drawn 40 times bigger.</p>

<script>
  // ---------- the rules ----------
  const TAU = 2 * Math.PI, DEG = Math.PI / 180;
  const M = 50, MS = 0.02, RSP = 0.15, MR = MS * RSP, KM = 500000;   // the example rotor: kg, kg, m, kg m, N/m
  const SLOW = 20, BIG = 40, ZOPEN = 0.05, ROCK = 2.5;                // drawn 20 times slower, shake drawn 40 times bigger
  const SRC = {
    sq: 'https://web.mst.edu/~stutts/ME242/LABMANUAL/DynamicBalancingExp.pdf',
    crit: 'https://www.engineersedge.com/vibration/dynamic_resonance_review_9853.htm',
    res: 'https://openstax.org/books/college-physics-2e/pages/16-8-forced-oscillations-and-resonance',
    planes: 'https://rotorlab.tamu.edu/me459/Rotor%20Balancing/Rotating_Machinery_Rotor_Balancing.pdf',
  };
  const radOf = (n) => n * TAU / 60;                 // rev/min -> rad/s
  const rpmOf = (w) => w * 60 / TAU;                 // rad/s -> rev/min
  const WN = Math.sqrt(KM / M);                      // the mounts swing on their own at 100 rad/s
  const NCRIT = rpmOf(WN);                           // 955 rev/min, the critical speed
  // The heavy spot's pull: mass × radius × the angular speed squared, the speed in rad/s.
  const pullAt = (n, mr) => (mr == null ? MR : mr) * radOf(n) * radOf(n);
  // The damping: 2 × the damping factor × √(k M).
  const cOf = (z) => 2 * z * Math.sqrt(KM * M);
  // The steady shake of the driven spring and mass, in mm: m r ω² ÷ √((k − M ω²)² + (c ω)²).
  function shakeMm(n, z) { const w = radOf(n); return 1000 * MR * w * w / Math.hypot(KM - M * w * w, cOf(z) * w); }
  // How far the swing lags the turning pull: none far below the critical speed, half a turn far above it.
  const lagOf = (n, z) => { const w = radOf(n); return Math.atan2(cOf(z) * w, KM - M * w * w); };
  // A 20 g balance weight 0.15 m out, at an angle round from the spot: the two pulls add as forces do.
  const balF = (deg) => 2 * Math.abs(Math.cos(deg * DEG / 2));
  // Screen 1: a mass on a spring driven by a push that comes and goes, at the opening damping factor.
  const swingRel = (rf) => 1 / Math.hypot(1 - rf * rf, 2 * ZOPEN * rf);
  // The long rotor: the up-and-down parts of the pulls at each end (spots on opposite sides).
  const endPulls = (th, ends) => ({ L: Math.cos(th) - (ends ? Math.cos(th) : 0), R: -Math.cos(th) + (ends ? Math.cos(th) : 0) });

  // Numbers as the lesson writes them: fixed decimals, commas from 10,000 up.
  function fx(v, dp) {
    const k = Math.pow(10, dp), r = Math.round(Math.abs(v) * k + 1e-7) / k;
    const parts = r.toFixed(dp).split('.');
    let a = parts[0];
    if (a.length > 4) a = a.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (v < 0 && r > 0 ? '−' : '') + a + (parts[1] ? '.' + parts[1] : '');
  }
  const nf = (v, dp) => { const s = fx(v, dp == null ? 2 : dp); return s.indexOf('.') < 0 ? s : s.replace(/0+$/, '').replace(/\.$/, ''); };

  // Every number the words show, worked out from the rules.
  const N = {
    p1450: fx(pullAt(1450), 0), w2900: fx(radOf(2900), 1), p2900: fx(pullAt(2900), 0), p2x: fx(2 * pullAt(1450), 0),
    fn: fx(WN / TAU, 1), crit: fx(NCRIT, 0), off: nf(1000 * MR / M, 2),
    s300: fx(shakeMm(300, ZOPEN), 3), s1450: fx(shakeMm(1450, ZOPEN), 2), s2400: fx(shakeMm(2400, ZOPEN), 2),
    pk05: nf(1000 * MR / M / (2 * ZOPEN), 2), q41: fx(balF(90), 2),
    q5: fx(20 * 60, 0), q7: nf(1000 * MR / M / (2 * 0.1), 2),
    q9: fx(30 * 0.10 / 0.15, 0), q9x: fx(30 * 0.15 / 0.10, 0), q9m: nf(30 * 0.10, 2), q9w: nf(30 * 0.15, 2),
    q12w: fx(radOf(3000), 1), q12: fx(0.01 * 0.2 * radOf(3000) * radOf(3000), 0), q12r: fx(0.01 * 0.2 * 3000 * 3000, 0), q12s: fx(0.01 * 0.2 * 50 * 50, 0),
    q13w: fx(Math.sqrt(2000000 / M), 0), q13: fx(rpmOf(Math.sqrt(2000000 / M)), 0), q13x: fx(4 * NCRIT, 0), q13h: fx(NCRIT / 2, 0),
  };
  // A SHOW screen's words for reading, where its last sentence asks for a move.
  const readAs = (t, end) => t.replace(/ (Drag|Slide|Switch)[^.]*\.$/, '') + (end ? ' ' + end : '');

  // ---------- the lesson: SHOW screens demonstrate, DO screens are puzzles ----------
  const T2 = `A rotor with more mass on one side has an *unbalance*. Here a 20 g heavy spot sits 0.15 m from the axis. The shaft must pull it round. So the spot pulls the shaft outwards just as hard. That pull is the spot's mass × its radius × the angular speed squared, with the speed in rad/s. It points at the spot and turns with it. So it pushes the mounts up, then down, once a turn. Slide the speed to watch the pull grow.`;
  const T4 = `As the speed sweeps up, the shake does not just grow. The 50 kg rotor on its mounts swings on its own at ${N.fn} times a second. That is its *natural frequency*. At ${N.crit} rev/min the rotor turns ${N.fn} times a second too. Each push then arrives in step with the swing and adds to it. That speed is the *critical speed*. The shake peaks there at ${N.pk05} mm. Above it, each push reverses before the rotor can follow. So the shake falls back and settles near ${N.off} mm.`;
  const T6 = `*Damping* takes energy out of every swing. Here the damping factor rises from 0.05 to 0.2. The peak drops from ${N.pk05} mm to about 0.15 mm and spreads wider. Away from the peak, the shake hardly changes. At the critical speed the shake is ${N.off} mm ÷ (2 × the damping factor). So doubling the damping halves the peak. But damping only softens it. The pull is still there. Slide the damping down to 0.02 and the peak climbs to 1.5 mm.`;
  const T8 = `Balancing removes the cause that damping only softens. A 20 g *balance weight* sits 0.15 m out, like the spot. At any speed its pull is just as big, and points at the weight. The two pulls add, as forces do. Beside the spot, the total pull is twice as big. A quarter turn away, it is ${N.q41} times as big. Opposite the spot, the two pulls cancel at every speed. The curve goes flat at zero. Slide the weight round to try others.`;
  const T10 = `A long rotor needs more care. Here a 20 g heavy spot sits near each end, on opposite sides. Their two pulls cancel in total. But one pushes its end up while the other pushes the far end down. So together they rock the shaft end over end, as a *couple*. A balance weight at each end, opposite each spot, stops the rocking. A flexible rotor needs weights in more places. Switch Balance weights on to see it.`;
  const T14 = `Two ideas build on this one. A beam bends under a load. A shaft twists a little as it carries torque. A gearbox's slow shaft is usually made thick to carry its torque. Good balance lets it carry that torque smoothly. So does a critical speed well clear of its running speed.`;
  const hz = (s) => s + ' Hz', nw = (s) => s + ' N', rpm = (s) => s + ' rev/min', mm = (s) => s + ' mm', gr = (s) => s + ' g';
  const MO = ['It passes through a critical speed', 'Its heavy spot pulls hardest at 950 rev/min', 'It is short of torque at 950 rev/min'];
  const STEPS = [
    { kind: 'pick', pic: 'springQ', name: 'In step',
      task: 'A mass on a spring swings on its own at 2 Hz. A push that comes and goes drives it. Which push gives the biggest steady swing?',
      opts: [hz('2'), hz('0.5'), hz('8')], order: [1, 0, 2], want: hz('2'),
      hz: { [hz('2')]: 2, [hz('0.5')]: 0.5, [hz('8')]: 8 },
      hints: { [hz('0.5')]: 'Not quite. A slow push just carries the mass along with it. The swing stays small.',
        [hz('8')]: 'Not quite. A fast push reverses before the mass can get moving. It barely swings.' },
      why: 'The mass swings on its own at 2 Hz. A push at 2 Hz arrives in step, once each swing. So each push adds to the swing. It grows until damping takes out as much as each push puts in. That is *resonance*.',
      qw: [],
      ow: { [hz('2')]: ['Each push arrives in step with the swing', 'So each one adds to it'], [hz('0.5')]: ['0.5 Hz: the mass just follows the push'],
        [hz('8')]: ['8 Hz: each push reverses too soon'] } },
    { show: true, rig: 'pull', name: 'The heavy spot\'s pull', text: T2, still: { rpm: 1450 },
      read: readAs(T2, `At 1450 rev/min the pull is ${N.p1450} N.`) },
    { kind: 'pick', pic: 'pullQ', name: 'Twice the speed',
      task: `At 1450 rev/min the heavy spot pulls with ${N.p1450} N. What does it pull with at 2900 rev/min?`,
      opts: [nw(N.p2900), nw(N.p2x), nw(N.p1450)], order: [1, 0, 2], want: nw(N.p2900),
      pv: { [nw(N.p2900)]: pullAt(2900), [nw(N.p2x)]: 2 * pullAt(1450), [nw(N.p1450)]: pullAt(1450) },
      hints: { [nw(N.p2x)]: 'Not quite. That doubles the pull with the speed. But the speed counts twice.',
        [nw(N.p1450)]: 'Not quite. The faster the spot goes round, the harder the shaft must pull it.' },
      why: `2900 rev/min is twice 1450. At double the speed, the spot moves twice as fast and swings its direction round twice as quickly. So the pull is four times as big. At ${N.w2900} rad/s it is 0.02 × 0.15 × ${N.w2900}² = ${N.p2900} N.`,
      qw: [],
      ow: { [nw(N.p2900)]: ['2900 is twice 1450', 'Speed counts twice: 2 × 2 = 4', `0.02 × 0.15 × ${N.w2900}² = ${N.p2900} N`],
        [nw(N.p2x)]: [`2 × ${N.p1450} = ${N.p2x}: speed counted only once`], [nw(N.p1450)]: [`${N.p1450} N: as if speed made no difference`] } },
    { show: true, rig: 'sweep', name: 'The critical speed', text: T4, still: { rpm: 2400 } },
    { kind: 'pick', pic: 'pumpQ', name: 'Where it peaks',
      task: 'A pump set\'s mounts swing on their own at 20 Hz. The pump runs up to 2900 rev/min. At what speed does it shake hardest on the way up?',
      opts: [rpm(N.q5), rpm('2900'), rpm('20')], order: [1, 0, 2], want: rpm(N.q5),
      nv: { [rpm(N.q5)]: 1200, [rpm('2900')]: 2900, [rpm('20')]: 20 },
      hints: { [rpm('2900')]: 'Not quite. The shake does not just grow with speed. It peaks where the turns match the mounts\' own swing.',
        [rpm('20')]: 'Not quite. 20 Hz is 20 turns a second. A minute has 60 seconds.' },
      why: `The shake peaks where the shaft turns as often as the mounts swing: 20 times a second. That is 20 × 60 = ${N.q5} turns a minute, the pump's *critical speed*. Above it, the shake falls back.`,
      qw: [],
      ow: { [rpm(N.q5)]: ['20 Hz is 20 turns a second', `20 × 60 = ${N.q5} rev/min`], [rpm('2900')]: ['2900: the top speed, not the peak'],
        [rpm('20')]: ['20: hertz not turned into rev/min'] } },
    { show: true, rig: 'damp', name: 'Damping', text: T6, still: { zeta: 0.2 },
      read: readAs(T6, 'At 0.02 the peak climbs to 1.5 mm.') },
    { kind: 'pick', pic: 'dampQ', name: 'Double the damping',
      task: `At a damping factor of 0.05 this rotor shakes ${N.pk05} mm at its critical speed. The damping doubles to 0.1. How far does it shake at the critical speed now?`,
      opts: [mm(N.q7), mm('0'), mm(N.pk05)], order: [1, 0, 2], want: mm(N.q7),
      sv: { [mm(N.q7)]: 0.3, [mm('0')]: 0, [mm(N.pk05)]: 0.6 },
      hints: { [mm('0')]: 'Not quite. Damping softens the shake. The pull is still there, so the shake is too.',
        [mm(N.pk05)]: 'Not quite. Damping does more than move the peak. It takes energy out of every swing.' },
      why: `At the critical speed the shake is ${N.off} mm ÷ (2 × the damping factor). At 0.1 that is ${N.off} ÷ 0.2 = ${N.q7} mm. Doubling the damping halves the peak. The pull is still there.`,
      qw: [],
      ow: { [mm(N.q7)]: [`${N.off} ÷ (2 × 0.1) = ${N.q7} mm`, 'Double the damping, half the peak'], [mm('0')]: ['0 mm: damping softens, it cannot remove'],
        [mm(N.pk05)]: [`${N.pk05} mm: as if damping only moved the peak`] } },
    { show: true, rig: 'bal', name: 'A balance weight', text: T8, still: { bal: 180 },
      read: readAs(T8, '') },
    { kind: 'pick', pic: 'massQ', name: 'Balance mass',
      task: 'A rotor has a 30 g heavy spot 0.10 m from its axis. A balance weight goes opposite, 0.15 m out. What mass must it have?',
      opts: [gr(N.q9), gr('30'), gr(N.q9x)], order: [0, 1, 2], want: gr(N.q9),
      mv: { [gr(N.q9)]: 20, [gr('30')]: 30, [gr(N.q9x)]: 45 },
      hints: { [gr('30')]: 'Not quite. The weight sits further out, so it needs less mass. Match mass × radius.',
        [gr(N.q9x)]: 'Not quite. That turns the radii upside down. Further out needs less mass, not more.' },
      why: `The weight needs the same mass × radius as the spot: 30 × 0.10 = ${N.q9m}. At 0.15 m that takes ${N.q9m} ÷ 0.15 = ${N.q9} g. Then their pulls are equal and opposite at every speed.`,
      qw: [],
      ow: { [gr(N.q9)]: [`Same mass × radius: 30 × 0.10 = ${N.q9m}`, `${N.q9m} ÷ 0.15 = ${N.q9} g`], [gr('30')]: [`30 × 0.15 = ${N.q9w}: more than the spot's ${N.q9m}`],
        [gr(N.q9x)]: [`30 × 0.15 ÷ 0.10 = ${N.q9x}: radii upside down`] } },
    { show: true, rig: 'long', name: 'A long rotor', text: T10, still: { ends: true },
      read: readAs(T10, '') },
    { kind: 'pick', pic: 'motorQ', name: 'A shake on the way up',
      task: 'A motor runs up to 1450 rev/min. It shakes hard for a moment near 950 rev/min, then runs smoothly. Why?',
      opts: MO, order: [1, 0, 2], want: MO[0],
      hints: { [MO[1]]: 'Not quite. The pull grows with the speed squared. It is bigger at 1450 rev/min than at 950.',
        [MO[2]]: 'Not quite. Shaking needs a push that comes and goes. The turning pull gives one, once a turn.' },
      why: 'Near 950 rev/min the motor turns as often as its mounts swing on their own. Each turn\'s push arrives in step, so the shake builds. Past that *critical speed*, each push reverses before the motor can follow. So it runs smoothly at 1450 rev/min.',
      qw: [],
      ow: { [MO[0]]: ['Near 950 it turns as the mounts swing', 'Past it, each push reverses too soon'], [MO[1]]: ['The pull grows with speed: most at 1450'],
        [MO[2]]: ['Shaking needs a push that comes and goes'] } },
    { kind: 'pick', pic: 'radQ', name: 'Pull at speed',
      task: 'A 10 g heavy spot sits 0.2 m from the axis. The rotor turns at 3000 rev/min. How hard does the spot pull on the shaft?',
      opts: [nw(N.q12), nw(N.q12r), nw(N.q12s)], order: [2, 0, 1], want: nw(N.q12),
      pv: { [nw(N.q12)]: 0.01 * 0.2 * radOf(3000) * radOf(3000), [nw(N.q12r)]: 18000, [nw(N.q12s)]: 5 },
      hints: { [nw(N.q12r)]: 'Not quite. The speed must be in rad/s, not rev/min.',
        [nw(N.q12s)]: 'Not quite. 50 is turns a second. Each turn is 2π radians.' },
      why: `First change the speed to rad/s: 3000 × 2π ÷ 60 = ${N.q12w} rad/s. The pull is the mass × the radius × the speed squared: 0.01 × 0.2 × ${N.q12w}² = ${N.q12} N.`,
      qw: [],
      ow: { [nw(N.q12)]: [`3000 × 2π ÷ 60 = ${N.q12w} rad/s`, `0.01 × 0.2 × ${N.q12w}² = ${N.q12} N`], [nw(N.q12r)]: [`0.01 × 0.2 × 3000² = ${N.q12r}: rev/min`],
        [nw(N.q12s)]: [`0.01 × 0.2 × 50² = ${N.q12s}: rev/s, not rad/s`] } },
    { kind: 'pick', pic: 'stiffQ', name: 'Stiffer mounts',
      task: 'The 50 kg rotor\'s mounts are stiffened from 500 to 2000 kN/m. Where is its critical speed now?',
      opts: [rpm(N.q13), rpm(N.q13x), rpm(N.q13h)], order: [2, 0, 1], want: rpm(N.q13),

      hints: { [rpm(N.q13x)]: 'Not quite. The natural frequency goes with the square root of the stiffness.',

  // ---------- one screen's picture ----------
  function render(i, p) {
    const d = STEPS[i], st = S[i];

  // ---------- the words under the picture ----------
  function sayFor(d, p) {
    if (!d.rig || T !== Infinity) return '';
    if (d.rig === 'long') return p.ends ? 'Each end\'s weight cancels its own spot\'s pull. Nothing is left to rock the shaft.'
      : 'The two pulls cancel in total. But they act at opposite ends, so they rock the shaft end over end.';
    const s = rigOf(d, p), o = rigOf(d, Object.assign({}, setupOf(STEPS.indexOf(d)), END_OF[d.rig]));
    // the line under the picture waits for a move: at the demonstration's end the words above say it all
    if (['n', 'z', 'a'].every((k) => o[k] === s[k])) return '';
    const X = fx(s.X, 3);
    if (d.rig === 'pull') {
      if (s.n === 0) return 'At rest the heavy spot does not pull on the shaft at all.';
      if (s.F < 0.5) return 'At ' + fx(s.n, 0) + ' rev/min the heavy spot\'s pull is less than half a newton.';
      return 'At ' + fx(s.n, 0) + ' rev/min the heavy spot pulls the shaft outwards with ' + fx(s.F, 0) + ' N. The pull turns with the spot, pushing the mounts up, then down, once a turn.';
    }
    if (d.rig === 'sweep') {
      if (s.n === 0) return 'At rest nothing turns, so nothing shakes.';
      if (s.n < 880) return 'Below the critical speed the pull is small, and the stiff mounts give only a little. The shake is ' + X + ' mm.';
      if (s.n <= 1030) return 'Near ' + N.crit + ' rev/min each push arrives in step with the swing and adds to it. The shake is ' + X + ' mm.';
      return 'Above the critical speed each push reverses before the rotor can follow. So the shake falls back, to ' + X + ' mm.';
    }
    if (d.rig === 'damp') {
      const z = fx(s.z, 2);
      return 'With a damping factor of ' + z + ', the shake at the critical speed is ' + N.off + ' ÷ (2 × ' + z + ') = ' + fx(0.06 / (2 * s.z), 3) + ' mm. At ' + fx(s.n, 0) + ' rev/min it is ' + X + ' mm.';
    }
    const b = Math.min(s.a, 360 - s.a);
    if (b === 0) return 'Beside the spot, the two pulls add to twice one pull. So the shake doubles at every speed.';
    if (b === 180) return 'Opposite the spot, the two pulls cancel at every speed. Nothing is left to shake the mounts.';
    return 'The weight sits ' + fx(b, 0) + '° round from the spot. Together the two pulls make ' + fx(s.f, 2) + ' times one pull. So the shake is ' + fx(s.f, 2) + ' times its size without the weight.';

  K.check('Unbalance forces are proportional to the rotating speed of the rotor squared: at every speed, twice the speed gives four times the pull', () =>
    [5, 100, 300, 600, 955, 1200].every((n) => near(K.at({ step: I_PULL, rpm: 2 * n }).pull / K.at({ step: I_PULL, rpm: n }).pull, 4, 1e-9)), { source: SRC.sq });

      near(b.pull, 0.02 * 0.15 * b.omega * b.omega, 1e-9);
  });
  K.check('Dynamic resonance: the rotor speed at which the shake peaks is the critical speed, where the shaft turns as often as the mounts swing on their own', () => {
    let best = 0, bx = -1;
    for (let n = 0; n <= 2400; n += 5) { const x = K.at({ step: I_SW, rpm: n }).shake; if (x > bx) { bx = x; best = n; } }
    return Math.abs(best - NCRIT) < 5 && near(radOf(NCRIT), Math.sqrt(KM / M), 1e-9);
  }, { source: SRC.crit });
  K.check('The mounts swing on their own at √(500,000 ÷ 50) = 100 rad/s, 15.9 times a second, so the critical speed is 955 rev/min, where the shake is 0.06 mm ÷ (2 × 0.05) = 0.6 mm', () =>
    near(WN, 100, 1e-12) && N.fn === '15.9' && N.crit === '955' && near(shakeMm(NCRIT, ZOPEN), 0.6, 1e-9) && fx(K.at({ step: I_SW, rpm: 955 }).shake, 1) === '0.6' && N.pk05 === '0.6');
  K.check('At damping 0.05 the shake is 0.007 mm at 300 rev/min, 0.11 mm at 1450 and 0.07 mm at 2400, and far above the critical speed it settles towards the 0.06 mm offset of the centre of mass', () =>
    N.s300 === '0.007' && N.s1450 === '0.11' && N.s2400 === '0.07' && N.off === '0.06' && near(shakeMm(1e6, ZOPEN), 0.06, 1e-5) && shakeMm(2400, ZOPEN) > 0.06);
  K.check('The greatest response is for the least amount of damping: across the damping slider, less damping always gives a higher peak', () => {
    const pk = (z) => { let b = 0; for (let n = 850; n <= 1150; n += 5) b = Math.max(b, K.at({ step: I_DA, rpm: n, zeta: z }).shake); return b; };
    const zs = [0.02, 0.05, 0.1, 0.2, 0.3];
    return zs.every((z, k) => k === 0 || pk(z) < pk(zs[k - 1]));
  }, { source: SRC.res });
  K.check('More damping gives a lower, wider peak: 1.5 mm at 0.02, 0.6 mm at 0.05, and 0.15 mm near 995 rev/min at 0.2, while at 300 and 2400 rev/min the shake hardly changes', () => {
    const p02 = peakOf(0.02), p05 = peakOf(0.05), p20 = peakOf(0.2);
    const lo = (z) => K.at({ step: I_DA, rpm: 300, zeta: z }).shake, hi = (z) => K.at({ step: I_DA, rpm: 2400, zeta: z }).shake;
    return fx(p02[0], 1) === '1.5' && fx(p05[0], 1) === '0.6' && fx(p20[0], 2) === '0.15' && p20[1] === 995 && Math.abs(lo(0.2) / lo(0.05) - 1) < 0.02 && Math.abs(hi(0.2) / hi(0.05) - 1) < 0.03;
  });
  K.check('Resonance occurs when the driving frequency equals the natural frequency: of the three pushes on the mass on a spring, the one at its own frequency swings it most', () =>
    swingRel(2 / 2) > swingRel(0.5 / 2) && swingRel(2 / 2) > swingRel(8 / 2) && STEPS[I_Q1].want === '2 Hz', { source: SRC.res });
  K.check('A balance weight with the same mass × radius cancels the pull at every speed opposite the spot, doubles it beside the spot, and makes it 1.41 times a quarter turn away', () => {
    const one = K.at({ step: I_BAL, bal: 90 }).shake / balF(90);
    return [100, 600, 955, 1450, 2400].every((n) => shakeMm(n, ZOPEN) * balF(180) < 1e-12 && near(shakeMm(n, ZOPEN) * balF(0), 2 * shakeMm(n, ZOPEN), 1e-12)) &&
      K.at({ step: I_BAL, bal: 180 }).shake < 1e-12 && near(K.at({ step: I_BAL, bal: 0 }).shake, 2 * one, 1e-9) && N.q41 === '1.41' &&
      near(K.at({ step: I_BAL, bal: 270 }).shake, K.at({ step: I_BAL, bal: 90 }).shake, 1e-12) && near(one, shakeMm(1450, ZOPEN), 1e-12);
  });
  K.check('A rigid rotor can be balanced at the two end planes: a weight at each end, opposite each spot, leaves no pull at either end, while without them the pulls cancel in total but rock the shaft', () =>
    [0, 0.4, 1, 2, 3, 4.5].every((t) => { const w = endPulls(t, true), o = endPulls(t, false); return Math.abs(w.L) < 1e-12 && Math.abs(w.R) < 1e-12 && Math.abs(o.L + o.R) < 1e-12; }) &&
    Math.abs(endPulls(0, false).L - endPulls(0, false).R) > 1, { source: SRC.planes });
  K.check('Every puzzle answer is worked from its rule: 2 Hz, 277 N, 1200 rev/min, 0.3 mm, 20 g, 197 N and 1910 rev/min, with the wrong picks 138, 2900, 20, 0, 0.6, 30, 45, 18,000, 5, 3820 and 477', () => {
    const w = (n) => STEPS[iOf('pic', n)].want;
    return w('springQ') === '2 Hz' && w('pullQ') === '277 N' && w('pumpQ') === '1200 rev/min' && w('dampQ') === '0.3 mm' && w('massQ') === '20 g' && w('radQ') === '197 N' && w('stiffQ') === '1910 rev/min' &&
      N.p2x === '138' && N.q9x === '45' && N.q12r === '18,000' && N.q12s === '5' && N.q13x === '3820' && N.q13h === '477' && N.q12w === '314.2' && N.w2900 === '303.7' && N.q13w === '200';
  });
  K.check('Each puzzle offers three answers and accepts only its right one; every wrong answer has its own hint and its working drawn in red, and nothing is marked before Check', () =>
    DO.every((i) => {
      const d = STEPS[i];
      if (d.opts.length !== 3 || d.opts.indexOf(d.want) < 0) return false;
      if (drawn(i, blank()).wk.some((x) => x.ans)) return false;
      if (!drawn(i, answer(i, d.want)).wk.some((x) => x.ans && !x.bad)) return false;
      return d.opts.filter((o) => o !== d.want).every((o) => !!d.hints[o] && drawn(i, answer(i, o)).wk.some((x) => x.ans && x.bad));
    }));
  K.check('Every demonstration ends within 5 s of its screen opening, and every answer is drawn within 2.5 s of Check', () => {
    const keep = { T, MOT };
    try {
      return STEPS.every((d, i) => {
        if (d.show) {
          const plan = demoPlan(d);
          T = Infinity; MOT = null; latest = 0;
          render(i, Object.assign({ step: i }, setupOf(i)));
          return plan.end <= 5 && latest <= Math.max(plan.end, 1);
        }
        return d.opts.every((o) => {
          const keepS = S[i];
          T = Infinity; MOT = null; latest = 0; S[i] = answer(i, o);
          try { render(i, Object.assign({ step: i }, setupOf(i))); } finally { S[i] = keepS; }
          return latest <= 2.5 && ANS <= 2.5;
        });
      });
    } finally { T = keep.T; MOT = keep.MOT; render(at(), K.params()); }
  });
  K.check('Every screen that shows an idea says it in 90 words or fewer', () => STEPS.every((d) => !d.show || (words(d.text) <= 90 && (!d.read || words(d.read) <= 90))));

  K.ready();
</script>
