<p class="lead" id="lead">A motor spins a shaft with two arms, each carrying a 25 kg mass. The masses, torques and the motor and pump curves are examples.</p>

<p class="caption" id="cap">Time runs four times faster than real. The drawn spin is slowed so you can follow it.</p>

<script>
  // ---------- the rules ----------
  const M = 25, R0 = 0.2, T0 = 50, N_RUN = 1450, TS = 4, TAU = 2 * Math.PI, DEG = Math.PI / 180;
  const SRC = {
    moment: 'https://www.bbc.co.uk/bitesize/articles/z96g3j6',
    rads: 'https://pages.mtu.edu/~wjendres/ProductRealization1Course/DC_Motor_Calculations.pdf',
    fly: 'https://www.explainthatstuff.com/flywheels.html',
  };
  const radOf = (n) => n * TAU / 60;                              // rev/min -> rad/s
  const rpmOf = (w) => w * 60 / TAU;                              // rad/s -> rev/min
  const W_RUN = radOf(N_RUN);                                     // 1450 rev/min is 151.8 rad/s
  const inertiaOf = (r, m) => 2 * (m == null ? M : m) * r * r;    // kg m²: two masses m, each r out
  const alphaOf = (Tq, I) => Tq / I;                              // rad/s gained each second: net torque ÷ I
  const runUpOf = (I, Tq, w) => (w == null ? W_RUN : w) / alphaOf(Tq, I);
  const energyOf = (I, w) => 0.5 * I * w * w;                     // J, ½ × I × ω²
  const pushOf = (Tq, r) => Tq / r;                               // N, the arm's push on a mass r out
  const powerOf = (Tq, w) => Tq * w;                              // W, torque × ω in rad/s
  // The motor and pump sketches: a cage motor's curve by its slip, and a pump load rising with speed².
  const PEAK = 276, SPK = 0.25, NSYNC = 1500, P11 = 11000;
  const motorT = (n) => { const s = (NSYNC - n) / NSYNC; return s <= 0 ? 0 : 2 * PEAK / (s / SPK + SPK / s); };
  const PUMP_K = P11 / W_RUN / (N_RUN * N_RUN);                   // the pump takes 11 kW at 1450 rev/min
  const pumpT = (n) => PUMP_K * n * n;
  const netT = (n) => motorT(n) - pumpT(n);
  // Where the curves meet, 99% of that, and the seconds per kg m² to reach it.
  const NS = (() => { let lo = 1300, hi = 1499.9; for (let k = 0; k < 60; k++) { const m = (lo + hi) / 2; if (netT(m) > 0) lo = m; else hi = m; } return (lo + hi) / 2; })();
  const N99 = 0.99 * NS;
  const G = (() => { const n = 20000, w1 = radOf(N99); let s = 0; for (let i = 0; i < n; i++) s += (w1 / n) / netT(rpmOf((i + 0.5) / n * w1)); return s; })();
  // The motor and pump run-up on 1 kg m², stepped once: on I kg m² the same speeds come I times later.
  const DT1 = 0.002, TMAX1 = 8;
  const TAB = (() => {
    const n = Math.round(TMAX1 / DT1), w = new Float64Array(n + 1), th = new Float64Array(n + 1), f = (v) => netT(rpmOf(v));
    for (let i = 1; i <= n; i++) {
      const v = w[i - 1], k1 = f(v), k2 = f(v + DT1 * k1 / 2), k3 = f(v + DT1 * k2 / 2), k4 = f(v + DT1 * k3);
      w[i] = v + DT1 * (k1 + 2 * k2 + 2 * k3 + k4) / 6;
      th[i] = th[i - 1] + DT1 * (w[i - 1] + w[i]) / 2;
    }
    return { w, th };
  })();
  function look(a, tau) { const x = Math.min(Math.max(tau / DT1, 0), a.length - 1), i = Math.min(a.length - 2, Math.floor(x)); return a[i] + (a[i + 1] - a[i]) * (x - i); }
  const pumpW = (t, I) => look(TAB.w, t / I);
  const pumpTh = (t, I) => I * look(TAB.th, t / I);

  // Numbers as the lesson writes them: fixed decimals, commas from 10,000 up.
  function fx(v, dp) {
    const k = Math.pow(10, dp), r = Math.round(Math.abs(v) * k + 1e-7) / k;
    const parts = r.toFixed(dp).split('.');
    let a = parts[0];
    if (a.length > 4) a = a.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (v < 0 && r > 0 ? '−' : '') + a + (parts[1] ? '.' + parts[1] : '');
  }
  const nf = (v, dp) => { const s = fx(v, dp == null ? 2 : dp); return s.indexOf('.') < 0 ? s : s.replace(/0+$/, '').replace(/\.$/, ''); };

  // Every number the words show, worked out from the rules.
  const N = (() => {
    const I2 = inertiaOf(0.2), I4 = inertiaOf(0.4), I13 = inertiaOf(0.3, 10), T72 = fx(P11 / W_RUN, 1);
    return {
      W: fx(W_RUN, 1), I2: nf(I2, 2), I4: nf(I4, 2), a2: nf(alphaOf(T0, I2), 2), t2: fx(runUpOf(I2, T0), 1), t4: fx(runUpOf(I4, T0), 1),
      E2: fx(energyOf(I2, W_RUN) / 1000, 1), E4: fx(energyOf(I4, W_RUN) / 1000, 1), T72, n99: nf(Math.round(N99), 0), NS: fx(NS, 0), P11: nf(P11, 0),
      q4: nf(I4, 2), q4d: nf(2 * I2, 2), q4r: nf(2 * M * 0.4, 2), q4each: nf(M * 0.4 * 0.4, 2),
      q6: fx(runUpOf(0.5, 40), 1), q6x: fx(W_RUN / (40 * 0.5), 1), q6r: fx(N_RUN / alphaOf(40, 0.5), 1), q6a: nf(alphaOf(40, 0.5), 2), q6xa: nf(40 * 0.5, 2),
      q8w: fx(radOf(960), 1), q8: fx(powerOf(40, radOf(960)) / 1000, 2), q8W: nf(powerOf(40, radOf(960)), 0), q8x: fx(40 * 960 / 1000, 1), q8xW: nf(40 * 960, 0), q8s: nf(40 * 960 / 60, 0),
      q10e: fx(energyOf(2, radOf(725)) / 1000, 2), q10: fx(energyOf(2, radOf(1450)) / 1000, 1), q10x: fx(2 * energyOf(2, radOf(725)) / 1000, 1),
      q12p: fx(pumpT(1125), 1), q12n: fx(PEAK - pumpT(1125), 1), q12e: fx(pumpT(1500), 1),
      q13I: nf(I13, 2), q13a: fx(alphaOf(30, I13), 1), q13w: fx(radOf(600), 1), q13: fx(runUpOf(I13, 30, radOf(600)), 1),
      q13r: fx(600 / alphaOf(30, I13), 1), q13xI: nf(2 * 10 * 0.3, 2), q13xa: nf(30 / (2 * 10 * 0.3), 2), q13x: fx(radOf(600) / alphaOf(30, 2 * 10 * 0.3), 1),
      q14x: fx(2 * Number(T72), 1),
    };
  })();
  // A SHOW screen's words for reading, where its last sentence asks for a move.
  const readAs = (t, end) => t.replace(/ (Drag|Press|Switch)[^.]*\.$/, '') + ' ' + end;

  // ---------- the lesson: SHOW screens demonstrate, DO screens are puzzles ----------
  // rig: the spin-up rig's mode; outs: its readouts; btns: its buttons; drag: what Dan can drag;
  // set: the screen's own settings. A puzzle: opts, want, hints; qw its givens, ow each answer's working.
  const T1 = `A motor turns a shaft with two arms. Each arm carries a 25 kg mass ${nf(R0, 2)} m out. The *net torque* is the motor's torque less what the load and friction take. Here it is a steady ${nf(T0, 0)} N m. Watch the speed line. It is straight. The speed gains the same ${N.a2} rad/s every second, so it reaches ${N.W} rad/s in ${N.t2} s. A steady net torque gives a steady rise in speed, not a steady speed. Drag the masses or the torque handle, then press Start.`;
  const T3 = `Why does a shaft with its mass further out spin up more slowly? Follow one mass. The arm pushes it round its circle with a force of the torque ÷ r. Here the mass slides from 0.2 m out to 0.4 m. The push halves. The mass must also go twice as fast round its bigger circle for the same shaft speed. So the radius counts twice. Each mass adds its mass × r² to the shaft's *moment of inertia*, I.`;
  const T5 = `Two rigs get the same ${nf(T0, 0)} N m. On the left the masses sit 0.2 m out, so I is ${N.I2} kg m². On the right they sit 0.4 m out, so I is ${N.I4} kg m², four times as much. Both start from rest together. Both speed lines are straight. The right one climbs a quarter as steeply. So its run-up takes four times as long, ${N.t4} s against ${N.t2} s. Drag the right rig's masses to try other radii.`;
  const T7 = `Power works the same way as for a winch. The arm pushes its mass with the torque ÷ r. In one radian of turn, the mass moves r metres along its circle. So each radian, the torque does (T ÷ r) × r = T joules of work. The radius cancels out. The shaft turns ω radians each second. So the *power* is T × ω watts, with ω in rad/s. An 11 kW motor at ${N.W} rad/s gives ${N.P11} ÷ ${N.W} = ${N.T72} N m.`;
  const T9 = `A spinning shaft stores energy. Each mass moves round its circle at ω × r. Its energy of motion is half its mass × that speed squared. Add both masses and the rig stores ½ × I × ω². The speed line is straight. The *stored energy* climbs as a curve, slowly at first and steeply at the end. That is because it goes with the speed squared. At ${N.W} rad/s the rig holds ${N.E2} kJ. Drag the masses out to store more at the same speed.`;
  const T11 = `A real motor's torque changes with its speed. A pump needs more torque the faster it turns. The *net torque* is the gap between their curves. It stays wide for most of the run, then closes fast near full speed. So the speed line climbs steeply, then bends over. It levels off where the curves meet, near ${N.NS} rev/min. There the motor's torque just matches the pump's. Switch Motor and pump off to compare a steady torque.`;
  const SH = ['It rises by the same amount every second', 'It holds one steady speed, set by the torque', 'It rises fast, then levels off'];
  const MEET = ['Where the motor and pump curves meet', 'Where the motor\'s torque peaks', 'At 1500 rev/min, where the motor\'s torque is zero'];
  const kgm = (s) => s + ' kg m²';
  const STEPS = [
    { show: true, rig: 'run', name: 'Spin it up', outs: ['inertia', 'runUp'], btns: ['start'], drag: ['r', 'T'], text: T1,
      read: readAs(T1, `The graph shows a straight speed line up to ${N.W} rad/s.`) },
    { kind: 'pick', pic: 'shapeQ', name: 'Steady torque',
      task: `A steady net torque of ${nf(T0, 0)} N m spins the rig up from rest. What does its speed do?`,
      opts: SH, order: [1, 0, 2], want: SH[0],
      hints: { [SH[1]]: 'Not quite. A steady speed needs zero net torque. While a net torque acts, the speed keeps changing.',
        [SH[2]]: 'Not quite. The net torque stays the same at every speed. So the speed gains the same amount each second.' },
      why: `The speed rises by the net torque ÷ I each second. Here that is ${nf(T0, 0)} ÷ ${N.I2} = ${N.a2} rad/s every second. It keeps rising like this for as long as the torque acts. A real drive levels off only because its load takes more torque as it speeds up.`,
      qw: [`${nf(T0, 0)} N m net on ${kgm(N.I2)}, from rest`],
      ow: { [SH[0]]: [`${nf(T0, 0)} ÷ ${N.I2} = ${N.a2} rad/s gained each second`, `The same ${N.a2} rad/s every second`], [SH[1]]: ['A steady speed needs 0 N m net'], [SH[2]]: ['Levelling off needs the net torque to shrink'] } },
    { show: true, pic: 'push', name: 'Mass further out', text: T3 },
    { kind: 'pick', pic: 'inertiaQ', name: 'Moment of inertia',
      task: 'Each 25 kg mass on the rig slides from 0.2 m out to 0.4 m. What is the rig\'s moment of inertia now?',
      opts: [kgm(N.q4d), kgm(N.q4), kgm(N.q4r)], want: kgm(N.q4),
      hints: { [kgm(N.q4d)]: 'Not quite. That doubles I with the radius. The radius is squared, so twice the radius gives four times I.',
        [kgm(N.q4r)]: 'Not quite. That uses 0.4, not 0.4². Each mass adds its mass × r².' },
      why: `Each mass adds its mass × r² = 25 × 0.4² = ${kgm(N.q4each)}. Two masses make ${kgm(N.q4)}. That is four times the ${kgm(N.I2)} at 0.2 m, because the radius doubled and is squared.`,
      qw: ['Two 25 kg masses, each 0.4 m out'],
      ow: { [kgm(N.q4d)]: [`2 × ${kgm(N.I2)} = ${N.q4d}: doubled, not squared`], [kgm(N.q4)]: [`Each: 25 × 0.4² = ${kgm(N.q4each)}`, `Both: 2 × ${N.q4each} = ${kgm(N.q4)}`],
        [kgm(N.q4r)]: [`2 × 25 × 0.4 = ${N.q4r}: r not squared`] } },
    { show: true, rig: 'two', name: 'Two rigs', set: { r: 0.4 }, outs: [], btns: ['start'], drag: ['r'], text: T5,
      read: readAs(T5, 'Twice the radius means four times the run-up.') },
    { kind: 'pick', pic: 'runQ', name: 'Run-up time',
      task: 'A rotor has I = 0.5 kg m². A steady net torque of 40 N m spins it up from rest. How long does it take to reach 1450 rev/min?',
      opts: [`${N.q6} s`, `${N.q6x} s`, `${N.q6r} s`], want: `${N.q6} s`,
      tv: { [`${N.q6} s`]: runUpOf(0.5, 40), [`${N.q6x} s`]: W_RUN / (40 * 0.5), [`${N.q6r} s`]: N_RUN / alphaOf(40, 0.5) },
      hints: { [`${N.q6r} s`]: 'Not quite. That uses 1450 rev/min as it stands. Change it to rad/s first.',
        [`${N.q6x} s`]: 'Not quite. That multiplies the torque by I. The speed rises by the torque ÷ I each second.' },
      why: `Each second the speed rises by 40 ÷ 0.5 = ${N.q6a} rad/s. 1450 rev/min is 1450 × 2π ÷ 60 = ${N.W} rad/s. So the run-up takes ${N.W} ÷ ${N.q6a} = ${N.q6} s.`,
      qw: [],
      ow: { [`${N.q6} s`]: [`40 ÷ 0.5 = ${N.q6a} rad/s each second`, `${N.W} ÷ ${N.q6a} = ${N.q6} s`], [`${N.q6x} s`]: [`40 × 0.5 = ${N.q6xa}: times I, not ÷ I`, `${N.W} ÷ ${N.q6xa} = ${N.q6x} s`],
        [`${N.q6r} s`]: [`1450 ÷ ${N.q6a} = ${N.q6r}: still in rev/min`] } },
    { show: true, pic: 'work', name: 'Torque and power', text: T7 },
    { kind: 'pick', pic: 'powerQ', name: 'Shaft power',
      task: 'A shaft carries 40 N m at 960 rev/min. What power does it carry?',
      opts: [`${N.q8s} W`, `${N.q8} kW`, `${N.q8x} kW`], want: `${N.q8} kW`,
      kv: { [`${N.q8s} W`]: 40 * 960 / 60 / 1000, [`${N.q8} kW`]: powerOf(40, radOf(960)) / 1000, [`${N.q8x} kW`]: 40 * 960 / 1000 },
      hints: { [`${N.q8x} kW`]: 'Not quite. That uses 960 rev/min as it stands. Change it to rad/s first.',
        [`${N.q8s} W`]: 'Not quite. That uses turns each second. Each turn is 2π radians, so multiply by 2π too.' },

        path('lbad', 'M' + P(g.X0, bot) + 'L' + P(x14, y)); circ('dotbad', x14, y, 4.5); text(x14 - 8, y - 6, N.q10x + ' kJ', 'w sm', 'end');
      });
      if (a.wrong && a.pick === N.q10e + ' kJ') part(a.v(0.1), 0, () => { path('lbad', 'M' + P(x7, y7) + 'H' + r2(x14)); circ('dotbad', x14, y7, 4.5); text(x14 - 8, y7 + 16, N.q10e + ' kJ', 'w sm', 'end'); });
      return { h: working(bot + 40, d, st, a), said: 'A graph of the rig\'s stored energy against speed, drawn up to 5.76 kilojoules at 725 revolutions a minute.' };
    },
    meetQ(d, st) {
      const a = ansOf(st), top = 40, bot = 156, g = axes({ top, bot, ax: 1500, ymax: 300, yt: [100, 200, 300], xticks: [0, 500, 1000, 1500], xu: ' rev/min', title: 'Torque (N m)' });
      curves(g);
      line('l1', 200, top - 18, 216, top - 18); text(220, top - 14, 'motor', 'sm', 'start');
      line('l2', 262, top - 18, 278, top - 18); text(282, top - 14, 'pump', 'sm', 'start');
      if (a.right || a.wrong) part(a.v(0.1), 0, () => {
        if (a.pick === MEET[0]) circ('ring', g.xt(NS), g.yv(motorT(NS)), 7);
        else { const n = a.pick === MEET[1] ? 1125 : 1500; line('lbad', g.xt(n), g.yv(motorT(n)), g.xt(n), g.yv(pumpT(n))); circ('ringbad', g.xt(n), g.yv(motorT(n)), 6); }
      });
      return { h: working(bot + 30, d, st, a), said: 'A motor\'s torque curve and a pump\'s against speed, with the gap between them shaded as the net torque.' };
    },
    mixQ(d, st) {
      const a = ansOf(st), gR = { cx: 84, cy: 84, RS: 150 };
      keyMass(10);
      const R = rigDraw(gR, { r: 0.3, phi: 0, T: 30, motorLab: true });
      text(gR.cx, 50, '30 N m net', 'n sm', 'middle');
      const y0 = R.y + 6, top = y0 + 26, bot = y0 + 110, g = axes({ top, bot, ax: 40, ymax: 80, yt: [20, 40] }), wT = radOf(600);
      line('ref', g.X0, g.yv(wT), g.X1, g.yv(wT)); text(g.X1, g.yv(wT) - 5, '600 rev/min', 'sm m', 'end');
      if (a.right || a.wrong) part(a.v(0.1), 0, () => {
        const t = d.tv[a.pick], x = g.xt(t), y = g.yv(wT);
        path(a.right ? 'l1' : 'lbad', 'M' + P(g.X0, bot) + 'L' + P(x, y)); circ(a.right ? 'dot1' : 'dotbad', x, y, 4.5);
        line('drop', x, y + 6, x, bot - 1); text(x, bot + 31, a.pick, a.right ? 'n sm' : 'w sm', 'middle');
      });
      return { h: working(bot + 40, d, st, a), said: 'A rig with two 10 kilogram masses 0.3 metres out under 30 newton metres, above a graph of speed against time with 600 revolutions a minute marked.' };
    },
    steadyQ(d, st) {
      const a = ansOf(st), pc = a.wrong ? 'wr' : 't';
      rect('motor', 14, 46, 64, 48, 4); text(46, 75, 'motor', 'sm', 'middle');
      rect('shaft', 78, 63, 184, 14, 3);
      rect('motor', 262, 46, 64, 48, 4); text(294, 75, 'pump', 'sm', 'middle');
      path('arc nv', 'M120 50A12 20 0 0 1 120 90'); path('ah nv', 'M111 90L120 85L120 95Z');
      text(136, 40, N.T72 + ' N m', 'n', 'start');
      path('arc ' + pc, 'M220 90A12 20 0 0 0 220 50'); path('ah ' + pc, 'M211 50L220 45L220 55Z');
      const lab = a.right ? N.T72 + ' N m' : a.wrong ? (a.pick === N.T72 + ' N m' ? 'left out?' : 'added?') : 'pump\'s load';
      text(236, 40, lab, a.wrong ? 'w sm' : 't sm', 'start');
      text(170, 116, 'steady 1450 rev/min', 'sm m', 'middle');
      return { h: working(128, d, st, a), said: 'A motor driving a pump through a shaft at a steady 1450 revolutions a minute, the motor\'s torque one way and the pump\'s load the other.' };
    },
  };

  // ---------- one screen's picture ----------
  let GRIP = {};
  function placeGrips(d, g) {
    GRIP = g || {};
    [[gR, 'r'], [gT, 'T']].forEach(([node, k]) => {
      const on = !!GRIP[k] && !finished;
      node.style.display = on ? '' : 'none';
      node.setAttribute('tabindex', on ? '0' : '-1');
      if (!on) return;
      const r = GRIP[k];
      node.setAttribute('x', r2(r.x)); node.setAttribute('y', r2(r.y)); node.setAttribute('width', r2(r.w)); node.setAttribute('height', r2(Math.max(44, r.h)));
      const v = +CTL[k].get();
      node.setAttribute('aria-valuemin', k === 'r' ? '0.1' : '20'); node.setAttribute('aria-valuemax', k === 'r' ? '0.4' : '100');
      node.setAttribute('aria-valuenow', String(v)); node.setAttribute('aria-valuetext', k === 'r' ? nf(v, 2) + ' m' : nf(v, 0) + ' N m');
    });
  }
  function render(i, p) {
    const d = STEPS[i], st = S[i];
    art.textContent = ''; into = null;
    REC = { wk: [] };
    const out = d.rig ? rigScreen(d, p) : d.pic === 'push' ? pushShow() : d.pic === 'work' ? workShow() : PICS[d.pic](d, st);
    svg.setAttribute('viewBox', '0 0 340 ' + Math.ceil(out.h));
    svg.setAttribute('aria-label', out.said);
    placeGrips(d, out.grips);
    REC.sc = out.sc || null;
    return REC;
  }

  // ---------- dragging the masses and the torque handle ----------
  let held = null;
  function svgPt(ev) { const m = svg.getScreenCTM(); if (!m) return null; return new DOMPoint(ev.clientX, ev.clientY).matrixTransform(m.inverse()); }
  const canDrag = (k) => { const d = STEPS[at()]; return !finished && (d.drag || []).indexOf(k) >= 0 && !!GRIP[k]; };
  function grab() {
    if (anim.playing()) anim.pause();
    if (T !== Infinity) { T = Infinity; settle(); }
    K.reveal();
  }
  function setR(v) { setQuiet('r', K.clamp(Math.round(v * 20) / 20, 0.1, 0.4)); K.refresh(); }
  function setT(v) { setQuiet('T', K.clamp(Math.round(v / 10) * 10, 20, 100)); K.refresh(); }
  const rAt = (q) => Math.abs(q.x - GRIP.r.cx) / GRIP.r.RS;
  const tAt = (q) => 20 + (172 - q.y) / 128 * 80;
  [[gR, 'r'], [gT, 'T']].forEach(([node, k]) => {
    node.addEventListener('pointerdown', (ev) => {
      if (!canDrag(k)) return;
      const q = svgPt(ev);
      if (!q) return;
      const g = GRIP[k];
      held = { id: ev.pointerId, kind: k, g };
      try { node.setPointerCapture(ev.pointerId); } catch (er) { /* the drag still follows while the pointer stays on the grip */ }
      ev.preventDefault(); grab();
      if (k === 'r') setR(Math.abs(q.x - g.cx) / g.RS); else setT(tAt(q));
    });
    node.addEventListener('pointermove', (ev) => {
      if (!held || held.id !== ev.pointerId) return;
      const q = svgPt(ev);
      if (!q) return;
      ev.preventDefault();
      if (held.kind === 'r') setR(Math.abs(q.x - held.g.cx) / held.g.RS); else setT(tAt(q));
    });
    const letGo = (ev) => { if (held && held.id === ev.pointerId) held = null; };
    node.addEventListener('pointerup', letGo);
    node.addEventListener('pointercancel', letGo);
    node.addEventListener('lostpointercapture', () => { held = null; });
    node.addEventListener('keydown', (ev) => {
      const by = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1 }[ev.key];
      if (by == null || !canDrag(k)) return;
      ev.preventDefault(); grab();
      if (k === 'r') setR(+CTL.r.get() + 0.05 * by); else setT(+CTL.T.get() + 10 * by);
    });
  });

  // ---------- the words under the picture ----------
  function sayFor(d, p, sc) {
    if (d.pic === 'push') {
      const r = Math.round(slideR() * 100) / 100;
      let s = 'The arm pushes the mass round its circle with ' + nf(T0, 0) + ' ÷ ' + nf(r, 2) + ' = ' + nf(pushOf(T0, r), 0) + ' N.';
      if (Math.abs(r - 0.4) < 1e-9) s += ' That is half the push at 0.2 m. The mass must also go twice as fast round its circle for the same shaft speed.';
      return s;
    }
    if (d.pic === 'work') {
      const F = pushOf(T0, R0);
      return 'In one radian the ' + nf(F, 0) + ' N push moves the mass ' + nf(R0, 2) + ' m along its circle. So the torque does ' + nf(F, 0) + ' × ' + nf(R0, 2) + ' = ' + nf(F * R0, 0) + ' J of work each radian.';
    }
    const u = sc.main, tm = sc.tm, w = sc.wNow;
    if (d.rig === 'two') {
      const L = sc.runs[0], q = u.I / L.I;
      if (Math.abs(q - 1) < 1e-9) return 'Both rigs have their masses 0.2 m out, so they run up together in ' + N.t2 + ' s.';
      if (sc.live && tm < u.tEnd - 1e-9) return 'Both shafts start from rest together. The left one gains ' + nf(L.a, 2) + ' rad/s every second, the right one ' + nf(u.a, 2) + ' rad/s.';
      return 'On the right the masses sit ' + nf(Math.sqrt(u.I / (2 * M)), 2) + ' m out, so I is ' + kgm(nf(u.I, 2)) + ', ' + nf(q, 2) + ' times the left rig\'s ' + kgm(N.I2) +
        '. The same ' + nf(T0, 0) + ' N m takes ' + nf(q, 2) + ' times as long: ' + fx(u.tEnd, 1) + ' s against ' + N.t2 + ' s.';
    }
    if (tm <= 1e-9) return d.rig === 'energy' ? 'The shaft is at rest, so it stores no energy yet.' : u.pump ? 'At rest the motor gives ' + fx(motorT(0), 0) + ' N m and the pump takes none. All of it speeds the shaft up.' : 'The shaft is at rest. A steady ' + nf(u.T, 0) + ' N m net torque will speed it up.';
    if (u.pump) {
      const n = sc.nNow;
      if (n < N99) { const a = Math.round(motorT(n)), b = Math.round(pumpT(n)); return 'At ' + fx(n, 0) + ' rev/min the motor gives ' + a + ' N m and the pump takes ' + b + ' N m. The ' + (a - b) + ' N m left over speeds the shaft up.'; }
      return 'The gap closes where the curves meet, near ' + N.NS + ' rev/min. The run-up to ' + N.n99 + ' rev/min takes ' + fx(u.t99, 1) + ' s.';
    }
    const done = tm >= u.tEnd - 1e-9;
    if (d.rig === 'energy') {
      const E = fx(energyOf(u.I, w) / 1000, 1);
      if (!done) return 'At ' + fx(w, 1) + ' rad/s the rig stores ' + E + ' kJ.';
      return 'At ' + N.W + ' rad/s the rig stores ' + E + ' kJ.' + (Math.abs(u.I - 2) < 1e-9 ? ' At half that speed it would hold a quarter as much, ' + N.q10e + ' kJ.' : ' With the masses 0.2 m out it would hold ' + N.E2 + ' kJ at the same speed.');
    }
    if (!done) return 'After ' + fx(tm, 1) + ' s the shaft turns at ' + fx(w, 1) + ' rad/s. It gains ' + nf(u.a, 2) + ' rad/s every second.';
    return 'A steady ' + nf(u.T, 0) + ' N m on ' + kgm(nf(u.I, 2)) + ' adds ' + nf(u.a, 2) + ' rad/s every second. So the shaft reaches ' + N.W + ' rad/s in ' + fx(u.tEnd, 1) + ' s.';
  }
  function layout(i, d, st, p, sc) {
    const right = st.res === 'right';
    el('stepbox').hidden = finished;
    el('lead').hidden = finished || i !== 0;
    el('done').hidden = !finished;
    el('count').textContent = 'Step ' + (i + 1) + ' of ' + STEPS.length;
    const task = el('task');
    task.className = 'task say' + (d.show ? ' show' : '');
    write(task, d.show ? d.text : d.task);
    const b = d.btns || [];
    el('live').hidden = finished || !b.length;
    startBtn.el.hidden = b.indexOf('start') < 0; CTL.pump.el.hidden = b.indexOf('pump') < 0;
    const outs = d.outs || [];
    el('outs').hidden = !outs.length;
    RO.forEach((r, k) => { r.el.hidden = outs.indexOf(RID[k]) < 0; });
    const talk = !!d.rig || d.pic === 'push' || d.pic === 'work';
    el('say').hidden = !talk;
    el('say').textContent = talk ? sayFor(d, p, sc) : '';
    const opts = d.show ? [] : optsOf(d);
    el('picks').hidden = !opts.length;
    el('picks').classList.toggle('long', opts.some((o) => o.length > 12));
    pickBtns.forEach((bt, k) => {
      bt.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      bt.setLabel(opts[k]);
      bt.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });
    el('acts').hidden = !!d.show;
    el('replay').hidden = finished || (d.pic !== 'push' && d.pic !== 'work') || REDUCE;
    checkBtn.el.hidden = right;
    const fb = el('fb');
    fb.hidden = !!d.show;
    fb.className = 'fb say' + (right ? ' right' : '');
    fb.textContent = d.show ? '' : right ? 'That\'s it.' : st.res === 'wrong' ? (d.hints[st.pick] || '') : st.res === 'empty' ? 'Pick an answer first.' : '';
    const why = el('why');
    why.hidden = !!d.show || !st.why;
    if (!d.show) write(why, d.why);
    whyBtn.setLabel(st.why ? 'Hide why' : 'Why?');
    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !right);
    nextBtn.setLabel(i === STEPS.length - 1 ? 'Finish' : 'Continue');
    el('nav').hidden = backBtn.el.hidden && nextBtn.el.hidden;
  }

  write(el('finish'), FINISH);
  K.update((p) => {
    const i = at(), d = STEPS[i], st = S[i];
    if (i !== lastStep) { enterStep(i); K.refresh(); return; }
    // a motion that was stopped (the page hidden, a test) shows finished
    if (T !== Infinity && !anim.playing()) { T = Infinity; settle(); K.refresh(); return; }
    // the Motor and pump switch starts a fresh run
    if (d.rig === 'pump' && !!p.pump !== lastPump) { lastPump = !!p.pump; runNow(); K.refresh(); return; }
    if (finished !== lastDone) { lastDone = finished; enter(finished ? 'done' : 'stepbox'); }
    const rec = render(i, p);
    layout(i, d, st, p, rec.sc);
  });

  // ---------- known answers, worked out by hand ----------
  const DO = STEPS.map((d, i) => i).filter((i) => !STEPS[i].show);
  const answer = (i, o) => ({ pick: o, res: o === STEPS[i].want ? 'right' : 'wrong', why: false });
  const near = (a, b, tol) => K.near(a, b, tol);
  const RS_ALL = [0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4], TQ_ALL = [20, 30, 40, 50, 60, 70, 80, 90, 100];
  const words = (s) => String(s).split(/\s+/).filter((w) => /[A-Za-z0-9]/.test(w)).length;
  // A screen drawn in a given state, finished; returns what it drew.
  function drawn(i, st, over) {
    const keep = { S: S[i], T, MOT, INSTANT };
    S[i] = st; T = Infinity; MOT = null; INSTANT = false;
    try { return render(i, Object.assign({ step: i }, setupOf(i), over || {})); }
    finally { S[i] = keep.S; T = keep.T; MOT = keep.MOT; INSTANT = keep.INSTANT; render(at(), K.params()); }
  }

  K.check('A moment is the turning effect of a force: the arm pushes each mass with the torque ÷ r, and that push acting r out gives back the same torque at every radius', () =>
    RS_ALL.every((r) => TQ_ALL.every((Tq) => near(pushOf(Tq, r) * r, Tq, 1e-9))), { source: SRC.moment });
  K.check('Rotational power needs the speed converted to rad/s: 40 N m at 960 rev/min is 40 × 100.5 = 4.02 kW, where 40 × 960 would give 38.4 kW', () =>
    near(powerOf(40, radOf(960)), 4021.24, 0.01) && STEPS[I_P8].want === '4.02 kW' && N.q8x === '38.4' && N.q8w === '100.5', { source: SRC.rads });
  K.check('A flywheel stores more energy with a higher moment of inertia, from more mass or mass further from its centre: at full speed every step out stores more', () => {
    const E = RS_ALL.map((r) => K.at({ step: I_EN, r }).energy);
    return E.every((e, k) => k === 0 || e > E[k - 1]) && energyOf(inertiaOf(0.3, 30), W_RUN) > energyOf(inertiaOf(0.3, 25), W_RUN);
  }, { source: SRC.fly });
  K.check('The opening rig: I = 2 × 25 × 0.2² = 2 kg m², 50 N m adds 25 rad/s each second, and 1450 rev/min (151.8 rad/s) comes in 6.1 s with 23.1 kJ stored; at 0.1 m I is 0.5 kg m²', () => {
    const o = K.at({ step: I_RUN });
    return near(o.inertia, 2, 1e-12) && near(alphaOf(50, o.inertia), 25, 1e-12) && near(W_RUN, 151.8436, 1e-4) && near(o.runUp, 6.0737, 1e-4) && near(o.energy, 23.0565, 1e-4) &&
      N.W === '151.8' && N.t2 === '6.1' && N.E2 === '23.1' && near(K.at({ step: I_RUN, r: 0.1 }).inertia, 0.5, 1e-12);
  });
  K.check('Twice the radius, four times the run-up: at every torque, masses 0.4 m out take 4 times as long as at 0.2 m (24.3 s against 6.1 s at 50 N m) and store 4 times the energy (92.2 kJ)', () =>
    TQ_ALL.every((Tq) => near(K.at({ step: I_RUN, r: 0.4, T: Tq }).runUp / K.at({ step: I_RUN, r: 0.2, T: Tq }).runUp, 4, 1e-9)) &&
    near(K.at({ step: I_RUN, r: 0.4 }).energy / K.at({ step: I_RUN }).energy, 4, 1e-9) && N.t4 === '24.3' && N.E4 === '92.2' &&
    near(K.at({ step: I_TWO, r: 0.4 }).runUp, 24.295, 1e-3));
  K.check('A steady net torque draws a straight speed line, the same rise every second, and the energy at half speed is a quarter of the energy at full speed', () => {
    const u = runOf(2, 50, false);
    return near(u.w(2) - u.w(1), 25, 1e-9) && near(u.w(5) - u.w(4), 25, 1e-9) &&
      near(K.at({ step: I_EN, spd: 725 }).energy * 4, K.at({ step: I_EN, spd: 1450 }).energy, 1e-9) && N.q10e === '5.76' && N.q10 === '23.1';
  });
  K.check('The motor sketch gives 130 N m at rest, peaks at 276 N m at 1125 rev/min and falls to 0 at 1500 rev/min; the pump takes 72.4 N m at 1450 rev/min, and they meet near 1450 rev/min', () =>
    Math.round(motorT(0)) === 130 && near(motorT(1125), 276, 1e-9) && motorT(1124) < 276 && motorT(1126) < 276 && motorT(1500) === 0 &&
    fx(pumpT(1450), 1) === '72.4' && pumpT(0) === 0 && N.NS === '1450' && near(netT(NS), 0, 1e-6) && netT(NS - 1) > 0 && netT(NS + 1) < 0);
  K.check('Motor and pump: the speed rises all the way but never passes where the curves meet, and the run-up to 1435 rev/min, 99% of it, takes 1.9 s on 2 kg m²', () => {
    const o = K.at({ step: I_PUMP, pump: true });
    for (let k = 1; k < TAB.w.length; k++) if (!(TAB.w[k] >= TAB.w[k - 1]) || TAB.w[k] > radOf(NS)) return false;
    return N.n99 === '1435' && near(o.runUp, 2 * G, 1e-12) && fx(o.runUp, 1) === '1.9' && near(o.runUp, 1.869, 0.002) && near(pumpW(o.runUp, 2), radOf(N99), 0.02);
  });
  K.check('Every puzzle answer is worked from its rule: 8 kg m², 1.9 s, 4.02 kW, 23.1 kJ, 3.8 s and 0 N m, with the wrong picks 4, 20, 18.1, 7.6, 640 W, 38.4, 11.5, 36.0, 12.6 and 144.8', () => {
    const w = (n) => STEPS[iOf('pic', n)].want;
    return w('inertiaQ') === '8 kg m²' && w('runQ') === '1.9 s' && w('powerQ') === '4.02 kW' && w('energyQ') === '23.1 kJ' && w('mixQ') === '3.8 s' && w('steadyQ') === '0 N m' &&
      N.q4d === '4' && N.q4r === '20' && N.q6r === '18.1' && N.q6x === '7.6' && N.q8s === '640' && N.q10x === '11.5' && N.q13r === '36.0' && N.q13x === '12.6' && N.q14x === '144.8' &&
      N.q13I === '1.8' && N.q13a === '16.7' && N.q13w === '62.8' && N.T72 === '72.4';
  });
  K.check('Each puzzle offers three answers and accepts only its right one; every wrong answer has its own hint and its working drawn in red, and nothing is marked before Check', () =>
    DO.every((i) => {
      const d = STEPS[i];
      if (d.opts.length !== 3 || d.opts.indexOf(d.want) < 0) return false;
      if (drawn(i, blank()).wk.some((x) => x.ans)) return false;
      if (!drawn(i, answer(i, d.want)).wk.some((x) => x.ans && !x.bad)) return false;
      return d.opts.filter((o) => o !== d.want).every((o) => !!d.hints[o] && drawn(i, answer(i, o)).wk.some((x) => x.ans && x.bad));
    }));
  K.check('Every run plays time four times faster than real, every demonstration ends within 7 s of its screen opening, and every answer is drawn within 2.5 s of Check', () => {
    const keep = { T, MOT, INSTANT };
    try {
      return TS === 4 && STEPS.every((d, i) => {
        if (d.show) {
          const p = Object.assign({ step: i }, setupOf(i)), plan = demoPlan(d, p);
          if (plan.mot && plan.mot.kind === 'run' && !near(plan.mot.dur * TS, Math.max.apply(null, plan.mot.runs.map((u) => u.tEnd)), 1e-9)) return false;
          T = Infinity; MOT = null; INSTANT = false; latest = 0;
          render(i, p);
          return plan.end <= 7 && latest <= plan.end;
        }
        return d.opts.every((o) => {
          const keepS = S[i];
          T = Infinity; MOT = null; latest = 0; S[i] = answer(i, o);
          try { render(i, Object.assign({ step: i }, setupOf(i))); } finally { S[i] = keepS; }
          return latest <= 2.5 && ANS <= 2.5;
        });
      });
    } finally { T = keep.T; MOT = keep.MOT; INSTANT = keep.INSTANT; render(at(), K.params()); }
  });
  K.check('Every screen that shows an idea says it in 90 words or fewer', () => STEPS.every((d) => !d.show || (words(d.text) <= 90 && (!d.read || words(d.read) <= 90))));

  K.ready();
</script>
