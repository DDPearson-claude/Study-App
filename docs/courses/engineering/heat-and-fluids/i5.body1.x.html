<script>
  // ---------- the rule ----------
  // In a still liquid the gauge pressure at depth h is ρgh: the weight of the column above a
  // 1 m² patch. Absolute pressure adds the air on the surface. A 1 m cube feels ρg × its depth
  // on each face; the bottom's push minus the top's is the upthrust, ρg × the volume under the
  // surface, which is the weight of the liquid pushed aside. Let go, it floats where that equals
  // its own weight (draught = its density ÷ the liquid's × 1 m), hovers if as dense, or sinks.
  const SRC_WHOI = 'https://www.whoi.edu/science/PO/people/tjoyce/whoi-mit_course/notes/course_notes_1b.pdf';
  const SRC_TALLEY = 'https://talleylab.ucsd.edu/sio210/lect_2/lecture_2.html';
  const SRC_BRIT = 'https://www.britannica.com/science/Archimedes-principle';
  const SRC_BU = 'http://physics.bu.edu/~duffy/py105/Pressure.html';
  const G = 9.81, RS = 1025, RF = 1000, ATM = 100, DEEP = 10, SIDE = 1;
  const EPS = 1e-9, FADE = 0.35, ANS = 2.0;
  const pk = (rho, h) => rho * G * Math.max(0, h) / 1000;          // kPa at depth h (m)
  const sub = (top) => K.clamp(top + SIDE, 0, SIDE);                // m³ of the 1 m cube under the surface
  const upK = (rho, top) => rho * G * sub(top) / 1000;              // upthrust, kN
  const wtK = (dens) => dens * G / 1000;                            // a 1 m³ cube's weight, kN
  const draught = (dens, rho) => dens / rho * SIDE;                 // m, for a cube that floats
  // Where a released cube's top settles: floating at its draught, hovering where it is, or on the floor.
  function eqTop(dens, rho, from) {
    if (Math.abs(dens - rho) < 1e-6) return from;
    return dens < rho ? draught(dens, rho) - SIDE : DEEP - SIDE;
  }
  const fx = (v, dp) => K.fmt(v, { decimals: dp || 0 });
  const DS = String(RS), DF = String(RF), GS = String(G);
  // Every number the words and pictures print, worked out from the rule.
  const N = {
    w1: fx(2 * G, 1), p10: fx(pk(RS, 10), 1), p5: fx(pk(RS, 5), 1), p5a: fx(pk(RS, 5) + ATM, 1),
    p5g: fx(RS * 5 / 1000, 1), p5f: fx(pk(RF, 5), 1), p2f: fx(pk(RF, 2), 1), ratio: fx(10 / 0.1),
    p3: fx(pk(RS, 3), 1), p3h: fx(pk(RS, 3) / 2, 1), t2: fx(pk(RS, 2), 1), b3: fx(pk(RS, 3), 1), up: fx(upK(RS, 2), 1),
    t6: fx(pk(RS, 6), 1), b7: fx(pk(RS, 7), 1), up3: fx(3 * upK(RS, 2), 1),
    w600: fx(wtK(600), 1), w1500: fx(wtK(1500), 1), d6s: fx(draught(600, RS), 2), d6f: fx(draught(600, RF), 2),
    pm: fx(4000), pd: fx(4000 / (RS * 4 * 2), 2), pdf: fx(4000 / (RF * 4 * 2), 2), pdb: fx(4000 / (RS * 4), 2),
    s20: fx(pk(RS, 20)), s20a: fx(pk(RS, 20) + ATM), s20f: fx(pk(RF, 20) + ATM),
    flF: fx(wtK(RF), 1), flS: fx(wtK(RS), 1), atm: fx(ATM),
  };
  const O = {
    a2: 'About 2 N', a19: `About ${N.w1} N`, dep: 'It depends on what the block is made of',
    k150: `About ${N.p5a} kPa`, k5: `About ${N.p5g} kPa`, k50: `About ${N.p5} kPa`,
    both: `About ${N.p2f} kPa on both`, hund: `${N.ratio} times more on the wide one`, narr: 'More on the narrow one',
    h15: `About ${N.p3h} kPa`, h30: `About ${N.p3} kPa`, h0: '0 kPa',
    u30: `About ${N.up3} kN`, u70: `About ${N.b7} kN`, u10: `About ${N.up} kN`,
    d49: `About ${N.pd} m`, d98: `About ${N.pdb} m`, d50: `${N.pdf} m`,
    s201: `About ${N.s20} kPa`, s301: `About ${N.s20a} kPa`, s296: `About ${N.s20f} kPa`,
    fHi: 'It floats higher', fHov: 'It still hovers', fSink: 'It sinks',
  };
  const EQS = eqTop(600, RS, 2), EQF = eqTop(600, RF, 2);

  // ---------- the lesson: SHOW screens demonstrate, DO screens are puzzles ----------
  // A live screen (live: which controls show) opens on its own settings (set) and runs its
  // demonstration (mot: timed keys for its controls) once.
  const STEPS = [
    { kind: 'pick', name: 'A warm-up', top: 'warm', right: 'Still there.',
      opts: [O.a2, O.a19, O.dep], want: O.a19,
      bad: { [O.a2]: { lab: '2 N: kilograms read as newtons' }, [O.dep]: { lab: 'any block pushing aside 2 L feels the same' } },
      task: 'A block held under fresh water pushes aside 2 L of it. A litre of fresh water has a mass of 1 kg. What is the upthrust on the block?',
      why: `The upthrust is the weight of the water the block pushes aside. 2 L of fresh water has a mass of 2 kg. Its weight is 2 × ${GS}, about ${N.w1} N. What the block is made of does not come into it.`,
      hint: 'Not quite. Find the weight of the water it pushes aside.',
      hints: { [O.a2]: `Not quite. 2 kg is a mass. Each kilogram weighs ${GS} N.`, [O.dep]: 'Not quite. The upthrust is the weight of the water pushed aside, whatever the block is made of.' } },
    { show: true, name: 'The weight above', top: 'tanks', live: { depth: true, fresh: true }, outs: ['probeKpa'], col: true, hlab: true,
      set: { depth: 0 }, dur: 3.8, mot: [{ ctl: 'depth', keys: [[0.5, 0], [3.5, 10]] }],
      text: `Pressure in a liquid comes from the weight of the liquid above. Picture a column of seawater standing on a patch of 1 m². Its height is the depth, h. Its weight is ρ × h × 1 m² × g, where ρ is the *density*, the mass in each cubic metre. All that weight rests on 1 m², so the pressure is *p = ρgh*. The probe sinks down the wide tank. At 10 m it reads about ${N.p10} kPa, about one atmosphere more.` },
    { kind: 'pick', name: 'Five metres down', top: 'tanks', fig: 'p5',
      opts: [O.k150, O.k5, O.k50], want: O.k50,
      bad: { [O.k150]: { lab: `${N.p5a} kPa adds the air: that is absolute` }, [O.k5]: { lab: `${N.p5g} kPa leaves out g, ${GS} N for each kg` } },
      task: "What does the probe's gauge read 5 m down in seawater?",
      why: `A gauge reads ρgh. That is ${DS} × ${GS} × 5 pascals, about ${N.p5} kPa. It leaves out the air pressing on the surface.`,
      hint: 'Not quite. Multiply the density, g and the depth.',
      hints: { [O.k150]: 'Not quite. That adds the air. A gauge leaves the air out.', [O.k5]: `Not quite. ${DS} × 5 is a mass. Multiply by g, ${GS}, for its weight.` } },
    { show: true, name: 'Any shape', top: 'tanks', live: { depth: true, tank: true }, outs: ['probeKpa'], col: true, level: true, names: true,
      set: { depth: 5, tank: 'narrow' }, dur: 3.4, mot: [{ ctl: 'tank', step: true, keys: [[0.5, 'narrow'], [1.6, 'wide'], [2.8, 'flared']] }],
      still: { tank: 'flared', depth: 5 },
      text: 'The three tanks are joined at the bottom. So the liquid settles at one level in all three. At any one depth, the probe reads the same in each. Width and shape are not in ρgh. If one bottom pressed harder, it would push liquid through the join until the levels matched. In the flaring tank, the sloping walls hold up the extra liquid. Still water presses too. It needs no flow, only weight. Drag the probe down any tank.',
      read: 'The three tanks are joined at the bottom. So the liquid settles at one level in all three. At any one depth, the probe reads the same in each. Width and shape are not in ρgh. If one bottom pressed harder, it would push liquid through the join until the levels matched. In the flaring tank, the sloping walls hold up the extra liquid. Still water presses too. It needs no flow, only weight.' },
    { kind: 'pick', name: 'Two bases', top: 'bases',
      opts: [O.both, O.hund, O.narr], want: O.both,
      bad: { [O.hund]: { lab: `${N.ratio} times the push, on ${N.ratio} times the area` }, [O.narr]: { lab: 'the narrow tank is no deeper: both are 2 m' } },
      task: 'Two tanks of fresh water are each 2 m deep. One has a base of 0.1 m², the other 10 m². What pressure is on each bottom?',
      why: `Only the depth sets the pressure. Both bottoms are 2 m down in fresh water. So each feels ${DF} × ${GS} × 2 pascals, about ${N.p2f} kPa. The wide base carries ${N.ratio} times the push, spread over ${N.ratio} times the area.`,
      hint: 'Not quite. Only the depth sets the pressure.',
      hints: { [O.hund]: `Not quite. The wide base carries ${N.ratio} times the push, but over ${N.ratio} times the area.`, [O.narr]: 'Not quite. Both are 2 m deep, and only the depth sets the pressure.' } },
    { show: true, name: 'Every way at once', top: 'tanks', live: { face: true, abs: true }, outs: ['probeKpa'], arrows: true,
      set: { depth: 3, face: 'up' }, dur: 4.0,
      mot: [{ ctl: 'face', step: true, keys: [[0.5, 'up'], [1.4, 'side'], [2.3, 'down']] }, { ctl: 'abs', step: true, keys: [[0.5, false], [3.2, true]] }],
      text: `At any point in a still liquid, pressure pushes every way at once. It pushes square to whatever surface it meets. So 3 m down, the probe reads about ${N.p3} kPa facing up, sideways or down. Its gauge counts only what the liquid adds. The *absolute pressure* adds the air pressing on the surface, about ${N.atm} kPa.` },
    { kind: 'pick', name: 'Turned sideways', top: 'tanks', fig: 'side',
      opts: [O.h15, O.h30, O.h0], want: O.h30,
      bad: { [O.h15]: { lab: `${N.p3h} kPa: half. Pressure is not shared out` }, [O.h0]: { lab: '0 kPa: the liquid beside it presses too' } },
      task: `A small plate sits 3 m down in seawater. Facing up, it reads about ${N.p3} kPa. Turned to face sideways, what does it read?`,
      why: `Pressure at a point pushes every way at once. The plate is still 3 m down. So it reads about ${N.p3} kPa whichever way it faces.`,
      hint: 'Not quite. Pressure pushes every way at once.',
      hints: { [O.h15]: 'Not quite. Pressure is not shared out between directions. It pushes fully every way.', [O.h0]: 'Not quite. The liquid beside the plate presses on it too.' } },
    { show: true, name: 'Held under', top: 'cube', live: { cdepth: true }, outs: ['upthrust'],
      set: { cdepth: -1 }, dur: 3.6, mot: [{ ctl: 'cdepth', keys: [[0.5, -1], [3.2, 2]] }], still: { cdepth: 2 },
      text: `A cube 1 m on a side is held with its top 2 m down. The pushes on its sides match in pairs, so they cancel. Its top is pushed down by about ${N.t2} kPa. Its bottom, 3 m down, is pushed up by about ${N.b3} kPa. On its 1 m² faces, the bottom wins by about ${N.up} kN. That net push up is the *upthrust*. It equals the weight of the seawater the cube pushes aside. Drag the cube deeper. Both pushes grow alike, so the upthrust stays the same.`,
      read: `A cube 1 m on a side is held with its top 2 m down. The pushes on its sides match in pairs, so they cancel. Its top is pushed down by about ${N.t2} kPa. Its bottom, 3 m down, is pushed up by about ${N.b3} kPa. On its 1 m² faces, the bottom wins by about ${N.up} kN. That net push up is the *upthrust*. It equals the weight of the seawater the cube pushes aside. Deeper down, both pushes grow alike, so the upthrust stays the same.` },
    { kind: 'pick', name: 'Six metres down', top: 'cube', fig: 'six',
      opts: [O.u30, O.u70, O.u10], want: O.u10,
      bad: { [O.u30]: { lab: `${N.up3} kN: the upthrust does not grow with depth` }, [O.u70]: { lab: `${N.b7} kN leaves out the top's push down` } },
      task: `The cube is pushed down until its top is 6 m deep. Its top now feels about ${N.t6} kPa, and its bottom about ${N.b7} kPa. What is the upthrust?`,
      why: `On the 1 m² faces, the bottom is pushed up with about ${N.b7} kN. The top is pushed down with about ${N.t6} kN. The difference is about ${N.up} kN. Deeper down, both pushes grew by the same amount. So the upthrust is still the weight of 1 m³ of seawater.`,
      hint: "Not quite. Take the top's push off the bottom's.",
      hints: { [O.u30]: 'Not quite. Deeper down, both pushes grow alike, so their difference does not.', [O.u70]: 'Not quite. The top is pushed down too. Take its push off.' } },
    { show: true, name: 'Float, hover or sink', top: 'cube', float: true, live: { dens: true, fresh: true, letgo: true }, outs: ['upthrust', 'cubeWeight'],
      set: { dens: 600, fpos: 2 }, dur: 4.0,
      mot: [{ ctl: 'rel', step: true, keys: [[0.4, false], [0.5, true]] }, { ctl: 'fpos', keys: [[0.5, 2], [2.4, EQS], [2.9, EQS], [3.7, EQF]] }, { ctl: 'fresh', step: true, keys: [[0.4, false], [2.8, true]] }],
      text: `Whether it floats is a contest between its weight and the upthrust. Its weight depends on its own density. The upthrust depends on the liquid's. A cube less dense than the liquid rises. As it comes out of the surface, it pushes aside less, so the upthrust falls. It settles where the two match. The depth of its bottom is then its *draught*. At 600 kg/m³ that is about ${N.d6s} m in seawater, and ${N.d6f} m in fresh water. As dense as the liquid, it hovers. Denser, it sinks.` },
    { kind: 'pick', name: 'A pontoon', top: 'pontoon',
      opts: [O.d49, O.d98, O.d50], want: O.d49,
      bad: { [O.d98]: { at: 4000 / (RS * 4), lab: `${N.pdb} m: the breadth is left out` }, [O.d50]: { at: 4000 / (RF * 8), lab: `${N.pdf} m is its draught in fresh water` } },
      task: `A box-shaped pontoon 4 m by 2 m has a mass of ${N.pm} kg. How deep does it sit in seawater?`,
      why: `It sinks until it pushes aside its own mass of seawater, ${N.pm} kg. Its base is 4 × 2 = 8 m². So its draught is ${N.pm} ÷ (${DS} × 8), about ${N.pd} m. In fresh water it would sit at ${N.pdf} m.`,
      hint: 'Not quite. Divide its mass by the density times its base area.',
      hints: { [O.d98]: 'Not quite. Use the whole base, length × breadth.', [O.d50]: 'Not quite. That is fresh water. Seawater is denser, so it sits a little higher.' } },
    { kind: 'pick', name: 'A deep sensor', top: 'sensor',
      opts: [O.s201, O.s301, O.s296], want: O.s301,
      bad: { [O.s201]: { lab: `${N.s20} kPa is the gauge: the air is left out` }, [O.s296]: { lab: `${N.s20f} kPa uses fresh water, ${DF} kg/m³` } },
      task: 'A sensor sits 20 m down in seawater. What absolute pressure does it feel?',
      why: `The seawater adds ${DS} × ${GS} × 20 pascals, about ${N.s20} kPa. That is what a gauge reads. The absolute pressure adds the air's ${N.atm} kPa, so about ${N.s20a} kPa.`,
      hint: 'Not quite. Work out ρgh, then add the air.',
      hints: { [O.s201]: 'Not quite. That is the gauge pressure. Add the air.', [O.s296]: `Not quite. That uses fresh water. Seawater is ${DS} kg/m³.` } },
    { kind: 'pick', name: 'Into fresh water', top: 'float',
      opts: [O.fHi, O.fHov, O.fSink], want: O.fSink,
      bad: { [O.fHi]: { lab: 'fresh water holds it up less, not more' }, [O.fHov]: { lab: `fresh water gives only ${N.flF} kN of upthrust` } },
      task: `A sealed float of 1 m³ is weighted to hover in seawater, so its mass is ${DS} kg. Moved into fresh water, what does it do?`,
      why: `In fresh water, 1 m³ pushed aside weighs ${DF} × ${GS} newtons, about ${N.flF} kN. The float weighs ${DS} × ${GS} newtons, about ${N.flS} kN. Its weight wins, so it sinks.`,
      hint: 'Not quite. Compare its weight with the upthrust in fresh water.',
      hints: { [O.fHi]: 'Not quite. Fresh water is less dense than seawater, so it holds things up less.', [O.fHov]: 'Not quite. Compare its weight with the weight of 1 m³ of fresh water.' } },
  ];
  const FINISH = 'Pressure in a still liquid grows with depth alone, as ρgh. The bottom\'s extra push is the upthrust, the weight of the liquid pushed aside.';
  const PICK = 'Pick an answer first.';
  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const testing = () => document.documentElement.classList.contains('k-testing');

  // ---------- each step's state ----------
  function blank() { return { pick: null, res: null, why: false }; }
  let S = STEPS.map(() => blank());
  let finished = false, lastStep = -1, lastDone = false, T = Infinity, motionEnd = 0, MOT = null, keyNow = '', rel = false;
  const EX = {};          // exact values while a demonstration drives a slider (the slider itself moves in steps)
  const FD = { air: 0 };  // how far the air's arrows have faded in
  const el = (id) => document.getElementById(id);

  // ---------- words with amber key terms (built with K.el, never innerHTML) ----------
  function write(node, s) {
    node.textContent = '';
    s = String(s || '');
    const re = /\*([^*]+)\*/g;
    let pos = 0, m;
    while ((m = re.exec(s))) {
      if (m.index > pos) node.appendChild(document.createTextNode(s.slice(pos, m.index)));
      node.appendChild(K.el('span', { class: 'term' }, m[1]));
      pos = m.index + m[0].length;
    }
    if (pos < s.length) node.appendChild(document.createTextNode(s.slice(pos)));
    return node;
  }

  // ---------- controls ----------
  const stepper = K.stepper({ id: 'step', label: 'Screen', steps: STEPS.map((d) => d.name), value: 0, compact: true, into: '#prog' });
  const at = () => K.clamp(Math.round(stepper.get()) || 0, 0, STEPS.length - 1);
  const stepOf = (p) => K.clamp(Math.round(+p.step) || 0, 0, STEPS.length - 1);
  const depthCtl = K.control({ id: 'depth', label: 'Probe depth', min: 0, max: 10, step: 0.1, value: 5, unit: 'm', fmt: (v) => fx(v, 1) + ' m', snap: [3, 5, 10], into: '#ctl' });
  const tankCtl = K.choice({ id: 'tank', label: 'Tank', options: [{ value: 'narrow', label: 'Narrow' }, { value: 'wide', label: 'Wide' }, { value: 'flared', label: 'Flaring' }], value: 'wide', into: '#ctl' });
  const faceCtl = K.choice({ id: 'face', label: "Probe's face", options: [{ value: 'up', label: 'Up' }, { value: 'side', label: 'Sideways' }, { value: 'down', label: 'Down' }], value: 'up', into: '#ctl' });
  const absCtl = K.toggle({ id: 'abs', label: 'Absolute: add the air', value: false, into: '#ctl' });
  const cdCtl = K.control({ id: 'cdepth', label: "Depth of the cube's top", min: -1, max: 7, step: 0.1, value: 2, unit: 'm',
    fmt: (v) => (v < -0.04 ? fx(-v, 1) + ' m above' : fx(Math.abs(v), 1) + ' m'), snap: [2, 6], into: '#ctl' });
  const densCtl = K.control({ id: 'dens', label: "Cube's density", min: 200, max: 1500, step: 25, value: 600, unit: 'kg/m³', fmt: (v) => fx(v) + ' kg/m³', snap: [600, 1000, 1025], into: '#ctl' });
  const freshCtl = K.toggle({ id: 'fresh', label: 'Fresh water', value: false, into: '#ctl' });
  const goBtn = K.button({ label: 'Let go', secondary: true, into: '#ctl', press: () => {
    const d = STEPS[at()];
    if (!d.float || finished) return;
    MOT = null; anim.pause(); T = Infinity;
    rel = !rel;
    settle(rel ? null : 2);
  } });
  // The released cube's position, driven by its own motion (not a control Dan moves).
  const fposCtl = K.control({ id: 'fpos', label: 'Cube position', min: -1, max: 9, step: 0.0001, value: 2, unit: 'm', into: '#hid' });
  const CTL = { depth: depthCtl, tank: tankCtl, face: faceCtl, abs: absCtl, fresh: freshCtl, cdepth: cdCtl, dens: densCtl, fpos: fposCtl,
    rel: { set: (v) => { rel = !!v; } } };
  function setCtl(id, v) { if (typeof v === 'number') EX[id] = v; CTL[id].set(v, true); }
  const ctlKey = (p) => [p.depth, p.tank, p.face, p.abs, p.fresh, p.cdepth, p.dens].join('|');

  const num = (v, d0) => (isFinite(+v) && v !== '' && v != null ? +v : d0);
  const isOn = (v) => v === true || v === 'true';
  const pv = (p, id) => (MOT && EX[id] != null ? EX[id] : p[id]);
  const depthOf = (p) => K.clamp(num(pv(p, 'depth'), 5), 0, 10);
  const cdOf = (p) => K.clamp(num(pv(p, 'cdepth'), 2), -1, 7);
  const fposOf = (p) => K.clamp(num(pv(p, 'fpos'), 2), -1, 9);
  const densOf = (p) => K.clamp(num(p.dens, 600), 200, 1500);
  const tankOf = (p) => (['narrow', 'wide', 'flared'].indexOf(p.tank) >= 0 ? p.tank : 'wide');
  const faceOf = (p) => (['up', 'side', 'down'].indexOf(p.face) >= 0 ? p.face : 'up');
  const rhoOf = (d, p) => (d.live && d.live.fresh && isOn(p.fresh) ? RF : RS);

  // Screens without live controls report the opening settings.
  const OPEN = () => ({ probeKpa: pk(RS, 5), upthrust: upK(RS, 2), cubeWeight: wtK(600) });
  K.model((p) => {
    const d = STEPS[stepOf(p)], o = OPEN();
    if (!d.live) return o;
    const L = d.live, rho = rhoOf(d, p);
    if (d.top === 'tanks') o.probeKpa = pk(rho, L.depth ? K.clamp(num(p.depth, 5), 0, 10) : d.set.depth) + (L.abs && isOn(p.abs) ? ATM : 0);
    else {
      o.upthrust = upK(rho, d.float ? K.clamp(num(p.fpos, 2), -1, 9) : K.clamp(num(p.cdepth, 2), -1, 7));
      o.cubeWeight = wtK(d.float ? densOf(p) : 600);
    }
    return o;
  });

  const rProbe = K.readout({ id: 'probeKpa', label: 'Probe reading', unit: 'kPa', decimals: 1, into: '#outs' });
  const rUp = K.readout({ id: 'upthrust', label: 'Upthrust', unit: 'kN', decimals: 1, into: '#outs' });
  const rWt = K.readout({ id: 'cubeWeight', label: "Cube's weight", unit: 'kN', decimals: 1, into: '#outs' });

  // Up to three answer buttons; each step fills in its own options.
  const pickBtns = [0, 1, 2].map((k) => K.button({ label: 'Answer ' + (k + 1), secondary: true, into: '#picks', press: () => {
    const i = at(), d = STEPS[i], st = S[i];
    if (finished || d.show || k >= d.opts.length || st.res === 'right') return;
    const was = st.res === 'wrong';
    st.pick = d.opts[k]; st.res = null;
    if (was) { anim.pause(); T = Infinity; }
  } }));
  const checkBtn = K.button({ label: 'Check', into: '#acts', press: () => {
    const i = at(), d = STEPS[i], st = S[i];
    if (d.show || finished || st.res === 'right') return;
    if (st.pick == null) { st.res = 'empty'; return; }
    st.res = st.pick === d.want ? 'right' : 'wrong';
    play(ANS);
  } });
  const whyBtn = K.button({ label: 'Why?', secondary: true, into: '#acts', press: () => {
    if (STEPS[at()].show || finished) return;
    const st = S[at()]; st.why = !st.why;
  } });
  K.button({ label: 'Play again', secondary: true, into: '#replay', press: () => {
    const i = at(), d = STEPS[i];
    if (!d.show || finished) return;
    onEnter(i);
    keyNow = ctlKey(K.params());
  } });
  const backBtn = K.button({ label: 'Back', secondary: true, into: '#nav', press: () => {
    if (finished) { finished = false; return; }
    stepper.set(Math.max(0, at() - 1), true);
  } });
  const nextBtn = K.button({ label: 'Continue', into: '#nav', press: () => {
    const i = at();
    if (finished || (!STEPS[i].show && S[i].res !== 'right')) return;
    if (i < STEPS.length - 1) { stepper.set(i + 1, true); return; }
    finished = true; anim.pause(); T = Infinity; MOT = null;
    if (typeof K.complete === 'function') K.complete();
  } });
  K.button({ label: 'Start again', secondary: true, into: '#again', press: () => {
    S = STEPS.map(() => blank()); finished = false; lastStep = -1; stepper.set(0, true);
  } });

  // ---------- motion: one animation plays each demonstration, the cube's settling and an answer ----------
  function valAt(m) {
    const ks = m.keys, last = ks[ks.length - 1];
    if (T === Infinity || T >= last[0]) return last[1];
    if (T <= ks[0][0]) return ks[0][1];
    for (let j = 1; j < ks.length; j++) {
      if (T < ks[j][0]) {
        if (m.step) return ks[j - 1][1];
        const a = (T - ks[j - 1][0]) / Math.max(1e-6, ks[j][0] - ks[j - 1][0]);
        return K.lerp(ks[j - 1][1], ks[j][1], K.ease(a));
      }
    }
    return last[1];
  }
  function stepMot() {
    if (!MOT) return;
    let done = true;
    MOT.forEach((m) => {
      setCtl(m.ctl, valAt(m));
      if (T !== Infinity && T < m.keys[m.keys.length - 1][0]) done = false;
    });
    keyNow = ctlKey(K.params());
    if (done) { MOT = null; Object.keys(EX).forEach((k) => delete EX[k]); }
  }
  function finishMot() { if (MOT) { T = Infinity; stepMot(); MOT = null; } }
  function airTarget() { const d = STEPS[at()]; return d.live && d.live.abs && isOn(K.params().abs) ? 1 : 0; }
  const anim = K.anim({ button: false, label: 'Demonstration', step: (dt) => {
    if (finished) return false;
    T += dt;
    const tgt = airTarget();
    if (FD.air !== tgt) FD.air = tgt > FD.air ? Math.min(tgt, FD.air + dt / 0.6) : Math.max(tgt, FD.air - dt / 0.6);
    if (MOT) { stepMot(); K.refresh(); } else if (STEPS[at()].live) K.refresh(); else paint();
    return T < motionEnd || !!MOT || FD.air !== airTarget();
  } });
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && !anim.playing() && (T !== Infinity || MOT)) { T = Infinity; finishMot(); FD.air = airTarget(); K.refresh(); }
  });
  function play(dur) {
    if (REDUCE || testing()) { anim.pause(); finishMot(); T = Infinity; FD.air = airTarget(); return; }
    motionEnd = dur; T = 0; anim.play();
  }
  // The released cube finds its level (or goes back to 2 m on its line); true when it got there at once.
  function settle(to) {
    const p = K.params(), cur = K.clamp(num(p.fpos, 2), -1, 9), rho = isOn(p.fresh) ? RF : RS;
    const target = to != null ? to : eqTop(densOf(p), rho, cur);
    if (Math.abs(target - cur) < 1e-6) return false;
    const dur = K.clamp(0.5 + 0.35 * Math.abs(target - cur), 0.6, 3);
    MOT = [{ ctl: 'fpos', keys: [[0, cur], [dur, target]] }];
    EX.fpos = cur;
    if (REDUCE || testing()) { anim.pause(); finishMot(); T = Infinity; return true; }
    motionEnd = dur; T = 0; anim.play();
    return false;
  }
  function enter(id) {
    if (REDUCE) return;
    const box = el(id);
    box.classList.remove('enter');
    void box.offsetWidth;
    box.classList.add('enter');
  }
  // A new screen: a live one takes its own settings and runs its demonstration once.
  function onEnter(i) {
    const d = STEPS[i];
    MOT = null; rel = false;
    Object.keys(EX).forEach((k) => delete EX[k]);
    if (d.live) {
      const b = Object.assign({ depth: 5, tank: 'wide', face: 'up', abs: false, fresh: false, cdepth: 2, dens: 600, fpos: 2 }, d.set || {});
      Object.keys(b).forEach((k) => setCtl(k, b[k]));
      FD.air = b.abs ? 1 : 0;
      if (d.mot) { MOT = d.mot.map((m) => Object.assign({}, m)); MOT.forEach((m) => setCtl(m.ctl, m.keys[0][1])); }
    }
    if (d.show) play(d.dur); else { anim.pause(); T = Infinity; }
  }

  // ---------- drawing helpers ----------
  const svg = el('scene'), art = el('art'), kP = el('kp'), kC = el('kc');
  let into = null, REC = null, HH = 306;
  const add = (n) => (into || art).appendChild(n);
  const r2 = (v) => Math.round(v * 100) / 100;
  const sv = (tag, a) => add(K.svg(tag, a));
  const path = (d, cls) => sv('path', { class: cls, d });
  function rect(x, y, w, h, cls) { if (w > 0.3 && h > 0.3) sv('rect', { class: cls, x: r2(x), y: r2(y), width: r2(w), height: r2(h) }); }
  function text(x, y, s, cls, anchor) {
    s = String(s);
    if (REC) REC.texts.push(s);
    return add(K.svg('text', { class: cls, x: r2(x), y: r2(y), 'text-anchor': anchor || 'middle' }, s));
  }
  // How far a part due at t0 has arrived, noting the timetable for the timing check.
  let latest = 0, earliest = Infinity;
  function note(t0, d) { if (t0 + d > latest) latest = t0 + d; if (t0 < earliest) earliest = t0; }
  function arr(t0, d) { d = d == null ? K.SOFT : d; note(t0, d); return K.arrive(T, t0, d); }
  function lin(t0, d) { note(t0, d); return T === Infinity ? 1 : K.clamp((T - t0) / d, 0, 1); }
  function part(a, rise, draw) {
    if (a <= 0) return;
    const g = add(K.svg('g'));
    K.fade(g, Math.min(1, a), rise);
    const keep = into; into = g; draw(); into = keep;
  }
  function ftext(a, x, y, s, cls, anchor) { if (a > 0) part(a, 0, () => text(x, y, s, cls, anchor)); }
  // A straight arrow from (x1, y1) to its tip at (x2, y2): a line and a filled head.
  function arrow(x1, y1, x2, y2, k) {
    const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy);
    if (L < 6) return;
    const ux = dx / L, uy = dy / L, hl = Math.min(8, L * 0.55), hw = hl * 0.5;
    const bx = x2 - ux * hl, by = y2 - uy * hl;
    sv('line', { class: 'ar ar-' + k, x1: r2(x1), y1: r2(y1), x2: r2(bx + ux * 0.5), y2: r2(by + uy * 0.5) });
    path(`M${r2(x2)} ${r2(y2)} L${r2(bx - uy * hw)} ${r2(by + ux * hw)} L${r2(bx + uy * hw)} ${r2(by - ux * hw)} Z`, 'hd hd-' + k);
  }
  const wrongOf = (d, st) => (st.res === 'wrong' && st.pick != null && d.bad ? d.bad[st.pick] || null : null);
  const liqName = (rho) => (rho === RF ? 'fresh water' : 'seawater');
  const keyLine = (rho) => `${liqName(rho)}: ρ = ${rho === RF ? DF : DS} kg/m³ · g = ${GS} N/kg`;
  function placeKnob(k, show, x, y) {
    k.hidden = !show;
    if (!show) return;
    k.style.left = r2(x / 340 * 100) + '%';
    k.style.top = r2(y / HH * 100) + '%';
  }

  // ---------- the three joined tanks ----------
  const SURF = 70, UPM = 19, FLOOR = 260;
  const TX = { narrow: 49, wide: 140, flared: 283 };
  const TNAME = { narrow: 'narrow', wide: 'wide', flared: 'flaring' };
  const yAt = (h) => SURF + h * UPM;
  function span(t, y) {
    if (t === 'narrow') return [40, 58];
    if (t === 'wide') return [84, 240];
    const k = (FLOOR - y) * 20 / 190;
    return [274 - k, 292 + k];
  }
  function tanks(rho) {
    text(8, 16, keyLine(rho), 'lab m', 'start');
    path('M40 70 H58 V260 H84 V70 H240 V260 H274 L254 70 H312 L292 260 V274 H40 Z', 'liq');
    [[40, 58], [84, 240], [254, 312]].forEach((s) => sv('line', { class: 'surf', x1: s[0], y1: SURF, x2: s[1], y2: SURF }));
    path('M40 46 V274 H292 V260 L312 70 L314.53 46', 'wall');
    path('M58 46 V260 H84 V46', 'wall');
    path('M240 46 V260 H274 L254 70 L251.47 46', 'wall');
    [0, 5, 10].forEach((m) => { const y = yAt(m); sv('line', { class: 'tk', x1: 32, y1: y, x2: 37, y2: y }); text(30, y + 4.5, m + ' m', 'tl', 'end'); });
  }
  function air(a, k, lab) {
    if (a <= 0) return;
    part(a, 0, () => {
      [49, 110, 190, 270, 296].forEach((x) => arrow(x, 50, x, 68, k));
      if (lab) text(44, 36, `the air adds ${N.atm} kPa on every surface`, 'lab t', 'start');
    });
  }
  function probe(x, y, face) {
    sv('line', { class: 'cable', x1: x, y1: 40, x2: x, y2: r2(y - 7) });
    sv('circle', { class: 'probe', cx: x, cy: r2(y), r: 7 });
    const f = face === 'up' ? [x - 6, y - 8, x + 6, y - 8] : face === 'down' ? [x - 6, y + 8, x + 6, y + 8] : [x + 8, y - 6, x + 8, y + 6];
    sv('line', { class: 'face', x1: r2(f[0]), y1: r2(f[1]), x2: r2(f[2]), y2: r2(f[3]) });
  }
  const column = (x, y, cls) => rect(x - 6, SURF, 12, y - 8 - SURF, cls || 'col');
  function hBracket(x, y, lab) {
    if (y - SURF < 8) return;
    path(`M${x - 5} ${SURF} H${x} V${r2(y)} H${x - 5}`, 'brk');
    if (lab && y - SURF >= 19) text(x + 6, r2((SURF + y) / 2 + 4.5), lab, 'lab n', 'start');
  }
  const DIRS = { up: [0, -1], ne: [0.7071, -0.7071], side: [1, 0], se: [0.7071, 0.7071], down: [0, 1], sw: [-0.7071, 0.7071], left: [-1, 0], nw: [-0.7071, -0.7071] };
  // The liquid's push all round the probe (its cable comes down from above).
  function ghostArrows(x, y, skip) {
    Object.keys(DIRS).forEach((k) => { if (k === 'up' || k === skip) return; const u = DIRS[k]; arrow(x + u[0] * 25, y + u[1] * 25, x + u[0] * 11, y + u[1] * 11, 'm'); });
  }
  // The push on the probe's face: two arrows square to it.
  function faceArrows(x, y, face, len, k) {
    const u = DIRS[face], n = [-u[1], u[0]];
    [-6, 6].forEach((o) => {
      const tx = x + u[0] * 10 + n[0] * o, ty = y + u[1] * 10 + n[1] * o;
      arrow(tx + u[0] * len, ty + u[1] * len, tx, ty, k);
    });
  }
  function drawTankStep(d, st, bad, wa, p) {
    const right = st.res === 'right', ra = right ? arr(0.1) : 0;
    const rho = rhoOf(d, p);
    tanks(rho);
    if (d.live) {
      const L = d.live, h = L.depth ? depthOf(p) : d.set.depth, t = L.tank ? tankOf(p) : 'wide', face = L.face ? faceOf(p) : 'up';
      const x = TX[t], y = yAt(h);
      if (d.level) ['narrow', 'wide', 'flared'].forEach((k) => { const s = span(k, y); sv('line', { class: 'lvl', x1: r2(s[0] + 2), y1: r2(y), x2: r2(s[1] - 2), y2: r2(y) }); });
      if (d.col) column(x, y);
      if (d.arrows) { ghostArrows(x, y, face); faceArrows(x, y, face, 20, 'n'); }
      probe(x, y, face);
      if (d.hlab) {
        hBracket(x + 14, y, 'h = ' + fx(h, 1) + ' m');
        if (h >= 0.6) text(x - 19, r2(y + 4.5), 'p', 'lab n', 'end');
        text(x + 5, 62, 'weight above', 'lab m', 'start');
      }
      if (d.arrows) {
        hBracket(x + 40, y, fx(h) + ' m');
        air(FD.air, 't', true);
        text(170, 296, "arrows: the liquid's push, every way at once", 'lab m');
      }
      if (d.names) {
        ['narrow', 'wide', 'flared'].forEach((k) => text(k === 'wide' ? 162 : TX[k], 292, TNAME[k], k === t ? 'lab n' : 'lab m'));
        text(170, 312, 'dashed: one depth in all three tanks', 'lab m');
      }
      placeKnob(kP, !!L.depth, x, y);
      if (L.face) return `Three tanks of seawater joined at the bottom. A probe hangs 3 m down the wide tank, facing ${face === 'side' ? 'sideways' : face}, with arrows showing the liquid pushing on it from every side.` + (isOn(p.abs) ? ' Arrows above the surfaces show the air pressing down too.' : '');
      if (L.tank) return `Three tanks, narrow, wide and flaring, joined at the bottom and filled to one level. A probe hangs ${fx(h, 1)} m down the ${TNAME[t]} tank under a shaded column of seawater. A dashed line marks that depth in all three.`;
      return `Three tanks of ${liqName(rho)} joined at the bottom. A probe hangs ${fx(h, 1)} m down the wide tank, under a shaded column of the liquid above it, with its depth h bracketed.`;
    }
    if (d.fig === 'p5') {
      const x = TX.wide, y = yAt(5);
      if (bad && bad === d.bad[O.k5]) { REC.bad++; part(wa, 0, () => rect(x - 9, SURF + 1, 18, y - 9 - SURF, 'bad')); }
      column(x, y);
      probe(x, y, 'up');
      hBracket(x + 14, y, 'h = 5 m');
      ftext(1 - ra, x - 19, y + 4.5, 'p = ?', 'lab n', 'end');
      ftext(ra, x - 19, y + 4.5, 'p', 'lab n', 'end');
      if (right) { REC.ans = true; REC.res = pk(RS, 5); ftext(arr(0.5), 170, 296, `${DS} × ${GS} × 5 = about ${N.p5} kPa`, 'lab n'); }
      if (bad) {
        if (bad === d.bad[O.k150]) { REC.bad++; air(wa, 'w', false); }
        ftext(wa, 170, 296, bad.lab, 'lab w');
      }
      return 'Three tanks of seawater joined at the bottom. A probe hangs 5 m down the wide tank under a shaded column of seawater, its reading p left as a question.' + (right ? ` It reads ${N.p5} kPa.` : '');
    }
    // fig 'side': the plate 3 m down, turned to face sideways
    const x = TX.wide, y = yAt(3);
    probe(x, y, 'side');
    hBracket(x + 40, y, '3 m');
    ftext(1 - Math.max(ra, wa), x + 16, y + 4.5, '?', 'lab n', 'start');
    if (right) {
      REC.ans = true; REC.res = pk(RS, 3);
      part(ra, 0, () => { ghostArrows(x, y, 'side'); faceArrows(x, y, 'side', 20, 'n'); });
      ftext(arr(0.5), 170, 296, `sideways: about ${N.p3} kPa, the same every way`, 'lab n');
    }
    if (bad) {
      REC.bad++;
      part(wa, 0, () => {
        if (bad === d.bad[O.h0]) sv('circle', { class: 'bad', cx: x + 4, cy: y, r: 14 });
        else faceArrows(x, y, 'side', 10, 'w');
      });
      ftext(wa, 170, 296, bad.lab, 'lab w');
    }
    return `Three tanks of seawater. A small plate on a probe sits 3 m down the wide tank, turned to face sideways.` + (right ? ` Arrows show the liquid pushing on it from every side, ${N.p3} kPa on its face.` : ' Its reading is left as a question.');
  }

  // ---------- two tanks of fresh water with different bases ----------
  function drawBases(d, st, bad, wa) {
    const right = st.res === 'right', ra = right ? arr(0.1) : 0;

    rect(46, 50, 18, 100, 'liq'); rect(120, 50, 180, 100, 'liq');
    sv('line', { class: 'surf', x1: 46, y1: 50, x2: 64, y2: 50 }); sv('line', { class: 'surf', x1: 120, y1: 50, x2: 300, y2: 50 });
    path('M46 36 V150 H64 V36', 'wall'); path('M120 36 V150 H300 V36', 'wall');
    path('M41 50 H36 V150 H41', 'brk'); text(31, 104.5, '2 m', 'lab n', 'end');
    path('M115 50 H110 V150 H115', 'brk'); text(105, 104.5, '2 m', 'lab n', 'end');
    text(55, 172, 'base 0.1 m²', 'lab'); text(210, 172, 'base 10 m²', 'lab');
    ftext(1 - Math.max(ra, wa), 55, 192, '?', 'lab n'); ftext(1 - Math.max(ra, wa), 210, 192, '?', 'lab n');
    if (right) {
      REC.ans = true; REC.res = pk(RF, 2);
      part(ra, 0, () => { [55, 140, 175, 210, 245, 280].forEach((x) => arrow(x, 116, x, 148, 'n')); });
      ftext(arr(0.4), 55, 192, `${N.p2f} kPa`, 'lab n'); ftext(arr(0.4), 210, 192, `${N.p2f} kPa`, 'lab n');
      ftext(arr(0.8), 170, 214, 'the same: only the depth counts', 'lab n');
    }
    if (bad) {
      REC.bad++;
      part(wa, 0, () => {
        if (bad === d.bad[O.narr]) arrow(55, 62, 55, 148, 'w');
        else sv('line', { class: 'bad', x1: 121, y1: 146, x2: 299, y2: 146 });
      });
      ftext(wa, 170, 214, bad.lab, 'lab w');
    }
    return 'Two tanks of fresh water, each 2 m deep: a narrow one on a 0.1 m² base and a wide one on a 10 m² base.' + (right ? ` Equal arrows press on both bottoms, ${N.p2f} kPa each.` : ' The pressure on each bottom is left as a question.');
  }

  // ---------- the cube: the wide tank to scale, and a close-up of its faces ----------
  const SURF2 = 60, UPM2 = 20, TL = 44, TR = 116, CXS = 80;
  const FX0 = 140, FX1 = 336, FY0 = 40, FY1 = 262;
  const CX0 = 190, CX1 = 270, CY0 = 120, CY1 = 200, CXM = 230, ZM = 80, AS = 0.6, SB = 3, SBF = 15;
  function cubeTank(rho, top, held) {
    text(8, 16, keyLine(rho), 'lab m', 'start');
    rect(TL, SURF2, TR - TL, 200, 'liq');
    sv('line', { class: 'surf', x1: TL, y1: SURF2, x2: TR, y2: SURF2 });
    path(`M${TL} 44 V260 H${TR} V44`, 'wall');
    [0, 5, 10].forEach((m) => { const y = SURF2 + m * UPM2; sv('line', { class: 'tk', x1: 34, y1: y, x2: 39, y2: y }); text(32, y + 4.5, m + ' m', 'tl', 'end'); });
    const y0 = SURF2 + top * UPM2;
    if (held) sv('line', { class: 'cable', x1: CXS - 6.5, y1: 26, x2: CXS - 6.5, y2: r2(y0) });
    rect(CXS - 10, y0, 20, 20, 'cube');
    sv('line', { class: 'zoom', x1: CXS + 10, y1: r2(y0), x2: FX0, y2: FY0 });
    sv('line', { class: 'zoom', x1: CXS + 10, y1: r2(y0 + 20), x2: FX0, y2: FY1 });
    rect(FX0, FY0, FX1 - FX0, FY1 - FY0, 'frame');
    const ys = CY0 - top * ZM, yl = Math.max(FY0 + 1, ys);
    if (ys < FY1 - 1) rect(FX0 + 1, yl, FX1 - FX0 - 2, FY1 - 1 - yl, 'liq');
    if (ys > FY0 + 1 && ys < FY1 - 1) sv('line', { class: 'surf', x1: FX0 + 1, y1: r2(ys), x2: FX1 - 1, y2: r2(ys) });
    if (held) sv('line', { class: 'cable', x1: CX0 + 14, y1: FY0 + 1, x2: CX0 + 14, y2: CY0 });
    rect(CX0, CY0, CX1 - CX0, CY1 - CY0, 'cube');
    text(CXM, 164.5, '1 m cube', 'lab');
    text(FX0 + 6, FY1 - 8, 'close-up', 'lab', 'start');
    return ys;
  }
  // Pressure arrows on the faces, their length growing with depth (the sides in muted pairs).
  function zoomArrows(top, rho) {
    const L = (z) => (z > 0 ? AS * pk(rho, z) : 0), lt = L(top), lb = L(top + 1);
    if (lt >= 8) arrow(CXM, CY0 - lt, CXM, CY0 - 1, 'n');
    if (lb >= 8) arrow(CXM, CY1 + lb, CXM, CY1 + 1, 'n');
    let sides = false;
    [0.2, 0.5, 0.8].forEach((f) => {
      const l = L(top + f);
      if (l < 8) return;
      const y = CY0 + f * ZM;
      arrow(CX0 - l, y, CX0 - 1, y, 'm'); arrow(CX1 + l, y, CX1 + 1, y, 'm');
      sides = true;
    });
    if (lt >= 8) text(CXM + 8, CY0 - 8, fx(pk(rho, top), 1) + ' kPa', 'lab', 'start');
    if (lb >= 8) text(CXM + 8, CY1 + 18, fx(pk(rho, top + 1), 1) + ' kPa', 'lab', 'start');
    if (sides) text(FX1 - 6, FY1 - 8, 'sides cancel', 'lab m', 'end');
  }
  // The pushes on the top and bottom as bars; the bottom's extra push is shaded amber.
  function pushBars(top, rho, diff, disp) {
    const Fd = top > 0 ? pk(rho, top) : 0, Fu = pk(rho, top + 1), W = upK(rho, top);
    text(8, 290, `push down on the top: ${fx(Fd, 1)} kN`, 'lab', 'start');
    rect(8, 296, Fd * SB, 12, 'bpush');
    text(8, 326, `push up on the bottom: ${fx(Fu, 1)} kN`, 'lab', 'start');
    rect(8, 332, Fu * SB, 12, 'bpush');
    if (diff > 0) part(diff, 0, () => rect(8 + Fd * SB, 332, (Fu - Fd) * SB, 12, 'bup'));
    if (disp > 0) part(disp, 0, () => { text(8, 362, `weight of the ${liqName(rho)} pushed aside`, 'lab', 'start'); rect(8 + Fd * SB, 368, W * SB, 12, 'bdisp'); });
    return { Fd, Fu, W };
  }
  function upKey(a, lab) {
    part(a, 0, () => { rect(8, 389, 14, 12, 'bup'); text(28, 399.5, lab, 'lab', 'start'); });
  }
  function floatStatus(p) {
    const rho = isOn(p.fresh) ? RF : RS, dens = densOf(p), t = fposOf(p);
    const m = MOT && MOT.find((q) => q.ctl === 'fpos');
    let target = t;
    if (m && T !== Infinity) { const nk = m.keys.find((k) => k[0] > T); target = nk ? nk[1] : t; }
    const moving = Math.abs(target - t) > 1e-4;
    return { rho, dens, t, moving, target, floating: rel && !moving && dens < rho - EPS };
  }
  function drawCubeStep(d, st, bad, wa, p) {
    const right = st.res === 'right', ra = right ? arr(0.1) : 0;
    if (d.float) {
      const f = floatStatus(p);
      const ys = cubeTank(f.rho, f.t, !rel);
      if (f.floating) {
        path(`M${CX1 + 3} ${r2(ys)} H${CX1 + 8} V${CY1} H${CX1 + 3}`, 'brk');
        text(CX1 + 13, r2((ys + CY1) / 2 + 4.5), 'draught', 'lab m', 'start');
      }
      text(8, 290, 'upthrust', 'lab', 'start');
      rect(8, 296, upK(f.rho, f.t) * SBF, 12, 'bup');
      text(8, 326, "the cube's weight", 'lab', 'start');
      rect(8, 332, wtK(f.dens) * SBF, 12, 'bwt');
      let status;
      if (!rel) status = f.moving ? 'being lifted back on its line' : 'held on its line at 2 m';
      else if (f.moving) status = f.target < f.t ? 'rising' : f.target >= 0 ? 'sinking' : 'settling lower';
      else if (Math.abs(f.dens - f.rho) < EPS) status = 'hovering where it was let go';
      else if (f.dens > f.rho) status = 'resting on the floor';
      else status = `floating, draught ${fx(draught(f.dens, f.rho), 2)} m`;
      text(8, 364, status, 'lab n', 'start');
      return `The wide tank of ${liqName(f.rho)}, to scale, with a 1 m cube, ${status}, and a close-up of the cube. Bars compare the upthrust with the cube's weight.`;
    }
    if (d.live) {
      const top = cdOf(p);
      cubeTank(RS, top, true);
      zoomArrows(top, RS);
      pushBars(top, RS, 1, 1);
      upKey(1, 'the extra push up: the upthrust');
      placeKnob(kC, true, CXS, SURF2 + top * UPM2 + 10);
      return `The wide tank of seawater, to scale, with a 1 m cube held on a line, its top ${top < 0 ? fx(-top, 1) + ' m above' : fx(top, 1) + ' m below'} the surface, and a close-up with arrows for the pushes on its faces. Bars compare the push down on the top, the push up on the bottom, and the weight of the seawater pushed aside.`;
    }
    // fig 'six': the cube's top 6 m down
    cubeTank(RS, 6, true);
    zoomArrows(6, RS);
    const b = pushBars(6, RS, ra, ra);
    ftext(1 - Math.max(ra, wa), 8, 399.5, 'upthrust: ?', 'lab n', 'start');
    if (right) { REC.ans = true; REC.res = b.Fu - b.Fd; upKey(arr(0.5), `upthrust: ${N.b7} − ${N.t6} = about ${N.up} kN`); }
    if (bad) {
      REC.bad++;
      part(wa, 0, () => {
        if (bad === d.bad[O.u30]) rect(8 + b.Fd * SB, 332, 3 * b.W * SB, 12, 'bad');
        else rect(8, 332, b.Fu * SB, 12, 'bad');
      });
      ftext(wa, 8, 399.5, bad.lab, 'lab w', 'start');
    }
    return `The wide tank of seawater with a 1 m cube held with its top 6 m down, and a close-up with arrows for the pushes on its faces: ${N.t6} kPa on the top and ${N.b7} kPa on the bottom. Bars show the push down and the push up.` + (right ? ` The bottom's extra push, ${N.up} kN, matches the weight of the seawater pushed aside.` : ' The upthrust is left as a question.');
  }

  // ---------- a pontoon in seawater ----------
  function drawPontoon(d, st, bad, wa) {
    const right = st.res === 'right', dd = right ? 4000 / (RS * 8) * K.ease(lin(0.1, 1.2)) : 0;
    const WL = 150, S = 50, X0 = 70, X1 = 270, OX = 35, OY = -35, yb = WL + dd * S, yt = yb - 60;
    text(8, 16, `seawater: ρ = ${DS} kg/m³`, 'lab m', 'start');
    path(`M${X0} ${r2(yt)} L${X0 + OX} ${r2(yt + OY)} L${X1 + OX} ${r2(yt + OY)} L${X1} ${r2(yt)} Z`, 'hull2');
    path(`M${X1} ${r2(yt)} L${X1 + OX} ${r2(yt + OY)} L${X1 + OX} ${r2(yb + OY)} L${X1} ${r2(yb)} Z`, 'hull2');
    rect(X0, yt, X1 - X0, 60, 'hull');
    text(187, r2(yt - 46), `4 m long · 2 m wide · ${N.pm} kg`, 'lab');

    if (right) {

      ftext(arr(1.0), X0 - 15, r2((WL + yb) / 2 + 4.5), `${N.pd} m`, 'lab n', 'end');
      ftext(arr(0.6), 170, 250, `${N.pm} ÷ (${DS} × 4 × 2) = about ${N.pd} m`, 'lab n');
    } else ftext(1 - wa, X0 - 15, WL + 16, '?', 'lab n', 'end');
    if (bad) {
      REC.bad++;
      part(wa, 0, () => sv('line', { class: 'bad', x1: X0 + 2, y1: r2(yb - bad.at * S), x2: X1 - 2, y2: r2(yb - bad.at * S) }));
      ftext(wa, 170, 250, bad.lab, 'lab w');

    return `A box-shaped pontoon, 4 m long, 2 m wide and ${N.pm} kg, on seawater.` + (right ? ` It sits ${N.pd} m deep.` : ' How deep it sits is left as a question.');
  }

  // ---------- a sensor 20 m down ----------
  function drawSensor(d, st, bad, wa) {
    const right = st.res === 'right', KS = 0.6, BASE = 252;
    text(8, 16, keyLine(RS), 'lab m', 'start');
    text(8, 36, `air: ${N.atm} kPa`, 'lab t', 'start');
    [30, 100].forEach((x) => arrow(x, 44, x, 58, 't'));
    rect(8, 60, 112, 192, 'liq');
    sv('line', { class: 'surf', x1: 8, y1: 60, x2: 120, y2: 60 });
    sv('line', { class: 'cable', x1: 64, y1: 62, x2: 64, y2: 234 });
    rect(56, 52, 16, 10, 'hull');
    sv('circle', { class: 'probe', cx: 64, cy: 240, r: 6 });
    path('M79 60 H84 V240 H79', 'brk');
    text(90, 154.5, '20 m', 'lab n', 'start');
    sv('line', { class: 'tk', x1: 146, y1: BASE, x2: 194, y2: BASE });
    text(170, 270, 'at the sensor', 'lab m');
    ftext(1 - Math.max(arr(0.1) * (right ? 1 : 0), wa), 170, 244, '?', 'lab n');
    const hs = KS * pk(RS, 20), ha = KS * ATM;

      rect(150, BASE - hs * g1, 40, hs * g1, 'bdisp');
      if (g2 > 0) rect(150, BASE - hs - ha * g2, 40, ha * g2, 'bair');
      ftext(arr(0.5), 198, BASE - hs / 2 + 4.5, `seawater: ${N.s20} kPa`, 'lab', 'start');
      ftext(arr(1.0), 198, BASE - hs - ha / 2 + 4.5, `air: ${N.atm} kPa`, 'lab', 'start');
      ftext(arr(1.3), 198, BASE - hs - ha - 4, `${N.s20a} kPa absolute`, 'lab n', 'start');
    }
    if (bad) {
      REC.bad++;
      const h = bad === d.bad[O.s201] ? hs : KS * (pk(RF, 20) + ATM);
      part(wa, 0, () => rect(150, BASE - h, 40, h, 'bad'));
      ftext(wa, 170, 290, bad.lab, 'lab w');
    }
    return `The sea, with a sensor on a line 20 m below a float, and the air pressing on the surface at ${N.atm} kPa.` + (right ? ` A stacked bar adds ${N.s20} kPa of seawater and ${N.atm} kPa of air: ${N.s20a} kPa absolute.` : ' The absolute pressure at the sensor is left as a question.');
  }

  // ---------- a sealed float, moved from seawater into fresh water ----------
  function drawFloatPick(d, st, bad, wa) {
    const right = st.res === 'right';
    rect(24, 50, 126, 140, 'liq'); rect(190, 50, 126, 140, 'liq');
    sv('line', { class: 'surf', x1: 24, y1: 50, x2: 150, y2: 50 }); sv('line', { class: 'surf', x1: 190, y1: 50, x2: 316, y2: 50 });
    path('M24 36 V190 H150 V36', 'wall'); path('M190 36 V190 H316 V36', 'wall');
    text(87, 208, 'seawater', 'lab'); text(87, 224, `${DS} kg/m³`, 'lab m');
    text(253, 208, 'fresh water', 'lab'); text(253, 224, `${DF} kg/m³`, 'lab m');
    rect(69, 102, 36, 36, 'cube'); text(87, 124.5, '1 m³', 'lab'); text(87, 94, 'hovers', 'lab n');
    if (right) {
      const s = K.ease(lin(0.1, 1.2)), fy = 102 + 52 * s;
      REC.ans = true; REC.res = wtK(RF);
      rect(235, fy, 36, 36, 'cube'); text(253, r2(fy + 22.5), '1 m³', 'lab');
      ftext(arr(1.0), 253, r2(fy - 8), 'sinks', 'lab n');
    } else if (!bad) { rect(235, 102, 36, 36, 'ghost'); text(253, 124.5, '?', 'lab n'); }
    text(8, 252, `the float's weight: ${N.flS} kN`, 'lab', 'start');
    rect(8, 258, wtK(RS) * SBF, 12, 'bwt');
    text(8, 288, `upthrust in seawater: ${N.flS} kN`, 'lab', 'start');
    rect(8, 294, upK(RS, 0) * SBF, 12, 'bup');
    const ra = right ? arr(0.3) : 0;
    ftext(1 - ra, 8, 324, 'upthrust in fresh water: ?', 'lab', 'start');
    ftext(ra, 8, 324, `upthrust in fresh water: ${N.flF} kN`, 'lab', 'start');
    if (right) {
      rect(8, 330, wtK(RF) * SBF * K.ease(lin(0.3, 0.8)), 12, 'bup');
      ftext(arr(1.0), 170, 362, `${N.flF} kN of upthrust cannot hold up ${N.flS} kN`, 'lab n');
    }
    if (bad) {
      REC.bad++;
      part(wa, 0, () => rect(235, bad === d.bad[O.fHi] ? 36 : 102, 36, 36, 'bad'));
      ftext(wa, 170, 362, bad.lab, 'lab w');
    }
    return `Two tanks: a sealed 1 m³ float hovers in seawater, and the same float goes into fresh water. Bars compare its ${N.flS} kN weight with the upthrust in each.` + (right ? ' In fresh water it sinks.' : '');
  }

  // ---------- the warm-up: a block under fresh water ----------
  function drawWarm(d, st, bad, wa) {
    const right = st.res === 'right', ra = right ? arr(0.1) : 0;
    text(8, 16, `fresh water: ${DF} kg/m³`, 'lab m', 'start');
    rect(24, 56, 152, 140, 'liq');
    sv('line', { class: 'surf', x1: 24, y1: 56, x2: 176, y2: 56 });
    path('M24 40 V196 H176 V40', 'wall');
    sv('line', { class: 'cable', x1: 100, y1: 28, x2: 100, y2: 100 });
    rect(70, 100, 60, 36, 'cube'); text(100, 122.5, 'block', 'lab');
    arrow(100, 182, 100, 137, 'n');
    text(92, 170, 'upthrust', 'lab n', 'end');
    ftext(1 - Math.max(ra, wa), 108, 170, '?', 'lab n', 'start');
    ftext(ra, 108, 170, `${N.w1} N`, 'lab n', 'start');
    text(250, 80, '2 L pushed aside', 'lab');
    rect(230, 92, 40, 40, 'bdisp'); rect(230, 132, 40, 40, 'bdisp');
    text(250, 116.5, '1 L', 'lab'); text(250, 156.5, '1 L', 'lab');
    text(276, 116.5, '1 kg', 'lab m', 'start'); text(276, 156.5, '1 kg', 'lab m', 'start');
    if (right) { REC.ans = true; REC.res = 2 * G; ftext(arr(0.6), 170, 218, `its weight: 2 kg × ${GS} = ${N.w1} N`, 'lab n'); }
    if (bad) {
      REC.bad++;
      part(wa, 0, () => { if (bad === d.bad[O.a2]) arrow(120, 148, 120, 137, 'w'); else rect(65, 95, 70, 46, 'bad'); });
      ftext(wa, 170, 218, bad.lab, 'lab w');
    }
    return 'A block held on a line under fresh water, with the upthrust drawn as an arrow pushing up on its bottom. Beside it, the 2 L of water it pushes aside, as two 1 L blocks of 1 kg each.' + (right ? ` The upthrust is ${N.w1} N.` : ' The upthrust is left as a question.');
  }

  const DRAW = { warm: drawWarm, tanks: drawTankStep, bases: drawBases, cube: drawCubeStep, pontoon: drawPontoon, sensor: drawSensor, float: drawFloatPick };
  const heightOf = (d) => (d.top === 'warm' ? 230 : d.top === 'tanks' ? (d.names ? 322 : 306) : d.top === 'bases' ? 226 : d.top === 'cube' ? (d.float ? 374 : 408) : d.top === 'pontoon' ? 262 : d.top === 'sensor' ? 302 : 374);
  // The scene for a step (the animation calls this every frame).
  function paint(i, pOver) {
    if (i == null) i = at();
    const d = STEPS[i], st = S[i], p = pOver || K.params();
    art.textContent = '';
    into = null;
    REC = { texts: [], bad: 0, ans: false, res: null };
    const bad = wrongOf(d, st), wa = bad ? arr(0.1) : 0;
    HH = heightOf(d);
    placeKnob(kP, false); placeKnob(kC, false);
    const said = DRAW[d.top](d, st, bad, wa, p);
    svg.setAttribute('viewBox', '0 0 340 ' + HH);
    svg.setAttribute('aria-label', said + (bad ? ' The answer picked is drawn in red.' : ''));
  }
  // Dragging the ring moves the probe, or the cube, up and down.
  function vyOf(knob, y) {
    const kr = knob.getBoundingClientRect(), sr = svg.getBoundingClientRect();
    if (!sr.height) return null;
    return (kr.top + y - sr.top) / sr.height * HH;
  }
  K.drag(kP, { control: 'depth', toValue: (x, y) => {
    const vy = vyOf(kP, y);
    return vy == null || !isFinite(vy) ? depthOf(K.params()) : K.clamp(Math.round((vy - SURF) / UPM * 10) / 10, 0, 10);
  } });
  K.drag(kC, { control: 'cdepth', toValue: (x, y) => {
    const vy = vyOf(kC, y);
    return vy == null || !isFinite(vy) ? cdOf(K.params()) : K.clamp(Math.round(((vy - SURF2) / UPM2 - 0.5) * 10) / 10, -1, 7);
  } });

  // ---------- what Dan reads under a live picture ----------
  function sayFor(d, p) {
    const L = d.live;
    if (d.top === 'tanks') {
      const rho = rhoOf(d, p), liq = liqName(rho), h = L.depth ? depthOf(p) : d.set.depth;
      const P = fx(pk(rho, h) + (L.abs && isOn(p.abs) ? ATM : 0), 1);
      if (L.face) {
        const f = { up: 'up', side: 'sideways', down: 'down' }[faceOf(p)];
        return isOn(p.abs) ? `Facing ${f}, 3 m down, the probe reads ${P} kPa absolute: the seawater's push plus the air's ${N.atm} kPa. It reads the same whichever way it faces.`
          : `Facing ${f}, 3 m down, the probe's gauge reads ${P} kPa, the seawater's push alone. It reads the same whichever way it faces.`;
      }
      if (h < 0.05) return L.tank ? 'At the surface the probe reads nothing, in all three tanks.' : `At the surface there is no ${liq} above the probe, so its gauge reads nothing.`;
      if (L.tank) return `In the ${TNAME[tankOf(p)]} tank, ${fx(h, 1)} m down, the probe reads ${P} kPa. At that depth it reads the same in the other two.`;
      return `${fx(h, 1)} m of ${liq} stands above the probe. Its weight presses on the probe with ${P} kPa` + (h > 9.95 && rho === RS ? ', about as much again as the air.' : '.');
    }
    if (!d.float) {
      const t = cdOf(p), U = fx(upK(RS, t), 1);
      if (t <= -0.95) return 'The cube sits on the surface. It pushes no seawater aside, so there is no upthrust.';
      if (t < -0.05) return `Only ${fx(sub(t), 1)} m of the cube is under. It pushes aside ${fx(sub(t), 1)} m³ of seawater, so the upthrust is ${U} kN.`;
      if (t < 0.05) return `The top is at the surface, so only the bottom is pushed: ${U} kN up, the weight of 1 m³ of seawater.`;
      return `The top is ${fx(t, 1)} m down and the bottom ${fx(t + 1, 1)} m. The bottom's push beats the top's by ${U} kN, the weight of 1 m³ of seawater.`;
    }
