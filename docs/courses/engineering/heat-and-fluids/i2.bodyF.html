<script>
  // ---------- the rule: heat in, heat out ----------
  // The copper makes I²R losses. Its heat leaves through layers in a row, each with a thermal
  // resistance in K·m/W, and they add. Each second the losses less the heat leaving warm the copper,
  // which needs CAP J for each °C in each metre. The heat leaving is the rise ÷ the total. So the
  // copper climbs along 1 − e^(−t/τ) to losses × total above the room, with τ = total × CAP.
  const SRC2 = 'https://myelectrical.com/notes/entryid/207/iec-60287-current-capacity-of-cables-an-introduction';
  const SRC3 = 'https://webstore.ansi.org/preview-pages/BSI/preview_30131317.pdf';
  const RCU = 0.008;                                         // the example cable: 8 mΩ in each metre
  const R_INS = 0.5, R_AIR = 1.5, R_WRAP = 2, R_FAN = 0.5;   // example thermal resistances, K·m/W
  const CAP = 300;                                           // example heat capacity, J per °C in each metre
  const LIMIT = 70, TMAX = 100, YMAX = 160, ROOM = 30;
  const RATE = 20;                                           // minutes on the clock for each second of a run
  const EPS = 1e-9, FADE = 0.35, ANS = 2.0;
  const lossOf = (I) => RCU * I * I;
  const resOf = (wrap, fan) => R_INS + (wrap ? R_WRAP : 0) + (fan ? R_FAN : R_AIR);
  const tauMin = (R, C) => R * C / 60;
  function rig(o) {
    o = o || {};
    const I = o.I == null ? 50 : o.I, wrap = !!o.wrap, fan = !!o.fan;
    return { I, wrap, fan, L: lossOf(I), R: resOf(wrap, fan), C: o.C || CAP, room: o.room == null ? ROOM : o.room, off: o.off == null ? TMAX : o.off };
  }
  // The current is on until it is switched off (an off time of TMAX means it never is).
  const onAt = (s, t) => !(s.off < TMAX - EPS && t > s.off);
  function tempAt(s, t) {
    const tau = tauMin(s.R, s.C), rise = s.L * s.R;
    const up = (u) => s.room + rise * (1 - Math.exp(-Math.max(0, u) / tau));
    if (onAt(s, t)) return up(t);
    return s.room + (up(s.off) - s.room) * Math.exp(-(t - s.off) / tau);
  }
  const leaving = (s, t) => (tempAt(s, t) - s.room) / s.R;
  const making = (s, t) => (onAt(s, t) ? s.L : 0);
  const settleAt = (s) => s.room + s.L * s.R;
  // The currents that hold 70 °C: with the wrap in a 30 °C room, and without it in a 40 °C room.
  const I_WRAP = +Math.sqrt((LIMIT - ROOM) / resOf(true, false) / RCU).toPrecision(12);
  const I_HOT = +Math.sqrt((LIMIT - 40) / resOf(false, false) / RCU).toPrecision(12);
  const I_38 = 50 * (LIMIT - 40) / 40;                       // the slip: current scaled with the headroom

  const fx = (v, dp) => K.fmt(v, { decimals: dp || 0 });
  const S50 = rig({}), SW = rig({ wrap: true }), SF = rig({ fan: true }), SHOT = rig({ room: 40 });
  // Every number the words and pictures print, worked out from the rule.
  const N = {
    L50: fx(S50.L), R: fx(S50.R), rise: fx(S50.L * S50.R), Ts: fx(settleAt(S50)), dIns: fx(S50.L * R_INS), dAir: fx(S50.L * R_AIR),
    tauS: fx(S50.R * CAP), tau: fx(tauMin(S50.R, CAP)), pct: fx(100 * (1 - Math.exp(-1))), T1: fx(tempAt(S50, tauMin(S50.R, CAP))), five: fx(5 * tauMin(S50.R, CAP)),
    RW: fx(SW.R), riseW: fx(SW.L * SW.R), TW: fx(settleAt(SW)), dWrap: fx(S50.L * R_WRAP), tauW: fx(tauMin(SW.R, CAP)),
    tauC2: fx(tauMin(S50.R, 2 * CAP)), tauC2s: fx(S50.R * 2 * CAP), low: fx(ROOM + S50.L * S50.R / 2),
    allowW: fx((LIMIT - ROOM) / SW.R), facW: fx(Math.sqrt((LIMIT - ROOM) / SW.R / S50.L), 3), IW: fx(I_WRAP),
    head: fx(LIMIT - 40), allowH: fx((LIMIT - 40) / S50.R), facH: fx(Math.sqrt((LIMIT - 40) / S50.R / S50.L), 3), IH: fx(I_HOT), I38: fx(I_38), T50hot: fx(settleAt(SHOT)),
    riseF: fx(SF.L * SF.R), TF: fx(settleAt(SF)), tauF: fx(tauMin(SF.R, CAP)),
    tr: fx(25 + 10 * 3), trRise: fx(10 * 3), tr28: fx(25 + 10 / 3), tr33: fx(10 / 3, 1),
    w067: fx(S50.L / CAP, 3), wMin: fx(S50.L / CAP * 60), w15: fx(CAP / S50.L),
  };
  const ex = (u) => Math.exp(-u);

  // ---------- the lesson: SHOW screens demonstrate, DO screens are puzzles ----------
  // pic 'rails': two rails under a hand. pic 'cable': the cable cut across, the heat made and
  // leaving, and below it (parts 'full') the temperature across the layers and (parts 'run' or
  // 'full') the copper's temperature after switch-on. A live screen (live: which controls show)
  // opens on its own settings (set) and runs its demonstration (mot) once. pic 'time': the trace
  // alone. pic 'skins': a motor and a heat sink. pic 'sink': a transistor on its heat sink.
  const STEPS = [
    { show: true, name: 'Steel and wood', pic: 'rails', dur: 3.6,
      text: 'Heat moves from hotter to colder by itself. A steel rail and a wooden rail sit in a 20 °C room. Both thermometers read 20 °C. A warm hand rests on each. Heat runs out of each hand into its rail. It runs much faster into the steel, because metal passes heat far more easily than wood. So the steel feels colder. Nothing called cold flows into your hand. You feel how fast heat leaves your skin.' },
    { kind: 'pick', name: 'Which is colder?', pic: 'rails',
      opts: ['The steel', 'The wood', 'Neither, both are at 20 °C'], want: 'Neither, both are at 20 °C', redless: ['The steel', 'The wood'],
      task: 'Both rails spent the night in the same 20 °C room. Which one is colder?',
      why: 'A night in one room brings everything to the room\'s temperature. So both rails are at 20 °C. The steel only feels colder. Heat leaves your hand faster into the metal, and that is what your skin feels.',
      hint: 'Not quite. Think about where heat would flow between them overnight.',
      hints: { 'The steel': 'Not quite. The steel only feels colder. Heat leaves your hand faster into it.', 'The wood': 'Not quite. A night in one room brings both rails to the room\'s temperature.' } },
    { show: true, name: 'Heat made in the copper', pic: 'cable', parts: 'made', live: { current: true }, set: {}, dur: 3.6,
      mot: { ctl: 'current', from: 0, to: 50, t0: 0.4, t1: 3.4 },
      text: `Now a loaded cable, cut across. A copper core sits inside a ring of insulation, with the room's air around it. Current through the copper makes heat, its *I²R losses*. This cable has 8 mΩ in each metre. At 50 A that is 0.008 × 50² = ${N.L50} W in each metre. All that heat has to get out, through the insulation and into the air. Set the current and watch the losses change.`,
      read: `Now a loaded cable, cut across. A copper core sits inside a ring of insulation, with the room's air around it. Current through the copper makes heat, its *I²R losses*. This cable has 8 mΩ in each metre. At 50 A that is 0.008 × 50² = ${N.L50} W in each metre. All that heat has to get out, through the insulation and into the air. Half the current makes a quarter of the losses.` },
    { kind: 'pick', name: 'What happens next?', pic: 'cable', parts: 'run', set: {},
      endLab: { text: `levels off at ${N.Ts} °C`, t: 70, dy: 22 },
      opts: ['It keeps warming while the current flows', 'It warms, then levels off', 'It warms until the insulation is full of heat'], want: 'It warms, then levels off',
      redless: ['It warms until the insulation is full of heat'],
      bad: { 'It keeps warming while the current flows': [{ fn: (t) => ROOM + S50.L / CAP * 60 * t, lab: 'keeps on climbing', dx: 8, dy: 14, anchor: 'start' }] },
      task: 'The current switches on at 50 A. The copper starts at the room\'s 30 °C. What does it do next?',
      why: `At first no heat leaves, so all ${N.L50} W warms the copper. As it warms, the gap to the room grows, and more heat flows out. So the warming slows. When the heat leaving matches the ${N.L50} W made, it stops rising. Here that is at ${N.Ts} °C.`,
      hint: 'Not quite. Watch what happens to the heat leaving as the copper warms.',
      hints: { 'It keeps warming while the current flows': 'Not quite. The hotter the copper gets, the faster heat leaves it.', 'It warms until the insulation is full of heat': 'Not quite. Insulation does not fill up. Heat flows on through it into the air.' } },
    { show: true, name: 'Switch on', pic: 'cable', parts: 'full', live: { clock: true, sw: true }, set: {}, dur: 3.8,
      mot: { ctl: 'clock', from: 0, to: 60, t0: 0.4, t1: 3.6 },
      text: `The current switches on at 50 A. The copper warms until the heat leaving matches the losses. Heat *conducts* through the copper and its insulation. From the surface, the air carries it off by *convection*. *Radiation* carries some as infrared, which needs no air. Each layer has a *thermal resistance*: its degrees of rise for each watt leaving each metre. Insulation 0.5 and still air 1.5 make ${N.R} K·m/W. So the copper rises ${N.L50} × ${N.R} = ${N.rise} °C, to ${N.Ts} °C. Switch it off to watch it cool.`,
      read: `The current switches on at 50 A. The copper warms until the heat leaving matches the losses. Heat *conducts* through the copper and its insulation. From the surface, the air carries it off by *convection*. *Radiation* carries some as infrared, which needs no air. Each layer has a *thermal resistance*: its degrees of rise for each watt leaving each metre. Insulation 0.5 and still air 1.5 make ${N.R} K·m/W. So the copper rises ${N.L50} × ${N.R} = ${N.rise} °C, to ${N.Ts} °C. The insulation takes ${N.dIns} °C of that drop, and the air ${N.dAir} °C. Once the current is off, the copper cools back to the room along the same kind of curve.` },
    { kind: 'pick', name: 'With the extra wrap', pic: 'cable', parts: 'run', set: { wrap: true }, ref: {}, refLab: 'without the wrap',
      endLab: { text: `heads for ${N.TW} °C`, t: 62, dy: -12 },
      opts: [`${N.TW} °C`, `${N.Ts} °C, but later`, `${N.riseW} °C`], want: `${N.TW} °C`,
      bad: {
        [`${N.Ts} °C, but later`]: [{ fn: (t) => tempAt(rig({ C: 2 * CAP }), t), lab: `${N.Ts} °C, but later`, at: [70, tempAt(rig({ C: 2 * CAP }), 70)], dy: 22 }],
        [`${N.riseW} °C`]: [{ fn: (t) => ROOM + (SW.L * SW.R - ROOM) * (1 - ex(t / tauMin(SW.R, CAP))), lab: `${N.riseW} °C`, at: [70, ROOM + (SW.L * SW.R - ROOM) * (1 - ex(70 / tauMin(SW.R, CAP)))], dy: -12 }],
      },
      task: `Now add the extra wrap. Its thermal resistance is 2 K·m/W. It is still 50 A in a 30 °C room. Where does the copper settle?`,
      why: `The way out is now 0.5 + 2 + 1.5 = ${N.RW} K·m/W. So the rise is ${N.L50} × ${N.RW} = ${N.riseW} °C. Add the room's 30 °C, and the copper settles at ${N.TW} °C. That is well over the 70 °C limit. The wrap alone takes ${N.dWrap} °C of the drop.`,
      hint: 'Not quite. Add up the thermal resistances, then multiply by the losses.',
      hints: { [`${N.Ts} °C, but later`]: 'Not quite. The wrap does slow the warming. It also raises where the copper settles.', [`${N.riseW} °C`]: `Not quite. ${N.riseW} °C is the rise. Add the room's 30 °C.` } },
    { show: true, name: 'How long it takes', pic: 'time', mode: 'tau', dur: 3.6,
      text: `It climbs like a capacitor charging through a resistor. Each metre of this cable needs 300 J to warm by 1 °C. That is its *heat capacity*, its mc. Thermal resistance × heat capacity gives the *time constant*, τ, just as RC does. Here that is 2 × 300 = ${N.tauS} s, or ${N.tau} minutes. After one τ the copper has made ${N.pct}% of its rise, so it is near ${N.T1} °C. By about five, ${N.five} minutes, it has all but settled.` },
    { kind: 'pick', name: 'Twice the heat capacity', pic: 'time', mode: 'cap',
      opts: [`It settles at ${N.Ts} °C, taking twice as long`, `It settles lower, at about ${N.low} °C`, `It settles at ${N.Ts} °C in the same time`], want: `It settles at ${N.Ts} °C, taking twice as long`,
      bad: {
        [`It settles lower, at about ${N.low} °C`]: [{ fn: (t) => ROOM + S50.L * S50.R / 2 * (1 - ex(t / tauMin(S50.R, 2 * CAP))), lab: `settles at ${N.low} °C`, at: [70, ROOM + S50.L * S50.R / 2 * (1 - ex(70 / tauMin(S50.R, 2 * CAP)))], dy: 20 }],
        [`It settles at ${N.Ts} °C in the same time`]: [{ fn: (t) => tempAt(S50, t), lab: 'the same time', at: [12, tempAt(S50, 12)], dy: -12 }],
      },
      task: 'Another cable needs 600 J to warm each metre by 1 °C. Its losses and thermal resistances are the same. What happens after switch-on?',
      why: `The rise is still ${N.L50} × ${N.R} = ${N.rise} °C, so it settles at ${N.Ts} °C. Heat capacity only sets the time. τ is now 2 × 600 = ${N.tauC2s} s, or ${N.tauC2} minutes, twice as long.`,
      hint: 'Not quite. Ask what sets where it settles, and what sets how long.',
      hints: { [`It settles lower, at about ${N.low} °C`]: 'Not quite. Where it settles depends only on the losses and the way out.', [`It settles at ${N.Ts} °C in the same time`]: 'Not quite. More heat capacity takes more energy to warm, so it takes longer.' } },
    { show: true, name: 'Carrying less', pic: 'cable', parts: 'full', live: { current: true, room: true, wrap: true, fan: true, clock: true }, settle: true,
      set: { I: I_WRAP, wrap: true }, dur: 3.8, mot: { ctl: 'clock', from: 0, to: TMAX, t0: 0.4, t1: 3.6 },
      text: `To keep to 70 °C, carry less current. With the extra wrap, each watt lifts the copper twice as far, so the losses must halve. Losses go with current squared, so the current falls to ${N.facW} × 50 A, about ${N.IW} A. That is the reason behind Ci. A fan works the other way. At 50 A it holds the copper at ${N.TF} °C. Try the fan, or warm the room.`,
      read: `To keep to 70 °C, carry less current. With the extra wrap, each watt lifts the copper twice as far, so the losses must halve. Losses go with current squared, so the current falls to ${N.facW} × 50 A, about ${N.IW} A. That is the reason behind Ci. A fan works the other way. At 50 A it holds the copper at ${N.TF} °C. A fan lowers the air's thermal resistance, so the copper settles cooler. Each degree warmer in the room makes the copper a degree hotter.` },
    { kind: 'pick', name: 'A hot room', pic: 'time', mode: 'hot',
      opts: [`About ${N.IH} A`, `About ${N.I38} A`, '50 A'], want: `About ${N.IH} A`,
      bad: {
        [`About ${N.I38} A`]: [{ fn: (t) => tempAt(rig({ I: I_38, room: 40 }), t), lab: `${N.I38} A`, at: [30, tempAt(rig({ I: I_38, room: 40 }), 30)], dy: 20 }],
        '50 A': [{ fn: (t) => tempAt(SHOT, t), lab: '50 A', at: [30, tempAt(SHOT, 30)], dy: -12 }],
      },
      task: `No wrap now, and the room is at 40 °C. 50 A makes ${N.L50} W in each metre. What is the most current that keeps the copper at 70 °C?`,
      why: `The headroom is 70 − 40 = ${N.head} °C. That allows ${N.head} ÷ 2 = ${N.allowH} W in each metre. Losses go with current squared, so the current is 50 × √(${N.allowH} ÷ ${N.L50}). That is 50 × ${N.facH}, about ${N.IH} A. The factor is also √(${N.head} ÷ ${N.rise}), the new headroom over the old. It depends only on the temperatures. So it holds for any cable rated in a 30 °C room with a 70 °C limit. That is where Ca comes from.`,
      hint: 'Not quite. Find the headroom first, then the losses it allows.',
      hints: { [`About ${N.I38} A`]: 'Not quite. Losses go with current squared, so the current scales by a square root.', '50 A': `Not quite. In a 40 °C room, 50 A takes the copper to ${N.T50hot} °C.` } },
    { show: true, name: 'A motor and a heat sink', pic: 'skins', dur: 3.9,
      text: 'The same sum works for any part that makes heat. A motor\'s winding makes it. It leaves through the insulation, the iron and the frame into the air. A fan on the shaft eases that last step. A motor\'s time constant is from half an hour to five hours. Stopped, its fan stops too. The way out gets harder, so it cools more slowly. A protection relay runs this same curve to judge the winding\'s heat. A transistor\'s heat leaves through its case and a finned heat sink.' },
    { kind: 'pick', name: 'A transistor', pic: 'sink',
      opts: [`${N.tr} °C`, `${N.trRise} °C`, `About ${N.tr28} °C`], want: `${N.tr} °C`,
      ring: { [`${N.trRise} °C`]: [0, 30, 'room left out'], [`About ${N.tr28} °C`]: [25, 25 + 10 / 3, `10 ÷ 3 = ${N.tr33} °C`] },
      task: 'A transistor\'s losses are 10 W. Its way out to the air through a heat sink is 3 °C per W. That is for the whole part, not each metre. The room is at 25 °C. How hot does it run?',
      why: `The rise is losses × thermal resistance: 10 × 3 = ${N.trRise} °C. Add the room's 25 °C. So it runs at ${N.tr} °C.`,
      hint: 'Not quite. Multiply the losses by the thermal resistance, then add the room.',
      hints: { [`${N.trRise} °C`]: `Not quite. ${N.trRise} °C is the rise. Add the room's 25 °C.`, [`About ${N.tr28} °C`]: 'Not quite. Multiply the losses by the thermal resistance. Do not divide.' } },
    { kind: 'pick', name: 'Just after switch-on', pic: 'time', mode: 'slope',
      opts: [`About ${N.wMin} °C a minute`, `About ${N.w15} °C a second`, 'The full 40 °C at once'], want: `About ${N.wMin} °C a minute`,
      bad: {
        [`About ${N.w15} °C a second`]: [{ pts: [[0, ROOM], [(YMAX - ROOM) / (CAP / S50.L * 60), YMAX]], lab: `${N.w15} °C a second`, dx: 10, dy: 16, anchor: 'start' }],
        'The full 40 °C at once': [{ pts: [[0, ROOM], [0, settleAt(S50)], [8, settleAt(S50)]], lab: 'all at once', dx: 8, dy: 18, anchor: 'start' }],
      },
      task: `A cable's losses are ${N.L50} W in each metre. Each metre needs 300 J to warm by 1 °C. How fast does it warm just after switch-on?`,
      why: `At switch-on no heat leaves yet, so all ${N.L50} W goes into warming. Each °C takes 300 J. So it warms ${N.L50} ÷ 300 = ${N.w067} °C each second. That is about ${N.wMin} °C a minute.`,
      hint: 'Not quite. Divide the watts by the joules for each °C.',
      hints: { [`About ${N.w15} °C a second`]: `Not quite. Divide the watts by the joules for each °C: ${N.L50} ÷ 300.`, 'The full 40 °C at once': `Not quite. Warming takes energy, and the energy arrives at ${N.L50} W.` } },
  ];
  const FINISH = 'A loaded cable warms until the heat leaving matches the losses. Its steady rise is losses × the thermal resistance of the way out. Its heat capacity sets only how long it takes to get there.';
  const PICK = 'Pick an answer first.';
  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const testing = () => document.documentElement.classList.contains('k-testing');

  // ---------- each step's state ----------
  function blank() { return { pick: null, res: null, why: false }; }
  let S = STEPS.map(() => blank());
  let finished = false, lastStep = -1, lastDone = false, T = Infinity, motionEnd = 0, MOT = null, keyNow = '';
  const el = (id) => document.getElementById(id);

  // ---------- words with amber key terms (built with K.el, never innerHTML) ----------
  function write(node, s) {
    node.textContent = '';
    s = String(s || '');
    const re = /\*([^*]+)\*/g;
    let pos = 0, m;
    while ((m = re.exec(s))) {
      if (m.index > pos) node.appendChild(document.createTextNode(s.slice(pos, m.index)));
      node.appendChild(K.el('span', { class: 'term' }, m[1]));
      pos = m.index + m[0].length;
    }
    if (pos < s.length) node.appendChild(document.createTextNode(s.slice(pos)));
    return node;
  }

  // ---------- controls ----------
  const stepper = K.stepper({ id: 'step', label: 'Screen', steps: STEPS.map((d) => d.name), value: 0, compact: true, into: '#prog' });
  const at = () => K.clamp(Math.round(stepper.get()) || 0, 0, STEPS.length - 1);
  const curCtl = K.control({ id: 'current', label: 'Current', min: 0, max: 60, step: 1, value: 50, unit: 'A', snap: [I_WRAP, I_HOT], fmt: (v) => fx(v) + ' A', into: '#ctl' });
  const roomCtl = K.control({ id: 'room', label: 'Room', min: 10, max: 40, step: 1, value: ROOM, unit: '°C', into: '#ctl' });
  const wrapCtl = K.toggle({ id: 'wrap', label: 'Extra wrap', value: false, into: '#ctl' });
  const fanCtl = K.toggle({ id: 'fan', label: 'Fan', value: false, into: '#ctl' });
  // The clock and the moment the current goes off: Switch on and Switch off move them.
  const clockCtl = K.control({ id: 'clock', label: 'Minutes after switch-on', min: 0, max: TMAX, step: 0.01, value: TMAX, unit: 'min', into: '#hold' });
  const offCtl = K.control({ id: 'off', label: 'Switched off at', min: 0, max: TMAX, step: 0.01, value: TMAX, unit: 'min', into: '#hold' });
  const ctlKey = (p) => [p.current, p.room, p.wrap, p.fan].join('|');
  function setCtl(id, v) { ({ clock: clockCtl, off: offCtl, current: curCtl })[id].set(v, true); }

  // A screen's settings: its own unless its control shows.
  function cfgOf(i, p) {
    const d = STEPS[i], L = d.live || {}, b = d.set || {};
    const s = rig({
      I: L.current ? K.clamp(+p.current || 0, 0, 60) : (b.I == null ? 50 : b.I),
      room: L.room ? K.clamp(isFinite(+p.room) ? +p.room : ROOM, 10, 40) : (b.room == null ? ROOM : b.room),
      wrap: L.wrap ? !!p.wrap : !!b.wrap, fan: L.fan ? !!p.fan : !!b.fan, C: b.C || CAP,
      off: L.clock && isFinite(+p.off) ? K.clamp(+p.off, 0, TMAX) : TMAX,
    });
    s.t = L.clock ? K.clamp(isFinite(+p.clock) ? +p.clock : TMAX, 0, TMAX) : (b.t == null ? TMAX : b.t);
    return s;
  }
  K.model((p) => {
    const i = K.clamp(Math.round(+p.step) || 0, 0, STEPS.length - 1), g = cfgOf(i, p);
    return { losses: making(g, g.t), copperTemp: tempAt(g, g.t), tau: tauMin(g.R, g.C) };
  });

  // Switch on runs the clock from 0 to the screen's end; Switch off stops the losses and runs on to 100 min.
  function swMode(p) {
    const c = isFinite(+p.clock) ? +p.clock : TMAX, off = isFinite(+p.off) ? +p.off : TMAX;
    if (off < TMAX - EPS || c >= TMAX - EPS) return 'again';
    if (c <= EPS && !(anim.playing() && MOT)) return 'on';
    return 'off';
  }
  const swBtn = K.button({ label: 'Switch on', into: '#ctl', press: () => {
    const d = STEPS[at()];
    if (finished || !d.live || !d.live.sw) return;
    const p = K.params(), mode = swMode(p);
    if (mode === 'off') {
      const c = K.clamp(+p.clock || 0, 0, TMAX);
      setCtl('off', c);
      startMot({ ctl: 'clock', from: c, to: TMAX, t0: 0, t1: Math.max(0.2, (TMAX - c) / RATE) });
    } else {
      setCtl('off', TMAX); setCtl('clock', 0);
      startMot({ ctl: 'clock', from: 0, to: d.mot.to, t0: 0, t1: d.mot.to / RATE });
    }
  } });

  // Up to three answer buttons; each step fills in its own options.
  const pickBtns = [0, 1, 2].map((k) => K.button({ label: 'Answer ' + (k + 1), secondary: true, into: '#picks', press: () => {
    const i = at(), d = STEPS[i], st = S[i];
    if (finished || d.show || k >= d.opts.length || st.res === 'right') return;
    const was = st.res === 'wrong';
    st.pick = d.opts[k]; st.res = null;
    if (was) { anim.pause(); T = Infinity; }
  } }));
  const checkBtn = K.button({ label: 'Check', into: '#acts', press: () => {
    const i = at(), d = STEPS[i], st = S[i];
    if (d.show || finished || st.res === 'right') return;
    if (st.pick == null) { st.res = 'empty'; return; }
    st.res = st.pick === d.want ? 'right' : 'wrong';
    play(ANS);
  } });
  const whyBtn = K.button({ label: 'Why?', secondary: true, into: '#acts', press: () => {
    if (STEPS[at()].show || finished) return;
    const st = S[at()]; st.why = !st.why;
  } });
  const replayBtn = K.button({ label: 'Play again', secondary: true, into: '#replay', press: () => {
    const d = STEPS[at()];
    if (!d.show || d.live || finished) return;
    play(d.dur);
  } });
  const backBtn = K.button({ label: 'Back', secondary: true, into: '#nav', press: () => {
    if (finished) { finished = false; return; }
    stepper.set(Math.max(0, at() - 1), true);
  } });
  const nextBtn = K.button({ label: 'Continue', into: '#nav', press: () => {
    const i = at();
    if (finished || (!STEPS[i].show && S[i].res !== 'right')) return;
    if (i < STEPS.length - 1) { stepper.set(i + 1, true); return; }
    finished = true; anim.pause(); T = Infinity; MOT = null;
    if (typeof K.complete === 'function') K.complete();
  } });
  K.button({ label: 'Start again', secondary: true, into: '#again', press: () => {
    S = STEPS.map(() => blank()); finished = false; lastStep = -1; stepper.set(0, true);
  } });

  // One animation plays each demonstration, each run of the clock and the motion after an answer;
  // with reduced motion (and while the self-test looks) everything opens finished.
  function stepMot() {
    const m = MOT;
    if (!m) return;
    const a = T === Infinity ? 1 : K.clamp((T - m.t0) / Math.max(1e-6, m.t1 - m.t0), 0, 1);
    setCtl(m.ctl, K.lerp(m.from, m.to, a));
    if (m.ctl === 'current') keyNow = ctlKey(K.params());
    if (a >= 1) MOT = null;
  }
  function finishMot() { if (MOT) { T = Infinity; stepMot(); MOT = null; } }
  const anim = K.anim({ button: false, label: 'Demonstration', step: (dt) => {
    if (finished) return false;
    T += dt;
    if (MOT) { stepMot(); K.refresh(); } else if (STEPS[at()].live) K.refresh(); else paint();
    return T < motionEnd || !!MOT;
  } });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !anim.playing() && T !== Infinity) { T = Infinity; finishMot(); K.refresh(); } });
  function play(dur) {
    if (REDUCE || testing()) { anim.pause(); finishMot(); T = Infinity; return; }
    motionEnd = dur; T = 0; anim.play();
  }
  function startMot(m) { MOT = m; play(Math.max(m.t1, 0.1)); }
  function enter(id) {
    if (REDUCE) return;
    const box = el(id);
    box.classList.remove('enter');
    void box.offsetWidth;
    box.classList.add('enter');
  }
  // A new screen: a live one takes its own settings and runs its demonstration once.
  function onEnter(i) {
    const d = STEPS[i];
    MOT = null;
    if (d.live) {
      const b = d.set || {};
      curCtl.set(b.I == null ? 50 : b.I, true); roomCtl.set(b.room == null ? ROOM : b.room, true);
      wrapCtl.set(!!b.wrap, true); fanCtl.set(!!b.fan, true);
      offCtl.set(TMAX, true); clockCtl.set(TMAX, true);
      if (d.mot) { MOT = Object.assign({}, d.mot); setCtl(MOT.ctl, MOT.from); }
    }
    if (d.show) play(d.dur); else { anim.pause(); T = Infinity; }
  }

  // ---------- drawing ----------
  const svg = el('scene'), art = el('art');
  let into = null, REC = null, LABS = [], AVOID = [], HH = 340;
  const add = (n) => (into || art).appendChild(n);
  const r2 = (v) => Math.round(v * 100) / 100;
  const sv = (tag, a) => add(K.svg(tag, a));
  const path = (d, cls) => sv('path', { class: cls, d });
  function text(x, y, s, cls, anchor) {
    s = String(s);
    if (REC) REC.texts.push(s);
    return add(K.svg('text', { class: cls, x: r2(x), y: r2(y), 'text-anchor': anchor || 'middle' }, s));
  }
  // A label placed by K.labels, clear of the other words and of the lines in AVOID.
  function lab(x, y, s, cls, anchor, a) {
    if (a != null && a <= 0) return;
    LABS.push({ x: r2(x), y: r2(y), text: String(s), class: cls, anchor: anchor || 'middle', a: a == null ? 1 : a });
    if (REC) REC.texts.push(String(s));
  }
  function placeLabels() {
    if (!LABS.length) return;
    const g = art.appendChild(K.svg('g'));
    const ts = K.labels(g, LABS.map((l) => ({ x: l.x, y: l.y, text: l.text, class: l.class, anchor: l.anchor })), { avoid: AVOID });
    (ts || []).forEach((t, k) => { if (LABS[k] && LABS[k].a < 1) K.fade(t, LABS[k].a, 0); });
  }
  // How far a part due at t0 has arrived, noting the timetable for the timing check.
  let latest = 0, earliest = Infinity;
  function note(t0, d) { if (t0 + d > latest) latest = t0 + d; if (t0 < earliest) earliest = t0; }
  function arr(t0, d) { d = d == null ? K.SOFT : d; note(t0, d); return K.arrive(T, t0, d); }
  function lin(t0, d) { note(t0, d); return T === Infinity ? 1 : K.clamp((T - t0) / d, 0, 1); }
  function part(a, rise, draw) {
    if (a <= 0) return;
    const g = add(K.svg('g'));
    K.fade(g, a, rise);
    const keep = into; into = g; draw(); into = keep;
  }
  function brk(x1, x2, y, cls, up) {
    const e = up ? y - 5 : y + 5;
    path('M' + r2(x1) + ' ' + e + ' V' + y + ' H' + r2(x2) + ' V' + e, 'brk' + (cls ? ' ' + cls : ''));
  }
  function brkV(x, y1, y2, cls) { path(`M${r2(x + 5)} ${r2(y1)} H${r2(x)} V${r2(y2)} H${r2(x + 5)}`, 'brk' + (cls ? ' ' + cls : '')); }
  // A heat arrow from (x1, y1) to its tip at (x2, y2).
  function heatArrow(x1, y1, x2, y2) {
    const L = Math.hypot(x2 - x1, y2 - y1);
    if (L < 10) return;
    const c = (x2 - x1) / L, s = (y2 - y1) / L, bx = x2 - c * 9, by = y2 - s * 9;
    sv('line', { class: 'heat', x1: r2(x1), y1: r2(y1), x2: r2(x2 - c * 7), y2: r2(y2 - s * 7) });
    path(`M${r2(x2)} ${r2(y2)} L${r2(bx - s * 4.5)} ${r2(by + c * 4.5)} L${r2(bx + s * 4.5)} ${r2(by - c * 4.5)} Z`, 'heatf');
  }

  // ---------- the rails ----------
  function paintRails(d, st) {
    const show = !!d.show, right = st.res === 'right';
    HH = 192;
    part(show ? arr(0.4) : 1, 0, () => text(8, 16, 'Both in a 20 °C room', 'lab t', 'start'));
    const rows = [{ name: 'steel rail', cls: 'steel', n: 3, words: 'heat leaves fast' }, { name: 'wooden rail', cls: 'wood', n: 1, words: 'heat leaves slowly' }];
    REC.rails = [];
    rows.forEach((r, k) => {
      const y0 = 30 + 84 * k, known = show || right;
      part(1, 0, () => {
        sv('rect', { class: r.cls, x: 14, y: y0 + 44, width: 266, height: 20, rx: 3 });
        text(24, y0 + 58.5, r.name, 'lab', 'start');
        sv('rect', { class: 'tube', x: 307, y: y0 + 2, width: 10, height: 60, rx: 5 });
        sv('circle', { class: 'col', cx: 312, cy: y0 + 66, r: 8 });
      });
      // The thermometer's column: 0 to 40 °C up the tube, so 20 °C is halfway.
      const rise = show ? 1 : right ? arr(0.1 + 0.2 * k, 1.0) : 0;
      if (rise > 0) sv('rect', { class: 'col', x: 309.5, y: r2(y0 + 62 - 28 * rise), width: 5, height: r2(28 * rise + 2) });
      const read = known ? '20 °C' : '?';
      part(show ? arr(0.9 + 0.3 * k) : right ? arr(0.6 + 0.2 * k) : 1, 0, () => text(298, y0 + 22, read, 'rd', 'end'));
      let n = 0;
      if (show) {
        part(arr(1.2 + 0.3 * k), 4, () => {
          sv('rect', { class: 'hand', x: 96, y: y0 + 2, width: 60, height: 20, rx: 10 });
          text(126, y0 + 16.5, 'hand', 'lab');
        });
        const g = arr(1.9 + 0.4 * k, 0.9);
        if (g > 0) part(g, 0, () => {
          for (let j = 0; j < r.n; j++) { const x = 126 + (j - (r.n - 1) / 2) * 18; heatArrow(x, y0 + 24, x, y0 + 26 + 17 * g); }
        });
        n = g > 0 ? r.n : 0;
        part(arr(2.7 + 0.3 * k), 0, () => text(170, y0 + 37, r.words, 'lab', 'start'));
      }
      REC.rails.push({ arrows: n, reads: read });
    });
    return 'A steel rail and a wooden rail in a 20 °C room, each with a thermometer' + (show ? ' reading 20 °C. A hand rests on each. Three heat arrows run from the hand into the steel, and one into the wood.' : right ? ' reading 20 °C.' : ' that reads a question mark.');
  }

  // ---------- the cable cut across ----------
  const SCX = 72, SCY = 76, PX_CU = 18, PX_INS = 30, PX_WRAP = 42;
  const SLOTS = [0, 8, 4, 12, 2, 10, 6, 14, 1, 9, 5, 13, 3, 11, 7, 15];
  // One ink arrow for each 2 W leaving each metre, fading in as the heat leaving grows.
  function drawSection(s, q) {
    const rs = s.wrap ? PX_WRAP : PX_INS;
    if (s.wrap) sv('circle', { class: 'wrapf', cx: SCX, cy: SCY, r: PX_WRAP });
    sv('circle', { class: 'insf', cx: SCX, cy: SCY, r: PX_INS });
    sv('circle', { class: 'cuf', cx: SCX, cy: SCY, r: PX_CU });
    const n0 = Math.max(0, q) / 2, n = T === Infinity ? Math.round(n0) : n0;
    for (let k = 0; k < SLOTS.length && k < n; k++) {
      const a = Math.min(1, n - k);
      if (a < 0.02) break;
      const th = (SLOTS[k] + 0.5) * Math.PI / 8, c = Math.cos(th), sn = Math.sin(th), ra = PX_CU + 2, rb = rs + 22;
      part(a, 0, () => heatArrow(SCX + c * ra, SCY + sn * ra, SCX + c * rb, SCY + sn * rb));
    }
    text(SCX, 158, s.fan ? 'air, fan on' : 'still air', 'lab m');
    REC.arrows = n;
  }
  // The heat made and the heat leaving each metre, on one scale, and the key to the rings.
  function drawFlow(s, made, out, both) {
    const X = 156, W = 126, f = W / 30;
    const bar = (y, v, cls, name) => {
      text(X, y - 6, name, 'lab', 'start');
      sv('rect', { class: 'track', x: X, y, width: W, height: 16, rx: 4 });
      if (v * f > 0.3) sv('rect', { class: cls, x: X, y, width: r2(Math.max(1.5, v * f)), height: 16, rx: 3 });
      text(X + W + 6, y + 12.5, `${fx(v)} W/m`, 'lab', 'start');
    };
    bar(20, made, 'madef', 'heat made in the copper');
    REC.made = made; REC.out = out;
    if (both) {
      bar(60, out, 'outf', 'heat leaving to the room');
      text(X, 98, status(made, out), 'lab n', 'start');
    }
    const keys = [['cuf', 'copper'], ['insf', 'insulation']].concat(s.wrap ? [['wrapf', 'extra wrap']] : []);
    keys.forEach((kk, j) => { const y = 112 + 18 * j; sv('rect', { class: kk[0], x: X, y, width: 14, height: 14, rx: 2 }); text(X + 20, y + 12, kk[1], 'lab m', 'start'); });
  }
  const rising = (made, out) => made > EPS && out < made - 0.5;
  function status(made, out) {
    if (made <= EPS) return out < 0.05 ? 'no heat in or out' : 'out only: cooling';
    return rising(made, out) ? 'in > out: warming' : 'out = in: steady';
  }
  // The temperature across the layers, from the copper out to the room.
  function drawProfile(s, Tc, y0) {
    text(8, y0 + 14, 'Temperature across the layers', 'lab t', 'start');
    const XA = 60, XC = 104, XE = 334, yb = y0 + 82, top = y0 + 28;
    const span = Math.max(40, Math.ceil(s.L * s.R / 40 - 1e-9) * 40), k = (yb - top) / span;
    const py = (T) => yb - K.clamp(T - s.room, 0, span) * k;
    const q = (Tc - s.room) / s.R;
    const layers = [{ name: 'insulation', R: R_INS, cls: 'insf' }].concat(s.wrap ? [{ name: 'wrap', R: R_WRAP, cls: 'wrapf' }] : [],
      [{ name: s.fan ? 'air, fan on' : 'air', R: s.fan ? R_FAN : R_AIR, cls: 'airf' }]);
    const bw = (XE - XC) / layers.length;
    sv('rect', { class: 'cuf', x: XA, y: yb + 4, width: XC - XA, height: 8 });
    text((XA + XC) / 2, yb + 27, 'copper', 'lab m');
    let T = Tc;
    const pts = [[XA, py(T)], [XC, py(T)]], drops = [];
    layers.forEach((Ly, j) => {
      const x0 = XC + bw * j, dT = q * Ly.R, ya = py(T);
      sv('rect', { class: Ly.cls, x: r2(x0), y: yb + 4, width: r2(bw), height: 8 });
      text(x0 + bw / 2, yb + 27, Ly.name, 'lab m');
      T -= dT;
      pts.push([x0 + bw, py(T)]);
      drops.push(dT);
      if (dT >= 0.5) lab(x0 + bw / 2 + 4, (ya + py(T)) / 2 - 6, `${fx(dT)} °C`, 'lab', 'start');
    });
    AVOID.push(path(pts.map((p, j) => (j ? 'L' : 'M') + r2(p[0]) + ' ' + r2(p[1])).join(' '), 'prof'));
    lab(XE, yb - 8, `room ${fx(s.room)} °C`, 'lab m', 'end');
    REC.prof = { Tc, drops, end: T, surface: Tc - q * (R_INS + (s.wrap ? R_WRAP : 0)) };
  }

  // ---------- the time trace: 0 to 100 minutes along, 0 to 160 °C up ----------
  const GX0 = 48, GX1 = 322, PH = 112;
  let GYT = 0, GYB = 0;
  const gx = (t) => GX0 + K.clamp(t, 0, TMAX) / TMAX * (GX1 - GX0);
  const gy = (Tv) => GYB - K.clamp(Tv, 0, YMAX) / YMAX * (GYB - GYT);
  const pd = (pts) => pts.map((q, k) => (k ? 'L' : 'M') + r2(gx(q[0])) + ' ' + r2(gy(q[1]))).join(' ');
  // rows: brackets along the time axis ({t, text, cls, a}); returns the bottom of the block.
  function traceFrame(y0, rows, nRows) {
    GYT = y0 + 22; GYB = GYT + PH;
    AVOID.push(path(`M${GX0} ${GYT} V${GYB} H${GX1}`, 'ax'));   // labels keep clear of the axes
    [0, 40, 80, 120, 160].forEach((v) => { sv('line', { class: 'tk', x1: GX0 - 4, y1: r2(gy(v)), x2: GX0, y2: r2(gy(v)) }); text(GX0 - 8, gy(v) + 4.5, fx(v), 'tl', 'end'); });
    text(GX0 - 8, GYT - 11, '°C', 'tl', 'end');
    [0, 20, 40, 60, 80, 100].forEach((t) => { const x = r2(gx(t)); sv('line', { class: 'tk', x1: x, y1: GYB, x2: x, y2: GYB + 4 }); text(x, GYB + 17, fx(t), 'tl'); });
    AVOID.push(sv('line', { class: 'lim', x1: GX0, y1: r2(gy(LIMIT)), x2: GX1, y2: r2(gy(LIMIT)) }));
    lab(GX1 - 2, gy(LIMIT) - 6, `${LIMIT} °C limit`, 'lab m', 'end');
    rows = rows || [];
    REC.rows = [];
    rows.forEach((r, k) => {
      if (!r) return;
      const y = GYB + 26 + 15 * k, a = r.a == null ? 1 : r.a;
      part(a, 0, () => { brk(gx(0), gx(r.t), y, r.cls, true); text(gx(r.t) + 6, y + 4.5, r.text, 'lab' + (r.cls ? ' ' + r.cls : ''), 'start'); });
      if (a > 0) REC.rows.push(r.t);
    });
    const ty = GYB + 36 + 15 * Math.max(nRows == null ? rows.length : nRows, 0);
    text((GX0 + GX1) / 2, ty, 'minutes after switch-on', 'tl');
    return ty + 8;
  }
  // Points along a run, stopping where it leaves the top of the axis.
  function tracePts(fn, t1) {
    const pts = [], n = Math.max(2, Math.ceil(t1 / 0.5));
    for (let k = 0; k <= n; k++) {
      const t = t1 * k / n, v = fn(t);
      if (v > YMAX) {
        if (pts.length) { const q = pts[pts.length - 1], f = (YMAX - q[1]) / (v - q[1]); pts.push([q[0] + (t - q[0]) * f, YMAX]); } else pts.push([t, YMAX]);
        break;
      }
      pts.push([t, v]);
    }
    return pts;
  }
  // A run of the copper's temperature to time t1; its part above the 70 °C limit is drawn red.
  function curve(fn, t1, cls, warnOver) {
    if (t1 <= EPS) return null;
    const pts = tracePts(fn, t1), e = path(pd(pts), cls);
    AVOID.push(e);
    if (REC) REC.curves.push({ cls, end: pts[pts.length - 1] });
    if (!warnOver) return e;
    const segs = [];
    let cur = null;
    for (let k = 0; k < pts.length; k++) {
      const q = pts[k], above = q[1] > LIMIT + 1e-9;
      if (k > 0) {
        const p = pts[k - 1], pa = p[1] > LIMIT + 1e-9;
        if (above !== pa) {
          const f = (LIMIT - p[1]) / (q[1] - p[1]), x = [p[0] + (q[0] - p[0]) * f, LIMIT];
          if (above) cur = [x]; else if (cur) { cur.push(x); segs.push(cur); cur = null; }
        }
      } else if (above) cur = [];
      if (above && cur) cur.push(q);
    }
    if (cur && cur.length > 1) segs.push(cur);
    segs.forEach((sg) => { if (sg.length > 1) { AVOID.push(path(pd(sg), 'over')); REC.over = true; } });
    return e;
  }
  // A wrong answer, drawn as a red dashed run with its own label.
  function drawBad(list, a) {
    if (a <= 0) return;
    list.forEach((b) => {
      REC.bad++;
      const pts = b.pts || tracePts(b.fn, b.t1 || TMAX);
      part(a, 0, () => AVOID.push(path(pd(pts), 'bad')));
      const end = b.at || pts[pts.length - 1];
      lab(gx(end[0]) + (b.dx || 0), gy(end[1]) + (b.dy || -10), b.lab, 'lab w', b.anchor || 'middle', a);
    });
  }
  function dotAt(t, v) { AVOID.push(sv('circle', { class: 'dot', cx: r2(gx(t)), cy: r2(gy(v)), r: 6 })); REC.dot = [t, v]; }

  // The cable screens: the section and its heat flows, then the profile and the trace below.
  function paintCable(i, d, st, p) {
    const live = !!d.live, right = st.res === 'right', wrong = st.res === 'wrong' && st.pick != null;
    const s = cfgOf(i, p);
    const t = live ? s.t : right ? TMAX * lin(0.1, 1.3) : 0;
    const steadyView = d.parts === 'made';
    const made = steadyView ? s.L : making(s, t), out = steadyView ? s.L : leaving(s, t), Tc = tempAt(s, t);
    drawSection(s, out);
    drawFlow(s, made, out, !steadyView);
    const ring = `A cable cut across: a copper core, its insulation${s.wrap ? ', an extra wrap' : ''} and the room's air${s.fan ? ', moved by a fan' : ''}. `;
    if (steadyView) { HH = 164; return ring + `${fx(s.I)} A makes ${fx(s.L)} W of heat in each metre, and as much leaves through the layers.`; }
    let y = 164;
    if (d.parts === 'full') { drawProfile(s, Tc, y); y += 112; }
    const tau = tauMin(s.R, s.C);
    HH = traceFrame(y, live ? [{ t: tau, text: `τ = ${fx(tau)} min`, cls: 'n' }] : [], live ? 1 : 0);
    if (d.ref) { const rf = rig(d.ref); curve((u) => tempAt(rf, u), TMAX, 'ref', false); lab(gx(30), gy(tempAt(rf, 30)) + 20, d.refLab, 'lab m'); }
    if (live || right) curve((u) => tempAt(s, u), t, 'curve', true);
    if (live && !onAt(s, t)) {
      const x = r2(gx(s.off)), top = gy(tempAt(s, s.off));
      AVOID.push(sv('line', { class: 'guide', x1: x, y1: GYB, x2: x, y2: r2(top) }));
      lab(x + 6, top - 12, 'switched off', 'lab m', 'start');
    }
    dotAt(t, Tc);
    if (live) lab(gx(t) + 8, gy(Tc) - 12, `copper ${fx(Tc)} °C`, 'lab n', 'start');
    else if (!right) lab(gx(0) + 12, gy(Tc) + 4.5, 'switch-on', 'lab m', 'start');
    if (right && d.endLab) lab(gx(d.endLab.t), gy(settleAt(s)) + d.endLab.dy, d.endLab.text, 'lab n', 'middle', arr(1.3));
    if (wrong && d.bad && d.bad[st.pick]) drawBad(d.bad[st.pick], arr(0.1));
    REC.end = Tc;
    return ring + `Below, the copper's temperature after switch-on, ${fx(t)} minutes in: ${fx(Tc)} °C.` + (wrong ? ' The answer picked is drawn as a dashed line.' : '');
  }

  // The trace alone: how long it takes, twice the heat capacity, a hot room, the first minutes.
  function paintTime(d, st) {
    const show = !!d.show, right = st.res === 'right', wrong = st.res === 'wrong' && st.pick != null;
    const a = rig({}), b = rig({ C: 2 * CAP }), ta = tauMin(a.R, a.C), tb = tauMin(b.R, b.C);
    let said = 'A graph of the copper\'s temperature against minutes after switch-on, with the 70 °C limit.';
    if (d.mode === 'tau') {
      const r1 = arr(2.0), r2a = arr(2.5);
      HH = traceFrame(0, [{ t: ta, text: `τ = ${N.tau} min`, cls: 'n', a: r1 }, { t: 5 * ta, text: `5τ = ${N.five} min`, cls: '', a: r2a }], 2);
      curve((u) => tempAt(a, u), TMAX * lin(0.5, 1.5), 'curve', true);
      lab(gx(30), gy(tempAt(a, 30)) - 12, '300 J per °C', 'lab n', 'middle', r1);
      part(r1, 0, () => dotAt(ta, tempAt(a, ta)));
      lab(gx(ta) + 10, gy(tempAt(a, ta)) + 18, `${N.T1} °C after one τ`, 'lab n', 'start', r1);
      part(r2a, 0, () => AVOID.push(sv('line', { class: 'guide', x1: r2(gx(5 * ta)), y1: GYB, x2: r2(gx(5 * ta)), y2: r2(gy(tempAt(a, 5 * ta))) })));
      return said + ` One run for 300 J per °C, with τ = ${N.tau} minutes marked, near ${N.T1} °C after one τ, all but settled by ${N.five} minutes.`;
    }
    if (d.mode === 'cap') {
      const ra = right ? arr(1.3) : 0;
      HH = traceFrame(0, [{ t: ta, text: `τ = ${N.tau} min`, cls: 'n' }, right ? { t: tb, text: `τ = ${N.tauC2} min`, cls: 't', a: ra } : null], 2);
      curve((u) => tempAt(a, u), TMAX, 'curve', true);
      lab(gx(30), gy(tempAt(a, 30)) - 12, '300 J per °C', 'lab n');
      if (right) { curve((u) => tempAt(b, u), TMAX * lin(0.1, 1.3), 'curve2', true); lab(gx(26), gy(tempAt(b, 26)) + 20, '600 J per °C', 'lab t', 'start', ra); }
      if (wrong && d.bad[st.pick]) drawBad(d.bad[st.pick], arr(0.1));
      return said + ' A run for 300 J per °C settles at 70 °C.' + (right ? ' A run for 600 J per °C settles there too, twice as slowly.' : '');
    }
    if (d.mode === 'hot') {
      HH = traceFrame(0, [], 0);
      AVOID.push(sv('line', { class: 'room', x1: GX0, y1: r2(gy(40)), x2: GX1, y2: r2(gy(40)) }));
      lab(GX0 + 6, gy(40) + 18, 'room 40 °C', 'lab m', 'start');
      const hx = gx(90);
      brkV(hx, gy(40), gy(LIMIT), '');
      lab(hx - 6, (gy(40) + gy(LIMIT)) / 2 + 4, `${N.head} °C headroom`, 'lab m', 'end');
      if (right) {
        const sh = rig({ I: I_HOT, room: 40 });
        curve((u) => tempAt(sh, u), TMAX * lin(0.1, 1.3), 'curve', true);
        lab(gx(30), gy(tempAt(sh, 30)) + 20, `${N.IH} A`, 'lab n', 'middle', arr(1.3));
      }
      if (wrong && d.bad[st.pick]) drawBad(d.bad[st.pick], arr(0.1));
      return said + ` The room is at 40 °C, leaving ${N.head} °C of headroom below the limit.` + (right ? ` A run at ${N.IH} A settles at the limit.` : '');
    }
    // 'slope': the first minutes after switch-on
    HH = traceFrame(0, [], 0);
    if (right) {
      curve((u) => tempAt(a, u), TMAX * lin(0.1, 1.3), 'curve', true);
      const k = a.L / a.C * 60;   // °C a minute at switch-on
      part(arr(0.6), 0, () => AVOID.push(path(pd([[0, ROOM], [10, ROOM + 10 * k]]), 'tan')));
      lab(gx(10) + 6, gy(ROOM + 10 * k) + 4, `${N.wMin} °C a minute at first`, 'lab n', 'start', arr(1.2));
      REC.tan = k;
    }
    dotAt(0, ROOM);
    lab(gx(0) + 12, gy(ROOM) + 4.5, 'switch-on', 'lab m', 'start');
    if (wrong && d.bad[st.pick]) drawBad(d.bad[st.pick], arr(0.1));
    return said + ' The copper starts at the room\'s 30 °C.' + (right ? ` At first it climbs ${N.wMin} °C a minute.` : '');
  }

  // ---------- a motor and a heat sink ----------
  function drawTransistor(y0, g) {
    for (let j = 0; j < 6; j++) sv('rect', { class: 'iron', x: 26 + 20 * j, y: y0 + 52, width: 8, height: 44, rx: 2 });
    sv('rect', { class: 'iron', x: 20, y: y0 + 40, width: 120, height: 12, rx: 2 });
    [62, 75, 88].forEach((x) => sv('line', { class: 'leg', x1: x, y1: y0 + 14, x2: x, y2: y0 }));
    sv('rect', { class: 'pkg', x: 52, y: y0 + 14, width: 46, height: 26, rx: 3 });
    if (g > 0) part(g, 0, () => [60, 80, 100].forEach((x) => heatArrow(x, y0 + 42, x, y0 + 46 + 62 * g)));
  }
  function chain(y0, rows, t0) {
    part(arr(t0), 0, () => text(172, y0, 'heat leaves through', 'lab t', 'start'));
    rows.forEach((r, k) => part(arr(t0 + 0.15 * (k + 1)), 4, () => {
      const y = y0 + 24 + 24 * k;
      if (r[0]) sv('rect', { class: r[0], x: 172, y: y - 11, width: 14, height: 14, rx: 2 });
      text(r[0] ? 192 : 172, y, r[1], r[0] ? 'lab m' : 'lab n', 'start');
      if (k < rows.length - 2) path(`M179 ${y + 5} V${y + 11} M175.5 ${y + 8} L179 ${y + 12} L182.5 ${y + 8}`, 'heat');
    }));
  }
  function paintSkins() {
    HH = 330;
    const MX = 80, MY = 92;
    part(arr(0.4), 0, () => text(8, 16, 'A motor, cut across', 'lab t', 'start'));
    part(arr(0.5), 4, () => {
      sv('circle', { class: 'airf', cx: MX, cy: MY, r: 74 });
      for (let k = 0; k < 16; k++) { const th = k * Math.PI / 8, c = Math.cos(th), sn = Math.sin(th); sv('line', { class: 'fin', x1: r2(MX + c * 56), y1: r2(MY + sn * 56), x2: r2(MX + c * 62), y2: r2(MY + sn * 62) }); }
      sv('circle', { class: 'frame', cx: MX, cy: MY, r: 57 });
      sv('circle', { class: 'iron', cx: MX, cy: MY, r: 50 });
      for (let k = 0; k < 8; k++) {
        const th = (k + 0.5) * Math.PI / 4, x = MX + Math.cos(th) * 41, y = MY + Math.sin(th) * 41;
        sv('circle', { class: 'insf', cx: r2(x), cy: r2(y), r: 6.5 });
        sv('circle', { class: 'cuf', cx: r2(x), cy: r2(y), r: 3.8 });
      }
      sv('circle', { class: 'rotor', cx: MX, cy: MY, r: 29 });
    });
    const g1 = arr(1.0, 0.9);
    if (g1 > 0) part(g1, 0, () => { for (let k = 0; k < 8; k++) { const th = (k + 0.5) * Math.PI / 4, c = Math.cos(th), sn = Math.sin(th); heatArrow(MX + c * 46, MY + sn * 46, MX + c * (48 + 24 * g1), MY + sn * (48 + 24 * g1)); } });
    chain(36, [['cuf', 'winding'], ['insf', 'its insulation'], ['iron', 'iron and frame'], ['airf', 'air, fan on the shaft'], [null, 'rise = losses × total']], 1.1);
    part(arr(2.0), 0, () => text(8, 186, 'A transistor on a heat sink', 'lab t', 'start'));
    part(arr(2.1), 4, () => drawTransistor(206, 0));
    const g2 = arr(2.6, 0.9);
    if (g2 > 0) part(g2, 0, () => [60, 80, 100].forEach((x) => heatArrow(x, 248, x, 252 + 62 * g2)));
    chain(206, [['pkg', 'transistor and case'], ['iron', 'heat sink'], ['airf', 'air'], [null, 'rise = losses × total']], 2.6);
    return 'A motor cut across, with the room\'s air around it: heat made in the winding leaves through its insulation, the iron and the finned frame into the air. A transistor on a finned heat sink: its heat leaves through its case and the heat sink into the air. In each, the rise is losses × the total thermal resistance.';
  }
  // A transistor on its heat sink beside a temperature scale.
  function paintSink(d, st) {
    HH = 200;
    const right = st.res === 'right', wrong = st.res === 'wrong' && st.pick != null;
    text(8, 16, 'A transistor on a heat sink', 'lab t', 'start');
    drawTransistor(80, 1);
    const AX = 300, ly = (v) => 186 - v * 2.4;
    AVOID.push(path(`M${AX} ${ly(60)} V${ly(0)}`, 'ax'));
    [0, 20, 40, 60].forEach((v) => { sv('line', { class: 'tk', x1: AX, y1: r2(ly(v)), x2: AX + 4, y2: r2(ly(v)) }); text(AX + 8, ly(v) + 4.5, fx(v), 'tl', 'start'); });
    text(AX + 8, ly(60) - 12, '°C', 'tl', 'start');
    AVOID.push(sv('line', { class: 'room', x1: 172, y1: r2(ly(25)), x2: AX, y2: r2(ly(25)) }));
    lab(176, ly(25) + 18, 'room 25 °C', 'lab m', 'start');
    if (!right) lab(AX - 8, ly(60) + 4, 'how hot?', 'lab m', 'end');
    if (right) {
      const a1 = arr(0.1), a2 = arr(0.3);
      part(a1, 0, () => brkV(AX - 10, ly(25), ly(55), 'n'));
      lab(AX - 16, (ly(25) + ly(55)) / 2 + 4, `rise ${N.trRise} °C`, 'lab n', 'end', a1);
      part(a2, 0, () => AVOID.push(sv('circle', { class: 'dot', cx: AX, cy: r2(ly(55)), r: 6 })));
      lab(AX - 12, ly(55) - 10, `${N.tr} °C`, 'lab n', 'end', a2);
      REC.dot = [0, 25 + 10 * 3];
    }
    if (wrong && d.ring[st.pick]) {
      const q = d.ring[st.pick], a = arr(0.1);
      REC.bad++;
      part(a, 0, () => brkV(AX - 10, ly(q[0]), ly(q[1]), 'w'));
      lab(AX - 16, (ly(q[0]) + ly(q[1])) / 2 + 4, q[2], 'lab w', 'end', a);
    }
    return 'A transistor on a finned heat sink, and a temperature scale with the room at 25 °C.' + (right ? ` A bracket marks the rise, ${N.trRise} °C, up to ${N.tr} °C.` : '');
  }

  // The scene for a step (the animation calls this every frame).
  function paint(i, pOver) {
    if (i == null) i = at();
    const d = STEPS[i], st = S[i], p = pOver || K.params();
    art.textContent = '';
    into = null; LABS = []; AVOID = [];
    REC = { texts: [], bad: 0, over: false, dot: null, made: null, out: null, arrows: null, prof: null, rails: null, end: null, tan: null, curves: [], rows: [] };
    let said = '';
    if (d.pic === 'rails') said = paintRails(d, st);
    else if (d.pic === 'cable') said = paintCable(i, d, st, p);
    else if (d.pic === 'time') said = paintTime(d, st);
    else if (d.pic === 'skins') said = paintSkins();
    else said = paintSink(d, st);
    svg.setAttribute('viewBox', '0 0 340 ' + HH);
    placeLabels();
    svg.setAttribute('aria-label', said);
  }

  // ---------- what Dan reads under a live picture ----------
  function sayRun(s, t) {
    const made = making(s, t), out = leaving(s, t), Tc = tempAt(s, t);
    if (made > EPS && t <= 0.05) return `The current has just switched on. The copper is still at the room's ${fx(s.room)} °C, so no heat leaves yet, and all ${fx(s.L)} W warms it.`;
    if (made <= EPS) return out < 0.5 ? `The current is off, and the copper has cooled back to near the room's ${fx(s.room)} °C.`
      : `The current is off, so no heat is made. Heat still leaves, ${fx(out)} W in each metre, so the copper cools back towards the room along the same kind of curve.`;
    if (rising(made, out)) return `${fx(made)} W is made in each metre, but only ${fx(out)} W leaves. The rest warms the copper, so it is still rising, now at ${fx(Tc)} °C.`;
    return `${fx(out)} W leaves each metre, as much as is made, so the copper holds steady at ${fx(Tc)} °C. Switch it off to watch it cool.`;
  }
  function sayFor(i, d, p) {
    const s = cfgOf(i, p);
    if (d.parts === 'made') return s.I <= EPS ? 'No current flows, so the copper makes no heat.'
      : `${fx(s.I)} A makes ${fx(s.L)} W of heat in each metre. Losses go with current squared, so half the current makes a quarter of the heat.`;
    if (d.settle) {
      const Tss = settleAt(s);
      if (s.L <= EPS) return `No current flows, so no heat is made, and the copper stays at the room's ${fx(s.room)} °C.`;
      return `${fx(s.I)} A makes ${fx(s.L)} W in each metre. The way out is ${fx(s.R)} K·m/W, so the copper settles ${fx(s.L * s.R)} °C above the room, at ${fx(Tss)} °C` +
        (Tss > LIMIT + 0.5 ? ', over the 70 °C limit.' : Tss >= LIMIT - 0.5 ? ', right at the limit.' : ', under the limit.');
    }
    return sayRun(s, s.t);
  }
  function layout(i, d, st, p) {
    const right = st.res === 'right', live = d.live || null;
    el('stepbox').hidden = finished;
    el('done').hidden = !finished;
    el('count').textContent = 'Step ' + (i + 1) + ' of ' + STEPS.length;
    const task = el('task');
    task.className = 'task' + (d.show ? ' show' : '');
    write(task, d.show ? d.text : d.task);
    el('ctl').hidden = !live;
    curCtl.el.hidden = !(live && live.current);
    roomCtl.el.hidden = !(live && live.room);
    wrapCtl.el.hidden = !(live && live.wrap);
    fanCtl.el.hidden = !(live && live.fan);
    swBtn.el.hidden = !(live && live.sw);
    if (live && live.sw) swBtn.setLabel({ on: 'Switch on', off: 'Switch off', again: 'Start again' }[swMode(p)]);
    el('say').hidden = !live;
    el('say').textContent = live ? sayFor(i, d, p) : '';
    el('replay').hidden = !d.show || !!live || REDUCE;
    const opts = d.show ? [] : d.opts;
    el('picks').hidden = !opts.length;
    el('picks').classList.toggle('long', opts.some((x) => x.length > 9));
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      b.setLabel(opts[k]);
      b.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });
    el('acts').hidden = !!d.show;
    checkBtn.el.hidden = right;
    const fb = el('fb');
    fb.hidden = !!d.show;
    fb.className = 'fb' + (right ? ' right' : st.res === 'wrong' ? ' wrong' : '');
    fb.textContent = d.show ? '' : right ? (d.right || 'That\'s it.') : st.res === 'wrong' ? ((d.hints && d.hints[st.pick]) || d.hint) : st.res === 'empty' ? PICK : '';
    const why = el('why');
    why.hidden = !!d.show || !st.why;
    write(why, d.show ? '' : d.why);
    whyBtn.setLabel(st.why ? 'Hide why' : 'Why?');
    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !right);
    nextBtn.setLabel(i === STEPS.length - 1 ? 'Finish' : 'Continue');
    el('nav').hidden = backBtn.el.hidden && nextBtn.el.hidden;
  }

  write(el('finish'), FINISH);
  K.update((p) => {
    const i = at(), d = STEPS[i], st = S[i];
    if (i !== lastStep) {
      lastStep = i; enter('stepbox'); onEnter(i);
      if (d.live) { keyNow = ctlKey(K.params()); K.refresh(); return; }
    }
    if (d.live) {
      const k = ctlKey(p);
      if (k !== keyNow) {   // Dan moved a slider or a switch: the demonstration gives way to him
        keyNow = k;
        if (MOT && (MOT.ctl === 'current' || d.settle)) { MOT = null; anim.pause(); T = Infinity; }
        if (d.settle && ((+p.clock || 0) < TMAX - EPS || (+p.off || 0) < TMAX - EPS)) { setCtl('off', TMAX); setCtl('clock', TMAX); K.refresh(); return; }
      }
    }
    if (!anim.playing()) T = Infinity;
    if (finished !== lastDone) { lastDone = finished; enter(finished ? 'done' : 'stepbox'); }
    layout(i, d, st, p);
    paint(i, p);
  });

  // ---------- known answers, worked out by hand ----------
  const DO = STEPS.map((d, i) => i).filter((i) => !STEPS[i].show);
  const solved = (i) => ({ pick: STEPS[i].want, res: 'right', why: false });
  const wrongSt = (i, o) => ({ pick: o, res: 'wrong', why: false });
  const idx = (name) => STEPS.findIndex((d) => d.name === name);
  // A step painted in the state given (finished): what it draws.
  function drawn(i, st, pOver) {
    const keepS = S[i], keepT = T;
    S[i] = st; T = Infinity;
    try { paint(i, pOver ? Object.assign({}, K.params(), pOver) : null); return REC; }
    finally { S[i] = keepS; T = keepT; paint(); }
  }
  const SW_ON = idx('Switch on'), LESS = idx('Carrying less'), MADE = idx('Heat made in the copper');

  K.check('The metal feels colder because heat leaves the fingers faster: more heat arrows run from the hand into the steel than into the wood, while both thermometers read the room\'s temperature', () => {
    const r = drawn(idx('Steel and wood'), blank()).rails;
    return r.length === 2 && r[0].arrows > r[1].arrows && r[1].arrows > 0 && r[0].reads === '20 °C' && r[1].reads === '20 °C';
  });
  K.check('At some temperature the heat leaving matches the heat being made, so the copper stops rising; at switch-on none leaves yet', () =>
    [{}, { wrap: true }, { fan: true }, { I: 30, room: 15 }, { I: 60, wrap: true, fan: true }].every((o) => {
      const s = rig(o);
      return leaving(s, 0) === 0 && K.near(leaving(s, 1e4), s.L, 1e-9 * Math.max(1, s.L)) && leaving(s, 5) < leaving(s, 20) && K.near(tempAt(s, 1e4), settleAt(s), 1e-9);
    }) && K.near(K.at({ step: SW_ON, clock: 60, off: TMAX }).copperTemp, 70, 0.1), { source: SRC2 });
  K.check('The thermal resistance of the air is the surface\'s rise above the room divided by the losses in each metre, once the cable has settled', () => {
    const a = drawn(SW_ON, blank(), { clock: TMAX, off: TMAX }).prof, sa = rig({});
    const b = drawn(LESS, blank(), { current: 50, room: 30, wrap: false, fan: true, clock: TMAX, off: TMAX }).prof;
    return K.near((a.surface - sa.room) / sa.L, R_AIR, 1e-3) && K.near((b.surface - 30) / lossOf(50), R_FAN, 1e-3) && K.near(a.end, sa.room, 1e-9);
  }, { source: SRC3 });
  K.check('Every number the screens print comes from the rule: 20 W, 2 K·m/W, a 40 °C rise to 70 °C, 10 °C and 30 °C; 600 s, 10 min, 63%, 55 °C and 50 min; 4 K·m/W, 80 °C, 110 °C and 40 °C across the wrap; 1,200 s and 20 min; 0.707 and about 35 A; 30 °C, 15 W, 0.866 and about 43 A against 38 A and 80 °C; 50 °C with a fan; 55, 30 and 28 °C with 3.3 °C; 0.067 °C a second, about 4 °C a minute, against 15', () =>
    N.L50 === '20' && N.R === '2' && N.rise === '40' && N.Ts === '70' && N.dIns === '10' && N.dAir === '30' &&
    N.tauS === '600' && N.tau === '10' && N.pct === '63' && N.T1 === '55' && N.five === '50' &&
    N.RW === '4' && N.riseW === '80' && N.TW === '110' && N.dWrap === '40' && N.tauC2s === '1,200' && N.tauC2 === '20' && N.tauW === '20' && N.low === '50' &&
    N.facW === '0.707' && N.IW === '35' && N.allowW === '10' && N.head === '30' && N.allowH === '15' && N.facH === '0.866' && N.IH === '43' && N.I38 === '38' && N.T50hot === '80' &&
    N.TF === '50' && N.riseF === '20' && N.tauF === '5' && N.tr === '55' && N.trRise === '30' && N.tr28 === '28' && N.tr33 === '3.3' &&
    N.w067 === '0.067' && N.wMin === '4' && N.w15 === '15');
  K.check('Losses go with current squared (25 A makes a quarter of 50 A\'s 20 W); doubling the thermal resistance doubles the rise; doubling the heat capacity leaves where it settles alone and doubles the time constant', () => {
    const a = K.at({ step: MADE, current: 25 }), b = K.at({ step: MADE, current: 50 });
    const s = rig({}), w = rig({ wrap: true }), c = rig({ C: 2 * CAP });
    return K.near(a.losses, 5, 1e-9) && K.near(b.losses, 20, 1e-9) && K.near((settleAt(w) - w.room) / (settleAt(s) - s.room), 2, 1e-9) &&
      K.near(settleAt(c), settleAt(s), 1e-9) && K.near(tauMin(c.R, c.C) / tauMin(s.R, s.C), 2, 1e-9) && tempAt(c, 10) < tempAt(s, 10);
  });
  K.check('The trace follows the rule: its last point is the dot and the temperature the model returns, it never falls while the current is on, it cools back towards the room after switch-off, and it is drawn red only above 70 °C', () =>
    [[60, TMAX], [20, TMAX], [TMAX, 30], [80, 60], [0, TMAX]].every((q) => {
      const r = drawn(SW_ON, blank(), { clock: q[0], off: q[1] }), o = K.at({ step: SW_ON, clock: q[0], off: q[1] }), s = rig({ off: q[1] });
      const okEnd = r.dot && K.near(r.dot[0], q[0], 1e-9) && K.near(r.dot[1], o.copperTemp, 1e-9) && K.near(o.copperTemp, tempAt(s, q[0]), 1e-9);
      const okLine = q[0] < EPS || K.near(r.curves[0].end[1], o.copperTemp, 1e-6);
      return okEnd && okLine && !r.over;
    }) && tempAt(rig({ off: 30 }), 40) < tempAt(rig({ off: 30 }), 30) && tempAt(rig({ off: 30 }), 100) > ROOM &&
    drawn(LESS, blank(), { current: 50, wrap: true, room: 30, fan: false, clock: TMAX, off: TMAX }).over === true &&
    K.at({ step: SW_ON, clock: 100, off: 30 }).losses === 0 && K.near(K.at({ step: SW_ON, clock: 20, off: TMAX }).losses, 20, 1e-9));
  K.check('Each puzzle offers three different answers including its right one, every wrong answer has its own hint, and before Check nothing on its picture shows the answer or a red mark', () =>
    DO.every((i) => {
      const d = STEPS[i];
      if (d.opts.length !== 3 || d.opts.indexOf(d.want) < 0 || new Set(d.opts).size !== 3) return false;
      if (!d.opts.every((o) => o === d.want || (d.hints[o] && d.hints[o].length > 10))) return false;
      const g = drawn(i, blank());
      return !g.bad && !g.over && g.texts.every((t) => t.indexOf(d.want) < 0);
    }));
  K.check('A wrong pick is drawn in red where it can be: a climb that never stops, 70 °C but later, 80 °C, settling at 50 °C, the same time, 38 A and 50 A runs, the room left out, 10 ÷ 3, 15 °C a second and all at once; a right answer draws no wrong pick', () =>
    DO.every((i) => {
      const d = STEPS[i];
      if (drawn(i, solved(i)).bad) return false;
      return d.opts.filter((o) => o !== d.want).every((o) => (d.redless && d.redless.indexOf(o) >= 0) || drawn(i, wrongSt(i, o)).bad > 0);
    }));
  K.check('A right answer draws the rule\'s result: the run levels off at 70 °C; with the wrap it heads for 110 °C and turns red past the limit; twice the heat capacity also reaches 70 °C, with τ = 20 min; 43 A in a 40 °C room settles at 70 °C; the transistor at 55 °C; the first climb at 4 °C a minute', () => {
    const r3 = drawn(idx('What happens next?'), solved(idx('What happens next?'))), r5 = drawn(idx('With the extra wrap'), solved(idx('With the extra wrap')));
    const r7 = drawn(idx('Twice the heat capacity'), solved(idx('Twice the heat capacity'))), r9 = drawn(idx('A hot room'), solved(idx('A hot room')));
    const r11 = drawn(idx('A transistor'), solved(idx('A transistor'))), r12 = drawn(idx('Just after switch-on'), solved(idx('Just after switch-on')));
    return K.near(r3.end, 70, 0.01) && !r3.over && Math.abs(r5.end - 110) < 1 && r5.over && r7.rows.indexOf(20) >= 0 && Math.abs(r7.curves[1].end[1] - 70) < 0.5 &&
      K.near(r9.curves[0].end[1], 70, 0.01) && r11.dot[1] === 55 && K.near(r12.tan, 4, 1e-9);
  });
  K.check('After Switch on, the copper is within 1 °C of where it settles within 3 s of the press, and its demonstration reaches that point within 3.6 s of the screen opening', () =>
    tempAt(S50, RATE * 2.5) > settleAt(S50) - 1 && STEPS[SW_ON].mot.to / RATE <= 3 && tempAt(S50, STEPS[SW_ON].mot.to * (3.0 - STEPS[SW_ON].mot.t0) / (STEPS[SW_ON].mot.t1 - STEPS[SW_ON].mot.t0)) > settleAt(S50) - 1);
  K.check('Every demonstration has finished arriving within 4.5 s of its screen opening, none starting before the 0.35 s screen fade ends; every answer\'s motion, right or wrong, within 2 s', () => {
    const keepT = T;
    const timed = (i, st, limit) => {
      const keepS = S[i];
      T = Infinity; latest = 0; earliest = Infinity;
      S[i] = st;
      try { paint(i); } finally { S[i] = keepS; }
      return latest <= limit + 1e-9;
    };
    const ok = STEPS.every((d, i) => {
      if (d.show) {
        if (d.live) return d.mot.t0 >= FADE && d.mot.t1 <= d.dur && d.dur <= 4.5 && d.dur >= 3;
        return timed(i, blank(), d.dur) && d.dur <= 4.5 && d.dur >= 3 && earliest >= FADE;
      }
      return timed(i, solved(i), ANS) && d.opts.filter((o) => o !== d.want).every((o) => timed(i, wrongSt(i, o), ANS));
    });
    T = keepT; paint();
    return ok;
  });

  K.ready();
</script>
