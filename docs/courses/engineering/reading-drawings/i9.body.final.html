<p class="caption">Made-up practice sheets, far simpler than real ones. A bold line is joined to a live source.</p>

<script>
  // ---------- small helpers ----------
  const el = (id) => document.getElementById(id);
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

  const r3 = (v) => Math.round(v * 100) / 100;
  const add = (g, tag, attrs) => g.appendChild(K.svg(tag, attrs || {}));
  const rect = (g, x, y, w, h, cls, rx) => add(g, 'rect', { class: cls, x: r3(x), y: r3(y), width: r3(Math.max(0, w)), height: r3(Math.max(0, h)), rx: rx || 0 });

  }

    const w = tw(s, cls) + 8, x0 = anchor === 'start' ? x - 4 : anchor === 'end' ? x - w + 4 : x - w / 2;

  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const testing = () => document.documentElement.classList.contains('k-testing');

  // ---------- the flow rule, for the air sheet and both switchboards ----------
  // A part passes (on = true: a valve open, a breaker closed) or not. A line has supply while an
  // unbroken path of passing parts joins it to a live source. A non-return valve (one) passes a to b only.
  // The receiver is a store: a source while its needle is above the low mark.
  const LOW = 0.4;
  function reachFrom(S, st, start) {
    const seen = new Set([start]), todo = [start];
    while (todo.length) {
      const n = todo.pop();
      Object.keys(S.devs).forEach((k) => {
        const D = S.devs[k];
        if (!st.dev[k]) return;
        let o = null;
        if (D.a === n) o = D.b; else if (D.b === n && !D.one) o = D.a;
        if (o && !seen.has(o)) { seen.add(o); todo.push(o); }
      });
    }
    return seen;
  }
  function srcOn(S, st, s) { const P = S.srcs[s]; return P.store ? st.lev > LOW + 1e-9 : P.always ? true : !!st.run[s]; }
  function liveNodes(S, st) {
    const out = new Set();
    S.sorder.forEach((s) => { if (srcOn(S, st, s)) reachFrom(S, st, S.srcs[s].node).forEach((n) => out.add(n)); });
    return out;
  }
  // The end of a change: a receiver joined to a running compressor fills; one feeding an open user
  // (or its open drain) runs down until it can feed nothing.
  function settle(S, st) {
    const e = cp(st);
    if (!S.store) return e;
    const R = S.srcs[S.store].node, fromC = new Set();
    S.sorder.forEach((s) => { if (!S.srcs[s].store && srcOn(S, e, s)) reachFrom(S, e, S.srcs[s].node).forEach((n) => fromC.add(n)); });
    if (fromC.has(R)) { e.lev = 1; return e; }
    const r = reachFrom(S, e, R), vent = !!S.sink && r.has(S.sink);
    const draws = vent || S.lorder.some((l) => r.has(S.loads[l].node));
    if (vent) e.lev = 0; else if (draws && e.lev > LOW) e.lev = LOW;
    return e;
  }
  const liveLoads = (S, st) => { const L = liveNodes(S, st); return S.lorder.filter((l) => L.has(S.loads[l].node)); };
  // A path from a live source to a load: the lines and parts it passes, in order from the source.
  function pathTo(S, st, load) {
    const t = S.loads[load].node;
    for (const s of S.sorder) {
      if (!srcOn(S, st, s)) continue;
      const start = S.srcs[s].node, prev = {}, q = [start];
      prev[start] = null;
      while (q.length) {
        const n = q.shift();
        Object.keys(S.devs).forEach((k) => {
          const D = S.devs[k];
          if (!st.dev[k]) return;
          let o = null;
          if (D.a === n) o = D.b; else if (D.b === n && !D.one) o = D.a;
          if (o && !(o in prev)) { prev[o] = { from: n, via: k }; q.push(o); }
        });
      }
      if (!(t in prev)) continue;
      const nodes = [t], devs = [];
      let at = t;
      while (prev[at]) { devs.unshift(prev[at].via); at = prev[at].from; nodes.unshift(at); }
      return { src: s, nodes, devs };
    }
    return null;
  }
  // A change played slowly: parts move, then lines follow; a receiver's needle falls (or rises) before
  // what it alone fed goes pale. delay: a part that moves later than the rest.
  function flowPlan(S, A, B, delay) {
    const B0 = cp(B); B0.lev = A.lev;
    const E = settle(S, B0), L0 = liveNodes(S, A), Lm = liveNodes(S, B0), Le = liveNodes(S, E);
    const dly = delay || {}, last = Math.max(0, ...Object.values(dly));
    const moved = Object.keys(S.devs).some((k) => !!A.dev[k] !== !!B.dev[k]) || Object.keys(S.srcs).some((s) => !!A.run[s] !== !!B.run[s]);
    const t1 = (moved ? 0.8 : 0.1) + last, dl = Math.abs(E.lev - A.lev), tl = dl > 1e-6 ? K.clamp(dl * 2, 0.8, 1.6) : 0;
    const t2 = t1 + 0.6, t3 = t2 + tl, end = tl ? t3 + 0.7 : t1 + 0.7;

  }
  const progT = (T, t0, d) => (T === Infinity ? 1 : K.clamp((T - t0) / d, 0, 1));

    const S = p.S, v = { dev: {}, node: {}, run: {}, lev: p.E.lev, st: T === Infinity ? p.E : p.B };

      v.node[n] = x;

  }

    const L = liveNodes(S, shown), v = { dev: {}, node: {}, run: {}, lev: shown.lev, st: shown };

    Object.keys(S.srcs).forEach((s) => { v.run[s] = cur.run[s]; });
    Object.keys(S.nodes).forEach((n) => { v.node[n] = L.has(n) ? 1 : 0; });

  } }));
  const ANS = {}, BOX = {};
  STEPS.forEach((d, i) => {
    if (d.kind !== 'typed') return;
    BOX[i] = el('ansbox').appendChild(K.el('div', { class: 'ans' }));
    ANS[i] = K.answer({ id: d.field, unit: d.unit, answer: d.answer, decimals: 0, slips: d.slips, into: BOX[i], onCheck: (r) => {
      const st = S[i];
      if (st.res === 'right') return;
      if (r.state === 'right') { st.res = 'right'; st.fbText = "That's it."; playFx(i, null, true); }
      else if (r.state === 'wrong') {
        st.tries += 1;
        if (st.tries >= 2) { st.res = 'right'; st.shownAns = true; st.why = true; st.fbText = (r.hint ? r.hint + ' ' : '') + 'Here is the working.'; ANS[i].reveal(); playFx(i, null, true); }
        else { st.res = 'wrong'; st.fbText = r.hint || d.hint; }
      } else { st.res = null; st.fbText = ''; }
      K.refresh();
    } });
  });
  const checkBtn = K.button({ label: 'Check', into: '#acts', press: () => {
    const i = at(), d = STEPS[i], st = S[i];
    if (finished || d.show || st.res === 'right') return;
    if (d.kind === 'typed') { ANS[i].check(); return; }
    if (st.pick == null) { st.res = 'empty'; return; }
    const ok = st.pick === d.want;
    st.res = ok ? 'right' : 'wrong';
    if (!ok) st.tries += 1;
    st.fbText = ok ? "That's it." : (d.hints && d.hints[st.pick]) || d.hint;
    playFx(i, st.pick, ok);
  } });
  const whyBtn = K.button({ label: 'Why?', secondary: true, into: '#acts', press: () => { const i = at(); if (finished || STEPS[i].show) return; S[i].why = !S[i].why; } });
  const backBtn = K.button({ label: 'Back', secondary: true, into: '#nav', press: () => { if (finished) { finished = false; return; } stepper.set(Math.max(0, at() - 1), true); } });
  const nextBtn = K.button({ label: 'Continue', into: '#nav', press: () => {
    const i = at();
    if (finished || (!STEPS[i].show && S[i].res !== 'right')) return;
    if (i < STEPS.length - 1) { stepper.set(i + 1, true); return; }
    finished = true;
    if (typeof K.complete === 'function') K.complete();
  } });
  K.button({ label: 'Start again', secondary: true, into: '#again', press: () => {
    S = STEPS.map((d, i) => fresh(i));
    Object.keys(ANS).forEach((k) => ANS[k].reset());
    finished = false; lastStep = -1; stepper.set(0, true);
  } });

  // One animation plays each demonstration, each puzzle's answer and each change; with reduced
  // motion (and while the self-test looks) everything opens finished.
  const anim = K.anim({ button: false, label: 'Demonstration', step: (dt) => {
    if (finished) return false;
    T += dt;
    if (T >= motionEnd) { T = Infinity; paint(); return false; }
    paint();
    return true;
  } });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !anim.playing() && T !== Infinity) { T = Infinity; paint(); } });
  function play(dur) {
    if (REDUCE || testing()) { T = Infinity; anim.pause(); return; }
    motionEnd = dur; T = 0; anim.play();
  }
  function startDemo(i) {
    const d = STEPS[i];
    if (d.demo === 'hold') hoistGo(i, [{ b: 'up', t0: 0.4, t1: 2.4 }]);
    else S[i].anim = { kind: 'demo' };
    play(d.dur);
  }
  function enter(id) { if (REDUCE) return; const box = el(id); box.classList.remove('enter'); void box.offsetWidth; box.classList.add('enter'); }
  STEPS.forEach((d, i) => {
    if (!d.show) return;
    d.still = () => {
      S[i] = fresh(i); S[i].touched = true;
      if (d.demo === 'hold') world(S[i], 'hoist', i).h = Object.assign(cp(HBASE), { pos: 0.75, held: 'up' });
      anim.pause(); T = Infinity; K.refresh();
    };
  });

  // ---------- the page ----------
  el('finish').textContent = FINISH;
  K.update((p) => {
    const i = K.clamp(Math.round(p.step), 0, STEPS.length - 1), d = STEPS[i];
    if (!anim.playing()) T = Infinity;
    if (i !== lastStep) {
      lastStep = i; enter('stepbox');
      if (d.show) { S[i] = fresh(i); startDemo(i); } else { anim.pause(); T = Infinity; }
    }
    if (finished !== lastDone) { lastDone = finished; enter(finished ? 'done' : 'stepbox'); }
    const st = S[i], right = st.res === 'right', tools = toolsOn(i), Sh = SHEETS[st.sh], w = world(st, Sh.id, i);
    el('stepbox').hidden = finished;
    el('done').hidden = !finished;
    el('count').textContent = 'Screen ' + (i + 1) + ' of ' + STEPS.length;
    const task = el('task');
    task.className = 'task' + (d.show ? ' show' : '');
    write(task, d.show ? d.text : d.task);
    el('picker').hidden = !tools;
    el('shtitle').textContent = Sh.title;
    el('shcount').textContent = 'Sheet ' + (st.sh + 1) + ' of ' + SHEETS.length;
    el('tabs').hidden = !tools;
    whatBtn.el.hidden = !!Sh.brk;
    el('notes').textContent = Sh.notes || '';
    el('notes').hidden = !Sh.notes;
    el('plantbox').hidden = !(d.plant && st.sh === SI.air);
    const say = sayFor(i);
    el('say').hidden = !say;
    write(el('say'), say);
    upBtn.el.hidden = dnBtn.el.hidden = !(tools && Sh.hoist);
    replayBtn.el.hidden = !d.show || REDUCE || st.sh !== SI[d.sheet];
    el('tools').hidden = upBtn.el.hidden && replayBtn.el.hidden;
    const showMarks = tools && st.what && Sh.lorder.length > 0;
    el('marks').hidden = !showMarks;
    ROWS.forEach((r, k) => {
      const l = Sh.lorder[k];
      r.row.hidden = !showMarks || k >= Sh.lorder.length;
      if (r.row.hidden) return;
      write(r.nm, Sh.loads[l].label);
      r.r.el.setAttribute('aria-pressed', w.marks[l] === 'runs' ? 'true' : 'false');
      r.s.el.setAttribute('aria-pressed', w.marks[l] === 'stops' ? 'true' : 'false');
      r.row.className = 'mrow' + (w.graded && w.graded.wrong.indexOf(l) >= 0 ? ' bad' : '');
    });
    const opts = d.kind === 'pick' ? d.opts : [];
    el('picks').hidden = !opts.length;
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      b.el.textContent = '';
      write(b.el.appendChild(K.el('span', { class: 'opt' })), opts[k]);
      b.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });
    Object.keys(BOX).forEach((k) => { BOX[k].hidden = +k !== i; });
    el('ansbox').hidden = d.kind !== 'typed';
    el('acts').hidden = !!d.show;
    checkBtn.el.hidden = right;
    const fb = el('fb');
    fb.hidden = !!d.show;
    const f = d.show ? '' : st.res === 'empty' ? 'Tap one of the answers.' : st.res ? st.fbText : '';
    fb.className = 'fb' + (right && !st.shownAns ? ' right' : '');
    write(fb, f);
    const why = el('why');
    why.hidden = !!d.show || !st.why;
    write(why, d.show ? '' : d.why);
    whyBtn.setLabel(st.why ? 'Hide why' : 'Why?');
    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !right);
    nextBtn.setLabel(i === STEPS.length - 1 ? 'Finish' : 'Continue');
    el('nav').hidden = backBtn.el.hidden && nextBtn.el.hidden;
    paint();
  });

  // ---------- known answers, worked out by hand ----------
  const airWith = (dev, run) => { const b = cp(AIR.base); Object.assign(b.dev, dev || {}); Object.assign(b.run, run || {}); return b; };
  K.check('Valves can share one symbol, with the notes and legend telling what the symbol alone cannot: every valve on the air sheet is drawn alike, and only V7 and V8, marked N.C., are shut as drawn', () => {
    const vs = Object.keys(AIR.devs).filter((k) => AIR.devs[k].k === 'vv' || AIR.devs[k].k === 'vh'), nc = vs.filter((k) => AIR.devs[k].nc);
    return vs.length === 8 && nc.join() === 'V7,V8' && vs.every((k) => !!AIR.base.dev[k] === !AIR.devs[k].nc);
  }, { source: SRC.doe });
  K.check('A one line typically starts at the top with the incoming power and its disconnecting device: the first switchboard does, while the second has both supplies below its busbars and its loads above them', () =>
    ['G1', 'G2', 'SH'].every((s) => SB1.srcs[s].y < SB1.devs[{ G1: 'Q1', G2: 'Q2', SH: 'Q3' }[s]].y && SB1.devs[{ G1: 'Q1', G2: 'Q2', SH: 'Q3' }[s]].y < 120) && SB1.lorder.every((l) => SB1.loads[l].y > 120) &&
    SB2.sorder.every((s) => SB2.srcs[s].y > 168) && SB2.lorder.every((l) => SB2.loads[l].y < 168), { source: SRC.eeco });
  K.check('Each symbol is drawn in its normal condition: at rest every normally closed contact on the hoist sheet is closed, every normally open one is open, and no coil is in', () => {
    const c = coils(HBASE);
    return !c.k11 && !c.k12 && !c.y11 && Object.keys(CON).every((id) => contactClosed(id, HBASE, c) === !!CON[id].nc);
  }, { source: SRC.navy });
  K.check('Isolation points on the plant should match the line diagram: the plant has one valve the sheet does not show, so with V3 shut the plant\'s users keep air through it, the hose point and, back through V6, the rest of the header, while the sheet shows every user without air', () => {
    const p = flowBase(PLANT, { dev: { V3: false } }), s = flowBase(AIR, { dev: { V3: false } });
    return !AIR.devs.X && !!PLANT.devs.X && liveLoads(PLANT, p).join() === 'T,A,H' && pathTo(PLANT, p, 'H').devs.indexOf('X') >= 0 && liveLoads(AIR, s).length === 0 && liveLoads(AIR, flowBase(AIR)).length === 3;
  }, { source: SRC.hse });
  K.check('Both compressors stopped: every user keeps air from R1 until its needle falls to the low mark, then all three stop; with V3 shut instead, all three stop at once and R1 stays full', () => {
    const p = flowPlan(AIR, flowBase(AIR), airWith(null, { C1: false, C2: false })), q = flowPlan(AIR, flowBase(AIR), airWith({ V3: false }));
    return ['u4', 'u5', 'u6'].every((n) => p.Lm.has(n) && !p.Le.has(n) && !q.Lm.has(n)) && p.E.lev === LOW && p.tl > 0 && q.E.lev === 1 && !p.Le.has('a1');
  });
  K.check('Second board: 2 sources (slips 1 and 3); as run, section 2 is fed through -Q8; with -Q8 open, -M6 and -E6 stop and -M5 and -E5 run', () => {
    const b = flowBase(SB2), t = flowBase(SB2, { dev: { Q8: false } }), d = STEPS[I.count];
    return d.answer === 2 && d.slips.map((x) => x.value).join() === '1,3' && liveLoads(SB2, b).length === 4 && pathTo(SB2, b, 'M6').devs.indexOf('Q8') >= 0 &&
      liveLoads(SB2, t).join() === 'M5,E5';
  });
  K.check('Hoist: from mid-travel Up raises the hook; at the top Up does nothing and Down still lowers it; with -S10 open neither works', () => {
    const top = hoistAt(Object.assign(cp(HBASE), { pos: 1 }), HOLDS2, Infinity).res, mid = hoistAt(cp(HBASE), [{ b: 'up', t0: 0, t1: 1 }], Infinity);
    const stop = hoistAt(Object.assign(cp(HBASE), { S10: false }), HOLDS2, Infinity).res;
    return !top.up && top.down && mid.res.up && K.near(mid.h.pos, 0.5 + RATE, 0.02) && !stop.up && !stop.down;
  });
  K.check('Isolating R1: V1, V2 and V3 cut it off from both compressors and the header; V3 alone leaves the compressors feeding it; V1 and V2 alone leave it feeding the header; opening V7 would join its inlet line to the header', () => {
    const cut = (list, more) => { const b = airWith(); list.forEach((k) => { b.dev[k] = false; }); Object.assign(b.dev, more || {}); const r = reachFrom(AIR, b, 'rcv'); return { c: reachFrom(AIR, b, 'a1').has('rcv') || reachFrom(AIR, b, 'a2').has('rcv'), h: r.has('hv3') || r.has('h7') }; };
    const a = cut(['V1', 'V2', 'V3']), b = cut(['V3']), c = cut(['V1', 'V2']), e = cut(['V1', 'V2', 'V3'], { V7: true });
    return !a.c && !a.h && b.c && !b.h && !c.c && c.h && e.h && STEPS[I.iso].shut[STEPS[I.iso].want].join() === 'V1,V2,V3';
  });
  K.check('First board: -Q23 cannot close while -Q13 is closed; with -Q13 open and -Q23 closed, -M3 is still fed, from -G2 through section B', () => {
    const b = cp(SB1.base), refused = !!SB1.refuse(b, 'Q23');
    b.dev.Q13 = false;
    const free = !SB1.refuse(b, 'Q23');
    b.dev.Q23 = true;
    const pt = pathTo(SB1, b, 'M3');
    return refused && free && pt && pt.src === 'G2' && pt.devs.join() === 'Q2,Q23';
  });
  K.check('The upright stands 60 − 10 = 50 mm above the base (slips 60 and 70), and the typed fields ask exactly these', () => {
    const d = STEPS[I.size];
    return d.answer === 50 && d.slips.map((x) => x.value).join() === '60,70' && d.want === '50 mm' && STEPS[I.count].want === '2 sources' && ANS[I.size].spec.answer === 50 && ANS[I.count].spec.answer === 2;
  });
  K.check('Before an answer nothing gives it away: every puzzle opens on its own sheet as drawn, with no tabs, rings, marks or locks', () =>
    DO.every((i) => {
      const st = fresh(i), d = STEPS[i], w = world(st, d.sheet, i), Sh = SHEETS[SI[d.sheet]];
      const same = Sh.flow ? JSON.stringify(w.shown) === JSON.stringify(flowBase(Sh, d.base)) : Sh.hoist ? JSON.stringify(w.h) === JSON.stringify(Object.assign(cp(HBASE), d.base || {})) : true;
      return same && !st.tab && !st.what && !w.rings && !Object.keys(w.locks).length && !Object.keys(w.marks).length && st.res === null;
    }));
  K.check('Every demonstration settles within 4.5 s, and every answer plays out within 5 s', () => {
    const plays = [flowPlan(AIR, flowBase(AIR), airWith(null, { C1: false, C2: false })), flowPlan(AIR, flowBase(AIR), airWith({ V1: false, V2: false, V3: false, V8: true }), { V8: 0.6 }),
      flowPlan(SB1, flowBase(SB1), Object.assign(cp(SB1.base), { dev: Object.assign(cp(SB1.base.dev), { Q13: false }) }))];
    return STEPS.every((d) => !d.show || (d.dur > 0 && d.dur <= 4.5)) && plays.every((p) => p.dur <= 5.05) && HOLDS2[1].t1 + 0.6 <= 5;
  });

  K.ready();
</script>
