<p class="lead">A valve steering oil from a pump to a cylinder, drawn as a row of boxes that slides against fixed ports.</p>

<p class="caption">Each box is one position the valve can take.</p>

<script>
  // ---------- the rule: only the box in line with the fixed ports joins them ----------
  const BW = 44, BH = 40, VX = 104, VY = 206, MID = VY + BH / 2, AX = 159, BX = 181;
  const PIN = 166, TRAV = 56, ROD = 78;        // the cylinder: piston height fully in, its travel, the rod's length
  const V = 0.4, VF = 0.3, CREEP = 0.05;        // travel per second: under power, floating under the load, creeping
  const HM = 394, HC = 152;
  const CTR = ['Closed', 'P to T', 'Float'], CK = ['closed', 'ptt', 'float'];
  const PISTON = 'A', RODSIDE = 'B';
  // What each box joins: P to A and B to T; P to B and A to T; nothing; P to T; A and B to T.
  const JOINS = { par: ['PA', 'BT'], cross: ['PB', 'AT'], closed: [], ptt: ['PT'], float: ['AT', 'BT'] };
  const TWO = { ports: ['P', 'T', 'A', 'B'], boxes: ['par', 'cross'], rest: 1, spring: 1 };
  const V32 = { ports: ['P', 'T', 'A'], boxes: ['op32', 'rest32'], rest: 1, spring: 1 };
  const P52 = { supply: [1], work: [2, 4], exh: [3, 5] };
  const inLine = (s) => Math.round(s) || 0;      // +1 the left box, 0 the middle, -1 the right
  const target = (m) => (m.hand != null ? m.hand : m.y1 ? 1 : m.y2 ? -1 : 0);
  // What the box in line does to the rod (+1 out, -1 in, 0 held) and to the pump's oil.
  function regime(box, ctr, x, leaks) {
    if (box === 1) return x < 1 ? { rod: 1, pump: 'feed' } : { rod: 0, pump: 'relief' };
    if (box === -1) return x > 0 ? { rod: -1, pump: 'feed' } : { rod: 0, pump: 'relief' };
    if (ctr === 2) return { rod: x > 0 ? -1 : 0, pump: 'relief', float: true };
    return { rod: 0, pump: ctr === 1 ? 'unload' : 'relief', held: true, creep: !!leaks && x > 0 };
  }
  function flowTags(box, ctr, r) {
    if (box === 1) return r.rod ? ['PA', 'BT'] : [];
    if (box === -1) return r.rod ? ['PB', 'AT'] : [];
    if (ctr === 1) return ['PT'];
    if (ctr === 2) return r.rod ? ['AT', 'BT'] : [];
    return [];
  }
  const PUMP = { feed: 'The pump is feeding the cylinder.', unload: 'The pump is unloading to the tank.', relief: "The pump's oil goes over the relief valve." };
  const E4 = 'https://www.e4training.com/hyd_princip/symbol_directional1.php';
  const NAVY = 'https://engineeringlibrary.org/reference/hydraulics-basic-diagrams-and-systems-navy';

  // ---------- the valve's own state, advanced by one animation ----------
  const twv = (q, t) => (q.dur <= 0 || t >= q.t0 + q.dur ? q.to : t <= q.t0 ? q.from : K.lerp(q.from, q.to, K.ease((t - q.t0) / q.dur)));
  const curS = (m, t) => twv(m.row, t);
  function retarget(m, t) {
    const g = target(m);
    if (g === m.row.to) return;
    const c = curS(m, t);
    m.row = { from: c, to: g, t0: t, dur: 0.25 + 0.25 * Math.abs(g - c) };
  }
  function setCtr(m, k, t) { if (m.ctr === k) return; m.cOld = m.ctr; m.ctr = k; m.cAt = t; }
  const regNow = (m, t) => regime(inLine(curS(m, t)), m.ctr, m.x, m.leaks);
  // Screen 4 before its answer: the lines stay idle until the row has moved, so the picture gives nothing away.
  const quiet = (m, t) => !!m.quiet && (m.frozen || inLine(curS(m, t)) === 0);
  function newMain(o) {
    const m = Object.assign({ y1: 0, y2: 0, ctr: 0, leaks: 0, hand: null, x: 0.5, mark: 0.5, held: true, row: { from: 0, to: 0, t0: 0, dur: 0 }, ra: 0, cOld: 0, cAt: -9, frozen: false }, o);
    m.cOld = m.ctr;
    const r = regime(0, m.ctr, m.x, m.leaks);
    m.ra = r.pump === 'relief' && !m.quiet ? 1 : 0; m.held = !!r.held;
    return m;
  }
  function simMain(m, t, dt) {
    if (m.frozen) return;
    const r = regNow(m, t);
    if (r.rod) m.x = K.clamp(m.x + r.rod * (r.float ? VF : V) * dt, 0, 1);
    else if (r.creep) m.x = Math.max(0, m.x - CREEP * dt);
    const held = !!r.held;
    if (held && !m.held) m.mark = m.x;       // the mark: where the rod came to rest
    m.held = held;
    const rt = !quiet(m, t) && regNow(m, t).pump === 'relief' ? 1 : 0;
    if (m.ra < rt) m.ra = Math.min(rt, m.ra + dt / 0.3); else if (m.ra > rt) m.ra = Math.max(rt, m.ra - dt / 0.3);
  }
  function mainSteady(m, t) {
    if (m.frozen) return true;
    const r = regNow(m, t);
    return t >= m.row.t0 + m.row.dur && !r.rod && !r.creep && m.ra === (!quiet(m, t) && r.pump === 'relief' ? 1 : 0) && t >= m.cAt + 0.35;
  }
  function sched(st, t, fn) { st.ev.push([t, fn]); st.ev.sort((a, b) => a[0] - b[0]); }
  function light(st, k, t0, hold) { st.lights.push({ k, t0, hold }); st.until = Math.max(st.until, t0 + hold + 0.35); }
  const lightA = (st, k) => st.lights.reduce((a, L) => (L.k === k ? Math.max(a, K.arrive(st.t, L.t0, 0.25) * (1 - K.arrive(st.t, L.t0 + L.hold, 0.3))) : a), 0);
  const busy = (st) => st.ev.length > 0 || st.t < st.until || (!!st.m && !mainSteady(st.m, st.t));
  function advance(st, dt) {
    st.t += dt;
    while (st.ev.length && st.ev[0][0] <= st.t) { const e = st.ev.shift(); e[1](st, e[0]); }
    if (st.m) simMain(st.m, st.t, dt);
  }
  function settle(st) { let g = 0; while (busy(st) && g++ < 4000) advance(st, 0.05); }
  function trackV(q, t, dur) {
    let v = q[0][1];
    for (let j = 1; j < q.length; j++) { if (t <= q[j][0]) break; v = K.lerp(q[j - 1][1], q[j][1], K.ease(K.clamp((t - q[j][0]) / dur, 0, 1))); }
    return v;
  }

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  const CARDS = [
    { k: 'v32', name: '3/2 valve', does: 'Three ports, two positions. At rest P is blocked and A empties to T.' },
    { k: 'v52', name: '5/2 valve', does: 'For air. 1 is the supply, 2 and 4 the working lines, 3 and 5 the exhausts.' },
    { k: 'relief', name: 'Relief valve', does: 'Opens to the tank when the pressure beats its spring.' },
    { k: 'reduce', name: 'Reducing valve', does: 'Open at rest. It closes as the pressure after it reaches its setting.' },
    { k: 'check', name: 'Check valve', does: 'A ball against a seat. Flow passes one way only.' },
    { k: 'flow', name: 'Flow control', does: 'Pinches the line to set how fast the oil flows. The arrow means it can be adjusted.' },
  ];
  const STEPS = [
    { id: 'boxes', name: 'One box per position', show: true, view: 'main', sw: ['sol'],
      text: 'A valve that steers oil is drawn as a row of boxes. Each box is one position it can take. Only the box in line with the ports joins them. Each solenoid brings in the box beside it. Four ports and three boxes make this a *4/3 valve*.',
      read: 'A valve that steers oil is drawn as a row of boxes. Each box is one position it can take. Only the box in line with the ports joins them. Each solenoid brings in the box beside it. Four ports and three boxes make this a *4/3 valve*. Here three boxes sit in a row, with the four ports P, T, A and B against the middle one, labelled 4/3.',
      demo: (st) => { [0.3, 0.9, 1.5].forEach((t0, k) => light(st, 'b' + k, t0, 0.4)); ['P', 'T', 'A', 'B'].forEach((p, k) => light(st, p, 2.1 + 0.3 * k, 0.35)); st.lab43 = 3.4; st.until = Math.max(st.until, 3.95); } },
    { id: 'npos', name: 'Count the positions', kind: 'typed', view: 'two', field: 'pos', unit: 'positions',
      task: 'How many positions does this valve have?',
      answer: 2,
      slips: [{ value: 4, hint: 'That is the ports, which are the lines on the box. Count the boxes for the positions.' },
        { value: 1, hint: 'That is the box in use now. The valve can take any of its boxes.' }],
      hint: 'Each box is one position. Count the boxes.',
      want: '2 positions',
      why: 'Two boxes make two positions. With four ports, its label is 4/2. An intermediate switch works the same way. Its links run straight through in one position and cross over in the other.',
      after: (st) => { st.rings = [[0, st.t + 0.2], [1, st.t + 0.7]]; st.lab42 = st.t + 1.2; st.until = Math.max(st.until, st.t + 1.75); } },
    { id: 'slide', name: 'Slide the boxes', show: true, view: 'main', sw: ['sol'],
      text: 'Inside the valve, a grooved shaft called the *spool* slides in a fixed body. The row of boxes stands for it. The ports never move. Shifting the valve slides the row until another box sits against them. Energise -Y1 and the box beside it comes in. P joins A, B joins T, and the rod comes out. Tap -Y1.',
      read: 'Inside the valve, a grooved shaft called the *spool* slides in a fixed body. The row of boxes stands for it. The ports never move. Shifting the valve slides the row until another box sits against them. Energise -Y1 and the box beside it comes in. P joins A, B joins T, and the rod comes out. Here -Y1 is energised and the left box sits against the ports. Oil runs from P to A and from B to T, and the rod is coming out.',
      stillSet: (st) => { const m = st.m; m.y1 = 1; m.row = { from: 1, to: 1, t0: 0, dur: 0 }; m.x = 0.78; m.ra = 0; m.held = false; m.frozen = true; } },
    { id: 'which', name: 'Which box?', kind: 'pick', view: 'main', sw: ['sol'], init: { y2: 1, frozen: true, quiet: true },
      task: '-Y2 is energised. Where does the oil from P go now?',
      opts: ['To A', 'To B', 'Straight to T'], want: 'To B',
      hint: 'That is the left box, which -Y1 brings in. -Y2 brings in the box beside it.',
      hints: { 'To A': 'That is the left box, which -Y1 brings in. -Y2 brings in the box beside it.', 'Straight to T': 'That would need the middle box. Energising -Y2 slides the right box in.' },
      why: '-Y2 pushes the row over until the right box sits against the ports. Its crossed arrows join P to B and A to T, so the rod goes back in.',
      after: (st) => sched(st, st.t + 0.2, (s, t) => { s.m.frozen = false; retarget(s.m, t); }) },
    { id: 'springs', name: 'Springs bring it back', show: true, view: 'main', sw: ['sol'],
      text: 'A zigzag at each end is a *spring*. With both solenoids off, the springs push the middle box back against the ports. So the sheet draws the valve with its middle box against the ports. A notched bar is a *detent*. It would hold the valve in whatever box you leave it. Drag the row to one side and let go.',
      read: 'A zigzag at each end is a *spring*. With both solenoids off, the springs push the middle box back against the ports. So the sheet draws the valve with its middle box against the ports. A notched bar is a *detent*. It would hold the valve in whatever box you leave it. Here the springs have pushed the row back, so the middle box sits against the ports with both solenoids off.',
      demo: (st) => { sched(st, 0.4, (s, t) => { s.m.hand = 1; retarget(s.m, t); }); sched(st, 1.4, (s, t) => { s.m.hand = null; retarget(s.m, t); }); light(st, 'spr', 1.4, 0.6); } },
    { id: 'detent', name: 'Let go of the lever', kind: 'pick', view: 'levers',
      task: 'You push both levers to the left box and let go. Which valve stays in the left box?',
      opts: ['The one with zigzags at its ends', 'The one with the notched bar', 'Both of them'], want: 'The one with the notched bar',
      hint: 'Only one of them has springs. Look at what each has at its ends.',
      hints: { 'The one with zigzags at its ends': 'A zigzag is a spring. It pushes the valve back to its middle box once you let go.', 'Both of them': 'Only one of them has springs. Look at what each has at its ends.' },
      why: 'The springs push the first valve back to its middle box. The detent holds the second wherever it was left. It stays in the left box until someone moves the lever.',
      after: (st) => { const t = st.t; st.lv1 = [[-1, 0], [t + 0.2, 1], [t + 1.3, 0]]; st.lv2 = [[-1, 0], [t + 0.2, 1]]; light(st, 'spr', t + 1.3, 0.5); st.until = Math.max(st.until, t + 1.9); } },
    { id: 'centre', name: 'The middle box', show: true, view: 'main', sw: ['sol', 'ctr'],
      text: "The middle box decides what happens at rest. Closed blocks all four ports, so the rod holds. With a fixed pump, its oil then goes over the relief valve. Closed keeps full pressure at P, ready for other valves. P to T sends the oil back to the tank at low pressure. That spares the pump from pushing against the relief valve. Float lets the load move the rod. Pick each centre.",
      read: "The middle box decides what happens at rest. Closed blocks all four ports, so the rod holds. With a fixed pump, its oil then goes over the relief valve. Closed keeps full pressure at P, ready for other valves. P to T sends the oil back to the tank at low pressure. That spares the pump from pushing against the relief valve. Float lets the load move the rod. Here the P to T centre is in place. The rod holds, and the pump unloads to the tank.",
      demo: (st) => { sched(st, 0.8, (s, t) => setCtr(s.m, 1, t)); } },
    { id: 'readc', name: 'Read the centre', kind: 'pick', view: 'lonec', sw: ['ctr'],
      task: 'Both solenoids are off and the pump runs. What do the cylinder and the pump do?',
      opts: ['The rod holds, and the pump unloads to the tank', "The rod holds, and the pump's oil goes over the relief valve", 'The rod floats, and the pump unloads to the tank'],
      want: 'The rod holds, and the pump unloads to the tank',
      hint: 'Look at P. Its line runs straight to T, so the oil has an easy way back.',
      hints: { "The rod holds, and the pump's oil goes over the relief valve": 'Look at P. Its line runs straight to T, so the oil has an easy way back.', 'The rod floats, and the pump unloads to the tank': 'A and B each end in a bar, so they are blocked. Blocked lines hold the rod.' },
      why: "The line joins P to T, so the pump's oil returns to the tank at low pressure. The bars block A and B. The oil in the cylinder has nowhere to go, so the rod holds.",
      after: (st) => { const m = st.m; m.ctr = 1; m.cOld = 1; m.ra = 0; st.swap = st.t + 0.1; st.until = Math.max(st.until, st.swap + 0.75); } },
    { id: 'creep', name: 'Held is not sealed', show: true, view: 'main', sw: ['sol', 'ctr', 'leaks'], mark: true,
      text: 'A closed box is drawn sealed. A real spool leaks a little between its ports. So a cylinder holding a load can creep. The symbol shows the ideal valve, not its leaks. Here the creep is sped up. Switch Leaks on and watch the rod.',
      read: 'A closed box is drawn sealed. A real spool leaks a little between its ports. So a cylinder holding a load can creep. The symbol shows the ideal valve, not its leaks. Here the creep is sped up. Here the Closed centre holds the load, and the rod has crept a little back in, below the mark where it stopped.',
      stillSet: (st) => { const m = st.m; m.leaks = 1; m.x = 0.38; m.mark = 0.5; m.frozen = true; } },

    fb.className = 'fb' + (right && !st.shown ? ' right' : '');
    write(fb, f);
    const why = el('why');
    why.hidden = !!d.show || !st.why;
    write(why, d.show ? '' : d.why);
    whyBtn.setLabel(st.why ? 'Hide why' : 'Why?');
    // a typed puzzle's Why? states the figure, so it shows only once he has answered
    whyBtn.el.hidden = d.kind === 'typed' && st.res !== 'right' && st.res !== 'wrong';

    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !right);
    nextBtn.setLabel(i === STEPS.length - 1 ? 'Finish' : 'Continue');
    el('nav').hidden = backBtn.el.hidden && nextBtn.el.hidden;
    paint();
    if (busy(st)) play();
  });

  // ---------- known answers, worked out by hand ----------
  const runFor = (st, secs) => { for (let t = 0; t < secs - 1e-9; t += 0.05) advance(st, 0.05); return st; };
  K.check('Each solenoid brings in the box beside it, and with both off the springs bring the middle box back', () => {
    const st = settleOf(fresh(I.springs));
    return target({ y1: 1, y2: 0, hand: null }) === 1 && target({ y1: 0, y2: 1, hand: null }) === -1 && target({ y1: 0, y2: 0, hand: null }) === 0 &&
      inLine(curS(st.m, st.t)) === 0 && st.m.hand === null;
  });
  function settleOf(st) { settle(st); return st; }
  K.check('The left box joins P to A and B to T, so the rod comes out; the right box joins P to B and A to T, so it goes back in', () =>
    JOINS.par.join() === 'PA,BT' && JOINS.cross.join() === 'PB,AT' && regime(1, 0, 0.5, 0).rod === 1 && regime(-1, 0, 0.5, 0).rod === -1 &&
    flowTags(1, 0, regime(1, 0, 0.5, 0)).join() === 'PA,BT' && flowTags(-1, 0, regime(-1, 0, 0.5, 0)).join() === 'PB,AT');
  K.check('With the supply connected to the piston side and the rod side exhausted, the pressure on the piston side advances the rod', () =>
    PISTON === 'A' && RODSIDE === 'B' && JOINS.par.indexOf('P' + PISTON) >= 0 && JOINS.par.indexOf(RODSIDE + 'T') >= 0 && regime(1, 0, 0.3, 0).rod === 1 && regime(1, 0, 0.3, 0).pump === 'feed');
  K.check('Closed holds the rod and sends the oil over the relief valve; P to T holds it and unloads the pump; Float blocks P and lets the load push the rod in', () => {
    const c = regime(0, 0, 0.5, 0), p = regime(0, 1, 0.5, 0), f = regime(0, 2, 0.5, 0);
    return c.rod === 0 && c.pump === 'relief' && p.rod === 0 && p.pump === 'unload' && f.rod === -1 && f.pump === 'relief' && JOINS.float.join() === 'AT,BT';
  });
  K.check('With -Y1 on, the rod is coming out within a second; at the end of its travel the oil goes over the relief valve with -Y1 still on', () => {
    const st = fresh(I.slide);
    st.m.y1 = 1; retarget(st.m, 0);
    runFor(st, 1);
    const early = st.m.x > 0.5 && inLine(curS(st.m, st.t)) === 1;
    settle(st);
    return early && st.m.x === 1 && st.m.y1 === 1 && regNow(st.m, st.t).pump === 'relief';
  });
  K.check('Leaks off, a held rod stays exactly where it stopped; Leaks on, it creeps back in below its mark, and in time all the way', () => {
    const a = fresh(I.creep), b = fresh(I.creep), c = fresh(I.creep);
    b.m.leaks = 1; c.m.leaks = 1;
    runFor(a, 3); runFor(b, 3); settle(c);
    return a.m.x === 0.5 && a.m.mark === 0.5 && b.m.mark === 0.5 && b.m.x < b.m.mark - 0.1 && c.m.x === 0;
  });
  K.check('A 4-way, two-position valve has 4 pipe connections, pressure, return, A and B, and two switched positions: the screen 2 valve has ports P, T, A and B on two boxes', () =>
    TWO.ports.length === 4 && TWO.ports.join() === 'P,T,A,B' && TWO.boxes.length === 2 && STEPS[I.npos].answer === TWO.boxes.length, { source: E4 });
  K.check('Each symbol is drawn in its normal or neutral condition: at rest the main valve shows its middle box against the ports, and the 3/2 and the screen 2 valve the box beside their spring', () => {
    const st = settleOf(fresh(I.boxes));
    return inLine(curS(st.m, st.t)) === 0 && V32.rest === V32.spring && TWO.rest === TWO.spring && trackV(fresh(I.s32).s32, 9, 0.5) === 0;
  }, { source: NAVY });
  K.check('Worked by hand: the screen 2 valve has 2 positions (slips 4 and 1), and the 5/2 has 1 + 2 + 2 = 5 ports (slips 2, 3 and 4); the typed fields ask exactly these', () => {
    const a = STEPS[I.npos], b = STEPS[I.n52], sl = (d) => d.slips.map((x) => x.value).join();
    return a.answer === 2 && sl(a) === '4,1' && b.answer === 5 && sl(b) === '2,3,4' && P52.supply.concat(P52.work, P52.exh).sort().join() === '1,2,3,4,5' &&
      ANS[I.npos].spec.answer === 2 && ANS[I.n52].spec.answer === 5 && a.want === '2 positions' && b.want === '5 ports';
  });
  K.check('Before an answer nothing gives it away: puzzles open with no switches, rings or numbers; on screen 4 the row has not moved and its lines are idle, and on screen 10 Leaks is off', () => {
    const w = fresh(I.which);
    return DO.every((i) => { const d = STEPS[i], st = fresh(i); return !swOnFor(d, st) && !st.rings.length && !st.nums.length && st.swap == null && st.lab42 == null && trackV(st.s32, 9, 0.5) === 0 && trackV(st.lv1, 9, 0.5) === 0; }) &&
      w.m.y2 === 1 && w.m.frozen && inLine(curS(settleOf(w).m, w.t)) === 0 && fresh(I.hold).m.leaks === 0 && quiet(fresh(I.which).m, 0) && !quiet(fresh(I.slide).m, 0);
  });
  K.check("Every demonstration settles within 4.5 s, and every answer's motion within 3 s, except the creep on screen 10, which runs until the rod is fully in", () =>
    STEPS.every((d, i) => {
      if (d.show) return !d.demo || d.dur <= 4.5;
      const st = fresh(i);
      st.res = 'right';
      if (d.after) d.after(st);
      let t = 0;
      while (busy(st) && t < 30) { advance(st, 0.05); t += 0.05; }
      return d.id === 'hold' ? st.m.x === 0 : t <= 3;
    }));

  K.ready();
</script>
