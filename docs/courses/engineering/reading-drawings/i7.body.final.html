<script>
  // ---------- the rule: water flows only along a path open all the way through a running pump ----------
  const SRC_DOE = 'https://www.online-pdh.com/file.php/221/CFD_SG.pdf';
  const SRC_HSE = 'https://files.engineering.com/files/a01e329a-ec1b-42f7-a8fb-7a3bb8ea235c/hsg253_safe_isolation.pdf';
  const H0 = 30, KQ = 0.04, Q0 = Math.sqrt(200);                  // the pump curve, head = 30 − 0.04q²; valve open, it settled at q² = 200
  const head = (q) => H0 - KQ * q * q;
  const TVSET = ['to cooler', 'some each way', 'full bypass'];
  const NUM = ['No', 'One', 'Two', 'Three', 'Four', 'Five', 'Six'];
  const EXT = { valve: 8, nrv: 7, pump: 14, hx: 14, strainer: 9, tv: 9, equip: 40, j: 0, tank: 0 };   // how far each part runs along its pipe
  const UP = [0, -1], DOWN = [0, 1], RIGHT = [1, 0];
  const U_SHUT = true;                                            // the plant's untagged valve, on the header tank's line, is shut

  // Each sheet: its parts and the pipes between them. A part's sides: a is where water comes in by
  // design, b where it leaves (a pump's suction and outlet); TV1 has i (in), c (to the cooler), p (to the bypass).
  const COOL = {
    H: 590,
    items: {
      V1: { k: 'valve', x: 130, y: 497, o: 'v' }, P1: { k: 'pump', x: 130, y: 462, d: UP }, NR1: { k: 'nrv', x: 130, y: 428, d: UP }, V2: { k: 'valve', x: 130, y: 398, o: 'v' },
      V3: { k: 'valve', x: 220, y: 497, o: 'v' }, P2: { k: 'pump', x: 220, y: 462, d: UP }, NR2: { k: 'nrv', x: 220, y: 428, d: UP }, V4: { k: 'valve', x: 220, y: 398, o: 'v' },
      TV1: { k: 'tv', x: 300, y: 330 }, V7: { k: 'valve', x: 300, y: 292, o: 'v' }, HX1: { k: 'hx', x: 300, y: 252 }, V8: { k: 'valve', x: 300, y: 212, o: 'v' },
      EQ: { k: 'equip', x: 150, y: 124 }, HT1: { k: 'tank', x: 72, y: 62 }, V5: { k: 'valve', x: 40, y: 230, o: 'v' }, S1: { k: 'strainer', x: 40, y: 310 },
      sh: { k: 'j', x: 130, y: 520, dot: 1 }, dh: { k: 'j', x: 220, y: 376, dot: 1 }, M: { k: 'j', x: 300, y: 186, dot: 1 }, T: { k: 'j', x: 72, y: 124, dot: 1 },
    },
    pipes: [
      ['sS', 'S1.b', 'sh', [[40, 310], [40, 520], [130, 520]]],
      ['s1', 'sh', 'V1.a', [[130, 520], [130, 497]]],
      ['a1', 'V1.b', 'P1.a', [[130, 497], [130, 462]]],
      ['b1', 'P1.b', 'NR1.a', [[130, 462], [130, 428]]],
      ['c1', 'NR1.b', 'V2.a', [[130, 428], [130, 398]]],
      ['d1', 'V2.b', 'dh', [[130, 398], [130, 376], [220, 376]]],
      ['s2', 'sh', 'V3.a', [[130, 520], [220, 520], [220, 497]]],
      ['a2', 'V3.b', 'P2.a', [[220, 497], [220, 462]]],
      ['b2', 'P2.b', 'NR2.a', [[220, 462], [220, 428]]],
      ['c2', 'NR2.b', 'V4.a', [[220, 428], [220, 398]]],
      ['d2', 'V4.b', 'dh', [[220, 398], [220, 376]]],
      ['up', 'dh', 'TV1.i', [[220, 376], [300, 376], [300, 330]]],
      ['k7', 'TV1.c', 'V7.a', [[300, 330], [300, 292]]],
      ['hx', 'V7.b', 'HX1.a', [[300, 292], [300, 252]]],
      ['k8', 'HX1.b', 'V8.a', [[300, 252], [300, 212]]],
      ['m8', 'V8.b', 'M', [[300, 212], [300, 186]]],
      ['by', 'TV1.p', 'M', [[300, 330], [228, 330], [228, 186], [300, 186]]],
      ['top', 'M', 'EQ.a', [[300, 186], [300, 124], [150, 124]]],
      ['ret', 'EQ.b', 'T', [[150, 124], [72, 124]]],
      ['ht', 'T', 'HT1', [[72, 124], [72, 62]]],
      ['v5', 'T', 'V5.a', [[72, 124], [40, 124], [40, 230]]],
      ['s5', 'V5.b', 'S1.a', [[40, 230], [40, 310]]],
    ],
  };
  const FUEL = {
    H: 366,
    items: {
      T1: { k: 'tank', x: 60, y: 64 }, F1: { k: 'valve', x: 60, y: 96, o: 'v' }, T2: { k: 'tank', x: 250, y: 64 }, F2: { k: 'valve', x: 250, y: 96, o: 'v' },
      X1: { k: 'valve', x: 160, y: 140, o: 'h' }, J: { k: 'j', x: 60, y: 140, dot: 1 }, S2: { k: 'strainer', x: 60, y: 186 }, P3: { k: 'pump', x: 60, y: 236, d: DOWN },
      NR3: { k: 'nrv', x: 130, y: 290, d: RIGHT }, F3: { k: 'valve', x: 190, y: 290, o: 'h' }, DT: { k: 'tank', x: 240, y: 290 },
    },
    pipes: [
      ['t1', 'T1', 'F1.a', [[60, 64], [60, 96]]],
      ['f1', 'F1.b', 'J', [[60, 96], [60, 140]]],
      ['t2', 'T2', 'F2.a', [[250, 64], [250, 96]]],
      ['f2', 'F2.b', 'X1.a', [[250, 96], [250, 140], [160, 140]]],
      ['x1', 'X1.b', 'J', [[160, 140], [60, 140]]],
      ['js', 'J', 'S2.a', [[60, 140], [60, 186]]],
      ['sp', 'S2.b', 'P3.a', [[60, 186], [60, 236]]],
      ['pn', 'P3.b', 'NR3.a', [[60, 236], [60, 290], [130, 290]]],
      ['nf', 'NR3.b', 'F3.a', [[130, 290], [190, 290]]],
      ['fd', 'F3.b', 'DT', [[190, 290], [240, 290]]],
    ],
  };
  // The middle of the longest piece of a pipe that is clear of the parts at its ends: where its arrow goes.
  function arrowAt(S, e) {
    const P = e.pts.map((q) => q.slice()), n = P.length;
    const trim = (A, B, d) => { const L = Math.hypot(B[0] - A[0], B[1] - A[1]) || 1, f = Math.min(d, L) / L; return [A[0] + (B[0] - A[0]) * f, A[1] + (B[1] - A[1]) * f]; };
    P[0] = trim(P[0], P[1], EXT[S.items[e.a.n].k]);
    P[n - 1] = trim(P[n - 1], P[n - 2], EXT[S.items[e.b.n].k]);
    let best = 0, bl = -1;
    for (let k = 0; k < n - 1; k++) { const L = Math.hypot(P[k + 1][0] - P[k][0], P[k + 1][1] - P[k][1]); if (L > bl) { bl = L; best = k; } }
    const A = P[best], B = P[best + 1], L = bl || 1;
    return { x: (A[0] + B[0]) / 2, y: (A[1] + B[1]) / 2, ux: (B[0] - A[0]) / L, uy: (B[1] - A[1]) / L };
  }
  function build(S) {
    S.E = {}; S.att = {};
    Object.keys(S.items).forEach((n) => { S.att[n] = []; });
    const ref = (r) => { const p = r.split('.'); return { n: p[0], s: p[1] || 'j' }; };
    S.pipes = S.pipes.map((q) => {
      const e = { id: q[0], a: ref(q[1]), b: ref(q[2]), pts: q[3] };
      S.E[e.id] = e;
      S.att[e.a.n].push({ e: e.id, side: e.a.s, end: 'a' });
      S.att[e.b.n].push({ e: e.id, side: e.b.s, end: 'b' });
      return e;
    });
    S.pipes.forEach((e) => { e.arw = arrowAt(S, e); });
    return S;
  }
  build(COOL); build(FUEL);
  const SH = { cool: COOL, fuel: FUEL };
  const PICK = { cool: ['P1', 'P2', 'S1', 'HX1'], fuel: ['S2', 'P3'] };
  const P2B = ['s2', 'a2', 'b2', 'c2', 'd2'];                    // P2's branch, from the suction header to the discharge header

  function newM() {
    return {
      sheet: 'cool', iso: 0, part: null, plant: 0, quiet: 0, hide: null, ghost: 0,
      cool: { v: { V1: 1, V2: 1, V3: 1, V4: 1, V5: 1, V7: 1, V8: 1 }, run: { P1: 1, P2: 0 }, tv: 0 },
      fuel: { v: { F1: 1, F2: 1, F3: 1, X1: 0 }, run: { P3: 1 }, tv: 0, lock: 0 },
    };
  }
  // Can water go into part n by side sIn and out by side sOut?
  function pass(S, c, n, sIn, sOut) {
    const it = S.items[n];
    if (it.k === 'j') return true;
    if (it.k === 'tank' || sIn === sOut) return false;
    if (it.k === 'valve') return !!c.v[n];
    if (it.k === 'nrv') return (!!c.noNR && !!c.noNR[n]) || (sIn === 'a' && sOut === 'b');
    if (it.k === 'pump') return !c.run[n] || (sIn === 'a' && sOut === 'b');   // a stopped pump passes water through its casing
    if (it.k === 'tv') { const p = [sIn, sOut].sort().join(''); return p === 'ci' ? c.tv <= 1 : p === 'ip' ? c.tv >= 1 : false; }
    return true;
  }
  // Every path that visits no part twice, from part `from` (leaving by `side`) until goal(part, side in).
  function walk(S, c, from, side, goal, found) {
    const seen = {}, path = [];
    seen[from] = true;
    const go = (n, sIn, eIn) => {
      if (goal(n, sIn)) { found(path.slice()); return; }
      if (seen[n]) return;
      seen[n] = true;
      S.att[n].forEach((at) => { if (at.e !== eIn && pass(S, c, n, sIn, at.side)) step(at); });
      seen[n] = false;
    };
    const step = (at) => {
      const e = S.E[at.e], fwd = at.end === 'a', far = fwd ? e.b : e.a;
      path.push([e.id, fwd ? 1 : -1]);
      go(far.n, far.s, e.id);
      path.pop();
    };
    S.att[from].forEach((at) => { if (!side || at.side === side) step(at); });
  }
  // Which pipes carry flow, which way, how far along from the pump, and what each pump is doing.
  function flowOf(m) {
    const S = SH[m.sheet], c = m[m.sheet], lit = {}, depth = {}, pumps = {}, src = [];
    const add = (p) => p.forEach((q, k) => { lit[q[0]] = q[1]; depth[q[0]] = Math.min(depth[q[0]] == null ? 99 : depth[q[0]], k); });
    if (m.sheet === 'cool') {
      ['P1', 'P2'].forEach((p) => {
        if (!c.run[p]) { pumps[p] = 'stopped'; return; }
        let any = false;
        walk(S, c, p, 'b', (n, s) => n === p && s === 'a', (path) => { any = true; add(path); });
        pumps[p] = any ? 'push' : 'dead';
      });
    } else if (!c.run.P3) pumps.P3 = 'stopped';
    else {
      ['T1', 'T2'].forEach((t) => { let any = false; walk(S, c, t, null, (n) => n === 'DT', (path) => { any = true; add(path); }); if (any) src.push(t); });
      pumps.P3 = src.length ? 'push' : 'dead';
    }
    return { lit, depth, pumps, src };
  }
  // Isolate mode: from the part, every pipe out to the first hand valve on it (non-return valves and
  // pumps count as open). A pipe shows red while that valve is open.
  function isoOf(m) {
    const S = SH[m.sheet], c = m[m.sheet], part = m.part, prev = {}, seen = {}, q = [part], doors = [];
    seen[part] = true;
    while (q.length) {
      const n = q.shift();
      S.att[n].forEach((at) => {
        const e = S.E[at.e], far = at.end === 'a' ? e.b : e.a;
        if (seen[far.n]) return;
        seen[far.n] = true; prev[far.n] = [e.id, n];
        const k = S.items[far.n].k;
        if (k === 'valve' || k === 'tv' || k === 'tank') doors.push(far.n); else q.push(far.n);
      });
    }
    const red = {}, open = [];
    let viaNR = false;
    doors.forEach((d) => {
      if (S.items[d].k === 'valve' && !c.v[d]) return;
      open.push(d);
      for (let n = d; n !== part; n = prev[n][1]) { red[prev[n][0]] = 1; if (S.items[n].k === 'nrv') viaNR = true; }
    });
    return { red, open, doors, viaNR };
  }

  // ---------- each screen's state, advanced by one animation ----------
  const twv = (q, t) => (q.dur <= 0 || t >= q.t0 + q.dur ? q.to : t <= q.t0 ? q.from : K.lerp(q.from, q.to, K.ease((t - q.t0) / q.dur)));
  const approach = (v, g, s) => (v < g ? Math.min(g, v + s) : Math.max(g, v - s));
  const mk = (o) => Object.assign({ t: 0, ev: [], until: 0, lights: [], rings: {}, L: {}, q: null, m: null, F: null, R: null, ghostAt: null }, o);
  function light(st, k, t0, hold) { st.lights.push({ k, t0, hold }); st.until = Math.max(st.until, t0 + hold + 0.35); }
  const lightA = (st, k) => st.lights.reduce((a, L) => (L.k === k ? Math.max(a, K.arrive(st.t, L.t0, 0.25) * (1 - K.arrive(st.t, L.t0 + L.hold, 0.3))) : a), 0);
  function ring(st, id, delay) { st.rings[id] = st.t + delay; st.until = Math.max(st.until, st.t + delay + 0.45); }
  // Work out the flow and the red pipes again; newly lit pipes light in turn, outward from the pump.
  function relight(st, instant) {
    const m = st.m;
    if (!m) return;
    const S = SH[m.sheet], F = flowOf(m), R = m.iso && m.part && !m.noRed ? isoOf(m) : null;
    st.F = F; st.R = R;
    S.pipes.forEach((e) => {
      const key = m.sheet + e.id, L = st.L[key] || (st.L[key] = { f: 0, fg: 0, fs: 0, dir: 1, r: 0, rg: 0 });
      const on = F.lit[e.id] && !m.quiet && !(m.hide && m.hide.indexOf(e.id) >= 0) ? 1 : 0;
      if (on) L.dir = F.lit[e.id];
      if (on !== L.fg) { L.fg = on; L.fs = on && !instant ? st.t + 0.05 + 0.06 * F.depth[e.id] : st.t; }
      L.rg = R && R.red[e.id] ? 1 : 0;
      if (instant) { L.f = L.fg; L.r = L.rg; }
    });
  }
  const moving = (st) => Object.keys(st.L).some((k) => st.L[k].f !== st.L[k].fg || st.L[k].r !== st.L[k].rg);
  const busy = (st) => st.ev.length > 0 || st.t < st.until || moving(st) || (!!st.q && st.q.from !== st.q.to && st.t < st.q.t0 + st.q.dur);

        if (st.tries >= 2) { st.res = 'right'; st.shown = true; st.why = true; st.fbText = (r.hint ? r.hint + ' ' : '') + 'Here is the working.'; ANS[i].reveal(); afterRight(i); }
        else { st.res = 'wrong'; st.fbText = r.hint || d.hint; }
      } else { st.res = null; st.fbText = ''; }
      K.refresh();
    } });
  });
  const checkBtn = K.button({ label: 'Check', into: '#acts', press: () => {
    const i = at(), d = STEPS[i], st = S[i];
    if (finished || d.show || st.res === 'right') return;
    if (d.kind === 'typed') { ANS[i].check(); return; }
    if (d.kind === 'taps') {
      const c = st.m.cool, shut = Object.keys(c.v).filter((k) => !c.v[k]).sort().join();
      st.m.noRed = 0; relight(st, false);
      if (shut === d.shut.join()) { st.res = 'right'; afterRight(i); } else st.res = 'wrong';
      return;
    }
    if (st.pick == null) { st.res = 'empty'; return; }
    const ok = d.kind === 'plantpick' ? st.pick === d.ans : st.pick === d.want;
    if (ok) { st.res = 'right'; afterRight(i); } else st.res = 'wrong';
  } });
  const whyBtn = K.button({ label: 'Why?', secondary: true, into: '#acts', press: () => {
    const i = at();
    if (finished || STEPS[i].show || whyBtn.el.hidden) return;
    S[i].why = !S[i].why;
  } });
  const replayBtn = K.button({ label: 'Play again', secondary: true, into: '#tools', press: () => {
    const i = at(), d = STEPS[i];
    if (finished || !d.show || !d.demo) return;
    S[i] = fresh(i);
  } });
  const backBtn = K.button({ label: 'Back', secondary: true, into: '#nav', press: () => {
    if (finished) { finished = false; return; }
    stepper.set(Math.max(0, at() - 1), true);
  } });
  const nextBtn = K.button({ label: 'Continue', into: '#nav', press: () => {
    const i = at();
    if (finished || (!STEPS[i].show && S[i].res !== 'right')) return;
    if (i < STEPS.length - 1) { stepper.set(i + 1, true); return; }
    finished = true;
    if (typeof K.complete === 'function') K.complete();
  } });
  K.button({ label: 'Start again', secondary: true, into: '#again', press: () => {
    S = STEPS.map((d, i) => fresh(i));
    Object.keys(ANS).forEach((k) => ANS[k].reset());
    finished = false; lastStep = -1; stepper.set(0, true);
  } });
  // A demonstration's still is its finished picture, in the state its sentence ends on; a puzzle's
  // still is its answered picture, with the motion after the answer settled.
  STEPS.forEach((d, i) => {
    if (d.show) d.still = () => { S[i] = fresh(i); settle(S[i]); if (d.stillSet) { d.stillSet(S[i].m); relight(S[i], true); } settle(S[i]); anim.pause(); K.refresh(); };
    else d.still = () => {
      const st = S[i];
      if (st.res !== 'right') {
        if (d.kind === 'pick') st.pick = d.want;
        if (d.kind === 'plantpick') st.pick = d.ans;
        if (d.kind === 'taps') { d.shut.forEach((k) => { st.m.cool.v[k] = 0; }); st.m.noRed = 0; relight(st, true); }
        if (d.kind === 'typed') { ANS[i].reveal(); st.fbText = d.right || "That's it."; }
        st.res = 'right'; afterRight(i);
      }
      settle(st); anim.pause(); K.refresh();
    };
  });

  // One animation plays each demonstration, the flow lighting along its path, and the motion after an
  // answer; with reduced motion (and while the self-test looks) everything settles at once.
  const anim = K.anim({ button: false, label: 'Demonstration', step: (dt) => {
    if (finished) return false;
    const st = S[at()];
    advance(st, Math.min(dt, 0.1));
    paint();
    return busy(st);
  } });
  function play() {
    const st = S[at()];
    if (REDUCE || testing()) { settle(st); anim.pause(); paint(); return; }
    if (!anim.playing()) anim.play();
  }
  function enter(id) {
    if (REDUCE) return;
    const box = el(id);
    box.classList.remove('enter'); void box.offsetWidth; box.classList.add('enter');
  }

  // ---------- the page ----------
  function paint() {
    const i = at(), d = STEPS[i], st = S[i];
    const view = d.view === 'curve' ? 'curve' : st.m.sheet;
    if (view !== hitView) buildHits(view);
    art.textContent = '';
    let H = 222, alt;
    if (view === 'curve') alt = drawCurve(art, st);
    else if (view === 'cool') { H = COOL.H; alt = drawCool(art, st, d); }
    else { H = FUEL.H; alt = drawFuel(art, st, d); }
    sceneSvg.setAttribute('viewBox', '0 0 340 ' + H);
    sceneSvg.setAttribute('aria-label', alt);
    sceneSvg.classList.toggle('tappable', tapOk(d, st, 'draw'));
    // the plant sketch, beside the drawing when Plant is on
    const pf = el('plantfig'), showP = !!st.m && st.m.sheet === 'cool' && !!st.m.plant;
    if (showP && pf.hidden && plantAt === i) enter('plantfig');
    pf.hidden = !showP; plantAt = i;
    if (showP) { partG.textContent = ''; drawPlant(partG, st); plantSvg.classList.toggle('tappable', tapOk(d, st, 'plant')); }
    if (st.m) paintCtl(st.m);
    setSay(sayFor(i));
    // a demonstration's words fade in as its motion settles
    K.fade(el('say'), d.show && d.dur > 0.6 && !st.touched ? K.arrive(st.t, d.dur - 0.45, 0.4) : 1, 3);
  }
  write(el('finish'), FINISH);
  K.update((p) => {
    const i = K.clamp(Math.round(p.step), 0, STEPS.length - 1), d = STEPS[i];
    if (i !== lastStep) {
      lastStep = i; enter('stepbox'); lastSay = null;
      if (d.show) S[i] = fresh(i); else if (busy(S[i])) settle(S[i]);
      if (!busy(S[i])) anim.pause();
    }
    if (finished !== lastDone) { lastDone = finished; enter(finished ? 'done' : 'stepbox'); }
    const st = S[i], right = st.res === 'right';
    el('stepbox').hidden = finished;
    el('done').hidden = !finished;
    el('count').textContent = 'Screen ' + (i + 1) + ' of ' + STEPS.length;
    const task = el('task');
    task.className = 'task' + (d.show ? ' show' : '');
    write(task, d.show ? d.text : d.task);

    // a puzzle's tabs and switches take no room until he has answered, then grow in
    const on = swOnFor(d, st), ctl = el('ctl'), grow = on && ctl.hidden && ctlAt === i;
    ctl.hidden = !on; ctlAt = i;
    if (grow) enter('ctl');

    replayBtn.el.hidden = !d.show || !d.demo || REDUCE;
    el('tools').hidden = replayBtn.el.hidden;
    const opts = d.kind === 'pick' ? d.opts : [];
    el('picks').hidden = !opts.length;
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      b.el.textContent = '';
      write(b.el.appendChild(K.el('span', { class: 'opt' })), opts[k]);
      b.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });
    Object.keys(BOX).forEach((k) => { BOX[k].hidden = +k !== i; });
    el('ansbox').hidden = d.kind !== 'typed';

    el('acts').hidden = !!d.show;
    checkBtn.el.hidden = right;
    const fb = el('fb');
    fb.hidden = !!d.show;
    let f = '';
    if (!d.show) {
      if (d.kind === 'typed') f = st.fbText;
      else if (right) f = "That's it.";
      else if (st.res === 'wrong') f = d.kind === 'taps' ? tapsHint(st) : d.kind === 'plantpick' ? d.hint : (d.hints && d.hints[st.pick]) || d.hint;
      else if (st.res === 'empty') f = d.kind === 'plantpick' ? 'Tap one of the valves on the plant sketch.' : 'Tap one of the answers.';
    }
    fb.className = 'fb' + (right && !st.shown ? ' right' : '');
    write(fb, f);
    const why = el('why');
    why.hidden = !!d.show || !st.why;
    write(why, d.show ? '' : d.why);
    whyBtn.setLabel(st.why ? 'Hide why' : 'Why?');
    // a typed puzzle's Why? states the figure, so it shows only once he has answered
    whyBtn.el.hidden = d.kind === 'typed' && st.res !== 'right' && st.res !== 'wrong';

    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !right);
    nextBtn.setLabel(i === STEPS.length - 1 ? 'Finish' : 'Continue');
    el('nav').hidden = backBtn.el.hidden && nextBtn.el.hidden;
    paint();
    if (busy(st)) play();
  });

  // ---------- known answers, worked out by hand ----------
  const lineup = (o) => { const m = newM(); if (o) o(m); return m; };
  const LOOP = ['b1', 'c1', 'd1', 'up', 'k7', 'hx', 'k8', 'm8', 'top', 'ret', 'v5', 's5', 'sS', 's1', 'a1'];
  K.check('Unless otherwise stated, valves are drawn in their normal position, the primary flowpath: the cooling sheet opens with every valve open, one pump running, the other stopped, and the water lit through the cooler', () => {
    const m = newM(), c = m.cool, F = flowOf(m);
    return Object.keys(c.v).every((k) => c.v[k] === 1) && c.run.P1 === 1 && c.run.P2 === 0 && c.tv === 0 && F.pumps.P1 === 'push' && !!F.lit.k7 && !!F.lit.hx && !!F.lit.k8 && !F.lit.by;
  }, { source: SRC_DOE });
  K.check("Isolation points on the plant must match the line diagram: the plant sketch has exactly one valve the drawing lacks, on the header tank's line, and it is drawn shut", () => {
    const extra = Object.keys(PL).filter((k) => !COOL.items[k]), hl = PPIPES[1];
    return extra.length === 1 && extra[0] === 'U' && PL.U[0] === hl[0][0] && PL.U[0] === hl[1][0] && PL.U[1] > hl[0][1] && PL.U[1] < hl[1][1] && U_SHUT === true;
  }, { source: SRC_HSE });
  K.check('With P1 running and every valve open, water lights all the way round through the cooler; shut V7 and nothing is lit, and P1 runs against a shut valve', () => {
    const a = flowOf(newM()), b = flowOf(lineup((m) => { m.cool.v.V7 = 0; }));
    return LOOP.every((k) => a.lit[k] === 1) && Object.keys(a.lit).length === LOOP.length && !Object.keys(b.lit).length && b.pumps.P1 === 'dead';
  });
  K.check("NR2 stops water running back through the stopped P2: its branch stays dark, but with NR2 taken out, P1's water would run back through P2", () => {
    const a = flowOf(newM()), b = flowOf(lineup((m) => { m.cool.noNR = { NR2: 1 }; }));
    return P2B.every((k) => !a.lit[k]) && P2B.every((k) => b.lit[k] === -1);
  });
  K.check('TV1 always leaves an outlet open: at full bypass the water still goes round, through the bypass and not the cooler; some each way lights both', () => {
    const b = flowOf(lineup((m) => { m.cool.tv = 2; })), s = flowOf(lineup((m) => { m.cool.tv = 1; }));
    return b.pumps.P1 === 'push' && !!b.lit.by && !b.lit.k7 && !b.lit.hx && !!s.lit.by && !!s.lit.k7;
  });
  K.check("Whatever the lineup, no lit pipe ends at a shut valve, no water passes a non-return valve backwards, nothing flows with both pumps stopped, and the header tank's line never lights", () => {
    const names = ['V1', 'V2', 'V3', 'V4', 'V5', 'V7', 'V8'];
    for (let b = 0; b < 128; b++) for (let r = 0; r < 4; r++) for (let tv = 0; tv < 3; tv++) {
      const m = newM();
      names.forEach((n, k) => { m.cool.v[n] = (b >> k) & 1; });
      m.cool.run = { P1: r & 1, P2: (r >> 1) & 1 }; m.cool.tv = tv;
      const F = flowOf(m);
      if (F.lit.ht || (!r && Object.keys(F.lit).length)) return false;
      if (F.lit.b1 === -1 || F.lit.c1 === -1 || F.lit.b2 === -1 || F.lit.c2 === -1) return false;
      for (const id in F.lit) { const e = COOL.E[id]; if ([e.a, e.b].some((q) => COOL.items[q.n].k === 'valve' && !m.cool.v[q.n])) return false; }
    }
    return true;
  });
  K.check('Isolating P2 takes V3 and V4: with both shut no red is left; V3 alone leaves its discharge red through NR2 to V4, and V4 alone leaves its suction red to V3', () => {
    const iso = (sh) => isoOf(lineup((m) => { m.iso = 1; m.part = 'P2'; sh.forEach((k) => { m.cool.v[k] = 0; }); }));
    const a = iso([]), b = iso(['V3']), c = iso(['V4']), d = iso(['V3', 'V4']);
    return a.open.sort().join() === 'V3,V4' && b.open.join() === 'V4' && !!b.red.b2 && !!b.red.c2 && b.viaNR && c.open.join() === 'V3' && !!c.red.a2 && !c.red.b2 &&
      !d.open.length && !Object.keys(d.red).length && STEPS[I.iso].shut.join() === 'V3,V4';
  });
  K.check('On the fuel sheet, with F1 shut and F2 and X1 open, P3 draws from tank 2 only; with X1 shut, from tank 1 only; with P3 stopped, nothing moves', () => {
    const f = (o) => flowOf(lineup((m) => { m.sheet = 'fuel'; o(m.fuel); }));
    const a = f((c) => { c.v.F1 = 0; c.v.X1 = 1; }), b = f(() => {}), z = f((c) => { c.v.X1 = 1; c.run.P3 = 0; });
    return a.src.join() === 'T2' && !a.lit.t1 && !a.lit.f1 && !!a.lit.x1 && b.src.join() === 'T1' && !b.lit.x1 && !b.lit.f2 && !!b.lit.fd && !Object.keys(z.lit).length && z.pumps.P3 === 'stopped';
  });
  K.check('To open S2 with X1 open takes three valves, F1, X1 and F3; shutting X1 already cuts off tank 2, so F2 adds nothing; the field asks exactly this', () => {
    const iso = (sh) => isoOf(lineup((m) => { m.sheet = 'fuel'; m.iso = 1; m.part = 'S2'; m.fuel.v.X1 = 1; sh.forEach((k) => { m.fuel.v[k] = 0; }); }));
    const a = iso([]), b = iso(['F1', 'X1', 'F3']), c = iso(['F1', 'F2', 'F3']), d = STEPS[I.clean];
    return a.open.sort().join() === 'F1,F3,X1' && !b.open.length && c.open.join() === 'X1' && d.answer === 3 && d.slips.map((x) => x.value).join() === '1,2,4' && ANS[I.clean].spec.answer === 3 && d.want === '3';
  });
  K.check('Worked by hand: with the valve open, 30 − 0.04 × 200 = 22 m; shut, q = 0 and the head is 30 m; the slips are the open-valve head and no head at all', () => {
    const d = STEPS[I.valve];
    return K.near(head(Q0), 22, 1e-9) && head(0) === 30 && d.answer === 30 && d.slips.map((x) => x.value).join() === '22,0' && ANS[I.valve].spec.answer === 30 && d.want === '30 m';
  });
  K.check("Before an answer nothing gives it away: screens 3, 7 and 13 show no flow, screen 5 leaves P2's branch untraced, screen 9 shows no red and names no cut-off, screen 11 shows no ghost, screen 14 no red and no rings, and the say line names NR2 only from screen 5 on", () => {
    const dark = (i) => { const st = fresh(i); return !!st.m.quiet && Object.keys(st.L).every((k) => st.L[k].f === 0) && !statusLines(st, STEPS[i]).length; };
    const ok = DO.every((i) => { const st = fresh(i); return !swOnFor(STEPS[i], st) && !Object.keys(st.rings).length; });
    const b = fresh(I.back), s9 = fresh(I.iso), s11 = fresh(I.extra), s14 = fresh(I.clean), q = fresh(I.valve).q;
    const l9 = statusLines(s9, STEPS[I.iso]).join(' ');
    const nr = (i) => { const st = fresh(i); st.m.quiet = 0; relight(st, true); return coolSay(st, i).indexOf('NR2') >= 0; };
    return ok && dark(I.drawn) && dark(I.fail) && dark(I.which) && !Object.keys(s9.L).some((k) => s9.L[k].r > 0) && !s9.R && !nr(I.drawn) && !nr(I.path) && nr(I.back) && P2B.every((k) => b.L['cool' + k].f === 0) && b.L.coolup.f === 1 &&
      l9.indexOf('cut off') < 0 && l9.indexOf('still open') < 0 && !s11.m.ghost && !s14.m.iso && !Object.keys(s14.L).some((k) => s14.L[k].r > 0) && q.from === Q0 && q.to === Q0;
  });
  K.check('3-way valves are sometimes drawn in the position they fail to: the sheet carries Note 1 for TV1, its drawn setting is through the cooler, and the air-fails puzzle answers through the cooler', () => {
    const m = newM(), d = STEPS[I.fail];
    return m.cool.tv === 0 && TVSET[0] === 'to cooler' && d.want === 'Through the cooler' && d.opts.indexOf(d.want) >= 0;
  }, { source: SRC_DOE });
  K.check("Every demonstration settles within 4.5 s, and every answer's motion within 3 s", () =>
    STEPS.every((d, i) => {
      if (d.show) return d.dur <= 4.5;
      const st = fresh(i);
      st.res = 'right';
      if (d.after) d.after(st);
      let t = 0;
      while (busy(st) && t < 30) { advance(st, 0.05); t += 0.05; }
      return t <= 3;
    }));

  K.ready();
</script>
