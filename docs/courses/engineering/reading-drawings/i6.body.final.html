<script>
  // ---------- the rule: each solenoid brings in the box beside it; trace one path in and one path out ----------
  const BW = 44, BH = 38, VX = 90, VY = 262, MID = VY + BH / 2;   // the 4/3 valve's boxes; A and B, P and T sit at x 145 and 167
  const TRAV = 50, ROD = 90, XW = 0.8, X0 = 0.1;                  // piston travel, rod length; the ram meets the work at 0.8 of its travel
  const VDN = 0.25, VUP = 0.6, VA = 0.8;                          // travel per second: down past the flow control, up past the check valve, the air rod
  const AW = 56, HM = 494, HA = 476, HQ = 196;
  const PV = 6 * 300;                                             // pressure times volume for the shut-in air: 6 bar absolute times 300 cm³
  const PORT_TOP = 'A';                                           // A feeds the piston side, at the top of the upright cylinder
  const JOINS = { par: ['PA', 'BT'], cross: ['PB', 'AT'], ptt: ['PT'] };
  const NAVY = 'https://engineeringlibrary.org/reference/hydraulics-basic-diagrams-and-systems-navy';
  const PUMP = { feed: 'The pump is feeding the cylinder.', unload: 'The pump is unloading to the tank.', relief: "The pump's oil is going over the relief valve.", stopped: 'The pump is stopped.' };
  const ORD = ['Check valve', 'Flow control', 'Pump', '4/3 valve', 'Tank'];

  const twv = (q, t) => (q.dur <= 0 || t >= q.t0 + q.dur ? q.to : t <= q.t0 ? q.from : K.lerp(q.from, q.to, K.ease((t - q.t0) / q.dur)));
  const inLine = (s) => Math.round(s) || 0;                       // +1 the left box, 0 the middle, -1 the crossed box
  const target = (m) => (m.y1 ? 1 : m.y2 ? -1 : 0);
  const curS = (m, t) => twv(m.row, t), curA = (a, t) => twv(a.row, t);
  const approach = (v, g, s) => (v < g ? Math.min(g, v + s) : Math.max(g, v - s));
  // What the box in line does to the ram (+1 down, -1 up, 0 held) and to the pump's oil.
  function regime(box, x, run) {
    if (!run) return { ram: 0, pump: 'stopped' };
    if (box === 1) return x < XW - 1e-9 ? { ram: 1, pump: 'feed', split: true } : { ram: 0, pump: 'relief' };
    if (box === -1) return x > 1e-9 ? { ram: -1, pump: 'feed' } : { ram: 0, pump: 'relief' };
    return { ram: 0, pump: 'unload' };
  }
  // The gauge, as a share of the way to its relief mark.
  const gaugeT = (r) => (r.pump === 'stopped' ? 0 : r.pump === 'unload' ? 0.05 : r.pump === 'relief' || r.split ? 1 : 0.4);
  const regNow = (m, t) => regime(inLine(curS(m, t)), m.x, m.run);
  // Which lines carry flow, and which way. `only` keeps a puzzle's picture from giving its answer away.
  function flowMap(m, t) {
    const box = inLine(curS(m, t)), r = regime(box, m.x, m.run), F = {};
    const put = (k, dir, cls) => { if (!m.only || m.only.indexOf(k) >= 0) F[k] = { dir, cls: cls || 'fl' }; };
    if (r.pump !== 'stopped') { put('suc', 1); put('out', 1); }
    if (r.pump === 'feed' || r.pump === 'unload') { put('pv', 1); put('T', 1); }
    if (r.pump === 'relief') put('rel', 1);
    if (r.split) put('rel', 1, 'flt');
    if (r.ram > 0) { put('A', 1); put('B2', -1); put('FC', -1); put('B1', -1); put('PA', 1); put('BT', 1); }
    if (r.ram < 0) { put('A', -1); put('B1', 1); put('CV', 1); put('B2', 1); put('PB', 1); put('AT', 1); }
    if (r.pump === 'unload') put('PT', 1);
    return { F, r, box };
  }
  // Stopped, the line whose oil still holds the ram: A if it was pressing the work, else B.
  const storedLine = (m) => (m.run ? null : m.x >= XW - 1e-6 ? 'A' : 'B');
  function airMap(a, t) {
    const box = inLine(curA(a, t)), rod = box === 1 ? (a.xa < 1 ? 1 : 0) : (a.xa > 0 ? -1 : 0), F = {};
    const put = (k, dir) => { if (!a.only || a.only.indexOf(k) >= 0) F[k] = { dir, cls: 'fl' }; };
    if (rod > 0) { put('sup', 1); put('14', 1); put('L4', 1); put('L2', -1); put('23', 1); put('E3', 1); }
    if (rod < 0) { put('sup', 1); put('12', 1); put('L2', 1); put('L4', -1); put('45', 1); put('E5', 1); }
    return { F, box, rod };
  }

  // ---------- the states, advanced by one animation ----------
  function initMain(m, o) {
    const s0 = o.row != null ? o.row : target(m);
    m.row = { from: s0, to: s0, t0: 0, dur: 0 };
    const r = regime(inLine(s0), m.x, m.run);
    m.ra = !m.only && (r.pump === 'relief' || r.split) ? 1 : 0;
    m.gv = m.only ? 0 : gaugeT(r);
    return m;
  }
  const newMain = (o) => initMain(Object.assign({ y1: 0, y2: 0, run: 1, x: X0, frozen: false, only: null, stopAt: -9, nudge: false, hideRed: 0 }, o), o);
  function setMain(m, o) { Object.assign(m, { y1: 0, y2: 0, run: 1, only: null, nudge: false, hideRed: 0 }, o); initMain(m, o); m.frozen = true; }
  function retarget(m, t) {
    const g = target(m);
    if (g === m.row.to) return;
    const c = curS(m, t);
    m.row = { from: c, to: g, t0: t, dur: 0.25 + 0.25 * Math.abs(g - c) };
  }
  function stopNow(m, t) { m.run = 0; m.y1 = 0; m.y2 = 0; m.stopAt = t; m.nudge = false; }
  function simMain(m, t, dt) {
    if (m.frozen) return;
    const r = regNow(m, t);
    // land exactly on the work or the top, so the ram stops there rather than a hair short of it
    if (r.ram > 0) { m.x = Math.min(XW, m.x + VDN * dt); if (XW - m.x < 1e-6) m.x = XW; }
    else if (r.ram < 0) { m.x = Math.max(0, m.x - VUP * dt); if (m.x < 1e-6) m.x = 0; }
    const r2 = regNow(m, t), rt = !m.only && (r2.pump === 'relief' || r2.split) ? 1 : 0;
    m.ra = approach(m.ra, rt, dt / 0.3);
    m.gv = approach(m.gv, gaugeT(r2), dt / 0.6);
  }
  function mainSteady(m, t) {
    if (m.frozen) return true;
    const r = regNow(m, t), rt = !m.only && (r.pump === 'relief' || r.split) ? 1 : 0;
    return t >= m.row.t0 + m.row.dur && !r.ram && m.ra === rt && m.gv === gaugeT(r) && (!!m.run || t >= m.stopAt + 0.7);
  }
  function newAir(o) {
    const a = Object.assign({ y3: 0, xa: 0, frozen: false, only: null }, o), s0 = a.y3 ? 1 : 0;
    a.row = { from: s0, to: s0, t0: 0, dur: 0 };
    return a;
  }
  function retargetA(a, t) {
    const g = a.y3 ? 1 : 0;
    if (g === a.row.to) return;
    const c = curA(a, t);
    a.row = { from: c, to: g, t0: t, dur: 0.25 + 0.25 * Math.abs(g - c) };
  }
  function simAir(a, t, dt) {
    if (a.frozen) return;
    const f = airMap(a, t);
    if (f.rod > 0) a.xa = Math.min(1, a.xa + VA * dt); else if (f.rod < 0) a.xa = Math.max(0, a.xa - VA * dt);
  }
  const airSteady = (a, t) => a.frozen || (t >= a.row.t0 + a.row.dur && !airMap(a, t).rod);
  function sched(st, t, fn) { st.ev.push([t, fn]); st.ev.sort((a, b) => a[0] - b[0]); }
  function light(st, k, t0, hold) { st.lights.push({ k, t0, hold }); st.until = Math.max(st.until, t0 + hold + 0.35); }
  const lightA = (st, k) => st.lights.reduce((a, L) => (L.k === k ? Math.max(a, K.arrive(st.t, L.t0, 0.25) * (1 - K.arrive(st.t, L.t0 + L.hold, 0.3))) : a), 0);
  const pulseA = (st) => (st.pulse == null || st.t < st.pulse || st.t > st.pulse + 1.8 ? 0 : 0.5 * (1 - Math.cos(2 * Math.PI * (st.t - st.pulse) / 0.9)));
  const busy = (st) => st.ev.length > 0 || st.t < st.until || (!!st.m && !mainSteady(st.m, st.t)) || (!!st.a && !airSteady(st.a, st.t));
  function advance(st, dt) {
    st.t += dt;
    while (st.ev.length && st.ev[0][0] <= st.t) { const e = st.ev.shift(); e[1](st, e[0]); }
    if (st.m) simMain(st.m, st.t, dt);
    if (st.a) simAir(st.a, st.t, dt);
  }
  function settle(st) { let g = 0; while (busy(st) && g++ < 4000) advance(st, 0.05); }
  const mk = (o) => Object.assign({ t: 0, ev: [], until: 0, lights: [], rings: {}, pulse: null, taps: [], tapAt: {}, m: null, a: null, q: null }, o);

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  const STEPS = [
    { id: 'still', name: 'Still there?', kind: 'typed', view: 'sq1', field: 'vol9', unit: 'cm³', answer: 200,
      task: 'Air shut in a cylinder fills 300 cm³ at 6 bar absolute. A heavier load raises its pressure to 9 bar absolute, at the same temperature. What volume does the air fill now?',
      slips: [{ value: 450, hint: 'That is the pressures upside down. More pressure squeezes the air smaller.' }, { value: 300, hint: 'Air squeezes. Its volume falls as its pressure rises.' }],
      hint: 'Pressure times volume stays the same.', want: '200 cm³', right: 'Still there.',
      why: 'Pressure times volume stays at 6 × 300, which makes 1800. So the volume is 1800 ÷ 9, which is 200 cm³. The heavier load pushes the rod in.',
      after: (st) => { st.q = { from: 6, to: 9, t0: st.t + 0.2, dur: 0.8 }; st.until = Math.max(st.until, st.t + 1.5); } },
    { id: 'job', name: 'The job first', show: true, view: 'main', init: { only: [] },
      text: 'This is a press. Its ram comes down onto the work, squeezes it and goes back up. Read the job first. Then name the parts. Then trace one valve position at a time.',
      read: 'This is a press. Its ram comes down onto the work, squeezes it and goes back up. Read the job first. Then name the parts. Then trace one valve position at a time. Here the press is at rest, with every part named.',
      demo: (st) => ['job', 'pump', 'tank', 'relief', 'gauge', 'valve', 'pair', 'cyl'].forEach((k, j) => light(st, k, 0.3 + 0.42 * j, 0.4)) },
    { id: 'drawn', name: 'As drawn', kind: 'pick', view: 'main', sw: ['sol', 'stop'], init: { only: [], frozen: true },
      task: 'The motor runs and no solenoid is energised. What does the ram do?',
      opts: ['It comes down onto the work', "It holds, and the pump's oil goes back to the tank", "It holds, and the pump's oil goes over the relief valve"],
      want: "It holds, and the pump's oil goes back to the tank",
      hint: 'No solenoid is on, so the springs hold the middle box against the ports. Read that box.',
      hints: { 'It comes down onto the work': 'No solenoid is on, so the springs hold the middle box against the ports. Read that box.', "It holds, and the pump's oil goes over the relief valve": 'Look at P in the middle box. Its line runs straight to T.' },
      why: "The sheet draws the valve at rest, with its middle box against the ports. That box joins P to T and blocks A and B. So the pump's oil goes back to the tank at low pressure, and the ram holds.",
      after: (st) => { st.m.only = null; st.m.frozen = false; } },
    { id: 'paths', name: 'Two paths', show: true, view: 'main', sw: ['sol', 'stop'],
      text: "Energise -Y1 and the left box joins P to A and B to T. Oil from the pump fills the piston side. The rod side's oil runs back to the tank. The ram moves only if both paths are open, so follow both. Tap -Y1.",
      read: "Energise -Y1 and the left box joins P to A and B to T. Oil from the pump fills the piston side. The rod side's oil runs back to the tank. The ram moves only if both paths are open, so follow both. Here -Y1 is on. Oil runs from P to A into the piston side. The rod side's oil runs through the flow control and B to T, to the tank. The ram comes down.",
      stillSet: (st) => setMain(st.m, { y1: 1, row: 1, x: 0.45 }) },
    { id: 'other', name: 'The other side', kind: 'order', view: 'main', sw: ['sol', 'stop'], init: { y1: 1, x: 0.45, frozen: true, only: ['suc', 'out', 'pv', 'A', 'PA'] },
      task: "Tap the parts the rod side's oil passes on its way to the tank, in order.",
      read: "Which parts does the rod side's oil pass on its way to the tank, in order?",
      opts: ORD, want: ['Flow control', '4/3 valve', 'Tank'],
      hintOn: { 'Check valve': 'The check valve lets oil pass only into the rod side. Going out, the oil must take the flow control.', Pump: 'The pump only feeds. Oil leaving the cylinder goes back to the tank.' },
      hint: 'Start at the rod side and follow its line down to B.',
      why: "The check valve is shut this way, so the rod side's oil leaves through the flow control. The left box joins B to T, so the oil runs back to the tank. Without that path the ram could barely move.",
      after: (st) => { st.m.only = null; st.m.frozen = false; } },
    { id: 'work', name: 'On the work', show: true, view: 'main', sw: ['sol', 'stop'], init: { y1: 1, x: 0.45 },
      text: "The flow control lets the rod side's oil out slowly, so it sets the ram's speed. This pump pushes out the same amount every turn. The slowed cylinder takes less, so the pressure rises until the relief valve opens. The spare oil goes over it. So the relief valve's setting decides how hard the ram presses. Watch the ram meet the work.",
      read: "The flow control lets the rod side's oil out slowly, so it sets the ram's speed. This pump pushes out the same amount every turn. The slowed cylinder takes less, so the pressure rises until the relief valve opens. The spare oil goes over it. So the relief valve's setting decides how hard the ram presses. Here the ram has stopped on the work. All the pump's oil now runs over the relief valve to the tank, and the needle sits on the relief mark.",
      demo: (st) => { light(st, 'fc', 0.2, 1.0); light(st, 'relief', 1.6, 0.9); light(st, 'gauge', 1.9, 0.7); } },
    { id: 'squeeze', name: 'What sets the squeeze?', kind: 'pick', view: 'main', sw: ['sol', 'stop'], init: { y1: 1, x: XW, frozen: true, only: [] },
      task: 'The ram is pressing the work and -Y1 is still on. Which part decides how hard it presses?',
      opts: ['The flow control', 'The relief valve', 'The check valve'], want: 'The relief valve',
      hint: 'That sets the speed. The ram has stopped, so no oil passes it now.',
      hints: { 'The flow control': 'That sets the speed. The ram has stopped, so no oil passes it now.', 'The check valve': 'That lets oil into the rod side only. It is shut while the ram comes down.' },

      const n = d.kind === 'order' ? st.taps.indexOf(ORD[k]) : -1;
      b.setLabel(n >= 0 ? (n + 1) + '. ' + ORD[k] : ORD[k]);
      b.el.setAttribute('aria-pressed', n >= 0 ? 'true' : 'false');
    });
    Object.keys(BOX).forEach((k) => { BOX[k].hidden = +k !== i; });
    el('ansbox').hidden = d.kind !== 'typed';

    el('acts').hidden = !!d.show;
    checkBtn.el.hidden = right;
    clearBtn.el.hidden = d.kind !== 'order' || right;
    const fb = el('fb');
    fb.hidden = !!d.show;
    let f = '';
    if (!d.show) {
      if (d.kind === 'typed') f = st.fbText;
      else if (right) f = "That's it.";
      else if (st.res === 'wrong') f = d.kind === 'order' ? orderHint(d, st) : (d.hints && d.hints[st.pick]) || d.hint;
      else if (st.res === 'empty') f = d.kind === 'order' ? 'Tap three parts in order, then Check.' : 'Tap one of the answers.';
      else if (st.res === 'full') f = 'Three parts are chosen. Check them, or start over.';
    }
    fb.className = 'fb' + (right && !st.shown ? ' right' : '');
    write(fb, f);
    const why = el('why');
    why.hidden = !!d.show || !st.why;
    write(why, d.show ? '' : d.why);
    whyBtn.setLabel(st.why ? 'Hide why' : 'Why?');
    // a typed puzzle's Why? states the figure, so it shows only once he has answered
    whyBtn.el.hidden = d.kind === 'typed' && st.res !== 'right' && st.res !== 'wrong';

    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !right);
    nextBtn.setLabel(i === STEPS.length - 1 ? 'Finish' : 'Continue');
    el('nav').hidden = backBtn.el.hidden && nextBtn.el.hidden;
    paint();
    if (busy(st)) play();
  });

  // ---------- known answers, worked out by hand ----------
  const drawsRed = (st) => { const g = K.svg('g', {}); drawMain(g, st, STEPS[I.safe]); return !!g.querySelector('.stored, .stl'); };
  const runFor = (st, secs) => { for (let t = 0; t < secs - 1e-9; t += 0.05) advance(st, 0.05); return st; };
  const settleOf = (st) => { settle(st); return st; };
  K.check('Each symbol is drawn in its normal or neutral condition: the press opens with both solenoids off, the middle box against the ports, P to T unloading the pump and the ram held near the top', () => {
    const st = settleOf(fresh(I.paths)), m = st.m, f = flowMap(m, st.t);
    return !m.y1 && !m.y2 && m.run === 1 && inLine(curS(m, st.t)) === 0 && f.r.pump === 'unload' && !!f.F.PT && !f.F.A && m.x === X0 && m.gv === 0.05;
  }, { source: NAVY });
  K.check('When pressure is applied to the top chamber, the bottom chamber is aligned to drain back to the reservoir: with -Y1 the left box feeds A at the top and lines B at the bottom up to T', () => {
    const f = flowMap(newMain({ y1: 1, x: 0.4 }), 0).F;
    return PORT_TOP === 'A' && JOINS.par.join() === 'PA,BT' && f.A.dir === 1 && f.B2.dir === -1 && f.FC.dir === -1 && f.B1.dir === -1 && !!f.T && !!f.BT && !f.CV;
  });
  K.check('With the supply connected to the piston side and the rod side exhausted, the pressure on the piston side advances the rod: -Y3 feeds the piston side, exhausts the rod side and the rod comes out', () => {
    const st = mk({ a: newAir({ y3: 1 }) }), f = airMap(st.a, 0).F;
    settle(st);
    return f.L4.dir === 1 && f.L2.dir === -1 && !!f['14'] && !!f['23'] && !!f.E3 && !f.E5 && st.a.xa === 1;
  });
  K.check("With -Y1 the ram comes down, stops on the work and all the pump's oil then goes over the relief valve; with -Y2 it goes back up, and at the top the oil goes over the relief valve", () => {
    const a = mk({ m: newMain({ y1: 1 }) });
    runFor(a, 1);
    const moving = a.m.x > X0 && a.m.x < XW && regNow(a.m, a.t).split === true;
    settle(a);
    const onWork = a.m.x === XW && regNow(a.m, a.t).pump === 'relief' && a.m.gv === 1 && a.m.ra === 1;
    const b = mk({ m: newMain({ y2: 1, x: XW }) });
    runFor(b, 0.6);
    const up = b.m.x < XW;
    settle(b);
    return moving && onWork && up && b.m.x === 0 && regNow(b.m, b.t).pump === 'relief';
  });
  K.check('Stopped with the ram on the work, the line from A stays under pressure; stopped with the ram above it, the line from B; either way the gauge reads zero', () => {
    const a = mk({ m: newMain({ y1: 1, x: XW }) }), b = mk({ m: newMain({ y1: 1, x: 0.5 }) });
    stopNow(a.m, 0); retarget(a.m, 0); settle(a);
    stopNow(b.m, 0); retarget(b.m, 0); settle(b);
    return storedLine(a.m) === 'A' && storedLine(b.m) === 'B' && a.m.gv === 0 && b.m.gv === 0 && b.m.x === 0.5 && inLine(curS(a.m, a.t)) === 0 && !Object.keys(flowMap(a.m, a.t).F).length;
  });
  K.check('Pressure times volume stays the same: 6 × 300 = 1800, so 9 bar absolute gives 200 cm³ and 12 gives 150 cm³; each step up in pressure squeezes the air smaller', () => {
    for (let b = 6; b < 12; b++) if (!(K.at({ bar: b + 1 }).vol < K.at({ bar: b }).vol)) return false;
    return PV === 1800 && K.near(K.at({ bar: 6 }).vol, 300, 1e-9) && K.near(K.at({ bar: 9 }).vol, 200, 1e-9) && K.near(K.at({ bar: 12 }).vol, 150, 1e-9);
  });
  K.check('Worked by hand: 1800 ÷ 9 = 200 cm³; the slips are the pressures upside down, 300 × 9 ÷ 6 = 450, and no squeeze at all, 300; the field asks exactly this', () => {
    const d = STEPS[I.still];
    return d.answer === 200 && K.near(PV / 9, 200, 1e-9) && K.near(300 * 9 / 6, 450, 1e-9) && d.slips.map((x) => x.value).join() === '450,300' && ANS[I.still].spec.answer === 200 && d.want === '200 cm³';
  });
  K.check("Going down, the rod side's oil leaves through the flow control, then the valve, then the tank; going up it passes the check valve, which lets oil only into the rod side", () => {
    const dn = flowMap(newMain({ y1: 1, x: 0.4 }), 0).F, up = flowMap(newMain({ y2: 1, x: 0.4 }), 0).F;
    return !!dn.FC && dn.FC.dir === -1 && !dn.CV && !!dn.BT && !!dn.T && !!up.CV && up.CV.dir === 1 && !up.FC && STEPS[I.other].want.join() === 'Flow control,4/3 valve,Tank';
  });
  K.check('Before an answer nothing gives it away: puzzles open with no switches, rings or pulse; screens 3, 7, 9 and 14 show no flow, screen 5 lights only the path into the piston side, screen 11 only the supply, screen 13 draws no red line, and screen 1 only 300 cm³ at 6 bar', () => {
    const ok = DO.every((i) => { const st = fresh(i); return !swOnFor(STEPS[i], st) && !Object.keys(st.rings).length && st.pulse == null && !st.taps.length; });
    const none = (i) => !Object.keys(flowMap(fresh(i).m, 0).F).length;
    const f5 = flowMap(fresh(I.other).m, 0).F, f11 = airMap(fresh(I.air2).a, 0).F, q = fresh(I.still).q;
    const sf = fresh(I.safe);
    return ok && none(I.drawn) && none(I.squeeze) && none(I.rodin) && none(I.top) && !!sf.m.hideRed && !drawsRed(sf) && !f5.FC && !f5.B2 && !f5.T && !f5.rel && !!f5.A && !f11.E3 && !f11.L2 && !!f11.L4 && q.from === 6 && q.to === 6;
  });
  K.check("Every demonstration settles within 4.5 s, and every answer's motion within 3 s", () =>
    STEPS.every((d, i) => {
      if (d.show) return !d.demo || d.dur <= 4.5;
      const st = fresh(i);
      st.res = 'right';
      if (d.after) d.after(st);
      let t = 0;
      while (busy(st) && t < 30) { advance(st, 0.05); t += 0.05; }
      return t <= 3;
    }));

  K.ready();
</script>
