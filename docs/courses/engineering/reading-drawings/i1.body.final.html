  // The same sheet with a short link from the supply's line to the starter's line, round -Q1.
  const LINK = {
    parts: MAIN.parts,

  };

    dots: { J2: [258, 44] },
    segs: [{ id: 'b1', a: 'SUP.o', b: 'Q1.i', start: 'SUP' }, { id: 'b2', a: 'Q1.o', b: 'K1.i', start: 'Q1' }, { id: 'b3', a: 'K1.o', b: 'J2', start: 'K1' },

  const PC = {
    parts: { H1: { kind: 'lamp', x: 66, y: 44, tag: [0, -20, 'middle'] }, Q1: { kind: 'switch', x: 216, y: 44, flip: true, tag: [0, -20, 'middle'] },

  const PANELS = [{ sh: PA, y0: 6, letter: 'A', lamp: 'a4' }, { sh: PB, y0: 118, letter: 'B', lamp: 'b5' }, { sh: PC, y0: 230, letter: 'C', lamp: 'x4' }];
  const SHEETS = { MAIN, LINK, NEW };

  // ---------- lines: each one runs square from pin to pin, through its fixed bends ----------
  const DV = { l: [-1, 0], r: [1, 0], u: [0, -1], d: [0, 1] };
  const STUB = 10;
  function route(A, B, via) {
    const pts = [[A.x, A.y]];
    let cur = [A.x, A.y], dir = A.d ? DV[A.d] : null;
    if (dir) { cur = [A.x + STUB * dir[0], A.y + STUB * dir[1]]; pts.push(cur); }
    const bd = B.d ? DV[B.d] : null, fin = bd ? [B.x + STUB * bd[0], B.y + STUB * bd[1]] : [B.x, B.y];
    const tg = (via || []).concat([fin]);

      const last = k === tg.length - 1, dx = Math.sign(t[0] - cur[0]), dy = Math.sign(t[1] - cur[1]);
      if (dx && dy) {
        // keep going the way the line already runs if the next point lies ahead, else turn now
        let h = dir && dir[0] ? dx === dir[0] : dir && dir[1] ? dy !== dir[1] : true;
        if (last && bd) { const leg = h ? [0, dy] : [dx, 0]; if (leg[0] === bd[0] && leg[1] === bd[1]) h = !h; }
        pts.push(h ? [t[0], cur[1]] : [cur[0], t[1]]);
        dir = h ? [0, dy] : [dx, 0];
      } else if (dx || dy) {
        if (last && bd && dx === bd[0] && dy === bd[1] && Math.abs(t[0] - cur[0]) + Math.abs(t[1] - cur[1]) > 24) {   // it would arrive through the part: step round it
          const side = bd[0] ? [0, 1] : [1, 0];
          pts.push([cur[0] + side[0] * 22, cur[1] + side[1] * 22], [t[0] + side[0] * 22, t[1] + side[1] * 22]);
        }
        dir = [dx, dy];
      }
      pts.push(t); cur = t;
    });
    pts.push([B.x, B.y]);
    return tidy(pts);
  }
  // Drop repeated points and any bend that lies on a straight run (a run that doubles back is cut short).
  function tidy(p) {
    const q = [];
    p.forEach((a) => { const b = q[q.length - 1]; if (!b || Math.abs(a[0] - b[0]) > 0.01 || Math.abs(a[1] - b[1]) > 0.01) q.push(a); });
    let k = 1;
    while (k < q.length - 1) {
      const a = q[k - 1], b = q[k], c = q[k + 1];
      if (Math.abs((b[0] - a[0]) * (c[1] - b[1]) - (b[1] - a[1]) * (c[0] - b[0])) < 0.01) { q.splice(k, 1); if (k > 1) k--; } else k++;
    }
    return q;
  }
  // Where every part, pin and line sits, with any parts moved to `pos`.
  function layout(sh, pos) {
    const P = {};
    Object.keys(sh.parts).forEach((id) => {
      const p = sh.parts[id], at = (pos && pos[id]) || [p.x, p.y];

    });

        const p = P[m[1]], k = KINDS[p.kind].pins[m[2]];
        let d = k[2];

        return { x: p.x + (p.flip ? -1 : 1) * k[0], y: p.y + k[1], d };
      }

      return { x: q[0], y: q[1], d: n[1] || null };

    return { P, D: sh.dots, R };

  // Crossings: two lines meeting inside both runs, not at an end or a dot.
  function meet(p1, p2, p3, p4) {
    const d = (p2[0] - p1[0]) * (p4[1] - p3[1]) - (p2[1] - p1[1]) * (p4[0] - p3[0]);
    if (Math.abs(d) < 1e-9) return null;
    const t = ((p3[0] - p1[0]) * (p4[1] - p3[1]) - (p3[1] - p1[1]) * (p4[0] - p3[0])) / d;
    const u = ((p3[0] - p1[0]) * (p2[1] - p1[1]) - (p3[1] - p1[1]) * (p2[0] - p1[0])) / d;
    if (t <= 1e-6 || t >= 1 - 1e-6 || u <= 1e-6 || u >= 1 - 1e-6) return null;
    return [p1[0] + t * (p2[0] - p1[0]), p1[1] + t * (p2[1] - p1[1])];
  }
  function crossings(L, sh) {
    const out = [];
    sh.segs.forEach((a, m) => sh.segs.slice(m + 1).forEach((b) => {
      const pa = L.R[a.id].pts, pb = L.R[b.id].pts;
      for (let i = 0; i < pa.length - 1; i++) for (let j = 0; j < pb.length - 1; j++) {
        const x = meet(pa[i], pa[i + 1], pb[j], pb[j + 1]);
        if (x) out.push({ a: a.id, b: b.id, x });

    }));
    return out;

    const seen = new Set([id]), todo = [id];

      const s = seg(sh, todo.pop()), ns = [nodeName(s.a), nodeName(s.b)];

    const i = at(), d = STEPS[i], st = S[i];
    if (finished || d.kind !== 'pick' || k >= d.opts.length || st.res === 'right') return;
    st.pick = d.opts[k]; st.res = null;
  } }));
  // The typed answers: Check grades what is typed; two wrong tries show the working.
  const ANS = {}, BOX = {};
  STEPS.forEach((d, i) => {
    if (d.kind !== 'typed') return;
    BOX[i] = el('ansbox').appendChild(K.el('div', { class: 'ans' }));
    ANS[i] = K.answer({ id: d.field, unit: d.unit, answer: d.answer, decimals: 0, slips: d.slips, into: BOX[i], onCheck: (r) => {
      const st = S[i];
      if (st.res === 'right') return;
      if (r.state === 'right') { st.res = 'right'; st.fbText = 'That\'s it.'; st.lit = d.after; st.lastAct = 'lit'; play(d.fx); }
      else if (r.state === 'wrong') {
        st.tries += 1;
        if (st.tries >= 2) { st.res = 'right'; st.shown = true; st.why = true; st.fbText = (r.hint ? r.hint + ' ' : '') + 'Here is the working.'; ANS[i].reveal(); st.lit = d.after; st.lastAct = 'lit'; play(d.fx); }
        else { st.res = 'wrong'; st.fbText = r.hint || d.hint; }
      } else { st.res = null; st.fbText = ''; }
      K.refresh();
    } });
  });
  const checkBtn = K.button({ label: 'Check', into: '#acts', press: () => {
    const i = at(), d = STEPS[i], st = S[i];
    if (finished || d.show || st.res === 'right') return;
    if (d.kind === 'typed') { ANS[i].check(); return; }
    if (st.pick == null) { st.res = 'empty'; return; }
    if (st.pick === d.want) { st.res = 'right'; if (d.after) { st.lit = d.after; st.lastAct = 'lit'; } play(d.fx); } else st.res = 'wrong';
  } });
  const whyBtn = K.button({ label: 'Why?', secondary: true, into: '#acts', press: () => {
    const i = at();
    if (finished || STEPS[i].show) return;
    S[i].why = !S[i].why;
  } });
  const dotBtn = K.button({ label: 'Add a dot', secondary: true, into: '#tools', press: () => {
    const i = at();
    if (finished || i !== I.cross) return;
    touch(i);
    const st = S[i];
    st.dot = !st.dot; if (!st.lit) st.lit = 'c5'; st.lastAct = 'lit';
    K.reveal();
  } });
  function setRun(on) {
    const i = at();
    if (finished || i !== I.drawn) return;
    const now = look(i).run;
    touch(i);
    S[i].runFrom = now; S[i].run = on;
    K.reveal();
    play(0.9);
  }
  const drawnBtn = K.button({ label: 'As drawn', secondary: true, into: '#tools', press: () => setRun(false) });
  const runBtn = K.button({ label: 'Plant running', secondary: true, into: '#tools', press: () => setRun(true) });
  const replayBtn = K.button({ label: 'Play again', secondary: true, into: '#tools', press: () => {
    const i = at(), d = STEPS[i];
    if (finished || !d.show) return;
    S[i] = fresh(i);
    play(d.dur);
  } });
  const backBtn = K.button({ label: 'Back', secondary: true, into: '#nav', press: () => {
    if (finished) { finished = false; return; }
    stepper.set(Math.max(0, at() - 1), true);
  } });
  const nextBtn = K.button({ label: 'Continue', into: '#nav', press: () => {
    const i = at();
    if (finished || (!STEPS[i].show && S[i].res !== 'right')) return;
    if (i < STEPS.length - 1) { stepper.set(i + 1, true); return; }
    finished = true;
    if (typeof K.complete === 'function') K.complete();
  } });
  K.button({ label: 'Start again', secondary: true, into: '#again', press: () => {
    S = STEPS.map((d, i) => fresh(i));
    Object.keys(ANS).forEach((k) => ANS[k].reset());
    finished = false; lastStep = -1; stepper.set(0, true);
  } });
  STEPS.forEach((d, i) => { if (d.show) d.still = () => { S[i] = fresh(i); S[i].touched = true; anim.pause(); T = Infinity; K.refresh(); }; });

  // One animation plays each demonstration and the motion after an answer; with reduced motion
  // (and while the self-test looks) everything opens finished.
  const anim = K.anim({ button: false, label: 'Demonstration', step: (dt) => {
    if (finished) return false;
    T += dt;
    paint();
    return T < motionEnd;
  } });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !anim.playing() && T !== Infinity) { T = Infinity; paint(); } });
  function play(dur) {
    if (REDUCE || testing()) { T = Infinity; anim.pause(); return; }
    motionEnd = dur; T = 0; anim.play();
  }
  function enter(id) {
    if (REDUCE) return;
    const box = el(id);
    box.classList.remove('enter'); void box.offsetWidth; box.classList.add('enter');
  }
  // Dan takes over: a demonstration stops where it is, and his moves start from there.
  function touch(i) {
    const st = S[i];
    if (STEPS[i].show && !st.touched) { const lk = look(i); st.room = lk.room; st.pos = lk.pos; }
    st.touched = true;
    if (anim.playing()) anim.pause();
    T = Infinity;
  }

  // ---------- dragging parts and symbols, tapping lines and tags ----------
  const tapsOn = (i) => !!STEPS[i].sheet && (!!STEPS[i].show || S[i].res === 'right');
  const tagsOn = (i, which) => STEPS[i].pic === 'both' && (which === 'room' || !!STEPS[i].show || S[i].res === 'right');
  let grab = null;
  function svgPt(svg, e) {
    const m = svg.getScreenCTM();
    if (!m) return null;
    const q = new DOMPoint(e.clientX, e.clientY).matrixTransform(m.inverse());
    return [q.x, q.y];
  }
  function bind(svg, which) {
    svg.addEventListener('pointerdown', (e) => {
      if (finished) return;
      const t = e.target && e.target.closest ? e.target.closest('[data-u],[data-sym],[data-seg]') : null;
      if (!t) return;
      const i = at(), d = STEPS[i], pt = svgPt(svg, e);
      if (!pt) return;
      const g = { which, pid: e.pointerId, i, start: pt, moved: false };
      if (t.dataset.seg) { if (!tapsOn(i)) return; g.seg = t.dataset.seg; }
      else if (which === 'room') { g.unit = t.dataset.u; g.part = t.dataset.p; g.drag = d.pic === 'both'; }
      else { g.sym = t.dataset.sym; g.drag = !!d.sheetDrag; }
      grab = g;
      if (g.drag) { try { svg.setPointerCapture(e.pointerId); } catch (err) { /* the drag still follows while the pointer stays on the picture */ } e.preventDefault(); }
    });
    svg.addEventListener('pointermove', (e) => {
      const g = grab;
      if (!g || g.pid !== e.pointerId || g.which !== which || !g.drag || at() !== g.i) return;
      const pt = svgPt(svg, e);
      if (!pt) return;
      const dx = pt[0] - g.start[0], dy = pt[1] - g.start[1];
      if (!g.moved) {
        if (Math.hypot(dx, dy) < 6) return;
        g.moved = true; touch(g.i); K.reveal();
        const lk = look(g.i), sh = SHEETS[STEPS[g.i].sheet];
        g.from = which === 'room' ? lk.room[g.unit].slice() : (lk.pos[g.sym] || [sh.parts[g.sym].x, sh.parts[g.sym].y]).slice();
      }
      const st = S[g.i];
      if (which === 'room') { const b = BOUNDS[g.unit]; st.room[g.unit] = [K.clamp(g.from[0] + dx, b[0], b[1]), K.clamp(g.from[1] + dy, b[2], b[3])]; }
      else { const sh = SHEETS[STEPS[g.i].sheet]; st.pos[g.sym] = [K.clamp(g.from[0] + dx, 26, 314), K.clamp(g.from[1] + dy, 26, sh.keyY - 30)]; }
      paint();
    });
    svg.addEventListener('pointerup', (e) => {
      const g = grab;
      if (!g || g.pid !== e.pointerId || g.which !== which) return;
      grab = null;
      if (at() !== g.i || finished) return;
      if (g.moved) { K.refresh(); return; }
      const st = S[g.i];
      if (g.seg) { touch(g.i); st.lit = g.seg; st.lastAct = 'lit'; }
      else {
        const p = which === 'room' ? g.part : g.sym;
        if (!tagsOn(g.i, which)) return;
        touch(g.i); st.tag = st.tag === p ? null : p; st.lastAct = 'tag';
      }
      K.reveal(); K.refresh();
    });
    svg.addEventListener('pointercancel', (e) => { if (grab && grab.pid === e.pointerId) { const moved = grab.moved; grab = null; if (moved) K.refresh(); } });
  }
  bind(roomSvg, 'room');
  bind(sceneSvg, 'sheet');

  // ---------- painting ----------
  function setPanes(d) {
    const both = d.pic === 'both', sheet = both || d.pic === 'sheet';
    paneRoom.hidden = !both; paneSheet.hidden = !sheet; el('pair').hidden = !sheet; el('cardbox').hidden = sheet;
  }
  const sideBySide = () => !paneRoom.hidden && !paneSheet.hidden && Math.abs(paneRoom.offsetTop - paneSheet.offsetTop) < 4 && paneSheet.offsetLeft > paneRoom.offsetLeft + 10;
  function paint() {
    const i = at(), d = STEPS[i], lk = look(i);
    setPanes(d);
    // A demonstration's words, readout and pressed button wait until its motion settles.
    const settling = !!d.show && !S[i].touched && T !== Infinity && T < d.ends, running = !settling && S[i].run;
    el('say').style.visibility = el('outs').style.visibility = settling ? 'hidden' : '';
    drawnBtn.el.setAttribute('aria-pressed', running ? 'false' : 'true');
    runBtn.el.setAttribute('aria-pressed', running ? 'true' : 'false');
    if (!paneRoom.hidden) { meterSvg = roomSvg; roomArt.textContent = ''; drawRoom(roomArt, i, lk); roomSvg.setAttribute('aria-label', roomAlt(i, lk)); }
    if (!paneSheet.hidden) { meterSvg = sceneSvg; sceneArt.textContent = ''; const H = drawMain(sceneArt, i, lk); sceneSvg.setAttribute('viewBox', '0 0 340 ' + H); sceneSvg.setAttribute('aria-label', sheetAlt(i, lk)); }
    if (!el('cardbox').hidden && CARD[d.pic]) { meterSvg = cardSvg; cardArt.textContent = ''; const H = CARD[d.pic](cardArt, i, lk); cardSvg.setAttribute('viewBox', '0 0 340 ' + H); cardSvg.setAttribute('aria-label', CARDALT[d.pic](i, lk)); }
  }
  window.addEventListener('resize', () => K.refresh());

  K.model((p) => ({ partsJoined: countAt(Math.round(p.step)) }));
  write(el('finish'), FINISH);
  K.update((p) => {
    const i = Math.round(p.step), d = STEPS[i];
    if (!anim.playing()) T = Infinity;   // motion that was stopped (the page hidden, a test) shows finished
    if (i !== lastStep) {
      lastStep = i; grab = null; enter('stepbox');
      if (d.show) { S[i] = fresh(i); play(d.dur); } else { anim.pause(); T = Infinity; }
    }
    if (finished !== lastDone) { lastDone = finished; enter(finished ? 'done' : 'stepbox'); }
    const st = S[i], right = st.res === 'right';
    setPanes(d);
    el('stepbox').hidden = finished;
    el('done').hidden = !finished;
    el('count').textContent = 'Screen ' + (i + 1) + ' of ' + STEPS.length;
    const task = el('task');
    task.className = 'task' + (d.show ? ' show' : '');
    write(task, d.show ? (d.textWide && sideBySide() ? d.textWide : d.text) : d.task);
    el('outs').hidden = !d.sheet || i === I.two || i === I.side || i === I.tags;
    const say = sayFor(i);
    el('say').hidden = !say;
    write(el('say'), say);

    dotBtn.el.hidden = i !== I.cross;
    dotBtn.setLabel(st.dot ? 'Take the dot away' : 'Add a dot');
    drawnBtn.el.hidden = runBtn.el.hidden = i !== I.drawn;
    replayBtn.el.hidden = !d.show || REDUCE;
    el('tools').hidden = [dotBtn, drawnBtn, runBtn, replayBtn].every((b) => b.el.hidden);

    const opts = d.kind === 'pick' ? d.opts : [];
    el('picks').hidden = !opts.length;
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      write(b.el, opts[k]);
      b.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });
    Object.keys(BOX).forEach((k) => { BOX[k].hidden = +k !== i; });
    el('ansbox').hidden = d.kind !== 'typed';

    el('acts').hidden = !!d.show;
    checkBtn.el.hidden = right;
    const fb = el('fb');
    fb.hidden = !!d.show;
    let f = '';
    if (!d.show) f = d.kind === 'typed' ? st.fbText : right ? 'That\'s it.' : st.res === 'wrong' ? ((d.hints && d.hints[st.pick]) || d.hint) : st.res === 'empty' ? 'Tap one of the answers.' : '';
    fb.className = 'fb' + (right && !st.shown ? ' right' : '');
    write(fb, f);
    const why = el('why');
    why.hidden = !!d.show || !st.why;
    write(why, d.show ? '' : d.why);
    whyBtn.setLabel(st.why ? 'Hide why' : 'Why?');

    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !right);
    nextBtn.setLabel(i === STEPS.length - 1 ? 'Finish' : 'Continue');
    el('nav').hidden = backBtn.el.hidden && nextBtn.el.hidden;
    paint();
  });

  // ---------- known answers, worked out by hand ----------
  const near2 = (a, b) => Math.abs(a[0] - b[0]) < 1e-6 && Math.abs(a[1] - b[1]) < 1e-6;
  const square = (p) => p.every((q, k) => k === 0 || Math.abs(q[0] - p[k - 1][0]) < 1e-6 || Math.abs(q[1] - p[k - 1][1]) < 1e-6);
  const lenOf = (p) => p.reduce((s, q, k) => (k ? s + Math.hypot(q[0] - p[k - 1][0], q[1] - p[k - 1][1]) : 0), 0);
  const nodesOf = (g, set) => Array.from(new Set(Array.from(set).reduce((a, id) => { const s = seg(g, id); return a.concat([nodeName(s.a), nodeName(s.b)]); }, []))).sort().join();
  const DO = STEPS.map((d, i) => i).filter((i) => !STEPS[i].show);

  K.check('Lines that simply cross do not join unless the crossing is marked: the lamp\'s line crosses the motor\'s cable with no dot, so the line leaving -Q1 reaches the starter and the lamp but not the motor, and a dot there joins them', () => {
    const xs = crossings(layout(MAIN), MAIN), r = reached(MAIN, 'c2'), rd = reached(MAIN, 'c2', [['c4', 'c5']]);
    return xs.length === 1 && [xs[0].a, xs[0].b].sort().join() === 'c4,c5' && r.size === 2 && r.has('K1') && r.has('H1') && !r.has('M1') && rd.has('M1') && rd.size === 3;
  }, { source: SRC.ejr });
  K.check('A circuit diagram does not show how long its connections are: dragged to the far side, the starter keeps every line, each stretched square between the same two ends, and the line leaving -Q1 still reaches the same parts', () => {
    const a = layout(MAIN), b = layout(MAIN, { K1: FARK });
    const held = (L) => MAIN.segs.every((s) => { const R = L.R[s.id], p = R.pts; return near2(p[0], [R.A.x, R.A.y]) && near2(p[p.length - 1], [R.B.x, R.B.y]) && square(p); });
    return held(a) && held(b) && lenOf(b.R.c3.pts) > lenOf(a.R.c3.pts) + 50 && lenOf(b.R.c5.pts) > lenOf(a.R.c5.pts) && Array.from(reached(MAIN, 'c2')).sort().join() === 'H1,K1';
  });
  K.check('A schematic gives how the system works, not where its parts sit: moving the motor and pump across the room moves its pipe in the room, and leaves the diagram drawn exactly the same', () => {
    const lk = look(I.two), draw = (room) => { const g = K.svg('g'); drawMain(g, I.two, Object.assign({}, lk, { room, litA: 1, tagA: [1, 1] })); return g.innerHTML; };
    const home = Object.assign({}, ROOM_HOME), moved = Object.assign({}, ROOM_HOME, { SKID: FAR });
    const a = draw(home), b = draw(moved);
    return a.length > 0 && a === b && JSON.stringify(roomPipe(home)) !== JSON.stringify(roomPipe(moved));
  });
  K.check('Each symbol is drawn in its normal or neutral condition: valve -V2 is drawn shut, where its spring holds it, and opens only with its solenoid on; contacts are drawn with the coil off, so the main contact is drawn open and a normally closed one closed', () =>
    valveOpen(false) === false && valveOpen(true) === true && contactClosed('NO', false) === false && contactClosed('NO', true) === true &&
    contactClosed('NC', false) === true && contactClosed('NC', true) === false && stateWords(0).join() === 'Open,Shut' && stateWords(1).join() === 'Closed,Open', { source: SRC.navy });
  K.check('Counted by hand: the line leaving -Q1 reaches 2 parts (3 counting the motor through the crossing, 1 down one branch); the starter\'s output line in the new layout reaches 3 (4 counting -H1, 2 missing a branch, 1 the motor alone); the typed fields ask exactly these', () => {
    const s5 = STEPS[I.count], s13 = STEPS[I.fresh];
    return reached(MAIN, 'c2').size === 2 && crossCount(MAIN, 'c2') === 3 && onePath(MAIN, 'c2') === 1 &&
      Array.from(reached(NEW, 'o1')).sort().join() === 'H2,M1,P2' && crossCount(NEW, 'o1') === 4 && onePath(NEW, 'o1') === 1 &&
      s5.answer === 2 && s5.slips.map((x) => x.value).join() === '3,1' && s13.answer === 3 && s13.slips.map((x) => x.value).join() === '4,2,1' &&
      ANS[I.count].spec.answer === 2 && ANS[I.fresh].spec.answer === 3 && s5.want === '2 parts' && s13.want === '3 parts';
  });
  K.check('Drawings A and C join every part the same way, so they are one diagram drawn twice, though C moves every part; B is laid out like A but feeds its lamp from the starter\'s output', () => {
    const movedParts = (p, q) => Object.keys(p.parts).filter((id) => Math.hypot(p.parts[id].x - q.parts[id].x, p.parts[id].y - q.parts[id].y) > 20).length;
    return sigOf(PA) === sigOf(PC) && sigOf(PA) !== sigOf(PB) && reached(PB, 'b5').has('M1') && !reached(PA, 'a4').has('M1') && movedParts(PA, PC) === 5 && movedParts(PA, PB) === 0;
  });
  K.check('The heaters drawn in a row: every path from the supply passes through -E1 first, then splits through -E2 or -E3 and joins again, and the usual shape keeps every joint', () =>
    nodesOf(HEATG, comp(HEATG, 'h0')) === 'E1.l,S.t' && nodesOf(HEATG, comp(HEATG, 'h1')) === 'D1,E1.r,E2.l,E3.l' && nodesOf(HEATG, comp(HEATG, 'h6')) === 'D2,E2.r,E3.r,S.b' &&
    HSEG.every((s) => s.r.length === s.l.length && ['r', 'l'].every((k) => near2(s[k][0], hpin(s.a, k)) && near2(s[k][s[k].length - 1], hpin(s.b, k)))));
  K.check('On the air sheet the air reaches -R1 first, then -V2, then -A1, though -A1 sits at the top left of the sheet', () =>
    airOrder().join() === 'R1,V2,A1' && AIRBOX.A1[1] < AIRBOX.V2[1] && AIRBOX.A1[0] < AIRBOX.C1[0] && STEPS[I.air].want === 'Regulator -R1');
  K.check('The link joins the supply\'s line to the starter\'s line round -Q1: with -Q1 open the drawing still joins the supply to -K1, and without the link it would not', () => {
    const noLink = { parts: LINK.parts, dots: LINK.dots, segs: LINK.segs.filter((s) => s.id !== 'lk') };
    return reached(LINK, 'c1a').has('K1') && !reached(noLink, 'c1a').has('K1');
  });
  K.check('Before an answer nothing gives it away: no puzzle has a line lit or a motion played, both typed screens\' readouts show ?, and the contact\'s state now is not shown', () => {
    const keep = S;
    try {
      S = STEPS.map((d, i) => fresh(i));
      return DO.every((i) => { const lk = look(i); return !lk.lit && lk.slide === 0 && lk.open === 0 && lk.panel.every((a) => a === 0) && lk.seq.every((a) => a === 0); }) &&
        readoutTextFor(I.count) === '?' && readoutTextFor(I.fresh) === '?' && ncNow(I.nc, look(I.nc)) === 'Now: ?';
    } finally { S = keep; }
  });
  K.check('Every demonstration settles within 4.5 s of its screen opening, and every answer\'s motion within 2.5 s', () =>
    STEPS.every((d) => (d.show ? d.dur > 0 && d.dur <= 4.5 && d.ends <= d.dur : d.fx > 0 && d.fx <= 2.5)));

  K.ready();
</script>
