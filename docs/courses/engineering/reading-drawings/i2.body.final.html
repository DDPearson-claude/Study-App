<p class="caption">An example board with far fewer parts than a real one. A bold line is joined to a live source.</p>

<script>
  // ---------- the board: lines (nodes), the devices that join them, sources and loads ----------
  const BUS_Y = 120, OPEN = 0.46;
  // Each node is one electrical line: its polylines, and its place in the reading order (rank).
  const NODES = {
    g1: { rank: 0, p: [[[56, 48], [56, 70]]] },
    g2: { rank: 0, p: [[[226, 48], [226, 70]]] },
    sh: { rank: 0, p: [[[300, 46], [300, 70]]] },
    bat: { rank: 0, p: [[[196, 354], [196, 378]]] },
    busA: { rank: 1, bus: [[12, 120], [156, 120]], p: [[[56, 98], [56, 120]], [[26, 120], [26, 144]], [[84, 120], [84, 144]], [[130, 120], [130, 182]]] },
    busB: { rank: 1, bus: [[184, 120], [330, 120]], p: [[[226, 98], [226, 120]], [[300, 98], [300, 120]], [[210, 120], [210, 182]], [[262, 120], [262, 144]], [[314, 120], [314, 182]]] },
    f11: { rank: 2, p: [[[26, 172], [26, 238]]] },
    f12: { rank: 2, p: [[[84, 172], [84, 226]]] },
    m3: { rank: 2, p: [[[130, 210], [130, 252], [156, 252]], [[210, 210], [210, 252], [184, 252]]] },
    f21: { rank: 2, p: [[[262, 172], [262, 238]]] },
    f22: { rank: 2, p: [[[314, 210], [314, 230]]] },
    lv: { rank: 3, bar: [[14, 310], [142, 310]], p: [[[84, 260], [84, 310]], [[40, 310], [40, 326]], [[110, 310], [110, 326]]] },
    dc: { rank: 3, bar: [[186, 310], [330, 310]], p: [[[314, 258], [314, 310]], [[196, 310], [196, 326]], [[252, 310], [252, 326]], [[302, 310], [302, 326]]] },
    e1f: { rank: 4, p: [[[40, 354], [40, 380]]] },
    m4f: { rank: 4, p: [[[110, 354], [110, 378]]] },
    e3f: { rank: 4, p: [[[252, 354], [252, 380]]] },
    a3f: { rank: 4, p: [[[302, 354], [302, 380]]] },
  };
  // Breakers and the isolator. a: the fixed contact's line; b: the line on the moving blade's side.
  // tag: which side the tag sits (the blade swings the other way); inter: its interlocked partner.
  const DEV = {
    Q1: { x: 56, y: 84, a: 'g1', b: 'busA', tag: 'R' },
    Q2: { x: 226, y: 84, a: 'g2', b: 'busB', tag: 'L' },
    Q3: { x: 300, y: 84, a: 'sh', b: 'busB', tag: 'L' },
    Q4: { x: 170, y: 120, a: 'busB', b: 'busA', h: true },
    Q11: { x: 26, y: 158, a: 'busA', b: 'f11', tag: 'R' },
    Q12: { x: 84, y: 158, a: 'busA', b: 'f12', tag: 'R' },
    Q13: { x: 130, y: 196, a: 'busA', b: 'm3', tag: 'L', inter: 'Q23' },
    Q21: { x: 262, y: 158, a: 'busB', b: 'f21', tag: 'R' },
    Q22: { x: 314, y: 196, a: 'busB', b: 'f22', tag: 'L' },
    Q23: { x: 210, y: 196, a: 'busB', b: 'm3', tag: 'R', inter: 'Q13' },
    F1: { x: 40, y: 340, a: 'lv', b: 'e1f', tag: 'R' },
    F2: { x: 110, y: 340, a: 'lv', b: 'm4f', tag: 'R' },
    Q5: { x: 196, y: 340, a: 'dc', b: 'bat', tag: 'R', iso: true, dc: true },
    F3: { x: 252, y: 340, a: 'dc', b: 'e3f', tag: 'R', dc: true },
    F4: { x: 302, y: 340, a: 'dc', b: 'a3f', tag: 'R', dc: true },
  };
  const DORDER = Object.keys(DEV);
  // Power passes on through these, downward only.
  const CONV = { T1: { from: 'f12', to: 'lv' }, U1: { from: 'f22', to: 'dc' } };
  const SRC = { G1: { node: 'g1', x: 56, y: 32, kind: 'gen' }, G2: { node: 'g2', x: 226, y: 32, kind: 'gen' }, SH: { node: 'sh', x: 300, y: 32, kind: 'shore' }, G3: { node: 'bat', x: 196, y: 387, kind: 'bat' } };
  const SORDER = ['G1', 'G2', 'SH', 'G3'];
  const INCOMER = { G1: 'Q1', G2: 'Q2', SH: 'Q3' };
  const LOAD = {
    M1: { node: 'f11', x: 26, y: 252, kind: 'motor', lamp: [48, 238] },
    E1: { node: 'e1f', x: 40, y: 392, kind: 'light', lamp: [62, 381] },
    M4: { node: 'm4f', x: 110, y: 392, kind: 'motor', lamp: [134, 380] },
    M3: { node: 'm3', x: 170, y: 252, kind: 'motor', lamp: [192, 236] },
    M2: { node: 'f21', x: 262, y: 252, kind: 'motor', lamp: [284, 238] },
    E3: { node: 'e3f', x: 252, y: 392, kind: 'light', lamp: [274, 381] },
    A3: { node: 'a3f', x: 302, y: 392, kind: 'alarm', lamp: [326, 381] },
  };
  const LORDER = ['M1', 'E1', 'M4', 'M3', 'M2', 'E3', 'A3'];
  const NAME = { G1: '-G1', G2: '-G2', SH: 'the shore supply', G3: 'battery -G3', M1: 'pump -M1', E1: 'lighting -E1', M4: 'fan -M4', M3: 'pump -M3', M2: 'pump -M2', E3: 'emergency lighting -E3', A3: 'alarm panel -A3' };
  const PLACE = { busA: 'section A', busB: 'section B', lv: 'the 115 V board', dc: 'the DC board' };
  const tagOf = (k) => '-' + k;
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  const listOf = (a) => (a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1]);

  // ---------- the rule: a line is live when closed devices join it to a live source ----------
  const DRAWN = { Q3: false, Q4: false, Q23: false };
  function board(over) {
    const dev = {};
    DORDER.forEach((k) => { dev[k] = DRAWN[k] !== false; });
    const b = { dev, run: { G1: true, G2: true } };
    if (over) { Object.assign(b.dev, over.dev || {}); Object.assign(b.run, over.run || {}); }
    return b;
  }
  const clone = (b) => ({ dev: Object.assign({}, b.dev), run: Object.assign({}, b.run) });
  const srcLive = (b, s) => SRC[s].kind !== 'gen' || !!b.run[s];
  // [the next line, the device or converter passed]; all: every device, open or not.
  function edgesOut(b, n, all) {
    const out = [];
    DORDER.forEach((k) => { const D = DEV[k]; if (!all && !b.dev[k]) return; if (D.a === n) out.push([D.b, k]); else if (D.b === n) out.push([D.a, k]); });
    Object.keys(CONV).forEach((c) => { if (CONV[c].from === n) out.push([CONV[c].to, c]); });
    return out;
  }
  function reach(b, start) {
    const seen = new Set([start]), todo = [start];
    while (todo.length) edgesOut(b, todo.pop()).forEach((e) => { if (!seen.has(e[0])) { seen.add(e[0]); todo.push(e[0]); } });
    return seen;
  }
  // Each line -> the live sources that feed it.
  function liveMap(b) {
    const m = {};
    Object.keys(NODES).forEach((n) => { m[n] = []; });
    SORDER.forEach((s) => { if (srcLive(b, s)) reach(b, SRC[s].node).forEach((n) => m[n].push(s)); });
    return m;
  }
  const liveLoads = (b) => { const m = liveMap(b); return LORDER.filter((l) => m[LOAD[l].node].length > 0); };
  const lostBy = (over) => { const now = new Set(liveLoads(board(over))); return liveLoads(board()).filter((l) => !now.has(l)).length; };
  // Trying to close a device: a padlock, the interlock, or two live AC parts from different sources stop it.
  function attempt(b, k, locks) {
    const D = DEV[k];
    if (locks && locks[k]) return { ok: false, card: { kind: 'locked', dev: k } };
    if (D.inter && b.dev[D.inter]) return { ok: false, card: { kind: 'inter', dev: k, other: D.inter } };
    if (!D.dc) {
      const m = liveMap(b), A = m[D.a], B = m[D.b];
      if (A.length && B.length && (A.some((s) => B.indexOf(s) < 0) || B.some((s) => A.indexOf(s) < 0))) return { ok: false, card: { kind: 'sync', dev: k, srcs: [B[0], A[0]] } };
    }
    return { ok: true };
  }
  // A live load: the first source that reaches it, and the path it takes.
  function livePath(b, load) {
    const t = LOAD[load].node, found = [];
    let best = null;
    SORDER.forEach((s) => {
      if (!srcLive(b, s)) return;
      const start = SRC[s].node, prev = {}, q = [start];
      prev[start] = null;
      while (q.length) { const n = q.shift(); edgesOut(b, n).forEach((e) => { if (!(e[0] in prev)) { prev[e[0]] = { from: n, via: e[1] }; q.push(e[0]); } }); }
      if (!(t in prev)) return;
      found.push(s);
      if (best) return;
      const items = [];
      let at = t;
      while (prev[at]) { const pv = prev[at]; if (at !== t && PLACE[at]) items.unshift(PLACE[at]); items.unshift(tagOf(pv.via)); at = pv.from; }
      best = { src: s, items };
    });
    return best ? Object.assign(best, { also: found.filter((s) => s !== best.src) }) : null;
  }
  // A dead load: the way in that needs the fewest devices to close, from any source, running or not.
  function wayIn(b, locks, load) {
    const cost = {}, prev = {};
    SORDER.forEach((s) => { const n = SRC[s].node, c = srcLive(b, s) ? 0 : 1; if (cost[n] == null || c < cost[n]) { cost[n] = c; prev[n] = { src: s }; } });
    for (let pass = 0; pass < 40; pass++) {
      let ch = false;
      Object.keys(cost).forEach((n) => edgesOut(b, n, true).forEach((e) => {
        const o = e[0], via = e[1];
        if (locks && locks[via]) return;
        const c = cost[n] + (DEV[via] && !b.dev[via] ? 1 : 0) + 0.001;
        if (cost[o] == null || c < cost[o] - 1e-9) { cost[o] = c; prev[o] = { from: n, via }; ch = true; }
      }));
      if (!ch) break;
    }
    const t = LOAD[load].node;
    if (cost[t] == null) return null;
    const opens = [];
    let at = t;
    while (!prev[at].src) { const v = prev[at].via; if (DEV[v] && !b.dev[v]) opens.unshift(v); at = prev[at].from; }
    return { opens, src: prev[at].src, stopped: !srcLive(b, prev[at].src) };
  }
  function isoResult(b, locks, load) {
    if (liveMap(b)[LOAD[load].node].length) return { kind: 'live', path: livePath(b, load) };
    const w = wayIn(b, locks, load);
    return w ? { kind: 'dead', way: w } : { kind: 'iso' };
  }
  function resultWords(r, load) {
    const who = cap(NAME[load]), tg = tagOf(load);
    if (r.kind === 'live') {
      const p = r.path;
      return [who + ' is live.', cap(NAME[p.src]) + ' feeds it through ' + listOf(p.items) + '.' + (p.also.length ? ' ' + cap(listOf(p.also.map((s) => NAME[s]))) + (p.also.length > 1 ? ' feed' : ' feeds') + ' it too.' : '')];
    }
    if (r.kind === 'iso') return [who + ' is isolated.', 'Every path from every source stops at a padlock.'];
    const w = r.way, os = listOf(w.opens.map(tagOf)), many = w.opens.length > 1, src = NAME[w.src];
    let body;
    if (w.opens.length && !w.stopped) body = os + (many ? ' are' : ' is') + ' open but not locked. If ' + (many ? 'they close' : 'it closes') + ', ' + src + ' feeds ' + tg + '.';
    else if (!w.opens.length) body = cap(src) + ' is stopped, but it could start. Then it feeds ' + tg + '.';
    else body = os + (many ? ' are' : ' is') + ' open but not locked, and ' + src + ' could start. Then ' + src + ' feeds ' + tg + '.';
    return [who + ' has no supply, but it is not isolated.', body];
  }
  function cardWords(c) {
    if (c.kind === 'sync') return ['Synchronise first.', 'Closing ' + tagOf(c.dev) + ' would join ' + NAME[c.srcs[0]] + ' and ' + NAME[c.srcs[1]] + ' before they are matched. ' + tagOf(c.dev) + ' stays open.'];
    if (c.kind === 'inter') return ['Interlocked.', tagOf(c.dev) + ' and ' + tagOf(c.other) + ' cannot both be closed. Open ' + tagOf(c.other) + ' first.'];
    return ['Locked off.', tagOf(c.dev) + ' has a padlock on it, so it stays open.'];
  }

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  const MOVE = (at, devs) => ({ at, devs });
  const TOP = SORDER.filter((s) => SRC[s].y < BUS_Y).length;
  const STEPS = [
    { name: 'Still there?', kind: 'pick', mark: 'Q4', fx: 1.0, after: 'sync',
      task: '-G1 feeds section A and -G2 feeds section B. Can you close bus-tie -Q4 now?',
      opts: ['Yes, both sections are at 440 V', 'Not until -G2 is synchronised with -G1'], want: 'Not until -G2 is synchronised with -G1',
      hint: 'Matching voltage is not enough. Frequency and phase must match too.',
      rightFb: 'Still there. -Q4 stays open until the sets match.',
      why: 'Closing -Q4 would join two running sets. Unless their voltage, frequency and phase match, a large current flows the moment it closes. So they are synchronised first.' },
    { name: 'The power map', show: true, sweep: true, dur: 4.3, ends: 4.2,
      text: "A *single-line diagram* maps a board's power, from each source through the busbars to each load. Read it in that order, sources first. The thick lines are the busbars. On the AC side, each line stands for all three phases of its cable. On the DC side, it stands for a pair of wires.",
      read: "A *single-line diagram* maps a board's power, from each source through the busbars to each load. Read it in that order, sources first. The thick lines are the busbars. On the AC side, each line stands for all three phases of its cable. On the DC side, it stands for a pair of wires. An amber glow traces each line in that order, sources first." },
    { name: 'Count the sources', kind: 'typed', field: 'srcs', unit: 'sources', fx: 1.6, after: 'rings',
      task: 'How many sources does this drawing show?',
      answer: SORDER.length,
      slips: [{ value: TOP, hint: 'A source is anything that pushes power in. Look at the bottom of the sheet too.' },
        { value: SORDER.filter((s) => SRC[s].kind === 'gen').length, hint: 'Count the shore supply and the battery too. A source counts even with its breaker open.' },
        { value: TOP + Object.keys(CONV).length, hint: '-T1 and -U1 only pass power on from the main board. They are not sources.' }],
      hint: 'Look for generator sets, the shore supply and any battery, anywhere on the sheet.',
      why: 'Two generator sets and the shore supply sit at the top. Battery -G3 sits down on the DC board. -T1 and -U1 pass power on. So the drawing shows 4 sources.' },
    { name: 'Live and dead', show: true, moves: [MOVE(0.8, { Q1: false })], dur: 2.0, ends: 1.8,
      text: 'Live lines are bold and dead lines pale. A breaker feeds everything below it, through every transformer and charger on the way. Watch -Q1, the breaker of -G1, open. Tap it to close it again.',
      read: 'Live lines are bold and dead lines pale. A breaker feeds everything below it, through every transformer and charger on the way. With -Q1 open, section A and everything below it are pale. Section B stays bold from -G2.' },
    { name: 'One breaker opens', kind: 'typed', field: 'q12', unit: 'loads', mark: 'Q12', fx: 1.2, open: { Q12: false },
      task: 'Breaker -Q12 opens. How many loads lose supply?',
      answer: lostBy({ dev: { Q12: false } }),
      slips: [{ value: LORDER.filter((l) => LOAD[l].node === 'f12').length, hint: '-T1 is not a load. Follow its line on to the board it feeds.' },
        { value: lostBy({ dev: { Q12: false } }) - 1, hint: 'The 115 V board feeds two loads. Count both.' },
        { value: lostBy({ dev: { Q1: false } }), hint: 'Only what hangs below -Q12 goes. The rest of section A stays live.' }],
      hint: "Follow -Q12's line down through -T1 to each breaker below it.",
      why: '-Q12 feeds transformer -T1. -T1 feeds the 115 V board. That board feeds lighting -E1 and fan -M4. So 2 loads lose supply, and the rest of section A stays live.' },
    { name: 'Where the voltage changes', show: true, volts: true, dur: 3.0, ends: 2.9,
      text: 'A transformer marks where the voltage changes. Here -T1 steps 440 V down to 115 V. Charger -U1 turns 440 V AC into 24 V DC. Battery -G3 sits on the same DC board. On this sheet, a cross marks a breaker and a bar an isolator. Two circles are a transformer, and a box with ~ and = is a charger. The battery is drawn as long and short plates.' },
    { name: "The charger's breaker", kind: 'pick', mark: 'Q22', fx: 1.2, open: { Q22: false },
