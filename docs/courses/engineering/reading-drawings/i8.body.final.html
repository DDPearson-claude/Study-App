<style>
  [hidden] { display: none !important; }
  .pz { max-width: 60rem; }
  .lead, .caption, .task, .say, .fb, .why, .done { max-width: 34rem; }
  .pz > * + *, #stepbox > * + *, .side > * + * { margin-top: 14px; }
  .pz .k-stepper { gap: 0; }
  .pz .k-stepper .k-label, .pz .k-stepper-nav { display: none; }
  .pz .count { margin-top: 10px; }
  .task { font-size: 1.12rem; font-weight: 700; line-height: 1.5; margin-top: 4px; }
  .task.show { font-weight: 400; line-height: 1.6; }
  .board { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(20rem, 100%), 1fr)); gap: 14px 24px; align-items: start; }
  .pane, .side { margin: 0; min-width: 0; }
  .pane > * + * { margin-top: 12px; }
  svg.pic { display: block; width: 100%; height: auto; max-width: 26rem; margin-inline: auto; touch-action: pan-y; -webkit-user-select: none; user-select: none; }
  svg.pic.grab { touch-action: none; }
  svg.pic:focus { outline: none; }
  svg.pic:focus-visible { outline: 2px solid var(--k-accent2); outline-offset: 2px; }
  /* The switches: groups that wrap, so they take two rows on a phone. */
  .ctl { display: flex; flex-wrap: wrap; gap: 10px 12px; max-width: 30rem; margin-inline: auto; }
  .sw { flex: 1 1 10rem; min-width: 0; }
  .sw .k-label { display: block; margin: 0 0 4px; }
  .sw .row { display: flex; flex-wrap: wrap; gap: 6px; }
  .sw .k-btn { flex: 1 1 6rem; min-height: 44px; white-space: nowrap; padding-inline: 8px; }
  .sw .k-btn[aria-pressed="true"], .picks .k-btn[aria-pressed="true"] { background: var(--k-accent2); color: var(--k-on-accent2); border-color: var(--k-accent2); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  .row .k-btn { min-height: 44px; }
  .nav .k-btn, .acts .k-btn, .done .k-btn { flex: 1 1 8rem; }
  .tools .k-btn { flex: 0 1 auto; padding-inline: 16px; }
  .picks { display: flex; flex-direction: column; gap: 8px; }
  .picks .k-btn { width: 100%; min-height: 48px; font-size: 1.05rem; white-space: normal; }
  .picks .k-btn .opt { text-align: center; }
  .fb { font-weight: 700; min-height: 1.5em; }
  .fb.right { color: var(--k-good); }
  .why, .done { line-height: 1.6; }
  .done strong { color: var(--k-accent2); }
  .done .row { margin-top: 14px; }
  #stepbox.enter, #done.enter, .ctl.enter { animation: screen-in .35s ease-out both; }
  @keyframes screen-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  html.k-testing #stepbox.enter, html.k-testing #done.enter, html.k-testing .ctl.enter { animation: none; }
  @media (prefers-reduced-motion: reduce) { #stepbox.enter, #done.enter, .ctl.enter { animation: none; } }

  /* The drawing. */
  svg text { paint-order: stroke; stroke: var(--k-bg); stroke-width: 4px; stroke-linejoin: round; }

  svg .lit3 { fill: none; stroke: var(--k-amber-line); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }

  svg .dim { fill: none; stroke: var(--k-ink); stroke-width: .9; }
  svg .frame { fill: none; stroke: var(--k-muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
  svg .ring { fill: none; stroke: var(--k-accent); stroke-width: 2.4; }
  svg .hl { fill: var(--k-fill2); }
  svg .tb { fill: none; stroke: var(--k-ink); stroke-width: 1; }
  svg .ruler { fill: var(--k-panel); stroke: var(--k-ink); stroke-width: 1; }
  svg .tick { stroke: var(--k-ink); stroke-width: 1; }
  svg .symv { fill: none; stroke: var(--k-ink); stroke-width: 1.6; stroke-linejoin: round; }
  svg .symc { fill: none; stroke: var(--k-ink); stroke-width: .8; stroke-dasharray: 5 1.5 1.5 1.5; }
  svg .lead { stroke: var(--k-ink); stroke-width: 1; }

  svg .eye { stroke: var(--k-accent2); stroke-width: 1.8; }

  svg .t { font: 400 14px var(--k-font); fill: var(--k-ink); }

  svg .tl { font: 700 14px var(--k-font); fill: var(--k-accent); }
  svg .tlim { font: 700 14px var(--k-font); fill: var(--k-accent2); }

<p class="lead">A small steel bracket in a glass box, the views its walls carry, and the flat drawing they open into.</p>

<div class="pz" id="pz">

</div>

<p class="caption">A made-up bracket, drawn by the rules on this page and sized to fit your screen.</p>

<script>
  // ---------- the part: a bracket 80 long, 40 deep and 60 high, in millimetres ----------
  // x runs along its length (width), y from front to back (depth), z up (height).
  const SRC_BTEC = 'https://qualifications.pearson.com/content/dam/pdf/BTEC-Nationals/Electrical/Electronic-Engineering/2010/Specification/Unit_16_Engineering_Drawing_for_Technicians.pdf';
  const W = 80, DP = 40, HT = 60, TB = 10, UY = 30, MG = 10;        // sizes; the base's thickness; the upright's front face; the glass stands 10 clear
  const HO = { x: 20, z: 40, r: 6 };                                  // the hole, front to back through the upright
  const SL = { x0: 47.5, x1: 72.5, y: 15, r: 5 };                     // the slot, down through the base
  const RB = { x0: 37, x1: 43, y0: 12, z1: 40 };                      // the rib, in the corner between base and upright
  const RH = { x: 60, y: 15, r: 6, top: 22 };                         // Part B's round hole and Part C's peg, where Part A has its slot
  const SLEN = SL.x1 - SL.x0, SLX = (SL.x0 + SL.x1) / 2, STOL = 0.1, CEN = HO.z, CTOL = 0.2, SC = 5;   // 25 ± 0.1, 40 ± 0.2, scale 1 : 5
  const PIV = [W / 2, DP / 2, HT / 2], D2R = Math.PI / 180, BH = 130, KEYH = 46, TBH = 58, KMAX = 2.15, PEGN = 16;
  const f0 = (v) => K.fmt(v, { decimals: 0 }), f1 = (v) => K.fmt(v, { decimals: 1 });

  // An eye looking square-on or turned: yaw swings it round to the left, elev lifts it above.
  function cam(yaw, elev, k, ox, oy) {

    const R = [ct, -s, 0], U = [s * se, ct * se, ce], F = [s * ce, ct * ce, -se];
    return { R, U, F, k, ox, oy,

      depth: (q) => (q[0] - PIV[0]) * F[0] + (q[1] - PIV[1]) * F[1] + (q[2] - PIV[2]) * F[2] };

  // The solid: its faces, each with the way it faces. Faces on the outside of the whole part (sup)
  // can never be hidden by the part, so they paint last; the inside corner's faces paint first.
  function solidOf(v) {

    f([[0, UY, HT], [W, UY, HT], [W, DP, HT], [0, DP, HT]], [0, 0, 1], 1, 'fTop');

    f(Lat(W), [1, 0, 0], 1, 'fSide');

    f([[0, 0, TB], [W, 0, TB], [W, UY, TB], [0, UY, TB]], [0, 0, 1], 0, 'fTop', 0, v === 'A' ? SLOT3 : v === 'B' ? RHOLE3 : null);
    const sl = Math.hypot(UY - RB.y0, RB.z1 - TB);
    f([[RB.x0, RB.y0, TB], [RB.x1, RB.y0, TB], [RB.x1, UY, RB.z1], [RB.x0, UY, RB.z1]], [0, -(RB.z1 - TB) / sl, (UY - RB.y0) / sl], 0, 'fTop', 'rib');
    f([[RB.x0, RB.y0, TB], [RB.x0, UY, TB], [RB.x0, UY, RB.z1]], [-1, 0, 0], 0, 'fSide', 'rib');

  // ---------- the views: what you see looking square through each face of the box ----------

  function viewLines(v, part) {
    const L = [], add = (k, s, pts) => L.push({ k: v + '.' + k, s, pts });

      add('base', 'v', [[0, TB], [W, TB]]);
      add('rib', 'v', [[RB.x0, TB], [RB.x0, RB.z1], [RB.x1, RB.z1], [RB.x1, TB]]);
      add('hole', 'v', ring2(HO.x, HO.z, HO.r, 32));

      else if (part === 'B') { add('feat', 'h', [[RH.x - RH.r, 0], [RH.x - RH.r, TB]]); add('feat', 'h', [[RH.x + RH.r, 0], [RH.x + RH.r, TB]]); add('featC', 'c', [[RH.x, -3], [RH.x, TB + 3]]); }
      else { add('feat', 'v', [[RH.x - RH.r, TB], [RH.x - RH.r, RH.top], [RH.x + RH.r, RH.top], [RH.x + RH.r, TB]]); add('featC', 'c', [[RH.x, TB - 3], [RH.x, RH.top + 3]]); }
    } else if (v === 'T') {
      add('front', 'v', [[0, 0], [W, 0]]); add('back', 'v', [[0, DP], [W, DP]]);
      add('left', 'v', [[0, 0], [0, DP]]); add('right', 'v', [[W, 0], [W, DP]]);
      add('step', 'v', [[0, UY], [W, UY]]);
      add('rib', 'v', [[RB.x0, UY], [RB.x0, RB.y0], [RB.x1, RB.y0], [RB.x1, UY]]);
      add('holeS', 'h', [[HO.x - HO.r, UY], [HO.x - HO.r, DP]]); add('holeS', 'h', [[HO.x + HO.r, UY], [HO.x + HO.r, DP]]);
      add('holeC', 'c', [[HO.x, UY - 3], [HO.x, DP + 3]]);
      if (part === 'A') { add('slot', 'v', stad(SL.x0, SL.x1, SL.y, SL.r, 12)); add('slotC', 'c', [[SL.x0 - 3, SL.y], [SL.x1 + 3, SL.y]]); add('slotC', 'c', [[SLX, SL.y - SL.r - 3], [SLX, SL.y + SL.r + 3]]); }

    } else {
      add('out', 'v', [[0, 0], [DP, 0], [DP, HT], [UY, HT], [UY, TB], [0, TB], [0, 0]]);
      add('rib', 'v', [[RB.y0, TB], [UY, RB.z1]]);
      add('hole', 'h', [[UY, HO.z - HO.r], [DP, HO.z - HO.r]]); add('hole', 'h', [[UY, HO.z + HO.r], [DP, HO.z + HO.r]]);

    'F.rib': [[[RB.x0, RB.y0, TB], [RB.x0, UY, RB.z1], [RB.x1, UY, RB.z1], [RB.x1, RB.y0, TB]]],

    E3[s + '.slotC'] = [AXS];
  });
  const SAYK = {
    'F.bottom': 'This solid line is the underside of the base, seen edge-on.',
    'F.top': 'This solid line is the top of the upright, seen edge-on.',

    'F.slot': "These dashed lines are the slot's ends. They are hidden inside the base.",
    'F.slotC': "This chain line marks the slot's centre. The slot runs down through the base.",
    'T.front': 'This solid line is the front edge of the base.',
    'T.back': "This solid line is the back edge of the upright's top.",

    'T.right': "This solid line is the bracket's right end, seen from above.",
    'T.step': "This solid line is the front edge of the upright's top. The upright stands behind the base.",
    'T.rib': 'These solid lines are the rib, seen from above.',
    'T.holeS': "These dashed lines are the hole's sides. They are hidden under the upright's top.",
    'T.holeC': "This chain line marks the hole's centre. The hole runs front to back.",

    else if (m.mode === 'parts') alt = paintParts(art, st, d, L);
    else alt = paintSheets(art, st, d, L);
    if (L.key) drawKey(art, L.H - KEYH + 2, L.key === 2);
    sceneSvg.setAttribute('viewBox', '0 0 340 ' + Math.round(L.H));
    sceneSvg.setAttribute('aria-label', alt);
    sceneSvg.classList.toggle('grab', d.id === 'part');
    setSay(sayFor(i));
    K.fade(el('say'), d.show && d.dur > 0.6 && !st.touched ? K.arrive(st.t, d.dur - 0.45, 0.4) : 1, 3);
  }
  write(el('finish'), FINISH);
  K.update((p) => {
    const i = K.clamp(Math.round(p.step), 0, STEPS.length - 1), d = STEPS[i];
    if (i !== lastStep) {
      lastStep = i; enter('stepbox'); lastSay = null;
      if (d.show) S[i] = fresh(i); else if (busy(S[i])) settle(S[i]);
      if (!busy(S[i])) anim.pause();
    }
    if (finished !== lastDone) { lastDone = finished; enter(finished ? 'done' : 'stepbox'); }
    const st = S[i], right = st.res === 'right';
    el('stepbox').hidden = finished;
    el('done').hidden = !finished;
    el('count').textContent = 'Screen ' + (i + 1) + ' of ' + STEPS.length;
    const task = el('task');
    task.className = 'task' + (d.show ? ' show' : '');
    write(task, d.show ? d.text : d.task);

    // a puzzle's switches take no room until he has answered, then grow in
    const on = (d.btns || []).filter((b) => btnOn(d, st, b));
    Object.keys(SW).forEach((k) => { SW[k].hidden = on.indexOf(k) < 0; });
    const ctl = el('ctl'), grow = on.length > 0 && ctl.hidden && ctlAt === i;
    ctl.hidden = !on.length; ctlAt = i;
    if (grow) enter('ctl');
    paintCtl(st, d);

    replayBtn.el.hidden = !d.show || !d.demo || REDUCE;
    el('tools').hidden = replayBtn.el.hidden;
    const opts = d.kind === 'pick' ? d.opts : [];
    el('picks').hidden = !opts.length;
    pickBtns.forEach((b, k) => {
      b.el.hidden = k >= opts.length;
      if (k >= opts.length) return;
      b.el.textContent = '';
      write(b.el.appendChild(K.el('span', { class: 'opt' })), opts[k]);
      b.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });
    Object.keys(BOX).forEach((k) => { BOX[k].hidden = +k !== i; });
    el('ansbox').hidden = d.kind !== 'typed';

    el('acts').hidden = !!d.show;
    checkBtn.el.hidden = right;
    const fb = el('fb');
    fb.hidden = !!d.show;
    let f = '';
    if (!d.show) {
      if (d.kind === 'typed') f = st.fbText;
      else if (right) f = "That's it.";
      else if (st.res === 'wrong') f = (d.hints && d.hints[st.pick]) || d.hint;
      else if (st.res === 'empty') f = 'Tap one of the answers.';
    }
    fb.className = 'fb' + (right && !st.shown ? ' right' : '');
    write(fb, f);
    const why = el('why');
    why.hidden = !!d.show || !st.why;
    write(why, d.show ? '' : d.why);
    whyBtn.setLabel(st.why ? 'Hide why' : 'Why?');
    // a typed puzzle's Why? states the figure, so it shows only once he has answered
    whyBtn.el.hidden = d.kind === 'typed' && st.res !== 'right' && st.res !== 'wrong';

    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !right);
    nextBtn.setLabel(i === STEPS.length - 1 ? 'Finish' : 'Continue');
    el('nav').hidden = backBtn.el.hidden && nextBtn.el.hidden;
    paint();
    if (busy(st)) play();
  });

  // ---------- known answers, worked out by hand ----------
  const spanOf = (lines, keep) => {
    const P = [];
    lines.filter(keep).forEach((ln) => ln.pts.forEach((q) => P.push(q)));
    const xs = P.map((q) => q[0]), ys = P.map((q) => q[1]);
    return [Math.max.apply(null, xs) - Math.min.apply(null, xs), Math.max.apply(null, ys) - Math.min.apply(null, ys), Math.min.apply(null, ys), Math.max.apply(null, ys)];
  };
  K.check('Components are 3-dimensional, but documents and screens are 2-dimensional: the bracket has three sizes, and every view of it is flat, a set of lines in two directions only', () => {
    const flat = ['F', 'T', 'L'].every((w) => VL.A[w].every((ln) => ln.pts.every((q) => q.length === 2)));
    return flat && W > 0 && DP > 0 && HT > 0;
  });
  K.check('Each view keeps two of the three sizes: the front view spans 80 by 60 (width, height), the view from above 80 by 40 (width, depth), the end view 40 by 60 (depth, height)', () => {
    const v = (w) => spanOf(VL.A[w], (ln) => ln.s === 'v');
    const a = v('F'), b = v('T'), c = v('L');
    return K.near(a[0], W, 1e-9) && K.near(a[1], HT, 1e-9) && K.near(b[0], W, 1e-9) && K.near(b[1], DP, 1e-9) && K.near(c[0], DP, 1e-9) && K.near(c[1], HT, 1e-9);
  });
  K.check('Either first or third angle can be chosen, and both should be understood: the page draws the bracket by each rule, each with all three views', () =>
    ['first', 'third'].every((ang) => ['T', 'L'].every((w) => { const b = viewBox(w, ang); return b[1] > b[0] && b[3] > b[2]; })) && STEPS[I.third].pair === true, { source: SRC_BTEC });
  K.check('Unfolded, first angle puts the view from above below the front view and the left-end view on its right; third angle puts them above and on its left; each view is the same picture in both, only moved', () => {
    const fT = viewBox('T', 'first'), fL = viewBox('L', 'first'), tT = viewBox('T', 'third'), tL = viewBox('L', 'third');
    const shift = wallPt('T', 'first', 90, 0, 0)[2] - wallPt('T', 'third', 90, 0, 0)[2];
    const same = [[0, 0], [W, DP], [30, 12]].every((q) => { const a = wallPt('T', 'first', 90, q[0], q[1]), b = wallPt('T', 'third', 90, q[0], q[1]); return K.near(a[0], b[0], 1e-9) && K.near(a[2] - b[2], shift, 1e-9); });
    return fT[3] <= 0 && fL[0] >= W && tT[2] >= HT && tL[1] <= 0 && same;
  });
  K.check('The views line up and share their sizes: from above is exactly as wide as the front view and square under or over it; the end view is exactly as tall and square beside it, in both rules', () =>
    ['first', 'third'].every((ang) => { const f = viewBox('F', ang), t = viewBox('T', ang), l = viewBox('L', ang); return K.near(t[0], f[0], 1e-9) && K.near(t[1], f[1], 1e-9) && K.near(l[2], f[2], 1e-9) && K.near(l[3], f[3], 1e-9); }));
  K.check('Hidden edges are dashed and visible ones solid: in the front view the hole is a solid circle and the slot two dashed lines; from above the slot is a solid outline and the hole two dashed lines with a chain line between', () => {
    const st = (w, k) => VL.A[w].filter((ln) => ln.k === w + '.' + k).map((ln) => ln.s).join();
    return st('F', 'hole') === 'v' && st('F', 'slot') === 'h,h' && st('T', 'slot') === 'v' && st('T', 'holeS') === 'h,h' && st('T', 'holeC') === 'c';
  });
  K.check('The cutting plane sets the section: through the hole (20 along) the upright shows a 12 gap and the base none; through the slot (60 along) the base shows a 10 gap; along the rib (40 along) the rib is cut but nothing hatched lies inside it', () => {
    const a = cutAt(HO.x), b = cutAt(SLX), c = cutAt((RB.x0 + RB.x1) / 2);
    const inRib = (r) => r[0] < UY - 1e-9 && r[1] > RB.y0 && r[3] > TB + 1e-9 && r[2] < RB.z1;
    const noGap = (k) => k.R.every((r) => !(r[0] >= UY - 1e-9 && r[2] < HO.z - k.hh + 1e-9 && r[3] > HO.z + k.hh - 1e-9 && k.hh > 0));
    return K.near(2 * a.hh, 2 * HO.r, 1e-9) && a.sw === 0 && K.near(2 * b.sw, 2 * SL.r, 1e-9) && b.hh === 0 && c.rib === 'cut' && !c.R.some(inRib) && noGap(a);
  });
  K.check('The projection symbol is a cone drawn by its own rule: its end view looks at the narrow end, so first angle puts the two circles by the wide end and third angle by the narrow end', () => {
    const a = symGeom('first', 20), b = symGeom('third', 20);
    return Math.abs(a.cx - a.wide) < Math.abs(a.cx - a.narrow) && Math.abs(b.cx - b.narrow) < Math.abs(b.cx - b.wide);
  });
  K.check('Worked by hand: 25 ± 0.1 allows 24.9 to 25.1; 40 ± 0.2 allows 39.8 to 40.2; at 1 : 5 the 80 base is drawn 16; the fields ask exactly these, with their slips', () => {
    const a = STEPS[I.low], b = STEPS[I.scale];
    return SZ.slot.lim === '24.9 to 25.1' && SZ.centre.lim === '39.8 to 40.2' && a.answer === 39.8 && a.slips.map((x) => x.value).join() === '40.2,39.6,40' && b.answer === 16 && b.slips.map((x) => x.value).join() === '400,80' &&
      ANS[I.low].spec.answer === 39.8 && ANS[I.scale].spec.answer === 16 && a.want === '39.8 mm' && b.want === '16 mm';
  });
  K.check('Only Part B matches the sheet: from above its feature is round, where Part A has a slot 25 long and 10 wide; in the front view its lines are dashed and stay within the base, where Part C has solid lines standing above it', () => {
    const a = spanOf(VL.A.T, (ln) => ln.k === 'T.slot'), b = spanOf(VL.B.T, (ln) => ln.k === 'T.feat');
    const bf = VL.B.F.filter((ln) => ln.k === 'F.feat'), cf = VL.C.F.filter((ln) => ln.k === 'F.feat');
    return K.near(a[0], SLEN, 1e-6) && K.near(a[1], 2 * SL.r, 1e-6) && K.near(b[0], b[1], 1e-6) && bf.length === 2 && bf.every((ln) => ln.s === 'h' && ln.pts.every((q) => q[1] >= 0 && q[1] <= TB)) &&
      cf.every((ln) => ln.s === 'v') && cf.some((ln) => ln.pts.some((q) => q[1] > TB)) && STEPS[I.which].want === 'Part B';
  });
  K.check('Seen from the front left, above, the bracket shows its front, its top and its left end, and hides its back, its right end and its underside', () => {
    const C = cam(35, 24, 1, 0, 0), F = C.F, sees = (n) => n[0] * F[0] + n[1] * F[1] + n[2] * F[2] < 0;
    return sees([0, -1, 0]) && sees([0, 0, 1]) && sees([-1, 0, 0]) && !sees([0, 1, 0]) && !sees([1, 0, 0]) && !sees([0, 0, -1]);
  });
  K.check('Before an answer nothing gives it away: screen 4 shows no end view, screen 6 no view labels and no ring, screen 8 an empty frame for the view from above, screen 10 no hatching, screen 12 no limits, screen 14 no ring and Part B unturned, and no puzzle shows its switches', () => {
    const f = (id) => fresh(I[id]), w = f('where'), s = f('symbol'), k = f('sketch'), h = f('hatch'), l = f('low'), q = f('which');
    return V(w, 'aE') === 0 && V(w, 'pE') === 0 && V(s, 'lab') === 0 && V(s, 'ring') === 0 && V(k, 'plan') === 0 && V(h, 'hatch') === 0 && l.m.limHide === true && V(q, 'ring') === 0 && V(q, 'by') === 35 &&
      DO.every((i) => { const st = fresh(i); return !(STEPS[i].btns || []).some((b) => btnOn(STEPS[i], st, b)) && !tapsOk(STEPS[i], st); });
  });
  K.check("Every demonstration settles within 4.5 s, every answer's motion within 3 s, and the box unfolds in 3.6 s", () =>
    STEPS.every((d, i) => {
      if (d.show) return d.dur <= 4.5;
      const st = fresh(i);
      st.res = 'right';
      if (d.after) d.after(st);
      let t = 0;
      while (busy(st) && t < 30) { advance(st, 0.05); t += 0.05; }
      return t <= 3;
    }));

  K.ready();
</script>
