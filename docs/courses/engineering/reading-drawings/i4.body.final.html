<p class="caption">Each mark in a fluid power symbol means one thing, so you read a symbol mark by mark.</p>

<script>
  // ---------- the rule: three marks on the circle name the part ----------
  // tri: 0 points out, 1 points in. fill: 0 solid (oil), 1 empty (air). arrow: 0 none, 1 across (adjustable).
  const PART = (tri, fill) => (fill ? (tri ? 'Air motor' : 'Air compressor') : (tri ? 'Hydraulic motor' : 'Hydraulic pump'));
  const nameOf = (k) => PART(k.tri, k.fill) + (k.arrow ? ', variable' : ', fixed');
  const ALL = [];
  [0, 1].forEach((t) => [0, 1].forEach((f) => [0, 1].forEach((a) => ALL.push({ tri: t, fill: f, arrow: a }))));

  // Screen 1: the jack. The oil carries one pressure to both pistons.
  const JACK = { a1: 10, a2: 200, push: 100 };
  JACK.p = JACK.push / JACK.a1; JACK.load = JACK.p * JACK.a2; JACK.flip = JACK.push * JACK.a1 / JACK.a2; JACK.ratio = JACK.a2 / JACK.a1;
  // Screen 5: five parts on a tray.
  const ROW5 = [{ tri: 0, fill: 0, arrow: 0 }, { tri: 1, fill: 1, arrow: 0 }, { tri: 1, fill: 0, arrow: 0 }, { tri: 0, fill: 1, arrow: 0 }, { tri: 0, fill: 0, arrow: 1 }];
  const AIR = ROW5.filter((s) => s.fill).length, OUTS = ROW5.filter((s) => !s.tri).length, COMP = ROW5.filter((s) => s.fill && !s.tri).length;
  // Screen 13: one sheet with five circles. rot is in quarter-turns.
  const SHEET = [
    { kind: 'emotor', x: 60, y: 70 },
    { kind: 'pump', sym: { tri: 0, fill: 0, arrow: 0 }, rot: 0, x: 170, y: 70 },
    { kind: 'motor', sym: { tri: 1, fill: 0, arrow: 0 }, rot: 0, x: 280, y: 70 },
    { kind: 'gauge', x: 115, y: 185 },
    { kind: 'pump', sym: { tri: 0, fill: 0, arrow: 1 }, rot: 1, x: 225, y: 185 },
  ];
  const isPump = (c) => !!c.sym && !c.sym.tri;
  const PUMPS = SHEET.filter(isPump).length;
  const SLIP13 = [SHEET.filter((c) => isPump(c) && !c.rot).length, SHEET.filter((c) => !!c.sym).length, SHEET.filter((c) => c.kind !== 'emotor').length, SHEET.length];
  // Screen 10: the shelf of finished symbols and the cards saying what each does.
  const SHELF = [
    { k: 'tank', name: 'Tank', does: 'holds the oil', say: 'An open-topped box is the tank. It holds the oil.' },
    { k: 'cyl', name: 'Cylinder', does: 'pushes and pulls a load', say: 'A long box with a piston and its rod is a cylinder. It pushes and pulls a load.' },
    { k: 'filter', name: 'Filter', does: 'cleans the oil', say: 'A diamond with a dashed line across it is a filter. It cleans the oil.' },
    { k: 'cooler', name: 'Cooler', does: 'takes heat out of the oil', say: 'A diamond with arrowheads pointing out is a cooler. It takes heat out of the oil.' },
    { k: 'acc', name: 'Accumulator', does: 'stores oil under pressure', say: 'An upright capsule is an accumulator. It stores oil under pressure.' },
    { k: 'gauge', name: 'Pressure gauge', does: 'shows the pressure', say: 'A small circle with a pointer inside is a pressure gauge. It shows the pressure.' },
  ];
  const BY = {};
  SHELF.forEach((p, j) => { p.j = j; BY[p.k] = p; });
  const CARDS = ['filter', 'gauge', 'tank', 'acc', 'cooler', 'cyl'];
  const home = (k) => { const j = BY[k].j; return [57 + 113 * (j % 3), 40 + 78 * Math.floor(j / 3)]; };
  const cardBox = (m) => ({ x: 4 + 168 * (m % 2), y: 176 + 66 * Math.floor(m / 2), w: 164, h: 60 });
  const slotOf = (k) => { const c = cardBox(CARDS.indexOf(k)); return [c.x + 26, c.y + 30]; };
  // A drop: a symbol on its own card sticks; on any other card it does not.
  function drop(st, k, card) {
    if (st.matched[k]) return false;
    if (card === k) { st.matched[k] = true; st.last = k; st.wrong = false; return true; }
    st.wrong = true;
    return false;
  }
  const nMatched = (st) => SHELF.filter((p) => st.matched[p.k]).length;

  const DOE = 'https://www.online-pdh.com/file.php/221/CFD_SG.pdf';
  const BOSCH = 'https://dc-mkt-prod.cloud.bosch.tech/xrm/media/global/training_1/digital_media/reference_books/knowledge-in-detail-hydraulics-basic-principles.pdf';

  // ---------- the lesson: SHOW steps demonstrate, DO steps are puzzles ----------
  const KIT_SW = ['tri', 'fill', 'arrow', 'turn'];
  const STEPS = [
    { id: 'still', name: 'Still there?', kind: 'typed', view: 'jack', field: 'jack', unit: 'N', label: 'Load',
      task: "A jack's small piston has an area of " + JACK.a1 + ' cm². Its big piston has an area of ' + JACK.a2 + ' cm². You push the small one down with ' + JACK.push + ' N. What load can the big one hold up?',
      answer: JACK.load,
      slips: [{ value: JACK.flip, hint: 'That is the areas upside down. The big piston feels the bigger force.' },
        { value: JACK.push, hint: 'The pressure is the same on both pistons. The force is pressure times area, so the big one gets more.' },
        { value: JACK.ratio, hint: "That is the areas' ratio. Multiply your push by it." }],
      hint: "Find the oil's pressure from the small piston, then use it on the big one.",
      want: JACK.load + ' N', bridge: "The jack's small piston is a simple pump. The symbol now in its place is how a drawing marks a pump.",
      rightFb: "Still there. The jack's small piston is a simple pump. The symbol now in its place is how a drawing marks a pump.",
      why: JACK.push + ' N on ' + JACK.a1 + ' cm² makes ' + JACK.p + ' N on every square centimetre. The oil carries that pressure to all ' + JACK.a2 + ' cm² of the big piston. So the big piston holds up ' + JACK.load + ' N.',
      after: (st) => { st.swap = 1.2; } },
    { id: 'marks', name: 'Built from marks', show: true, view: 'kit', sw: KIT_SW,
      text: 'A fluid power symbol is built from a few marks. Each mark means one thing. A large circle is usually a machine that turns. A solid triangle is oil, pointing the way it flows. Oil flowing out of the circle makes it a pump.',
      read: 'A fluid power symbol is built from a few marks. Each mark means one thing. A large circle is usually a machine that turns. A solid triangle is oil, pointing the way it flows. Oil flowing out of the circle makes it a pump. Here a circle and a solid triangle pointing out of it are named Hydraulic pump, fixed.',
      demo: (st) => { st.sweep = 0.2; st.join = 2.3; } },
    { id: 'flip', name: 'Flip it', kind: 'pick', view: 'kit', sw: KIT_SW, init: { tri: 1 }, hideName: true,
      task: 'The triangle now points into the circle. What is the part?',
      opts: ['Hydraulic pump', 'Hydraulic motor', 'Air motor'], want: 'Hydraulic motor',
      hint: 'The triangle shows the way the oil goes. Here it flows into the circle.',
      hints: { 'Hydraulic pump': 'The triangle shows the way the oil goes. Here it flows into the circle.', 'Air motor': 'The triangle is solid, so this part runs on oil.' },
      why: "Oil flowing in turns the shaft, so the part is a motor. In a pump the triangle's point touches the circle. In a motor its flat side does.",
      after: (st) => { st.p.tri.push([0.3, 0], [1.5, 1]); } },
    { id: 'air', name: 'Empty means air', show: true, view: 'kit', sw: KIT_SW,
      text: 'An empty triangle means air instead of oil. Pointing out, it makes a *compressor*. Pointing in, it makes an air motor. Tap Empty.',
      read: 'An empty triangle means air instead of oil. Pointing out, it makes a *compressor*. Pointing in, it makes an air motor. Here the triangle is empty and points out, so the part is named Air compressor, fixed.',
      stillSet: (st) => { st.p.fill = [[-1, 1]]; } },
    { id: 'count', name: 'Count the air', kind: 'typed', view: 'row5', field: 'air', unit: 'parts',
      task: 'How many of these five parts run on air?',
      answer: AIR,
      slips: [{ value: OUTS, hint: 'Pointing out means a pump. The fill tells oil from air, so count the empty triangles.' },
        { value: COMP, hint: 'The air motor counts too. Its empty triangle points in.' }],
      hint: 'Only an empty triangle means air. Count those.',
      want: AIR + ' parts',
      why: 'The air motor and the compressor have empty triangles. The other three have solid ones, so they run on oil.',
      after: (st) => { st.rings = ROW5.map((s, j) => j).filter((j) => ROW5[j].fill).map((j, n) => [j, 0.2 + 0.3 * n]); } },
    { id: 'arrow', name: 'The adjusting arrow', show: true, view: 'kit', sw: KIT_SW,
      text: 'A slanted arrow across a part means it can be adjusted. Across a pump, it means the volume each turn delivers can be changed. Tap On.',
      read: 'A slanted arrow across a part means it can be adjusted. Across a pump, it means the volume each turn delivers can be changed. Here the arrow is drawn across the circle, and the part is named Hydraulic pump, variable.',
      stillSet: (st) => { st.p.arrow = [[-1, 1]]; } },
    { id: 'build', name: 'Build one', kind: 'pick', view: 'kit', sw: KIT_SW,
      task: 'Which marks make an air motor you can adjust?',
      opts: ['Circle, empty triangle in, slanted arrow', 'Circle, solid triangle in, slanted arrow', 'Circle, empty triangle out, slanted arrow'],
      want: 'Circle, empty triangle in, slanted arrow',
      hint: 'A solid triangle means oil. Air is drawn empty.',
      hints: { 'Circle, solid triangle in, slanted arrow': 'A solid triangle means oil. Air is drawn empty.', 'Circle, empty triangle out, slanted arrow': "Pointing out makes a compressor. A motor's triangle points in." },
      why: "Air is the empty triangle. A motor's triangle points in. The arrow makes it adjustable.",
      after: (st) => { st.p.tri.push([0.2, 1]); st.p.fill.push([0.9, 1]); st.p.arrow.push([1.6, 1]); } },
    { id: 'same', name: 'Same symbol, any build', show: true, view: 'kit', sw: ['cut', 'turn'], init: { cut: 1 },
      text: 'The symbol says what a part does, not how it is built. A gear pump and a piston pump are nothing alike inside. If each delivers a fixed volume each turn, both take this one symbol. Switch the cutaway between Gear and Piston.',
      read: "The symbol says what a part does, not how it is built. A gear pump and a piston pump are nothing alike inside. If each delivers a fixed volume each turn, both take this one symbol. Here a gear pump's cutaway and a piston pump's sit side by side, both above the same hydraulic pump symbol.",
      demo: (st) => { st.spinT = 0.3; },
      stillSet: (st) => { st.p.cut = [[-1, 3]]; st.spinT = null; } },
    { id: 'tells', name: 'What it tells you', kind: 'pick', view: 'lone', sw: ['cut'], hideName: true,
      task: 'What does this symbol tell you about the real pump?',
      opts: ['It is a gear pump', 'It pumps oil, a fixed volume each turn', 'Its outlet is on its top'],
      want: 'It pumps oil, a fixed volume each turn',
      hint: 'A gear pump and a piston pump take the same symbol.',
      hints: { 'It is a gear pump': 'A gear pump and a piston pump take the same symbol.', 'Its outlet is on its top': 'A symbol shows what is joined, not where the ports sit on the part.' },
      why: 'The solid triangle pointing out makes it a hydraulic pump. No arrow means fixed. How it is built and where its ports sit come from the part or its data sheet.',
      after: (st) => { st.p.cut.push([0.1, 1], [0.9, 3]); } },
    { id: 'shelf', name: 'The rest of the kit', show: true, view: 'shelf',
      text: 'Other parts use the same marks. A diamond treats the fluid. A dashed line across it makes a filter. Arrowheads pointing out of it make a cooler. A box with a piston and rod is a cylinder. An open-topped box is the tank. An upright capsule stores oil under pressure. A small circle with a pointer inside is a gauge. Drag each symbol onto what it does.',
      read: 'Other parts use the same marks. A diamond treats the fluid. A dashed line across it makes a filter. Arrowheads pointing out of it make a cooler. A box with a piston and rod is a cylinder. An open-topped box is the tank. An upright capsule stores oil under pressure. A small circle with a pointer inside is a gauge. Here the six finished symbols are each matched to their card: tank, cylinder, filter, cooler, accumulator and pressure gauge.',
      demo: (st) => { st.matched.tank = true; st.last = 'tank'; st.moves = [{ k: 'tank', from: home('tank'), t0: 0.6, dur: 1.0 }]; },
      stillSet: (st) => { SHELF.forEach((p) => { st.matched[p.k] = true; }); st.moves = []; st.last = null; } },
    { id: 'side', name: 'Turned on its side', kind: 'pick', view: 'pair', sw: ['turn'],
      task: 'These two symbols sit on one sheet. What are they?',
      opts: ['Two filters', 'A filter and a cooler', 'Two different parts, as they face different ways'], want: 'Two filters',
      hint: 'Turning a symbol does not change what it is. Look at the marks inside.',
      hints: { 'A filter and a cooler': "A cooler's diamond has arrowheads pointing out. Both of these have a dashed line across.", 'Two different parts, as they face different ways': 'Turning a symbol does not change what it is. Look at the marks inside.' },
      why: 'Both are diamonds with a dashed line across, so both are filters. Most symbols mean the same however they are turned on the sheet. A tank and the lines into it are the exception, and stay as drawn.',
      after: (st) => { st.p.rot2.push([0.3, fin(st, 'rot2') + 1]); } },
    { id: 'unit', name: 'Read the power unit', kind: 'pick', view: 'unit',
      task: 'What is the circle the electric motor drives?',
      opts: ['A fixed hydraulic pump', 'A variable hydraulic pump', 'A variable air compressor', 'A variable hydraulic motor'], want: 'A variable hydraulic pump',
      hint: 'Look across the circle. The slanted arrow means it can be adjusted.',
      hints: { 'A fixed hydraulic pump': 'Look across the circle. The slanted arrow means it can be adjusted.', 'A variable air compressor': 'The triangle is solid, so it pumps oil.', 'A variable hydraulic motor': 'The triangle points out. Oil leaves this circle.' },
      why: 'Solid means oil, and out means it pumps. The arrow makes it adjustable. So the electric motor drives a variable hydraulic pump. The small circle on the line out is a gauge. Its pointer stays inside it, while the adjusting arrow crosses the whole pump.',
      after: (st) => { st.lights = [0.2, 0.8, 1.4]; } },
    { id: 'pumps', name: 'Count the pumps', kind: 'typed', view: 'sheet', field: 'pumps', unit: 'pumps',
      task: 'How many of the circles on this sheet are pumps?',
      answer: PUMPS,
      slips: [{ value: SLIP13[0], hint: 'The pump turned on its side still counts. Turning a symbol does not change it.' },
        { value: SLIP13[1], hint: "One of your three is not a pump. The circle with M moves no oil. A motor's triangle points in." },
        { value: SLIP13[2], hint: 'Only a circle with a triangle pointing out is a pump. The small circle is a gauge. Its pointer stays inside it, and it has no triangle.' },
        { value: SLIP13[3], hint: 'The circle with M is an electric motor. The gauge has no triangle at all.' }],
      hint: 'Count only the circles with a triangle pointing out.',
      want: PUMPS + ' pumps',
      why: "The upright pump and the pump on its side have triangles pointing out. The hydraulic motor's points in. The electric motor and the gauge have none. So " + PUMPS + ' are pumps.',
      after: (st) => { st.rings = SHEET.map((c, j) => j).filter((j) => isPump(SHEET[j])).map((j, n) => [j, 0.2 + 0.3 * n]); } },
  ];
  const I = {};
  STEPS.forEach((d, i) => { I[d.id] = i; });

      b.el.setAttribute('aria-pressed', st.pick === opts[k] ? 'true' : 'false');
    });
    Object.keys(BOX).forEach((k) => { BOX[k].hidden = +k !== i; });
    el('ansbox').hidden = d.kind !== 'typed';

    el('acts').hidden = !!d.show;
    checkBtn.el.hidden = right;
    const fb = el('fb');
    fb.hidden = !!d.show;
    let f = '';
    if (!d.show) f = d.kind === 'typed' ? st.fbText : right ? (d.rightFb || "That's it.") : st.res === 'wrong' ? ((d.hints && d.hints[st.pick]) || d.hint) : st.res === 'empty' ? 'Tap one of the answers.' : '';
    fb.className = 'fb' + (right && !st.shown ? ' right' : '');
    write(fb, f);
    const why = el('why');
    why.hidden = !!d.show || !st.why;
    write(why, d.show ? '' : d.why);
    whyBtn.setLabel(st.why ? 'Hide why' : 'Why?');

    backBtn.el.hidden = i === 0 && !finished;
    nextBtn.el.hidden = finished || (!d.show && !right);
    nextBtn.setLabel(i === STEPS.length - 1 ? 'Finish' : 'Continue');
    el('nav').hidden = backBtn.el.hidden && nextBtn.el.hidden;
    paint();
  });

  // ---------- known answers, worked out by hand ----------
  K.check('Three switches, each set one of two ways, give 8 different names, from Hydraulic pump, fixed to Air motor, variable', () =>
    ALL.length === 8 && new Set(ALL.map(nameOf)).size === 8 && nameOf(ALL[0]) === 'Hydraulic pump, fixed' && nameOf(ALL[7]) === 'Air motor, variable');
  K.check('Out and solid is a hydraulic pump, in and solid a hydraulic motor, out and empty an air compressor, in and empty an air motor, and the arrow only turns fixed into variable', () =>
    PART(0, 0) === 'Hydraulic pump' && PART(1, 0) === 'Hydraulic motor' && PART(0, 1) === 'Air compressor' && PART(1, 1) === 'Air motor' &&
    ALL.every((k) => nameOf(k) === PART(k.tri, k.fill) + (k.arrow ? ', variable' : ', fixed')));
  K.check('The point of the triangle touches the circle in a pump, and its tail touches the circle in a motor', () => {
    const R = 34, d = (q) => Math.hypot(q[0], q[1]), o = triPts(R, 0), n = triPts(R, 1);
    return K.near(d(o[0]), R, 1e-6) && d(o[1]) < R - 1 && d(o[2]) < R - 1 && K.near(o[0][1], -R, 1e-6) &&
      K.near(d(n[1]), R, 1e-6) && K.near(d(n[2]), R, 1e-6) && d(n[0]) < R - 1 && n[0][1] > n[1][1];
  }, { source: DOE });
  K.check('The symbol carries no design structure: beside a gear cutaway, a piston cutaway or both, the pump is drawn the same and keeps the same name', () => {
    const sig = (c) => { const st = fresh(I.same); st.p.cut = [[-1, c]]; const keep = T; T = Infinity; const s = JSON.stringify(kitOpts(st)) + nameOf(finK(st)); T = keep; return s; };
    return sig(1) === sig(2) && sig(2) === sig(3) && sig(1).indexOf('Hydraulic pump, fixed') > 0;
  }, { source: BOSCH });
  K.check('Each quarter-turn leaves the name the same, and four turns bring the symbol back as it started', () => {
    const st = fresh(I.marks), n0 = nameOf(finK(st));
    let same = true;
    for (let j = 0; j < 4; j++) { st.p.rot.push([0, fin(st, 'rot') + 1]); same = same && nameOf(finK(st)) === n0; }
    return same && (90 * fin(st, 'rot')) % 360 === 0;
  });
  K.check('Worked by hand: the jack holds up 2000 N (slips 5, 100 and 20), 2 of the 5 parts run on air (slips 3 and 1), and 2 of the 5 circles are pumps (slips 1, 3, 4 and 5); the typed fields ask exactly these', () => {
    const a = STEPS[I.still], b = STEPS[I.count], c = STEPS[I.pumps], sl = (d) => d.slips.map((x) => x.value).join();
    return JACK.p === 10 && a.answer === 2000 && sl(a) === '5,100,20' && b.answer === 2 && sl(b) === '3,1' && c.answer === 2 && sl(c) === '1,3,4,5' &&
      ANS[I.still].spec.answer === 2000 && ANS[I.count].spec.answer === 2 && ANS[I.pumps].spec.answer === 2 &&
      a.want === '2000 N' && b.want === '2 parts' && c.want === '2 pumps';
  });
  K.check('Six symbols and six cards: each symbol sticks only on its own card, and all six can be matched', () => {
    const st = fresh(I.shelf), st2 = fresh(I.shelf);
    st.matched = {}; st2.matched = {};
    const wrongSticks = drop(st2, 'tank', 'filter') || drop(st2, 'filter', 'cooler');
    SHELF.forEach((p) => drop(st, p.k, p.k));
    return CARDS.length === 6 && new Set(CARDS).size === 6 && CARDS.every((k) => !!BY[k]) && !wrongSticks && nMatched(st2) === 0 && nMatched(st) === 6;
  });
  K.check('Before an answer nothing gives it away: puzzles open with no switches, no rings and no lit marks, the jack shows no load, and the two naming puzzles show the name as ?', () =>
    DO.every((i) => { const d = STEPS[i], st = fresh(i); return !swOnFor(d, st) && !st.rings.length && !st.lights.length && st.swap == null && (!d.hideName || nameText(d, st) === '?'); }) &&
    fin(fresh(I.tells), 'cut') === 0 && fin(fresh(I.side), 'rot2') % 2 === 1);
  K.check("Every demonstration settles within 4.5 s of its screen opening, and every answer's motion within 3 s", () =>
    STEPS.every((d, i) => { const st = fresh(i); if (d.show) return d.dur <= 4.5 && (!d.demo || animEnd(st) <= d.dur); d.after(st); return animEnd(st) <= 3; }));

  K.ready();
