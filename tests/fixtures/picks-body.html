<p class="lead">A small steps lesson for the tests: picked answers named in each of the ways the built lessons name them.</p>
<style>
  .fr { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; line-height: 1.1; }
  .fr .n { border-bottom: 1.5px solid currentColor; padding: 0 2px; }
  .mx .w { margin-right: 2px; }
</style>
<div id="prog"></div>
<p class="task" id="task"></p>
<div class="row" id="picks"></div>
<div class="row" id="acts"></div>
<p class="say" id="fb" aria-live="polite"></p>
<script>
  // A DO step names its right answer as the lessons do: `want` an index into `opts` (linear systems
  // 4-5), `ok` an index (complex numbers), `want` the option's words drawn as stacked fractions
  // (fractions 4, 7, 8), `want` a number that is one of the options, and `want` an order (fractions 4).
  const STEPS = [
    { name: 'By its place', kind: 'pair', task: 'Which pair fits both receipts?', opts: [[2, 2.5], [2.5, 1.5], [1.5, 2.5]], want: 1, why: 'Only 2.50 and 1.50 fit both.' },
    { name: 'By ok', task: 'Which number does the arrow show?', opts: ['3 + j2', '2 − j3', '3 − j2'], ok: 2, why: '3 across and 2 down.' },
    { name: 'Stacked', task: 'Which is bigger, 10/16 or 5/8?', opts: ['10/16', '5/8', 'Equal'], want: 'Equal', why: '10/16 is 5/8 doubled top and bottom.' },
    { name: 'Mixed', task: 'How many 3/4 m tails come from 4 1/2 m?', opts: ['6', '5 1/3', '3 3/8'], want: '5 1/3', why: 'Not really; a test of a mixed number.' },
    { name: 'A number', task: 'How many halves make one?', opts: [1, 2, 3], want: 2, why: 'Two halves make a whole.' },
    { name: 'In order', kind: 'order', task: 'Put these in order, smallest first.', opts: ['2/3', '5/8', '3/4'], want: ['5/8', '2/3', '3/4'], why: '0.625, 0.666… and 0.75.' },
  ];
  const S = STEPS.map(() => ({ pick: null, res: null }));
  const at = () => stepper.get();
  const money = (v) => '£' + (Number.isInteger(v) ? v : v.toFixed(2));
  const labelOf = (d, k) => (d.kind === 'pair' ? 'd = ' + money(d.opts[k][0]) + ', p = ' + money(d.opts[k][1]) : String(d.opts[k]));
  const rightOf = (d, k) => (Number.isInteger(d.ok) ? k === d.ok : d.kind === 'pair' ? k === d.want : String(d.opts[k]) === String(d.want));
  // A fraction drawn stacked, as the fractions lessons draw it: two spans and a bar, no "/".
  function frac(t, b) { return K.el('span', { class: 'fr', role: 'img', 'aria-label': t + '/' + b }, K.el('span', { class: 'n', 'aria-hidden': 'true' }, t), K.el('span', { class: 'd', 'aria-hidden': 'true' }, b)); }
  function pieces(el, text) {
    el.textContent = '';
    const re = /(\d+) (\d+)\/(\d+)|(\d+)\/(\d+)/g;
    let a0 = 0, m;
    while ((m = re.exec(text))) {
      if (m.index > a0) el.appendChild(document.createTextNode(text.slice(a0, m.index)));
      el.appendChild(m[1] ? K.el('span', { class: 'mx', role: 'img', 'aria-label': m[1] + ' and ' + m[2] + '/' + m[3] }, K.el('span', { class: 'w', 'aria-hidden': 'true' }, m[1]), frac(m[2], m[3])) : frac(m[4], m[5]));
      a0 = m.index + m[0].length;
    }
    if (a0 < text.length) el.appendChild(document.createTextNode(text.slice(a0)));
  }
  const stepper = K.stepper({ id: 'step', label: 'Step', steps: STEPS.map((d) => d.name), value: 0, compact: true, into: '#prog' });
  const picks = [0, 1, 2].map((k) => K.button({ label: 'Answer ' + (k + 1), secondary: true, into: '#picks', press: () => { const st = S[at()]; if (st.res !== 'right') { st.pick = k; st.res = null; } } }));
  K.button({ label: 'Check', into: '#acts', press: () => { const i = at(), st = S[i]; if (st.pick != null) st.res = rightOf(STEPS[i], st.pick) ? 'right' : 'wrong'; } });
  K.update((p) => {
    const i = p.step, d = STEPS[i], st = S[i];
    pieces(K.$('#task'), d.task);
    picks.forEach((b, k) => {
      b.el.hidden = k >= d.opts.length;
      if (k >= d.opts.length) return;
      pieces(b.el, labelOf(d, k));
      b.el.setAttribute('aria-pressed', st.pick === k ? 'true' : 'false');
    });
    K.$('#fb').textContent = st.res === 'right' ? 'That\'s it.' : st.res === 'wrong' ? 'Not quite.' : '';
  });
  K.check('Each step names one right answer', () => STEPS.every((d) => d.opts.filter((o, k) => rightOf(d, k)).length === (d.kind === 'order' ? 0 : 1)));
  K.ready();
</script>
